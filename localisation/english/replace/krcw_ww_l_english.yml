l_english:
# krcw: years paced
 FRA_krcw_de_gaulle:0 "Charles de Gaulle"
 FRA_krcw_de_gaulle_desc:0 "The National France general has spent twenty years in Algiers waiting for the Commune to fall. Moscow does not like him, but has no other name the French will obey."
 ENG_krcw_edward_viii:0 "Edward VIII"
 ENG_krcw_edward_viii_desc:0 "The king who went into Canadian exile with the court after the revolution of 1925. The Accord returns him to Buckingham Palace on condition that the government is made up of men it approves."
 CHI_krcw_zhang_xueliang:0 "Zhang Xueliang"
 CHI_krcw_zhang_xueliang_desc:0 "The old master of the Fengtian clique, long abroad since the Kuomintang unified China. The Accord needs a Chinese government that is not the Kuomintang, and he is one of the few with old followers to call on."
 SOV_krcw_shlyapnikov:0 "Alexander Shlyapnikov"
 SOV_krcw_shlyapnikov_desc:0 "The old leader of the Workers' Opposition, who spent the years after the civil war abroad working for the Russian unions. The Internationale needs a Russian to sign the armistice, and he has the highest standing among the unions."
 krcw_ww_total_mobilisation:0 "Total Mobilisation"
 krcw_ww_total_mobilisation_desc:0 "Reserves are called up in waves, factories turn to war production and civilian consumption gives way to the front."
 krcw_ww_cat:0 "General War"
 krcw_ww_cat_desc:0 "Both blocs have rebuilt their industry and their armies. The Cold War can stay cold, or end at a moment of our choosing."
 krcw_ww_war_plan:0 "Approve the General War Plan"
 krcw_ww_war_plan_desc:0 "The general staff wrote the plan long ago; it only lacks a signature. Mobilisation cannot be hidden, and the other side will know."
 krcw_ww_ultimatum:0 "Issue the Ultimatum"
 krcw_ww_ultimatum_desc:0 "Demand that the rival dissolve its bloc and withdraw from the contested lands. It may yield or refuse, and refusal means war."
 krcw_ww_1_t:0 "The Other Side Mobilises"
 krcw_ww_1_d:0 "Reservists are recalled, the railway timetables have turned into troop trains and the border garrisons are growing. The other side has not declared war, but it has stopped hiding it."
 krcw_ww.1.a:0 "We mobilise too"
 krcw_ww.1.b:0 "Stay calm and do not answer"
 krcw_ww_2_t:0 "The Ultimatum"
 krcw_ww_2_d:0 "The other side demands that we dissolve our bloc and withdraw from the contested lands, with a deadline for our answer. Yielding avoids war, but no one in the bloc will forget it."
 krcw_ww.2.a:0 "Yield"
 krcw_ww.2.b:0 "Refuse"
 krcw_ww_3_t:0 "The World War"
 krcw_ww_3_d:0 "The Third Internationale and the Moscow Accord are formally at war, and the members of both blocs have declared war one after another. The last world war ended less than twenty years ago."
 krcw_ww.3.a:0 "The war has begun"
 krcw_ww_asia_cat:0 "Old Accounts in East Asia"
 krcw_ww_asia_cat_desc:0 "The Qingdao armistice was only a ceasefire. Taiwan is still Japanese, Outer Manchuria and Mongolia are Russian, and Tokyo has not forgotten Korea."
 krcw_ww_retake_taiwan:0 "Cross the Strait to Retake Taiwan"
 krcw_ww_retake_taiwan_desc:0 "The navy can now carry troops across the strait. War with Japan means Tokyo will call on Moscow."
 krcw_ww_demand_north:0 "Demand Outer Manchuria and Outer Mongolia"
 krcw_ww_demand_north_desc:0 "Demand that Russia return the lands taken by the treaties of Aigun and Peking and give up its hold on Mongolia. If Russia refuses, there is war."
 krcw_ww_march_north:0 "Northward: Retake Korea"
 krcw_ww_march_north_desc:0 "Korea, lost in 1944, is the army's unfinished business. An attack on the Korean Republic will bring Nanjing in."
 krcw_ww_41_t:0 "Chinese Troops Cross the Strait"
 krcw_ww_41_d:0 "Nanjing has declared war on us, and its target is Taiwan. The garrison can hold for a while; whether the island is kept depends on whether Moscow acts."
 krcw_ww.41.a:0 "Hold Taiwan"
 krcw_ww_42_t:0 "Japan Asks for Help"
 krcw_ww_42_d:0 "China is at war with Japan and Tokyo asks the Accord for troops. Japan is not a member, but if it falls only the Internationale's fleets will remain in the Pacific."
 krcw_ww.42.a:0 "Enter the war with the whole bloc"
 krcw_ww.42.b:0 "Arms and advisers only"
 krcw_ww_43_t:0 "Nanjing's Territorial Demand"
 krcw_ww_43_d:0 "China demands the lands north of the Amur and east of the Ussuri, and that we give up our hold on Mongolia. Nanjing says refusal means war."
 krcw_ww.43.a:0 "Yield"
 krcw_ww.43.b:0 "Refuse"
 krcw_ww_44_t:0 "Japan Invades Korea"
 krcw_ww_44_d:0 "Japanese troops have landed at Busan and Incheon, and the Korean Republic asks Nanjing for troops. Under the 1944 agreement China is Korea's guarantor."
 krcw_ww.44.a:0 "Send the army into Korea"
 krcw_ww.44.b:0 "Send arms only"
 krcw_ww_45_t:0 "China and Russia at War"
 krcw_ww_45_d:0 "China and Russia are at war on the Amur, and Nanjing asks the Internationale to honour its obligations. If the Internationale enters, the war will open on the Elbe and the Mississippi at the same time."
 krcw_ww.45.a:0 "Enter the war with the whole bloc"
 krcw_ww.45.b:0 "Arms and advisers only"
 krcw_ww_party_sov:0 "Workers' Opposition"
 krcw_ww_party_sov_long:0 "All-Russian Workers' Opposition"
 krcw_ww_20_t:0 "An Accord Country Surrenders"
 krcw_ww_20_d:0 "[krcw_ww_loser.GetNameDefCap] has surrendered. The Internationale must decide what government to set up there and which side it will stand on from now on."
 krcw_ww.20.a:0 "Back Shlyapnikov's Russian Workers' Republic"
 krcw_ww.20.b:0 "Reunite America under the Syndicates"
 krcw_ww.20.c:0 "Unite Germany under the West"
 krcw_ww.20.d:0 "Military administration and a syndicalist government"
 krcw_ww_party_fra:0 "Rally of the French People"
 krcw_ww_party_fra_long:0 "Rally of the French People"
 krcw_ww_party_eng:0 "The King's Government"
 krcw_ww_party_eng_long:0 "His Majesty's Government"
 krcw_ww_party_chi:0 "Peking Government"
 krcw_ww_party_chi_long:0 "Peking Government of the Republic of China"
 krcw_ww_21_t:0 "An Internationale Country Surrenders"
 krcw_ww_21_d:0 "[krcw_ww_loser.GetNameDefCap] has surrendered. The Accord must decide whom to install there and what is left of the old order."
 krcw_ww.21.a:0 "Ask de Gaulle to form a provisional government"
 krcw_ww.21.b:0 "Bring Edward VIII home to the throne"
 krcw_ww.21.c:0 "Install Zhang Xueliang's Peking government"
 krcw_ww.21.d:0 "Reunite America under Washington"
 krcw_ww.21.e:0 "Unite Germany under the East"
 krcw_ww.21.f:0 "Military administration and a national government"
 krcw_ww_30_t:0 "Russia Surrenders"
 krcw_ww_30_d:0 "The Supreme Ruler's government has accepted the armistice terms. The Moscow Accord has lost its leader, and the remaining members must decide for themselves whether to fight on."
 krcw_ww.30.a:0 "The Accord's war is over"
 krcw_ww_31_t:0 "France Surrenders"
 krcw_ww_31_d:0 "The Commune government in Paris has accepted the armistice terms. The Third Internationale has lost its centre, and the other sections must decide for themselves whether to fight on."
 krcw_ww.31.a:0 "The Internationale's war is over"
 krcw_ww_32_t:0 "A Nation Reunited"
 krcw_ww_32_d:0 "The defeated half has been absorbed into the victorious one. The division has ended by occupation."
 krcw_ww.32.a:0 "Unity"
 SOV_trotskyism:0 "Russian Workers' Republic"
 SOV_trotskyism_DEF:0 "the Russian Workers' Republic"
 SOV_trotskyism_ADJ:0 "Russian"
