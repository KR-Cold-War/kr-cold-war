l_english:
# krcw: years paced
 international_status:0 "Standing in the Ceasefire Regime"
 international_status_desc:0 "There is no United Nations in this world; a country's standing depends on its place in the three ceasefire agreements."
 UN_Security_Council_Member_Perm:0 "Ceasefire Signatory"
 UN_Security_Council_Member_Perm_desc:0 "A party to the Elbe ceasefire of 1944, the Qingdao armistice or the St. Louis armistice of 1946. It sits on a ceasefire commission and can file evidence and propose confidence-building measures."
 un_member:0 "Newly Independent State"
 un_member_desc:0 "A state that became independent after the ceasefires and is party to none of them."
 semi_recognized_state:0 "Ordinary State"
 semi_recognized_state_desc:0 "A state that is party to none of the ceasefire agreements."
 unrecognized_state:0 "Belligerent Movement"
 unrecognized_state_desc:0 "A rebel government in a civil war, recognised by few."
 krcw_ceasefire_guarantor:0 "Neutral Guarantor"
 krcw_ceasefire_guarantor_desc:0 "A neutral that stayed out of the war of 1937-44 and chairs the three ceasefire commissions. It can mediate between sessions and send out investigators."
