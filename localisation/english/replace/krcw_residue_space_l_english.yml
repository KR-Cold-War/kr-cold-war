 Space_News_Global_Manned_Mars_Landing_Title_SOV:0 "[GetNewspaperHeader]Russia Lands Humans on Mars"
 Space_News_Global_Manned_Mars_Landing_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap] has achieved the world's first crewed landing on Mars, placing human beings on the surface of another planet for the first time. Officials confirmed that the spacecraft survived its interplanetary journey, completed its descent, landed safely, and began surface operations on the Red Planet. The achievement marks one of the greatest turning points in the space age, proving that people can travel beyond the Moon, reach another planet, and work directly on its surface. Scientists have described the mission as a triumph of propulsion, life support, radiation protection, descent control, surface systems, and human endurance. Newspapers around the world have called the landing a defining moment in exploration. Foreign governments are studying the mission closely, as the first human presence on Mars carries enormous scientific, political, and strategic significance. In Moscow, [Space_TAG_Subject.GetLeader]'s government credited the achievement to Russia's engineers and to the whole nation."
