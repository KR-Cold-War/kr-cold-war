 Space_News_Global_Interplanetary_Probe_Title_SOV:0 "[GetNewspaperHeader]Russia Completes the First Interplanetary Probe Mission"
 Space_News_Global_Interplanetary_Probe_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap] has launched the world's first dedicated interplanetary probe, sending a spacecraft on a long-duration mission beyond Earth's immediate neighborhood. Officials confirmed that the probe has departed its initial trajectory, maintained communications with ground stations, and begun returning data from deep space. Unlike missions aimed at a single nearby target, this spacecraft is intended to study the wider environment between planets, including radiation, solar activity, magnetic fields, dust, and the difficulties of navigation across immense distances. Scientists expect the mission to provide valuable experience for future exploration deeper into the solar system. Newspapers around the world have described the achievement as a new stage in space exploration. Foreign governments are studying the mission closely, as interplanetary operations carry scientific, political, and strategic significance. Spaceflight is becoming a sustained presence beyond Earth. In Moscow, [Space_TAG_Subject.GetLeader]'s government credited the achievement to Russia's engineers and to the whole nation."
