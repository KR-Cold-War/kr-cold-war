 Space_News_Global_Orbital_Telescope_Title_SOV:0 "[GetNewspaperHeader]Russia Deploys the First Orbital Telescope"
 Space_News_Global_Orbital_Telescope_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap] has launched the world's first orbital telescope, placing a scientific observatory above the atmosphere for the first time. Officials confirmed that the spacecraft reached its planned orbit, established communications with ground stations, and has begun initial observations. By operating beyond atmospheric distortion, the telescope is expected to provide clearer views of planets, stars, nebulae, and distant galaxies than ground-based instruments can achieve. Scientists expect the mission to advance astronomy, optics, spacecraft stabilization, electronics, and long-duration orbital operations. Newspapers around the world have described the launch as a turning point in the peaceful use of space for scientific discovery. Foreign governments are studying the achievement closely, as orbital observation may also carry implications for Earth imaging, reconnaissance, and strategic planning. Space has become a platform for looking deeper into the universe. In Moscow, [Space_TAG_Subject.GetLeader]'s government credited the achievement to Russia's engineers and to the whole nation."
