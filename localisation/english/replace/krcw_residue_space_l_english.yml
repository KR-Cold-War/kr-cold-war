 Space_News_Global_Lunar_Flyby_Title_SOV:0 "[GetNewspaperHeader]Russia Completes the First Lunar Flyby"
 Space_News_Global_Lunar_Flyby_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap] has completed the world's first lunar flyby, sending a spacecraft beyond Earth orbit and past the Moon. Officials confirmed that the probe followed its planned trajectory, survived the journey through deep space, and transmitted observations during its passage near the lunar surface. The mission marks a decisive advance in the space age, proving that spacecraft can travel beyond Earth orbit and operate near another celestial body. Newspapers around the world have described the achievement as a turning point in the race to reach the Moon. Foreign governments are expected to study the flight closely, as lunar missions require powerful rockets, precision guidance, and long-range communications networks. Officials have emphasized peaceful scientific exploration, but the wider political meaning is clear. The Moon is no longer beyond the reach of human technology. In Moscow, [Space_TAG_Subject.GetLeader]'s government credited the achievement to Russia's engineers and to the whole nation."
