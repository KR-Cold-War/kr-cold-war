l_english:
 air_doctrine_integral_7b_desc:0 "Developed by the Russians, Jet Shturmovik Tactics are a large array of maneuvers and ground support tactics intended to improve the efficiency and lethality of ground support missions."
 air_doctrine_integral_8c_desc:0 "Integrating AirLand combat with combined arms assaults helps ensure that both air and ground units on the offensive are more likely to survive and succeed."
 cw_dprk_1960s_doctrine_desc:0 "Korean doctrine stressed forward deployment, night infiltration and constant pressure along the armistice line."
 cw_dprk_1960s_doctrine_header_desc:0 "\nThe Korean army built its doctrine on hardened positions, massed fires and politically reliable troops. It stresses rapid mobilisation and heavy artillery preparation to set up a decisive breakthrough when war begins."
 cw_dprk_1960s_forward_deployed_infiltration_echelons_desc:0 "\n\n\n\n\n\n\n\nSpecialised infiltration echelons are posted close to the line of contact. They train for night movement and decentralised action to penetrate enemy defences with little warning."
 cw_dprk_1970s_entrenched_forward_assault_culture_desc:0 "\n\n\n\n\n\n\n\nInfantry attacks straight out of fortified belts near the front, relying on pre-positioned supplies and fire support to strike quickly."
 cw_dprk_1970s_rapid_night_assault_doctrine_desc:0 "\n\n\n\nNight becomes the preferred time to move and attack, out of reach of enemy air power and long-range observation. Units close in, assault and break contact before daylight."
 cw_dprk_1980s_doctrine_desc:0 "The Korean army combined special operations, saturation shelling and underground command posts into coordinated offensives."
 cw_dprk_1980s_emergency_mobilization_infrastructure_desc:0 "\n\n\n\n\n\n\n\nFactories, transport networks and civilian organisations are organised for war, so the army can expand and replace its losses quickly even under air attack."
 cw_dprk_1980s_integrated_infiltration_fire_coordination_desc:0 "\n\n\n\n\n\n\n\nInfiltration teams mark targets and pin enemy formations while artillery and rockets strike pre-planned fire zones."
 cw_dprk_1980s_rocket_artillery_saturation_systems_desc:0 "\n\n\n\n\n\n\n\nFrom underground stores and pre-surveyed firing zones, rocket units fire synchronised barrages at enemy concentrations, rear areas and supply lines before the ground battle begins."
 cw_dprk_1990s_deception_and_maskirovka_systems_desc:0 "\n\n\n\nDummy positions, false radio traffic and decoy supply dumps mislead enemy reconnaissance and targeting. Units keep strict radio discipline and vary their routines."
 cw_dprk_1990s_fortified_operational_continuity_desc:0 "\n\n\n\n\n\n\n\nCommand posts, supply hubs and assembly areas are hardened and dispersed so command and operations continue under sustained bombardment."
 cw_france_1980s_selective_nato_interoperability:0 "Selective Allied Interoperability"
 cw_france_1980s_selective_nato_interoperability_desc:0 "\n\n\n\nFrance keeps its communications procedures, logistics standards and tactics compatible with its allies while keeping strategy and command in its own hands."
 cw_ins_1950s_protracted_war_planning_doctrine_desc:0 "\n\n\n\nThe insurgency treats time as its greatest advantage and plans in phases: survive, expand the base areas, become a regular force, and finally seize key ground or power itself."
 cw_maoist_1960s_doctrine_desc:0 "Revolutionary doctrine stressed protracted struggle, encircling the towns from the countryside, mass mobilisation and the gradual erosion of state authority."
 cw_maoist_1960s_mass_line_political_work_desc:0 "\n\n\n\nCadres work in the villages, collect people's grievances and turn them into concrete measures such as land reform, settling disputes and securing food."
 cw_maoist_1960s_revolutionary_continuity_bonds_desc:0 "\n\n\n\n\n\n\n\nPolitical education, guerrilla war and mass participation are bound together to keep the movement loyal and mobilised for the long term."
 cw_maoist_1960s_strategic_defensive_phase_doctrine_desc:0 "\n\n\n\nIn the strategic defensive phase the insurgency is outgunned. It preserves its cadres, widens its popular base and builds strength, fighting only on favourable terms."
 cw_maoist_1970s_consolidated_base_area_administration_desc:0 "\n\n\n\n\n\n\n\nAdministration, logistics and security are set up inside the liberated base areas, turning guerrilla strongholds into a government able to sustain a long war."
 cw_maoist_1980s_advanced_guerrilla_layering_techniques_desc:0 "\n\n\n\n\n\n\n\nLocal militias, mobile units and regional forces work in layers, giving the movement depth and making counter-insurgency harder."
 cw_maoist_1980s_doctrine_desc:0 "Revolutionary forces coordinated militias, mobile units and regional commands to frustrate counter-insurgency operations."
 cw_maoist_1990s_adaptive_survival_governance_desc:0 "\n\n\n\n\n\n\n\nUnder heavy counter-insurgency pressure the movement turns to dispersed, flexible administration. It protects its organisation and popular support first and avoids decisive defeat."
 cw_maoist_1990s_doctrine_desc:0 "Facing harsh repression, revolutionary movements put decentralisation, endurance and political survival ahead of expansion."
 cw_nato_1940s_armored_infantry_coordination_desc:0 "\n\n\n\nAfter the war the allies re-examined how infantry and armour should fight together. Each army had its own wartime habits, and this doctrine merges them into a common drill."
 cw_nato_1940s_coalition_logistics_interoperability_desc:0 "\n\n\n\nMember armies used different vehicles, calibres, fuels and supply procedures. This doctrine sets common standards and maps the key transport infrastructure."
 cw_nato_1940s_doctrine_desc:0 "Postwar coalition doctrine emphasised allied interoperability, rebuilding conventional forces and collective defence planning."
 cw_nato_1940s_doctrine_title:0 "Coalition Combined Arms Foundations"
 cw_nato_1940s_early_atomic_support_integration_desc:0 "\n\n\n\nWith the arrival of atomic weapons, planners studied how to fit them into operational plans without weakening the conventional forces."
 cw_nato_1940s_forward_deterrence_planning_desc:0 "\n\n\n\nTo prevent a strategic surprise, the coalition drew up detailed reinforcement, mobilisation and deployment plans for the central front."
 cw_nato_1940s_integrated_arms_reorganization_desc:0 "\n\n\n\nIn the coalition's first years the main task was to bring armies with different traditions and wartime experience into one framework for collective defence."
 cw_nato_1940s_joint_operational_planning_staffs_desc:0 "\n\n\n\nDrawing on wartime joint headquarters, the coalition standardised planning cycles, terms and staff procedures and set up permanent joint staffs."
 cw_nato_1950s_atomic_battlefield_readiness_desc:0 "\n\n\n\nTroops train and are equipped to fight amid radiation, contamination and wrecked infrastructure."
 cw_nato_1950s_decentralized_command_networks_desc:0 "\n\n\n\nHigher headquarters may be destroyed or cut off by nuclear strikes, so junior commanders get more authority to act on the commander's intent."
 cw_nato_1950s_dispersed_maneuver_formations_desc:0 "\n\n\n\nNuclear weapons make massed forces vulnerable. Units spread over a wider area and concentrate quickly only for decisive action."
 cw_nato_1950s_doctrine_desc:0 "Coalition doctrine combined nuclear deterrence with forward defence and dispersed conventional forces."
 cw_nato_1950s_doctrine_header_desc:0 "\nThe coalition posture of this period rested on nuclear deterrence, dispersed formations and rapid reinforcement. Ground forces are meant to survive the first strike, hold key terrain and buy time for the strategic response."
 cw_nato_1950s_pentomic_battle_group_structure_desc:0 "\n\n\n\nTo survive on a nuclear battlefield the division is split into five battle groups that can disperse and recombine as needed."
 cw_nato_1950s_tactical_nuclear_fire_planning_desc:0 "\n\n\n\nLow-yield nuclear weapons are written into artillery and air support fire plans to block advances, break up concentrations or open the way for manoeuvre."
 cw_nato_1960s_counterinsurgency_adaptation_framework_desc:0 "\n\n\n\nAllied armies drew lessons from counter-insurgency campaigns in Asia, Africa and the Middle East, stressing that political and military measures must work together."
 cw_nato_1960s_doctrine_desc:0 "The coalition stressed escalation control, a balance of conventional forces and coordinated responses at every level of conflict."
 cw_nato_1960s_doctrine_header_desc:0 "\nAll-out nuclear escalation proved too risky, so the coalition moved to a graduated response: stronger conventional readiness, joint air-ground planning and defences that keep escalation in check."
 cw_nato_1960s_expanded_combat_support_networks_desc:0 "\n\n\n\nMobile, dispersed forces need stronger support, so the coalition invested in engineers, communications, medical evacuation and logistics units."
 cw_nato_1960s_flexible_response_doctrine_desc:0 "\n\n\n\nThe assumption of immediate nuclear use in a major war is dropped in favour of conventional defence, controlled escalation and a nuclear option if needed. It requires heavy investment in conventional forces."
 cw_nato_1960s_helicopter_air_mobility_integration_desc:0 "\n\n\n\nReliable transport helicopters let ground forces bypass obstacles, reinforce threatened sectors and evacuate or resupply quickly."
 cw_nato_1960s_road_division_structure_desc:0 "\n\n\n\nBrigades and battalions return as the division's building blocks, replacing the rigid five-group design and letting commanders tailor forces to the mission."
 cw_nato_1960s_transitional_combined_arms_cohesion_desc:0 "\n\n\n\n\n\n\n\nNew technology is joined to established combined-arms principles: armour, infantry, artillery and air support in flexible structures for both conventional and limited wars."
 cw_nato_1970s_active_defense_posture_desc:0 "By the early 1970s coalition planners saw that a static forward defence could not hold against the larger Moscow Accord armies. Active Defense answered with delaying actions, elastic defence and selective counterattacks that break the momentum of the enemy, accepting the temporary loss of ground to keep the army and its command intact."
 cw_nato_1970s_air_land_coordination_framework_desc:0 "The speed and lethality of modern war forced air and ground forces to work as one. Close air support, battlefield interdiction and shared targeting became part of the land battle."
 cw_nato_1970s_airland_battle_preparations_desc:0 "The coalition began to merge deep strikes, manoeuvre forces and defensive action into one operational method, disrupting enemy follow-on forces, supplies and command before they reach the front."
 cw_nato_1970s_doctrine_desc:0 "Coalition doctrine stressed layered defence, controlled counterattacks and attrition to stop enemy breakthroughs."
 cw_nato_1970s_doctrine_header_desc:0 "\nThis stage is about stopping a Moscow Accord thrust with layered fires, prepared positions and tightly held reserves, using battlefield surveillance and coordinated artillery and air support to blunt breakthroughs."
 cw_nato_1970s_integrated_air_defense_support_desc:0 "To meet massed air and missile strikes at the start of a war, radar networks, interceptors, surface-to-air missiles and command centres are linked across national borders."
 cw_nato_1970s_maneuver_warfare_emphasis_desc:0 "Static defence has its limits. Mobile reserves counterattack exposed enemy formations and use terrain to make up for inferior numbers."
 cw_nato_1970s_unified_operational_logistics_backbone_desc:0 "\n\n\n\n\n\n\n\nLogistics is treated as decisive in a long, intense war. Common standards and an interoperable supply system keep multinational forces fighting."
 cw_nato_1980s_deep_attack_integration_desc:0 "Deep attack becomes a core task of the land battle. Reconnaissance, fires and manoeuvre combine to strike the enemy's second echelon and delay its reinforcements."
 cw_nato_1980s_doctrine_desc:0 "Coalition doctrine combined air and ground forces to strike enemy formations throughout the depth of the battlefield."
 cw_nato_1980s_doctrine_header_desc:0 "\nCoalition doctrine of this period aims to defeat the follow-on echelons as well as the first wave. Precision fires, deep interdiction and fast manoeuvre units combine to wreck the enemy's timetable."
 cw_nato_1980s_joint_operational_synchronization_desc:0 "Land and air forces work to a single operational rhythm, with shared planning cycles and priorities, so fires, manoeuvre, air defence and supply come together at the decisive moment."
 cw_nato_1980s_precision_and_maneuver_synergy_desc:0 "\n\n\n\n\n\n\n\nPrecision fires are tied closely to manoeuvre units. Long-range fires and intelligence disrupt the enemy in depth while front-line units keep their freedom of action."
 cw_nato_1980s_rapid_maneuver_brigades_desc:0 "Brigades built for speed and counterstrokes rely on combined-arms teams, decentralised command and close air-ground cooperation to hit exposed flanks and seize key terrain."
 cw_nato_1980s_reconnaissance_strike_coordination_desc:0 "Sensors are linked quickly to fires so artillery and aircraft can hit time-sensitive targets, leaving enemy movement and command posts nowhere to hide."
 cw_nato_1990s_air_mobile_expeditionary_brigades_desc:0 "Rapidly deployable air-mobile brigades move into unstable regions before a crisis escalates, seizing key terrain and protecting vital installations."
 cw_nato_1990s_cjtf_joint_task_force_command_desc:0 "Multinational joint task forces, under one headquarters and common staff procedures, handle crises away from the main front."
 cw_nato_1990s_doctrine_desc:0 "The coalition turned towards joint expeditionary forces, crisis response missions and stabilisation operations."
 cw_nato_1990s_doctrine_header_desc:0 "\nThe coalition turns to crisis response and out-of-area operations, relying on joint task forces, interoperable communications, precision strike and professional logistics."
 cw_nato_1990s_joint_precision_campaigning_desc:0 "Precision strike, air control and ground manoeuvre are combined into one campaign method to isolate enemy forces and control escalation."
 cw_nato_1990s_networked_warfare_continuum_desc:0 "\n\n\n\n\n\n\n\nCommand, intelligence and strike are linked into one network, so allied forces share the picture of the battlefield and decide faster."
 cw_nato_1990s_strategic_airlift_and_prepositioning_desc:0 "Strategic airlift, sealift planning and pre-positioned equipment cut deployment times, so multinational forces can fight as soon as they arrive."
 cw_prc_1940s_doctrine_desc:0 "Revolutionary army doctrine relied on base areas, mobile warfare, political mobilisation and militia support against encirclement campaigns."
 cw_prc_1940s_doctrine_header_desc:0 "\nThe revolutionary army rests on mass mobilisation, political leadership and flexible guerrilla war that grows into regular offensives. It stresses endurance, local superiority and turning weakness into advantage."
 cw_prc_1940s_mobile_encirclement_doctrine_desc:0 "\n\n\n\nAvoiding the enemy's superior firepower, units look for weakly held routes, cut communications and surround enemy columns or garrisons before they can regroup."
 cw_prc_1940s_peoples_militia_mobilization_desc:0 "\n\n\n\nLocal communities are organised to supply men, intelligence and logistics. Militia screens and guards roads and depots, and reinforces the regular army in emergencies."
 cw_prc_1940s_political_military_integration_desc:0 "\n\n\n\nPolitical work is treated as a necessary part of operations. Shared ideals, strict discipline and unified leadership raise morale and reduce desertion."
 cw_prc_1950s_doctrine_desc:0 "China adopted foreign training models, standardised its formations, expanded its artillery and laid down an early air defence doctrine."
 cw_prc_1950s_doctrine_header:0 "Regular Combined Arms"
 cw_prc_1950s_doctrine_title:0 "Regularisation and Conventional Reform"
 cw_prc_1950s_field_artillery_expansion_desc:0 "\n\n\n\nSustained firepower is the key to breaking prepared defences. The army adds guns, trains its crews better and standardises fire planning and ammunition management."
 cw_prc_1950s_infiltration_oriented_assault_tactics_desc:0 "\n\n\n\nInfiltration survives inside a more regular army: units use darkness and terrain to strike command posts and support weapons, reducing the cost of frontal assaults."
 cw_prc_1950s_integrated_air_defense_beginnings_desc:0 "\n\n\n\nThe army builds a basic warning and reporting net, raises anti-aircraft units and trains commanders to disperse and hide their troops under air threat."
 cw_prc_1950s_soviet_advisory_training_model:0 "Foreign Advisory Training Model"
 cw_prc_1950s_soviet_advisory_training_model_desc:0 "\n\n\n\nUnder foreign advisers the army adopts formal training and staff methods, with standard drills, map exercises and logistics procedures."
 cw_prc_1960s_hardened_infrastructure_and_civil_defense_desc:0 "\n\n\n\nCommand facilities are hardened, stores dispersed, transport routes protected and quick repairs organised. Civil defence covers evacuation and shelters."
 cw_prc_1960s_independent_tactical_development_desc:0 "\n\n\n\nWith little outside help, the army develops tactics suited to China's terrain, manpower and industry through trial and after-action study."
 cw_prc_1960s_light_infantry_mobility_doctrine_desc:0 "\n\n\n\nInfantry trains for long marches and dispersed manoeuvre, occupying defensive positions quickly in mountains and the interior and using mobility to escape encirclement."
 cw_prc_1970s_precursor_combined_arms_formations_desc:0 "\n\n\n\nInfantry, armour, artillery, engineers and support begin to be grouped into combined formations with common procedures for fire requests and engineering work."
 cw_prc_1980s_doctrine_desc:0 "Reforms of the revolutionary army stressed combined-arms group armies, professionalism, mechanisation and theatre-level coordination."
 cw_prc_1980s_doctrine_header_desc:0 "\nThe army shifts to winning short border and regional wars through better training, mobility and fire coordination, with selective modernisation in place of total mobilisation."
 cw_prc_1980s_local_wars_doctrine_desc:0 "\n\n\n\nModernisation is built around short, limited wars: rapid mobilisation, forward deployment and concentrated combined-arms action to seize the initiative early."
 cw_prc_1980s_professionalization_and_nco_development_desc:0 "\n\n\n\nThe army raises professional standards and training quality and builds a capable NCO corps responsible for small-unit discipline, skill and initiative."
 cw_prc_1980s_reform_era_professional_cohesion_desc:0 "\n\n\n\n\n\n\n\nThe reformed army standardises training, improves command and modernises selectively, moving from a mass levy to a disciplined professional force."
 cw_prc_1990s_amphibious_and_airborne_expansion_desc:0 "\n\n\n\nThe army expands its amphibious and airborne forces, training to seize airfields, ports and bridges for follow-on troops and supplies."
 cw_prc_1990s_high_tech_strike_emphasis_desc:0 "\n\n\n\nStrikes on the enemy's key systems, command posts and logistics win the advantage at a lower cost than attrition."
 cw_prc_1990s_networked_battlefield_awareness_desc:0 "\n\n\n\nBetter sensors, reporting and communications discipline move reconnaissance quickly to every level and shorten decision times."
 cw_prc_1990s_rapid_reaction_task_groups_desc:0 "\n\n\n\nRapid reaction forces are organised in modules, deploy quickly, seize key ground and hold the situation until larger formations arrive."
 cw_warsaw_1940s_doctrine_desc:0 "Russian doctrine emphasised operational depth, massed fires and successive echelons to achieve decisive breakthroughs."
 cw_warsaw_1940s_doctrine_header_desc:0 "\nMoscow Accord doctrine starts from the Russian postwar synthesis of mechanised manoeuvre, massed artillery and operational depth, aiming at fast breakthroughs backed by centralised command and careful logistics."
 cw_warsaw_1940s_front_level_counteroffensive_coordination_desc:0 "\n\n\n\nCentralised front-level command coordinates several armies, artillery groups and support units so that separate thrusts reinforce each other."
 cw_warsaw_1940s_massed_artillery_breakthroughs_desc:0 "\n\n\n\nFirepower is the main tool for shaping the battlefield. Guns massed at high density fire carefully planned barrages that wreck fortifications and command posts and lift in step with the infantry."
 cw_warsaw_1940s_mechanized_exploitation_forces_desc:0 "\n\n\n\nOnce a breach is open, mobile units drive deep into the enemy rear, seize crossings, cut supply lines and break up reserves before they regroup."
 cw_warsaw_1940s_sequential_offensive_operations_desc:0 "\n\n\n\nA series of linked blows follows one another, each setting up the next and forcing the enemy to keep committing reserves."
 cw_warsaw_1940s_shock_army_penetration_tactics_desc:0 "\n\n\n\nForces and fire are massed on a narrow sector; heavy guns smash strongpoints while infantry, tanks and engineers break through the obstacles together."
 cw_warsaw_1950s_centralized_operational_control_desc:0 "\n\n\n\nDecisions on reserves, artillery, air support and the main axis are kept at higher headquarters to ensure unity of effort."
 cw_warsaw_1950s_doctrine_desc:0 "Moscow Accord doctrine combined nuclear fires with massed armour and centralised operational control."
 cw_warsaw_1950s_echeloned_assault_planning_desc:0 "\n\n\n\nOffensive power is built in echelons: the first breaks the line, the second widens the breach and beats off counterattacks, and follow-on forces exploit into depth."
 cw_warsaw_1950s_forward_layered_defense_desc:0 "\n\n\n\nThe defence is organised in several belts with prepared positions, interlocking fire and planned fall-back lines to delay and wear down the attacker."
 cw_warsaw_1950s_rapid_mobilization_framework_desc:0 "\n\n\n\nPrepared call-up procedures, reserve units, equipment stores and transport schedules turn a peacetime cadre into a wartime army at short notice."
 cw_warsaw_1960s_centralized_offensive_planning_desc:0 "\n\n\n\nAs tempo rises, higher headquarters decides the axes, the timing of each echelon and the allocation of fire, and coordinates air defence and logistics."
 cw_warsaw_1960s_combined_arms_divisional_reform_desc:0 "\n\n\n\nThe division becomes a balanced, self-contained formation combining mechanised infantry, armour, artillery, engineers, reconnaissance and air defence under fixed command."
 cw_warsaw_1960s_doctrine_desc:0 "Doctrine refined echeloned assaults, combined-arms coordination and deep penetration of coalition defensive belts."
 cw_warsaw_1960s_echeloned_assault_refinement_desc:0 "\n\n\n\n\n\n\n\nForces attack in successive waves, relying on coordination between echelons, massed fire preparation and strict control to widen the breakthrough."
 cw_warsaw_1970s_doctrine_desc:0 "Moscow Accord forces stressed fast manoeuvre groups to exploit breakthroughs and disrupt the enemy rear."
 cw_warsaw_1970s_doctrine_header_desc:0 "\nPlanning in this stage aims to paralyse the enemy system with successive echelons and relentless pressure, shifting the main effort quickly and using coordinated fire to stop a coalition counterattack."
 cw_warsaw_1970s_high_mass_fire_preparation_desc:0 "\n\n\n\nFire preparation is sequenced into suppression, destruction and neutralisation, knocking out anti-tank weapons, command posts and observers at the decisive point to open the way for fast manoeuvre."
 cw_warsaw_1970s_offensive_depth_optimization_desc:0 "\n\n\n\n\n\n\n\nThe offensive reaches beyond the front line, striking reserves, logistics and command across the whole theatre to hasten the enemy's collapse."
 cw_warsaw_1980s_doctrine_header:0 "The Deep Strike Doctrine"
 cw_warsaw_1980s_doctrine_header_desc:0 "\nThis doctrine joins reconnaissance, precision fires and high-tempo manoeuvre into one system that cuts the enemy's command and gives the coalition no pause to rebuild its line."
 cw_warsaw_1980s_doctrine_title:0 "Deep Strike Doctrine"
 cw_warsaw_1980s_integrated_strike_maneuver_architecture_desc:0 "\n\n\n\n\n\n\n\nArtillery, missiles, aircraft and ground forces act together, applying pressure throughout the depth at once to overwhelm the defence."
 cw_warsaw_1980s_operational_counter_penetration_measures_desc:0 "\n\n\n\nBreakthroughs are spotted quickly and reserves committed flexibly; counterattacks backed by fire and jamming restore the situation before the enemy can exploit."
 cw_warsaw_1980s_precision_non_nuclear_engagement_desc:0 "\n\n\n\nBetter accuracy, better target selection and carefully planned conventional fires achieve decisive effects without crossing the nuclear threshold."
 cw_warsaw_1990s_doctrine_header:0 "Late Cold War Operational Modernisation"
 cw_warsaw_1990s_doctrine_header_desc:0 "\nWith resources stretched, doctrine turns to a lean professional core, more resilient command communications and selective modernisation, stressing adaptable combined-arms groups and electronic warfare."
 cw_warsaw_1990s_high_tech_operational_maturity_desc:0 "\n\n\n\n\n\n\n\nAutomation, better command systems and reconnaissance are brought into the existing operational framework, updating the established offensive methods."
 cw_warsaw_1990s_operational_maneuver_resilience_desc:0 "\n\n\n\nManoeuvre continues despite disruption, losses and lost information, relying on resilient command, redundant communications, flexible logistics and small-unit initiative."
