 FRA_krcw_frachon_desc:0 "§YBorn:§! §gMay 13th, 1893, in Le Chambon-Feugerolles, Loire, French Republic§!\n§YAlignment:§! §gCGT majority§!\n§YBackground:§! §LFrachon was born in an industrial town near Saint-Etienne, the son of a miner. At thirteen he was apprenticed in a metalworks and soon joined the local union and a syndicalist youth group. He was called up during the Great War, came home to the Loire after the defeat, and in the civil war organised workers' militias guarding the factories and railways around Saint-Etienne.\nAfter the Commune was founded he worked in the metalworkers' unions of the Loire and Lyon, known for keeping a strike going to the end and for knowing when to settle. He belongs to the wing of the syndicalists that sympathises with the anarchists, and has often mediated inside the federations. In the Second Weltkrieg he ran the allocation of labour for war production, and in 1946 he was elected General Secretary of the CGT, the effective leader of the Commune and of the Third Internationale.\nTwo questions face him now. One is whether the secretariat's resolutions should bind the members: Marty wants a centre that can give orders, Monatte wants the secretariat abolished, and Frachon stands between them. The other is the Algiers congress, which demands that the Commune honour its 1921 declaration abolishing all colonies. The federations' apparatus keeps growing, and he rose through that apparatus himself.§!"
 FRA_krcw_de_gaulle_desc:0 "§YBorn:§! §gNovember 22nd, 1890, in Lille, Nord, French Republic§!\n§YAlignment:§! §gNational French exiles§!\n§YBackground:§! §LDe Gaulle comes from a Catholic, royalist family in Lille. He graduated from Saint-Cyr in 1912 and was posted to the 33rd Infantry Regiment under Colonel Petain. In the Great War he was wounded at Dinant, wounded again at Verdun in 1916 and taken prisoner by the Germans. He later escaped from captivity and came home with a name already made.\nAfter the defeat of 1919 and the revolution that followed, he withdrew to Algiers with the government and the army and became the leader of the 'Young Guard', the clique of officers around Petain, known for his military theory and his lectures. The parliamentary chaos of the early exile won him over to the Action Francaise and the belief that the Republic could not save France. For the next twenty years everything he did in Algiers was aimed at recovering the mainland.\nIn 1942 National France collapsed in the war, the Commune took over Algiers, and de Gaulle went into exile with a small group of officers. He now has no army and no territory, but many exiled Frenchmen still see him as their only leader. Moscow dislikes his arrogance and his distrust of the Russians, yet if the Commune ever falls in a war, the Accord has no other name the French would obey.§!"
 FRA_krcw_marty_desc:0 "§YBorn:§! §gNovember 6th, 1886, in Perpignan, Pyrenees-Orientales, French Republic§!\n§YAlignment:§! §gCentralists (the secretariat faction)§!\n§YBackground:§! §LMarty was born in Perpignan, went through the navy's school for engine-room mechanics and served as a ship's mechanic. In April 1919 his torpedo boat, the Protet, was in the Black Sea for the intervention in the Russian Civil War; he planned a mutiny, was discovered and arrested, and was sentenced to twenty years' hard labour. The mainland was defeated soon after, the revolution broke out, and he was let out of prison.\nIn the civil war he organised sailors' committees in the Mediterranean ports, and afterwards worked for years in the Commune's international liaison department. During the Iberian revolution of 1936 he was chief political commissar of the International Brigades at Albacete, in charge of training and discipline, and his harsh treatment of deserters and suspects gave him a bad name in the Brigades. In the Second Weltkrieg he ran political work in the army on the German front.\nHe is the author of both the 'cadres to the east' line and the 'binding secretariat': the Internationale needs a centre that can give orders, orders once given must be carried out, and under majority voting the majority is French. His support lies with the older cadres and the army's political officers. His opponents say he treats every disagreement as treason, and neither the syndicalists nor the anarchists trust him.§!"
 FRA_krcw_monatte_desc:0 "§YBorn:§! §gJanuary 15th, 1881, in Monlet, Haute-Loire, French Republic§!\n§YAlignment:§! §gOld revolutionary syndicalists (the federations-alone faction)§!\n§YBackground:§! §LMonatte grew up in rural Haute-Loire, worked as a school monitor after secondary school and then as a proofreader in Paris printshops. He joined the CGT in 1904, was arrested in 1906 for his part in the protests after the Courrieres mine disaster, and in 1908 briefly fled to Switzerland to escape arrest. In 1909 he founded La Vie Ouvriere, which became the theoretical home of revolutionary syndicalism. In 1914 he opposed the unions' 'Sacred Union' with the government, resigned his post in the confederation and was soon called up to the front.\nAfter the revolution he was the chief organiser of the 'Orthodoxes', bringing the Centrists and the Ultras together to win the 1926 elections and the chairmanship of the Commune, which he held for ten years through a fragile alliance with the anarchists. After the 1936 elections he left the chairmanship and went back to work in the federations and on his paper.\nHe is nearly seventy and still attends every Paris congress, sitting at the back. He is the source of the faction that would abolish the secretariat: parties and states are bourgeois forms, and the Internationale should be nothing more than direct agreements between the national industrial federations. The young radicals respect him; the secretariat's cadres think his plan would leave the Internationale with no one in command in wartime.§!"
 ENG_krcw_wintringham_desc:0 "§YBorn:§! §gMay 15th, 1898, in Grimsby, Lincolnshire, England§!\n§YAlignment:§! §gTUC majority§!\n§YBackground:§! §LWintringham was born into a solicitor's family in Grimsby, educated at Gresham's School and went up to Balliol College, Oxford, in 1915. From 1916 he served in the Royal Flying Corps as a mechanic and motorcycle dispatch rider, and after the defeat he went back to Oxford and into the labour movement.\nIn the revolution of 1925 he fought in the London docks, and afterwards worked on the federations' military committee on how to organise a militia and a people's war, writing a good deal on infantry tactics. When the Iberian revolution broke out in 1936 he took the British volunteer battalion to Spain and was wounded at the Jarama. Back home he joined the leadership of the Trades Union Congress, ran militia training and the organisation of Atlantic shipping in the Second Weltkrieg, and was elected General Secretary after the war.\nHe wants Britain to be the Internationale's sea power: a fleet holding the Atlantic routes and carrying aid to Canada and the Combined Syndicates. In the party he is known for tolerating dissent, and opponents in Congress are seldom punished for it. He refuses to name a successor, calling that what kings do, so the Horner, Gallacher and Wilkinson camps are all preparing for what comes after him.§!"
 ENG_krcw_bevan_desc:0 "§YBorn:§! §gNovember 15th, 1897, in Tredegar, Monmouthshire, Wales§!\n§YAlignment:§! §gSouth Wales Miners' Federation§!\n§YBackground:§! §LBevan was one of ten children of a Tredegar mining family; his father David was a miner and a Baptist. He left school at thirteen to work underground at Ty-Trist colliery and was elected chairman of his miners' lodge at nineteen. In 1919 a scholarship from the South Wales Miners' Federation took him to the Central Labour College in London, where he read Marx and Daniel De Leon.\nHe came back to Tredegar as South Wales struggled through strikes and unemployment. In the revolution he organised miners' pickets in Monmouthshire, and since then he has worked in the miners' federation and on local councils. When the Union of Britain drew up the Charter of the Four, it was he who pushed through the rule apportioning seats by union membership instead of population, which gave the highly organised Welsh miners a larger share of Congress.\nHe is sharp-tongued and never hides that he speaks for South Wales: the Union's policies are to be judged first by whether they improve housing and health care in the coalfields. Delegates from the English counties think he puts local interest above the nation's. He and Horner come from the same federation and still quarrel often over the share-out of resources.§!"
 ENG_krcw_cole_desc:0 "§YBorn:§! §gSeptember 25th, 1889, in Cambridge, Cambridgeshire, England§!\n§YAlignment:§! §gGuild Socialists§!\n§YBackground:§! §LCole was born in Cambridge and grew up in Ealing, west of London. He was educated at St Paul's School and Balliol College, Oxford, joined the Fabian Society in 1908 and stayed on to teach at Oxford. In 1915 he helped found the National Guilds League, which held that each industry should be run by its own workers organised in a national guild. During the Great War he did research for the Amalgamated Society of Engineers, grew close to the shop stewards' movement and fell out with the older Fabians over it.\nAfter the revolution he worked in the research department of the Trades Union Congress and wrote a long series of books on industrial organisation and wage systems; his wife Margaret was a mainstay of the same department. For years he was the Hornerists' chief theorist, and after the Second Weltkrieg he became Horner's deputy.\nHis scheme is for each industry to form a self-governing national guild, for the guilds to trade with one another by contract, and for the state to do nothing but arbitrate. He admits that this amounts to a market without capitalists, and that he has no answer yet for how prices and competition between guilds are to be managed. The Fabians find him too radical and the shop stewards find him too much the professor. He has been diabetic for years and has never cut his workload.§!"
 ENG_krcw_edward_viii_desc:0 "§YBorn:§! §gJune 23rd, 1894, at White Lodge, Richmond, Surrey, England§!\n§YAlignment:§! §gHouse of Windsor (court in exile)§!\n§YBackground:§! §LEdward was the eldest son of the Duke of York, later George V. He was trained at the naval colleges at Osborne and Dartmouth, created Prince of Wales in 1910, and went up to Magdalen College, Oxford. When the Great War came he joined the Grenadier Guards and was kept on staff duties, and his repeated requests to serve at the front were refused.\nAfter the revolution of 1925 he went into exile in Ottawa with the royal family and the government. When George V died in Canada in 1936 Edward succeeded him and was crowned in Christ Church Cathedral, Ottawa, the first British king not crowned at Westminster. In 1938 he and the exile government sent an army into New England to restore constitutional rule in America; the Canadian expeditionary force was broken by syndicalist militias at Albany and Buffalo, and at home came a conscription crisis, a general strike and a mutiny at Kingston. In 1940 he fled a second time and took the royal family to Australia.\nHe is now king of the court in exile at Melbourne and still styles himself monarch of Great Britain. The Australian and New Zealand parliaments support the crown but will not send troops to recover London, the Menzies government has reservations about any venture of his, and Canadians blame him for the failed intervention. The Moscow Accord has promised to return him to Buckingham Palace if Britain surrenders in a war, on condition that the government is made up of men the Accord approves.§!"
 ENG_krcw_gallacher_desc:0 "§YBorn:§! §gDecember 25th, 1881, in Paisley, Renfrewshire, Scotland§!\n§YAlignment:§! §gShop Stewards' Movement§!\n§YBackground:§! §LGallacher was born in Paisley to an Irish immigrant father who died when he was small; his mother kept the family as a washerwoman. He was doing odd jobs from the age of ten, later worked as a brass finisher in Glasgow, and as a young man was active in the temperance movement and the Social Democratic Federation. In the Great War he led the Clyde Workers' Committee against the Munitions Act, organised strikes against wartime labour controls, and was jailed in 1916 for an anti-war article in the committee's paper.\nOn his release he joined the Glasgow Trades Council. In the revolution of 1925 he turned it into a workers' militia able to fight, and it took the shipyards and docks on both banks of the Clyde. Since then he has refused to work from a federation office and holds his meetings on the shop floor and in the yards. He is the man in Congress most able to talk a room of mutually contemptuous federations into a single resolution.\nHe wants production decisions handed back to the shop floor: plans passed by vote in each works, managers elected by the workforce and recallable at any time. He also holds that the constitution must be written down, including the article that lets anti-revolutionary candidates stand. The young stewards on the Clyde support him; the planning office and the county administrators say his methods will cut output.§!"
 ENG_krcw_horner_desc:0 "§YBorn:§! §gApril 5th, 1894, in Merthyr Tydfil, Glamorganshire, Wales§!\n§YAlignment:§! §gHornerists (South Wales miners)§!\n§YBackground:§! §LHorner, a railwayman's son from Merthyr Tydfil, was a lay evangelical preacher in his youth before going down the pits of the Rhondda. He followed Keir Hardie into the ILP and became a pupil of Noah Ablett, which made him a Marxist and a syndicalist. Refusing military service in the Great War, he fled to Ireland, fought with James Connolly's Irish Citizen Army in the Easter Rising of 1916, and served a prison term on his return.\nIn the revolution he first organised mutinous soldiers, then went to the Cardiff Commune as a delegate and as Ablett's secretary. After the victory he rebuilt the National Minority Movement, which brought him to Tom Mann's attention, and in 1931 he was elected Welsh regional chairman, known for his skill at the table as 'the Negotiator'. He has long been secretary of the miners' federation, and wrote the second decade's draft plan for housing, heating, running water and schools.\nHe opposes the nuclear programme for one reason only: the money would come out of the housing plan. His base is the miners, the best-organised workers in the country. He distrusts the London offices and has little time for the young men on the Clyde who find him too slow. He is one of the three candidates to follow Wintringham.§!"
 ENG_krcw_strachey_desc:0 "§YBorn:§! §gOctober 21st, 1901, in Guildford, Surrey, England§!\n§YAlignment:§! §gPlanners§!\n§YBackground:§! §LStrachey is the son of John St Loe Strachey, editor of The Spectator, and was educated at Eton and Magdalen College, Oxford, which he left without a degree. As a young journalist he moved for a time in Oswald Mosley's circle. When Mosley fled to Canada in the revolution of 1925, Strachey stayed and broke with him.\nAfter the revolution he worked in the economic research department of the Trades Union Congress, made a name with popular pamphlets on economics, and later joined the planning office, where in the Second Weltkrieg he ran the statistics for war production and transport. Since the war he has chaired the cabinet's science and planning committee, one of the few politicians in the Union who can deal with engineers and economists alike.\nHe wrote the three-page Cambridge memorandum. Its first two pages cover whether the thing is technically possible and what it would cost; the question on the third page, 'If we can, should we?', is his own addition. His answer in cabinet was no: he has worked out what a nuclear weapon could protect on an island, and concluded that an island has no depth from which to strike back and could only strike first. The navy and the programme's supporters think he is holding things up, and many old syndicalists have not forgotten that he once followed Mosley.§!"
 ENG_krcw_strachey_land_desc:0 "§YBorn:§! §gOctober 21st, 1901, in Guildford, Surrey, England§!\n§YAlignment:§! §gPlanners (county agricultural federations)§!\n§YBackground:§! §LStrachey is the son of John St Loe Strachey, editor of The Spectator, and was educated at Eton and Magdalen College, Oxford, which he left without a degree. As a young journalist he moved for a time in Oswald Mosley's circle. When Mosley fled to Canada in the revolution of 1925, Strachey stayed and broke with him.\nAfter the revolution he worked in the economic research department of the Trades Union Congress and later joined the planning office. In the Second Weltkrieg, when Britain's food imports kept being cut, he was sent to run rationing and farm production, and he has given all his attention to the land ever since.\nHe carried the county agricultural federation scheme: in each county the farm workers and smallholders form a federation, machinery and seed are pooled, sowing, harvest and rotation are decided locally, and London sets only the purchase price and the delivery quotas. He treats the land as an engineering problem and holds to one principle, that the man who decides when to sow must be standing in the field. The scheme brought British food output back. The farm workers' union wants all land taken into common ownership at once, the planning office dislikes the counties going their own way, and smallholders who were once tenants fear the federations will take their land sooner or later.§!"
 ENG_krcw_wilkinson_desc:0 "§YBorn:§! §gOctober 8th, 1891, in Chorlton-on-Medlock, Manchester, England§!\n§YAlignment:§! §gFederationists (new towns programme)§!\n§YBackground:§! §LWilkinson's father was a Manchester insurance agent and a Methodist, and the family was poor. She joined the ILP at sixteen and won a scholarship to read history at Manchester University in 1910. After graduating she worked as an organiser for the National Union of Women's Suffrage Societies, and from 1915 as national organiser of the co-operative employees' union, leading strikes of shop assistants and women workers in Manchester during the Great War.\nAfter the revolution she ran the Union's education work for years, including the evening classes for workers and the reorganisation of local schools, and later became Sylvia Pankhurst's deputy. When Pankhurst declined to hold office again, Wilkinson became the Federationists' chosen successor, known to everyone as 'Red Ellen'. Since the Second Weltkrieg she has directed the new towns programme, building housing, clinics, schools and public baths around the old industrial districts.\nShe wants the factories run by accountants, engineers and statisticians, with shop-floor meetings no longer voting on production, because housing and household goods have to be built efficiently. That puts her at odds with Gallacher's shop stewards. She works very long hours, smokes constantly and has never shaken off her asthma, and those around her worry about her health.§!"
 ITA_krcw_di_vittorio_desc:0 "§YBorn:§! §gAugust 11th, 1892, in Cerignola, Foggia, Kingdom of Italy§!\n§YAlignment:§! §gCGdL§!\n§YBackground:§! §LDi Vittorio's father, an Apulian farm labourer, died when the boy was ten, and he left school to take over his father's work in the fields. At twelve he bought a dictionary with his own wages and taught himself, first drawn to anarchism; at fifteen he helped found a socialist youth club in Cerignola and then joined the local farmworkers' union. When the Great War came he wrote in Mussolini's Il Popolo d'Italia in favour of intervention, and was wounded at the front.\nIn the Italian civil war after the defeat he turned to the republicans and socialists, which estranged him from his native Apulia. He left the rural-based USI for the mainly urban CGdL, which was willing to compromise with the moderates, and opposed Giulietti's alliance with Mussolini. After the Second Risorgimento he brought most of the unions behind him and became leader of the Socialist Republic. In the Second Weltkrieg the Republic unified the peninsula, and in 1943 it crossed the Adriatic, overthrew King Zog of Albania and brought Fan Noli back; a year later the Yugoslav and Greek juntas drove it back across the sea and Zog returned.\nHe is most respected among the landless labourers of the south and puts land reform ahead of industrialisation. His troubles come from two directions. Parri's faction wants force used over Trieste and Istria while the Internationale's secretariat wants Italy to accept arbitration; and Noli's Albanian exiles want guns from Rome, while the supply boats of the Greek partisans in the Pindus sail from Italian ports.§!"
 ITA_krcw_gabriotti_desc:0 "§YBorn:§! §gApril 26th, 1883, in Citta di Castello, Umbria, Kingdom of Italy§!\n§YAlignment:§! §gCGdL administrators§!\n§YBackground:§! §LGabriotti was born in Citta di Castello in northern Umbria and as a young man worked in the local Catholic co-operatives and peasant mutual societies. He served as an officer at the front in the Great War, and afterwards went back to the upper Tiber valley to organise tobacco and farm workers.\nAfter the Italian civil war he left the Catholic organisations for the CGdL and managed the accounts of factory councils and co-operatives in Umbria and the Marche. He ran the factory councils as organs of administration: they collected taxes, mended roads and ran schools, and published their accounts every quarter. In the Second Weltkrieg Umbria lay behind the front, and he organised transport and grain requisitions and led a mountain partisan band for a time.\nHis views are unpopular in Italy and practical: the Republic's problem lies in execution, with no one collecting taxes, no one mending roads and trains that do not run on time. He leaves the case for revolution to others and wants a budget that can be carried out and a civil service that can do the work. The theorists find him without ideas, the labourers' leaders of the south think he cares only for the centre, and he has no faction of his own in Rome.§!"
 ITA_krcw_gronchi_desc:0 "§YBorn:§! §gSeptember 10th, 1887, in Pontedera, Pisa, Kingdom of Italy§!\n§YAlignment:§! §gCatholic labour wing§!\n§YBackground:§! §LGronchi, a Tuscan, read literature at the University of Pisa and as a young man followed Father Romolo Murri's Christian democratic movement. He taught at secondary schools after graduating and served in the Great War as an infantry officer, winning decorations.\nAfter the war, anti-clerical violence in Tuscany drove him to Milan, where he helped Father Sturzo found the People's Party and organised Catholic unions to compete with the syndicalists for the workers. He stood on the party's left, shared its leadership with Rodino and Spataro after Sturzo resigned, and was later elected President of the Italian Republic. When that republic broke up in the Second Weltkrieg he did not go into exile, and brought most of the Catholic unions with him into the unified Socialist Republic.\nNo one else can do his job in the Republic: the southern peasants listen to their priests, and many priests listen to him. He wants the Republic to leave the Church's schools and parishes alone in return for the Church's support for land reform and the unions. The anti-clerical old syndicalists think he was planted by the Church, and the Vatican does not fully trust him either.§!"
 ITA_krcw_matteotti_desc:0 "§YBorn:§! §g1921, in Rome, Kingdom of Italy§!\n§YAlignment:§! §gCGdL proceduralists§!\n§YBackground:§! §LMatteo Matteotti is the son of Giacomo Matteotti. His father, from the Polesine, led the social democratic Lega Democratica Riformista in the Italian Republic and worked for years with Bonomi's governments, until he was murdered by right-wing gunmen. With no one left to protect the family, his mother took the children across the Alps to France.\nHe finished school in Paris, joined the syndicalist youth and was trained by the Commune in a metalworks and in the federations' evening classes. In 1943 he came back to Italy with the Internationale's armies as a liaison officer, and since then he has led the rebuilding of the factory councils of Turin and Milan, writing rules for elections, recall and minutes into the statutes of every works.\nHe wants the Italian Socialist Republic to be the most procedural member of the Internationale: every major decision put to a vote, war included. For that reason he opposes Parri's hard line on Trieste and does not want the secretariat deciding for the members. The factory councils of the north back him; the older revolutionaries think him too young and too French in his upbringing.§!"
 ITA_krcw_parri_desc:0 "§YBorn:§! §gJanuary 19th, 1890, in Pinerolo, Turin, Kingdom of Italy§!\n§YAlignment:§! §gPartisan veterans§!\n§YBackground:§! §LParri taught school in Milan and wrote for the Corriere della Sera. In the Great War he served as an officer, was wounded three times and decorated several times, and at the end of the war was on the General Staff, watching the Italian army lose battle after battle to the Austro-German offensives.\nAfter the armistice he was among the officers the Austrians sent home to help keep order. Wary of Austria's aims and afraid of socialism, he organised militias in Milan against red infiltration. When the Italian Republic was proclaimed in 1930 he became a mainstay of Bonomi's Liberal Democrats and manager of a large Milan electricity company, and later took over the party's leadership.\nThe Second Weltkrieg changed his politics. When the Austrian garrisons and the republican government collapsed, he organised partisans in the Alps and fought his way down to the Po valley with bands made up mostly of workers and peasants, and after the war he brought them into the Socialist Republic. He holds that the Italians of Trieste and Istria should not wait for a verdict from Geneva. His support is in the army; his opponents say he would drag the Internationale into a war over a few ports, and some remember that twenty years ago he stood on the other side.§!"
 ITA_krcw_sardi_desc:0 "§YBorn:§! §gJanuary 25th, 1889, in Sulmona, Aquila degli Abruzzi, Kingdom of Italy§!\n§YAlignment:§! §gLiberals (financial adviser)§!\n§YBackground:§! §LSardi was born in Sulmona in the Abruzzi mountains and served as an officer in the Great War. Afterwards he went home to the Abruzzi, served in a local militia, and was later elected to the parliament of the Italian Federation as a liberal, sitting for years on the budget committee and learning the accounts of the public debt, the railways and public works.\nWhen the Federation's government fell in the Second Weltkrieg, most of the old deputies went to Sardinia or abroad, and some were imprisoned. Sardi stayed in Rome, handed the Treasury's records over to the new government and has worked for the Republic as a financial adviser ever since. His reason for staying is simple: Italy's public debt was borrowed by his generation, and he does not want anyone else to have to explain it.\nHe is no socialist and has no political base in the Republic, but the day-to-day running of the Treasury and the national bank depends on him. He opposes Parri's venture over Trieste because he has worked out what a war would cost and the Republic cannot pay it. The syndicalists suspect him of speaking for the old creditors, and the old liberals regard him as a traitor.§!"
 WGR_krcw_thalmann_desc:0 "§YBorn:§! §gApril 16th, 1886, in the Free and Hanseatic City of Hamburg, German Empire§!\n§YAlignment:§! §gAllgemeine Arbeiter-Union Deutschlands (AAUD)§!\n§YBackground:§! §LErnst Thälmann was born into a Hamburg family that kept a small grocer's shop, and worked in the port and on ocean freighters from his teens. He joined the Social Democrats in 1903 and the transport workers' union a year later. He spent three years of the Weltkrieg as an artilleryman on the Western Front and went back to the Hamburg docks when it ended.\nAfter Germany won the war he became the best-known agitator among the Hamburg dockers. When the Hamburg rising of 1923 failed he went underground and stayed on the Empire's anti-sedition wanted lists for ten years, charged with organising secret societies and dealing with the intelligence services of the French Commune. He was arrested in 1933. The prosecution asked for the death sentence; he was sent instead to Moabit prison in Berlin, where he spent the next ten years.\nReleased in 1943, he proclaimed the German Socialist Republic and became chairman of the AAUD. No one matches his standing among the workers, but prison broke his health and he now rarely leaves Hamburg. Kahle, Wollenberg and Schröder speak for the army, the shop-floor councils and the union apparatus, each is preparing for the succession, and Thälmann has not yet said which of them he backs.§!"
 WGR_krcw_kahle_desc:0 "§YBorn:§! §gApril 22nd, 1899, in Berlin, Province of Brandenburg, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gAAUD, single-command faction§!\n§YBackground:§! §LHans Kahle came from an officer's family, entered the Prussian cadet corps as a boy and reached the Western Front as a lieutenant in 1917. He was taken prisoner in the last year of the war and only came home after the armistice. Finding no place for himself in the Empire's peace, he turned to the socialist movement in the 1920s, left Germany ahead of the anti-sedition police, and worked in the French Commune as a journalist and military instructor.\nIn 1936 he went to Spain and commanded the XI International Brigade, where he met most of the men who would later command the Republic's army. In 1943 he came back to Germany with the Internationale's armies, and he has been responsible for the Elbe line and the defence of West Berlin ever since.\nHe is the core of the single-command faction: a front-line state can have only one government, and the unions, the shop-floor councils and the defence ministry must answer to one chain of orders. The councils think he wants to turn the Republic into a barracks, and Wollenberg says openly that the only thing Kahle has ever obeyed is an army. The Internationale's military advisers trust him; among the workers of Hamburg and the Ruhr he has no base of his own.§!"
 WGR_krcw_mierendorff_desc:0 "§YBorn:§! §gMarch 24th, 1897, in Großenhain, Dresden District, Kingdom of Saxony, German Empire§!\n§YAlignment:§! §gSocial democrat, small-steps road§!\n§YBackground:§! §LCarlo Mierendorff grew up in Darmstadt, volunteered for the army straight out of school in 1914, served on the Western Front until the end of the war and won the Iron Cross. Afterwards he took a doctorate in economics at Heidelberg, joined the Social Democrats in 1920, and soon became the best writer and speaker among the young men of the Hessian party.\nIn the 1930s he sat in the Reichstag as the voice of the younger Social Democrats who wanted open confrontation with the Imperial government, and often attacked the party leadership in Vorwärts for being too timid. When the war began in 1937 the government used its wartime decrees to arrest the activists of the party's left, and he went underground in Hesse, where he held out until 1943.\nOnce the Republic was founded he chaired the drafting of its constitution, and he is the author of the small-steps road: leave unification aside for now and talk to the far bank of the Elbe about post, family visits and freight. The revolutionary socialists see him as a remnant of the old SPD; Kahle's faction thinks his approach would let the other side's agents come and go as they please. He is well liked in parliament and has little base in the unions.§!"
 WGR_krcw_renn_desc:0 "§YBorn:§! §gApril 22nd, 1889, in Dresden, Dresden District, Kingdom of Saxony, German Empire§!\n§YAlignment:§! §gRevolutionary socialist, union-officer road§!\n§YBackground:§! §LLudwig Renn was born Arnold Vieth von Golßenau into a Saxon noble family. In 1910 he joined the Royal Saxon Leib-Grenadier Regiment No. 100, and in the Weltkrieg he served on the Western Front as a company and then a battalion commander until 1919.\nAfter the war he left the army and studied law, economics and art history at Göttingen and Munich. In 1928 he published the novel War under the pen name Ludwig Renn, the story of an ordinary soldier's four years on the Western Front. It sold widely in the Empire and cut him off from his own class. The same year he joined the socialist movement; he was arrested several times and finally went into exile in France. In 1936 he went to Spain, commanded a battalion of the XI International Brigade and later became its chief of staff.\nHe came home with the Internationale's armies in 1943 and has since handled several of the Republic's negotiations abroad. He wants officers to be elected by the unions, arguing from having been an officer in both the old army and the Brigades and knowing what each did well. Career soldiers call him a novelist, the shop-floor councils say he is an aristocrat after all, and neither side fully trusts him.§!"
 WGR_krcw_schroder_desc:0 "§YBorn:§! §gNovember 13th, 1884, in Polzin, Province of Pomerania, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gAAUD, union apparatus faction§!\n§YBackground:§! §LKarl Schröder grew up in Pomerania. He studied German literature at university and went on to lecture in the Social Democrats' workers' education institutions, teaching history and literature to union officials. During the Weltkrieg he joined the anti-war left of the party and broke with its leadership.\nAfter the war he was one of the organisers of the German left outside parliament, arguing that workers should form their own unions in the factories and run production directly, without going through a party. The Empire's anti-sedition law put him near the top of its wanted lists, and for twenty years he moved between secret circles across the country, never caught thanks to false names and the cover of workers' families.\nAfter 1943 he became secretary of the AAUD and turned the scattered factory unions into one national union system. He holds that the unions are the Republic's backbone, since they run both production and people. He trusts neither Kahle's army nor Wollenberg's shop-floor assemblies, and both accuse him of building a new bureaucracy. He is past sixty-five and in good health, but almost unknown to the public outside the unions.§!"
 WGR_krcw_wollenberg_desc:0 "§YBorn:§! §gAugust 15th, 1892, in Königsberg, Province of East Prussia, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gAAUD, shop-floor council faction§!\n§YBackground:§! §LErich Wollenberg grew up in Königsberg and was studying medicine when the war came. Called up in 1914, he was wounded several times at the front and rose to lieutenant. In the last year of the war he organised soldiers' councils in his unit and never went back to medicine.\nIn the Hamburg rising of 1923 he was its military organiser. After its defeat he went into exile, and joined three different socialist organisations in turn; each expelled him for refusing orders from above. In the 1930s he worked as a military instructor for workers' militias in the French Commune and in Spain, and in 1943 he returned to the Ruhr.\nThe shop-floor councils take him for one of their own. He wants every major decision of the Republic, mobilisation and war included, put to a vote of the factory assemblies, on the grounds that a country that votes on everything is hard for a general to drag into war. Kahle thinks this would cost the Republic dearly in wartime, and the defence ministry's mobilisation exercise reports back Kahle. Wollenberg can move the factories of the Ruhr and Hamburg and has almost no friends in the party apparatus.§!"
 WGR_krcw_brandt_desc:0 "§YBorn:§! §gDecember 18th, 1913, in the Free and Hanseatic City of Lübeck, German Empire§!\n§YAlignment:§! §gSocial democrat§!\n§YBackground:§! §LWilly Brandt was born Herbert Frahm, the illegitimate son of a Lübeck shop assistant, and was raised by his grandfather, a lorry driver. He joined the socialist youth movement at school and was writing for the Lübeck workers' paper in his teens.\nIn 1933, when the Imperial police went after Lübeck's socialist youth groups under the anti-sedition law, he escaped to Norway on a fishing boat and took the name Willy Brandt. He worked as a journalist in Oslo, joined the Norwegian labour movement, and went to Spain as a correspondent in 1937. Through twelve years of exile he found papers and lodgings for German refugees.\nHe came back to the Socialist Republic in 1945, the youngest of that generation of exiles. He drafted the reception-centre system and the open-door frontier law that lets people who cross from the far bank of the Elbe stay. His judgement is that the Republic cannot match the other side in arms and can let the other side's people choose to come over. The security services think the reception centres are an open door for enemy agents, and the revolutionaries think he is too much of a Scandinavian social democrat.§!"
 WGR_krcw_zuse_desc:0 "§YBorn:§! §gJune 22nd, 1910, in Berlin-Wilmersdorf, Province of Brandenburg, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gNon-party, technical adviser to the Ministry of Economics§!\n§YBackground:§! §LKonrad Zuse was born in Berlin and spent his childhood in Braunsberg in East Prussia and Hoyerswerda in Saxony, following his father, a post office official. He studied civil engineering at the Technical University of Berlin-Charlottenburg and on graduating in 1935 joined the Henschel aircraft company, where he did stress calculations for wings.\nCalculating by hand was too slow, so he began building calculating machines himself in his parents' flat. He finished a first mechanical prototype in 1938, and in 1941 a relay computer that could run a program. The Imperial army took little interest, and late in the war most of his machines and drawings were destroyed in the bombing and street fighting in Berlin. When the city was divided, his home and workshop fell on the West Berlin side.\nHe has no interest in politics; what he wants is money and no military supervision. In 1949 the Socialist Republic's Ministry of Economics gave him both, and his first proposal was to compute the material balances of the national plan by machine. The planning office's old clerks do not trust machines, and the defence ministry would like his machines to calculate firing tables first.§!"
 DDR_krcw_schleicher_desc:0 "§YBorn:§! §gApril 7th, 1882, in Brandenburg an der Havel, Province of Brandenburg, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gNationale Front§!\n§YBackground:§! §LKurt von Schleicher came from a Prussian military family and joined the 3rd Foot Guards in 1900, where he met his lifelong friend Hammerstein. In the Weltkrieg he served on Groener's staff at the War Office, criticised the arms profiteers and argued for better conditions for workers, which earned him the nickname of the Red General.\nAfter the war he acted as Seeckt's liaison between the General Staff and the civilian government, became a friend of Crown Prince Wilhelm, and was made Prussian Minister of War in 1931. When the 1936 elections produced no majority he was appointed Reichskanzler, and he went on to run the two-front war against the Internationale and Russia. When the Empire collapsed in the spring of 1944 the Kaiser left for Dar es Salaam with the Imperial government. Schleicher stayed in Berlin, surrendered what was left of the army to the Russians, signed the Treaty of Berlin and set up the German National Republic in Brandenburg and Saxony, governed by the Nationale Front.\nHe is the one man in the country who can satisfy the generals, the civilians and Moscow at once. His health has been poor since the 1930s and he has never named a successor, so the General Staff, the civilians and the monarchists are each making their own preparations. He has never publicly answered the letters the Kaiser sends from Stockholm.§!"
 DDR_krcw_hammerstein_desc:0 "§YBorn:§! §gSeptember 26th, 1878, in Hinrichshagen, Grand Duchy of Mecklenburg-Strelitz, German Empire§!\n§YAlignment:§! §gNationale Front, officer-corps faction§!\n§YBackground:§! §LKurt von Hammerstein-Equord came from a Mecklenburg family of noble soldiers. He trained at the cadet schools in Plön and Groß-Lichterfelde and was commissioned into the 3rd Foot Guards, where he became friends with Schleicher. In the Weltkrieg he served as a staff officer with the General Staff and front-line headquarters.\nAfter the war he backed Seeckt's reforms to turn the army into a smaller, more professional force. Once Schleicher became Prussian Minister of War he pushed Hammerstein to the top of the Supreme Army Command. During the war Hammerstein several times refused orders he believed would throw units away for nothing, and kept his post only because of his friendship with Schleicher. In 1944 he supported the surrender to Russia, on the grounds that keeping the army mattered more than keeping the capital.\nNow past seventy, he is the most senior general in the Nationale Front. He holds that the country should be run by its officer corps, the army being in his view the one institution that has not gone rotten, and he is equally opposed to any military move against West Berlin. The civilians fear him, Zaisser's police and he watch each other, and the younger staff officers would rather back Heinrici.§!"
 DDR_krcw_heinrici_desc:0 "§YBorn:§! §gDecember 25th, 1886, in Gumbinnen, Province of East Prussia, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gNationale Front, General Staff faction§!\n§YBackground:§! §LGotthard Heinrici was the son of an East Prussian pastor. He married into the Prussian nobility, and those connections gave him his footing in the army. In the Weltkrieg he served as a company and then battalion commander, was wounded at Verdun, and moved to staff posts after he recovered.\nAfter the war he joined the German Fatherland Party early on, unusual in an officer corps that stayed out of politics, and his superiors held back his promotion for a time. His command ability carried him up regardless, and he became the army's best-known specialist in defensive war. In the last year of the Second Weltkrieg he was responsible for withdrawing the remaining troops to the east bank of the Elbe and setting up the line there. His native East Prussia no longer belongs to Germany.\nHe is the General Staff's candidate to follow Schleicher, though he has little interest in the post himself. He believes governing should be left to civilians, and that a soldier's task is to hold the Elbe and keep that line from ever having to be fought over. Sparing with troops and with words, he is highly respected in the army and has almost no political allies. Hammerstein thinks him too soft; the civilians worry that once in office he would be run by the General Staff.§!"
 DDR_krcw_heuss_desc:0 "§YBorn:§! §gJanuary 31st, 1884, in Brackenheim, Neckar District, Kingdom of Württemberg, German Empire§!\n§YAlignment:§! §gNationale Front, civilian liberal§!\n§YBackground:§! §LTheodor Heuss was born into the family of a Württemberg engineering official. He studied economics, history and art history in Munich and Berlin, and took his doctorate in 1905 with a thesis on wine-growing around Heilbronn. He then edited Friedrich Naumann's weekly Die Hilfe in Berlin, and in 1912 went back to Heilbronn to edit the Neckar-Zeitung, becoming a young standard-bearer of Naumann's liberalism.\nAfter the war he was a well-known figure among the Left Liberals in the Reichstag, taught constitutional and political history at the Hochschule für Politik in Berlin, and wrote widely on parliamentary government. When the war ended he stayed in Berlin and did not follow the Imperial government south. When Schleicher set up the National Republic he needed a name the civilians could accept; Heuss took the offer and has been the best-known civilian in the government ever since.\nHe argues for the civilian turn: move the budget out of the army and into housing and railways, because a country nobody wants to stay in cannot hold its frontier. The generals tolerate him because foreign correspondents and diplomats will talk to him. He has no organisation of his own in the Nationale Front, his position depends entirely on Schleicher needing him, and Hammerstein's faction has long wanted him replaced.§!"
 DDR_krcw_jarres_desc:0 "§YBorn:§! §gSeptember 21st, 1875, in Remscheid, Rhine Province, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gNationale Front, municipal conservative§!\n§YBackground:§! §LKarl Jarres was a native of Remscheid who studied law at Bonn and elsewhere and spent his career in municipal government. He became mayor of Remscheid in 1910 and mayor of Duisburg in 1914, a post he held for nearly thirty years, putting the city's port, tramways and finances in good order and earning a name among the right-wing liberals.\nWhen the Internationale occupied the Ruhr in 1943 he took the city archives and part of the administration east, and he has never been back to Duisburg. After the National Republic was founded he was put in charge of reorganising local government and municipal finance, and many of its district and town chiefs are his appointments.\nHe speaks for those in the Republic who trust neither the army nor revolution, and wants the four basics put right first: municipal government, administration, police and the budget. His view of the throne is the frankest in the government: a restoration would cost money and need Moscow's consent, while leaving the throne empty costs nothing. The monarchists hate him for it and the generals think he can only do sums. He is past seventy and has no younger successor at his side.§!"
 DDR_krcw_bruning_desc:0 "§YBorn:§! §gNovember 26th, 1885, in Münster, Province of Westphalia, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gNationale Front, Centre Party civilian§!\n§YBackground:§! §LHeinrich Brüning was born into a Catholic merchant family in Münster. He studied philosophy, history and economics in Munich, Strasbourg, London and Bonn, and took his doctorate at Bonn in 1915 with a thesis on the nationalisation of the English railways. He then volunteered for the army, commanded a machine-gun company on the Western Front and won the Iron Cross.\nAfter the war he became managing director of Stegerwald's Christian trade unions, then entered the Reichstag as the Centre Party's finance specialist. In the party's leadership fight of the 1930s he formed a triumvirate with Joos and Mönnig against Stegerwald. He ran several rounds of austerity budgets, each unpopular at the time and each later accepted as necessary. When the war ended he was in Berlin; his home town of Münster is now on the other side of the Elbe line.\nHe is the civilians' best-qualified candidate and their least popular one. He wants the defence budget cut and the front-line state's finances steadied first, which sets him against the General Staff and Moscow's military advisers alike. He is cold and bad at winning people over, and the Catholic workers would rather follow Joos.§!"
 DDR_krcw_joos_desc:0 "§YBorn:§! §gNovember 13th, 1878, in Wintzenheim, Kolmar, Upper Alsace District, Imperial Territory of Alsace-Lorraine, German Empire§!\n§YAlignment:§! §gChristian democrat, Catholic workers' movement§!\n§YBackground:§! §LJoseph Joos was born in Alsace, learned a trade as a young man and then went into the Catholic workers' associations. From the 1900s he edited their paper, the Westdeutsche Arbeiterzeitung, in Mönchengladbach, and over more than twenty years in the post he became the most influential voice of the Catholic workers' movement in print.\nAfter the war he entered the Reichstag for the Centre Party, representing its workers' wing. In the party's leadership fight of the 1930s he formed a triumvirate with Brüning and Mönnig against Stegerwald. When the Rhineland and the Ruhr fell to the Internationale in 1943, his paper and most of its readers stayed in the west while he was in Berlin.\nIn the National Republic he is one of the few politicians who belongs neither to the army nor to the bureaucracy and still has an organised base, built on the parishes and the Catholic workers' associations. His programme has one practical point: restore post, family visits and freight with the far side of the Rhine, so that families divided by the wire can see each other. Zaisser's police regard the parish network as a security risk, and Moscow distrusts any contact with the west.§!"
 DDR_krcw_zaisser_desc:0 "§YBorn:§! §gJune 20th, 1893, in Gelsenkirchen, Province of Westphalia, Kingdom of Prussia, German Empire§!\n§YAlignment:§! §gNationale Front, security apparatus§!\n§YBackground:§! §LWilhelm Zaisser was the son of a gendarme in Gelsenkirchen. He trained as a teacher in Essen and taught primary school. In the Weltkrieg he served on the Eastern and Western Fronts and rose to reserve lieutenant.\nAfter the war he did not return to the classroom but stayed in the army doing intelligence work, and through the 1920s and 1930s he served in the General Staff's intelligence section, where he came to know the Ruhr's mining districts and workers' organisations well. In the Second Weltkrieg he ran counter-intelligence behind the lines. After the surrender of 1944 Schleicher had him build the People's Police, and he created the Republic's files, registers of residents and informer networks from nothing.\nHe wrote the plan for closing the sector boundary in Berlin, on the grounds that doctors, engineers and skilled workers leave through West Berlin every year in greater numbers than the Republic can train. He never talks ideology when he talks security, which reassures the generals and frightens the civilians. Hammerstein thinks the police should keep out of army business, and Heuss and Joos see him as the greatest danger to the Republic.§!"
 SOV_krcw_savinkov_desc:0 "§YBorn:§! §gJanuary 31st, 1879, in Kharkov, Kharkov Governorate, Russian Empire§!\n§YAlignment:§! §gAll-Russian National Union (National Populism)§!\n§YBackground:§! §LBoris Viktorovich Savinkov was born in Kharkov to a middling official's family and grew up in Warsaw. He joined the Combat Organisation of the Socialist-Revolutionaries early and helped plan the killings of Interior Minister Plehve in 1904 and Grand Duke Sergei in 1905, and later wrote the novel The Pale Horse under the name Ropshin. In 1917 he was commissar of the South-Western Front and deputy war minister of the Provisional Government.\nIn the civil war he went from terrorist to leader of the Northern Volunteer Army. Afterwards he founded the Union for the Defence of the Motherland and Freedom, set out National Populism, and took power through the ballot and the street, building the presidential Russian State. In the Second Weltkrieg he attacked the German Empire and Mitteleuropa from the east, annexed the Baltic states and Finland and made Schleicher sign the Treaty of Berlin, which made him leader of the Moscow Accord.\nAt home he revived the Okhrana as a Third Section answering to him alone, deals with opponents by administrative exile and has made the Patriarchate a department of state. He is past seventy and has named no successor. The generals, the civilians and the monarchists are all waiting for his place, and his health is the best-kept secret in the Kremlin.§!"
 SOV_krcw_nekrasov_desc:0 "§YBorn:§! §gNovember 1st, 1879, in Saint Petersburg, Saint Petersburg Governorate, Russian Empire§!\n§YAlignment:§! §gConstitutional Democrats (civilian faction)§!\n§YBackground:§! §LNikolay Vissarionovich Nekrasov was a priest's son who graduated with distinction from the Saint Petersburg transport institute and taught mathematics in Tomsk. After 1905 he joined the Kadets, made his name in the Third Duma as an energetic speaker, and after the February Revolution became the Provisional Government's Minister of Transport.\nHe hid from the Bolsheviks during the civil war, helped rebuild the Kadets as the KDS and led its left wing, and was the main architect of the Socialist-Revolutionary and Kadet coalition of the 1920s. Savinkov broke that coalition. Nekrasov neither fled nor was exiled; he stayed in the State Council as an old deputy who caused no trouble.\nHe has no army and no mass organisation. His value is that every faction knows he will purge nobody. If the generals and the Union deadlock after Savinkov dies, he is the likeliest caretaker. He wants to use that chance to put the government back under parliament, but most of his old party colleagues are aged or scattered.§!"
 SOV_krcw_shlyapnikov_desc:0 "§YBorn:§! §gAugust 30th, 1885, in Murom, Vladimir Governorate, Russian Empire§!\n§YAlignment:§! §gRussian trade unions in exile (Syndicalism)§!\n§YBackground:§! §LAleksandr Gavrilovich Shlyapnikov came from a poor Old Believer family, went to work at ten and became a metalworker. He educated himself, joined the Social Democrats early, formed a lifelong political alliance with Kollontai from 1908, and worked in French and British factories before the war. In 1917 he was the Bolsheviks' union man, and in the civil war he led the Workers' Opposition against militarisation and party control over local unions.\nIn 1921 he was sentenced to hard labour for treason. President Maklakov pardoned him in 1932 but barred him from office. He went back to union work, became one of the main voices against Savinkov and was forced abroad. Since then he has worked in Paris and London for the Russian unions in exile and is close to the CGT.\nHe holds that workers must run the factories themselves and that neither state nor party may go over the unions' heads. The Internationale needs someone who can sign for the Russian workers, and he has the highest standing among them. His weakness is just as plain: he has been gone so long that most young Russian workers know only his name.§!"
 SOV_krcw_sorokin_desc:0 "§YBorn:§! §gFebruary 4th, 1889, in Turya, Vologda Governorate, Russian Empire§!\n§YAlignment:§! §gCivilian reformers (National Democracy)§!\n§YBackground:§! §LPitirim Aleksandrovich Sorokin was the son of a poor Komi craftsman. A priest noticed his talent and paid for his schooling. He joined the Socialist-Revolutionaries at seventeen, served time in prison, and then did village fieldwork for the party across the northern provinces. In Saint Petersburg he studied under the sociologist Maksim Kovalevsky, and in the revolution he took part in the Northern Volunteer Army's operations.\nAfter the war he became Russia's best-known sociologist, served for years in the Ministry of Education and entered the Academy. The Savinkov regime needs his survey data and tolerates the awkward things he writes in the journals. Since the war he has led several large surveys of the villages, population and industrial workforce.\nHis case is that Russia cannot win an arms race against the Internationale and can only win on productivity and schooling, so the army budget must be cut in favour of village schools and credit. Ministers pass his memoranda around; the generals call it capitulation in academic language. He has no faction in the Union, only students.§!"
 SOV_krcw_vasilevsky_leader_desc:0 "§YBorn:§! §gSeptember 30th, 1895, in Novaya Golchikha, Kostroma Governorate, Russian Empire§!\n§YAlignment:§! §gMilitary stability faction (Military Rule)§!\n§YBackground:§! §LAleksandr Mikhaylovich Vasilevsky was a village priest's son, schooled for the church, who wanted to become an agronomist or surveyor. In 1915 he entered the Alekseyev Military School and fought on the South-Western Front. When the civil war began he went home and taught in village schools; conscripted into the Red Army in 1919, he went over to the Whites with his whole battalion.\nHe stayed in the army after the civil war, graduated from the General Staff Academy in 1931 as a student of General Markov, and wrote the new recruits' manuals at the Stavka. In the Second Weltkrieg he planned the offensives towards East Prussia and Vienna on the General Staff, and he became Chief of the General Staff after the war.\nHe gives no speeches, writes no books and lets no one hang his portrait in an office. He thinks the war took Russia to its limit and that the country now needs lorries, roads and ten years without fighting. Officers and soldiers trust him; Savinkov's Union cadres do not trust a general who never declares his loyalty. He has never said he wants the succession.§!"
 SOV_krcw_vladimir_romanov_desc:0 "§YBorn:§! §gAugust 30th, 1917, in Porvoo, Grand Duchy of Finland, Russian Empire§!\n§YAlignment:§! §gMonarchists (Monarchism)§!\n§YBackground:§! §LVladimir Kirillovich is the only son of Grand Duke Kirill Vladimirovich and Grand Duchess Victoria Melita, and a great-grandson of Alexander II. His parents had already fled to Finland when he was born, and he grew up abroad, mostly in Coburg in Germany. In 1924 his father proclaimed himself Emperor of All Russia in exile, and on his father's death in 1938 Vladimir became first in the Romanov line of succession.\nHe has never ruled anything or fought in a war. Savinkov will not let him return, but has never publicly denied his claim, because monarchist generals and bishops remain part of the regime. After the German Empire fell he left Coburg for a neutral country, and the Moscow monarchists keep in touch with him through the Church and old Guards connections.\nHe is mild-mannered, a poor speaker and not much interested in the details of politics. That is exactly what his backers like: a young, clean emperor with no purge to his name, around whom the army, the Church and the industrialists could unite once Savinkov is dead. His opponents point out that he knows almost nothing about present-day Russia.§!"
 SOV_krcw_vonsyatsky_desc:0 "§YBorn:§! §gJune 12th, 1898, in Warsaw, Kingdom of Poland, Russian Empire§!\n§YAlignment:§! §gUnion Combat Squad hardliners (National Bolshevism)§!\n§YBackground:§! §LAnastasy Andreyevich Vonsyatsky comes from an impoverished, Russified Polish-German noble family. His father, a gendarme officer, was assassinated by Polish socialists in 1910, which left him with a lifelong hatred of socialism. In the civil war he served in Denikin's cavalry, and he and his men once killed three Jewish civilians suspected of spying.\nAfter the war he joined the monarchist far right and organised the Russian Legion of Archangel Michael. When it was banned he went over to Savinkov's Union for the Defence of the Motherland and Freedom and took charge of its combat squads. He made his name leading street fights with the police during the Tambov unrest. Savinkov uses him and watches him.\nHe wears uniforms of his own design, leads men recruited off the street and keeps repeating one line: \"Savinkov is too soft.\" He thinks stopping on the Elbe in 1944 was a historic mistake and wants to reopen the war before the Internationale finishes rebuilding. The generals despise him and the civilians fear him; his support comes from jobless veterans and the Union's provincial rank and file.§!"
 RAJ_krcw_scindia_desc:0 "§YBorn:§! §gJune 26th, 1916, in Gwalior State, Central India Agency, British India§!\n§YAlignment:§! §gChamber of Princes (Princely Federation)§!\n§YBackground:§! §LJiwajirao Scindia is the son of Maharaja Madho Rao Scindia of Gwalior. When his father died in 1925 he was nine, and he inherited the largest Maratha state in central India under a council of regency. He was privately educated in Gwalior and took up his full powers in 1936.\nAfter the British revolution India broke apart into the Princely Federation, the India Commune, Hyderabad and others. Scindia rallied the Chamber of Princes against \"the Reds\", accepted Russian arms and advisers in the early 1940s and waged a war of unification that destroyed the India Commune in 1947 and joined the subcontinent into one state again. That made him President of the Chamber of Princes of the Indian Federation and Moscow's ally.\nThe Federation is ruled jointly by princes and soldiers. Each state keeps its own courts, taxes and troops, tenancy in the villages is untouched, and famine in Bengal and peasant risings elsewhere have never stopped. He opposes land reform, believing it would take away the Chamber's reason to exist. He is in his early thirties and has never lost a war, but the reformers in the Chamber, the Punjab landlords and the Bombay industrialists are all waiting for him to give ground.§!"
 RAJ_krcw_scindia_heir_desc:0 "§YBorn:§! §gSeptember 18th, 1895, in Sadodar, Nawanagar State, Kathiawar Agency, British India§!\n§YAlignment:§! §gChamber reformers (Paternalistic Conservatism)§!\n§YBackground:§! §LDigvijaysinhji is the nephew of the Jam Sahib of Nawanagar, the cricketer Ranjitsinhji. He was educated at Rajkumar College in Rajkot and in England, and from 1919 served for years as an army officer. When his uncle died in 1933 he succeeded him as Jam Sahib of Nawanagar.\nAfter the British revolution he was among the first in the Chamber of Princes to argue for uniting the states under one government. In the war of unification he commanded the state forces on the Kathiawar and Gujarat front, and since then he has led a small reform group in the Chamber.\nHis argument is blunt towards his peers: if the princes do not give up part of their judicial and taxing powers of their own accord, parliament or the peasants will sooner or later take all of it. He backs limited land reform and a written constitution but insists the Chamber keep control of the army. On Tibet he is a hawk, believing a Chamber that holds the northern frontier is harder to abolish. Scindia keeps him close and keeps him out of decisions.§!"
 RAJ_krcw_tata_desc:0 "§YBorn:§! §gJuly 29th, 1904, in Paris, Seine, French Republic§!\n§YAlignment:§! §gBombay industrialists (Liberal Conservatism)§!\n§YBackground:§! §LJehangir Ratanji Dadabhoy Tata comes from the Parsi industrial family of Bombay. His mother was French and French was his first language. He attended a French lycée in Paris, then schools in Bombay, Yokohama and England, and entered Cambridge to study engineering in 1923. After the British revolution he returned to India and gave up his French citizenship. In 1929 he took India's first civil pilot's licence, went on to found Tata Air Lines, and has chaired the Tata group since 1938.\nDuring the Indian civil war the Tata steelworks and mills barely kept going between the two sides. Since unification the group has been the Federation's largest steel and aviation concern, and it supplies vehicles and repair shops to the Russian mission.\nHis one political demand is that the Federation become a country that can build its own things. For that he wants a single tariff, railway and power system, and opposes both the princely states' separate taxes and the grain duties that protect landlords in parliament. Princes and parliament both need his money; he has never stood for election. His weakness is that he has no base at all in the villages, and the labour movement treats him as its chief opponent.§!"
 RAJ_krcw_tiwana_desc:0 "§YBorn:§! §gAugust 7th, 1900, in Chak Muzaffarabad, Province of the Punjab, British India§!\n§YAlignment:§! §gPunjab Unionist Party (National Democracy)§!\n§YBackground:§! §LKhizar Hayat Tiwana comes from one of the most powerful landed families of the Punjab; his father Umar Hayat Khan was head of the Tiwana clan. He was educated at Aitchison College in Lahore and served with the Indian Army in the Third Afghan War of 1919.\nThe Tiwanas are a pillar of the Punjab Unionist Party. With his father's influence and the backing of the Noon clan he became party leader before the 1934 elections, won them and became Premier of the Punjab. The Unionists let Muslim, Hindu and Sikh landlords share the province's revenue and offices. That arrangement spared the Punjab much of the civil war's damage and let it enter the Federation as a whole province.\nHe sees the Federation as a bargain between provinces, wants the provinces to keep their own finances, and opposes both centralisation in Delhi and any reform that touches landlords' land. The Daultana and Hayat families inside the party have long wanted him replaced, and Sikh peasants and the urban Muslim Leaguers are growing tired of the landlords' alliance.§!"
 RAJ_krcw_wavell_holdover_desc:0 "§YBorn:§! §gMay 5th, 1883, in Colchester, Essex, England§!\n§YAlignment:§! §gOld Indian Army officer corps (Liberal Conservatism)§!\n§YBackground:§! §LArchibald Percival Wavell came from a military family, went to Winchester and Sandhurst, joined the Black Watch in 1901 and served in the Boer War and on the North-West Frontier. He lost his left eye at Ypres in 1915, then served as liaison officer with the Russian army in the Caucasus and on Allenby's staff in Palestine.\nAfter the British revolution most British officers of the Indian Army went home or into exile. Wavell stayed. He worked as a staff officer and instructor in the Princely Federation's army and has never publicly explained why. In the war of unification he planned logistics and mountain operations, and afterwards became adviser to the federal Ministry of Defence; the supply-line surveys for the Himalayan frontier were done under him.\nHe has no political ambitions and no faction, and both princes and parliament regard him as a man who can hold things for a while. His advice on Tibet has always been cool: the frontier can be held, but the Federation cannot afford a long war on the plateau. Indian officers respect him; nationalists think an Englishman has no place in the Defence Ministry in Delhi.§!"
 JAP_krcw_kishi_desc:0 "§YBorn:§! §gNovember 13th, 1896, in Yamaguchi, Yamaguchi Prefecture, Empire of Japan§!\n§YAlignment:§! §gNational Spirit League (Nationalism)§!\n§YBackground:§! §LKishi Nobusuke was born into the Sato family of Yamaguchi and adopted into his father's original family, the Kishi; his younger brother Sato Eisaku also went into politics. He graduated in law from Tokyo Imperial University in 1920, entered the Ministry of Agriculture and Commerce and soon became the leading \"reform bureaucrat\" of the state-directed economy.\nDuring China's Northern Expedition and the Fengtian war he ran Japanese industrial development in Manchuria and then munitions production at home. After the Qingdao armistice of 1944 Japan lost Korea and Manchuria and both the army and the parties were discredited. As a civilian he escaped the reckoning, and in the name of economic reconstruction he took control of the Ministry of Commerce and Industry and the National Spirit League.\nHe governs through the bureaucracy; elections are a formality. He wants to restore Japan's industry and navy, hold Taiwan and stay close to Russia, but not let generals like Ishiwara Kanji drag the country into another war with China. Yoshida's men and the socialists in the Diet oppose his controls, and the revanchists in the army find him too cautious.§!"
 JAP_krcw_ishibashi_desc:0 "§YBorn:§! §gSeptember 25th, 1884, in Tokyo, Tokyo Prefecture, Empire of Japan§!\n§YAlignment:§! §gDiet liberals (Liberal Democracy)§!\n§YBackground:§! §LIshibashi Tanzan is the son of the Nichiren priest Sugita Tansei. He grew up in Yamanashi, partly boarded at a temple as a boy, graduated in philosophy from Waseda in 1907 and joined the Toyo Keizai Shinpo in 1911, later becoming its chief editor and president.\nAs early as the 1920s his editorials argued for giving up Manchuria and Korea, a position he called \"Small Japanism\": the colonies cost more than they returned, and Japan's future lay in trade and its home market. The army and the parties alike dismissed him as a scholar out of step with the times. When Japan lost the war in China in 1944, and with it Korea and Manchuria, his old editorials were reprinted and he became the standard-bearer of the Diet liberals.\nHe wants a Japan without colonies that grows rich on trade and home consumption: lower military spending, renewed commerce with Nanjing and Paris, and a Ministry of Commerce that loosens its grip on business. He differs from Kishi on the controlled economy and from Yoshida on Russia. His health is poor, and his skill at party organisation falls well short of the fame of his writing.§!"
 JAP_krcw_katayama_desc:0 "§YBorn:§! §gJuly 28th, 1887, in Tanabe, Wakayama Prefecture, Empire of Japan§!\n§YAlignment:§! §gSocial Masses Party (Social Democracy)§!\n§YBackground:§! §LKatayama Tetsu was born in Tanabe, Wakayama, graduated in law from Tokyo Imperial University in 1912 and practised in Tokyo, giving legal aid to tenant farmers, workers and poor clients. A devout Christian, he was strongly influenced by Christian socialists such as Abe Isoo.\nIn 1926 he helped found the Social Democratic Party, and after 1932 he was a mainstay of the Social Masses Party. During the years of Japan's intervention in China his party was watched by the police and its meetings were often banned. After the defeat of 1944 veterans, jobless workers and landless peasants poured into the cities, the party grew again in the unions and tenant associations, and he became its leader.\nHe wants a parliamentary Japan: legal unions, land for tenant farmers, an army answerable to the cabinet, and a constitution stating that sovereignty lies with the people. He opposes Kishi's controlled economy and rearmament. He is mild and no fighter; the party's left thinks he is too polite to the capitalists, and the right-wing groups on the streets of Tokyo call him an agent of the Internationale.§!"
 JAP_krcw_yoshida_desc:0 "§YBorn:§! §gSeptember 22nd, 1878, in Tokyo, Tokyo Prefecture, Empire of Japan§!\n§YAlignment:§! §gConservative merger faction (Conservative Democracy)§!\n§YBackground:§! §LYoshida Shigeru is the son of the Freedom and People's Rights activist Takeuchi Tsuna and was adopted as a small child by the wealthy Yokohama merchant Yoshida Kenzo. He graduated from Tokyo Imperial University in 1906, entered the Foreign Ministry and married Yukiko, daughter of the elder statesman Makino Nobuaki. He served as consul in Mukden and Tianjin, as vice-minister for foreign affairs in the late 1920s and then as ambassador to Italy.\nDuring Japan's intervention in China he belonged to the diplomats who opposed widening the war and was pushed out of power by the army. After the defeat of 1944, as a former diplomat and Makino's son-in-law, he became the central figure in the talks to merge the conservative parties in the Diet, and he leads the conservative merger faction.\nHe wants armaments kept to a minimum and effort put into industry and the merchant fleet, letting others bear the cost of confrontation. He trusts neither Moscow nor Paris and wants to trade with both blocs. He shares the conservative camp with Kishi but opposes a Ministry of Commerce that controls everything, and opposes soldiers in politics. He is bad-tempered and looks down on party politicians; the party holds together on his prestige alone.§!"
 CHI_krcw_zhou_enlai_desc:0 "§YBorn:§! §gMarch 5th, 1898, in Shanyang County, Huai'an Prefecture, Jiangsu Province, Great Qing§!\n§YAlignment:§! §gKuomintang (Reorganised), Revolutionary Committee faction (Revolutionary Socialism)§!\n§YBackground:§! §LZhou Enlai's family came from Shaoxing in Zhejiang; he was born in Huai'an into declining gentry, adopted as a child by an uncle, and grew up poor. At Nankai School in Tianjin he read New Youth and became one of the student movement's best speakers and writers; he later married Deng Yingchao. He went to France to see its revolution, returned in 1924 and joined the new Whampoa Military Academy as deputy director of its Political Department, teaching the Three Principles and recruiting left-wing cadets.\nWhen the Northern Expedition failed at Jinhua he stayed in China for the early insurgency and organised an intelligence group called the Red Squad. Nearly killed in the failed Shanghai Uprising of 1932, he was smuggled to Europe and made director of the Whampoa Political Department in exile. In 1936 he returned with Wang Jingwei from Paris to Longyan and ran political work through the Second Northern Expedition and the Fengtian war. After Wang died in 1944, Zhou led the Revolutionary Committee faction, allied with Chen Gongbo's radical wing of the Reorganisation Comrades Association, to victory over Gu Mengyu's moderates in 1946, became Chairman of the National Government and of the Central Executive Committee, and the next year took the Republic of China into the Internationale.\nHe wants a thorough land law and fast industrialisation, leaves economic construction to Chen Gongbo, and keeps Gu Mengyu and the moderates in government, because he believes that if the party splits the warlords will come back. The Whampoa generals respect him without always obeying, the Syndicalist radicals find him too slow, and the local gentry are waiting for the land law to go wrong.§!"
 CHI_krcw_chen_gongbo_desc:0 "§YBorn:§! §gOctober 19th, 1892, in Guangzhou, Guangdong Province, Great Qing§!\n§YAlignment:§! §gKuomintang Reorganisation Comrades Association, radical wing (Revolutionary Socialism)§!\n§YBackground:§! §LChen Gongbo took part in the Xinhai Revolution as a young man, graduated in philosophy from Peking University in 1920 and, back in Guangzhou, helped found the Guangdong branch of the Chinese Syndicalist Party. He left it in 1922 over his support for Chen Jiongming, went to Columbia University the following year, and joined the Kuomintang in 1925 on Liao Zhongkai's introduction.\nAfter the Northern Expedition failed he went into exile in France with the party, co-founded the Reorganisation Comrades Association with Gu Mengyu, edited the Revolutionary Critic and became Wang Jingwei's closest aide. He reads the Three Principles through historical materialism, talks constantly of \"contradiction\" and \"totality\", and the former syndicalists in the Association gathered round him as its radical wing. He returned with Wang in 1936 and ran finance and the takeover of the cities during the Second Northern Expedition. After Wang's death he took the radicals over to Zhou Enlai, and together they defeated Gu Mengyu's moderates in 1946. Since then he has sat on the CEC standing committee and chaired the Construction Commission, which is drafting the first five-year programme.\nHe wants heavy industry in public hands, materials allocated by plan, and a party that becomes the workers' and peasants' own organisation, and he is close to the Syndicalist Party's radicals. The moderates call him a Marxist in a Kuomintang uniform; the Whampoa generals think he knows nothing of soldiering. Many see him as Zhou's likeliest successor. He never takes up the subject himself.§!"
 CHI_krcw_gu_mengyu_desc:0 "§YBorn:§! §gOctober 18th, 1888, in Wanping County, Shuntian Prefecture, Zhili Province, Great Qing§!\n§YAlignment:§! §gKuomintang Reorganisation Comrades Association, moderate wing (Democratic Socialism)§!\n§YBackground:§! §LGu Mengyu studied in Germany, first electrical engineering and then political economy, and speaks English, French and German. Back in China he headed the economics department and was dean of studies at Peking University; Cai Yuanpei and Li Shizeng brought him into the Kuomintang, and he edited the Qianjin newspaper.\nAfter the Northern Expedition failed he fled to Paris with the Central Committee and co-founded the Reorganisation Comrades Association with Chen Gongbo, though the two disagreed from the start: Chen spoke of class struggle, while Gu held that China lacked the classes of an industrial society and that class war there meant nothing. He wants the peasants organised into associations that carry land reform and local self-government; he also opposes mass movements and holds that the revolution needs the party's firm leadership. He returned with Wang Jingwei in 1936 and ran the railways and communications. After Wang's death he led the Association's moderate wing, and lost the 1946 contest to the alliance of Zhou Enlai and Chen Gongbo.\nHe wants land reform in stages with compensation for landlords, protection for urban commerce and industry, and cooperation with the Internationale without giving up China's independence. He still sits on the Central Executive Committee and is the man the urban chambers of commerce, the intellectuals and the local gentry trust most. Zhou needs him to keep those people steady; the radicals think he will sooner or later take the moderates out to form a party of their own.§!"
 CHI_krcw_deng_yanda_desc:0 "§YBorn:§! §gMarch 1st, 1895, in Huizhou, Guangdong Province, Great Qing§!\n§YAlignment:§! §gKMT Provisional Action Committee and Whampoa Classmates Association (Democratic Socialism)§!\n§YBackground:§! §LDeng Yanda came from a family of scholars in Huizhou; his father was a village teacher under the Guangxu Emperor. He joined the Xinhai Revolution in 1911 and entered Baoding Military Academy in 1916 together with Ye Ting. He stayed with Sun Yat-sen through Chen Jiongming's revolt, returned to Guangdong with the Kuomintang in 1923, became deputy head of the training department at Whampoa and went to study the Commune of France. After Sun died he came home in 1926 as Whampoa's director of education to prepare the Northern Expedition.\nAfter the Expedition failed he went secretly to the MinGan insurgent zone and became the go-between for Song Qingling and Li Jishen; after the failed Shanghai Uprising of 1932 he and Song founded the Provisional Action Committee. He held that revolution must start with peasants and workers and set out the \"peasant and worker policy\". In the Second Northern Expedition he commanded on the southern Jiangxi and Xiang river axes, and he organised the Whampoa graduates into the Whampoa Classmates Association.\nHe no longer holds a field command, but the Association still follows him. He wants land to the tiller and the party in command of the gun, and treats the Syndicalist Party as a partner to be watched. He and Zhou Enlai are old Whampoa colleagues, and he is the one man who can make the army obey Zhou. Some in the Military Commission worry that if he ever breaks with Zhou the army will follow him.§!"
 CHI_krcw_li_jishen_desc:0 "§YBorn:§! §gNovember 5th, 1885, in Wuzhou, Guangxi Province, Great Qing§!\n§YAlignment:§! §gGuangdong-Guangxi army elders (Social Democracy)§!\n§YBackground:§! §LAs a boy Li Jishen studied at Wuzhou Middle School under Hu Hanmin. In 1904 he entered the Liangguang Accelerated Army Academy in Guangdong and went on north to the Beiyang Army Officers' Academy, later Baoding. When the Xinhai Revolution broke out in 1911 he joined the revolutionary army in Jiangsu, then returned to Beijing to finish his studies.\nIn 1920 his classmate Deng Keng invited him to Guangdong, where he rose in the Guangdong Army and became Deputy Headmaster of Whampoa. When the Northern Expedition began he was Governor of Guangdong and acting head of Whampoa; when it failed he was blamed for losing Guangzhou to the Germans. While most of the party fled to France he stayed in the Fujian-Jiangxi hills to gather the remnants of the National Revolutionary Army, and after the 1932 Shanghai Uprising failed he remained one of the most respected senior soldiers. In the Second Northern Expedition he was Chief of the General Staff, coordinating the armies.\nHe has great standing among old generals and the regional powers of Guangdong, Guangxi and Fujian, wants coalition government and local self-rule, and is the party figure most willing to deal with the Democratic League and the Rural Reconstruction group. The radicals see him as the very kind of local power the land law is meant to break; he fears that centralisation in Nanjing will drive the provinces into revolt.§!"
 CHI_krcw_song_qingling_desc:0 "§YBorn:§! §gJanuary 27th, 1893, in the Shanghai International Settlement, Jiangsu Province, Great Qing§!\n§YAlignment:§! §gKMT Provisional Action Committee (Revolutionary Socialism)§!\n§YBackground:§! §LSoong Ching-ling is the second daughter of the merchant and missionary Charlie Soong. She graduated from Wesleyan College in Georgia in 1913 and in 1915, against her parents' wishes, married Sun Yat-sen in Tokyo. When Chen Jiongming shelled the presidential residence in 1922 she insisted that Sun escape first, suffered a miscarriage breaking out, and never had children. She was at Sun's bedside when he died in 1925.\nAfter the Northern Expedition failed she went with the left-wing Kuomintang generals to the MinGan insurgent zone and travelled between it and Shanghai raising money and arms for the guerrilla war. In 1932 she and Deng Yanda founded the Provisional Action Committee. Through the Second Northern Expedition and the Fengtian war she ran women's work and medical relief, and went to Paris several times for Nanjing to seek loans and aid.\nShe holds no post in the Central Executive Committee, but the peasant associations, the women's movement and the overseas Chinese all follow her. The Women's Federation she leads runs literacy classes in the counties. She opposes compromise with the landlords and opposes purging the party's moderates. Both sides ask her to speak; she rarely does. She has no organisation or troops of her own; her influence rests on being Sun's widow and on her long standing.§!"
 CHI_krcw_zhang_xueliang_desc:0 "§YBorn:§! §gJune 3rd, 1901, in Bajiaotai, Shengjing District, Great Qing§!\n§YAlignment:§! §gOld Fengtian clique (National Democracy)§!\n§YBackground:§! §LZhang Xueliang is the eldest son of the Fengtian warlord Zhang Zuolin. Unlike his father he had private tutors and took a keen interest in Western ideas. He graduated from the artillery course of the Fengtian Military Academy and was at once made commander of the Northeast guards brigade. After Fengtian lost the First Zhili-Fengtian War he negotiated the peace, then ran the Northeast Aviation Office and bought his father a modern air force. Fengtian took Beijing in the Second Zhili-Fengtian War, but the Zhili clique retook it a few years later.\nWhen the Zhili clique restored Puyi in Beijing in 1927, Fengtian held the land beyond the Great Wall and never recognised the court. After Beijing fell in 1940 and the Qing came to an end, Zhang would not bow to Nanjing and, with Japanese backing, fought the National Revolutionary Army in North China and Liaoxi for four years. The Kwantung Army's main force was destroyed at Liaoxi in 1943, the Qingdao armistice of 1944 took Manchuria out of Japanese control, and the Fengtian clique fell apart. He went into exile abroad.\nHe still has old followers scattered across the Northeast and abroad, and a reputation for opium and gambling. When the Moscow Accord needs a Chinese government that is not the Kuomintang, he is one of the few men with old troops to call on and a name that still carries weight in the Northeast. The Northeast's peasants and workers remember Fengtian's levies, and the Kuomintang sees him as the man who let the Japanese in.§!"
 USA_krcw_huey_long_desc:0 "§YBorn:§! §gAugust 30th, 1893, in Winnfield, Louisiana, United States of America§!\n§YAlignment:§! §gUnion Party§!\n§YBackground:§! §LHuey Pierce Long was born to a farming family in Winnfield in northern Louisiana. He worked as a travelling salesman and passed the bar in 1915 after a single year of law courses. He made his name on the state Railroad Commission by fighting Standard Oil, was elected governor in 1928, and gave Louisiana roads, free schoolbooks and hospitals while turning the legislature, the courts and the police into the Long family machine. People called him the Kingfish.\nWhen the crisis of the 1936 election became a civil war, he rallied the farmers of the South and the Midwest behind Share Our Wealth. After Washington fell in 1941 he ruled America west of the Mississippi from his capital in New Orleans. From 1943 Russian rifles and trucks came into Texas through Tampico, Patton's armies used them to push the syndicates back across the river, and in 1946 both sides signed the St. Louis ceasefire.\nIn 1949 he was \"elected\" president for the fourth time. He keeps the regime going on oil, cotton and Russian loans, and his constitution still claims all of America, but he knows his army cannot cross the river. His health is failing and he has named no successor: his brother Earl knows how to make a deal, his son Russell is young, and southern generals such as Patton and Moseley do not think the succession is a matter for politicians.§!"
 USA_krcw_earl_long_desc:0 "§YBorn:§! §gAugust 26th, 1895, in Winnfield, Louisiana, United States of America§!\n§YAlignment:§! §gUnion Party§!\n§YBackground:§! §LEarl Kemp Long is Huey Long's younger brother by two years. He worked as a salesman, studied law in New Orleans, and spent years working the parishes and bringing in votes for his brother. In 1932 Huey would not let him run for lieutenant governor, the two broke openly over it, and it took them years to make up.\nDuring the civil war, while Huey was busy with the front and the fight over Washington, Earl stayed in Louisiana to run the state government and later became governor. Once New Orleans became the capital, every deal over the legislature, the port, the oilfields and the casinos went through his hands. He is crude, a gambler and careless of what he says, but he remembers what every parish boss owes him and knows what every general wants.\nHe has little interest in reuniting America and more in budgets, votes and the price of cotton. While Huey was well, people saw Earl as the brother who never amounted to much; now that Huey's health is failing, he is the only man who can keep the governors, the legislature and the army together at once. His weaknesses are just as plain: the southern generals look down on him, the Russians do not know him, and the rumours of his drinking and instability have never stopped.§!"
 USA_krcw_moseley_desc:0 "§YBorn:§! §gSeptember 28th, 1874, in Evanston, Illinois, United States of America§!\n§YAlignment:§! §gSouthern generals§!\n§YBackground:§! §LGeorge Van Horn Moseley graduated from West Point in 1899 and went to the Philippines as a cavalry second lieutenant, fighting the insurgents there. He then spent most of his career on staffs, completing the Army Staff College and the Army War College, and in 1916 handled logistics for Pershing's expedition into Mexico. In 1921 he helped Dawes set up the Bureau of the Budget and was made brigadier general, then ran industrial preparedness at the War Department and rose to major general. In 1934 he fell out with the Chief of Staff, Douglas MacArthur.\nWhen the civil war began he left the Federal Army and joined Long's southern government. Long's side had few men who could organise a general staff, and Moseley served as its chief of staff in the early war, turning state National Guards and volunteer militias into regular divisions. He speaks openly against Jews and immigrants and regards syndicalism as a foreign conspiracy.\nHe is past seventy and no longer commands troops, but he remains the public face of the southern generals, whom Patton and others put forward as the symbol of \"order\". He believes that America after Huey Long should not be left to politicians, and in a succession crisis he is ready to suspend the constitution in the name of a committee. His weaknesses are his age and his reputation: young officers respect him, few want to fight another civil war under him, and the politicians in New Orleans have always watched him closely.§!"
 PSA_krcw_warren_desc:0 "§YBorn:§! §gMarch 19th, 1891, in Los Angeles, California, United States of America§!\n§YAlignment:§! §gRepublican Party (Progressive)§!\n§YBackground:§! §LEarl Warren's father was a Norwegian immigrant who repaired rolling stock for the Southern Pacific Railroad. He grew up in Bakersfield, graduated from the law school of the University of California at Berkeley in 1914, and made his name as Alameda County prosecutor going after bribery and bootlegging.\nAfter the Washington putsch of 1936 he stayed in California and helped the Congress in Sacramento set up its wartime courts. He was elected Attorney General of California in 1939 and Governor in 1942. He backed the first renewal of the War Powers Act and later regretted it, believing the military districts were turning the Constitution into waste paper. In 1948 he ran for president on repealing the Act, beat the Democrat Clarence Martin, and was sworn in in January 1949.\nHe wants civilian government restored in the states, more public works and state universities, and a waterfront policy of bargaining with the unions while enforcing the law. He trusts neither New York nor New Orleans and holds that the Constitution survives only in Sacramento. Conservative Republicans think him too much like a Democrat, the Presidio men think he knows nothing of war, and all he has to restrain MacArthur is Congress's power of the purse and Marshall's loyalty.§!"
 PSA_krcw_martin_desc:0 "§YBorn:§! §gJune 29th, 1886, in Cheney, Washington, United States of America§!\n§YAlignment:§! §gDemocratic Party§!\n§YBackground:§! §LClarence Martin came from a family of millers in eastern Washington. After graduating from the University of Washington he went home to run the family flour mill in Cheney and served as its mayor. Elected Governor of Washington in 1932, he pushed the building of the Grand Coulee Dam and put the unemployed to work on public works.\nIn the civil war he was one of the first governors in the Northwest to recognise the Congress in Sacramento, and he was re-elected. In 1948 he was the Democratic candidate for president, promising more New Deal relief and water projects and more caution than Warren over the War Powers Act, and he lost.\nHe still leads the Democrats in Congress. The party is rooted in the Northwest's farms and unions, and if Warren and the Presidio men fall out, or the strikes on the waterfront get out of hand, the Democrats have a chance of winning back the presidency at the next election.§!"
 PSA_krcw_macarthur_desc:0 "§YBorn:§! §gJanuary 26th, 1880, in Little Rock, Arkansas, United States of America§!\n§YAlignment:§! §gThe Presidio (Western Defense Command)§!\n§YBackground:§! §LDouglas MacArthur, son of Lieutenant General Arthur MacArthur, grew up in army posts across the West. He graduated first in his class from West Point in 1903, joined the Corps of Engineers, served in the Philippines and took part in the occupation of Veracruz in 1914. From 1919 he was Superintendent of West Point and reformed its curriculum; in 1925 he became the youngest major general in the Army, and later its Chief of Staff.\nIn the crisis of the 1936 election he carried out War Plan White and took Washington with his troops. The governors of the West Coast states and the congressmen who reached Sacramento set up a government of their own, and the Pacific Fleet went with the governors; only a few ships loyal to him mutinied and sailed east. He held Washington for five years. When it fell in the winter of 1941 he neither surrendered nor went to New Orleans, but broke out to the west with the remains of the Federal Army and the War Department's files. Sacramento was short of troops, so Congress pardoned him and made him commander of the Western Defense Command.\nThe War Powers Act of 1942 put the port cities and the Sierra passes under his command, and the Presidio in San Francisco became a second centre of power beside Sacramento. Wainwright, Halsey and the other officers who came west with him are known as the Presidio men, and they believe Congress cannot hold the West Coast. President Warren has promised to repeal the Act, and Marshall has long wanted him retired. He is nearly seventy, and the dockers of San Francisco and Seattle have never been on his side.§!"
 WCA_krcw_reuther_desc:0 "§YBorn:§! §gSeptember 1st, 1907, in Wheeling, West Virginia, United States of America§!\n§YAlignment:§! §gCombined Syndicates of America (Builders)§!\n§YBackground:§! §LWalter Reuther was born in Wheeling to a German-American socialist family; his father organised the brewery workers. At nineteen he went to Detroit and worked at Ford as a tool and die maker. From 1932 he worked in British and French factories as a representative of the Socialist Party and saw for himself how syndicalist organisation worked. Back home he led United Auto Workers Local 174, and in 1936 Ford's thugs beat him badly in the Battle of the Overpass.\nWhen the revolution broke out he was elected chairman of the Detroit Commune and organised production across the Steel Belt; most factories on the east bank passed to his federation. After the 1946 ceasefire he drafted the Charter of Industrial Democracy, under which plant plans are drawn up jointly by shop committees and district federations, and was elected chairman of the Combined Syndicates.\nHe wants to build the country east of the Mississippi into a model of industrial democracy before any talk of crossing the river, because Appalachia has been burned out and the syndicates cannot afford a war they would not win. Foster and Cannon of the Liberationists accuse him of forgetting the sharecroppers across the river for the sake of Detroit, and the old IWW hands say his charter is breeding a new bureaucracy. His power rests on a majority in the Congress, and that majority is not secure.§!"
 WCA_krcw_cannon_desc:0 "§YBorn:§! §gFebruary 11th, 1890, in Rosedale, Kansas, United States of America§!\n§YAlignment:§! §gCombined Syndicates of America (Liberationists)§!\n§YBackground:§! §LJames Patrick Cannon was born to an Irish-American working family in Kansas. He joined the IWW in 1911 and organised strikes across the Midwest under Big Bill Haywood. As a young man he admired the Bolsheviks; after the Russian revolution failed and the French syndicalists won, he turned to a socialism built on local self-management.\nHe held senior posts in the Socialist Party of America until 1932, when Lovestone's faction removed him as Executive Secretary. He then lived in France and Britain for years as the party's representative and came to know the federation leaders in Paris and London. When the civil war began he came home to receive the foreign volunteers and the Internationale's advisers, and made his name as an administrator.\nSince the ceasefire he and Foster have led the Liberationists, who want to cross the Mississippi as soon as possible: union organisers on the far bank are being executed by Long's men, and every year of waiting is another year that the sharecroppers and oil workers of the west bank live under Long's machine. He has told the Congress that the ceasefire is only an excuse for not being ready. His difficulty is that the workers of the east bank are tired of war, and the arms and transport a crossing would need depend on Paris and Canada.§!"
 WCA_krcw_flynn_desc:0 "§YBorn:§! §gAugust 7th, 1890, in Concord, New Hampshire, United States of America§!\n§YAlignment:§! §gIWW traditionalists§!\n§YBackground:§! §LElizabeth Gurley Flynn grew up in the Bronx, the daughter of Irish-American socialists. She gave her first public speech at fifteen at a socialist club in Harlem and became an IWW organiser, working in the Lawrence textile strike of 1912 and the Paterson silk strike of 1913. She was arrested ten times and became known as the Rebel Girl. In 1920 she helped found the American Civil Liberties Union to organise legal defence for strikers.\nOn the eve of the civil war she helped organise the great longshore strike on the West Coast. During the war she spoke for conscription in the Central Committee, which angered many of its conscientious objectors and won her the trust of the miners and dockers at the front. After MacArthur took the West Coast, many of her old comrades stayed on the docks of San Francisco and Seattle.\nShe speaks for the oldest tradition in the Combined Syndicates: abolish the lines between the industrial federations, one big union for all of North America, and production run by the local communes. She opposes Reuther's charter for handing power to the district federation offices, and she does not agree with Cannon in staking everything on a crossing. Her supporters are many but scattered through the mining districts and the ports, and they rarely add up to a majority in the Congress.§!"
 CAN_krcw_buck_desc:0 "§YBorn:§! §gJanuary 6th, 1891, in Beccles, Suffolk, England§!\n§YAlignment:§! §gWorkers' Unity League§!\n§YBackground:§! §LTim Buck left school at fourteen to become an apprentice, emigrated to Canada in 1910 and worked as a machinist in Toronto, where he joined the machinists' union. In the 1920s he organised in Ontario's factories, and in 1929 he founded the Workers' Unity League to organise the unskilled workers the old unions would not take. In 1931 he and other League leaders were jailed under Section 98 of the Criminal Code and held in Kingston Penitentiary until 1934.\nWhen the exiled government sent troops into New England in 1938, Buck opposed it publicly, saying Ontario's workers would pay for the war. After the defeats at Albany and Buffalo the government widened conscription in the spring of 1940, Quebec refused, Montreal and Hamilton went on general strike, and troops bound for the front stopped at Kingston and elected soldiers' committees. Buck led the Workers' Unity League into the strike committees, and the King fled a second time, to Melbourne.\nHe is one of the founders and the present leader of the Syndicalist Republic of Canada, the Internationale's supply route to the Combined Syndicates. He wants active support for the syndicates east of the Mississippi and a hard line against Long's America. At one end of the League, Woodsworth and Coldwell fear Canada being dragged into a war it cannot afford; at the other, men want him to push the revolution across the border. His position depends on keeping both inside the League.§!"
 CAN_krcw_buck_hard_desc:0 "§YBorn:§! §gJanuary 6th, 1891, in Beccles, Suffolk, England§!\n§YAlignment:§! §gWorkers' Unity League (hard line)§!\n§YBackground:§! §LTim Buck came to Toronto from England in 1910 and worked as a machinist. He founded the Workers' Unity League in 1929 and was jailed under Section 98 of the Criminal Code in 1931, serving in Kingston Penitentiary until 1934. In the spring of 1940, after the intervention in New England failed, conscription set off a general strike and the Kingston mutiny; he led the League into the strike committees, the King fled to Melbourne, and the Syndicalist Republic was born.\nThat intervention taught him that a neighbour willing to send troops can kill a revolution at birth. In 1938 the neighbour was Canada; next time it will be Long's America. As Russian arms reached Long through Mexico, he moved to the end of the League that wants to export the revolution.\nOn the hard line he believes Long will come sooner or later, and that rather than wait Canada should become the arsenal of the North American revolution now: arm the syndicates east of the Mississippi, build gunboats on the Great Lakes and send volunteers across the border. The cost is a larger army, heavier requisitions and discontent on the prairies. Woodsworth opposes him openly, McEwen will keep the underground line open but send no troops, and Murray wants the money spent on the navy.§!"
 CAN_krcw_woodsworth_desc:0 "§YBorn:§! §gJuly 29th, 1874, in Etobicoke, Ontario, Dominion of Canada§!\n§YAlignment:§! §gWorkers' Unity League (pacifists)§!\n§YBackground:§! §LJames Shaver Woodsworth, son of a Methodist minister, grew up in Manitoba, graduated from Wesley College in Winnipeg and studied theology at Oxford. For years he ran All People's Mission in Winnipeg's immigrant quarter, where he took up the Social Gospel. He opposed conscription in 1917, left the ministry the next year over his pacifism and worked as a longshoreman on the Vancouver docks. During the Winnipeg General Strike of 1919 he wrote for the strikers' paper and was arrested for seditious libel; the charges were later dropped. Elected to Parliament for Winnipeg in 1921, he spoke for the unemployed and the immigrants.\nWhen the exiled government sent troops into New England in 1938, he was one of the few members to vote against it. After the strikes and mutiny of 1940 he joined the new Republic, on the grounds that the war had destroyed the old government.\nNow past seventy, he is one of the few pacifist leaders in the Syndicalist Republic. He opposes garrisons on the Great Lakes, arms shipments to the east bank of the Mississippi and any reprisals against the exiled crown, because Canada cannot afford any war at all. The League's younger men call him naive, but prairie farmers and church groups still listen to him, and his votes in the Congress cannot be ignored.§!"
 CAN_krcw_coldwell_desc:0 "§YBorn:§! §gDecember 2nd, 1888, in Seaton, Devon, England§!\n§YAlignment:§! §gPrairie cooperative movement§!\n§YBackground:§! §LMajor James Coldwell trained as a teacher in England and emigrated to Canada in 1910. He taught in Alberta and then became a school principal in Regina, Saskatchewan, where he helped organise the teachers' association. In the 1920s he was elected to Regina city council, and in 1932 he became leader of Saskatchewan's Farmer-Labour Party, bringing the wheat pools, the credit unions and the town unions onto one ballot.\nThe general strike of 1940 began in the eastern cities, and the prairie provinces at first only watched. Coldwell brought the cooperative movement into the Republic on condition that the farms stay with the farmers and the cooperatives handle the buying and export of wheat. The bargain gave the Republic its footing in the West and made the prairie cooperatives the least revolutionary and most solid part of the Syndicalist Republic.\nHe cares about wheat exports, credit unions and parish schools. He has no interest in exporting revolution east of the Mississippi, because prairie farmers who cannot sell their wheat will vote the government out at the next election. Buck's hard-liners say the cooperatives hold the Republic back; he reminds them that the Republic's bread comes from the prairies. He has little standing in the city unions, and that is his main weakness.§!"
 CAN_krcw_mcewen_desc:0 "§YBorn:§! §gFebruary 11th, 1891, in Stonehaven, Aberdeenshire, Scotland§!\n§YAlignment:§! §gWorkers' Unity League§!\n§YBackground:§! §LTom McEwen trained as a blacksmith in Scotland and emigrated to Canada in 1912, working around Saskatoon. In the 1920s he organised farm and railway workers on the prairies, wrote for the union papers and became national secretary of the Workers' Unity League. In 1931 he was jailed with Buck under Section 98 of the Criminal Code and held in Kingston Penitentiary until 1934.\nDuring the strikes of 1940 he ran the strike committees' papers and leaflets. Under the Republic he stayed on as editor of the union papers and became its best propagandist. In the later years of the American civil war he organised an underground line that brought hunted syndicalists out of Long's territory across the prairie border into Canada and on to the east bank.\nHe stands between Woodsworth's pacifism and Buck's exported revolution: no troops, and no closing of the underground line. He believes that if the comrades east of the Mississippi are taken by Long's men, this side of the border will be next. His base is only in the papers and the unions; neither the army nor the prairie cooperatives count him as one of their own.§!"
 CAN_krcw_murray_desc:0 "§YBorn:§! §gJune 22nd, 1896, in Granton, Nova Scotia, Dominion of Canada§!\n§YAlignment:§! §gRepublican Navy§!\n§YBackground:§! §LLeonard Warren Murray entered the newly founded Royal Naval College of Canada in 1911 as one of its first cadets. In the Great War he served as a midshipman in Royal Navy ships on escort and patrol duty in the North Atlantic. After the Entente's defeat in 1919 the Canadian navy was down to a few old ships, and he moved between Halifax and Esquimalt in staff and training posts.\nIn the intervention war of 1938-1940 he ran the gunboats and transports on the Great Lakes. When the King fled in 1940, some naval officers followed the exiled government to Australia; Murray stayed in Halifax and handed the remaining ships and dockyards to the strike committee. That made him the founder of the Republic's navy, which he has since run from the gunboats on the lakes to the North Atlantic convoys.\nHis politics come from geography: Canada cannot hold a land frontier, but it can make sure no one blockades the St. Lawrence. He argues the Republic's defence money should go mainly to the sea, which sets him against every politician who came out of the army. Some in the League have never trusted a former Royal Navy officer; he has no faction in the party, only the fleet.§!"
 AST_krcw_menzies_desc:0 "§YBorn:§! §gDecember 20th, 1894, in Jeparit, Colony of Victoria§!\n§YAlignment:§! §gUnited Australia Party§!\n§YBackground:§! §LRobert Gordon Menzies, son of a country storekeeper in Victoria, went through the law school of the University of Melbourne on scholarships, was admitted to the bar in 1918 and made his name in constitutional cases. He did not enlist in the Great War, and his opponents have never let him forget it. He entered the Victorian parliament in 1928, moved to federal parliament as Attorney-General in 1934, and later became leader of the United Australia Party and Prime Minister.\nIn 1940, after the strikes and mutiny in Canada, the King and the exiled government fled a second time, first to Melbourne and later to Canberra. Menzies received the court, and for the ten years since he has kept the balance between the crown and the Australian parliament. The exiled ministers and the Australian cabinet meet in the same building, and it has never been settled which of them is the real government.\nHe is a firm supporter of the crown, but he has put the question on the table: is Australia a colony that keeps an exiled court, or a country that happens to have a king? His first demand is to settle who pays for the court. He has doubts about any attempt to recover Britain and cares more about Australasia's own defence and Pacific trade. The restorationists accuse him of thinking only of Australia; the republicans think he gives the crown too much.§!"
 NZL_krcw_holland_desc:0 "§YBorn:§! §gOctober 18th, 1893, in Greendale, Colony of New Zealand§!\n§YAlignment:§! §gReform Party§!\n§YBackground:§! §LSidney George Holland, son of a Canterbury farmer who later became Mayor of Christchurch, served with the New Zealand Field Artillery in the Great War and was invalided home through illness. After the war he ran an engineering business in Christchurch, was elected member for Christchurch North in 1935 and later became leader of the Reform Party.\nAfter the exiled court moved to Australia in 1940, New Zealand and Australia formed the Australasian Entente. Holland supports the crown and favours defence cooperation between the two countries, but he is wary of union, fearing New Zealand's interests would be overlooked in Melbourne and Canberra. He insists that Wellington keep its own parliament, budget and foreign trade.\nAs Prime Minister of New Zealand, he answers to Canterbury farmers and town merchants who need export markets for wool, butter and meat, most of which are in the Internationale's hands. The royalists want him closer to Canberra, and Labour wants him to restore trade with Britain's syndicalist government. He has decided neither question yet, and the Reform Party has split into two camps over them.§!"
 TIB_krcw_reting_desc:0 "§YBorn:§! §g1912, in Dagpo, Tibet§!\n§YAlignment:§! §gKashag§!\n§YBackground:§! §LThubten Jamphel Yeshe Gyaltsen, the 5th Reting Rinpoche, was born in Dagpo and recognised as a child as the reincarnation of the lama of Reting monastery. He was educated at Reting and Sera and was close to the 13th Dalai Lama. When the Dalai Lama died in 1933, he was chosen as regent the following year, barely past twenty. In his first years as regent he relied on the minister Trimön to hold the government together and dealt harshly with reforming officials and pro-British officers.\nHe directed the search for the 14th Dalai Lama, who was found in Amdo and brought to Lhasa to be enthroned. During the Northern Expedition the Kashag waited to see how things would go. In 1947 it signed the Lhasa Agreement with Nanjing: Tibet recognised the sovereignty of the Republic of China, and Nanjing promised not to change Tibet's existing system.\nThe 14th Dalai Lama is now fourteen, and Reting still runs the Kashag as regent. He manoeuvres between Nanjing and Kalimpong: Nanjing's work teams want rent reduction and schools, while Indian traders from Kalimpong bring rifles and gold. The nobility and the three great monasteries of Sera, Drepung and Ganden each pursue their own aims. His regency lasts only until the Dalai Lama comes of age, and every noble family in Lhasa is deciding where it will stand after that.§!"
 SPR_krcw_durruti_desc:0 "§YBorn:§! §gJuly 14th, 1896, in León, Province of León, Kingdom of Spain§!\n§YAlignment:§! §gConfederación Nacional del Trabajo (Anarcho-Communist)§!\n§YBackground:§! §LDurruti's father was a railwayman and union member in León, and the boy was apprenticed in a locomotive shop at fourteen. When the Civil Guard broke the general strike of 1917 he fled to France, was arrested when he came back, escaped and crossed the border again, arriving in the last years of the Third Republic. He joined a revolutionary cell in Marseilles and made his name in the street fighting for the city. The Commune then sent him with a shipload of leftover Weltkrieg arms to help the striking shepherds of Patagonia. That war ended in stalemate; he went home, and later returned to Patagonia once more alongside Nestor Makhno.\nWhen the Iberian revolution broke out in 1936 he led a militia column from Barcelona to the Aragon front, and the column came to bear his name. The revolution left Spain with no president, only a federal council and the free municipalities; in 1946 revolutionary Portugal joined the Federation, and the CNT government renounced every colony. Durruti has never held a ministry, yet no one in the Federation carries more weight.\nHe opposes every binding central body, in Madrid or in Paris. Each time the International Secretariat asks Iberia to pool its military supply and foreign trade, he sends the question back to the local federations for a vote. Career officers such as Vicente Rojo believe a federation run this way cannot hold the Pyrenees, and the moderates among the syndicalists want a national economic council. He is fifty-three, and the Federation has not yet thought about what it will do without him.§!"
 IRE_krcw_odonnell_desc:0 "§YBorn:§! §gFebruary 22nd, 1893, near Dungloe, County Donegal, Ireland§!\n§YAlignment:§! §gRepublican Congress (Revolutionary Socialist)§!\n§YBackground:§! §LO'Donnell grew up on an Irish-speaking smallholding in Donegal and taught school on Arranmore, where he watched the island's young people leave each summer to work the Scottish harvest. In 1918 he gave up teaching to organise for the Irish Transport and General Workers' Union in Derry and Tyrone, and then fought in the War of Independence.\nHe rejected the treaty over partition and edited the Anti-Treaty Sinn Féin paper An Saorstát, turning it into a platform for socialism. After the revolutions in France, Italy and Britain the party expelled him; watching Ireland trade British capital for German, he founded Saor Éire, and the government shut his paper. When German power left western Europe in the 1940s, he and old IRA officers such as Tom Barry took Dublin, and the Republican Congress became the ruling party. The 1947 Treaty of Dublin returned Northern Ireland to Ireland, on condition, among others, that Ireland join the Internationale.\nHis task now is to bring Ulster in for real. The Protestant workers of Belfast have their own unions and their own fears, and the Catholic Church does not trust a socialist government. He insists that Dublin deal with London as an equal and gives no ground on Ulster or the sea lanes, which often strains his relations with his comrades in Glasgow and London.§!"
 NOR_krcw_tranmael_desc:0 "§YBorn:§! §gJune 27th, 1879, in Melhus, Søndre Trondhjems Amt, Kingdom of Norway§!\n§YAlignment:§! §gNorwegian Labour Party (Syndicalist)§!\n§YBackground:§! §LTranmæl was the son of a smallholder in Melhus and worked as a house painter. From 1900 to 1905 he worked in the United States, where he met the Industrial Workers of the World, and he brought direct action and industrial unionism back into the Norwegian unions. His Trondheim resolution of 1911 called on the unions to drop long-term collective agreements and use strikes and go-slows to force the employers' hand; it founded the Trade Union Opposition, and Trondheim became his base.\nIn 1918 his radicals took over the Labour Party. For many years afterwards he was its secretary and edited Arbeiderbladet. Norway stayed neutral in the German-led postwar order, and he kept the party on its syndicalist line while insisting it need not take orders from Paris. When German power left the north late in the second war, Labour took the government and Norway joined the Internationale. Norwegian aluminium works and hydroelectric stations now hold a place in the Internationale's common plan.\nHe is seventy and has handed the day-to-day work of party and government to younger men, though he still chairs the national committee. One wing of the party wants Norway to be the Internationale's most dependable member, since the Russian Northern Fleet is a single fjord away; another fears Norwegian divisions will be sent to the Elbe. He settles the disputes between them, but he rarely travels now.§!"
 DEN_krcw_larsen_desc:0 "§YBorn:§! §gAugust 5th, 1897, in Odense, Kingdom of Denmark§!\n§YAlignment:§! §gFaelles Faglige Syndikat (Syndicalist)§!\n§YBackground:§! §LLarsen was born poor in Odense and went from job to job as a child. His family supported the Social Democrats and he went to their rallies. He took part in the riots on Grønttorvet in Copenhagen in November 1918 and grew steadily more radical. When the Social Democrats and the union confederation made their settlement with the employers, he left the party for the new Left Socialist Party, which merged with the syndicalists a year later.\nIn the late 1920s he visited France and Britain to study their revolutions and came home disappointed. Denmark, he argued, should not copy the French and British models but build its own socialism and bring the farmers hit by urbanisation over to the workers' side. Soon after Stauning became prime minister in 1930 he took over the Left Socialists, courting the radicals among the Social Democrats while organising in the countryside. When German power collapsed late in the second war, Denmark had its revolution and the united syndicates took power; Iceland declared itself an independent republic in 1944.\nHe wants Denmark to specialise in shipbuilding and shipping within the Internationale, bringing the yards of Copenhagen and Aarhus into the common plan, and to stay out of the quarrels between the great powers. Denmark holds the straits into the Baltic, and both the Russians and Paris watch them closely, which makes his hope of staying on the sidelines hard to keep.§!"
 BEL_krcw_lahaut_desc:0 "§YBorn:§! §gSeptember 6th, 1884, in Seraing, Liège, Kingdom of Belgium§!\n§YAlignment:§! §gConfédération Syndicale de Belgique (Syndicalist)§!\n§YBackground:§! §LLahaut was born into a working family in Seraing and went into the Cockerill steelworks as an apprentice at fourteen, later working as a boilerman. In 1905 he helped found the metalworkers' union Relève-toi and made union organising his trade. In the Weltkrieg he volunteered for the Belgian armoured car corps and fought with it on the Russian front.\nUnder the German-led postwar order the Belgian unions were tightly restricted. He led strike after strike in the steelworks of Liège and Charleroi and went to prison for it more than once. When the Internationale's armies crossed the Rhine in the early 1940s and the German garrison left Belgium, the Liège steelworkers took over their plants and he became leader of the new syndicalist confederation. Belgian chemicals and steel are now part of the Internationale's common plan.\nHe wants Belgium, the Netherlands and Luxembourg to vote and negotiate together inside the Internationale, to give the small countries more weight against Paris and London. The Catholic unions of Flanders have never got on with the confederation, and the Antwerp dockers have their own ideas. He is sixty-five, known for leading from the front in the streets and not for bargaining in committee.§!"
 AUS_krcw_klahr_desc:0 "§YBorn:§! §gSeptember 16th, 1904, in Vienna, Archduchy of Austria below the Enns, Austria-Hungary§!\n§YAlignment:§! §gRevolutionary socialist, Austrian national faction§!\n§YBackground:§! §LAlfred Klahr was born into a Jewish family in Vienna, took a doctorate in political science at the University of Vienna, and joined the Austrian socialist movement in his early twenties. Through the 1920s he wrote for the party press and was arrested several times for strikes and demonstrations.\nIn 1937 he published a series of articles under a pen name arguing that the Austrians are a nation of their own, with their own history and habits of speech, and should not be counted as part of the German nation. At the time almost every German and Austrian socialist wanted a single greater German workers' republic, and the articles left him isolated in his own party.\nWhen the western provinces formed the republic in Salzburg in 1945 he joined Adler's cabinet, and his old articles became the republic's reason to exist. He wants the workers' councils of the factories and villages to hold power and is firmly against union with Germany. Many in Hamburg think he is splitting the German working class; Renner shares his aim and has argued with him over the method for years.§!"
 AUS_krcw_renner_desc:0 "§YBorn:§! §gDecember 14th, 1870, in Unter-Tannowitz, Margraviate of Moravia, Austria-Hungary§!\n§YAlignment:§! §gSocial Democratic Workers' Party of Austria§!\n§YBackground:§! §LKarl Renner was born to a poor Moravian peasant family with a great many children. He got through school on scholarships, studied law at the University of Vienna, and went to work in the library of the Reichsrat. From the 1890s he wrote on the nationalities question under pen names, arguing that the peoples of a multinational empire should govern themselves by cultural autonomy rather than by territory. In 1907 he was elected to the Reichsrat and became one of the leading theorists of the Austrian Social Democratic Workers' Party.\nAfter the Weltkrieg he led the Social Democrats in Vienna in their cooperation with the Christian Socials, which brought reforms in education and social insurance, and he long remained the party's leader in parliament. In 1945 he joined Adler's cabinet in Salzburg as the voice of the social democrats in the republic.\nHe is nearly eighty and has outlived his rivals in the party. His programme has one point: let Austria first exist as a country, then talk terms with the Germans and the Russians. He is willing to form a grand coalition with the Christian Socials; Klahr thinks him too willing to compromise with anyone, and Adler's people regard him as a relic of the old parliamentary politics of the Empire.§!"
 TUR_krcw_cakmak_desc:0 "§YBorn:§! §gJanuary 12th, 1876, in Cihangir, Constantinople, Ottoman Empire§!\n§YAlignment:§! §gRepublican People's Party (Military Council)§!\n§YBackground:§! §LÇakmak was the son of an artillery colonel, and his grandfather taught him Persian and Arabic. He entered the Ottoman Military Academy in 1893 and the Staff College in 1896, graduating as a staff captain, and served in Serbia and Albania, where he first met members of the Committee of Union and Progress. In the Balkan War he was chief of staff of the 1st Division in the Western Army. In the Weltkrieg he commanded V Corps at Gallipoli, then served in the Caucasus and Palestine; he was made lieutenant general in 1918, and that Christmas Eve he was appointed Chief of the Ottoman General Staff.\nAfter the war he stayed in the army as a war hero and was promoted field marshal on the recommendation of his friend Mustafa Kemal. For years he kept out of politics and confined himself to suppressing the partisans in Anatolia. When the German order collapsed in the 1940s, the Ottoman Empire broke up between 1942 and 1945. Judging the Republican People's Party too divided to govern, he took over Ankara in the name of a military council.\nHe has given the army to the Moscow Accord but not the Straits. The Russian Black Sea Fleet can only reach the Mediterranean with Turkey's consent; Moscow keeps demanding free passage and he keeps refusing. The pan-Turkists in the junta want to expand east toward the Turkic peoples, and he believes Turkey lacks the strength to take on Russia. He is seventy-three and has named no successor.§!"
 GRE_krcw_papagos_desc:0 "§YBorn:§! §gDecember 9th, 1883, in Athens, Attica, Kingdom of Greece§!\n§YAlignment:§! §gMilitary Directorate (Military Junta)§!\n§YBackground:§! §LPapagos came from an Athenian officer family and trained at the Belgian Military Academy in Brussels and the cavalry school at Ypres, returning to the Greek army as a cavalry second lieutenant in 1906. He served with the cavalry and on the staff in the Balkan Wars and became one of the army's most trusted staff officers.\nBetween the wars Greek politics swung back and forth between royalists and republicans; he stayed with the crown throughout and rose to Chief of the General Staff. During the second world war Greece fell into civil war, with the Democratic Army's guerrillas fighting in the north and the islands and syndicalists at their core. Papagos led the government forces to the end of that war in 1945, took power in the name of a Military Directorate and then brought Greece into the Moscow Accord.\nThe remnants of the Democratic Army fell back into the Pindus and the Epirus coast, supplied by Italian fishing boats that come by night from Otranto. Athens has protested to Rome many times, and Rome answers that the boats are private. He has been hunting the partisans in the mountains for years; the Russian advisers brought mountain warfare manuals and also Moscow's interference in Athens' foreign policy. The royalists want him to hand power back to the King, and he has given no date.§!"
 POL_krcw_rydz_desc:0 "§YBorn:§! §gMarch 11th, 1886, in Brzeżany, Kingdom of Galicia and Lodomeria, Austria-Hungary§!\n§YAlignment:§! §gCamp of National Unity (Military Junta)§!\n§YBackground:§! §LRydz was born to a poor family in Eastern Galicia and lost both parents before he was ten; his foster family paid for his schooling. He studied art at the Jagiellonian University in Kraków, joined the Union of Active Struggle and the Riflemen's Association and became a follower of Piłsudski, taking the pseudonym Śmigły. In 1914 he left the Austro-Hungarian army for Piłsudski's Legions and rose fast. In the Oath Crisis of 1917 he refused to swear fidelity to Kaiser Wilhelm II, was forbidden to wear a uniform, and went to Kraków to lead the Polish Military Organisation against both the Central Powers and Russia.\nBy 1919 Germany's victory was certain and he turned to peaceful opposition. Only in 1925, when King August IV pardoned the former Legionnaires, could he return; barred from command, he was elected to the Senate and spoke for the old Legion veterans. With like-minded men he founded the Camp of National Unity, which later took power in a coup with him as First Marshal. When Germany collapsed in the 1940s Poland abolished the monarchy, became the Polish Republic, kept its 1919-21 borders plus southern East Prussia, and joined the Moscow Accord.\nPomerania, the Neumark and Silesia, however, went to Schleicher's German National Republic, itself an Accord member. Every year Rydz sends his chief of staff to Moscow with the same file, and every year the answer is that the time is not right. The monarchists are still there, generals such as Władysław Anders have their own standing in the army, and his regime rests on military hierarchy and a reputation for standing above politics.§!"
 CZE_krcw_syrovy_desc:0 "§YBorn:§! §gJanuary 24th, 1888, in Třebíč, Kingdom of Bohemia, Austria-Hungary§!\n§YAlignment:§! §gNational Unity Directorate (Military Junta)§!\n§YBackground:§! §LSyrový trained as a builder and, after his service in the Austro-Hungarian army, went to work for a construction firm in Warsaw. The Weltkrieg found him in Russia, and in 1914 he joined the Czech Druzhina, a unit of Czech emigrants in the Russian army that later grew into the Czechoslovak Legion. He lost his right eye at the Battle of Zborov in July 1917 and wore a black patch from then on, which made him known to the whole army. In 1918 he commanded the Legion along the Trans-Siberian Railway.\nAfter the Russian civil war the Legion came back to Europe. Bohemia was still under the Habsburgs, and the Legion veterans lived under long police surveillance. When the Habsburg monarchy broke up in the second war in the 1940s, Prague declared independence, the old Legion officers took over the new state's army, and Syrový, the most senior of them, became head of the Directorate.\nBohemia sits between the red German Socialist Republic and Moscow. The Directorate chose Russian protection and trades obedience for military aid; the price is tight control of the unions and left-wing parties at home, and the workers' organisations of Plzeň and Prague can only work half in the open. Younger Legion officers such as Ludvík Svoboda have their own standing in the army and closer ties to the Russian advisers.§!"
 YUG_krcw_simovic_desc:0 "§YBorn:§! §gOctober 28th, 1882, in Kragujevac, Kragujevac District, Kingdom of Serbia§!\n§YAlignment:§! §gRoyal Military Government (Military Junta)§!\n§YBackground:§! §LSimović graduated from the Military Academy in Belgrade and made his career as an officer of the Serbian army. He fought in both Balkan Wars, retreated with the Serbian army over the Albanian mountains in the Weltkrieg and fought on the Salonika front.\nAfter the war he served for many years on the Serbian general staff and later took charge of the army's air arm, one of the few senior generals who understood aircraft. When the Habsburg monarchy and the German order collapsed in the 1940s, the South Slav lands were joined to a Kingdom of Yugoslavia under the Karađorđević dynasty. In 1945 he led the officers who overthrew Prince Regent Paul, formed a Royal Military Government in the King's name with himself as head of state, and then joined the Moscow Accord.\nThe junta calls itself temporary, yet parliament has not been restored. Russian loans pay for the army and keep the peace between Croats and Serbs. The Macedonian question sets him against both Bulgaria and Greece; hardliners in Belgrade want Macedonians recognised as a nation, and since both neighbours are Accord members, Moscow tells him to hold back. Belgrade's intellectuals have begun asking openly how long the junta means to stay.§!"
 HUN_krcw_bardossy_desc:0 "§YBorn:§! §gDecember 10th, 1890, in Szombathely, Vas County, Kingdom of Hungary, Austria-Hungary§!\n§YAlignment:§! §gParty of National Unity (Autocrat)§!\n§YBackground:§! §LBárdossy came from a family of minor gentry in Szombathely. He read law at the University of Budapest, entered the Hungarian Ministry of Religion and Education and then moved into diplomacy, where he was known for caution and discretion. He served for many years in the joint Austro-Hungarian foreign service, including a posting to Bucharest.\nWhen the Habsburg monarchy broke up in the second war in the 1940s and the Russian army took the Austrian lands east of Vienna, Budapest declared Hungary fully independent. Among the men acceptable both to the Russians and to Hungary's old ruling class, this diplomat without a party fitted best. He became prime minister, founded the Party of National Unity and took Hungary into the Moscow Accord.\nHis government rests on the great landowners and the officer corps: land reform is put off again and again, and the workers' organisations in the Budapest suburbs are watched by the police. The monarchists want the Habsburgs back, which needs Moscow's consent, and Moscow will not give it. Transylvania leaves him and Romania, a fellow Accord member, distrusting each other; the two countries' school atlases give it to different states, and Moscow requires both sides to make no public territorial claim.§!"
 ROM_krcw_antonescu_desc:0 "§YBorn:§! §gJune 2nd, 1882, in Pitești, Argeș County, Kingdom of Romania§!\n§YAlignment:§! §gMilitary Government (Military Junta)§!\n§YBackground:§! §LAntonescu was an officer's son, trained at the military school in Craiova and the military academy in Bucharest, and was commissioned in the cavalry in 1904. In the peasant revolt of 1907 he put down the risings around Galați. When Romania entered the Weltkrieg in 1916 he was head of operations for the Northern Army Group, and he had a hand in the defensive plan for Mărășești in 1917. Short-tempered and red-haired, he was known in the army as the Red Dog.\nAfter the war Romania lived inside the German-led order. He served as military attaché abroad, Chief of the General Staff and Minister of Defence, was always on bad terms with the party politicians, and was dismissed and recalled several times. When the German order collapsed in the 1940s and Romania turned toward Russia, he formed a military government in the King's name, leaving the King only his title.\nThe Ploiești oilfields are the Moscow Accord's most important source of oil; they give him his voice in the Accord and are the reason Russian advisers live in Bucharest. Transylvania sets him against Hungary, and Moscow forbids either country to discuss it. The remnants of the Iron Guard count him an enemy, the liberal politicians want the King to take power back, and he trusts neither.§!"
 BUL_krcw_georgiev_desc:0 "§YBorn:§! §gAugust 11th, 1882, in Pazardzhik, Eastern Rumelia, Ottoman Empire§!\n§YAlignment:§! §gZveno (Military Junta)§!\n§YBackground:§! §LGeorgiev was born into a middle-class family in Pazardzhik before Eastern Rumelia was united with Bulgaria. Like many of his peers without wealth he went to the Military School and graduated as an infantry lieutenant. He fought in both Balkan Wars and the Weltkrieg, losing an eye in the latter. No longer fit for the front, he became an instructor and staff officer and helped build the Military Union of serving and reserve officers.\nIn the 1920s he taught, commanded units against Serbian chetniks in Macedonia and lectured at the Military School. After the Serbian revolution he backed the authoritarian government of Konstantin Georgiev and served as Minister of Railways and Telegraphs. In 1928 he and Damyan Velchev founded Zveno, holding that the army must clean up what the parties had left behind, with or without the throne. When the German order collapsed in the 1940s Zveno took Sofia; he governs in the Tsar's name, the Tsar keeps only his title, and Bulgaria joined the Moscow Accord.\nMacedonia sets him against Yugoslavia, also an Accord member, and Moscow tells both to hold back. The old hands of the Internal Macedonian Revolutionary Organisation find him too soft, the Agrarians find him too hard, and some in the officer corps still hope the Tsar will take real power back.§!"
 PER_krcw_qavam_desc:0 "§YBorn:§! §gJanuary 2nd, 1873, in Tehran, Tehran Province, Sublime State of Persia§!\n§YAlignment:§! §gDemocrat Party of Iran (Autocrat)§!\n§YBackground:§! §LQavam came from a family of Qajar officials; his elder brother Vosugh od-Dowleh was also several times prime minister. As a boy he entered court service as a page of Naser al-Din Shah and later worked in the royal secretariat. In the Constitutional Revolution of 1906 he drafted the decree by which Mozaffar ad-Din Shah granted the constitution. He went on to serve as minister of the interior, justice, finance and war, and in 1918 became governor of Khorasan.\nFrom the 1920s he was prime minister several times, each time manoeuvring between the Shah, the Majlis and the foreign legations, and more than once his enemies drove him from office and into exile in Europe. During the second war Russian influence crossed the Caspian, and in the 1940s Tehran became a Moscow protectorate. He founded the Democrat Party of Iran, built a pro-government majority in the Majlis and returned as prime minister.\nHis strength is his skill in dealing with the Russians: oil concessions, garrisons and railways all have to be negotiated, and he decides how far each negotiation goes. The workers' and peasants' movement in northern Azerbaijan worries him most; the unions of Tabriz have the sympathy of Paris and, some say, its money. The tribal chiefs, the clergy and the Shah's circle all dislike him. He is seventy-six.§!"
 AFG_krcw_zahir_desc:0 "§YBorn:§! §gOctober 15th, 1914, in Kabul, Kabul Vilayet, Emirate of Afghanistan§!\n§YAlignment:§! §gRoyal Court (Absolute Monarchy)§!\n§YBackground:§! §LZahir is the son of Mohammad Nadir. He went to English- and French-language schools in Kabul and was then sent to a military academy in Germany. Under Amanullah, his father insisted that he serve as deputy minister of war and deputy minister of education.\nAfter the Sack of Darulaman, Nadir retook Kabul and made himself king; Amanullah fought to regain the throne and Afghanistan fell into civil war. Zahir commanded infantry in that war and was generously decorated afterwards. Amanullah was beaten and fled, but his followers did not disperse, and Nadir later died in a bombing said to have been organised by them. Zahir was crowned soon after. During the second war Russian power moved south, and in the 1940s Kabul became a Moscow protectorate.\nHe is cautious, and most affairs of state are decided by his uncles, each of them opinionated and each ambitious. He keeps both Moscow and Delhi at arm's length; his agreement with Delhi puts the Pashtun tribes under the joint \"management\" of both countries, which in practice means Russian advisers. Amanullah's old party, the young reforming officials and the border tribes are all waiting for their chance. He is thirty-five and has yet to establish his own authority.§!"
 MON_krcw_magsarjav_desc:0 "§YBorn:§! §g1877, in Zhongmo Banner, Sain Noyon Khan Aimag, Outer Mongolia, Great Qing§!\n§YAlignment:§! §gRegency Council (Autocrat)§!\n§YBackground:§! §LMagsarjav was born into a noble family of his banner. He learned to read at eleven, married at sixteen and received property from the banner chief; at twenty-five he became an official under the chief's son, with his own herds and camel caravan, and after inheriting his father's title he went on living as a herdsman. In 1911 he was sent to Khovd as deputy to the Qing Grand Councillor Pu Xi; soon afterwards Mongolia declared independence from the Qing and founded the Bogd Khanate. He asked Pu Xi to leave of his own accord, was refused, and laid siege to Khovd with Damdinsüren and Ja Lama, earning the title Resolute Hero. In 1913 he fought the Chinese in Xilingol, withdrew in 1914 when Russian aid ended, was later sent against Babujab, who was trying to restore the Qing, and in 1918 received a fief of his own.\nSuspected afterwards of links with Sükhbaatar, he was arrested and tortured, and freed when Baron Ungern took Urga. He was briefly acting prime minister and then minister of war, and helped Ungern drive the Chinese out of Mongolia. Doubting the Baron's real intentions, he refused to join the campaign into Manchuria, and his relations with Ungern grew steadily worse. After the war Ungern's mystical regime was overthrown by his own officers, and a Regency Council took power in the Bogd Khan's name with Magsarjav at its head.\nThe Council's order rests on the rifles of the Russian garrison, and Urga's finances on Russian loans. He is wary of Nanjing's influence in Inner Mongolia and worried by Ungern's old followers and the lamas of the monasteries. He is seventy-two, and the princes of the Council are already thinking about what comes after him.§!"
