l_english:
 GOV_TYPE_COM:0 "Federal Totalist State"
 GOV_TYPE_COM_DESC:0 "A vanguard party organised on democratic centralism rules, but power is divided between the centre and the regions. How far the regions may go their own way differs from country to country."
 GOV_TYPE_COM_2:0 "Unitary Totalist Republic"
 GOV_TYPE_COM_2_DESC:0 "The state is organised as a single whole, with all power in a central government held by the vanguard party."
 GOV_TYPE_MAO:0 "Unitary Maximist Republic"
 GOV_TYPE_MAO_DESC:0 "The Maximists hold that the revolution cannot wait for industry to mature and call for a united front of workers, peasants and soldiers to take power at once. Power sits with a single central authority."
 KRCW_GOV_RAJ:0 "Princely Federation"
 KRCW_GOV_RAJ_DESC:0 "More than five hundred princes sit together in the Chamber of Princes under the Maharaja of Gwalior. The centre runs the army, foreign affairs and the railways; the states keep their own courts and taxes."
 KRCW_GOV_PSA:0 "Constitutional Presidency"
 KRCW_GOV_PSA_DESC:0 "The Congress and the President in Sacramento are still elected under the Constitution of 1787. The ports and mountain passes are run by the Western Defense Command, whose wartime powers Congress renews every year."
 KRCW_GOV_BRO:0 "Revolutionary Tutelage"
 KRCW_GOV_BRO_DESC:0 "The revolutionary party exercises sovereignty for the people until constitutional rule is possible. Chinese advisers sit in the army and the treasury."
 KRCW_GOV_REG:0 "Regency Kingdom"
 KRCW_GOV_REG_DESC:0 "The throne is empty or the monarch cannot rule. A regent and the officer corps govern in the crown's name; parliament may only vote on bills the government sends it."
