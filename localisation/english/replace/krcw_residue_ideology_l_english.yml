 syndicalism_desc:0 "£Ideology_Syndicalism_pic\n\n\n\n\n\n\n\n\nSyndicalism holds that unions organised by industry should own the means of production, and that strikes and workers' councils should replace parliament and the rule of capital. It grew out of Proudhon, Sorel and the French union struggles of the late nineteenth century. After 1919 the Commune of France and the Union of Britain made it a system of state, and the Third Internationale is its international federation."
 regency:0 "Regency"
 regency_desc:0 "£Ideology_Regency_pic\n\n\n\n\n\n\n\n\nA regency is a temporary government in which a regent exercises the powers and duties of a monarch who cannot yet rule."
 ibadi_immamate:0 "Ibadi Imamate"
 sandanista_desc:0 "£Ideology_Sandanista_pic\n\n\n\n\n\n\n\n\nSandinismo takes its name from the Nicaraguan guerrilla leader Augusto César Sandino. It calls for the expulsion of foreign garrisons, land for the peasants, and a state run by the organisations of workers and peasants."
 marhaenism_desc:0 "£Ideology_Marhaenism_pic\n\n\n\n\n\n\n\n\nMarhaenism is the doctrine Sukarno set out in the 1920s, named after the West Javanese peasant Marhaen. It holds that Indonesia's smallholders, artisans and petty traders must unite against colonial capital and build a state of their own."
 nkrumaism_desc:0 "£Ideology_Nkrumaism_pic\n\n\n\n\n\n\n\n\nNkrumaism is the political doctrine of Kwame Nkrumah: an end to colonial rule, African unity, and state-led industrialisation."
 peronism_desc:0 "£Ideology_Center_Peronism_pic\n\n\n\n\n\n\n\n\nPeronism, named after Colonel Juan Perón, stands for social justice, workers' rights and economic nationalism. It calls itself a \"third position\" beyond capitalism and socialism and rests on the unions and the army."
