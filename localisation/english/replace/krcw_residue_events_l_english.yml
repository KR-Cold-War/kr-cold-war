l_english:
 nuke_dropped.1.t:0 "[GetNewspaperHeader]The First Atomic Bombing in History"
 nuke_dropped.1.d:0 "An atomic bomb exploded over [From.From.GetName] today. It is the first time such a weapon has been used in war: the last world war went on for years without one. The damage is still being counted, and no one can yet say what it will cost the side that used it, or everyone else.\n\nThe world is waiting for what comes next. Will [From.From.owner.GetNameDef] surrender to spare its other cities, or answer in kind?"
 nuke_dropped.4.d:0 "Today, at [GetDateText], Berlin was struck by an atomic bomb. The divided city suffered badly in the last war, but nothing compares with this. Not since the Thirty Years' War has Berlin seen such devastation.\n\nThe bomb went off away from its planned epicentre, and some of the city's underground shelters survived. [From.From.owner.GetLeader] is said to be alive, and furious. How the [From.From.owner.GetAdjective] leadership will be evacuated, and whether it can be kept clear of the fallout, is not yet known."
 nuke_dropped.5.d:0 "An atomic bomb has destroyed the city of London today. For all its anti-air defences, [From.From.owner.GetNameDef] could not stop the attack. At [GetDateText] the great bell of Westminster struck for the last time before the blast melted it. Early reports say the ministries in Whitehall have been levelled, and many union delegates and officials are missing.\n\n[From.From.owner.GetLeader] is confirmed to have survived and is preparing a radio address for later today. British morale has never been lower, and the people need that speech, or a very well-worded surrender."
 nuke_dropped.5.b:0 "We'll keep the red flag flying here!"
 nuke_dropped.8.d:0 "An atomic bomb exploded over Washington today. The White House, the Capitol and the monuments of the Mall were turned to ash in an instant. The city was once the capital of the Union, and it has not seen destruction like this since the British burned it in 1814.\n\n[From.From.owner.GetLeader] has been taken to safety, but the whole country has been shaken. Americans fought each other through two civil wars without such a weapon. Now it has fallen on Washington."
 nuke_dropped.8.a:0 "Two civil wars could not destroy Washington. One bomb did."
 SOV_Soviet_Space_Program:0 "Russian Space Programme"
 nuke_dropped.12.d:0 "Today, the city of Copenhagen was struck by a nuclear explosion. Denmark stayed neutral in the world war, and the capital escaped the fighting and kept growing. It has not suffered anything like this since the Napoleonic Wars. Fallout lies on both shores of the Øresund, and survivors fearing another strike have begun to flee to Fyn and Jutland.\n\nThe whereabouts of [From.From.owner.GetLeader] are not yet known, and the nation's morale has been shattered. Whether this is the beginning of the end for one of Europe's oldest nations cannot yet be said."
 CWIC_ECON_PENALTIES.1.t:0 "Entering Austerity"
 CWIC_ECON_PENALTIES.1.d:0 "To head off a budget and payments crisis, the government will impose austerity. The measures are the creditor nations' condition for the next loan. Without them the nation's finances could collapse. Austerity will make life hard for many citizens, but the government sees no other way to save the economy."
 CWIC_ECON_PENALTIES.1.a:0 "So be it."
 CWIC_ECON_PENALTIES.2.t:0 "Entering Default"
 CWIC_ECON_PENALTIES.2.d:0 "The government has announced that it cannot pay its debts as they fall due, and the news has set off a national panic. The creditor nations demand the immediate adoption of the reforms they set out. With the economy sliding again, the country has little choice but deep cuts and an attempt to restore confidence. Many businesses and government offices have shut for lack of funds."
 CWIC_ECON_PENALTIES.2.a:0 "Damn."
 election.2.communism:0 "Totalists"
 election.2.maoism:0 "Maximists"
 election.2.trotskyism:0 "Syndicalists"
 election.2.socialist:0 "Radical Socialists"
 ARAB_LEAGUE_RESOLUTION.0.d:0 "\nAfter months of negotiation with the [arab_league_nation_global_target.GetAdjective] authorities, and weeks of testimony, debate and argument, the Arab League has voted to take a joint step into a prosperous future. The [arab_league_nation_global_target.GetAdjective] representatives seek a strong relationship, which may lead to more, perhaps even a place in their bloc and under its defensive umbrella. The goodwill should last a few years at least, or until the next major incident."
 ARAB_LEAGUE_RESOLUTION.01.d:0 "\nAfter months of negotiation with our authorities, and weeks of testimony, debate and argument, the Arab League has voted to take a joint step into a prosperous future with us. The League's representatives seek a strong relationship, which may lead to more, perhaps even a place in our bloc and under our defensive umbrella. The goodwill should last a few years at least, or until the next major incident."
 ARAB_LEAGUE_RESOLUTION.92.b:0 "Accept responsibility and send a generous \"gift\""
 ARAB_LEAGUE_RESOLUTION.30.d:0 "\nA recent resolution, [ARAB_LEAGUE_SELECTION_BUTTON_3], has been vetoed by a member state. The League Council decides by unanimity. Some representatives say the veto ended any hope of debate and consensus; others call it a ploy to protect a friendly state. Some nations back the veto and say the resolution was politically motivated from the start. Either way, the resolution is dead."
 NATO.3.d:0 "[From.GetName] has been attacked by a foreign power and has invoked our mutual defence treaty. This means we must join its war."
 ADL.3.a:0 "Honour the treaty and send help."
 ADL.3.b:0 "This war is not ours."
 ARAB_LEAGUE_RESOLUTION.9.t:0 "[GetNewspaperHeader]Arab League Calls for an End to the [arab_league_nation_global_target.GetName] Nuclear Program"
 ARAB_LEAGUE_RESOLUTION.10.t:0 "[GetNewspaperHeader]Arab League Calls for Removal of Weapons of Mass Destruction from [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.19.d:0 "\nThe Arab League reported that [FROM.GetName] has refused to accept offers for peace negotiations. Leading diplomats at the Arab League stressed their disappointment over the refusal, noting the status of the Arab League as a neutral, global body would have made it an ideal partner for peace negotiations. The League Council is expected to discuss this new development during their next session. With this rejection there are increasing fears that the conflict will only grow and that the Arab League lacks the clout to achieve the aspirations of its founders."
 ARAB_LEAGUE_RESOLUTION.23.d:0 "\nThe Arab League voted to lift the extensive trade sanctions on [arab_league_nation_global_target.GetName]. The League Council noted that [arab_league_nation_global_target.GetName] had made much progress on ending the practices which forced the Arab League to originally enforce trade sanctions. The General Secretary, in response to the vote, noted the organization was not meant to punish states and hoped this vote would help [arab_league_nation_global_target.GetName] return as a member of the global community. The representative of [arab_league_nation_global_target.GetName] welcomed the decision and stated this latest vote would play a big role in the normalization of ties."
 ARAB_LEAGUE_RESOLUTION.24.d:0 "\nThe Arab League passed a resolution lifting the arms embargo placed on [arab_league_nation_global_target.GetName]. The League Council felt the reasons for the arms ban were no longer justifiable and that the attitude of the government in [arab_league_nation_global_target.GetName] has been quite receptive recently. The General Secretary made remarks and pointed out the organization no longer felt the threat existed. He added his hope that the government in [arab_league_nation_global_target.GetName] will continue the positive steps it initiated. Some diplomats echoed those statements saying that sanctions are often a last resort and once they saw positive changes, there was little desire to continue sanctions. Privately however, there were some representatives who pointed out their fear that lifting the sanctions may end up sparking an arms race in the region."
 ARAB_LEAGUE_RESOLUTION.27.d:0 "\nThe government of [FROM.GetName] firmly rejected the Arab League resolution calling for the independence of the [arab_league_nation_global_target.GetAdjective] community. In a statement, they argued the Arab League has no jurisdiction or right to dictate on their internal affairs. Accepting the Arab League resolution would have not just sacrificed their sovereignty but also established a dangerous precedent. The statement also pointed out the resolution and international campaign is likely an international conspiracy meant to destroy the unity and strength of [FROM.GetName]. The defiant statement was received coldly at the Arab League, with the General Secretary expressing grave disappointment. The League Council will likely discuss the matter in their next session."
 ARAB_LEAGUE_RESOLUTION.131.d:0 "\n[arab_league_state_owner_global_target.GetName] defied the Arab League and international community by refusing to return [arab_league_state_global_target.GetName]. The decision to refuse sparked angry protests in the disputed area and outside the Arab League as supporters for the resolution demand action be taken. In its statement, the government of [arab_league_state_owner_global_target.GetName] stated the Arab League resolution was a direct interference in their internal affairs and unlawful. It added that any decisions over its sacred land and people would be decided by the nation and not foreign powers meddling in the affairs of others. The Arab League Council is expected to respond to these latest developments in their next session."
 war_justification.3.t:0 "[Root.GetLeader] Warns Against [From.GetAdjective] Totalism"
 war_justification.3.d:0 "'Is there a bigger threat to our way of life, or indeed the way of life itself, than Totalism? This plague that threatens to make the slaves, not the masters, rule every nation, to abolish the nation itself, to abolish people and their history. We will take [From.GetName] and abolish the Totalist plague.'\n\n[Root.GetLeader]'s hatred of Totalists has been well known since before [Root.GetRulingParty]'s rise to power, but it appears to have intensified recently in the specific case of the [From.GetAdjective] government. Our quest to purge Marxism off the face of the Earth may start there."
 war_justification.7.t:0 "[From.GetAdjective] Totalism Failing"
 war_justification.11.d:0 "'Without a doubt, [From.GetName] Totalism is one of the greatest threats to liberty and order in this era. Relentless and ruthless, it threatens to devour not only the [From.GetAdjective] people's hope of a prosperous, democratic society, but that of its neighbors as well. If we do not act now, we may well see this first domino fall too late, leaving more failed social experiments in its wake. How many more need die before we intervene?'\n\nThe threat of subversive activity undermining our democracy, fueled by [From.GetAdjective] ambitions, has become a hotly debated topic recently. While representatives in opposition have called this a Red Scare aimed at pursuing war with [From.GetName], the rhetoric of the [Root.GetRulingParty] has been highly successful so far."
 war_justification.15.d:0 "'The [Root.GetAdjective] national spirit is strong, but not all nations are so fortunate. [From.GetName] has had its traditions destroyed and rightful rulers long since murdered and buried, all in the name of the idea of the great Marxist revolution. It is our duty to restore order to this world led astray by bloodthirsty usurpers and to assert the strength of [Root.GetName] against this threat.'\n\nWhile the [Root.GetRulingParty] has always opposed Totalism, [From.GetName] has been a target of particular attacks in recent speeches. Whether or not the attack on the [Root.GetAdjective] nation from Totalists is a real threat, the preemptive attack on [From.GetAdjective] Totalism is already in the works."
 war_justification.203.t:0 "[From.GetLeader] Warns Against [Root.GetAdjective] Totalism"
 war_justification.203.d:0 "'Is there a bigger threat to our way of life, or indeed the way of life itself, than Totalism? This plague that threatens to make the slaves, not the masters, rule every nation, to abolish the nation itself, to abolish people and their history. We will take [From.GetName] and abolish the Totalist plague.'\n\n[From.GetLeader]'s hatred of Totalists has been well known since before [From.GetRulingParty]'s rise to power, but it appears to have intensified recently in the specific case of the [Root.GetAdjective] government. Our quest to purge Marxism off the face of the Earth may start there."
 war_justification.205.d:0 "'While we have consolidated the socialist society in [From.GetName], many nations still suffer under the despots of old. The workers of [Root.GetName] have no voice, no means to organize, and any attempts to institute socialism will be crushed savagely by the [Root.GetLeader] regime. We cannot wait for the gears of the international revolution to turn for the [Root.GetAdjective] people. We have proven that we could crush the capitalist oppressors here, and we will crush the oppressors in [Root.Capital.GetName] as well!'\n\n[From.GetLeader] has abandoned all attempts at diplomacy with our government. The Totalist task of eradicating all borders is now strictly focused on eradicating our borders."
 war_justification.206.d:0 "'Is there a greater lie than the supposed liberty of the [Root.GetAdjective] people? Where they once slaved under the princes and dukes who claimed ownership of the soil, they are now forced to sell their labor to those who claim ownership of the factories. Their freedom to choose one master over the other can hardly be called liberty. Likewise, their freedom to elect their leaders is a false choice, as propaganda would never allow the true socialists to take power. A people so thoroughly indoctrinated can only be saved by a [From.GetAdjective] intervention.'\n\nUnwilling to accept that our people may be satisfied without their social experiments, the Totalist regime in [From.GetName] has openly threatened to attack our nation. There is little reason to believe that this conflict could be resolved peacefully."
 war_justification.207.t:0 "[Root.GetAdjective] Totalism Failing"
 war_justification.208.a:0 "Death to Totalists!"
 war_justification.211.d:0 "'Without a doubt, [Root.GetName] Totalism is one of the greatest threats to liberty and order in this era. Relentless and ruthless, it threatens to devour not only the [Root.GetAdjective] people's hope of a prosperous, democratic society, but that of its neighbors as well. If we do not act now, we may well see this first domino fall too late, leaving more failed social experiments in its wake. How many more need die before we intervene?'\n\nThe nascent worker's movement has intimidated [From.GetAdjective] leaders. While representatives in their opposition have called this a Red Scare aimed at pursuing war with us, the rhetoric of the [From.GetRulingParty] has been highly successful so far."
 war_justification.215.d:0 "'The [From.GetAdjective] national spirit is strong, but not all nations are so fortunate. [Root.GetName] has had its traditions destroyed and rightful rulers long since murdered and buried, all in the name of the idea of the great Marxist revolution. It is our duty to restore order to this world led astray by bloodthirsty usurpers and to assert the strength of [From.GetName] against this threat.'\n\nWhile the [From.GetRulingParty] has always opposed Totalism, [Root.GetName] has been a target of particular attacks in recent speeches. Fearing their nation's inevitable progress to the next stage of history, a preemptive attack on [Root.GetAdjective] Totalism is already in the works."
