l_english:
# krcw: years paced
 krcw_world.1.t:0 "The Years of the Wire"
 krcw_world.1.d:0 "In the early summer of 1949 the world wakes up inside a ceasefire without a peace treaty.\n\nOn the Elbe, the red flags of the Third Internationale and the black-white-red of the Schleicher regime are separated by two lines of wire and a mined beet field; divided Berlin sits like a nail jammed between two gears. In the Kremlin President Savinkov reviews a \"cordon sanitaire\" stretching from the Baltic to the Hindu Kush, while in the Federation building in Paris union delegates argue over the exchange rates of the Clearing Union and the railways of North Africa.\n\nAcross the Atlantic the St. Louis Ceasefire has split America in two: east of the Mississippi lies the industrial heart of the Combined Syndicates, New York, Chicago, Detroit and Pittsburgh; west of it stretches Huey Long's United States, from the docks of New Orleans to the mining camps of the Rockies. The syndicates won half the civil war: they threw back the Entente intervention from Canada, and the disaster of that intervention set Canada itself alight; but Russian arms shipped through Mexico kept Long on his feet, and the divisions of Paris stayed on the Elbe. And beyond the Rockies the American Constitutional Coalition in Sacramento calls itself the lawful government of the United States and recognises neither New York nor New Orleans. It holds the West Coast, Alaska and the Pacific Fleet, and watches.\n\nIn Nanjing Zhou Enlai redrafts the Land Law; in Gwalior the Maharaja has the Chamber of Princes reject its Indian twin; in Melbourne the exiled House of Windsor waits out the winter rain for a restoration that may never come.\n\nNo one knows how far the wire will stretch. Everyone knows that the next war will leave no one to proclaim victory over the ruins."
 krcw_world.1.a:0 "The workers have no fatherland - but they have a future."
 krcw_world.1.b:0 "Order will prevail over chaos."
 krcw_world.1.c:0 "May we be left out of it."
 krcw_world.2.t:0 "The Paris Clearing Union"
 krcw_world.2.d:0 "Drafted jointly by the CGT federations, the British Co-operative Wholesale Society and the Nanjing Construction Commission, the Paris Clearing Convention is finally before the Federal Congress. Its idea is simple and bold: industrial federations will no longer settle accounts in gold or marks but in a \"labour clearing unit\", and surplus nations will see their surpluses automatically converted into technical aid and equipment credit for deficit nations.\n\nOnly one question remains: how wide should the door be? Open only to the brothers of the Internationale - or to neutrals, and even to the hungry little countries of the Moscow camp?"
 krcw_world.2.a:0 "Open the door to the whole world."
 krcw_world.2.b:0 "Settle accounts among the brothers first."
 krcw_world.3.t:0 "The Labour Clearing Unit"
 krcw_world.3.d_open:0 "The Paris Clearing Union opened its doors today in the old bourse on the Rue La Fayette. Its first entry records a trade between the Lyon textile federation and the silk co-operatives of Nanjing. The Federation announced that any nation, whatever its bloc, may open a clearing account if it keeps books by the Convention. London's Daily Worker called it \"globalisation without bankers\"; Moscow's Russkoye Slovo called it \"a Trojan horse in overalls\"."
 krcw_world.3.d_closed:0 "The Paris Clearing Union opened today, its first members limited to the nations of the Internationale. \"First let accounts between brothers be transparent, then we can talk about the world,\" a Federation spokesman said. Neutral chambers of commerce are disappointed; Moscow is relieved."
 krcw_world.3.a:0 "A ledger is also a form of solidarity."
 krcw_world.3.b:0 "Red money is still money."
 krcw_world.3.c:0 "Perhaps we could open an account..."
 krcw_world.10.t:0 "Closing the Corridor"
 krcw_world.10.d:0 "West Berlin is a red flag planted in the heart of Brandenburg. Every day fourteen trains arrive from Hanover laden with coal, flour and leaflets; every night hundreds of young men from Potsdam ride their return journey and never come back.\n\nThe General Staff's memorandum is a single page: close the Magdeburg-Berlin rail corridor on the pretext of \"track repairs\". No shots, no declaration of war - only West Berlin's bakeries empty within a month. Moscow has given its tacit consent."
 krcw_world.10.a:0 "The tracks require \"repairs\"."
 krcw_world.10.b:0 "Stricter inspections will do; no blockade."
 krcw_world.11.t:0 "West Berlin Besieged"
 krcw_world.11.d:0 "At four this morning every signal east of Magdeburg turned red. The last freight train into Berlin brought a telegram: \"Corridor closed indefinitely. Reason: technical.\"\n\nWest Berlin has 2.1 million people, flour for thirty-six days and coal for forty-five. Thaelmann telephones from Frankfurt, hoarse: \"Does the Commune still remember the winter Paris was besieged?\"\n\nThe Federal Defence Committee lays out three plans: throw every transport aircraft into a \"bread bridge\" over Brandenburg; send an armoured convoy down the autobahn to force the way; or accept East Germany's terms and trade political concessions in West Berlin for the reopening of the line."
 krcw_world.11.a:0 "Build the bread bridge!"
 krcw_world.11.b:0 "Send the armoured convoy."
 krcw_world.11.c:0 "Sit down and talk."
 krcw_world.12.t:0 "The Bread Bridge"
 krcw_world.12.d:0 "The roar over Berlin has now lasted three weeks. Every ninety seconds a transport bearing the red star and the French roundel lands at Tempelhof. Pilots tie chocolate bars to little parachutes and drop them to the children waiting at the airfield fence.\n\n\"They can close the railway,\" the chairman of the West Berlin Workers' Council said on the radio, \"but they cannot close the sky.\" The gendarmerie in Potsdam has orders not to fire on the aircraft. Not yet, at least."
 krcw_world.12.a:0 "Plane after plane, until the blockade breaks."
 krcw_world.12.b:0 "How long can they fly? One winter?"
 krcw_world.12.c:0 "The whole world is watching Tempelhof."
 krcw_world.13.t:0 "Moscow Decides on Berlin"
 krcw_world.13.d:0 "An urgent cable from Potsdam: the Internationale's convoy has reached the mouth of the corridor, and the East German armour waits on the other side. Manstein requests authority - if they cross the boundary posts, does he open fire?\n\nSavinkov writes a line in the margin of the cable and crosses it out. Russia needs the nail of Berlin. Russia does not need a world war over it in 1950."
 krcw_world.13.a:0 "Order Potsdam to stand aside."
 krcw_world.13.b:0 "Let them try."
 krcw_world.14.t:0 "The Bridge Holds"
 krcw_world.14.d:0 "The blockade is in its third month. Bread in West Berlin is still rationed, but no one has starved; Tempelhof's runways have been extended twice, and the Internationale has taken to flying in pianos and printing presses just to show off.\n\nThe air generals in Potsdam propose a dangerous idea: searchlight dazzling and \"accidental\" flak exercises, to teach the transport pilots that the sky does not belong to them."
 krcw_world.14.a:0 "The blockade has failed. Reopen the line."
 krcw_world.14.b:0 "Harass the air corridor."
 krcw_world.15.t:0 "The Berlin Corridor Reopens"
 krcw_world.15.d:0 "At 1:05 a.m. the first freight train whistles into the Charlottenburg goods yard. The crowd on the platform sings the Internationale; some old men sing Die Wacht am Rhein instead, and no one corrects them.\n\nThe bread crisis is over. Both sides claim victory, and both sides know the truth: in Berlin, no one dares fire the first shot. That may be the first rule of the Cold War."
 krcw_world.15.a:0 "The sky is free, and so is Berlin."
 krcw_world.15.b:0 "A tactical adjustment."
 krcw_world.15.c:0 "The world breathes out."
 krcw_world.16.t:0 "Transports in the Searchlights"
 krcw_world.16.d:0 "Last night a transport was hit by flak fragments over Potsdam and crash-landed at Tempelhof; two crewmen are badly hurt. East Berlin calls it an \"exercise accident\".\n\nThe air federation demands fighter escorts and a \"proportionate response\" against the offending battery. The old syndicalists of the Defence Committee say nothing: once an escort fighter opens fire, Berlin is no longer a question of bread."
 krcw_world.16.a:0 "Do not return fire. Keep flying."
 krcw_world.16.b:0 "Destroy that battery."
 krcw_world.17.t:0 "Shots over Berlin"
 krcw_world.17.d:0 "The ceasefire on the Elbe is over. This morning Brandenburg's artillery opened fire on the outer defences of West Berlin, and the Internationale's fighters fell upon the airfields of Potsdam.\n\nIn Paris and Moscow no one will admit to the first shot; in the cellars of Berlin people know only that the guns have returned. Every capital asks the same question: is this a local war - or the first day of the Third World War?"
 krcw_world.17.a:0 "They forced our hand."
 krcw_world.17.b:0 "Berlin shall belong to all of Germany."
 krcw_world.17.c:0 "God have mercy on Europe."
 krcw_world.18.t:0 "A Berlin Compromise"
 krcw_world.18.d:0 "After weeks of tense talks, delegates of East and West Germany have signed in neutral Bern a protocol on the \"technical administration\" of the Berlin rail corridor. The trains will run, but every wagon will be jointly inspected.\n\nThaelmann calls it \"bitter bread\"; Potsdam calls it \"a victory for sovereignty\". For the housewives of West Berlin what matters is that the bakery shelves are full again."
 krcw_world.18.a:0 "Bitter, but not fatal."
 krcw_world.18.b:0 "They blinked."
 krcw_world.18.c:0 "At least there was no war."
 krcw_world.30.t:0 "The Sun over Reggane"
 krcw_world.30.d:0 "Deep in the Algerian Sahara, the Reggane proving ground. Atop a thirty-metre steel tower hangs what the Commune's scientists call \"Louise\" - after Louise Michel, heroine of the Paris Commune.\n\nThe Atomic Energy Commission reports that all is ready. Only the Federal Defence Committee's signature is needed. The question is how the Commune will announce this new sun to the world."
 krcw_world.30.a:0 "Let Moscow see it."
 krcw_world.30.b:0 "Propose, at the same time, that it never be used on cities."
 krcw_world.31.t:0 "The Commune Has the Bomb"
 krcw_world.31.d:0 "At 5:10 this morning the Saharan sky was torn open by a light brighter than noon. The French Commune announced that its first atomic device, \"Louise\", had been successfully tested at Reggane.\n\n\"This sun belongs to no general,\" the Federation's communiqué read. \"It belongs to the workers who never again wish to see a city burn.\" Moscow kept silent for twenty hours, then declared that the Russian State \"is fully able to, and shall\" possess the same weapon."
 krcw_world.31.a:0 "Peace now has a shield."
 krcw_world.31.b:0 "We must hurry."
 krcw_world.31.c:0 "The world is different now."
 krcw_world.32.t:0 "Novaya Zemlya"
 krcw_world.32.d:0 "The Arctic Ocean, Novaya Zemlya, Project \"Northern Lights\". For twelve years it has swallowed a third of the Urals' electricity and the lives of thousands of convict labourers. Today the scientists report the device is in place.\n\nSince the white flash at Reggane Moscow has lived five years in Paris's shadow. Now it is time for the world to know that Russia has its own sun."
 krcw_world.32.a:0 "Detonate."
 krcw_world.32.b:0 "Detonate - and declare it is for retaliation only."
 krcw_world.33.t:0 "The Balance of Terror"
 krcw_world.33.d:0 "The Russian State announced that its first atomic bomb had been successfully tested on Novaya Zemlya. Seismographs in northern Norway recorded the blast.\n\nFrom today there are two man-made suns, one hanging over Paris and one over Moscow. Commentators have begun to use a new phrase - \"the balance of terror\". The Elbe, the Mississippi, the Himalaya: the meaning of every ceasefire line was rewritten overnight."
 krcw_world.33.a:0 "We must work harder for peace."
 krcw_world.33.b:0 "Russia bows to no one now."
 krcw_world.33.c:0 "Two suns, one world."
 krcw_world.41.t:0 "Satellite \"1871\""
 krcw_world.41.d:0 "Hammaguir launch site, Algeria. A \"Gemstone\" rocket stands in the desert dawn; inside its fairing is an aluminium sphere fifty-eight centimetres across and eighty-three kilograms in weight, its four antennae like a butterfly's feelers.\n\nIts name was chosen long ago: \"1871\", for the Commune that lived only seventy-two days. The Federation has only to decide one thing: will its radio signal be Commune cipher, or plain tones any radio in the world can hear?"
 krcw_world.41.a:0 "Let it sing the Internationale from the sky."
 krcw_world.41.b:0 "Open its telemetry to scientists all over the world."
 krcw_world.42.t:0 "A Russian Star"
 krcw_world.42.d:0 "On the steppe at Tyuratam a squat R-series rocket breathes white vapour into the cold wind. Chief Designer Korolev has not slept for three days.\n\nIntelligence says the French \"1871\" is only weeks from launch. If Russia gets there first, it will be the first time since Savinkov that Moscow raises its head before the whole world."
 krcw_world.42.a:0 "Ignition!"
 krcw_world.43.t:0 "The Commune in the Sky"
 krcw_world.43.d_open:0 "The French Commune announced that its first artificial satellite, \"1871\", has entered orbit around the Earth. Every ninety-six minutes it passes overhead with a crisp \"beep - beep\". The Commune also announced that all telemetry will be open to observatories of every nation. From Reykjavik to Melbourne radio amateurs stayed up all night by their sets; even astronomers at Moscow University are said to be quietly logging its orbit."
 krcw_world.43.d_closed:0 "The French Commune announced that its first artificial satellite, \"1871\", has entered orbit around the Earth. Its radio signal is said to tap out the first four bars of the Internationale in Morse. In the streets of Paris people search the night sky for the moving star; Moscow has announced it will double its own rocket programme. The space race has begun."
 krcw_world.43.a:0 "First Paris, then the stars."
 krcw_world.43.b:0 "We will catch up."
 krcw_world.43.c:0 "Tonight, everyone looks up."
 krcw_world.44.t:0 "Russia's First Satellite"
 krcw_world.44.d:0 "To everyone's surprise the Russian State has launched the first artificial satellite in history. On Moscow radio the announcer's voice trembled: \"Tonight a Russian star shines over Paris.\"\n\nIn the Federation building in Paris a furious argument broke out over why \"1871\" came second. Around the world people realised for the first time that the fire that rose over Reggane and Novaya Zemlya could also carry mankind in another direction."
 krcw_world.44.a:0 "We lost a round, not the race."
 krcw_world.44.b:0 "Russia leads!"
 krcw_world.44.c:0 "The stars belong to no bloc."
 krcw_world.50.t:0 "Operation Volga"
 krcw_world.50.d:0 "On the General Staff map a red line runs from Minsk to Chicago. The French have kept intermediate-range missiles in Winnipeg and in syndicalist Pittsburgh for two years; each can reach any city of Long's United States in fifteen minutes. Russia's missiles are still an ocean away.\n\nOperation Volga proposes to ship forty-two IRBMs through Mexico and New Orleans disguised as farm machinery, and deploy them in secret among the cornfields of Minnesota, Iowa and Missouri - from where Chicago, Detroit, Toronto and the whole Great Lakes industrial belt would be within range.\n\nIf it works, the balance of terror will for the first time truly balance. If it is discovered..."
 krcw_world.50.a:0 "Execute Volga."
 krcw_world.50.b:0 "Too reckless. Cancel it."
 krcw_world.58.t:0 "\"Tractors\" in the Cornfields"
 krcw_world.58.d:0 "The Russians' \"farm machinery\" is being unloaded on the docks of New Orleans and trucked north along the west bank of the Mississippi. Each piece needs twenty men, a flatbed trailer and an order forbidding photographs.\n\nThe generals in New Orleans are elated: at last the red commissars of Chicago and Detroit will know how it feels to be targeted. But some murmur a warning: if Paris decides to strike first, the first warheads will fall on Des Moines, St. Louis and Minneapolis."
 krcw_world.58.a:0 "Welcome our Russian friends."
 krcw_world.58.b:0 "Demand a \"dual key\": no launch without our consent."
 krcw_world.51.t:0 "Photographs from Twenty Thousand Metres"
 krcw_world.51.d:0 "A syndicalist high-altitude reconnaissance plane out of Illinois has photographed the Iowa-Minnesota borderlands from twenty thousand metres. The light in the interpretation room burned all night. At dawn the analysts pinned the enlargements on the wall: launchers, fuel trucks, concrete pads laid out in a triangle.\n\nIntermediate-range missiles. Range two thousand kilometres. Chicago, Detroit, Cleveland, Toronto and Winnipeg all inside the circle.\n\nThe Federal Defence Committee meets in emergency session. There are three plans on the table: declare a \"maritime quarantine\" of the Gulf of Mexico and the Pacific coast of Mexico to stop further shipments; issue Moscow a forty-eight-hour ultimatum, failing which the sites will be bombed; or say nothing yet and bargain with Moscow through secret channels."
 krcw_world.51.a:0 "Maritime quarantine."
 krcw_world.51.b:0 "A forty-eight-hour ultimatum."
 krcw_world.51.c:0 "Keep quiet; negotiate in secret."
 krcw_world.52.t:0 "The Great Lakes Missile Crisis"
 krcw_world.52.d_q:0 "Tonight the French Commune released photographs of Russian missile sites in the cornfields of Iowa and Minnesota and declared a \"maritime quarantine\" of the Gulf of Mexico and the Pacific coast of Mexico, effective immediately: every ship bound for Long's United States must submit to inspection by the Internationale's navies.\n\nIn Chicago, Detroit and Toronto civil defence sirens sounded for the first time without a drill; all around the Great Lakes citizens are stockpiling tins in their cellars. The world holds its breath for Moscow's answer."
 krcw_world.52.d_u:0 "Tonight the French Commune released photographs of Russian missile sites in the cornfields of Iowa and Minnesota and issued Moscow an ultimatum: remove the missiles within forty-eight hours or the Internationale's air forces will destroy them.\n\nChicago, Detroit, New Orleans, Dallas: every city on the continent is on the same map. The radio reads out the locations of shelters over and over. These may be the longest forty-eight hours in human history."
 krcw_world.52.a:0 "We will not flinch before missiles on the lakes."
 krcw_world.52.b:0 "And what of their missiles in Canada?"
 krcw_world.52.c:0 "Please - everyone, calm down."
 krcw_world.57.t:0 "Sirens over the Lakes"
 krcw_world.57.d:0 "The missiles' range circle covers most of our country - every factory and union hall on the Great Lakes. Union halls are packed with civil defence volunteers, and schools teach children to hide under their desks. Someone has painted on a factory wall: \"We are not pawns.\""
 krcw_world.57.a:0 "Mobilise civil defence."
 krcw_world.57.b:0 "Urge Paris to restraint."
 krcw_world.53.t:0 "Moscow's Choice"
 krcw_world.53.d_q:0 "The Internationale's destroyers have stopped the first Russian freighter in the Gulf of Mexico. Six more are still steaming across the Atlantic, their captains awaiting orders from the Kremlin.\n\nMeanwhile a French diplomat has passed a note through the secret Vienna channel: if Russia removes the Great Lakes missiles, the Commune will quietly remove its own from Winnipeg and Pittsburgh within six months and pledge not to invade the United States."
 krcw_world.53.d_u:0 "Paris's ultimatum has thirty hours left. The Internationale's bombers are fuelled on the runways of Chicago and Winnipeg.\n\nRussia's generals are split: one faction wants the missiles put on alert, \"so they know Moscow can shoot too\"; the other reminds the room that the cornfield sites have no air defence at all, and that once war begins our American ally will be the first to burn."
 krcw_world.53.a:0 "Missiles for missiles - accept the trade."
 krcw_world.53.d:0 "Withdraw. Moscow will not burn Moscow for Chicago."
 krcw_world.53.b:0 "The convoy sails on."
 krcw_world.53.c:0 "Put the missiles on alert."
 krcw_world.54.t:0 "Black Saturday"
 krcw_world.54.d:0 "The Russian convoy did not turn back. This morning an Internationale reconnaissance plane was shot down over Iowa; the pilot is dead. This afternoon a destroyer dropped practice depth charges on a Russian submarine that refused to surface.\n\nIn the Defence Committee someone pounds the table and demands immediate air strikes; someone else holds up the note from Vienna: \"They are still talking. As long as they are talking, we have not lost.\""
 krcw_world.54.a:0 "Give talks one more chance - accept their terms in private."
 krcw_world.54.b:0 "Strike the missile sites."
 krcw_world.55.t:0 "The Crisis Is Over"
 krcw_world.55.d_deal:0 "Radio Moscow announced this morning that \"out of responsibility for peace\" Russia will dismantle the \"defensive weapons\" deployed in Iowa and Minnesota. Hours later Paris announced it would \"reassess\" its missile deployments in Canada and the Syndicates.\n\nNo one won and no one lost - or rather, everyone won. The people of Chicago and Detroit came up from their cellars into the first clear day in thirteen. In Paris and Moscow both leaders said the same words: \"Never again.\""
 krcw_world.55.d_ti:0 "Six hours before the ultimatum expired the Russian missiles began to leave the west bank of the Mississippi. Moscow received nothing in return.\n\nThe streets of Paris erupted in celebration, while in the Kremlin the generals stared at the map in silence - they will not forget this humiliation. Yet after standing on this brink, even the hardest men began to ask whether two nuclear powers needed a telephone line that would never be engaged."
 krcw_world.55.d_ma:0 "The Internationale did not strike. After secret talks the Commune agreed to remove its missiles from Winnipeg and Pittsburgh, while Russia's missiles - for now - stay west of the Mississippi, aimed at the Great Lakes.\n\nMoscow proclaimed \"a victory for peace\"; at the Federal Congress in Paris the Defence Committee faced harsh questioning. But everyone understood that the world had stood one step from the abyss."
 krcw_world.55.a:0 "Reason has prevailed."
 krcw_world.55.b:0 "We have kept our dignity."
 krcw_world.55.c:0 "We are still alive."
 krcw_world.56.t:0 "Fire on the Lakes"
 krcw_world.56.d:0 "This morning the Internationale's bombers crossed the Mississippi. Behind them comes the war of a whole continent.\n\nMoscow has declared a state of war with the French Commune; on the Mississippi, a front silent for sixteen years has been lit again by artillery. Radio stations across the world have interrupted their programmes. The Elbe, the Himalaya, the Taiwan Strait: every ceasefire line awaits the answer to a single question - where will the first atomic bomb fall?"
 krcw_world.56.a:0 "Fight - for the future of mankind."
 krcw_world.56.b:0 "They struck first."
 krcw_world.56.c:0 "Dear God..."
 krcw_world.64.t:0 "The Paris-Moscow Hotline"
 krcw_world.64.d:0 "A teleprinter line running through Helsinki, Stockholm and Copenhagen today linked the Federation building directly with the Kremlin. The first test message came from Paris: \"The quick brown fox jumps over the lazy dog 1234567890.\" Moscow replied with a poem by Pushkin.\n\nIt is not peace - only a wire. But after thirteen days on the Great Lakes, that wire may matter more than any treaty."
 krcw_world.64.a:0 "First a telephone, then a conversation."
 krcw_world.64.b:0 "At least now they can hear us."
 krcw_world.64.c:0 "The world can finally breathe."
 krcw_world.60.t:0 "The Stockholm Moratorium"
 krcw_world.60.d:0 "In neutral Stockholm delegates of the French Commune and the Russian State signed the Stockholm Moratorium, pledging to end nuclear tests in the atmosphere, in outer space and under water. The agreement runs to seven pages, three of them signatures.\n\n\"We have not dismantled a single missile,\" the Paris delegate admitted. \"But for the first time we have agreed on something: there should be no strontium-90 in the milk our children drink.\""
 krcw_world.60.a:0 "A first step."
 krcw_world.60.b:0 "It costs us little."
 krcw_world.60.c:0 "The sky is a little cleaner."
 krcw_world.61.t:0 "Volga Wheat, Rhône Machine Tools"
 krcw_world.61.d:0 "The poor harvest of 1953 has emptied Russia's granaries. Unexpectedly Moscow has applied to open an account with the Paris Clearing Union - Siberian timber and oil in exchange for the Internationale's fertiliser, tractors and machine tools.\n\nThe Federal Congress approved the deal by a narrow majority. Opponents call it \"feeding the enemy\"; supporters quote an old saying: \"People who trade with each other rarely shoot each other.\""
 krcw_world.61.a:0 "Solidarity can do business too."
 krcw_world.61.b:0 "Bread matters more than pride."
 krcw_world.61.c:0 "A window opens in the curtain."
 krcw_world.62.t:0 "Visiting Passes in Berlin"
 krcw_world.62.d:0 "For the first time in fifteen years residents of East and West Berlin may cross the line on \"visiting passes\" - three days with family at Christmas and three at Easter. On the first day the queue at the checkpoints was four kilometres long.\n\nAn eighty-year-old woman wept for a long time at the checkpoint railings. Her daughter lives five streets away."
 krcw_world.62.a:0 "The wire is starting to rust."
 krcw_world.62.b:0 "A humanitarian gesture."
 krcw_world.62.c:0 "Berlin is smiling."
 krcw_world.63.t:0 "After the Balance of Terror"
 krcw_world.63.d_warm:0 "Looking back on the 1950s, the world stood again and again at the cliff edge - over Berlin's bread, Reggane's white flash, the missiles on the Great Lakes. Today there is a hotline between Paris and Moscow, no test clouds in the sky, and even Russia's name in the ledgers of the Clearing Union.\n\nThe Cold War is not over. But a new word has begun to appear in the newspapers: \"coexistence\"."
 krcw_world.63.d_cold:0 "In 1953 the world is still divided by wire and missiles. Every attempt at détente has withered in suspicion, and both blocs' military budgets keep rising year after year.\n\nCommentators call it \"a frozen peace\". Perhaps one day the ice will melt - but not today."
 krcw_world.63.a:0 "The future belongs to cooperation."
 krcw_world.63.b:0 "We remain vigilant."
 krcw_world.63.c:0 "Let us hope for better years."
 krcw_world.70.t:0 "The Stockholm Olympics"
 krcw_world.70.d:0 "The XV Olympic Games have opened in neutral Stockholm - the first time since the war that athletes of both blocs compete on the same field. At the opening ceremony the Internationale's delegation marched under red flags and the Russians in white uniforms bearing the double-headed eagle; between them the Swedish organisers had tactfully placed Iceland and Switzerland.\n\nAll eyes were on the football semi-final: the French Commune against Russia. Ninety thousand spectators, one hundred and twenty minutes, two-all, penalties. Whoever won, the next day's papers would call it \"a victory of ideology\"."
 krcw_world.70.a:0 "The Commune plays collective football!"
 krcw_world.70.b:0 "Russian will is invincible!"
 krcw_world.70.c:0 "Sport is sport."
 krcw_world.71.t:0 "The Chessboard of Zurich"
 krcw_world.71.d:0 "The World Chess Championship is being held in Zurich, and the players' identities are more dramatic than the games: playing for the Russian State is Paul Keres, an Estonian forced into Russian citizenship; playing for the French Commune is Nicolas Rossolimo, son of a White Russian émigré, born in Kiev and raised in Paris.\n\n\"An Estonian playing for Russia against a Russian playing for the Commune,\" wrote the Neue Zürcher Zeitung. \"That is the whole irony of our age.\""
 krcw_world.71.a:0 "Every move is a free choice."
 krcw_world.71.b:0 "Discipline wins at chess."
 krcw_world.71.c:0 "There is no iron curtain on a chessboard."
 krcw_world.72.t:0 "The \"King's Games\" in Melbourne"
 krcw_world.72.d:0 "The XVI Olympiad has opened in Melbourne, with the exiled Windsor king presiding over the ceremony himself. For the Internationale it was a dilemma: to send a team meant parading before a king it had overthrown; to stay away would hand the South Pacific stage to Moscow.\n\nIn the end the athletes of the British Union came. As they passed the royal box the King rose and doffed his hat to his former subjects. The stands fell silent, then broke into long applause."
 krcw_world.72.a:0 "Athletes belong to the people, not to kings."
 krcw_world.72.b:0 "The Australians will remember who respected them."
 krcw_world.72.c:0 "A graceful moment."
 krcw_world.73.t:0 "The Brussels World's Fair"
 krcw_world.73.d:0 "The Brussels World's Fair has opened. The most striking sight is two neighbouring pavilions: the Internationale's \"Tower of Labour\" shows a cybernetic planning machine, models of co-operative cities and an electronic computer that can schedule shifts for twenty factories at once; Russia's \"Imperial Gate\" displays tractors, icebreaker models and a twelve-metre bronze of Savinkov.\n\nBy one count twice as many Russian visitors toured the Tower of Labour as French visitors toured the Russian pavilion."
 krcw_world.73.a:0 "The future is on display."
 krcw_world.73.b:0 "Russian steel is more solid."
 krcw_world.73.c:0 "What a marvellous age!"
 krcw_world.76.t:0 "Close to Midnight"
 krcw_world.76.d:0 "The quarterly reports of the three Geneva ceasefire commissions have reached every foreign ministry on the same day. Violations on the Elbe, the Ohio and the Taiwan Strait lines are all at record highs, and the commissioners have stopped ending their reports with \"the situation is under control\".\n\n\"Every ceasefire line is smouldering,\" the Swiss chairman told reporters, \"and more than one man is holding a match.\""
 krcw_world.76.a:0 "This is exactly why we need solidarity."
 krcw_world.76.b:0 "Only the weak are afraid."
 krcw_world.76.c:0 "What can we do?"
 krcw_world.77.t:0 "Signs of a Thaw"
 krcw_world.77.d:0 "The quarterly report of the Geneva ceasefire commissions shows violations on the Elbe and Ohio lines falling for the third quarter running. The first trade delegation has crossed the Elbe, and the academies of Paris and Moscow have exchanged visiting scholars.\n\n\"The ice is thick,\" the commission chairman said, \"but we can already hear it cracking.\""
 krcw_world.77.a:0 "The world is moving forward."
 krcw_world.77.b:0 "Stay vigilant - but we can talk."
 krcw_world.77.c:0 "Spring always comes."
