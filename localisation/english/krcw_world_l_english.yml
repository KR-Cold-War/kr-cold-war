 krcw_world_berlin_night_flights:0 "Night Flights"
 krcw_world_berlin_night_flights_desc:0 "Fly the transports by night too - dangerous, but every extra sortie is another day of bread for West Berlin."
 krcw_world_berlin_tighten:0 "Tighten the Noose"
 krcw_world_berlin_tighten_desc:0 "More gendarmes and searchlights round Berlin; cut the smugglers' paths and the canal barges."
 krcw_world_summit:0 "Propose a Summit"
 krcw_world_summit_desc:0 "In Geneva, Stockholm or Vienna, sit at the same table as the other bloc's leader. Perhaps nothing will be agreed - but talking itself lowers the temperature."
 krcw_world_show_of_force:0 "Show of Force"
 krcw_world_show_of_force_desc:0 "A massive parade, an exercise close to the ceasefire line. Let them know we are not afraid."
 krcw_world_peace_appeal:0 "Appeal for Peace"
 krcw_world_peace_appeal_desc:0 "As a nation of no bloc, we can remind the two giants from the world's rostrums that they are not alone on this planet."
 krcw_psa_contest:0 "Courting the Constitutional Coalition"
 krcw_psa_contest_desc:0 "The Constitutional Coalition in Sacramento holds the West Coast, Alaska and the Pacific Fleet and recognises neither New York nor New Orleans. Whichever side's lean reaches §Y100§! first will win the West Coast.\n\nCurrent lean: Internationale §R[?PSA.krcw_psa_lean_ti|0]§!  Moscow Accord §g[?PSA.krcw_psa_lean_ma|0]§!"
 krcw_world_situation:0 "World Situation"
 krcw_world_situation_desc:0 "World Tension: §R[?global.krcw_tension|0]§! / 100\nDétente: §G[?global.krcw_detente|0]§! / 100\n\nAbove 70 tension, crises escalate into war more easily; the higher détente climbs, the closer the world comes to \"coexistence\"."
