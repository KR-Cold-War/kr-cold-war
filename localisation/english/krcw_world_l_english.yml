 krcw_paris_clearing_union:0 "Paris Clearing Union"
 krcw_paris_clearing_union_desc:0 "Industrial federations settle accounts in \"labour clearing units\"; surpluses turn automatically into technical aid and equipment credit. Globalisation without bankers."
 krcw_dual_key_demand:0 "Demanded a \"Dual Key\""
 krcw_psa_courted:0 "Courted the Constitutional Coalition"
 krcw_world.80.t:0 "West of the Rockies"
 krcw_world.80.d:0 "When the civil war ended, the constitutional government in Sacramento surrendered neither to New York nor to New Orleans. The Constitutional Coalition held the coast from San Diego to Alaska, and the Pacific Fleet, which followed the west coast governors in 1936, is still theirs. The Congress in Sacramento meets as usual and the President is elected every four years; this January Earl Warren took the oath. But the War Powers Act of 1942 is still in force, and the ports of San Francisco, Oakland and Seattle are still run by General MacArthur's Western Defense Command.\n\nThe Coalition is too small to defeat either of the other two Americas, and too important for either to ignore. New Orleans and New York are both beckoning, and so are Moscow and Paris. Fuel, spare parts, loans, votes in Congress and the loyalty of the Presidio generals all have bidders."
 krcw_world.80.a:0 "The Constitution of the United States sits in Sacramento."
 krcw_world.81.t:0 "A Red Flagship"
 krcw_world.81.d:0 "The general strike on the San Francisco waterfront is in its third week, and red flags fly over the Oakland shipyards. The Congress in Sacramento has voted by a majority to repeal the War Powers Act and authorised the President to negotiate with New York and Paris. General MacArthur boarded a plane for Manila one foggy night, and the colonels left in the Presidio found that Paris's fuel and New York's pay had long since brought half the fleet over to the workers.\n\nOnly one question remains: in what form do we join? As part of the Combined Syndicates of America, or as an independent member of the Internationale?"
 krcw_world.81.a:0 "Return to America: the syndicalist America."
 krcw_world.81.b:0 "Join the Internationale as an equal."
 krcw_world.81.c:0 "No. We follow no one."
 krcw_world.82.t:0 "The Call of New Orleans"
 krcw_world.82.d:0 "The President and the envoys from New Orleans talked through the whole night in Sacramento, with General MacArthur up from the Presidio to sit in. Russian oil and Long's loans carried the Coalition through the hardest years. Long promises that the west coast states keep their governors and their seats in Congress, and promises the general a marshal's baton; the strike agitators on the waterfront were quietly put aboard supply ships bound for the Aleutians one night by the Western Defense Command. Congress has approved the talks by a majority.\n\nOnly one question remains: in what form do we join? As part of Long's United States, or as an independent member of the Moscow Accord?"
 krcw_world.82.a:0 "Return to America: Long's America."
 krcw_world.82.b:0 "Join the Moscow Accord as an equal."
 krcw_world.82.c:0 "No. We follow no one."
 krcw_world.83.t:0 "The Pacific Fleet Chooses a Side"
 krcw_world.83.d_ti:0 "The Congress in Sacramento voted today to end the neutrality the Coalition had kept since the civil war, and to join the side of the Internationale. Over the forts of the Golden Gate a red flag rose beside the forty-eight stars.\n\nFrom the Aleutians to San Diego the balance of power in the Pacific was rewritten overnight. New Orleans calls it \"treason\"; Moscow has begun to recalculate its sea lanes to Mexico."
 krcw_world.83.d_ma:0 "The Congress in Sacramento voted today to end the neutrality the Coalition had kept since the civil war, and to join the side of the Moscow Accord. The ports of the West Coast are now open to Russian transports.\n\nFrom the Aleutians to San Diego the balance of power was rewritten overnight. New York calls it \"a betrayal of the Constitution\"; Paris has begun an urgent review of the defences of Canada's west coast."
 krcw_world.83.a:0 "The Pacific is a workers' ocean."
 krcw_world.83.b:0 "The sea belongs to the strong."
 krcw_world.83.c:0 "Will the Pacific still be open to us?"
 krcw_world.84.t:0 "The Honolulu Accords"
 krcw_world.84.d:0 "In the climate of the hotline and détente, Paris, Moscow and their two allies in North America signed an accord in Honolulu: the neutrality of the Constitutional Coalition is jointly guaranteed, the ports of the West Coast are open to merchant ships of all nations, and no nuclear weapons may be stationed on the Pacific islands.\n\nThe Congress in Sacramento ratified the accord by a majority. The Western Defense Command's military districts were abolished and the ports handed back to the city governments; the Presidio generals complained in public, but none defied Congress."
 krcw_world.84.a:0 "An ocean of peace."
 krcw_world.84.b:0 "An acceptable arrangement."
 krcw_world.84.c:0 "The Canal is open!"
 krcw_world.85.t:0 "A Funeral in New Orleans"
 krcw_world.85.d:0 "Huey Long is dead. The funeral procession in New Orleans is six miles long; in New York the front page of the syndicalist papers carries a single line: \"The King is dead.\"\n\nThe Foreign Affairs Committee of the Congress in Sacramento sits through the night, and so do the generals in the Presidio. Long's death has thrown the United States into a succession crisis, and for the first time the neutrality of the Coalition looks less than secure: New Orleans's new masters and New York's syndicates alike are searching urgently for allies who can give them a footing in the Pacific."
 krcw_world.85.a:0 "Reach out to the new government in New Orleans."
 krcw_world.85.b:0 "Open contacts with the syndicates in New York."
 krcw_world.85.c:0 "Neutrality stands."
 krcw_psa_ti_aid:0 "Fuel and Spare Parts"
 krcw_psa_ti_aid_desc:0 "The tanks at San Diego are down to thirty percent. A shipload of fuel and a crate of radar valves will move the captains more than a hundred editorials."
 krcw_psa_ti_admirals:0 "Win Over Congress and the Presidio"
 krcw_psa_ti_admirals_desc:0 "Loans and contracts for the committee chairmen of the Congress in Sacramento, promotions and post-war posts for the Presidio generals. Congress has to ratify an alliance and the Presidio has to hold the ports, so both must be looked after."
 krcw_psa_ti_propaganda:0 "West Coast Radio"
 krcw_psa_ti_propaganda_desc:0 "Over the shortwave, into the docks of San Francisco, the plants of Seattle, the voters of Sacramento and the radio room of every warship: music, news and our case for America."
