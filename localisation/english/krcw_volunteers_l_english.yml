l_english:
# krcw: years paced
 krcw_volunteers_tt:0 "§YVolunteers§! may be sent to this theatre"
 krcw_volunteer_mobilisation:0 "Volunteer Mobilisation"
 krcw_volunteer_mobilisation_desc:0 "The enlistment desks stand in union halls and university canteens. Officially these are \"acts of individual internationalism\"; on the back of the form is a unit number and an assembly point."
 krcw_proxy_commitment:0 "The Burden of Proxy War"
 krcw_proxy_commitment_desc:0 "No one declared war, yet the munitions, the advisers and the widows' pensions are all real. Every \"someone else's war\" leaves a line in the budget at home."
 krcw_vol_gratitude:0 "Blood of Volunteers"
 krcw_vol_resentment:0 "Interference in Our War"
 krcw_ti_brigades_cat:0 "The International Brigades"
 krcw_ti_brigades_cat_desc:0 "The Spanish tradition did not die. Wherever a red flag goes up, the queues form at the Paris enlistment desks."
 krcw_ti_open_the_enlistment:0 "Open the Enlistment Desks"
 krcw_ti_open_the_enlistment_desc:0 "Tables appear outside the union halls. Officially acts of individual internationalism; everyone knows what that means."
 krcw_ti_brigade_to_lhasa:0 "A Brigade for the Snows"
 krcw_ti_brigade_to_lhasa_desc:0 "The Republic of China is the Internationale's Asian pillar. If the Lhasa revolt wins, the Indian princes win a round of the Cold War."
 krcw_ti_brigade_to_katanga:0 "Aid the Katanga Miners"
 krcw_ti_brigade_to_katanga_desc:0 "The Copperbelt councils fly the red flag. Paris cannot watch a genuine workers' rising and do nothing, even inside the Zambezi Federation."
 krcw_ti_brigade_to_pindus:0 "The Pindus Partisans"
 krcw_ti_brigade_to_pindus_desc:0 "The Greek syndicalists have been three years in the mountains. Italian fishing boats crossing the Strait of Otranto by night can land rifles, radios and doctors in the coves of Epirus."
 krcw_ti_brigade_to_the_ohio:0 "Volunteers for the Ohio"
 krcw_ti_brigade_to_the_ohio_desc:0 "The Combined Syndicates fight alone across the great river. The Canadian railways can carry both men and rifles."
 krcw_ma_advisers_cat:0 "The Military Missions"
 krcw_ma_advisers_cat_desc:0 "Moscow sends no \"volunteers\": it sends advisers, instructors and technical personnel. The distinction is on paper, not on the battlefield."
 krcw_ma_open_the_missions:0 "Form the Military Missions"
 krcw_ma_open_the_missions_desc:0 "The general staff details officers whose passports read \"agricultural specialist\". Their luggage holds doctrine, maps and a wireless set."
 krcw_ma_advisers_to_lhasa:0 "Advisers to Lhasa"
 krcw_ma_advisers_to_lhasa_desc:0 "An independent Tibet pins the Republic of China to the Himalaya for ever. The investment is cheap."
 krcw_ma_advisers_to_lusaka:0 "Support Lusaka"
 krcw_ma_advisers_to_lusaka_desc:0 "The Zambezi Federation is no Accord member, but it is crushing a syndicalist rising. That is friendship enough."
 krcw_ma_advisers_to_athens:0 "Counter-Insurgency Advisers for Athens"
 krcw_ma_advisers_to_athens_desc:0 "Papagos's army has chased partisans through the Pindus for three years. Moscow's advisers bring mountain-warfare doctrine and helicopters."
 krcw_ma_advisers_to_new_orleans:0 "Munitions for New Orleans"
 krcw_ma_advisers_to_new_orleans_desc:0 "The arms landed at Tampico have fed Long's army for ten years. When war comes, the conduit must triple."
