 krcw_gv_help_t0:0 "§YThe Geneva Ceasefire Regime§!"
 krcw_gv_help_b0:0 "There is no United Nations in this world. The Elbe ceasefire and the Qingdao armistice of 1944 and the St. Louis armistice of 1946 never became peace treaties, and three ceasefire commissions hold the three fronts. Switzerland and Sweden chair the Elbe and Qingdao commissions; Mexico and Canada chair the St. Louis commission, one for each side, with Switzerland and Sweden in attendance.\n\nEvery nine months or so the leaders of the two blocs meet in Geneva. Each session has four items on its agenda, and the fourth is always \"the conclusion of a peace treaty\". Every session puts it off to the next.\n\nThe Cold War ends in only two ways: a world war, or the collapse of one bloc. After a collapse the winner calls a last session, and the fourth item is discussed for the first time."
 krcw_gv_help_t1:0 "§YThe Ceasefire Commissions§!"
 krcw_gv_help_b1:0 "Border incidents add open cases to a commission. Either side can file evidence for 25 political power, and a month later the commission rules: a violation on the other side's record, not enough evidence, or a successful counter-claim that goes on our own record. The more violations we already have, the likelier a counter-claim. Provocations such as raids, shelling or tightening a blockade go straight onto our own record.\n\nWhen each Geneva session opens, the side with fewer violations gains influence in the neutral countries. If the front goes back to war, the side with fewer violations gets \"They Broke the Ceasefire\" (war support +10%, 180 days); the side with more loses 10% stability and influence among the neutrals.\n\nA commission session costs 35 political power and lowers the front meter by 10. Each of the four confidence-building measures can be done once; the other side must accept, and then the meter falls by 8. Walking out adjourns the commission: the meter rises one point faster each month and the road back to war gets shorter. The side that walked out pays 50 political power to return."
 krcw_gv_help_t2:0 "§YThe Geneva Conference§!"
 krcw_gv_help_b2:0 "A session lasts one month. Paris and Moscow choose on the conference page which item to back, or stall everything. If both back the same item it passes; items that fail go back into the pool and may be drawn again. Stalling everything counts as obstruction, and the other bloc gains influence among the neutrals.\n\nBetween sessions a bloc member can submit a proposal for 25 political power, and the next session will carry its bloc's item. Switzerland and Sweden can mediate for 50 political power: at the next session an item passes if one side backs it and the other does not stall everything.\n\nEach item in the pool can pass only once. Its effect is shown next to it."
 krcw_gv_help_t3:0 "§YStanding in the Ceasefire Regime§!"
 krcw_gv_help_b3:0 "CWIC's \"International Status\" is replaced by standing in the ceasefire regime.\n\nCeasefire signatories: France, Britain, West Germany, Italy, Russia, East Germany, China, Japan, the Combined Syndicates and Long's America. Political power +0.25 a day, stability +5%.\nNeutral guarantors: Switzerland and Sweden. The same, plus mediation and investigators.\nOrdinary states: everyone else, with no modifier.\nBelligerent movements: the rebel governments of the proxy wars. Stability -5%, consumer goods +10%.\n\nStanding no longer decides who may send volunteers; spheres of influence and the volunteer decisions do."
 krcw_gv_elbe_desc:0 "The war in Europe ended with the Elbe ceasefire of 1944 and no peace treaty. Switzerland and Sweden chair the Elbe Commission; West Germany, France and Britain sit on one side, East Germany and Russia on the other."
 krcw_gv_elbe_restart:0 "The general war plan needs world tension above 70, or above 60 while the commission is adjourned."
 krcw_gv_elbe_evid_btn_tt:0 "§YFile Evidence§!\nCosts 25 political power and needs an open case; one ruling at a time. The commission rules a month later. Once every 2 months per side."
 krcw_gv_elbe_session_btn_tt:0 "§YConvene the Commission§!\nCosts 35 political power; berlin corridor pressure must be above 30. Berlin corridor pressure -10, both sides +1% stability. Once every 4 months, shared by both sides."
 krcw_gv_elbe_walk_btn_tt:0 "§YWalk Out§!\nThe commission adjourns: berlin corridor pressure rises one point faster each month and the road back to war gets shorter. The general war plan needs world tension above 70, or above 60 while the commission is adjourned."
 krcw_gv_elbe_return_btn_tt:0 "§YReturn to the Commission§!\nCosts 50 political power and the commission sits again. Only the side that walked out needs to return."
 krcw_gv_elbe_pow_btn_tt:0 "§YExchange Prisoners§!\nBoth sides return the prisoners still held in each other's camps since 1944.\n\nCosts 25 political power and needs the other side's consent. If accepted, berlin corridor pressure -8 and both sides +2% stability. Once per game."
 krcw_gv_elbe_mail_btn_tt:0 "§YRestore the Post§!\nPost runs again between the two Germanies; family letters no longer go round by Stockholm.\n\nCosts 25 political power and needs the other side's consent. If accepted, berlin corridor pressure -8 and both sides +2% stability. Once per game."
 krcw_gv_elbe_graves_btn_tt:0 "§YSearch for the Fallen Together§!\nEngineers of both sides search the old battlefields on both banks of the Elbe and register the dead.\n\nCosts 25 political power and needs the other side's consent. If accepted, berlin corridor pressure -8 and both sides +2% stability. Once per game."
 krcw_gv_elbe_flood_btn_tt:0 "§YJoint Flood Control on the Elbe§!\nThe river authorities on both banks exchange water levels and shore up the dykes together in flood season.\n\nCosts 25 political power and needs the other side's consent. If accepted, berlin corridor pressure -8 and both sides +2% stability. Once per game."
 krcw_gv_ohio_desc:0 "In 1946 the Combined Syndicates and Long's America signed an armistice at St. Louis and have faced each other along the Mississippi and the Ohio ever since. The commission sits at St. Louis, chaired by Mexican and Canadian diplomats, one for each side, with Switzerland and Sweden in attendance."
 krcw_gv_ohio_restart:0 "Tearing up the armistice needs tension above 79, or above 69 while the commission is adjourned."
 krcw_gv_ohio_evid_btn_tt:0 "§YFile Evidence§!\nCosts 25 political power and needs an open case; one ruling at a time. The commission rules a month later. Once every 2 months per side."
 krcw_gv_ohio_session_btn_tt:0 "§YConvene the Commission§!\nCosts 35 political power; mississippi line tension must be above 30. Mississippi Line tension -10, both sides +1% stability. Once every 4 months, shared by both sides."
 krcw_gv_ohio_walk_btn_tt:0 "§YWalk Out§!\nThe commission adjourns: mississippi line tension rises one point faster each month and the road back to war gets shorter. Tearing up the armistice needs tension above 79, or above 69 while the commission is adjourned."
 krcw_gv_ohio_return_btn_tt:0 "§YReturn to the Commission§!\nCosts 50 political power and the commission sits again. Only the side that walked out needs to return."
 krcw_gv_ohio_pow_btn_tt:0 "§YExchange Prisoners§!\nBoth banks exchange the prisoners left over from the civil war.\n\nCosts 25 political power and needs the other side's consent. If accepted, mississippi line tension -8 and both sides +2% stability. Once per game."
 krcw_gv_ohio_mail_btn_tt:0 "§YRestore the Post§!\nPost runs again between the banks; letters no longer go round by Toronto and Monterrey.\n\nCosts 25 political power and needs the other side's consent. If accepted, mississippi line tension -8 and both sides +2% stability. Once per game."
 krcw_gv_ohio_graves_btn_tt:0 "§YSearch for the Fallen Together§!\nEngineers of both banks search the old battlefields along the Mississippi and register the dead.\n\nCosts 25 political power and needs the other side's consent. If accepted, mississippi line tension -8 and both sides +2% stability. Once per game."
 krcw_gv_ohio_flood_btn_tt:0 "§YJoint Flood Control on the Mississippi§!\nThe engineer corps on both banks exchange water levels and shore up the levees together in flood season.\n\nCosts 25 political power and needs the other side's consent. If accepted, mississippi line tension -8 and both sides +2% stability. Once per game."
 krcw_gv_qd_desc:0 "Under the Qingdao armistice of 1944 Japan gave up Manchuria and Korea and kept Taiwan. Switzerland and Sweden chair the Qingdao Commission, which deals with the strait and the Yellow Sea."
 krcw_gv_qd_restart:0 "Crossing the strait or marching north needs world tension above 60, or above 50 while the commission is adjourned."
 krcw_gv_qd_evid_btn_tt:0 "§YFile Evidence§!\nCosts 25 political power and needs an open case; one ruling at a time. The commission rules a month later. Once every 2 months per side."
 krcw_gv_qd_session_btn_tt:0 "§YConvene the Commission§!\nCosts 35 political power; strait tension must be above 30. Strait tension -10, both sides +1% stability. Once every 4 months, shared by both sides."
 krcw_gv_qd_walk_btn_tt:0 "§YWalk Out§!\nThe commission adjourns: strait tension rises one point faster each month and the road back to war gets shorter. Crossing the strait or marching north needs world tension above 60, or above 50 while the commission is adjourned."
 krcw_gv_qd_return_btn_tt:0 "§YReturn to the Commission§!\nCosts 50 political power and the commission sits again. Only the side that walked out needs to return."
 krcw_gv_qd_pow_btn_tt:0 "§YExchange Prisoners§!\nBoth sides return the prisoners held since the battle of Liaoxi.\n\nCosts 25 political power and needs the other side's consent. If accepted, strait tension -8 and both sides +2% stability. Once per game."
 krcw_gv_qd_mail_btn_tt:0 "§YRestore the Sailings§!\nPassenger and mail steamers sail again between Shanghai, Tianjin, Kobe and Nagasaki.\n\nCosts 25 political power and needs the other side's consent. If accepted, strait tension -8 and both sides +2% stability. Once per game."
 krcw_gv_qd_graves_btn_tt:0 "§YSearch for the Fallen Together§!\nTeams from both sides search the old battlefields of North China and Liaoxi and register the dead.\n\nCosts 25 political power and needs the other side's consent. If accepted, strait tension -8 and both sides +2% stability. Once per game."
 krcw_gv_qd_civ_btn_tt:0 "§YRepatriate Civilians§!\nJapanese civilians stranded in China since the war, and Chinese stranded in Japan, go home.\n\nCosts 25 political power and needs the other side's consent. If accepted, strait tension -8 and both sides +2% stability. Once per game."
 krcw_gv_open_tt:0 "§YGeneva§!\nThe three ceasefire commissions and the Geneva Conference."
 krcw_gv_vote_btn_tt:0 "§YBack this item§!\nOnly Paris and Moscow vote. If both back the same item it passes at the close. You can change your mind during the session."
 krcw_gv_stall_btn_tt:0 "§YStall Everything§!\nNothing passes this session, and it counts as obstruction: the other bloc gains influence among the neutrals."
 krcw_gv_mediate_btn_tt:0 "§YMediate§!\nSwitzerland and Sweden only, once between sessions. Costs 50 political power. At the next session an item passes if one side backs it and the other does not stall everything."
 krcw_gv_investigate_btn_tt:0 "§YSend Investigators§!\nSwitzerland and Sweden only, once every 90 days, and there must be an open case. One case is settled on the spot; stability +1%, political power +10."
 krcw_gv_propose_btn_tt_pow:0 "§YSubmit \"Prisoners and the Missing\"§!\nEvery ceasefire signatory: stability +2%\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
 krcw_gv_propose_btn_tt_air:0 "§YSubmit \"Rules for the Berlin Air Corridors\"§!\nBerlin corridor pressure -1 a month while above 20\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
 krcw_gv_propose_btn_tt_river:0 "§YSubmit \"Shipping on the Mississippi\"§!\nMississippi Line tension -5; a year of river trade for both Americas\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
 krcw_gv_propose_btn_tt_fish:0 "§YSubmit \"Fishing Grounds in the Yellow Sea\"§!\nStrait tension -5; China and Japan: stability +1%\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
 krcw_gv_propose_btn_tt_refugee:0 "§YSubmit \"Border-Crossers and Refugees\"§!\nBoth Americas and both Germanies: stability +1%\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
 krcw_gv_propose_btn_tt_survey:0 "§YSubmit \"Surveying the Ceasefire Lines\"§!\nThe tensest front meter -5 and stops rising by itself for a year\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
 krcw_gv_propose_btn_tt_test:0 "§YSubmit \"A Moratorium on Nuclear Tests\"§!\nThe Stockholm Moratorium is signed: world tension falls\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
 krcw_gv_propose_btn_tt_sea:0 "§YSubmit \"Rules of Navigation in the North Atlantic\"§!\nWorld tension -3; France, Britain and Russia: stability +1%\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
 krcw_gv_propose_btn_tt_radio:0 "§YSubmit \"An End to Jamming\"§!\nFrance and Russia: stability +2%; both blocs' crisis meters +3\n\nA bloc member can submit between sessions for 25 political power, one item per bloc per session. The next session will carry it."
