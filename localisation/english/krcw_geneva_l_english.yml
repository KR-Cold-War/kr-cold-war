l_english:
# krcw: years paced
 krcw_gv.1.t:0 "The Geneva Conference Opens: Session [?global.krcw_gv_session|0]"
 krcw_gv.1.d:0 "The session lasts one month. The agenda:\n1. [KRCW_GvSlot1]\n2. [KRCW_GvSlot2]\n3. [KRCW_GvSlot3]\n4. The conclusion of a peace treaty\n\nOn the conference page of the Geneva tab, choose which item to back, or stall everything. The other side chooses too; an item passes only if both back it."
 krcw_gv.1.a:0 "Look at the agenda."
 krcw_gv.2.t:0 "The Geneva Conference Closes"
 krcw_gv.2.d1:0 "Session [?global.krcw_gv_session|0] of the Geneva Conference has closed. It adopted \"[KRCW_GvLastPass]\".\n\nThe fourth item, \"the conclusion of a peace treaty\", has been put off to the next session. It is the treaty's postponement number [?global.krcw_gv_deferred|0]."
 krcw_gv.2.d2:0 "Session [?global.krcw_gv_session|0] of the Geneva Conference has closed without adopting anything.\n\nThe fourth item, \"the conclusion of a peace treaty\", has been put off to the next session. It is the treaty's postponement number [?global.krcw_gv_deferred|0]."
 krcw_gv.2.a:0 "Until the next session."
 krcw_gv.3.t:0 "The Geneva Conference"
 krcw_gv.3.d:0 "The leaders of the two blocs have agreed to meet regularly in Geneva, and the delegations of all three ceasefire commissions have come. There are four items on the agenda: the first three change from session to session, and the fourth is the conclusion of a peace treaty. The conference will sit about every nine months."
 krcw_gv.3.a:0 "We shall see what can be agreed."
 krcw_gv.10.t:0 "A Ruling of the Elbe Commission"
 krcw_gv.10.d1:0 "The commission finds that the other side broke the ceasefire and enters it on their record."
 krcw_gv.10.d2:0 "The commission finds the evidence insufficient and makes no finding."
 krcw_gv.10.d3:0 "The other side filed a counter-claim. The commission finds that we broke the ceasefire and enters it on our record."
 krcw_gv.10.a:0 "File it."
 krcw_gv.20.da:0 "The delegation of West Germany has walked out of the Elbe Commission and the commission is adjourned. Until it returns, berlin corridor pressure rises one point faster each month and the road back to war is shorter."
 krcw_gv.20.db:0 "The delegation of East Germany has walked out of the Elbe Commission and the commission is adjourned. Until it returns, berlin corridor pressure rises one point faster each month and the road back to war is shorter."
 krcw_gv.20.t:0 "The Elbe Commission Adjourns"
 krcw_gv.20.a:0 "The line tightens another notch."
 krcw_gv.30.d1:0 "There is war on the ceasefire line again, and the Elbe Commission will not sit again. By the record of violations, the cleaner record belongs to West Germany, which gets \"They Broke the Ceasefire\"; East Germany has the worse record and loses stability."
 krcw_gv.30.d2:0 "There is war on the ceasefire line again, and the Elbe Commission will not sit again. By the record of violations, the cleaner record belongs to East Germany, which gets \"They Broke the Ceasefire\"; West Germany has the worse record and loses stability."
 krcw_gv.30.d0:0 "There is war on the ceasefire line again, and the Elbe Commission will not sit again. By the record of violations, both records are equal, and no one can say who broke the ceasefire first."
 krcw_gv.30.t:0 "The Elbe Commission Breaks Down"
 krcw_gv.30.a:0 "The guns are back."
 krcw_gv.100.t:0 "Elbe Commission: Exchange Prisoners"
 krcw_gv.100.d:0 "In the Elbe Commission, the other delegation proposes: Both sides return the prisoners still held in each other's camps since 1944.\n\nIf we accept, berlin corridor pressure falls by 8 and both sides gain 2% stability."
 krcw_gv.100.a:0 "Accept."
 krcw_gv.100.b:0 "Refuse."
 krcw_gv.101.t:0 "Elbe Commission: Restore the Post"
 krcw_gv.101.d:0 "In the Elbe Commission, the other delegation proposes: Post runs again between the two Germanies; family letters no longer go round by Stockholm.\n\nIf we accept, berlin corridor pressure falls by 8 and both sides gain 2% stability."
 krcw_gv.101.a:0 "Accept."
 krcw_gv.101.b:0 "Refuse."
 krcw_gv.102.t:0 "Elbe Commission: Search for the Fallen Together"
 krcw_gv.102.d:0 "In the Elbe Commission, the other delegation proposes: Engineers of both sides search the old battlefields on both banks of the Elbe and register the dead.\n\nIf we accept, berlin corridor pressure falls by 8 and both sides gain 2% stability."
 krcw_gv.102.a:0 "Accept."
 krcw_gv.102.b:0 "Refuse."
 krcw_gv.103.t:0 "Elbe Commission: Joint Flood Control on the Elbe"
 krcw_gv.103.d:0 "In the Elbe Commission, the other delegation proposes: The river authorities on both banks exchange water levels and shore up the dykes together in flood season.\n\nIf we accept, berlin corridor pressure falls by 8 and both sides gain 2% stability."
 krcw_gv.103.a:0 "Accept."
 krcw_gv.103.b:0 "Refuse."
 krcw_gv.11.t:0 "A Ruling of the St. Louis Commission"
 krcw_gv.11.d1:0 "The commission finds that the other side broke the ceasefire and enters it on their record."
 krcw_gv.11.d2:0 "The commission finds the evidence insufficient and makes no finding."
 krcw_gv.11.d3:0 "The other side filed a counter-claim. The commission finds that we broke the ceasefire and enters it on our record."
 krcw_gv.11.a:0 "File it."
 krcw_gv.21.da:0 "The delegation of the Combined Syndicates has walked out of the St. Louis Commission and the commission is adjourned. Until it returns, mississippi line tension rises one point faster each month and the road back to war is shorter."
 krcw_gv.21.db:0 "The delegation of Long's America has walked out of the St. Louis Commission and the commission is adjourned. Until it returns, mississippi line tension rises one point faster each month and the road back to war is shorter."
 krcw_gv.21.t:0 "The St. Louis Commission Adjourns"
 krcw_gv.21.a:0 "The line tightens another notch."
 krcw_gv.31.d1:0 "There is war on the ceasefire line again, and the St. Louis Commission will not sit again. By the record of violations, the cleaner record belongs to the Combined Syndicates, which gets \"They Broke the Ceasefire\"; Long's America has the worse record and loses stability."
 krcw_gv.31.d2:0 "There is war on the ceasefire line again, and the St. Louis Commission will not sit again. By the record of violations, the cleaner record belongs to Long's America, which gets \"They Broke the Ceasefire\"; the Combined Syndicates has the worse record and loses stability."
 krcw_gv.31.d0:0 "There is war on the ceasefire line again, and the St. Louis Commission will not sit again. By the record of violations, both records are equal, and no one can say who broke the ceasefire first."
 krcw_gv.31.t:0 "The St. Louis Commission Breaks Down"
 krcw_gv.31.a:0 "The guns are back."
 krcw_gv.110.t:0 "St. Louis Commission: Exchange Prisoners"
 krcw_gv.110.d:0 "In the St. Louis Commission, the other delegation proposes: Both banks exchange the prisoners left over from the civil war.\n\nIf we accept, mississippi line tension falls by 8 and both sides gain 2% stability."
 krcw_gv.110.a:0 "Accept."
 krcw_gv.110.b:0 "Refuse."
 krcw_gv.111.t:0 "St. Louis Commission: Restore the Post"
 krcw_gv.111.d:0 "In the St. Louis Commission, the other delegation proposes: Post runs again between the banks; letters no longer go round by Toronto and Monterrey.\n\nIf we accept, mississippi line tension falls by 8 and both sides gain 2% stability."
 krcw_gv.111.a:0 "Accept."
 krcw_gv.111.b:0 "Refuse."
 krcw_gv.112.t:0 "St. Louis Commission: Search for the Fallen Together"
 krcw_gv.112.d:0 "In the St. Louis Commission, the other delegation proposes: Engineers of both banks search the old battlefields along the Mississippi and register the dead.\n\nIf we accept, mississippi line tension falls by 8 and both sides gain 2% stability."
 krcw_gv.112.a:0 "Accept."
 krcw_gv.112.b:0 "Refuse."
 krcw_gv.113.t:0 "St. Louis Commission: Joint Flood Control on the Mississippi"
 krcw_gv.113.d:0 "In the St. Louis Commission, the other delegation proposes: The engineer corps on both banks exchange water levels and shore up the levees together in flood season.\n\nIf we accept, mississippi line tension falls by 8 and both sides gain 2% stability."
 krcw_gv.113.a:0 "Accept."
 krcw_gv.113.b:0 "Refuse."
 krcw_gv.12.t:0 "A Ruling of the Qingdao Commission"
 krcw_gv.12.d1:0 "The commission finds that the other side broke the ceasefire and enters it on their record."
 krcw_gv.12.d2:0 "The commission finds the evidence insufficient and makes no finding."
 krcw_gv.12.d3:0 "The other side filed a counter-claim. The commission finds that we broke the ceasefire and enters it on our record."
 krcw_gv.12.a:0 "File it."
 krcw_gv.22.da:0 "The delegation of China has walked out of the Qingdao Commission and the commission is adjourned. Until it returns, strait tension rises one point faster each month and the road back to war is shorter."
 krcw_gv.22.db:0 "The delegation of Japan has walked out of the Qingdao Commission and the commission is adjourned. Until it returns, strait tension rises one point faster each month and the road back to war is shorter."
 krcw_gv.22.t:0 "The Qingdao Commission Adjourns"
 krcw_gv.22.a:0 "The line tightens another notch."
 krcw_gv.32.d1:0 "There is war on the ceasefire line again, and the Qingdao Commission will not sit again. By the record of violations, the cleaner record belongs to China, which gets \"They Broke the Ceasefire\"; Japan has the worse record and loses stability."
 krcw_gv.32.d2:0 "There is war on the ceasefire line again, and the Qingdao Commission will not sit again. By the record of violations, the cleaner record belongs to Japan, which gets \"They Broke the Ceasefire\"; China has the worse record and loses stability."
 krcw_gv.32.d0:0 "There is war on the ceasefire line again, and the Qingdao Commission will not sit again. By the record of violations, both records are equal, and no one can say who broke the ceasefire first."
 krcw_gv.32.t:0 "The Qingdao Commission Breaks Down"
 krcw_gv.32.a:0 "The guns are back."
 krcw_gv.120.t:0 "Qingdao Commission: Exchange Prisoners"
 krcw_gv.120.d:0 "In the Qingdao Commission, the other delegation proposes: Both sides return the prisoners held since the battle of Liaoxi.\n\nIf we accept, strait tension falls by 8 and both sides gain 2% stability."
 krcw_gv.120.a:0 "Accept."
 krcw_gv.120.b:0 "Refuse."
 krcw_gv.121.t:0 "Qingdao Commission: Restore the Sailings"
 krcw_gv.121.d:0 "In the Qingdao Commission, the other delegation proposes: Passenger and mail steamers sail again between Shanghai, Tianjin, Kobe and Nagasaki.\n\nIf we accept, strait tension falls by 8 and both sides gain 2% stability."
 krcw_gv.121.a:0 "Accept."
 krcw_gv.121.b:0 "Refuse."
 krcw_gv.122.t:0 "Qingdao Commission: Search for the Fallen Together"
 krcw_gv.122.d:0 "In the Qingdao Commission, the other delegation proposes: Teams from both sides search the old battlefields of North China and Liaoxi and register the dead.\n\nIf we accept, strait tension falls by 8 and both sides gain 2% stability."
 krcw_gv.122.a:0 "Accept."
 krcw_gv.122.b:0 "Refuse."
 krcw_gv.123.t:0 "Qingdao Commission: Repatriate Civilians"
 krcw_gv.123.d:0 "In the Qingdao Commission, the other delegation proposes: Japanese civilians stranded in China since the war, and Chinese stranded in Japan, go home.\n\nIf we accept, strait tension falls by 8 and both sides gain 2% stability."
 krcw_gv.123.a:0 "Accept."
 krcw_gv.123.b:0 "Refuse."
 krcw_gv.200.t:0 "The Other Side Accepts"
 krcw_gv.200.d:0 "The other side has accepted the confidence-building measure we proposed in the ceasefire commission."
 krcw_gv.200.a:0 "Good."
 krcw_gv.201.t:0 "The Other Side Refuses"
 krcw_gv.201.d:0 "The other side has refused the confidence-building measure we proposed in the ceasefire commission. The political power spent is gone."
 krcw_gv.201.a:0 "So be it."
 krcw_gv.40.t:0 "The Geneva Conference Adjourns Indefinitely"
 krcw_gv.40.d:0 "The two blocs are at war. The Swiss government has adjourned the Geneva Conference indefinitely, and the delegations of the three ceasefire commissions have gone home. The peace treaty was put off [?global.krcw_gv_deferred|0] times in all."
 krcw_gv.40.a:0 "The delegations go home."
 krcw_gv.41.t:0 "The Last Session in Geneva"
 krcw_gv.41.d1:0 "After the Moscow Accord fell apart, Paris called a last session in Geneva. The fourth item, \"the conclusion of a peace treaty\", was discussed for the first time, on terms drafted by the Third Internationale. Before this the treaty had been put off [?global.krcw_gv_deferred|0] times."
 krcw_gv.41.d2:0 "After the Third Internationale fell apart, Moscow called a last session in Geneva. The fourth item, \"the conclusion of a peace treaty\", was discussed for the first time, on terms drafted by the Moscow Accord. Before this the treaty had been put off [?global.krcw_gv_deferred|0] times."
 krcw_gv.41.a:0 "The Cold War is over."
