 krcw_econ_special_none:0 ""
 krcw_econ.1.t:0 "Trouble in the Federated Economy"
 krcw_econ.1.d0:0 "Production has stopped. Strike committees have taken over the factories and the communes barter among themselves. Resolutions of the congress are torn up in public at the factory gates.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.1.d1:0 "The strike began at one machine-tool works and within a week had spread across the whole industrial district. The workers want the equipment and quotas they are owed, and the Clearing Union ledger shows a deficit for the first time.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.1.d2:0 "Raw-material quotas have slipped again. Several big works are taking turns standing idle, and the communes' delegates ask the congress why one approval takes three months.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.1.a:0 "Call an emergency congress to share out the quotas again"
 krcw_econ.1.b:0 "Devolve power to the local communes"
 krcw_econ.2.t:0 "The Federated Economy Recovers"
 krcw_econ.2.d0:0 "The federations have finished their quotas early. The congress adjourned on schedule for the first time, and the workers' papers have begun to debate a shorter working day.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.2.d1:0 "Quotas are met on time and there are goods in the shops. The Clearing Union ledger shows a surplus, which the Convention turns into equipment credit for fraternal countries.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.2.a:0 "Enter the surplus in the Clearing Union ledger"
 krcw_econ.3.t:0 "Trouble in the Trusts"
 krcw_econ.3.d0:0 "The trusts are failing one after another, factories close and the unemployed fill the streets. The state-held trusts lived on the state's credit, and now the state's credit is gone too.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.3.d1:0 "Queues form outside the banks and the exchange loses a third of its value in a day. The trusts cannot pay their bond coupons, and the government must decide whom to save and whom to let go.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.3.d2:0 "Several of the great trusts have begun to fall behind on wages and prices rise every month. The trusts borrow from the state bank, and the state bank borrows from the mint.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.3.a:0 "The state bank steps in"
 krcw_econ.3.b:0 "Let the worst of them fail"
 krcw_econ.4.t:0 "The Trusts Boom"
 krcw_econ.4.d0:0 "The blast furnaces never stop, shares set new highs every week and the banks compete to lend to the trusts. A treasury report warns that the debts kept off the books are growing just as fast.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.4.d1:0 "Arms orders and foreign capital pour in together; the trusts are expanding and the exchange is rising.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.4.a:0 "The more orders the better"
 krcw_econ.4.b:0 "Send the auditors to look at the books"
 krcw_econ.5.t:0 "The Economy Turns Down"
 krcw_econ.5.d0:0 "The factories have stopped, the banks have suspended payments and the government cannot pay its wages. Only the black market is still open.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.5.d1:0 "Factories go bankrupt, the banks call in their loans and the unemployed march in the streets. The creditors want the old debts paid before they talk about new loans.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.5.d2:0 "Orders are falling, unemployment is rising, and the treasury has told every ministry to cut its spending.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.5.a:0 "Cut government spending"
 krcw_econ.5.b:0 "Ask Moscow for a loan"
 krcw_econ.6.t:0 "The Economy Picks Up"
 krcw_econ.6.d0:0 "Investors are queuing to get in, and the newspapers are full of ribbon-cuttings at new factories.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.6.d1:0 "Orders are rising, unemployment is falling and there is more in the shops.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.6.a:0 "Good times"
 krcw_econ.7.t:0 "The Bubble Bursts"
 krcw_econ.7.d0:0 "One of the great trusts has announced that it cannot pay its bond coupons. Within three days the exchange has lost half its value, a dozen banks have suspended payments and the factories have begun laying men off. The overheated accounts have come due at last.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.7.a:0 "The state takes over the bankrupt trusts"
 krcw_econ.7.b:0 "Let the market clear itself"
 krcw_econ.8.t:0 "The Moscow Exchange Crashes"
 krcw_econ.8.d0:0 "Several of the Ural trusts defaulted at once, and the selling on the Moscow exchange went on for a whole week. The Russian state bank has suspended all foreign lending and asked its debtors to repay their rouble loans early. Every government that lives on rouble credit is in emergency session."
 krcw_econ.8.a:0 "The capitalist cycle comes round again"
 krcw_econ.8.b:0 "We are on our own now"
 krcw_econ.8.c:0 "Just as well we leaned on neither"
 krcw_econ.9.t:0 "The Rouble Wavers"
 krcw_econ.9.d0:0 "Savinkov is dead. The rouble's credit rested on him personally: foreign banks lent because they believed he could repay, and the trusts expanded because they believed he would cover them. Now nobody knows who will take over, and the exchanges are waiting.\n\nEconomy index: [?krcw_econ|0]/100"
 krcw_econ.9.a:0 "Spend the reserves to hold the exchange rate"
 krcw_econ.9.b:0 "Wait for the new government to speak"
 krcw_econ.10.t:0 "The Rouble's New Master"
 krcw_econ.10.d0:0 "The new government has declared that it honours every debt of the Savinkov years, and the state bank has resumed foreign lending. The exchange has won back part of its losses."
 krcw_econ.10.d1:0 "The new government has cut the arms orders and moved the money to tractor works and light industry. The trusts' shares fell, and the rouble steadied."
 krcw_econ.10.d2:0 "To pay for the coronation the treasury has issued a \"Crown Loan\". Foreign banks do not know who will end up repaying it."
 krcw_econ.10.d3:0 "The new Supreme Ruler has suspended all repayment of foreign debt, calling it a wartime measure. Foreign capital began to leave that night, and within the Accord the rouble lost half its value in a week."
 krcw_econ.10.a:0 "Let us see how they pay"
 krcw_econ.10.b:0 "Has Moscow steadied?"
 krcw_econ_cat:0 "Bloc Economy"
 krcw_econ_cat_desc:0 "Your own economy, education, welfare and development projects are in the §YNational Development§! tab on the top bar. This category holds aid, rouble credit and repayment between the blocs.[KRCW_GetEconSpecial]"
 krcw_econ_send_mission:0 "Send a Technical Mission"
 krcw_econ_send_mission_desc:0 "The Paris Clearing Convention turns a surplus country's surplus into technical aid for deficit countries. We send engineers and equipment, and our own factories give up part of their capacity."
 krcw_econ_rouble_credit:0 "Extend Rouble Credit"
 krcw_econ_rouble_credit_desc:0 "The Russian state bank lends them money. Their factories restart, and our books gain another debtor. The more we lend, the hotter the trusts run."
 krcw_econ_repay:0 "Pay on Time"
 krcw_econ_repay_desc:0 "Squeeze the money out of the budget and pay Moscow."
 krcw_econ_concession:0 "Grant Concessions"
 krcw_econ_concession_desc:0 "Hand the running of some mines and a railway to Russian companies against the debt."
 krcw_econ_join_trusts:0 "Join the Trust System"
 krcw_econ_join_trusts_desc:0 "Let the Russian trusts take shares in our biggest works in exchange for a large part of the debt. From now on our economy rises and falls with the Moscow exchange."
 krcw_econ_join_trusts_tt:0 "The economy becomes a §Ytrust economy§!, with overheating starting at 30."
 krcw_econ_m_moscow_demands:0 "Moscow Demands Repayment"
 krcw_econ_m_moscow_demands_desc:0 "The Russian state bank wants the rouble loans that have fallen due. Pay, grant concessions, or join the trust system; if we do not pay in time, Moscow will freeze all new credit."
