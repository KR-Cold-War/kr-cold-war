 krcw_dev_planname_4_fed:0 "Defend the Commune"
 krcw_dev_planname_4_trust:0 "Army Orders First"
 krcw_dev_planname_4_mkt:0 "Defence First"
 krcw_econ_tierdesc_fed_0:0 "Production has stopped. Strike committees have taken over the factories, the communes barter among themselves and nobody reads the central quota tables any more. Until the federations win back trust, the standstill will go on."
 krcw_econ_tierdesc_fed_1:0 "Quotas go unmet and labour vouchers buy nothing. The workers strike for the equipment and quotas they are owed, and the Clearing Union ledger shows a deficit for the first time."
 krcw_econ_tierdesc_fed_2:0 "Raw-material quotas keep slipping and factories take turns standing idle. The communes complain that approvals from the centre are slow; the centre complains that the communes' returns are wrong."
 krcw_econ_tierdesc_fed_3:0 "Factories are run by their industrial federations, the plan is negotiated by congresses at every level and cross-border accounts are kept in the ledger of the Paris Clearing Union. It does not run fast, but it seldom stops."
 krcw_econ_tierdesc_fed_4:0 "Quotas are met on time and there are goods in the shops. The Clearing Union ledger shows a surplus, which the Convention turns into equipment credit for fraternal countries."
 krcw_econ_tierdesc_fed_5:0 "The federations finish their quotas early and the congress adjourns on schedule for the first time. The workers' papers have begun to debate a shorter working day."
 krcw_econ_tierdesc_trust_0:0 "The trusts are failing one after another, factories close and the unemployed fill the streets. The state-held trusts lived on the state's credit, and now the state's credit is gone too."
 krcw_econ_tierdesc_trust_1:0 "Queues form outside the banks and the exchange loses a third of its value in a day. The trusts cannot pay their bond coupons, and the government must decide whom to save and whom to let go."
 krcw_econ_tierdesc_trust_2:0 "The trusts have begun to fall behind on wages and prices rise every month. The trusts borrow from the state bank, and the state bank borrows from the mint."
 krcw_econ_tierdesc_trust_3:0 "The state holds the shares, the army places the orders and private managers run the works. It is neither efficient nor wasteful; it is only that nobody dares ask where the profits go."
 krcw_econ_tierdesc_trust_4:0 "Arms orders and foreign capital pour in together; the trusts are expanding and the exchange is rising. So are the debts that never appear in the accounts."
 krcw_econ_tierdesc_trust_5:0 "The blast furnaces never stop, shares set new highs every week and the banks compete to lend to the trusts. Everyone knows it cannot last for ever, and everyone is buying."
 krcw_econ_tierdesc_mkt_0:0 "The factories have stopped, the banks have suspended payments and the government cannot pay its wages. Only the black market is still open."
 krcw_econ_tierdesc_mkt_1:0 "Factories go bankrupt, the banks call in their loans and the unemployed march in the streets. The creditors want the old debts paid before they talk about new loans."
 krcw_econ_tierdesc_mkt_2:0 "The government is cutting spending and unemployment is rising. Every foreign loan comes with conditions."
 krcw_econ_tierdesc_mkt_3:0 "The home market and foreign credit keep the economy going. Not a boom, and not a crisis either."
 krcw_econ_tierdesc_mkt_4:0 "Orders are rising, unemployment is falling and there is more in the shops."
 krcw_econ_tierdesc_mkt_5:0 "Investors are queuing to get in, and the newspapers are full of ribbon-cuttings at new factories."
