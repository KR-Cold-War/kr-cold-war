 krcw_dev_obs_tt:0 "[KRCW_GetEconSystem]. GDP world rank [?krcw_dev_rank_gdp|0]. Economy this month [?krcw_econ_trend|+2], welfare [?krcw_dev_w_trend|+2].\nNational plan: [KRCW_GetDevPlan]. Projects under way: [?krcw_dev_slots|0]."
 krcw_dev_obs_1:0 "Economy §Y[?krcw_econ|0]§! [KRCW_GetEconTier]"
 krcw_dev_obs_2:0 "Education §Y[?krcw_dev_edu|0]§!  welfare §Y[?krcw_dev_wel|0]§!"
 krcw_dev_obs_3:0 "GDP §Y[?grossdomesticproduct|0]§! #[?krcw_dev_rank_gdp|0]  pop. §Y[?krcw_dev_pop|0]§!M"
 krcw_dev_help_t0:0 "§YThe three indices§!"
 krcw_dev_help_b0:0 "§YEconomy§! moves every month; the sources are on the Economy page. It drifts back toward 50, so one-off boosts fade and the long-run level is set by institutions, education, the plan and the burdens. It drives construction, factory output and consumer goods.\n\n§YEducation§! comes from each state's literacy, primary, secondary and college rates, weighted by population. It drives research and production efficiency and lifts the long-run economy.\n\n§YWelfare§! moves each month toward \"economy x0.6 + education x0.4\"; war, hunger and the national plan push it. It drives stability, political power and population growth."
 krcw_dev_help_t1:0 "§YDevelopment projects§!"
 krcw_dev_help_b1:0 "Two projects at a time, three for bloc leaders and countries with more than 50 civilian factories.\n\nStarting one costs political power and ties up some civilian factories for 3 to 6 months; the effect comes on completion. Hover over a project name for its effect and whether it can start now.\n\nState development, transport and education are permanent; welfare and economy boosts fade and need further investment.\n\nEach economic system names the projects its own way; the reform and the last, system-specific project differ by system."
 krcw_dev_help_t2:0 "§YThe national plan§!"
 krcw_dev_help_b2:0 "Pick one of five directions: balanced, heavy industry, welfare, education, defence. The buttons are at the bottom of the Overview page; hover over them for the effects.\n\nEach change costs 50 political power and locks the plan for 12 months.\n\nHeavy industry grows the economy faster and welfare slower; welfare first does the opposite; education first raises literacy every month and speeds up research; defence first speeds up military construction but slows both economy and welfare."
 krcw_dev_help_t3:0 "§YThe three economic systems§!"
 krcw_dev_help_b3:0 "§YFederated economy§! (Third Internationale): steady, but its offices bloat; the reorganisation project keeps them down. The Paris Clearing Union moves surplus members' surpluses to members in difficulty every month.\n\n§YTrust economy§! (Moscow Accord): grows fast but overheats as it grows; at 100 the bubble bursts. Russia lends roubles, and debtors are later asked to repay.\n\n§YMarket economy§!: lives on foreign credit; countries in rouble debt pay interest every month. Countries outside both blocs count as market economies and take their bloc's system if they join one."
 krcw_dev_help_t4:0 "§YCrises and the blocs§!"
 krcw_dev_help_b4:0 "Falling below Hardship brings an event asking how to respond.\n\nWhen a bloc leader is in economic crisis, the whole bloc's collapse meter rises every month; so it does when many members are in difficulty.\n\nTechnical missions, rouble credit and repayment are in the decision category \"Bloc Economy\"; economic war and the stabilisation plan are in \"The Hidden Front\".\n\nIn observer mode, right-click any country: its economy, education, welfare and output are in the diplomacy view."
 krcw_econ.20.t:0 "A Development Project Is Finished"
 krcw_econ.20.d0:0 "[KRCW_GetDevLastProject] is finished. On the day of the ribbon-cutting the papers ran a full page of photographs.\n\nOpen National Development on the top bar to start the next project."
 krcw_econ.20.a:0 "Good"
 krcw_econ.21.t:0 "The First Literate Generation"
 krcw_econ.21.d0:0 "The national education index has passed 60 for the first time. Most young workers can read a paper and follow a drawing, and the technical night schools have more applicants than seats."
 krcw_econ.21.a:0 "Send them to the technical schools"
 krcw_econ.21.b:0 "Have them read our papers"
 krcw_econ.22.t:0 "University Towns"
 krcw_econ.22.d0:0 "The national education index has passed 80. Several university towns now stand comparison with the old imperial schools, and the laboratories have begun to recruit from abroad."
 krcw_econ.22.a:0 "Fund the laboratories"
 krcw_econ.22.b:0 "Put them to work for industry"
 krcw_econ.23.t:0 "Years of Plenty"
 krcw_econ.23.d0:0 "Welfare has passed 70. The shops are full, and the holiday trains to the coast are booked a week ahead."
 krcw_econ.23.a:0 "The people are content"
 krcw_econ.23.b:0 "Ask them to give a little more for the country"
 krcw_econ.24.t:0 "The Bread Queues"
 krcw_econ.24.d0:0 "Welfare has fallen below 20. The bread queues form before dawn, and market prices go up every week."
 krcw_econ.24.a:0 "Open the state reserves"
 krcw_econ.24.b:0 "Let the police keep order"
