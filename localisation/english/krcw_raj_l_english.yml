l_english:
# krcw: years paced
 krcw_raj_famine_relief:0 "Famine Relief Commission"
 krcw_raj_famine_relief_desc:0 "The Bengal granaries reopen and grain trains roll east along the Gangetic plain. The commission's ledgers are full of deficits, but there are fewer bodies at the village gates."
 krcw_raj_integrated_armies:0 "The Federal Army"
 krcw_raj_integrated_armies_desc:0 "Rajput horsemen, Sikh infantry and Gurkha mountain battalions wear one uniform and answer to one general staff for the first time - though their pay still comes from their own princes."
 krcw_raj_russian_credits:0 "Rouble Credits"
 krcw_raj_russian_credits_desc:0 "Moscow's credits buy rolling mills in Bombay and arsenals in Cawnpore. Every loan comes with a \"friendship clause\"; Indian diplomacy looks ever more like a department of the Russian foreign ministry."
 krcw_raj_himalayan_game:0 "The Himalayan Game"
 krcw_raj_himalayan_game_desc:0 "In the tea gardens of Darjeeling and the mule inns of Kalimpong, princely envoys trade gifts, rifles and oaths with the stewards of Lhasa's nobility. It is a game that must leave no paper trail."
 krcw_raj_princely_revolt:0 "The Princely Revolts"
 krcw_raj_princely_revolt_desc:0 "Hyderabad refuses the federal levy, Rajputana maharajas shut their city gates, and the peasants of Telangana and Bihar burn the land deeds. The \"tradition\" on which the Princely Federation stands is collapsing from within."
 krcw_raj_gwalior_charter:0 "The Gwalior Charter"
 krcw_raj_gwalior_charter_desc:0 "In 1953 Scindia signed the Charter in the durbar hall of Gwalior: princely retainers pass to the federation, tenants receive statutory leases for the first time, and an elected House of the People sits beside the Chamber of Princes. The crown remains, but it has begun to bow to the law."
 krcw_raj_iron_durbar:0 "The Iron Durbar"
 krcw_raj_iron_durbar_desc:0 "The revolts were put down at bayonet point. The Chamber proclaims permanent martial law and special tribunals tour the provinces. Order is restored - at the price of a generation's silence."
 krcw_raj_russian_expedition:0 "The Russian Expeditionary Corps"
 krcw_raj_russian_expedition_desc:0 "Cossack cavalry appear in the dust of the Deccan. The princes breathe easier; Indian nationalists call it \"the second colonisation\"."
 krcw_raj_tenancy_acts:0 "Tenancy Acts"
 krcw_raj_tenancy_acts_desc:0 "In the directly administered provinces rents are capped at a third of the harvest. The princes pounded the table in the Chamber, but the acts passed by a single vote."
 krcw_raj_high_altitude_training:0 "High Altitude Training"
 krcw_raj_high_altitude_training_desc:0 "The mountain divisions take turns at the Gulmarg school, learning acclimatisation, snow marches and pack artillery. Troops last longer in the mountains, and recruit training takes longer."
 krcw_tib_protectors_of_faith:0 "The Protectors of the Faith"
 krcw_tib_protectors_of_faith_desc:0 "From the caravans of Kham to the monasteries of Lhasa, the horns of the Protectors echo among the snow peaks. They carry Indian rifles and a promised independence - and a future no one can foresee."
 krcw_tib_mountain_war:0 "War in the Snows"
 krcw_tib_mountain_war_desc:0 "The Protectors know every pass and every monastery; mule caravans carry their supplies and herders shelter them. An attacker fights in thin air, hard cold and over long supply lines, and holding the plateau is far easier than taking it."
 krcw_tib_expanded_autonomy:0 "Expanded Autonomy"
 krcw_tib_expanded_autonomy_desc:0 "After the suppression Nanjing did not abolish the Kashag. It reaffirmed that \"the existing system will not be altered\" and returned all internal affairs short of border defence to Lhasa."
 krcw_tib_independent_kashag:0 "Independent Kashag"
 krcw_tib_independent_kashag_desc:0 "The Snow Lion flag flies over the Potala. Independence came fast; the Kashag does not yet know how to run a state that needs a foreign ministry and a treasury."
 krcw_tib_chamdo_armistice:0 "The Chamdo Armistice"
 krcw_tib_chamdo_armistice_desc:0 "No treaty, only an armistice line. NRA outposts and Protector watchtowers glare at each other across the Jinsha - the highest barbed wire of the Cold War."
 krcw_tib_chamdo_front:0 "The Chamdo Front Command"
 krcw_tib_chamdo_front_desc:0 "The regiments, Khampa horse and pack trains on the Jinsha line answer to a single front command at Chamdo. Feeding and paying the front takes a large share of the Kashag's budget."
 krcw_tib_monastic_levies:0 "Monastic Levies"
 krcw_tib_monastic_levies_desc:0 "The warrior monks of the three great monasteries are formed into regular battalions - to protect the Dharma, say the lamas; to protect the Kashag, says the Kashag."
 krcw_tib_modern_schools:0 "Modern Schools"
 krcw_tib_modern_schools_desc:0 "Lhasa's first modern school opens, its textbooks printed in Tibetan and Chinese. Some nobles fear that serf children who can read will no longer bow."
 krcw_chi_tibet_pacification:0 "Pacification of the Plateau"
 krcw_chi_tibet_pacification_desc:0 "The NRA fights at four thousand metres, its supply line stretching from Chengdu to Chamdo. Nanjing moves troops while explaining to Paris that this is not a colonial war."
 krcw_raj_princely_fragmentation_2:0 "Princely Fragmentation (Easing)"
 krcw_raj_princely_fragmentation_2_desc:0 "The Council of Dewans gives the federation its first day-to-day administration. The states still go their own way, but at least they now answer Delhi's letters."
 krcw_raj_caste_order_2:0 "The Loosening Caste Order"
 krcw_raj_caste_order_2_desc:0 "The temple doors are open, yet the village still has two wells. The law has run ahead of custom; custom is catching up - or resisting."
 krcw_raj_princely_constabulary:0 "Federal Security Corps"
 krcw_raj_princely_constabulary_desc:0 "Trained by Russian advisors, the Security Corps is good at breaking up meetings and watching newspapers. It reassures the princes - and teaches many others to keep quiet."
 krcw_raj_gurkhas:0 "The Gurkha Tradition"
 krcw_raj_gurkhas_desc:0 "\"Better to die than be a coward\" - the old Gurkha motto now hangs over the doors of federal barracks."
 krcw_raj_arming_tibet:0 "Arming Tibet"
 krcw_raj_arming_tibet_desc:0 "Every month mule trains leave the passes of Sikkim and Bhutan loaded with rifles, cartridges and silver. The ledgers call them \"monastery donations\"."
 krcw_chi_frontier_garrisons:0 "Frontier Garrisons"
 krcw_chi_frontier_garrisons_desc:0 "The NRA adds garrisons at Chamdo, Nagqu and Yadong. The Kashag protests that this violates the Lhasa Agreement; Nanjing replies that it is there to protect it."
 krcw_raj_convene_chamber:0 "Convene the Chamber of Princes"
 krcw_raj_convene_chamber_desc:0 "Two years after the war of unification, more than five hundred princes gather in the Chamber at Delhi with elephants, jewels and demands. Scindia must convince them that the federation deserves more loyalty than their own states."
 krcw_raj_scindia_presidency:0 "The Gwalior Presidency"
 krcw_raj_scindia_presidency_desc:0 "The Chamber elects the Maharaja of Gwalior President of the Federation - for life, but not hereditary. Scindia swears on the Gita and the federal charter, and both books weigh the same."
 krcw_raj_federal_secretariat:0 "The Federal Secretariat"
 krcw_raj_federal_secretariat_desc:0 "In the red sandstone offices of New Delhi, clerks seconded from the princely states begin drafting a single budget for the whole subcontinent. Many learn for the first time just how poor the federation is."
 krcw_raj_dewans_council:0 "The Council of Dewans"
 krcw_raj_dewans_council_desc:0 "The chief ministers of the princely states - the dewans - form a standing council to run federal business while the Chamber is in recess. Real power begins to flow from palaces to offices."
 krcw_raj_guardians_of_tradition:0 "Reject Land Reform"
 krcw_raj_guardians_of_tradition_desc:0 "In 1950 the Chamber rejects the land reform bill by an overwhelming majority. \"The soil of India belongs to its gods, its princes and its ancestors,\" Scindia declares. The tenants were not present."
 krcw_raj_cautious_reform:0 "Accept the Young Princes' Memorandum"
 krcw_raj_cautious_reform_desc:0 "A handful of young princes - educated at Cambridge or Moscow - circulate a memorandum in the Chamber: if the crown will not reform itself, others will reform it with sickles."
 krcw_raj_zamindar_compact:0 "The Zamindar Compact"
 krcw_raj_zamindar_compact_desc:0 "The federation signs a compact with the zamindar landlords: they guarantee the revenue, it guarantees their deeds. In the paddies of Bengal, nothing changes."
 krcw_raj_princely_police:0 "The Princely Constabulary"
 krcw_raj_princely_police_desc:0 "The princely states' police are merged into a federal security corps trained by Russian advisers, used mainly to break up gatherings."
 krcw_raj_sanctity_of_durbar:0 "Hold the Delhi Durbar"
 krcw_raj_sanctity_of_durbar_desc:0 "Each winter Delhi holds a great durbar. Princes ride elephants in procession and the crowds cheer - or are told to."
 krcw_raj_focus_tenancy_acts:0 "The Tenancy Acts"
 krcw_raj_focus_tenancy_acts_desc:0 "In the directly administered provinces rents are capped at one third of the harvest - the outcome of a seven-day debate in the Chamber."
 krcw_raj_temple_entry:0 "The Temple Entry Proclamation"
 krcw_raj_temple_entry_desc:0 "The Travancore precedent is extended to the federation: every Hindu, whatever his caste, may enter the temples. Brahmin priests protest, but the doors open."
 krcw_raj_provincial_councils:0 "Provincial Councils"
 krcw_raj_provincial_councils_desc:0 "Bombay, Madras and the United Provinces hold limited elections for the first time: only literate taxpayers may vote. The queues outside the polling stations are longer than anyone expected."
 krcw_raj_face_the_storm:0 "Face the Famine and the Unrest"
 krcw_raj_face_the_storm_desc:0 "The Deccan princes refuse to pay taxes and the Bihar peasants rise. Scindia calls an emergency session of the Chamber of Princes."
 krcw_raj_charter_federal_courts:0 "The Federal Courts"
 krcw_raj_charter_federal_courts_desc:0 "The Federal Supreme Court created by the Gwalior Charter hears its first case of a tenant against a prince. The judgement is three pages long, yet it is copied across the subcontinent."
 krcw_raj_charter_house_of_people:0 "The House of the People"
 krcw_raj_charter_house_of_people_desc:0 "A new chamber stands beside the Chamber of Princes. Its first members include lawyers, teachers, union organisers and a former untouchable, whose maiden speech is a single sentence: \"We are here.\""
 krcw_raj_charter_iron_order:0 "Declare Indefinite Martial Law"
 krcw_raj_charter_iron_order_desc:0 "Special tribunals tour the country and the Chamber proclaims indefinite martial law. Scindia's portrait hangs in every school - in the schools that remain open."
 krcw_raj_famine_commission:0 "The Famine Relief Commission"
 krcw_raj_famine_commission_desc:0 "The war of unification scorched Bengal. The first act the Chamber ever passed unanimously established a Famine Relief Commission - no prince wants corpses in his own state."
 krcw_raj_grain_railways:0 "The Grain Railways"
 krcw_raj_grain_railways_desc:0 "Grain trains run day and night from the Punjab to Bengal. The British laid these rails; now for the first time they run for the hungry."
 krcw_raj_canal_colonies:0 "The Canal Colonies"
 krcw_raj_canal_colonies_desc:0 "The canals of the Punjab and Sind are dredged anew and the irrigated land granted to veterans. The princes discover that a soldier with land is more loyal than a soldier with a rifle."
 krcw_raj_end_the_famine:0 "End the Famine"
 krcw_raj_end_the_famine_desc:0 "The monsoon of 1951 arrives on time and the Gangetic plain has its first good harvest in a decade. The Relief Commission declares its mission complete - this time, at least."
 krcw_raj_bombay_mills:0 "The Bombay Mills"
 krcw_raj_bombay_mills_desc:0 "The Bombay mills are running again, shipping cloth via Karachi to Tehran and Samarkand. The Russian market is hungrier than London ever was, and less particular."
 krcw_raj_jamshedpur_steel:0 "Jamshedpur Steel"
 krcw_raj_jamshedpur_steel_desc:0 "The Tata works sign a federal contract: Russian engineers rebuild the blast furnaces and half the output goes to federal arsenals."
 krcw_raj_rouble_credits:0 "Rouble Credits"
 krcw_raj_rouble_credits_desc:0 "Moscow agrees to a huge twenty-year loan. The conditions are in an appendix on page seven: India will side with Russia in every international forum, forever."
 krcw_raj_kanpur_arsenal:0 "The Cawnpore Arsenal"
 krcw_raj_kanpur_arsenal_desc:0 "The new arsenal at Cawnpore is built to Tula blueprints; its rifles are stamped in both Devanagari and Cyrillic."
 krcw_raj_damodar_valley:0 "The Damodar Valley"
 krcw_raj_damodar_valley_desc:0 "The Damodar dams are flood control and federal showcase in one. Scindia attends every ribbon-cutting in person."
 krcw_raj_second_plan:0 "The Second Federal Plan"
 krcw_raj_second_plan_desc:0 "The second ten-year plan emphasises heavy industry. In Delhi economists argue whether, in a country where half the people cannot read, steel is a way forward or an illusion."
 krcw_raj_federal_army:0 "The Federal Army"
 krcw_raj_federal_army_desc:0 "The princely retinues of the unification war are merged into a single federal army. The peacock on its banner is Gwalior's; its uniforms are Russian."
 krcw_raj_russian_staff_college:0 "The Russian Staff College"
 krcw_raj_russian_staff_college_desc:0 "Russian instructors take over the academy at Dehradun. Cadets learn \"deep operations\" - and how to keep silent in front of a prince."
 krcw_raj_mountain_divisions:0 "Mountain Divisions"
 krcw_raj_mountain_divisions_desc:0 "The Himalayan frontier needs troops that can fight at five thousand metres. Sikh and Dogra battalions become mountain divisions; mules matter more than trucks."
 krcw_raj_gurkha_regiments:0 "The Gurkha Regiments"
 krcw_raj_gurkha_regiments_desc:0 "The hillmen of Nepal keep soldiering for Delhi as they once did for London. The paymaster has changed; the kukri has not."
 krcw_raj_armoured_corps:0 "The Armoured Corps"
 krcw_raj_armoured_corps_desc:0 "The first Russian tanks are unloaded at Karachi. The plains of the Punjab are natural tank country, whether the enemy comes from east or west."
 krcw_raj_air_arm:0 "The Federal Air Arm"
 krcw_raj_air_arm_desc:0 "Russian jets roar over Delhi as the princes crane their necks. The peacock, someone says, has finally grown iron wings."
 krcw_raj_himalayan_line:0 "The Himalayan Line"
 krcw_raj_himalayan_line_desc:0 "From Ladakh to Assam a chain of forts and airstrips climbs toward the snow line - to guard against the Chinese, and to watch the Tibetan passes."
 krcw_raj_indian_ocean_fleet:0 "The Indian Ocean Fleet"
 krcw_raj_indian_ocean_fleet_desc:0 "The yards of Bombay and Vizag lay down frigates. The Indian Ocean is the Moscow Accord's only warm sea - and the red fleet of Britain still prowls off Colombo."
 krcw_raj_modern_army:0 "Put Indian Officers in Command"
 krcw_raj_modern_army_desc:0 "For the first time every federal division is commanded by an Indian officer. The Russian mission shrinks to a liaison office."
 krcw_raj_moscow_compact:0 "The Moscow Compact"
 krcw_raj_moscow_compact_desc:0 "Without Russian arms and advisors the Princely Federation could never have won the war of unification. Delhi knows it; Moscow knows it better."
 krcw_raj_trans_iranian_railway:0 "The Trans-Iranian Railway"
 krcw_raj_trans_iranian_railway_desc:0 "Russian-protected Persia agrees to a railway from the Caspian straight to Karachi. Russian arms no longer need to sail around the Cape."
 krcw_raj_khyber_accord:0 "The Khyber Accord"
 krcw_raj_khyber_accord_desc:0 "King Zahir in Kabul and Delhi agree to \"jointly manage\" the Pashtun tribes - that is, to let the Russian advisors manage them. For the first time in two thousand years the Khyber falls quiet."
 krcw_raj_accord_summit:0 "The Delhi Summit"
 krcw_raj_accord_summit_desc:0 "The heads of the Moscow Accord meet in Delhi for the first time. Long's envoy arrives two days late, Savinkov's delegate takes the chair, and Scindia makes sure every guest has an elephant."
 krcw_raj_russian_scientists:0 "Russian Scientists"
 krcw_raj_russian_scientists_desc:0 "A group of Russian physicists arrive in Bangalore to found the first laboratory of the Indian Academy of Sciences. They bring instruments - and secrecy regulations."
 krcw_raj_overseas_broadcasts:0 "Open the All India Radio Overseas Service"
 krcw_raj_overseas_broadcasts_desc:0 "All India Radio opens an overseas service in Delhi, broadcasting in Sinhala, Tamil, Burmese and Bengali to Ceylon, Burma and East Bengal. The Accord news bureau supplies the programmes, which dwell on shortages and strikes inside the Internationale. The money comes from the Secretariat's propaganda budget."
 krcw_raj_purge_clearing_agents:0 "Root Out the Clearing Union's Agents"
 krcw_raj_purge_clearing_agents_desc:0 "The Federal Security Corps goes through the unions and trading houses of Bombay, Calcutta and Cawnpore and arrests those who carry money and leaflets for the Paris Clearing Union. The Chamber's hardliners want a wider sweep; the Bombay mill owners fear the workers will use it to strike."
 krcw_raj_accord_arms_quota:0 "Win an Accord Arms Quota"
 krcw_raj_accord_arms_quota_desc:0 "Delhi asks the Accord armaments committee to place part of its orders for mountain guns, lorries and small arms with Indian works, with Russia supplying the drawings and machine tools. Moscow agrees, on condition that the output goes first to the Accord's southern members."
 krcw_raj_play_himalayan_game:0 "Set the Himalayan Strategy"
 krcw_raj_play_himalayan_game_desc:0 "Lhasa's nobles half-trust Nanjing's promises; they own estates in Kalimpong and Darjeeling. The Federation's envoys set out bearing gifts."
 krcw_raj_kalimpong_network:0 "The Kalimpong Network"
 krcw_raj_kalimpong_network_desc:0 "Wool traders, muleteers and lamas in Kalimpong become informants. Under any bale of wool there may be a crate of rifles."
 krcw_raj_kham_chieftains:0 "The Kham Chieftains"
 krcw_raj_kham_chieftains_desc:0 "The tribal chiefs of Kham have fought Chinese warlords for generations. The Federation's envoys promise them that in an independent Tibet, Kham will govern itself."
 krcw_raj_protectors_of_faith:0 "The Protectors of the Faith"
 krcw_raj_protectors_of_faith_desc:0 "In an abandoned Sikkimese monastery Indian instructors train the first \"Protectors of the Faith\". They swear an oath: for the Dharma, for the Dalai Lama, for the Land of Snows."
 krcw_raj_tibet_aftermath:0 "Settle the Tibetan Aftermath"
 krcw_raj_tibet_aftermath_desc:0 "However the war on the plateau ends, Delhi must pick up the pieces: recognise a new neighbour, or pretend nothing ever happened?"
 krcw_raj_lhasa_legation:0 "Open a Legation in Lhasa"
 krcw_raj_lhasa_legation_desc:0 "The Federation opens a legation in Lhasa, publicly guarantees Tibetan independence and posts a military liaison officer to the Kashag. It tells Nanjing that another march onto the plateau means war with India."
 krcw_raj_special_frontier_force:0 "Raise the Special Frontier Force"
 krcw_raj_special_frontier_force_desc:0 "Protector fighters who fled to Sikkim and Darjeeling after the failed rising are formed into a Special Frontier Force, trained by Gurkha officers and based near Dehradun. The Chamber's hardliners want it ready to cross the border; the foreign affairs committee fears handing Nanjing a pretext."
 krcw_raj_border_roads:0 "Found the Border Roads Organisation"
 krcw_raj_border_roads_desc:0 "Federal Army engineers and the princely labour corps are merged into a Border Roads Organisation to push roads from the plains up to the snow line. The defence levy pays for it, and the princes complain that their labourers have been taken."
 krcw_raj_leh_road:0 "Open the Srinagar-Leh Road"
 krcw_raj_leh_road_desc:0 "Open the road from Srinagar over the Zoji La to Leh and build a transport airfield at Leh. The troops in Ladakh no longer depend on pack trains."
 krcw_raj_nathu_la_road:0 "Build the Siliguri-Nathu La Road"
 krcw_raj_nathu_la_road_desc:0 "The road from Siliguri through Gangtok to the Nathu La is widened into a military highway with depots and fuel dumps along it. The Sikkimese court fears the federal garrison will never leave."
 krcw_raj_ladakh_scouts:0 "Raise the Ladakh Scouts"
 krcw_raj_ladakh_scouts_desc:0 "Recruit scout battalions from the hillmen of Ladakh and Baltistan to patrol the empty plateau toward Aksai Chin. They know every pass, and federal pay must keep them."
 krcw_raj_nefa_agency:0 "Create the North-East Frontier Agency"
 krcw_raj_nefa_agency_desc:0 "The tribal hills north of Assam become a North-East Frontier Agency run by federal political officers, and the airfield at Tezpur is enlarged. The Assamese princes lose their nominal suzerainty over the hills."
 krcw_raj_yadong_station:0 "Set Up Stations at Yadong and Gyantse"
 krcw_raj_yadong_station_desc:0 "Intelligence stations are opened at Yadong and Gyantse under cover of trade agencies and run by men from the Kalimpong network. They log Chinese garrison units and the snow on the passes. Nanjing knows who they are but has no grounds yet to expel them."
 krcw_raj_high_altitude_school:0 "Open the High Altitude Warfare School"
 krcw_raj_high_altitude_school_desc:0 "A High Altitude Warfare School opens at Gulmarg. Each mountain division spends six months there in turn, learning acclimatisation, snow marches and pack artillery. While training, those divisions are unavailable for anything else."
 krcw_raj_himalayan_airlift:0 "Form the Himalayan Airlift Wing"
 krcw_raj_himalayan_airlift_desc:0 "The Federal Air Arm forms a Himalayan airlift wing with Russian transports, dropping supplies to forward posts from Tezpur, Bagdogra and Leh. The crews must take off and land in thin air, and losses will not be light."
 krcw_raj_himalayan_war_plan:0 "Draw Up the Himalayan War Plan"
 krcw_raj_himalayan_war_plan_desc:0 "The General Staff drafts the plan for a war in Tibet against China: in the west an advance from Leh on Aksai Chin, in the east a drive from the Nathu La on Yadong and Gyantse. The Chamber's defence committee approves it, and Delhi can move at any time."
 krcw_tib_regency_council:0 "The Regency Council"
 krcw_tib_regency_council_desc:0 "The Fourteenth Dalai Lama is fourteen years old and Reting Rinpoche presides over the Kashag as regent. Every noble house in Lhasa asks the same question: after the regency, who?"
 krcw_tib_honour_agreement:0 "Honour the Agreement"
 krcw_tib_honour_agreement_desc:0 "The Kashag reaffirms the Lhasa Agreement: Tibet recognises the Republic's sovereignty; Nanjing promises not to change the existing system. Both know the pact works only because both need it to."
 krcw_tib_sichuan_road:0 "The Sichuan Caravan Road"
 krcw_tib_sichuan_road_desc:0 "Nanjing pays to repair the caravan road from Ya'an to Lhasa. The mule trains' journey falls from three months to two, and for the first time tea and cloth get cheaper."
 krcw_tib_open_modern_schools:0 "Modern Schools"
 krcw_tib_open_modern_schools_desc:0 "Lhasa opens its first modern school, teaching Tibetan, Chinese, arithmetic and geography. The abbots of the three great monasteries send observers - they want to know what the children are learning."
 krcw_tib_kashag_reform:0 "Reform of the Kashag"
 krcw_tib_kashag_reform_desc:0 "The Kashag draws up its first annual budget and abolishes part of the ulag corvée. The nobles grumble that it is Nanjing's idea; in fact it is the young Dalai Lama's."
 krcw_tib_dalai_lama_majority:0 "The Dalai Lama Comes of Age"
 krcw_tib_dalai_lama_majority_desc:0 "The Fourteenth Dalai Lama turns eighteen and assumes full power. In his first address at the Potala he says: \"The future of the Land of Snows does not lie in swords and rifles.\""
 krcw_tib_friends_in_kalimpong:0 "Contact the Nobles in Kalimpong"
 krcw_tib_friends_in_kalimpong_desc:0 "Lhasa's great nobles own estates in Kalimpong and Darjeeling. Their Indian friends say that if Nanjing ever betrays the Agreement, the Land of Snows will not stand alone."
 krcw_tib_raise_monastic_levies:0 "Monastic Levies"
 krcw_tib_raise_monastic_levies_desc:0 "The warrior monks of Sera, Drepung and Ganden are formed into regular battalions, trained by \"pilgrims\" from India."
 krcw_tib_kham_horsemen:0 "The Horsemen of Kham"
 krcw_tib_kham_horsemen_desc:0 "The riders of Kham swear that if Chinese armies cross the Jinsha, every gorge will become a grave."
 krcw_tib_mountain_warfare:0 "Plateau Warfare"
 krcw_tib_mountain_warfare_desc:0 "At five thousand metres oxygen is more precious than bullets. The Protectors' instructors write it into their drill manual."
 krcw_tib_hidden_arsenals:0 "Hide Arms in the Monasteries"
 krcw_tib_hidden_arsenals_desc:0 "Behind the great statues and inside the scripture chests, crate after crate of Indian rifles is hidden away."
 krcw_tib_after_the_war:0 "Settle the Post-War Order"
 krcw_tib_after_the_war_desc:0 "The shooting has stopped. Whatever the outcome, the Kashag must answer one question: what kind of country is the Land of Snows to become?"
 krcw_tib_snow_lion_state:0 "The Snow Lion State"
 krcw_tib_snow_lion_state_desc:0 "Independent Tibet needs an army, a foreign ministry and a currency. It takes the Kashag a year to learn how to write a diplomatic note."
 krcw_tib_delhi_treaty:0 "The Treaty of Delhi"
 krcw_tib_delhi_treaty_desc:0 "Tibet and the Indian Federation sign a treaty of friendship. Delhi guarantees Tibetan independence; Lhasa opens its passes and markets to India."
 krcw_tib_neutral_zone:0 "Refuse Foreign Garrisons"
 krcw_tib_neutral_zone_desc:0 "The Kashag signs no treaty with Delhi and allows no foreign troops on its soil, leaving border defence to its own regiments and monastic militia. The young nobles see this as the only way not to become anyone's buffer; the pro-Indian party says it hands Tibet back to Nanjing."
 krcw_tib_jinsha_line:0 "Fortify the Jinsha Line"
 krcw_tib_jinsha_line_desc:0 "Towers and trenches are built at the Jinsha crossings and passes east of Chamdo, facing the NRA outposts on the far bank. The estates along the line must supply the labour, and the nobles complain that the corvée has grown heavier again."
 krcw_tib_regular_regiments:0 "Reorganise the Dapon Regiments"
 krcw_tib_regular_regiments_desc:0 "The Protector columns and monastic levies are reorganised into regular dapon regiments with standard rifles and pay. The three great monasteries are reluctant to give up command of their monks."
 krcw_tib_chamdo_command:0 "Set Up the Chamdo Front Command"
 krcw_tib_chamdo_command_desc:0 "A front command at Chamdo takes over the regiments on the Jinsha line, the Khampa horse and the pack trains. Its commander is appointed by the Kashag, and for the first time the ministers give military authority to a man outside Lhasa."
 krcw_tib_expanded_self_rule:0 "Widen the Kashag's Powers"
 krcw_tib_expanded_self_rule_desc:0 "Nanjing keeps the promise it made during the suppression and returns all internal affairs except defence and diplomacy to the Kashag. Its commissioner stays in Lhasa, and the pro-Indian nobles think it is only a way to buy time."
 krcw_tib_reconciliation:0 "Reconciliation"
 krcw_tib_reconciliation_desc:0 "Captured Protectors are amnestied and return to their monasteries. Some vow never to take up arms again; others say nothing."
 krcw_tib_lhasa_power_station:0 "The Lhasa Power Station"
 krcw_tib_lhasa_power_station_desc:0 "A small hydroelectric plant on the Kyichu lights the Potala. The lamas call it the butter lamp of a new age."
 krcw_tib_middle_way:0 "The Middle Way"
 krcw_tib_middle_way_desc:0 "The young Dalai Lama proposes a \"Middle Way\": neither a return to the old serfdom nor a copy of Nanjing or Delhi. Reform must begin in the monasteries and estates, carried out by Tibetans themselves."
 krcw_tib_open_passes:0 "Open the Passes"
 krcw_tib_open_passes_desc:0 "Whoever rules Lhasa, wool, tea and salt must cross the passes. The trade routes over the Nathu La and Jelep La flourish again."
 krcw_tibrev.1.t:0 "Horns on the Snow Peaks"
 krcw_tibrev.1.d:0 "At dawn the great horns of Lhasa's three monasteries sound together. Protector cavalry burst from the gorges of Kham and seize the Chamdo telegraph office; in the Potala a band of young nobles show Nanjing's commissioner the door - politely, but with rifles levelled.\n\nThey proclaim that Nanjing has betrayed the Lhasa Agreement and that the Land of Snows stands alone from this day. The old ministers of the Kashag look at one another; no one dares speak first."
 krcw_tibrev.1.a:0 "Raise the Snow Lion flag!"
 krcw_tibrev.1.b:0 "Negotiate with Nanjing at the last moment."
 krcw_tibrev.2.t:0 "Tibet Declares Itself Independent"
 krcw_tibrev.2.d:0 "Radio Lhasa - if an old telegraph set can be called a radio - announces Tibet's secession from the Republic of China. Nanjing calls it \"a rebellion by a clique of nobles incited by foreign powers\"; Delhi keeps a meaningful silence.\n\nFrom Paris to Moscow staff officers dig out maps of the Himalaya: this is the first war of the Cold War that both sides tacitly agree must be \"kept in the mountains\"."
 krcw_tibrev.2.a:0 "War on the roof of the world."
 krcw_tibrev.3.t:0 "Rebellion on the Plateau"
 krcw_tibrev.3.d:0 "The telegram reporting the fall of Chamdo reaches the National Government at three in the morning. Zhou Enlai reads it wrapped in his greatcoat and asks only: \"Delhi's rifles, or Lhasa's hearts?\"\n\nThe Military Affairs Ministry urges a thunderbolt to retake Lhasa; the Foreign Ministry reminds him that Paris is watching - the Internationale cannot fight a colonial war in Asia."
 krcw_tibrev.3.a:0 "Restore order, but promise \"no change to the existing system\"."
 krcw_tibrev.3.b:0 "The Kashag broke the pact - Tibet must be reformed."
 krcw_tibrev.4.t:0 "An Envoy from Lhasa"
 krcw_tibrev.4.d:0 "On the eve of the rising an old minister of the Kashag secretly sends a messenger to Nanjing: the young men have been dazzled by Delhi's promises, but the Kashag still wishes to talk."
 krcw_tibrev.4.a:0 "Reaffirm the Agreement and widen autonomy."
 krcw_tibrev.4.b:0 "Arrest the ringleaders."
 krcw_tibrev.10.t:0 "Armistice Beneath the Potala"
 krcw_tibrev.10.d:0 "The last Protector columns vanish into the snows. The Kashag sends delegates to sign an armistice with the NRA front commander at the foot of the Potala.\n\nWhat becomes of the plateau is now for Nanjing to decide."
 krcw_tibrev.10.a:0 "Expand autonomy; the existing system stays."
 krcw_tibrev.10.b:0 "Abolish the Kashag; create a Province of Tibet."
 krcw_tibrev.21.t:0 "Stalemate on the Plateau"
 krcw_tibrev.21.d:0 "The war on the plateau drags on. Supply convoys overturn on the ice roads of Erlang Shan and sentries lose fingers and toes to frostbite at five thousand metres. Paris's telegrams grow ever more urgent: the Internationale wants a stable Asia, not an endless Tibetan war.\n\nNanjing must decide how to end it."
 krcw_tibrev.21.a:0 "Lhasa is ours: restore autonomy."
 krcw_tibrev.21.b:0 "Armistice along the Jinsha."
 krcw_tibrev.21.c:0 "Recognise the independence of the Kashag."
 krcw_tibrev.30.t:0 "Calm Returns to the Plateau"
 krcw_tibrev.30.d:0 "The war is over. Nanjing has reaffirmed the Lhasa Agreement and handed all internal affairs except border defence back to Lhasa. Delhi's envoys quietly withdraw to Kalimpong.\n\nObservers call it the first war of the Cold War to be successfully \"contained\". Many hope it will not be the last."
 krcw_tibrev.30.a:0 "The snows fall silent."
 krcw_tibrev.31.t:0 "The Snow Lion Flies"
 krcw_tibrev.31.d:0 "Nanjing recognises Tibetan independence. Protector cavalry parade before the Potala; the envoy of the Indian Federation sits in the front row of the reviewing stand.\n\nFor the first time the Internationale has stepped back in Asia. In Paris some call it wisdom; in Nanjing some call it shame."
 krcw_tibrev.31.a:0 "The map of the Himalaya has changed."
 krcw_tibrev.32.t:0 "The Jinsha Armistice Line"
 krcw_tibrev.32.d:0 "No treaty and no victor. The NRA holds Chamdo; the Protectors hold Lhasa. Nanjing refuses to recognise the Kashag, the Kashag refuses to recognise Nanjing - they agree on one thing only: to stop shooting."
 krcw_tibrev.32.a:0 "A frozen front."
 krcw_tibrev.5.t:0 "A Guest from Kalimpong"
 krcw_tibrev.5.d:0 "A visitor calling himself a wool merchant arrives in Lhasa with a chest of Indian silver and an unsigned letter: the Land of Snows has friends other than Nanjing."
 krcw_tibrev.5.a:0 "Accept the gift."
 krcw_tibrev.5.b:0 "Hand the letter to Nanjing's commissioner."
 krcw_raj_remembered_tt:0 "The Chamber and the villages will remember this. When the princely revolts come, unrest will start higher."
 krcw_raj.10.t:0 "The Chamber's Veto"
 krcw_raj.10.d:0 "The land reform bill wins just eleven votes in the Chamber of Princes. Afterwards the Nizam of Hyderabad - the richest man on the subcontinent - laughs to reporters in the corridor: \"Land reform? We just fought a war so as not to have such things.\"\n\nIn the villages of Bihar nobody reads the papers. The news spreads all the same."
 krcw_raj.10.a:0 "Tradition is upheld."
 krcw_raj.10.b:0 "Scindia privately summons some of the young princes."
 krcw_raj.11.t:0 "The Monsoon Is Late"
 krcw_raj.11.d:0 "June passes and the sky is still white. The paddies of Bihar and Orissa crack; grain prices triple in a week. The Relief Commission's telegrams pile up on desks in Delhi."
 krcw_raj.11.a:0 "Open the granaries."
 krcw_raj.11.b:0 "Ask Moscow for grain."
 krcw_raj.11.c:0 "Let the states fend for themselves."
 krcw_raj.21.t:0 "Delhi Asks for Grain"
 krcw_raj.21.d:0 "Delhi requests emergency Russian grain. The Volga granaries are not overflowing, but an ally must look like an ally."
 krcw_raj.21.a:0 "Ship it to Karachi."
 krcw_raj.21.b:0 "We barely have enough ourselves."
 krcw_raj.22.t:0 "Moscow's Answer"
 krcw_raj.22.d0:0 "The Russian grain ships reach Karachi. The first wheat is loaded onto trains for Patna, and the Russian consul is photographed on the quay."
 krcw_raj.22.d1:0 "Moscow cables that the Volga granaries have nothing to spare this year. Delhi must rely on itself and the princes' granaries."
 krcw_raj.22.a:0 "Send the Russian grain to Bihar and Orissa."
 krcw_raj.22.b:0 "The federation pays the princes to open their granaries."
 krcw_raj.22.c:0 "Ration grain, army first."
 krcw_raj.12.t:0 "Qavam Comes to Delhi"
 krcw_raj.12.d:0 "Persian Prime Minister Ahmad Qavam arrives in Delhi. Two of Moscow's protégés toast each other at a Red Fort banquet, discussing railways, oil and the Baluch tribes - and the Russian advisors they share."
 krcw_raj.12.a:0 "Sign a transit agreement."
 krcw_raj.12.b:0 "Listen politely."
 krcw_raj.13.t:0 "Shots in Waziristan"
 krcw_raj.13.d:0 "A Pashtun lashkar ambushes a federal patrol and vanishes into the hills on the Afghan side. Kabul denies all knowledge - and so do its Russian advisors."
 krcw_raj.13.a:0 "Ask Moscow to restrain Kabul."
 krcw_raj.13.b:0 "Pursue across the border."
 krcw_raj.14.t:0 "Savinkov Is Dead"
 krcw_raj.14.d:0 "News from Moscow: Boris Savinkov is dead. The Chamber observes three minutes' silence - and many a bowed princely head is thinking the same thought: without Savinkov, will Russia still bleed for India?"
 krcw_raj.14.a:0 "Reaffirm our loyalty to Moscow."
 krcw_raj.14.b:0 "Time to think more of India herself."
 krcw_raj.15.t:0 "The Winter Durbar"
 krcw_raj.15.d:0 "At Delhi's winter durbar a hundred and one elephants parade past the Red Fort. The Russian ambassador sits at Scindia's right hand; Commune journalists are refused entry."
 krcw_raj.15.a:0 "The Peacock Throne gleams."
 krcw_raj.16.t:0 "The Bombay Mill Strike"
 krcw_raj.16.d:0 "Two hundred thousand Bombay mill workers down tools. The leaflets are printed in French and Marathi - the name of the Paris Clearing Union appears in an Indian factory for the first time."
 krcw_raj.16.a:0 "Send the Security Corps."
 krcw_raj.16.b:0 "Make the mill owners raise wages."
 krcw_raj.17.t:0 "The Russian Bomb"
 krcw_raj.17.d:0 "Russia's bomb detonates over Novaya Zemlya. Delhi's papers call it \"the ally's sword\"; a few physicists in Bangalore privately wonder whether India needs a sword of her own."
 krcw_raj.17.a:0 "We are under Russia's nuclear umbrella."
 krcw_raj.17.b:0 "Found an Atomic Energy Commission."
 krcw_raj.18.t:0 "The Question of the Heir"
 krcw_raj.18.d:0 "Scindia is forty-five. His son Madhavrao has grown up in English-style schools, loves cricket and has read some books he should not have. The princes whisper: is the Gwalior presidency really \"not hereditary\"?"
 krcw_raj.18.a:0 "The charter is the charter."
 krcw_raj.18.b:0 "Seat Madhavrao in the Chamber."
 krcw_raj.19.t:0 "After the Hotline"
 krcw_raj.19.d:0 "A hotline now links Paris and Moscow. In Delhi diplomats realise that if the two giants start talking directly, countries like India must learn to speak for themselves."
 krcw_raj.19.a:0 "A new era."
 krcw_raj.30.t:0 "The Snows Are Burning"
 krcw_raj.30.d:0 "News of the Protectors' rising reaches Delhi. The Chamber's foreign affairs committee sits through the night: Nanjing is massing troops at Chamdo, and the Paris papers already print \"Delhi\" on their front pages."
 krcw_raj.30.a:0 "Keep supporting them covertly."
 krcw_raj.30.b:0 "Deny everything and close the passes."
 krcw_raj.40.t:0 "A New Neighbour"
 krcw_raj.40.d:0 "The Snow Lion flag flies in Lhasa. The Kashag's envoys arrive in Delhi with khatas, golden Buddhas and a question: how far will India go to protect Tibet?"
 krcw_raj.40.a:0 "Guarantee its independence and open trade."
 krcw_raj.40.b:0 "Tibet should become a protectorate of the Federation."
 krcw_raj.50.t:0 "Hyderabad Refuses the Levy"
 krcw_raj.50.d:0 "In the spring of 1953 the Nizam of Hyderabad refuses the new federal defence levy: \"the Chamber has no right to tax the states.\" Within three days Mysore, Bhopal and Baroda issue similar statements.\n\nThe land reform vetoed twelve years ago, twelve years of failed harvests, twelve years of mounting military spending - every bill falls due this year."
 krcw_raj.50.a:0 "Summon an emergency session of the Chamber."
 krcw_raj.50.b:0 "Move the Federal Army into Secunderabad."
 krcw_raj.51.t:0 "The Gates of Rajputana"
 krcw_raj.51.d:0 "The maharajas of Jaipur, Jodhpur and Bikaner shut their city gates on the federal tax collectors, proclaiming the \"restoration of our ancient rights of before 1947\"."
 krcw_raj.51.a:0 "Negotiate with them."
 krcw_raj.51.b:0 "Besiege Jaipur."
 krcw_raj.52.t:0 "Sickles and Deeds"
 krcw_raj.52.d:0 "While the princes quarrel over taxes in their forts, the peasants of Telangana and Bihar walk into the landlords' counting houses and burn the deeds at the village gate. They know neither Paris nor Moscow - only hunger."
 krcw_raj.52.a:0 "Send troops to restore order."
 krcw_raj.52.b:0 "Announce rent remissions."
 krcw_raj.54.t:0 "A Night at Gwalior Palace"
 krcw_raj.54.d:0 "Scindia sits in his study at Gwalior Palace the whole night. On the desk lie two documents: a charter drafted by the Council of Dewans - princely retainers to the federation, statutory leases for tenants, an elected House of the People; and a martial law decree drafted by the Chamber's hardliners.\n\nAt dawn he sends for his secretary."
 krcw_raj.54.a:0 "Sign the Gwalior Charter."
 krcw_raj.54.b:0 "Sign the martial law decree."
 krcw_raj.56.t:0 "The Gwalior Charter"
 krcw_raj.56.d:0 "Jiwajirao Scindia, President of the Indian Federation, has signed the Gwalior Charter. Princely retainers pass to the federation, tenants receive statutory leases, and an elected House of the People will sit beside the Chamber of Princes.\n\nMoscow expresses its \"understanding\"; a Paris commentator writes that for the first time on the subcontinent a crown has bowed to the law of its own accord."
 krcw_raj.56.a:0 "The crown bows to the law."
 krcw_raj.57.t:0 "The Storm Passes"
 krcw_raj.57.d:0 "In 1953 the last shut city gate swings open again. The princely revolts are over - but everyone knows India can never return to what it was before 1963."
 krcw_raj.57.a:0 "A new India."
 krcw_raj.58.t:0 "The Red Deccan"
 krcw_raj.58.d:0 "Peasant committees in Telangana proclaim a \"Deccan Peasants' Republic\". Several federal battalions defect with their weapons. The Princely Federation faces not a revolt but a civil war."
 krcw_raj.58.a:0 "Fight to the end!"
 krcw_raj.59.t:0 "The Princely Revolts"
 krcw_raj.59.d:0 "The Indian Federation faces its worst crisis since unification: several great states refuse to pay Delhi, and peasant movements rise in the Deccan and the Gangetic plain at once. Moscow and Paris both watch closely - one wondering whether to send troops, the other whether to hand over a torch."
 krcw_raj.59.a:0 "The subcontinent trembles."
 krcw_raj.60.t:0 "The Peasants of the Deccan"
 krcw_raj.60.d:0 "The Internationale secretariat receives a request from the Hyderabad underground: they need rifles, printing presses and doctors. Supporting them means lighting a fire in the Moscow Accord's back yard."
 krcw_raj.60.a:0 "Send only doctors and presses."
 krcw_raj.60.b:0 "Send rifles."
 krcw_raj.60.c:0 "This is for the Indians to settle."
 krcw_raj.61.t:0 "Delhi's Request"
 krcw_raj.61.d:0 "Scindia asks Russia for an expeditionary corps to help \"restore order\". The General Staff says two divisions will do; the Foreign Ministry says even one is too many."
 krcw_raj.61.a:0 "Send the expeditionary corps."
 krcw_raj.61.b:0 "Only arms and advisors."
 krcw_raj2.1.t:0 "The Dewans' Tenancy Bill"
 krcw_raj2.1.d:0 "The Council of Dewans has drafted a tenancy bill: in the directly administered provinces rent may not exceed a third of the harvest, and no lease may run less than ten years. Its author is Sir Mirza Ismail, the old dewan of Mysore. Scindia can put it to the Chamber of Princes, or first send it to a princes' commission, which the Nizam of Hyderabad has offered to chair."
 krcw_raj2.1.a:0 "Put it to the Chamber."
 krcw_raj2.1.b:0 "Send it to a princes' commission first."
 krcw_raj2.2.t:0 "The Chamber Votes"
 krcw_raj2.2.d0:0 "The tenancy bill passes the Chamber by a narrow majority. The princes who voted against walk out in protest, and the Nizam of Hyderabad tells reporters his state will not enforce \"Delhi's decrees\". The act covers only the federal provinces, but the tenants of Bihar and the United Provinces are already passing its terms around."
 krcw_raj2.2.d1:0 "The tenancy bill is defeated in the Chamber, with only a dozen or so young princes voting for it. Scindia can accept the veto and send the bill to a princes' commission, or go round the Chamber and enforce it by presidential decree in the federal provinces, at the price of the princes believing he is breaking the charter."
 krcw_raj2.2.a:0 "Enforce the act."
 krcw_raj2.2.b:0 "Go round the Chamber and enforce it by presidential decree in the federal provinces."
 krcw_raj2.2.c:0 "Accept the veto and send it to a commission."
 krcw_raj2.3.t:0 "The Princes' Commission"
 krcw_raj2.3.d:0 "The princes' commission under the Nizam of Hyderabad reports: tenancy is to be left to each state, and the federation is to sign a compact with the zamindar landlords, who guarantee the revenue while the federation guarantees their deeds. Scindia can accept it whole, or insist on a rent ceiling in the federal provinces."
 krcw_raj2.3.a:0 "Accept it whole and sign the zamindar compact."
 krcw_raj2.3.b:0 "Sign the compact, but cap rents in the federal provinces."
 krcw_raj2.4.t:0 "The Peasants' Congress at Patna"
 krcw_raj2.4.d0:0 "Once the tenancy act is in force in the federal provinces, the Bihar Kisan Sabha holds its congress at Patna. Swami Sahajanand Saraswati declares that a third of the harvest is only the beginning: the peasants want the zamindari system abolished. The princes take it as proof that reform only invites more demands."
 krcw_raj2.4.d1:0 "After the zamindar compact the tenants of Bihar find their rent has not dropped by a single anna. The Bihar Kisan Sabha holds its congress at Patna, and Swami Sahajanand Saraswati calls for a rent strike until the federation abolishes the zamindari system. More than a thousand villages have sent delegates."
 krcw_raj2.4.a:0 "Negotiate with Sahajanand."
 krcw_raj2.4.b:0 "Ban the Kisan Sabha and arrest Sahajanand."
 krcw_raj2.5.t:0 "The Nizam's Boycott"
 krcw_raj2.5.d0:0 "After the decree Hyderabad suspends its federal defence levy, and Mysore and Bhopal issue statements in similar terms. The Chamber's hardliners say that a president who goes round the Chamber today can abolish the states tomorrow."
 krcw_raj2.5.d1:0 "After the decree the Chamber rings with protest and several maharajas write to Scindia jointly. But no state stops paying the defence levy. The Nizam lets it be known privately that so long as the decree stays out of Hyderabad, he can pretend not to see it."
 krcw_raj2.5.a:0 "Let the states go their own way; enforce it in the federal provinces only."
 krcw_raj2.5.b:0 "Give no ground."
 krcw_raj2.6.t:0 "The Security Corps Sweeps"
 krcw_raj2.6.d:0 "The Federal Security Corps arrests Kisan Sabha organisers across Bihar and the United Provinces, and Sahajanand is put in Hazaribagh jail. The rent-strike villages are fined, and the landlords' collectors return with police escorts. The Kisan Sabha goes underground."
 krcw_raj2.6.a:0 "Order is restored."
 krcw_raj2.6.b:0 "Release Sahajanand after six months."
 krcw_raj2.7.t:0 "The Rent Courts"
 krcw_raj2.7.d:0 "Rent courts are set up in Bihar and the United Provinces, where tenants can sue landlords who charge too much. Before a single case is heard, the zamindars have taken the federation to the Chamber's judicial committee. Sahajanand agrees to call off the rent strike on condition that the courts really sit."
 krcw_raj2.7.a:0 "Back the courts."
 krcw_raj2.7.b:0 "Let the landlords appeal and play for time."
 krcw_raj2.8.t:0 "How the Land Question Ended"
 krcw_raj2.8.d0:0 "The rent courts sit in every district of the Gangetic plain and decide thousands of cases in their first year, most of them for the tenants. The landlords complain in the Chamber, and the Kisan Sabha keeps growing. The Chamber's hardliners demand the courts be abolished; Scindia refuses."
 krcw_raj2.8.d1:0 "Zamindari police are posted in the villages of Bihar and Bengal, paid by the landlords and armed by the federation. Rent-strike villages are fined and the deeds are good again. At night Kisan Sabha leaflets cover the village gates, and by day they are torn down."
 krcw_raj2.8.a:0 "The land question is set aside for now."
 krcw_raj2_tt_settled:0 "The fate of the tenancy bill is settled"
 krcw_raj2_tt_no_reform:0 "No agreement was made with the Kisan Sabha"
 krcw_raj2_tt_reform:0 "An agreement was made with the Kisan Sabha"
 krcw_raj2_rent_courts:0 "The Rent Courts"
 krcw_raj2_rent_courts_desc:0 "Rent courts sit in every district of the Gangetic plain, and tenants can sue landlords who overcharge. Their judgements keep the Kisan Sabha quiet, and make the landlords in the Chamber ever angrier."
 krcw_raj2_zamindari_police_idea:0 "Zamindari Police"
 krcw_raj2_zamindari_police_idea_desc:0 "Village police paid by the landlords and armed by the federation stand guard in Bihar and Bengal. The rents come in, and the Kisan Sabha works by night."
 krcw_raj2_tt_negotiated:0 "Sahajanand was negotiated with"
 krcw_raj2_rent_tribunals:0 "Set Up the Rent Courts"
 krcw_raj2_rent_tribunals_desc:0 "Rent courts are set up in Bihar, the United Provinces and Bengal, where tenants can sue landlords who overcharge and federal bailiffs enforce the judgements. The Kisan Sabha agrees to end the rent strike; the landlord members of the Chamber prepare their appeals."
 krcw_raj2_tt_banned:0 "The Kisan Sabha has been banned"
 krcw_raj2_zamindari_police:0 "Raise the Zamindari Police"
 krcw_raj2_zamindari_police_desc:0 "With the landlords' money and federal rifles, village police are raised in Bihar and Bengal to deal with rent strikes and the Kisan Sabha underground. The Security Corps trains them, and the landlord members of the Chamber pay them."
 krcw_raj2.20.t:0 "The Relief Commission's First Report"
 krcw_raj2.20.d:0 "The Famine Relief Commission's first report says the public granaries of Bihar and Bengal are empty while the private stores of the princes and zamindars are full. Its chairman, J. R. D. Tata, offers three courses: requisition the private stores, ask Moscow for help, or let the Bombay houses fund grain purchases on the market."
 krcw_raj2.20.a:0 "Requisition the princes' and landlords' stores."
 krcw_raj2.20.b:0 "Ask Moscow for grain."
 krcw_raj2.20.c:0 "Let the Bombay houses buy grain on the market."
 krcw_raj2.21.t:0 "The Princes' Granaries"
 krcw_raj2.21.d0:0 "When the requisition order goes out, most princes open their stores, and a few send their own bullock carts to help move the grain. The Chamber's hardliners call it a bad precedent, but nobody wants the papers to call him a hoarder."
 krcw_raj2.21.d1:0 "Hyderabad, Jaipur and Jodhpur refuse to open their stores, saying the federation has no right to requisition a state's grain. The other princes wait to see: if Delhi backs down, they will not open theirs either. Scindia can send troops, or withdraw the order."
 krcw_raj2.21.a:0 "Load the trains for Bihar."
 krcw_raj2.21.b:0 "Send federal troops to open them."
 krcw_raj2.21.c:0 "Withdraw the requisition order."
 krcw_raj2.22.t:0 "Delhi Cables for Grain"
 krcw_raj2.22.d:0 "The Indian Federation's Famine Relief Commission asks Russia for emergency wheat. The Volga granaries are not overflowing. The Foreign Ministry sees a chance to ask Delhi for shares in the Bombay mills; the Agriculture Ministry fears a starving ally will embarrass the Accord."
 krcw_raj2.22.a:0 "Sell the wheat on credit and ship it to Karachi."
 krcw_raj2.22.b:0 "Demand shares in the Bombay mills as security."
 krcw_raj2.23.t:0 "The Bombay Grain Dealers"
 krcw_raj2.23.d:0 "As soon as the federation's orders arrive, the grain dealers of Bombay and Calcutta double the price of rice and hold back their stocks. Tata proposes a federal purchase price; the Bombay papers demand that the hoarders be prosecuted."
 krcw_raj2.23.a:0 "Prosecute the hoarders."
 krcw_raj2.23.b:0 "Fix a purchase price as Tata proposes."
 krcw_raj2.24.t:0 "The Relief Trains"
 krcw_raj2.24.d0:0 "The Russian grain ships reach Karachi and the wheat is loaded onto trains for Patna. The Relief Commission must decide where it goes first: the stricken districts of Bihar and Bengal, or Calcutta and the garrisons. The War Department says hungry soldiers cannot hold a frontier."
 krcw_raj2.24.d1:0 "Federal troops have opened the stores of Hyderabad and Rajputana, and the grain is loaded onto trains for the east. The Relief Commission must decide where it goes first: the stricken districts, or Calcutta and the garrisons. The princes whose stores were opened have already protested in the Chamber."
 krcw_raj2.24.d2:0 "The grain is gathered and the relief trains load in the Punjab and Sind. The Relief Commission must decide where it goes first: the stricken districts of Bihar and Bengal, or Calcutta and the garrisons. The War Department says hungry soldiers cannot hold a frontier."
 krcw_raj2.24.a:0 "The stricken districts first."
 krcw_raj2.24.b:0 "The army and the cities first."
 krcw_raj2.25.t:0 "The Famine Spreads"
 krcw_raj2.25.d:0 "The peasants of Bihar and Bengal leave their villages and stream along the railways toward Calcutta. The Statesman prints photographs of the starving, and the Chamber demands the papers be censored for harming the federation's image. The Relief Commission warns that any more delay means another great famine."
 krcw_raj2.25.a:0 "Appeal to Moscow again."
 krcw_raj2.25.b:0 "Let the states fend for themselves."
 krcw_raj2.26.t:0 "Moscow's Terms"
 krcw_raj2.26.d:0 "The Russians agree to send grain on condition of shares in three Bombay mills and a twenty-year rouble loan. The Bombay mill owners object; the Finance Ministry says there is no other way."
 krcw_raj2.26.a:0 "Accept the terms."
 krcw_raj2.26.b:0 "Refuse and find another way."
 krcw_raj2.27.t:0 "After the Monsoon"
 krcw_raj2.27.d0:0 "The monsoon arrives on time and the Gangetic plain has a good harvest. The Famine Relief Commission closes its kitchens, and the census of Bihar and Bengal shows no great gap. The Chamber awards the Commission a decoration."
 krcw_raj2.27.d1:0 "The monsoon has come at last and the famine is over, but many villages of Bihar and Bengal stand empty. The Chamber declares the famine at an end; the Kisan Sabha lists the villages of the dead in its leaflets. It will be remembered."
 krcw_raj2.27.a:0 "The famine is over."
 krcw_raj2_tt_famine_over:0 "The relief trains went to the districts first, or it is past 1951"
 krcw_raj2_tt_famine_disaster:0 "If the famine was left to spread, not before 1951"
 krcw_raj2_federal_granaries_idea:0 "Federal Granaries"
 krcw_raj2_federal_granaries_idea_desc:0 "The federation builds public granaries on the Gangetic plain and the Deccan, buying in good years and selling in bad, with prices set by the Relief Commission. The private stores of princes and landlords no longer decide the price of grain."
 krcw_raj2_tt_central:0 "Famine relief is run by the federation"
 krcw_raj2_federal_granaries:0 "Build the Federal Granaries"
 krcw_raj2_federal_granaries_desc:0 "Federal granaries are built at Patna, Lucknow and Nagpur under the Famine Relief Commission, buying at a fixed price in good years and selling at cost in bad ones. The landlord members of the Chamber oppose the fixed price, and the Finance Ministry issues bonds to pay for the buildings."
 krcw_raj2_tt_market:0 "Famine relief was left to the Bombay houses"
 krcw_raj2_grain_exchange:0 "Open the Bombay Grain Exchange"
 krcw_raj2_grain_exchange_desc:0 "The Bombay houses fund a grain exchange where grain is traded forward and the federation steps in only when prices run too high. The Tata family and the Baroda bankers are the largest shareholders; the Kisan Sabha says the exchange will only make the dealers rich."
 krcw_raj2.40.t:0 "Shakabpa Comes to Kalimpong"
 krcw_raj2.40.d:0 "Tsepon Shakabpa of the Kashag arrives in Kalimpong at the head of a trade mission and meets the federal political officer in private. He says the Lhasa nobility does not trust Nanjing, but will not fight for Delhi either. The federation can send money through the Kashag, go round it and arm the chieftains of Kham directly, or wait and watch."
 krcw_raj2.40.a:0 "Send money through the Kashag."
 krcw_raj2.40.b:0 "Arm the Kham chieftains directly."
 krcw_raj2.40.c:0 "Wait and watch."
 krcw_raj2.41.t:0 "A Gift from Delhi"
 krcw_raj2.41.d:0 "A Kalimpong trading house delivers a sum of silver with a letter from the federal political officer. The Regent, Reting Rinpoche, can accept it quietly and leave the Kashag in Delhi's debt, or hand the letter to Nanjing's representative in Lhasa to prove the Kashag's loyalty to the Lhasa Agreement."
 krcw_raj2.41.a:0 "Accept it quietly."
 krcw_raj2.41.b:0 "Hand it to Nanjing's representative."
 krcw_raj2.42.t:0 "The Answer from Lhasa"
 krcw_raj2.42.d0:0 "Reting Rinpoche has kept the silver and sent no reply. Shakabpa sends word from Lhasa that half the Kashag is willing to deal with Delhi and the other half writes reports for Nanjing. The federation can keep working through the Kashag, so long as it picks the right men."
 krcw_raj2.42.d1:0 "The Kashag has handed the political officer's letter to Nanjing's representative. The Nanjing papers print it in full, and two Kalimpong trading houses are shut down. The road through Lhasa is closed; the federation can turn to Kham, or pull back."
 krcw_raj2.42.a:0 "Keep dealing with the Kashag."
 krcw_raj2.42.b:0 "Turn to Kham."
 krcw_raj2.42.c:0 "Pull back and watch."
 krcw_raj2.43.t:0 "The Pangdatsang Brothers"
 krcw_raj2.43.d:0 "The Pangdatsang family of Markham are the strongest traders in Kham, with their own caravans and gunmen. Pangda Rapga tells the federation's men that if Delhi gives rifles, the Khampas will rise, on condition that afterwards Kham governs itself and does not answer to Lhasa."
 krcw_raj2.43.a:0 "Accept their terms."
 krcw_raj2.43.b:0 "Give rifles; do not discuss self-rule."
 krcw_raj2.44.t:0 "Delhi's Line"
 krcw_raj2.44.d0:0 "Nanjing already knows what Delhi is doing on the plateau. The Chamber's foreign affairs committee meets: prepare a rising before the Chinese reinforce, or build the Himalayan line first and wait for the plateau to stir on its own. The army wants the line; the men of the Himalayan Game want the rising."
 krcw_raj2.44.d1:0 "The rifles have reached Kham. The Chamber's foreign affairs committee meets: prepare a rising now, or build the Himalayan line first and wait for Nanjing to be distracted elsewhere. The Pangdatsang brothers are waiting for Delhi's signal."
 krcw_raj2.44.d2:0 "The Kalimpong reports lie before the Chamber's foreign affairs committee. Prepare a rising that takes Tibet out of China's hands, or build the Himalayan line first and wait for the plateau to stir on its own. The army wants the line; the men of the Himalayan Game want the rising."
 krcw_raj2.44.a:0 "Prepare a rising."
 krcw_raj2.44.b:0 "Build the Himalayan line first."
 krcw_raj2.45.t:0 "Word from Kalimpong"
 krcw_raj2.45.d0:0 "Our representative in Lhasa sends back the letter the Kashag handed over: the Indian Federation's political officer is buying Tibetan nobles with silver. Nanjing can reinforce Chamdo and close the passes to Sikkim, or first lodge a formal protest with Delhi."
 krcw_raj2.45.d1:0 "The consul in Kalimpong reports that the Indian Federation's men are active in Kham and the Sikkim passes, with rifles hidden in the mule trains. Nanjing can reinforce Chamdo and close the passes to Sikkim, or first lodge a formal protest with Delhi."
 krcw_raj2.45.a:0 "Reinforce Chamdo and close the passes."
 krcw_raj2.45.b:0 "Lodge a formal protest with Delhi."
 krcw_raj2.46.t:0 "Nanjing's Note"
 krcw_raj2.46.d0:0 "The National Revolutionary Army reinforces Chamdo, Nagqu and Yadong and sets up new checkpoints beyond the Nathu La. The Sikkim mule trains are searched bale by bale, and the Kalimpong houses lose half their trade. Nanjing's ambassador delivers a note at the same time."
 krcw_raj2.46.d1:0 "Nanjing's ambassador delivers a note to Delhi protesting the Indian Federation's \"interference in the internal affairs of the Republic of China\". The Paris papers reprint it in full. The Chamber's foreign affairs committee must decide how to answer."
 krcw_raj2.46.a:0 "Deny everything."
 krcw_raj2.46.b:0 "Back Tibetan self-rule in public."
 krcw_raj2.47.t:0 "An Oath on the Snow Line"
 krcw_raj2.47.d0:0 "The first Protectors of the Faith take their oath in an abandoned monastery in Sikkim. Their rifles come from Cawnpore and their instructors from the Gurkha regiments, and the oath does not mention Delhi. Nanjing's representative in Lhasa already knows the monastery's name."
 krcw_raj2.47.d1:0 "A chain of frontier posts goes up on the passes of Sikkim and Bhutan, and the men of the Kalimpong network move into them. Delhi has chosen to hold the passes, log every Chinese unit number, and wait for the plateau to change on its own."
 krcw_raj2.47.a:0 "The business of the snows is not finished."
 krcw_raj2_tt_not_watch:0 "Delhi did not choose to wait and watch"
 krcw_raj2_tt_forward:0 "Delhi has decided to prepare a rising"
 krcw_raj2_tt_line_first:0 "Delhi has decided to build the Himalayan line first"
 krcw_raj2_frontier_watch:0 "Set Up the Himalayan Frontier Watch"
 krcw_raj2_frontier_watch_desc:0 "Frontier posts are built on the passes of Sikkim, Bhutan and northern Assam, manned by men of the Kalimpong network and Gurkha scouts, logging Chinese garrison units and their movements. Delhi lights no fire on the plateau for now, but means to know everything that happens there."
 krcw_raj2_tt_kashag:0 "The Kashag accepted Delhi's gift"
 krcw_raj2_lhasa_stipends:0 "Pay Stipends to the Lhasa Nobles"
 krcw_raj2_lhasa_stipends_desc:0 "Through the Kalimpong trading houses, an annual stipend goes to the Kashag nobles willing to deal with Delhi. Shakabpa has drawn up the list; it is short, but every name on it holds a seat in the Kashag."
 krcw_raj2_tt_kham_armed:0 "The federation has agreed to arm the Kham chieftains"
 krcw_raj2_pangdatsang_caravans:0 "Arm the Pangdatsang Caravans"
 krcw_raj2_pangdatsang_caravans_desc:0 "Rifles and ammunition from Cawnpore are packed into the Pangdatsang caravans and carried into Kham by the back paths of Sikkim and Bhutan. Retired Gurkha officers go up with the caravans to train the Khampa gunmen."
 krcw_tibstage.1.t:0 "Silver from Kalimpong"
 krcw_tibstage.1.d:0 "New furniture appears in the noble houses of Lhasa, and the treasuries of the three great monasteries receive alms of uncertain origin. Nanjing's commissioner writes one sentence in his report: the caravans from the direction of Kalimpong are three times last year's number, and the crates coming in weigh more than those going out.\n\nThis is not yet rebellion, but it is no longer the old Tibet."
 krcw_tibstage.1.a:0 "Watch them closely."
 krcw_tibstage.2.t:0 "The Caravans of Kham"
 krcw_tibstage.2.d:0 "The mule caravans of Kham have begun to carry rifles. That in itself is unremarkable, for the road was never safe; what is remarkable is that the rifles are new and all of one pattern.\n\nThe Chengdu military region sends Nanjing a list: in six months at least four thousand rifles from the federal arsenals of India have entered Tibet."
 krcw_tibstage.2.a:0 "This is a proxy war."
 krcw_tibstage.3.t:0 "The Silence of Lhasa"
 krcw_tibstage.3.d:0 "This time even the pro-Nanjing ministers no longer reply. The reception rooms of the Potala are permanently \"engaged\", and the minutes of the Kashag grow empty and courteous. The regional commander sums it up in one sentence: the men on the mountain have decided, they have merely not picked the day.\n\nOne signal separates this from a rising. There is still time to act, but to do what?"
 krcw_tibstage.3.a:0 "Strike first: move now."
 krcw_tibstage.3.b:0 "Talk once more: send an envoy to Lhasa."
 krcw_raj_himalayan_game_cat:0 "The Himalayan Game"
 krcw_raj_himalayan_game_cat_desc:0 "Tibetan revolt progress: [?TIB.krcw_revolt_progress]/100. At 100 the Protectors of the Faith will rise."
 krcw_raj_fund_nobility:0 "Fund the Tibetan Nobility"
 krcw_raj_fund_nobility_desc:0 "Channel silver and gifts to Lhasa's nobles through the trading houses of Kalimpong."
 krcw_raj_send_advisors:0 "Send Advisors"
 krcw_raj_send_advisors_desc:0 "Send retired Gurkha officers to Kham as \"pilgrims\" to train the caravan militias."
 krcw_raj_smuggle_rifles:0 "Smuggle Rifles"
 krcw_raj_smuggle_rifles_desc:0 "Pack federal rifles into wool bales and carry them into Tibet over the Nathu La in Sikkim."
 krcw_raj_ignite_revolt:0 "Light the Snows"
 krcw_raj_ignite_revolt_desc:0 "The moment has come. Signal the Protectors."
 krcw_sov_tibet_cat:0 "The Himalayan Front"
 krcw_sov_fund_delhi_game:0 "Bankroll Delhi's Game"
 krcw_sov_fund_delhi_game_desc:0 "Provide roubles to the Tibetan nobles through Delhi."
 krcw_chi_tibet_policy_cat:0 "Tibetan Affairs"
 krcw_chi_tibet_policy_cat_desc:0 "Pro-Indian influence in the Kashag: [?TIB.krcw_revolt_progress]/100."
 krcw_chi_reaffirm_lhasa:0 "Reaffirm the Lhasa Agreement"
 krcw_chi_reaffirm_lhasa_desc:0 "Send an envoy to Lhasa publicly pledging that Nanjing will not alter Tibet's existing system."
 krcw_chi_dec_frontier_garrisons:0 "Frontier Garrisons"
 krcw_chi_dec_frontier_garrisons_desc:0 "Add garrisons at Chamdo, Nagqu and Yadong and close the passes to Sikkim."
 krcw_chi_honour_nobles:0 "Honour the Nobles"
 krcw_chi_honour_nobles_desc:0 "Grant Lhasa's great nobles honorary titles and stipends from the National Government."
 krcw_chi_arrest_pro_indian:0 "Arrest the Pro-Indian Faction"
 krcw_chi_arrest_pro_indian_desc:0 "Arrest pro-Indian nobles in the Kashag for \"collusion with foreign powers\"."
 krcw_tibet_war_cat:0 "The Tibetan War"
 krcw_raj_airdrop_supplies:0 "Airdrop Supplies"
 krcw_raj_airdrop_supplies_desc:0 "Federal transports cross the Himalaya by night to drop ammunition to the Protectors."
 krcw_raj_protector_columns:0 "Protector Volunteer Columns"
 krcw_raj_protector_columns_desc:0 "\"Volunteers\" gathered in Sikkim and Bhutan cross the border to join the Protectors."
 krcw_raj_open_intervention:0 "Open Intervention"
 krcw_raj_open_intervention_desc:0 "Drop the veil: the Federal Army crosses the Himalaya and declares war on the Republic of China."
 krcw_sov_arms_via_delhi:0 "Arms via Delhi"
 krcw_sov_arms_via_delhi_desc:0 "Russian mountain guns and machine guns are routed to Tibet via Karachi and Delhi."
 krcw_fra_engineer_brigade:0 "Internationale Engineer Brigade"
 krcw_fra_engineer_brigade_desc:0 "The Internationale sends a brigade of French, Italian and Vietnamese sappers to help China build the Sichuan-Tibet road."
 krcw_chi_amnesty:0 "Proclamation of Amnesty"
 krcw_chi_amnesty_desc:0 "Proclaim that any Protector who lays down his arms is pardoned and monastery property will not be touched."
 krcw_chi_mountain_roads:0 "Rush the Mountain Roads"
 krcw_chi_mountain_roads_desc:0 "Conscript labour to rush the roads over Erlang Shan and Chola Shan."
 krcw_chi_punish_sikkim:0 "Punish Sikkim"
 krcw_chi_punish_sikkim_desc:0 "Pursue the Protectors' rear bases straight over the Nathu La into India."
 krcw_tib_appeal_world:0 "Appeal to the World"
 krcw_tib_appeal_world_desc:0 "The Kashag sends appeals to Paris, Moscow and Canberra at once, asking for international mediation."
 krcw_raj_princely_crisis_cat:0 "The Princely Revolts"
 krcw_raj_princely_crisis_cat_desc:0 "Unrest: [?RAJ.krcw_raj_unrest]/100. Reform: [?RAJ.krcw_raj_reform]/100. If unrest reaches 100 before a charter is signed, the Deccan will erupt into civil war."
 krcw_raj_negotiate_nizam:0 "Negotiate with the Nizam"
 krcw_raj_negotiate_nizam_desc:0 "Promise Hyderabad part of its customs revenue in exchange for paying the defence levy."
 krcw_raj_rent_remission:0 "Remit Rents"
 krcw_raj_rent_remission_desc:0 "Announce a year's rent remission in the worst-affected districts."
 krcw_raj_deploy_federal_army:0 "Deploy the Federal Army"
 krcw_raj_deploy_federal_army_desc:0 "Send the Federal Army into the capitals of the rebellious states."
 krcw_raj_draft_charter:0 "Draft a Charter"
 krcw_raj_draft_charter_desc:0 "Authorise the Council of Dewans to draft a new charter."
