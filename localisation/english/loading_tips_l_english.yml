# -*- coding: utf-8 -*-
l_english:
 LOADING_TIP_0:0 "In 1919 Germany won the World War. In 1944 the Internationale and Savinkov's Russia crushed the German Empire from east and west, ending the Second World War."
 LOADING_TIP_1:0 "After victory, the rift between the victors became a curtain of barbed wire across the world: the communes of Paris and London against the iron fists of New Orleans and Moscow."
 LOADING_TIP_2:0 "Along the Elbe, sentries on both sides of the wire watch each other day and night. Berlin is divided in two; the Bread Bridge is West Berlin's only lifeline."
 LOADING_TIP_3:0 "The American Civil War froze at the Ohio cease-fire line, unfinished. Long's America, the syndicates and the constitutional government in Sacramento each claim to be the United States."
 LOADING_TIP_4:0 "Zhou Enlai leads the left wing of the Kuomintang in rebuilding a ravaged China. Nanjing holds the balance in the East along the Sino-Russian border."
 LOADING_TIP_5:0 "The House of Windsor and the remnants of the Entente wait in exile in Australia for their chance to return."
 LOADING_TIP_6:0 "The collapse of National France, Mittelafrika and the Ottoman Empire left a vacuum. The newly independent states seek their place between the two blocs."
 LOADING_TIP_7:0 "Princely India, Schleicher's National Republic, the military regimes of Eastern Europe — the Moscow Accord is an alliance of interest, not ideology."
 LOADING_TIP_8:0 "In May 1949 two worlds face each other across the wire. Peace is only the interval before the next war."
 LOADING_TIP_9:0 "The Internationale's Clearing Union replaced gold with labour units. The workers of the communes believe the future belongs not to capital but to labour."
 LOADING_TIP_10:0 "Savinkov's Russia exports no revolution, only tanks and order. For many new states, that is enough."
 LOADING_TIP_11:0 "The Berlin Crisis of the 1950s, the Great Lakes Missile Crisis of the 1960s — each time the world stood on the brink."
 LOADING_TIP_12:0 "Huey Long and Savinkov are both old men. Who will inherit their power? Will the successors continue the iron hand, or open a window to thaw?"
 LOADING_TIP_13:0 "The Tibetan revolt, India's princely crisis, Japan's democratisation — the Asian Cold War is never quiet."
 LOADING_TIP_14:0 "The copper mines of the Congo, the Jaffa Accord in Palestine, Egypt's Free Officers — every inch of the new world is contested ground."
 LOADING_TIP_15:0 "Red flags and black eagles: who will shape the future of humanity?"
