l_english:
# krcw: years paced
 krcw_yn.1.t:0 "Independent Africa"
 krcw_yn.1.d:0 "The colonial empires of Berlin and Algiers collapsed in 1942, leaving dozens of new states. Senegal, Congo, Kenya — their borders were drawn with rulers on maps, but their independence was won by themselves."
 krcw_yn.1.a:0 "The first steps of a new world."
 krcw_yn.2.t:0 "The Jaffa Accord"
 krcw_yn.2.d:0 "After the Ottoman Empire fell in 1944, the Arab notables and Jewish settlers of Jerusalem signed the Jaffa Accord and founded a fragile binational republic."
 krcw_yn.2.a:0 "Two peoples, one state."
 krcw_yn.3.t:0 "The New Order in Southeast Asia"
 krcw_yn.3.d:0 "After German East Asia fell in 1944, Indonesia and Malaya declared independence. Amsterdam's revolution recognised Sukarno's republic, and Malaya took Singapore and Malacca."
 krcw_yn.3.a:0 "From colonies to republics."
 krcw_yn.4.t:0 "The Neutrals of the Americas"
 krcw_yn.4.d:0 "After the American Civil War, Latin America keeps a wary neutrality between the blocs. Sandino's Nicaragua is the only syndicalist state, and Chile's Socialist Republic refuses to join any camp."
 krcw_yn.4.a:0 "Neither Paris nor Moscow."
 krcw_yn.10.t:0 "The Workers' Councils of the Copperbelt"
 krcw_yn.10.d:0 "The miners of the Copperbelt swore loyalty to Lusaka at independence in 1949. But their councils remember the 1946 miners' rising in Zambezi and how Kasa-Vubu's soldiers crushed it."
 krcw_yn.10.a:0 "The councils have long memories."
 krcw_yn.11.t:0 "The Miners of Katanga"
 krcw_yn.11.d:0 "The miners of Likasi and Kolwezi are on strike. They demand direct elections, worker participation in management, an end to copper extraction — and recognition of their councils by the Zambezi Federation."
 krcw_yn.11.a:0 "This is mutiny."
 krcw_yn.11.b:0 "Recognise their demands."
 krcw_yn.12.t:0 "The Katanga Soviet"
 krcw_yn.12.d:0 "The councils proclaim a \"Katanga Miners' Soviet\"; Lusaka has lost control of the southern Copperbelt."
 krcw_yn.12.a:0 "Send the army to take it back."
 krcw_yn.12.b:0 "Let it go."
 krcw_yn.20.t:0 "Pressure on the Jaffa Accord"
 krcw_yn.20.d:0 "Quwatli in Damascus does not recognise Palestine. \"Greater Syria\", he says, stretches from the Euphrates to the Mediterranean, and Jaffa is part of it."
 krcw_yn.20.a:0 "Lodge a diplomatic protest."
 krcw_yn.21.t:0 "Syrian Demands"
 krcw_yn.21.d:0 "Damascus newspapers print maps of Jaffa with the caption \"Syria's southern province\". The Hashemite King in Amman has his eyes on East Jerusalem."
 krcw_yn.21.a:0 "Ask Paris for help."
 krcw_yn.21.b:0 "Ask Moscow for help."
 krcw_yn.21.c:0 "We hold Jaffa ourselves."
 krcw_yn.22.t:0 "Paris Mediation"
 krcw_yn.22.d:0 "Paris or Moscow sends a mediation mission. Under pressure Quwatli agrees to a ceasefire, and Syria withdraws its claim to Jaffa."
 krcw_yn.22.a:0 "The Jaffa Accord survives."
 krcw_yn.23.t:0 "The Syrian Army"
 krcw_yn.23.d:0 "Damascus is not interested in mediation. Syrian armoured divisions are massing at the border."
 krcw_yn.23.a:0 "Hold Jaffa."
 krcw_yn.30.t:0 "The Free Officers"
 krcw_yn.30.d:0 "The Suez Canal Company's shares are still held in Paris, and though the British are gone their bankers remain in Cairo. Young officers talk quietly of a republic in their barracks."
 krcw_yn.30.a:0 "Farouk's rule is secure."
 krcw_yn.31.t:0 "The Officers' Coup"
 krcw_yn.31.d:0 "In July 1950 Colonel Naguib's tanks roll into Abdin Palace. Farouk boards a ship in Alexandria for exile. The Officers' Council proclaims a republic."
 krcw_yn.31.a:0 "Back the Officers' Council."
 krcw_yn.31.b:0 "Suppress them."
 krcw_yn.40.t:0 "The Witwatersrand Strike"
 krcw_yn.40.d:0 "The black trade unions of Johannesburg are on strike. They demand equal pay, the abolition of the pass laws, and the vote."
 krcw_yn.40.a:0 "Crush the strike."
 krcw_yn.40.b:0 "Negotiate with the unions."
 krcw_yn.41.t:0 "Sanctions from the Young Nations"
 krcw_yn.41.d:0 "Senegal, Congo and Kenya announce a trade embargo on South Africa. They condemn \"racial oppression\" in Johannesburg at the Conference of Young Nations."
 krcw_yn.41.a:0 "We need no lectures from them."
 krcw_yn.50.t:0 "The Chinese Unions of Singapore"
 krcw_yn.50.d:0 "The Chinese longshoremen, clerks and students of Singapore demand autonomy. The Federation of Malaya, they say, is a Malay federation, not a Chinese one."
 krcw_yn.50.a:0 "Suppress them."
 krcw_yn.50.b:0 "Grant Singapore autonomy."
 krcw_yn.60.t:0 "Kuwait and Yahra"
 krcw_yn.60.d:0 "Baghdad newspapers print maps of Iraq with Kuwait marked \"Province 19\". Nuri al-Said says the Emirate of Kuwait is an Ottoman remnant and should return to the republic."
 krcw_yn.60.a:0 "It is our territory."
 krcw_yn.61.t:0 "Tension in the Persian Gulf"
 krcw_yn.61.d:0 "The Emir of Kuwait appeals to Moscow and Riyadh. Savinkov's Russia warns Baghdad, and Ibn Saud sends his envoys."
 krcw_yn.61.a:0 "Withdraw the claim."
 krcw_yn.61.b:0 "Send troops to Kuwait."
