 krcw_sph_rival.a:0 "Outbid them"
 krcw_sph_rival.b:0 "Warn them off in public"
 krcw_sph_rival.c:0 "Let it go"
 krcw_sph_tt_outbid:0 "Our influence there §G+10§!, theirs §R-10§!; their offer is more likely to be refused."
 krcw_sph_tt_warned:0 "Their offer is more likely to be refused."
 krcw_sph_war.a:0 "Send arms and instructors"
 krcw_sph_war.b:0 "Guarantee its independence"
 krcw_sph_war.c:0 "Only protest"
 krcw_sph_treaty_t:0 "[From.GetName] Proposes a Treaty of Friendship and Commerce"
 krcw_sph_treaty_d:0 "[From.GetNameDef] proposes a treaty of friendship and commerce: most-favoured-nation treatment both ways and no military obligation. Its merchants and advisers are already busy here."
 krcw_sph_treaty.a:0 "Sign"
 krcw_sph_treaty.b:0 "Decline politely"
 krcw_sph_align_t:0 "[From.GetName] Invites Us into an Alliance"
 krcw_sph_align_d_bloc:0 "[From.GetNameDef] invites us to join the [From.GetFactionName]. If we are in another bloc we must leave it first. Accepting puts us on its side in the Cold War; refusing will anger it."
 krcw_sph_align_d_solo:0 "[From.GetNameDef] offers to guarantee our independence in exchange for military access. We need not join either Cold War bloc, but the other powers will count us as its client."
 krcw_sph_align.a:0 "Accept"
 krcw_sph_align.b:0 "Refuse"
 krcw_sph_protect_t:0 "[From.GetName] Offers Us a Protectorate"
 krcw_sph_protect_d:0 "[From.GetNameDef] offers to take charge of our foreign affairs and defence. Our government stays, but major decisions will need its consent. Its influence here is already great, and refusing will cost us."
 krcw_sph_protect.a:0 "Accept the protectorate"
 krcw_sph_protect.b:0 "Refuse"
 krcw_sph_ult_t:0 "The Ultimatum of [From.GetName]"
 krcw_sph_ult_d:0 "[From.GetNameDef] demands that we become its protectorate or face war. Its army is far stronger than ours. The other powers with influence here will hear of it and may send us arms or a guarantee."
 krcw_sph_ult.a:0 "Submit"
 krcw_sph_ult.b:0 "Refuse"
 krcw_sph_20_t:0 "[From.GetName] Signs the Treaty"
 krcw_sph_20_d:0 "[From.GetNameDef] has accepted the treaty of friendship and commerce. Our influence there will no longer fall on its own."
 krcw_sph_21_t:0 "[From.GetName] Declines the Treaty"
 krcw_sph_21_d:0 "[From.GetNameDef] says this is not the time for a treaty. We can ask again in six months, or consider an ultimatum."
 krcw_sph_22_t:0 "[From.GetName] Joins Our Side"
 krcw_sph_22_d:0 "[From.GetNameDef] has accepted our offer."
 krcw_sph_23_t:0 "[From.GetName] Refuses Us"
 krcw_sph_23_d:0 "[From.GetNameDef] has refused our offer. We cannot ask again for a year, but an ultimatum is now possible."
 krcw_sph_24_t:0 "[From.GetName] Becomes Our Protectorate"
 krcw_sph_24_d:0 "[From.GetNameDef] has agreed to let us run its foreign affairs and defence. In time we can begin to absorb it."
 krcw_sph_25_t:0 "[From.GetName] Refuses the Protectorate"
 krcw_sph_25_d:0 "[From.GetNameDef] has refused our protection. We cannot ask again for a year, but an ultimatum is now possible."
 krcw_sph_26_t:0 "[From.GetName] Submits"
 krcw_sph_26_d:0 "[From.GetNameDef] has accepted our ultimatum and become our protectorate."
 krcw_sph_31_t:0 "[From.GetName] Resists the Merger"
 krcw_sph_31_d:0 "The government of [From.GetNameDef] has refused the merger, taken back some of its autonomy and dissolved the joint command. We must merge the army commands again before asking again."
 krcw_sph_ok:0 "Understood"
 krcw_sph_28_t:0 "[From.GetName] Rejects the Ultimatum"
 krcw_sph_28_d:0 "[From.GetNameDef] has refused to become our protectorate. We can go to war or back down, and backing down will cost us face."
 krcw_sph_28.a:0 "Go to war"
 krcw_sph_28.b:0 "Back down"
 krcw_sph_30_t:0 "[From.GetName] Asks Us to Join It"
 krcw_sph_30_d:0 "We already share a customs union and a joint command with [From.GetNameDef], and most of our ministries take its orders. Now it asks us to join it formally. If we accept, our land becomes its land."
 krcw_sph_30.a:0 "Agree to the merger"
 krcw_sph_30.b:0 "Resist"
 krcw_sph_chi_nep_road:0 "Build the Lhasa-Kathmandu Road"
 krcw_sph_chi_nep_road_desc:0 "Nepal's trade has to go over the Indian railways, and the Calcutta merchants set the terms. A road over the Himalaya would give Kathmandu another way out. It will take years, and the crews and explosives come from Tibet.\n\nNeeds: [NEP.GetName] influence 30"
 krcw_sph_chi_bhu_schools:0 "Build Schools and Hospitals in Bhutan"
 krcw_sph_chi_bhu_schools_desc:0 "Bhutan has almost no modern schools or hospitals. Nanjing pays for a secondary school and a hospital in both Thimphu and Punakha, staffed by Tibetan monks and Chinese teachers together. Delhi sees this as meddling in its sphere.\n\nNeeds: [BHU.GetName] influence 25"
 krcw_sph_chi_sia_rice:0 "Sign a Rice Purchase Agreement with Siam"
 krcw_sph_chi_sia_rice_desc:0 "Nanjing buys Siam's rice exports for several years at a fixed price, in exchange for freedom of trade for Chinese merchants in Siam. The Bangkok government distrusts the Chinese merchants, but it needs the hard currency.\n\nNeeds: [SIA.GetName] influence 25"
 krcw_sph_chi_malacca:0 "Convene a Malacca Strait Shipping Conference"
 krcw_sph_chi_malacca_desc:0 "Nanjing calls the shipping companies and dockers' unions of Malaya and Indonesia together to agree the Strait's freight rates, pilotage and harbours of refuge. The Japanese shipping lines are not invited.\n\nNeeds: [MAL.GetName] influence 25, [INO.GetName] influence 20"
 krcw_sph_raj_nep_gurkha:0 "Renew the Gurkha Recruitment Treaty"
 krcw_sph_raj_nep_gurkha_desc:0 "India recruits Gurkhas from the hill villages of Nepal every year, and their pay and pensions are those villages' main income. The new treaty doubles the quota, and Delhi bears the cost.\n\nNeeds: [NEP.GetName] influence 30"
 krcw_sph_raj_bhu_punakha:0 "Raise the Punakha Treaty Subsidy"
 krcw_sph_raj_bhu_punakha_desc:0 "Under the Treaty of Punakha of 1910 Bhutan accepts India's guidance in foreign affairs and India pays the Bhutanese court a yearly subsidy. Delhi offers to triple it, on condition that Bhutan does not open relations with Nanjing.\n\nNeeds: [BHU.GetName] influence 30"
 krcw_sph_jap_phi_davao:0 "Back the Japanese Settlers of Davao"
 krcw_sph_jap_phi_davao_desc:0 "Most of the hemp plantations of Davao are run by Japanese settlers. Tokyo gives them cheap loans through the Bank of Taiwan so they can buy more land and speak for Japan in the Manila legislature.\n\nNeeds: [PHI.GetName] influence 25"
 krcw_sph_sov_irq_kirkuk:0 "Bid for the Kirkuk Oil Concession"
 krcw_sph_sov_irq_kirkuk_desc:0 "The Russian oil companies offer Baghdad a better share than the current contract and ask to take over the Kirkuk field. The Iraqi government needs the money and is happy to let both sides bid.\n\nNeeds: [IRQ.GetName] influence 30"
 krcw_sph_fra_maghreb:0 "Convene a Maghreb Trade Union Congress"
 krcw_sph_fra_maghreb_desc:0 "The Internationale holds a congress of the Maghreb trade unions in Tunis to agree a common labour code and through railway traffic. The Sultan in Rabat is wary of it.\n\nNeeds: [MOR.GetName] influence 30, [TUN.GetName] influence 30"
 krcw_sph_usa_cub_sugar:0 "Raise the Cuban Sugar Quota"
 krcw_sph_usa_cub_sugar_desc:0 "The Union Party government doubles the import quota for Cuban sugar, at a price above the world market. The Havana planters will remember who paid.\n\nNeeds: [CUB.GetName] influence 25"
 krcw_sph_wca_dockers:0 "Organise a Caribbean Dockers' Federation"
 krcw_sph_wca_dockers_desc:0 "Organisers of the Industrial Workers of the World work the docks of Havana, Port-au-Prince and Santo Domingo to merge the port unions into one federation. The New Orleans shipping lines treat it as a provocation against America.\n\nNeeds: [CUB.GetName] influence 20, [HAI.GetName] influence 10, [DOM.GetName] influence 10"
 krcw_sph_ita_alb_noli:0 "Fund Noli's Government in Exile in Rome"
 krcw_sph_ita_alb_noli_desc:0 "Bishop Noli, driven out in 1944, is still in Rome. Italy gives his government in exile money and a radio station that broadcasts to Albania. Zog and the Russians will treat it as a provocation.\n\nNeeds: [ALB.GetName] influence 5"
 krcw_sph_sov_alb_sazan:0 "Lease Sazan Island"
 krcw_sph_sov_alb_sazan_desc:0 "The Russian navy offers to lease Sazan Island at the mouth of Vlorë Bay and build a submarine base. Zog gets the rent and Russia gets a naval base on the Adriatic. Italy will see it as a direct threat.\n\nNeeds: [ALB.GetName] influence 50"
 krcw_sph_eng_gha_cocoa:0 "Buy Up the Gold Coast Cocoa Crop"
 krcw_sph_eng_gha_cocoa_desc:0 "The British Co-operative Wholesale Society offers to buy all of Ghana's cocoa at a guaranteed price and to help the growers form cooperatives. The growers welcome it; the middlemen of Accra oppose it.\n\nNeeds: [GHA.GetName] influence 25"
 krcw_sph_psa_hwi_pearl:0 "Lease Pearl Harbor"
 krcw_sph_psa_hwi_pearl_desc:0 "Sacramento offers to lease Pearl Harbor for ninety-nine years, repair the docks and base the Pacific Fleet there. The Hawaiian government gets the rent and a fleet to protect it.\n\nNeeds: [HWI.GetName] influence 35"
 krcw_sph_wgr_swe_ore:0 "Sign a Long-Term Swedish Iron Ore Contract"
 krcw_sph_wgr_swe_ore_desc:0 "The Ruhr steelworks need Kiruna ore. Germany buys Swedish ore on a long-term contract and offers technical training in German plants to the Swedish unions.\n\nNeeds: [SWE.GetName] influence 25"
