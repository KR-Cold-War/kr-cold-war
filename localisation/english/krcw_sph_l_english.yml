 krcw_sph_ITA_protect:0 "Offer a Protectorate: [From.GetName]"
 krcw_sph_ITA_protect_desc:0 "At 80 influence, with a treaty or a shared bloc and no other power above 30, we can offer them a protectorate: we take over foreign affairs and defence and their government stays. They may refuse.\n\nOur influence there: §Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_ITA_ultimatum:0 "Send an Ultimatum: [From.GetName]"
 krcw_sph_ITA_ultimatum_desc:0 "If they have refused our treaty or our offer, or gone over to another power, and are in no bloc, we can demand that they become our protectorate or face war. It needs at least 30 influence there and an army at least twice theirs. Only one such ultimatum can be sent in the world each year, and the other powers there may arm them or guarantee them.\n\nOur influence there: §Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_ITA_int1:0 "Form a Customs Union: [From.GetName]"
 krcw_sph_ITA_int1_desc:0 "Abolish the tariffs between us, and unify the currency and the railway rates. Their autonomy will fall."
 krcw_sph_ITA_int2:0 "Merge the Army Commands: [From.GetName]"
 krcw_sph_ITA_int2_desc:0 "Nine months after the customs union, place their army in our chain of command."
 krcw_sph_ITA_int3:0 "Join the Socialist Republic of Italy: [From.GetName]"
 krcw_sph_ITA_int3_desc:0 "Nine months after the joint command, ask their government to agree to join us. Their land becomes our core territory. Their government may resist."
 krcw_sph_WGR_treaty:0 "Sign a Treaty of Friendship and Commerce: [From.GetName]"
 krcw_sph_WGR_treaty_desc:0 "At 35 influence we can propose a treaty of friendship and commerce: most-favoured-nation treatment both ways and no military obligation. With a treaty our influence there stops falling. They may refuse.\n\nOur influence there: §Y[?From.krcw_inf_WGR|0]§!/100"
