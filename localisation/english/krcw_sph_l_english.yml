l_english:
# krcw: years paced
 krcw_sph_instructors:0 "Foreign Military Instructors"
 krcw_sph_customs_union:0 "Customs Union"
 krcw_sph_joint_command:0 "Joint Command"
 krcw_sph_instructors_desc:0 "Instructors sent by a great power are training our army, and brought a shipment of arms."
 krcw_sph_customs_union_desc:0 "Tariffs between us and our overlord are gone, and our currency and railway rates are unified."
 krcw_sph_joint_command_desc:0 "Our army has been placed in our overlord's chain of command."
 krcw_sph_CHI_cat:0 "Sphere of Influence"
 krcw_sph_CHI_cat_desc:0 "The small states of South-East Asia and the Himalaya sit between several great powers. Nanjing's assets are the overseas Chinese chambers of commerce, its construction crews and its cooperative organisers; Delhi and Tokyo are courting the same countries.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[SIA.GetName]: §Y[?SIA.krcw_inf_CHI|0]§! ([RAJ.GetName] [?SIA.krcw_inf_RAJ|0], [JAP.GetName] [?SIA.krcw_inf_JAP|0])\n[MAL.GetName]: §Y[?MAL.krcw_inf_CHI|0]§! ([JAP.GetName] [?MAL.krcw_inf_JAP|0])\n[INO.GetName]: §Y[?INO.krcw_inf_CHI|0]§! ([JAP.GetName] [?INO.krcw_inf_JAP|0])\n[PHI.GetName]: §Y[?PHI.krcw_inf_CHI|0]§! ([JAP.GetName] [?PHI.krcw_inf_JAP|0], [PSA.GetName] [?PHI.krcw_inf_PSA|0])\n[NEP.GetName]: §Y[?NEP.krcw_inf_CHI|0]§! ([RAJ.GetName] [?NEP.krcw_inf_RAJ|0])\n[BHU.GetName]: §Y[?BHU.krcw_inf_CHI|0]§! ([RAJ.GetName] [?BHU.krcw_inf_RAJ|0])\n[BRU.GetName]: §Y[?BRU.krcw_inf_CHI|0]§! ([JAP.GetName] [?BRU.krcw_inf_JAP|0])"
 krcw_sph_RAJ_cat:0 "Sphere of Influence"
 krcw_sph_RAJ_cat_desc:0 "Delhi regards the Himalayan kingdoms, Ceylon and the Arabian Sea coast as India's natural sphere. Nanjing and London do not agree.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[NEP.GetName]: §Y[?NEP.krcw_inf_RAJ|0]§! ([CHI.GetName] [?NEP.krcw_inf_CHI|0])\n[BHU.GetName]: §Y[?BHU.krcw_inf_RAJ|0]§! ([CHI.GetName] [?BHU.krcw_inf_CHI|0])\n[SRL.GetName]: §Y[?SRL.krcw_inf_RAJ|0]§! ([ENG.GetName] [?SRL.krcw_inf_ENG|0])\n[OMA.GetName]: §Y[?OMA.krcw_inf_RAJ|0]§! ([ENG.GetName] [?OMA.krcw_inf_ENG|0])\n[MLD.GetName]: §Y[?MLD.krcw_inf_RAJ|0]§!\n[SIA.GetName]: §Y[?SIA.krcw_inf_RAJ|0]§! ([CHI.GetName] [?SIA.krcw_inf_CHI|0], [JAP.GetName] [?SIA.krcw_inf_JAP|0])"
 krcw_sph_SOV_cat:0 "Sphere of Influence"
 krcw_sph_SOV_cat_desc:0 "Russia needs friends in the Middle East and the North, and above all their oil and iron ore. Albania is the Accord's foothold on the Adriatic, and Italy has never stopped trying to pull it back.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[ALB.GetName]: §Y[?ALB.krcw_inf_SOV|0]§! ([ITA.GetName] [?ALB.krcw_inf_ITA|0])\n[IRQ.GetName]: §Y[?IRQ.krcw_inf_SOV|0]§!\n[SYR.GetName]: §Y[?SYR.krcw_inf_SOV|0]§!\n[SWE.GetName]: §Y[?SWE.krcw_inf_SOV|0]§! ([WGR.GetName] [?SWE.krcw_inf_WGR|0])\n[YEM.GetName]: §Y[?YEM.krcw_inf_SOV|0]§!\n[SAU.GetName]: §Y[?SAU.krcw_inf_SOV|0]§!"
 krcw_sph_FRA_cat:0 "Sphere of Influence"
 krcw_sph_FRA_cat_desc:0 "Paris's influence in North and Equatorial Africa comes from the unions and cooperatives of the old colonies. Italy in Libya and Germany in Switzerland have plans of their own.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[MOR.GetName]: §Y[?MOR.krcw_inf_FRA|0]§!\n[TUN.GetName]: §Y[?TUN.krcw_inf_FRA|0]§!\n[LBA.GetName]: §Y[?LBA.krcw_inf_FRA|0]§! ([ITA.GetName] [?LBA.krcw_inf_ITA|0])\n[SEN.GetName]: §Y[?SEN.krcw_inf_FRA|0]§!\n[RCG.GetName]: §Y[?RCG.krcw_inf_FRA|0]§!\n[CMR.GetName]: §Y[?CMR.krcw_inf_FRA|0]§!\n[SWI.GetName]: §Y[?SWI.krcw_inf_FRA|0]§! ([ITA.GetName] [?SWI.krcw_inf_ITA|0], [WGR.GetName] [?SWI.krcw_inf_WGR|0])"
 krcw_sph_ENG_cat:0 "Sphere of Influence"
 krcw_sph_ENG_cat_desc:0 "London has union and cooperative ties in West Africa, East Africa, Egypt and the Caribbean. India, Germany and the Combined Syndicates compete with us in several of them.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[EGY.GetName]: §Y[?EGY.krcw_inf_ENG|0]§!\n[KEN.GetName]: §Y[?KEN.krcw_inf_ENG|0]§!\n[NGA.GetName]: §Y[?NGA.krcw_inf_ENG|0]§!\n[GHA.GetName]: §Y[?GHA.krcw_inf_ENG|0]§!\n[SRL.GetName]: §Y[?SRL.krcw_inf_ENG|0]§! ([RAJ.GetName] [?SRL.krcw_inf_RAJ|0])\n[BAD.GetName]: §Y[?BAD.krcw_inf_ENG|0]§! ([WCA.GetName] [?BAD.krcw_inf_WCA|0])\n[ICE.GetName]: §Y[?ICE.krcw_inf_ENG|0]§! ([WGR.GetName] [?ICE.krcw_inf_WGR|0])\n[OMA.GetName]: §Y[?OMA.krcw_inf_ENG|0]§! ([RAJ.GetName] [?OMA.krcw_inf_RAJ|0])"
 krcw_sph_USA_cat:0 "Sphere of Influence"
 krcw_sph_USA_cat_desc:0 "The Union Party government treats the Caribbean and Central America as America's backyard. The Syndicates have many sympathisers on the docks and plantations there.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[CUB.GetName]: §Y[?CUB.krcw_inf_USA|0]§! ([WCA.GetName] [?CUB.krcw_inf_WCA|0])\n[PAN.GetName]: §Y[?PAN.krcw_inf_USA|0]§! ([PSA.GetName] [?PAN.krcw_inf_PSA|0])\n[GUA.GetName]: §Y[?GUA.krcw_inf_USA|0]§!\n[HON.GetName]: §Y[?HON.krcw_inf_USA|0]§!\n[ELS.GetName]: §Y[?ELS.krcw_inf_USA|0]§!\n[NIC.GetName]: §Y[?NIC.krcw_inf_USA|0]§! ([WCA.GetName] [?NIC.krcw_inf_WCA|0])\n[COS.GetName]: §Y[?COS.krcw_inf_USA|0]§!\n[DOM.GetName]: §Y[?DOM.krcw_inf_USA|0]§! ([WCA.GetName] [?DOM.krcw_inf_WCA|0])\n[HAI.GetName]: §Y[?HAI.krcw_inf_USA|0]§! ([WCA.GetName] [?HAI.krcw_inf_WCA|0])"
 krcw_sph_JAP_cat:0 "Sphere of Influence"
 krcw_sph_JAP_cat_desc:0 "Japan keeps its influence in the South Seas through its settlers, banks and shipping lines. China and the Pacific States compete with us in the same waters.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): ask them to accept our guarantee and military access. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[PHI.GetName]: §Y[?PHI.krcw_inf_JAP|0]§! ([CHI.GetName] [?PHI.krcw_inf_CHI|0], [PSA.GetName] [?PHI.krcw_inf_PSA|0])\n[INO.GetName]: §Y[?INO.krcw_inf_JAP|0]§! ([CHI.GetName] [?INO.krcw_inf_CHI|0])\n[MAL.GetName]: §Y[?MAL.krcw_inf_JAP|0]§! ([CHI.GetName] [?MAL.krcw_inf_CHI|0])\n[SIA.GetName]: §Y[?SIA.krcw_inf_JAP|0]§! ([CHI.GetName] [?SIA.krcw_inf_CHI|0], [RAJ.GetName] [?SIA.krcw_inf_RAJ|0])\n[BRU.GetName]: §Y[?BRU.krcw_inf_JAP|0]§! ([CHI.GetName] [?BRU.krcw_inf_CHI|0])"
 krcw_sph_PSA_cat:0 "Sphere of Influence"
 krcw_sph_PSA_cat_desc:0 "The Pacific Fleet needs the harbours of Hawaii and the Philippines, and needs the Panama Canal kept open. Japan, China and Long's America are active in the same places.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): ask them to accept our guarantee and military access. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[HWI.GetName]: §Y[?HWI.krcw_inf_PSA|0]§!\n[PHI.GetName]: §Y[?PHI.krcw_inf_PSA|0]§! ([CHI.GetName] [?PHI.krcw_inf_CHI|0], [JAP.GetName] [?PHI.krcw_inf_JAP|0])\n[PAN.GetName]: §Y[?PAN.krcw_inf_PSA|0]§! ([USA.GetName] [?PAN.krcw_inf_USA|0])"
 krcw_sph_ITA_cat:0 "Sphere of Influence"
 krcw_sph_ITA_cat_desc:0 "Italy regards Libya and the Horn of Africa as its near neighbours. Albania, across the Adriatic, now belongs to the Moscow Accord, and Bishop Noli's government in exile is still in Rome. France also has influence in Libya.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[ALB.GetName]: §Y[?ALB.krcw_inf_ITA|0]§! ([SOV.GetName] [?ALB.krcw_inf_SOV|0])\n[LBA.GetName]: §Y[?LBA.krcw_inf_ITA|0]§! ([FRA.GetName] [?LBA.krcw_inf_FRA|0])\n[ETH.GetName]: §Y[?ETH.krcw_inf_ITA|0]§!\n[SOM.GetName]: §Y[?SOM.krcw_inf_ITA|0]§!\n[MLT.GetName]: §Y[?MLT.krcw_inf_ITA|0]§!\n[SWI.GetName]: §Y[?SWI.krcw_inf_ITA|0]§! ([FRA.GetName] [?SWI.krcw_inf_FRA|0], [WGR.GetName] [?SWI.krcw_inf_WGR|0])"
 krcw_sph_WGR_cat:0 "Sphere of Influence"
 krcw_sph_WGR_cat_desc:0 "German industry needs Swedish iron ore and Swiss banks. Russia and Britain are courting the same neutral countries.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[SWI.GetName]: §Y[?SWI.krcw_inf_WGR|0]§! ([FRA.GetName] [?SWI.krcw_inf_FRA|0], [ITA.GetName] [?SWI.krcw_inf_ITA|0])\n[SWE.GetName]: §Y[?SWE.krcw_inf_WGR|0]§! ([SOV.GetName] [?SWE.krcw_inf_SOV|0])\n[ICE.GetName]: §Y[?ICE.krcw_inf_WGR|0]§! ([ENG.GetName] [?ICE.krcw_inf_ENG|0])"
 krcw_sph_WCA_cat:0 "Sphere of Influence"
 krcw_sph_WCA_cat_desc:0 "The dockers, sugar workers and plantation workers of the Caribbean are the Syndicates' natural allies. The Union Party government treats the region as its own backyard.\n\nWe have an influence (0-100) in every country of our sphere. Investment, party funding, intelligence operations and military aid raise it and push down the other powers'. Without a treaty it falls every month; if their ruling party is the same as ours it rises on its own up to 50.\n35: a treaty of friendship and commerce. 60 (and no other power above 40): invite them into our bloc. 80: offer a protectorate. A country that has refused us and is in no bloc can be sent an ultimatum. A protectorate can be absorbed in three steps.\n\nOur influence (other powers):\n[CUB.GetName]: §Y[?CUB.krcw_inf_WCA|0]§! ([USA.GetName] [?CUB.krcw_inf_USA|0])\n[BAD.GetName]: §Y[?BAD.krcw_inf_WCA|0]§! ([ENG.GetName] [?BAD.krcw_inf_ENG|0])\n[VEN.GetName]: §Y[?VEN.krcw_inf_WCA|0]§!\n[COL.GetName]: §Y[?COL.krcw_inf_WCA|0]§!\n[NIC.GetName]: §Y[?NIC.krcw_inf_WCA|0]§! ([USA.GetName] [?NIC.krcw_inf_USA|0])\n[HAI.GetName]: §Y[?HAI.krcw_inf_WCA|0]§! ([USA.GetName] [?HAI.krcw_inf_USA|0])\n[DOM.GetName]: §Y[?DOM.krcw_inf_WCA|0]§! ([USA.GetName] [?DOM.krcw_inf_USA|0])"
 krcw_sph_tt_p8:0 "Our influence there: §G+8§!"
 krcw_sph_tt_r3:0 "The other powers' influence there: §R-3§!"
 krcw_sph_CHI_invest:0 "Send a Construction Mission: [From.GetName]"
 krcw_sph_CHI_invest_desc:0 "Nanjing sends engineers, accountants and cooperative organisers to help [From.GetNameDef] build roads, plants and cooperatives. China pays the mission's salaries.\n\nOur influence there: §Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_tt_p6:0 "Our influence there: §G+6§!"
 krcw_sph_CHI_fund:0 "Fund the Local Progressive Parties: [From.GetName]"
 krcw_sph_CHI_fund_desc:0 "The Kuomintang's overseas department sends money, presses and training places to the unions and progressive parties of [From.GetNameDef] through the overseas Chinese chambers of commerce.\n\nOur influence there: §Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_tt_p4:0 "Our influence there: §G+4§!"
 krcw_sph_tt_r6:0 "The other powers' influence there: §R-6§!"
 krcw_sph_CHI_counter:0 "Mobilise the Overseas Chinese Associations: [From.GetName]"
 krcw_sph_CHI_counter_desc:0 "The overseas Chinese associations boycott the other powers' firms, expose their agents in the press and speak for Nanjing in parliament.\n\nOur influence there: §Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_arms:0 "Ship Surplus Rifles: [From.GetName]"
 krcw_sph_CHI_arms_desc:0 "The unification wars left a great many rifles. The Ministry of Military Administration sends some to the army of [From.GetNameDef], with instructors.\n\nOur influence there: §Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_RAJ_invest:0 "Princely Capital Loans: [From.GetName]"
 krcw_sph_RAJ_invest_desc:0 "The banks of Hyderabad and Gwalior lend [From.GetNameDef] money for railways and dams below market rates, on condition that Indian contractors build them.\n\nOur influence there: §Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_RAJ_fund:0 "Fund the Court and the Traditionalists: [From.GetName]"
 krcw_sph_RAJ_fund_desc:0 "Delhi sends pensions and gifts to the court, the nobility and the religious leaders of [From.GetNameDef], and backs them against the republicans and the unions.\n\nOur influence there: §Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_RAJ_counter:0 "An Intelligence Bureau Operation: [From.GetName]"
 krcw_sph_RAJ_counter_desc:0 "The Federal Intelligence Bureau buys officials in [From.GetNameDef], uncovers the other powers' agents and hands them to the local police.\n\nOur influence there: §Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_RAJ_arms:0 "Send Rajput Instructors: [From.GetName]"
 krcw_sph_RAJ_arms_desc:0 "The Federal Army sends Rajput and Gurkha officers to train the army of [From.GetNameDef], with a shipment of arms.\n\nOur influence there: §Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_SOV_invest:0 "Send a Trade Delegation: [From.GetName]"
 krcw_sph_SOV_invest_desc:0 "A Russian trade delegation brings machinery, grain and cheap credit to [From.GetNameDef] in exchange for long-term contracts for oil and raw materials.\n\nOur influence there: §Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_SOV_fund:0 "Fund the Nationalist Parties: [From.GetName]"
 krcw_sph_SOV_fund_desc:0 "The Foreign Ministry sends money to the nationalist parties of [From.GetNameDef] through the Orthodox Church and the émigré associations.\n\nOur influence there: §Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_SOV_counter:0 "A Third Section Operation: [From.GetName]"
 krcw_sph_SOV_counter_desc:0 "The Third Section buys police officers and journalists in [From.GetNameDef] and exposes the other powers' agents.\n\nOur influence there: §Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_SOV_arms:0 "Send Military Advisers and Arms: [From.GetName]"
 krcw_sph_SOV_arms_desc:0 "The General Staff sends an advisory group to [From.GetNameDef] with rifles, guns and training manuals.\n\nOur influence there: §Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_FRA_invest:0 "Send an Industrial Federation Mission: [From.GetName]"
 krcw_sph_FRA_invest_desc:0 "The Commune's industrial federations send technicians and machinery to [From.GetNameDef] to help the local workers set up plants they run themselves.\n\nOur influence there: §Y[?From.krcw_inf_FRA|0]§!/100"
 krcw_sph_FRA_fund:0 "Fund the Syndicalist Organisations: [From.GetName]"
 krcw_sph_FRA_fund_desc:0 "The CGT sends money, newspapers and training places to the unions and syndicalist organisations of [From.GetNameDef].\n\nOur influence there: §Y[?From.krcw_inf_FRA|0]§!/100"
 krcw_sph_FRA_counter:0 "A Union Boycott: [From.GetName]"
 krcw_sph_FRA_counter_desc:0 "The Internationale's dock and railway unions refuse to handle the other powers' cargo for [From.GetNameDef].\n\nOur influence there: §Y[?From.krcw_inf_FRA|0]§!/100"
 krcw_sph_FRA_arms:0 "Arm the Workers' Militias: [From.GetName]"
 krcw_sph_FRA_arms_desc:0 "The Commune sends arms to the workers' militias of [From.GetNameDef], with International Brigade veterans to train them.\n\nOur influence there: §Y[?From.krcw_inf_FRA|0]§!/100"
 krcw_sph_ENG_invest:0 "Send a Cooperative Union Mission: [From.GetName]"
 krcw_sph_ENG_invest_desc:0 "The British Cooperative Wholesale Society lends money and equipment to the cooperatives of [From.GetNameDef] and buys their produce.\n\nOur influence there: §Y[?From.krcw_inf_ENG|0]§!/100"
 krcw_sph_ENG_fund:0 "Fund the Labour Parties and Unions: [From.GetName]"
 krcw_sph_ENG_fund_desc:0 "The Trades Congress sends money and organisers to the labour parties and unions of [From.GetNameDef].\n\nOur influence there: §Y[?From.krcw_inf_ENG|0]§!/100"
 krcw_sph_ENG_counter:0 "A Seamen's Union Action: [From.GetName]"
 krcw_sph_ENG_counter_desc:0 "The British seamen's union strikes in the ports of [From.GetNameDef] and refuses to work the other powers' ships.\n\nOur influence there: §Y[?From.krcw_inf_ENG|0]§!/100"
 krcw_sph_ENG_arms:0 "A Fleet Visit: [From.GetName]"
 krcw_sph_ENG_arms_desc:0 "A squadron visits [From.GetNameDef] and leaves behind a shipment of arms and a training team.\n\nOur influence there: §Y[?From.krcw_inf_ENG|0]§!/100"
 krcw_sph_USA_invest:0 "Oil and Cotton Consortium Investment: [From.GetName]"
 krcw_sph_USA_invest_desc:0 "The New Orleans oil and cotton consortium invests in the ports and plantations of [From.GetNameDef], on condition that American firms come first.\n\nOur influence there: §Y[?From.krcw_inf_USA|0]§!/100"
 krcw_sph_USA_fund:0 "Fund the Conservative Parties: [From.GetName]"
 krcw_sph_USA_fund_desc:0 "The Union Party sends money to the conservatives and the army of [From.GetNameDef] through the chambers of commerce.\n\nOur influence there: §Y[?From.krcw_inf_USA|0]§!/100"
 krcw_sph_USA_counter:0 "A Federal Bureau Operation: [From.GetName]"
 krcw_sph_USA_counter_desc:0 "The Federal Bureau buys police officers in [From.GetNameDef] and uncovers the other powers' agents.\n\nOur influence there: §Y[?From.krcw_inf_USA|0]§!/100"
 krcw_sph_USA_arms:0 "Send Marine Instructors: [From.GetName]"
 krcw_sph_USA_arms_desc:0 "The Marine Corps sends instructors to train the national guard of [From.GetNameDef], with a shipment of arms.\n\nOur influence there: §Y[?From.krcw_inf_USA|0]§!/100"
 krcw_sph_JAP_invest:0 "Zaibatsu Loans: [From.GetName]"
 krcw_sph_JAP_invest_desc:0 "Mitsui and Mitsubishi lend [From.GetNameDef] money for ports and mines, on condition that the output is sold to Japan.\n\nOur influence there: §Y[?From.krcw_inf_JAP|0]§!/100"
 krcw_sph_JAP_fund:0 "Fund the Nationalist Parties: [From.GetName]"
 krcw_sph_JAP_fund_desc:0 "The Foreign Ministry sends money to the nationalist parties of [From.GetNameDef] through the Japanese residents' associations.\n\nOur influence there: §Y[?From.krcw_inf_JAP|0]§!/100"
 krcw_sph_JAP_counter:0 "A Kempeitai Operation: [From.GetName]"
 krcw_sph_JAP_counter_desc:0 "The Kempeitai buys officials in [From.GetNameDef] and uncovers the other powers' agents.\n\nOur influence there: §Y[?From.krcw_inf_JAP|0]§!/100"
 krcw_sph_JAP_arms:0 "Send Instructors from the Taiwan Army: [From.GetName]"
 krcw_sph_JAP_arms_desc:0 "The Taiwan Army sends instructors to train the army of [From.GetNameDef], with a shipment of arms.\n\nOur influence there: §Y[?From.krcw_inf_JAP|0]§!/100"
 krcw_sph_PSA_invest:0 "San Francisco Bank Credit: [From.GetName]"
 krcw_sph_PSA_invest_desc:0 "The San Francisco banks give [From.GetNameDef] credit for ports and power stations.\n\nOur influence there: §Y[?From.krcw_inf_PSA|0]§!/100"
 krcw_sph_PSA_fund:0 "Fund the Constitutional Parties: [From.GetName]"
 krcw_sph_PSA_fund_desc:0 "Sacramento sends money to the constitutional parties of [From.GetNameDef].\n\nOur influence there: §Y[?From.krcw_inf_PSA|0]§!/100"
 krcw_sph_PSA_counter:0 "A Naval Intelligence Operation: [From.GetName]"
 krcw_sph_PSA_counter_desc:0 "The Pacific Fleet's intelligence office uncovers the other powers' agents in [From.GetNameDef].\n\nOur influence there: §Y[?From.krcw_inf_PSA|0]§!/100"
 krcw_sph_PSA_arms:0 "A Pacific Fleet Visit: [From.GetName]"
 krcw_sph_PSA_arms_desc:0 "The Pacific Fleet visits [From.GetNameDef] and leaves behind a shipment of arms and a training team.\n\nOur influence there: §Y[?From.krcw_inf_PSA|0]§!/100"
 krcw_sph_ITA_invest:0 "Cooperative Bank Loans: [From.GetName]"
 krcw_sph_ITA_invest_desc:0 "The cooperative banks of Bologna lend [From.GetNameDef] money for ports and irrigation, on condition that Italian cooperatives build them.\n\nOur influence there: §Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_ITA_fund:0 "Fund the Local Unions: [From.GetName]"
 krcw_sph_ITA_fund_desc:0 "The Italian General Confederation of Labour sends money and training places to the unions and left-wing parties of [From.GetNameDef].\n\nOur influence there: §Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_ITA_counter:0 "A Security Service Operation: [From.GetName]"
 krcw_sph_ITA_counter_desc:0 "The Italian security service uncovers the other powers' agents in [From.GetNameDef] and hands the list to the local unions.\n\nOur influence there: §Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_ITA_arms:0 "Send a Military Aid Mission: [From.GetName]"
 krcw_sph_ITA_arms_desc:0 "The Italian army sends instructors to train the army of [From.GetNameDef], with a shipment of rifles.\n\nOur influence there: §Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_WGR_invest:0 "Ruhr Equipment Credit: [From.GetName]"
 krcw_sph_WGR_invest_desc:0 "The Ruhr works supply [From.GetNameDef] with machine tools and generating plant on credit, installed by German technicians.\n\nOur influence there: §Y[?From.krcw_inf_WGR|0]§!/100"
 krcw_sph_WGR_fund:0 "Fund the Local Workers' Parties: [From.GetName]"
 krcw_sph_WGR_fund_desc:0 "The German trade union federation sends money, presses and training places to the unions and workers' parties of [From.GetNameDef].\n\nOur influence there: §Y[?From.krcw_inf_WGR|0]§!/100"
 krcw_sph_WGR_counter:0 "A Security Service Operation: [From.GetName]"
 krcw_sph_WGR_counter_desc:0 "The German security service uncovers the other powers' agents in [From.GetNameDef] and hands the list to the local unions.\n\nOur influence there: §Y[?From.krcw_inf_WGR|0]§!/100"
 krcw_sph_WGR_arms:0 "Send a Military Aid Mission: [From.GetName]"
 krcw_sph_WGR_arms_desc:0 "The German army sends instructors to train the army of [From.GetNameDef], with a shipment of rifles.\n\nOur influence there: §Y[?From.krcw_inf_WGR|0]§!/100"
 krcw_sph_WCA_invest:0 "Syndicate Construction Credit: [From.GetName]"
 krcw_sph_WCA_invest_desc:0 "The Chicago syndicate federation lends [From.GetNameDef] money for ports and railways, built by local cooperatives.\n\nOur influence there: §Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_fund:0 "Fund the Local Unions: [From.GetName]"
 krcw_sph_WCA_fund_desc:0 "The Industrial Workers of the World send money to the dockers', sugar workers' and plantation workers' unions of [From.GetNameDef].\n\nOur influence there: §Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_counter:0 "A Security Service Operation: [From.GetName]"
 krcw_sph_WCA_counter_desc:0 "The Syndicates' security service uncovers the Union Party's agents in [From.GetNameDef] and hands the list to the local unions.\n\nOur influence there: §Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_arms:0 "Send a Syndicate Aid Mission: [From.GetName]"
 krcw_sph_WCA_arms_desc:0 "The Syndicalist army sends instructors to train the militia of [From.GetNameDef], with a shipment of rifles.\n\nOur influence there: §Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_CHI_treaty:0 "Sign a Treaty of Friendship and Commerce: [From.GetName]"
 krcw_sph_CHI_treaty_desc:0 "At 35 influence we can propose a treaty of friendship and commerce: most-favoured-nation treatment both ways and no military obligation. With a treaty our influence there stops falling. They may refuse.\n\nOur influence there: §Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_align:0 "Invite Them into Our Bloc: [From.GetName]"
 krcw_sph_CHI_align_desc:0 "At 60 influence, with no other power above 40, we can invite them into our bloc. If they are in another bloc they must leave it first. Other powers with influence there hear of it first. If they refuse we cannot ask again for a year, but an ultimatum becomes possible.\n\nOur influence there: §Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_protect:0 "Offer a Protectorate: [From.GetName]"
 krcw_sph_CHI_protect_desc:0 "At 80 influence, with a treaty or a shared bloc and no other power above 30, we can offer them a protectorate: we take over foreign affairs and defence and their government stays. They may refuse.\n\nOur influence there: §Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_ultimatum:0 "Send an Ultimatum: [From.GetName]"
 krcw_sph_CHI_ultimatum_desc:0 "If they have refused our treaty or our offer, or gone over to another power, and are in no bloc, we can demand that they become our protectorate or face war. It needs at least 30 influence there and an army at least twice theirs. Only one such ultimatum can be sent in the world each year, and the other powers there may arm them or guarantee them.\n\nOur influence there: §Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_int1:0 "Form a Customs Union: [From.GetName]"
 krcw_sph_CHI_int1_desc:0 "Abolish the tariffs between us, and unify the currency and the railway rates. Their autonomy will fall."
 krcw_sph_CHI_int2:0 "Merge the Army Commands: [From.GetName]"
 krcw_sph_CHI_int2_desc:0 "Nine months after the customs union, place their army in our chain of command."
 krcw_sph_CHI_int3:0 "Join the Republic of China: [From.GetName]"
 krcw_sph_CHI_int3_desc:0 "Nine months after the joint command, ask their government to agree to join us. Their land becomes our core territory. Their government may resist."
