# krcw: years paced
 KRCW_GOV_SOV:0 "Dictatorship of the Supreme Ruler"
 KRCW_GOV_SOV_DESC:0 "The military dictatorship founded after the civil war. The Supreme Ruler holds executive power and supreme command; the State Duma only advises, and the provinces are run by governors-general."
 KRCW_GOV_DDR:0 "Presidential Cabinet"
 KRCW_GOV_DDR_DESC:0 "The President appoints the cabinet under emergency decree and parliament cannot remove it. Real power lies with the presidential office and the general staff."
 KRCW_GOV_USA:0 "Union Party Presidency"
 KRCW_GOV_USA_DESC:0 "The federal constitution still stands, but the Union Party runs the elections and the President names the governors. The states keep far less power than the text says."
 KRCW_GOV_CHI:0 "Kuomintang Tutelage"
 KRCW_GOV_CHI_DESC:0 "Following Sun Yat-sen's outline for national reconstruction, the Kuomintang exercises sovereignty on the people's behalf until constitutional rule is possible. The Central Executive Committee is the highest organ of power."
 KRCW_GOV_FRA:0 "Federation of Communes"
 KRCW_GOV_FRA_DESC:0 "Power is delegated upward: the communes elect departmental councils, which elect the national congress together with the union federations."
 KRCW_GOV_SYND:0 "Syndicalist Republic"
 KRCW_GOV_SYND_DESC:0 "The state is governed by the union federations and workers' councils, with delegates chosen by trade and district, and the factories run by their workers."
 KRCW_GOV_AUTH:0 "Authoritarian Government"
 KRCW_GOV_AUTH_DESC:0 "The government is not elected. The army, the crown or a ruling clique holds power; any parliament has no real authority."
