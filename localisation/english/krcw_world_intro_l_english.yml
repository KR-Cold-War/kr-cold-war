 krcw_wintro_1_t:0 "1919-1936: The German Peace"
 krcw_wintro_1_d:0 "In 1919 the German offensive in the west finally succeeded. France was forced into an armistice and Britain accepted peace soon after. The German Empire became the master of Europe. In the east, the Treaty of Brest-Litovsk had already taken Poland, the Baltic, Ukraine and White Ruthenia from Russia, and these lands became German client states inside Mitteleuropa, the bloc Berlin led.\n\nRevolution followed in the defeated countries. In November 1919 the CGT called a general strike in France; the old government and the officer corps withdrew to Algiers, and the unions who stayed built the Commune of France. In 1921 the Commune founded the Third Internationale in Paris. Italy fell into civil war in 1919 and the peninsula broke apart. In 1924 a British general strike became a civil war; at the end of 1925 the Royal Family fled to Canada and the Union of Britain was proclaimed.\n\nAfter Berlin's \"Black Thursday\" crash of 1925 the German-centred financial order fell apart and the world sank into a long depression. Russia's civil war ended with a White victory, and the Russian Republic sank under the humiliation of the Brest system; in 1934 the old Socialist Revolutionary Boris Savinkov's movement won the Duma elections; he became President and, with \"national populism\" and emergency decrees, made the Republic his own.\n\nChina's Northern Expedition failed in 1926, the Qing were restored with German backing the next year, and the remnants of the Kuomintang withdrew into the hills of Fujian and Jiangxi. America endured ten years of depression; after the 1936 election the Army Chief of Staff, MacArthur, took Washington with his troops, the syndicalists of the North and Huey Long in the South stopped obeying Washington, the West Coast states set up a constitutional government in Sacramento, and the Second American Civil War began."
 krcw_wintro_2_t:0 "1937-1944: The Second Weltkrieg"
 krcw_wintro_2_d:0 "In 1937 the Third Internationale went to war with the German Empire. The Commune of France, the Union of Britain and the Italian Socialist Republic attacked from the west and south, while Savinkov's Russia attacked the Empire and Mitteleuropa from the east at the same time. There was no treaty between the two, only the same enemy.\n\nThe war lasted seven years. In 1943 the Rhine line broke; the armies of the Internationale took the Rhineland, the Ruhr, Hamburg and Bavaria, and Ernst Thälmann, freed from prison, proclaimed the German Socialist Republic in the west. Italian troops crossed the Alps and the peninsula was united under the red flag for the first time; the Commune crossed the Mediterranean and \"National France\" in Algiers fell. In the east the Russians broke Mitteleuropa and drove into East Prussia. Ukraine, White Ruthenia, Lithuania and the Baltic Duchy, all taken from Russia at Brest-Litovsk, were joined to Russia again; Finland was annexed too, and Vienna and eastern Austria were occupied.\n\nIn the spring of 1944 the Empire collapsed. Kaiser Wilhelm III fled to Dar es Salaam in Mittelafrika; when the colonial army there fell apart that autumn he went into exile in Stockholm. General Schleicher surrendered what was left of the Reichsheer to the Russians, signed the Treaty of Berlin and founded the German National Republic east of the Elbe, dependent on Moscow. Berlin was cut in two, with West Berlin going to the Socialist Republic. The eastern states of Mitteleuropa passed to military governments allied with Moscow.\n\nThe European war ended in a ceasefire on the Elbe, with no peace treaty. The two victorious armies face each other across the wire, and the line has not moved in five years."
 krcw_wintro_3_t:0 "The Other Wars: America and Asia"
 krcw_wintro_3_d:0 "America's civil war became a three-sided fight. In 1938 the Entente government in exile in Ottawa sent troops south into New England to restore the old order, and syndicalist militia crushed them at Albany and Buffalo. In 1940 Canada's workers rose and the King fled a second time, to Melbourne. In 1941 MacArthur's putsch government in Washington collapsed, and its remnants withdrew to the West Coast and went over to the constitutional government in Sacramento. By the winter of 1943 syndicalist armoured cars were outside Memphis; then Russian rifles and trucks reached Long through Tampico in Mexico, and his armies pushed the syndicalists back east of the river. The St. Louis ceasefire of 1946 left the two sides facing each other across the Mississippi. Both constitutions claim all of America, and the American Constitutional Coalition on the West Coast recognises neither.\n\nIn China, Wang Jingwei came home from Paris in 1936 and rebuilt the Kuomintang. The Second Northern Expedition set out from Longyan and took Beijing in 1940, and the Qing came to an end. The Fengtian clique beyond the Great Wall would not bow to Nanjing, and Japan sent troops to back it. In the Liaoxi campaign of 1943 the National Revolutionary Army destroyed the main body of the Kwantung Army. The Qingdao armistice of 1944 took Manchuria and Korea out of Japanese hands, and Korea became a republic under Chinese sponsorship; Taiwan stayed Japanese. From 1946 to 1948 Chinese volunteers helped the Vietnamese revolution, and China sponsored \"brother republics\" in Cambodia, Laos and Burma. In 1946 Zhou Enlai became Chairman of the National Government, and the next year the Republic of China joined the Third Internationale.\n\nIn India, the Princely Federation went to war for unification with Russian arms, destroyed the Bharatiya People's Republic in Calcutta in 1947, united the subcontinent and then joined the Moscow Accord."
 krcw_wintro_4_t:0 "1949: Two Blocs"
 krcw_wintro_4_d:0 "The Third Internationale is centred on Paris: the Union of Britain, Italy, the German Socialist Republic, the Combined Syndicates of America, Canada, the Republic of China and its brother republics, and the workers' states of the Low Countries, Denmark, Norway, Iberia and Ireland. It leads in industry and population but is spread over three continents, and China and the Syndicates both have a great deal to fix at home.\n\nThe Moscow Accord is centred on Russia: Long's America, Mexico, the Indian Federation, the military governments of Eastern Europe and the Balkans, and the dependent German National Republic, Mongolia, Persia and Afghanistan. It has less industry than its rival but a more concentrated army.\n\nOther powers stand between them. The House of Windsor and the Entente government in exile sit in Australia and, with New Zealand, form the ANZAC Entente, still calling itself the only lawful government of Britain. Japan lost the war but kept Taiwan; it belongs to neither bloc and draws ever closer to Russia. The American Constitutional Coalition on the West Coast, governed from Sacramento and calling itself the lawful government of the United States, holds the Pacific Fleet, and both blocs are courting them. Sweden, Switzerland and most of Latin America stay neutral.\n\nThe blocs touch in many places: the ceasefire line on the Mississippi, the air corridors to West Berlin, the mountains of Greece, the monasteries of Tibet, the Taiwan Strait. The Third Internationale and the Moscow Accord fought the same war and never made an alliance. Now neither is ready for another world war, and neither believes the other will fall apart first."
