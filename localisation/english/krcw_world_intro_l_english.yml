 krcw_wi_title:0 "Red Banner and Black Eagle"
 krcw_wi_date:0 "May 1949"
 krcw_wi_body:0 "In the spring of 1944 the German Empire collapsed. The war in Europe ended in a ceasefire on the Elbe, with no peace treaty. Five years on, the world is divided into two hostile blocs.\n\nOn the map, reds and pinks are the Third Internationale of Paris, black and greys the Moscow Accord led by Savinkov's Russia; the yellow line is where the two blocs meet on land. Blue is the Entente in exile in Australia and the American Constitutional Coalition on the West Coast, purple is Japan, light brown the neutrals. Members of both blocs have the same colours on the game map.\n\nThe world background has four pages. Read it now, or start playing."
