 krcw_fra_head_of_internationale:0 "Head of the Internationale"
 krcw_fra_head_of_internationale_desc:0 "Paris is the capital of the world revolution. The Internationale secretariat, the Paris Clearing Union and the transnational industrial federations are all seated here."
 krcw_ti_bureaucratization:0 "Revolutionary Bureaucratization"
 krcw_ti_bureaucratization_desc:0 "Thirty years after the revolution the federation offices keep growing while the voice of the shop floor grows faint."
 krcw_eng_red_fleet:0 "The Red Fleet"
 krcw_eng_red_fleet_desc:0 "The Royal Navy raised the red flag in 1925. The Union of Britain inherited the finest dockyards and the proudest sailors in the world."
 krcw_wgr_front_state:0 "Frontline State"
 krcw_wgr_front_state_desc:0 "Across the Elbe lie Schleicher's "National Republic" and Russian tanks. West Berlin is an island ringed by barbed wire."
 krcw_ohio_line:0 "The Ohio Line"
 krcw_ohio_line_desc:0 "The 1946 St. Louis Armistice split America in two. Along the Appalachians, the Ohio and the Mississippi, two armies glare at each other across sandbags; the shooting never truly stopped."
 krcw_wca_civil_war_weariness:0 "Civil War Weariness"
 krcw_wca_civil_war_weariness_desc:0 "A decade of civil war has scarred the industrial belt. The workers want to rebuild, not fight another war - not yet."
 krcw_wca_syndicates:0 "The Combined Syndicates"
 krcw_wca_syndicates_desc:0 "The plants of Detroit, Pittsburgh and Chicago are run by workers' councils - the mightiest industrial heart on the continent."
 krcw_can_arsenal:0 "Arsenal of the North"
 krcw_can_arsenal_desc:0 "The Syndicalist Republic of Canada is the rear corridor through which the Internationale supplies the American syndicates."
 krcw_chi_revolution_unfinished:0 "The Unfinished Revolution"
 krcw_chi_revolution_unfinished_desc:0 "The National Revolution took thirteen years to march from Longyan to Beijing. Turning a semi-feudal continent into a modern republic will take far longer."
 krcw_chi_land_question:0 "The Land Question"
 krcw_chi_land_question_desc:0 ""Land to the tiller" is written in the party programme, yet the countryside remains in the hands of landlords and clans."
 krcw_chi_warlord_remnants:0 "Warlord Remnants"
 krcw_chi_warlord_remnants_desc:0 "The local strongmen who submitted during the Expedition keep their private armies and tax bases."
 krcw_chi_nra_veterans:0 "Veterans of a Hundred Battles"
 krcw_chi_nra_veterans_desc:0 "The National Revolutionary Army defeated the Qing, the Fengtian clique and the Kwantung Army."
 krcw_kor_brother_republic:0 "Brother Republic"
 krcw_kor_brother_republic_desc:0 "The Korean Volunteer Corps fought alongside the NRA from North China to Liaoxi. Many leaders of the Korean Republic are Whampoa graduates."
 krcw_vin_own_revolution:0 "Our Own Revolution"
 krcw_vin_own_revolution_desc:0 "Vietnam's revolution belongs to the Vietnamese. Chinese volunteers helped, but Hanoi never lets Nanjing forget whose revolution it was."
 krcw_liberated_republic:0 "Newborn Republic"
 krcw_liberated_republic_desc:0 "The old dynasties and colonial remnants collapsed before the Chinese volunteers. The new government depends on foreign aid."
 krcw_sov_iron_fist:0 "Savinkov's Iron Fist"
 krcw_sov_iron_fist_desc:0 "Former terrorist, former SR, now Supreme Ruler. Savinkov dragged Russia out of the humiliation of Brest with iron and fire."
 krcw_sov_okhrana:0 "State Security Directorate"
 krcw_sov_okhrana_desc:0 "State security agents are everywhere, from Petrograd factories to Baltic fishing villages."
 krcw_usa_longs_machine:0 "The Long Machine"
 krcw_usa_longs_machine_desc:0 "The political machine perfected in Louisiana now runs half of America. Huey Long's word is law - as long as he lives."
 krcw_usa_share_our_wealth:0 "Share Our Wealth"
 krcw_usa_share_our_wealth_desc:0 ""Every Man a King." Long's redistribution wins him the loyalty of the rural South while straining federal finances."
 krcw_mex_russian_corridor:0 "The Russian Corridor"
 krcw_mex_russian_corridor_desc:0 "Russian arms land at Veracruz and travel north by rail to Long's America."
 krcw_raj_princely_fragmentation:0 "Princely Fragmentation"
 krcw_raj_princely_fragmentation_desc:0 "Over five hundred states each with their own courts, tax collectors and retainers. United on paper, India remains a patchwork."
 krcw_raj_caste_order:0 "The Caste Order"
 krcw_raj_caste_order_desc:0 "The Princely Federation rests on "tradition". Caste and land tenure are held sacred."
 krcw_raj_famine:0 "Shadow of Famine"
 krcw_raj_famine_desc:0 "The war of unification wrecked Bengal's granaries. Whenever the monsoon fails, famine sweeps the Gangetic plain."
 krcw_raj_russian_advisors:0 "Russian Military Mission"
 krcw_raj_russian_advisors_desc:0 "Russian officers train the princely armies in exchange for Indian loyalty to Moscow."
 krcw_ddr_treaty_of_berlin:0 "Treaty of Berlin"
 krcw_ddr_treaty_of_berlin_desc:0 "In 1944 the Kaiser fled to Dar es Salaam in Mittelafrika and General von Schleicher surrendered what was left of the Reichswehr to the Russians, buying a German state east of the Elbe. It kept the black-white-red flag but handed the keys to Moscow."
 krcw_mon_white_baron:0 "Legacy of the White Baron"
 krcw_mon_white_baron_desc:0 "Baron Ungern's mystical empire was overthrown by his own officers after the war. A new Regency Council rules in the Bogd Khan's name, kept in order by Russian rifles."
 krcw_jap_revanchism:0 "Revanchism"
 krcw_jap_revanchism_desc:0 "Having lost Korea and Manchuria, the Empire blames Nanjing and Paris. Taiwan is its last overseas possession."
 krcw_entente_in_exile:0 "The Entente in Exile"
 krcw_entente_in_exile_desc:0 "Twice exiled - London, Ottawa, now Canberra. The Entente hates the Internationale yet despises Savinkov and Long."
 krcw_tib_lhasa_agreement:0 "Lhasa Agreement"
 krcw_tib_lhasa_agreement_desc:0 "In 1947 the Kashag signed the Lhasa Agreement: Tibet recognises the Republic, Nanjing promises not to alter the existing system."
 krcw_spr_iberian_federation:0 "Iberian Federation"
 krcw_spr_iberian_federation_desc:0 "The revolution of 1936 bound the syndicates and communes of Spain and Portugal into one federation. Madrid has no president, only a federal council and the free municipalities."
 krcw_russian_protectorate:0 "Russian Protectorate"
 krcw_russian_protectorate_desc:0 "Russian advisors sit in the capital and Russian roubles pay the army. Independence survives in name."
 krcw_cze_bohemian_bastion:0 "Bohemian Bastion"
 krcw_cze_bohemian_bastion_desc:0 "General Syrovy's directorate, wedged between red Germany and Moscow, chose Russian protection - at the price of silencing the left at home."
 krcw_straits_guard:0 "Guardians of the Straits"
 krcw_straits_guard_desc:0 "Turkey's generals hold the keys to the Black Sea. As long as Russian fleets pass freely, Moscow is generous to Ankara."
 krcw_psa_proconsul:0 "The War Powers Act"
 krcw_psa_proconsul_desc:0 "In 1942 Congress passed the War Powers Act, placing San Francisco, Oakland, Los Angeles, Seattle and the Sierra passes under military districts run by MacArthur's Western Defense Command. Congress must renew it every year and has never once voted it down. President Warren promised in his campaign to repeal it; the Presidio men say the ports cannot be held without the districts."
 krcw_psa_pacific_fleet:0 "The Pacific Fleet"
 krcw_psa_pacific_fleet_desc:0 "In 1936 the Pacific Fleet followed the governors of the West Coast states and refused to recognise the putsch government in Washington. It now lies in the yards of San Diego, San Francisco and Puget Sound, the best surviving part of the old United States Navy, and under Admiral Nimitz it guards the sea lanes from the Aleutians to San Diego."
 krcw_psa_third_america:0 "The Third America"
 krcw_psa_third_america_desc:0 "New Orleans calls Sacramento traitors; New York calls it reactionary. The Congress in Sacramento holds that the United States has one constitutional government, in Sacramento, and that the other two are usurpers."
 krcw_yug_balkan_bayonets:0 "Balkan Bayonets"
 krcw_yug_balkan_bayonets_desc:0 "Belgrade's generals rule a multinational kingdom in the King's name. Russian loans keep the army paid - and the fragile silence between Croats and Serbs."
