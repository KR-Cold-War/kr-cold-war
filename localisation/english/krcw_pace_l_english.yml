l_english:
# krcw: years paced
 krcw_pace.1.t:0 "Shots across the Ohio"
 krcw_pace.1.d:0 "Another incident on the Mississippi line: launches crossed the midstream line at night and the posts on both banks traded fire for an hour. No one declared war, but the armistice is tighter by a notch."
 krcw_pace.2.t:0 "Friction in the Berlin Corridor"
 krcw_pace.2.d:0 "The East German checkpoints have held up another freight train to West Berlin for \"incomplete papers\". West Berlin's coal stock is down another day."
 krcw_pace.4.t:0 "Gunboats in the Strait"
 krcw_pace.4.d:0 "The Fujian squadron and Japanese patrol boats out of Taiwan met near the median line of the strait and played searchlights on each other half the night. The Qingdao Commission has two more protests on file."
 krcw_pace.3.t:0 "Patrols in the Himalaya"
 krcw_pace.3.d:0 "Indian and Chinese patrols met on a ridge no one has ever surveyed and stood off for half a day before pulling back. The nobles of Lhasa are listening to the wind."
 krcw_pace.1.a:0 "The armistice is a notch tighter."
 krcw_pace.2.a:0 "The armistice is a notch tighter."
 krcw_pace.3.a:0 "The armistice is a notch tighter."
 krcw_pace.4.a:0 "The armistice is a notch tighter."
