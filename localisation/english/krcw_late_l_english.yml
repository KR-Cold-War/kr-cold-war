l_english:
# krcw: years paced
 krcw_late.1.t:0 "The Second Commune Movement"
 krcw_late.1.d:0 "In May 1954 the barricades returned to the streets of Paris. Students, young workers and radical communards demanded "workers' control", "direct democracy" and "no to bureaucrats". The old men of the First Commune did not know whether to feel proud or afraid."
 krcw_late.1.a:0 "Bureaucratisation is a problem"
 krcw_late.1.b:0 "Order comes first"
 krcw_late.1.c:0 "Let them try"
 krcw_late.2.t:0 "The Charter of Labour"
 krcw_late.2.d:0 "The congress passed the new Charter of Labour: enterprise committees serve two years and may not run for three terms; regional delegates are chosen by lot; all officials are subject to recall. Reformers say it returns to the spirit of the First Commune; conservatives say it surrenders to chaos."
 krcw_late.2.a:0 "Long live the new charter"
 krcw_late.3.t:0 "The Technocrats' Victory"
 krcw_late.3.d:0 "The Public Security arrested the organisers of the "Second Commune" and the Paris town hall was given a new team — chosen not from the factories but from the École Polytechnique. The First Commune was handed to the planners."
 krcw_late.3.a:0 "This is not the Commune we wanted"
 krcw_late.4.t:0 "The Commune Fractures"
 krcw_late.4.d:0 "The radical wings in Italy, West Germany and Belgium refused to recognise the authority of the Paris congress and declared their withdrawal from the Internationale. They said the First Commune was dead and it was time to build a "genuine Third International"."
 krcw_late.4.a:0 "We have lost them"
 krcw_late.10.t:0 "The Death of Zhou Enlai"
 krcw_late.10.d:0 "On 8 January 1954 Premier Zhou Enlai died in Nanjing. He had led the government for twenty-six years and witnessed China's journey from the ruins of war to industrialisation. The nation mourned, but everyone asked the same question: who will succeed him?"
 krcw_late.10.a:0 "He left a new China"
 krcw_late.11.t:0 "The Nanjing Spring"
 krcw_late.11.d:0 "On 5 April Nanjing's streets were covered with big-character posters: "Democracy, not dictatorship", "The constitution is not an empty paper", "Let the people choose their representatives". Students and workers demanded an end to one-party rule and real elections. The Central Executive Committee was deadlocked."
 krcw_late.11.a:0 "Reform is the only way out"
 krcw_late.11.b:0 "Maintain the status quo"
 krcw_late.12.t:0 "The Multi-Party Constitution"
 krcw_late.12.d:0 "The new constitution of 1954 permitted the formation of parties "within the bounds of the constitution". The first to register were the Social Democrats, the Peasants' Party and the Youth Party. The old men of the Kuomintang said this was what they had wanted twenty-six years ago."
 krcw_late.12.a:0 "A new era begins"
 krcw_late.24.t:0 "The Tsar Returns"
 krcw_late.24.d:0 "In 1954 a Kremlin coup placed Grand Duke Vladimir Kirillovich on the throne. He proclaimed himself Tsar of All Russia, dissolved the State Duma and restored noble titles. Western papers called it "a twentieth-century restoration"."
 krcw_late.24.a:0 "History has turned back"
 krcw_late.33.t:0 "Mushroom Clouds over the Great Lakes"
 krcw_late.33.d:0 "In August 1954 the missile silos in Detroit opened. Twenty minutes later Chicago was engulfed in flames; forty minutes later New York vanished in a flash. The Third World War lasted six hours and a third of human civilisation turned to ash."
 krcw_late.33.a:0 "The end of the world"
 krcw_late.40.t:0 "Democratisation in Tokyo"
 krcw_late.40.d:0 "In 1954 the Emperor issued a rescript renouncing divine authority and recognising parliamentary sovereignty. The first real universal election was held in 1954 and the Social Party won a majority in the House of Representatives."
 krcw_late.40.a:0 "A victory for democracy"
 krcw_late.50.t:0 "The Last Durbar"
 krcw_late.50.d:0 "In the winter of 1955 the last Durbar was held in Delhi. Sindhia announced the dissolution of the Princely Union; the princes' estates were nationalised and titles would no longer be hereditary. Below the steps of the Red Fort one hundred and one elephants paraded for the last time."
 krcw_late.50.a:0 "The old era is over"
 krcw_late.80.t:0 "Rule by the Planning Bureau"
 krcw_late.80.d:0 "In 1955 the Paris congress was postponed indefinitely. The State Planning Bureau announced that "economic construction needs efficiency, not debate". The last lamp of the First Commune went out."
 krcw_late.80.a:0 "This is betrayal"
 krcw_late_romanov_restoration:0 "Romanov Restoration"
 krcw_late_romanov_restoration_desc:0 "The Tsar has returned, but this is not 1814."
 krcw_late_technocratic_turn:0 "The Technocratic Turn"
 krcw_late_technocratic_turn_desc:0 "Efficiency first, democracy second."
 krcw_late_technocratic_dictatorship:0 "Planning Bureau Dictatorship"
 krcw_late_technocratic_dictatorship_desc:0 "The First Commune is dead."
