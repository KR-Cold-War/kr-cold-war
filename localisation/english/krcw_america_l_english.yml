l_english:
# krcw: years paced
 krcw_mississippi_line:0 "The Mississippi Line"
 krcw_mississippi_line_desc:0 "The 1946 St. Louis Armistice split the Union down the middle. From Minnesota to Louisiana two armies glare at each other across the great river: Huey Long's sandbags and searchlights on the west bank, syndicalist trenches and loudspeakers on the east. The ferries stopped long ago; only the shooting at night never quite has."
 krcw_second_civil_war_phase:0 "Second Phase of the Civil War"
 krcw_second_civil_war_phase_desc:0 "The armistice is dead. The Mississippi is a front again, and Americans are once more shooting at Americans. The papers no longer say \"civil war\"; they say \"the second phase\", as though the first one never really ended."
 krcw_usa_machine_corruption:0 "Grease for the Machine"
 krcw_usa_machine_corruption_desc:0 "Every defence contract passes through an unmarked office in the New Orleans capitol. Every new bridge has a \"friend\" taking ten per cent. The Long machine runs smoothly, because it is oiled with money."
 krcw_usa_color_line:0 "Crisis of the Color Line"
 krcw_usa_color_line_desc:0 "Hundreds of thousands of Black veterans fought Long's civil war and came home to find the polling places, public hospitals and even the Share Our Wealth relief windows of Louisiana, Arkansas and Texas still marked \"Whites Only\". Every month thousands slip across the Mississippi to the syndicates on the east bank."
 krcw_usa_long_ailing:0 "The Kingfish Ailing"
 krcw_usa_long_ailing_desc:0 "Huey Long rarely appears in public now. His spokesman says the President merely has \"a cold\", but everyone who enters his New Orleans office smells the medicine. Every faction is calculating what comes \"after\"."
 krcw_usa_succession_chaos:0 "Succession Chaos"
 krcw_usa_succession_chaos_desc:0 "The Kingfish is dead, and his machine has no law of succession. Governors, generals, Long relatives and Moscow's advisors are all reaching for the wheel at once."
 krcw_usa_restless_generals:0 "Restless Generals"
 krcw_usa_restless_generals_desc:0 "The southern and western generals held half of America through the civil war, only to watch the politicians divide the spoils. At staff dinners someone raises a glass \"to an America without lawyers\"."
 krcw_usa_earl_compromise:0 "The Earl's Deal"
 krcw_usa_earl_compromise_desc:0 "Earl Long lacks his brother's magnetism but is a better dealer. He gave the governors their budgets, the generals their dignity and the Black veterans their ballots, and in return he got a country that still works."
 krcw_usa_junta:0 "The Council of Generals"
 krcw_usa_junta_desc:0 "The Constitution has been \"suspended\" and tanks are parked outside the New Orleans capitol. The Council of Generals declares itself \"guardian of American constitutional order\" until \"the eastern rebellion is entirely suppressed\"."
 krcw_usa_civil_rights_act:0 "The Little Rock Compromise"
 krcw_usa_civil_rights_act_desc:0 "Poll taxes and literacy tests are banned in federal elections; the partitions at the Share Our Wealth relief windows are torn down. The old southern senators grind their teeth, but for the first time the Black veterans queue up to vote."
 krcw_usa_hard_segregation:0 "Holding the Color Line"
 krcw_usa_hard_segregation_desc:0 "New Orleans assures the southern senators that nothing will change. The National Guard watches the Mississippi crossings to stop Black families fleeing east. Every person turned back becomes a name read out on the east-bank radio."
 krcw_usa_audited_machine:0 "The Audited Machine"
 krcw_usa_audited_machine_desc:0 "For the first time federal auditors have gone through the machine's books, from New Orleans down to every state party office. The machine remains; it just drips less grease and its gears mesh more truly."
 krcw_usa_russian_mission:0 "Russian Military Mission"
 krcw_usa_russian_mission_desc:0 "Savinkov's officers run courses at Fort Hood and Fort Riley. They bring armored-warfare lessons from the Volga, and a contempt for American \"democratic habits\"."
 krcw_usa_russian_aid:0 "The Veracruz Lifeline"
 krcw_usa_russian_aid_desc:0 "Russian freighters unload machine tools, trucks and entire arsenal fittings at Veracruz, and Mexican railways carry them across the Rio Grande. The west bank has fewer plants than the east, but every one of them runs the newest Russian machinery."
 krcw_usa_texas_oil_boom:0 "The Texas Oil Boom"
 krcw_usa_texas_oil_boom_desc:0 "Derricks rise like forests across East Texas and the Permian Basin. Oil buys Russian loans, Mexican railways and new refineries in Houston."
 krcw_usa_sow_mobilization:0 "Share Our Wealth Mobilization"
 krcw_usa_sow_mobilization_desc:0 "Every family drawing the homestead allowance owes a son to the National Guard. Long calls it \"the exchange of rights and duties\", and the farmers say it is fair."
 krcw_usa_river_fortress:0 "West Bank Fortress Belt"
 krcw_usa_river_fortress_desc:0 "From St. Louis to New Orleans the engineers have poured rows of concrete pillboxes along the bank. Long's posters read: \"The river won't run backwards, and the Reds won't come across.\""
 krcw_usa_frontier_rangers:0 "Frontier Rangers"
 krcw_usa_frontier_rangers_desc:0 "Texas Rangers, Oklahoma cowhands and Rocky Mountain hunters make up Long's toughest troops. They know every valley and need little in the way of supply."
 krcw_wca_syndicate_factionalism:0 "Syndicate Factionalism"
 krcw_wca_syndicate_factionalism_desc:0 "The Detroit auto workers, the Pittsburgh steel federation, the New York dockers and garment unions: each has its own paper, its own militia and its own line. Every vote in the Congress is a small battle."
 krcw_wca_appalachian_front:0 "Rebuilding Appalachia"
 krcw_wca_appalachian_front_desc:0 "The civil war's cruelest fighting raged through Appalachia and the Ohio Valley. The dynamited railways, flooded mines and burnt-out towns will take a decade to restore."
 krcw_wca_eastern_syndicates:0 "The Eastern Syndicates"
 krcw_wca_eastern_syndicates_desc:0 "The plants of Detroit, Pittsburgh, Chicago and New York are run by workers' councils, the mightiest industrial heart on the continent."
 krcw_wca_canadian_arsenal:0 "The Northern Arsenal Accord"
 krcw_wca_canadian_arsenal_desc:0 "The plants on both shores of the Great Lakes have merged their dispatch centers, and Canadian nickel, uranium and timber flow in steadily along the St. Lawrence."
 krcw_wca_clearing_union:0 "Paris Clearing Union Member"
 krcw_wca_clearing_union_desc:0 "Through the Paris Clearing Union, Detroit trucks can be settled directly for Lyon machine tools and Manchester motors. A workers' world market plugs the east bank's factories into the globe."
 krcw_wca_industrial_democracy:0 "Industrial Democracy"
 krcw_wca_industrial_democracy_desc:0 "Reuther's Charter of Industrial Democracy provides that every plant's plan is drawn up jointly by its workers' council and the regional federation; technicians have a voice, but no veto."
 krcw_wca_black_brigades:0 "The Black Brigades"
 krcw_wca_black_brigades_desc:0 "Black veterans who fled the west bank and Black workers of Alabama and Georgia have formed their own brigades at A. Philip Randolph's call. Their banner reads: \"We have crossed the Jordan a second time.\""
 krcw_wca_deep_defense:0 "Defense in Depth"
 krcw_wca_deep_defense_desc:0 "Carlson's staff abandoned the illusion of holding every inch of the bank. The first line is at the river, the second in the hills of Tennessee and Kentucky, the third in the Appalachians; each breach reveals another line behind it."
 krcw_wca_liberation_army:0 "Army of Liberation"
 krcw_wca_liberation_army_desc:0 "\"The workers and sharecroppers of the west bank are waiting for us.\" The plan for a war of liberation has come out of its drawer. Not every syndicate delegate agrees, but the men at the front are already cleaning their bayonets."
 krcw_wca_refugee_workshops:0 "Refugee Workshops"
 krcw_wca_refugee_workshops_desc:0 "Union men who fled the Texas oilfields and the California docks are back at work in Detroit and Cleveland. They brought the West's skills with them, and a bone-deep hatred of Long."
 krcw_wca_atlantic_yards:0 "Atlantic Yards"
 krcw_wca_atlantic_yards_desc:0 "The slipways of Norfolk, Philadelphia and Brooklyn never rest. Rickover tells the worker delegates: \"The east bank has the steel, the yards and the workers. We need a fleet worthy of them.\""
 krcw_wca_federal_syndicalism:0 "Federal Syndicalism"
 krcw_wca_federal_syndicalism_desc:0 "The federations still quarrel, but now there are rules: regional federations hold budgets, and the national Congress keeps only defense, diplomacy and clearing. The factional struggle has moved from the streets back into the hall."
 USA_krcw_earl_long:0 "Earl Long"
 USA_krcw_moseley:0 "George Van Horn Moseley"
 USA_krcw_russell:0 "Richard Russell Jr."
 USA_krcw_dies:0 "Martin Dies Jr."
 WCA_krcw_randolph:0 "A. Philip Randolph"
 WCA_krcw_wallace:0 "Henry A. Wallace"
 WCA_krcw_flynn:0 "Elizabeth Gurley Flynn"
 USA_krcw_earl_long_desc:0 "Huey Long's younger brother and former Governor of Louisiana. Crude, shrewd and a gambler, with a far keener nose for a deal than for ideology. In his brother's lifetime he was always \"the no-account brother\"; now he may be the only man who can hold the Long machine together. Since the civil war Louisiana has been the heart of Long's America and New Orleans its capital, and here Earl swims more easily than anyone."
 USA_krcw_moseley_desc:0 "Retired general and chief of staff in the early civil war, notorious for his fierce anti-communism and racial views. The southern generals push him forward as the symbol of \"order\"."
 krcw_usa_every_man_a_king:0 "Every Man a King"
 krcw_usa_every_man_a_king_desc:0 "In spring 1949 Huey Long is sworn in for the fourth time in New Orleans. The industry of the east is still in syndicalist hands; his America is vast and poor, living on cotton, oil and Russian loans."
 krcw_usa_the_machine_endures:0 "Entrench the Machine"
 krcw_usa_the_machine_endures_desc:0 "From New Orleans to Denver every postmaster, county sheriff and highway contractor owes Long a favor. The machine kept the West alive through the civil war; the question is whether it can survive peace."
 krcw_usa_federal_patronage:0 "Federal Patronage"
 krcw_usa_federal_patronage_desc:0 "Hand out more posts, contracts and subsidies to the loyal. The machine will grow stronger, and hungrier."
 krcw_usa_audit_the_machine:0 "Audit the Machine"
 krcw_usa_audit_the_machine_desc:0 "Long knows the east-bank radio mocks \"the Kingfish's ten per cent\" every day. He sends in the federal auditors. It is other men's books they examine, but they are examined."
 krcw_usa_america_first_congress:0 "The Union Party Convention"
 krcw_usa_america_first_congress_desc:0 "The Union Party convenes in Dallas. On stage, unified slogans; below it, the state bosses haggling."
 krcw_usa_the_1952_campaign:0 "The 1950 Campaign"
 krcw_usa_the_1952_campaign_desc:0 "Long's fifth campaign. Everyone knows the outcome, but the machine must still stage it like a real election, because the east bank is watching, and so is Moscow."
 krcw_usa_the_kingfish_legacy:0 "Arrange Huey Long's Succession"
 krcw_usa_the_kingfish_legacy_desc:0 "Huey Long is gone. He leaves an unfinished edifice: half a country, a machine and a pack of ambitious heirs."
 krcw_usa_earls_bargain:0 "Hold the Mansion Card Game"
 krcw_usa_earls_bargain_desc:0 "Earl Long invites governors, generals and congressional leaders to the New Orleans mansion for an all-night poker game. By dawn everyone has lost a little, and everyone has kept his seat."
 krcw_usa_council_of_generals:0 "The Council of Generals"
 krcw_usa_council_of_generals_desc:0 "The southern generals wait on the politicians no longer. Patton's tanks roll into New Orleans and Moseley proclaims the Constitution \"suspended\". An America without lawyers is born."
 krcw_usa_new_america_first:0 "A New Union Party Platform"
 krcw_usa_new_america_first_desc:0 "Earl's platform no longer speaks of \"reunifying America\" but of \"making the west bank the place the east bank envies\". A quiet turn: from conquest to competition."
 krcw_usa_martial_order:0 "Martial Order"
 krcw_usa_martial_order_desc:0 "Courts-martial replace juries, curfews replace the jazz nights of New Orleans. The generals call it a \"temporary wartime measure\", but the war has never really ended."
 krcw_usa_the_color_line:0 "Answer the Black Veterans' Petition"
 krcw_usa_the_color_line_desc:0 "Hundreds of thousands of Black veterans fought for Long in the civil war and now want the vote. Across the river the Syndicates promise a vote and a job to everyone who crosses."
 krcw_usa_veterans_petition:0 "The Veterans' Petition"
 krcw_usa_veterans_petition_desc:0 "The Negro Veterans' Association has gathered two hundred thousand signatures. The petition's first page reads: \"In Share Our Wealth, share us a portion of citizenship too.\""
 krcw_usa_little_rock_compromise:0 "The Little Rock Compromise"
 krcw_usa_little_rock_compromise_desc:0 "Long spends three weeks with the southern senators. The result satisfies nobody: no poll tax in federal elections, no segregation at relief windows, but state schools remain \"unchanged for now\"."
 krcw_usa_hold_the_line:0 "Hold the Color Line"
 krcw_usa_hold_the_line_desc:0 "The southern bosses threaten to shut down the whole South if New Orleans touches segregation. Long chooses them."
 krcw_usa_federal_voting_act:0 "The Federal Voting Act"
 krcw_usa_federal_voting_act_desc:0 "The compromise is only a beginning. Federal courts start hearing voting discrimination cases; federal marshals escort Black voters to the polls."
 krcw_usa_guard_the_crossings:0 "Guard the Crossings"
 krcw_usa_guard_the_crossings_desc:0 "The National Guard sets up checkpoints at every crossing of the Mississippi. Escapees are caught and sent to labor camps. Every night the east-bank radio reads out their names."
 krcw_usa_integrated_divisions:0 "Integrated Divisions"
 krcw_usa_integrated_divisions_desc:0 "The War Department abolishes the \"colored regiments\". Many southern officers resign; far more Black soldiers re-enlist."
 krcw_usa_share_our_wealth_act:0 "Pass the Share Our Wealth Act"
 krcw_usa_share_our_wealth_act_desc:0 "Long's signature policy: confiscatory progressive taxes on the oil barons and railroad magnates, a \"homestead allowance\" for every family. The West's rich have nowhere to flee, so they pay."
 krcw_usa_texas_oil_boom_f:0 "The Texas Oil Boom"
 krcw_usa_texas_oil_boom_f_desc:0 "The east bank has Detroit; the west bank has Texas. The Houston refineries and Permian derricks will buy Long's America everything it lacks."
 krcw_usa_veracruz_lifeline:0 "The Veracruz Lifeline"
 krcw_usa_veracruz_lifeline_desc:0 "Russia agrees to ship entire factory fittings to the west bank, by sea to Veracruz and then north by Mexican rail to Laredo. The price is a long-term contract for Texas oil."
 krcw_usa_dallas_arsenal:0 "The Dallas Arsenal"
 krcw_usa_dallas_arsenal_desc:0 "Russian engineers and Texan workers build an arsenal outside Dallas and Fort Worth."
 krcw_usa_california_aircraft:0 "The Wichita Aircraft Industry"
 krcw_usa_california_aircraft_desc:0 "The West Coast plants stayed with the Constitutional Coalition in Sacramento, so Long starts again in the Kansas wheatfields. The new works at Wichita and Fort Worth are folded into a National Defense Aviation Board, and engineers lured away from Los Angeles see their pay doubled."
 krcw_usa_boulder_dam_grid:0 "The Boulder Dam Grid"
 krcw_usa_boulder_dam_grid_desc:0 "Hoover, Fort Peck and Elephant Butte are linked into a single grid. Long's posters read: \"Long's Lights shine on the West.\""
 krcw_usa_sow_mobilization_f:0 "Share Our Wealth Mobilization"
 krcw_usa_sow_mobilization_f_desc:0 "The east bank has more factories; the west bank has more people. Every family drawing the homestead allowance owes a son to the National Guard."
 krcw_usa_pacific_yards:0 "Gulf Yards"
 krcw_usa_pacific_yards_desc:0 "The yards of Houston, Orange and New Orleans work day and night. The Pacific Fleet stayed in San Francisco; Long will build a navy of his own on the Gulf."
 krcw_usa_iron_range_steel:0 "Iron Range Steel"
 krcw_usa_iron_range_steel_desc:0 "The ore of Minnesota's Iron Range once went east to the Great Lakes mills. Now Long will build his own furnaces near Duluth and St. Louis."
 krcw_usa_kingfish_highways:0 "The Kingfish Highways"
 krcw_usa_kingfish_highways_desc:0 "Long built highways in Louisiana; now he builds them across the whole West. Every road leads to a polling station, and to the Mississippi."
 krcw_usa_west_bank_prosperity:0 "Develop West Bank Consumer Goods"
 krcw_usa_west_bank_prosperity_desc:0 "Refrigerators, television sets and Chevrolets. For the first time the west bank's middle class feels that Long's America might be more than a barracks. It still has fewer factories than the east, but the gap narrows every day."
 krcw_usa_war_department_reform:0 "War Department Reform"
 krcw_usa_war_department_reform_desc:0 "The first half of the civil war was a melee of militias, Guard units and private armies. Now the War Department will build a true national army."
 krcw_usa_russian_mission_f:0 "Invite the Russian Mission"
 krcw_usa_russian_mission_f_desc:0 "Savinkov will send his best staff officers, in exchange for berths for the Russian fleet at Galveston and San Diego."
 krcw_usa_patton_armored_corps:0 "Patton's Armored Corps"
 krcw_usa_patton_armored_corps_desc:0 "Patton demands that every new tank be concentrated into one armored corps. \"One big punch,\" he says, \"from St. Louis to Chicago.\""
 krcw_usa_frontier_rangers_f:0 "Frontier Rangers"
 krcw_usa_frontier_rangers_f_desc:0 "The West's people are younger than the east's, and better armed. The Texas Ranger tradition is expanded into a whole arm of service."
 krcw_usa_west_bank_fortress:0 "The West Bank Fortress Belt"
 krcw_usa_west_bank_fortress_desc:0 "Pillboxes and tank ditches along the west bank of the Mississippi. Long calls it \"insurance for peace\"; the east bank calls it \"a second Elbe line\"."
 krcw_usa_gulf_fleet:0 "The Gulf Fleet"
 krcw_usa_gulf_fleet_desc:0 "In the New Orleans and Galveston yards lie the old Navy ships that went over to Long in the civil war. They need repairs, and a mission grander than \"blockading the mouth of the Mississippi\"."
 krcw_usa_air_force:0 "The Army Air Force"
 krcw_usa_air_force_desc:0 "Russian jet-engine drawings meet Wichita assembly lines; the west bank has its own jet fighters for the first time."
 krcw_usa_southern_academies:0 "The Southern Academies"
 krcw_usa_southern_academies_desc:0 "West Point lies on the east bank. The military schools of Texas A&M and LSU take over officer training, along with their old southern traditions."
 krcw_usa_reclaim_the_east:0 "Plan to Reclaim the East"
 krcw_usa_reclaim_the_east_desc:0 "The General Staff safe holds a plan codenamed \"Appomattox\": three river crossings, Memphis, Chicago and Washington taken within six weeks."
 krcw_usa_operation_appomattox:0 "Operation Appomattox"
 krcw_usa_operation_appomattox_desc:0 "Cross the river. The armistice will be torn up and the American Civil War will enter its second phase. Moscow and Paris will both be drawn in."
 krcw_usa_defensive_doctrine:0 "Defense Before Offense"
 krcw_usa_defensive_doctrine_desc:0 "Collins and Ridgway argue: let the east bank fire first. The east has more factories, and an offensive across the river would only bury the West's young men in the streets of Chicago. Hold the bank, and time will let Russian aid and Texas oil do their work."
 krcw_usa_moscow_accord_partner:0 "Secure Russian Loans"
 krcw_usa_moscow_accord_partner_desc:0 "Long is not Savinkov's puppet, or so he believes. But without Russian loans, machinery and arms, the west bank could not keep up the race with the eastern factories."
 krcw_usa_rio_grande_railway:0 "The Rio Grande Railway"
 krcw_usa_rio_grande_railway_desc:0 "The Laredo and El Paso crossings are expanded into huge transshipment yards. Mexican railcars roll north day and night."
 krcw_usa_the_naval_command_question:0 "Court the Constitutional Coalition"
 krcw_usa_the_naval_command_question_desc:0 "The Congress in Sacramento calls itself the only lawful Congress of the United States and does not recognise New Orleans. The Coalition has a fleet and harbors, but no oil, no money and too few men. Texas crude and Moscow loans may bring President Warren and Congress round sooner than guns; General MacArthur in the Presidio can be talked to separately."
 krcw_usa_russian_loans:0 "The Ruble Loans"
 krcw_usa_russian_loans_desc:0 "The State Bank in Moscow extends New Orleans a thirty-year loan. The conditions are written in an appendix on page fourteen."
 krcw_usa_pacific_ports:0 "Gulf Ports"
 krcw_usa_pacific_ports_desc:0 "Galveston, Corpus Christi and New Orleans open their harbors fully to Russian and Mexican shipping, the west bank's window on the world."
 krcw_usa_accord_deterrent:0 "Designate the Nevada Military Zone"
 krcw_usa_accord_deterrent_desc:0 "Once Russia has the atomic bomb, the west bank will be its shield, and perhaps its target. The Nevada desert has already been declared a \"special military zone\"."
 krcw_usa_hemispheric_talks:0 "Hemispheric Talks"
 krcw_usa_hemispheric_talks_desc:0 "A meeting without journalists in Mexico City: for the first time diplomats of the west bank, the east bank, Mexico and Canada sit at the same table."
 krcw_usa_letters_to_new_york:0 "Letters to New York"
 krcw_usa_letters_to_new_york_desc:0 "An unsigned letter travels from New Orleans to New York: \"1954 will be the Bicentennial. Will we still be staring at each other across the river?\" It is the first seed of what will later be called the Philadelphia Process."
 krcw_usa_share_our_wealth_law:0 "The Share Our Wealth Act"
 krcw_usa_share_our_wealth_law_desc:0 "The 1934 program is at last the law of the land: no fortune above three million dollars, no family below two thousand a year. The accountants in New Orleans discover that redeeming a slogan is ten thousand times harder than shouting it."
 krcw_usa_the_homestead_act:0 "The Homestead Act"
 krcw_usa_the_homestead_act_desc:0 "A house, a truck and a radio for every family: the Kingfish's promise to the plains. The government buys up foreclosed farms cheap and hands them to veterans and sharecroppers."
 krcw_usa_the_old_age_pension:0 "The Old Age Pension"
 krcw_usa_the_old_age_pension_desc:0 "Thirty dollars a month for everyone over sixty. The outlay swallows a quarter of the oil revenue, but it gives the Kingfish someone to speak for him in every small-town church."
 krcw_usa_the_sunday_broadcast:0 "The Sunday Broadcast"
 krcw_usa_the_sunday_broadcast_desc:0 "The Kingfish's broadcast begins at eight every Sunday. He does not talk ideology, only money: who took yours, and how he means to get it back. Thirty million people are listening."
 krcw_usa_the_wealth_tax:0 "The Wealth Tax"
 krcw_usa_the_wealth_tax_desc:0 "The Texas oil barons receive their first real tax bills. Some move their money to the banks of San Francisco; others decide to buy the Congress instead."
 krcw_usa_the_barons_revolt:0 "Answer the Barons' Revolt"
 krcw_usa_the_barons_revolt_desc:0 "The oil, railroad and cotton interests combine to demand the Kingfish \"return to reality\". The government must decide whether to compromise with them or nationalise their companies outright."
 krcw_usa_the_peoples_bank:0 "The People's Bank"
 krcw_usa_the_peoples_bank_desc:0 "The state takes over the western banking system. Deposits are guaranteed and credit flows where the Kingfish directs it: social policy and the fuel of a political machine at once."
 krcw_usa_education_for_all:0 "Education for All"
 krcw_usa_education_for_all_desc:0 "The Louisiana State model goes national: free textbooks, free lunches, night schools for the illiterate. The Kingfish says a poor man who can read knows whom to hate."
 krcw_usa_the_veterans_bonus:0 "The Veterans' Bonus"
 krcw_usa_the_veterans_bonus_desc:0 "The veterans of the civil war receive their long-delayed bonus. The money buys back the army's loyalty to the Kingfish, or part of it."
 krcw_usa_the_texas_boom:0 "Expand Texas Oil Output"
 krcw_usa_the_texas_boom_desc:0 "The East Texas, Permian and Gulf Coast fields pump day and night. Oil is this regime's only real hard currency, and its stake in every bargain with Moscow."
 krcw_usa_the_gulf_refineries:0 "The Gulf Refineries"
 krcw_usa_the_gulf_refineries_desc:0 "The cracking towers of Beaumont and Lake Charles form a forest of steel. Crude goes abroad for currency; the refined product stays with the army."
 krcw_usa_synthetic_rubber:0 "Synthetic Rubber"
 krcw_usa_synthetic_rubber_desc:0 "Southeast Asian rubber is in Internationale hands, yet the trucks and aircraft of the west need tyres. The chemists build synthetic plants at Baton Rouge."
 krcw_usa_the_tampico_conduit:0 "The Tampico Conduit"
 krcw_usa_the_tampico_conduit_desc:0 "Russian arms come ashore at Mexican Tampico and travel north by rail into Texas. Every freight car makes the army stronger and the regime more dependent on Moscow."
 krcw_usa_the_wichita_works:0 "The Wichita Works"
 krcw_usa_the_wichita_works_desc:0 "On the Kansas plains the Beech, Cessna and Boeing sheds stand in a row. The west's air force must grow from here."
 krcw_usa_the_power_grid:0 "The Hoover-Peck Grid"
 krcw_usa_the_power_grid_desc:0 "Hoover Dam and the upper Missouri stations are wired into a single grid. For the first time the west has power enough for heavy industry."
 krcw_usa_the_steel_of_the_west:0 "Relight the Pueblo Furnaces"
 krcw_usa_the_steel_of_the_west_desc:0 "The furnaces of Pueblo and Geneva are lit again. Without Pittsburgh the west must make its own steel."
 krcw_usa_the_gulf_yards:0 "The Gulf Yards"
 krcw_usa_the_gulf_yards_desc:0 "The yards of New Orleans and Mobile have built only landing craft and tankers. Now the Kingfish wants warships from them."
 krcw_usa_the_plains_railroads:0 "The Plains Railroads"
 krcw_usa_the_plains_railroads_desc:0 "The trunk lines from New Orleans to Denver and from Wichita to the border are double-tracked. Both the army and the oil need faster rails."
 krcw_usa_the_atomic_program:0 "The Atomic Program"
 krcw_usa_the_atomic_program_desc:0 "The Los Alamos laboratories remain in western hands. Moscow will supply drawings, at the price of sharing the result. The Kingfish wants a bomb of his own."
 krcw_usa_share_the_wealth:0 "Share Our Wealth"
 krcw_usa_share_the_wealth_desc:0 "A cap on fortunes, a floor under incomes, pensions and homesteads. The program gives the Kingfish loyal voters in every county of the west, at the price of a hole in the budget that can never be filled."
 krcw_usa_pension_burden:0 "The Pension Burden"
 krcw_usa_pension_burden_desc:0 "Thirty dollars a month to everyone over sixty: the regime's most popular policy, and the line in the ledger the treasury secretary fears most."
 krcw_usa_40_t:0 "The Barons' Revolt"
 krcw_usa_40_d:0 "The representatives of oil, rail and cotton sit in a New Orleans parlour with a memorandum on the table: if the wealth tax stands, they will move their capital, their refineries and their ledgers to San Francisco. In the next room the Kingfish paces. He knows they hold the money he needs, and he holds the crowds they fear."
 krcw_usa_40.a:0 "Nationalise their companies"
 krcw_usa_40.b:0 "Compromise: halve the rate for investment"
 krcw_usa_40.c:0 "Let them go and seize what stays"
 krcw_usa_44_t:0 "A Bomb of Our Own"
 krcw_usa_44_d:0 "The Los Alamos laboratories are still in western hands; what is missing is money, power and uranium. Moscow's representative brings an offer: Russian drawings and Russian ore, the result shared, the test conducted in Kazakhstan. The generals want the bomb, the scientists want independence, and the Kingfish wants never again to look up at anyone across a table."
 krcw_usa_44.a:0 "Accept Moscow's terms"
 krcw_usa_44.b:0 "Build it alone, even if it takes ten years"
 krcw_wca_the_syndicates_endure:0 "The Syndicates Endure"
 krcw_wca_the_syndicates_endure_desc:0 "In May 1949 the Ninth Congress of the Combined Syndicates meets in New York. The east bank holds Detroit, Chicago, Pittsburgh and Washington, but Appalachia was wrecked in the civil war, the federations distrust one another, and across the river Long's army is being rearmed by Russia."
 krcw_wca_ninth_congress:0 "The Ninth Congress"
 krcw_wca_ninth_congress_desc:0 "Two camps face off at the Congress: Reuther's \"Builders\" want to make the East a showcase of industrial democracy first; Foster and Cannon's \"Liberators\" want to cross the river as soon as possible and free the west bank's sharecroppers and oil workers from Long's machine."
 krcw_wca_charter_of_industrial_democracy:0 "Charter of Industrial Democracy"
 krcw_wca_charter_of_industrial_democracy_desc:0 "Reuther's charter: plant plans are drawn up jointly by shop committees and regional federations; no central body may impose quotas unilaterally."
 krcw_wca_liberation_committee:0 "The Liberation Committee"
 krcw_wca_liberation_committee_desc:0 "Foster's faction wins the Congress majority. A \"West Bank Liberation Committee\" is formed; its first resolution declares the armistice merely \"a breathing space\"."
 krcw_wca_federations_compact:0 "The Federations' Compact"
 krcw_wca_federations_compact_desc:0 "The five great federations, auto, steel, mining, docks and garment, sign a compact in Detroit: disputes go to Congress arbitration, and no federation may keep a private militia. Factionalism has not vanished, but it has gone back into the hall."
 krcw_wca_randolph_and_the_brigades:0 "Randolph and the Brigades"
 krcw_wca_randolph_and_the_brigades_desc:0 "A. Philip Randolph of the Sleeping Car Porters organises Black workers in Birmingham and raises Black volunteer brigades."
 krcw_wca_radio_free_america:0 "Radio Free America"
 krcw_wca_radio_free_america_desc:0 "Every night the Memphis transmitter broadcasts to the west bank: union news, the names of the disappeared, jazz, and the latest scandal from inside Long's machine."
 krcw_wca_refugee_reception:0 "Refugee Reception Committees"
 krcw_wca_refugee_reception_desc:0 "Thousands cross from the west bank every month: Black families, members of outlawed unions, deserters. Reception committees in Memphis and Cairo register them, house them and find them work."
 krcw_wca_the_first_free_election:0 "The First Federation-Wide Election"
 krcw_wca_the_first_free_election_desc:0 "In the autumn of 1950, while the west bank holds Long's fifth \"election\", the east bank holds its first general election of syndicate delegates: every worker, farmer and soldier has a vote, including refugees fresh across the river."
 krcw_wca_election_roll_tt:0 "Which current wins the majority depends on earlier choices: the Ninth Congress line, the Charter or the Liberation Committee, arbitration and reconstruction, whether the electoral law and the count were accepted, and tension on the Line."
 krcw_wca_open_letter_west:0 "Open Letter to the West"
 krcw_wca_open_letter_west_desc:0 "The Syndicate Congress writes to the workers, farmers and veterans of the west bank: \"We are not coming to conquer you. When you are ready, we are waiting on the other side of the river.\""
 krcw_wca_the_march_west:0 "The March West"
 krcw_wca_the_march_west_desc:0 "The Liberation Committee proclaims Long's America \"a prison waiting to be torn down\". The front-line units are ordered to prepare for the crossing."
 krcw_wca_rebuild_appalachia:0 "Rebuild Appalachia"
 krcw_wca_rebuild_appalachia_desc:0 "The civil war's cruelest fighting raged through Appalachia. Dynamited railways, flooded mines and burnt-out towns must be fixed first, not for war, but to get the plants running again."
 krcw_wca_miners_return:0 "The Miners Return"
 krcw_wca_miners_return_desc:0 "Pump out the flooded pits of Harlan County and West Virginia and restore coal production in the east."
 krcw_wca_heal_the_veterans:0 "Open Clinics for the Veterans"
 krcw_wca_heal_the_veterans_desc:0 "Half a million disabled veterans need hospitals, prosthetics and work. The syndicalist medical cooperatives open clinics in every industrial city."
 krcw_wca_join_clearing_union:0 "Join the Paris Clearing Union"
 krcw_wca_join_clearing_union_desc:0 "Join the Paris Clearing Union: trade between the syndicates is reckoned in labour time, and deficits are covered by the Union's development fund."
 krcw_wca_detroit_councils:0 "The Detroit Councils"
 krcw_wca_detroit_councils_desc:0 "The auto workers' assembly lines are where Reuther began. The councils vote: half the capacity for tractors and trucks, half for tanks."
 krcw_wca_tva_syndicate:0 "The Tennessee Valley Syndicate"
 krcw_wca_tva_syndicate_desc:0 "The Tennessee Valley Authority is reorganized as a syndicate run jointly by power workers, farm cooperatives and local communes. For the first time the southern farmhouses have electric light."
 krcw_wca_transnational_federations:0 "Transnational Federations"
 krcw_wca_transnational_federations_desc:0 "The East's steel, auto and electrical federations join the Internationale's transnational federations. Engineers rotate between Lyon, Manchester and Pittsburgh; blueprints cross the Atlantic both ways."
 krcw_wca_southern_mills:0 "The Southern Mill Syndicates"
 krcw_wca_southern_mills_desc:0 "Before the civil war the Carolina and Georgia mills paid the lowest wages in America. Now their workers' councils set their own pay for the first time."
 krcw_wca_atlantic_yards_f:0 "Atlantic Yards"
 krcw_wca_atlantic_yards_f_desc:0 "The Norfolk, Philadelphia and Brooklyn yards resume work. Rickover wants a fleet that can hold the Atlantic coast and escort the convoys from Europe."
 krcw_wca_cybernetic_planning:0 "Cybernetic Coordination"
 krcw_wca_cybernetic_planning_desc:0 "Norbert Wiener at MIT works with Paris engineers to coordinate orders among thousands of Great Lakes plants by electronic computer. The plan is no longer a command but a network updated in real time."
 krcw_wca_the_eastern_commonwealth:0 "The Eastern Commonwealth"
 krcw_wca_the_eastern_commonwealth_desc:0 "Ten years ago the East was a war-torn ruin. Today factory chimneys run in a line from Boston to Atlanta. The syndicates have proved that plants can run without bosses."
 krcw_wca_carlsons_army:0 "Form the Syndicalist People's Army"
 krcw_wca_carlsons_army_desc:0 "Carlson builds a Syndicalist People's Army modelled on the National Revolutionary Army he saw in China, stressing equality between officers and men and close cooperation."
 krcw_wca_disband_private_militias:0 "Fold in the Federation Militias"
 krcw_wca_disband_private_militias_desc:0 "Every federation has its own militia. Carlson means to fold them all into the People's Army, which is harder than fighting a battle."
 krcw_wca_defense_in_depth:0 "Defense in Depth"
 krcw_wca_defense_in_depth_desc:0 "The west bank has more infantry, and younger. Then let them break themselves against wall after wall in the hills of Tennessee and Kentucky."
 krcw_wca_river_scouts:0 "River Scouts"
 krcw_wca_river_scouts_desc:0 "Scouts paddling canoes across the river at night are the east bank's most precious source of intelligence."
 krcw_wca_mechanized_syndicates:0 "Mechanized Syndicates"
 krcw_wca_mechanized_syndicates_desc:0 "The east bank has Detroit. Its infantry can ride to battle in trucks."
 krcw_wca_people_air_force:0 "The People's Air Force"
 krcw_wca_people_air_force_desc:0 "Bell, Republic and Grumman all build on the east bank. Syndicalist flight schools open on Long Island and in Dayton; a third of the cadets are women."
 krcw_wca_rickover_fleet:0 "Develop Nuclear Submarines"
 krcw_wca_rickover_fleet_desc:0 "Rickover is obsessed with one idea: submarines driven by atomic reactors. The Internationale's physicists call him mad, then help him draw the plans."
 krcw_wca_volunteers_from_abroad:0 "Volunteers from Abroad"
 krcw_wca_volunteers_from_abroad_desc:0 "Set up training camps in Pennsylvania for volunteers from France, Britain, Italy and China."
 krcw_wca_liberation_plan:0 "The Liberation Plan"
 krcw_wca_liberation_plan_desc:0 "Carlson's staff drafts the \"John Brown Plan\": force a crossing between Memphis and Cairo, drive on Little Rock and Dallas, and call the west bank's sharecroppers and oil workers to a general strike."
 krcw_wca_war_of_liberation:0 "The War of Liberation"
 krcw_wca_war_of_liberation_desc:0 "Cross the river. America's workers take up arms a second time, and the armistice turns to ash."
 krcw_wca_shield_of_the_east:0 "Shield of the East"
 krcw_wca_shield_of_the_east_desc:0 "The east will not fire first, but every factory is prepared to become a strongpoint if the other side crosses."
 krcw_wca_the_internationale:0 "The Internationale's American Section"
 krcw_wca_the_internationale_desc:0 "The Combined Syndicates are the Internationale's only major member in the New World. Paris sees the east bank as the bridgehead of the American revolution; the east bank sees Paris as its surest friend."
 krcw_wca_canadian_brothers:0 "Canadian Brothers"
 krcw_wca_canadian_brothers_desc:0 "Tim Buck's Canada faces the east bank across the Great Lakes. The two federations merge their rail and shipping dispatch; Ontario nickel and Québec aluminum flow south along the St. Lawrence."
 krcw_wca_naval_command_overtures:0 "Overtures to the Constitutional Coalition"
 krcw_wca_naval_command_overtures_desc:0 "The longshoremen of San Francisco and Seattle never accepted the Western Defense Command's military districts. The syndicates promise the Congress in Sacramento it may keep its state governments, its fleet and its officers, while smuggling leaflets and strike funds into the Oakland yards."
 krcw_wca_mexican_sympathies:0 "Build a Network Along the Mexican Railways"
 krcw_wca_mexican_sympathies_desc:0 "Ávila Camacho's Mexico is the conduit for Russian arms to Long, but Mexico's workers and peasants remember Zapata and Villa. A secret network spreads along the railways."
 krcw_wca_atlantic_bridge:0 "The Atlantic Bridge"
 krcw_wca_atlantic_bridge_desc:0 "Every week the convoys sail from Le Havre and Liverpool to New York, bringing books, machines and technicians, and taking back trucks, grain and exchange students."
 krcw_wca_atomic_cooperation:0 "Atomic Cooperation"
 krcw_wca_atomic_cooperation_desc:0 "Physicists in Chicago and at Columbia exchange papers with the Curie Laboratory in Paris. The east bank builds no bomb, not yet, but it means to understand the atom."
 krcw_wca_reply_from_new_york:0 "A Reply from New York"
 krcw_wca_reply_from_new_york_desc:0 "The Syndicate Congress debates for three days and finally votes a reply: \"We are willing to talk. Not about who surrenders to whom, but about how two Americas can live together.\""
 krcw_ohio_up_small_tt:0 "Mississippi Line tension §R+5§! (current: [?global.krcw_ohio_tension])"
 krcw_ohio_up_medium_tt:0 "Mississippi Line tension §R+10§! (current: [?global.krcw_ohio_tension])"
 krcw_ohio_up_large_tt:0 "Mississippi Line tension §R+20§! (current: [?global.krcw_ohio_tension])"
 krcw_ohio_down_small_tt:0 "Mississippi Line tension §G-5§! (current: [?global.krcw_ohio_tension])"
 krcw_ohio_down_medium_tt:0 "Mississippi Line tension §G-10§! (current: [?global.krcw_ohio_tension])"
 krcw_ohio_down_large_tt:0 "Mississippi Line tension §G-20§! (current: [?global.krcw_ohio_tension])"
 krcw_ohio_1_t:0 "The Mississippi Line"
 krcw_ohio_1_d:0 "Three years have passed since the St. Louis Armistice. From the lakes of Minnesota to the delta of Louisiana, eighteen hundred miles of river cut America in two.\n\nOn the east bank lie the Combined Syndicates: New York, Washington, Chicago, Detroit and Pittsburgh, the industrial heart of America, run by workers' councils yet worn down by a decade of civil war and factional strife. On the west bank lies Huey Long's United States: New Orleans, Texas, the Great Plains and the Rockies, vast, young and oil-rich, but with less than half the factories of the other bank and dependent on Russian aid shipped through Mexico. Beyond the Rockies, the Constitutional Coalition in Sacramento holds the West Coast and keeps its doors shut to both.\n\nBoth constitutions claim to speak for all America. Soldiers on both banks shout across the water at night. And both sides remember one line of the armistice very well: \"This agreement constitutes no recognition of either party's claims to sovereignty.\""
 krcw_ohio_1.a:0 "The river will not divide us forever."
 krcw_ohio_10_t:0 "Shots at Cairo"
 krcw_ohio_10_d:0 "Cairo, Illinois, where the Ohio meets the Mississippi. Last night a patrol was raked by machine-gun fire from across the river; two men are dead. The radio on the other bank says we fired first, at a fishing boat.\n\nThe front commander requests authorization for \"proportionate retaliation\"."
 krcw_ohio_10.a:0 "Authorize shelling of their positions."
 krcw_ohio_10.b:0 "Protest through the armistice commission at St. Louis."
 krcw_ohio_10.c:0 "Bury the story before the papers get it."
 krcw_ohio_11_t:0 "Gunboat on the River"
 krcw_ohio_11_d:0 "One of Long's gunboats has crossed the midline of the channel north of St. Louis and played its searchlight on the east-bank docks for a full hour. The dockworkers' council wants the militia to \"give it something to remember\"."
 krcw_ohio_11.a:0 "Fire a warning shot from the shore batteries."
 krcw_ohio_11.b:0 "Photograph it and file it with the armistice commission."
 krcw_ohio_11.c:0 "Turn off the dock lights and let them shine all they like."
 krcw_ohio_12_t:0 "The Intercepted Ferry"
 krcw_ohio_12_d:0 "The National Guard has stopped a ferry near Vidalia, Louisiana, crowded with Black families: more than forty people, half of them children. They say they were going east \"to find somewhere a man can vote\".\n\nThe east-bank radio is already reporting it."
 krcw_ohio_12.a:0 "Let them go."
 krcw_ohio_12.b:0 "Send them home; court-martial the ferryman."
 krcw_ohio_12.c:0 "Let them stay, and find them jobs in Houston."
 krcw_ohio_13_t:0 "Deserters Swim Across"
 krcw_ohio_13_d:0 "Three west-bank soldiers have swum the Mississippi near La Crosse and surrendered to the east-bank militia. They bring a sketch of Long's defenses, and a question: under the armistice, deserters are to be returned."
 krcw_ohio_13.a:0 "Grant them asylum. The armistice can go hang."
 krcw_ohio_13.b:0 "Return them per the armistice, after a thorough debriefing."
 krcw_ohio_13.c:0 "Put their story on the radio."
 krcw_ohio_14_t:0 "War on the Airwaves"
 krcw_ohio_14_d:0 "The east bank's \"Radio Free America\" has a new transmitter and its signal now reaches Dallas. It plays jazz, union news and recordings of Long's officials taking bribes."
 krcw_ohio_14.a:0 "Build jamming stations."
 krcw_ohio_14.b:0 "Answer in kind: launch \"The True Voice of America\"."
 krcw_ohio_14.c:0 "Ignore it. Who believes Red radio?"
 krcw_ohio_15_t:0 "The St. Louis Smuggling Ring"
 krcw_ohio_15_d:0 "The FBI has broken a smuggling ring in St. Louis: east-bank penicillin traded weekly for west-bank gasoline in midstream. Those involved include two sheriffs and a Union Party state legislator."
 krcw_ohio_15.a:0 "Public trial, as an example."
 krcw_ohio_15.b:0 "Handle it quietly; the legislator is one of ours."
 krcw_ohio_15.c:0 "Turn the smuggling into official trade."
 krcw_ohio_16_t:0 "The Dynamited Bridge"
 krcw_ohio_16_d:0 "A stretch of track at the East St. Louis end of the Eads Bridge has been blown up. Leaflets at the scene are signed \"Sons of the Confederacy\", an underground group said to be funded by Long's military."
 krcw_ohio_16.a:0 "Comb the city and hand the evidence to the armistice commission."
 krcw_ohio_16.b:0 "An eye for an eye: blow one of their bridges."
 krcw_ohio_16.c:0 "Fix the track and keep it out of the news."
 krcw_ohio_17_t:0 "The River Floods"
 krcw_ohio_17_d:0 "The spring flood is fiercer than any in years. The Mississippi has broken its levees on both banks at once, drowning dozens of towns. East-bank and west-bank refugees alike climb the same high ground and wait for rescue.\n\nThe armistice commission proposes joint relief."
 krcw_ohio_17.a:0 "Accept joint relief."
 krcw_ohio_17.b:0 "Each side saves its own."
 krcw_ohio_18_t:0 "A Prisoner Exchange"
 krcw_ohio_18_d:0 "Brokered by Mexican diplomats, both banks agree to exchange the last civil-war prisoners on the Eads Bridge at St. Louis. It is the first time since the armistice that soldiers of both sides shake hands in the middle of the bridge."
 krcw_ohio_18.a:0 "Let the exchange go ahead."
 krcw_ohio_18.b:0 "Hold back a few \"dangerous elements\"."
 krcw_ohio_19_t:0 "The River Market"
 krcw_ohio_19_d:0 "Where the river divides Minnesota from Wisconsin, farmers of both banks set up a market on the ice once winter freezes it over: west-bank beef for east-bank radios. The front officers turn a blind eye."
 krcw_ohio_19.a:0 "Let it be."
 krcw_ohio_19.b:0 "Send troops to break it up."
 krcw_ohio_40_t:0 "The Line Is Burning"
 krcw_ohio_40_d:0 "The fighting along the line has spun out of control. Within a week there have been battalion-sized firefights at St. Louis, Cairo and La Crosse. The General Staff reports the east bank massing bridging units at the river.\n\nMoscow cables New Orleans urging \"restraint\", unless New Orleans is certain of a quick victory. Everyone knows the other bank has twice our factories."
 krcw_ohio_40.a:0 "Pull back five miles and reopen the armistice commission."
 krcw_ohio_40.b:0 "Hold every position, yield not an inch."
 krcw_ohio_40.c:0 "Tear up the armistice. Cross the river!"
 krcw_ohio_41_t:0 "Pontoons on the Bank"
 krcw_ohio_41_d:0 "The militia commanders at the front cable New York jointly: Long's tanks have come up to the river and the line could collapse at any moment. \"Better we cross first than wait for them.\"\n\nThe cable from Paris has one sentence: \"Do not give Savinkov a pretext.\""
 krcw_ohio_41.a:0 "Pull the militias back and ask Paris to mediate."
 krcw_ohio_41.b:0 "Reinforce the line and let them move first."
 krcw_ohio_41.c:0 "Launch the War of Liberation!"
 krcw_ohio_50_t:0 "Operation Appomattox"
 krcw_ohio_50_d:0 "The orders are signed. At four in the morning three thousand guns will open fire on the east bank at once, and Patton's armored corps will force the river south of St. Louis.\n\nIn the President's office in New Orleans an old senator asks: \"Are we really going to fight the civil war again?\" Nobody answers."
 krcw_ohio_50.a:0 "Fire."
 krcw_ohio_50.b:0 "Rescind the orders at the last moment."
 krcw_ohio_51_t:0 "The John Brown Plan"
 krcw_ohio_51_d:0 "The pontoons are ready. Carlson's order is one line long: \"For the workers and sharecroppers of the west bank.\"\n\nAt the last session the Congress minority warns: if liberation turns into conquest, the people of the west bank will not welcome us."
 krcw_ohio_51.a:0 "Cross!"
 krcw_ohio_51.b:0 "The time is not yet."
 krcw_ohio_52_t:0 "They Have Crossed the River!"
 krcw_ohio_52_d:0 "At dawn the enemy threw pontoon bridges across the Mississippi. The armistice, the paper that held a fragile peace for years, has turned to ash under the guns.\n\nThe second phase of the American Civil War has begun."
 krcw_ohio_52.a:0 "General mobilization!"
 krcw_ohio_53_t:0 "The American Civil War Rekindled"
 krcw_ohio_53_d:0 "News from America shocks the world: the Mississippi Line has collapsed and the armies of the two Americas are fighting again. To keep treaty obligations from dragging the whole world into war, both Americas have temporarily stepped out of their blocs. Paris and Moscow both call emergency sessions. Every newspaper in the world asks the same question: is this how the Third World War begins?"
 krcw_ohio_53.a:0 "God help America."
 krcw_ohio_54_t:0 "Our American Comrades Call"
 krcw_ohio_54_d:0 "The Combined Syndicates and Long's America are at war again. The Internationale Executive must decide how far its aid will go.\n\nDirect entry means all-out confrontation with the Moscow Accord; standing aside means betraying America's workers."
 krcw_ohio_54.a:0 "Arms, supplies and volunteers, but no declaration of war."
 krcw_ohio_54.b:0 "The whole Internationale goes to war!"
 krcw_ohio_54.c:0 "Call for an immediate ceasefire."
 krcw_ohio_55_t:0 "New Orleans Calls for Help"
 krcw_ohio_55_d:0 "Long's America is at war with the east-bank syndicates again, and New Orleans asks Moscow to honor the Accord.\n\nThe generals of the Supreme Directory are divided: America is a magnet that could draw the Internationale's strength across the Atlantic, or drag Russia into an unwinnable expedition."
 krcw_ohio_55.a:0 "Provide arms and advisors, but do not enter the war."
 krcw_ohio_55.b:0 "The whole Moscow Accord goes to war!"
 krcw_ohio_55.c:0 "Press New Orleans for a ceasefire."
 krcw_ohio_60_t:0 "The Second St. Louis Talks"
 krcw_ohio_60_d:0 "The war has lasted a year and a half. The front has seesawed back and forth across the river and cities have become ruins. Mexican and Canadian diplomats propose a new armistice: the pre-war line restored, with a demilitarized zone."
 krcw_ohio_60.a:0 "Sign."
 krcw_ohio_60.b:0 "Fight to the end."
 krcw_ohio_61_t:0 "The Second St. Louis Armistice"
 krcw_ohio_61_d:0 "The guns of America have fallen silent again. The new line is almost identical to the old one; only there are hundreds of thousands more graves on both banks. People have begun to say that perhaps America can never be united by war."
 krcw_ohio_61.a:0 "Let this be the last time."
 krcw_ohio_62_t:0 "The American Civil War Is Over"
 krcw_ohio_62_d:0 "The American civil war has ended in the total defeat of one side. A united America, united on the victor's terms, now stands on the North American continent. The world's balance of power tilts."
 krcw_ohio_62.a:0 "Unity, at last."
 krcw_ohio_63.a:0 ""
 krcw_usa_5_t:0 "Three Factions in Dallas"
 krcw_usa_5_d:0 "The Union Party convention meets in the Dallas city hall, but the real meetings happen in the hotel suites next door, where three groups have each taken a floor.\n\nThe third floor is the governors: they want more federal money and fewer federal auditors. The fourth is the generals, Patton and Moseley and a crowd of staff officers: they want an army that can cross the river and a government that does not ask them for receipts. The fifth is the old cadre of the Share Our Wealth Society, who remind everyone that Long's power comes from the farmers drawing the homestead allowance, not from tanks or contracts.\n\nLong sits in the top-floor room and sees them one at a time. He has not slept a whole night in seventy days."
 krcw_usa_5.a:0 "Give the governors their budgets. The machine must live first."
 krcw_usa_5.b:0 "Give the generals their steel. The far bank will not wait for us."
 krcw_usa_5.c:0 "Give the farmers their allowance. That is what we were built on."
 krcw_usa_10_t:0 "The March at Shreveport"
 krcw_usa_10_d:0 "Four thousand Black veterans in old uniforms walk from the Shreveport railway station to the Louisiana voter registration office. They shout no slogans; they simply queue, in front of a door that will not open for them. At the head of the column a man carries a flag: their regimental colours from the Missouri campaign, with seventeen bullet holes in it.\n\nThe state police stop them two blocks short. By evening Radio Free America across the river has played the recording three times."
 krcw_usa_10.a:0 "Send FBI men to hear what they want."
 krcw_usa_10.b:0 "Break up the march and arrest the organizers."
 krcw_usa_10.c:0 "Let them register. Let the southern senators protest."
 krcw_usa_11_t:0 "Two Hundred Thousand Signatures"
 krcw_usa_11_d:0 "The petition arrives in New Orleans in fourteen wooden crates, trucked in by the veterans themselves. At their head is a sergeant who lost a leg in the Missouri campaign. Carrying the first crate up the capitol steps he says the line the reporters write down: \"The President promised us every man a king. We only want a king's ballot.\"\n\nThat same evening the southern senators send a joint telegram: if New Orleans accepts the petition, the party organizations of Louisiana, Mississippi and Arkansas will \"reconsider their support for the President\"."
 krcw_usa_11.a:0 "Take the crates and promise to \"study\" them."
 krcw_usa_11.b:0 "Send the crates back."
 krcw_usa_11.c:0 "Receive the sergeant in person, with all the reporters present."
 krcw_usa_12_t:0 "The First Day at Little Rock"
 krcw_usa_12_d:0 "On the first day the compromise takes effect, two queues form outside the federal registration office in Little Rock: Black veterans come to register, and the white Citizens' Council come to protest. The National Guard stands between them, young soldiers holding rifles and not knowing which way to point.\n\nBy noon the first voter card is issued. By dusk nothing has happened: no riot, no blood, only people going home to supper. The next morning's headline reads \"NOTHING HAPPENED\". It is exactly the headline New Orleans wanted."
 krcw_usa_12.a:0 "This is what America looks like."
 krcw_usa_13_t:0 "The Citizens' Councils Strike Back"
 krcw_usa_13_d:0 "The white Citizens' Councils organize a boycott across Mississippi and Alabama: no credit for Black sharecroppers who register, no work, no doctor. In three counties Black families lose their land within a month.\n\nNew Orleans could pay these families directly out of the Share Our Wealth relief fund, but that would mean an open break with the southern bosses."
 krcw_usa_13.a:0 "Use the relief fund and pay them directly."
 krcw_usa_13.b:0 "Do not intervene. This is a state matter."
 krcw_usa_14_t:0 "Those Who Cross the River"
 krcw_usa_14_d:0 "Another eleven thousand people crossed the Mississippi this month: mostly young Black families, but also white union men and a few newspaper editors tired of writing editorials in praise of the machine. Across from Memphis the east bank has hung a banner outside its reception camp: \"NO COLOR LINE HERE\".\n\nThe Interior Secretary reports that at this rate the west bank will lose 1.2 million people in ten years, and they will be the youngest and the ablest."
 krcw_usa_14.a:0 "Seal the crossings."
 krcw_usa_14.b:0 "Deal with the reason they are leaving."
 krcw_usa_14.c:0 "Let them go. Fewer troublemakers."
 krcw_usa_30_t:0 "The Consultation at Baton Rouge"
 krcw_usa_30_d:0 "Three doctors come from New Orleans, Houston and Mexico City and confer for four hours in the President's private residence. The diagnosis is written into no public document, but that night Earl Long is summoned from Louisiana to the capital, and the Russian ambassador cancels his home leave.\n\nThe official bulletin the next morning says the President has been overworking and his doctors advise fewer public appearances. What it does not say is that he has not come downstairs in eleven days.\n\nThat same night every faction in New Orleans begins doing the same arithmetic."
 krcw_usa_30.a:0 "Keep Earl in the capital."
 krcw_usa_30.b:0 "Put the Joint Chiefs on alert."
 krcw_usa_30.c:0 "Do nothing. The President is alive."
 krcw_usa_31_t:0 "The Kingfish"
 krcw_usa_31_d:0 "At twenty minutes to four in the morning on 10 September 1951, Huey Pierce Long dies in New Orleans, aged sixty.\n\nHe was President of the United States for eighteen years, and for half of them his United States was half a country. In that half he built twenty-four thousand miles of road, six hundred schools and eleven bridges; he gave the children of Louisiana sharecroppers their first free textbooks; and he turned that half country into a machine that answered to one man, jailed those who opposed him and counted the ballots the way he wanted them counted. Historians will quarrel about him for a hundred years.\n\nHe lies in state in the capitol rotunda for three days. The queue runs from the Mississippi to Canal Street: white veterans in old service caps, and Black sharecropper families who rode a truck all night from the country. They stand in a separate queue, because Louisiana has not changed that rule yet.\n\nA reporter asks an old farmer in the line why he came. The old man thinks for a long time. \"He stole a lot of money,\" he says. \"But my kids got shoes.\"\n\nAcross the river in New York the Syndicate Congress adjourns for a day. It sends no congratulations, and no condolences."
 krcw_usa_31.a:0 "Every man a king."
 krcw_usa_32_t:0 "Huey Long Is Dead"
 krcw_usa_32_d:0 "The wire goes out at twenty past four in the morning and newspapers around the world remake their front pages before the first edition.\n\nIn Moscow the Supreme Directory sends a formal message of condolence calling Long \"the leader of the American people against syndicalist tyranny\"; Savinkov himself does not attend the memorial, and is said to have remarked to an aide that \"a machine whose owner dies is just a heap of parts\". In Paris the Internationale's paper runs a restrained headline: \"A COMPLICATED ADVERSARY HAS DIED\". In Mexico City the President orders flags at half-mast for a day, which causes no small argument in Mexico.\n\nAnd in every newspaper in the world the analysis asks the same question: who does this half of America answer to now?"
 krcw_usa_32.a:0 "Half of America, with no one at the wheel."
 krcw_usa_33_t:0 "The Succession"
 krcw_usa_33_d:0 "On this point the Constitution is clear: the Vice-President succeeds. The difficulty is that Long's Vice-President is a man who has never been permitted to give an interview alone, and that real power in this country has never lived in the Constitution.\n\nThree forces come to a reckoning on the seventh day after the funeral.\n\nEarl Long represents the machine itself. He has neither his brother's magnetism nor his brother's faith, but from New Orleans to San Francisco every county boss has owed him a favour, and he has kept the ledger. His proposal is simple: everything runs as before, nobody loses his chair.\n\nGeneral Moseley and the southern generals represent the army. They held this half of the country through the civil war and watched the politicians divide the spoils. Their proposal: the Constitution suspended, a military council in charge until \"the eastern rebellion is entirely suppressed\". Patton's armour is quartered eighty miles from the capital.\n\nAnd there is a third force. The Russian ambassador proposes nothing. He calls on each of the other two in turn, and in each conversation he mentions the same things: the Moscow loans, the machine tools at Veracruz, and how quickly they could stop.\n\nThe acting cabinet has to decide whom it takes the matter to first."
 krcw_usa_33.a:0 "Convene the Union Party national committee: the Vice-President succeeds by the book, then the committee nominates Earl Long."
 krcw_usa_33.b:0 "Bring the generals into a national emergency committee in return for accepting a civilian successor."
 krcw_usa_33.c:0 "Ask the Russian ambassador to guarantee the transfer of power."
 krcw_usa_succession_roll_tt:0 "Who succeeds depends on what Long left behind: the stakes the governors and bosses, the generals and the Russians have each built up, and the cabinet's move."
 krcw_usa_45_t:0 "The Bosses Decide"
 krcw_usa_45_d:0 "The Union Party national committee sits all night in the basement rooms of the capitol. Before dawn thirty-four of the forty-one state organizations have signed the nomination: Earl Long. The Vice-President takes the oath that morning and resigns in the afternoon, \"for reasons of health\".\n\nGeneral Moseley was invited to the committee and did not come. The Russian ambassador sends a short telegram of congratulations."
 krcw_usa_45.a:0 "Earl Long succeeds. The machine runs on."
 krcw_usa_46_t:0 "The Generals Did Not Wait"
 krcw_usa_46_d:0 "While the cabinet is still discussing the procedure, Patton's armour rolls into the outskirts of New Orleans. General Moseley reads a statement on the radio: in view of the President's death and \"the threat from the east bank\", the Council of Generals assumes the affairs of the nation from today until order is restored.\n\nEarl Long takes a telephone call at the governor's mansion and is told he may go home to his Louisiana farm. There are military police at the doors of the capitol."
 krcw_usa_46.a:0 "The Council of Generals takes over. The Constitution is suspended."
 krcw_usa_47_t:0 "The Ambassador's Choice"
 krcw_usa_47_d:0 "The Russian ambassador sees Earl Long three times in one day and Moseley once. The next day a shipment of machine tools is held on the quay at Veracruz, \"for incomplete papers\". On the third day Moseley announces that the army \"submits to constitutional procedure\", and Earl Long takes the oath.\n\nThe new President's first order enlarges the Russian military mission. The machine tools go onto the trains that night."
 krcw_usa_47.a:0 "Earl Long succeeds, and Moscow's mission stays."
 krcw_usa_34_t:0 "Earl Long Sworn In"
 krcw_usa_34_d:0 "Earl Kemp Long takes the oath as President of the United States on the capitol steps. His inaugural address lasts four minutes, two of which are about his brother.\n\n\"I ain't Huey,\" he says at the end. \"Nobody's Huey. I know just one thing: this country can't fight another civil war, and it can't go on betting everything on one man.\"\n\nObservers note that General Moseley stands in the second row throughout the ceremony, his face showing nothing at all."
 krcw_usa_34.a:0 "A dealer, not a prophet."
 krcw_usa_35_t:0 "Tanks in New Orleans"
 krcw_usa_35_d:0 "Constitutional government on the west bank is over. The Council of Generals announces by radio that, the eastern rebellion being unsubdued, the Constitution is suspended from today, Congress is adjourned, and state governors will be \"assisted in their duties\" by military district commanders.\n\nGeneral Moseley becomes chairman of the Council. Earl Long is \"invited\" back to his Louisiana farm, where he is said to be in excellent health.\n\nThe world responds with uniform silence, and then with uniform recalculation. Moscow \"respects the choice of the American people\". The editorial in Paris is headed: \"ACROSS THE RIVER, THE LAST OF THE DISGUISE COMES OFF\"."
 krcw_usa_35.a:0 "An America without lawyers."
 krcw_usa_36_t:0 "The Generals' Dinner"
 krcw_usa_36_d:0 "In Earl Long's first month in office the southern generals hold a dinner at a club in San Antonio. Nominally it is a farewell for a retiring corps commander; in fact the whole command of the southern military district attends, along with three governors.\n\nSomeone raises a glass over the dessert and says the line everyone in the room understands: \"To an America that doesn't need elections.\"\n\nThe FBI has a man in the room. A seven-page report is on the President's desk by morning. Earl Long reads it, folds it into his pocket and tells his secretary: \"Huey'd have locked the lot of 'em up. 'Course, they're also how he kept half a country.\""
 krcw_usa_36.a:0 "Transfer them. Split them across three districts."
 krcw_usa_36.b:0 "Give them a bigger budget and keep them busy."
 krcw_usa_36.c:0 "Burn the report. Nothing happened tonight."
 krcw_usa_37_t:0 "The Second Chance"
 krcw_usa_37_d:0 "Two years after Earl Long burned that report, the southern generals deliver a report of their own to the presidential mansion: a memorandum on \"unified military-civil command in a state of national emergency\", countersigned by fourteen generals, with a draft radio address already attached.\n\nThis time they have not hidden it in a dinner. They have put it on the table and are waiting for an answer."
 krcw_usa_37.a:0 "Refuse. And relieve four of them on the spot."
 krcw_usa_37.b:0 "Sign it."
 krcw_wca_20_t:0 "A Funeral Across the River"
 krcw_wca_20_d:0 "Huey Long is dead. The news reaches New York while the Syndicate Congress is sitting. There is a stir in the hall, and then someone starts to applaud, and then the applause dies away, because Reuther is not clapping.\n\n\"A good many of us had fathers killed by his National Guard,\" he tells the delegates afterwards. \"I won't mourn him. But I want to point one thing out. While he lived, one man decided everything over there, so we knew who we were dealing with. Now there are three crowds fighting over the wheel, and one of them is the generals.\n\n\"Our comrades in the Liberation faction will say this is the best moment to cross. Maybe it is. But if we cross now, those three crowds will be one crowd inside of twenty-four hours, and we will have done their unifying for them.\"\n\nNobody answers him. Foster sits in his place for a long while and finally says: \"Then we wait. But we will not wait forever.\""
 krcw_wca_20.a:0 "Wait. Let them fight it out among themselves."
 krcw_wca_20.b:0 "Broadcast across the river: this is your moment."
 krcw_wca_20.c:0 "Mobilize the border divisions, just in case."
 krcw_wca_long_wait_tt:0 "The generals in New Orleans lose a pretext: a civilian succession on the west bank becomes more likely."
 krcw_wca_long_mobilise_tt:0 "The west-bank generals will point to the mobilisation: a military takeover in New Orleans becomes more likely."
 krcw_usa_20_t:0 "Nineteen Fifty-Two: The Fifth Campaign"
 krcw_usa_20_d:0 "Huey Long's fifth presidential campaign begins. He rides the white train from New Orleans to Montana, and at every stop it is the same speech, the same wave, the same \"Every Man a King\".\n\nNobody doubts the outcome. The Union Party machine in the western states can count every ballot before midnight, and sometimes before the polls close. The real questions are two others.\n\nThe first: should the opposition actually be allowed on the ballot? The Farmer-Labor people still have an organization in Minnesota, and there are men in the Texas oil unions who still speak up. Let them run and Long wins less handsomely, but the election looks like an election for the first time, and across the river they are preparing a general election of their own.\n\nThe second question nobody raises at the meeting: in Denver, Long stopped mid-speech for seventeen seconds, holding the lectern. The official explanation was \"a sore throat\"."
 krcw_usa_20.a:0 "Hold a real election: put the opposition on the ballot."
 krcw_usa_20.b:0 "The usual way. The machine counts the votes."
 krcw_usa_20.c:0 "Cancel the election outright: \"a nation at war does not campaign.\""
 krcw_usa_real_election_tt:0 "The result will depend on the government's record: the civil-rights compromise, the allowance and stability help Long; segregation, graft and the governors' budgets help the opposition."
 krcw_usa_21_t:0 "The Fifth Inauguration"
 krcw_usa_21_d:0 "Huey Pierce Long is re-elected President of the United States. The official figure is eighty-seven per cent; had the opposition been on the ballot it would have been lower, and the outcome the same.\n\nThe inauguration is held in Jackson Square, New Orleans. Two hundred thousand people fill the streets, the Russian ambassador and the President of Mexico sit in the front row of the reviewing stand, and Patton's armour parades down Canal Street.\n\nLong's address lasts nine minutes, the shortest speech of his life. \"All my life I wanted one thing,\" he says, \"that every American child have shoes on his feet, books to read and a piece of ground of his own. I have done half of it. The other half is across the river.\"\n\nWhen he finishes he holds the lectern for a long while before walking down the steps. The crowd takes it for a victor savouring the cheers. The three doctors in the front row know that it is not."
 krcw_usa_21.a:0 "Every man a king."
 krcw_usa_23_t:0 "A Real Victory"
 krcw_usa_23_d:0 "The opposition was on the ballot. The Farmer-Labor people ran a full campaign in Minnesota and the Dakotas, and the Texas oil unions' candidate held a dozen rallies in Houston. Every county count was watched by officials of both parties, and it took a week.\n\nLong still won. He won by less than the machine would have counted, but every county's result stands up to inspection. The farmers on the homestead allowance voted for him, and so did the Black veterans who registered for the first time.\n\nHis inaugural address lasts nine minutes. When he finishes he holds the lectern for a long while before walking down the steps."
 krcw_usa_23.a:0 "Let the far bank look at this ballot."
 krcw_usa_24_t:0 "The States We Lost"
 krcw_usa_24_d:0 "The opposition was on the ballot, and it took Minnesota, North Dakota and three oil districts in Texas. Long still leads the country and is elected a fifth time, but for the first time the Union Party faces an opposition in Congress with seats, newspapers and press conferences.\n\nThe day after the vote the southern bosses arrive in New Orleans demanding that the President punish \"the county committees that failed\". The new Farmer-Labor members demand that the homestead allowance accounts be published."
 krcw_usa_24.a:0 "Seat the opposition and publish the allowance accounts."
 krcw_usa_24.b:0 "Declare the count in those states \"under review\"."
 krcw_usa_25_t:0 "No Inauguration"
 krcw_usa_25_d:0 "The first Tuesday in November passes and the west bank does not vote. Congress, citing the emergency, passes a resolution extending the President's term \"until the question of the Line is settled\". Seven members vote against, and four of them are suspended from the party the next day.\n\nThere is no rally in Jackson Square. Long signs on the second floor of the mansion and does not come out to speak. The east-bank radio reads the full text of the resolution three times that night."
 krcw_usa_25.a:0 "A nation at war does not campaign."
 krcw_usa_22_t:0 "An Election Year in America"
 krcw_usa_22_d:0 "In the autumn of 1950 elections are held on both banks of the Mississippi.\n\nOn the west bank Huey Long is elected a fifth time, which the official news agency calls \"an expression of the popular will\". On the east bank the Combined Syndicates hold their first federation-wide delegate election since the civil war, and six million workers, farmers and soldiers vote at the benches, in the pits and in the barracks.\n\nEach side's papers print the other side's results under almost the same headline: \"AND THEY CALL THAT AN ELECTION?\"\n\nIn the newspapers of the rest of the world the two stories run on the same page, separated by a thin rule."
 krcw_usa_22.a:0 "Two Americas, two kinds of ballot."
 krcw_wca_5_t:0 "Three Days on Union Square"
 krcw_wca_5_d:0 "The Ninth Congress sits for three days and argues for three days.\n\nWalter Reuther stands at the rostrum and talks numbers for two hours: the east bank has a hundred and sixty modern industrial combines, three quarters of the continent's steel, the rail yards of Chicago and the harbour of New York. \"We held the workshop of America. The question is not how we cross the river. It is how we make the people on the other side want to cross it themselves.\"\n\nWhen William Foster takes the microphone the mining delegates at the back are already on their feet. \"Comrades, I worked nineteen years in the Kentucky pits. I know what they are thinking over there. They are thinking that the comrades in New York sit in offices and have forgotten what a sharecropper is.\" Cannon adds the line the stenographer hesitates over: \"The armistice is not peace. It is our excuse for not being ready.\"\n\nReuther does not answer him. He asks one question instead: \"If we cross the river tomorrow, who runs the lathes in Detroit the day after?\""
 krcw_wca_5.a:0 "The Builders: make the east bank a place worth envying first."
 krcw_wca_5.b:0 "The Liberators: the armistice is a breathing space. Prepare to cross."
 krcw_wca_5.c:0 "Send the argument back to the federations. Do not split the Congress."
 krcw_wca_10_t:0 "Six Million Ballots"
 krcw_wca_10_d:0 "In October 1950 the east bank holds its first federation-wide delegate election since the civil war. The voting happens not at polling stations but at the benches, in the pits, on the docks and in the barracks: every worker, farmer and soldier has a vote, including those who swam the Mississippi three months ago.\n\nThe count takes nine days, because every ballot must be tallied jointly by delegates of two different federations. That rule was born of the federations' mutual distrust, and it turns out to be the most convincing thing about the election.\n\nThe result: Reuther's Builders take fifty-four per cent of the delegate seats, Foster's Liberators thirty-one, the rest going to regional federations. Foster's statement conceding the result is one sentence long: \"We lost the vote. We did not lose the argument.\"\n\nThe papers on the far bank do not mention it at all. But in the Black churches of Memphis, Vicksburg and New Orleans the news is passed along: over the river, yesterday, six million people voted."
 krcw_wca_10.a:0 "This is what we wanted America to see."
 krcw_wca_10.b:0 "The election is over. Now let us talk about crossing the river."
 krcw_wca_14_t:0 "A Liberator Majority"
 krcw_wca_14_d:0 "In October 1950 the east bank holds its first federation-wide delegate election since the civil war. The voting happens at the benches, in the pits, on the docks and in the barracks, every ballot tallied jointly by delegates of two different federations, and the count takes nine days.\n\nThe result: Foster and Cannon's Liberators take a majority of the delegate seats, carried by the southern textile districts, the Kentucky coalfields and the veterans' association. Reuther's Builders lead in Detroit and Pittsburgh, and it is not enough. Reuther remains chairman of the executive, and the first sitting of the new Congress puts \"preparations for the crossing\" on the agenda.\n\nReuther's statement conceding the result is one sentence long: \"The delegates have voted, and the executive will carry it out.\""
 krcw_wca_14.a:0 "Carry out the Congress resolution: set up a crossing preparations committee."
 krcw_wca_14.b:0 "The executive costs the crossing first, then puts it to the Congress."
 krcw_wca_11_t:0 "Detroit Against Pittsburgh"
 krcw_wca_11_d:0 "The auto federation demands steel at last year's clearing price. The steel federation replies that last year's price was calculated on wartime coal, and the miners are now demanding a new rate. All three federations denounce one another in their own newspapers for \"betraying the solidarity of the workers\".\n\nThe Congress arbitration committee meets eleven times. Before the twelfth sitting, the Detroit shop committees announce that until the steel question is settled they will buy from Canada.\n\nThis is not class struggle; it is a war between bookkeepers. But if it goes on, the industrial plan the east bank is so proud of will dissolve into a heap of local ledgers that do not add up."
 krcw_wca_11.a:0 "Impose Congress arbitration and publish the books."
 krcw_wca_11.b:0 "Let them settle it themselves. Central meddling only makes it worse."
 krcw_wca_11.c:0 "Approve the Detroit purchase from Canada."
 krcw_wca_12_t:0 "Winter in Appalachia"
 krcw_wca_12_d:0 "The cruelest fighting of the civil war happened here. Four years on, the railway into Harlan County still stops at the gap, water stands in the dynamited pits, and in the burnt-out towns there are children who have grown up in tents.\n\nThe reconstruction committee sends up two contradictory reports. The first says that spending here is waste: the same steel would build three times as many trucks in Detroit. The second is one page long, written by the local union, and it ends with a sentence: \"In the civil war it was us hill people who stopped Long's armour for New York.\"\n\nBoth reports are on Reuther's desk."
 krcw_wca_12.a:0 "Rebuild Appalachia. We owe them."
 krcw_wca_12.b:0 "Detroit first. The mountains can wait a few more years."
 krcw_wca_13_t:0 "The Tenth Year"
 krcw_wca_13_d:0 "Four years since the armistice, ten since the war began. A union paper in New York does something nobody expected: it runs a readers' column titled \"What do you want to happen next year?\"\n\nThe editors expected letters about production quotas and housing. Of the twelve thousand letters that arrive, more than half say the same thing. Let it end. Let my son come home. Let the ferries run again; my sister is on the St. Louis side and I have not seen her in six years.\n\nThe column is read aloud at the Congress. By the third letter nobody in the hall is talking."
 krcw_wca_13.a:0 "Send the letters to the armistice commission."
 krcw_wca_13.b:0 "This is weariness, not policy. Step up political education."
 krcw_mississippi_line_cat:0 "The Mississippi Line"
 krcw_mississippi_line_cat_desc:0 "From Minnesota to Louisiana, eighteen hundred miles of river cut America in two. Every provocation and every concession on the line changes the odds of a new war.\n\nCurrent tension: [?global.krcw_ohio_tension] (at 85 the front commanders will ask for authorization to attack)"
 krcw_us_line_propaganda:0 "Broadcast Across the River"
 krcw_us_line_propaganda_desc:0 "Turn the transmitters on the far bank. The west broadcasts dispossessed farmers and prayers from the churches; the east broadcasts jazz, union news and recordings of officials taking bribes. Cheap, effective, and guaranteed to double the other side's irritation."
 krcw_us_line_raid:0 "Send a Raiding Party Across"
 krcw_us_line_raid_desc:0 "Rubber boats in the dark, a substation or a stretch of track blown, and back before dawn. The army learns something, the other bank loses something, and one more crack opens in the armistice."
 krcw_us_line_fortify:0 "Fortify the River Line"
 krcw_us_line_fortify_desc:0 "Concrete pillboxes, anti-tank ditches, searchlight towers. Fortifications start no wars, but they make the other side's staff cross \"quick victory\" off the plan, and that is a kind of peace in itself."
 krcw_us_line_reopen_ferries:0 "Reopen the Ferries"
 krcw_us_line_reopen_ferries_desc:0 "Let the ferries run again: families separated for six years visiting across the water, farmers selling beef into the cities on the other bank. Every ferry back in service makes the next war harder to start."
 krcw_us_line_restart_war:0 "Tear Up the Armistice"
 krcw_us_line_restart_war_desc:0 "The armistice into the fire, the pontoons into the water. The second phase of the American Civil War begins this morning.\n\nThere is no taking this back."
 krcw_us_foreign_supply:0 "Aid From Abroad"
 krcw_us_foreign_supply_desc:0 "The east bank has three quarters of the continent's steel; the west bank has oil, manpower and a Russian ally willing to lend machine tools. Much of this contest will be decided outside America."
 krcw_usa_veracruz_convoy:0 "The Veracruz Convoy"
 krcw_usa_veracruz_convoy_desc:0 "Russian freighters unload machine tools, trucks and whole arsenal fittings at Veracruz, and Mexican railways carry them across the Rio Grande. The west bank has far fewer plants, but every one of them can be fitted with the newest Russian machinery."
 krcw_usa_oil_for_machines:0 "Oil For Machines"
 krcw_usa_oil_for_machines_desc:0 "Crude from East Texas and the Permian Basin goes by tanker to Vladivostok and Odessa, and comes back as machine tools, bearings and complete refinery plant. Oil is the one thing the west bank has that the east bank does not."
 krcw_usa_share_the_wealth_drive:0 "Share Our Wealth Drive"
 krcw_usa_share_the_wealth_drive_desc:0 "Every family drawing the homestead allowance owes a son to the National Guard. Long calls it \"the exchange of rights and duties\", and the farmers of the West and South think it fair. It is the west bank's only answer to the east bank's industry: men."
 krcw_wca_st_lawrence_accord:0 "The St. Lawrence Accord"
 krcw_wca_st_lawrence_accord_desc:0 "The plants on both shores of the Great Lakes merge their dispatch centres. Canadian nickel, uranium and timber come down the St. Lawrence, and Detroit trucks go back up it."
 krcw_wca_clearing_union_credits:0 "Paris Clearing Union Credits"
 krcw_wca_clearing_union_credits_desc:0 "Through the Clearing Union, Detroit trucks settle directly against Lyon machine tools and Manchester motors without first becoming anybody's gold. A workers' world market plugs the east bank into the globe."
 krcw_wca_underground_railroad:0 "The New Underground Railroad"
 krcw_wca_underground_railroad_desc:0 "Across the water from Memphis, Vicksburg and New Orleans, the reception committees light lamps at night. Those who cross are Black families, members of outlawed unions and deserters. They bring the West's skills, and a bone-deep memory of Long's machine."
 krcw_wca_mexican_railwaymen:0 "The Mexican Railwaymen"
 krcw_wca_mexican_railwaymen_desc:0 "Russian arms reach the west bank only by Mexican railway, and Mexican railways run only because railwaymen run them. The syndicates have friends in the railway union who remember Zapata and Villa. A wagon a week late is worth more than a raid across the river."
 JAP_krcw_kishi_desc:0 "The \"Monster of Shōwa\". A control-faction economic bureaucrat who ran Manchurian industry and home munitions in wartime and narrowly escaped the reckoning after the defeat. He now leads the National Spirit League, governing through the machinery of the Ministry of Commerce rather than the ballot box. He wants to restore the Empire's strength without letting soldiers like Ishiwara drag the nation into another war; how long he can balance the two, even he does not know."
 MEX_krcw_maximino_desc:0 "The elder brother of President Ávila Camacho, greedier and harder than his sibling. He has made the Revolutionary Party his private property, taking his cut from every railcar on the Tampico corridor and answering all opposition with intimidation and bribery. To him the Cold War is not a clash of ideologies but a business: so long as Russian tanks and Long's dollars keep crossing, Mexico prospers and the Camacho family rules."
 JAP_krcw_ishibashi:0 "Tanzan Ishibashi"
 JAP_krcw_ishibashi_desc:0 "A liberal economist and long-time editor of the Oriental Economist. As early as the 1920s he argued for giving up Manchuria and Korea — \"Little Japan-ism\", he called it, holding that colonies were a money-losing burden and that Japan's future lay in trade, not conquest. History has proved him right, and he has become the banner of the Diet liberals: a Japan grown rich on commerce, without an empire."
 JAP_krcw_katayama:0 "Tetsu Katayama"
 JAP_krcw_katayama_desc:0 "A Christian socialist and lawyer, leader of the Social Masses Party. The Japan he dreams of is a parliamentary democracy with legal unions, peasants who own their land and an army that obeys the cabinet. In a Tokyo packed with demobbed soldiers and right-wing societies such a dream looks fragile, but it is that fragility which draws the young to him."
 JAP_krcw_yoshida:0 "Shigeru Yoshida"
 JAP_krcw_yoshida_desc:0 "A seasoned diplomat and the pivot of the Conservative Merger. He believes Japan should keep its armaments to a minimum and pour all its energy into making money, letting others bear the cost of confrontation — \"let the young go into trade\", as he puts it, \"and leave the fighting to fools\". He trusts neither Moscow nor Paris, only a strong Japanese merchant fleet and a balanced ledger."
 MEX_krcw_cardenas:0 "Lázaro Cárdenas"
 MEX_krcw_cardenas_desc:0 "The former president who nationalised the oil and gave the land to the ejidos. From his Michoacán ranch he watches the Camacho family turn the revolution into a business, and finds it ever harder to stay silent. Peasants, railwaymen and young officers see in him what the revolution was supposed to become: a Mexico that is no superpower's corridor."
 MEX_krcw_lombardo:0 "Vicente Lombardo Toledano"
 MEX_krcw_lombardo_desc:0 "Founder of the Confederation of Mexican Workers and the embodiment of syndicalist ideas in Mexico. He openly praises the Combined Syndicates in New York and argues that Mexico's railwaymen and miners should take over their own workplaces. The corridor carries Russian tanks daily, and also the ideas he borrows from the Syndicates; to Camacho he is more dangerous than any of Long's enemies."
 MEX_krcw_aleman:0 "Miguel Alemán Valdés"
 MEX_krcw_aleman_desc:0 "The face of a new generation of party men: lawyer, businessman, the first presidential prospect who never wore a uniform. He cares nothing for land reform or workers' rights, only for growth, dams, highways and the factories of the north. In his hands the Revolutionary Party becomes an efficient and thoroughly corrupt engine of modernisation — the perfect dictatorship."
 MEX_krcw_amaro:0 "Joaquín Amaro"
 MEX_krcw_amaro_desc:0 "The man who turned Mexico's revolutionary guerrilla bands into a regular army. He rebuilds the officer corps with Russian equipment and Prussian drill, insisting on \"civilian supremacy\" — so long as the civilians do not touch the army's budget. The Northern Border Command is his work: a force that can hold off both Long's deserters and the Combined Syndicates' volunteers."
 PSA_krcw_martin:0 "Clarence Martin"
 krcw_psa_lean_ti_focus_tt:0 "The Coalition leans toward the Internationale"
 krcw_psa_lean_ma_focus_tt:0 "The Coalition leans toward the Moscow Accord"
 krcw_psa_the_presidio:0 "Sacramento and the Presidio"
 krcw_psa_the_presidio_desc:0 "In January 1949 Earl Warren is sworn in as President in Sacramento, promising to end the War Powers Act. In the Presidio at San Francisco MacArthur still runs the port military districts as commander of the Western Defense Command, and his Presidio men do not mean to give them up."
 krcw_psa_martial_law_review:0 "Review the War Powers Act"
 krcw_psa_martial_law_review_desc:0 "President Warren asks Congress and the Supreme Court to form a joint committee to review, order by order, what the Western Defense Command has decreed in the military districts since 1942. The Bar Association has waited years for this; MacArthur's staff answer that orders given in war are not for lawyers to review."
 krcw_psa_recall_the_legislature:0 "Return the Ports to Civil Government"
 krcw_psa_recall_the_legislature_desc:0 "The mayors and police of San Francisco, Oakland, Los Angeles and Seattle take back the daily running of the military districts, and the governors recover the port budgets. The Presidio men warn that the first strike on the waterfront will be more than civil government can handle."
 krcw_psa_the_proconsulate:0 "Widen the Military Districts"
 krcw_psa_the_proconsulate_desc:0 "Congress renews the War Powers Act once more and adds the Los Angeles factory districts and the Nevada mines to the military districts under the Western Defense Command. The joint committee's review is shelved. MacArthur tells the press: \"Democracy is a peacetime luxury.\""
 krcw_psa_the_longshoremen:0 "Deal with the Longshoremen's Union"
 krcw_psa_the_longshoremen_desc:0 "The dock unions of San Francisco, Oakland and Seattle have never obeyed the military districts, and Harry Bridges has men on every ship. Civil government can negotiate contracts with them; the districts can make arrests. New York is watching which Sacramento chooses."
 krcw_psa_constitution_in_exile:0 "Display the Constitution"
 krcw_psa_constitution_in_exile_desc:0 "After the putsch of 1936, staff of the National Archives crated the 1787 Constitution and carried it west. Congress puts it on display in the rotunda of the Capitol in Sacramento, and every Sunday the queue runs from the doors down Capitol Mall."
 krcw_psa_pacific_economy:0 "The Pacific Economy"
 krcw_psa_pacific_economy_desc:0 "The West Coast is cut off from the eastern factories and the Texas oilfields. California oranges, Oregon timber and Washington aluminium must find new buyers."
 krcw_psa_los_angeles_aircraft:0 "The Los Angeles Aircraft Works"
 krcw_psa_los_angeles_aircraft_desc:0 "Lockheed, Douglas and North American stayed in Los Angeles. They have lost the federal contracts, but Congress urgently needs an air force, and General Arnold gives them the orders."
 krcw_psa_columbia_power:0 "Columbia River Power"
 krcw_psa_columbia_power_desc:0 "Grand Coulee and Bonneville make enough power to bring the aluminium works of the Northwest back to life."
 krcw_psa_central_valley_farms:0 "Central Valley Farms"
 krcw_psa_central_valley_farms_desc:0 "The Central Valley canals are finished. At least the West Coast need not fear for its bread."
 krcw_psa_nevada_mines:0 "The Nevada Mines"
 krcw_psa_nevada_mines_desc:0 "The copper, tungsten and silver of Nevada are worked again. Every ton of ore is a chip at the bargaining table."
 krcw_psa_golden_gate_prosperity:0 "Expand the Pacific Trade"
 krcw_psa_golden_gate_prosperity_desc:0 "Pacific shipping pours into San Francisco Bay, and the customs duties give Sacramento its first budget surplus. Congress puts the money into the ports and railways; the Democrats want part of it for a dockers' pay rise."
 krcw_psa_pacific_fleet_command:0 "Pacific Fleet Command"
 krcw_psa_pacific_fleet_command_desc:0 "Admiral Nimitz's Pacific Fleet is the one force the Coalition holds that matches either of the other two Americas; in 1936 it followed the West Coast governors and refused to recognise the putsch in Washington. The yards at San Diego and Bremerton must keep running."
 krcw_psa_sierra_line:0 "The Sierra Line"
 krcw_psa_sierra_line_desc:0 "The passes between the Rockies and the Sierra are the only road for Long's army. The engineers begin pouring concrete."
 krcw_psa_national_guard:0 "The Western National Guard"
 krcw_psa_national_guard_desc:0 "Congress passes a draft law: every eighteen-year-old man on the West Coast serves a year in the National Guard. The governors run the training and Marshall's staff the organisation, while the Western Defense Command demands the Guard be placed under the military districts."
 krcw_psa_alaska_garrison:0 "The Alaska Garrison"
 krcw_psa_alaska_garrison_desc:0 "Alaska is eighty kilometres from Russia. The garrison there is both the Coalition's outpost and a chip in any bargain with Moscow."
 krcw_psa_between_two_americas:0 "Receive the Envoys"
 krcw_psa_between_two_americas_desc:0 "New York's envoys come by train from the east, New Orleans's by plane from the south, Paris's and Moscow's by sea. President Warren receives each of them in Sacramento, and the Senate Foreign Relations Committee demands to see every proposal."
 krcw_psa_paris_credits:0 "Take Paris Shipyard Credits"
 krcw_psa_paris_credits_desc:0 "The Paris Clearing Union will extend credit to the West Coast yards, on condition that the dock union leaders held by the military districts are released."
 krcw_psa_russian_oil:0 "Russian Oil"
 krcw_psa_russian_oil_desc:0 "Tankers from the Russian Far East begin to call at Long Beach. Moscow asks only one thing: that the airfields of Alaska one day open for \"common defence\"."
 krcw_psa_the_third_america:0 "Declare the Coalition Neutral"
 krcw_psa_the_third_america_desc:0 "In a broadcast from Sacramento President Warren declares that the Constitutional Coalition will join no bloc and recognise neither New York nor New Orleans as the government of all America. The envoys of Paris and Moscow are shown back to their ships, and Congress votes to expand the National Guard."
 krcw_psa_choose_new_york:0 "Turn to New York"
 krcw_psa_choose_new_york_desc:0 "The dock unions and the Democratic left have the votes in Congress. Rather than wait for a general strike to bring the government down, Sacramento can negotiate its own terms for joining the Internationale."
 krcw_psa_choose_new_orleans:0 "Ally with New Orleans"
 krcw_psa_choose_new_orleans_desc:0 "Long's terms lie on the table: the West Coast states keep their governors and their seats in Congress, the Pacific Fleet joins the navy of the United States, and MacArthur gets a marshal's baton. For the first time the conservative Republicans in Congress debate the terms seriously."
 krcw_psa_the_generals_age:0 "Discuss MacArthur's Retirement"
 krcw_psa_the_generals_age_desc:0 "MacArthur is sixty-nine, and Marshall and the constitutionalists in Congress both want him retired. The Presidio men fear that when the general goes, the War Powers Act goes with him. Who takes the Western Defense Command, Wainwright, Nimitz's fleet or Congress itself, has first to be fought out in Sacramento."
 krcw_psa_the_constitutional_convention:0 "The Constitutional Convention"
 krcw_psa_the_constitutional_convention_desc:0 "Delegates of the western states meet in Sacramento to review every wartime law passed since 1936: repeal the War Powers Act, abolish the port districts, and settle to whom the Western Defense Command answers. The Presidio men say this pulls down the defences before the war is over."
 krcw_psa_the_perpetual_emergency:0 "The Perpetual Emergency"
 krcw_psa_the_perpetual_emergency_desc:0 "Congress stops renewing the War Powers Act year by year and makes it run until the war is over. MacArthur tells the hearings: \"So long as a regime across the Mississippi still calls itself America, the emergency cannot end.\" President Warren lacks the votes to veto it and signs."
 krcw_psa_the_presidio_takes_over:0 "The Presidio Takes Over"
 krcw_psa_the_presidio_takes_over_desc:0 "Wainwright and Halsey bring the Presidio officers to the President: Congress cannot hold the West Coast, and the Western Defense Command must take over the government until the war is won. Marshall and Nimitz do not move to stop them. Congress will go into recess, the elections are postponed, and MacArthur will chair a military council."
 krcw_psa_seattle_aerospace:0 "Seattle Aerospace"
 krcw_psa_seattle_aerospace_desc:0 "Boeing's engineers turn from bombers to jets and rockets. Congress funds a wind tunnel and a rocket range at Seattle, and General Arnold wants a bomber that can fly from Alaska to Siberia."
 krcw_psa_the_pacific_rim_trade:0 "The Pacific Rim Trade"
 krcw_psa_the_pacific_rim_trade_desc:0 "Japanese machine tools, Chinese silk and Antipodean wool all pass through San Francisco Bay, and Congress cuts the transit duties. New York and New Orleans both complain that Sacramento trades with the other's allies."
 krcw_psa_carrier_task_forces:0 "Carrier Task Forces"
 krcw_psa_carrier_task_forces_desc:0 "Halsey insists the future of the Coalition rides on carrier decks. The yards at San Francisco and San Diego lay down new keels."
 krcw_psa_the_silent_service:0 "Build the Submarine Force"
 krcw_psa_the_silent_service_desc:0 "The Coalition cannot afford a surface fleet to match either rival, but submarines are cheap and can make any blockade of San Francisco Bay costly."
 krcw_psa_court_hawaii:0 "Courting Hawaii"
 krcw_psa_court_hawaii_desc:0 "The independent Republic of Hawaii commands the mid-Pacific. In 1941 Governor Stainback refused to recognise Sacramento; half the ships at Pearl Harbor sailed for the mainland and half stayed. President Warren wants to negotiate a joint defence arrangement with Honolulu."
 krcw_psa_the_pacific_pact:0 "Sign the Pacific Defence Treaty"
 krcw_psa_the_pacific_pact_desc:0 "President Warren proposes a defence treaty to Tokyo, Canberra and Honolulu: if either bloc attacks one of them, the others open their ports and send supplies. There is no standing command, only a joint patrol plan."
 krcw_psa_30_t:0 "After the General"
 krcw_psa_30_d:0 "The Senate Armed Services Committee holds hearings on MacArthur's retirement. Wainwright wants a Presidio man to succeed him at the Western Defense Command, Nimitz proposes a joint command of fleet and army, and Marshall wants the command abolished and the districts returned to Congress. President Warren must send one plan to Congress for a vote."
 krcw_psa_30.a:0 "Wainwright succeeds to the Western Defense Command"
 krcw_psa_30.b:0 "A joint command of fleet and army"
 krcw_psa_30.c:0 "Abolish the command; the districts go back to Congress"
 krcw_psa_32_t:0 "The Sacramento Charter"
 krcw_psa_32_d:0 "The convention delegates argue for six weeks. The Presidio men demand the Western Defense Command keep its emergency powers, the constitutionalists demand the repeal of the War Powers Act, and the dock unions want labour rights written in. The final draft is a compromise, and both houses of Congress must vote on it."
 krcw_psa_32.a:0 "Repeal the War Powers Act"
 krcw_psa_32.b:0 "Keep the Western Defense Command's emergency powers"
 krcw_psa_34_t:0 "The Answer from Pearl Harbor"
 krcw_psa_34_d:0 "Honolulu replies. The Republic of Hawaii will not give up its independence, but will discuss one thing: that the half-fleet still at Pearl Harbor share bases and yards with the Coalition. Not a merger, but no longer a separation."
 krcw_psa_34.a:0 "Shared bases, a shared Pacific"
 krcw_psa_34.b:0 "The fleet, without conditions"
 krcw_psa_fleet_cat:0 "Pacific Fleet Deployments"
 krcw_psa_fleet_cat_desc:0 "The Coalition's one trump card is its fleet. Where it anchors is a message to someone."
 krcw_psa_show_the_flag:0 "Cruise the Golden Gate"
 krcw_psa_show_the_flag_desc:0 "The fleet steams in review outside San Francisco Bay, showing rivals east and west alike that the Coalition is still here."
 krcw_psa_escort_pacific_trade:0 "Escort the Pacific Trade"
 krcw_psa_escort_pacific_trade_desc:0 "The fleet escorts the Pacific Rim's merchantmen. For once the neutral's flag is more welcome than a great power's."
 krcw_psa_alaska_patrol:0 "The Alaska Patrol"
 krcw_psa_alaska_patrol_desc:0 "Submarines prowl the Bering Strait. Moscow knows any move past Alaska must first reckon with the Coalition's fleet."
 krcw_psa_constitutional_guardian:0 "Guardian of the Constitution"
 krcw_psa_constitutional_guardian_desc:0 "Sacramento calls itself the only constitutional government of the United States, and Congress opens every session with a reading of the Constitution. West Coast people will pay taxes and serve for that document; New York and New Orleans call it an old piece of paper."
 krcw_psa_military_council:0 "The Military Council"
 krcw_psa_military_council_desc:0 "Congress is in recess and the elections are postponed; the military council under MacArthur exercises the powers of the President until the war is over. The governors stay in office, but every state capitol has its officers from the Western Defense Command."
 krcw_psa_36_t:0 "The Presidio Takes Over"
 krcw_psa_36_d:0 "In the night the Western Defense Command's troops surround the Capitol in Sacramento. Wainwright hands President Warren a letter: Congress cannot defend the West Coast, and until the war is over a military council under MacArthur will exercise the powers of the President. Marshall stays inside the War Department, and Nimitz keeps his fleet in harbour."
 krcw_psa_36.a:0 "Warren signs and takes ship for Honolulu"
 krcw_psa_36.b:0 "Warren refuses to sign and is taken to the Presidio"
 krcw_psa_pacific_neutrality:0 "Pacific Neutrality"
 krcw_psa_pacific_neutrality_desc:0 "Both blocs guarantee the neutrality of the Constitutional Coalition. The ports are open to all; the warships exist only for self-defence."
 krcw_ampre_1_t:0 "Why We Did Not Win"
 krcw_ampre_1_d:0 "Ten years ago every syndicalist militiaman believed the war would be over by Christmas. In 1938 the Entente's intervention force came down out of Canada, and we threw it back at Albany and Buffalo; in 1941 the Federal government in Washington collapsed. For a moment the whole of America seemed to be waiting for the red flag.\n\nBut the war did not end. MacArthur broke out west with the remnants of the Federal army, and the constitutional government beyond the Rockies held the Pacific Fleet. Our comrades in Paris committed their divisions on the Elbe and sent us money, ships and British factory equipment. We built armoured workshops in Detroit and Pittsburgh, and the 1942 counteroffensive pushed Long back across the Mississippi.\n\nThen the Russian trains rolled into Texas. After the winter of 1943, Mosin rifles, GAZ trucks and shells poured into Long's hands through Mexico; Savinkov needed an America that could tie down the French. By 1946 Appalachia was scorched earth and neither side had the strength to cross the river. The St. Louis Ceasefire is not peace. It is two exhausted boxers lowering their arms at the same moment."
 krcw_ampre_1.a:0 "We will win the other half of the civil war with our factories."
 krcw_ampre_2_t:0 "Lost in the East, Gained in the Middle"
 krcw_ampre_2_d:0 "When the civil war broke out in 1936, Long held the South. The syndicates pushed south from the Great Lakes, MacArthur's military government was trapped in Washington, and all three sides fought back and forth across the Ohio Valley and Appalachia.\n\nWhen Washington fell in 1937, MacArthur fled to Denver. Long's forces pushed north along the Mississippi, taking St. Louis, Kansas City and the entire Midwest plains. The syndicates chased MacArthur's remnants and could not stop Long's westward expansion. By 1940 Long controlled everything from the Mississippi to the Rockies.\n\nBut the South could not hold. After 1942 the syndicalist armoured columns drove south through the East, and the lines in Georgia and Alabama collapsed one after another. Worse was the rear: black uprisings in the South cut supply lines, and militias dared not enter counties where blacks were the majority. By the winter of 1943 you could hear the guns from New Orleans.\n\nThe Russians saved us. The first munitions train from Tampico rolled into San Antonio, carrying Mosin rifles, GAZ trucks and shells. In 1944 Patton's army held the line at the Mississippi. We kept the middle, and we kept New Orleans. As for east of the Mississippi, that is a matter for the future."
 krcw_ampre_2.a:0 "Every man a king, and that includes the men who helped us."
 krcw_ampre_3_t:0 "The Long March"
 krcw_ampre_3_d:0 "In 1936 MacArthur carried out War Plan White and took Washington with his troops. The governors of the West Coast states refused to recognise the putsch government; the congressmen who reached Sacramento declared a quorum, and Vice President Quentin Roosevelt became acting President. General Marshall offered his services, and the Pacific Fleet stayed on the West Coast with the governors.\n\nWhen Washington fell in 1937, MacArthur flew to Denver. He organised a defence line in the middle, but Long attacked from the south and the syndicates pushed from the east. The Federal forces were caught between two enemies. By 1940 Denver could not hold.\n\nIn August MacArthur flew to San Francisco. The Federal remnants — more than twenty thousand men — retreated west from Colorado, through Utah and the Nevada desert, reaching California after half a year. It was a march through hell: desert, heat, thirst, leaving nearly ten thousand behind.\n\nSacramento accepted them, but the Roosevelt government required MacArthur to give up the independent Federal government name and submit to review for the putsch. MacArthur eventually became commander of the Western Defense Command under civilian oversight. In 1948 Roosevelt did not run again, and Earl Warren was elected President. In January 1949 Warren was sworn in in Sacramento. This government says it is the only constitutional government of the United States."
 krcw_ampre_3.a:0 "Our oath is to the Constitution."
 krcw_ampre_4_t:0 "After Albany"
 krcw_ampre_4_d:0 "In 1938 the exiled King and his government resolved to cross the border and \"save constitutional government in America\". The men who fought that war were Ontario workers and Québec farmers, conscripted and put on trains heading south.\n\nAt Albany the Canadian Expeditionary Force lost three divisions; at Buffalo, two more. In the spring of 1940 Ottawa announced wider conscription. Québec refused, and the Montreal docks and the Hamilton steelworks went out on general strike. Troops bound for the front halted at Kingston and elected their own committees.\n\nThe King fled a second time, to Melbourne. What remained in Canada was a workers' republic born of a failed intervention, and a lesson it will never forget: a war to crush a neighbour's revolution devours the interveners first."
 krcw_ampre_4.a:0 "No one will fight the King's wars again."
 krcw_mex_the_corridor:0 "Control the Transit Corridor"
 krcw_mex_the_corridor_desc:0 "Russian freighters queue at the Tampico docks. The railcars run north via Monterrey to the iron bridge at Laredo; Mexico is the only land route between Long's United States and Moscow. Maximino Ávila Camacho takes his cut from every car."
 krcw_mex_tampico_docks:0 "The Tampico Docks"
 krcw_mex_tampico_docks_desc:0 "Russian engineers enlarge Tampico harbour; the new cranes never stop."
 krcw_mex_monterrey_steel:0 "Monterrey Steel"
 krcw_mex_monterrey_steel_desc:0 "The Monterrey mills roll steel for the northern railways and for Long's tanks."
 krcw_mex_pemex_oil:0 "The National Oil Company"
 krcw_mex_pemex_oil_desc:0 "The oilfields of Veracruz and Tabasco are Mexico's true wealth. They belong to the nation, on paper at least."
 krcw_mex_mexico_city_works:0 "The Capital Works"
 krcw_mex_mexico_city_works_desc:0 "The new industrial district north of Mexico City turns the corridor's profits into factories."
 krcw_mex_accord_arsenal:0 "Build an Accord Arsenal"
 krcw_mex_accord_arsenal_desc:0 "Russian blueprints, Mexican workers, Texan buyers."
 krcw_mex_green_revolution:0 "Spread the Bajío Wheat"
 krcw_mex_green_revolution_desc:0 "New wheat strains in Guanajuato and Jalisco bring down the price of bread in the cities for the first time."
 krcw_mex_the_camacho_machine:0 "Build the Camacho Machine"
 krcw_mex_the_camacho_machine_desc:0 "Maximino is greedier and harder than his brother. Every state committee of the Revolutionary Party reports to him."
 krcw_mex_ejido_question:0 "Decide the Ejido Lands"
 krcw_mex_ejido_question_desc:0 "The ejido lands Cárdenas gave the peasants are being clawed back plot by plot by generals and landlords. Continue, or stop?"
 krcw_mex_hard_hand:0 "The Hard Hand"
 krcw_mex_hard_hand_desc:0 "The Federal Security Directorate opens an office at every rail junction. When New York's leaflets appear, the men who print them disappear."
 krcw_mex_cardenas_returns:0 "Recall Cárdenas"
 krcw_mex_cardenas_returns_desc:0 "The old president walks out of his Michoacán ranch. Peasants, railwaymen and young officers gather round him, demanding the land back for the ejidos and that Mexico be nobody's corridor any more."
 krcw_mex_the_long_border:0 "Reinforce the Northern Border"
 krcw_mex_the_long_border_desc:0 "On the far side of three thousand kilometres of border is an ally that could collapse at any moment."
 krcw_mex_moscow_friendship:0 "Strengthen Ties with Moscow"
 krcw_mex_moscow_friendship_desc:0 "The Russian embassy is the largest foreign mission in Mexico City."
 krcw_mex_new_orleans_partner:0 "Ally with New Orleans"
 krcw_mex_new_orleans_partner_desc:0 "Long calls Camacho \"my Mexican brother\". Camacho calls Long \"my best customer\"."
 krcw_mex_pacific_trade:0 "Pacific Trade"
 krcw_mex_pacific_trade_desc:0 "The ports of Mazatlán and Manzanillo open to shipping from the Constitutional Coalition and Japan."
 krcw_mex_latin_voice:0 "Convene an American States Conference"
 krcw_mex_latin_voice_desc:0 "Mexico City convenes an American states conference. The Argentine and Brazilian delegates come to find out whether Mexico speaks for Moscow or for Latin America."
 krcw_mex_neither_corridor:0 "Tax the Transit Traffic"
 krcw_mex_neither_corridor_desc:0 "Cárdenas declares that Mexico's railways belong to Mexico. Russian cars may still cross, but they pay duty and they are inspected."
 krcw_mex_northern_boom:0 "The Northern Boom"
 krcw_mex_northern_boom_desc:0 "The factories along the Monterrey-Saltillo-Laredo line grow on arms orders and corridor tolls. The north looks more like the United States every year, the south more like it always did."
 krcw_mex_ejido_restored:0 "The Ejidos Restored"
 krcw_mex_ejido_restored_desc:0 "Cárdenas' land reform is pushed through again. The generals and landlords lose the estates they had just clawed back, and for the first time in years millions of peasants believe what the Revolutionary Party tells them."
 krcw_mex_one_party:0 "The Perfect Dictatorship"
 krcw_mex_one_party_desc:0 "The Revolutionary Party wins every election, because it is the election. The opposition may exist, print newspapers and hold a few seats, but it will never hold the presidency."
 krcw_mex_sindicalist_ferment:0 "Sindicalist Ferment"
 krcw_mex_sindicalist_ferment_desc:0 "The railway, mining and teachers' unions read leaflets smuggled from New York. The corridor carries Russian tanks, but it also carries the ideas of the Combined Syndicates."
 krcw_mex_northern_industry:0 "Industrialise the North"
 krcw_mex_northern_industry_desc:0 "The corridor's profits have two destinations: the blast furnaces of Monterrey, or land in the hands of southern peasants. The northern generals and industrialists know which they prefer."
 krcw_mex_southern_land:0 "Land Reform in the South"
 krcw_mex_southern_land_desc:0 "The Indian villages of Chiapas and Oaxaca still litigate for land that should have been theirs since 1857. Give it to them, and the northern landlords will rage, but the south will grow quiet."
 krcw_mex_electrify:0 "Rural Electrification"
 krcw_mex_electrify_desc:0 "The Federal Electricity Commission runs wire to every town in the Bajío. On the night the bulbs come on, the Revolutionary Party gains a few hundred votes in every village."
 krcw_mex_pemex_expansion:0 "Develop the Campeche Fields"
 krcw_mex_pemex_expansion_desc:0 "New fields are found in the Bay of Campeche. The National Oil Company hires Russian drilling engineers and American geologists alike, and the books are kept by the president's brother-in-law."
 krcw_mex_bank_of_mexico:0 "The Bank of Mexico"
 krcw_mex_bank_of_mexico_desc:0 "Corridor tolls are paid in dollars, arms orders settled in rubles, peasants repay in pesos. The Bank of Mexico must juggle all three, endlessly."
 krcw_mex_russian_equipment:0 "Russian Equipment"
 krcw_mex_russian_equipment_desc:0 "Of the tanks in transit, one in twenty is \"damaged in shipment\" and then appears in the Mexican Army's order of battle. The Russians look the other way; better here than elsewhere."
 krcw_mex_officer_academy:0 "Buy Off the Officer Corps"
 krcw_mex_officer_academy_desc:0 "Mexican generals are used to keeping private armies. The Revolutionary Party buys off the most dangerous with pensions, embassies and shares, and sends the rest to the academy to relearn \"civilian supremacy\"."
 krcw_mex_border_command:0 "The Northern Border Command"
 krcw_mex_border_command_desc:0 "Three thousand kilometres of border, and on the far side a civil war that could reignite any day. The Northern Command must guard against both Long's deserters and the Combined Syndicates' volunteers."
 krcw_mex_single_party:0 "Reorganise the Revolutionary Party"
 krcw_mex_single_party_desc:0 "Remake the Revolutionary Party from a coalition of factions into a machine: labour, peasant and military sectors, the president naming his successor, the successor the next. The opposition exists forever, and loses forever."
 krcw_mex_open_the_system:0 "Open the System"
 krcw_mex_open_the_system_desc:0 "Younger party men argue that rather than steal every election forever, the party should win one real election. It is a gamble: the machine might lose."
 krcw_mex_sindicalist_question:0 "Deal with the Syndicalists"
 krcw_mex_sindicalist_question_desc:0 "There are more and more sindicalists in the railway and mining unions. The government can crush them and drive them into New York's arms, or bring them into the party and gamble that it can tame them."
 krcw_mex_diversify_trade:0 "Diversify the Trade"
 krcw_mex_diversify_trade_desc:0 "Trading only with Russia and Long is too dangerous. Mexican oil, silver and cotton can be sold to anyone: the Constitutional Coalition, Japan, even the syndicalists in New York."
 krcw_mex_court_the_syndicates:0 "A Hand to the Syndicates"
 krcw_mex_court_the_syndicates_desc:0 "If Long's America collapses, Mexico does not want to be on the losing side. Quietly, couriers from Mexico City begin to pass to New York. Treason, or foresight?"
 krcw_mex_latin_leadership:0 "Seek Latin American Leadership"
 krcw_mex_latin_leadership_desc:0 "Argentina is too far, Brazil too large, Chile too red. Mexico has oil, industry and a capital that can host a conference; it means to be the voice that says \"no\" to both superpower blocs for all of Latin America."
 krcw_mex_10_t:0 "The Iron Bridge at Laredo"
 krcw_mex_10_d:0 "Every night a freight train under canvas tarpaulins crosses the iron bridge at Laredo into Long's Texas. On this side stands a Russian attaché, on that side a Union Party officer, and between them a Mexican customs man counting cars; every car he counts is money. Lately, though, the New York papers have begun to print photographs of the bridge."
 krcw_mex_10.a:0 "Increase the throughput"
 krcw_mex_10.b:0 "Tighten the inspections"
 krcw_mex_11_t:0 "The Old Man of Michoacán"
 krcw_mex_11_d:0 "Lázaro Cárdenas never truly left politics. On his Michoacán ranch he receives railwaymen, Indian village heads and young officers, and listens to them complain of the corridor, the landlords and the graft. The party's current chairman sends word asking him to \"stay silent\"; the old man replies with one line: \"I was silent fifteen years. That is enough.\""
 krcw_mex_11.a:0 "Bring the Cardenistas into the fold"
 krcw_mex_11.b:0 "Isolate him"
 krcw_mex_12_t:0 "Election Night"
 krcw_mex_12_d:0 "The count begins. For the first two hours the opposition leads in the cities; then the rural ballots \"arrive\" and the party candidate is \"elected\" with ninety per cent. This time the students of Mexico City take to the streets and the railway union calls a strike. The government must decide whether the machine will keep pretending to be a democracy."
 krcw_mex_12.a:0 "Confirm the machine's victory"
 krcw_mex_12.b:0 "Concede: a real election next time"
 krcw_mex_corridor_cat:0 "The Corridor"
 krcw_mex_corridor_cat_desc:0 "Every arms train in transit is a mixture of diplomacy, money and risk."
 krcw_mex_expand_throughput:0 "Expand the Throughput"
 krcw_mex_expand_throughput_desc:0 "Lay a second track from Tampico to Laredo. The Russians will pay half, Long will depend on you more, and New York will hate you more."
 krcw_mex_skim_the_shipments:0 "Skim the Shipments"
 krcw_mex_skim_the_shipments_desc:0 "Every shipment in transit \"loses\" a little, and the losses go to the Mexican Army's depots. Overdo it, and the Russians will notice."
 krcw_mex_toll_revenue:0 "Collect the Tolls"
 krcw_mex_toll_revenue_desc:0 "Every car pays. The money does not go to the treasury but to the party's election fund and a few generals' Swiss accounts."
 krcw_mex_close_the_corridor:0 "Close the Corridor"
 krcw_mex_close_the_corridor_desc:0 "Lower the barrier on the Laredo bridge. Long's America loses its arms, Moscow loses its route to the Americas, and Mexico is for the first time truly its own."
 krcw_jap_after_the_empire:0 "Resettle the Repatriates"
 krcw_jap_after_the_empire_desc:0 "Korea, Manchuria and Sakhalin are lost and five million people have come home from the mainland. Resettle them and steady the country."
 krcw_jap_repatriates:0 "Resettle the Five Million"
 krcw_jap_repatriates_desc:0 "The settlers, soldiers and officials who came back from the continent need work, housing and an explanation."
 krcw_jap_zaibatsu_revival:0 "The Zaibatsu Revival"
 krcw_jap_zaibatsu_revival_desc:0 "The directors of Mitsui, Mitsubishi and Sumitomo are invited back into the Ministry of Commerce."
 krcw_jap_shipbuilding:0 "Shipbuilding"
 krcw_jap_shipbuilding_desc:0 "At Kure and Nagasaki the slipways lay down tankers and freighters in peacetime for the first time."
 krcw_jap_electronics:0 "Electronics"
 krcw_jap_electronics_desc:0 "Small Tokyo workshops start assembling radios, then radar valves."
 krcw_jap_income_doubling:0 "Take-off"
 krcw_jap_income_doubling_desc:0 "The Ministry of Commerce's plan: double the national income within ten years."
 krcw_jap_formosa_development:0 "Developing Formosa"
 krcw_jap_formosa_development_desc:0 "The Government-General in Taipei builds railways and sugar mills, and arrests the organisers of the autonomy movement. Every night Nanjing's broadcasts carry across the strait."
 krcw_jap_formosa_self_rule:0 "A Formosan Assembly"
 krcw_jap_formosa_self_rule_desc:0 "Better to let the Formosans elect an assembly of their own than let Nanjing win their hearts."
 krcw_jap_fortress_formosa:0 "Fortress Formosa"
 krcw_jap_fortress_formosa_desc:0 "The navy builds batteries on the Pescadores and at Kaohsiung. Formosa is the Empire's last gate."
 krcw_jap_kishi_and_the_generals:0 "Reach Terms with the Generals"
 krcw_jap_kishi_and_the_generals_desc:0 "Ishiwara's generals want an army that can win back the continent; Kishi wants one that keeps him in power. They are not the same thing."
 krcw_jap_rearmament:0 "Rearmament"
 krcw_jap_rearmament_desc:0 "The word \"self-defence\" appears ever more often in the Tokyo papers."
 krcw_jap_taisho_spirit:0 "The Taishō Spirit"
 krcw_jap_taisho_spirit_desc:0 "Liberals and socialists in the Diet rally again and demand party cabinets. They remember the 1920s, when Japan too was a democracy."
 krcw_jap_russian_oil:0 "Import Sakhalin Oil"
 krcw_jap_russian_oil_desc:0 "The Russians sell Sakhalin oil to Tokyo at a fair price. In Moscow they call it \"the enemy of my enemy\"."
 krcw_jap_join_the_accord:0 "Join the Moscow Accord"
 krcw_jap_join_the_accord_desc:0 "Kishi flies to Moscow. The Accord's terms are simple: Japan gives up its claims on Manchuria, and Russia recognises Formosa as Japanese."
 krcw_jap_pacific_neutrality:0 "Declare Armed Neutrality"
 krcw_jap_pacific_neutrality_desc:0 "Japan stays out of the Moscow Accord and defends the home islands and Formosa with its own fleet and security forces, while selling ships and machines to both blocs. The Accord will cut the Sakhalin oil, and the Internationale will not trust Japan any more for it."
 krcw_jap_pacific_markets:0 "Pacific Markets"
 krcw_jap_pacific_markets_desc:0 "Japanese freighters sail for San Francisco, Manila and Sydney."
 krcw_jap_accord_navy:0 "Build a Fleet for the Accord"
 krcw_jap_accord_navy_desc:0 "The Russians have no proper Pacific fleet. Japan has the yards, and the men who can sail."
 krcw_jap_treaty_limits:0 "The Qingdao Treaty Limits"
 krcw_jap_treaty_limits_desc:0 "The 1944 armistice set a ceiling on the Imperial Army: twenty divisions, no heavy equipment, no strategic air force. What the treaty did not set is how much the Ministry of Commerce may spend on a \"police reserve\"."
 krcw_jap_miti_planning:0 "Guidance from the Ministry"
 krcw_jap_miti_planning_desc:0 "The Ministry does not order; it \"guides\". No company dares ignore the guidance: foreign-exchange quotas, import licences and bank credit all live in that building."
 krcw_jap_zaibatsu_restored:0 "The Zaibatsu Restored"
 krcw_jap_zaibatsu_restored_desc:0 "Mitsui, Mitsubishi and Sumitomo again hold the banks, the shipping lines and heavy industry. Efficiency has returned, and so have the pre-war bargains between money and politics."
 krcw_jap_formosa_home_rule:0 "The Formosan Assembly"
 krcw_jap_formosa_home_rule_desc:0 "The assembly in Taipei decides sugar prices, the language of the schools and the appointment of local police. Nanjing's broadcasts have lost half their audience."
 krcw_jap_diet_restored:0 "Party Cabinets"
 krcw_jap_diet_restored_desc:0 "The premier is the leader of the Diet majority, and the bureaucracy can no longer legislate by decree. Taishō Japan has returned; in the newspapers the generals call it \"the second defeat\"."
 krcw_jap_pacific_workshop_spirit:0 "Workshop of the Pacific"
 krcw_jap_pacific_workshop_spirit_desc:0 "Japanese freighters call at every port that does not ask about politics: Manila, Sydney, San Francisco, Valparaíso. Neither bloc can blockade a supplier both of them need."
 krcw_jap_miti_guidance:0 "Let MITI Plan the Industries"
 krcw_jap_miti_guidance_desc:0 "Economists of the Uno school draw the next decade's industrial map inside the Ministry: shipping and steel first, then motor cars and electronics. Private companies may disagree, but the foreign-exchange quotas are the government's."
 krcw_jap_zaibatsu_ascendant:0 "The Zaibatsu Ascendant"
 krcw_jap_zaibatsu_ascendant_desc:0 "Let Mitsui and Mitsubishi decide what to invest in. The government wants tax receipts and export figures; the rest it leaves to families that have been making money since Meiji."
 krcw_jap_taiheiyo_belt:0 "The Pacific Industrial Belt"
 krcw_jap_taiheiyo_belt_desc:0 "From Keihin to Kitakyushu, an industrial corridor along the Inland Sea. Reclaimed land, deep-water wharves, petrochemical complexes: Japan turns its own coastline into a production line."
 krcw_jap_shinkansen:0 "The Bullet Train"
 krcw_jap_shinkansen_desc:0 "The pre-war Railway Ministry drew up its \"bullet train\" to run all the way to Peking. Now it runs only Tokyo to Osaka, at two hundred kilometres an hour, punctual to the second."
 krcw_jap_showa_research:0 "The Shōwa Research Association"
 krcw_jap_showa_research_desc:0 "The wartime Showa Research Association is re-formed, now working on transistors, synthetic fibres and marine diesels."
 krcw_jap_women_in_industry:0 "Improve the Mill Girls' Conditions"
 krcw_jap_women_in_industry_desc:0 "The war took two million young men. Half the labour force in the textile mills, the electronics plants and the department stores is therefore female, which before the war was unthinkable."
 krcw_jap_micronesia_phosphate:0 "Phosphate and Fisheries"
 krcw_jap_micronesia_phosphate_desc:0 "The South Seas islands are the one colony the Empire did not lose. Phosphate, copra and the tuna grounds keep a fishing fleet and a Government-General in business."
 krcw_jap_formosa_integration:0 "Assimilate Formosa"
 krcw_jap_formosa_integration_desc:0 "Japanese schooling, Japanese names, shrine attendance. The Government-General believes that in one more generation the Formosans will forget there is a homeland across the strait."
 krcw_jap_formosa_assembly:0 "Open the Formosan Assembly"
 krcw_jap_formosa_assembly_desc:0 "The Formosan Assembly opens. Members argue over sugar prices, schools and the police, and seldom mention reunion with China."
 krcw_jap_formosa_garrison:0 "The Strait Garrison"
 krcw_jap_formosa_garrison_desc:0 "The Formosa command is reorganised as the First Area Army. Its mission is one line long: hold for forty-eight hours before Nanjing's ships reach the beach."
 krcw_jap_police_reserve:0 "The National Police Reserve"
 krcw_jap_police_reserve_desc:0 "The Qingdao armistice limits the army but says nothing about police. So seventy-five thousand \"policemen\" receive rifles, lorries and field guns."
 krcw_jap_interservice_truce:0 "Reconcile the Army and Navy"
 krcw_jap_interservice_truce_desc:0 "In wartime the army and navy sabotaged each other over oil and aircraft plants; now neither has much left to fight over. For the first time the two staffs share a building."
 krcw_jap_kido_butai:0 "Rebuild the Carrier Striking Force"
 krcw_jap_kido_butai_desc:0 "Four carriers were cut up for scrap at the armistice. The remaining two lie at Kure, waiting for a government willing to pay for them."
 krcw_jap_unify_air_forces:0 "Unify the Air Arms"
 krcw_jap_unify_air_forces_desc:0 "The army and navy air services merge into an independent air arm. The phrase does not appear in the treaty text, which is why it is lawful."
 krcw_jap_jet_prototypes:0 "Develop a Successor to the Kikka"
 krcw_jap_jet_prototypes_desc:0 "Nakajima's engineers hid a set of jet-engine drawings. Ten years later they turn it into the first Japanese jet fighter."
 krcw_jap_f_go:0 "Resume the Fu-Go Research"
 krcw_jap_f_go_desc:0 "Nishina of the Riken burned his notebooks in 1945. What burned was paper, not knowledge. Japan has no uranium, but it has the South Seas phosphate ships and a cohort of physicists still alive."
 krcw_jap_kishi_machine:0 "Build the Economic Bureaucracy"
 krcw_jap_kishi_machine_desc:0 "Kishi does not need a party; he needs bureau chiefs. After the reshuffles in Commerce, Finance and Home Affairs, the National Spirit League becomes a machine that runs itself."
 krcw_jap_form_the_ldp:0 "The Conservative Merger"
 krcw_jap_form_the_ldp_desc:0 "Liberals, the remnants of the Minseitō and the businessmen in the Diet merge into a single party. It does not oppose Kishi's policies, only Kishi deciding them alone."
 krcw_jap_education_reform:0 "Reorganise the Schools"
 krcw_jap_education_reform_desc:0 "The textbook committee rewrites the last chapters of modern history, and how to teach Manchuria becomes the point of contention."
 krcw_jap_yakuza_and_streets:0 "Restore Order in the Streets"
 krcw_jap_yakuza_and_streets_desc:0 "Demobbed soldiers, black-market dealers and right-wing societies fill the burned-out districts. The government can suppress them, or hire them."
 krcw_jap_revanchist_turn:0 "Debate a Return to the Continent"
 krcw_jap_revanchist_turn_desc:0 "Ishiwara's generals say it aloud in the Diet: Manchuria is Japanese, Korea is Japanese, and the treaty is a sheet of paper written by the victors. Kishi does not contradict them; he simply says nothing."
 krcw_jap_pacific_workshop:0 "Export to Both Blocs"
 krcw_jap_pacific_workshop_desc:0 "Non-alignment does not mean isolation. Japan sells ships, machinery and textiles to everyone, to the Internationale's Manila and the Accord's Vladivostok at the same time."
 krcw_jap_yen_bloc:0 "Rebuild the Yen Bloc"
 krcw_jap_yen_bloc_desc:0 "A yen area without colonies: Tokyo lends, and Manila, Bangkok and Jakarta buy Japanese machines and repay in raw materials."
 krcw_jap_micronesia_mandate:0 "Reorganise the South Seas Agency"
 krcw_jap_micronesia_mandate_desc:0 "The Government-General in Palau administers two thousand islands and a hundred thousand people. Its budget comes from phosphate, its defence from a patrol-boat flotilla and a Russo-Japanese understanding nobody wishes to discuss aloud."
 krcw_japfp_10_t:0 "Two Hundred Thousand Before the Diet"
 krcw_japfp_10_d:0 "On the day the treaty revision goes to the Diet, the police string wire around the building. Students, unions and the veterans' associations all come, but they do not want the same thing: some want democracy, some want Manchuria, some only want work. Listening from the residence, Kishi remarks to his secretary: \"At least they are still shouting in Japanese.\""
 krcw_japfp_10.a:0 "Let the Diet vote"
 krcw_japfp_10.b:0 "Send in the police reserve"
 krcw_japfp_10.c:0 "The premier resigns"
 krcw_japfp_11_t:0 "The World's First Shipbuilder"
 krcw_japfp_11_d:0 "In 1953 Japanese launchings pass those of the Union of Britain. On the slipways at Kure, Nagasaki and Yokohama lie Norwegian tankers, Panamanian freighters and one supply ship flying no flag at all, paid for by Russians. At the celebration dinner the head of the Shipbuilders' Association says something true: \"What we lost by winning a war, we are earning back another way.\""
 krcw_japfp_11.a:0 "Plough the profits back into the yards"
 krcw_japfp_11.b:0 "Plough the profits into heavy industry"
 krcw_japfp_12_t:0 "The Chamber in Taipei"
 krcw_japfp_12_d:0 "The first session of the Formosan Assembly runs eleven hours. The Speaker opens in Japanese; the first member to rise speaks Taiwanese for forty minutes and nobody interrupts him. The Governor-General watches from the gallery and says nothing all day. Afterwards he wires Tokyo a single line: \"This is no longer a colony.\""
 krcw_japfp_12.a:0 "Accept the fact"
 krcw_japfp_12.b:0 "Replace the Governor-General"
 krcw_jap_formosa_cat:0 "The Administration of Formosa"
 krcw_jap_formosa_cat_desc:0 "Every year the Government-General must choose again between assimilation and self-rule."
 krcw_jap_sugar_quota:0 "Raise the Sugar Quota"
 krcw_jap_sugar_quota_desc:0 "Formosa's sugar mills are the Empire's purse. A higher quota means more foreign exchange, and more cane fields requisitioned."
 krcw_jap_formosa_amnesty:0 "Amnesty for the Autonomy Movement"
 krcw_jap_formosa_amnesty_desc:0 "Release the autonomy organisers held on Green Island. Nanjing loses material for a few editorials; Taipei gains a few members of the assembly."
 krcw_jap_strait_patrol:0 "Patrol the Strait"
 krcw_jap_strait_patrol_desc:0 "Send the destroyer flotilla west of the Pescadores. Nanjing's fishing boats will keep their distance, and the two navies will be twenty miles apart."
 krcw_jap_mandate_subsidy:0 "The South Seas Agency Subsidy"
 krcw_jap_mandate_subsidy_desc:0 "Phosphate revenue cannot keep two thousand islands. Tokyo subsidises the South Seas Government every year, and in exchange keeps a squadron lawfully stationed north of the equator."
 krcw_wca_the_builders:0 "The Builders"
 krcw_wca_the_builders_desc:0 "Reuther's current: build the east bank into a model any American can see across the river. Detroit's autoworkers earn more in real terms than in 1929 while the sharecroppers on the far bank still work behind a mule.\n\"Comrades,\" Reuther told the Ninth Congress, \"we do not have to liberate them. We only have to let them see.\""
 krcw_wca_the_liberators:0 "The Liberators"
 krcw_wca_the_liberators_desc:0 "The current of Foster and Cannon: forty million Americans live under Long's machine across that river, and every year we do not cross it their children get another year of that schooling.\nIts strength is in the veterans' association and the southern textile unions, and its argument is a list: nine hundred and seventy-four union organisers executed on the west bank between 1938 and 1943."
 krcw_wca_one_big_union:0 "One Big Union"
 krcw_wca_one_big_union_desc:0 "A third and the oldest current: the Wobbly tradition. States, parties and even the lines between industrial federations are artificial - the working class should have one organisation.\nIt is rooted among the western miners and the longshoremen, and it is equally scathing about the other two: \"One wants to be a model employer and the other wants to be a general.\""
 krcw_wca_the_long_frontier:0 "The Long Frontier"
 krcw_wca_the_long_frontier_desc:0 "Two thousand kilometres of Mississippi from Itasca to New Orleans, and it is not a frontier that can be closed. A hundred thousand and more cross it every year, in both directions: Black families and sharecroppers going east, and east-bank tradesmen who dislike workers' management going west. Both border services pretend not to see the second kind."
 krcw_wca_the_second_workshop:0 "The Second Workshop"
 krcw_wca_the_second_workshop_desc:0 "The Internationale's industrial centre is the Rhine and the Ruhr; its second workshop is the Great Lakes. Detroit machine tools, Pittsburgh steel, Chicago railway plant - and one thing the Europeans do not have: the assembly methods that make those things cheap enough to sell anywhere."
 krcw_wca_the_three_currents:0 "Call the Three Currents to Debate"
 krcw_wca_the_three_currents_desc:0 "The Syndicates have three currents: Reuther's Builders want to build up the east first, Foster and Cannon's Liberators want to cross soon, and the IWW tradition wants one big union for all North America."
 krcw_wca_the_builders_road:0 "Adopt the Builders' Line"
 krcw_wca_the_builders_road_desc:0 "Build up the east bank's industry first and cross later: cars, housing, factory clinics and universities, photographs of the model cities sent over the river, and all trade across it cut. The Liberators say this drags the war out too long."
 krcw_wca_the_liberators_road:0 "Adopt the Liberators' Line"
 krcw_wca_the_liberators_road_desc:0 "Prepare to cross the Mississippi soon. The Liberators have a list of the union organisers executed on the west bank between 1938 and 1943."
 krcw_wca_one_big_union_road:0 "Merge into One Big Union"
 krcw_wca_one_big_union_road_desc:0 "Abolish the lines between the industrial federations and put all North American workers in one organisation. This current recognises neither the Mississippi nor the Canadian border as a national frontier."
 krcw_wca_the_congress_decides:0 "Keep the Losing Currents Seated"
 krcw_wca_the_congress_decides_desc:0 "The argument over the line ends in a vote. The two losing currents are not purged and keep their seats on the executive."
 krcw_wca_the_losing_currents:0 "Let the Opposition Sit on the Executive"
 krcw_wca_the_losing_currents_desc:0 "The opposition stays on the executive and every policy is argued again. Decisions are slower, and there is always an alternative ready."
 krcw_wca_industrial_democracy_proven:0 "Publish the Industrial Returns"
 krcw_wca_industrial_democracy_proven_desc:0 "Publish the 1953 output figures: steel above 1929, car production doubled, and shorter hours. The Detroit shop system draws the attention of the European comrades."
 krcw_wca_two_thousand_kilometres:0 "Reinforce the Mississippi Frontier"
 krcw_wca_two_thousand_kilometres_desc:0 "The Mississippi runs two thousand kilometres and cannot be sealed. Over a hundred thousand people cross each year in both directions: Black families and sharecroppers eastward, tradesmen unhappy with workers' management westward."
 krcw_wca_the_crossings_east:0 "Receive the Families Crossing East"
 krcw_wca_the_crossings_east_desc:0 "Receive the families fleeing the west bank, most of them Black, with housing, schooling and union-card jobs."
 krcw_wca_the_crossings_west:0 "Investigate the Tradesmen Going West"
 krcw_wca_the_crossings_west_desc:0 "Look into the skilled tradesmen and foremen going west. Most leave because they do not want to be managed by shop votes."
 krcw_wca_the_river_agreement:0 "The Agreement on the River"
 krcw_wca_the_river_agreement_desc:0 "In 1953 the two Americas signed an agreement neither would publish: those who cross are not returned, the border services do not shoot on the water, merchant traffic passes by prewar rules. It has no name and no ceremony and was signed by the two river engineering services rather than by diplomats.\n\nIt held twenty years, for a practical reason: both sides understand that one exchange of fire on this river becomes a war between two blocs immediately, and neither bloc is here."
 krcw_wca_the_line_and_the_council:0 "Bring Workers' Management to the Line"
 krcw_wca_the_line_and_the_council_desc:0 "The shop council votes on the assembly-line tempo once a quarter and it is not changed in between. The workers control the speed and management gets a predictable output."
 krcw_wca_teach_it_to_the_bloc:0 "Spread the Detroit Shop System"
 krcw_wca_teach_it_to_the_bloc_desc:0 "Host union officials and engineers from France, Italy and West Germany, and spread the Detroit shop system."
 krcw_wca_the_automobile_question:0 "Decide the Car Programme"
 krcw_wca_the_automobile_question_desc:0 "Decide whether to put a car within every worker's reach. The Builders are for it; opponents fear that union branches will fall apart once workers move to the suburbs."
 krcw_wca_the_american_question:0 "Draw Up a Contingency Plan for the West"
 krcw_wca_the_american_question_desc:0 "After the 1953 military mutiny on the west bank, the east finds it has no plan at all for taking over. Draw one up."
 krcw_wcad_1_t:0 "A Model Employer and a General"
 krcw_wcad_1_d:0 "On the second day of the 1951 congress the third current's speaker took the platform. He was from the western miners, had organised the 1931 strike in West Virginia and served four years for it.\n\n\"Comrade Reuther wants to build Detroit into a model city. Comrade Cannon wants to cross the river and liberate forty million. I have listened two days and I find you two have one thing in common - you both want a bigger organisation to decide for the workers.\n\nOne of you wants to be a model employer. The other wants to be a general. What we want is one big union.\""
 krcw_wcad_1.a:0 "The Builders: let them see first"
 krcw_wcad_1.b:0 "The Liberators: not another ten years"
 krcw_wcad_1.c:0 "One big union"
 krcw_wcad_3_t:0 "The Losers Do Not Disappear"
 krcw_wcad_3_d:0 "The evening the vote closed, Reuther said something in his closing address that was not in the text.\n\n\"Two currents lost today. Their delegates will sit on the executive tomorrow, their papers will print tomorrow, their organisers will be in the works tomorrow. Some comrades think this is weakness - that a revolutionary government should not keep an opposition.\n\nAcross that river, the men who lose an argument about the line disappear. That is the difference. If we ever lose that difference we will win nothing, because we will have become them.\""
 krcw_wcad_3.a:0 "This is our best propaganda"
 krcw_wcad_3.b:0 "Unity in wartime; revisit this later"
 krcw_wcad_5_t:0 "We Are Keeping an Account"
 krcw_wcad_5_d:0 "A paragraph in the border service's quarterly return was struck out by a superior and circulated anyway in copies. It was written by a lieutenant stationed at the Cairo crossing.\n\n\"Crossings eastward this month, three thousand one hundred, of whom two thousand four hundred are Black families. Crossings westward, four hundred and ten, of whom three hundred and twenty are skilled tradesmen and foremen. I report both figures accurately and I notice only the first appears in the newspapers.\n\nWe are not holding a line. We are keeping an account.\""
 krcw_wcad_5.a:0 "Publish both figures"
 krcw_wcad_5.b:0 "Publish only the eastward figure"
 krcw_wcad_5.c:0 "Find out why the westward ones leave"
 krcw_wcad_7_t:0 "Not Every Worker Wants It"
 krcw_wcad_7_d:0 "The inquiry into why the tradesmen go west produced a very short executive meeting - short because nobody wanted to discuss it at length.\n\nAcross three hundred and twenty exit interviews the reasons are highly consistent: \"a meeting about everything\"; \"I have done this work twenty years and now an elected man of twenty-five tells me how\"; \"I wanted overtime pay and they gave me a roster that had been voted on\".\n\nNot one mentions politics. They are not Long's supporters. They simply do not want to be governed by a vote inside their own section."
 krcw_wcad_7.a:0 "Exempt the trades: no vote on technical matters"
 krcw_wcad_7.b:0 "This is the cost of the revolution; carry on"
 krcw_wcad_7.c:0 "Separate the overtime question from the roster"
 krcw_wcad_8_t:0 "The Tradesmen Keep Going West"
 krcw_wcad_8_d:0 "The border service's quarterly return again lists the westward crossings. Last time the executive did not ask why they leave, and this time the return carries an annex: half the section foremen at two Detroit machine-tool works have gone, and the Pittsburgh rolling mills have started promoting foremen from among the apprentices.\n\nThe works councils want the executive to decide something."
 krcw_wcad_8.a:0 "Open the inquiry now and talk to the colleagues of those who left"
 krcw_wcad_8.b:0 "Check tradesmen's work cards at the crossings"
 krcw_wcad_8.c:0 "Let them go and fill the posts from the apprentices"
 krcw_wcad_9_t:0 "Every Car Takes a Branch Apart"
 krcw_wcad_9_d:0 "In the debate over the car programme the opposition produced an argument nobody expected. It came from an old Detroit organiser who had been in the 1937 sit-down.\n\n\"Comrades, I am not against a worker owning a car. I am against not having done the arithmetic. Once a worker moves to the suburbs he is fifteen kilometres from his branch. He no longer passes that tavern, no longer hears a speech at that corner, no longer comes out on a Thursday evening - on Thursday evening he is doing the lawn.\n\nEvery car we build is taking one of our own branches apart. That is a sum to do before we build, not after.\""
 krcw_wcad_9.a:0 "Build the cars, and move the branches to the suburbs"
 krcw_wcad_9.b:0 "Streetcars and subways first"
 krcw_wcad_9.c:0 "Build the cars and let the branches go"
 krcw_wcad_11_t:0 "Forty Million"
 krcw_wcad_11_d:0 "The military mutiny on the west bank in 1953 lasted nine days and left something on the east bank that lasted far longer: a hurriedly assembled contingency paper, and the sentence on its first page that silenced the executive.\n\n\"We claim to represent all Americans. We have never costed the grain, the housing, the teachers or the years that taking in forty million requires. Nor have we ever asked what proportion of those forty million would not wish to be taken in by us.\n\nShould that day come, we shall find ourselves unprepared.\""
 krcw_wcad_11.a:0 "Make the plan properly"
 krcw_wcad_11.b:0 "Plan for the takeover and for not being welcome"
 krcw_wcad_11.c:0 "Make no such plan: the plan itself is a provocation"
 krcw_wca_the_colour_line:0 "The Colour Line"
 krcw_wca_the_colour_line_desc:0 "The Syndicalist Republic inherited a thing it prefers not to discuss: the exclusion practices of the old craft unions. A quarter of the men on the Detroit assembly lines are Black; three per cent of the machinists' union roll is. The families crossing east get into the factories and not into the best-paid trades.\nIt does not exist in the propaganda and everyone in the union halls knows it."
 krcw_wca_one_card_one_trade:0 "One Card, One Trade"
 krcw_wca_one_card_one_trade_desc:0 "The 1952 industrial union congress carried the uniform membership clause by forty-one votes: trades open regardless of colour, apprenticeships by order of application, and locals in breach lose their delegate seats.\nThe votes against came from the oldest craft unions and their reason never appeared in the minutes. It took eleven years to pass, and after it took effect the Liberators' vote in the southern textile districts doubled."
 krcw_wca_the_question_in_the_hall:0 "Look into Colour Bars in the Unions"
 krcw_wca_the_question_in_the_hall_desc:0 "A Detroit delegate shows the Congress two rolls from the same plant: a quarter of the assembly line is Black, but three per cent of the machinists' union. Investigate colour bars in the unions."
 krcw_wca_the_uniform_clause:0 "The Uniform Clause"
 krcw_wca_the_uniform_clause_desc:0 "Pass the uniform membership clause: trades open regardless of colour, apprenticeships by order of application, and locals in breach lose their delegate seats."
 krcw_wca_the_southern_locals:0 "Organise the Southern Textile Unions"
 krcw_wca_the_southern_locals_desc:0 "Enforce the uniform clause in the southern textile districts and organise the Black textile workers. The southern unions become the Liberators' firmest source of votes."
 krcw_wca_what_the_radio_can_say:0 "Broadcast the Southern Union Figures"
 krcw_wca_what_the_radio_can_say_desc:0 "Radio Free America begins broadcasting the southern unions' Black membership week by week, along with the wage gap in the same trades on the two banks."
 krcw_wcad_13_t:0 "Both Rolls Are From One Plant"
 krcw_wcad_13_d:0 "The delegate laid both rolls on the platform, went back to his seat and said nothing further. Nobody applauded and nobody contradicted him.\n\nReuther was in the chair. The record shows he was silent nearly a minute, and the first thing he said was not an answer but a question: \"These two rolls - do the other plants have them?\"\n\nThree days later the statistical office answered: thirty-seven major plants, all the same."
 krcw_wcad_13.a:0 "Put the uniform clause on the next agenda"
 krcw_wcad_13.b:0 "Leave it to the locals to settle themselves"
 krcw_wcad_13.c:0 "Publish the thirty-seven rolls first"
 WCA_krcw_cannon_desc:0 "Leader of the Liberators and an old Wobbly organiser. He wants to cross the Mississippi soon, because union organisers on the west bank are being executed."
 WCA_krcw_flynn_desc:0 "An old IWW organiser trusted by the western miners and the longshoremen. She wants the lines between the industrial federations abolished and one big union for all North America."
 krcw_wca_party_builders:0 "CSA (Builders)"
 krcw_wca_party_builders_long:0 "Combined Syndicates of America (Builders)"
 krcw_wca_party_liberators:0 "CSA (Liberators)"
 krcw_wca_party_liberators_long:0 "Combined Syndicates of America (Liberators)"
 krcw_wca_party_obu:0 "One Big Union"
 krcw_wca_party_obu_long:0 "Industrial Workers of the World (North America)"
 krcw_wca_the_model_city_programme:0 "Start the Model City Programme"
 krcw_wca_the_model_city_programme_desc:0 "Concentrate housing, hospitals and universities in Detroit, Pittsburgh and Chicago as a showcase for the west bank."
 krcw_wca_the_river_brigades:0 "Form the River Brigades"
 krcw_wca_the_river_brigades_desc:0 "Form river brigades from west-bank union exiles and veterans, trained for river crossings and organising behind the lines."
 krcw_wca_merge_the_federations:0 "Merge the Industrial Federations"
 krcw_wca_merge_the_federations_desc:0 "The auto, steel, mining and transport federations merge into one organisation with branches by district rather than by trade."
 krcw_usa_valley_authority:0 "Missouri Valley Authority"
 krcw_usa_valley_authority_desc:0 "One authority runs the dams, channels and power lines on the Missouri. The Army Engineers and the Bureau of Reclamation both resent it, and the works finally have a single command."
 krcw_usa_valley_authority_2:0 "Missouri Valley Authority: Electrification"
 krcw_usa_valley_authority_2_desc:0 "The authority's lines now reach the farms of the plains. Farmers credit the Kingfish with both the light and the bill."
 krcw_usa_atomic_commission:0 "Atomic Energy Commission"
 krcw_usa_atomic_commission_desc:0 "The commission controls the uranium, the laboratories and weapon design, and its budget bypasses Congress. The generals and the scientists argue in it every week."
 krcw_usa_strategic_deterrent:0 "Strategic Air Command"
 krcw_usa_strategic_deterrent_desc:0 "The west bank has bombs of its own and the bombers to carry them east. New Orleans speaks harder at the table, and the far bank grows more nervous."
 krcw_usa_oil_pension:0 "Oil Pension Fund"
 krcw_usa_oil_pension_desc:0 "Pensions are now paid from a fixed share of oil export revenue. In good years this works; in bad years the treasury borrows."
 krcw_usa_aec:0 "Atomic Energy Commission"
 krcw_usa_uranium:0 "Colorado Plateau Uranium"
 krcw_usa_sandia:0 "Sandia Laboratory"
 krcw_usa_randolph:0 "Randolph Field"
 krcw_usa_bombers:0 "Fort Worth Bombers"
 krcw_usa_radar:0 "Mississippi Radar Line"
 krcw_usa_sac:0 "Strategic Air Command"
 krcw_usa_atomic_energy_commission:0 "Establish the Atomic Energy Commission"
 krcw_usa_atomic_energy_commission_desc:0 "The atomic program is taken from the War Department and given to a commission answering to the president. The Los Alamos scientists wanted civilian control and the War Department wanted a veto; each side got half."
 krcw_usa_colorado_uranium:0 "Mine the Colorado Plateau Uranium"
 krcw_usa_colorado_uranium_desc:0 "The commission buys ore from the Uravan and Moab districts at a guaranteed price and builds roads into the mining country. Prospectors pour into the canyons of Colorado and Utah, and ranchers complain about their water."
 krcw_usa_sandia_and_pantex:0 "Expand Sandia Base and the Pantex Plant"
 krcw_usa_sandia_and_pantex_desc:0 "Design stays at Los Alamos, engineering moves to Sandia Base at Albuquerque, and final assembly goes to the Pantex ordnance plant near Amarillo. The Army guards all three, and the pay is well above the going rate."
 krcw_usa_white_sands_test:0 "Test at White Sands"
 krcw_usa_white_sands_test_desc:0 "Having chosen to build alone, the west bank tests at the White Sands range in New Mexico. After the test New Orleans owes Moscow no data."
 krcw_usa_kazakh_joint_test:0 "Join the Joint Test in Kazakhstan"
 krcw_usa_kazakh_joint_test_desc:0 "Under the agreement with Moscow the first device is shipped to the Kazakh steppe and tested by scientists of both countries. The Russians get all the data; the west bank gets the bomb and more credit."
 krcw_usa_strategic_air_command:0 "Form the Strategic Air Command"
 krcw_usa_strategic_air_command_desc:0 "The bombs and the long-range bombers go under one command, led by the bomber officers of the Army Air Force. The Atomic Energy Commission hands over custody of the weapons and keeps only research."
 krcw_usa_missouri_valley_authority:0 "Create the Missouri Valley Authority"
 krcw_usa_missouri_valley_authority_desc:0 "Senator Murray of Montana's old plan is revived: flood control, navigation and power on the whole Missouri go to a single authority. The Army Engineers and the Bureau of Reclamation each give up part of their turf."
 krcw_usa_garrison_and_oahe_dams:0 "Build the Garrison and Oahe Dams"
 krcw_usa_garrison_and_oahe_dams_desc:0 "Work starts on the Garrison Dam in North Dakota and the Oahe Dam in South Dakota at once, ending the yearly floods downstream. The Mandan and Sioux reservations in the reservoir basins must be moved, and the tribal councils protest."
 krcw_usa_arkansas_river_navigation:0 "Open the Arkansas River to Navigation"
 krcw_usa_arkansas_river_navigation_desc:0 "The authority builds locks on the Arkansas so barges can run from the Mississippi up to Tulsa. Oklahoma oil and wheat can now go to the sea by water."
 krcw_usa_rural_electrification:0 "Electrify the Farms"
 krcw_usa_rural_electrification_desc:0 "Power from the dams is carried to the farms by rural electric cooperatives, sold by the authority at cost. The private utilities lose the plains market and lobby Congress hard."
 krcw_usa_tinker_air_depot:0 "Expand the Tinker Air Depot"
 krcw_usa_tinker_air_depot_desc:0 "The Tinker depot southeast of Oklahoma City takes over all heavy overhauls and spare parts. Engines that used to go back to the Wichita plants can now be repaired behind the front."
 krcw_usa_randolph_field_school:0 "Open the Randolph Field Flying School"
 krcw_usa_randolph_field_school_desc:0 "Randolph Field at San Antonio becomes the national flight training centre, with Russian instructors teaching jet tactics. Most cadets are farm boys from Texas and Oklahoma."
 krcw_usa_fort_worth_bombers:0 "Build Long-Range Bombers at Fort Worth"
 krcw_usa_fort_worth_bombers_desc:0 "The Convair plant at Fort Worth switches to six-engine long-range bombers that can reach the Great Lakes from Texas. Each costs as much as an infantry battalion does in a year, and the Army generals are displeased."
 krcw_usa_mississippi_radar_line:0 "Build a Radar Line Along the Mississippi"
 krcw_usa_mississippi_radar_line_desc:0 "A chain of radar stations goes up on the west-bank bluffs from Minneapolis to New Orleans, so eastern aircraft are seen as they take off. Syndicalist radio calls it war preparation; New Orleans says it is insurance against surprise."
 krcw_usa_charity_hospitals:0 "Extend the Charity Hospital System"
 krcw_usa_charity_hospitals_desc:0 "The New Orleans Charity Hospital model is extended to every state: a free public hospital in each district, staffed by the state university medical schools. The state medical societies object as private practices lose patients."
 krcw_usa_veterans_housing:0 "Build Public Housing for Veterans"
 krcw_usa_veterans_housing_desc:0 "The People's Bank lends to the cities to put up veterans' estates in Houston, Dallas and Kansas City. Most of the contractors are old friends of the machine and bid the old way."
 krcw_usa_cut_the_pension_rate:0 "Cut the Pension Rate"
 krcw_usa_cut_the_pension_rate_desc:0 "The treasury secretary proposes cutting the pension from thirty dollars a month to twenty and spending the money on factories and the army. The old write in protest, and Union Party county men are scolded in church for the first time."
 krcw_usa_oil_pension_fund:0 "Fund Pensions from Oil Revenue"
 krcw_usa_oil_pension_fund_desc:0 "A fixed share of oil export revenue goes into a pension fund so pensions stop eating the construction budget. The Texas companies pay a special levy, and the oil contracts with Moscow can no longer be discounted."
 krcw_wca_reconstruction_board:0 "Eastern Reconstruction Board"
 krcw_wca_reconstruction_board_desc:0 "Reconstruction money is allocated by the board instead of by each federation for itself. Steel and the miners get the largest share."
 krcw_wca_reconstruction_board_2:0 "Eastern Reconstruction Board: the Lakes Works"
 krcw_wca_reconstruction_board_2_desc:0 "With the railways and furnaces repaired, the board moves its money to the ports, the seaway and the steel works of the Great Lakes."
 krcw_wca_rebuilt_east:0 "The Rebuilt East"
 krcw_wca_rebuilt_east_desc:0 "The works have been handed to the regional federations. The East's railways, grid and steel mills work as one system again."
 krcw_wca_army_reorganisation:0 "Reorganising the People's Army"
 krcw_wca_army_reorganisation_desc:0 "The federation militias are being folded into the People's Army. The new establishment is not yet fixed and units train while they reorganise."
 krcw_wca_peoples_army_councils:0 "A People's Army of Soldiers' Councils"
 krcw_wca_peoples_army_councils_desc:0 "Soldiers elect their platoon and company officers; battalion officers and above are nominated by the General Staff and confirmed by the men. Morale is high and discipline rests on persuasion."
 krcw_wca_peoples_army_staff:0 "A People's Army of the General Staff"
 krcw_wca_peoples_army_staff_desc:0 "All officers are appointed by the General Staff and the soldiers' councils keep only a right of complaint. The units are well drilled, and the syndicalist left has never accepted it."
 krcw_wca_steel_works:0 "Steel Federation"
 krcw_wca_nitrates:0 "Muscle Shoals Nitrates"
 krcw_wca_oak_ridge:0 "Oak Ridge Laboratory"
 krcw_wca_west_point:0 "People's Army Officer School"
 krcw_wca_springfield:0 "Springfield Armory"
 krcw_wca_eastern_reconstruction_board:0 "Create the Eastern Reconstruction Board"
 krcw_wca_eastern_reconstruction_board_desc:0 "The Congress sets up an Eastern Reconstruction Board to schedule the repair works in Appalachia and the Great Lakes, and the federations hand it their reconstruction funds. Steel and the miners back it; the garment and dock federations fear the money will all go to the mountains."
 krcw_wca_repair_the_pennsylvania_main_line:0 "Repair the Pennsylvania Main Line"
 krcw_wca_repair_the_pennsylvania_main_line_desc:0 "The main line from Philadelphia through Harrisburg to Pittsburgh was cut again and again in the civil war. The railwaymen's federation relays the roadbed and rebuilds the bridges, and while they work freight between east and west has to go round by Baltimore."
 krcw_wca_relight_the_pittsburgh_furnaces:0 "Relight the Pittsburgh and Youngstown Furnaces"
 krcw_wca_relight_the_pittsburgh_furnaces_desc:0 "Most furnaces in the Monongahela and Mahoning valleys went cold during the war. The steelworkers insist on furnaces before housing, and the men spend another winter in the barracks for it."
 krcw_wca_rebuild_the_coal_branch_lines:0 "Rebuild the Coal Branch Lines"
 krcw_wca_rebuild_the_coal_branch_lines_desc:0 "The pits are pumped dry, but the coal cannot get out of the hills. John L. Lewis of the Mine Workers tells the board to rebuild the coal branch lines in West Virginia and southwest Virginia before anything else."
 krcw_wca_expand_the_gary_works:0 "Expand the Gary Works"
 krcw_wca_expand_the_gary_works_desc:0 "The Gary mills used to run on Mesabi ore from Minnesota, and the Mesabi range is now on Long's side. The steel federation switches to ore from Ontario and Québec and enlarges the harbour and ore yards to take it."
 krcw_wca_dig_the_st_lawrence_seaway:0 "Dig the St. Lawrence Seaway"
 krcw_wca_dig_the_st_lawrence_seaway_desc:0 "The syndicates and Canada build the St. Lawrence Seaway together so ore boats can sail from Québec straight into the Great Lakes. It takes two years of the board's budget, and the New York longshoremen fear it will take their trade."
 krcw_wca_hand_the_works_to_the_regions:0 "Hand the Works to the Regional Federations"
 krcw_wca_hand_the_works_to_the_regions_desc:0 "Under the charter of industrial democracy the board dissolves once its work is done, and the repaired railways, power stations and mills pass to the regional federations. Reuther takes it as proof that the syndicates need no permanent central office."
 krcw_wca_build_fontana_dam:0 "Build Fontana Dam"
 krcw_wca_build_fontana_dam_desc:0 "The Tennessee Valley Syndicate finishes Fontana Dam on the Little Tennessee to power the plants of western North Carolina and around Knoxville. The reservoir drowns the farms in several valleys, and the farm cooperatives resettle the families."
 krcw_wca_build_kentucky_dam:0 "Build Kentucky Dam and Its Locks"
 krcw_wca_build_kentucky_dam_desc:0 "Kentucky Dam makes the lower Tennessee navigable all year, and barges can run from Knoxville to the Ohio. The site is close to the Mississippi front, and Carlson has anti-aircraft positions built on the dam."
 krcw_wca_nitrates_for_fertiliser:0 "Muscle Shoals Makes Fertiliser"
 krcw_wca_nitrates_for_fertiliser_desc:0 "Wallace and the southern farm cooperatives want the Muscle Shoals nitrate works to make fertiliser only, so that worn-out cotton land can be turned to food and fodder. The People's Army will have to make up its explosives with imports from Europe."
 krcw_wca_nitrates_for_explosives:0 "Muscle Shoals Makes Explosives"
 krcw_wca_nitrates_for_explosives_desc:0 "Carlson wants the nitrate works to put explosives first and keep the river divisions supplied. The southern cooperatives' fertiliser allocation is cut deeply, and their delegates vote against it in the Congress."
 krcw_wca_rural_electric_cooperatives:0 "Form the Southern Rural Electric Cooperatives"
 krcw_wca_rural_electric_cooperatives_desc:0 "The valley grid is extended to the hill villages of north Georgia, the Carolina upcountry and eastern Kentucky. Farmers in each county form an electric cooperative that strings its own lines and collects its own bills; the valley syndicate only sells the power wholesale."
 krcw_wca_expand_oak_ridge:0 "Expand the Oak Ridge Laboratory"
 krcw_wca_expand_oak_ridge_desc:0 "The isotope plants at Oak Ridge run on Tennessee Valley power. The physicists want an atomic research institute, the People's Army wants it to keep enriching uranium, both demand power first, and the valley's aluminium works cut output to supply it."
 krcw_wca_the_general_staff:0 "Form the People's Army General Staff"
 krcw_wca_the_general_staff_desc:0 "Carlson asks Robert Merriman, a Lincoln Battalion veteran, to build a General Staff that writes one set of war plans and one training syllabus. The federations can no longer move the units they raised on their own, and the auto and steel executives protest."
 krcw_wca_four_military_districts:0 "Divide the East into Four Military Districts"
 krcw_wca_four_military_districts_desc:0 "The East is divided into Great Lakes, Atlantic, Appalachian and Southern districts. Commanders are appointed by the General Staff and political commissars are chosen by the regional federations; the Appalachian district holds the whole river line and gets the most divisions."
 krcw_wca_reorganise_west_point:0 "Reorganise West Point"
 krcw_wca_reorganise_west_point_desc:0 "West Point becomes the People's Army Officer School, where old regulars sit in class beside company commanders promoted in the civil war. Carlson approves the syllabus himself, with a term each on guerrilla war and night river crossings."
 krcw_wca_one_rifle_pattern:0 "Adopt One Pattern of Infantry Weapons"
 krcw_wca_one_rifle_pattern_desc:0 "In the civil war every federation militia carried whatever rifles it could find. The General Staff standardises on the Springfield Armory rifle and cartridge, and the armory adds production lines to supply it."
 krcw_wca_factory_reserve:0 "Set Up the Factory Reserve"
 krcw_wca_factory_reserve_desc:0 "Every large plant keeps a reserve company of its own workers that trains for a month each year. The works committees complain about the lost shifts, and the People's Army gains a reserve it can mobilise at once."
 krcw_wca_keep_elected_officers:0 "Keep the Election of Officers"
 krcw_wca_keep_elected_officers_desc:0 "The soldiers' councils go on electing platoon and company officers, and battalion officers and above are nominated by the General Staff and confirmed by the men. It is the tradition of the civil-war militias, and Flynn and the syndicalist left insist on keeping it."
 krcw_wca_officers_appointed_by_staff:0 "Officers Appointed by the General Staff"
 krcw_wca_officers_appointed_by_staff_desc:0 "All officers are now appointed by the General Staff, and the soldiers' councils keep only a right of complaint. Carlson says a modern war cannot be fought otherwise; Flynn and Cannon say it rebuilds the old army."
 krcw_wca_complete_the_reorganisation:0 "Complete the Reorganisation of the People's Army"
 krcw_wca_complete_the_reorganisation_desc:0 "The last federation militias are folded into the People's Army and the General Staff publishes the new divisional establishment. The large exercises suspended during the reorganisation resume."
 krcw_jap_belt_plan_1:0 "The Pacific Belt Plan"
 krcw_jap_belt_plan_1_desc:0 "The Ministry of Commerce puts the coastal belt into its five-year plan: steel and power first, then petrochemicals and motor cars. The prefectures provide the reclaimed land, and the Japan Development Bank provides the loans."
 krcw_jap_belt_plan_2:0 "The Pacific Belt Plan: Power Secured"
 krcw_jap_belt_plan_2_desc:0 "The nine regional power companies supply the belt on schedule, and factories no longer stop for power cuts. The Ministry approves the tariffs, and households come after the factories."
 krcw_jap_belt_plan_3:0 "The Pacific Belt Plan: Export Drive"
 krcw_jap_belt_plan_3_desc:0 "The belt's steel, ships and cars are sold abroad on credit from the Export-Import Bank. The foreign exchange buys more machine tools and crude oil, and the home market stays short of goods."
 krcw_jap_yawata_steel:0 "Yawata Steelworks"
 krcw_jap_expand_yawata:0 "Expand the Yawata Steelworks"
 krcw_jap_expand_yawata_desc:0 "Yawata is Japan's oldest steelworks, and most of its furnaces date from before the war. The Ministry funds two new blast furnaces and a rolling mill; Fuji Steel and Nippon Kokan complain that Yawata got all the money."
 krcw_jap_nine_power_companies:0 "Form the Nine Power Companies"
 krcw_jap_nine_power_companies_desc:0 "The wartime power monopoly is broken into nine regional companies, each with its own supply area. Matsunaga Yasuzaemon runs the reorganisation, and the army and Home Ministry lose their hold on the grid."
 krcw_jap_ishikari_coal:0 "Open Up the Ishikari Coalfield"
 krcw_jap_ishikari_coal_desc:0 "With Sakhalin lost, the steelworks depend on Hokkaido for coking coal. Mitsui and Hokkaido Colliery sink new shafts at Ishikari, and most of the miners they hire are repatriates from the continent."
 krcw_jap_mizushima_reclamation:0 "Reclaim Land at Mizushima"
 krcw_jap_mizushima_reclamation_desc:0 "Okayama prefecture reclaims the Mizushima flats as industrial land, and Kawasaki Steel and Mitsubishi build their new plants there. The prefecture pays half the cost, and the fishermen's compensation is still being argued over."
 krcw_jap_kurobe_dam:0 "Build the Kurobe No. 4 Power Station"
 krcw_jap_kurobe_dam_desc:0 "Kansai Electric builds an arch dam and underground power station in the Kurobe gorge to feed the factories of Osaka and Kobe. It means tunnelling through the Northern Alps, and the work is slow and costly in lives."
 krcw_jap_petrochemicals:0 "Yokkaichi Petrochemicals"
 krcw_jap_yokkaichi_complex:0 "Build the Yokkaichi Petrochemical Complex"
 krcw_jap_yokkaichi_complex_desc:0 "The navy's old fuel depot at Yokkaichi becomes a refinery and petrochemical complex. The crude is imported, and whose oil to buy is decided by the Foreign Ministry and the Ministry of Commerce together."
 krcw_jap_lorries:0 "Domestic Lorries"
 krcw_jap_motor_industry:0 "Back Toyota and Nissan"
 krcw_jap_motor_industry_desc:0 "The Ministry gives Toyota and Nissan foreign-exchange quotas and cheap loans on condition that they build lorries first. The Police Reserve and the hauliers are both short of trucks; the family car will have to wait."
 krcw_jap_export_import_bank:0 "Found the Export-Import Bank of Japan"
 krcw_jap_export_import_bank_desc:0 "The government founds an Export-Import Bank to finance exports of ships, steel and machinery. The Finance Ministry worries about the reserves, and the big firms can at last sign export contracts a year ahead."
 krcw_jap_safety_force:0 "The Safety Force"
 krcw_jap_safety_force_desc:0 "The Police Reserve is renamed the Safety Force under a new Safety Agency. The Qingdao treaty still binds it, but it now has its own staff and training programme."
 krcw_jap_defence_agency:0 "The Defence Agency"
 krcw_jap_defence_agency_desc:0 "The Defence Agency commands the ground, maritime and air self-defence forces, and its director sits in the cabinet. Tokyo no longer recognises the force ceiling set at Qingdao."
 krcw_jap_safety_agency:0 "Reorganise as the Safety Force"
 krcw_jap_safety_agency_desc:0 "The Police Reserve becomes the Safety Force under a new Safety Agency, and vetted former officers may re-enlist. Nanjing protests a breach of the armistice; Tokyo answers that the force is still police."
 krcw_jap_safety_academy:0 "Safety Academy"
 krcw_jap_defence_academy:0 "Found the Safety Academy"
 krcw_jap_defence_academy_desc:0 "The Safety Academy at Yokosuka takes school-leavers and commissions them after four years. Old instructors from the Army Academy are brought back to teach, from new textbooks."
 krcw_jap_special_vehicle:0 "Special Vehicle"
 krcw_jap_domestic_tank:0 "Order a Domestic Tank from Mitsubishi"
 krcw_jap_domestic_tank_desc:0 "The Safety Agency orders Japan's first post-war tank from Mitsubishi Heavy Industries, light enough for Japanese bridges and mountain roads. The treaty bans heavy equipment, so the contract calls it a \"special vehicle\"."
 krcw_jap_defence_agency_law:0 "Establish the Defence Agency"
 krcw_jap_defence_agency_law_desc:0 "The Diet passes the two defence laws: the Safety Agency becomes the Defence Agency with ground, maritime and air self-defence forces. This amounts to scrapping the Qingdao force limits unilaterally, and Nanjing and Paris will respond."
 krcw_psa_northwest_power_1:0 "Northwest Power"
 krcw_psa_northwest_power_1_desc:0 "The Bonneville Power Administration answers to the Interior Department in Sacramento, and the power of Grand Coulee and Bonneville goes first to the aluminium works and shipyards. The Department sets the rates; the private utilities lose theirs."
 krcw_psa_northwest_power_2:0 "The Northwest Grid"
 krcw_psa_northwest_power_2_desc:0 "High-voltage lines from Washington to California form one grid, and northern hydro power reaches the Los Angeles plants. For the first time the Constitutional Coalition need buy neither power nor coal from the East."
 krcw_psa_take_over_bonneville:0 "Take Over the Bonneville Power Administration"
 krcw_psa_take_over_bonneville_desc:0 "Since the split the federal Bonneville Power Administration has had no superior, and its engineers kept supplying power on the old contracts. Sacramento places it under the Interior Department and, under the War Powers Act, gives priority to arms plants and aluminium."
 krcw_psa_mcnary_dam:0 "Finish the McNary Dam"
 krcw_psa_mcnary_dam_desc:0 "The McNary Dam, begun by the Army Engineers before the split, has stood half-built for years. Engineer battalions go back to work, and once the locks open, eastern Oregon wheat can go by barge to Portland."
 krcw_psa_timber_mills:0 "Organise the Northwest Timber Trade"
 krcw_psa_timber_mills_desc:0 "A timber board allocates orders and export quotas among the sawmills of Oregon and Washington. Weyerhaeuser supports it; the small mill owners say the quotas favour the big firms."
 krcw_psa_reopen_aluminium:0 "Reopen the Spokane Aluminium Works"
 krcw_psa_reopen_aluminium_desc:0 "Kaiser takes over the wartime aluminium works at Mead and Trentwood and smelts with Bonneville power. The ingots go to the aircraft plants of Los Angeles and Seattle, and the surplus is sold to Japan."
 krcw_psa_columbia_basin:0 "Water the Columbia Basin"
 krcw_psa_columbia_basin_desc:0 "Pumps at Grand Coulee lift river water into the Columbia Basin canals, and the dry land is sold in small lots to veterans. The farmers pay for the water, and the first harvest is three years away."
 krcw_psa_aluminium_sheet:0 "Airframe Sheet"
 krcw_psa_aircraft_sheet:0 "Roll Aluminium Sheet for the Aircraft Plants"
 krcw_psa_aircraft_sheet_desc:0 "Reynolds Metals builds a sheet mill at Longview to supply airframe sheet to Boeing, Lockheed and Douglas. The aircraft plants no longer depend on semi-finished metal from the East."
 krcw_psa_northwest_grid:0 "Build the Northwest High-Voltage Grid"
 krcw_psa_northwest_grid_desc:0 "Bonneville strings high-voltage lines from the Columbia to California, so northern hydro power can reach the southern factories. The California utilities lobby Congress against it, and the Interior Department strings the lines anyway."
 krcw_usa_appomattox_prep:0 "Appomattox Preparations"
 krcw_usa_appomattox_prep_desc:0 "The War Department gathers engineers, munitions and aircraft under the Appomattox plan. The armistice observers report new works on the riverbank every week."
 krcw_usa_appomattox_ready:0 "General Mobilisation"
 krcw_usa_appomattox_ready_desc:0 "The National Guard is in federal service and the crossing force waits on the bank. Factories and farms have lost much of their labour, and civilian goods grow scarce."
 krcw_usa_earls_preparedness_budget:0 "Pass Earl's Preparedness Budget"
 krcw_usa_earls_preparedness_budget_desc:0 "Earl Long keeps Huey's machine and the pledge to reunite America, and gives the War Department first call on the new oil revenue. The governors get less road money, and the generals stop complaining for now."
 krcw_usa_bureau:0 "Joint Bureau"
 krcw_usa_joint_intelligence_bureau:0 "Set Up a Joint Bureau with the Third Section"
 krcw_usa_joint_intelligence_bureau_desc:0 "Russia's Third Section sends a team to set up a joint bureau with Army intelligence in New Orleans, aimed at the east bank. The Third Section wants to see every file, and the old Army officers resent it."
 krcw_am_ti_crisis_up3_tt:0 "Internationale crisis +3 (current: [?global.krcw_ti_crisis|0])"
 krcw_usa_fund_the_east_underground:0 "Fund the Anti-Syndicalist Underground in the East"
 krcw_usa_fund_the_east_underground_desc:0 "The bureau sends money and presses to the anti-syndicalist underground in the east: dispossessed owners, church groups and craft unions unhappy with shop votes. Each cell New York's security committee breaks up makes the line tenser."
 krcw_am_ma_crisis_down3_tt:0 "Moscow Accord crisis -3 (current: [?global.krcw_ma_crisis|0])"
 krcw_usa_hunt_syndicalist_agents:0 "Hunt the Syndicalist Agents in the West"
 krcw_usa_hunt_syndicalist_agents_desc:0 "The Bureau of Investigation and the Third Section comb the docks, the oilfields and the Black veterans' associations for syndicalist agents. More arrests mean more wrongful ones, and the civil-rights members question it in Congress."
 krcw_am_ma_crisis_down2_tt:0 "Moscow Accord crisis -2 (current: [?global.krcw_ma_crisis|0])"
 krcw_usa_accord_defence_council:0 "Join the Accord Defence Council"
 krcw_usa_accord_defence_council_desc:0 "New Orleans sends delegates to the Accord Defence Council, and west-bank generals join the Accord's annual exercise planning for the first time. Moscow promises the west bank priority supply in war, on condition that Galveston stays open to the Russian fleet."
 krcw_usa_engineers:0 "River-Crossing Engineers"
 krcw_usa_river_engineer_brigades:0 "Form River-Crossing Engineer Brigades"
 krcw_usa_river_engineer_brigades_desc:0 "The Army Engineers form three river-crossing brigades at Shreveport with pontoon bridges and assault boats. Patton wants them under the armoured corps; the War Department keeps them at army level."
 krcw_usa_forward_depots:0 "Expand the Riverside Depots"
 krcw_usa_forward_depots_desc:0 "Munitions and fuel depots go up at Little Rock, outside St Louis and at Monroe, with rail spurs down to the bank. The steel and cement come out of the Kingfish highway programme."
 krcw_usa_stockpile_for_the_crossing:0 "Stockpile Munitions for the Crossing"
 krcw_usa_stockpile_for_the_crossing_desc:0 "The Dallas and Fort Worth arsenals go to two shifts, and new guns go to the riverside depots instead of the National Guard. Russian tankers unload an extra quarter's oil at Galveston."
 krcw_am_ti_crisis_up2_tt:0 "Internationale crisis +2 (current: [?global.krcw_ti_crisis|0])"
 krcw_usa_east_bank_agents:0 "Plant Agents on the East Bank"
 krcw_usa_east_bank_agents_desc:0 "Agents are recruited in Memphis, East St Louis and Cairo: rail dispatchers, ferrymen and foremen who resent the syndicates. On the day of the crossing they cut the telephone lines and guide the troops."
 krcw_usa_crossing_drill:0 "Crossing Drills"
 krcw_usa_crossing_exercises:0 "Hold River-Crossing Exercises"
 krcw_usa_crossing_exercises_desc:0 "Patton's armoured corps practises night crossings on the Arkansas River with the engineers and the air force. East-bank scouts watch every exercise, and the armistice commission receives a protest."
 krcw_usa_riverside_airfields:0 "Move the Air Force Up to the River"
 krcw_usa_riverside_airfields_desc:0 "The Army Air Force moves fighter squadrons from Texas to forward fields in Arkansas and Missouri to hold the air over the river on the day. The forward fields sit close to the east bank's flak."
 krcw_usa_general_mobilisation:0 "Order General Mobilisation"
 krcw_usa_general_mobilisation_desc:0 "Congress authorises the President to call up the men of military age and puts the whole National Guard into federal service. The oilfields and cotton fields run short of hands, and the Union Party state bosses complain."
 krcw_wca_john_brown_prep:0 "John Brown Plan Preparations"
 krcw_wca_john_brown_prep_desc:0 "The General Staff gathers bridging equipment, munitions and aircraft under the John Brown Plan. Every federation's civilian orders give way to the front."
 krcw_wca_john_brown_ready:0 "General Mobilisation"
 krcw_wca_john_brown_ready_desc:0 "The factory reserve companies have joined the field divisions and the crossing force waits on the east banks of the Ohio and the Mississippi. Women and older workers keep the factories running."
 krcw_am_ma_crisis_up2_tt:0 "Moscow Accord crisis +2 (current: [?global.krcw_ma_crisis|0])"
 krcw_wca_embargo_the_west:0 "Embargo the West Bank"
 krcw_wca_embargo_the_west_desc:0 "The Builders mean to strangle the west bank economically: all trade across the river is banned, Mexico is pressed to stop the Tampico transit, and not one machine the west needs is sold. Smugglers still cross at night, and the frontier troops have more work."
 krcw_am_ti_crisis_down3_tt:0 "Internationale crisis -3 (current: [?global.krcw_ti_crisis|0])"
 krcw_wca_river_security_zone:0 "Set Up the Mississippi Frontier Zone"
 krcw_wca_river_security_zone_desc:0 "A frontier zone is drawn along the east bank, and the crossings are guarded by the People's Army and the security committee. People coming east are registered and screened before resettlement; people going west need a pass. West-bank agents can no longer slip over among the refugees."
 krcw_am_ma_crisis_up3_tt:0 "Moscow Accord crisis +3 (current: [?global.krcw_ma_crisis|0])"
 krcw_wca_arms_via_mexico:0 "Smuggle Arms to the West Bank through Mexico"
 krcw_wca_arms_via_mexico_desc:0 "The network along the Mexican railways hides rifles and radios in freight cars bound for Texas, for the union underground in the oilfields and on the docks. Camacho's security police catch a few loads; more get through."
 krcw_wca_screen_the_atlantic_crossings:0 "Screen the Atlantic Lines for Third Section Agents"
 krcw_wca_screen_the_atlantic_crossings_desc:0 "The convoys between Le Havre and New York bring technicians and students, and agents of the Russian Third Section with them. The security committee opens a screening office in New York harbour and registers every arrival."
 krcw_am_ti_crisis_down2_tt:0 "Internationale crisis -2 (current: [?global.krcw_ti_crisis|0])"
 krcw_wca_internationale_defence_protocol:0 "Sign the Internationale Defence Protocol"
 krcw_wca_internationale_defence_protocol_desc:0 "New York and Paris sign a protocol: if the east bank is attacked, the Internationale sends convoys, aircraft and volunteers, and the east bank supplies Europe with lorries and steel. Paris asks to be consulted before any crossing."
 krcw_wca_river_flotilla:0 "Form the Ohio River Flotilla"
 krcw_wca_river_flotilla_desc:0 "The Pittsburgh and Louisville yards convert gunboats and landing barges into the Ohio River Flotilla, which will cover the bridges on the day. The steel federation defers an order of civilian barges."
 krcw_wca_crossing_depots:0 "Stock Bridging Equipment at Memphis and Cairo"
 krcw_wca_crossing_depots_desc:0 "The Eastern Reconstruction Board builds depots at Memphis, Cairo and Paducah for pontoons, assault boats and ammunition. The work takes steel meant for rebuilding Appalachia."
 krcw_wca_crossing_drill:0 "Crossing Drills"
 krcw_wca_ohio_crossing_drill:0 "Hold Crossing Drills on the Ohio"
 krcw_wca_ohio_crossing_drill_desc:0 "The People's Army practises night crossings on the Ohio, the four military districts taking turns. Carlson wants every company across at least once, the factory reserve included."
 krcw_wca_west_bank_strike_committees:0 "Organise Strike Committees on the West Bank"
 krcw_wca_west_bank_strike_committees_desc:0 "The Liberation Committee sends organisers across to set up strike committees in the Texas oilfields, the Arkansas cotton country and the New Orleans docks, to stop work on the day of the crossing. Organisers who are caught face Long's courts and the death sentence."
 krcw_wca_ohio_airfields:0 "Build Airfields along the Ohio"
 krcw_wca_ohio_airfields_desc:0 "The People's Air Force builds forward fields in western Kentucky, southern Illinois and Mississippi. Once they are built, the west bank's radar sees every take-off."
 krcw_wca_detroit_war_shifts:0 "Put Detroit on War Shifts"
 krcw_wca_detroit_war_shifts_desc:0 "The auto workers' federation votes to turn half the civilian lines over to tanks and lorries on three shifts. Tractors and cars are delivered late, and the farm cooperatives protest."
 krcw_wca_general_mobilisation:0 "Declare General Mobilisation"
 krcw_wca_general_mobilisation_desc:0 "The Congress authorises the executive to call up the workers of military age, and the factory reserve companies join the field divisions. From now on women and older workers keep the factories running."
 krcw_jap_northern_prep:0 "Northward Preparations"
 krcw_jap_northern_prep_desc:0 "The Korea Section's plan is being put into ports, airfields and divisions. The Foreign Ministry explains the works as home defence."
 krcw_jap_northern_ready:0 "The Northern Expeditionary Army"
 krcw_jap_northern_ready_desc:0 "The Northern Expeditionary Army is assembled on Tsushima and in northern Kyushu with its transports waiting in harbour. On the cabinet's order it can land at Busan within a day."
 krcw_jap_korea_section:0 "Set Up the Korea Section of the General Staff"
 krcw_jap_korea_section_desc:0 "The Defence Agency sets up a Korea Section in the General Staff, where Ishiwara's former officers draw up landings at Busan and Incheon. Three copies are printed and the Foreign Ministry gets none."
 krcw_jap_kyushu_ports:0 "Expand the Moji and Sasebo Harbours"
 krcw_jap_kyushu_ports_desc:0 "The quays at Moji, Hakata and Sasebo are extended and the railway run down to the piers, so that a division can embark in a day. The harbour board says it is for the Korea trade; nobody believes it."
 krcw_jap_korean_contacts:0 "Contact the Pro-Japanese Party in Korea"
 krcw_jap_korean_contacts_desc:0 "Intelligence officers contact the Japanese who stayed in Korea after 1944, Korean officials of the old Government-General and landlords at odds with the Seoul government. When the Nanjing advisers notice, the Korean police begin mass searches."
 krcw_jap_mobile:0 "Mobile Divisions"
 krcw_jap_mobile_armour:0 "Special Vehicles for the Mobile Divisions"
 krcw_jap_mobile_divisions:0 "Form Mobile Divisions"
 krcw_jap_mobile_divisions_desc:0 "The Ground Self-Defence Force forms mobile divisions from its best units, with Toyota lorries and Mitsubishi \"special vehicles\". Korea's roads are better than China's, and mobile troops could reach Seoul from Busan quickly."
 krcw_jap_landing_ships:0 "Landing Fleet"
 krcw_jap_landing_troops:0 "Landing Troops"
 krcw_jap_landing_fleet:0 "Build a Landing Fleet"
 krcw_jap_landing_fleet_desc:0 "The Kure and Hiroshima yards build tank landing ships and motor junks, and the Maritime Safety Agency trains the crews. The shipbuilders' export orders are delivered late."
 krcw_jap_northward_press:0 "Launch the Recover-Korea Campaign"
 krcw_jap_northward_press_desc:0 "The veterans' associations, the repatriate societies and the right-wing papers launch a campaign to recover Korea, echoed in the Diet by the National Spirit League. Liberals and socialists march against it, and the police have both sides to handle."
 krcw_jap_strait_air:0 "Air over the Strait"
 krcw_jap_tsushima_air_bases:0 "Build Air Bases on the Tsushima Strait"
 krcw_jap_tsushima_air_bases_desc:0 "The Air Self-Defence Force builds forward fields at Fukuoka, Sasebo and Iki to hold the air over the strait during a landing. From now on Korean radar reports every take-off to Nanjing."
 krcw_jap_assemble_at_tsushima:0 "Assemble the Northern Army on Tsushima"
 krcw_jap_assemble_at_tsushima_desc:0 "The Northern Expeditionary Army assembles on Tsushima, Iki and in northern Kyushu with its transports in harbour. The blackout in Busan can be seen across the strait, and Nanjing's attaché delivers a note to Tokyo."
 krcw_jap_strait_harbour_forts:0 "Strengthen the Kaohsiung, Keelung and Makung Forts"
 krcw_jap_strait_harbour_forts_desc:0 "The navy adds shore batteries and minefields at Kaohsiung, Keelung and Makung in the Pescadores, closing the ports a Chinese landing fleet would most want. Harbour controls slow Formosa's sugar exports."
 krcw_jap_formosa_fighter_wing:0 "Station a Fighter Wing on Formosa"
 krcw_jap_formosa_fighter_wing_desc:0 "The Air Self-Defence Force moves a jet fighter wing to Taipei and Kaohsiung to intercept bombers from Fujian. The home islands lose a wing of air defence."
 krcw_usa2_1_t:0 "The Auditors Move In"
 krcw_usa2_1_d:0 "The federal audit office moves into New Orleans on Long's order. In his first report the auditor-general says his men can look only at the state party books, or follow the trail all the way to the unmarked office in the capitol. The east-bank radio is already waiting for a result, and several southern governors have sent men to ask \"how far it goes\". The President's office must set the scope first."
 krcw_usa2_1.a:0 "Follow it all the way, the New Orleans contracts included."
 krcw_usa2_1.b:0 "Audit the state parties only; leave the capital alone."
 krcw_usa2_1.c:0 "Hold an audit for the radio to hear."
 krcw_usa2_2_t:0 "The Kingfish's Books"
 krcw_usa2_2_d:0 "The auditors have reached the New Orleans defence contracts. The books show that for four years every large contract left ten per cent with Long's inner circle, several of whom still sit in the cabinet. The auditor-general puts two crates of files on the President's desk and asks what to do. Prosecuting in open court would shake the machine's foundations; sealing the files lets the east-bank radio go on mocking \"the Kingfish's ten per cent\"."
 krcw_usa2_2.a:0 "Prosecute in open court, even against our own."
 krcw_usa2_2.b:0 "Seal the heaviest files and prosecute the rest."
 krcw_usa2_2.c:0 "Leave it to Earl to handle quietly."
 krcw_usa2_3_t:0 "The County Ledgers"
 krcw_usa2_3_d:0 "The audit stops at the doors of the state party offices. In several states the bosses are found to have kept private staffs on federal money and paid off favours with highway contracts; the holes are real, but no line runs back to New Orleans. The auditor-general says he can make examples of these men, or trade their cooperation for a promise to clean their own houses. The President must decide how hard to come down on the state bosses."
 krcw_usa2_3.a:0 "Make examples of them, in public."
 krcw_usa2_3.b:0 "Trade cooperation for self-audit, kept quiet."
 krcw_usa2_3.c:0 "Let the bosses agree a quota of resignations among themselves."
 krcw_usa2_4_t:0 "A Headline, Not an Audit"
 krcw_usa2_4_d:0 "The audit looked very much like an audit: there were hearings, reporters and a few junior clerks dismissed. But the door to the records room never really opened. Two weeks later Radio Free America plays a recording of an audit-office assistant's private remark, laughing that the audit \"went after the men who sweep the floor and spared the men who take the money\". The southern bosses draw the lesson: the capital dares not look."
 krcw_usa2_4.a:0 "Admit it: the machine won this round."
 krcw_usa2_4.b:0 "Audit again, and mean it this time."
 krcw_usa2_5_t:0 "The Bosses Answer"
 krcw_usa2_5_d:0 "The audit's result goes before the Union Party national committee. The state bosses will either accept the new accounting rules and let New Orleans station comptrollers in each state, or bargain with the one thing they hold: the county machines that count the ballots. The committee will not say which before it rises, and how they answer turns on whether the President has been hard or soft with them over these years."
 krcw_usa2_5.a:0 "Hold the line: the comptrollers go in."
 krcw_usa2_5.b:0 "Leave them half their dignity for a nod."
 krcw_usa2_5.c:0 "Let them off; the machine has to keep running."
 krcw_usa2_5_v0:0 "The audit went all the way and even the New Orleans inner circle has been in court; the bosses know the President means it this time."
 krcw_usa2_5_v1:0 "The audit stopped at the state party doors and never touched New Orleans; the bosses are still weighing the capital's resolve."
 krcw_usa_machine_roll_tt:0 "Whether the bosses accept the new rules depends on the audit record: open prosecutions, an audited machine and a stable country make them submit; graft, the patronage network and low stability let them bargain."
 krcw_usa2_6_t:0 "A Cleaner Machine"
 krcw_usa2_6_d:0 "The bosses accept the new accounting rules. Comptrollers from New Orleans move into the state party offices, defence contracts go to open tender for the first time, and the most conspicuous fixers are arranged into \"retirement\". The machine remains, and from now on each state party's books must carry a comptroller's signature. Radio Free America on the east bank drops its programme on \"the Kingfish's ten per cent\"."
 krcw_usa2_6.a:0 "A clean machine is still a machine; keep it running."
 krcw_usa2_7_t:0 "The Machine Wins This Round"
 krcw_usa2_7_d:0 "The bosses do not bow. They mount no open resistance; they simply see to it that over the next two months the comptrollers meet the same answer in every state: the records are being moved, the key is with another man, the clerk who handled it was transferred last month. The audit office reports that without the state bosses' cooperation the comptroller system cannot be put into effect."
 krcw_usa2_7.a:0 "Then feed it, and use it for the war."
 krcw_usa_the_comptrollers:0 "The Comptrollers"
 krcw_usa_the_comptrollers_desc:0 "The comptroller system the audit left behind is written into law: every state party office has a comptroller from New Orleans, and defence contracts all go to open tender. The machine drips less grease and its gears mesh more truly, and the fixers who lost their cut begin to grumble quietly in the south."
 krcw_usa_feed_the_machine:0 "Feed the Machine"
 krcw_usa_feed_the_machine_desc:0 "Since the audit could not move the machine, the President uses it instead: contracts, posts and subsidies are handed out more generously than ever, and in return the state parties vote the war budget as one. The kickbacks rise with it, and Radio Free America on the east bank brings back its programme on \"the Kingfish's ten per cent\"."
 krcw_usa_merit_service:0 "A Civil Service on Merit"
 krcw_usa_merit_service_desc:0 "On top of the comptrollers goes another layer: federal and state posts are filled by examination and record, not by a county boss's letter. The old party men call it \"handing the machine to the schoolboys\", but for the first time young veterans can enter government on their merits."
 krcw_usa_merit:0 "Civil Service on Merit"
 krcw_usa_the_contract_office:0 "The Contract Office"
 krcw_usa_the_contract_office_desc:0 "If the machine is to be used for war, the spoils had better be shared efficiently. A dedicated contract office opens in New Orleans under men Earl trusts, and the orders go first to the loyal. The factories run flat out, and the books grow steadily harder to read."
 krcw_usa_clean_hands_abroad:0 "Show Moscow the Clean Books"
 krcw_usa_clean_hands_abroad_desc:0 "New Orleans sends the audited books to Moscow to show that the Russian credits have not been eaten by fixers. The Accord's auditors find nothing to flag for the first time, and the next tranche of machine tools and loans is approved with unusual speed."
 krcw_usa2_10_t:0 "The Delta Strike"
 krcw_usa2_10_d:0 "At harvest the Black cotton pickers of the Mississippi Delta put down their sacks and demand a price by the pound, paid by the week. The strike spreads from Helena in Arkansas to Greenville in Mississippi, and the planters wire New Orleans for the National Guard. Every night Radio Free America on the east bank reads out the strike committee's statement."
 krcw_usa2_10.a:0 "Send federal mediators to the Delta."
 krcw_usa2_10.b:0 "Send the Guard to protect the plantations."
 krcw_usa2_10_v0:0 "The Black veterans who registered after the Little Rock Compromise lead the strike. The Delta pickers demand a price by the pound, paid by the week, and the planters wire New Orleans for the Guard, saying the compromise has \"spoiled the Negroes\". Radio Free America reads out the strike committee's statement every night."
 krcw_usa2_10_v1:0 "Many of the strike's organisers were once turned back at the crossings by the Guard. The Delta pickers demand a price by the pound, paid by the week, and the planters wire New Orleans to remind the President that he promised the South \"nothing will change\". Radio Free America reads out the strike committee's statement every night."
 krcw_usa2_11_t:0 "The Federal Mediators"
 krcw_usa2_11_d:0 "The Labor Department mediators sit three weeks in the Greenville courthouse and produce a plan: a wage board in every county, setting the price by the pound. The dispute is whether Black members sit on the boards. The planters say they will not sign if they do, and the strike committee says it will not go back if they do not."
 krcw_usa2_11.a:0 "The boards will have Black members."
 krcw_usa2_11.b:0 "White members only, but the wage goes up."
 krcw_usa2_12_t:0 "The Guard in the Delta"
 krcw_usa2_12_d:0 "The Arkansas and Mississippi Guard march into the Delta and take the strike committee men out of their cabins. The strike breaks within ten days, but the pickers' families begin walking in crowds toward the crossings at Helena and Vicksburg. The Guard commander asks New Orleans whether to stop them or let them pass."
 krcw_usa2_12.a:0 "Close the crossings. Let no one through."
 krcw_usa2_12.b:0 "Let them go, and quietly raise the wage for those who stay."
 krcw_usa_delta_roll_tt:0 "Whether the planters and the southern bosses accept or walk out depends on the civil-rights settlement, the make-up of the boards, the state of the machine and stability."
 krcw_usa2_13_t:0 "The Greenville Wage Board"
 krcw_usa2_13_d:0 "The planters sign. The Greenville wage board meets for the first time and fixes a price for each pound of cotton, and the pickers are back in the fields the next day. The southern senators complain in the papers, and not one of them leaves the party."
 krcw_usa2_13.a:0 "Extend the wage boards across the South."
 krcw_usa2_13.b:0 "The Delta is enough. Do not provoke the South further."
 krcw_usa2_13_v0:0 "The planters sign, with two Black veterans sitting on the board. The Greenville wage board fixes a price for each pound of cotton at its first meeting, and the pickers are back in the fields the next day. The southern senators complain in the papers, and not one of them leaves the party."
 krcw_usa2_14_t:0 "The Southern Bosses Walk Out"
 krcw_usa2_14_d:0 "A group of Union Party senators from Mississippi, Alabama and north Louisiana leave the party caucus and form a \"States' Rights caucus\". They say the Delta proves New Orleans has gone over to the Negroes. General Moseley has them to dinner that night, and the Bureau has a man in the room."
 krcw_usa2_14.a:0 "Let them go. Govern with the veterans and the farmers."
 krcw_usa2_14.b:0 "Give them back control of the state primaries."
 krcw_usa2_15_t:0 "The Helena Crossing"
 krcw_usa2_15_d:0 "After the Delta, the Helena crossing is the most watched place on the west bank. The east bank has put up a reception camp on the far shore under a \"NO COLOR LINE HERE\" banner, and the armistice commission receives protests from both sides every week. New Orleans must decide how the crossing is run from now on."
 krcw_usa2_15.a:0 "Issue passes and let people cross by the rules."
 krcw_usa2_15.b:0 "Close the whole bank. Those caught crossing go to the prison farms."
 krcw_usa2_15_v0:0 "The Guard closed the Helena crossing; the pickers' families camped on the bank for a month and were finally marched back to the plantations. On the far shore the east bank has set up a reception camp and reads the names of those turned back over loudspeakers every day. New Orleans must decide how the crossing is run from now on."
 krcw_usa2_15_v1:0 "Since the States' Rights caucus walked out, the southern counties have begun running the crossings themselves. The east bank has a reception camp opposite Helena, and the armistice commission receives protests from both sides every week. New Orleans must decide who runs the crossing from now on."
 krcw_usa2_16_t:0 "After the Delta"
 krcw_usa2_16_d:0 "A year after the Delta strike the South comes to harvest again. New Orleans's policy is settled and the counties act on it, and the east-bank radio has had to find a new line. The debate on the colour line goes on in Congress, but this time both sides know where the President stands."
 krcw_usa2_16.a:0 "Go on down this road."
 krcw_usa2_16_v0:0 "A year after the Delta strike the county wage boards meet as usual and Black guardsmen stand watch at the Helena crossing. Half as many people cross east as last year, and the east-bank radio no longer reads out names; it reads the west-bank wage board prices instead. The States' Rights caucus is still in Congress, and it has not grown."
 krcw_usa2_16_v1:0 "A year after the Delta strike the southern counties issue passes at the crossings, and anyone caught without one goes to the prison farms. The east-bank camp is still opposite Helena, and the list of names on its loudspeakers grows every day. The southern bosses are back in the Union Party caucus, and General Moseley is a regular at their dinners."
 krcw_usa_delta_wage_boards:0 "The Southern Wage Boards"
 krcw_usa_delta_wage_boards_desc:0 "The Greenville method is extended across the South: a wage board in every cotton county, half Black and half white, with the price set by the board and not by the planter. The southern bosses lose an old weapon, and the pickers gain a contract they can take to court."
 krcw_usa_states_rights_pact:0 "The States' Rights Pact"
 krcw_usa_states_rights_pact_desc:0 "New Orleans and the southern bosses sign an unpublished pact: the federal government stops interfering in state primaries and crossings, and the southern members promise to vote for the war budget. The colour line holds, and the reception camps across the river grow every month."
 krcw_usa_black_guardsmen:0 "Black Guardsmen"
 krcw_usa_black_guardsmen_desc:0 "The Guard in the Delta counties begins enlisting Black veterans, and the Helena and Vicksburg crossings are held by mixed companies. People thinking of crossing see their own kind standing guard on the bank, and half as many go east."
 krcw_usa_crossing_passes:0 "The Crossing Pass System"
 krcw_usa_crossing_passes_desc:0 "The southern counties issue passes at the crossings, and any Black man without one is detained. The Guard adds posts along the river and the prison farms gain a gang of labour. The east-bank radio has the pass printed on leaflets."
 krcw_usa2_20_t:0 "Earl's Hundred Days"
 krcw_usa2_20_d:0 "Earl Long is in the mansion with a far worse hand than his brother's: a machine that answers to money and not to men, a set of generals only just quieted, and a treasury propped up by oil and Russian loans. He knows the honeymoon lasts a hundred days before the machine starts testing its new owner. Earl must decide which card to play first."
 krcw_usa2_20.a:0 "Push reform: the franchise, a civil service, open books."
 krcw_usa2_20.b:0 "Steady the machine first; reform can wait."
 krcw_usa2_20.c:0 "Throw the generals a bone to keep them quiet."
 krcw_usa2_21_t:0 "The Party's Answer"
 krcw_usa2_21_d:0 "Earl sends his programme to the Union Party national committee. The governors, the southern members and the machine's old cadre sit in one hall, and Earl has none of his brother's power to bring that hall to its feet; he has a deck of cards and a ledger of favours. Whether the committee gives him the mandate he wants is not his alone to decide."
 krcw_usa2_21.a:0 "Go to the floor and work it table by table."
 krcw_usa2_21.b:0 "Let the governors carry the message; stay in the mansion."
 krcw_usa_hundred_days_roll_tt:0 "Whether the committee gives Earl his reform mandate depends on how he came to office, the state of the machine, the handling of the colour line and stability."
 krcw_usa2_22_t:0 "Earl Gets His Mandate"
 krcw_usa2_22_d:0 "The committee passes Earl's programme before dawn. Earl spends the ledger of favours he has kept for twenty years and gets a franchise act, a civil service on merit and a published budget. The governors keep their chairs, and for the first time they must make their books public."
 krcw_usa2_22.a:0 "Send the new laws out to the states."
 krcw_usa2_23_t:0 "The Machine Beats Earl"
 krcw_usa2_23_d:0 "The committee strips Earl's programme to an empty shell. The franchise act becomes a \"recommendation for study\", the civil service is deleted, the published budget becomes one \"to be released in due course\". The governors do not rebel; once the vote is over everything goes on as before. Earl's reform plan is shelved."
 krcw_usa2_23.a:0 "Then hold on, and do not fall off."
 krcw_usa2_24_t:0 "The Generals Are Watching"
 krcw_usa2_24_d:0 "The southern generals have been watching Earl from the side. There is only one thing they want to know: whether this new president is a man who can be gone around. The War Department sends up a budget demand, and Earl gets word that there is another dinner in San Antonio."
 krcw_usa2_24.a:0 "Move first and break the generals' clique up."
 krcw_usa2_24.b:0 "Give them budgets and exercises; keep them busy."
 krcw_usa2_24_v0:0 "Earl asked the War Department its price first, and the generals named it: three new armoured divisions, a budget that skips Congress, and the southern clique's men on the Joint Chiefs. The San Antonio dinner goes ahead, and this time they need not hide what they say."
 krcw_usa2_24_v1:0 "The committee stripped Earl's programme to a shell, and the southern generals saw it plainly: this president cannot manage his own party. The War Department sends up a budget demand, and there is another dinner in San Antonio."
 krcw_usa2_25_t:0 "The Council's First Order"
 krcw_usa2_25_d:0 "The tanks are back in barracks, but the Constitution is still \"suspended\". General Moseley sits in Long's old office on the second floor of the capitol with the Council's first formal order before him. He can make the emergency regime permanent, or set it a term, even a term that is only on paper. The generals wait for his signature."
 krcw_usa2_25.a:0 "Make the emergency the permanent order of the state."
 krcw_usa2_25.b:0 "Set it a term: constitutional rule returns when the fighting is settled."
 krcw_usa2_25.c:0 "Purge the unreliable officers first, and talk later."
 krcw_usa_junta_roll_tt:0 "The Council's order has to be carried out by the officer corps. Whether the corps follows depends on the nature of the order, the generals' standing, tension on the Line and war support."
 krcw_usa2_27_t:0 "The Permanent Emergency"
 krcw_usa2_27_d:0 "The corps follows. The Council promulgates a Basic Law of National Security in place of the suspended Constitution: no Congress, no elections, state governors doubling as military district commanders. Moseley becomes chairman of the Council for life. The east-bank radio reads the Basic Law out in full three times, and the Paris papers condemn it in their leaders."
 krcw_usa2_27.a:0 "A state built for war."
 krcw_usa2_28_t:0 "A Term on Paper"
 krcw_usa2_28_d:0 "The corps does not all follow. The older officers want a form of words, and the Russian mission too would rather see a government that can be explained. The Council declares the emergency has a term: Congress and elections return once the question of the Line is settled. The older officers accept the form of words, and Moseley remains chairman of the Council."
 krcw_usa2_28.a:0 "Keep the term, and keep the Council."
 krcw_usa_earls_new_deal:0 "Earl's New Deal"
 krcw_usa_earls_new_deal_desc:0 "Earl turns the mandate he won in the hundred days into law: a franchise act, a civil service on merit, a published federal budget. It is no Huey-style revolution but a chain of calculated trades. The machine is still there, and for the first time it has to run in daylight."
 krcw_usa_run_the_machine:0 "Run the Machine"
 krcw_usa_run_the_machine_desc:0 "Reform ran aground in the party committee, and Earl drops his plan to remake the machine; like his brother, he trades contracts and posts for the loyalty of the state parties. The books grow messier, and the war budget has not once been held up."
 krcw_usa_earls_america:0 "Earl's America"
 krcw_usa_earls_america_desc:0 "Two years after the succession Earl Long is on his feet. The generals and the bosses both know what they can and cannot get from him. The east-bank executive begins redrawing its plans around the new government in New Orleans."
 krcw_usa_the_basic_law:0 "The Basic Law of National Security"
 krcw_usa_the_basic_law_desc:0 "The Council's Basic Law of National Security replaces the suspended Constitution: no Congress, no elections, governors doubling as district commanders. The ministries' budgets and appointments pass to the Council's staff, whose first task is to prepare the crossing."
 krcw_usa_the_emergency_term:0 "The Term of the Emergency"
 krcw_usa_the_emergency_term_desc:0 "The officer corps wants a form of words, and the Russian mission wants a government that can be explained. The Council sets the emergency a term: constitutional rule returns once the question of the Line is settled. The older officers go on obeying the Council because of it, and the Russian mission reports the term to Moscow."
 krcw_usa_the_council_state:0 "America Under the Council"
 krcw_usa_the_council_state_desc:0 "The Council of Generals is firmly in place. A call-up or a conversion order reaches every county within a month, and the factories schedule their work on the Council's orders. Outside the South few state members or newspapers still criticise the Council openly."
 krcw_usa2_32_t:0 "Earl on the Farm"
 krcw_usa2_32_d:0 "Earl Long has spent months on his farm near Winnfield in Louisiana, and the visitors have never stopped: governors, county bosses, several members who lost their seats. They talk no politics, only cards and fishing, but the Bureau reports that after every game someone drives back to New Orleans through the night. The Council of Generals must decide how to treat the former president."
 krcw_usa2_32.a:0 "Confine him to the farm and register every visitor."
 krcw_usa2_32.b:0 "Invite him to sit on the Council as civilian adviser."
 krcw_usa2_32.c:0 "Leave him be. An old man playing cards is no threat."
 krcw_usa2_32_v0:0 "Since the Basic Law, Earl Long's farm has become the busiest place in the South. Governors, county bosses and members without seats take turns at cards and fishing, and the Bureau reports that after every game someone drives back to New Orleans through the night. The Council must decide how to treat the former president."
 krcw_usa2_30_t:0 "One Year On"
 krcw_usa2_30_d:0 "A year has passed since the succession crisis. The new government in New Orleans is on its feet, and New York across the Line has found a new way of talking about it. Which road this half of America has taken is now plain to see."
 krcw_usa2_30.a:0 "This is what the succession came to."
 krcw_usa2_30_v0:0 "Earl Long has governed a year; the franchise act and the merit civil service are in force, and for the first time the federal budget is sold as a pamphlet at the newsstands. The southern bosses grumble and none of them rebels. The east-bank radio no longer says New Orleans answers to one man; it says the reforms are \"only a new way of sharing out the spoils\"."
 krcw_usa2_30_v1:0 "Earl Long has governed a year, and the machine runs as before, contracts and posts shared out by favour. The war budget has never been held up once, and the books grow ever harder to read. The east-bank radio is reading out \"the Kingfish's ten per cent\" again, with \"the Earl\" in place of \"the Kingfish\"."
 krcw_usa2_30_v2:0 "The Council of Generals has ruled a year; the Basic Law has replaced the Constitution and governors double as district commanders. A call-up or a conversion order reaches every county within a month. The east bank has doubled its divisions on the Line, and the armistice observers report new works on the bank every week."
 krcw_usa2_30_v3:0 "The Council of Generals has ruled a year; the emergency remains, and so does the term written on paper. The older officers obey as before, and the Russian mission reports to Moscow that the New Orleans government \"can be explained\". Every week the east-bank radio asks when the question of the Line will count as settled."
 krcw_usa2_8_t:0 "The Accord's Auditors"
 krcw_usa2_8_d:0 "The auditors from Moscow spend a month in New Orleans going through the books to see where the Russian credits went. Their report has gone back to the Supreme Directory, and the size of the next tranche of machine tools and loans depends on how Moscow reads it."
 krcw_usa2_8.a:0 "Await Moscow's answer."
 krcw_usa2_8_v0:0 "The Moscow auditors spend a month on the New Orleans books. The comptroller system has left clean accounts, and every Russian credit can be traced to where it went. The report has gone back to the Supreme Directory, and the next tranche depends on how Moscow reads it."
 krcw_usa2_8_v1:0 "The Moscow auditors spend a month on the New Orleans books. The contract office's accounts reconcile only by half, and the other half is with \"friends\". The report has gone back to the Supreme Directory, and the next tranche depends on how Moscow reads it."
 krcw_wca2_1_t:0 "The Draft Electoral Law"
 krcw_wca2_1_d:0 "With the Federations' Compact signed, the Congress must draft the electoral law for the first federation-wide election since the civil war. The dispute is over who votes: Reuther wants a vote for every worker, farmer and soldier, refugees fresh across the river included, while several of the old federations want the vote for union-card holders only. The southern textile districts and the reception camps on the river are waiting for the draft."
 krcw_wca2_1.a:0 "One person, one vote, refugees and soldiers included."
 krcw_wca2_1.b:0 "Only union-card holders vote."
 krcw_wca2_2_t:0 "Voters in the Reception Camps"
 krcw_wca2_2_d:0 "The law gives the refugees the vote, and the reception camps at Memphis and Cairo suddenly hold tens of thousands of voters. The security committee warns the executive that agents from the far bank may be among them and wants screening before registration. The reception committees answer that the longer screening takes, the more the refugees will feel like second-class people."
 krcw_wca2_2.a:0 "Let the reception committees register them on the spot."
 krcw_wca2_2.b:0 "Screen through the security committee first, then register."
 krcw_wca2_3_t:0 "Those Without a Card"
 krcw_wca2_3_d:0 "After the card-holders-only draft is published, Randolph calls a protest meeting in Birmingham. He points out that the old craft unions do not admit Black men, so more than half the Black workers of the South hold no card and cannot vote. The executive can issue provisional cards, or stand by the draft."
 krcw_wca2_3.a:0 "Issue provisional cards to every worker in employment."
 krcw_wca2_3.b:0 "Stand by the draft. The rule stays."
 krcw_wca2_4_t:0 "Who Counts the Ballots"
 krcw_wca2_4_d:0 "The voting will take place at the benches, in the pits, on the docks and in the barracks. The federations distrust one another and want every ballot counted jointly by delegates of two different federations, which would take more than a week. The executive's statistical office says it can finish in three days."
 krcw_wca2_4.a:0 "Two federations count together, however slow."
 krcw_wca2_4.b:0 "Give it to the statistical office: results in three days."
 krcw_wca2_4_v0:0 "The voting will take place at the benches, in the pits, on the docks and in the barracks, with ballot boxes in the reception camps too. The federations distrust one another and want every ballot counted jointly by delegates of two different federations, which would take more than a week. The executive's statistical office says it can finish in three days."
 krcw_wca2_4_v1:0 "The voting will take place at the benches, in the pits, on the docks and in the barracks, and only card holders receive ballots. The federations distrust one another and want every ballot counted jointly by delegates of two different federations, which would take more than a week. The executive's statistical office says it can finish in three days."
 krcw_wca_turnout_roll_tt:0 "Whether every federation accepts the result depends on how the ballots are counted, how wide the franchise is, relations among the federations and stability."
 krcw_wca2_5_t:0 "Every Federation Signs"
 krcw_wca2_5_d:0 "The election is over and every federation's scrutineers sign the result; not one lodges an objection. Turnout is high, with queues even on the Memphis docks and at the Kentucky pits. In the Black churches of Memphis, Vicksburg and New Orleans the news is quietly passed along."
 krcw_wca2_5.a:0 "Print the result as leaflets and send it across the river."
 krcw_wca2_5.b:0 "Keep it quiet and get the new Congress sitting."
 krcw_wca2_5_v0:0 "The election is over and every federation's scrutineers sign the result; the refugees in the camps voted too, and no federation objects. In the Black churches of Memphis, Vicksburg and New Orleans the word goes quietly round that over the river even those just across can vote."
 krcw_wca2_6_t:0 "Detroit Rejects the Count"
 krcw_wca2_6_d:0 "The auto federation refuses to sign the result, saying the statistical office over-counted in Pittsburgh and Kentucky. The steel and mine federations accuse Detroit of being a bad loser. That night the radio across the river broadcasts Detroit's statement of protest."
 krcw_wca2_6.a:0 "Set up a recount commission with every federation represented."
 krcw_wca2_6.b:0 "The executive certifies the result. No further discussion."
 krcw_wca_the_open_franchise:0 "The Open Franchise"
 krcw_wca_the_open_franchise_desc:0 "One person, one vote is written into the Federations' Compact: everyone working on the east bank has a vote, card or no card, however long since they crossed. The camp registration offices become permanent, and people who cross east can have a voter's card the next day."
 krcw_wca_the_card_franchise:0 "The Card Franchise"
 krcw_wca_the_card_franchise_desc:0 "The vote is tied to the union card, which gives the old federations' organisers real power: whoever issues the card decides who votes. Federation membership rises fast, and those without a card stay outside the Congress."
 krcw_wca_the_scrutineers:0 "The Joint Scrutineers"
 krcw_wca_the_scrutineers_desc:0 "Joint counting by two federations becomes the rule for every election and every strike ballot. It is slow, and every federation trusts it, so the quarrels over counting in the Congress die away."
 krcw_wca_the_recount_commission:0 "A Standing Recount Commission"
 krcw_wca_the_recount_commission_desc:0 "Detroit's protest leaves behind a standing body, a recount commission staffed by each federation in turn. It can settle the next dispute, and it adds a month to every election. The auto federation still holds that the 1950 result was unjust."
 krcw_wca2_7_t:0 "The Second Elected Congress"
 krcw_wca2_7_d:0 "The first elected Congress is halfway through its term. The federations have grown used to the new electoral rules, and every bill of the executive must pass the hall. The papers across the river still print nothing about elections in the east."
 krcw_wca2_7.a:0 "Carry on under the new rules."
 krcw_wca2_7_v0:0 "The first elected Congress is halfway through its term; joint scrutiny has been used for three strike ballots without one dispute. People crossing east get their voter's cards faster than their housing. The papers across the river still print nothing about it, and in the Black churches of New Orleans everyone knows."
 krcw_wca2_7_v1:0 "The first elected Congress is halfway through its term and the recount commission has sat four times. The auto federation's delegates often walk out together, and the executive's bills take months to pass. The radio across the river makes a programme of Detroit's protests every week."
 krcw_wca2_10_t:0 "The Third Line"
 krcw_wca2_10_d:0 "Carlson's defence in depth puts the third line in the Appalachians. Fortifying the hills means taking the reconstruction board's steel and the miners' labour, and John L. Lewis's Mine Workers have already objected. Some on the General Staff would rather build no hill line at all and spend the money on mobile reserves behind the river."
 krcw_wca2_10.a:0 "Build the third line in the hills."
 krcw_wca2_10.b:0 "Spend it on mobile reserves behind the river."
 krcw_wca2_11_t:0 "Lewis Says No"
 krcw_wca2_11_d:0 "John L. Lewis calls the Mine Workers to a convention in Charleston and announces that the miners will stop work if the General Staff takes the steel for the coal branch lines to build bunkers. Carlson sends a man to talk. The General Staff can draft the miners into labour battalions, or promise to finish the coal lines before work on the bunkers begins."
 krcw_wca2_11.a:0 "Draft the miners into labour battalions."
 krcw_wca2_11.b:0 "Finish the coal lines first, then the bunkers."
 krcw_wca2_12_t:0 "Reserves Behind the River"
 krcw_wca2_12_d:0 "Mobile reserves need lorries, and the lorries are in Detroit. The auto federation says its civilian orders run into next year, and the tractors and buses are due too. The General Staff can ask Detroit to switch production, or move the reserves by rail on military spurs laid behind the river."
 krcw_wca2_12.a:0 "Ask Detroit to switch to army lorries."
 krcw_wca2_12.b:0 "Move them by rail on military spurs."
 krcw_wca_reserve_lorries:0 "Lorries for the Reserves"
 krcw_wca2_13_t:0 "The Raid at Cairo"
 krcw_wca2_13_d:0 "On a moonless night the west bank's Frontier Rangers cross the Mississippi south of Cairo and strike an ammunition depot at the mouth of the Ohio. The garrison on the bank fights through the night, and the front command reports to the General Staff only after dawn. New York must wait for the front's report to learn whether the line held."
 krcw_wca2_13.a:0 "Wait for the front's report."
 krcw_wca2_13_v0:0 "The hill bunkers are not yet finished, and only the first-line garrison holds the bank. On a moonless night the west bank's Frontier Rangers cross the Mississippi south of Cairo and strike an ammunition depot at the mouth of the Ohio. The garrison fights through the night, and the front reports to the General Staff only after dawn."
 krcw_wca2_13_v1:0 "The mobile reserves are quartered some tens of miles behind the river. On a moonless night the west bank's Frontier Rangers cross the Mississippi south of Cairo and strike an ammunition depot at the mouth of the Ohio. The garrison on the bank fights through the night, and by the time the reserves arrive it is light."
 krcw_wca_raid_roll_tt:0 "The raid's outcome depends on the east bank's preparations (the miners' cooperation, the reserves' lorries, the river scouts and defence in depth) and on the strength of the west bank's Rangers."
 krcw_wca2_14_t:0 "The Rangers Are Thrown Back"
 krcw_wca2_14_d:0 "The front reports that the Rangers failed to blow the depot and were back across before dawn, leaving dozens of dead and a sunk motor launch. Carlson tells the Congress that the raid has proved the General Staff's dispositions right. The executive must decide how to answer the west bank."
 krcw_wca2_14.a:0 "Answer in kind: blow one of their crossings."
 krcw_wca2_14.b:0 "Hand the prisoners and the evidence to the armistice commission."
 krcw_wca2_15_t:0 "The Line Gave Way"
 krcw_wca2_15_d:0 "The Rangers blew the depot and stayed a whole day on the east bank, burning the granaries of two villages before they withdrew. The Congress military committee demands that Carlson explain, and several delegates move to overturn the General Staff's dispositions. Carlson says the plan was sound and the fault lay in carrying it out."
 krcw_wca2_15.a:0 "Do as the Congress asks and switch to the other system."
 krcw_wca2_15.b:0 "Back Carlson and relieve the front commanders."
 krcw_wca2_15_v0:0 "The Rangers blew the depot and stayed a whole day on the east bank, burning the granaries of two villages before they withdrew. The hill bunkers were too far from the bank to matter, and the drafted miners tell the papers that they worked half a year for nothing. The Congress military committee demands that Carlson explain, and several delegates move to abandon the hill line."
 krcw_wca2_16_t:0 "The Appalachian District"
 krcw_wca2_16_d:0 "A year has passed since the Cairo raid. The Appalachian district holds the whole river line, its dispositions are settled, and every company rotates under the new rules. The west bank's Rangers have not come again."
 krcw_wca2_16.a:0 "Hold the river."
 krcw_wca2_16_v0:0 "A year has passed since the Cairo raid. The hill bunkers are finished, there are three lines between the bank and the Appalachians, and the miners work their contracted shifts between the coal lines and the works. The Rangers have not come again, and the armistice observers say the east-bank works go deeper every year."
 krcw_wca2_16_v1:0 "A year has passed since the Cairo raid. The mobile reserves wait behind the river and can reach the bank within hours of an alarm. The Rangers have not come again, and the armistice observers report that the east-bank reserves are quartered closer to the river every season."
 krcw_wca_the_appalachian_redoubt:0 "The Appalachian Redoubt"
 krcw_wca_the_appalachian_redoubt_desc:0 "The hill line becomes a permanent work under the Appalachian district. Supply roads join the three lines on the bank, in the hills of Tennessee and Kentucky and in the mountains, and the Mine Workers send men under contract to maintain them. An enemy coming over the river will meet another line behind each one he breaks."
 krcw_wca_the_river_reserve:0 "The River Reserve"
 krcw_wca_the_river_reserve_desc:0 "The Appalachian district's main body becomes a mobile reserve quartered behind the river, with lorries and military rail spurs to bring it to any crossing within hours. If a bank garrison is attacked, the reserve can be there before dawn."
 krcw_wca_river_reserve:0 "The River Reserve"
 krcw_wca_the_appalachian_district:0 "Reorganise the Appalachian District"
 krcw_wca_the_appalachian_district_desc:0 "After the Cairo raid the Appalachian district is reorganised on the new dispositions, its divisions taking turns on the river and the relieved units going back to train. For the first time the river line has a fixed establishment and a rotation roster."
 krcw_wca2_20_t:0 "The Two Currents That Lost"
 krcw_wca2_20_d:0 "The Congress has chosen its road, and the delegates of the two currents that lost are still in the hall. They have their own papers, their own federations and real votes. The executive must decide whether to bring them onto the executive to share the work, or let the winning current govern alone."
 krcw_wca2_20.a:0 "Bring them onto the executive."
 krcw_wca2_20.b:0 "The winning current governs alone."
 krcw_wca2_20_v0:0 "The Congress has chosen Reuther's Builders' road. Foster and Cannon's Liberators are still in the hall with the veterans' association and the southern textile districts behind them, and the One Big Union men are the best organised on the docks and in the pits. The executive must decide whether to bring them onto the executive or let the Builders govern alone."
 krcw_wca2_20_v1:0 "The Congress has chosen Cannon's Liberators' road. Reuther's Builders still hold the Detroit and Pittsburgh federations, and the lorries and steel a crossing needs are in their hands; the One Big Union men are the best organised on the docks and in the pits. The executive must decide whether to bring them onto the executive or let the Liberators govern alone."
 krcw_wca2_20_v2:0 "The Congress has chosen Flynn's One Big Union road, and the industrial federations are to merge into one organisation. Reuther's Builders and Cannon's Liberators are both still in the hall, and the federation executives fear for their budgets and charters once they merge. The executive must decide whether to bring both currents onto the executive or let the One Big Union men govern alone."
 krcw_wca2_21_t:0 "The Price of a Joint Executive"
 krcw_wca2_21_d:0 "The two losing currents agree to join the executive, and they name a price. Each wants the thing it cares most about kept safe under the new road. The executive can agree, or agree to half."
 krcw_wca2_21.a:0 "Agree to their terms."
 krcw_wca2_21.b:0 "Agree to half. The road is not up for discount."
 krcw_wca2_21_v0:0 "The Liberators agree to join the executive on condition that the river brigades' budget is not cut and the veterans' association has seats on the military committee. The One Big Union men want the dock and pit locals to keep their strike ballots. The executive can agree, or agree to half."
 krcw_wca2_21_v1:0 "The Builders agree to join the executive on condition that Detroit's civilian orders are not all converted and the model city works do not stop. The One Big Union men want the dock and pit locals to keep their strike ballots. The executive can agree, or agree to half."
 krcw_wca2_21_v2:0 "The Builders and Liberators agree to join the executive on condition that the auto and steel federations keep their own budgets after the merger, and the People's Army chain of command stays outside the new union. The executive can agree, or agree to half."
 krcw_wca2_22_t:0 "Governing Alone"
 krcw_wca2_22_d:0 "The winning current forms the executive alone. The losing currents' papers begin attacking the new road point by point, and their votes in the Congress are enough to hold up every bill. The executive can restrict the opposition papers, or simply tighten discipline at votes."
 krcw_wca2_22.a:0 "Cut the opposition papers' newsprint allocation."
 krcw_wca2_22.b:0 "Tighten discipline at votes, nothing more."
 krcw_wca_currents_roll_tt:0 "Whether the losing currents stay or walk out depends on how the executive treats them, whether the election was accepted, the Federations' Compact and stability."
 krcw_wca2_23_t:0 "All Three Currents Stay"
 krcw_wca2_23_d:0 "The two losing currents stay in the Congress; their papers go on printing and their delegates go on voting. Every bill of the new road is fought over in the hall, and once the fight is done every federation carries it out. The Internationale's executive in Paris sends a man to New York to see how it works."
 krcw_wca2_23.a:0 "Let the Paris comrades come and see."
 krcw_wca2_24_t:0 "A Federation Walks Out"
 krcw_wca2_24_d:0 "One of the losing currents takes its federation out of the Congress and announces that it will not vote again until the new road is corrected. Its papers still print and its plants still run, but the executive's bills are short a large block of votes. The radio across the river reports it that night."
 krcw_wca2_24.a:0 "Let them go. The Congress sits as usual."
 krcw_wca2_24.b:0 "Send someone to talk, and promise to reopen the road at the next Congress."
 krcw_wca2_24_v0:0 "The Liberators take the veterans' association and the southern textile federations out of the Congress and announce that they will not vote again until the executive prepares the crossing. Their papers still print and the plants still run, but the Builders' bills are short a large block of votes. The radio across the river reports it that night."
 krcw_wca2_24_v1:0 "The Builders take the auto and steel federations out of the Congress and announce that they will not vote again until the executive drops the crossing plan. The Detroit and Pittsburgh plants still run, but the Liberators' crossing budget is short a large block of votes. The radio across the river reports it that night."
 krcw_wca2_24_v2:0 "The auto and steel federations refuse the merger and take their delegates out of the Congress. The dock and pit locals go into the big union as planned, but the two largest plant systems on the east bank stay out. The radio across the river reports it that night."
 krcw_wca2_25_t:0 "A Letter from Paris"
 krcw_wca2_25_d:0 "The man the Internationale's executive sent to New York is back in Paris, and his report is before the executive. How Paris views the American section's road will decide where the next convoys, machine tools and volunteers go."
 krcw_wca2_25.a:0 "Await the executive's decision."
 krcw_wca_paris_aid:0 "Aid from Paris"
 krcw_wca2_25_v0:0 "The Internationale's envoy is back in Paris from New York. His report says all three American currents have stayed in the Congress and the new road is being carried out. The executive is discussing where the next convoys, machine tools and volunteers will go."
 krcw_wca2_25_v1:0 "The Internationale's envoy is back in Paris from New York. His report says one American federation has left the Congress and the executive's bills often lack the votes. The executive is discussing where the next convoys, machine tools and volunteers will go, and some propose waiting until New York sorts itself out."
 krcw_wca2_26_t:0 "After the Road"
 krcw_wca2_26_d:0 "More than a year after the road was chosen, the east bank runs in the new direction. The quarrels in the Congress go on, and everyone knows which road this republic has taken."
 krcw_wca2_26.a:0 "Go on down this road."
 krcw_wca2_26_v0:0 "More than a year after the road was chosen, all three currents are still in the Congress. The executive seats the editors of three different papers; every bill is fought over before it passes, and once it passes every federation carries it out. Paris has circulated the American executive's rules to the other national sections."
 krcw_wca2_26_v1:0 "More than a year after the road was chosen, the federation that walked out has not come back. The executive's bills scrape through on the votes that remain, and the departed current attacks them point by point in its own paper. The radio across the river makes a programme of it every week."
 krcw_wca_the_joint_executive:0 "The Three-Current Executive"
 krcw_wca_the_joint_executive_desc:0 "The three currents sit on the executive in proportion, with the chair from the winning current and the vice-chair rotating between the other two. Every bill outside the road itself needs the consent of at least two currents. The quarrels in the Congress go on, and the federations carry out what is decided."
 krcw_wca_the_disciplined_congress:0 "A Disciplined Congress"
 krcw_wca_the_disciplined_congress_desc:0 "The seats left by the federation that walked out are filled at by-elections, and the executive rules that delegates vote by current. Bills pass faster, and the departed current says in its own paper that the Congress has become the executive's rubber stamp."
 krcw_wca_the_road_secured:0 "The Road Secured"
 krcw_wca_the_road_secured_desc:0 "The new road is written into the Federations' Compact, and changing it at the next Congress will need a two-thirds vote. The executive's appointments and budgets are all arranged along it."
 krcw_jap2_1_t:0 "The General Staff's Memorandum"
 krcw_jap2_1_d:0 "Ishiwara's former officers hand the cabinet a memorandum demanding that the \"police reserve\" be openly expanded into an army able to win back the continent. Kishi has let the paper sit on his desk for three days without a word. The generals are waiting for an answer, and so are the liberals in the Diet."
 krcw_jap2_1.a:0 "Back the generals."
 krcw_jap2_1.b:0 "Let the cabinet steer; make no promises."
 krcw_jap2_1.c:0 "Refer the question to the Diet."
 krcw_jap2_2_t:0 "Ishiwara's List"
 krcw_jap2_2_d:0 "The generals bring a list: which harbours to enlarge, which divisions to motorise, which \"overly cautious\" officers to retire. They already treat it as the cabinet's consent. Kishi knows that once he signs, the defence budget will be rewritten around that list."
 krcw_jap2_2.a:0 "Proceed on the list."
 krcw_jap2_2.b:0 "Approve the harbours and training, shelve the personnel."
 krcw_jap2_3_t:0 "The Bureaucrat's Balance"
 krcw_jap2_3_d:0 "Kishi gathers the bureau chiefs of the Army, Finance and Commerce ministries. He wants an army that is enough, not one that can drag him into a war. The budget is pulled between three ministries; the generals get less money than they asked for, and the Army Ministry accepts it."
 krcw_jap2_3.a:0 "Rearm, but keep the purse in civilian hands."
 krcw_jap2_3.b:0 "Turn the military budget toward the industrial belt."
 krcw_jap2_4_t:0 "The Echo of Taishō"
 krcw_jap2_4_d:0 "Katayama and Yoshida stand together in the Diet, a rare sight: the army is a matter for the cabinet and the chamber to decide, not for a General Staff memorandum. The galleries are packed with the young, and the National Spirit League members walk out in protest."
 krcw_jap2_4.a:0 "Support the Diet's oversight of the army."
 krcw_jap2_4.b:0 "A gesture only; the preparation goes on."
 krcw_jap2_5_t:0 "The Day of Interpellations"
 krcw_jap2_5_d0:0 "The generals' list is leaked to the Paris press, and Nanjing lodges an immediate protest in the chamber. On the day of interpellations, the National Spirit League's members demand that \"Return to the Continent\" be written into the government programme; the liberals demand the cabinet say plainly whether Japan means to fight again."
 krcw_jap2_5_d1:0 "On the day of interpellations the Diet debates the army openly for the first time. The National Spirit League demands that \"Return to the Continent\" be written into the government programme; Katayama demands the cabinet promise that not a single soldier will cross the sea without the Diet's consent."
 krcw_jap2_5_d2:0 "The day of interpellations arrives. The National Spirit League's members demand that \"Return to the Continent\" be written into the government programme; the liberals demand the cabinet clarify its stand. Kishi sits in the premier's seat, knowing that whatever he answers will offend half the chamber."
 krcw_jap2_5.a:0 "Write Return to the Continent into the programme."
 krcw_jap2_5.b:0 "Promise no crossing without the Diet."
 krcw_jap2_6_t:0 "The Road of Return"
 krcw_jap2_6_d:0 "\"Return to the Continent\" is now official policy. The generals congratulate one another; the Finance Ministry begins to reckon how much money, how many ships and how many years it will take. The Foreign Ministry begins preparing its explanations for Nanjing and Paris."
 krcw_jap2_6.a:0 "The nation's course is set."
 krcw_jap2_7_t:0 "Holding What We Have"
 krcw_jap2_7_d:0 "The cabinet promises the Diet that Japan's forces are for self-defence only, and that the line runs around the home islands and Formosa. The generals are unhappy, but the budget passes and Kishi's cabinet keeps its majority."
 krcw_jap2_7.a:0 "Defence, not revenge."
 krcw_jap2_8_t:0 "The Course Is Set"
 krcw_jap2_8_d0:0 "The front pages in Tokyo carry the last line of the government programme: \"The Empire does not recognise the borders of 1944 as permanent.\" Nanjing and Paris have both read it, and the General Staff begins revising its war plans to match."
 krcw_jap2_8_d1:0 "The front pages in Tokyo carry the premier's pledge that Japan's forces exist to guard the home islands and Formosa. The generals answer on the editorial pages. The cabinet puts next year's budget into the industrial belt and exports."
 krcw_jap2_8.a:0 "Turn the page."
 krcw_jap2_20_t:0 "Broadcasts Across the Strait"
 krcw_jap2_20_d:0 "Every night Nanjing's radio broadcasts to Formosa in Hokkien, calling on the islanders to \"return to the motherland\". The Government-General in Taipei reports that the audience is growing. The cabinet must decide how to answer: with barbed wire, with the ballot, or by doing nothing and leaving it to the Government-General."
 krcw_jap2_20.a:0 "Turn Formosa into a fortress."
 krcw_jap2_20.b:0 "Win hearts with an assembly."
 krcw_jap2_20.c:0 "Leave it to the Government-General."
 krcw_jap2_21_t:0 "The Last Gate"
 krcw_jap2_21_d:0 "The naval staff call Formosa \"the Empire's last gate\". The plan to fortify it lies on the table: batteries in the Pescadores, minefields at Kaohsiung, airfields at Taipei. It needs money, and it needs an explanation to the Formosans for why the island is to be filled with soldiers."
 krcw_jap2_21.a:0 "Fortify in full."
 krcw_jap2_21.b:0 "Hold only the ports and airfields."
 krcw_jap2_22_t:0 "The Assembly in Taipei"
 krcw_jap2_22_d:0 "The assembly opens in Taipei. The members argue in Taiwanese and Japanese over sugar prices and schools, and no one speaks of \"returning to the motherland\". Nanjing's broadcasts have lost half their audience. But some officers worry that a Formosa that can speak will one day say no."
 krcw_jap2_22.a:0 "Widen the assembly's powers."
 krcw_jap2_22.b:0 "Give it hearts, not command."
 krcw_jap2_23_t:0 "The Governor's Way"
 krcw_jap2_23_d:0 "The Government-General in Taipei handles it in its own way: a few railways, a few sugar mills, a few arrests of the \"autonomy movement\" organisers. Neither fortress nor assembly, only continued rule. The cabinet is relieved and turns its attention back to the home islands."
 krcw_jap2_23.a:0 "The status quo will do."
 krcw_jap2_24_t:0 "The Korea Question"
 krcw_jap2_24_d0:0 "Formosa is settled; now Korea returns. The General Staff's Korea Section says the Kim Won-bong government in Seoul is not yet secure, the pro-Japanese old officials are still there, and the chance will not last. But to recover Korea takes ships, troops and a cabinet willing to give the order. And the Russians offer a bargain: recognition of Japan's \"historic rights\" in Korea, in exchange for giving up Manchuria."
 krcw_jap2_24_d1:0 "The Korea question is on the table. The General Staff's Korea Section says Kim Won-bong's government in Seoul is not yet secure and the chance will not last. The Russians offer a different bargain: recognition of Japan's \"historic rights\" in Korea, in exchange for dropping the claim on Manchuria."
 krcw_jap2_24.a:0 "Press the claim on Korea; begin to prepare."
 krcw_jap2_24.b:0 "Trade the Korea claim for Russian recognition."
 krcw_jap2_25_t:0 "The Korea Section's Plan"
 krcw_jap2_25_d:0 "The cabinet lets the Korea Section begin. Moji and Sasebo are to be enlarged, mobile divisions formed, airfields built on both sides of the Tsushima Strait. The order sets no date for war; it asks only that the forces be ready within a year. Nanjing's attaché has already delivered a note in Tokyo."
 krcw_jap2_25.a:0 "Begin the northward preparation."
 krcw_jap2_26_t:0 "Moscow's Answer"
 krcw_jap2_26_d0:0 "Moscow's note arrives: Russia recognises Japan's \"historic interests\" in the Korean peninsula, and Japan drops every claim on Manchuria. Tokyo gets only a diplomatic paper, but Nanjing's broadcasts sound more isolated from now on. The General Staff's Korea Section is reduced to a study room."
 krcw_jap2_26_d1:0 "Moscow replies that the Korean question is \"not suitable for discussion at present\". The Russians will not offend Nanjing for Tokyo's sake. The cabinet has given up Korea and got nothing for it, and the generals call it another surrender in the papers."
 krcw_jap2_26.a:0 "Accept the outcome."
 krcw_jap2_26.b:0 "Then Korea is open again."
 krcw_jap2_27_t:0 "Seoul's Answer"
 krcw_jap2_27_d0:0 "Seoul's answer comes fast. The Korean police sweep Busan and Incheon and arrest hundreds with ties to Japanese intelligence, and the Nanjing advisory group is doubled. Most of Japan's old network in Korea is broken."
 krcw_jap2_27_d1:0 "Seoul answers the Korea Section with a protest statement and nothing more. Korean officials of the old Government-General and landlords at odds with Seoul still wait for Tokyo's signal, and Japan's network in Korea survives."
 krcw_jap2_27.a:0 "Carry on with the preparation."
 krcw_jap2_27.b:0 "Slow down and wait."
 krcw_jap2_40_t:0 "The Old Officer Corps"
 krcw_jap2_40_d:0 "Half the Ground Self-Defence Force's officers are men of the old Imperial Army. They bring experience, and also factions, the habit of insubordination and a grudge over the defeat of 1944. The Safety Agency's screening board asks the cabinet: should the officer corps be cleaned out, or allowed to grow back into what it was?"
 krcw_jap2_40.a:0 "Screen the officer corps."
 krcw_jap2_40.b:0 "Experience matters more than loyalty."
 krcw_jap2_41_t:0 "The Screening Board"
 krcw_jap2_41_d:0 "The screening board's list stirs resentment in the barracks. Most of Ishiwara's former officers are on it, and they have friends in the press and the Diet. The board can enforce it strictly and clear out a whole generation of old officers, or go easy and remove only the most insubordinate few."
 krcw_jap2_41.a:0 "Enforce it strictly."
 krcw_jap2_41.b:0 "Remove only the most defiant."
 krcw_jap2_42_t:0 "Ishiwara's Shadow"
 krcw_jap2_42_d:0 "The old officer corps stays, and Ishiwara's disciples take the staff and the training schools again. They are Japan's most experienced soldiers, and the least bound by the cabinet. In the barracks the old phrase is heard again: \"the command authority is independent of the government.\""
 krcw_jap2_42.a:0 "Use their experience, tolerate their temper."
 krcw_jap2_42.b:0 "Put a civilian rein on them; reopen the screening."
 krcw_jap2_43_t:0 "The Hattori Affair"
 krcw_jap2_43_d:0 "Halfway through the screening a plot comes to light: a group of old staff officers on the list are said to be planning a coup to \"cleanse the political world\". The evidence is thin, but enough to alarm. The cabinet can make it public and bring it to trial, or handle it quietly and spare the army the embarrassment."
 krcw_jap2_43.a:0 "Bring it to public trial."
 krcw_jap2_43.b:0 "Handle it quietly and leave the rest alone."
 krcw_jap2_44_t:0 "The Old Guard in Charge"
 krcw_jap2_44_d:0 "The old officer corps not only stays but redefines the Japanese army: the offensive, the primacy of spirit, the tradition of insubordination all return. It is an army that will fight, and an army that may at any time act on its own. The civilians learn to speak carefully in front of the generals."
 krcw_jap2_44.a:0 "This is the Empire's army."
 krcw_jap2_45_t:0 "A New Officer Corps"
 krcw_jap2_45_d:0 "The core of the old guard is gone. Young officers trained at the Safety Academy fill the vacancies; they never served in Manchuria, and their promotion depends on examinations set by the Defence Agency. From now on the Ground Force appointments are signed by the civilian director."
 krcw_jap2_45.a:0 "A new army."
 krcw_jap2_tt_diet_line:0 "The memorandum went to the Diet, or the Diet has shelved the Return to the Continent"
 krcw_jap2_tt_not_diet:0 "The memorandum was not referred to the Diet"
 krcw_jap2_tt_revanche:0 "Return to the Continent is in the government programme"
 krcw_jap2_tt_korea:0 "The cabinet chose to press the claim on Korea"
 krcw_jap2_tt_purged:0 "The old-guard officers have been purged"
 krcw_jap2_tt_old_guard:0 "The old guard holds the army"
 krcw_jap2_continental_bureau:0 "Set Up the Continental Affairs Council"
 krcw_jap2_continental_bureau_desc:0 "The cabinet sets up a Continental Affairs Council in the premier's residence, run jointly by Ishiwara's former officers and the Foreign Ministry's Asia Bureau, to study the \"conditions of return\" for Manchuria and Korea. Nanjing prints the council's membership in its papers."
 krcw_jap2_white_paper:0 "Defence White Paper"
 krcw_jap2_defence_white_paper:0 "Publish the Defence White Paper"
 krcw_jap2_defence_white_paper_desc:0 "The cabinet publishes the first Defence White Paper: the self-defence forces exist to guard the home islands, Formosa and the South Seas islands, and their strength and budget go to the Diet every year. The generals say it hands the army to the Diet."
 krcw_jap2_9_t:0 "The Report and the White Paper"
 krcw_jap2_9_d0:0 "The Continental Affairs Council delivers its first report: recovering Korea needs two years of preparation and a cabinet ready to bear the consequences, and Manchuria must wait for the Russians' consent. The report goes to the premier, the Defence Agency director and the General Staff; the Diet receives a summary."
 krcw_jap2_9_d1:0 "The Defence White Paper passes the Diet. For the first time the self-defence budget is published item by item, and both the Social Masses Party and the Liberals vote for it. The General Staff's officers begin learning to explain budgets to members of the Diet."
 krcw_jap2_9.a:0 "Act on the report."
 krcw_jap2_tt_assembly:0 "The cabinet did not choose to turn Formosa into a fortress"
 krcw_jap2_tt_fortress:0 "The cabinet did not choose to win the Formosans with an assembly"
 krcw_jap2_sakhalin_oil:0 "The Sakhalin Oil Contract"
 krcw_jap2_sakhalin_oil_desc:0 "Russia supplies Sakhalin crude to Japan on a long-term contract, and Japan no longer mentions Manchuria. The Tokyo refineries have a steady supply, and the Foreign Ministry's Russia policy is tied to the contract."
 krcw_jap2_sakhalin_contract:0 "Sign the Long-Term Sakhalin Oil Contract"
 krcw_jap2_sakhalin_contract_desc:0 "The recognition bought with Korea must be made good. The Ministry of Commerce signs a ten-year contract with the Russian oil trust, and Sakhalin crude is shipped to Yokkaichi and Kawasaki at a fixed price. The price is that Japan finds it harder to say no to Moscow."
 krcw_jap2_tt_traded:0 "Moscow has recognised Japan's \"historic interests\" in Korea"
 krcw_jap2_merit_staff:0 "Promotion by Examination"
 krcw_jap2_merit_officer_corps:0 "Promote Officers by Examination"
 krcw_jap2_merit_officer_corps_desc:0 "With the old guard's core gone, promotion in the Ground Self-Defence Force is decided by the Defence Agency's examination board, and Safety Academy graduates fill vacancies first. The barracks factions lose the power to hand out posts."
 krcw_jap2_spirit:0 "The Spirit Doctrine"
 krcw_jap2_spirit_doctrine:0 "Restore the Spirit Doctrine"
 krcw_jap2_spirit_doctrine_desc:0 "The old-guard officers rewrite the Ground Self-Defence Force's field manual, putting the night attack, the bayonet charge and \"spirit over matter\" back into the regulations. Morale rises; equipment and supply still come second."
 krcw_jap2_joint_staff_council:0 "Form the Joint Staff Council"
 krcw_jap2_joint_staff_council_desc:0 "The chiefs of the three self-defence forces form a Joint Staff Council chaired by the Defence Agency director and answerable to the cabinet. For the first time a war plan needs a civilian signature before it goes out."
 krcw_jap2_46_t:0 "The Shape of the Army"
 krcw_jap2_46_d0:0 "The first list of officers promoted by examination is published, and not one of them served in the Kwantung Army. Several old generals tender their resignations, and the Defence Agency accepts them all. The Ground Force's factional struggle moves into the examination hall."
 krcw_jap2_46_d1:0 "The new manual reaches every division. Young officers shout slogans on night exercises, and the General Staff's old guard praise the troops in their reports for \"recovering the spirit of the Imperial Army\". The cabinet notices that fewer and fewer of the army's reports are copied to the civilians."
 krcw_jap2_46.a:0 "The army has its shape."
 krcw_psa2_1_t:0 "The Joint Committee's Report"
 krcw_psa2_1_d:0 "The joint committee of both houses on the War Powers Act submits its report. The conclusion is a single sentence: the orders the Western Defense Command has issued in the port military districts since 1942 have no basis in the Constitution of the United States. President Warren can publish the report, or hold it back and talk to MacArthur in private first."
 krcw_psa2_1.a:0 "Publish the report."
 krcw_psa2_1.b:0 "Hold it back."
 krcw_psa2_2_t:0 "Congress Sets a Deadline"
 krcw_psa2_2_d:0 "The report is on the front page of the San Francisco Chronicle. A majority in Congress demands that the port military districts be abolished within a year and San Francisco, Oakland, Los Angeles and Seattle handed back to their city and state governments. The Presidio officers say privately that this hands the defence of the West Coast to city councilmen. President Warren must give a date, or offer something else."
 krcw_psa2_2.a:0 "Promise to return the ports to civil government within a year."
 krcw_psa2_2.b:0 "Set up a joint civil-military council only."
 krcw_psa2_3_t:0 "The Lawyers' Strike"
 krcw_psa2_3_d:0 "Word that the report was held back gets out anyway. The San Francisco Bar Association refuses to appear before the military tribunals of the port districts, the cases pile up, and the dock unions declare their support for the lawyers. MacArthur asks the President to authorise the Western Defense Command to make arrests; Warren could instead offer the lawyers a way down."
 krcw_psa2_3.a:0 "Authorise the arrest of the Bar Association's leaders."
 krcw_psa2_3.b:0 "Set up a joint civil-military council and get the lawyers back to work."
 krcw_psa2_4_t:0 "Voices on the Waterfront"
 krcw_psa2_4_d0:0 "The ports are going back to their city governments, and the dock unions want a seat in the new order. Harry Bridges of the International Longshore and Warehouse Union proposes that if Congress calls a constitutional convention and writes both the limits of war powers and labour rights into the constitution, the West Coast docks will not strike."
 krcw_psa2_4_d1:0 "The joint civil-military council holds its first meeting and the dock union delegates are kept outside the door. Harry Bridges of the International Longshore and Warehouse Union announces that without a constitutional convention and labour rights written into the constitution, the docks of San Francisco, Oakland and Seattle will stop."
 krcw_psa2_4.a:0 "Bargain with Bridges."
 krcw_psa2_4.b:0 "Deport Bridges."
 krcw_psa2_5_t:0 "Wainwright's Plan"
 krcw_psa2_5_d0:0 "With the Bar Association's leaders in prison, General Wainwright puts forward a plan for the Presidio men: the War Powers Act is no longer to be renewed each year, and the port military districts stay \"until the day the United States is reunited\". MacArthur and the Western Defense Command staff have all signed it, and it goes to Congress."
 krcw_psa2_5_d1:0 "Bridges is put aboard a ship for Honolulu, and the dock unions call it kidnapping in the papers. General Wainwright puts forward a plan for the Presidio men: the War Powers Act is no longer to be renewed each year, and the port military districts stay \"until the day the United States is reunited\"."
 krcw_psa2_5.a:0 "Have Congress pass the plan."
 krcw_psa2_5.b:0 "Pass it, but keep the joint review committee."
 krcw_psa2_6_t:0 "Electing the Delegates"
 krcw_psa2_6_d0:0 "The convention delegates are elected. The dock unions and the Democrats win a majority, and Bridges himself is elected for San Francisco. The Presidio officers fear the new constitution will cut military spending; the Paris papers call it a left turn for the Constitutional Coalition."
 krcw_psa2_6_d1:0 "The convention delegates are elected. The veterans' associations' candidates win a majority, many of them voting in uniform. The new constitution will most likely keep the War Powers Act's military districts under another name."
 krcw_psa2_6_d2:0 "The convention delegates are elected. President Warren's Republicans win a majority, with seats for the dock unions and the veterans. The new constitution will be a moderate one: civilian government, with room left for the army."
 krcw_psa2_6.a:0 "Convene the convention."
 krcw_psa2_7_t:0 "The New Order in Sacramento"
 krcw_psa2_7_d0:0 "The bill of rights is back in force: habeas corpus is restored, military courts try only soldiers, the port military districts are abolished and Congress votes the defence budget line by line. MacArthur still commands the Western Defense Command, but for the first time his orders need the Secretary of War's countersignature."
 krcw_psa2_7_d1:0 "The port districts' military courts take in strikes, sedition and speech \"endangering the national defence\". The Western Defense Command declares that orders under the War Powers Act carry the same force as the Constitution, and Congress raises no objection. The docks and the law offices both go quiet."
 krcw_psa2_7.a:0 "This is the Constitutional Coalition."
 krcw_psa2_20_t:0 "Three Envoys"
 krcw_psa2_20_d:0 "In the same week New York's envoy arrives in Sacramento by train, New Orleans's lands at Los Angeles, and a cable from Honolulu reaches the President's desk. President Warren can see only one of them first, and whoever he sees first the San Francisco papers will call the Coalition's friend."
 krcw_psa2_20.a:0 "See New York's envoy first."
 krcw_psa2_20.b:0 "See New Orleans's envoy first."
 krcw_psa2_20.c:0 "See neither; answer Honolulu first."
 krcw_psa2_21_t:0 "Terms for Sacramento"
 krcw_psa2_21_d:0 "President Warren in Sacramento is willing to hear our terms. The Syndicates can offer generous terms, recognising the Coalition's autonomy in return for the release of the dock union leaders, or demand that the Pacific Fleet accept joint Syndicate command."
 krcw_psa2_21.a:0 "Recognise autonomy; ask only for the union leaders' release."
 krcw_psa2_21.b:0 "Demand joint command of the Pacific Fleet."
 krcw_psa2_22_t:0 "Sacramento's Price"
 krcw_psa2_22_d:0 "Sacramento has asked our envoy to talk. The United States can offer generous terms: the West Coast states keep their governors and congressmen, Warren is offered the vice-presidency and MacArthur a marshal's baton. Or it can demand that Sacramento hand the Pacific Fleet to the Navy Department in New Orleans."
 krcw_psa2_22.a:0 "The vice-presidency, the baton and autonomy."
 krcw_psa2_22.b:0 "The fleet must be handed over."
 krcw_psa2_23_t:0 "The Honolulu Cable"
 krcw_psa2_23_d0:0 "The Republic of Hawaii cables back that it will patrol the mid-Pacific jointly with the Constitutional Coalition and invites Tokyo and Canberra to discuss the safety of the sea lanes. Admiral Nimitz, commanding the Pacific Fleet, believes the Coalition can hold the West Coast without either bloc."
 krcw_psa2_23_d1:0 "The Republic of Hawaii's reply is cool: Honolulu does not want to be drawn into a quarrel between Americans. If the Coalition wants to stay neutral, it must rely on its own fleet. The envoys from New York and New Orleans are still waiting."
 krcw_psa2_23.a:0 "Take the road of armed neutrality."
 krcw_psa2_23.b:0 "Hear New York and New Orleans after all."
 krcw_psa2_24_t:0 "The President's Choice"
 krcw_psa2_24_d0:0 "The terms are on the table, and harsher than President Warren expected: the other side wants not only friendship but command of the Pacific Fleet. The cabinet and Congress both split in two, and Admiral Nimitz says the fleet is not for trading."
 krcw_psa2_24_d1:0 "The terms are on the table, and more generous than President Warren expected: autonomy for the Coalition, the Sacramento government left as it is, and the fleet still under Sacramento's command. What remains to decide is which side the Coalition leans to, or whether it leans to neither."
 krcw_psa2_24.a:0 "Take New York's terms."
 krcw_psa2_24.b:0 "Take New Orleans's terms."
 krcw_psa2_24.c:0 "Refuse; the Coalition will stand alone."
 krcw_psa2_25_t:0 "Armed Neutrality"
 krcw_psa2_25_d:0 "President Warren declares that the Coalition will join no bloc. Congress votes to expand the National Guard and the fleet stays at San Diego and Bremerton. The envoys of both sides are shown back to their ships. Without allies, the West Coast must rely on its own warships and soldiers."
 krcw_psa2_25.a:0 "Expand the National Guard."
 krcw_psa2_26_t:0 "After the Agreement"
 krcw_psa2_26_d0:0 "When the agreement with New York is published, army and navy officers hold a protest meeting in the Presidio. They have fought the Syndicates since 1936, and now they are to sit at a table with them. General Wainwright, speaking for the Presidio men, demands that the President explain himself."
 krcw_psa2_26_d1:0 "When the agreement with New Orleans is published, the dockers of San Francisco and Seattle walk out. Their leaflets say Sacramento has sold the West Coast to Long. The ports stop, and with them the fleet's supplies."
 krcw_psa2_26_d2:0 "The agreement is published. There is grumbling on the docks and in the Presidio, but no one opposes it openly. In a broadcast President Warren says the Coalition has found an ally, and that Sacramento's affairs are still decided in Sacramento."
 krcw_psa2_26.a:0 "Give the discontented something."
 krcw_psa2_26.b:0 "Dismiss whoever objects."
 krcw_psa2_tt_review:0 "The joint committee on the War Powers Act has reported"
 krcw_psa2_tt_no_crackdown:0 "The Bar Association's leaders were not arrested"
 krcw_psa2_tt_no_recall:0 "No promise to return the ports to civil government was made"
 krcw_psa2_tt_convention:0 "The constitutional convention has been called"
 krcw_psa2_tt_emergency:0 "The War Powers Act has been made open-ended"
 krcw_psa2_tt_no_convention:0 "No constitutional convention has been called"
 krcw_psa2_tt_not_no:0 "The Coalition did not take New Orleans's terms"
 krcw_psa2_tt_not_ny:0 "The Coalition did not take New York's terms"
 krcw_psa2_tt_ny:0 "The Coalition took New York's terms"
 krcw_psa2_tt_no:0 "The Coalition took New Orleans's terms"
 krcw_psa2_tt_third:0 "The Coalition chose armed neutrality"
 krcw_psa2_tt_emergency_not:0 "The War Powers Act has not been made open-ended"
 krcw_psa2_bill_of_rights:0 "Restore the Bill of Rights"
 krcw_psa2_bill_of_rights_desc:0 "The convention writes the rights the War Powers Act suspended back into the constitution: habeas corpus restored, military courts for soldiers only, the port military districts abolished, the defence budget voted line by line by Congress. President Warren chairs the drafting; the Presidio men insist on keeping a wartime mobilisation clause, and it goes into an annex."
 krcw_psa2_military_tribunals:0 "Widen the Military Tribunals"
 krcw_psa2_military_tribunals_desc:0 "Congress authorises the Western Defense Command to send strikes, sedition and speech \"endangering the national defence\" in the port districts to the military tribunals. The dock unions and the Bar Association go underground, and the Presidio men believe the West Coast can now prepare for war in peace."
 krcw_psa2_syndicate_yard_contracts:0 "Take the Syndicates' Yard Contracts"
 krcw_psa2_syndicate_yard_contracts_desc:0 "Under the agreement with New York, the yards of San Francisco Bay and Seattle take freighter orders from the Syndicates, settled in Paris Clearing Union units. The dock union leaders are released, and the workers on the slipways have Syndicate delegates for the first time."
 krcw_psa2_long_beach_tankers:0 "Open the Long Beach Tanker Line"
 krcw_psa2_long_beach_tankers_desc:0 "Under the agreement with New Orleans, tankers from the Russian Far East and the Gulf of Mexico call at Long Beach on a regular schedule, and the crude goes first to the Pacific Fleet. The dock unions protest the Russian crews, and security troops stand guard on the quays."
 krcw_psa2_pacific_patrol_compact:0 "Conclude the Mid-Pacific Patrol Compact"
 krcw_psa2_pacific_patrol_compact_desc:0 "The Pacific Fleet and the Republic of Hawaii's navy divide the patrol zones and share the yards at Pearl Harbor and San Diego. Tokyo and Canberra send observers aboard. The compact is aimed at no one, but both blocs' submarines are logged."
 krcw_psa2_27_t:0 "Where the Coalition Stands"
 krcw_psa2_27_d0:0 "The Syndicate orders put every yard on San Francisco Bay to work. The New York papers begin to call the Coalition \"our western brothers\", and New Orleans adds patrol boats on the Mississippi."
 krcw_psa2_27_d1:0 "The Long Beach tanker line is open, and the Pacific Fleet's fuel depots are full for the first time. The New Orleans papers call Warren \"our friend in the West\" and nickname MacArthur \"the Marshal of the West\", and New York sends more troops to the Canadian west coast."
 krcw_psa2_27_d2:0 "With the mid-Pacific patrol compact signed, the fleets of the Coalition and Hawaii put to sea with Japanese and Antipodean observers aboard. Both blocs log the movements of this fleet, and neither has managed to pull it over."
 krcw_psa2_27.a:0 "The Coalition has its road."
 krcw_reun_1_t:0 "The West Coast Question"
 krcw_reun_1_d0:0 "The war in the East is over. Sacramento has followed our line in foreign affairs for years, but the Constitutional Coalition still has its Congress, its President and its courts. We can now ask the Congress in Sacramento to vote the West Coast states formally back into a united America, or let the present arrangement stand."
 krcw_reun_1_d1:0 "The Congress in Sacramento is in recess. General MacArthur and the Presidio men's military council exercise the powers of the President, and the Pacific Fleet takes its orders from the Western Defense Command. Recovering the West Coast means dealing with the general: send someone to talk, or give him a deadline."
 krcw_reun_1_d2:0 "A cold peace has held on both sides of the Rockies for a year, and the West Coast question is back on the table. The Congress in Sacramento still sits and the Pacific Fleet is still in its hands. We can send another delegation, or give Sacramento a deadline."
 krcw_reun_1_d3:0 "Sacramento has spoken first. The Congress of the Constitutional Coalition has passed a resolution authorising the President to negotiate the terms of reunion, and asks us to send a delegation to Sacramento. Some here would rather not talk at all and simply give Sacramento a deadline."
 krcw_reun_1_d4:0 "The civil war is over, but the Constitutional Coalition west of the Rockies remains. Under the Honolulu Accords its neutrality is guaranteed jointly by Paris and Moscow. However we press Sacramento, we must first think how to answer to both capitals."
 krcw_reun_1_d5:0 "The civil war is over, and everything from the Atlantic to the Rockies is under the Combined Syndicates. West of the Rockies, the Constitutional Coalition in Sacramento has its own Congress, President and Pacific Fleet, and it has never recognised New York. The Executive Committee must decide how to bring the West Coast back."
 krcw_reun_1_d6:0 "The civil war is over, and everything from the Gulf to New England is governed by the United States government in New Orleans. West of the Rockies, the Constitutional Coalition in Sacramento has its own Congress, President and Pacific Fleet, and it has never recognised New Orleans. The government must decide how to bring the West Coast back."
 krcw_reun_1.a:0 "Ask the Congress in Sacramento to vote on reunion."
 krcw_reun_1.b:0 "Sign a federal compact and keep things as they are."
 krcw_reun_1.c:0 "Send a delegation to Sacramento."
 krcw_reun_1.d:0 "Give Sacramento a deadline."
 krcw_reun_1.e:0 "Not yet."
 krcw_reun_2_t:0 "The War in the East Is Over"
 krcw_reun_2_d0:0 "The war in the East is over, and the winner is sure to turn to the West Coast. General MacArthur calls the Western Defense Command's staff to a meeting at the Presidio, and the Pacific Fleet stays in harbour on standby. The military council must decide whether to send someone east to talk, or to hold the passes."
 krcw_reun_2_d1:0 "The Syndicate army has marched into New Orleans, and for the first time both banks of the Mississippi are under one government. The Congress in Sacramento sits through the night: New York has never recognised the Constitutional Coalition, and now it can turn its whole strength west."
 krcw_reun_2_d2:0 "The army of the United States has marched into New York, and for the first time both banks of the Mississippi are under one government. The Congress in Sacramento sits through the night: New Orleans has always said the West Coast states are part of the Union, and now it can turn its whole strength west."
 krcw_reun_2.a:0 "Send word east that Sacramento will talk."
 krcw_reun_2.b:0 "Fortify the Nevada and Idaho borders."
 krcw_reun_2.c:0 "See what they say first."
 krcw_reun_10_t:0 "The Terms of Union"
 krcw_reun_10_d0:0 "New York's delegation comes to the Presidio and hands the Executive Committee's terms to General MacArthur: the military council dissolves, the West Coast states are reorganised as a regional federation of the Combined Syndicates, and the ports and the Pacific Fleet pass to Syndicate management. Officers may keep their ranks, and the events of 1936 will not be pursued."
 krcw_reun_10_d1:0 "New York's delegation brings the Executive Committee's terms: the Congress of the Constitutional Coalition dissolves, the West Coast states are reorganised as a regional federation of the Combined Syndicates, and the ports and the Pacific Fleet pass to Syndicate management. Officers may keep their ranks, and the events of 1936 will not be pursued. The delegation waits in Sacramento for the answer of Congress."
 krcw_reun_10_d2:0 "New Orleans's delegation comes to the Presidio and hands the United States government's terms to General MacArthur: the West Coast states return to the Union under the Constitution of 1787, the Pacific Fleet goes back to the Navy Department, and the general himself receives a marshal's baton. The military council must dissolve."
 krcw_reun_10_d3:0 "New Orleans's delegation brings the United States government's terms: the West Coast states return to the Union under the Constitution of 1787, keeping their governors, legislatures and seats in Congress, and the Pacific Fleet goes back to the Navy Department. Sacramento's officials may stay in office, and General MacArthur receives a marshal's baton. The delegation waits in Sacramento for the answer of Congress."
 krcw_reun_10.a:0 "Accept the terms and return to a united America."
 krcw_reun_10.b:0 "Propose a federal compact: keep self-rule, hand over diplomacy and the fleet."
 krcw_reun_10.c:0 "Refuse. The Constitution is not for trading."
 krcw_reun_11_t:0 "Sacramento Agrees"
 krcw_reun_11_d0:0 "The Congress in Sacramento has passed by a majority a resolution ending the federal compact, and the West Coast states formally return to a united America. The President has signed it, and the San Francisco papers print the full text across a whole page."
 krcw_reun_11_d1:0 "General MacArthur has accepted the terms. The military council announces its own dissolution, and the Presidio radio orders the Western Defense Command's troops to stay in barracks and await the handover."
 krcw_reun_11_d2:0 "Before the deadline ran out, Sacramento accepted the terms. Congress passed the resolution by a narrow majority, with many members abstaining. The Western Defense Command's troops stay in barracks, awaiting the order to hand over."
 krcw_reun_11_d3:0 "The Congress in Sacramento has accepted our terms by a majority. The resolution hands the West Coast states back to a united America and asks us to send people to take over the federal offices. The San Francisco papers print the full text across a whole page."
 krcw_reun_11.a:0 "Welcome the West home."
 krcw_reun_12_t:0 "Sacramento's Counter-Proposal"
 krcw_reun_12_d:0 "Sacramento will not dissolve its own Congress and proposes a federal compact instead: the Constitutional Coalition keeps its Congress, courts and National Guard, hands diplomacy and the Pacific Fleet to us, and full union is discussed again in a year."
 krcw_reun_12.a:0 "Accept the federal compact."
 krcw_reun_12.b:0 "Insist on full union and give Sacramento a deadline."
 krcw_reun_12.c:0 "Neither. Leave things as they are."
 krcw_reun_13_t:0 "Sacramento Refuses"
 krcw_reun_13_d0:0 "Sacramento's reply is signed by General MacArthur: the Western Defense Command will hand the West Coast to no one. The delegation is seen out of San Francisco."
 krcw_reun_13_d1:0 "The Congress in Sacramento has voted our terms down. The resolution says the Constitution the Coalition has kept for more than a decade cannot be traded for a piece of paper recognising it. The delegation has come back with the answer."
 krcw_reun_13.a:0 "Give Sacramento a deadline."
 krcw_reun_13.b:0 "Let it be."
 krcw_reun_20_t:0 "Thirty Days"
 krcw_reun_20_d0:0 "New York has given Sacramento thirty days to dissolve Congress and accept the administration of the Combined Syndicates. Syndicate troops are already gathering at Denver and Salt Lake City. Sacramento must answer before the deadline runs out."
 krcw_reun_20_d1:0 "New Orleans has given Sacramento thirty days to dissolve Congress and return to the Union. United States troops are already gathering at Denver and Salt Lake City. Sacramento must answer before the deadline runs out."
 krcw_reun_20.a:0 "Accept the terms."
 krcw_reun_20.b:0 "Refuse, and ask Paris to step in."
 krcw_reun_20.c:0 "Refuse, and ask Moscow to step in."
 krcw_reun_20.d:0 "Refuse. We will hold the passes ourselves."
 krcw_reun_25_t:0 "Sacramento's Appeal"
 krcw_reun_25_d0:0 "Sacramento appeals to us for help. New York has given it thirty days to dissolve its Congress and accept the administration of the Combined Syndicates. The Combined Syndicates belong to our bloc; we can tell New York to stop, or advise Sacramento to accept."
 krcw_reun_25_d1:0 "Sacramento appeals to us for help. New Orleans has given it thirty days to dissolve its Congress and return to the Union. The United States belongs to our bloc; we can tell New Orleans to stop, or advise Sacramento to accept."
 krcw_reun_25_d2:0 "Sacramento appeals to us for help. New York has given it thirty days to dissolve its Congress and accept the administration of the Combined Syndicates. If the Syndicates take the West Coast, all of North America will stand with the Internationale. We can step in to protect the Constitutional Coalition, at the risk of war with New York."
 krcw_reun_25_d3:0 "Sacramento appeals to us for help. New Orleans has given it thirty days to dissolve its Congress and return to the Union. If the United States takes the West Coast, all of North America will stand with the Moscow Accord. We can step in to protect the Constitutional Coalition, at the risk of war with New Orleans."
 krcw_reun_25.a:0 "Stand by Sacramento and warn them off."
 krcw_reun_25.b:0 "Advise Sacramento to accept."
 krcw_reun_26_t:0 "A Warning"
 krcw_reun_26_d0:0 "A note from Paris: the Constitutional Coalition is under the protection of the Internationale, and an attack across the Rockies is an attack on the whole bloc. We and Sacramento sit in the same bloc; to fight this war we would first have to leave the Internationale."
 krcw_reun_26_d1:0 "A note from Paris: the Constitutional Coalition is under the protection of the Internationale, and an attack across the Rockies is an attack on the whole bloc. If this war starts, it is a war with the Internationale."
 krcw_reun_26_d2:0 "A note from Moscow: the Constitutional Coalition is under the protection of the Moscow Accord, and an attack across the Rockies is an attack on the whole bloc. We and Sacramento sit in the same bloc; to fight this war we would first have to leave the Accord."
 krcw_reun_26_d3:0 "A note from Moscow: the Constitutional Coalition is under the protection of the Moscow Accord, and an attack across the Rockies is an attack on the whole bloc. If this war starts, it is a war with the Moscow Accord."
 krcw_reun_26.a:0 "Step back and leave the West Coast alone for now."
 krcw_reun_26.b:0 "March anyway."
 krcw_reun_27_t:0 "No One Is Coming"
 krcw_reun_27_d0:0 "Paris has cabled its answer: the Internationale will not go to war for the West Coast, and advises Sacramento to accept the terms. The voices for resistance in Congress have grown quieter, and only a few days of the deadline remain."
 krcw_reun_27_d1:0 "Moscow has cabled its answer: the Moscow Accord will not go to war for the West Coast, and advises Sacramento to accept the terms. The voices for resistance in Congress have grown quieter, and only a few days of the deadline remain."
 krcw_reun_27.a:0 "Accept the terms."
 krcw_reun_27.b:0 "Then we hold alone."
 krcw_reun_21_t:0 "Sacramento Will Not Yield"
 krcw_reun_21_d0:0 "General MacArthur announces that the Western Defense Command will hold every pass. The Coalition's troops dig in along the Nevada and Idaho borders, and the Pacific Fleet steams out of San Francisco Bay."
 krcw_reun_21_d1:0 "The Congress in Sacramento has voted down our deadline. General Marshall orders the National Guard mobilised, and the Coalition's troops dig in along the Nevada and Idaho borders. The only way left to recover the West Coast is across the Rockies."
 krcw_reun_21.a:0 "Cross the Rockies."
 krcw_reun_21.b:0 "It is not worth another civil war."
 krcw_reun_22_t:0 "The Coalition Surrenders"
 krcw_reun_22_d0:0 "Sacramento has stopped resisting. The Western Defense Command has given up its arms, the Pacific Fleet stays in port, and Syndicate troops march into San Francisco and Los Angeles. What remains is what to do with the officers of the Western Defense Command."
 krcw_reun_22_d1:0 "Sacramento has stopped resisting. The Western Defense Command has given up its arms, the Pacific Fleet stays in port, and United States troops march into San Francisco and Los Angeles. What remains is what to do with the officers of the Western Defense Command."
 krcw_reun_22.a:0 "Dissolve the Western Defense Command."
 krcw_reun_22.b:0 "Pardon the officers who surrendered."
 krcw_reun_23_t:0 "The Reno Talks"
 krcw_reun_23_d0:0 "The Constitutional Coalition cannot hold out. Through Mexican and Canadian diplomats Sacramento proposes a ceasefire: it will sign a federal compact handing diplomacy and the Pacific Fleet to us, keeping only its own Congress. The talks are to be held at Reno."
 krcw_reun_23_d1:0 "The war in the Rockies has gone on for nearly a year. The front has stalled between the Rockies and the Sierra Nevada, and the casualty lists grow longer. Mexican and Canadian diplomats propose talks at Reno: the pre-war border restored, and neither side to attack the other."
 krcw_reun_23.a:0 "Accept Sacramento's federal compact."
 krcw_reun_23.b:0 "Sign at Reno and restore the pre-war line."
 krcw_reun_23.c:0 "Fight on."
 krcw_reun_30_t:0 "The Vote on Union"
 krcw_reun_30_d0:0 "A year has passed since the federal compact was signed, and the government in the East asks the Congress in Sacramento to vote: dissolve the Constitutional Coalition and return to the Union, or keep the compact. Most delegates from the docks and the farms favour reunion; the Presidio officers and some Republican members want things left as they are."
 krcw_reun_30_d1:0 "The war in the East is over, and the winner asks the Congress in Sacramento to vote: dissolve the Constitutional Coalition and return to the Union, or keep its self-rule. The Coalition has followed the winner's line in foreign affairs all along; most delegates from the docks and the farms favour reunion, and the Presidio officers want things left as they are."
 krcw_reun_30.a:0 "Vote for reunion."
 krcw_reun_30.b:0 "Vote to keep self-rule."
 krcw_reun_31_t:0 "Sacramento Keeps Its Self-Rule"
 krcw_reun_31_d:0 "The Congress in Sacramento has voted by a majority to keep its self-rule. The Coalition still follows our line in foreign affairs, and the West Coast states still have their own President and courts. We can respect the vote, or dissolve the Congress in Sacramento."
 krcw_reun_31.a:0 "Respect the vote."
 krcw_reun_31.b:0 "Dissolve the Congress in Sacramento."
 krcw_reun_40_t:0 "A New Order in the West"
 krcw_reun_40_d0:0 "Syndicate troops are quartered in San Francisco, Los Angeles and Seattle, the Congress in Sacramento has dissolved, and the officers of the Western Defense Command await their fate. The Executive Committee must decide how the West Coast is to be run: hand the ports to the dock unions to manage themselves, or send people from New York to form a Western Regional Committee."
 krcw_reun_40_d1:0 "The Congress in Sacramento has dissolved, the state governors and mayors are waiting for instructions from New York, and the dock unions have already taken over the ports themselves. The Executive Committee must decide whether to recognise the dockers' takeover or send people from New York to form a Western Regional Committee."
 krcw_reun_40_d2:0 "United States troops are quartered in San Francisco, Los Angeles and Seattle, the Congress in Sacramento has dissolved, and the state governments have stopped working. New Orleans must decide whether to restore the states' own governments, or have the ruling party take them over directly."
 krcw_reun_40_d3:0 "The Congress in Sacramento has dissolved. The governors of California, Oregon, Washington, Nevada and Idaho have all cabled their obedience to the federal government. New Orleans must decide whether to keep them in office, or have the ruling party take the states over directly."
 krcw_reun_40.a:0 "The ports go to the dock unions."
 krcw_reun_40.b:0 "Form a Western Regional Committee."
 krcw_reun_40.c:0 "The states carry on, and the governors stay."
 krcw_reun_40.d:0 "The ruling party takes over the states."
 krcw_reun_50_t:0 "America Made Whole"
 krcw_reun_50_d0:0 "Syndicate troops have crossed the Rockies, and the Constitutional Coalition's resistance is over. For the first time since 1936 America has a single government, and it sits in New York. Paris calls it the Internationale's victory in North America; Moscow has begun to reassess the Pacific."
 krcw_reun_50_d1:0 "New York has dissolved the Congress in Sacramento, and the Constitutional Coalition is no more. For the first time since 1936 America has a single government, and it sits in New York. Paris calls it the Internationale's victory in North America; Moscow has begun to reassess the Pacific."
 krcw_reun_50_d2:0 "The Congress in Sacramento has voted to dissolve the Constitutional Coalition, and the West Coast states join the Combined Syndicates. For the first time since 1936 America has a single government, and it sits in New York. Paris calls it the Internationale's victory in North America; Moscow has begun to reassess the Pacific."
 krcw_reun_50_d3:0 "United States troops have crossed the Rockies, and the Constitutional Coalition's resistance is over. For the first time since 1936 America has a single government, and it sits in New Orleans. Moscow calls it the Accord's victory in North America; Paris has begun an urgent review of the defences of Canada and the Caribbean."
 krcw_reun_50_d4:0 "New Orleans has dissolved the Congress in Sacramento, and the Constitutional Coalition is no more. For the first time since 1936 America has a single government, and it sits in New Orleans. Moscow calls it the Accord's victory in North America; Paris has begun an urgent review of the defences of Canada and the Caribbean."
 krcw_reun_50_d5:0 "The Congress in Sacramento has voted to dissolve the Constitutional Coalition, and the West Coast states return to the Union. For the first time since 1936 America has a single government, and it sits in New Orleans. Moscow calls it the Accord's victory in North America; Paris has begun an urgent review of the defences of Canada and the Caribbean."
 krcw_reun_50.a:0 "From sea to shining sea."
 krcw_reun_50.b:0 "All of North America stands with us."
 krcw_reun_50.c:0 "All of North America now stands against us."
 krcw_reun_50.d:0 "A united America. The world has changed again."
 krcw_reun_51_t:0 "The Federal Compact"
 krcw_reun_51_d0:0 "Sacramento and New York have signed a federal compact. The Constitutional Coalition keeps its own Congress, courts and National Guard, hands diplomacy and the Pacific Fleet to the other side, and both agree to discuss full union again in a year."
 krcw_reun_51_d1:0 "Sacramento and New Orleans have signed a federal compact. The Constitutional Coalition keeps its own Congress, courts and National Guard, hands diplomacy and the Pacific Fleet to the other side, and both agree to discuss full union again in a year."
 krcw_reun_51.a:0 "A union of free consent."
 krcw_reun_51.b:0 "America is one step closer."
 krcw_reun_52_t:0 "War in the Rockies"
 krcw_reun_52_d0:0 "Sacramento has refused New York's terms, and Syndicate troops have crossed the Rockies. The Coalition's National Guard holds the passes in Nevada and Idaho, and Americans are fighting Americans again."
 krcw_reun_52_d1:0 "Sacramento has refused New Orleans's terms, and United States troops have crossed the Rockies. The Coalition's National Guard holds the passes in Nevada and Idaho, and Americans are fighting Americans again."
 krcw_reun_52.a:0 "The Union will be restored."
 krcw_reun_52.b:0 "Hold the passes."
 krcw_reun_52.c:0 "Another American civil war."
 krcw_reun_west_integrating:0 "The Western Transition"
 krcw_reun_west_integrating_desc:0 "The West Coast states are back in a united America, but their delegates have not yet taken their seats in the East, and the states still work by Sacramento's old rules. Federal orders reaching the West often wait weeks before anyone carries them out."
 krcw_reun_unfinished_union:0 "The Unfinished Union"
 krcw_reun_unfinished_union_desc:0 "The civil war is over, but west of the Rockies there is still an American government that does not recognise us. The garrisons on the border cannot come home, and the papers ask every day when the West Coast is coming back."
 krcw_reun_psa_alone:0 "Holding the West Alone"
 krcw_reun_psa_alone_desc:0 "The Constitutional Coalition is the last independent American government west of the Rockies. Sacramento has refused the East's terms, the passes in Nevada and Idaho are full of National Guardsmen, and the factories supply the front first."
 krcw_reun_federal_compact:0 "The Federal Compact"
 krcw_reun_federal_compact_desc:0 "Sacramento keeps its own Congress, courts and National Guard, and diplomacy and the Pacific Fleet are directed by the government in the East. Both sides have agreed to discuss full union again in a year."
 krcw_reun_west_bitter:0 "Bitterness in the West"
 krcw_reun_west_bitter_desc:0 "The Congress in Sacramento voted to keep its self-rule, and we dissolved it anyway. The West Coast papers have stopped printing, the members have gone home, and the voters of the western states remember it."
 krcw_reun_wca_dockers:0 "The Dockers' Ports"
 krcw_reun_wca_dockers_desc:0 "The ports of San Francisco, Oakland, Los Angeles and Seattle are handed to the dock unions to run themselves, and the International Longshore and Warehouse Union becomes the largest federation on the West Coast. The shipyards' schedules are set by the workers' councils."
 krcw_reun_wca_committee:0 "The Western Regional Committee"
 krcw_reun_wca_committee_desc:0 "The Executive Committee sends organisers from New York to form a Western Regional Committee in San Francisco, bringing the West Coast's factories, ports and railways under one schedule. Production follows New York's plan, and the local federations' views are often set aside."
 krcw_reun_usa_states:0 "The States as Before"
 krcw_reun_usa_states_desc:0 "California, Oregon, Washington, Nevada and Idaho keep their governors, legislatures and courts, and the members they elect take their seats in New Orleans. The federal government has to consult the governors before it acts in the West."
 krcw_reun_usa_machine:0 "The Party's Western Machine"
 krcw_reun_usa_machine_desc:0 "New Orleans sends its people to take over the West Coast's state governments, highway departments and relief offices, and the ruling party opens a branch in every county. Sacramento's old politicians are shut out, and the West's affairs are decided in New Orleans."
 krcw_reun_cat:0 "The West Coast Question"
 krcw_reun_cat_desc:0 "The civil war is over, and the Constitutional Coalition west of the Rockies is the last American government apart from the winner, with its own Congress, President and Pacific Fleet. How the West Coast comes back, by talks, by a vote or by war, will decide what kind of America the united one is."
 krcw_reun_reopen:0 "Reopen the West Coast Question"
 krcw_reun_reopen_desc:0 "A cold peace has held on both sides of the Rockies for some time. We can raise the question of reunion with Sacramento once more: send someone to talk, or give it a deadline."
 krcw_reun_integrate:0 "Ask Sacramento to Vote on Full Union"
 krcw_reun_integrate_desc:0 "A year has passed since the federal compact was signed. Under its terms we can now ask the Congress in Sacramento to vote on dissolving the Constitutional Coalition and returning to the Union, or keeping the compact."
 krcw_reun_seat_the_west:0 "Seat the Western Delegates"
 krcw_reun_seat_the_west_desc:0 "California, Oregon, Washington, Nevada and Idaho elect their delegates and take their seats in the East. From that day the West Coast states no longer work by Sacramento's old rules."
 krcw_reun_pacific_fleet_tb:0 "The Pacific Fleet"
 krcw_reun_pacific_fleet:0 "Merge the Pacific Fleet"
 krcw_reun_pacific_fleet_desc:0 "The Pacific Fleet, the yards on San Francisco Bay and Puget Sound and the bases at San Diego and Bremerton are merged into a single navy. Admiral Nimitz's staff is kept as it is and given the whole Pacific."
 krcw_reun_wca_hearings:0 "Hold the San Francisco Hearings"
 krcw_reun_wca_hearings_desc:0 "The Syndicate Congress holds public hearings in San Francisco to settle the accounts of the 1936 putsch and the Western Defense Command. Wainwright and Halsey are summoned to testify; the ringleaders go before the people's tribunals, and the rest may go home."
 krcw_reun_wca_amnesty:0 "Take the Old Officers into the Militia"
 krcw_reun_wca_amnesty_desc:0 "The Executive Committee announces that officers of the Western Defense Command who swear loyalty to the Combined Syndicates may join the Workers' Militia with their ranks and train the new units with their experience. The veterans of 1936 are far from pleased."
 krcw_reun_usa_baton:0 "Give MacArthur His Marshal's Baton"
 krcw_reun_usa_baton_desc:0 "New Orleans keeps its old promise: MacArthur is made a General of the Army and allowed to retire with honour. The Western Defense Command's staff officers are taken into the United States Army, and the Presidio men are a faction no more."
 krcw_reun_usa_scatter:0 "Post the Presidio Men Away from the Coast"
 krcw_reun_usa_scatter_desc:0 "The officers loyal to MacArthur are posted one by one to divisions in Texas and the Great Plains, and the Western Defense Command's old staff is scattered across the country. Away from San Francisco, they can no longer gather together."
 krcw_reun_psa_overture:0 "Propose New Talks"
 krcw_reun_psa_overture_desc:0 "The cold peace across the Rockies has dragged on for half a year, and the West Coast's factories and ports are waiting. Sacramento can speak first and ask the East to send a delegation again, in the hope of gentler terms."
