l_english:
# krcw: years paced
 krcw_col_1_t:0 "Ration Cards and the Black Market"
 krcw_col_1_d:0 "The state shops of Moscow and Petrograd are empty, bread is rationed and everything can be bought on the black market. Factory wages are months in arrears, and the Internationale's radio reports all of it every night."
 krcw_col.1.a:0 "Crack down on the black market"
 krcw_col.1.b:0 "Free some prices"
 krcw_col_2_t:0 "Cracks in the Accord"
 krcw_col_2_d:0 "A member of the Accord has announced its withdrawal. Its government says Russia can no longer honour its promises of aid and staying in the Accord will only drag it down. The others are watching."
 krcw_col.2.a:0 "Threaten force"
 krcw_col.2.b:0 "Let it go"
 krcw_col_3_t:0 "The Collapse of the Russian State"
 krcw_col_3_d:0 "The Supreme Directory can no longer pay wages or move the army. The regional assemblies declare sovereignty one after another, and the generals in Moscow refuse to fire on the crowds. A provisional government dissolves the Moscow Accord and calls elections to a constituent assembly within three months."
 krcw_col.3.a:0 "Accept it"
 krcw_col_4_t:0 "Queues in Paris"
 krcw_col_4_d:0 "The federations have missed their plan quotas two years running and there are queues outside the Paris shops. Several trade federations refuse to carry out the new allocation orders, and the Accord's radio repeats news of every strike."
 krcw_col.4.a:0 "Invoke federation discipline"
 krcw_col.4.b:0 "Devolve power to the communes"
 krcw_col_5_t:0 "Cracks in the Internationale"
 krcw_col_5_d:0 "A section of the Internationale has announced its withdrawal, saying the Paris secretariat looks only to its own economy and can no longer support the fraternal countries. The other sections are watching."
 krcw_col.5.a:0 "Threaten force"
 krcw_col.5.b:0 "Let it go"
 krcw_col_6_t:0 "The End of the Commune"
 krcw_col_6_d:0 "The national congress cannot muster a quorum, allocation between the federations has stopped and the provincial communes have begun to act on their own. A provisional committee dissolves the Third Internationale and convenes a constituent assembly."
 krcw_col.6.a:0 "Accept it"
 krcw_col_10_t:0 "The Moscow Accord Dissolves"
 krcw_col_10_d:0 "The provisional government of the Russian State has dissolved the Moscow Accord. Every member's treaty obligations to Russia are ended, and the Cold War is over with one side's collapse."
 krcw_col.10.a:0 "The Cold War is over"
 krcw_col_11_t:0 "The Third Internationale Dissolves"
 krcw_col_11_d:0 "The provisional committee in Paris has dissolved the Third Internationale. Every section's obligations to Paris are ended, and the Cold War is over with one side's collapse."
 krcw_col.11.a:0 "The Cold War is over"
 krcw_col_cat:0 "The Hidden Front"
 krcw_col_cat_desc:0 "The Cold War can be won without a shot: stop the other side's economy and make its people stop believing their own government.\n\nInternationale crisis: [?global.krcw_ti_crisis]/100\nAccord crisis: [?global.krcw_ma_crisis]/100\nAt 100 that bloc dissolves and the Cold War ends."
 krcw_col_radio:0 "Step Up Broadcasts to the Other Side"
 krcw_col_radio_desc:0 "More shortwave broadcasts in their languages, reporting the strikes, shortages and trials their papers leave out."
 krcw_col_underground:0 "Fund the Underground over There"
 krcw_col_underground_desc:0 "Send money and printing presses to the opposition over there through neutral countries. If it is discovered, relations will get worse."
 krcw_col_econ_war:0 "Wage Economic War"
 krcw_col_econ_war_desc:0 "Embargo their exports and undercut the goods they sell on neutral markets for hard currency. It costs us too."
 krcw_col_purge:0 "Root Out the Infiltration Networks"
 krcw_col_purge_desc:0 "The police and security services go after the foreign-funded groups. The more are arrested, the angrier the street."
 krcw_col_stabilise:0 "Economic Stabilisation Plan"
 krcw_col_stabilise_desc:0 "Draw on reserves, put food and fuel first and delay part of the arms programme."
