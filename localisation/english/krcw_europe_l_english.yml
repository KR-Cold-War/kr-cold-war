l_english:
# krcw: years paced
 krcw_fra_clearing_union:0 "The Paris Clearing Union"
 krcw_fra_clearing_union_desc:0 "Not a bank, and not a gold standard. The labour federations keep their mutual accounts in a single ledger in Paris, settling balances in labour-hours and commodity quotas; deficit members need not deflate and surplus members may not hoard. Having read its charter, Keynes remarked: \"This is the scheme I proposed elsewhere, and no one would hear of it.\""
 krcw_fra_transnational_federations:0 "Transnational Industrial Federations"
 krcw_fra_transnational_federations_desc:0 "The steelworkers of Lorraine and of the Ruhr belong to one federation, sit in one congress and work to one set of technical standards. The borders remain on the map; the organisation of production has already crossed them."
 krcw_fra_cybernetic_planning:0 "Cybernetic Coordinated Planning"
 krcw_fra_cybernetic_planning_desc:0 "Neither Moscow's commands nor the blindness of the market. Workshops telegraph output, stocks and shortages daily; the computing bureau folds them into a continuously corrected balance sheet and sends it back down for discussion. For the first time the plan has a feedback loop."
 krcw_fra_participatory_budget:0 "Participatory Budgeting"
 krcw_fra_participatory_budget_desc:0 "Every communal budget is first argued through in neighbourhood assemblies and only then consolidated by the federation. The debates are long and the efficiency doubtful, but no one can say any more that \"Paris decided it.\""
 krcw_fra_1871_programme:0 "The \"1871\" Programme"
 krcw_fra_1871_programme_desc:0 "Named for the year of the first Commune. Officially it studies the upper atmosphere; in fact it is liquid-fuel rocketry and orbital mechanics. On the ranges at Toulouse and Hammaguir engineers chalk up escape velocity."
 krcw_fra_atomic_commissariat:0 "Commissariat for Atomic Energy"
 krcw_fra_atomic_commissariat_desc:0 "Joliot-Curie's laboratory moves from a wartime cellar to the new campus at Saclay. The commissariat's charter speaks of \"peaceful uses\" — a phrase that will need some explaining after 1952."
 krcw_fra_force_de_frappe:0 "The Commune's Deterrent"
 krcw_fra_force_de_frappe_desc:0 "A mushroom cloud rises over the desert at Reggane and the Commune becomes the third — by date the second — power to hold the bomb. The federation daily runs its editorial that morning under the title \"We Never Wanted It.\""
 krcw_fra_africa_liberation:0 "Liberation, Not Colonies"
 krcw_fra_africa_liberation_desc:0 "The Commune inherited the Third Republic's colonies — the revolution's most embarrassing legacy. The federation congress at Algiers puts it plainly: our task is to hand these lands back to those who work them, not to rule them under a new flag."
 krcw_fra_internationale_secretariat:0 "The Reformed Secretariat"
 krcw_fra_internationale_secretariat_desc:0 "The old secretariat was a French secretariat. The new charter gives Nanjing, London, Rome and New York equal seats and equal vetoes: Paris gives up some power and gets in exchange an Internationale that can actually meet."
 krcw_fra_second_commune_pressure:0 "Pressure from Below"
 krcw_fra_second_commune_pressure_desc:0 "Students, the young men at Renault, colonial scholars — they are not against the revolution; they say the offices stole it. The slogan on the wall reads: \"The men of 1871 did not need a permit.\""
 krcw_fra_charter_of_labour:0 "The New Charter of Labour"
 krcw_fra_charter_of_labour_desc:0 "Bureaucratisation is not cured by purges but by statutes. The new charter limits federation officers to two-year recallable terms and gives shop assemblies the right to amend the plan. The demands of the Second Commune movement are written into law."
 krcw_fra_technocratic_turn:0 "The Technocratic Turn"
 krcw_fra_technocratic_turn_desc:0 "The computing bureau has won. The optimum is computed at Saclay and the shop assemblies retain \"the right to offer observations.\" Efficiency is unprecedented, and the federation halls grow quieter every year."
 krcw_fra_red_army_reform:0 "Federal Defence Force Reform"
 krcw_fra_red_army_reform_desc:0 "The old problem of a revolutionary army: the enthusiasm of the militia or the discipline of the regulars? The reform takes both — professional armoured and air corps, plus territorial defence raised through the unions."
 krcw_fra_atlantic_fleet:0 "The Atlantic Fleet"
 krcw_fra_atlantic_fleet_desc:0 "The Commune's navy need not compete with the Union of Britain: they belong to the same Internationale. French yards build escorts and submarines — the task is to keep open the line from New York to Shanghai."
 krcw_eng_federal_congress:0 "The Federal Congress"
 krcw_eng_federal_congress_desc:0 "British syndicalism took the parliamentary road: the Congress of Trade Unions is at once legislature and industrial board, with delegations from Scotland, Wales and the English regions. Wintringham calls it \"Westminster with a payroll.\""
 krcw_eng_devolution:0 "Scottish and Welsh Devolution"
 krcw_eng_devolution_desc:0 "Edinburgh and Cardiff receive their own congresses, with the coal and steel federations answerable to them directly. The word \"Kingdom\" was dropped long ago; the word \"Union\" only now acquires content."
 krcw_eng_commonwealth_liberation:0 "A Commonwealth of Liberation"
 krcw_eng_commonwealth_liberation_desc:0 "The Empire broke up in 1925, but the threads between London and the unions of Cairo, Lagos and Calcutta remain. The Union reconnects them — this time with aid and technicians instead of governors and gunboats."
 krcw_eng_nuclear_partnership:0 "The Anglo-French Nuclear Partnership"
 krcw_eng_nuclear_partnership_desc:0 "Harwell and Saclay share a set of drawings and a uranium quota. Neither will carry the cost alone, and neither will let the other hold it alone."
 krcw_eng_atlantic_lifeline:0 "The Atlantic Lifeline"
 krcw_eng_atlantic_lifeline_desc:0 "Syndicalist America's steel and Canadian wheat cross the North Atlantic. The number of escorts is not a question of Admiralty pride but of whether Reuther can hold the Appalachian front."
 krcw_eng_shop_stewards:0 "The Shop Stewards' Movement"
 krcw_eng_shop_stewards_desc:0 "The Clydeside stewards are veterans of the revolution and the earliest critics of its bureaucracy. A formal seat on the production boards serves better than a medal."
 krcw_sov_national_populism:0 "National Populism"
 krcw_sov_national_populism_desc:0 "Neither the Tsar's Russia nor the Bolsheviks'. Savinkov's state gave the land to the peasants, the factories to mixed state-private trusts, and politics to itself. Its legitimacy rests on one claim: it took back everything Brest gave away."
 krcw_sov_state_capitalism:0 "State Capitalism"
 krcw_sov_state_capitalism_desc:0 "The Ural steel trust has the state's shares, the army's orders and private managers. It is not inefficient and not unprofitable; only no one asks where the profits go."
 krcw_sov_moscow_accord_leadership:0 "Leader of the Moscow Accord"
 krcw_sov_moscow_accord_leadership_desc:0 "From Warsaw to Delhi, from Berlin to New Orleans, the Accord's staff work is done in Moscow. It is no ideological international: a Hungarian landowner, a Prussian general and a Louisiana demagogue share no creed, only an enemy."
 krcw_sov_army_reform:0 "The Army Reform"
 krcw_sov_army_reform_desc:0 "The army that reached the Elbe in 1944 won by numbers and will. Vasilevsky's reform is to make it win by firepower, signals and lorries — which costs more money than anyone expected."
 krcw_sov_atomic_project:0 "Project Number One"
 krcw_sov_atomic_project_desc:0 "After the French test of 1950 Savinkov said only one sentence to the council: \"We are behind, and that cannot be tolerated.\" From then on the closed city beyond Chelyabinsk has no name on any map."
 krcw_sov_baltic_autonomy:0 "The Baltic Autonomy Statute"
 krcw_sov_baltic_autonomy_desc:0 "Riga, Tallinn and Kaunas receive their own assemblies, their own schools and their own police; the price is recognising Russian sovereignty in defence and foreign affairs. Year by year the Forest Brothers' rifles fall silent."
 krcw_sov_russification:0 "The Russification Policy"
 krcw_sov_russification_desc:0 "The Baltic provinces are to become Russian provinces: the official language, settlers moved in, streets renamed. State security reports that resistance is weakening; the author of the report has never been there."
 krcw_sov_finland_question:0 "The Finnish Question"
 krcw_sov_finland_question_desc:0 "Annexing Finland in 1944 was Savinkov's least profitable victory. The Russian flag hangs over Helsinki city hall while the forests hold a partisan war that never ends and eats three divisions a year."
 krcw_sov_finnish_grand_duchy:0 "The Grand Duchy Restored"
 krcw_sov_finnish_grand_duchy_desc:0 "The old Empire gave Finland a constitution and a parliament, and for a hundred years Finland did not rebel. The council digs out the file: Finland becomes an autonomous Grand Duchy again — without a Grand Duke."
 krcw_sov_succession_crisis:0 "The Succession Crisis"
 krcw_sov_succession_crisis_desc:0 "The constitution says the Supreme Ruler is elected by the Council of State, and two thirds of the Council were appointed by Savinkov. Now he is dead and no one knows whom those two thirds will choose — least of all they themselves."
 krcw_sov_stability_faction:0 "The Stability Faction"
 krcw_sov_stability_faction_desc:0 "The generals' programme is one sentence: take no risks. Vasilevsky wants no personality cult, no purges and no world liberation — he wants a modern army and a state that still works in twenty years."
 krcw_sov_technocrats:0 "The Civilian Technocrats"
 krcw_sov_technocrats_desc:0 "The economists and academicians hold that Russia cannot win an arms race and must win on productivity instead. Their memoranda are admirably written and command not one division."
 krcw_sov_romanov_restoration:0 "The Romanov Restoration"
 krcw_sov_romanov_restoration_desc:0 "In 1953 the Cathedral of the Saviour is reconsecrated and a Grand Duke is crowned in Moscow. The Church and the old nobility cheer; the factories and the Baltic provinces are silent. It is a road no one foresaw and no one can retrace."
 krcw_sov_extremist_turn:0 "The Extremists Triumphant"
 krcw_sov_extremist_turn_desc:0 "\"Savinkov was too soft.\" So the new Supreme Ruler judges his patron. State security triples, new camps go up beyond the Urals, and the wireless begins to speak of \"the final reckoning.\""
 krcw_sov_space_programme:0 "The Long-Range Rocket Programme"
 krcw_sov_space_programme_desc:0 "On the Tyuratam steppe, drawings stripped from Reich factories become ever larger rockets. The army wants an intercontinental missile and the Academy wants a satellite; on the budget they are the same line."
 krcw_sov_peasant_bargain:0 "The Bargain with the Peasantry"
 krcw_sov_peasant_bargain_desc:0 "Savinkov never collectivised: this is his sharpest break with the Bolshevik programme and his regime's deepest root. The commune keeps the land and the state takes its grain quota. It is not fair, but there is no famine."
 krcw_sov_okhrana_expanded:0 "State Security Expanded"
 krcw_sov_okhrana_expanded_desc:0 "During the succession, whoever holds the security service holds the files; whoever holds the files holds the two thirds of the Council that matters."
 krcw_ddr_kaisers_shadow:0 "The Shadow of Restoration"
 krcw_ddr_kaisers_shadow_desc:0 "The Kaiser is in Stockholm and his followers are in Potsdam. Schleicher's regime rules on Russian bayonets and the National Front, and at every crisis the monarchists whisper that only the Kaiser's return can reunite Germany."
 krcw_ddr_prussian_army:0 "The Prussian General Staff"
 krcw_ddr_prussian_army_desc:0 "Germany lost two wars and three quarters of its territory, but Schleicher kept the General Staff, Manstein remains, and so does the craft of stretching limited forces to their utmost."
 krcw_ddr_berlin_question:0 "The Berlin Question"
 krcw_ddr_berlin_question_desc:0 "One city, two governments and barbed wire down the middle of the street. West Berlin's trams turn back at the boundary, and East Berlin's papers announce daily that the arrangement is temporary."
 krcw_ddr_own_road:0 "A Road of Our Own"
 krcw_ddr_own_road_desc:0 "Moscow is far and Paris is near. A younger generation of imperial officials begins to discuss, carefully, an unsayable thought: perhaps Germany's interest lies neither east nor west but in Germany."
 krcw_ddr_reconstruction:0 "The Reconstruction Plan"
 krcw_ddr_reconstruction_desc:0 "Scaffolding rises again over the ruins of Leipzig and Dresden. Russian reparations took half the machine tools; the old hands copy the other half by hand."
 krcw_ti_industrial_federation_member:0 "Member of the Industrial Federations"
 krcw_ti_industrial_federation_member_desc:0 "Joining the transnational federations means surrendering some control over prices and plans in exchange for drawings, quotas and a market that cannot be blockaded. The small countries did the arithmetic and signed."
 krcw_ti_local_commune_model:0 "Our Own Road to Revolution"
 krcw_ti_local_commune_model_desc:0 "Copenhagen is not Paris; neither is Dublin nor Amsterdam. The Internationale's charter concedes the point: each federation organises its communes in its own tradition."
 krcw_ti_frontline_readiness:0 "Frontline Readiness"
 krcw_ti_frontline_readiness_desc:0 "The Elbe, the Alpine passes, the Baltic approaches: the Internationale's smaller members sit astride all of them. Their defence plans have one line — hold until the armour arrives from Paris."
 krcw_ma_cordon_state:0 "The Cordon State"
 krcw_ma_cordon_state_desc:0 "Moscow calls them the cordon sanitaire; they call themselves the frontier of civilisation. The generals in Warsaw, Budapest and Bucharest know the truth: they are a buffer, and a buffer exists to be broken."
 krcw_ma_russian_armaments:0 "Russian Armaments"
 krcw_ma_russian_armaments_desc:0 "The Moscow armaments trusts sell obsolescent models to Accord members complete with drawings: cheap, on condition that nothing is resold and nothing improved."
 krcw_ma_agrarian_reaction:0 "The Landlords' Order"
 krcw_ma_agrarian_reaction_desc:0 "The Accord's eastern members never carried out land reform: it is their deepest common interest with Moscow and their weakest point. The wireless from across the border reminds the peasants of it daily."
 krcw_ma_officers_republic:0 "The Officers' Republic"
 krcw_ma_officers_republic_desc:0 "Elections suspended, the chamber adjourned, the cabinet made of colonels. The reason is always the same: the emergency has not ended."
 krcw_ent_armed_neutrality:0 "Armed Neutrality"
 krcw_ent_armed_neutrality_desc:0 "The exiled Crown hates the Internationale that took its home and loathes Savinkov's gallows and Long's lynchings equally. Canberra's conclusion: take no side, and let no one land here."
 krcw_ent_ti_subsidies:0 "Subsidies from Paris"
 krcw_ent_ti_subsidies_desc:0 "The Internationale's terms are suspiciously good: machine tools, credits, long-term wool contracts. Canberra takes the money and reminds itself that this is not a promise."
 krcw_ent_moscow_subsidies:0 "Armaments from Moscow"
 krcw_ent_moscow_subsidies_desc:0 "Moscow sells tanks at half the Internationale's price and attaches no conditions about trade unions. The Defence Minister finds this excellent value; the Foreign Minister does not."
 SOV_krcw_vasilevsky_leader:0 "Aleksandr Vasilevsky"
 SOV_krcw_vasilevsky_leader_desc:0 "A Supreme Ruler risen from the General Staff. He does not make speeches, does not write books and forbids anyone to hang his portrait in an office. His programme of government is said to run to one page, the first line of which reads: \"No war.\""
 SOV_krcw_sorokin:0 "Pitirim Sorokin"
 SOV_krcw_sorokin_desc:0 "Sociologist, former Socialist Revolutionary, academician. He argues that Russia cannot win an arms race and must win instead through productivity and schooling; his opponents call this the academic term for surrender."
 SOV_krcw_vladimir_romanov:0 "Grand Duke Vladimir Kirillovich"
 SOV_krcw_vladimir_romanov_desc:0 "Son of Grand Duke Kirill, raised in exile, never having governed anything. In 1953 a combination of generals, bishops and industrialists decides that Russia requires an Emperor, and he is the only suitable one still living."
 SOV_krcw_vonsyatsky:0 "Anastasy Vonsyatsky"
 SOV_krcw_vonsyatsky_desc:0 "A uniform in the style of a party militia, an organisation out of the streets and one recurring slogan: \"Savinkov was too soft.\" He holds that stopping at the Elbe in 1944 was a historic error and intends to correct it."
 SOV_krcw_nekrasov:0 "Nikolay Nekrasov"
 SOV_krcw_nekrasov_desc:0 "Speaker of the Council of State, an old official whom nobody likes and nobody opposes. Chosen in deadlock as the provisional figure every faction can tolerate — provisionally, for four years."
 krcw_eu_ti_solidarity:0 "International Solidarity"
 krcw_eu_detente_contact:0 "Diplomatic Contacts"
 protectorate_dislikes_overlord:0 "Resents the Overlord"
 MA_protectorate_friendly:0 "Friendly within the Accord"
 MA_protectorate_loyal:0 "Loyal to the Accord"
 krcw_eu_sister_federation:0 "Sister Federation"
 krcw_fra_rotation_statute:0 "The Statute of Rotation"
 krcw_fra_rotation_statute_desc:0 "No federation secretary may serve more than two terms, and on leaving office must spend a year back at the bench or the desk. Old officials complain that experience is being thrown in the waste-paper basket; young delegates see empty chairs for the first time."
 krcw_fra_territorial_defence:0 "Federal Territorial Defence"
 krcw_fra_territorial_defence_desc:0 "Every union and every commune keeps its own defence company, its rifles locked in the factory armoury and the key held by the shop assembly. This army cannot march abroad, but anyone who wants to occupy France must take it street by street."
 krcw_fra_minimum_deterrent:0 "Minimum Deterrence"
 krcw_fra_minimum_deterrent_desc:0 "The Commune declares that its weapons have one purpose only: to make everyone else's useless. The number is capped, there will be no first use, and the test data goes to every member of the Secretariat."
 krcw_fra_world_revolution:0 "Permanent Revolution"
 krcw_fra_world_revolution_desc:0 "The radicals carry the Congress: to coexist with Moscow is to coexist with the gallows. Volunteers, leaflets and transmitters cross the Elbe, and any workshop that rises will have help from Paris."
 krcw_fra_tree:0 "krcw_fra_tree"
 krcw_fra_congress_of_1949:0 "The Congress of 1949"
 krcw_fra_congress_of_1949_desc:0 "The Fourteenth Congress of the CGT opens in Paris. The revolution is in its twenty-eighth year and the Commune has won two wars, but the delegates are on average twenty years older than in 1921."
 krcw_fra_frachons_mandate:0 "Mandate Frachon to Govern"
 krcw_fra_frachons_mandate_desc:0 "Benoît Frachon is an old federation hand out of the mines, who knows better than anyone how to keep a strike going and better than anyone what discipline a revolutionary government needs. The Congress re-elects him General Secretary by an overwhelming majority."
 krcw_fra_the_question_of_the_offices:0 "Debate the Swollen Offices"
 krcw_fra_the_question_of_the_offices_desc:0 "The federation apparatus has grown fourfold in twenty years. A railwayman who wants to change depots needs three forms and two months; a commune that wants a bridge waits on a Paris permit. The Congress resolves to debate the matter formally, which is itself a kind of progress."
 krcw_fra_statute_of_rotation:0 "The Statute of Rotation"
 krcw_fra_statute_of_rotation_desc:0 "The renewers' proposal: fixed terms and compulsory rotation for officials. It cannot abolish bureaucrats, but it can make them remember where they came from."
 krcw_fra_the_efficient_apparatus:0 "Streamline the Federation Apparatus"
 krcw_fra_the_efficient_apparatus_desc:0 "Move the best engineers and statisticians into the federation offices to make them run efficiently. The shop meetings keep only an advisory role."
 krcw_fra_participatory_budgeting:0 "Participatory Budgeting"
 krcw_fra_participatory_budgeting_desc:0 "The Lyon and Saint-Étienne pilots proved one thing: letting neighbourhood assemblies decide where the money goes does not make it go further, but it makes it go to the right places. Now it goes national."
 krcw_fra_recallable_delegates:0 "Make Delegates Recallable"
 krcw_fra_recallable_delegates_desc:0 "Any federation delegate must stand again if a third of his constituency signs for it. In the first year forty-one delegates are recalled, two members of the Secretariat among them."
 krcw_fra_directorate_ind:0 "Planning Directorate"
 krcw_fra_planning_directorate:0 "The Planning Directorate"
 krcw_fra_planning_directorate_desc:0 "The technocrats merge the scattered federation planning bureaux into one directorate at Saclay, answerable directly to the Secretariat. Its first five-year outline reads like an engineering manual."
 krcw_fra_federal_constitution:0 "The Federal Constitution"
 krcw_fra_federal_constitution_desc:0 "The provisional charter of 1921 is at last replaced by a federal constitution, the powers of commune, regional federation and national Congress set out plainly. It is not romantic, but it will outlive the men who wrote it."
 krcw_fra_the_sorbonne_speaks:0 "Answer the Sorbonne Students"
 krcw_fra_the_sorbonne_speaks_desc:0 "The generation born after the revolution has reached the universities. They never saw the barricades of 1921, only the federation offices, and about the latter they have a great deal to say."
 krcw_fra_new_charter_of_labour:0 "The New Charter of Labour"
 krcw_fra_new_charter_of_labour_desc:0 "Write the young workers' demands into a new labour charter."
 krcw_fra_order_in_the_federations:0 "Restore Order in the Federations"
 krcw_fra_order_in_the_federations_desc:0 "The Secretariat's conclusion: students do not understand production and shop assemblies do not understand computation. Order first; the debate can wait."
 krcw_fra_reconstruction_commissariat:0 "The Reconstruction Commissariat"
 krcw_fra_reconstruction_commissariat_desc:0 "The Second Weltkrieg left five years of craters across the north and east. Five years into the ceasefire, a third of the railway bridges in Lorraine are still temporary timber."
 krcw_fra_lorraine_steel:0 "The Lorraine Steel Federation"
 krcw_fra_lorraine_steel_desc:0 "Lorraine's furnaces and the Saar's coal now answer to one federation. The steelworkers vote that the first rolled steel goes to the railways and only the second to tanks."
 krcw_fra_rebuild_the_nord:0 "Rebuild the Nord"
 krcw_fra_rebuild_the_nord_desc:0 "The mills and pits of Lille, Roubaix and Tourcoing were the cradle of the 1921 rising. Rebuilding them is an economic question and a question of memory."
 krcw_fra_rhone_power:0 "Power from the Rhône"
 krcw_fra_rhone_power_desc:0 "The Rhône dam cascade is run jointly by the power federation and the riverside communes, with tariffs set by a congress of consumers — a practice later written into the Internationale's electricity convention."
 krcw_fra_keepers_of_the_ledger:0 "Hold the Clearing Union Ledger"
 krcw_fra_keepers_of_the_ledger_desc:0 "The Paris Clearing Union's ledger is kept at the Commune's Bourse du Travail. It is an honour and a duty: Paris must prove it will not turn surplus into power."
 krcw_fra_found_transnational_federations:0 "The Transnational Federations"
 krcw_fra_found_transnational_federations_desc:0 "The steel, chemical, electrical and railway federations reorganise as transnational bodies with members from Paris, London, Milan, Cologne and New York. A drawing is designed in one country, prototyped in a second and mass-produced in a third."
 krcw_fra_algerian_development_fund:0 "The Algerian Development Fund"
 krcw_fra_algerian_development_fund_desc:0 "Algeria is the only overseas territory the Commune kept from the old Republic, and the one it least likes to discuss. The development fund hands ports, power stations and schools to Algerian federations: for the first time the money flows from Paris to Algiers."
 krcw_fra_cybernetic_coordination:0 "Cybernetic Coordination"
 krcw_fra_cybernetic_coordination_desc:0 "The Saclay computing bureau is wired by teleprinter to workshops across the country. The plan is no longer an order from above but a balance sheet corrected daily. The question is: who has the right to correct it?"
 krcw_fra_machine_tools_for_the_world:0 "Machine Tools for the World"
 krcw_fra_machine_tools_for_the_world_desc:0 "A French lathe can be found in Cologne, on a smuggler's boat off Bombay, in a Nanjing arsenal and on a Detroit line. The Clearing Union lets poor countries pay for machines in raw materials and labour-hours rather than with a debt they can never repay."
 krcw_fra_the_global_ledger:0 "The Global Ledger"
 krcw_fra_the_global_ledger_desc:0 "The Clearing Union's ledger is no longer one book in Paris but twelve books in twelve cities, reconciled daily by wire. It is no longer a French institution but a public utility of the whole Internationale."
 krcw_fra_federal_defence_review:0 "The Federal Defence Review"
 krcw_fra_federal_defence_review_desc:0 "The army of 1944 was built to reach the Elbe. The question in 1949 is different: how to hold the Elbe without letting the army become a state within the state."
 krcw_fra_federal_army_reform:0 "Federal Defence Force Reform"
 krcw_fra_federal_army_reform_desc:0 "General Tanguy's plan: professional mobile corps at the front, union-raised territorials in depth. The soldiers' councils remain, but no longer debate operational orders."
 krcw_fra_armour:0 "Armoured Federations"
 krcw_fra_armoured_federations:0 "The Armoured Federations"
 krcw_fra_armoured_federations_desc:0 "Renault's Boulogne works and the SOMUA shops merge into a single armour federation. Designers and drivers sit at one table to argue the next turret."
 krcw_fra_raise_territorial_defence:0 "The Territorial Defence"
 krcw_fra_raise_territorial_defence_desc:0 "A defence company in every union and an armoury in every commune. The revolution was not won by a standing army and will not be kept by one."
 krcw_fra_doctrine:0 "The Elbe Doctrine"
 krcw_fra_elbe_doctrine:0 "The Elbe Doctrine"
 krcw_fra_elbe_doctrine_desc:0 "A new doctrine: if the Russians cross, counter-attack at once, and organise every industrial city in depth as a fortress."
 krcw_fra_the_atlantic_fleet:0 "The Atlantic Fleet"
 krcw_fra_the_atlantic_fleet_desc:0 "The Brest yards are fired up again. The Commune's navy has a plain task: escort, from Le Havre to New York and Marseille to Alexandria."
 krcw_fra_subs:0 "Submarine Arm"
 krcw_fra_submarine_arm:0 "The Submarine Arm"
 krcw_fra_submarine_arm_desc:0 "The Accord's main fleets are in the Baltic and the Black Sea, both with narrow exits. A few dozen submarines can keep them there."
 krcw_fra_air_federation:0 "The Aviation Federation"
 krcw_fra_air_federation_desc:0 "The Toulouse, Bordeaux and Marignane works form a single federation. Half the air force's pilots rose from mechanic during the war."
 krcw_fra_jets:0 "Jet Interceptors"
 krcw_fra_jet_interceptors:0 "Jet Interceptors"
 krcw_fra_jet_interceptors_desc:0 "A Russian bomber out of Berlin reaches Paris in an hour and a half. The interceptor has to be faster."
 krcw_fra_screens:0 "Mediterranean Squadron"
 krcw_fra_mediterranean_squadron:0 "The Mediterranean Squadron"
 krcw_fra_mediterranean_squadron_desc:0 "The Toulon and Mers-el-Kébir squadrons form a joint command with the Italian navy. The Mediterranean is the Internationale's inland sea, or ought to be."
 krcw_fra_a_citizens_army:0 "Create the Federal Defence Council"
 krcw_fra_a_citizens_army_desc:0 "Army, navy and air force are unified under a Federal Defence Committee elected by the Congress. Generals still command, but they report to the workers' delegates."
 krcw_fra_national_research_council:0 "The National Research Council"
 krcw_fra_national_research_council_desc:0 "France's laboratories survived the revolution and were evacuated to cellars and monasteries during the war. The Research Council gathers them again, funded directly by the Congress, with research topics set by the scientific workers' own federation."
 krcw_fra_univ:0 "University Federations"
 krcw_fra_university_federations:0 "The University Federations"
 krcw_fra_university_federations_desc:0 "The universities of Paris, Lyon and Grenoble are run jointly by teachers, students and staff. The entrance examinations remain; the fees are abolished."
 krcw_fra_computing:0 "Saclay Computing Bureau"
 krcw_fra_computing_bureau:0 "The Saclay Computing Bureau"
 krcw_fra_computing_bureau_desc:0 "Mathematicians, telegraph engineers and statisticians form the computing bureau at Saclay. Their first electronic computer fills a hangar and serves nuclear physics and the plan's balance sheet alike."
 krcw_fra_atom:0 "Commissariat for Atomic Energy"
 krcw_fra_found_atomic_commissariat:0 "The Commissariat for Atomic Energy"
 krcw_fra_found_atomic_commissariat_desc:0 "Joliot-Curie's group receives the largest single budget line of the Research Council. Uranium contracts with Madagascar and the Congo are settled through the Clearing Union."
 krcw_fra_test_range_tt:0 "The §YReggane§! range is ready: the Commune's first atomic test is expected around §Y1950§!."
 krcw_fra_saharan_test_range:0 "The Saharan Test Range"
 krcw_fra_saharan_test_range_desc:0 "There is no village within three hundred kilometres of Reggane. The engineers lay down an airstrip, a thirty-metre steel tower and a field of observation bunkers."
 krcw_fra_the_bomb_question:0 "Set the Size of the Arsenal"
 krcw_fra_the_bomb_question_desc:0 "\"Louise\" has gone off in the desert. Now the Congress must answer a question no revolutionary ever expected to face: how many city-killing bombs should a workers' state possess?"
 krcw_fra_minimum_deterrence:0 "Minimum Deterrence"
 krcw_fra_minimum_deterrence_desc:0 "A handful is enough. The rest of the money goes to reactors and schools."
 krcw_fra_the_communes_deterrent:0 "Build a Full Deterrent"
 krcw_fra_the_communes_deterrent_desc:0 "Savinkov understands only one language. The Commune will build a force large enough to cover every target from Warsaw to the Urals."
 krcw_fra_reactors:0 "Reactor Federation"
 krcw_fra_reactor_federation:0 "The Reactor Federation"
 krcw_fra_reactor_federation_desc:0 "The Internationale's atomic cooperation agency is founded at Strasbourg: reactor designs and fuel shared among members, power fed into the European grid. For the first time the atom lights lamps."
 krcw_fra_rockets:0 "Sounding Rockets"
 krcw_fra_sounding_rockets:0 "Sounding Rockets"
 krcw_fra_sounding_rockets_desc:0 "The Vernon rocket group begins with eleven people and an engine captured from a wartime works in the Rhineland. Their first sounding rocket reaches sixty kilometres."
 krcw_fra_hammaguir_range:0 "The Hammaguir Range"
 krcw_fra_hammaguir_range_desc:0 "The plateau south of Béchar has little wind, clear skies and almost no one living on it. Work on the range begins in 1954."
 krcw_fra_space:0 "The 1871 Programme"
 krcw_fra_space_race_tt:0 "The Commune formally enters the §YSpace Race§!: it will try to launch the first artificial satellite around §Y1953§!."
 krcw_fra_the_1871_programme:0 "The \"1871\" Programme"
 krcw_fra_the_1871_programme_desc:0 "The Research Council formally approves an \"upper-atmosphere research\" programme, codename 1871. Everyone knows its real object: the first power to put a made thing into orbit will be a workers' state."
 krcw_fra_orbit:0 "Towards Orbit"
 krcw_fra_orbit_r:0 "Towards Orbit"
 krcw_fra_towards_orbit:0 "Towards Orbit"
 krcw_fra_towards_orbit_desc:0 "The three-stage \"Gemstone\" completes its fourth test at Hammaguir. The tracking stations sit in the old harbours of Algiers, Dakar and Cayenne; the harbours are no longer French, but their federations have agreed to help."
 krcw_fra_a_shared_sky:0 "Deploy Reconnaissance Satellites"
 krcw_fra_a_shared_sky_desc:0 "After the first satellite the Research Council hands later launches to the Military Intelligence Bureau, and the cameras are turned on the airfields and rail junctions of Poland and the Minsk and Kiev districts. The Academy complains that orbital data is no longer published."
 krcw_fra_the_internationale_at_paris:0 "Host the International Secretariat"
 krcw_fra_the_internationale_at_paris_desc:0 "The Third Internationale's Secretariat sits in the old Bourse building in Paris. From Nanjing to New York, delegates of a dozen federations, republics and communes meet here each quarter; their only common languages are French and the Internationale."
 krcw_fra_reform_the_secretariat:0 "Reform the Secretariat"
 krcw_fra_reform_the_secretariat_desc:0 "The Internationale cannot be a French institution forever. The new charter gives Nanjing, London, Rome and New York equal seats and equal vetoes."
 krcw_fra_the_rhine_compact:0 "The Rhine Compact"
 krcw_fra_the_rhine_compact_desc:0 "The German Socialist Republic is the Internationale's front-line state: every one of its cities is within range of Russian artillery. The Rhine Compact merges French and German railways, grids and defence plans."
 krcw_fra_hold_berlin:0 "Hold Berlin"
 krcw_fra_hold_berlin_desc:0 "West Berlin is surrounded by the DDR. As long as it holds, the Elbe remains a ceasefire line rather than a recognised frontier."
 krcw_fra_italian_brotherhood:0 "The Italian Brotherhood"
 krcw_fra_italian_brotherhood_desc:0 "Di Vittorio's Italian Socialist Republic shares the memory of the same revolution. The Alpine rail tunnels are widened jointly by the two countries' unions."
 krcw_fra_the_iberian_federation:0 "The Iberian Federation"
 krcw_fra_the_iberian_federation_desc:0 "The CNT's Iberian Federation is the Internationale's most anarchist member; it dislikes the Paris Secretariat, and every other secretariat. The Commune's answer is to send not advisers but machines."
 krcw_fra_the_channel_compact:0 "The Channel Compact"
 krcw_fra_the_channel_compact_desc:0 "The Commune has Europe's largest army and the Union of Britain the Internationale's largest fleet. The division of labour is natural; the negotiation is long."
 krcw_fra_the_atlantic_bridge:0 "The Atlantic Bridge"
 krcw_fra_the_atlantic_bridge_desc:0 "Reuther's Combined Syndicates and Buck's Canada hold the Internationale's other front across the ocean. From Le Havre to New York, one convoy a week."
 krcw_fra_wca_arsenal:0 "Great Lakes Arsenal"
 krcw_fra_can_arsenal:0 "Great Lakes Arsenal"
 krcw_fra_the_great_lakes_arsenal:0 "The Great Lakes Arsenal"
 krcw_fra_the_great_lakes_arsenal_desc:0 "Detroit lorries, Ontario nickel and French blueprints: the Internationale's North American arsenal is planned by all three together."
 krcw_fra_chi_aid:0 "Paris–Nanjing Axis"
 krcw_fra_the_nanjing_axis:0 "The Paris–Nanjing Axis"
 krcw_fra_the_nanjing_axis_desc:0 "Zhou Enlai worked at Renault in Paris as a young man. Now he leads the Internationale's Asian pillar, and every new factory in Nanjing has French engineers on the floor."
 krcw_fra_the_monsoon_conference:0 "The Monsoon Conference"
 krcw_fra_the_monsoon_conference_desc:0 "The Rangoon conference gathers every national-revolutionary government and trade union of South-East Asia. The Commune sends only observers: Asia's revolution should be spoken by Asians."
 krcw_fra_the_liberation_fund:0 "The Liberation Fund"
 krcw_fra_the_liberation_fund_desc:0 "When the empires broke in the 1920s the new states of Africa and Asia had almost nothing: no railways, no schools, and no one willing to lend. The Liberation Fund is financed by Britain and France together, on one condition only — the money goes to local cooperatives and unions."
 krcw_fra_the_algerian_question:0 "Answer the Algiers Congress"
 krcw_fra_the_algerian_question_desc:0 "In 1921 the Commune proclaimed \"the abolition of all colonies\" and kept Algeria, on the ground that it was \"part of France.\" Thirty years later the Algiers federation congress demands that the Commune honour its own proclamation."
 krcw_fra_technicians_not_governors:0 "Send Technicians to the Young Nations"
 krcw_fra_technicians_not_governors_desc:0 "Engineers, doctors and teachers go to Dakar, Accra, Cairo and Rangoon on two-year contracts, after which the work passes to local people. The Secretariat wants these countries on the Internationale's side in the Cold War; the Clearing Union's development fund pays."
 krcw_fra_the_global_internationale:0 "Invite the World's Workers' Governments"
 krcw_fra_the_global_internationale_desc:0 "The Internationale is no longer a European alliance. The Secretariat invites every workers' government in the world to share the Clearing Union, the technology and the defence, on one condition only: that each goes its own way."
 krcw_fra_the_two_worlds:0 "Set the Line Toward the East"
 krcw_fra_the_two_worlds_desc:0 "The Congress must set its long-term line toward the Accord: hold the Elbe and weaken the Accord from within, or carry the revolution across the river. Most of the Secretariat favours the first; the young delegates and the exiled eastern European unions favour the second."
 krcw_fra_peaceful_competition:0 "Adopt the Containment Line"
 krcw_fra_peaceful_competition_desc:0 "The Secretariat decides not to start a war but to hold the present line and weaken the Accord with intelligence, broadcasting and trade. Frachon and most of the federations back it; the price is intelligence and propaganda budgets kept at a wartime level for years."
 krcw_fra_permanent_revolution:0 "Permanent Revolution"
 krcw_fra_permanent_revolution_desc:0 "The Internationale's left holds coexistence a trap: every year of delay, Savinkov's gallows claim more workers. The revolution cannot stop at the Elbe."
 krcw_fra_the_geneva_channel:0 "Open the Geneva Station"
 krcw_fra_the_geneva_channel_desc:0 "The Federal Military Intelligence Bureau opens a permanent station in Geneva to recruit Accord diplomats and trade officials. The money comes out of the foreign budget, and if the station is exposed Switzerland will expel our whole delegation."
 krcw_fra_exchange:0 "Scientific Exchange"
 krcw_fra_scientific_exchange:0 "Launch the Eastern Broadcasts"
 krcw_fra_scientific_exchange_desc:0 "Radio Paris starts shortwave services in Polish, Czech, Hungarian and Russian, reporting the strikes, shortages and trials the Accord papers leave out. Exiled eastern European union officials write the scripts, and the transmitters in Alsace and Corsica take a good deal of power and staff."
 krcw_fra_test_ban_talks:0 "Impose a Strategic Embargo on the Accord"
 krcw_fra_test_ban_talks_desc:0 "The Clearing Union members stop selling machine tools, bearings, rubber and radio valves to the Accord and undercut its exports on neutral markets. The export federations of Lyon and Milan object, since they lose orders."
 krcw_fra_the_convergence_declaration:0 "Adopt the Plan to Break the Accord"
 krcw_fra_the_convergence_declaration_desc:0 "The Secretariat folds intelligence, broadcasting, the embargo and support for the exile organisations into one plan whose aim is to make the Accord ruin itself economically. The intelligence bureau and the Clearing Union carry it out, and the Congress votes the money each year in closed session."
 krcw_fra_arm_the_partisans:0 "Arm the Partisans"
 krcw_fra_arm_the_partisans_desc:0 "Polish miners, Hungarian sharecroppers, the brothers in the Baltic forests: they all need rifles and radios."
 krcw_fra_the_final_struggle:0 "Prepare to Liberate Eastern Europe"
 krcw_fra_the_final_struggle_desc:0 "The Congress resolves that the Internationale will be ready to liberate eastern Europe within five years. The wireless sings the last verse of the Internationale again."
 krcw_eu_republican_claim:0 "The Republican Claim"
 krcw_eng_naval_guarantee:0 "The British Naval Guarantee"
 krcw_eng_home_guard:0 "The People's Home Guard"
 krcw_eng_home_guard_desc:0 "Wintringham learned one thing in Spain: trained workers holding rifles in their own streets are harder to beat than any regular division. The Osterley Park school graduates a thousand a month."
 krcw_eng_steel_corporation:0 "The Iron and Steel Corporation"
 krcw_eng_steel_corporation_desc:0 "The furnaces of Sheffield, Scunthorpe and Port Talbot passed to the steelworkers in 1926, but for twenty years each ran its own affairs: eleven gauges of the same billet, and the yards took what they could use. The new Corporation expropriates nobody; it does one thing only — one set of gauges, one order book, one production schedule. The steel saved in the first year would build four more escorts."
 krcw_eng_the_yards:0 "The Yards Compact"
 krcw_eng_the_yards_desc:0 "The yards of the Clyde, Tyne, Birkenhead and Belfast once fought each other for orders, for skilled men and for slipways. The shipwrights' new compact ranks them in sequence: carriers on the Clyde, escorts on the Tyne, freighters on the Mersey, trawlers in the north-east. Every slipway runs full, and an apprentice knows for the first time where he will be working in five years."
 krcw_eng_stewards_current:0 "The Stewards' Current"
 krcw_eng_stewards_current_desc:0 "The stewards of Clydeside are not satisfied with one vote at the production meeting. Their demands fit on one mimeographed sheet: officers elected directly by the shop and recallable at any time; factory accounts published quarterly; the federation headquarters moved out of London to the industrial districts. The Secretariat calls it anarchism. Output is rising all the same — workers who are heard work faster."
 krcw_eng_blackshirt_remnant:0 "The Blackshirt Remnant"
 krcw_eng_blackshirt_remnant_desc:0 "Mosley fled to Canada in 1925, from Canada to Australia, and died at last in a house with a swimming pool outside Sydney. The followers he left behind did not leave: they are in the veterans' clubs, the greyhound tracks and certain dockers' branches, waiting quietly for the Union to blunder. Every time rations are cut their leaflets multiply."
 krcw_eng_consumer_turn:0 "Producing for the Workers"
 krcw_eng_consumer_turn_desc:0 "At the Congress a Lancashire weaver asks the question that silences the platform: we have built all these escorts — when do we build washing machines? The second five-year plan is rewritten: three tenths of new capacity goes to housing, appliances, bicycles, ready-made clothes and tinned food. Some call it petty-bourgeois degeneration. The waiting lists in the new towns begin to shorten for the first time."
 krcw_eng_incidents_at_sea:0 "The Incidents-at-Sea Agreement"
 krcw_eng_incidents_at_sea_desc:0 "The agreement runs to four pages and mentions no ideology. Warships keep three thousand yards, do not illuminate with fire-control radar, make no mock attacks, and aircraft do not cross ahead of the other's bow; if there is an incident the two navies speak directly, without their foreign ministries. Neither country's press leads with it on the day of signature, but many nights that might have started a war stop happening in the North Atlantic."
 krcw_eng_indian_ocean_school:0 "The Indian Ocean Run"
 krcw_eng_indian_ocean_school_desc:0 "The old Empire sailed this route to carry cotton and collect taxes. The same route now carries the opposite: ore and coffee from the young nations at Mombasa and Dar es Salaam, and outward machine tools, diesel engines and three thousand technicians willing to spend two years in the tropics. The same fleet escorts them, under a different flag."
 krcw_eng_tree:0 "krcw_eng_tree"
 krcw_eng_the_blackpool_congress:0 "The Blackpool Congress"
 krcw_eng_the_blackpool_congress_desc:0 "The Trades Union Congress meets every autumn at Blackpool: the seafront hotels fill with delegates and the ballroom becomes the chamber. The 1949 agenda has one item: twenty-five years after the revolution, is the Union of Britain a union, or a state?"
 krcw_eng_the_federal_congress:0 "The Federal Congress"
 krcw_eng_the_federal_congress_desc:0 "The Congress is both legislature and national industrial board. Wintringham's solution is to hold the two sittings separately: the same people, on different days."
 krcw_eng_the_shop_stewards:0 "The Shop Stewards"
 krcw_eng_the_shop_stewards_desc:0 "The stewards of Clydeside, Sheffield and Coventry are veterans of 1925. They complain loudest about the London offices and are the best organisers of production."
 krcw_eng_scottish_and_welsh_congresses:0 "Scottish and Welsh Congresses"
 krcw_eng_scottish_and_welsh_congresses_desc:0 "Edinburgh and Cardiff receive congresses of their own; the coal, steel and shipbuilding federations answer to them directly."
 krcw_eng_against_the_offices:0 "Against the Offices"
 krcw_eng_against_the_offices_desc:0 "The Congress resolves that no federation may employ full-time officers above one per cent of its membership. The surplus go back to the shop floor."
 krcw_eng_the_ulster_question:0 "Settle Ulster's Allegiance"
 krcw_eng_the_ulster_question_desc:0 "The revolution of 1925 split Belfast's workers: the Protestant shipyards backed the Union, the Catholic districts looked to Dublin's Workers' Republic. Now both countries share one Internationale, and the wound remains."
 krcw_eng_the_rock:0 "The Gibraltar Agreement"
 krcw_eng_the_rock_desc:0 "Gibraltar now belongs to the Iberian Federation. Agree with the CNT that Britain's Mediterranean squadron may go on using the harbour."
 krcw_eng_the_irish_sea_compact:0 "The Irish Sea Compact"
 krcw_eng_the_irish_sea_compact_desc:0 "Dublin and London sign a compact to manage fisheries, the grid and shipping in common. For the first time no colonial shadow falls between the two revolutionary states."
 krcw_eng_the_coal_federation:0 "The Coal Federation"
 krcw_eng_the_coal_federation_desc:0 "The pits of South Wales, Yorkshire and Northumberland went to the miners in 1925. Twenty-odd years on, the headframes are old and so are the men."
 krcw_eng_the_new_towns:0 "The New Towns"
 krcw_eng_the_new_towns_desc:0 "Half of London's slums burned in the wartime raids. The housing federation plans eight new towns beyond the city, each with its own works, schools, clinic and baths."
 krcw_eng_lancashire_and_the_midlands:0 "Lancashire and the Midlands"
 krcw_eng_lancashire_and_the_midlands_desc:0 "Manchester's mills are converted to electrical works, and Birmingham's shops begin building machine tools for the transnational federations."
 krcw_eng_grid:0 "Electrify the Union"
 krcw_eng_electrify_the_union:0 "Electrify the Union"
 krcw_eng_electrify_the_union_desc:0 "The Grid Board's slogan is simple: every village on the mains by 1955."
 krcw_eng_ledger:0 "London and the Ledger"
 krcw_eng_london_and_the_ledger:0 "London and the Ledger"
 krcw_eng_london_and_the_ledger_desc:0 "The City's old bankers are long gone, but their cable lines, shipping insurance and commodity exchanges remain. The Clearing Union opens its second settlement centre in London."
 krcw_eng_harwell_n:0 "Harwell"
 krcw_eng_harwell:0 "Harwell"
 krcw_eng_harwell_desc:0 "On an old airfield in Oxfordshire the Union builds its atomic research establishment."
 krcw_eng_reactor:0 "The Anglo-French Atom"
 krcw_eng_the_anglo_french_atom:0 "The Anglo-French Atom"
 krcw_eng_the_anglo_french_atom_desc:0 "Harwell and Saclay share drawings and a uranium quota. The Commune has the bomb and the Union the reactor designs; neither will carry the cost alone."
 krcw_eng_the_red_fleet:0 "The Red Fleet"
 krcw_eng_the_red_fleet_desc:0 "In 1925 the Grand Fleet's sailors raised the red flag at Scapa Flow, and only then was the revolution truly won. Twenty-five years on the fleet is still the Internationale's greatest force at sea."
 krcw_eng_clyde_and_tyne:0 "Clyde and Tyne"
 krcw_eng_clyde_and_tyne_desc:0 "The Clyde and Tyne yards are run by the shipwrights' federation, and must build escorts, freighters and trawlers all at once."
 krcw_eng_the_atlantic_lifeline:0 "The Atlantic Lifeline"
 krcw_eng_the_atlantic_lifeline_desc:0 "The North Atlantic is the Internationale's artery: American steel and grain eastward, European machines and technicians westward."
 krcw_eng_asw:0 "Hunter-Killer Groups"
 krcw_eng_hunter_killer_groups:0 "Hunter-Killer Groups"
 krcw_eng_hunter_killer_groups_desc:0 "Russian submarines out of Murmansk must pass the Greenland–Iceland–UK gap. The hunter-killer groups wait there."
 krcw_eng_cv:0 "The Carrier Arm"
 krcw_eng_the_carrier_arm:0 "The Carrier Arm"
 krcw_eng_the_carrier_arm_desc:0 "The fleet air arm proved itself in the war. The centre of the next fleet will be the carrier."
 krcw_eng_north_atlantic_command:0 "North Atlantic Command"
 krcw_eng_north_atlantic_command_desc:0 "The navies of the Union, the Commune, the Combined Syndicates and Canada form a joint North Atlantic Command, alternating between Halifax and Plymouth."
 krcw_eng_the_peoples_air_force:0 "The People's Air Force"
 krcw_eng_the_peoples_air_force_desc:0 "Most of the Union's pilots came up through the aircraft workers' night schools."
 krcw_eng_jets:0 "Jet Engines"
 krcw_eng_jet_engines:0 "Jet Engines"
 krcw_eng_jet_engines_desc:0 "The Derby engine works has the best jet design office in the Internationale."
 krcw_eng_radar:0 "The Radar Chain"
 krcw_eng_the_radar_chain:0 "The Radar Chain"
 krcw_eng_the_radar_chain_desc:0 "From Shetland to Cornwall a radar chain watches the Union's sky."
 krcw_eng_the_home_guard:0 "The People's Home Guard"
 krcw_eng_the_home_guard_desc:0 "Wintringham's Osterley school grows into a national Home Guard, with a platoon in every union branch."
 krcw_eng_the_naval_pillar:0 "The Naval Pillar"
 krcw_eng_the_naval_pillar_desc:0 "Almost all of the Internationale's naval strength is British. Establish Britain as the lead power in the bloc's maritime defence."
 krcw_eng_canadian_brothers:0 "Canadian Brothers"
 krcw_eng_canadian_brothers_desc:0 "In 1940 Canada's workers sent the exiled Crown on to Australia. Since then only union cables pass between London and Ottawa, not governors' letters."
 krcw_eng_a_commonwealth_of_liberation:0 "Aid the Former Colonies' Unions"
 krcw_eng_a_commonwealth_of_liberation_desc:0 "The old Empire's railways, ports and universities are still there; they belong now to Cairo, Lagos and Accra. The Union's aid carries one condition: it goes to local unions and cooperatives."
 krcw_eng_the_question_of_canberra:0 "Settle the Canberra Policy"
 krcw_eng_the_question_of_canberra_desc:0 "The House of Windsor keeps a \"Britain in exile\" at Canberra; its very existence denies the Union's legitimacy. Yet Australia's wharfies and shearers do not necessarily agree with their King."
 krcw_eng_a_letter_to_canberra:0 "Write to Canberra"
 krcw_eng_a_letter_to_canberra_desc:0 "The Congress writes to the Australasian Entente: it does not ask the King to abdicate, only that Australasia keep its harbours closed to the Russian fleet."
 krcw_eng_the_republican_claim:0 "Assert Sole Legitimacy"
 krcw_eng_the_republican_claim_desc:0 "The Union is the only lawful government of the British people. The court at Canberra is a usurper, and its flag should come down in every Australian strike."
 krcw_eng_the_west_african_ports:0 "The West African Ports"
 krcw_eng_the_west_african_ports_desc:0 "The dockers' federations of Freetown and Lagos sign a cooperation compact with Liverpool's: technicians, cranes and sailings, all managed in common."
 krcw_eng_peace_on_the_seas:0 "Deny the Russian Fleet Neutral Harbours"
 krcw_eng_peace_on_the_seas_desc:0 "The foreign ministry and the seamen's union press Canberra, the Cape and the West African ports together: any harbour that fuels or repairs the Russian fleet will no longer see a Union freighter. The seamen back the ban; it raises freight rates on several routes."
 krcw_eng_the_union_of_the_seas:0 "Build the Internationale's Overseas Base Network"
 krcw_eng_the_union_of_the_seas_desc:0 "Build fuelling stations, docks and signal stations at Freetown, Ascension and St Helena so that the Internationale's fleets can resupply without coming home. The Admiralty drew up the scheme; it costs a sizeable construction budget."
 krcw_eng_the_stewards_current:0 "Answer the Stewards' Movement"
 krcw_eng_the_stewards_current_desc:0 "The Clydeside shop stewards' movement wants power moved from federation headquarters back to the shop meetings. It is not against the government, but the secretariat has to answer it."
 krcw_eng_the_second_commune_in_britain:0 "The Second Commune in Britain"
 krcw_eng_the_second_commune_in_britain_desc:0 "The Second Commune movement reaches Britain: young workers in Manchester and Glasgow occupy federation offices and demand two-year terms for officials. The government must decide whether to negotiate or clear them out."
 krcw_eng_the_blackshirt_shadow:0 "Root Out the Blackshirt Remnant"
 krcw_eng_the_blackshirt_shadow_desc:0 "Mosley's followers are still active in the veterans' association and some dock branches, leafleting whenever rations are cut. Decide whether to ban them or win over their audience with jobs and housing."
 krcw_eng_after_wintringham:0 "Arrange Wintringham's Succession"
 krcw_eng_after_wintringham_desc:0 "Wintringham is past sixty and the Union has no succession law; the General Secretary is elected by the Congress. Three candidates: an old union official, the Clydeside stewards' leader, and the head of the new towns programme."
 krcw_eng_the_steel_corporation:0 "The Iron and Steel Corporation"
 krcw_eng_the_steel_corporation_desc:0 "The steelworkers took the furnaces in 1926, but for twenty years each ran its own affairs. The new Corporation expropriates nobody; it unifies gauges, orders and scheduling. The steel saved would build several more escorts."
 krcw_eng_the_yards_compact:0 "The Yards Compact"
 krcw_eng_the_yards_compact_desc:0 "The yards of the Clyde, Tyne, Mersey and Belfast once fought each other for orders, men and slipways. The new compact ranks them in sequence; every slipway runs full."
 krcw_eng_the_railway_federation:0 "The Railway Federation"
 krcw_eng_the_railway_federation_desc:0 "The four great railway companies merged into one during the revolution, run by the railwaymen's federation. But there are still four gauges of signalling and four classes of locomotive. The national railway plan will take ten years to unify them and electrify every main line."
 krcw_eng_producing_for_the_workers:0 "Producing for the Workers"
 krcw_eng_producing_for_the_workers_desc:0 "A Lancashire weaver asks the Congress: we have built all these escorts — when do we build washing machines? The second five-year plan is rewritten: three tenths of new capacity goes to housing, appliances, bicycles and clothes."
 krcw_eng_the_calculating_engine:0 "Commercialise the Manchester Engine"
 krcw_eng_the_calculating_engine_desc:0 "In a laboratory at Manchester University a machine that fills a whole room computes the transnational production quotas for the Clearing Union. It also computes neutron paths for Harwell. The Union decides to make an industry of it: the computer will be the abacus of the socialist plan."
 krcw_eng_computing:0 "The Manchester Engine"
 krcw_eng_the_workers_university:0 "The Workers' University"
 krcw_eng_the_workers_university_desc:0 "The Union's universities no longer take only grammar-school boys. Every union branch may send members up, fees paid by the federation, to return to their works for three years after graduation. For the first time the laboratories at Harwell and Manchester are not short of hands."
 krcw_eng_the_battleship_question:0 "Decide the Battleships' Fate"
 krcw_eng_the_battleship_question_desc:0 "The Grand Fleet left six battleships. Some say they are obsolete steel coffins that should be scrapped for the furnaces; others that they are still the only thing that can outgun a Russian heavy cruiser. The naval federation argues for a full year."
 krcw_eng_the_submarine_arm:0 "The Submarine Arm"
 krcw_eng_the_submarine_arm_desc:0 "The best way to hunt a submarine is to understand how one thinks. The Union's submarine arm trains in the deep lochs of Scotland's west coast, both as an attack force and as the sparring partner for the hunter-killer groups."
 krcw_eng_subs:0 "The Submarine Arm"
 krcw_eng_the_royal_marines:0 "The Naval Brigades"
 krcw_eng_the_royal_marines_desc:0 "Britain has no empire to hold any longer, but the Internationale's ports from the Cape to Singapore may need holding or evacuating. The naval brigades are a force that can embark and go."
 krcw_eng_marines:0 "The Naval Brigades"
 krcw_eng_the_incidents_agreement:0 "Close the Iceland Gap"
 krcw_eng_the_incidents_agreement_desc:0 "Lay hydrophones, minefields and standing anti-submarine groups between Greenland, Iceland and Britain so that the Russian Northern Fleet cannot slip its submarines into the Atlantic unseen. The Admiralty wants it; the Icelandic government wants rent for the bases."
 krcw_eng_the_bomber_command:0 "Bomber Command"
 krcw_eng_the_bomber_command_desc:0 "Should the Union have a strategic bomber force? It is expensive, offensive, and the only way to carry a Harwell bomb to Moscow. The peace faction says the money belongs to the escorts; the deterrent faction says that without bombers the atom is an ornament in a laboratory."
 krcw_eng_the_deterrent:0 "The Minimum Deterrent"
 krcw_eng_the_deterrent_desc:0 "The Union follows Paris: nuclear weapons have one use, to make the enemy's useless. The number is capped, no first use, placed under the joint North Atlantic Command. It is a force meant never to be used — but it must exist."
 krcw_eng_the_pacific_squadron:0 "The Pacific Squadron"
 krcw_eng_the_pacific_squadron_desc:0 "The Congress in Sacramento wavers between the blocs, and Japan's fleet rebuilds on Moscow's drawings. The Union proposes to Nanjing and Canberra that the Internationale show more of its warships in the Pacific, so that the Constitutional Coalition and Japan both see its fleet close at hand."
 krcw_eng_the_indian_ocean_run:0 "The Indian Ocean Run"
 krcw_eng_the_indian_ocean_run_desc:0 "The old Empire sailed this route for cotton and taxes. The same route now carries the opposite: ore and coffee from the young nations northward, machine tools and technicians southward."
 krcw_eng_the_young_nations_and_the_fleet:0 "The Young Nations and the Fleet"
 krcw_eng_the_young_nations_and_the_fleet_desc:0 "The Union proposes a free-shipping zone escorted by the Internationale and open to the young nations: any nation's merchantmen may join the convoys, so long as it opens no port to Moscow's fleet. It is a kind of non-alignment bought with a navy."
 krcw_eng_the_fishing_fleets:0 "The Fishing Fleets"
 krcw_eng_the_fishing_fleets_desc:0 "The trawler fleets of Hull, Grimsby and Aberdeen are the protein of Britain's workers and the navy's best school for seamen. The shipwrights' federation decides to renew them both at once."
 krcw_eng_civil_aviation:0 "Civil Aviation"
 krcw_eng_civil_aviation_desc:0 "The engine works of Derby and Bristol build more than fighters. The Internationale's trunk routes — Paris to Nanjing, London to Mombasa — need a reliable four-engined airliner, and the Union means to build it."
 krcw_eng_airliner:0 "Civil Aviation"
 krcw_eng_the_naval_academy:0 "The Dartmouth Academy"
 krcw_eng_the_naval_academy_desc:0 "Most of the Grand Fleet's officers stayed on through the revolution — the sea knows no class. The Dartmouth academy now teaches navigation and Das Kapital alike, and turns out captains both red and expert."
 krcw_eng_naval_doc:0 "The Dartmouth Academy"
 krcw_eng_the_atlantic_charter_of_labour:0 "The Atlantic Charter of Labour"
 krcw_eng_the_atlantic_charter_of_labour_desc:0 "The unions of the Union, the Commune, Canada and the Combined Syndicates sign a charter: common minimum labour standards, a transatlantic unemployment fund, mutually recognised union cards. These are the stitches binding the two shores of the North Atlantic."
 krcw_eng_a_free_press_of_the_unions:0 "A Free Press of the Unions"
 krcw_eng_a_free_press_of_the_unions_desc:0 "The major federations keep their own newspapers, and the secretariat does not impose a single line."
 krcw_eng_north_sea_gas:0 "Develop North Sea Gas"
 krcw_eng_north_sea_gas_desc:0 "The survey ships find gas beneath the North Sea, and perhaps oil. To reach it needs a new kind of offshore platform — another thing the yards can build. For the first time the Union sees energy that need not be imported."
 krcw_eng_the_commonwealth_congress:0 "The Commonwealth Congress"
 krcw_eng_the_commonwealth_congress_desc:0 "The name of the old Commonwealth is kept, but its meaning is wholly changed: it is now a voluntary conference of unions and cooperatives, from Accra to Mombasa, Ottawa to Wellington. London is no longer the capital, only the convener."
 krcw_eng_20_t:0 "The Voice from the Shop Floor"
 krcw_eng_20_d:0 "The Clydeside stewards send a petition with three thousand signatures. It carries no threat, only one question: \"Was the revolution to let workers run production, or to let another set of men sit in the old bosses' offices?\" The Secretariat passes it round the table, and no one wishes to be the first to answer."
 krcw_eng_20.a:0 "Bring the stewards onto the industrial board"
 krcw_eng_20.b:0 "Production needs discipline, not debate"
 krcw_eng_21_t:0 "The Second Commune in Britain"
 krcw_eng_21_d:0 "Young workers in Manchester and Glasgow occupy federation offices, \"GIVE US BACK THE REVOLUTION\" whitewashed on the walls. The police stand at the corners and do not move — their fathers were union men too. Wintringham sits in the Downing Street office he has always refused to redecorate, two drafts before him: one declaring martial law, one declaring reform."
 krcw_eng_21.a:0 "The New Charter: power down to the shop"
 krcw_eng_21.b:0 "Clear the squares, restore order"
 krcw_eng_22_t:0 "Leaflets in the Legion Halls"
 krcw_eng_22_d:0 "A shift is cut at the docks, and the Blackshirt leaflets appear the next morning: \"The syndicate gave your job to blacks and Frenchmen.\" The man handing them out is a veteran — of the other side of the line in Spain. The Union can arrest him, or find the docks that shift again."
 krcw_eng_22.a:0 "Answer them with work"
 krcw_eng_22.b:0 "Ban their organisation"
 krcw_eng_12_t:0 "After the Ban"
 krcw_eng_12_d:0 "Four months after the ban, several Legion branches have expelled the leafleteers themselves. The dockers' branches have elected new secretaries. The leaflets have stopped."
 krcw_eng_12.a:0 "Keep the ban and close the file"
 krcw_eng_13_t:0 "The Fire at Woolwich"
 krcw_eng_13_d:0 "The ban has not driven the Blackshirts out, only moved their meetings. One night the Woolwich dockers' union hall is set on fire, their slogan painted on the wall. No one dies, but the hall's records are all burned."
 krcw_eng_13.a:0 "Hand it to the workers' defence corps"
 krcw_eng_13.b:0 "Restore the dock shifts first, then make arrests"
 krcw_eng_23_t:0 "After Wintringham"
 krcw_eng_23_d:0 "The chairman dies quietly during a recess of the Congress. He named no successor — naming successors, he said, is what kings do. The Congress sits through the night with three names on the table: the old secretary of the shipyard union, the leader of the Clydeside stewards, and the technocratic woman who ran the new-towns programme."
 krcw_eng_23.a:0 "The old official: a steady pair of hands"
 krcw_eng_23.b:0 "The stewards' leader: the revolution renewed"
 krcw_eng_23.c:0 "The technocrat: the plan and the computer"
 krcw_eng_24_t:0 "The Fate of the Battleships"
 krcw_eng_24_d:0 "Six battleships lie at Portsmouth, each costing a division's upkeep a year to maintain. The naval federation splits: the old hands cannot let go of Scapa's glory, the young officers want only carriers and escorts."
 krcw_eng_24.a:0 "Keep two, scrap the rest for steel"
 krcw_eng_24.b:0 "Keep them all: the guns still count"
 krcw_eng_25_t:0 "Bombers or Escorts"
 krcw_eng_25_d:0 "The Union cannot afford both. The air federation wants a strategic bomber force to carry Harwell's bomb where it must go; the naval federation wants more escorts to hold the Atlantic lifeline. The Congress must choose."
 krcw_eng_25.a:0 "Escorts first: hold the lifeline"
 krcw_eng_25.b:0 "Bombers: deterrence needs teeth"
 krcw_eng_bomber:0 "Strategic Bombers"
 krcw_eng_fleet_category:0 "Deployments of the Fleet"
 krcw_eng_fleet_category_desc:0 ""
 krcw_eng_show_the_flag_pacific:0 "Show the Flag in the Pacific"
 krcw_eng_show_the_flag_pacific_desc:0 "Send a squadron to the Pacific, so that the wavering Constitutional Coalition and a revanchist Japan both see that the Internationale's navy can reach there."
 krcw_eng_escort_the_young_nations:0 "Escort the Young Nations"
 krcw_eng_escort_the_young_nations_desc:0 "Send the convoys into the Indian Ocean to escort the young nations' merchantmen. It is diplomacy done with warships: whoever's cargo sails in our convoys stands one step further from Moscow."
 krcw_eng_north_atlantic_exercise:0 "The Grand North Atlantic Exercise"
 krcw_eng_north_atlantic_exercise_desc:0 "The fleets of the Union, the Commune, Canada and the Combined Syndicates hold a joint exercise in the North Atlantic. It is for Moscow to see, and for themselves too — four navies acting on one set of signals for the first time."
 krcw_eng_hunt_the_boats:0 "Hunt the Boats"
 krcw_eng_hunt_the_boats_desc:0 "Russian submarines are busy in the Greenland gap. Send the hunter-killer groups on a live exercise — training, and an unspoken warning both."
 ENG_krcw_horner:0 "Arthur Horner"
 ENG_krcw_horner_desc:0 "Secretary of the miners' federation and author of the second decade's draft - housing, heating, water, schools. His case against the nuclear programme never appeals to morality: \"That money comes out of the housing plan.\" His political base is the solidest in the country, because nobody picks a fight with the miners."
 ENG_krcw_gallacher:0 "Willie Gallacher"
 ENG_krcw_gallacher_desc:0 "A boilermaker who became a union organiser, and the man in Congress most able to talk a room of mutually contemptuous federations into a single resolution. He holds the constitution must be written down, the article admitting anti-revolutionary candidates included - not because he is unafraid of losing, but because he has seen what a regime that dares not face a ballot eventually becomes."
 ENG_krcw_wilkinson:0 "Ellen Wilkinson"
 ENG_krcw_wilkinson_desc:0 "\"Red Ellen\", organiser of the Jarrow march and director of the new-towns programme. Her generation made its revolution in town halls and planning drawings: housing, clinics, schools, public baths. She holds that socialism is won or lost not on the barricade but in whether a weaver's kitchen has a washing machine. Two young engineers with slide-rules follow her everywhere."
 krcw_sov_tree:0 "krcw_sov_tree"
 krcw_sov_long_plan:0 "The Long-Term State Plan"
 krcw_sov_long_plan_desc:0 "Not a Bolshevik five-year plan but a ten-year contract between the state and the trusts: the state guarantees orders and credit, the trusts guarantee output and delivery dates. The party in breach goes before an arbitration court, which in Russia is something new."
 krcw_sov_consumer_decade:0 "The Decade of Consumer Goods"
 krcw_sov_consumer_decade_desc:0 "Refrigerators, wireless sets, televisions and a flat with hot water. For the first time the state promises not victory but a life."
 krcw_sov_accord_council:0 "The Accord Council"
 krcw_sov_accord_council_desc:0 "The Accord at last has a standing body: a council, a joint staff and a charter every member signed and every member has read. Moscow is still the largest voice, but no longer the only one."
 krcw_sov_constitutional_crown:0 "The Constitutional Crown"
 krcw_sov_constitutional_crown_desc:0 "The Emperor keeps the coronation, the parades and a signature. The Imperial Duma keeps the budget. The men who fetched him back discover that an Emperor who cuts ribbons is far easier company than one who wishes to rule."
 krcw_sov_marshals_regency:0 "The Marshals' Regency"
 krcw_sov_marshals_regency_desc:0 "In the extremists' second year the General Staff refuses a mobilisation order. The next morning tanks surround the State Security building. The marshals call it \"the restoration of constitutional order,\" and no one in the Moscow streets objects."
 krcw_sov_convergence:0 "Convergence"
 krcw_sov_convergence_desc:0 "In an essay a young physicist argues that the two systems are learning from each other — one has learned planning, the other markets and ballots — and that one day the difference between them will be smaller than the problems they share. Twenty years ago the essay would have sent him to a camp; today it runs in Izvestia."
 krcw_sov_accord_solidarity:0 "Accord Solidarity"
 krcw_sov_nanjing_talks:0 "The Nanjing Talks"
 krcw_sov_patron:0 "Moscow's Protection"
 krcw_sov_the_russian_state:0 "The Russian State"
 krcw_sov_the_russian_state_desc:0 "The Russia of 1949 stretches from the Elbe to the Pacific. It has a Supreme Ruler, a Council of State, an army that has stood in Berlin, and one question nobody dares ask: what comes after Savinkov?"
 krcw_sov_national_populism_doctrine:0 "Write National Populism into Law"
 krcw_sov_national_populism_doctrine_desc:0 "Savinkov wrote his politics into a book: land to the peasants, factories to the state and the trusts, politics to the Ruler. The Council now wishes to turn the book into law, so that it may outlive its author."
 krcw_sov_reform_the_okhrana:0 "Reform State Security"
 krcw_sov_reform_the_okhrana_desc:0 "State Security is Savinkov's sharpest instrument and his most dangerous. Reform means a charter, a budget and an audit — or at least persuading it that it is being audited."
 krcw_sov_zemstvo_revival:0 "Fund the Zemstvos"
 krcw_sov_zemstvo_revival_desc:0 "The one institution of the old Empire that worked was the zemstvo: roads, schools, doctors. Savinkov revived them, forbidding only politics. Now they would like a budget."
 krcw_sov_the_peasant_bargain:0 "Write Commune Land Rights into the Constitution"
 krcw_sov_the_peasant_bargain_desc:0 "Russia never collectivised, and that is national populism's deepest root. Write the commune's title to its land into the constitution, so every peasant knows the state wants his grain quota, not his fields."
 krcw_sov_council_of_state:0 "The Council of State"
 krcw_sov_council_of_state_desc:0 "The constitution says the Supreme Ruler is elected by the Council of State: generals, bishops, trust managers, zemstvo delegates, and two thirds appointed by Savinkov. It has never actually elected anyone."
 krcw_sov_tree_bid_mil_5_tt:0 "Influence of the military pragmatists: §G+5§!"
 krcw_sov_question_of_succession:0 "Debate the Succession"
 krcw_sov_question_of_succession_desc:0 "Savinkov has named no heir. A dictator who names one manufactures an enemy; a dictator who does not bequeaths his country a war. The Council begins, quietly, to prepare."
 krcw_sov_tree_bid_mil_15_tt:0 "Influence of the military pragmatists: §G+15§!"
 krcw_sov_groom_the_general_staff:0 "Groom the General Staff"
 krcw_sov_groom_the_general_staff_desc:0 "Have Vasilevsky attend every session of the Council. He will not speak, but everyone will remember that he sat there."
 krcw_sov_tree_bid_civ_15_tt:0 "Influence of the civilian technocrats: §G+15§!"
 krcw_sov_patronise_the_academicians:0 "Patronise the Academicians"
 krcw_sov_patronise_the_academicians_desc:0 "Sorokin's memoranda circulate among the ministers. Give the economic ministries and the Academy more money and more exposure, and let the Council grow used to hearing a professor speak."
 krcw_sov_tree_bid_mon_15_tt:0 "Influence of the monarchists: §G+15§!"
 krcw_sov_throne_and_altar:0 "Throne and Altar"
 krcw_sov_throne_and_altar_desc:0 "Work resumes on the Cathedral of the Saviour. Bishops, the old nobility and the Ural steel barons begin to dine at one table and discuss a word no one has dared say for thirty years."
 krcw_sov_after_savinkov:0 "Form a Caretaker Government"
 krcw_sov_after_savinkov_desc:0 "He is gone. The Council votes eleven times and nobody reaches a majority. Until the final ballot the state must go on working: post delivered, wages paid, the army fed."
 krcw_sov_a_calm_opponent:0 "Audit the Closed Cities"
 krcw_sov_a_calm_opponent_desc:0 "The new Supreme Ruler makes no speeches. His first order audits the closed cities' budgets, his second cancels the May Day parade, his third gives the money saved to the signals corps."
 krcw_sov_win_on_productivity:0 "Trim Defence to Build Industry"
 krcw_sov_win_on_productivity_desc:0 "Sorokin's first budget cuts defence by a seventh and puts the difference into tractor works, machine-tool plants and railways, arguing that a long stand-off is won on the industrial base. The officers object, but their own General Staff memorandum names supply as the weakest link."
 krcw_sov_the_imperial_duma:0 "The Imperial Duma"
 krcw_sov_the_imperial_duma_desc:0 "The Council becomes the Imperial Duma and its members acquire new court dress. At the opening the Emperor reads a speech someone else has written — the most reassuring detail of the whole restoration."
 krcw_sov_the_final_reckoning:0 "Launch the Final Reckoning"
 krcw_sov_the_final_reckoning_desc:0 "The broadcasts repeat the phrase daily. It is never officially defined, which is precisely its use. A new State Security building rises on Lubyanka Square."
 krcw_sov_the_material_basis:0 "The Material Basis of Defence"
 krcw_sov_the_material_basis_desc:0 "Fund Vasilevsky's memorandum: lorries, radios and standard-gauge railways for an army that wins by firepower and communications."
 krcw_sov_regauge_the_railways:0 "Regauge the Railways"
 krcw_sov_regauge_the_railways_desc:0 "Russia's broad gauge stops dead at the Vistula. Regauging the western trunk lines makes trade cheaper in peacetime — and offensives easier in war, as Paris has also noticed."
 krcw_sov_the_constitutional_crown:0 "Limit the Crown's Budget Powers"
 krcw_sov_the_constitutional_crown_desc:0 "The first quarrel between Duma and Emperor is over the budget, and the Duma wins. The Emperor's advisers think it a defeat; the Emperor himself seems relieved."
 krcw_sov_the_marshals_intervene:0 "Let the Marshals Take Over"
 krcw_sov_the_marshals_intervene_desc:0 "The General Staff refuses a mobilisation order. Next morning tanks surround the Lubyanka. \"The restoration of constitutional order,\" the marshals say, and nothing more, before handing the wireless back to Shostakovich."
 krcw_sov_the_thaw:0 "Proclaim the Successor Government's Programme"
 krcw_sov_the_thaw_desc:0 "The new Supreme Ruler lays his programme before the Council of State: abroad, the Accord stays under Moscow's lead; at home, grain quotas and wages are paid on time. State Security sees that the provinces comply."
 krcw_sov_peaceful_coexistence:0 "Convene an Accord Summit"
 krcw_sov_peaceful_coexistence_desc:0 "The successor government brings the Accord's heads of government to Moscow and confirms treaty duties and garrisons one by one. The members want guarantees; Moscow wants them steady in a crisis. The hospitality and the concessions both cost money."
 krcw_sov_the_consumer_decade:0 "Switch to Consumer Goods"
 krcw_sov_the_consumer_decade_desc:0 "The state promises every household a flat with hot water, and the trusts' orders shift from tanks to refrigerators."
 krcw_sov_the_convergence:0 "Adopt the Programme of Long Confrontation"
 krcw_sov_the_convergence_desc:0 "The Council adopts a paper making the struggle with the Internationale the state's standing task, with twenty-year budgets for arms, propaganda and foreign intelligence. Consumer goods will grow more slowly."
 krcw_sov_the_ural_trusts:0 "The Ural Trusts"
 krcw_sov_the_ural_trusts_desc:0 "State shares, army orders, private managers. The Ural steel trusts are the heart of Savinkov's economy: neither efficient nor wasteful, only nobody asks where the profits go."
 krcw_sov_magnitka_and_chelyabinsk:0 "Magnitka and Chelyabinsk"
 krcw_sov_magnitka_and_chelyabinsk_desc:0 "The factories evacuated beyond the Urals in wartime never moved back. Now they need work in peacetime too."
 krcw_sov_the_second_baku:0 "The Second Baku"
 krcw_sov_the_second_baku_desc:0 "The old Caspian fields are ageing. The geologists say there is a second Baku under the land between the Volga and the Urals, and the rigs in Tatarstan and Bashkiria start working day and night."
 krcw_sov_the_long_plan:0 "The Long-Term State Plan"
 krcw_sov_the_long_plan_desc:0 "The state signs ten-year contracts with the trusts: the state guarantees orders, the trusts guarantee delivery, and defaulters go to arbitration."
 krcw_sov_kuzbass:0 "The Kuzbass"
 krcw_sov_kuzbass_desc:0 "Two thousand kilometres of track lie between the coal of the Kuznetsk basin and the ore of Magnitogorsk. This Ural-Kuznetsk combine is the backbone of Russian heavy industry."
 krcw_sov_the_trans_siberian:0 "The Trans-Siberian"
 krcw_sov_the_trans_siberian_desc:0 "Double the track, electrify it, and survey a northern parallel. The railway is the only way Russia holds itself together as one country."
 krcw_sov_goods_for_the_village:0 "Goods for the Village"
 krcw_sov_goods_for_the_village_desc:0 "The other half of the bargain: the state takes grain and must give the village something — sewing machines, bicycles, paraffin lamps. Otherwise the peasants will hide the grain."
 krcw_sov_angara_and_volga:0 "The Angara and the Volga"
 krcw_sov_angara_and_volga_desc:0 "The dams at Kuybyshev and Bratsk, the two largest on earth. The engineers say they will light half of Siberia; the geologists say they will drown half of it. Both are right."
 krcw_sov_west_siberian_oil:0 "West Siberian Oil"
 krcw_sov_west_siberian_oil_desc:0 "Under the Tyumen marshes lies a sea — a sea of oil. Extracting it means laying roads on permafrost, driving piles into bog, and the youth of a whole generation."
 krcw_sov_lessons_of_the_elbe:0 "Study the 1944 Supply Failure"
 krcw_sov_lessons_of_the_elbe_desc:0 "The army of 1944 reached the Elbe on numbers and will, and stopped there because supply could not follow. Every General Staff study begins with that fact."
 krcw_sov_motor_rifle_divisions:0 "Motor Rifle Divisions"
 krcw_sov_motor_rifle_divisions_desc:0 "Move the infantry from boots to lorries. It takes a hundred thousand lorries and a hundred thousand men who can mend them."
 krcw_sov_guards_tank_armies:0 "Guards Tank Armies"
 krcw_sov_guards_tank_armies_desc:0 "The tank works at Kharkov and Nizhny Tagil produce a creed: if war comes, a flood of steel must reach the Rhine in three weeks."
 krcw_sov_territorial_defence:0 "Territorial Defence"
 krcw_sov_territorial_defence_desc:0 "From the Gulf of Finland to the Black Sea a permanent line goes up along the frontier. The generals dislike it — Russia's defence, they say, is always attack. The Treasury likes it: concrete is cheaper than tanks."
 krcw_sov_the_airborne_forces:0 "The Airborne Forces"
 krcw_sov_the_airborne_forces_desc:0 "Russia was among the first to train parachutists. The force is given a new task: seize the enemy's airfields and bridges on the first night of the war."
 krcw_sov_long_range_aviation:0 "Long-Range Aviation"
 krcw_sov_long_range_aviation_desc:0 "Tupolev's heavy bomber can fly from the Kola Peninsula to Paris and back, if it is not shot down. That is deterrence, at least until the missile."
 krcw_sov_black_sea_and_baltic:0 "Strengthen the Black Sea and Baltic Fleets"
 krcw_sov_black_sea_and_baltic_desc:0 "The Black Sea Fleet must pass the Straits and the Baltic Fleet the Danish Sounds to reach open water. Both are given coastal defence as their task."
 krcw_sov_air_defence_forces:0 "Air Defence Forces"
 krcw_sov_air_defence_forces_desc:0 "Radar, interceptors and flak weave a net over Moscow, Leningrad and the Ural works. The Internationale's bombers must fly three thousand kilometres to touch it."
 krcw_sov_the_northern_fleet:0 "The Northern Fleet"
 krcw_sov_the_northern_fleet_desc:0 "Murmansk is Russia's one port that neither freezes nor lies behind another's strait. From here the submarines will sail into the North Atlantic, the Internationale's lifeline."
 krcw_sov_project_number_one:0 "Project Number One"
 krcw_sov_project_number_one_desc:0 "The closed city north of Chelyabinsk has no name on any map. It has a reactor, a thousand scientists and a task that became very simple after 1950: catch up with Paris."
 krcw_sov_the_deterrent:0 "The Deterrent"
 krcw_sov_the_deterrent_desc:0 "After the mushroom cloud over the Kazakh steppe, Moscow and Paris at last stand on the same height, one from which neither dares look down."
 krcw_sov_leader_of_the_accord:0 "Centralise the Accord's Staff Work"
 krcw_sov_leader_of_the_accord_desc:0 "The Accord members' staff work is centralised in Moscow. The Accord has no common ideology and is held together by a common enemy."
 krcw_sov_the_southern_tier:0 "The Southern Tier"
 krcw_sov_the_southern_tier_desc:0 "The governments in Tehran and Kabul are Russian protectorates. Protection means roads, telegraph lines and military advisers, and the occasional reminder of who protects whom."
 krcw_sov_the_balkan_bayonets:0 "Arm the Balkan Members"
 krcw_sov_the_balkan_bayonets_desc:0 "Turkey holds the Straits, Greece and Yugoslavia the gates to the Adriatic and the Aegean. The Accord sells them obsolescent tanks complete with drawings, on condition nothing is resold and nothing improved."
 krcw_sov_the_potsdam_protocol:0 "The Potsdam Protocol"
 krcw_sov_the_potsdam_protocol_desc:0 "The Treaty of Berlin made Schleicher's National Republic Moscow's vassal. The new protocol lends it a little dignity: reparations halved, the garrison paid for by Moscow, foreign policy still decided in Moscow."
 krcw_sov_the_mexican_channel:0 "The Mexican Channel"
 krcw_sov_the_mexican_channel_desc:0 "Long's America is cut in two along the Mississippi, the syndicates' factories to the east, his oil wells and cotton to the west. Russian aid enters New Orleans through the Gulf and Veracruz."
 krcw_sov_the_baltic_statute:0 "The Baltic Statute"
 krcw_sov_the_baltic_statute_desc:0 "Riga, Tallinn and Kaunas get their own assemblies, schools and police, at the price of recognising Russian sovereignty in defence and foreign affairs. The Forest Brothers' rifles will fall silent year by year."
 krcw_sov_russify_the_provinces:0 "Russify the Provinces"
 krcw_sov_russify_the_provinces_desc:0 "The official language, settlers moved in, streets renamed. The Interior Ministry reports that resistance is weakening; the author of the report has never been there."
 krcw_sov_the_finnish_question:0 "Restore Finland's Constitution"
 krcw_sov_the_finnish_question_desc:0 "Annexing Finland in 1944 was Savinkov's least profitable victory: the Russian flag over Helsinki and a partisan war in the forests that never ends. The old Empire gave Finland a constitution, and Finland did not rebel for a century."
 krcw_sov_the_delhi_axis:0 "The Delhi Axis"
 krcw_sov_the_delhi_axis_desc:0 "The Indian Empire is the Accord's only great power in Asia. Delhi needs Moscow's steel and aircraft; Moscow needs Delhi to keep Nanjing occupied. A marriage in which neither party entirely trusts the other."
 krcw_sov_the_amur_frontier:0 "The Amur Frontier"
 krcw_sov_the_amur_frontier_desc:0 "Along four thousand kilometres of Sino-Russian border the sentries of two great powers watch each other across a river. Fortify it: permanent works and an independent supply line for the Far East command."
 krcw_sov_talks_with_nanjing:0 "Freeze the Amur Line"
 krcw_sov_talks_with_nanjing_desc:0 "Sign a frontier agreement with Nanjing that covers channels, fisheries and the spacing of posts and nothing else. The divisions freed in the Far East go west. Nanjing will read it as a Russian concession."
 krcw_sov_the_accord_council:0 "The Accord Council"
 krcw_sov_the_accord_council_desc:0 "A standing council, a joint staff and a charter every member has signed. Moscow is still the largest voice, but no longer the only one."
 krcw_sov_a_bloc_of_equals:0 "Standardise the Accord's Calibres"
 krcw_sov_a_bloc_of_equals_desc:0 "The Accord armies' rifles, guns and ammunition move to Russian calibres, supplied centrally from the Ural works. The members' arsenals must retool, and Moscow pays part of the bill."
 krcw_sov_courting_the_antipodes:0 "Courting the Antipodes"
 krcw_sov_courting_the_antipodes_desc:0 "The exiled Entente Crown sits in Canberra and hates the Internationale that took its home. It does not love Savinkov, but Russian tanks cost half what Paris charges and come with no conditions about trade unions."
 krcw_sov_the_academy_of_sciences:0 "The Academy of Sciences"
 krcw_sov_the_academy_of_sciences_desc:0 "Savinkov distrusts intellectuals, but he distrusts backwardness more. The Academy gets new buildings, a new budget and a deputy president seconded from State Security."
 krcw_sov_the_closed_cities:0 "The Closed Cities"
 krcw_sov_the_closed_cities_desc:0 "Cities without names, only postal numbers: Arzamas-16, Chelyabinsk-40, Krasnoyarsk-26. Their residents earn twice the wage outside and may tell no one where they live."
 krcw_sov_the_rocket_bureau:0 "The Rocket Bureau"
 krcw_sov_the_rocket_bureau_desc:0 "Drawings stripped from the Reich's factories in 1944, and a chief designer released from a camp. His name is a state secret and each of his rockets is larger than the last."
 krcw_sov_computing_centres:0 "Computing Centres"
 krcw_sov_computing_centres_desc:0 "The first electronic computers at Kiev and Moscow fill whole buildings and burn through twenty valves a day. They compute trajectories, reaction cross-sections, and occasionally grain quotas."
 krcw_sov_baikonur:0 "The Tyuratam Range"
 krcw_sov_baikonur_desc:0 "Deep in the Kazakh steppe, beside the little railway halt of Tyuratam on the Syr Darya, a launch range is going up. The army wants an intercontinental missile and the Academy wants a satellite; on the budget they are the same line."
 krcw_sov_the_intercontinental_missile:0 "The Intercontinental Missile"
 krcw_sov_the_intercontinental_missile_desc:0 "A rocket that can fly from Tyuratam to Paris can also put a satellite in orbit. The chief designer is thinking of the second; the men paying him, of the first."
 krcw_sov_the_geophysical_year:0 "Develop a Reconnaissance Satellite"
 krcw_sov_the_geophysical_year_desc:0 "Tyuratam's first military task is to photograph the Internationale's airfields and harbours from orbit. The chief designer wanted a science satellite; the General Staff is paying, so the camera comes first."
 krcw_sov_science_for_peace:0 "Build the Obninsk Power Station"
 krcw_sov_science_for_peace_desc:0 "Build the first grid-connected reactor at Obninsk. The Academy wants it to train reactor engineers and Project Number One wants it to test fuel elements. The money comes out of the Ural power-station plan."
 krcw_sov_governors_general:0 "The Governors-General"
 krcw_sov_governors_general_desc:0 "A governor-general for every non-Russian province, answerable to the Ruler alone and bound by no zemstvo. Their reports always say all is quiet, because the governors who wrote otherwise were replaced."
 krcw_sov_statute_of_peoples:0 "The Statute of Peoples"
 krcw_sov_statute_of_peoples_desc:0 "A law that rewrites the empire as a federation: schools in the mother tongue, native administration, seats in the Council apportioned by population. Moscow keeps defence, foreign affairs and the railways; the rest they may manage themselves."
 krcw_sov_cossack_hosts:0 "The Cossack Hosts Restored"
 krcw_sov_cossack_hosts_desc:0 "The Don, Kuban and Terek hosts recover their old organisation, old uniforms and old privileges: land free of tax in exchange for every grown man's horse and sabre. It is the old Empire's method, and it does work."
 krcw_sov_the_hundred_peoples:0 "Recognise the Nationalities"
 krcw_sov_the_hundred_peoples_desc:0 "From the Gulf of Finland to the Pamirs, from the Lutherans of the Baltic to the Muslims of Bukhara. The old Empire called them aliens, Savinkov's constitution calls them citizens of the Russian State, and the Interior Ministry's files call them the problem."
 krcw_sov_the_governors_general:0 "The Governors-General"
 krcw_sov_the_governors_general_desc:0 "The Interior Ministry's plan is the simplest: give each frontier province to a general with a gendarme brigade and a budget nobody publishes. Moscow stops hearing bad news, which is considered a success."
 krcw_sov_the_statute_of_peoples:0 "The Statute of Peoples"
 krcw_sov_the_statute_of_peoples_desc:0 "Sorokin's men draft a statute: schools in the mother tongue, seats by population, local taxes kept locally. Its opponents call it the first step in the empire's dissolution; its drafters call it the only way the empire survives."
 krcw_sov_the_autonomy_bargains:0 "Negotiate Autonomy Province by Province"
 krcw_sov_the_autonomy_bargains_desc:0 "No general statute, but province by province: Riga wants schools, Tbilisi its church, Tashkent its mosques, Helsinki a constitution. Every agreement differs and every one says \"this province only\"."
 krcw_sov_the_ukrainian_question:0 "Set the Ukraine Policy"
 krcw_sov_the_ukrainian_question_desc:0 "Ukraine holds forty million people, half of Russia's coal and its best black earth. Kiev's intelligentsia want a university in their own tongue, Kharkov's workers want wages, and the peasants want only to be left their fields. Of the three, the last is the easiest to grant."
 krcw_sov_the_caucasus_viceroyalty:0 "The Caucasus Viceroyalty"
 krcw_sov_the_caucasus_viceroyalty_desc:0 "Three nations, six languages, two religions and one railway to the Baku oilfields. Tbilisi's church, Yerevan's merchants and Baku's oil workers have never liked one another, and a clever viceroy makes that serve him."
 krcw_sov_turkestan_and_the_steppe:0 "Turkestan and the Steppe"
 krcw_sov_turkestan_and_the_steppe_desc:0 "The emirs of Bukhara and Khiva are long gone, leaving cotton, mosques and a steppe where one may grow grain or test bombs. Moscow wants the cotton, the steppe wants water, and nobody has asked the people of the steppe what they want."
 krcw_sov_the_cossack_hosts:0 "The Cossack Hosts"
 krcw_sov_the_cossack_hosts_desc:0 "Restore the Cossack hosts' military establishment and lands, but not their own courts. The Don and the Kuban stay loyal and stay resentful."
 krcw_sov_the_siberian_settlers:0 "Settle Siberia"
 krcw_sov_the_siberian_settlers_desc:0 "Stolypin's old method: send the surplus peasants of the central provinces to Siberia with land, seed and three years free of tax. This time they also get a tractor, because without one nobody goes."
 krcw_sov_one_state_many_nations:0 "Pass the Nationalities Resolution"
 krcw_sov_one_state_many_nations_desc:0 "The Council passes a final document: the nationalities question is \"resolved within the framework of the Russian State\". What that sentence means depends on which road was taken — but for the first time in twenty years, no province is at war."
 krcw_sov_arbitration_courts:0 "The Arbitration Courts"
 krcw_sov_arbitration_courts_desc:0 "A trust may sue a ministry, and occasionally wins. Nothing like it has happened in Russian history, and it raises output more than any plan."
 krcw_sov_grain_reserve:0 "The State Grain Reserve"
 krcw_sov_grain_reserve_desc:0 "The old Empire died in the bread queues of 1917. Savinkov's state built granaries in every provincial capital with one rule: the last three months' reserve is never touched. The rule has saved this regime twice."
 krcw_sov_consumer_shortage:0 "The Consumer Shortage"
 krcw_sov_consumer_shortage_desc:0 "Tanks are delivered on plan; shoes are not. The queues in Moscow's department stores do not discuss ideology, only when a pair of shoes in the right size might arrive."
 krcw_sov_the_arbitration_courts:0 "The Arbitration Courts"
 krcw_sov_the_arbitration_courts_desc:0 "Contract disputes between the trusts go to arbitration courts instead of being settled by a phone call from the ministry."
 krcw_sov_the_grain_reserve:0 "The State Grain Reserve"
 krcw_sov_the_grain_reserve_desc:0 "A granary in every provincial capital, and the last three months' reserve never touched. The Treasury calls it waste, the Interior Ministry calls it insurance, and the bread queues of 1917 prove the Interior Ministry right."
 krcw_sov_the_donbass_combine:0 "The Donbass Combine"
 krcw_sov_the_donbass_combine_desc:0 "Donbass coal, Krivoy Rog ore, the Mariupol steelworks: two hundred kilometres between them. It is Russia's most compact industrial region and its most fragile, for it lies too near the Elbe."
 krcw_sov_the_volga_automobile:0 "The Volga Automobile Works"
 krcw_sov_the_volga_automobile_desc:0 "A works for three hundred thousand lorries a year. The army wants military trucks, the agriculture ministry wants tractors, and for the first time someone in the Council suggests building a few cars a private person might buy."
 krcw_sov_the_norilsk_nickel:0 "Develop the Norilsk Nickel"
 krcw_sov_the_norilsk_nickel_desc:0 "Three hundred kilometres above the Arctic Circle, a city with winter and colder winter. Its nickel and palladium are indispensable to armour steel and jet engines; the cost of digging them out is recorded vaguely."
 krcw_sov_the_shoe_problem:0 "Improve the Supply of Daily Goods"
 krcw_sov_the_shoe_problem_desc:0 "Russia's factories can build tank armies but not shoes that fit. The queue forms weekly outside the Ryazan department store, and no one in it says anything: a silence the ministry fears more than protest."
 krcw_sov_electrify_the_villages:0 "Electrify the Villages"
 krcw_sov_electrify_the_villages_desc:0 "In 1950 three quarters of Russia's villages have no electricity. Stringing wire to every one of them takes a decade, and changes more than any land reform."
 krcw_sov_the_northern_sea_route:0 "The Northern Sea Route"
 krcw_sov_the_northern_sea_route_desc:0 "Icebreakers, weather stations and radio beacons. If the route opens in summer, Russia need no longer defer to the Danish sounds or the Turkish Straits."
 krcw_sov_the_cotton_republics:0 "The Cotton Republics"
 krcw_sov_the_cotton_republics_desc:0 "Turkestan's cotton supplies every textile mill in the empire. The canals lengthen by tens of kilometres a year and the Aral Sea falls by centimetres a year, a sum nobody works out until much later."
 krcw_sov_the_ten_year_housing:0 "The Ten-Year Housing Plan"
 krcw_sov_the_ten_year_housing_desc:0 "Prefabricated concrete panels, five storeys without a lift, one kitchen and one bathroom per family. They are ugly, cheap and all alike, and those who move in remember the day for the rest of their lives."
 krcw_sov_the_second_industrial_base:0 "The Second Industrial Base"
 krcw_sov_the_second_industrial_base_desc:0 "The General Staff assumes that in the war's first month the factories of Ukraine and the Baltic will be destroyed. So a second industry must stand east of the Urals, beyond the reach of any bomber."
 krcw_sov_the_computing_economy:0 "Plan by Computer"
 krcw_sov_the_computing_economy_desc:0 "Sorokin's students propose a thought: compute the balance of the national economy electronically. If it works, planning will for the first time be faster than the market; if not, it is only another report nobody reads."
 krcw_sov_50_t:0 "The Debate on the Statute"
 krcw_sov_50_d:0 "The Council quarrels over the statute for three weeks. The Interior Minister hangs a map on the wall with every district that has seen armed resistance in thirty years marked in red. The red covers a third of the empire.\n\n\"Gentlemen,\" he says, \"this map was drawn by the governors-general.\"\n\nThe drafters' answer is simple: the old Empire gave Finland a constitution and Finland did not rebel for a century; it gave Poland nothing and Poland rebelled three times. The question is not whether Russia is strong, but how many provinces one empire can watch at once."
 krcw_sov_50.a:0 "Pass it whole: language, schools, seats"
 krcw_sov_50.b:0 "Language and schools only; seats can wait"
 krcw_sov_50.c:0 "Withdraw it and bargain province by province"
 krcw_sov_52_t:0 "The Shoes of Ryazan"
 krcw_sov_52_d:0 "The light-industry ministry admits that six tenths of the country's shoe machinery predates 1930, and that its output targets still rise four per cent a year. The targets are set in Moscow, the leather quotas in a different ministry, and the two figures have never matched.\n\nThe Ruler reads a letter to the Council. Its author is a lathe operator in Ryazan whose son walks to school barefoot, while the tank track plates he makes each day would pave half a street.\n\n\"We can put tanks on the Rhine in three weeks,\" the Ruler says. \"Why can we not put shoes in Ryazan in three months?\" Nobody answers — not for want of an answer, but because the answer implicates every ministry in the room."
 krcw_sov_52.a:0 "Give light industry to the trusts, on contract"
 krcw_sov_52.b:0 "Carve a share out of the armaments budget"
 krcw_sov_52.c:0 "This is a question of discipline, not resources"
 krcw_sov_51_t:0 "The Question of the Seats"
 krcw_sov_51_d:0 "A year after the language and school clauses took effect, the local assemblies of Riga, Tbilisi and Tashkent write jointly to the Council of State: the seats the statute promised to \"discuss later\" should be discussed now. The letter carries forty-one signatures, eleven of them Council members who voted for the statute last year.\n\nThe Interior Minister points out that seats by population would leave Russian members short of two thirds of the Council for the first time."
 krcw_sov_51.a:0 "Add the seats clause"
 krcw_sov_51.b:0 "Seats with a voice but no vote"
 krcw_sov_51.c:0 "Reject the letter and investigate the signatories"
 krcw_sov_tree_bid_ext_5_tt:0 "Influence of the extremists: §G+5§!"
 krcw_sov_53_t:0 "The Queue in Ryazan"
 krcw_sov_53_d0:0 "On a Saturday morning the queue outside the Ryazan department store does not disperse. The shoes have not come, the people who queued all night refuse to leave, and by noon there are two thousand of them. The police chief asks for troops; the governor refuses and telephones Moscow instead. The next day the same queues appear in Tula and Kaluga."
 krcw_sov_53_d1:0 "The light-industry ministry replaces four shoe-factory directors, and their successors report output on time. The Ryazan queue is still there, shorter than last year, and nobody in it talks. The Okhrana's monthly report marks the item \"calm\"."
 krcw_sov_53.a:0 "Send the ringleaders east of the Yenisei"
 krcw_sov_53.b:0 "Find the shoe money in the armaments budget"
 krcw_sov_53.c:0 "Discipline has worked"
 krcw_sov_54_t:0 "The Cybernetics of the Economy"
 krcw_sov_54_d:0 "The Kiev computing centre submits four hundred pages: given data and machine time enough, it can compute the optimal allocation of the nation's steel in a fortnight — where the planning commission needs four months and is often wrong.\n\nThe conclusion unsettles two groups. The planners, because the machine does not need them. And State Security, because to let the machine compute you must give it the country's real figures — and Russia has always kept two sets.\n\nOn the last page Sorokin's student writes one sentence: \"The enemy of a planned economy is not the market. It is the lie.\" It is quoted often afterwards, and everyone who quotes it means something different."
 krcw_sov_54.a:0 "Give the machine the real figures"
 krcw_sov_54.b:0 "Use it only for steel and railways"
 krcw_sov_54.c:0 "File the report and close the discussion"
 krcw_ddr_tree:0 "krcw_ddr_tree"
 krcw_ddr_inner_german_trade:0 "Organise the Nationalists in the West"
 krcw_ddr_loyal_ally:0 "A Loyal Ally"
 krcw_ddr_the_rump_reich:0 "The National Republic"
 krcw_ddr_the_rump_reich_desc:0 "The Empire is defeated; the Kaiser fled to Mittelafrika and, when it fell, into exile in Sweden. Schleicher founds the German National Republic in Brandenburg, Saxony, Thuringia and East Berlin, on a budget Moscow has to approve."
 krcw_ddr_the_court_at_potsdam:0 "The Querfront"
 krcw_ddr_the_court_at_potsdam_desc:0 "Schleicher's old idea: bring the officer corps, the nationalist wing of the unions and the Junkers into a single National Front. Niekisch's men want to \"face East\", the monarchists want to wait for the Kaiser; the general nods to both."
 krcw_ddr_live_with_the_wire:0 "Stabilise the Demarcation Line"
 krcw_ddr_live_with_the_wire_desc:0 "East Berlin's papers announce daily that the division is temporary. The city finally admits something else: temporary things also need street lamps, trams and a checkpoint that opens on time."
 krcw_ddr_a_constitutional_reich:0 "The People's Chamber"
 krcw_ddr_a_constitutional_reich_desc:0 "The provisional parliament reconvenes and takes over the budget from the generals. The restorationists lose their majority."
 krcw_ddr_the_reconstruction_plan:0 "The Reconstruction Plan"
 krcw_ddr_the_reconstruction_plan_desc:0 "Russian reparations took half the machine tools; the old hands copy the other half by hand. Scaffolding rises again over the ruins of Leipzig and Dresden."
 krcw_ddr_saxon_workshops:0 "Support the Saxon Workshops"
 krcw_ddr_saxon_workshops_desc:0 "Dresden optics, Chemnitz machine tools, Leipzig printing: Saxon craftsmanship survived two wars and can survive a peace."
 krcw_ddr_the_rostock_yards:0 "The Rostock Yards"
 krcw_ddr_the_rostock_yards_desc:0 "East Germany's only coast lies on the Baltic. The Rostock yards cannot build battleships, but they can build trawlers, freighters and patrol boats."
 krcw_ddr_leuna_chemicals:0 "Leuna Chemicals"
 krcw_ddr_leuna_chemicals_desc:0 "A country without oilfields makes oil from coal. The Leuna works near Halle is a chemical plant the size of a city, and East Germany's only hope of energy of its own."
 krcw_ddr_the_general_staff:0 "The Prussian General Staff"
 krcw_ddr_the_general_staff_desc:0 "Germany lost its lands, but Schleicher brought the General Staff with him. Manstein remains, and so does the craft of stretching limited forces to their utmost."
 krcw_ddr_the_elbe_line:0 "The Elbe Line"
 krcw_ddr_the_elbe_line_desc:0 "The Internationale's armour sits across the Elbe. If war comes East Germany must hold for seventy-two hours until the Russian tank armies arrive."
 krcw_ddr_the_imperial_army_reborn:0 "Expand the Reichswehr"
 krcw_ddr_the_imperial_army_reborn_desc:0 "Moscow allowed East Germany six divisions, then eight, then twelve. Each increase needed a new protocol, and each protocol proved Moscow needed them."
 krcw_ddr_revise_the_treaty:0 "Revise the Treaty of Berlin"
 krcw_ddr_revise_the_treaty_desc:0 "The treaty of 1944 was signed under the gaze of Russian tanks. Ten years later a delegation of the People's Chamber carries a draft revision to Moscow: reparations ended, garrison costs shared, an East German foreign ministry restored."
 krcw_ddr_the_loyal_bulwark:0 "Seek First Call on Accord Equipment"
 krcw_ddr_the_loyal_bulwark_desc:0 "East Germany's fate is bound to Russia's. Rather than complain of the rope, pull it tight: be the Accord's most reliable front and receive Moscow's best equipment in exchange."
 krcw_ddr_a_road_of_our_own:0 "Make Reunification State Policy"
 krcw_ddr_a_road_of_our_own_desc:0 "The general's office declares the land west of the Elbe occupied German soil and the reunification of Germany the Republic's first aim. Niekisch's national revolutionaries run the propaganda; Moscow worries that Berlin may drag the Accord into war early."
 krcw_ddr_the_front_of_the_accord:0 "Hold Joint Exercises on the Elbe"
 krcw_ddr_the_front_of_the_accord_desc:0 "The East German army holds its manoeuvres on the Elbe with Russian marshals in the stands. Every exercise is a letter to Paris."
 krcw_ddr_inner_german_trade_desc:0 "Through veterans' leagues, old Stahlhelm men and exiled Ruhr owners the Republic builds secret nationalist cells in West Germany, paid from the general's special account. If they are exposed, West Germany tries them as spies."
 krcw_ddr_two_states_one_nation:0 "Adopt the Programme of German Unification"
 krcw_ddr_two_states_one_nation_desc:0 "The People's Chamber adopts the unification programme: Germany will be reunited under the National Republic when the Accord prevails, and the Chamber keeps seats for the western Länder. Redeeming it needs an army that can cross the Elbe."
 krcw_ddr_land_of_the_junkers:0 "The Junkers' Land"
 krcw_ddr_land_of_the_junkers_desc:0 "The great estates east of the Elbe were the cradle of the Prussian officer corps. The general's office did not confiscate them — it merely made the landlords understand who now rules in Potsdam."
 krcw_ddr_peoples_police:0 "The People's Police"
 krcw_ddr_peoples_police_desc:0 "The regular army is bound by Moscow's divisional quota, but no one counts policemen. The green-uniformed People's Police drill with heavy weapons in their barracks, nominally to keep order."
 krcw_ddr_crown_in_waiting:0 "The Crown in Waiting"
 krcw_ddr_crown_in_waiting_desc:0 "Moscow has conceded something unexpected: that a constitutional, powerless Hohenzollern monarch obedient to the Accord might steady this state better than a general who will one day die. The Kaiser is still in Stockholm, but the throne has been dusted off."
 krcw_ddr_the_third_germany:0 "The Third Germany"
 krcw_ddr_the_third_germany_desc:0 "Neither Paris's socialist republic nor Moscow's satellite: the idea of a neutral, united Germany has for the first time moved from whispered talk to words on a foreign-ministry memorandum."
 krcw_ddr_the_lusatian_coal:0 "Mine the Lusatian Lignite"
 krcw_ddr_the_lusatian_coal_desc:0 "No Ruhr, no Silesian hard coal — East Germany has only the brown coal of Lusatia. The open pits creep to the edge of the villages, and the power-station smoke turns the Dresden sky brown."
 krcw_ddr_collectivise_the_estates:0 "Turn the Estates into State Farms"
 krcw_ddr_collectivise_the_estates_desc:0 "The land question splits the National Front: the nationalists would keep the Junker officers' estates, the unionists would divide them among the labourers. The general's office takes a third road — state farms, given neither back to the nobility nor over to the communes."
 krcw_ddr_the_uranium_of_the_ore_mountains:0 "Open the Erzgebirge Uranium Mines"
 krcw_ddr_the_uranium_of_the_ore_mountains_desc:0 "There is uranium in the old silver mines of the Ore Mountains. The Russian geological teams arrive with armed escorts and the whole range becomes a Moscow preserve — but East German physicists may at least take notes at the gate."
 krcw_ddr_the_barracked_police:0 "Form the Barracked People's Police"
 krcw_ddr_the_barracked_police_desc:0 "The Treaty of Berlin capped the army's divisions but said nothing of police. The general's office raises a \"Barracked People's Police\" — nominally for public order, in fact a second army the treaty does not count."
 krcw_ddr_air_defence_of_the_reich:0 "Air Defence of the Republic"
 krcw_ddr_air_defence_of_the_reich_desc:0 "The Internationale's bombers are an hour from Berlin out of the Rhineland. East Germany cannot afford fighter wings, but it can throw a Russian radar-and-flak net over the industrial belt."
 krcw_ddr_the_national_service_law:0 "The National Service Law"
 krcw_ddr_the_national_service_law_desc:0 "The People's Chamber passes a conscription law. Young men train first in the People's Police, then pass to the army — Moscow's divisional quota counts only active formations, never the reserves."
 krcw_ddr_the_constitutional_question:0 "Debate the Succession"
 krcw_ddr_the_constitutional_question_desc:0 "Schleicher is old. No one in the general's office dares discuss the succession openly, but everyone is preparing. Only one line of the constitution is clear: the Supreme Commander is chosen by the People's Chamber. The question is: chosen to be what?"
 krcw_ddr_marshal_of_the_accord:0 "Integrate with the Russian Army"
 krcw_ddr_marshal_of_the_accord_desc:0 "East Germany gives itself wholly to Moscow: its officers study at the Frunze Academy, its staff shares one war plan with Russia, and in return the Accord's newest tanks equip East German divisions first."
 krcw_ddr_the_westward_watch:0 "Watch the West"
 krcw_ddr_the_westward_watch_desc:0 "If a third world war comes, East Germany is its first battlefield. The general's office accepts the fate and turns the whole country into the depth of the Elbe line."
 krcw_ddr_the_kings_bargain:0 "Lobby Moscow for a Constitutional Monarch"
 krcw_ddr_the_kings_bargain_desc:0 "The conservatives' plan is to persuade Moscow that a constitutional, obedient Hohenzollern would steady East Germany better than a mortal general. The Kaiser stays in Stockholm as a symbol, real power stays with the chamber. Berlin sends an envoy to ask; the answer depends on how Moscow regards Berlin."
 krcw_ddr_a_throne_under_the_wire:0 "Invite a Hohenzollern Cadet"
 krcw_ddr_a_throne_under_the_wire_desc:0 "With Moscow's approval, bring a young cadet of the Hohenzollerns to be crowned at Potsdam to satisfy the monarchists. Real power stays with the generals."
 krcw_ddr_the_geneva_memorandum:0 "Let the People's Chamber Form the Cabinet"
 krcw_ddr_the_geneva_memorandum_desc:0 "The cabinet is now formed from the People's Chamber majority, and budgets and ministerial appointments need its vote. The Republic stays in the Accord; the general's office loses the power to decide alone, and the officer corps resents it."
 krcw_ddr_the_all_german_congress:0 "Hold Elections to the People's Chamber"
 krcw_ddr_the_all_german_congress_desc:0 "The Republic holds its first general election to the Chamber, with the National Front's factions standing on separate lists. The vote gives the regime some legitimacy against the strikers, and the Chamber starts to vote down army estimates."
 krcw_ddr_30_t:0 "A Commander of What Kind?"
 krcw_ddr_30_d:0 "Schleicher's health fails, and the People's Chamber must decide what holds this state together when the general is gone. Three factions argue their case, and Moscow's ambassador sits in the gallery."
 krcw_ddr_30.a:0 "A new general — loyal to the Accord"
 krcw_ddr_30.b:0 "Recall a king — if Moscow permits"
 krcw_ddr_30.c:0 "A civilian republic, governed by the Chamber"
 krcw_ddr_32_t:0 "Moscow's Answer"
 krcw_ddr_32_d:0 "Moscow does not oppose a constitutional restoration. The foreign ministry's reply says a throne dependent on the Accord's protection is more reliable than a republic that might drift to Paris. There is one condition: this king shall never command the army."
 krcw_ddr_32.a:0 "Accept Moscow's terms"
 krcw_ddr_32.b:0 "A throne with real power, or none"
 krcw_ddr_33_t:0 "Moscow Says \"Not Now\""
 krcw_ddr_33_d:0 "The envoy waits in Moscow three weeks and receives a verbal answer from a deputy foreign minister: the Supreme Ruler considers a restoration \"premature\", and the German constitutional question should be \"discussed separately within the framework of the Accord\". Nothing is put in writing.\n\nThe conservatives in Berlin understand what this means: while Savinkov lives, nobody sits on the throne."
 krcw_ddr_33.a:0 "Wait until after Savinkov"
 krcw_ddr_33.b:0 "Wait no longer: invite the prince home on a visit"
 krcw_ddr_33.c:0 "Drop the restoration"
 krcw_ddr_moscow_crown_tt:0 "Whether Moscow consents depends on its view of Berlin and on whether Savinkov still lives."
 krcw_ddr_34_t:0 "A Reply from Across the Elbe"
 krcw_ddr_34_d:0 "The memorandum reaches West Germany. Thälmann's government quarrels too: to accept a neutral united Germany means giving up the hope of the revolution spreading east — but to refuse is to admit the wire on the Elbe is forever. West Berlin radio broadcasts a careful sentence: \"We are willing to talk.\""
 krcw_ddr_34.a:0 "Pursue the all-German dialogue"
 krcw_ddr_34.b:0 "The time is not right — withdraw the memorandum"
 krcw_ddr_36_t:0 "A Refusal from Across the Elbe"
 krcw_ddr_36_d:0 "The West German government does not reply to the memorandum. A week later the ruling party's paper prints the full text on its front page under the headline \"The Generals' Neutrality\". The editorial says that negotiating unity with a state run by its General Staff would concede that it may speak for the workers of the east."
 krcw_ddr_36.a:0 "Try again, with a civilian as the messenger"
 krcw_ddr_36.b:0 "Name the memorandum's real authors"
 krcw_ddr_wgr_decides_tt:0 "Whether West Germany will talk depends on the successor it chose and the German road it took."
 krcw_ddr_protocol_category:0 "The Moscow Protocols"
 krcw_ddr_protocol_category_desc:0 "Renegotiating the Treaty of Berlin's garrison, reparations and armament clauses with Moscow, article by article."
 krcw_ddr_raise_the_division_cap:0 "Raise the Divisional Cap"
 krcw_ddr_raise_the_division_cap_desc:0 "Each increase needs a new protocol, and each proves Moscow needs East Germany's divisions."
 krcw_ddr_end_the_reparations:0 "End the Reparations"
 krcw_ddr_end_the_reparations_desc:0 "The dismantled machine tools must be repaid. East German negotiators go to Moscow with production data, arguing a bankrupt front cannot hold the Elbe."
 krcw_ddr_court_the_communes:0 "Fund the Nationalist Cells in the West"
 krcw_ddr_court_the_communes_desc:0 "Pay the veterans' leagues and nationalist cells in West Germany from the general's special account. Any payment may be traced by the West German intelligence directorate."
 krcw_eu_secretariat_slight:0 "Slighted in the Secretariat"
 krcw_fra_1_t:0 "The Congress of the Federations"
 krcw_fra_1_d:0 "Fourteen hundred delegates crowd the hall of the Bourse du Travail: miners, railwaymen, teachers, postmen, dockers from Algiers and physicists from Saclay. The opening session sings the Internationale, then comes three days of procedural debate.\n\nThe real division is in the corridors. The older officials, who held the barricades in 1921 and crossed the Rhine in 1943, hold that the Commune needs discipline: the enemy is across the Elbe and this is no time for quarrels. Younger delegates answer that if even the Congress cannot quarrel, what distinguishes the Commune from Savinkov's state?"
 krcw_fra_1.a:0 "Unity and discipline"
 krcw_fra_1.b:0 "Let the debate be open"
 krcw_fra_2_t:0 "Delegates for Life"
 krcw_fra_2_d:0 "The Secretariat's statistical office produces a report nobody asked for: sixty-one per cent of national federation secretaries have held office for over ten years, and twenty-three per cent have not left their offices since 1921. Some of their children now work in the same building.\n\nSomeone copies the report onto the notice board at Renault, and beside it someone else has chalked: \"We overthrew one class and built another.\""
 krcw_fra_2.a:0 "This must change"
 krcw_fra_2.b:0 "Experience is not a crime"
 krcw_fra_3_t:0 "The Saclay Machine"
 krcw_fra_3_d:0 "For the first time the computing bureau's machine produces a complete national balance sheet. It recommends closing three old pits at Saint-Étienne and moving the men to the electrical works at Grenoble. On the numbers it is unanswerable.\n\nThe Saint-Étienne miners' assembly spends one evening on the recommendation and votes it down. Their reason is simple: the machine does not know that Saint-Étienne has two thousand households, and Grenoble has built no houses for them.\n\nNow the Secretariat must decide whether the balance sheet is advice or an order."
 krcw_fra_3.a:0 "The machine advises; the assembly decides"
 krcw_fra_3.b:0 "Numbers are numbers"
 krcw_fra_18_t:0 "The Saint-Étienne Pits"
 krcw_fra_18_d0:0 "The bureau's balance sheet has become an order. Closure notices for the three old pits are posted, but the Grenoble works has only four hundred flats ready, and two thousand households are to move.\n\nThe miners' assembly does not strike. It meets, every night. The Loire federation secretary writes to Paris: without an answer soon, he cannot hold them."
 krcw_fra_18_d1:0 "The three old pits stay open, as the miners' assembly voted. The seams grow thinner and each ton costs well above the new Alsace pits; the difference must come out of the national federation's books.\n\nThe young men of the computing bureau print that difference on every balance sheet, circled in red."
 krcw_fra_18.a:0 "Build the houses in Grenoble first, then move the men"
 krcw_fra_18.b:0 "Carry out the balance sheet with a deadline"
 krcw_fra_18.c:0 "Subsidise the pits from the federation fund"
 krcw_fra_18.d:0 "Let the miners' assembly draw up its own retraining plan"
 krcw_fra_saclay_plan:0 "The Saclay Balance Sheet"
 krcw_fra_18_quiet_tt:0 "The miners move on schedule and Grenoble gets its hands."
 krcw_fra_18_strike_tt:0 "The Loire miners down tools."
 krcw_fra_loire_strike:0 "The Loire Miners Stop Work"
 krcw_fra_loire_strike_desc:0 "The Saint-Étienne miners refuse to move on schedule and reoccupy the closed pits. The other coalfields do not join them, and do not condemn them either."
 krcw_fra_4_t:0 "Joliot-Curie's Letter"
 krcw_fra_4_d:0 "Three days after Reggane, Frédéric Joliot-Curie, head of the Atomic Commissariat, writes an open letter to the Congress.\n\n\"We built it because we could not let Savinkov build it first. But we built it on one condition: that it will never fall on any city. I ask the Congress to write that condition into law — not for the Russians' sake but for ours, so that our children will know that when their parents held this power, they did not forget who they were.\""
 krcw_fra_4.a:0 "Publish the letter"
 krcw_fra_4.b:0 "File it for now"
 krcw_fra_5_t:0 "The Young People of the Sorbonne"
 krcw_fra_5_d:0 "The Sorbonne student assembly adopts a twelve-point manifesto. Point one is \"all power to the shop assemblies\"; point twelve is \"the federation secretaries' offices should become crèches.\" The ten points between grow gentler in tone but not in meaning.\n\nA few days later the young workers at Renault-Billancourt vote to support the students. The Secretariat's old hands read the manifesto and remember some things they wrote when they were young."
 krcw_fra_5.a:0 "Hear them out"
 krcw_fra_5.b:0 "Close the faculty"
 krcw_fra_14_t:0 "The Sorbonne-Billancourt Committee"
 krcw_fra_14_d:0 "The Secretariat's representatives sit two evenings in the Sorbonne's great lecture hall and write down every demand of the students and the young Renault workers. Three of the twelve points can be done at once: term limits for federation secretaries, the shop assembly's right of recall, and exchange places between factories and universities.\n\nThe students and workers form a joint committee and ask for seats of their own on the Paris regional federation."
 krcw_fra_14.a:0 "Give the committee its seats"
 krcw_fra_14.b:0 "Adopt the three points; the committee stays advisory"
 krcw_fra_15_t:0 "Billancourt Stops"
 krcw_fra_15_d:0 "Three weeks after the faculty closes, the young workers at Renault-Billancourt switch off the assembly line at lunch and do not switch it back on. Their leaflet says one thing: \"Our machines start when the Sorbonne's doors open.\"\n\nSeveral plants further down the Seine stop the same afternoon."
 krcw_fra_15.a:0 "Reopen the faculty and negotiate"
 krcw_fra_15.b:0 "Treat the stoppage as absenteeism"
 krcw_fra_16_t:0 "The Faculty Reopens"
 krcw_fra_16_d:0 "The faculty stays shut five weeks and quietly reopens before the examinations. Four of the manifesto's authors are transferred to provincial universities; the rest go back to class. The young Renault workers hold one meeting and take no vote.\n\nThe Paris regional federation records the matter as closed in its monthly report. The twelve-point manifesto is neither debated nor withdrawn."
 krcw_fra_16.a:0 "Back to normal"
 krcw_fra_6_t:0 "The Algiers Congress"
 krcw_fra_6_d:0 "The Algerian Labour Federation convenes a special congress in Algiers. Arab, Kabyle and European workers fill the hall; they disagree on most things except one: Algeria's affairs should be decided by Algerians.\n\nThe resolution is courteous but leaves Paris little room: either genuine autonomy within the Commune, with its own congress, budget and language schools, or an independent sister republic within the Third Internationale.\n\nSomeone in the Secretariat points out that Reggane and Hammaguir both lie in Algeria. Someone else replies that the proclamation of 1921 did not say \"unless there is a test range there.\""
 krcw_fra_6.a:0 "An autonomous commune within the Commune"
 krcw_fra_6.b:0 "An independent sister republic"
 krcw_fra_6.c:0 "Not yet"
 krcw_fra_7_t:0 "Unrest in Kabylie"
 krcw_fra_7_d:0 "The Tizi Ouzou strike lasts three weeks and then turns into something else. The post office is occupied, the roads blocked; one territorial company refuses to fire on the crowd, another does not refuse.\n\nFor the first time since the Commune was founded, the Paris papers use the word \"insurrection.\""
 krcw_fra_7.a:0 "Reopen the talks"
 krcw_fra_7.b:0 "Send in the Federal Defence Force"
 krcw_fra_10_t:0 "An Invitation from the Internationale"
 krcw_fra_10_d:0 "The Paris Secretariat sends a formal invitation to join the Third Internationale. The terms are short: membership of the Clearing Union, shared technology, mutual aid if attacked; everything else, including which road to take, is for our own people to decide."
 krcw_fra_10.a:0 "We join"
 krcw_fra_10.b:0 "Friendship, but not membership"
 krcw_fra_12_t:0 "Eighty Years of the Commune"
 krcw_fra_12_d:0 "On 18 March 1871 the workers of Paris refused to give up the guns on Montmartre. That Commune lived seventy-two days.\n\nEighty years later to the day, Paris is hung with red. Flowers are banked before the Communards' Wall at Père Lachaise, and the Congress must decide how to mark the day: a march from the Bastille to the Wall, or the opening to the public of the Commune's entire archive, including everything since 1921?"
 krcw_fra_12.a:0 "From the Bastille to the Wall"
 krcw_fra_12.b:0 "Open the archives"
 krcw_fra_17_t:0 "The Lists in the Archive"
 krcw_fra_17_d:0 "Three months after the archive opens, a group of history students find several lists in the Secretariat's files for 1927. They name the anarchists and opposition delegates expelled from the federations that year; some names carry the note \"transferred to Lyon\", some carry nothing.\n\nThe lists appear in La Vie Ouvrière. Dozens of families write to the Secretariat asking where their fathers went."
 krcw_fra_17.a:0 "Publish everything and rehabilitate the expelled"
 krcw_fra_17.b:0 "Answer the families, then seal the files again"
 krcw_fra_13_t:0 "A Quarrel in the Secretariat"
 krcw_fra_13_d:0 "The first Secretariat meeting under the new charter breaks into a quarrel. Nanjing's delegate demands votes in proportion to population: China has more workers than all Europe together. London's insists on one member, one vote; otherwise the Internationale becomes a Chinese institution, as it was once a French one.\n\nThe Commune's delegate is in the chair, and his vote will decide what the Internationale is for the next ten years."
 krcw_fra_13.a:0 "One member, one vote, with a Nanjing veto on major questions"
 krcw_fra_13.b:0 "Votes by population"
 krcw_fra_13.c:0 "One member, one vote, no exceptions"
 krcw_eng_1_t:0 "A Union or a State"
 krcw_eng_1_d:0 "In the Blackpool ballroom the debate runs late into the night. One side wants the Congress to become a true parliament, with standing committees, rules of debate, a Speaker and a record: \"Westminster with a payroll,\" as Wintringham calls it. The other side says that is exactly the danger: once the Congress looks like a parliament, the unions will look like parties and the stewards like voters.\n\nTom Mann, past ninety, is helped to the rostrum. He says one sentence, \"Don't forget why we formed the unions,\" and steps down. Both sides are sure he meant them."
 krcw_eng_1.a:0 "The federal road"
 krcw_eng_1.b:0 "The stewards' road"
 krcw_eng_2_t:0 "The Ulster Question"
 krcw_eng_2_d:0 "The 1947 Dublin Accord gave Ulster to the Irish Workers' Republic. Two years on, the Protestant men in the Belfast yards still carry British shipwrights' federation cards, and their pensions are still on London's books. The Dublin transport union wants them to change cards and join; they refuse.\n\nThe Belfast branch of the shipwrights' federation writes to the Union Congress asking London to intervene. The Congress must decide whether to act, and how."
 krcw_eng_2.a:0 "Propose to Dublin: dual membership, pensions shared"
 krcw_eng_2.b:0 "Find work on the Clyde and the Mersey for those who want to leave"
 krcw_eng_2.c:0 "That is Dublin's business now"
 krcw_eng_3_t:0 "London's Proposal on Belfast"
 krcw_eng_3_d:0 "The Union of Britain's Congress proposes that the men in the Belfast yards may keep both their British shipwrights' cards and membership of the Irish transport union, with their pensions shared between the two countries by years of service.\n\nThe transport union objects. Its secretary says two unions in one yard means two bosses."
 krcw_eng_3.a:0 "Accept: both cards count"
 krcw_eng_3.b:0 "Refuse: one yard, one union"
 krcw_eng_8_t:0 "Dublin Answers"
 krcw_eng_8_d0:0 "Dublin accepts dual membership. The Belfast yardmen keep their old cards, and the two federations are left to work out the pension shares. The transport union prints an article against it in its own paper, then complies."
 krcw_eng_8_d1:0 "Dublin refuses. Its reply says the Belfast men are Irish workers now and their membership is for the Irish unions to decide. The transport union's register is attached; the Belfast men who have already changed cards run to several pages."
 krcw_eng_8.a:0 "Tell the Belfast branch"
 krcw_eng_8.b:0 "Accept the refusal and let it rest"
 krcw_eng_8.c:0 "Take it to the Internationale's Secretariat"
 krcw_eng_4_t:0 "A Letter from London"
 krcw_eng_4_d:0 "The usurpers' Congress has written to Canberra. The letter mentions neither the King nor 1925; it asks only that Australia \"not lend its harbours to the Russian fleet.\"\n\nThe cabinet sits silent for a long while after reading it. At last the Prime Minister says, \"At least they have learned to write letters.\""
 krcw_eng_4.a:0 "Reply politely"
 krcw_eng_4.b:0 "We do not correspond with usurpers"
 krcw_eng_5_t:0 "The Clyde Stewards Walk Out"
 krcw_eng_5_d:0 "The Glasgow shipwrights have struck: in a workers' state, against a union management board. Their grievance is that the London shipbuilding federation gave every new escort order to the Tyne, and the Clyde's berths have stood empty for three months.\n\nThe London papers call it \"parochialism.\" The Glasgow papers call it \"the spirit of 1925.\""
 krcw_eng_5.a:0 "Sit down and talk"
 krcw_eng_5.b:0 "Order them back to work"
 krcw_eng_5.c:0 "Hand it to the stewards' committee"
 krcw_eng_10_t:0 "The Clyde Goes Back"
 krcw_eng_10_d:0 "On the Monday after the order the rivet guns sound again on the Clyde. The stewards are back, but their return-to-work resolution carries one condition: before the next escort orders are announced, the shipbuilding federation must come to Glasgow to hold its meeting."
 krcw_eng_10.a:0 "Agree to meet in Glasgow"
 krcw_eng_10.b:0 "The orders go as planned"
 krcw_eng_11_t:0 "The Tyne Comes Out"
 krcw_eng_11_d:0 "Nobody obeys the order. Three days later the Tyne yards stop too: the river that got the orders is striking for the one that did not. The Newcastle stewards wire that they want no work taken from Glasgow.\n\nBoth rivers' slipways stand empty and the navy's escort programme begins to slip."
 krcw_eng_11.a:0 "Move half the orders to the Clyde"
 krcw_eng_11.b:0 "Put the yards under the naval federation"
 krcw_eng_yards_dispute:0 "The Yards Dispute"
 krcw_eng_yards_dispute_desc:0 "The Clyde and Tyne yards are under the naval federation. The slipways are working; the stewards do not come to meetings."
 krcw_eng_6_t:0 "London Asks for the Gibraltar Harbour"
 krcw_eng_6_d:0 "The Union of Britain's Congress writes asking that its Mediterranean squadron may use the harbour at Gibraltar: the docks run by Iberian yardmen, London paying the costs, no troops ashore.\n\nThe CNT's regional committees are divided. The Andalusian dockers want the wages; the Catalan delegates say a foreign fleet in your own harbour is a foreign fleet, whatever flag it flies."
 krcw_eng_6.a:0 "Agree, with our own yardmen running the port"
 krcw_eng_6.b:0 "Refuse: no foreign warships in the harbour"
 krcw_eng_9_t:0 "The Answer from Madrid"
 krcw_eng_9_d0:0 "The Iberian Federation agrees. The docks will be run by yardmen from Algeciras; the Union's warships may take on stores and repair there, and sailors go ashore unarmed."
 krcw_eng_9_d1:0 "The Iberian Federation refuses. The reply is courteous: Iberia welcomes British merchantmen, but its harbours take no foreign warships. The Mediterranean squadron returns to home ports."
 krcw_eng_9.a:0 "The squadron sails south"
 krcw_eng_9.b:0 "The squadron stays in home waters"
 krcw_eng_7_t:0 "The Reply from Canberra"
 krcw_eng_7_d0:0 "Canberra's reply is short, signed by an under-secretary and addressed to \"the Congress in London\": neither \"the British Government\" nor \"the usurpers.\" It says Australia has no intention of letting any foreign fleet use its harbours."
 krcw_eng_7_d1:0 "The letter comes back unopened, stamped on the envelope: \"Addressee does not exist.\""
 krcw_eng_7.a:0 "It is a beginning"
 krcw_eng_7.b:0 "At least they read it"
 krcw_sov_1_t:0 "The Supreme Ruler's Health"
 krcw_sov_1_d:0 "At seventy-four Savinkov appears in public rarely. Moscow says he is writing his memoirs; that he sits a whole day at a time in his Kremlin study; that his hand shakes too badly to hold a pen.\n\nThe head of State Security lays a doctor's report on the desk of the President of the Council. It runs to three lines, the last of which reads: \"A reduction in workload is advised.\" The President locks it in his safe — in the Russian State the Supreme Ruler's health is the highest class of secret.\n\nThe real question is not how long he has but the constitution. It says the Supreme Ruler is elected by the Council of State, and two thirds of that Council he appointed himself. He has never named a successor. Some think this an oversight; more believe it deliberate. A dictator who names his heir has manufactured himself an enemy."
 krcw_sov_1.a:0 "Begin the preparations"
 krcw_sov_1.b:0 "He will live another twenty years"
 krcw_sov_2_t:0 "The Death of Savinkov"
 krcw_sov_2_d:0 "In the small hours of 11 March 1951 Boris Viktorovich Savinkov died of a cerebral haemorrhage, aged seventy-four.\n\nNo single word contains the life: Socialist-Revolutionary terrorist, killer of a Grand Duke and a Minister of the Interior; Kerensky's deputy war minister; Kornilov's fellow-conspirator; White commissar in the civil war; after 1925 the inventor of \"national populism\" and Supreme Ruler of the Russian State. He dragged Russia out of the rubble of Brest-Litovsk, took back the Baltic, made the German Kaiser his vassal — and built State Security, the closed cities and the camps beyond the Urals.\n\nThe wireless carries the announcement at seven, then four hours of funeral music. Crowds stand silent in the streets, no one quite certain what the silence is for — a man, or a country that has abruptly lost its centre.\n\nThe Council of State meets in emergency session that afternoon. The constitution requires a new Supreme Ruler within thirty days. Four voices are heard in the chamber, and not one of them is sure of itself."
 krcw_sov_2.a:0 "A state funeral, and then politics"
 krcw_sov_3_t:0 "Funeral Music from Moscow"
 krcw_sov_3_d:0 "Moscow radio plays Shostakovich all day. From Warsaw to Delhi the Accord's capitals lower their flags to half mast; in Paris, London and Nanjing men open their atlases and begin calculating what a Russia without Savinkov means.\n\nThe Internationale's secretariat sits through the night. Some call it the best strategic window in thirty years — the Accord has lost its centre, the generals of eastern Europe are each waiting to see, and the German Kaiser does not know whom to bow to. Others point out that a nuclear power uncertain who governs it is the most dangerous object in the world."
 krcw_sov_3.a:0 "(TI) The window is open"
 krcw_sov_3.b:0 "(Accord) The Accord must hold"
 krcw_sov_3.c:0 "An era has ended"
 krcw_sov_4_t:0 "Deadlock in the Council of State"
 krcw_sov_4_d:0 "Thirty days pass. The Council votes eleven times and no candidate reaches a majority.\n\nThe first faction is the army. Vasilevsky, the Chief of Staff, makes no speeches; his supporters talk in corridors. What Russia needs is a modern army and twenty quiet years, not adventures. The second is the civilians of the economic ministries and the Academy, whose memorandum reads: we cannot win an arms race, we can only win on productivity and schools. The third is the smallest and the loudest — the Church, the old nobility and a few industrialists hold that Russia's affliction is thirty years without an Emperor. The fourth holds rallies in uniform, under the slogan \"Savinkov was too soft.\"\n\nBefore the twelfth ballot the Council postpones the election and appoints Nekrasov, its Speaker, acting Supreme Ruler. Everyone calls the arrangement temporary."
 krcw_sov_4.a:0 "Back the General Staff: stability above all"
 krcw_sov_4.b:0 "Back the civilians: productivity, not divisions"
 krcw_sov_4.c:0 "Russia needs an Emperor"
 krcw_sov_4.d:0 "Savinkov was too soft"
 krcw_sov_5_t:0 "Vasilevsky's Memorandum"
 krcw_sov_5_d:0 "In the spring of 1952 the Chief of Staff submits a forty-page paper to the Council entitled \"On the Material Basis of National Defence.\"\n\nIt contains no political slogan. It calculates one thing: if war comes in 1953, in how many days can the Russian army put supply on the Rhine. The answer is never — there are not enough lorries, the gauge changes at the Vistula, and there are a third as many radio sets as the Internationale has.\n\n\"We won in 1944 with men and will,\" the conclusion reads. \"If we intend to win the next one with the same, we shall lose Russia.\" The officer corps passes the document hand to hand for months. It works better than any speech: it proves the man does not intend to go to war, and does not intend to lie."
 krcw_sov_5.a:0 "The paper is correct"
 krcw_sov_5.b:0 "This is defeatism"
 krcw_sov_5.c:0 "If even the army says so, let civilians hold the purse"
 krcw_sov_6_t:0 "Sorokin's Plan"
 krcw_sov_6_d:0 "Pitirim Sorokin is an odd candidate: sociologist, former Socialist-Revolutionary, Savinkov's old comrade of the twenties, academician, and never in command of anyone.\n\nHe speaks to the Council for forty minutes without once mentioning the army. He speaks of literacy, infant mortality, output per man-hour, and one word he uses repeatedly: waste. Russia spends a fifth of the national income on an army that cannot fight, keeps its best generation of engineers in cities without names building bombs, and the peasants of Ryazan plough with 1913 ploughs.\n\n\"The strength of a state is not what it can destroy,\" he ends, \"but what it can produce.\" The officers walk out at that sentence. The engineers and the statisticians stay."
 krcw_sov_6.a:0 "He is right: win on productivity"
 krcw_sov_6.b:0 "A candidate without divisions cannot rule"
 krcw_sov_6.c:0 "Academic wind"
 krcw_sov_7_t:0 "Conversations at the Cathedral of the Saviour"
 krcw_sov_7_d:0 "In 1952 a group meets in a Moscow church not yet reconsecrated: two bishops, three descendants of the old nobility, a director of the Ural steel trust, and a deputy head of State Security.\n\nTheir argument is strong on paper. The legitimacy of the Russian State belonged only ever to Savinkov — not the constitution, not the Council, him. He is dead and that legitimacy has no heir. A republic needs elections to explain why it governs, and Russia cannot hold elections; the last real one was in 1917.\n\n\"Then restore something that needs no explaining,\" the deputy says. Grand Duke Vladimir Kirillovich, raised in exile, has governed nowhere — and for that reason owes no faction anything.\n\nWhere this road leads no one can say. But it leads to a country wholly unlike Savinkov's Russia."
 krcw_sov_7.a:0 "Hear them out"
 krcw_sov_7.b:0 "Give the list to the General Staff"
 krcw_sov_7.c:0 "Arrest them all"
 krcw_sov_8_t:0 "\"The Final Reckoning\""
 krcw_sov_8_d:0 "Vonsyatsky's rallies fill Moscow stadiums in the summer of 1956. His organisation has uniforms, banners, songs, and a view of history simple enough to be irrefutable.\n\nHe says: in 1944 our tanks reached the Elbe and then we stopped, because Savinkov was old and afraid. For thirty years we have guarded a wire fence while the syndicalists across it made Germany, France, China and half of America their own. The Accord is not an alliance but a ring of buffers kept to be shelled in our place.\n\n\"The Supreme Ruler taught us,\" he says from the platform — and he was indeed Savinkov's man — \"that terror is useful. What he forgot is that terror is for enemies, not for one's own.\"\n\nThere are many veterans in the crowd. That is the dangerous part: the argument persuades an army that won its war and never got its peace."
 krcw_sov_8.a:0 "Let him speak — he brings the crowds"
 krcw_sov_8.b:0 "The army will not hand the state to the street"
 krcw_sov_8.c:0 "Ban the organisation"
 krcw_sov_9_t:0 "Rifles in the Forest"
 krcw_sov_9_d:0 "In the second year of the succession, partisan activity in the Baltic and Finland suddenly revives. This is no coincidence: the Forest Brothers read newspapers, and they know no one in Moscow can currently give an order that sticks.\n\nThe Interior Ministry asks for three more divisions. The General Staff objects: three divisions do not buy a quiet forest, as the ten years since 1944 have demonstrated. The civilians propose something else — a statute of autonomy: local assemblies, mother-tongue schools, local police, in exchange for recognising Russian sovereignty in defence and foreign affairs. The old Empire gave Finland exactly that, and Finland did not rebel for a century.\n\nThis is not merely a question of public order. The road chosen announces what kind of country Russia is going to be."
 krcw_sov_9.a:0 "The statute of autonomy"
 krcw_sov_9.b:0 "Send the three divisions"
 krcw_sov_9.c:0 "Total russification"
 krcw_sov_10_t:0 "The Forest Brothers Answer"
 krcw_sov_10_d0:0 "A year into the statute of autonomy the assemblies in Riga and Tallinn have elected their first governments. Two partisan commanders walk out of the forest with a hundred-odd men and hand in their rifles outside the assembly building in exchange for amnesty papers. The Interior Ministry reports eight months without an ambush in southern Estonia."
 krcw_sov_10_d1:0 "Three divisions have spent a year in the forests. The partisans' supply lines are cut and several villages have been moved to the railway. The ambushes are fewer, and the villagers no longer speak to the garrison. The General Staff considers that enough: the forest is quiet, and quiet was the purpose."
 krcw_sov_10_d2:0 "The statute passed, and the forest did not empty. Some of the partisans call autonomy a Moscow trap and blow up the new assembly's electoral office in Kaunas. The assembly majority condemns the bombing and refuses to let Interior Ministry troops into the city. Moscow must decide whether the statute still stands."
 krcw_sov_10_d3:0 "After the reinforcements the ambushes multiply. A battalion north of Vilnius loses forty men in a month, and the railway bridges on the Gulf of Finland are blown twice. The deported villagers have become the partisans' best recruiting office."
 krcw_sov_10.a:0 "The statute works: extend it to other provinces"
 krcw_sov_10.b:0 "The troops stay, but one division comes home"
 krcw_sov_10.c:0 "Let the assemblies deal with their own radicals"
 krcw_sov_10.d:0 "Send two more divisions into the forest"
 krcw_sov_21_t:0 "The Stability Faction Takes Power"
 krcw_sov_21_d:0 "In February 1953 the Council of State holds its twelfth ballot and elects Aleksandr Mikhailovich Vasilevsky Supreme Ruler of the Russian State by a two-thirds majority.\n\nThe ceremony takes nineteen minutes, with no parade and no rally. In his address he thanks the Council, mentions Savinkov once, and announces three measures: the army is to be reorganised on the lines of \"On the Material Basis of National Defence\", the budgets of the closed cities are to be audited, and the Baltic statute of autonomy is to come into force.\n\nThe Internationale's analysts judge that a government with no personality cult and no purges will be harder to deal with across a table than Savinkov's, but less given to gambles.\n\nVonsyatsky is sent to the Far East to inspect the frontier defences."
 krcw_sov_21.a:0 "Take no risks"
 krcw_sov_22_t:0 "The Civilians' Russia"
 krcw_sov_22_d:0 "Against everyone's expectation the Council of 1953 elects a professor.\n\nSorokin's first budget cuts defence by a seventh and puts the difference into tractor works, teacher-training colleges and regauging the railways. The officer corps is furious and gagged by Vasilevsky's own memorandum — the document they themselves circulated, whose conclusions happen to support Sorokin.\n\nSorokin tells the Council that the struggle between the Accord and the Internationale will last a generation and will be won by the side with the deeper industrial base. The defence money cut now becomes more tank works in five years. The analysts in Paris think this more dangerous than any speech Savinkov made."
 krcw_sov_22.a:0 "Build the industrial base first"
 krcw_sov_23_t:0 "The Emperor Returns"
 krcw_sov_23_d:0 "In August 1953 the Cathedral of the Saviour is reconsecrated. In September Vladimir Kirillovich is crowned Emperor of All Russia in Moscow.\n\nThe ceremony follows the 1896 order of service exactly, though the congregation differs: the generals wear newly designed court dress, the bishops' vestments are on loan from a museum, and the Ural steel trust is paying. The Council of State is not dissolved, merely renamed the Imperial Duma; State Security is not abolished, merely re-badged.\n\nThe Church and the old nobility cheer. The factories are silent. The Baltic provinces are silent — they have just learned that the statute of autonomy is postponed indefinitely, the unity of the Empire being indivisible.\n\nThe Internationale's reaction is almost delighted: for thirty years it has said the Accord was a league of reactionaries, and Moscow has now proved it. In the corridors of Moscow, meanwhile, the men who fetched the Emperor back begin to discover a difficulty — an Emperor is not an exhibit one can return to the museum."
 krcw_sov_23.a:0 "God save the Emperor"
 krcw_sov_24_t:0 "The Extremists Triumphant"
 krcw_sov_24_d:0 "The election of 1953 is conducted under the guard of State Security. On this occasion the part of State Security doing the guarding belongs to Vonsyatsky.\n\nThe new Supreme Ruler devotes forty minutes of his inaugural address to the mistake of 1944. Over the next eighteen months: State Security triples; new camps rise beyond the Urals; the twenty-six members of the Council who voted against him retire one by one for reasons of health; the Baltic statute is torn up and Finland placed under military administration; the budget of Project Number One doubles.\n\nA new phrase enters the broadcasts: \"the final reckoning.\" It is never officially defined, which is precisely where its usefulness lies.\n\nIn Paris the secretariat sits for three days and its first decision is to double the garrison of West Berlin. For the first time in thirty years the Cold War looks less like a deadlock than like a countdown."
 krcw_sov_24.a:0 "The final reckoning"
 krcw_sov_25_t:0 "The New Master of Moscow"
 krcw_sov_25_d0:0 "Marshal Vasilevsky's Russia will not start a war at midnight, nor concede an inch at any table. It is a calm opponent, and calm opponents last longer than fanatical ones."
 krcw_sov_25_d1:0 "A sociologist governs Russia and has cut the defence budget. The analysts in Paris have checked the report three times and still do not believe it."
 krcw_sov_25_d2:0 "Moscow has an Emperor. For the first time in thirty years the Internationale's propaganda requires no rhetoric: the Accord is indeed a league of reactionaries."
 krcw_sov_25_d3:0 "The new Supreme Ruler holds that stopping at the Elbe in 1944 was a historic error. He intends to correct it. The garrison of West Berlin doubled tonight."
 krcw_sov_25_d4:0 "The four-year interregnum is over. Moscow finally has someone who can sign."
 krcw_sov_25.a:0 "(TI) Reassess everything"
 krcw_sov_25.b:0 "(Accord) The Accord holds"
 krcw_sov_25.c:0 "Continue to watch"
 krcw_sov_succession_category:0 "The Succession Struggle"
 krcw_sov_succession_category_desc:0 "Savinkov has never named an heir. The four factions in the Council of State are already preparing for the day, and after his death the two thirds of the Council that matters will decide who becomes Supreme Ruler."
 krcw_sov_back_mil:0 "Back the Military Pragmatists"
 krcw_sov_back_mil_desc:0 "Spend political capital on this faction, improving its chances in 1958."
 krcw_sov_back_civ:0 "Back the Civilian Technocrats"
 krcw_sov_back_civ_desc:0 "Spend political capital on this faction, improving its chances in 1958."
 krcw_sov_back_mon:0 "Back the Monarchists"
 krcw_sov_back_mon_desc:0 "Spend political capital on this faction, improving its chances in 1958."
 krcw_sov_back_ext:0 "Back the Extremists"
 krcw_sov_back_ext_desc:0 "Spend political capital on this faction, improving its chances in 1958."
 krcw_sov_bid_civ_8_tt:0 "Influence of the civilian technocrats: §G+8§!"
 krcw_sov_bid_civ_10_tt:0 "Influence of the civilian technocrats: §G+10§!"
 krcw_sov_bid_civ_15_tt:0 "Influence of the civilian technocrats: §G+15§!"
 krcw_sov_bid_civ_20_tt:0 "Influence of the civilian technocrats: §G+20§!"
 krcw_sov_bid_civ_25_tt:0 "Influence of the civilian technocrats: §G+25§!"
 krcw_sov_bid_ext_8_tt:0 "Influence of the extremists: §G+8§!"
 krcw_sov_bid_ext_10_tt:0 "Influence of the extremists: §G+10§!"
 krcw_sov_bid_ext_15_tt:0 "Influence of the extremists: §G+15§!"
 krcw_sov_bid_ext_20_tt:0 "Influence of the extremists: §G+20§!"
 krcw_sov_bid_ext_25_tt:0 "Influence of the extremists: §G+25§!"
 krcw_sov_bid_ext_30_tt:0 "Influence of the extremists: §G+30§!"
 krcw_sov_bid_mil_5_tt:0 "Influence of the military pragmatists: §G+5§!"
 krcw_sov_bid_mil_8_tt:0 "Influence of the military pragmatists: §G+8§!"
 krcw_sov_bid_mil_10_tt:0 "Influence of the military pragmatists: §G+10§!"
 krcw_sov_bid_mil_15_tt:0 "Influence of the military pragmatists: §G+15§!"
 krcw_sov_bid_mil_20_tt:0 "Influence of the military pragmatists: §G+20§!"
 krcw_sov_bid_mon_8_tt:0 "Influence of the monarchists: §G+8§!"
 krcw_sov_bid_mon_25_tt:0 "Influence of the monarchists: §G+25§!"
 krcw_sov_bid_mon_30_tt:0 "Influence of the monarchists: §G+30§!"
 krcw_sov_mon_purged_tt:0 "Influence of the monarchists: §R-20§!"
 krcw_sov_prep_paid_tt:0 "The Council had prepared: influence of the military pragmatists §G+10§!"
 krcw_sov_prep_missed_tt:0 "The Council was unprepared: extremists §R+8§!, monarchists §R+5§!, stability §R-5%§!"
 krcw_sov_clients_tt:0 "The clients will give their answer within months."
 krcw_sov_ext_banned_tt:0 "Influence of the extremists: §R-25§!"
 krcw_sov_technocrat_bonus:0 "The Technocrats' Plan"
 krcw_ent_courted:0 "An Attentive Suitor"
 krcw_ent_rebuffed:0 "A Suit Rebuffed"
 krcw_ent_courting_category:0 "Courting Canberra"
 krcw_ent_courting_category_desc:0 "The exiled Entente Crown sits at Canberra and rules Australia and New Zealand. It hates the Internationale that took Britain and loathes Savinkov's gallows. Both blocs want it on their side, or at least not on the other's."
 krcw_ent_lean_p15_tt:0 "Canberra leans towards Paris: §G+15§!"
 krcw_ent_ti_wool_contracts:0 "Long-Term Wool Contracts"
 krcw_ent_ti_wool_contracts_desc:0 "The federations buy up ten years of the Australian wool clip above the market price. Not charity: a reminder to Canberra of where its customers are."
 krcw_ent_lean_p20_tt:0 "Canberra leans towards Paris: §G+20§!"
 krcw_ent_ti_technical_mission:0 "A Technical Mission"
 krcw_ent_ti_technical_mission_desc:0 "A hundred French and British engineers go to Sydney and Melbourne to help build power stations and machine-tool works. They are asked not to talk politics, and most of them manage it."
 krcw_ent_ti_recognise_the_crown:0 "Recognise the Crown in Exile"
 krcw_ent_ti_recognise_the_crown_desc:0 "The Internationale has never recognised Canberra's claim to Britain and will not now. But it can recognise something else: that the Crown is the lawful government of Australia and New Zealand."
 krcw_ent_lean_m15_tt:0 "Canberra leans towards Moscow: §R-15§!"
 krcw_ent_ma_arms_sales:0 "Cheap Tanks"
 krcw_ent_ma_arms_sales_desc:0 "Moscow sells tanks at half the Internationale's price and attaches no conditions about trade unions."
 krcw_ent_lean_m20_tt:0 "Canberra leans towards Moscow: §R-20§!"
 krcw_ent_ma_pacific_squadron:0 "The Pacific Squadron Calls"
 krcw_ent_ma_pacific_squadron_desc:0 "The Vladivostok cruisers anchor in Sydney Harbour. The reception ashore is warmer than expected; the unionised wharfies refuse to coal them."
 krcw_ent_ma_anti_syndicalist_compact:0 "The Anti-Syndicalist Compact"
 krcw_ent_ma_anti_syndicalist_compact_desc:0 "A secret intelligence agreement: State Security and the Australian security service exchange files on union \"subversives.\""
 krcw_ent_canberra_category:0 "Canberra's Choice"
 krcw_ent_canberra_category_desc:0 "Both blocs are knocking. The exiled Crown must decide which door to open — or whether to bolt both."
 krcw_ent_declare_armed_neutrality:0 "Declare Armed Neutrality"
 krcw_ent_declare_armed_neutrality_desc:0 "Take no side, and let no one land here. Canberra declares that Australia and New Zealand will join neither the Internationale nor the Accord."
 krcw_ent_play_both_sides:0 "Play Both Sides"
 krcw_ent_play_both_sides_desc:0 "Put the Paris engineers and the Moscow attachés in the same hotel and let them see each other. Both offers improve at once."
 krcw_ent_canberra_conference:0 "The Canberra Conference"
 krcw_ent_canberra_conference_desc:0 "A country in neither bloc invites both to its capital to negotiate Pacific shipping, whaling and nuclear testing. For the first time in thirty years it is something more than an exile."
 krcw_ent_1_t:0 "The Paris Offer"
 krcw_ent_1_d:0 "The Internationale's envoy brings a draft treaty: a long-term trade agreement, technical assistance, non-aggression, and one sentence in an annex — \"the parties shall conduct no political propaganda on each other's territory.\"\n\nOne minister says it is the first time in twenty-five years anyone has treated Canberra as a country rather than an exile. Another reminds the cabinet that the pen being offered belongs to the men who took London."
 krcw_ent_1.a:0 "Sign: bread before crowns"
 krcw_ent_1.b:0 "We remember London"
 krcw_ent_2_t:0 "The Moscow Offer"
 krcw_ent_2_d:0 "The Russian attaché brings a defence pact: tanks, interceptors, a standing advisory mission at Darwin and \"comprehensive cooperation\" between the two security services. Not one word about trade unions, not one word about elections.\n\nThe Defence Minister thinks it the best offer Australia has ever had. The Foreign Minister asks a single question: what will a regime that hangs its own workers do to ours?"
 krcw_ent_2.a:0 "Sign: the enemy's enemy"
 krcw_ent_2.b:0 "We want no gallows"
 krcw_ent_3_t:0 "Canberra's Answer"
 krcw_ent_3_d0:0 "Canberra has signed the Internationale's treaty. The Crown's newspapers call it \"a pragmatic step,\" and the Sydney wharfies hang a red flag over the harbour, which the cabinet pretends not to see."
 krcw_ent_3_d1:0 "Canberra has signed Moscow's defence pact. The first Russian advisers are ashore at Darwin, and the Australian Council of Trade Unions announces a general strike in protest."
 krcw_ent_3_d2:0 "Canberra has politely declined. The note is impeccably worded and its meaning plain: the exiled Crown will surrender its last scrap of independence to no one."
 krcw_ent_3.a:0 "(TI) Noted"
 krcw_ent_3.b:0 "(Accord) Noted"
 krcw_ent_4_t:0 "The Canberra Conference"
 krcw_ent_4_d:0 "A country belonging to no bloc invites both to its capital to negotiate Pacific shipping, whaling and nuclear testing. The conference lasts three weeks and signs four technical agreements — and one declaration nobody expected to see signed: the South Pacific is to be free of nuclear weapons.\n\nFor twenty-five years the Crown at Canberra has been a story about the past. This time it tells one about the future."
 krcw_ent_4.a:0 "(TI) A neutral worth respecting"
 krcw_ent_4.b:0 "(Accord) They will regret it"
 krcw_ent_4.c:0 "Peace in the South Pacific"
 krcw_ti_comrades_in_arms:0 "Comrades in Arms"
 krcw_ma_loyal_member:0 "A Loyal Member"
 krcw_ma_wayward_member:0 "A Wayward Member"
 krcw_ti_federal_militia:0 "The Union Militia"
 krcw_ti_federal_militia_desc:0 "A platoon to every workshop, a battalion to every federation. The militia works the week and drills on the ranges outside town at weekends: the Internationale's small members cannot afford great armies, but every worker knows his muster point."
 krcw_ma_land_reform:0 "The Belated Land Reform"
 krcw_ma_land_reform_desc:0 "Moscow gave the land to the peasants thirty years ago; the Accord's other members dragged their feet. Now the broadcasts from across the border can no longer use it to stir up the villages."
 krcw_ti_minor_tree:0 "krcw_ti_minor_tree"
 krcw_ti_our_place_in_the_internationale:0 "Define Our Place in the Internationale"
 krcw_ti_our_place_in_the_internationale_desc:0 "Paris is the capital of the Internationale but not the whole of it. Every member has its own revolution, its own traditions and its own difficulties — and one vote in the federation congress."
 krcw_ti_the_federation_congress:0 "The Federation Congress"
 krcw_ti_the_federation_congress_desc:0 "The unions, farmers' leagues and communes send delegates to a congress every two years. It is parliament and planning board at once: the sessions run long, but no one dares ignore the resolutions."
 krcw_ti_our_own_road:0 "Our Own Road"
 krcw_ti_our_own_road_desc:0 "The statutes recognise that each member organises its communes by its own traditions. Copenhagen, Dublin and Amsterdam each do it their own way."
 krcw_ti_against_the_offices:0 "Against the Offices"
 krcw_ti_against_the_offices_desc:0 "Twenty years after the revolution the federation officers sit more comfortably than the shop floor. New statutes limit officers to two-year recallable terms."
 krcw_ti_festival_of_youth:0 "The Festival of Youth"
 krcw_ti_festival_of_youth_desc:0 "Music, cinema, debates and camping. The Internationale's young meet one another at the summer festival, and their idea of the revolution is not quite their parents'."
 krcw_ti_the_second_commune_dialogue:0 "Dialogue with the Second Commune"
 krcw_ti_the_second_commune_dialogue_desc:0 "The young men in the workshops say the offices stole the revolution. Rather than break up their meetings, invite their delegates into the congress."
 krcw_ti_join_the_federations:0 "Join the Industrial Federations"
 krcw_ti_join_the_federations_desc:0 "Surrender some control over prices and plans; receive drawings, quotas and a market that cannot be blockaded. The small countries did the arithmetic and signed."
 krcw_ti_roads_and_power_lines:0 "Roads and Power Lines"
 krcw_ti_roads_and_power_lines_desc:0 "The federations' first loan goes on the least glamorous things: country roads, substations and branch lines to the ports."
 krcw_ti_federation_factories:0 "Bring In Federation Factories"
 krcw_ti_federation_factories_desc:0 "Machine tools arrive from Lyon and Sheffield, workers are hired locally, and the output is sold across the Internationale by quota."
 krcw_ti_our_specialisation:0 "Choose a Specialisation"
 krcw_ti_our_specialisation_desc:0 "In a transnational plan every member must find what it does best: Danish ships, Dutch electricals, Norwegian aluminium, Italian motor cars."
 krcw_ti_shared_laboratories:0 "Exchange Researchers"
 krcw_ti_shared_laboratories_desc:0 "The laboratories at Saclay, Harwell and Delft exchange researchers and data. Small countries cannot afford a cyclotron, but they can supply physicists."
 krcw_ti_the_clearing_ledger:0 "The Clearing Ledger"
 krcw_ti_the_clearing_ledger_desc:0 "Deficit members need not deflate; surplus members may not hoard. In the Paris ledger every member has a page."
 krcw_ti_hold_the_line:0 "Frontline Readiness"
 krcw_ti_hold_the_line_desc:0 "The Elbe, the Alpine passes, the Baltic approaches: the Internationale's smaller members sit astride all of them. Their defence plans have one line — hold until the armour arrives from Paris."
 krcw_ti_the_union_militia:0 "The Union Militia"
 krcw_ti_the_union_militia_desc:0 "A platoon to every workshop, a battalion to every federation. Small countries cannot afford great armies, but every worker knows his muster point."
 krcw_ti_air_defence_network:0 "The Air Defence Network"
 krcw_ti_air_defence_network_desc:0 "Radar stations link into a chain from the North Cape to Sicily, each member responsible for its own stretch."
 krcw_ti_coastal_flotillas:0 "Coastal Flotillas"
 krcw_ti_coastal_flotillas_desc:0 "Corvettes, minesweepers and torpedo boats. Small navies do not contest the oceans; they hold their own straits and harbours."
 krcw_ti_the_federal_army:0 "Join the Joint Command"
 krcw_ti_the_federal_army_desc:0 "Our divisions join the Internationale's joint command and our officers train at the staff college in Paris. A small army inside a large system."
 krcw_ti_international_brigades:0 "The International Brigades"
 krcw_ti_international_brigades_desc:0 "After Spain the International Brigades never really disbanded. Every member has volunteers willing to go anywhere: Asia, Africa, or the east bank of the Mississippi."
 krcw_ti_southern_solidarity:0 "Send Technicians Abroad"
 krcw_ti_southern_solidarity_desc:0 "Send engineers, doctors and teachers to Algiers, Dakar and Rangoon. Aid workers from a small country are more readily accepted."
 krcw_ti_a_bridge_to_the_east:0 "Open a Shortwave Service to the East"
 krcw_ti_a_bridge_to_the_east_desc:0 "Our radio broadcasts across the wire in Polish, Hungarian and Russian, reporting the strikes and shortages the Accord's papers leave out. A small country's station is more easily believed than Paris's, and more likely to draw jamming and reprisals."
 krcw_ti_europe_without_walls:0 "Tighten the Border Checkpoints"
 krcw_ti_europe_without_walls_desc:0 "Border guards and customs overhaul the checkpoints together, checking papers and stopping the printed matter and money the Accord sends across. Traders and family visitors queue for hours longer, and the border towns resent it."
 krcw_ti_fraternal_dispute:0 "A Fraternal Dispute"
 krcw_ti_secretariat_favour:0 "Favour of the Secretariat"
 krcw_ti_border_grievance:0 "A Border Grievance"
 krcw_ti_loyal_pillar:0 "A Pillar of the Internationale"
 krcw_ti_loyal_pillar_desc:0 "On the secretariat’s allocation tables the reliable members come first. Our divisions sit in the joint command and our plan is kept in the same ledger as Paris’s. The price is that nobody asks our opinion any more."
 krcw_ti_national_road:0 "The National Road"
 krcw_ti_national_road_desc:0 "Article three says each federation organises in its own tradition. For twenty years that was a courtesy; now it is national policy. Inside the Internationale, but not beneath Paris."
 krcw_ti_commune_democracy:0 "Workshop Democracy"
 krcw_ti_commune_democracy_desc:0 "The plan no longer comes down from a ministry but up from the works assembly. The meetings run long and the resolutions change slowly, but once passed nobody needs supervising."
 krcw_ti_professional_cadre:0 "A Professional Cadre"
 krcw_ti_professional_cadre_desc:0 "The militia fights well in its own streets but cannot march beyond the border. A small professional standing army: officers trained at the staff college in Paris, sergeants who can read a radio manual."
 krcw_ti_maritime_federation:0 "The Maritime Federation"
 krcw_ti_maritime_federation_desc:0 "The shipping unions of Copenhagen, Rotterdam, Oslo, Genoa and Dublin merge into one federation. Its merchant fleet matters more than any member’s navy: the Internationale’s blood travels by sea."
 krcw_ti_atomic_participant:0 "Participant in the Atomic Programme"
 krcw_ti_atomic_participant_desc:0 "We cannot afford a reactor but we can afford twenty physicists and a heavy-water plant. On the Saclay list our name stands in the fourth column: participant, not possessor."
 krcw_ti_frontline_burden:0 "The Burden of the Front"
 krcw_ti_frontline_burden_desc:0 "The Elbe, the Adriatic, the North Sea approaches: the wire runs along our border. A third of the budget goes to the army, and every family has someone in a frontier post."
 krcw_ti_the_question_of_paris:0 "Raise Paris's Standing"
 krcw_ti_the_question_of_paris_desc:0 "The charter says the members are equal, yet the secretariat sits in Paris, the Clearing Union ledger is kept in Paris, and the armoured divisions are in Paris too. The congress must answer what no one has dared formally ask in twenty years: are we members of a federation, or provinces of a capital?"
 krcw_ti_the_loyal_pillar:0 "Stand with Paris"
 krcw_ti_the_loyal_pillar_desc:0 "A small country has no third way between two giants. Rather than argue itself hoarse over autonomy, be the Internationale’s most reliable pillar: the reliable members come first on the secretariat’s allocation tables."
 krcw_ti_the_national_road:0 "Demand Our Own Organisation"
 krcw_ti_the_national_road_desc:0 "The revolution was won in our own factories, not in a Paris committee room. Article three says each federation organises in its own tradition; we now ask that it be read literally."
 krcw_ti_the_second_commune_current:0 "Answer the Second Commune Movement"
 krcw_ti_the_second_commune_current_desc:0 "The young people of the Second Commune movement say every level of office interferes too much, and want power returned to the shop meetings."
 krcw_ti_the_joint_command:0 "The Joint Command"
 krcw_ti_the_joint_command_desc:0 "Our general staff moves into one room of the joint command in Paris. Operational plans, supply standards and radio frequencies are all unified. Our general has a chair at the table but no veto."
 krcw_ti_the_secretariat_quota:0 "Win a Higher Quota"
 krcw_ti_the_secretariat_quota_desc:0 "Loyalty is repaid: our quota in the industrial federations rises a grade, and delivery of machine tools and bearings falls from two years to ten months."
 krcw_ti_the_model_member:0 "The Model Member"
 krcw_ti_the_model_member_desc:0 "The Paris propaganda bureau makes a documentary of us: how a small country went from ruins to prosperity with the Internationale’s help. It screens across the Third Internationale, and our delegate is applauded at the congress."
 krcw_ti_the_federal_budget:0 "The Federal Budget"
 krcw_ti_the_federal_budget_desc:0 "The Internationale’s common budget covers part of our defence spending for the first time. Paris pays some of our military bill, and Paris knows where every centime of it goes."
 krcw_ti_the_permanent_delegation:0 "The Permanent Delegation"
 krcw_ti_the_permanent_delegation_desc:0 "We establish a permanent delegation in Paris whose head ranks just below the great powers’ representatives. A small country’s influence rests not on the size of its army but on whom it knows in the corridors."
 krcw_ti_the_shield_of_the_west:0 "Take the Hardest Sector"
 krcw_ti_the_shield_of_the_west_desc:0 "We volunteer for the hardest stretch of the Internationale’s line. It is an honour and an insurance policy: hold the Internationale’s door and the Internationale will not let the door fall."
 krcw_ti_first_among_the_small:0 "First Among the Small"
 krcw_ti_first_among_the_small_desc:0 "In the secretariat’s corridors we become the spokesman of the other small members. We do not interrupt the great powers; but when they have finished, the small ones listen to us."
 krcw_ti_our_own_general_staff:0 "Take Back Command of Our Divisions"
 krcw_ti_our_own_general_staff_desc:0 "Our divisions return from the joint command to national command. The military delegate from Paris protests that it will wreck the unified defence; our answer is that the unified defence never asked about our terrain."
 krcw_ti_national_accounting:0 "Draw Up Our Own Plan"
 krcw_ti_national_accounting_desc:0 "The Clearing Union ledger is still kept in Paris, but our planning commission no longer sends its drafts for approval. Quotas are negotiable; the plan is our own business."
 krcw_ti_the_language_of_the_revolution:0 "Keep Records in Our Own Language"
 krcw_ti_the_language_of_the_revolution_desc:0 "The Internationale’s papers are all drafted in French. Our congress resolves that our revolution shall be recorded in our own language, and that Paris shall pay for the translation."
 krcw_ti_bilateral_trade:0 "Bilateral Trade"
 krcw_ti_bilateral_trade_desc:0 "Bypassing the Clearing Union, we sign trade agreements directly with China, with the young nations, even with neutral Sweden. The economists in Paris call it a regression; our traders call it profit."
 krcw_ti_the_veto_demand:0 "Demand a Veto on Territorial Matters"
 krcw_ti_the_veto_demand_desc:0 "We move an amendment to the charter at the congress: no resolution touching a member’s territory or army shall pass without that member’s consent. The great powers oppose it; the other small members support it in silence."
 krcw_ti_armed_autonomy:0 "Design Our Own Arms"
 krcw_ti_armed_autonomy_desc:0 "A country that wants its own foreign policy needs its own arsenal. Our factories begin producing rifles and guns of our own design, no longer waiting on drawings from Paris."
 krcw_ti_a_federation_of_equals:0 "Rotate the Secretariat"
 krcw_ti_a_federation_of_equals_desc:0 "After four years of quarrelling the new charter passes at Lyon: the secretariat rotates, and the Clearing Union council allots seats by population rather than industrial output. The Internationale has not split; it has widened."
 krcw_ti_the_recallable_delegate:0 "Allow Recall at Any Meeting"
 krcw_ti_the_recallable_delegate_desc:0 "A works assembly may recall its delegate at any sitting. The officers complain that no long-term planning is possible; the workers reply that this is precisely the point."
 krcw_ti_the_shop_floor_plan:0 "Let the Shops Set the Targets"
 krcw_ti_the_shop_floor_plan_desc:0 "Production targets are no longer handed down by a ministry but reported up by the workshops and reconciled in the regional federation. Output falls three per cent in the first year and exceeds plan by eleven in the third."
 krcw_ti_the_young_congress:0 "Add Seats for Young Delegates"
 krcw_ti_the_young_congress_desc:0 "Delegates under twenty-five take a third of the congress seats. Their first resolution cuts military service from three years to eighteen months; their second abolishes the officials’ canteen."
 krcw_ti_the_commune_militia:0 "Form the Workshop Militia"
 krcw_ti_the_commune_militia_desc:0 "The Second Commune distrusts a standing army, the weapon of the offices. Defence passes to the workshop militia: poorly equipped, lightly trained, but every company elects its captain."
 krcw_ti_the_cybernetic_workshop:0 "The Cybernetic Workshop"
 krcw_ti_the_cybernetic_workshop_desc:0 "If the workshops plan for themselves, the workshops need computing. Our first computer sits in the basement of the union hall, reconciling figures sent up by three thousand workshops."
 krcw_ti_the_charter_of_the_workshops:0 "The Charter of the Workshops"
 krcw_ti_the_charter_of_the_workshops_desc:0 "The new charter states that all power belongs to the works assemblies and the town communes, the federation being merely their office. It is the most thorough democratic experiment in the Internationale, and the most fragile."
 krcw_ti_the_second_international_call:0 "Circulate the Workshop Charter"
 krcw_ti_the_second_international_call_desc:0 "We print three hundred thousand copies of the workshop charter and send them to Paris, London, Rome and New York. The secretariat calls it splittism; but the workshops of Lyon have already begun to vote."
 krcw_ti_the_specialisation_compact:0 "The Specialisation Compact"
 krcw_ti_the_specialisation_compact_desc:0 "The logic of a transnational plan is simple: whoever does a thing best does more of it. Denmark builds ships, the Netherlands electricals, Norway smelts aluminium, Italy makes motor cars, Iberia mines. We have signed our own column."
 krcw_ti_the_yards_and_the_sea:0 "Expand the Shipyards"
 krcw_ti_the_yards_and_the_sea_desc:0 "Keels lie on the slipways at Copenhagen, Rotterdam, Oslo, Belfast and Genoa at once. The Internationale’s merchant fleet must double in ten years, or a blockade will cut the federation into pieces."
 krcw_ti_the_electrical_trust:0 "The Electrical Trust"
 krcw_ti_the_electrical_trust_desc:0 "Philips’ works passed to a workers’ council after the revolution but kept its laboratories. The bulbs, wirelesses and radar valves of the whole Internationale come out of it."
 krcw_ti_aluminium_and_fjords:0 "Develop the Fjord Aluminium Works"
 krcw_ti_aluminium_and_fjords_desc:0 "Norwegian hydropower is nearly free, and smelting aluminium is the business of turning electricity into metal. Every aircraft in the Internationale carries a piece of Norwegian aluminium."
 krcw_ti_the_motor_works:0 "The Motor Works"
 krcw_ti_the_motor_works_desc:0 "The Fiat works at Turin is run by its workers’ council. Lorries, tractors and armoured cars come off the same lines: the Internationale’s mechanisation rests on them."
 krcw_ti_the_iberian_mines:0 "Put the Miners in Charge of the Mines"
 krcw_ti_the_iberian_mines_desc:0 "Once the mines of Rio Tinto, Almadén and Asturias are taken into common ownership, the miners demand to run them themselves."
 krcw_ti_the_common_market_of_labour:0 "The Common Market of Labour"
 krcw_ti_the_common_market_of_labour_desc:0 "Workers may move freely within the Internationale, with seniority, pensions and housing places recognised across borders. A Dublin welder can work three years in Rotterdam and come home having lost nothing."
 krcw_ti_shared_laboratories_two:0 "The Joint Institutes"
 krcw_ti_shared_laboratories_two_desc:0 "Joint institutes at Saclay, Delft, Harwell and the Turin Polytechnic. No small country can afford big science; four small countries together can."
 krcw_ti_the_atomic_annex:0 "The Atomic Annex"
 krcw_ti_the_atomic_annex_desc:0 "The Internationale’s atomic programme is run from Paris, but the heavy water, the uranium ore and some of the centrifuges sit in the small members. We sign the annex: facilities and personnel in exchange for data and a voice."
 krcw_ti_the_rotterdam_agreement:0 "The Rotterdam Agreement"
 krcw_ti_the_rotterdam_agreement_desc:0 "The port unions of every member sign common tariffs and common strike rules. It sounds dull; it means no single harbour can be used to blackmail the federation."
 krcw_ti_the_third_plan:0 "The Third Five-Year Plan"
 krcw_ti_the_third_plan_desc:0 "The first two plans repaired the war’s damage; the third is to give our workers a better life than before the revolution: housing, clinics, refrigerators, a fortnight’s paid holiday."
 krcw_ti_the_defence_review:0 "The Defence Review"
 krcw_ti_the_defence_review_desc:0 "The 1950 defence review asks a sharp question: does the country want a militia that can hold its own streets, or a standing army that can march with the Internationale? There is money for only one."
 krcw_ti_the_professional_army:0 "The Professional Army"
 krcw_ti_the_professional_army_desc:0 "The militia fights well in its own streets but cannot march beyond the border. A small professional standing army: officers trained in Paris, sergeants who can read a radio manual, five-year enlistments."
 krcw_ti_the_frontier_fortifications:0 "The Frontier Fortifications"
 krcw_ti_the_frontier_fortifications_desc:0 "The Elbe, the Alpine passes, the Adriatic shore, the North Sea approaches: the wire runs along the border. The concrete thickens year by year, though everyone knows concrete only buys time."
 krcw_ti_the_conscript_question:0 "Adjust the Term of Service"
 krcw_ti_the_conscript_question_desc:0 "The youth delegates demand shorter service, the general staff longer. The compromise is eighteen months plus a fortnight of reserve training a year: neither side satisfied, both able to live with it."
 krcw_ti_the_coastal_command:0 "Coastal Command"
 krcw_ti_the_coastal_command_desc:0 "Submarines, torpedo boats, mines and coastal guns. A small navy does not contest oceans; it makes everyone uncomfortable near its own shore."
 krcw_ti_the_air_wing:0 "The Fighter Wing"
 krcw_ti_the_air_wing_desc:0 "Form two interceptor wings and a radar network to raise the cost of any air attack."
 krcw_ti_the_seventy_two_hours:0 "Adopt the Seventy-Two-Hour Plan"
 krcw_ti_the_seventy_two_hours_desc:0 "Every plan rests on the same number: the country must hold alone for seventy-two hours, after which the Internationale’s armour arrives. The exercise is run four times a year, and every time the number is recalculated."
 krcw_ti_the_civil_defence_corps:0 "The Civil Defence Corps"
 krcw_ti_the_civil_defence_corps_desc:0 "If an atomic bomb falls on Rotterdam or Turin no army can help. Each district raises a civil defence corps, underground stations become shelters, and children are taught the sirens at school."
 krcw_ti_the_unfinished_borders:0 "List the Unsettled Borders"
 krcw_ti_the_unfinished_borders_desc:0 "The revolution redrew the map of Europe but left several lines nobody accepts: Ulster, the Adriatic, Gibraltar, Berlin, the Great Lakes. The charter forbids war between members; it does not forbid quarrelling."
 krcw_ti_the_ulster_question:0 "Deal with the Belfast Shipyard Unions"
 krcw_ti_the_ulster_question_desc:0 "Northern Ireland passed to Dublin in 1947, but the Belfast shipyard workers are mostly Protestants whose union would rather take its lead from Glasgow. It is the most awkward border inside the Internationale."
 krcw_ti_the_adriatic_question:0 "Press the Trieste Question"
 krcw_ti_the_adriatic_question_desc:0 "The Italians of Trieste and Istria demand Rome; the Yugoslav junta refuses to discuss it. It is the one land border where an Internationale member faces an Accord member directly."
 krcw_ti_the_rock:0 "Raise Gibraltar"
 krcw_ti_the_rock_desc:0 "Gibraltar still flies the Union of Britain’s flag. The Iberian Federation raises it at the congress once a year and Britain politely declines once a year; both know the Rock holds the door of the Mediterranean."
 krcw_ti_west_berlin:0 "West Berlin"
 krcw_ti_west_berlin_desc:0 "A city ringed by wire, living on an air corridor. It is the Internationale’s most vulnerable point and its most eloquent piece of propaganda, so long as its lights stay on."
 krcw_ti_the_great_lakes:0 "The Great Lakes"
 krcw_ti_the_great_lakes_desc:0 "Canada and the syndicalist republic on the east bank share four lakes. There are no warships on them, by an agreement of 1947; but Long, south of the lakes, could turn that agreement into waste paper at any time."
 krcw_ti_the_arbitration_court:0 "The Court of Arbitration"
 krcw_ti_the_arbitration_court_desc:0 "We propose a court of arbitration inside the Internationale at Geneva: territorial quarrels between members go to it and the congress endorses its rulings. It does not settle the quarrels but it takes them out of the soldiers’ hands."
 krcw_ti_the_young_nations_bureau:0 "The Young Nations Bureau"
 krcw_ti_the_young_nations_bureau_desc:0 "A small country is more easily believed by the newly independent: we have no colonies and no fleet with which to reclaim any. The bureau sends engineers, teachers and doctors, and no advisers."
 krcw_ti_the_neutral_channel:0 "Open an Intelligence Station in Stockholm"
 krcw_ti_the_neutral_channel_desc:0 "We open an intelligence station in Stockholm that reaches the underground inside the Accord through neutral traders and seamen. Our security service runs it and passes what it learns to Paris as well."
 krcw_ti_the_welfare_charter:0 "The Welfare Charter"
 krcw_ti_the_welfare_charter_desc:0 "The members sign a common social charter: a minimum wage, a forty-four-hour week, universal health care, maternity hospitals and kindergartens."
 krcw_ti_the_television_age:0 "Begin Television Broadcasts"
 krcw_ti_the_television_age_desc:0 "Our first television mast goes on air, and its signal reaches the towns across the border. The station is run by the unions and the communes together, and the housing, shops and holidays on screen make the Accord's propaganda harder to sustain."
 krcw_ti_the_university_expansion:0 "Expand University Admissions"
 krcw_ti_the_university_expansion_desc:0 "Enrolment triples in a decade. These are the students who will be in the streets in 1954, demanding that the revolution their parents won be carried one step further."
 krcw_ti_the_space_contribution:0 "Join the Space Programme"
 krcw_ti_the_space_contribution_desc:0 "The Internationale’s space programme is run from France, but the tracking stations must stand in Norway, Canada and West Africa, the optics come from the Netherlands and the fuel pumps from Turin. Our name is on the plate of the \"1871\"."
 krcw_ti_the_container_revolution:0 "The Container Revolution"
 krcw_ti_the_container_revolution_desc:0 "The dockers of Rotterdam and Copenhagen might have fought the container, which destroys half the jobs of unloading. Instead the unions took it over: retraining, early pensions and a rise for those who stayed."
 krcw_ti_the_generation_of_sixty_eight:0 "Answer the 1954 Movement"
 krcw_ti_the_generation_of_sixty_eight_desc:0 "In the spring of 1954 students and young workers occupy the universities and a few factories. They do not demand the commune’s overthrow; they demand it honour its own charter. The government must choose how to answer."
 krcw_ti_a_federation_that_lasted:0 "Consolidate the Federation"
 krcw_ti_a_federation_that_lasted_desc:0 "The Cold War's pressure has not broken the Internationale into a heap of states: our defence, planning and clearing are now bound up with every other member's. The congress declares an attack on any member an attack on us."
 krcw_tim_1_t:0 "Three Benches at the Congress"
 krcw_tim_1_d:0 "Three benches sit in the congress hall. One says a small country’s safety lies only with the Internationale and we should be its most loyal member. One says the revolution was won by our own workers and sovereignty should not be handed to Paris. The third says the first two are arguing over who governs, when the real trouble is that too many people govern.\n\nThe chair must let the congress choose."
 krcw_tim_1.a:0 "Be the Internationale’s most reliable pillar"
 krcw_tim_1.b:0 "Press for national autonomy"
 krcw_tim_1.c:0 "Return power to the workshops"
 krcw_tim_3_t:0 "The Vote on the Veto"
 krcw_tim_3_d:0 "Our amendment stands before the congress: no resolution touching a member’s territory or army shall pass without that member’s consent. The French and British delegations oppose it, noting that it would paralyse the Internationale in a crisis. But not one of the other eight small members raises a hand against it.\n\nBefore the vote is counted we may still decide how far to push."
 krcw_tim_3.a:0 "Press it to a vote"
 krcw_tim_3.b:0 "Settle for a non-binding resolution"
 krcw_tim_5_t:0 "Two Defence Estimates"
 krcw_tim_5_d:0 "The general staff and the union federation each submit a defence estimate. The staff wants a standing army on five-year enlistments, uniformly equipped, able to slot into the joint command. The unions want the money spent on militia armouries, district shelters and reserve training.\n\nThe totals are identical; the purposes are not."
 krcw_tim_5.a:0 "Adopt the staff estimate"
 krcw_tim_5.b:0 "Adopt the unions’ estimate"
 krcw_tim_7_t:0 "The Shipwrights of Belfast"
 krcw_tim_7_d:0 "Two years after Ulster passed to Dublin, the union at Harland and Wolff still posts its dues to Glasgow. The yard’s workers are mostly Protestants who have nothing against syndicalism; what they object to is being run from Dublin.\n\nThe Irish government may take the union in hand, or give Belfast a status of its own."
 krcw_tim_7.a:0 "Grant Belfast a special status"
 krcw_tim_7.b:0 "Take the union in hand"
 krcw_tim_9_t:0 "The Answer About the Rock"
 krcw_tim_9_d:0 "The Union of Britain’s reply is courteous: the workers of Gibraltar voted to join the Union themselves in 1927, and the Union cannot hand them over against their will. The Iberian delegate observes that a British brigade was stationed on the Rock at the time of the vote.\n\nThe matter can be pressed, or approached another way."
 krcw_tim_9.a:0 "Refer it to arbitration"
 krcw_tim_9.b:0 "Raise it at every congress"
 krcw_tim_11_t:0 "The Spring of Sixty-Eight"
 krcw_tim_11_d:0 "The universities are occupied and the young workers of three factories have stopped with them. The occupiers’ leaflets do not call for the commune’s overthrow; they print the first article of the charter — \"all power belongs to the assembly of producers\" — and say it has not been honoured in twenty years.\n\nThe police wait at the street corners for orders."
 krcw_tim_11.a:0 "Accept their demands and reform the charter"
 krcw_tim_11.b:0 "Negotiate, but do not touch the charter"
 krcw_tim_11.c:0 "Clear the streets"
 krcw_tim_13_t:0 "The Price of Specialisation"
 krcw_tim_13_d:0 "The transnational plan assigned us a speciality, which is to say it told us not to develop anything else. A young economist on the planning commission warns that if the quota is ever withdrawn we shall be left with one industry.\n\nThe secretariat replies that the quota will not be withdrawn."
 krcw_tim_13.a:0 "Accept the division of labour and excel at it"
 krcw_tim_13.b:0 "Quietly develop a second industry"
 krcw_tim_15_t:0 "After Seventy-Two Hours"
 krcw_tim_15_d:0 "This year’s joint exercise lets our staff see the full war plan for the first time. Page four states that if the front collapses within seventy-two hours, the Internationale’s armour will assemble on the second line — inside our territory.\n\nWhich is to say that half our country is a battlefield in the plan."
 krcw_tim_15.a:0 "Demand the plan be changed"
 krcw_tim_15.b:0 "Accept it, but demand more equipment"
 krcw_ti_congress_cat:0 "Politics of the Congress"
 krcw_ti_congress_cat_desc:0 "Working the congress and the secretariat’s corridors for our country’s place."
 krcw_ti_lobby_the_secretariat:0 "Lobby the Secretariat"
 krcw_ti_lobby_the_secretariat_desc:0 "Our permanent delegate works the corridors for a month and comes back with one line of the quota table altered."
 krcw_ti_table_a_resolution:0 "Table a Resolution"
 krcw_ti_table_a_resolution_desc:0 "Move a resolution at the congress. Small members’ resolutions rarely pass, but what has been raised is remembered."
 krcw_ti_small_members_caucus:0 "The Small Members’ Caucus"
 krcw_ti_small_members_caucus_desc:0 "The eight small members hold an informal meeting the night before a vote. The great powers have never acknowledged that it exists."
 krcw_ti_host_the_congress:0 "Host the Congress"
 krcw_ti_host_the_congress_desc:0 "The congress falls to us to host. For one week our capital is the Internationale’s capital."
 krcw_ti_specialisation_cat:0 "Industrial Specialisation"
 krcw_ti_specialisation_cat_desc:0 "Working the column the transnational plan assigned to us."
 krcw_ti_bid_for_a_contract:0 "Bid for a Federation Contract"
 krcw_ti_bid_for_a_contract_desc:0 "The federations’ next contracts are allotted at Lyon. Our delegate goes with a price list and a delivery guarantee."
 krcw_ti_request_machine_tools:0 "Request a Machine-Tool Quota"
 krcw_ti_request_machine_tools_desc:0 "Machine tools from Lyon and Sheffield carry a two-year queue. Loyal members stand nearer the front."
 krcw_ti_second_industry:0 "Develop a Second Industry"
 krcw_ti_second_industry_desc:0 "The plan did not assign us this column; nor did it expressly forbid it."
 krcw_ti_send_workers_abroad:0 "Send Workers Abroad"
 krcw_ti_send_workers_abroad_desc:0 "The common market of labour lets our workers take jobs abroad; the money they send home enters our clearing account."
 krcw_ti_border_cat:0 "Business of the Borders"
 krcw_ti_border_cat_desc:0 "Ulster, the Adriatic, Gibraltar, Berlin, the Great Lakes: the old accounts inside and along the edge of the Internationale."
 krcw_ti_reinforce_the_frontier:0 "Reinforce the Frontier"
 krcw_ti_reinforce_the_frontier_desc:0 "One more battalion on the disputed border and one more stretch of concrete. The other side will notice; that is the point."
 krcw_ti_quiet_talks:0 "Quiet Talks"
 krcw_ti_quiet_talks_desc:0 "Not a quarrel at the congress but a small room in Geneva, where neither side must be seen to concede."
 krcw_ti_refer_to_arbitration:0 "Refer to the Court of Arbitration"
 krcw_ti_refer_to_arbitration_desc:0 "Hand the quarrel to the court at Geneva. The ruling may not favour us, but it takes the quarrel out of the soldiers’ hands."
 krcw_ti_fund_the_kin_across:0 "Fund the Kin Across the Line"
 krcw_ti_fund_the_kin_across_desc:0 "There are speakers of our language on the far side. Money for their schools, their newspaper and their choir breaks no treaty."
 ITA_krcw_matteotti:0 "Matteo Matteotti"
 ITA_krcw_matteotti_desc:0 "Son of the socialist murdered by the fascists, raised in France, returned to Italy with the Internationale’s armies in 1943. He rebuilt the factory councils of Turin and Milan and argues that the Socialist Republic should be the Internationale’s most procedural member: everything put to a vote, war included."
 ITA_krcw_parri:0 "Ferruccio Parri"
 ITA_krcw_parri_desc:0 "The organiser of the partisan war, who fought from the Alps to the Po. He has no faith in courts of arbitration: the Italians of Trieste and Istria should not wait on a ruling from Geneva. His support is in the army; his opponents say he would drag the Internationale into a war over a few harbours."
 SPR_krcw_garcia_oliver:0 "Juan García Oliver"
 SPR_krcw_garcia_oliver_desc:0 "A CNT veteran who commanded workers’ columns in the streets of Barcelona in July 1936. He opposes every central body, the secretariat in Paris and the federal government in Madrid alike. The Iberian commune movement takes him for its voice; the federation’s ministers would rather he stayed in Barcelona."
 IRE_krcw_larkin:0 "Young Jim Larkin"
 IRE_krcw_larkin_desc:0 "Secretary of the transport workers’ union and the old man’s son. He inherited his father’s organisation and his father’s quarrel with the Belfast shipwrights. He holds that Ireland should bring the northern unions into the Dublin federation by force, which is among the least popular positions inside the Internationale."
 NOR_krcw_tranmael_heir:0 "Håkon Lie"
 NOR_krcw_tranmael_heir_desc:0 "The man who actually runs the Norwegian union federation after Tranmæl. He is a revolutionary of the accountant’s kind, able to cost every kilowatt-hour and every ton of aluminium, and to calculate how long a Norwegian division would last on the Elbe. He wants Norway to be the Internationale’s most reliable member, because only a fjord separates Norway from the Russian Northern Fleet."
 HOL_krcw_sneevliet:0 "Henk Sneevliet"
 HOL_krcw_sneevliet_desc:0 "A Dutch revolutionary socialist who organised railway unions in Java and was deported by the colonial authorities in 1926. When the Netherlands gave up the East Indies in 1946 he was the one man in government who argued for \"at once, unconditionally, without negotiation\". He now asks that the same principle apply within the Internationale: there should be no capital, only federations."
 CAN_krcw_woodsworth:0 "J. S. Woodsworth"
 CAN_krcw_woodsworth_desc:0 "The old man of the Winnipeg general strike, one of the few pacifist leaders in the Syndicalist Republic. He opposes garrisons on the Great Lakes, arms shipments to the east bank of the Mississippi, and any reprisal against the exiled court. His opponents call him naive; his answer is that Canada cannot afford a single war."
 CAN_krcw_buck_hard:0 "Tim Buck (Hard Line)"
 CAN_krcw_buck_hard_desc:0 "One of the founders of the Syndicalist Republic and the leader of the faction that would push the revolution across the border. He believes Long’s America will come sooner or later, and that rather than wait, Canada should arm the syndicates on the east bank now, build gunboats on the lakes and make itself the arsenal of the North American revolution."
 krcw_ma_minor_tree:0 "krcw_ma_minor_tree"
 krcw_ma_member_of_the_accord:0 "Honour the Accord"
 krcw_ma_member_of_the_accord_desc:0 "The Moscow Accord is no ideological international. A Hungarian landowner, a Turkish general and a Persian king share no creed, only an enemy, and the same supplier of tanks."
 krcw_ma_the_officers_republic:0 "Let the Colonels Govern"
 krcw_ma_the_officers_republic_desc:0 "Elections suspended, the chamber adjourned, the cabinet made of colonels. The reason is always the same: the emergency has not ended."
 krcw_ma_a_civilian_cabinet:0 "A Civilian Cabinet"
 krcw_ma_a_civilian_cabinet_desc:0 "The colonels return to barracks and the lawyers and professors to the ministries. Moscow is not delighted but does not object: a stable ally is more useful than an obedient one."
 krcw_ma_the_belated_land_reform:0 "The Belated Land Reform"
 krcw_ma_the_belated_land_reform_desc:0 "The broadcasts from across the border remind the peasants daily that their landlords are still there. Break up the great estates and the broadcasts have nothing left to say."
 krcw_ma_roads_to_the_frontier:0 "Build the Frontier Roads"
 krcw_ma_roads_to_the_frontier_desc:0 "Russian engineers survey the roads and local labour lays them. In peace they carry grain, in war tanks."
 krcw_ma_the_national_bank:0 "The National Bank"
 krcw_ma_the_national_bank_desc:0 "Rouble-denominated loans are dear and our own currency worthless on world markets. A proper national bank can at least publish the budget on time."
 krcw_ma_arms_from_moscow:0 "Russian Armaments"
 krcw_ma_arms_from_moscow_desc:0 "The Moscow armaments trusts sell obsolescent models to Accord members complete with drawings: cheap, on condition that nothing is resold and nothing improved."
 krcw_ma_our_own_arsenal:0 "Improve the Russian Drawings"
 krcw_ma_our_own_arsenal_desc:0 "\"Nothing improved\": nobody ever quite kept that clause. The local arsenal takes the Russian drawings apart and reassembles them to suit itself."
 krcw_ma_fortify_the_frontier:0 "Fortify the Frontier"
 krcw_ma_fortify_the_frontier_desc:0 "A buffer exists to be broken, unless it is hard enough. Year by year the concrete on the frontier grows thicker."
 krcw_ma_mountain_and_steppe:0 "Mountain and Steppe"
 krcw_ma_mountain_and_steppe_desc:0 "The Carpathians, the Balkans, the Hindu Kush, the Mongolian plateau: most Accord members guard difficult country. Train troops to suit it."
 krcw_ma_the_front_state:0 "The Front State"
 krcw_ma_the_front_state_desc:0 "If war comes, the first shot will be fired on our soil. The Accord's joint staff finally agrees to our demand: our divisions under our own generals."
 krcw_ma_fidelity_to_moscow:0 "Fidelity to Moscow"
 krcw_ma_fidelity_to_moscow_desc:0 "Some Accord members remember Moscow only when they need tanks. We are different, or at least we shall make Moscow believe so."
 krcw_ma_an_independent_line:0 "Insist on Our Own Foreign Policy"
 krcw_ma_an_independent_line_desc:0 "The government declares that its foreign policy serves the national interest first and that Accord resolutions will be carried out where they agree with it. Moscow's ambassador protests; the other members watch."
 krcw_ma_a_regional_pact:0 "A Regional Pact"
 krcw_ma_a_regional_pact_desc:0 "The Accord's smaller members sign an agreement of their own: shared railways, coordinated air defence and, unwritten, mutual support in front of Moscow."
 krcw_ma_a_neutral_window:0 "Raise a Frontier Security Police"
 krcw_ma_a_neutral_window_desc:0 "The regional pact's members pool what they intercept on the frontier and each raises a security police against infiltrators and smuggled radios. The interior ministry pays; the army resents losing part of its frontier duty."
 krcw_yn_friend_of_paris:0 "A Friend of Paris"
 krcw_yn_friend_of_moscow:0 "A Friend of Moscow"
 krcw_yn_young_nations:0 "Solidarity of Young Nations"
 krcw_yn_colonial_legacy:0 "The Colonial Legacy"
 krcw_yn_colonial_legacy_desc:0 "The old masters are gone. They left railways built to carry raw materials to the ports, clerks trained only to obey, a few mission schools and an army drilled by foreigners. Independence is only the beginning."
 krcw_yn_nonaligned:0 "Non-Alignment"
 krcw_yn_nonaligned_desc:0 "We belong to neither Paris nor Moscow. Both blocs want our ports, our mines and our vote; we trade with both."
 krcw_yn_development_plan:0 "The National Development Plan"
 krcw_yn_development_plan_desc:0 "A five-year development plan: roads, power stations, schools and the first factories of our own. There is not enough money and not enough engineers, but every village knows it is in the plan."
 krcw_nonaligned_tree:0 "krcw_nonaligned_tree"
 krcw_yn_between_the_blocs:0 "Declare an Independent Foreign Policy"
 krcw_yn_between_the_blocs_desc:0 "The World War destroyed the empires of Berlin, Algiers and Constantinople but left us no peace: Paris and Moscow are dividing their inheritance. Our country is small, but its choices are its own."
 krcw_yn_the_founding_charter:0 "The Founding Charter"
 krcw_yn_the_founding_charter_desc:0 "The constitution was written by a constituent assembly and approved by referendum. It promises more than the state can deliver, but it gives the new government its first legitimacy."
 krcw_yn_land_to_the_tiller:0 "Land to the Tiller"
 krcw_yn_land_to_the_tiller_desc:0 "The plantations of the old masters, the concessions of foreign companies and the great estates are taken over and handed to those who work them."
 krcw_yn_the_literacy_campaign:0 "The Literacy Campaign"
 krcw_yn_the_literacy_campaign_desc:0 "Each one teach one. Students, priests and demobbed soldiers are sent to the villages with primers newly printed in our own languages."
 krcw_yn_our_own_civil_service:0 "Open a Civil Service School"
 krcw_yn_our_own_civil_service_desc:0 "The last foreign advisers' contracts have expired. The new civil service college graduates hundreds of our own officials a year: less practised than their predecessors, perhaps, but they know whom they serve."
 krcw_yn_a_national_culture:0 "A National Culture"
 krcw_yn_a_national_culture_desc:0 "A national radio, a national theatre, a national football team. A new nation needs not only borders but songs of its own."
 krcw_yn_the_development_plan:0 "The National Development Plan"
 krcw_yn_the_development_plan_desc:0 "The first five-year plan. Every page of it asks the same question: where will the money come from?"
 krcw_yn_roads_to_the_interior:0 "Build Roads to the Interior"
 krcw_yn_roads_to_the_interior_desc:0 "The colonial railways ran only to the ports. The new roads will join the villages of the interior to the capital."
 krcw_yn_our_resources_our_own:0 "Nationalise the Foreign Mines"
 krcw_yn_our_resources_our_own_desc:0 "The foreign holdings in the mines, oilfields and plantations are nationalised. Compensation will be paid in instalments, if the state can afford it."
 krcw_yn_credit_from_paris:0 "Take Paris Clearing Union Credit"
 krcw_yn_credit_from_paris_desc:0 "The Internationale's Clearing Union offers cheap credit and technicians, on condition that the new factories are run the federation way."
 krcw_yn_loans_from_moscow:0 "Take Moscow's Loans"
 krcw_yn_loans_from_moscow_desc:0 "Russian loans come with arms, military advisers and an arsenal. Moscow does not care how we run our factories, only how we vote."
 krcw_yn_self_reliance:0 "Self-Reliance"
 krcw_yn_self_reliance_desc:0 "We borrow neither from Paris nor from Moscow. Development will be slower, but no one can blackmail us with debt."
 krcw_yn_the_great_dam:0 "The Great Dam"
 krcw_yn_the_great_dam_desc:0 "A dam across the great river: power for the cities, water for the fields, and a picture to print on every banknote."
 krcw_yn_the_national_university:0 "The National University"
 krcw_yn_the_national_university_desc:0 "The first national university opens its doors. There are never enough places in engineering and medicine."
 krcw_yn_a_national_army:0 "A National Army"
 krcw_yn_a_national_army_desc:0 "The colonial barracks fly the new flag and the soldiers wear new uniforms, but too many officers still remember the old masters' drill book."
 krcw_yn_the_officer_academy:0 "The Officer Academy"
 krcw_yn_the_officer_academy_desc:0 "A national officer academy replaces the foreign instructors. The first graduates swear loyalty to the constitution; let us hope they remember it."
 krcw_yn_guard_the_borders:0 "Guard the Borders"
 krcw_yn_guard_the_borders_desc:0 "The borders the colonisers drew with a ruler on the map must now be held by us."
 krcw_yn_a_small_air_force:0 "Form an Air Force"
 krcw_yn_a_small_air_force_desc:0 "A few dozen second-hand aircraft and one proper airfield. It cannot win a war, but it will make the neighbours think twice."
 krcw_yn_seek_paris:0 "Look to Paris"
 krcw_yn_seek_paris_desc:0 "The Internationale helped Indonesia and Tunisia to independence and its papers call us a \"brother people\". Perhaps brothers help one another."
 krcw_yn_true_nonalignment:0 "Hold to Non-Alignment"
 krcw_yn_true_nonalignment_desc:0 "Both blocs call themselves the defenders of peace. Our answer: stand further off, both of you."
 krcw_yn_seek_moscow:0 "Look to Moscow"
 krcw_yn_seek_moscow_desc:0 "Savinkov's Russia exports no revolution, only tanks and order. For a government afraid of its own streets, that is enough."
 krcw_yn_join_the_internationale:0 "Join the Internationale"
 krcw_yn_join_the_internationale_desc:0 "We take our seat in the federation congress in Paris. From now on an attack on us is an attack on the whole Internationale."
 krcw_yn_the_conference_of_young_nations:0 "The Conference of Young Nations"
 krcw_yn_the_conference_of_young_nations_desc:0 "For the first time the new nations of Asia and Africa sit at one table. The declaration is long and the plan of action short, but it tells Paris and Moscow that the world has more than two poles."
 krcw_yn_join_the_accord:0 "Join the Moscow Accord"
 krcw_yn_join_the_accord_desc:0 "The Russian military mission arrives with its contracts: arms, advisers and a mutual defence treaty."
 krcw_yn_the_peace_zone:0 "The Zone of Peace"
 krcw_yn_the_peace_zone_desc:0 "The young nations declare their lands free of atomic weapons and foreign bases. Neither bloc likes the declaration, and neither wants to be first to break it."
 krcw_ddr_monarchist_sympathy:0 "Monarchist Sympathy"
 krcw_ddr_kaiser_shadow:0 "The Exiled Kaiser's Shadow"
 krcw_ddr_kaiser_shadow_desc:0 "Wilhelm III's court-in-exile in Stockholm writes to Berlin every week."
 krcw_ddr_reparations_unrest:0 "Reparations and Unrest"
 krcw_ddr_reparations_unrest_desc:0 "Factory machinery dismantled and shipped to Russia, workers' rations cut again."
 krcw_ddr_1_t:0 "A Letter from Stockholm"
 krcw_ddr_1_d:0 "The exiled Kaiser Wilhelm III writes once more from Stockholm to the Reichstag. The letter is brief:\n\n\"General Schleicher swore loyalty to my father. The Treaty of Berlin was signed at gunpoint and does not count. Germany needs not a general's republic but its lawful monarch. I stand ready to return.\"\n\nA copy has been sent to Moscow."
 krcw_ddr_1.a:0 "The monarchists still have a following"
 krcw_ddr_2_t:0 "Schleicher's Successor"
 krcw_ddr_2_d:0 "Schleicher is sixty-eight, and the Reichstag has begun to discuss the succession. The constitution says the Supreme Commander is elected by the Reichstag, but no one has ever really voted — in 1944 it was Schleicher's tanks that made the Reichstag vote.\n\nNow there are three factions: the generals loyal to Schleicher, conservatives who want to restore the monarchy, and a small group of liberals who want Germany to become a real republic."
 krcw_ddr_2.a:0 "Hold the line"
 krcw_ddr_2.b:0 "Court the monarchists"
 krcw_ddr_2.c:0 "Open to the liberals"
 krcw_ddr_berlin_cat:0 "The Berlin Question"
 krcw_ddr_berlin_cat_desc:0 "West Berlin is an Internationale enclave ringed by wire."
 krcw_ddr_issue_permits:0 "Issue Family Visiting Permits"
 krcw_ddr_issue_permits_desc:0 "Allow West Berliners to visit relatives in the East on permit."
 krcw_ddr_tighten_checkpoints:0 "Tighten the Checkpoints"
 krcw_ddr_tighten_checkpoints_desc:0 "Strengthen border controls and reduce movement."
 krcw_ddr_3_t:0 "The Leipzig Strike"
 krcw_ddr_3_d:0 "The workers of Leipzig are on strike. The cause: another batch of machinery dismantled and shipped out, another ration cut. The strikers chant \"We want bread, not reparations.\"\n\nSchleicher convenes an emergency cabinet. Some suggest sending in troops, others suggest asking Moscow for relief."
 krcw_ddr_3.a:0 "Suppress it"
 krcw_ddr_3.b:0 "Negotiate"
 krcw_ddr_3.c:0 "Ask Moscow for relief"
 krcw_ddr_4_t:0 "Moscow's Reply"
 krcw_ddr_4_d:0 "The Russian ambassador in Berlin delivers Moscow's reply. It is brief:\n\n\"The Treaty of Berlin stipulates twenty years of reparations. Treaties are sacred. If the German workers find it hard, let them recall how Russian workers lived from 1941 to 1944.\"\n\nThe cabinet is silent."
 krcw_ddr_4.a:0 "There is no choice"
 krcw_ddr_4.b:0 "Print the reply in the newspapers"
 krcw_ddr_5_t:0 "Moscow Gives Ground"
 krcw_ddr_5_d:0 "The Russian ambassador brings not a letter but a draft protocol: dismantling halved for the next three years and four works in Leipzig and Chemnitz struck from the list. In exchange two East German divisions pass under the direct command of the Accord's joint staff.\n\nThe cabinet argues all afternoon. Nobody objects to the relief; the whole argument is about the two divisions."
 krcw_ddr_5.a:0 "Sign: get the works running first"
 krcw_ddr_5.b:0 "Take the relief and leave the divisions for later"
 krcw_ddr_moscow_decides_tt:0 "Whether Moscow grants relief depends on its view of Berlin and on who rules in Moscow."
 krcw_ddr_10_t:0 "Berlin Family Permits"
 krcw_ddr_10_d:0 "East Germany has begun issuing one-day family permits for West Berliners visiting relatives in the East. The East Berlin papers present it as a humanitarian gesture, and the East German security service uses the forms to record every visitor's address and workplace.\n\nThe West Berlin police chief wants returning visitors questioned at the crossings."
 krcw_ddr_10.a:0 "Let the families meet"
 krcw_ddr_10.b:0 "Question the returning visitors"
 krcw_eng_30_t:0 "The Return of Northern Ireland"
 krcw_eng_30_d:0 "The 1947 Dublin Accord returned Northern Ireland to Ireland as one condition for Ireland joining the Internationale. Now workers in Glasgow realize: Protestants could be \"sold out.\" What about Scotland?"
 krcw_eng_30.a:0 "It was a necessary compromise"
 krcw_eng_30.b:0 "We should not have abandoned comrades"
 krcw_eng_31_t:0 "Glasgow's Discontent"
 krcw_eng_31_d:0 "The Glasgow trades council passes a resolution demanding the Federal Congress guarantee Scottish autonomy and \"never treat Scotland as Northern Ireland was treated.\"\n\nThe resolution does not mention \"independence,\" but everyone hears the subtext."
 krcw_eng_31.a:0 "Reaffirm Scotland's place"
 krcw_eng_31.b:0 "Warn Glasgow"
 krcw_ita_1_t:0 "Noli in Rome"
 krcw_ita_1_d:0 "In 1943 the Socialist Republic crossed the Adriatic, overthrew King Zog and put Fan Noli in power. A year later the Yugoslav and Greek juntas drove the Italians back across the sea, Zog returned under Russian protection, and Noli went into exile in Rome. The Albanian exile committee asks Rome to back the guerrillas against Zog in the mountains; the leadership of the General Confederation of Labour fears it would bring the Moscow Accord's armies to the far side of the Strait of Otranto."
 krcw_ita_1.a:0 "Give the exiles shelter, not guns"
 krcw_ita_1.b:0 "Arm the exiles quietly"
 krcw_ita_2_t:0 "The Far Shore of the Adriatic"
 krcw_ita_2_d:0 "The Yugoslav junta controls the Dalmatian coast, once Venetian, and in 1944 it was the junta that drove the Italians out of Albania. Some in Rome begin to say that Dalmatia and Albania should both be Italian.\n\nDi Vittorio replies at the trades congress: the Internationale does not expand by conquest."
 krcw_ita_2.a:0 "We are not fascists"
 krcw_ita_2.b:0 "But Dalmatia is Italian"
 krcw_wgr_1_t:0 "The Front on the Elbe"
 krcw_wgr_1_d:0 "The Elbe is the line between the Internationale and the Moscow Accord, and the border guards of the West German Syndicalist Republic see Russian tanks across the river every day. Thälmann says in Hamburg: the Elbe is not a line of division but a line of defence — we guard the western bastion of the workers' revolution."
 krcw_wgr_1.a:0 "Hold the Elbe"
 krcw_wgr_1.b:0 "We do not want war with Russia"
 krcw_wgr_2_t:0 "The West Berlin Enclave"
 krcw_wgr_2_d:0 "West Berlin is a syndicalist enclave ringed by wire and checkpoints in the heart of the Moscow Accord. Every Berlin crisis makes Hamburg nervous: will Russia really cut the corridors?\n\nThälmann says: as long as West Berlin workers fly the red flag, we will not abandon it."
 krcw_wgr_2.a:0 "West Berlin is non-negotiable"
 krcw_wgr_2.b:0 "We should seek compromise"
 krcw_wgr_3_t:0 "The Austrian Question"
 krcw_wgr_3_d:0 "Western Austria is the socialist republic in Salzburg, a member of the Internationale; Vienna, Lower Austria and Burgenland are in Russian hands. Some in the Republic's congress ask: German workers should be united, why not let Austria join West Germany?\n\nThälmann's answer is cautious: the Austrians have not decided whether they want union, and Moscow will not let Vienna come with them."
 krcw_wgr_3.a:0 "Wait for the Austrians to decide"
 krcw_wgr_3.b:0 "We should push for union"
 krcw_can_1_t:0 "The Throne in Australia"
 krcw_can_1_d:0 "The Entente has been in exile in Australia for over a decade, and now Australia's Menzies begins to ask: if the King resides in Canberra, why should Canada take orders from Australia?\n\nOttawa's Conservative MPs reply: the Entente is one body, and the King's residence does not mean a transfer of suzerainty."
 krcw_can_1.a:0 "The Entente is an equal alliance"
 krcw_can_1.b:0 "Canada is the core of the Entente"
 krcw_can_2_t:0 "Quebec's Discontent"
 krcw_can_2_d:0 "Quebec's French-speaking population has never truly embraced the Entente cause — they see it as an English war. Now Quebec nationalists begin to ask: if the Combined Syndicates can build their own state, why not Quebec?\n\nOttawa's response is to strengthen French-language education and cultural autonomy, but will this satisfy Quebec?"
 krcw_can_2.a:0 "Strengthen Quebec autonomy"
 krcw_can_2.b:0 "Reaffirm Canadian unity"
 krcw_can_3_t:0 "Supplying the Combined Syndicates"
 krcw_can_3_d:0 "Canada has been supplying the Combined Syndicates in the eastern United States — mainly food and industrial goods. The Conservatives say this is investing in a future ally, but the Liberals question: why are we helping socialists?"
 krcw_can_3.a:0 "Continue the supply"
 krcw_can_3.b:0 "Reduce the supply"
 krcw_jap_1_t:0 "The Voice of Revanchism"
 krcw_jap_1_d:0 "Japan lost Manchuria and Korea in the Second World War but kept Taiwan, Micronesia and the Kurils. Now hardliners in the Diet begin to ask: why do we not reclaim Manchuria?\n\nKishi's answer is realistic: because Russia will not allow it, and we are not ready for war with Russia."
 krcw_jap_1.a:0 "Build strength first"
 krcw_jap_1.b:0 "Abandon revanchism"
 krcw_jap_2_t:0 "The Pressure for Democratization"
 krcw_jap_2_d:0 "Japanese liberals and socialists begin to ask: the war is over, why do we still maintain a militarist system? The Diet should have real power, not just rubber-stamp the military.\n\nKishi's position is clear: Japan needs a strong government, not weak parliamentary politics."
 krcw_jap_2.a:0 "Maintain the status quo"
 krcw_jap_2.b:0 "Limited democratization"
 krcw_jap_3_t:0 "Governing Taiwan"
 krcw_jap_3_d:0 "Taiwan has been under Japanese rule for fifty years. Some Taiwanese want independence, some want to return to China, and some accept Japanese rule but demand more autonomy.\n\nKishi's policy is \"imperialization\" — turning Taiwanese into Japanese. But will it succeed?"
 krcw_jap_3.a:0 "Continue imperialization"
 krcw_jap_3.b:0 "Grant Taiwan more autonomy"
 krcw_jap_4_t:0 "The Micronesian Mandate"
 krcw_jap_4_d:0 "Japan kept the Micronesian mandate after the war — the Marshalls, Carolines and Marianas. These islands are strategically important but economically a burden.\n\nSome in the Diet ask: why do we spend money on these useless islands?"
 krcw_jap_4.a:0 "These islands are strategic"
 krcw_jap_4.b:0 "Reduce spending on the islands"
 krcw_tur_1_t:0 "Sovereignty over the Straits"
 krcw_tur_1_d:0 "The Bosphorus and Dardanelles are the only passage for the Russian Black Sea Fleet to the Mediterranean. Moscow demands Turkey guarantee free passage, but Ankara's junta believes: the Straits are Turkish territory, and we have the right to close them."
 krcw_tur_1.a:0 "Uphold Turkish sovereignty"
 krcw_tur_1.b:0 "Compromise with Moscow"
 krcw_tur_2_t:0 "The Lost Arab Provinces"
 krcw_tur_2_d:0 "Turkey lost Syria, Iraq and Arabia in the First World War. Now pan-Turkists in the junta begin to say: we should expand east, not south — the Turks of Central Asia are our brothers.\n\nMarshal Çakmak's answer is cautious: we do not have the strength to confront Russia."
 krcw_tur_2.a:0 "Abandon the Arab dream"
 krcw_tur_2.b:0 "We will return one day"
 krcw_gre_1_t:0 "Partisans in the Pindus"
 krcw_gre_1_d:0 "The Greek civil war ended in 1945, but remnants of the Democratic Army guerrillas remain in the Pindus. They hide in the mountains of Epirus, get their ammunition by sea, and occasionally raid government outposts.\n\nMarshal Papagos says: as long as the Epirus coast stays open, the guerrillas will not disappear."
 krcw_gre_1.a:0 "Continue the pacification"
 krcw_gre_1.b:0 "Propose amnesty"
 krcw_gre_2_t:0 "The Otranto Boats"
 krcw_gre_2_d:0 "The guerrillas' ammunition comes from Italian ports: fishing boats leave Brindisi and Otranto by night and unload in the coves of Epirus. Athens demands that Rome stop the boats; Rome replies that they are private vessels and the government has no part in it."
 krcw_gre_2.a:0 "Pressure Rome"
 krcw_gre_2.b:0 "Accept the status quo"
 krcw_gre_10_t:0 "Greek Protest"
 krcw_gre_10_d:0 "Athens formally protests to Rome: Italian ports are shipping ammunition to the Greek guerrillas, a violation of Greek sovereignty.\n\nDi Vittorio replies: Italy cannot police every fishing boat."
 krcw_gre_10.a:0 "That is the fishermen's affair"
 krcw_yug_1_t:0 "The Junta's Legitimacy"
 krcw_yug_1_d:0 "The Yugoslav junta overthrew Prince Paul in 1945, and General Simović became head of state. The junta claims to be temporary, but seven years have passed with no sign of restoring parliamentary politics.\n\nIntellectuals in Belgrade begin to ask: when will we have real elections?"
 krcw_yug_1.a:0 "Maintain the junta"
 krcw_yug_1.b:0 "Promise to restore parliament"
 krcw_yug_2_t:0 "The Macedonian Question"
 krcw_yug_2_d:0 "Macedonia has always been disputed between Yugoslavia, Bulgaria and Greece. Now hardliners in Belgrade begin to say: Macedonia is Yugoslav, and we should recognize the Macedonian nation domestically.\n\nBut this will anger Bulgaria and Greece, both members of the Moscow Accord."
 krcw_yug_2.a:0 "Recognize the Macedonian nation"
 krcw_yug_2.b:0 "Maintain the status quo"
 krcw_ent_tree:0 "krcw_ent_tree"
 krcw_ent_dominion_partner:0 "Dominion Partner"
 krcw_ent_the_old_flag:0 "The Old Flag"
 krcw_ent_pacific_understanding:0 "A Pacific Understanding"
 krcw_ent_colonial_grievance:0 "A Colonial Grievance"
 krcw_ent_the_court_in_melbourne:0 "The Court at Melbourne"
 krcw_ent_the_court_in_melbourne_desc:0 "The King lives in a borrowed house outside Melbourne and the Privy Council meets on the first floor of the town hall. The court in exile gave Australia something it never asked for: the legitimacy of the entire old world. It also gave Australia a bill — for a household without a realm, and for a company of old men who still call themselves ministers."
 krcw_ent_dominion_of_our_own:0 "A Dominion of Our Own"
 krcw_ent_dominion_of_our_own_desc:0 "The Privy Council moves to Canberra, but the budget is settled by an Australian parliament. The King is still King — only now he is King of Australia, not an exile waiting to return to London. For the first time in thirty years the country exists for its own sake."
 krcw_ent_the_restoration_project:0 "The Restoration Project"
 krcw_ent_the_restoration_project_desc:0 "There is a plan in the staff safe: an expeditionary force, a landing, a proclamation of restoration signed by the Crown. The generals know it cannot be done, the ministers know the generals know, and nobody dares propose burning it — because to burn it is to admit that Britain is no longer theirs."
 krcw_ent_the_australian_republic:0 "The Australian Republic"
 krcw_ent_the_australian_republic_desc:0 "The referendum carries by a narrow margin. The court removes itself, with dignity, to New Zealand — or back where it came from; the papers are vague. Australia becomes a republic: a Pacific country with neither the burden nor the halo of history."
 krcw_ent_the_wool_cheque:0 "The Wool Cheque"
 krcw_ent_the_wool_cheque_desc:0 "Wool, wheat, iron ore: the Antipodes sell what other men make clothes and machines from. Both blocs need it, which is Canberra's one piece of leverage and its deepest weakness — a country that sells raw material never sets its own price."
 krcw_ent_southern_industry:0 "Industry in the South"
 krcw_ent_southern_industry_desc:0 "If either bloc might one day blockade the South Pacific, then steel, machine tools and ammunition must be made at Newcastle and Whyalla. The programme is dear and slow, and for the first time it makes Australia something other than a sheep run."
 krcw_ent_the_island_mandates:0 "The Island Mandates"
 krcw_ent_the_island_mandates_desc:0 "Fiji, the Solomons, the New Hebrides, Nauru — the islands the Germans and the British left behind are now administered from Canberra. The Conference of Young Nations names it every year, and the island councils have learned to quote the Internationale's declarations back at the Governor."
 krcw_ent_the_pacific_commonwealth:0 "The Pacific Commonwealth"
 krcw_ent_the_pacific_commonwealth_desc:0 "The mandates become members. Fiji, the Solomons and Samoa send delegates to a common federal council and Canberra turns from Governor into chairman. It makes the Antipodes no richer, but it makes the South Pacific, for the first time, a \"we\"."
 krcw_ent_open_the_gates:0 "Open the Gates"
 krcw_ent_open_the_gates_desc:0 "The White Australia policy is repealed. The first ships bring Indians fleeing famine, Japanese fleeing conscription, Persians fleeing Russian advisers. There is trouble in the streets, there are hands in the factories, and within a generation the country no longer looks like itself."
 krcw_ent_fortress_antipodes:0 "Fortress Antipodes"
 krcw_ent_fortress_antipodes_desc:0 "The lesson of Singapore is that depending on a fleet which is not here is the same as having none. The Antipodean navy is built around convoys, minesweeping and ocean patrol — not for a decisive battle, but so that nobody may land here at leisure."
 krcw_ent_the_crown_in_exile:0 "Settle the Crown in Exile"
 krcw_ent_the_crown_in_exile_desc:0 "Twice exiled, the Windsors have settled in Melbourne. Australasia maintains a court without a country and old generals still planning the recovery of Britain."
 krcw_ent_the_privy_council:0 "The Privy Council"
 krcw_ent_the_privy_council_desc:0 "The cabinet of the government-in-exile and the cabinet of Australia meet twice a week in the same building, and nobody can say which is the real government. Menzies proposes to settle a smaller question first: who pays for the court?"
 krcw_ent_the_restoration_committee:0 "The Restoration Committee"
 krcw_ent_the_restoration_committee_desc:0 "Set up a Restoration Committee to maintain the exiled administration, train an expeditionary force and look for loyalists inside Britain. It is expensive."
 krcw_ent_the_canberra_settlement:0 "The Canberra Settlement"
 krcw_ent_the_canberra_settlement_desc:0 "The King keeps the throne and the ceremonial, the exiled ministers take pensions and stop signing decrees, and budget and foreign policy pass to the Australian parliament. The crown becomes Australia's."
 krcw_ent_the_republican_petition:0 "Receive the Republican Petition"
 krcw_ent_the_republican_petition_desc:0 "The Sydney unions, the Melbourne students and a part of the Labor benches sign a petition: an exiled king cannot represent a Pacific country. They demand a referendum. The Crown's partisans call it treason, and in a month the signatures grow from thirty thousand to four hundred thousand."
 krcw_ent_the_exile_ministries:0 "The Exile Ministries"
 krcw_ent_the_exile_ministries_desc:0 "The exiled Colonial Office, India Office and Admiralty go on working, though everything they administer has passed out of the Crown's hands. These offices hold the Empire's entire archive, its rolls and its maps — and if the day ever comes to return, this paper is the only title."
 krcw_ent_the_loyal_diaspora:0 "Resettle the Loyalist Émigrés"
 krcw_ent_the_loyal_diaspora_desc:0 "Old officials, old officers and old landowners arrive from Britain, Canada and South Africa. They bring experience, resentment and a superiority that grates on Australian ears — and they are also the only ready-made cadre the country has."
 krcw_ent_plan_albion:0 "Plan Albion"
 krcw_ent_plan_albion_desc:0 "Revise Plan Albion for the recovery of Britain. It needs an expeditionary force, unrest within the Internationale, and the acquiescence of at least one great power."
 krcw_ent_an_australian_citizenship:0 "An Australian Citizenship"
 krcw_ent_an_australian_citizenship_desc:0 "Until now the inhabitants of this country were in law \"British subjects\" — subjects of a state that no longer exists. The new nationality act writes the words \"Australian citizen\" and \"New Zealand citizen\" for the first time."
 krcw_ent_the_anzac_union:0 "The ANZAC Union"
 krcw_ent_the_anzac_union_desc:0 "Australia and New Zealand sign a treaty of union: a common tariff, a common defence, a common passport. The quarrels across the Tasman do not end, but for the first time the two dominions treat each other as the only wholly reliable partner either has."
 krcw_ent_tree_lean_p5_tt:0 "Canberra leans towards Paris: §G+5§!"
 krcw_ent_a_pacific_nation:0 "Rewrite the National Curriculum"
 krcw_ent_a_pacific_nation_desc:0 "The textbooks are rewritten: Australian history no longer begins with Captain Cook in 1770 but with the continent itself, and in geography the most important neighbours are no longer London but Jakarta, Manila and Nanjing. The country admits at last where it actually is."
 krcw_ent_the_referendum:0 "The Referendum"
 krcw_ent_the_referendum_desc:0 "Polling day is a Saturday. The Crown does not intervene openly, but every church noticeboard and every conservative front page reminds the voter: without the crown, what is left of us?"
 krcw_ent_tree_lean_p10_tt:0 "Canberra leans towards Paris: §G+10§!"
 krcw_ent_the_new_constitution:0 "The New Constitution"
 krcw_ent_the_new_constitution_desc:0 "The republic's constitution is drafted at Canberra. It keeps the parliament, the federation and the common law, and changes only the head of state from an inherited king to an elected president. Opponents say it is merely a new signboard; its supporters answer that the signboard was the whole point."
 krcw_ent_a_clean_slate:0 "Draft a New Constitution"
 krcw_ent_a_clean_slate_desc:0 "The republic carries neither the Empire's debts nor the Empire's enemies. It can trade with the Internationale and trade with Moscow alike, because it no longer represents anything that was overthrown. It is the one thing Canberra has not had in thirty years: a clean record."
 krcw_ent_the_lesson_of_singapore:0 "Build an Independent Navy"
 krcw_ent_the_lesson_of_singapore_desc:0 "In 1942 the relief Australia waited for never came, because the empire that was to send it no longer existed. The Admiralty wrote the affair up in an eight-page report whose conclusion runs to one sentence: from now on we may count only on the ships moored in our own harbours."
 krcw_ent_the_royal_australian_navy:0 "The Royal Australian Navy"
 krcw_ent_the_royal_australian_navy_desc:0 "The fleet is badly aged. The Cockatoo Island yard begins building its own frigates and minesweepers to guard the Tasman and Coral Seas."
 krcw_ent_the_coast_watchers:0 "The Coast Watchers"
 krcw_ent_the_coast_watchers_desc:0 "A few hundred volunteers with wireless sets are scattered along the coasts from Darwin to the Solomons. They cannot fight, but any fleet meaning to approach the Antipodes unseen must first hunt them down one by one."
 krcw_ent_the_anzac_divisions:0 "The ANZAC Divisions"
 krcw_ent_the_anzac_divisions_desc:0 "The veterans of two world wars remain, and so does the tradition. The new standing army is small, but it trains to the standard of fighting on other men's continents — the one thing the Antipodes have ever really exported."
 krcw_ent_the_raaf:0 "The Air Force"
 krcw_ent_the_raaf_desc:0 "Australia cannot afford strategic bombers, but it can build trainers, patrol aircraft and transports. Distance is this country's greatest enemy and its best defence, and the answer to distance is the aeroplane."
 krcw_ent_the_southern_shipyards:0 "Expand the Southern Shipyards"
 krcw_ent_the_southern_shipyards_desc:0 "The yards at Cockatoo Island, Williamstown and Auckland are enlarged. They still cannot build a battleship, but they can repair anything that steams into the South Pacific — which is itself a kind of power."
 krcw_ent_the_wool_clip:0 "Centralise the Wool Exports"
 krcw_ent_the_wool_clip_desc:0 "One jumper in every three in the world comes off an Australian sheep's back. Both blocs need the clip, which puts a card in Canberra's hand for the first time — though the buyers still set its price."
 krcw_ent_the_wheat_belt:0 "The Wheat Belt"
 krcw_ent_the_wheat_belt_desc:0 "The wheatlands of South and Western Australia double. There are many hungry places in the world, and even more places willing to pay hard currency for grain."
 krcw_ent_the_pilbara_iron:0 "The Iron Ore"
 krcw_ent_the_pilbara_iron_desc:0 "The iron of Western Australia is all but inexhaustible, and it lies nearer to Japan's steelworks than to anyone else's. The question is not whether to dig it but whom to sell it to — and whether to sell ore or steel."
 krcw_ent_newcastle_steel:0 "Build the Newcastle Steelworks"
 krcw_ent_newcastle_steel_desc:0 "A country that sells ore is always poorer than the country that buys it. The furnaces at Newcastle and Whyalla are lit: the first time Australia decides to turn its own ore into steel."
 krcw_ent_the_snowy_scheme:0 "The Snowy Scheme"
 krcw_ent_the_snowy_scheme_desc:0 "Turn the rivers of the Snowy Mountains through the range to irrigate the inland, and generate power on the way. It is the largest work in the country's history, and half the gangs on it came off the boats last year."
 krcw_ent_the_national_university:0 "The National University"
 krcw_ent_the_national_university_desc:0 "The National University opens at Canberra. Its physics department recruits scholars who fled Britain and Central Europe — men with nowhere left to go at home, and here given a laboratory."
 krcw_ent_new_markets:0 "Open Asian Markets"
 krcw_ent_new_markets_desc:0 "The British market is gone and so are the imperial preferences. Trade missions go to Nanjing, Jakarta, Tokyo and San Francisco: Australia must learn to sell to Asia."
 krcw_ent_the_island_administration:0 "The Island Administration"
 krcw_ent_the_island_administration_desc:0 "Fiji, the Solomons, the New Hebrides, Nauru, New Britain — the islands the Germans and the British left are administered from Canberra. The Governors' reports say the same thing year after year: the phosphate pays, the schools are too few, and the island councils are beginning to ask questions."
 krcw_ent_nauru_phosphate:0 "Mine the Nauru Phosphate"
 krcw_ent_nauru_phosphate_desc:0 "The whole island of Nauru is very nearly one block of phosphate, and phosphate is the lifeblood of the wheat belt. The islanders receive a token royalty and a home dug hollow — a matter the Conference of Young Nations raises every year."
 krcw_ent_the_island_councils:0 "The Island Councils"
 krcw_ent_the_island_councils_desc:0 "The councils of Fiji and the Solomons demand real power: their own budgets, their own magistrates, their own schools. Canberra may repress or may concede, and the cost of repression rises every year."
 krcw_ent_the_pacific_commonwealth_f:0 "The Pacific Commonwealth"
 krcw_ent_the_pacific_commonwealth_f_desc:0 "The mandates become members. Delegates from Fiji, the Solomons and Samoa enter a common federal council, and Canberra turns from Governor into chairman. For the first time the Conference of Young Nations praises the Antipodes — and the phosphate royalty triples."
 krcw_ent_the_colour_line:0 "Review the White Australia Policy"
 krcw_ent_the_colour_line_desc:0 "White Australia has been the country's consensus for forty years: a small European society holding an empty continent with a thousand million Asians to the north. But Europe no longer wants them, and the countries to the north are becoming their only customers."
 krcw_ent_populate_or_perish:0 "Populate or Perish"
 krcw_ent_populate_or_perish_desc:0 "Eight million people cannot hold a continent. The immigration minister's slogan is blunt: populate or perish. The first to come are those fleeing the ruins of Europe — and they are nowhere near enough."
 krcw_ent_the_open_door:0 "The Open Door"
 krcw_ent_the_open_door_desc:0 "The bill repealing White Australia passes by three votes. It is the least popular and most far-sighted division in the country's history: it concedes that Australia lies in Asia, and not on the edge of Europe."
 krcw_ent_a_new_australia:0 "Open Immigration"
 krcw_ent_a_new_australia_desc:0 "A generation later twenty languages are spoken in the streets of Melbourne. The country is no longer a fragment of Britain but a Pacific nation of immigrants — and the conservatives have never forgiven those three votes."
 krcw_ent_between_the_blocs:0 "Pursue a Non-Aligned Policy"
 krcw_ent_between_the_blocs_desc:0 "The Internationale's envoys come by sea from the west, Moscow's attachés by sea from the north, and Washington — both Washingtons — send men to ask the same question: which side are you on? Canberra's answer has always been: we are on the southern side."
 krcw_ent_tree_lean_p15_tt:0 "Canberra leans towards Paris: §G+15§!"
 krcw_ent_talks_with_paris:0 "Talks with Paris"
 krcw_ent_talks_with_paris_desc:0 "Send a delegation to Paris to discuss arms, shipping and the terms for closing our ports to the Russian fleet. The Internationale needs South Pacific harbours, and Canberra needs an ally that does not ask the Crown to abdicate. The royalists call it bowing to the revolutionaries."
 krcw_ent_the_wool_and_the_ledger:0 "The Wool and the Ledger"
 krcw_ent_the_wool_and_the_ledger_desc:0 "To join the Paris Clearing Union means a steady market and cheap credit, at the price of surrendering pricing power to a committee of syndicates. The graziers do the arithmetic through gritted teeth and find they have no choice."
 krcw_ent_a_seat_at_the_congress:0 "Join the Internationale as an Associate"
 krcw_ent_a_seat_at_the_congress_desc:0 "The Antipodes enter the Internationale's congress as an \"associated state\" — not a member, surrendering no sovereignty, but seated at the table. For thirty years the exiles have been only exiles; now they are a country with a vote."
 krcw_ent_tree_lean_m15_tt:0 "Canberra leans towards Moscow: §R-15§!"
 krcw_ent_arms_from_moscow:0 "Buy Russian Arms"
 krcw_ent_arms_from_moscow_desc:0 "Savinkov's Russia never talks ideology, only price. Its tanks are cheap, its advisers correct, and not one word of its terms mentions trade unions — an irresistible temptation to a government afraid of its own left."
 krcw_ent_the_darwin_mission:0 "The Darwin Mission"
 krcw_ent_the_darwin_mission_desc:0 "A Russian military mission takes up residence at Darwin. They train the Antipodean army and, in passing, note down every unreliable union leader. Anti-syndicalism binds two regimes that have nothing else in common."
 krcw_ent_the_accord_guarantee:0 "Accept the Accord's Guarantee"
 krcw_ent_the_accord_guarantee_desc:0 "Moscow offers a defence guarantee: any attack on the Antipodes shall be treated as an attack on the Accord. The price is that the ports of Darwin and Fremantle open to the Russian Pacific Fleet. The exiled Crown becomes a protectorate of Black Russia."
 krcw_ent_the_southern_cross:0 "Assert a South Pacific Identity"
 krcw_ent_the_southern_cross_desc:0 "Surrender the Crown to neither Paris nor the ports to Moscow. The third road is the hardest, for it asks a country of eight million to stand alone between two giants — but it is the only road that sells nothing."
 krcw_ent_the_canberra_initiative:0 "Convene the Canberra Maritime Defence Conference"
 krcw_ent_the_canberra_initiative_desc:0 "Invite the Pacific rim states outside both blocs to Canberra to divide the patrol of the sea lanes and agree how to report submarine movements. The Navy Office is behind it; no state will give up command of its own ships."
 krcw_ent_the_pacific_pact:0 "Sign the Pacific Mutual Defence Pact"
 krcw_ent_the_pacific_pact_desc:0 "Canberra, Wellington and Sacramento agree that an attack on any one's territory or sea lanes brings the others to consult and send ships. The pact makes pressure in the South Pacific harder for both blocs, at the price of Antipodean ships for other people's coasts."
 krcw_ent_the_armed_neutral:0 "The Armed Neutral"
 krcw_ent_the_armed_neutral_desc:0 "Neutrality is not weakness. The Antipodes declare: take no side, but let no one land here at leisure. The fleet, the air force, the coast watchers and the home divisions are woven into a net that makes swallowing this continent look, to any great power, not worth the cost."
 krcw_ent_the_woomera_range:0 "The Woomera Range"
 krcw_ent_the_woomera_range_desc:0 "Build a rocket range at Woomera in the South Australian desert, run jointly by the army and the Melbourne University physics department. The Internationale, Moscow and the Constitutional Coalition all send people to find out what happens here, and the land around the range is closed off."
 krcw_ent_the_lucas_heights:0 "The Lucas Heights Reactor"
 krcw_ent_the_lucas_heights_desc:0 "A research reactor rises outside Sydney. Australia builds no bomb — it has neither the money nor the need — but it means to ensure that if the day ever comes, it knows how."
 krcw_ent_the_southern_hemisphere:0 "Keep the Bomb Within Reach"
 krcw_ent_the_southern_hemisphere_desc:0 "Lucas Heights and the Woomera trials are kept running and the uranium reserves and engineering drawings made state secrets, so that Australia could build a bomb within a year if it had to. Defence wants it; the Treasury says it is paying for a weapon that will never be built."
 krcw_ent_20_t:0 "Whose Government?"
 krcw_ent_20_d:0 "Two cabinets meet in one building. The exile ministers sign decrees concerning India, Malaya and West Africa — places that stopped listening long ago; the Australian ministers pay for the paper.\n\nMenzies puts the question on the table: are we a colony maintaining a court in exile, or a country that happens to possess a king?"
 krcw_ent_20.a:0 "The Crown's cause is our cause"
 krcw_ent_20.b:0 "Australia's business first"
 krcw_ent_20.c:0 "Let the people answer it"
 krcw_ent_22_t:0 "The Petition"
 krcw_ent_22_d:0 "Four hundred thousand signatures arrive at Government House. The Sydney wharfies, the Melbourne students, the Perth miners — their demand is one sentence: let Australians decide who is Australia's head of state.\n\nThe Crown's partisans remind the government that a referendum may tear the country apart, and that whatever the result, both blocs will see the Antipodes' weakness."
 krcw_ent_22.a:0 "Hold the referendum"
 krcw_ent_22.b:0 "Shelve it, and promise reform"
 krcw_ent_tree_lean_m25_tt:0 "Canberra leans towards Moscow: §R-25§!"
 krcw_ent_24_t:0 "Plan Albion"
 krcw_ent_24_d:0 "The plan lies on the staff table: three divisions, forty transports, a landing in south-west England and an annex assuming the British will rise to meet them.\n\nThe Admiral observes that this fleet cannot cross the Indian Ocean unescorted. The General observes that even a successful landing would be driven back into the sea by the Internationale's armour within a fortnight. The King asks one question: if we never try, how will history write us?"
 krcw_ent_24.a:0 "Lock the plan back in the safe"
 krcw_ent_24.b:0 "Continue preparing, and wait"
 krcw_ent_24.c:0 "Seek a Russian escort"
 krcw_ent_26_t:0 "The Eve of the Poll"
 krcw_ent_26_d:0 "Tomorrow is polling day. The Crown does not intervene openly, but the church noticeboards and the conservative papers are on its side. Republican meetings fill every hall in the working districts of Sydney, Melbourne and Newcastle and draw nobody in the country.\n\nAll the cabinet can still decide is what the government itself does on the last day. The voters decide the rest."
 krcw_ent_26.a:0 "The government campaigns openly for the republic"
 krcw_ent_26.b:0 "The government stays neutral and leaves it to the voters"
 krcw_ent_27_t:0 "The Count: A Republic"
 krcw_ent_27_d:0 "The count takes three days. The rural divisions are all but unanimous for the Crown; the working districts of Sydney, Melbourne and Newcastle are the opposite. The republicans carry it by under two per cent.\n\nThe royal household issues a statement from Melbourne saying it respects the result. The no voters are concentrated in the rural divisions, whose members will still form a large bloc in the next parliament."
 krcw_ent_27.a:0 "Declare the republic"
 krcw_ent_29_t:0 "The Count: The Crown"
 krcw_ent_29_d:0 "The count takes three days. The rural divisions are all but unanimous for the Crown; the working districts of Sydney, Melbourne and Newcastle are the opposite. The Crown keeps its throne by under two per cent.\n\nThe republican leader concedes outside Sydney Town Hall and says the question will not go to a vote again within ten years."
 krcw_ent_29.a:0 "Accept the result"
 krcw_ent_28_t:0 "The Demand of the Island Councils"
 krcw_ent_28_d:0 "The councils of Fiji, the Solomons and the New Hebrides submit a joint document. It is courteously written and perfectly clear: the mandates want their own budgets, their own magistrates, their own schools — and a date.\n\nThe Conference of Young Nations has already put the matter on its agenda. Canberra may delay, may repress, or may decide for itself before someone else decides for it."
 krcw_ent_28.a:0 "Grant self-rule, and move toward federation"
 krcw_ent_28.b:0 "Maintain the Governors"
 krcw_ent_28.c:0 "Share the phosphate revenue"
 krcw_ent_30_t:0 "The Colour Line"
 krcw_ent_30_d:0 "The immigration minister's report states two contradictory facts: the country needs people or it cannot hold the continent; and the country's law forbids it to accept the only people willing to come in numbers.\n\nTo the north, China and Indonesia have named White Australia in international forums. And the Australian unions — historically the policy's staunchest defenders — are divided for the first time."
 krcw_ent_30.a:0 "Recruit from Europe only"
 krcw_ent_30.b:0 "Open a quiet crack in the door"
 krcw_ent_30.c:0 "Repeal White Australia"
 krcw_ent_south_seas_category:0 "The South Seas Office"
 krcw_ent_south_seas_category_desc:0 "The day-to-day administration of Fiji, the Solomons, the New Hebrides, Nauru and New Guinea — phosphate, schools, island councils, and one annual reprimand from the Conference of Young Nations."
 krcw_ent_island_schools:0 "The Island Schools Programme"
 krcw_ent_island_schools_desc:0 "A secondary school in every island group. In twenty years their graduates will sit on the island councils — which is both an investment and a risk."
 krcw_ent_phosphate_quota:0 "Raise the Phosphate Quota"
 krcw_ent_phosphate_quota_desc:0 "The wheat belt needs fertiliser and the Nauru workings can go faster yet. The islanders' letters of protest will reach Canberra, but the harvest does not wait."
 krcw_ent_island_patrol:0 "The Island Patrol"
 krcw_ent_island_patrol_desc:0 "Frigates work back and forth between Fiji and the Solomons. Half their duty is against smugglers, and half is to remind the islands that Canberra is still there."
 krcw_ent_answer_the_conference:0 "Answer the Conference of Young Nations"
 krcw_ent_answer_the_conference_desc:0 "The annual reprimand must be answered. One may rebut it, ignore it, or announce a timetable for decolonisation — the last hurts most and works best."
 krcw_ent_pacific_scholarships:0 "Pacific Scholarships"
 krcw_ent_pacific_scholarships_desc:0 "Send island and Asian students to the universities of Sydney and Wellington. In twenty years they will be ministers in Jakarta, Suva and Port Moresby."
 AST_krcw_the_king_in_exile:0 "The King in Exile"
 AST_krcw_the_king_in_exile_desc:0 "He left London with his family at twelve and left Ottawa at twenty. He is now King of Australia, King of New Zealand, and King of a Britain that does not exist. He never speaks publicly of the third, but at every meeting of the Privy Council the empty chair is set out all the same."
 AST_krcw_restorationist_pm:0 "The Restorationist Premier"
 AST_krcw_restorationist_pm_desc:0 "He lost a leg at Gallipoli and his country in 1925. The whole purpose of his political life is to put the Crown back into Buckingham Palace one day. He knows it is impossible, and holds that a country which gives the aim up ceases to be that country."
 AST_krcw_dominion_pm:0 "The Dominion Premier"
 AST_krcw_dominion_pm_desc:0 "A lawyer pragmatic to the point of coldness. He keeps perfect courtesy toward the Crown while patiently moving every power of the government-in-exile into an Australian department. His maxim: \"We abolish nothing. We merely take it over.\""
 AST_krcw_republican_leader:0 "The Republican Leader"
 AST_krcw_republican_leader_desc:0 "A wharfie's son who came up as a union lawyer. His argument was never against the King personally but a simple question: by what right does a man born in London and raised in Ottawa represent a Pacific country?"
 AST_krcw_admiral:0 "The Fleet Commander"
 AST_krcw_admiral_desc:0 "In 1942 he commanded a cruiser for which no relief ever came. He spent the twenty years after establishing one principle: the Antipodean fleet fights for no distant empire, only for the sea lanes of the Tasman and the Coral Sea."
 NZL_krcw_dominion_pm:0 "The New Zealand Premier"
 NZL_krcw_dominion_pm_desc:0 "Wellington has always seen more clearly than Canberra: New Zealand is too small to live alone, and so must make Australia unable to do without it. He treats the union across the Tasman as a life's work, not a favour granted."
 NZL_krcw_conservative_pm:0 "The New Zealand Conservative"
 NZL_krcw_conservative_pm_desc:0 "He believes New Zealand's only security lies in the Crown and the old order. When Australia debates a republic he says publicly that if Melbourne will not have the King, Wellington will."
 AST_krcw_pacific_statesman:0 "The Pacific Statesman"
 AST_krcw_pacific_statesman_desc:0 "The first Australian premier to say aloud \"we are an Asian country\", for which the conservative press attacked him for a decade. The Canberra Conference, the nuclear-free declaration and the Pacific Pact all came out of his office."
 krcw_wgr_tree:0 "krcw_wgr_tree"
 krcw_wgr_german_brothers:0 "German Brothers"
 krcw_wgr_elbe_provocation:0 "Provocation on the Elbe"
 krcw_wgr_the_island_city:0 "The Island City"
 krcw_wgr_the_island_city_desc:0 "West Berlin lives inside the DDR on three air corridors and one railway. It is the Internationale's proudest exhibit and its most fragile hostage."
 krcw_wgr_the_elbe_watch:0 "The Elbe Watch"
 krcw_wgr_the_elbe_watch_desc:0 "From Luebeck to Passau a river splits Germany in two. Every division on this bank knows that in the first hour of a war they will hold alone."
 krcw_wgr_ruhr_reconstruction:0 "The Ruhr Reconstruction"
 krcw_wgr_ruhr_reconstruction_desc:0 "Half the Ruhr's furnaces came down in the bombing of 1943. The works councils rebuilt the other half from the salvaged girders, and this time the plants are theirs."
 krcw_wgr_council_democracy:0 "Council Democracy"
 krcw_wgr_council_democracy_desc:0 "Every workshop elects its council and every council sends delegates to the regional assembly. The meetings run longer than the shifts, but no one decides for the workers any more."
 krcw_wgr_front_militarisation:0 "Front Militarisation"
 krcw_wgr_front_militarisation_desc:0 "The pressure of the Elbe lies on every ministry: the railways run to military timetables, the factories keep wartime capacity in reserve, the young serve before they study."
 krcw_wgr_the_german_question:0 "The German Question"
 krcw_wgr_the_german_question_desc:0 "Two German governments and one German nation. Every negotiation in Berlin, every permit, every letter across the river is part of the question."
 krcw_wgr_austrian_provinces:0 "The Austrian Question"
 krcw_wgr_austrian_provinces_desc:0 "The Austrian republic in Salzburg is a member of the Internationale, and Vienna is still in Russian hands. Some in the Republic say the Austrians are Germans and belong in Germany; others say Austria was never part of Germany. The congress argues it out every year."
 krcw_wgr_the_republic_on_the_rhine:0 "Proclaim the German Socialist Republic"
 krcw_wgr_the_republic_on_the_rhine_desc:0 "In 1943 the Internationale's armour crossed the Rhine and the western half of the Empire changed flags within six months. Thälmann proclaimed the German Socialist Republic, the Internationale's front-line member in Europe, with Schleicher's army just to the east."
 krcw_wgr_the_moabit_generation:0 "Form the Moabit Leadership"
 krcw_wgr_the_moabit_generation_desc:0 "The party leadership came out of the imperial prisons: Thälmann, Kahle, Renn, Zaisser. They served ten years, and they carry both the trust and the grudges that a cell breeds."
 krcw_wgr_the_works_councils:0 "The Works Councils"
 krcw_wgr_the_works_councils_desc:0 "Every plant in the Ruhr has an elected council. It sets the production plan, allots the housing and settles quarrels between workers: here the state's authority grows from the bottom up."
 krcw_wgr_the_unity_congress:0 "The Unity Congress"
 krcw_wgr_the_unity_congress_desc:0 "The Communists, the Social Democratic left and the free unions merge at Dortmund into a United Workers' Party. The terms are simple: no second centre, and no second programme."
 krcw_wgr_denazify_the_civil_service:0 "Purge the Old Service"
 krcw_wgr_denazify_the_civil_service_desc:0 "The Empire's judges, headmasters and police captains still sit at their old desks. Without them the state cannot run; with them the revolution is only a word."
 krcw_wgr_the_succession_question:0 "Discuss Thälmann's Succession"
 krcw_wgr_the_succession_question_desc:0 "Thälmann was born in 1886 and ten years in Moabit ruined his health. No one in the party dares discuss the succession openly, yet everyone is counting votes: the council men, the officers of the front, or a centrist even Moscow could tolerate?"
 krcw_wgr_socialist_unification:0 "Socialist Unification"
 krcw_wgr_socialist_unification_desc:0 "There is only one road to unity: carry the revolution across the Elbe. Propaganda, strike funds, organisers slipping over the border — if Schleicher's state cracks from within, Germany will be one again under the red flag."
 krcw_wgr_the_neutral_federation:0 "Prepare to Unify Germany by Force"
 krcw_wgr_the_neutral_federation_desc:0 "The Politburo concludes that the Elbe will not be opened at a conference table. If the Accord moves on Berlin or begins to crack, the Republic's divisions cross the river. The line needs an army the budget cannot yet pay for."
 krcw_wgr_two_german_states:0 "Build the Western Model"
 krcw_wgr_two_german_states_desc:0 "Accept the facts: unification will not happen in this generation. Build the western republic into the Internationale's richest, freest and strongest member, and let the people on the other bank draw their own comparison."
 krcw_wgr_the_new_constitution:0 "The New Constitution"
 krcw_wgr_the_new_constitution_desc:0 "A constitution that writes the council system into the state: regional assemblies elect their executives, and the centre keeps only defence, foreign affairs and the plan. It is the most thoroughgoing federal experiment in the Internationale."
 krcw_wgr_the_berlin_lifeline:0 "The Berlin Lifeline"
 krcw_wgr_the_berlin_lifeline_desc:0 "Three air corridors, one railway, one canal. The flour, coal and medicine of two million West Berliners come through them, and every one of them crosses Schleicher's territory."
 krcw_wgr_the_airlift_standing_plan:0 "The Standing Airlift Plan"
 krcw_wgr_the_airlift_standing_plan_desc:0 "The Bread Bridge of 1949 will not be the last. The staff turns the airlift into a standing plan: runways, depots, weather stations and a dedicated transport force always ready."
 krcw_wgr_the_showcase_city:0 "The Showcase City"
 krcw_wgr_the_showcase_city_desc:0 "Concentrate new housing, universities, theatres and shops in West Berlin. The East Germans who come in on day passes take the comparison home with them."
 krcw_wgr_the_transit_agreement:0 "Set Up the Berlin Access Authority"
 krcw_wgr_the_transit_agreement_desc:0 "The authority logs every train, lorry and barge, records every East German obstruction and answers it with matching measures against DDR freight crossing the West. The transport ministry and the railway union supply the staff."
 krcw_wgr_the_city_garrison:0 "The City Garrison"
 krcw_wgr_the_city_garrison_desc:0 "Station a division in West Berlin. It cannot hold the city, and it makes any attack an act of war."
 krcw_wgr_berlin_is_not_negotiable:0 "Berlin Is Not Negotiable"
 krcw_wgr_berlin_is_not_negotiable_desc:0 "The government formally declares that the status of West Berlin is not open to negotiation. Moscow protests."
 krcw_wgr_the_workers_militia:0 "The Workers' Militia"
 krcw_wgr_the_workers_militia_desc:0 "A company to every factory, the weapons locked in the plant armoury and the key held by the shop assembly. This army cannot march abroad, but anyone who wants the Ruhr must take it street by street."
 krcw_wgr_the_elbe_fortifications:0 "The Elbe Fortifications"
 krcw_wgr_the_elbe_fortifications_desc:0 "From Lueneburg to Kassel the concrete runs along the bank. The staff's arithmetic is simple: hold seventy-two hours and the armour from Paris arrives."
 krcw_wgr_the_new_reichswehr:0 "The New Army"
 krcw_wgr_the_new_reichswehr_desc:0 "Half the old officer corps is on the east bank and half in prison. The new army's cadres come from the International Brigades, the Spanish veterans and the works councils: they understand politics and are learning war."
 krcw_wgr_the_panzer_question:0 "Develop a New Tank"
 krcw_wgr_the_panzer_question_desc:0 "Germany's tank bureaux are on the east bank, but half the drawings and engineers came across. Ruhr steel and Paris engines can make something that holds this river."
 krcw_wgr_the_air_umbrella:0 "The Air Umbrella"
 krcw_wgr_the_air_umbrella_desc:0 "Russian bombers are ninety minutes from Poland. The radar chain, the fighter wings and the flak must cover the Ruhr and Hamburg: the Internationale's second industrial heart in Europe."
 krcw_wgr_the_joint_command:0 "The Joint Command"
 krcw_wgr_the_joint_command_desc:0 "The French, British and German staffs share an office at Mainz. Who commands took three years to settle; the answer is that the front belongs to the Germans and the depth to the French."
 krcw_wgr_demilitarise_the_river:0 "Ask for French Divisions on the Elbe"
 krcw_wgr_demilitarise_the_river_desc:0 "The Republic asks the Internationale to station two French armoured divisions permanently at Lueneburg and Kassel, so that any attack across the Elbe is at once a war on the whole Internationale. Paris agrees; West Germany pays for the garrison."
 krcw_wgr_the_ruhr_rebuilt:0 "The Ruhr Rebuilt"
 krcw_wgr_the_ruhr_rebuilt_desc:0 "Relight the blast furnaces of Essen, Dortmund and Duisburg under the management of the works councils."
 krcw_wgr_the_rhineland_chemicals:0 "The Rhineland Chemicals"
 krcw_wgr_the_rhineland_chemicals_desc:0 "The works at Leverkusen and Ludwigshafen are the largest in Europe. A country without oilfields makes petrol, rubber and fertiliser out of coal."
 krcw_wgr_the_hamburg_yards:0 "The Hamburg Yards"
 krcw_wgr_the_hamburg_yards_desc:0 "The yards of Hamburg and Bremen cannot build battleships, but they can build freighters, trawlers and submarines. North Sea trade is this country's second lifeline."
 krcw_wgr_join_the_federations:0 "Join the Industrial Federations"
 krcw_wgr_join_the_federations_desc:0 "Surrender pricing and planning to the transnational federations in return for quotas, drawings and a market that cannot be blockaded. German industrial weight speaks loudly in those councils."
 krcw_wgr_the_reparations_question:0 "Pay the Reparations Through Exports"
 krcw_wgr_the_reparations_question_desc:0 "Who pays the Empire's reparations? The east bank says the capitalists; on the west bank there are no capitalists left. The Internationale's ruling: German workers will pay in exports."
 krcw_wgr_consumer_goods_first:0 "Consumer Goods First"
 krcw_wgr_consumer_goods_first_desc:0 "The works councils pass a resolution: pots, shoes and bicycles before tanks. The military objects; the councils have more votes than the military."
 krcw_wgr_the_german_laboratories:0 "Keep the Göttingen Physicists"
 krcw_wgr_the_german_laboratories_desc:0 "The physicists of Goettingen and Heidelberg stayed. They exchange data with Saclay and Harwell: in the Internationale's atomic programme the Germans handle theory."
 krcw_wgr_the_austrian_provinces:0 "Our Neighbour in Salzburg"
 krcw_wgr_the_austrian_provinces_desc:0 "In 1944 the Internationale's armies came over the Alps, and the western Austrian provinces formed a republic in Salzburg; Vienna is in Russian hands. Adler's government sends someone every month to talk about power, railways and the border. The Republic must first decide how it regards this neighbour."
 krcw_wgr_the_alpine_economy:0 "Connect the Alpine Hydro Plants"
 krcw_wgr_the_alpine_economy_desc:0 "The hydro stations of Tyrol and Salzburg are the best in Europe. With Austria in the Republic they can be wired into the German grid, and the Ruhr's furnaces can burn less coal."
 krcw_wgr_austria_united_tt:0 "Austria has joined the Republic"
 krcw_wgr_the_vienna_question:0 "Answer the Salzburg Delegation"
 krcw_wgr_the_vienna_question_desc:0 "Salzburg sends a formal delegation and asks the Republic to say where it stands: is Austria an independent country, or German land that will come back sooner or later? The delegation brings a second question too: if Vienna is ever freed, does it return to Austria or to Germany?"
 krcw_wgr_an_austrian_republic:0 "Recognise Austrian Independence"
 krcw_wgr_an_austrian_republic_desc:0 "The Republic recognises Austria as an independent member of the Internationale and gives up every claim to union. Salzburg can sit as an equal at the Internationale's meetings, and Moscow loses one argument that the Germans want to expand."
 krcw_wgr_greater_germany:0 "Invite Austria into the Republic"
 krcw_wgr_greater_germany_desc:0 "The Republic formally invites Austria to join the German Socialist Republic as a state. Austria's greater-German party has demanded union with Germany for decades; while the Danubian monarchy stood, it was only a slogan. Salzburg may accept or refuse."
 krcw_wgr_the_reckoning_with_the_empire:0 "Deal with the Imperial Legacy"
 krcw_wgr_the_reckoning_with_the_empire_desc:0 "Should the imperial colours come down in the museums? How should the schoolbooks tell 1914 and 1943? After defeat a nation must decide again who it is."
 krcw_wgr_demilitarise_the_schools:0 "Demilitarise the Schools"
 krcw_wgr_demilitarise_the_schools_desc:0 "Dissolve the gymnastic societies, rifle clubs and old youth leagues, replacing them with union youth groups and technical schools. The older generation largely objects."
 krcw_wgr_the_german_broadcast:0 "The German Broadcast"
 krcw_wgr_the_german_broadcast_desc:0 "Radio Cologne begins broadcasting to the east bank: news, music, and a programme answering letters from East German listeners. Schleicher's government starts jamming it."
 krcw_wgr_one_nation_two_states:0 "Found the Ministry for All-German Affairs"
 krcw_wgr_one_nation_two_states_desc:0 "The new ministry takes charge of broadcasting and publishing aimed at the DDR, refugee settlement and unification propaganda. The DDR calls it the Ministry of Subversion; its budget grows every year."
 krcw_wgr_congress_tt:0 "The next party congress elects the successor. The government's candidate is the favourite, not a certainty."
 krcw_wgr_10_t:0 "After Thälmann"
 krcw_wgr_10_d:0 "The doctors' report lies on the political secretary's desk with one conclusion: no more long speeches. Three forces move at once — the works councils want one of their own, the officers of the front want a man who understands war, and Paris would like someone it can telephone. The succession decides not one man's future but the republic's direction."
 krcw_wgr_10.a:0 "The councils' man: Wollenberg"
 krcw_wgr_10.b:0 "The soldier of the front: Kahle"
 krcw_wgr_10.c:0 "The writer and diplomat: Renn"
 krcw_wgr_11_t:0 "The Third Party Congress"
 krcw_wgr_11_d0:0 "Thälmann speaks for twenty minutes at the opening session and announces he will not stand again as political secretary. The delegates need three days and four ballots to choose his successor: Erich Wollenberg, the candidate of the works councils. In his first speech he says that the Republic's major decisions will go to the regional assemblies first."
 krcw_wgr_11_d1:0 "Thälmann speaks for twenty minutes at the opening session and announces he will not stand again as political secretary. The delegates need three days and four ballots to choose his successor: Hans Kahle, commander of the Elbe line. The delegates of the front divisions vote for him almost to a man. His first speech is about the Elbe and nothing else."
 krcw_wgr_11_d2:0 "Thälmann speaks for twenty minutes at the opening session and announces he will not stand again as political secretary. The delegates need three days and four ballots to choose his successor: Ludwig Renn, writer, former International Brigade officer and the German Paris knows best. His first speech mentions Paris twice and Moscow once."
 krcw_wgr_11.a:0 "Wollenberg becomes political secretary"
 krcw_wgr_11.b:0 "Kahle becomes political secretary"
 krcw_wgr_11.c:0 "Renn becomes political secretary"
 krcw_wgr_12_t:0 "The Price of Neutrality"
 krcw_wgr_12_d:0 "The federation proposal reaches Paris. The answer is cool: the Internationale will not trade the Elbe line for a united Germany unless Russia withdraws its tank armies first. Moscow's answer is blunter — it wants to know whether a neutral Germany becomes a great power again in twenty years. Both capitals ask the same question: why should Germans be trusted?"
 krcw_wgr_12.a:0 "Press on, and press both capitals"
 krcw_wgr_12.b:0 "Accept reality and shelve it"
 krcw_wgr_13_t:0 "The Two Capitals Reply"
 krcw_wgr_13_d0:0 "Moscow's answer arrives first: Russia is willing to discuss \"all solutions to the German question\" at Geneva, provided both German states are present. Paris answers a week later in the same terms. It is the first time since 1944 that both blocs have agreed to sit at one table over Germany."
 krcw_wgr_13_d1:0 "Paris sends no formal reply; its representative in Hamburg passes on the secretariat's view that the federation plan \"merits study\". Moscow answers with a foreign ministry statement calling the proposal \"a new way of pushing the Internationale's line east\". Neither capital refuses, and neither sends anyone."
 krcw_wgr_13.a:0 "Accept talks and send a delegation to Geneva"
 krcw_wgr_13.b:0 "Keep pressing until Moscow changes hands"
 krcw_wgr_13.c:0 "Give up the federation plan"
 krcw_wgr_capitals_tt:0 "How Paris and Moscow respond is their decision; talks are likelier after Savinkov's death and when détente is high."
 krcw_wgr_14_t:0 "The Debate on the Constitution"
 krcw_wgr_14_d:0 "The constituent assembly sits eleven weeks. The argument reduces to one question: if defence and the plan belong to the centre, who controls the centre? The council delegates demand all power pass through the regional assemblies; the officers point out that an army with seventy-two hours to decide the nation's survival cannot wait for a meeting. The final text is a compromise neither side likes and both sign."
 krcw_wgr_14.a:0 "Council supremacy: all power through the assemblies"
 krcw_wgr_14.b:0 "Defence first: emergency powers to the centre"
 krcw_wgr_14.c:0 "Two chambers: one of workshops, one of regions"
 krcw_wgr_16_t:0 "The Transit Talks"
 krcw_wgr_16_d:0 "On the fourth day the East Berlin delegation names its real terms: recognition of the National Republic's citizenship law in exchange for two hundred thousand family permits a year. It is a cruel bargain — to recognise the far bank as a state is to accept that the division is permanent; to refuse is to keep two million Berliners from their relatives."
 krcw_wgr_16.a:0 "Sign: the permits matter more than the principle"
 krcw_wgr_16.b:0 "Refuse: one nation cannot have two citizenships"
 krcw_wgr_18_t:0 "The Reparations Bill"
 krcw_wgr_18_d:0 "The Internationale's clearing commission sends the bill: the damage the Empire did in two wars is owed by the state that inherited its industry. The works councils do the arithmetic — at this figure the Ruhr works fourteen years for France and Italy. Some call it justice; others call it a new Versailles."
 krcw_wgr_18.a:0 "Pay in full, in exports"
 krcw_wgr_18.b:0 "Demand a recalculation"
 krcw_wgr_18.c:0 "Settle in patents and technicians"
 krcw_wgr_19_t:0 "The Commission Reviews the Bill"
 krcw_wgr_19_d0:0 "The clearing commission spends four months on West Germany's objections and accepts half of them: dismantled plant is valued after depreciation, and Ruhr coal requisitioned by France in the war is deducted. The new figure is a third lower than the old."
 krcw_wgr_19_d1:0 "The commission's review runs to two pages: the original bill was calculated in accordance with the Internationale's statutes and stands. A covering letter says the commission understands the burden on West German workers, but \"the burdens of the other members are no less real\". The French delegate votes in favour."
 krcw_wgr_19.a:0 "Accept the new figure"
 krcw_wgr_19.b:0 "Pay the original sum"
 krcw_wgr_19.c:0 "Protest openly at the congress"
 krcw_wgr_commission_tt:0 "Whether the commission reduces the bill depends on how Paris regards West Germany."
 krcw_wgr_20_t:0 "The Men from Salzburg"
 krcw_wgr_20_d:0 "Adler's delegation is led by Renner, and its request is direct: recognise Austria as an independent country, and do not let Austria become a second German question. The greater-German members of the Republic's congress tell the delegation to go home and ask the Austrians themselves whether they want to come back to Germany."
 krcw_wgr_20.a:0 "Promise to respect Austria's independence"
 krcw_wgr_20.b:0 "Make no promise"
 krcw_wgr_20.c:0 "Ask the Austrians to vote on it"
 krcw_wgr_referendum_tt:0 "Salzburg decides whether to hold the vote, and the result decides which road the Republic can take next."
 krcw_wgr_22_t:0 "The Family Trains"
 krcw_wgr_22_d:0 "The first family train runs from Cologne to Leipzig. There is no ceremony on the platform, only two thousand people with luggage and the plain-clothes men of both states taking notes behind the pillars. As the train crosses the Elbe bridge the carriages fall silent: for the first time in twenty years a river is a river again, and not a frontier."
 krcw_wgr_22.a:0 "Widen it: more trains every year"
 krcw_wgr_22.b:0 "Go slowly: guard against infiltration"
 krcw_ti_cadre_reform:0 "The Cadre Reform"
 krcw_ti_cadre_reform_desc:0 "The revolution won its civil war on enthusiasm, but enthusiasm does not draw an operations map. The new academies take men from the shop floor and spend three years making staff officers of them: the Commune admitting for the first time that war is a profession."
 krcw_ti_combined_arms:0 "Combined Arms"
 krcw_ti_combined_arms_desc:0 "Armour, artillery and infantry fighting on one radio net. It sounds dull and means retraining every battalion commander, but without it a counter-attack on the Elbe is only an expensive walk."
 krcw_ti_standing_reserve:0 "The Standing Reserve"
 krcw_ti_standing_reserve_desc:0 "Every federation keeps a reserve division at full establishment, its equipment sealed in the works and its men drilling one month a year. Russia keeps a hundred and forty-eight divisions standing; the Commune's answer is to double its own within seventy-two hours."
 krcw_ti_operational_art:0 "Operational Art"
 krcw_ti_operational_art_desc:0 "The general staff spent ten years on one question: if the Russian tank armies break through on the first day, what happens on the second. The answer runs four hundred pages, of which every divisional commander must know eighty by heart."
 krcw_fra_elbe_lesson_tt:0 "Opens the military growth chain: cadres, combined arms, reserves and operational art"
 krcw_fra_the_lesson_of_the_elbe:0 "Reassess the Elbe Defences"
 krcw_fra_the_lesson_of_the_elbe_desc:0 "War games show some thirty-five Internationale divisions between the Elbe and the Rhine against more than sixty across the river, with more than eighty in western Russia. Reassess the defence east of the Rhine."
 krcw_fra_the_officer_cadres:0 "The Officer Cadres"
 krcw_fra_the_officer_cadres_desc:0 "Saint-Cyr was closed in the revolution as a school for aristocrats. Twenty-eight years later the Commune reopens it, its cadets drawn from workshops and pits, its instructors veterans of Spain and the Second Weltkrieg."
 krcw_fra_combined:0 "Combined Arms Research"
 krcw_fra_combined_arms_doctrine:0 "Combined Arms Doctrine"
 krcw_fra_combined_arms_doctrine_desc:0 "For the first time the armoured federations, the artillery and the infantry use one radio net in one exercise. The verdict is unflattering: the three arms cannot understand one another. The doctrine must be rewritten."
 krcw_fra_the_reserve_statute:0 "The Reserve Statute"
 krcw_fra_the_reserve_statute_desc:0 "The new statute requires every industrial federation to maintain a reserve division, its equipment stored at the plant and its men training one month a year. The unions objected, since it costs a month of production every year. The congress passed it by a narrow margin."
 krcw_fra_opart:0 "Operational Art Research"
 krcw_fra_operational_art_focus:0 "Operational Art"
 krcw_fra_operational_art_focus_desc:0 "The staff turns ten years of war games into doctrine: do not fight at the frontier, but let the enemy tank armies drive deep and then cut their supply from the flank. It needs discipline, radios and an army that can retreat without dissolving, and the Commune now has all three."
 krcw_fra_the_federal_manoeuvre:0 "The Federal Manoeuvre"
 krcw_fra_the_federal_manoeuvre_desc:0 "The Internationale's European members hold joint manoeuvres in the Rhineland, with French armour, West German infantry, British air power and Italian mountain troops under one command."
 krcw_ti_expeditionary_habit:0 "The Expeditionary Habit"
 krcw_ti_expeditionary_habit_desc:0 "The British army was never large, but for two centuries it has been landing on other people's coasts. The syndicates inherited the knack: a division reaches Hamburg from Liverpool faster than it could march there from the Rhineland."
 krcw_eng_continental_tt:0 "Opens the military growth chain: cadres, expedition, reserves and operational art"
 krcw_eng_the_continental_commitment:0 "The Continental Commitment"
 krcw_eng_the_continental_commitment_desc:0 "Britain has traditionally kept a small army, but the fleet cannot help if the Elbe line gives way. Station a standing expeditionary force on the continent."
 krcw_eng_the_staff_college:0 "The Staff College"
 krcw_eng_the_staff_college_desc:0 "The staff college at Camberley stood closed for a decade after the revolution, most of its graduates having followed the old government to Canada. The reopened college takes union-nominated cadets, and its syllabus for the first time includes how to fight tank armies on land."
 krcw_eng_the_expeditionary_corps:0 "The Expeditionary Corps"
 krcw_eng_the_expeditionary_corps_desc:0 "Form a four-division expeditionary corps with its own transport fleet and supplies prepositioned at Hamburg and Rotterdam, to get reinforcements to the Elbe before the line gives way."
 krcw_eng_the_reserve_divisions:0 "The Reserve Divisions"
 krcw_eng_the_reserve_divisions_desc:0 "The territorial tradition survives: every county union keeps a reserve battalion that trains a month a year in the Welsh hills. The system lets the British army double on mobilisation."
 krcw_eng_opart:0 "Operational Art Research"
 krcw_eng_operational_art:0 "Operational Art"
 krcw_eng_operational_art_desc:0 "The British staff translates the French doctrine and adds a chapter of its own: how to withdraw without dissolving when air superiority is lost. The French quietly borrowed that chapter back."
 krcw_wgr_72h_tt:0 "Opens the military growth chain: cadres, combined arms, reserves and operational art"
 krcw_wgr_seventy_two_hours:0 "Adopt the Seventy-Two-Hour Plan"
 krcw_wgr_seventy_two_hours_desc:0 "The staff's arithmetic has never changed: if war begins at dawn the republic must hold alone for seventy-two hours before the armour from Paris reaches the Elbe. The sixteen divisions on the front know the number and what it means."
 krcw_wgr_the_new_staff:0 "Form a New General Staff"
 krcw_wgr_the_new_staff_desc:0 "The old general staff's archives are on the east bank and half its officers are in prison. The new staff is built from International Brigade veterans, survivors of Spain and young men nominated by the works councils: they understand politics, they are learning war, and they learn faster than anyone expected."
 krcw_wgr_combined:0 "Combined Arms Research"
 krcw_wgr_panzer_and_infantry:0 "Panzer and Infantry"
 krcw_wgr_panzer_and_infantry_desc:0 "Ruhr steel, Paris engines, German drawings. The first combined-arms division forms at Münster, and the exercise concludes that in defence one armoured battalion that can work with infantry is worth three that cannot."
 krcw_wgr_the_factory_reserves:0 "The Factory Reserves"
 krcw_wgr_the_factory_reserves_desc:0 "Every Ruhr plant keeps a reserve battalion with its weapons locked in the works armoury. It extends the militia system and is the fastest mobilisation a front-line state can arrange."
 krcw_wgr_opart:0 "Elastic Defence Research"
 krcw_wgr_elastic_defence:0 "Elastic Defence"
 krcw_wgr_elastic_defence_desc:0 "Do not spend every division on the riverbank: let the Russian tank armies drive deep, then cut them from the flanks in North Rhine and Hesse. It means treating part of the homeland as a battlefield, which is almost unsayable politically, but the staff insists it is the only workable plan."
 krcw_ti_bloc_plan_tt:0 "Opens the military growth chain: cadres, reserves and operational art"
 krcw_ti_the_bloc_defence_plan:0 "The Bloc Defence Plan"
 krcw_ti_the_bloc_defence_plan_desc:0 "The Internationale's smaller members cannot hold their own frontiers alone, but together they have more than a hundred and forty divisions, three mountain ranges and two seas. The joint staff in Paris assigns each member a definite task for the first time: who holds the passes, who holds the straits, who provides the reserve."
 krcw_ti_the_shared_academy:0 "The Shared Academy"
 krcw_ti_the_shared_academy_desc:0 "A joint academy at Lyon takes cadets from Italy, Iberia, the Low Countries, Scandinavia and Ireland. They learn one doctrine and one set of map symbols, then go home to command their own divisions: better for coalition warfare than any treaty."
 krcw_ti_the_militia_statute:0 "The Militia Statute"
 krcw_ti_the_militia_statute_desc:0 "Every syndicate keeps a reserve company, its equipment stored locally and its men training a month a year. For small countries it is the only affordable answer: double the wartime army at almost no peacetime cost."
 krcw_ti_terrain:0 "Terrain Warfare Research"
 krcw_ti_mountains_and_straits:0 "Assign the Passes and Straits"
 krcw_ti_mountains_and_straits_desc:0 "The Alpine passes, the Pyrenean defiles, the Danish straits, the Irish Sea: this is the ground the Internationale's smaller members hold. The joint staff writes doctrine for each, and one rule is common to all of them - terrain is worth ten divisions."
 krcw_sov_the_okhrana_state:0 "The Okhrana State"
 krcw_sov_the_okhrana_state_desc:0 "Savinkov took the name from the Tsar's secret police and the methods from his own years underground. He knows how every conspiracy is run, because as a young man he ran them all."
 krcw_sov_the_client_burden:0 "The Clients' Bill"
 krcw_sov_the_client_burden_desc:0 "East German reparations, Polish armaments, Persian oilfields, munitions for Long's America: every member of the Accord wants something from Moscow. Empire is paid for quarterly."
 krcw_sov_the_veterans_republic:0 "The Veterans' Republic"
 krcw_sov_the_veterans_republic_desc:0 "The veterans of two wars are the regime's most reliable pillar: they received land, priority in work and weight in the village. They are also the only men who could keep order after Savinkov."
 krcw_sov_the_okhrana:0 "The Okhrana"
 krcw_sov_the_okhrana_desc:0 "The name is borrowed from the Tsar, the methods are Savinkov's own: as a young man he blew up a minister's carriage, so he knows what a terrorist organisation needs to function - and how to see that it does not."
 krcw_sov_the_village_bargain:0 "Keep the Commune Lands"
 krcw_sov_the_village_bargain_desc:0 "Savinkov never collectivised: his sharpest break with the red road and his regime's deepest root. The commune keeps the land and the state takes its grain quota. Is it fair? No. But there is no famine."
 krcw_sov_the_press_statute:0 "The Press Statute"
 krcw_sov_the_press_statute_desc:0 "The newspapers need no censor; they need to know where the line is. The new statute draws it plainly: the state may be criticised, the leader may not; policy may be debated, Brest-Litovsk may not."
 krcw_sov_the_loyal_intelligentsia:0 "Favour the Technical Intelligentsia"
 krcw_sov_the_loyal_intelligentsia_desc:0 "Engineers, doctors and professors receive flats, rations and the chance to travel, at the price of silence on politics. Most accept the bargain; their fathers saw worse choices in the civil war."
 krcw_sov_the_price_of_empire:0 "Cost the Accord's Upkeep"
 krcw_sov_the_price_of_empire_desc:0 "On the map the Accord is a Russian sphere; in the ledger it is something else. East Germany wants machine tools, Poland tanks, Persia credit, Long's America munitions - and all Moscow wants is that none of them make trouble."
 krcw_sov_arms_for_the_juniors:0 "Sell Old Equipment to the Members"
 krcw_sov_arms_for_the_juniors_desc:0 "Sell the previous generation of tanks and aircraft to the Accord's members: it earns money and leaves their staffs dependent on Russian spares and Russian doctrine. The cheapest chain in the empire."
 krcw_sov_the_junior_revolt:0 "Renegotiate the Garrison Costs"
 krcw_sov_the_junior_revolt_desc:0 "For the first time the delegates of Bucharest, Belgrade and Ankara act together in the Accord council, demanding renegotiation of reparations and garrison costs. No one says \"or else\", and everyone hears it."
 krcw_sov_the_protocols_revised:0 "Revise the Protocols"
 krcw_sov_the_protocols_revised_desc:0 "Moscow concedes half: reparations are reduced and garrison costs shared, while foreign policy and armaments stay with the Council. The members get money and Moscow keeps command."
 krcw_sov_the_accord_general_staff:0 "The Accord General Staff"
 krcw_sov_the_accord_general_staff_desc:0 "A joint staff at Minsk where the officers of every Accord state work over one map. Russia provides the chief of staff and the clients provide the divisions: an arrangement that satisfies no one and can fight a war."
 krcw_sov_the_shoes_of_ryazan:0 "Overhaul Light Industry Planning"
 krcw_sov_the_shoes_of_ryazan_desc:0 "A ministry report reaches Savinkov's desk: Ryazan province produced four hundred thousand shoes last year, three hundred and ten thousand of them the same size. The report's conclusion is one line: this is not a question of output."
 krcw_sov_the_light_industry_turn:0 "The Light Industry Turn"
 krcw_sov_the_light_industry_turn_desc:0 "Turning part of heavy industry toward light goods looks close to treason to the general staff. Savinkov's answer: a country that cannot buy shoes will not hold the Elbe."
 krcw_sov_the_housing_decade:0 "The Housing Decade"
 krcw_sov_the_housing_decade_desc:0 "Three million flats for the city workers in ten years. The blocks are ugly, cramped and identical, and they have running water, heating and a door of one's own."
 krcw_sov_the_commercial_courts:0 "The Commercial Courts"
 krcw_sov_the_commercial_courts_desc:0 "Contract disputes between the trusts go to arbitration courts instead of a telephone call from the ministry. This is new in Russia: a contract may now count for more than an acquaintance."
 krcw_sov_60_t:0 "A Combined Motion in the Accord Council"
 krcw_sov_60_d:0 "The delegates of Romania, Yugoslavia and Turkey lay a jointly signed memorandum on the council table: reparations, garrison costs, the price of armaments - renegotiation demanded item by item. The three did not notify Moscow in advance.\n\nSavinkov's foreign commissar asks down the telephone: \"Are they asking for money, or testing us?\" Both, as it turns out."
 krcw_sov_60.a:0 "Concede: empire runs on cooperation"
 krcw_sov_60.b:0 "Divide: negotiate with each alone"
 krcw_sov_60.c:0 "Refuse: remind them whose tanks are in their capitals"
 krcw_sov_61_t:0 "The Three Capitals Reply"
 krcw_sov_61_d0:0 "Separate talks work. Ankara signs first: a cut in garrison costs in exchange for coordinating with Moscow on the Straits. When Bucharest and Belgrade hear of it they withdraw the joint memorandum and each sends its own delegation to Moscow."
 krcw_sov_61_d1:0 "The hard answer works. At the next council the Romanian delegate reads a statement calling the joint memorandum \"a discussion paper only\". Yugoslavia and Turkey do not raise it again. The Russian command in Bucharest reports that the local papers have stopped discussing reparations."
 krcw_sov_61_d2:0 "The three do not back down. The Romanian and Yugoslav delegates stay away from the next two councils, and the Belgrade papers begin printing the reparation figures. The Turkish foreign minister tells the press Ankara \"will negotiate with any state that respects sovereignty over the Straits\", and Paris relays the line word for word."
 krcw_sov_61.a:0 "Make the Turkish agreement the model"
 krcw_sov_61.b:0 "Concede half and bring them back to the council"
 krcw_sov_61.c:0 "Concede nothing; let them come back on their own"
 krcw_sov_61.d:0 "They have been reminded"
 krcw_sov_62_t:0 "The First Arbitration"
 krcw_sov_62_d:0 "The Ural machinery trust sues the Donbass coal trust for failing to deliver, and claims damages. The defendant's director is a civil-war veteran; the plaintiff's chief engineer is an academician. Two of the three arbitrators were once lawyers, which has not happened in Russia for thirty years.\n\nThe verdict itself does not matter. What matters is that both sides accepted it."
 krcw_sov_62.a:0 "Let the courts continue"
 krcw_sov_62.b:0 "Return disputes to the ministry"
 krcw_fra_the_shop_floor_plan:0 "The Plan from the Shop Floor"
 krcw_fra_the_shop_floor_plan_desc:0 "The planning directorate no longer issues quotas: it collects the outputs and needs the workshops themselves propose, and matches them. Engineers find it maddeningly slow, and nobody falsifies the figures any more, because the figures are their own."
 krcw_fra_the_reckoning_with_algiers:0 "The Reckoning with Algiers"
 krcw_fra_the_reckoning_with_algiers_desc:0 "The Commune declares colonialism abolished by the revolution, yet the Algerian departments are still governed by commissioners sent from Paris. For twenty-eight years no one has been willing to say the word first: this too is a colony."
 krcw_fra_the_cultural_front:0 "The Cultural Front"
 krcw_fra_the_cultural_front_desc:0 "Cinema, jazz, illustrated weeklies and football. The Commune discovers something the old cadres find hard to accept: a team that wins a World Cup consolidates the regime better than a hundred speeches."
 krcw_fra_the_generation_of_the_congress:0 "The Generation of the Congress"
 krcw_fra_the_generation_of_the_congress_desc:0 "Those who voted at the Bourse du Travail in 1949 are all past sixty by 1965. Those inheriting never saw a barricade, only a budget sheet, and their idea of the revolution is to make it work."
 krcw_fra_the_second_generation:0 "Train the Second Generation"
 krcw_fra_the_second_generation_desc:0 "Frachon is sixty-seven and the average age of the congress presidium is fifty-nine. Twenty-eight years after the revolution an awkward question circulates in the corridors: where are the successors, and by what right do they succeed?"
 krcw_fra_the_workshop_schools:0 "The Workshop Schools"
 krcw_fra_the_workshop_schools_desc:0 "Every large plant runs a technical school where students work mornings and study afternoons. The engineers it produces understand both machine tools and shop-floor politics, and the Commune's cadres no longer come from the party school."
 krcw_fra_the_womens_charter:0 "The Women's Charter"
 krcw_fra_the_womens_charter_desc:0 "Equal pay is written into the labour charter, yet women hold only one seat in eleven on the works councils. The new charter requires that no council's composition fall below the actual proportion in its workshop. The old hands call it formalism; the women reply that formalism beats nothing."
 krcw_fra_the_cultural_front_focus:0 "The Cultural Front"
 krcw_fra_the_cultural_front_focus_desc:0 "The Commune stops denouncing jazz and starts licensing it. The film studios make detective stories and love stories as well as revolutionary history. The old cadres protest at congress; the young delegates vote it through."
 krcw_fra_the_consumer_question:0 "Raise Consumer Goods Output"
 krcw_fra_the_consumer_question_desc:0 "Reconstruction is finished and France exports more machine tools than anyone, yet a worker in Lille waits fourteen months for a refrigerator. The planning directorate's report concedes the point: capacity all went into means of production."
 krcw_fra_the_shop_floor_plan_focus:0 "Plan from the Shop Floor Up"
 krcw_fra_the_shop_floor_plan_focus_desc:0 "Targets are built up from output and requirements reported by the shops, with the planning office only aggregating and reconciling them."
 krcw_fra_housing_for_the_communes:0 "Build Housing for the Communes"
 krcw_fra_housing_for_the_communes_desc:0 "Three hundred thousand people still live in the shanty belt around Paris. The new housing plan builds a million flats in ten years; the architects are young, the style is brutal, and every flat has hot water."
 krcw_fra_the_consumer_turn:0 "The Consumer Turn"
 krcw_fra_the_consumer_turn_desc:0 "Congress resolves that in the next five years the output of refrigerators, washing machines, cars and television sets shall quadruple. The general staff objects and the union delegates applaud: the first time the Commune has publicly chosen butter over guns."
 krcw_fra_the_european_clearing_zone:0 "The European Clearing Zone"
 krcw_fra_the_european_clearing_zone_desc:0 "The Clearing Union grows from an internal settlement mechanism into a real currency zone: labour units settle freely between Paris, London, Rome, Madrid and Hamburg. It binds these countries together more firmly than any treaty."
 krcw_fra_the_word_no_one_says:0 "Discuss Algerian Independence"
 krcw_fra_the_word_no_one_says_desc:0 "Algeria's three departments are legally part of France but run by commissioners sent from Paris, and the local unions have only observer seats in Congress. An Algiers delegate calls it a colony in open session."
 krcw_fra_the_algiers_statute:0 "The Algiers Statute"
 krcw_fra_the_algiers_statute_desc:0 "Algeria becomes an autonomous federation within the Commune, with its own congress, unions, language and schools; foreign affairs and defence stay with Paris."
 krcw_fra_the_departments_are_france:0 "The Departments Are France"
 krcw_fra_the_departments_are_france_desc:0 "The interior ministry's position has never changed: the three Algerian departments are as French as the Rhône, and to discuss autonomy is to discuss secession. To prove it, Paris sends two more divisions."
 krcw_fra_the_sahara_and_the_south:0 "The Sahara and the South"
 krcw_fra_the_sahara_and_the_south_desc:0 "The oil at Hassi Messaoud and the test ranges in the Sahara turn Algeria from a political problem into a strategic asset. However Paris settles the question of autonomy, it will not let go of either."
 krcw_fra_60_t:0 "Jazz and the Revolution"
 krcw_fra_60_d:0 "Congress argues two days over a small thing: whether to permit the import of American jazz records. The old generation calls it decadent capitalist music; the young delegates point out that it is the music of black workers, and that the workers of Lille are already listening - on the syndicates' own radio.\n\nA fifty-year-old delegate ends his speech with a line that makes the hall laugh: \"Comrades, we won two wars. Are we to be defeated by a saxophone?\""
 krcw_fra_60.a:0 "Open up: culture needs no protection"
 krcw_fra_60.b:0 "Limited: let the syndicates record their own"
 krcw_fra_62_t:0 "Guns or Butter"
 krcw_fra_62_d:0 "The general staff sends congress a memorandum: if consumer capacity quadruples, tank production in the 1953s falls by a third, and Russia across the Elbe will not have one division fewer because French workers can buy refrigerators.\n\nThe unions reply just as bluntly: if the workers cannot buy a refrigerator they will begin asking what the revolution actually gave them. Both papers are right, and congress can choose only one."
 krcw_fra_62.a:0 "Butter: let the workers buy things first"
 krcw_fra_62.b:0 "Guns: the Elbe will not wait"
 krcw_fra_62.c:0 "Both: lengthen the working week"
 krcw_fra_64_t:0 "The Delegate from Algiers"
 krcw_fra_64_d:0 "The delegate who said \"colony\" is Mohammed Ben Ali, secretary of the Algiers dockers' union, a syndicalist since 1936. He speaks for forty minutes from the rostrum without a single slogan, reading out a string of figures: Algeria has three million Muslim workers; congress has eleven Algerian delegates, nine of them European.\n\nWhen he finishes the presidium adjourns for an hour. Everyone understands that when it reconvenes there will either be an answer, or the question will find its own."
 krcw_fra_64.a:0 "Give Algeria equal representation"
 krcw_fra_64.b:0 "Appoint a commission of inquiry (delay)"
 krcw_fra_64.c:0 "An internal matter, not for debate"
 krcw_eng_the_congress_governs:0 "The Congress Governs"
 krcw_eng_the_congress_governs_desc:0 "The Trades Union Congress was once a body that applied pressure; now it is the state itself. The same men sit in it, but the papers before them have changed from strike notices to budget drafts. Britain's revolutionaries discover that running a country is far harder than overturning one."
 krcw_eng_the_post_imperial_economy:0 "The Post-Imperial Economy"
 krcw_eng_the_post_imperial_economy_desc:0 "The Empire left more than shame: it left an economy built for colonial trade. The Lancashire mills waited on Indian cotton, the Glasgow yards on imperial orders. Both are gone now, and the machinery is still there."
 krcw_eng_the_maritime_commitment:0 "The Maritime Commitment"
 krcw_eng_the_maritime_commitment_desc:0 "Every one of the Internationale's supply lines runs by sea: French machine tools, Italian grain, Chinese tungsten, Combined Syndicate trucks. Holding those lanes is the one job in this bloc that no one can do for Britain."
 krcw_eng_after_the_old_guard:0 "After the Old Guard"
 krcw_eng_after_the_old_guard_desc:0 "The men who stood on the barricades in 1925 are leaving the stage. Those who follow grew up in the syndicate schools: they never fought in the streets, but they understand statistics, machine tools, and how to count votes at congress."
 krcw_eng_the_congress_as_state:0 "Govern Through the Congress"
 krcw_eng_the_congress_as_state_desc:0 "The Trades Union Congress sits two weeks a year and settles the budget, foreign affairs and defence. For the other fifty an executive committee delegated by the industrial federations runs the country. The system is inefficient and it has never yet produced a dictator."
 krcw_eng_the_scottish_assembly:0 "The Scottish Assembly"
 krcw_eng_the_scottish_assembly_desc:0 "The Clyde shipyard men have always found London too far away. The new statute gives Scotland its own industrial assembly over local coal, ships and railways, on condition that defence and foreign affairs stay in London."
 krcw_eng_the_welsh_federation:0 "The Welsh Federation"
 krcw_eng_the_welsh_federation_desc:0 "The South Wales miners are the most militant body in Britain; in 1926 they moved first. Giving them an autonomous coal federation acknowledges history and brings the hardest men to govern inside the system."
 krcw_eng_the_handover:0 "The Handover"
 krcw_eng_the_handover_desc:0 "Wintringham was born in 1905, stood on a Manchester barricade in 1925 and fought in Spain in 1937. By the 1953s more than half the congress delegates are younger than the revolution itself: their loyalty to it was learned, not fought for."
 krcw_eng_the_mills_without_cotton:0 "Relieve the Lancashire Mills"
 krcw_eng_the_mills_without_cotton_desc:0 "The Lancashire looms were built for Indian cotton, and India is now the princes' federation on Moscow's side. Manchester has the highest unemployment in the country, and the unemployed are the men who backed the revolution first."
 krcw_eng_retool:0 "The Northern Retooling"
 krcw_eng_retool_the_north:0 "Retool the North"
 krcw_eng_retool_the_north_desc:0 "Turn the mills into machine shops and put the cotton hands through technical school. The programme costs ten years and a great deal of money; the alternative is to let Lancashire become an industrial ruin."
 krcw_eng_newtrades:0 "The New Industries"
 krcw_eng_the_new_trades:0 "Develop the New Industries"
 krcw_eng_the_new_trades_desc:0 "Aviation, electronics, chemicals, motor cars: Britain trails France in all of them, and possesses one thing no one else does - a century of engineering tradition. The problem is only to move those men away from the old machines."
 krcw_eng_the_atlantic_trade:0 "The Atlantic Trade"
 krcw_eng_the_atlantic_trade_desc:0 "The imperial markets are gone, yet the Combined Syndicates need machine tools, Italy needs coal and China needs ships. On the Clearing Union ledger Britain is a net exporter for the first time."
 krcw_eng_the_lanes_of_the_internationale:0 "Take Charge of the Bloc's Sea Lanes"
 krcw_eng_the_lanes_of_the_internationale_desc:0 "The Internationale is held together by sea and its navy is almost entirely British. Make the bloc's sea lanes the Royal Navy's first formal task."
 krcw_eng_escort:0 "Escort Technology"
 krcw_eng_the_escort_groups:0 "The Escort Groups"
 krcw_eng_the_escort_groups_desc:0 "Russia's submarines are the most dangerous part of its navy. Build many cheap escort groups with radar, sonar and helicopters."
 krcw_eng_carrier:0 "Carrier Technology"
 krcw_eng_the_carrier_question:0 "Set the Carrier Programme"
 krcw_eng_the_carrier_question_desc:0 "The Admiralty wants six fleet carriers and the budget committee approves three. What is really at stake is whether Britain keeps the ability to project power worldwide."
 krcw_eng_the_fleet_of_the_bloc:0 "Form a Joint Fleet Command"
 krcw_eng_the_fleet_of_the_bloc_desc:0 "The British, French, Italian and Iberian navies exercise under one command: British carriers and escort groups, French submarines, Italian and Iberian coastal forces. It is the Internationale's first genuinely combined fleet."
 krcw_eng_the_arctic_convoys:0 "The Arctic Route"
 krcw_eng_the_arctic_convoys_desc:0 "If war comes, the survival of Norway and Denmark depends on a route through the North Sea and the Norwegian Sea. The Admiralty draws a line between Scapa Flow and Trondheim and begins rehearsing it every winter."
 krcw_eng_the_two_republics:0 "Discuss Union with Ireland"
 krcw_eng_the_two_republics_desc:0 "With Ulster settled a larger question surfaces: the Union of Britain and the Irish Workers' Republic belong to one Internationale, speak one language and sell the same coal and ships. Why are they still two countries?"
 krcw_eng_the_isles_compact:0 "The Compact of the Isles"
 krcw_eng_the_isles_compact_desc:0 "Sign an isles compact with Ireland: common tariffs, a shared grid, shared fishing waters and mutual recognition of the unions. Political union is left for later."
 krcw_eng_the_commonwealth_of_labour:0 "The Commonwealth of Labour"
 krcw_eng_the_commonwealth_of_labour_desc:0 "The old dominions have gone separate ways: Canada is a syndicalist republic, Australasia follows the exiled crown, South Africa is ruled by a white minority. Propose a Commonwealth of Labour linking the workers' organisations across them."
 krcw_eng_technocrat:0 "The Methods of the Bureau"
 krcw_eng_60_t:0 "After Wintringham"
 krcw_eng_60_d:0 "Three names circulate in the congress corridors: an old comrade from the 1925 barricades, secretary of the Clyde shipyard union; a statistician from the planning bureau, forty-three, who has never been on strike; and the woman who leads the South Wales miners, whose father died in the general strike of 1926.\n\nWintringham himself says nothing. He knows that the moment he speaks it stops being the congress's decision."
 krcw_eng_60.a:0 "The barricade generation: the Clyde veteran"
 krcw_eng_60.b:0 "The planning generation: the statistician"
 krcw_eng_60.c:0 "The miners' generation: the South Wales secretary"
 krcw_eng_62_t:0 "Dublin's Reply"
 krcw_eng_62_d:0 "The Irish Workers' Republic replies politely and firmly: it welcomes the compact, the customs union and the fisheries agreement, but the word \"unity\" has eight hundred years of history in Dublin and this is not the moment for it.\n\nPrivately O'Donnell puts it more bluntly to the British envoy: \"We have just got Ulster back from you. Let us enjoy it for twenty years first.\""
 krcw_eng_62.a:0 "Accept: the compact now, unity for the next generation"
 krcw_eng_62.b:0 "Keep pressing for unity"
 krcw_eng_64_t:0 "The Congress of the Commonwealth of Labour"
 krcw_eng_64_d:0 "The first Congress of the Commonwealth of Labour opens in London with more delegates than expected: Canadian syndicates, Indian textile unions (unknown to the princely government), the West and East African Federations, Ceylon, and two dockers who came quietly from Australia.\n\nThe congress passes nothing binding, and does something more important: it proves that after the Empire dissolved the ties of language, law and railways remain - only now it is unions that connect them, not governors."
 krcw_eng_64.a:0 "Make it a permanent institution"
 krcw_eng_64.b:0 "Keep it loose and avoid provoking Moscow"
 krcw_integration_step_tt:0 "§YEuropean integration +1§!"
 krcw_integration:0 "European Integration"
 krcw_eu_clearing_member:0 "Member of the Clearing Union"
 krcw_eu_clearing_member_desc:0 "In the Paris ledger every member has a page. Deficit members need not deflate and surplus members may not hoard: gold leaves the stage and the labour unit enters. It is the most radical experiment in international economics, and it has been running eight years."
 krcw_eu_common_plan:0 "The Common Plan"
 krcw_eu_common_plan_desc:0 "The output of steel, coal, machine tools and rolling stock is allotted by a transnational board. The efficiency is startling and the price is plain: the works council in Lille can no longer decide alone what it will make next year."
 krcw_eu_labour_parliament:0 "The Parliament of Labour"
 krcw_eu_labour_parliament_desc:0 "Each member sends delegates in proportion to its union membership, and the parliament sits at Strasbourg. Its resolutions bind the national federations: the first workers' body to stand above the nation-state."
 krcw_eu_shop_floor_veto:0 "The Shop Floor Veto"
 krcw_eu_shop_floor_veto_desc:0 "The price of integration is written into the charter's final article: any transnational plan vetoed by more than a third of the local federations must be renegotiated. European planning is henceforth twice as slow, and it is the workers' planning."
 krcw_fra_the_clearing_union_step:0 "Extend the Clearing Union"
 krcw_fra_the_clearing_union_step_desc:0 "The Clearing Union has run eight years and the labour units in its ledger are trusted more than gold. The economists in Paris raise a question they never dared before: if settlement can cross borders, why not planning?"
 krcw_fra_the_division_of_labour:0 "Join the Machine-Tool Division of Labour"
 krcw_fra_the_division_of_labour_desc:0 "France gives up part of its own machine-tool capacity in exchange for Italian cars and British ships. Between nation-states this is trade; inside the Internationale it is the division of labour, and the difference is that a common board decides it."
 krcw_fra_the_common_plan:0 "Join the Common Plan"
 krcw_fra_the_common_plan_desc:0 "Hand national steel, coal and machine-tool capacity to the transnational board. The gain is a continental market and continental scale; the price is that the nation's works councils lose the final word on their own output. This is the real threshold of integration: past it, sovereignty is no longer merely shared in part."
 krcw_eng_the_clearing_union_step:0 "London and the Ledger"
 krcw_eng_the_clearing_union_step_desc:0 "Britain's bankers once ruled the world's settlements. Their grandsons now work in the Clearing Union's offices keeping books in labour units. The old men call it degradation; the young reply that at least it is still bookkeeping."
 krcw_eng_the_division_of_labour:0 "Join the Common Shipping Pool"
 krcw_eng_the_division_of_labour_desc:0 "Britain puts its merchant fleet into the common pool: the ships keep their flags, but routes, cargoes and rates are allotted by the federation. It is Britain's most substantial contribution to integration and the hardest thing for it to hand over."
 krcw_eng_the_common_plan:0 "Join the Common Plan"
 krcw_eng_the_common_plan_desc:0 "Hand national steel, coal and machine-tool capacity to the transnational board. The gain is a continental market and continental scale; the price is that the nation's works councils lose the final word on their own output. This is the real threshold of integration: past it, sovereignty is no longer merely shared in part."
 krcw_wgr_the_clearing_union_step:0 "The Ruhr and the Ledger"
 krcw_wgr_the_clearing_union_step_desc:0 "The Ruhr's coal and steel are the base of the whole Internationale's industry. To put them into the common plan is to hand over West Germany's last card, and also to make it impossible for anyone to blockade it alone."
 krcw_wgr_the_division_of_labour:0 "The Coal and Steel Community"
 krcw_wgr_the_division_of_labour_desc:0 "The coal and steel of the Ruhr, Lorraine, the Saar and Upper Silesia merge into one community. The scheme was proposed in the old world to stop France and Germany fighting again; it is proposed now because the workers of both are already in the same union."
 krcw_wgr_the_common_plan:0 "Join the Common Plan"
 krcw_wgr_the_common_plan_desc:0 "Hand national steel, coal and machine-tool capacity to the transnational board. The gain is a continental market and continental scale; the price is that the nation's works councils lose the final word on their own output. This is the real threshold of integration: past it, sovereignty is no longer merely shared in part."
 krcw_tim_the_clearing_union_step:0 "Win Common Plan Orders"
 krcw_tim_the_clearing_union_step_desc:0 "The smaller members gain more than they give: too small to carry a complete industrial system, they find that the common plan brings continental orders to Danish yards, Dutch electricals and Norwegian aluminium."
 krcw_tim_the_division_of_labour:0 "Register Our Specialisation"
 krcw_tim_the_division_of_labour_desc:0 "Each smaller member registers its specialisation in the common plan: Danish ships, Dutch electricals, Norwegian aluminium, Irish food, Belgian chemicals. The division is written down and need not be fought over every year."
 krcw_tim_the_common_plan:0 "Join the Common Plan"
 krcw_tim_the_common_plan_desc:0 "Hand national steel, coal and machine-tool capacity to the transnational board. The gain is a continental market and continental scale; the price is that the nation's works councils lose the final word on their own output. This is the real threshold of integration: past it, sovereignty is no longer merely shared in part."
 krcw_eu_the_strasbourg_congress:0 "The Strasbourg Congress"
 krcw_eu_the_strasbourg_congress_desc:0 "In 1953 the union federations of the Internationale's European members hold a joint congress at Strasbourg to discuss a binding parliament of labour."
 krcw_eu_the_parliament_of_labour:0 "The Parliament of Labour"
 krcw_eu_the_parliament_of_labour_desc:0 "Delegates are apportioned by union membership, not by population and not by borders. France is largest, then Britain and the German Socialist Republic; Denmark and Luxembourg together hold only seven seats, and their votes weigh the same as anyone's."
 krcw_eu_the_council_of_federations:0 "The Council of Federations"
 krcw_eu_the_council_of_federations_desc:0 "No parliament, only a council: one vote per member and unanimity required. It preserves every member's veto, and the price is that integration proceeds henceforth at the pace of its slowest member."
 krcw_eu_the_shop_floor_charter:0 "The Shop Floor Charter"
 krcw_eu_the_shop_floor_charter_desc:0 "The strongest resistance to integration comes from the shop floor. Issue the charter: a third of the local federations can veto any transnational plan."
 krcw_eu_the_federation_of_labour:0 "The European Federation of Labour"
 krcw_eu_the_federation_of_labour_desc:0 "The European Federation of Labour comes into force: a common plan, a common unit of account and a common parliament, with each member keeping the right to leave and the shop-floor veto."
 krcw_eui_1_t:0 "The Debate at Strasbourg"
 krcw_eui_1_d:0 "The debate runs nine days. The French delegation wants a parliament with real powers, arguing that a body without binding force achieves nothing; the British delegation objects with equal force - a foreign body that can bind British unions cannot be sold in Manchester.\n\nThe real division only becomes clear on the seventh day: this is not an argument between nations but between the larger plan and workshop autonomy, and the revolution promised both."
 krcw_eui_1.a:0 "A parliament with real powers"
 krcw_eui_1.b:0 "A council requiring unanimity"
 krcw_eui_1.c:0 "Two chambers: a parliament plus the shop-floor veto"
 krcw_eui_2_t:0 "The Day the Federation Came"
 krcw_eui_2_d:0 "On the day the charter is signed at Strasbourg the factories of Paris, London, Rome, Madrid, Hamburg, Copenhagen and Dublin stop for one hour together. Not a strike - a celebration voted unanimously by the federations.\n\nA journalist asks Frachon whether this is European unification. He says: \"What the kings and emperors of Europe failed to do in four hundred years, the unions did in sixteen. Because what we are uniting is not territory but workshops.\""
 krcw_eui_2.a:0 "The workers of Europe have a continent of their own"
 krcw_eui_10_t:0 "The Decision to Hand Over Output"
 krcw_eui_10_d:0 "The common plan's first allocation table reaches the national federations. It states how much steel, how many machine tools and how many vehicles to make next year. The figures are reasonable and the efficiency obvious, and not one works council voted for them.\n\nAn old hand asks the federation congress a question no one can answer: \"When we took the factories in 1921, was it so that a board in Paris could decide for us, or so that we could decide for ourselves?\""
 krcw_eui_10.a:0 "Accept the table: scale is strength"
 krcw_eui_10.b:0 "Accept, but demand the shop-floor veto"
 krcw_eui_11_t:0 "The Decision to Hand Over Output"
 krcw_eui_11_d:0 "The common plan's first allocation table reaches the national federations. It states how much steel, how many machine tools and how many vehicles to make next year. The figures are reasonable and the efficiency obvious, and not one works council voted for them.\n\nAn old hand asks the federation congress a question no one can answer: \"When we took the factories in 1921, was it so that a board in Paris could decide for us, or so that we could decide for ourselves?\""
 krcw_eui_11.a:0 "Accept the table: scale is strength"
 krcw_eui_11.b:0 "Accept, but demand the shop-floor veto"
 krcw_eui_12_t:0 "The Decision to Hand Over Output"
 krcw_eui_12_d:0 "The common plan's first allocation table reaches the national federations. It states how much steel, how many machine tools and how many vehicles to make next year. The figures are reasonable and the efficiency obvious, and not one works council voted for them.\n\nAn old hand asks the federation congress a question no one can answer: \"When we took the factories in 1921, was it so that a board in Paris could decide for us, or so that we could decide for ourselves?\""
 krcw_eui_12.a:0 "Accept the table: scale is strength"
 krcw_eui_12.b:0 "Accept, but demand the shop-floor veto"
