 krcw_eui_13_d:0 "The common plan's first allocation table reaches the national federations. It states how much steel, how many machine tools and how many vehicles to make next year. The figures are reasonable and the efficiency obvious, and not one works council voted for them.\n\nAn old hand asks the federation congress a question no one can answer: \"When we took the factories in 1921, was it so that a board in Paris could decide for us, or so that we could decide for ourselves?\""
 krcw_eui_13.a:0 "Accept the table: scale is strength"
 krcw_eui_13.b:0 "Accept, but demand the shop-floor veto"
 krcw_ent_the_tasman_compact:0 "The Tasman Compact"
 krcw_ent_the_tasman_compact_desc:0 "A common tariff, common shipping, a common wool board. The two dominions remain two countries, and economically they can no longer be separated: a quarter of Wellington's budget turns on decisions made in Sydney."
 krcw_ent_the_pacific_federation:0 "The Pacific Federation"
 krcw_ent_the_pacific_federation_desc:0 "One parliament, one army, a new flag - the Southern Cross kept, the Union canton removed. Wellington keeps its provincial assembly and keeps a number of federal seats that will never quite be enough."
 krcw_ent_the_junior_dominion:0 "The Junior Dominion"
 krcw_ent_the_junior_dominion_desc:0 "New Zealand has six provinces, a navy of two cruisers and a delegate who carries little weight in Melbourne. Its loyalty has never been in question and its opinion has never counted; the two facts are related."
 krcw_ent_the_tasman_question:0 "Discuss Union Across the Tasman"
 krcw_ent_the_tasman_question_desc:0 "Australia and New Zealand have the same institutions; discuss merging into one country. New Zealand worries that Australia would run it."
 krcw_ent_the_tasman_compact_f:0 "The Tasman Compact"
 krcw_ent_the_tasman_compact_f_desc:0 "No merger, but one economy: a common tariff, common shipping, common wool and meat boards, and free movement and employment for the citizens of both. Not an inch of sovereignty conceded and every practical benefit taken. It is the most New Zealand will accept."
 krcw_ent_the_federation_act:0 "The Federation Act"
 krcw_ent_the_federation_act_desc:0 "Both parliaments pass the Federation Act: one parliament, one army, one constitution. The New Zealand provinces keep their assemblies and courts, with guaranteed seats and funding."
 krcw_ent_one_parliament:0 "Convene the Federal Parliament"
 krcw_ent_one_parliament_desc:0 "The first federal parliament opens at Canberra with twenty-two of a hundred and twenty seats for New Zealand. The Wellington papers do the arithmetic: even voting as one bloc, New Zealand's members cannot defeat a single bill. Every New Zealander does that arithmetic."
 krcw_ent_the_southern_dominion_navy:0 "The Southern Dominion Navy"
 krcw_ent_the_southern_dominion_navy_desc:0 "Merged or not, the two navies must become one: every sea lane east and west of the Tasman depends on these dozen-odd warships. Command goes to Australia, which was never in dispute, because Australia built the ships."
 krcw_ent_40_t:0 "Wellington's Arithmetic"
 krcw_ent_40_d:0 "The New Zealand cabinet sits two days. The finance minister's report is blunt: federation brings the Australian market, Australian capital and the protection of the Australian navy, and New Zealand would hold at most a fifth of the federal seats.\n\nThe premier closes the meeting with one line: \"The question is not whether we should be better off. It is whether, being better off, we are still ourselves.\""
 krcw_ent_40.a:0 "Integrate the economies, keep sovereignty"
 krcw_ent_40.b:0 "Negotiate federation in earnest"
 krcw_ent_42_t:0 "The Pacific Federation Is Proclaimed"
 krcw_ent_42_d:0 "On 1 January 1951 the Pacific Federation is proclaimed at Canberra. Both dominion flags come down together and a new one rises - the Southern Cross still there, the Union canton gone.\n\nThe court-in-exile attends and does not speak. A British journalist notes that the word \"King\" appears twice in the new constitution, both times in the schedules. The Entente's legitimacy survives; it now lives in someone else's house, and the landlord has just changed the locks."
 krcw_ent_42.a:0 "One country, one army"
 KRCW_AST_PACFED:0 "Pacific Federation"
 KRCW_AST_PACFED_DEF:0 "the Pacific Federation"
 KRCW_AST_PACFED_ADJ:0 "Pacific"
 krcw_ma_regional_partner:0 "Regional Partner"
 krcw_ma_territorial_grievance:0 "Territorial Grievance"
 krcw_ma_the_window_west:0 "A Window to the West"
 krcw_ma_cordon_doctrine:0 "The Cordon Doctrine"
 krcw_ma_cordon_doctrine_desc:0 "Moscow imagines its small allies as a breakwater: they need not win, only hold until the Russian tanks arrive."
 krcw_ma_collective_bargaining:0 "Collective Bargaining"
 krcw_ma_collective_bargaining_desc:0 "One small Accord state counts for nothing in Moscow; eleven standing together cannot be ignored."
 krcw_ma_the_open_window:0 "The Open Window"
 krcw_ma_the_open_window_desc:0 "For the first time the buffer opens its windows on both sides. The traders come first, then the journalists, then the diplomats."
 krcw_ma_reigning_monarch:0 "The Reigning Monarch"
 krcw_ma_reigning_monarch_desc:0 "The King is no longer merely a portrait on the wall. He chairs the cabinet, signs the laws, and takes on the blame: a gamble."
 krcw_ma_colonels_in_office:0 "The Colonels in Office"
 krcw_ma_colonels_in_office_desc:0 "The emergency has no end. The colonels say that so long as a commune army stands across the border, it must continue."
 krcw_ma_national_arsenal:0 "A National Arsenal"
 krcw_ma_national_arsenal_desc:0 "\"Do not improve the Russian drawings\": no one ever kept that clause. Local engineers take them apart and rebuild them to suit."
 krcw_ma_frontier_fortress:0 "The Frontier Fortress"
 krcw_ma_frontier_fortress_desc:0 "A buffer exists to be broken, unless it is hard. Year by year the concrete on the frontier grows thicker."
 krcw_ma_mountain_war_school:0 "The Mountain Warfare School"
 krcw_ma_mountain_war_school_desc:0 "The Carpathians, the Balkans, the Hindu Kush, the Mongolian plateau: train troops for the country they must hold."
 krcw_ma_air_defence_net:0 "The Air Defence Net"
 krcw_ma_air_defence_net_desc:0 "The Internationale's bombers are an hour away. Unable to afford fighter wings, we throw a Russian radar-and-flak net over the cities."
 krcw_ma_national_bank_2:0 "A Sound Currency"
 krcw_ma_national_bank_2_desc:0 "Our currency is worthless abroad and rouble loans are dear. A proper national bank can at least publish the budget on time."
 krcw_ma_resource_concessions:0 "Resource Concessions"
 krcw_ma_resource_concessions_desc:0 "Romanian oil, Yugoslav bauxite, Turkish chrome — Moscow wants them and will pay for them, though never quite enough."
 krcw_ma_partisan_country:0 "A Country of Partisans"
 krcw_ma_partisan_country_desc:0 "In the Greek Pindus and the Yugoslav Dinarics the commune partisans were never truly cleared. Counter-insurgency is a lesson without end."
 krcw_ma_transit_state:0 "The Transit Corridor"
 krcw_ma_transit_state_desc:0 "The railways and roads carry grain in peace and tanks in war. Moscow pays to build them, and keeps the right to use them at will."
 krcw_ma_modern_officer_corps:0 "A Modern Officer Corps"
 krcw_ma_modern_officer_corps_desc:0 "The Frunze Academy sends back young officers with new manuals, and some ideas Moscow never meant to teach them."
 krcw_ma_the_shield_of_the_east:0 "The Shield of the East"
 krcw_ma_the_shield_of_the_east_desc:0 "We accept our role: to stand at the front and take the first blow for Moscow. In return, the Accord's best equipment reaches us first."
 krcw_ma_the_warsaw_protocols:0 "The Warsaw Protocols"
 krcw_ma_the_warsaw_protocols_desc:0 "The Accord's joint staff signs a set of protocols in Warsaw: one calibre, one railway gauge, one war plan. We surrender independent command for the guarantee of not being abandoned."
 krcw_ma_the_marshal_of_the_frontier:0 "Accept the Accord Marshal's Rank"
 krcw_ma_the_marshal_of_the_frontier_desc:0 "Moscow grants our commander-in-chief the rank of Marshal of the Accord. It is both an honour and a leash: henceforth he answers to Warsaw as well as to his own government."
 krcw_ma_reward_of_loyalty:0 "Collect the Reward for Loyalty"
 krcw_ma_reward_of_loyalty_desc:0 "Moscow keeps its word: a modern tank plant, an air regiment, and a formal guarantee of our borders. Loyalty, this once, is repaid."
 krcw_ma_the_juniors_league:0 "The Juniors' League"
 krcw_ma_the_juniors_league_desc:0 "The small states of the Accord are tired of being Moscow's bargaining chips. Quietly they reach an understanding: before Moscow, we support one another."
 krcw_ma_shared_industry:0 "Shared Industry"
 krcw_ma_shared_industry_desc:0 "One state builds engines, another hulls, another optics. The League's division of labour lets each member afford what none could alone."
 krcw_ma_the_league_staff:0 "The League's Staff"
 krcw_ma_the_league_staff_desc:0 "The League forms its own joint staff — not to defy Warsaw, but so Warsaw cannot pick its members off one by one. For the first time the small states have a collective military voice."
 krcw_ma_bargain_with_moscow:0 "Bargain with Moscow"
 krcw_ma_bargain_with_moscow_desc:0 "The League brings a common list to Moscow: fairer prices for resources, fewer garrisons, our divisions under our own command. Moscow frowns, but sits down to talk for the first time."
 krcw_ma_the_league_charter:0 "The League's Charter"
 krcw_ma_the_league_charter_desc:0 "A formal charter turns the understanding into an institution: common tariffs, common air defence, a common diplomatic line. Within the Accord, an accord."
 krcw_ma_quiet_contacts:0 "Take a Secret Western Loan"
 krcw_ma_quiet_contacts_desc:0 "A Swiss bank acting for the Paris Clearing Union offers an unpublished loan for machine-tool imports. The terms are not in the contract, and everyone knows what the other side wants. The Okhrana is already looking into it."
 krcw_ma_trade_both_ways:0 "Bid the Two Blocs Against Each Other"
 krcw_ma_trade_both_ways_desc:0 "The government lets Moscow see the Paris offer and Paris see Moscow's. Both raise their bids, and the Accord is that much less united."
 krcw_ma_the_neutral_temptation:0 "Sound Out Neutrality"
 krcw_ma_the_neutral_temptation_desc:0 "What if we belonged to neither Paris nor Moscow? Once spoken aloud, the thought cannot be taken back. Moscow's ambassador demands an explanation."
 krcw_ma_leave_the_cordon:0 "Leave the Moscow Accord"
 krcw_ma_leave_the_cordon_desc:0 "The government gives Moscow notice that it is leaving the Accord and asks the Accord garrisons to go by a set date. No member has walked out openly before. The Russian tanks are a day from the border."
 krcw_ma_the_neutral_belt:0 "Ask the Internationale for a Guarantee"
 krcw_ma_the_neutral_belt_desc:0 "Having walked out, the only thing that can stop the Russian tanks is the other bloc's word. The government sends to Paris for a guarantee and a consignment of anti-tank guns. Moscow will call it a provocation."
 krcw_ma_the_question_of_the_regime:0 "Settle the Form of Government"
 krcw_ma_the_question_of_the_regime_desc:0 "Every small Accord state wrestles with the same question: who shall rule? The general, the civilian — or the crown that has hung on the wall so long?"
 krcw_ma_the_crown_reigns:0 "The Crown Reigns"
 krcw_ma_the_crown_reigns_desc:0 "The King steps down from the portrait and into the cabinet. On the thrones of Romania, Bulgaria, Afghanistan, Mongolia and Hungary sits, for the first time, someone who truly decides."
 krcw_ma_the_royal_prerogative:0 "The Royal Prerogative"
 krcw_ma_the_royal_prerogative_desc:0 "The King reclaims the army's oath, the last word in foreign policy and the power to dissolve the chamber. Stability, or a palace coup waiting to happen?"
 krcw_ma_dynasty_and_accord:0 "Reconcile the Crown with the Accord"
 krcw_ma_dynasty_and_accord_desc:0 "A reigning monarch is both reassurance and nuisance to Moscow: stable, but with plans of his own. Moscow tolerates it — a crown is harder for commune propaganda to inflame than a colonel."
 krcw_ma_the_officers_take_over:0 "The Officers Take Over"
 krcw_ma_the_officers_take_over_desc:0 "Elections postponed indefinitely, the chamber adjourned without date. The colonels say the emergency cannot end while a commune army stands across the border."
 krcw_ma_the_national_command:0 "The National Command"
 krcw_ma_the_national_command_desc:0 "The junta turns the country into a barracks: officers run the factories, the schools, the newspapers. Efficiency rises, but no one dares speak the truth any more."
 krcw_ma_the_permanent_emergency:0 "The Permanent Emergency"
 krcw_ma_the_permanent_emergency_desc:0 "The emergency becomes permanent. The junta uses it against the commune partisans, and against anyone who asks for elections back."
 krcw_ma_the_civilian_settlement:0 "The Civilian Settlement"
 krcw_ma_the_civilian_settlement_desc:0 "The colonels return to barracks and the lawyers and professors to the ministries. Moscow is not pleased, but a stable ally is worth more than an obedient one."
 krcw_ma_managed_elections:0 "Hold Managed Elections"
 krcw_ma_managed_elections_desc:0 "Elections return, but only approved parties may stand. It is theatre, but more dignified theatre than naked martial law."
 krcw_ma_a_breathing_society:0 "Ease Press Controls"
 krcw_ma_a_breathing_society_desc:0 "A limited free press, independent courts, debate in the universities — the civilian government gives society a little room. Moscow watches, ready to tighten."
 krcw_ma_licenced_arsenal:0 "The Licenced Arsenal"
 krcw_ma_licenced_arsenal_desc:0 "Moscow provides the drawings and the country provides the works and the workers. The tanks are half a generation behind the Russian ones and they are its own, and the spares do not wait on a Siberian train."
 krcw_ma_belated_land_reform:0 "The Belated Land Reform"
 krcw_ma_belated_land_reform_desc:0 "Moscow gave the land to the peasants thirty years ago; the Accord's other members dragged their feet. Now the broadcasts from the far side of the border can no longer use it to stir the villages."
 krcw_ma_the_frontier_economy:0 "The Frontier Economy"
 krcw_ma_the_frontier_economy_desc:0 "Every railway to the frontier has two purposes: coal and wheat in peace, divisions in war. The Accord's engineers never design separately for the two."
 krcw_ma_the_disputed_border:0 "The Disputed Border"
 krcw_ma_the_disputed_border_desc:0 "A few lines on the map inside the Accord are drawn in pencil. Moscow requires its members not to quarrel over them, and in every foreign ministry drawer there is a locked version of the map with different lines."
 krcw_ma_arms_from_the_licence:0 "Production Under Licence"
 krcw_ma_arms_from_the_licence_desc:0 "Moscow at last parts with the drawings for the previous generation of tanks and rifles. It is both a favour and a chain: from now on the national arms industry is built to Russian standards, and Moscow sets the calibres, the threads and the radio frequencies."
 krcw_ma_the_land_question:0 "Carry Out Land Reform"
 krcw_ma_the_land_question_desc:0 "In the Accord's member states the great landlords still hold the best land. Moscow keeps pointing out that the transmitters across the border broadcast to those peasants daily. Land reform is the price of keeping power, and the men who pay it are the regime's own supporters."
 krcw_ma_rail_to_the_frontier:0 "Build the Frontier Railways"
 krcw_ma_rail_to_the_frontier_desc:0 "Double-tracked, heavy-gauge, with platforms sized to a division. The Accord staff has a vote on every new line, and the economic ministries have discovered that a railway drawn westward always gets its budget."
 krcw_ma_our_own_arsenal_f:0 "Design Our Own Weapons"
 krcw_ma_our_own_arsenal_f_desc:0 "After ten years of copying, the national design bureau submits a design of its own. Moscow's advisers point out its flaws politely and do not object: a client that can make its own guns is more use than one that waits for a ship."
 krcw_ma_the_resource_bargain:0 "Negotiate Resource Prices with Moscow"
 krcw_ma_the_resource_bargain_desc:0 "Turkish chrome, Romanian oil, Yugoslav bauxite, Polish coal: the Accord buys these at prices Moscow sets and sells back machine tools at prices Moscow sets. The members have all done the arithmetic and none of them can win it."
 krcw_ma_the_cordon_fortifications:0 "The Cordon Fortifications"
 krcw_ma_the_cordon_fortifications_desc:0 "Pour concrete along the western frontier from the Baltic to the Aegean. The line cannot stop armoured divisions, and it forces any attack to be an open act of war."
 krcw_ma_mountain_and_marsh:0 "Mountain and Marsh"
 krcw_ma_mountain_and_marsh_desc:0 "The Accord's terrain is its best asset: the Carpathians, the Balkan gorges, the Pripet marshes, the Anatolian plateau. The staff writes doctrine for each, and the common rule is to make the enemy pay in time."
 krcw_ma_the_air_defence_net:0 "The Air Defence Net"
 krcw_ma_the_air_defence_net_desc:0 "The Internationale's bombers must cross the Accord members to reach Russia. Moscow supplies radar and interceptors, the members airfields and crews."
 krcw_ma_the_counter_insurgency_school:0 "The Counter-Insurgency School"
 krcw_ma_the_counter_insurgency_school_desc:0 "Almost every Accord member has partisans in its mountains: the Pindus in Greece, Bosnia in Yugoslavia, the Kurdish highlands in Turkey. A common school teaches one set of methods - cordon, resettle, offer amnesty, and keep the journalists out."
 krcw_ma_the_pencil_lines:0 "List the Territorial Disputes"
 krcw_ma_the_pencil_lines_desc:0 "Territorial disputes between Accord members never reach the agenda, but every country keeps its own map. List the disputes; Moscow uses them to keep the members in line."
 krcw_ma_the_pindus_campaign:0 "Clear the Pindus Partisans"
 krcw_ma_the_pindus_campaign_desc:0 "Greece's syndicalist partisans have been three years in the Pindus. Their supplies come from Italy: fishing boats cross the Strait of Otranto by night and unload in the coves of Epirus. To finish them means closing the Ionian coast and stopping boats under the Italian flag at sea."
 krcw_ma_the_macedonian_question:0 "Handle the Macedonian Question"
 krcw_ma_the_macedonian_question_desc:0 "Sofia says the Macedonians are Bulgarians, Belgrade says they are a branch of the Serbs, Athens says there are no Macedonians north of anywhere. Three Accord members have quarrelled half a century over the same people on the same ground, and no one has asked those people."
 krcw_ma_the_straits_question:0 "Hold Sovereignty over the Straits"
 krcw_ma_the_straits_question_desc:0 "Moscow wants passage through the Straits and ideally a garrison. Ankara treats the Straits as the limit of Turkish sovereignty and refuses."
 krcw_ma_transylvania:0 "Transylvania"
 krcw_ma_transylvania_desc:0 "Bucharest and Budapest are both Accord members, both host Russian garrisons and both signed the same document - and in the schoolbook maps of the two countries Transylvania belongs to different states. Moscow's arbitration is that neither may raise it."
 krcw_ma_the_german_line:0 "Raise the German Border"
 krcw_ma_the_german_line_desc:0 "Pomerania and Silesia remain with the DDR, itself an Accord member. Warsaw raises the matter with Moscow every year and is turned down every year."
 krcw_ma_moscow_arbitrates:0 "Ask Moscow to Arbitrate"
 krcw_ma_moscow_arbitrates_desc:0 "Disputes between members all end up with Moscow. Its rulings are not always fair, and every member accepts them, because none can afford a war with another."
 krcw_mad_10_t:0 "Whose Land"
 krcw_mad_10_d:0 "The land bill reaches parliament, and the fiercest opposition comes not from the great landlords - they understood long ago that they cannot stop it - but from the officer corps. Most officers in an Accord state come from the squireens, and their family holdings are on the list the bill will divide.\n\nMoscow's ambassador puts it privately: \"You may lose the estates or you may lose the villages. Choose one.\""
 krcw_mad_10.a:0 "Pass it, compensate the officers"
 krcw_mad_10.b:0 "Water it down: church and foreign land only"
 krcw_mad_10.c:0 "Delay, and gamble the peasants have no radios"
 krcw_mad_12_t:0 "The Arithmetic of Prices"
 krcw_mad_12_d:0 "The economics ministry's report is simple: national chrome, oil and bauxite are sold to Moscow at Accord prices and machine tools bought back at Accord prices, and the spread each year equals a quarter of national industrial investment.\n\nThe minister struck out the report's last sentence by hand, but copies had already circulated. It read: \"We are subsidising a country richer than ourselves.\""
 krcw_mad_12.a:0 "Demand a repricing from Moscow"
 krcw_mad_12.b:0 "Accept the spread for arms and security"
 krcw_mad_12.c:0 "Quietly divert some exports west"
 krcw_mad_20_t:0 "The Ionian Patrol"
 krcw_mad_20_d:0 "The staff's conclusion is plain: while the Epirus coast stays open the Pindus partisans cannot be finished. But the boats fly the Italian flag and Italy is an Internationale member, so stopping them at sea is a challenge to the Internationale.\n\nMoscow's reply is equivocal: we support your internal order, and we do not want a war in the Balkans."
 krcw_mad_20.a:0 "Close the coast and accept the consequences"
 krcw_mad_20.b:0 "A great sweep of the mountains, not the coast"
 krcw_mad_20.c:0 "Amnesty: give the partisans a way down"
 krcw_mad_22_t:0 "The Macedonians Themselves"
 krcw_mad_22_d:0 "A petition no one expected reaches the Accord council: teachers, railwaymen and clergy of Skopje jointly ask for recognition of a Macedonian nation and for autonomy. Copies went to Sofia, Belgrade and Moscow simultaneously.\n\nThe first reaction in all three capitals is identical: find out who organised it. Moscow's differs - it files the petition and does nothing. The silence is itself a position."
 krcw_mad_22.a:0 "Recognise the Macedonian nation"
 krcw_mad_22.b:0 "Cultural autonomy, not political"
 krcw_mad_22.c:0 "Prosecute the organisers"
 krcw_mad_24_t:0 "The Price of the Straits"
 krcw_mad_24_d:0 "Moscow's proposal is courteously worded: a squadron of the Russian Black Sea Fleet permanently at Istanbul, nominally a standing arrangement for joint Accord exercises. The Ankara staff understands it at a glance.\n\nThe chief of staff tells the cabinet: \"We picked two things out of the ruins of the Ottoman Empire in 1944 - this country, and these two channels.\""
 krcw_mad_24.a:0 "Refuse: no garrison in the Straits"
 krcw_mad_24.b:0 "Concede passage, refuse the garrison"
 krcw_mad_24.c:0 "Accept it all for industrial aid"
 krcw_mad_26_t:0 "Two Atlases"
 krcw_mad_26_d:0 "A small thing sets off a squall: the schoolbook atlases of Bucharest and Budapest arrive on the Accord council table together, and Transylvania is a different colour in each.\n\nThe Russian delegate studies them a long while and says something that discomforts both: \"On the atlases printed in Moscow, that ground belongs to the Accord.\""
 krcw_mad_26.a:0 "Accept the Moscow formulation"
 krcw_mad_26.b:0 "Insist on the national version"
 krcw_mad_28_t:0 "The Annual Interview"
 krcw_mad_28_d:0 "Warsaw's chief of staff goes to Moscow once a year with the same file: the population, industry and railways of Pomerania and Silesia, with a historical memorandum attached.\n\nThis year's answer is the usual one, phrased a little more plainly: \"The German National Republic is the Accord's front. You are the Accord's depth. The front cannot be shaken.\" He locks the file in the safe on his return and marks next year's date on the calendar."
 krcw_mad_28.a:0 "Accept, and go on waiting"
 krcw_mad_28.b:0 "Ask instead for industry and arms in compensation"
 krcw_ma_reprice_tt:0 "Whether Moscow reprices is its decision; likelier after Savinkov's death."
 krcw_wgr_the_corridor_regime:0 "The Corridor Regime"
 krcw_wgr_the_corridor_regime_desc:0 "Three air corridors, one railway, one road, each with its width, its ceiling and its timetable written into the 1945 agreement. Berlin survives on a legal document, and the state across the wire rereads it every year looking for what it does not say."
 krcw_wgr_the_council_question:0 "The Council Question"
 krcw_wgr_the_council_question_desc:0 "The party sets the line, the unions set the terms, and the shop-floor councils say no. All three are products of the revolution, all three believe they speak for the workers, and a front-line state cannot obey three voices at once."
 krcw_wgr_the_single_command:0 "The Single Command"
 krcw_wgr_the_single_command_desc:0 "After the Berlin crisis the unions and the councils conceded the party the last word on defence matters. The concession is limited to defence matters, and everyone understands what, in a country bounded by the Elbe, does not count as a defence matter."
 krcw_wgr_the_shop_floor_republic:0 "The Shop-Floor Republic"
 krcw_wgr_the_shop_floor_republic_desc:0 "The opposite answer: the councils keep their veto even if a mobilisation plan must pass thirty thousand shop-floor votes. Its supporters say this is the thing they would be fighting to defend; its opponents say a war like that is lost before it starts."
 krcw_wgr_the_reactor_programme:0 "The Reactor Programme"
 krcw_wgr_the_reactor_programme_desc:0 "German physicists are scattered across three countries and the best of them stayed on this side. The Internationale put up the money on condition the results be shared; the Berlin laboratories accepted and added one line to the protocol: for power generation only."
 krcw_wgr_one_germany_someday:0 "One Germany, Someday"
 krcw_wgr_one_germany_someday_desc:0 "Unification is no longer the first article of the programme and it has not been struck out either: it moved to the last article, prefaced by \"when conditions are ripe\". Every generation of politicians believes the conditions will ripen in its own term."
 krcw_wgr_corridor_squeeze:0 "Pressure on the Corridors"
 krcw_berlin_pressure_tt:0 "Berlin pressure: [?global.krcw_berlin_pressure]"
 krcw_wgr_the_corridor_law:0 "Pass the Corridor Law"
 krcw_wgr_the_corridor_law_desc:0 "West Berlin's access rests on a technical agreement of 1945, and the DDR is looking for its loopholes. Write its terms into national law and publish the full text abroad."
 krcw_wgr_the_permanent_airlift:0 "The Permanent Airlift"
 krcw_wgr_the_permanent_airlift_desc:0 "Turn the airlift from an emergency measure into a standing function: dedicated airfields, aircraft and loading units, rehearsed every quarter."
 krcw_wgr_the_city_that_is_watched:0 "Build Up the West Berlin Shop Windows"
 krcw_wgr_the_city_that_is_watched_desc:0 "Give West Berlin's shops, housing and transport priority so that it is visibly better than East Berlin. It is expensive, and it has the most direct effect on East German residents."
 krcw_wgr_the_hostage_arithmetic:0 "Set the West Berlin Garrison"
 krcw_wgr_the_hostage_arithmetic_desc:0 "No garrison could hold West Berlin for a week; its purpose is to make any attack an attack on the whole Internationale. Size the garrison on that basis."
 krcw_wgr_the_wire_and_the_trains:0 "Open More Routes Out of Berlin"
 krcw_wgr_the_wire_and_the_trains_desc:0 "Add roads, canals and air routes alongside the railway, so that cutting any one of them no longer starves the city."
 krcw_wgr_berlin_is_a_land_of_ours:0 "Make West Berlin a Land"
 krcw_wgr_berlin_is_a_land_of_ours_desc:0 "Make West Berlin a Land of the Republic with seats in the federal assembly. The DDR and Moscow will treat it as unilateral annexation."
 krcw_wgr_party_union_council:0 "Reconcile Party, Unions and Councils"
 krcw_wgr_party_union_council_desc:0 "The party, the union federation and the works councils all exist side by side, each with a veto. The 1950 mobilisation exercise showed orders stalling at the factory level."
 krcw_wgr_the_single_command_f:0 "The Single Command"
 krcw_wgr_the_single_command_f_desc:0 "The party has the final say on defence; the unions and councils keep wages, hours and the running of the works. Opponents fear that \"defence\" will keep growing."
 krcw_wgr_the_shop_floor_republic_f:0 "The Shop-Floor Republic"
 krcw_wgr_the_shop_floor_republic_f_desc:0 "The councils keep their veto over defence too: mobilisation plans are voted works by works and arms schedules negotiated with the unions. Decisions are slower, and the council system stays intact."
 krcw_wgr_the_factory_and_the_front:0 "Prepare Wartime Production Plans"
 krcw_wgr_the_factory_and_the_front_desc:0 "Prepare stocks, spares, evacuation plans and alternative production lines for the Ruhr works on the assumption that war may start at any moment."
 krcw_wgr_the_reactor_at_karlsruhe:0 "Build the Karlsruhe Reactor"
 krcw_wgr_the_reactor_at_karlsruhe_desc:0 "Build a reactor at Karlsruhe with Internationale funding and shared results. The protocol limits it to power generation."
 krcw_wgr_the_german_engineers:0 "Keep the Imperial-Era Professors"
 krcw_wgr_the_german_engineers_desc:0 "Half the professors at the engineering institutes worked for the Empire. The Republic chooses not to pursue their past and to review only what they teach now."
 krcw_wgr_the_two_state_reality:0 "Adopt the Sole Representation Doctrine"
 krcw_wgr_the_two_state_reality_desc:0 "The foreign ministry declares the Republic the only lawful German state: any government that recognises the Potsdam regime loses its relations with the Republic. Several neutrals postpone ties with the DDR; the export trade complains of lost orders."
 krcw_wgr_the_small_steps:0 "Fund the Underground in the East"
 krcw_wgr_the_small_steps_desc:0 "The intelligence directorate sends money, presses and radios through West Berlin to the union opposition and church youth groups in the DDR. If a cell is exposed its members face long sentences and Berlin grows tenser."
 krcw_wgr_the_one_germany_congress:0 "The All-German Congress"
 krcw_wgr_the_one_germany_congress_desc:0 "Invite the DDR's unions, churches and local assemblies to an all-German congress, going round Schleicher's government to reach East German society directly. The DDR will treat it as interference."
 krcw_wgr_the_nation_that_waits:0 "Preserve the Common Heritage"
 krcw_wgr_the_nation_that_waits_desc:0 "Schools, broadcasting and the archives work together to preserve the language, history and culture the two Germanies share, keeping the ground ready for any future unification."
 WGR_krcw_kahle:0 "Hans Kahle"
 WGR_krcw_kahle_desc:0 "Commander of the XI International Brigade in Spain, returned to Germany with the Internationale's armies in 1943 and has run the Elbe line ever since. He is the core of the single-command faction: a front-line state cannot have three governments. His opponents point out that the only institution he has ever obeyed is an army."
 WGR_krcw_wollenberg:0 "Erich Wollenberg"
 WGR_krcw_wollenberg_desc:0 "The military organiser of the Hamburg rising of 1923, later expelled from three separate organisations for opposing every \"order from above\". The shop-floor councils take him for their own. He argues that the Republic's strength is exactly its slowness: a country that votes on everything cannot be walked into a war by a general."
 WGR_krcw_mierendorff:0 "Carlo Mierendorff"
 WGR_krcw_mierendorff_desc:0 "A social democrat survivor who worked underground before 1943 and afterwards chaired the drafting of the Republic's constitution. He is the author of the small-steps road: not unification, but post, family visits and freight. His own generation's task, he says, is not to finish Germany but to keep it alive as far as the next one."
 WGR_krcw_schroder:0 "Karl Schroeder"
 WGR_krcw_schroder_desc:0 "Secretary of the union federation and a man who treats revolution as a problem of organisation. He trusts neither Kahle's army nor Wollenberg's shop-floor assemblies, and holds that the unions should be the Republic's spine because only the unions run both the production and the people."
 krcw_wgr_berlin_cat:0 "The Berlin Corridors"
 krcw_wgr_berlin_cat_desc:0 "West Berlin lives on three air corridors, one railway and one road. The higher the pressure, the closer the city is to being cut off, and both sides can move it."
 krcw_wgr_reinforce_the_airlift:0 "Add Airlift Sorties"
 krcw_wgr_reinforce_the_airlift_desc:0 "Extra sorties beyond the timetable, raising the city's stocks from thirty days to sixty. It is logistics and also a signal."
 krcw_wgr_publish_the_agreement:0 "Publish the Text of the Agreement"
 krcw_wgr_publish_the_agreement_desc:0 "Send the full 1945 text, with a log of every violation, to every newspaper in the world. It brings in not one ton of coal, and it raises the price of the next blockade."
 krcw_wgr_day_passes_west:0 "Widen the Day Passes"
 krcw_wgr_day_passes_west_desc:0 "Let more DDR citizens come through on day passes and look at West Berlin. It is the Republic's cheapest and most effective weapon, and its price is a harder border on the other side."
 krcw_ddr_inspect_the_trains:0 "Tighten the Train Inspections"
 krcw_ddr_inspect_the_trains_desc:0 "The agreement fixes the number of trains and says nothing about how long an inspection may take. Four extra hours at the frontier for each train is one day less coal in Berlin."
 krcw_ddr_corridor_exercises:0 "Air Exercises Inside the Corridors"
 krcw_ddr_corridor_exercises_desc:0 "Exercises at the edges of the corridors. No blockade, no shooting - only making sure every crew flying into Berlin knows it is being watched."
 krcw_ddr_seal_the_sector_border:0 "Seal the Sector Border"
 krcw_ddr_seal_the_sector_border_desc:0 "The line inside Berlin is the one place on the whole curtain a man can still walk across. Sealing it stops the haemorrhage, at the price of every camera in the world photographing that wall."
 krcw_wgr_40_t:0 "Seventy Pages"
 krcw_wgr_40_d:0 "The lawyers read the 1945 agreement line by line, and their report silences the cabinet for a moment: it is precise about the air corridors, vague about the ground routes, and contains no definition at all of \"maintenance\", \"inspection\" or \"security\".\n\nThe defence minister asks the practical question: \"If they do not blockade, and simply extend each train's inspection to eight hours, what do we do?\" No one answers."
 krcw_wgr_40.a:0 "Prepare a standing airlift and depend on no road"
 krcw_wgr_40.b:0 "Renegotiate and define every word"
 krcw_wgr_40.c:0 "Declare any obstruction an act of war"
 krcw_wgr_42_t:0 "Three Voices"
 krcw_wgr_42_d:0 "The mobilisation exercise report lies on the table. The order reached every military district in forty minutes and stuck eleven hours in the Ruhr works, because the shop councils required a meeting first, as the statute says - and the statute is the Republic's own.\n\nKahle pushes the log to the middle of the table: \"Comrades, it is ninety kilometres from the far bank of the Elbe to Brunswick.\" Wollenberg pushes it back: \"Then what are we holding? A Germany that does not hold meetings - how does that differ from theirs?\""
 krcw_wgr_42.a:0 "Defence to the party, nothing else"
 krcw_wgr_42.b:0 "The councils keep the veto"
 krcw_wgr_42.c:0 "Let the unions arbitrate between the two"
 krcw_wgr_44_t:0 "The Paper That Was Not Published"
 krcw_wgr_44_d:0 "The ministry's internal assessment runs six pages and its conclusion is on the first: unification will not happen in any foreseeable term, and any policy premised on it is preparing for a date that will not come.\n\nThe paper goes round the cabinet. No one refutes it and no one will sign it. It is filed, with a line added in pencil after the reference number: \"not to be cited.\"\n\nLeaving the room, Mierendorff says to a colleague: \"Our generation's task is not to finish Germany. It is to keep it alive as far as the next one.\""
 krcw_wgr_44.a:0 "Make policy on that premise"
 krcw_wgr_44.b:0 "File it, and go on saying unification in public"
 krcw_wgr_46_t:0 "Who Will Come"
 krcw_wgr_46_d:0 "Six hundred invitations to the all-German congress go out to the DDR's unions, churches, provincial assemblies and universities. Schleicher's government announces that anyone attending forfeits public office.\n\nOn the day, a hundred and seventy-four come. The most conspicuous are the union delegation from a locomotive works in Dresden - seven men, all carrying letters of resignation, because they know they are not going back."
 krcw_wgr_46.a:0 "Give them citizenship and work"
 krcw_wgr_46.b:0 "Make the congress a standing body"
 krcw_wgr_48_t:0 "The Wall Inside Berlin"
 krcw_wgr_48_d:0 "Before dawn on a Sunday in August the DDR's engineers run wire along the sector line inside Berlin. By noon the concrete posts are up; by evening four underground stations are closed.\n\nThe one place on the whole curtain a man could still walk across is gone. Every camera in the world photographs that wall, and the Republic's papers next morning need only one headline: \"They have admitted what they were losing.\""
 krcw_wgr_48.a:0 "Let the world see the wall"
 krcw_wgr_50_t:0 "The Figures on the Manifests"
 krcw_wgr_50_d:0 "No blockade, no declaration, nothing has happened - only that freight into Berlin this quarter is nine per cent below last. Inspections take longer, \"maintenance\" occupies the corridors, a bridge on one road \"needs work\".\n\nThe mayor tells the city assembly: \"They will not shut the door. They will narrow the gap by a centimetre a year until one day we find ourselves outside it.\""
 krcw_wgr_50.a:0 "Raise the stocks and say nothing"
 krcw_wgr_50.b:0 "Publish every delay"
 krcw_wgr_52_t:0 "The Corridor Narrows"
 krcw_wgr_52_d:0 "A transport is escorted inside the corridor for eleven minutes by two DDR interceptors, close enough for the crews to see each other's faces. The DDR explains it as routine identification.\n\nThe same week Berlin's coal stocks fall below twenty days for the first time. The staff puts both facts in one report and adds a line at the end: the timing of the two is not a coincidence."
 krcw_wgr_52.a:0 "Fly fighter escort"
 krcw_wgr_52.b:0 "Full airlift, three hundred sorties a day"
 krcw_wgr_52.c:0 "Bring in the Internationale and make it the bloc's problem"
 krcw_wgr_54_t:0 "Twenty Days"
 krcw_wgr_54_d:0 "Twenty days of stocks. Every ground route is stopped for one technical reason or another and two of the three air corridors are occupied by \"exercises\". This is not a blockade - no document anywhere says blockade - and Berlin is being closed.\n\nThe cabinet has three options and the staff has assessed each; the first sentence of all three assessments is the same: this course may lead to war."
 krcw_wgr_54.a:0 "Send an armoured column up the road"
 krcw_wgr_54.b:0 "A bloc-wide airlift: make Berlin the bloc's obligation"
 krcw_wgr_54.c:0 "Negotiate: trade what the DDR wants for the corridors"
 krcw_ddr_the_haemorrhage:0 "The Haemorrhage"
 krcw_ddr_the_haemorrhage_desc:0 "Tens of thousands leave the Republic every year by the sector line inside Berlin, and those who go are not a random sample: doctors, engineers, lathe operators, teachers. The statistical office breaks the figures down by occupation, and that breakdown disturbs the cabinet more than the total."
 krcw_ddr_the_stopped_wound:0 "The Wound Stopped"
 krcw_ddr_the_stopped_wound_desc:0 "The border is sealed, the people stop leaving, and for the first time in two years a factory's roll of skilled men does not change. The price is that this regime appears in the world's photographs against a wall, and its own citizens know which way that wall faces."
 krcw_ddr_the_officers_republic:0 "The Officers' Republic"
 krcw_ddr_the_officers_republic_desc:0 "The Imperial General Staff was never dissolved, only renamed. Half the Republic's ministers have worn uniform and the appointment of the other half requires the consent of the half that has. This country is not ruled by a party but by an officer corps."
 krcw_ddr_the_civilian_turn:0 "The Civilian Turn"
 krcw_ddr_the_civilian_turn_desc:0 "The other choice: move the budget from the army to housing, consumer goods and railways, and let the Republic look for the first time like a place one could live rather than a barracks. The General Staff agreed to this on condition that it decide how much is moved."
 krcw_ddr_the_junker_bargain:0 "The Junker Bargain"
 krcw_ddr_the_junker_bargain_desc:0 "The eastern estates are divided at last, and on the regime's own terms: the landlords take state bonds and places in the army, the tenants take deeds and a thirty-year loan. Neither side is satisfied and neither has a reason any more to listen to the broadcasts from across the line."
 krcw_ddr_the_price_of_the_patron:0 "The Patron's Price"
 krcw_ddr_the_price_of_the_patron_desc:0 "Moscow provides drawings, oil and a military alliance worth having, and asks for priority, bases and the last vote on the Republic's defence. Every government does the arithmetic and every government finds it has no second option."
 krcw_ddr_the_thief_across:0 "The Neighbour Who Takes Our People"
 krcw_ddr_wgr_centres_tt:0 "Whether West Germany slows its reception centres is its decision; likelier if it signed the transit agreement or Renn leads it."
 krcw_ddr_emigration_tt:0 "Emigration index: [?krcw_ddr_emigration]"
 krcw_ddr_the_open_door_in_berlin:0 "Count the Departures Through Berlin"
 krcw_ddr_the_open_door_in_berlin_desc:0 "The only open stretch of the border is the sector line inside Berlin, and tens of thousands leave through it each year. Count the departures and break them down by occupation."
 krcw_ddr_give_them_a_reason_to_stay:0 "Put Housing First"
 krcw_ddr_give_them_a_reason_to_stay_desc:0 "Improve housing, wages and consumer goods to slow the emigration. The money has to come out of the army budget, and the General Staff objects."
 krcw_ddr_the_skilled_man_register:0 "The Register of Skilled Men"
 krcw_ddr_the_skilled_man_register_desc:0 "Register people in key occupations and require a permit to travel. Those registered cannot leave, and others begin to worry they will be next."
 krcw_ddr_the_question_of_the_wall:0 "Review the Plan to Seal the Line"
 krcw_ddr_the_question_of_the_wall_desc:0 "The General Staff has long had a plan to seal the Berlin sector line, and it is technically easy. Schleicher is worried about what it would do to the regime's image in the long run."
 krcw_ddr_the_republic_worth_staying_in:0 "Enact the Welfare Programme"
 krcw_ddr_the_republic_worth_staying_in_desc:0 "Do not seal the border; build up welfare instead: housing, pensions, the eight-hour day, a hospital in every district. The price is a smaller army."
 krcw_ddr_the_concrete_answer:0 "Seal the Berlin Sector Line"
 krcw_ddr_the_concrete_answer_desc:0 "Seal the Berlin sector line, widen the skilled-worker register, and require a reason to travel. The emigration stops, and the regime's international image suffers badly."
 krcw_ddr_the_staff_that_never_dissolved:0 "The Staff That Was Never Dissolved"
 krcw_ddr_the_staff_that_never_dissolved_desc:0 "The Imperial General Staff survived 1944 under another name, and civilian ministers are appointed with its consent. Schleicher is the only man who can hold both the generals and the civilians in check."
 krcw_ddr_the_estates_divided:0 "Buy Out the Junker Estates"
 krcw_ddr_the_estates_divided_desc:0 "Buy out the Junker estates in the east: the landlords get state bonds and army posts, the tenants get deeds and thirty-year loans."
 krcw_ddr_what_moscow_asks:0 "Negotiate Aid Terms with Moscow"
 krcw_ddr_what_moscow_asks_desc:0 "Moscow offers drawings, oil and a military alliance, and asks for procurement priority, two air bases, and the final say over the Republic's defence."
 krcw_ddr_the_barracks_or_the_housing:0 "Decide Between Army and Housing"
 krcw_ddr_the_barracks_or_the_housing_desc:0 "The staff wants the same budget for twelve new divisions and the housing ministry for two hundred thousand flats. Schleicher decides."
 krcw_ddr_the_throne_decided:0 "Freeze the Throne Question"
 krcw_ddr_the_throne_decided_desc:0 "The constitution recognises the monarchy but requires a two-thirds vote of the National Assembly for any succession. The throne stays empty and off the agenda."
 krcw_ddr_the_third_germany_stands:0 "Refuse to Recognise the Rhine Republic"
 krcw_ddr_the_third_germany_stands_desc:0 "The foreign ministry declares that only the National Republic speaks for the German nation and will not keep relations with states that recognise the western regime. The Accord follows suit, and half the neutral trade missions stay away."
 DDR_krcw_hammerstein:0 "Kurt von Hammerstein-Equord"
 DDR_krcw_hammerstein_desc:0 "An old Imperial general famous for refusing to obey - the best-known facts of his career are the several times he declined orders he judged absurd. He holds that the Republic should be run by its officer corps, the army being in his view the one institution left in the country that has not rotted, and holds equally that the army should not touch Berlin, because an army cannot win a war fought with cameras."
 DDR_krcw_heuss:0 "Theodor Heuss"
 DDR_krcw_heuss_desc:0 "A liberal scholar, journalist and constitutionalist, and the best-known civilian politician in the Republic. He argues for the civilian turn - budget out of the army and into housing and railways - because no frontier can be held by a country nobody wants to stay in. The generals tolerate him because he is the one man the regime can show to a foreign correspondent."
 DDR_krcw_jarres:0 "Karl Jarres"
 DDR_krcw_jarres_desc:0 "An old-fashioned municipal conservative, once mayor of Duisburg, who came within reach of the Imperial presidency in 1925. He speaks for the part of the Republic that trusts neither the army nor revolution: municipal government, administration, police, budget - get those four right and the rest can wait. His view of the throne is the frankest in the country: \"Filling it would cost a year. Leaving it empty costs nothing.\""
 DDR_krcw_zaisser:0 "Wilhelm Zaisser"
 DDR_krcw_zaisser_desc:0 "The organiser of the People's Police, a man who treats state security as an engineering problem. He built the Republic's files, registers and networks of informers, and he wrote the plan for sealing the sector line in Berlin. His argument never touches ideology: eight hundred of those who leave each year are doctors, and the Republic cannot train eight hundred doctors in a year."
 krcw_ddrd_10_t:0 "The Breakdown by Occupation"
 krcw_ddrd_10_d:0 "The statistical office's return breaks last year's departures through Berlin down by occupation. The total is seventy-four thousand, and the cabinet is used to totals; the breakdown is new - eight hundred and twenty-one doctors, fourteen hundred engineers, thirty-one hundred lathe and mill operators, twenty-seven hundred teachers.\n\nZaisser puts the return down and says something no one contradicts: \"The Republic cannot train eight hundred doctors in a year. This is not a political question. It is arithmetic.\""
 krcw_ddrd_10.a:0 "Keep them with housing and wages"
 krcw_ddrd_10.b:0 "Register the critical trades and restrict travel"
 krcw_ddrd_10.c:0 "Show Moscow the account and ask for compensation"
 krcw_ddrd_12_t:0 "The Plan in the Safe"
 krcw_ddrd_12_d:0 "The plan itself is eleven pages, with an engineer's equipment schedule and a street-by-street map of Berlin annexed. Technically there is no difficulty: before dawn on a Sunday, concrete within three days.\n\nHammerstein is the only outright opponent, and his reason is not moral: \"Gentlemen, an army cannot win a war fought with cameras. The day after that wall goes up the world will know that people on our side want to leave and people on theirs do not. Once that is photographed we shall never scrub it off.\""
 krcw_ddrd_12.a:0 "Approve the plan and wait for the moment"
 krcw_ddrd_12.b:0 "Withhold approval, try housing and wages first"
 krcw_ddrd_12.c:0 "Destroy the plan and pledge publicly not to close the line"
 krcw_ddrd_14_t:0 "The Half in Uniform"
 krcw_ddrd_14_d:0 "An internal dispute over the procedure for appointing ministers reaches Schleicher. Heuss puts it directly: which article of the constitution requires the consent of the General Staff for the appointment of a civilian minister?\n\nThe answer is: none. The practice has run since 1944, was never written down, and has never been broken. Schleicher hears him out and says: \"Dr Heuss, you are asking a question of law. What I have to manage is a question of fact.\""
 krcw_ddrd_14.a:0 "Write the practice into the constitution"
 krcw_ddrd_14.b:0 "Keep the practice and do not write it down"
 krcw_ddrd_14.c:0 "Abolish it: appointments to the assembly"
 krcw_ddrd_16_t:0 "Twelve Divisions or Two Hundred Thousand Flats"
 krcw_ddrd_16_d:0 "Two budget papers lie side by side and the figures are nearly identical. The staff's gives twelve new divisions; the housing ministry's gives two hundred thousand flats, mostly in Leipzig, Dresden and Halle - the three cities at the top of the statistical office's departure tables.\n\nSchleicher does not declare himself. He asks only: \"If the people leave, where do the twelve divisions come from?\" The minutes are blank for four lines here."
 krcw_ddrd_16.a:0 "To the army: the front needs divisions"
 krcw_ddrd_16.b:0 "To the housing: without people there is no front"
 krcw_ddrd_16.c:0 "Both, and borrow from Moscow"
 krcw_ddrd_18_t:0 "Lawfully Empty"
 krcw_ddrd_18_d:0 "The constitutional amendment passes by two thirds: the Republic recognises the monarchy as its form of state, and a succession requires confirmation by two thirds of the national assembly. On the day it passes, no candidate is nominated.\n\nIn the corridor Jarres says something to a journalist that is widely quoted: \"Filling that seat would cost a year of political capital. Leaving it empty costs nothing. We have just put that fact into legal form.\""
 krcw_ddrd_18.a:0 "Leave it there and do not raise it again"
 krcw_ddrd_20_t:0 "The Locomotive Works at Leipzig"
 krcw_ddrd_20_d:0 "The tool room of a locomotive works at Leipzig lost nineteen men last month, all of them skilled, all of them through Berlin. The foreman's report is written calmly and its last sentence reads: \"We are now running the precision lathes with apprentices.\"\n\nForty-one reports like it arrived this quarter."
 krcw_ddrd_20.a:0 "Higher pay and housing for skilled men"
 krcw_ddrd_20.b:0 "Put these works on the priority register"
 krcw_ddrd_22_t:0 "The Country Is Leaking"
 krcw_ddrd_22_d:0 "This year's figure is a hundred and forty thousand. The statistical office did not break it down this time, because a breakdown has stopped meaning anything - everyone who can go, goes. Four underground stations in Berlin fill every morning with people carrying two suitcases, holding one-way tickets that cost thirty pfennig.\n\nZaisser brings the plan to cabinet a second time. This time Hammerstein says nothing either."
 krcw_ddrd_22.a:0 "Execute the plan: seal the sector line"
 krcw_ddrd_22.b:0 "Gamble on housing and wages one last time"
 krcw_ddrd_22.c:0 "Demand West Germany close its reception centres"
 krcw_mam_1_t:0 "Who Shall Rule"
 krcw_mam_1_d:0 "In 1949 every small state of the Accord circles the same question: who shall rule?\n\nThe generals say the army was the one thing that did not come apart in the collapse of 1944. The civilians say a regime living on martial law is worth little in Moscow's eyes. And in some of these countries the crown still hangs on the wall, where no one dares put it on and no one dares take it down.\n\nMoscow is unexpectedly cold about the whole question. Its ambassador says only: \"We do not care what your constitution says. We care whose orders your divisions take.\""
 krcw_mam_1.a:0 "The soldiers govern: order before everything"
 krcw_mam_1.b:0 "The civilians govern: put the martial law away"
 krcw_mam_1.c:0 "Take the crown down and wear it"
 krcw_mam_1.d:0 "Move no one: leave the question hanging on the wall"
 krcw_mam_10_t:0 "The Common List"
 krcw_mam_10_d:0 "The League's delegation goes to Moscow with a list: fairer prices for resources, fewer garrisons, national divisions under national command. It is the first time since the Accord was founded that anyone has put these things on a single sheet of paper.\n\nThe talks run four days. The Russians neither refuse nor agree; they split the list into three - prices are negotiable, garrisons can be reduced, command is not to be touched.\n\nThe delegation comes home with a conclusion none of them expected: Moscow needs this league more than they had supposed. That discovery is worth more than anything on the list."
 krcw_mam_10.a:0 "Take the prices, leave command for next time"
 krcw_mam_10.b:0 "Press for fewer garrisons even at the old prices"
 krcw_mam_10.c:0 "Insist on command and accept an ugly deadlock"
 krcw_mam_20_t:0 "The Ambassador Wants an Explanation"
 krcw_mam_20_d:0 "The sentence comes out in a parliamentary debate that should have been dull: \"What if we belonged to neither Paris nor Moscow?\" The man who said it is a backbencher, and by the next morning every paper in the country has printed it.\n\nThe Russian ambassador requests an audience within forty-eight hours. He is courteous and perfectly clear: nothing in the Accord's treaties forbids a member from discussing neutrality, and nothing in them guarantees that a member which discusses neutrality goes on receiving oil, drawings and spare parts.\n\nAfter the meeting the foreign minister writes one line: \"What we learned today is that this road is not closed. It is priced.\""
 krcw_mam_20.a:0 "Deny it publicly and deal with the backbencher"
 krcw_mam_20.b:0 "Neither deny nor pursue it: leave the thought in the air"
 krcw_mam_20.c:0 "Begin quietly costing the road"
 TUR_krcw_inonu:0 "Ismet Inonu"
 TUR_krcw_inonu_desc:0 "The Republic's second man, more dangerous at a negotiating table than in the field. He holds that Turkey survives by holding both blocs at arm's length and belonging to neither: passage through the Straits is negotiable, a garrison is not, not by an inch. The generals think him soft, and he comes back from every negotiation with more machine tools."
 TUR_krcw_orbay:0 "Huseyin Rauf Orbay"
 TUR_krcw_orbay_desc:0 "An old politician out of the navy, and the man who signed an armistice in 1918 - the thing he least wishes to do twice. That is exactly why he is the hardest voice in the country on the Straits: he has seen what happened to an empire that handed them over."
 TUR_krcw_karabekir:0 "Kazim Karabekir"
 TUR_krcw_karabekir_desc:0 "Commander of the eastern army and the designer of every fortification on the Anatolian plateau. His view of the Accord is practical: Moscow's divisions can help Turkey hold the east, and Moscow's fleet, once in the Straits, will never leave. His proposal is to give the Accord the army and keep the Straits."
 TUR_krcw_kivilcimli:0 "Hikmet Kivilcimli"
 TUR_krcw_kivilcimli_desc:0 "A Marxist who has spent twenty years in and out of the Republic's prisons. His position is one almost no one in Turkey dares support aloud: the Accord is not protection but a mortgage, and Turkey should leave it and then decide for itself whom to trade with. The junta has never had him shot, because he has more readers than they care to admit."
 TIB_krcw_dalai:0 "The 14th Dalai Lama"
 TIB_krcw_dalai_desc:0 "He is fourteen in 1949, the regency governs in his name, and everyone is waiting for him to come of age. His education is scholastic rather than political, and every party - Nanjing, Kalimpong, the three great monasteries - is already preparing its arguments for the adult who will one day decide for himself. Every sentence he later utters will be parsed word by word in three capitals."
 TIB_krcw_ngapoi:0 "Ngapoi Ngawang Jigme"
 TIB_krcw_ngapoi_desc:0 "Governor of Chamdo and one of the few nobles who argues for modernisation. His judgement is cold enough to discomfort his colleagues: Tibet cannot be held, and the only question is what terms buy autonomy - terms best negotiated early, because once an army crosses the Jinsha there are no terms left to negotiate."
 TIB_krcw_tsarong:0 "Tsarong Dzasa"
 TIB_krcw_tsarong_desc:0 "A commoner who climbed to the top of the nobility, and the old army's commander: practical to the point of coldness. He holds that what Tibet needs is neither prayer nor surrender but a real standing army and a road to India - both of which cost money, which is why he has never had a moral difficulty with the silver from Kalimpong."
 TIB_krcw_lungshar:0 "Tsipon Lungshar"
 TIB_krcw_lungshar_desc:0 "A finance officer who went to Britain, saw a parliament and came back arguing for limits on the nobility and the monasteries. His reforms briefly made him the most powerful layman in Lhasa and the man the three great monasteries most wanted removed. The road he stands for - a Tibet that reforms itself - is the most fragile in the three-way contest and the one fewest people bet on."
 RAJ_krcw_tata:0 "J. R. D. Tata"
 RAJ_krcw_tata_desc:0 "Industrialist, pilot, and master of the federation's largest steel and aviation concerns. His interest in politics runs to exactly one item: making the federation a country that can build things. He likes neither the princes' tax system nor parliament's tariff debates, and both sides need his money - which makes him the most influential man in the federation never to have stood for election."
 RAJ_krcw_tiwana:0 "Khizar Hayat Tiwana"
 RAJ_krcw_tiwana_desc:0 "A Punjabi landholding politician who sees the federation as a bargain among provinces rather than a nation. The whole of his political craft lies in getting Hindus, Muslims and Sikhs to divide the revenue at one table without overturning it - which he managed for ten years, and which he says himself was luck."
 RAJ_krcw_scindia_heir:0 "Digvijaysinhji Ranjitsinhji"
 RAJ_krcw_scindia_heir_desc:0 "Maharaja of Nawanagar and one of the few in the Chamber of Princes who argues for reforming it. His case is ungracious to his peers: unless the princes surrender part of their power themselves, parliament will take all of it within twenty years, and parliament will pay no compensation. He is a hawk on Tibet, believing a Chamber with a frontier achievement to its name is harder to abolish."
 RAJ_krcw_wavell_holdover:0 "Archibald Wavell"
 RAJ_krcw_wavell_holdover_desc:0 "One of the last British generals of the old Indian Army to have stayed, now an adviser to the federation's defence ministry. He has never explained publicly why he remained, and the federation's reason for keeping him is plain: he drew the Himalayan supply maps. His advice on Tibet is consistently cold - that frontier can be held, and it cannot afford a war."
 krcw_eng_the_settled_republic:0 "The Settled Republic"
 krcw_eng_the_settled_republic_desc:0 "After thirty years the revolution no longer has to prove itself daily. The constitution is finished, the legal status of the royal house is settled, and the upper chamber is filled by industry delegates. A country that need no longer watch for a restoration can spend its energy elsewhere, at the price of losing the tension of a state always ready to fight."
 krcw_eng_the_planned_isles:0 "The Planned Isles"
 krcw_eng_the_planned_isles_desc:0 "The plan's first decade built railways and blast furnaces; its second builds houses. The bombed-out streets are rebuilt at last, rationing ends in 1951, and the union federation discovers that a worker with heating and running water keeps his enthusiasm for the revolution longer, not shorter."
 krcw_eng_the_independent_deterrent:0 "A Deterrent of Our Own"
 krcw_eng_the_independent_deterrent_desc:0 "Britain has the physicists and, after 1946, no empire left to spend on. The first device fires at sea west of the Hebrides and the communiqué runs to two lines. The weight of this country's voice inside the Internationale changes from that day, and its consumer-goods targets slip by six years."
 krcw_eng_the_shared_deterrent:0 "The Shared Deterrent"
 krcw_eng_the_shared_deterrent_desc:0 "The enrichment plant, the drawings and the men go to the Internationale's joint programme in exchange for joint ownership and investment from Paris. Technically it is efficiency; politically it is a wager - Britain is betting that a weapon three countries hold together is one no single country dares use alone."
 krcw_eng_the_refusal:0 "The Refusal"
 krcw_eng_the_refusal_desc:0 "The Trades Congress votes the nuclear programme down by a hundred and forty-seven votes. The resolution gives the reason: \"A weapon that cannot be used against armies alone does not belong to a workers' state.\" The decision makes Britain count for less in both Moscow and Paris, and returns its money to houses and schools."
 krcw_eng_nuclear_partner:0 "Partner in the Programme"
 krcw_eng_the_constitution_finished:0 "Finishing the Constitution"
 krcw_eng_the_constitution_finished_desc:0 "For thirty years Britain has been governed by resolutions of the Congress, without a written constitution. With the first generation ageing, draft one that sets out the powers of the Congress and the local federations."
 krcw_eng_the_chamber_of_industries:0 "The Chamber of Industries"
 krcw_eng_the_chamber_of_industries_desc:0 "The upper chamber, empty for thirty years, becomes a Chamber of Industries with delegates from each federation by membership."
 krcw_eng_the_windsor_question:0 "Define the Windsors' Legal Status"
 krcw_eng_the_windsor_question_desc:0 "The exiled Windsors have signed a treaty in Melbourne as \"King of Britain\". Settle their status in law: traitors, a foreign monarchy, or not recognised at all."
 krcw_eng_the_election_we_might_lose:0 "Allow Opposition Candidates"
 krcw_eng_the_election_we_might_lose_desc:0 "The constitution allows candidates opposed to the revolution to stand for the Congress. It is bitterly disputed among revolutionaries, and Wintringham comes out in favour."
 krcw_eng_the_second_decade:0 "Draw Up the Second Decade Plan"
 krcw_eng_the_second_decade_desc:0 "The first decade rebuilt railways, blast furnaces and shipyards. The second decade plan concentrates on housing, heating, running water and schools."
 krcw_eng_the_end_of_rationing:0 "Abolish Rationing"
 krcw_eng_the_end_of_rationing_desc:0 "Rationing ends in July 1954. The government holds no celebration."
 krcw_eng_the_second_new_towns:0 "The New Towns"
 krcw_eng_the_second_new_towns_desc:0 "Some bombed workers' districts are rebuilt in place and others rehoused in new towns outside the old cities. Each new district is built around a workers' club."
 krcw_eng_what_the_plan_is_for:0 "Reorder the Plan's Priorities"
 krcw_eng_what_the_plan_is_for_desc:0 "Steel output and housing compete for the same money. The Congress decides to put housing improvements first and expand steel capacity afterwards."
 krcw_eng_nuclear_research:0 "Nuclear Physics Research"
 krcw_eng_the_physicists_we_kept:0 "The Physicists We Kept"
 krcw_eng_the_physicists_we_kept_desc:0 "Some of the best physicists in postwar Europe stayed in Britain. The Cambridge laboratory reports that the country can build a nuclear device, and that whether to do so is a political decision."
 krcw_eng_a_deterrent_of_our_own:0 "Build Our Own Device"
 krcw_eng_a_deterrent_of_our_own_desc:0 "Build a device independently, without Paris or Moscow. A deterrent of its own gives Britain more say on the Elbe."
 krcw_eng_the_bloc_programme:0 "Join the Joint Nuclear Programme"
 krcw_eng_the_bloc_programme_desc:0 "Join a three-power nuclear programme: Britain provides scientists and plutonium, France the money, West Germany the engineering. Ownership is shared and use requires unanimity."
 krcw_eng_the_trades_congress_refuses:0 "Abandon the Nuclear Programme"
 krcw_eng_the_trades_congress_refuses_desc:0 "The Congress votes down the nuclear budget. Many miners' delegates vote against because the money would have come out of the housing programme."
 krcw_eng_sub_tech:0 "Submarine Technology"
 krcw_eng_the_fleet_and_the_bomb:0 "Deploy the Deterrent at Sea"
 krcw_eng_the_fleet_and_the_bomb_desc:0 "Base the deterrent at sea, since anything an island keeps on land is too easily found."
 ENG_krcw_strachey:0 "John Strachey"
 ENG_krcw_strachey_desc:0 "Physicist, former naval officer, and the author of the three-page Cambridge memorandum. The question on its third page - \"If we can, should we?\" - is his own addition, and his own answer is no: he has calculated what such a weapon protects on an island, and the conclusion is that an island has no depth in which to reply."
 krcw_eng_70_t:0 "The Thing Unwritten for Thirty Years"
 krcw_eng_70_d:0 "The drafting committee's first session runs nine hours without writing a word. The argument sticks on Article One: does sovereignty rest in the Congress, or in the sum of the local federations?\n\nThis is not academic. In the coal strike of 1934 the Congress ordered a return to work and the South Wales federation refused, each believing itself entitled. That was got past by compromise, and compromise set no precedent - which is exactly why it must now be written down."
 krcw_eng_70.a:0 "Sovereignty rests in the Congress"
 krcw_eng_70.b:0 "Sovereignty rests in the federations"
 krcw_eng_70.c:0 "Both, with disputes to an arbitration bench"
 krcw_eng_72_t:0 "In the Name of the King"
 krcw_eng_72_d:0 "The court at Melbourne has signed a trade agreement in the name of the King of Britain. In law this is a nuisance: to accept the signature is to concede that the royal house still represents Britain, and to declare it void requires saying why, and any explanation must first answer what the royal house actually is.\n\nThe foreign ministry submits three options, and the legal department writes the same note under each: \"This option will be quoted back at us.\""
 krcw_eng_72.a:0 "Declare them foreign private persons; the signature is void"
 krcw_eng_72.b:0 "No comment: even a denial concedes something"
 krcw_eng_72.c:0 "Indict for treason and demand extradition"
 krcw_eng_74_t:0 "My Father Still Lives in the Room He Was Born In"
 krcw_eng_74_d:0 "On the fourth day of the debate on the second decade, a South Wales miners' delegate rises without notes. What he says is later printed on the flyleaf of every annual report the housing ministry issues:\n\n\"We won the revolution. We nationalised the pits, we sent the King away, we fought in Spain. My father still lives in the room he was born in, and behind that room there is still the privy in the yard. Comrades - what did we win?\"\n\nThe draft passes that afternoon. Nobody calls for a division."
 krcw_eng_74.a:0 "Housing first; the steel targets wait"
 krcw_eng_74.b:0 "Both, and borrow from the Internationale"
 krcw_eng_76_t:0 "The Question on the Third Page"
 krcw_eng_76_d:0 "When the Cambridge memorandum reaches the cabinet, its first two pages provoke no argument: technically feasible, at a cost equal to a third of the second decade's housing programme.\n\nThe entire argument is about the one question on the third page. Strachey - who wrote the memorandum and put the question in it - gives his own answer in cabinet: \"Gentlemen, I have calculated what this thing protects on an island. An island has no depth in which to reply. It has one chance to strike first, and that is not deterrence. That is something else.\""
 krcw_eng_76.a:0 "Continue the research; decide when there is a device"
 krcw_eng_76.b:0 "Put the question to the Congress now"
 krcw_eng_76.c:0 "Ask Paris first whether they would share it"
 krcw_eng_78_t:0 "West of the Hebrides"
 krcw_eng_78_d:0 "On the morning of 14 October 1953 Britain fires its first device at sea west of the Hebrides. The official communiqué runs to two lines: no photographs, no correspondents, no celebration.\n\nMoscow's response is a fourteen-page protest. Paris's is a private telephone call whose content was never published. And the Congress proceeds with its order of business that day - the first item being housing appropriations for South Wales."
 krcw_eng_78.a:0 "This changes the weight of our voice"
 ITA_krcw_gronchi:0 "Giovanni Gronchi"
 ITA_krcw_gronchi_desc:0 "A left Catholic out of the confessional unions, and the man who proved an Italian believer can abandon neither his church nor the revolution. His function in the Republic is irreplaceable: the peasants of the south listen to their priests, and the priests listen to him. He argues the Republic should leave the church's schools and parishes alone, because on that account the church gives more than it asks."
 ITA_krcw_gabriotti:0 "Venanzio Gabriotti"
 ITA_krcw_gabriotti_desc:0 "A union organiser from Umbria who runs factory councils as organs of administration. His position is unpopular in Italy and practical: the Republic's problem is not a mistaken programme but that nobody collects the taxes, nobody mends the roads and nobody makes the trains run on time. He leaves the revolution to others and wants a budget that can be executed."
 ITA_krcw_sardi:0 "Alessandro Sardi"
 ITA_krcw_sardi_desc:0 "One of the few old liberal deputies neither exiled nor imprisoned, now a fiscal adviser to the Republic. His reason for staying is simple: Italy's debt was borrowed by his generation and he does not want anyone else explaining it. He opposes Parri's adventure at Trieste, not from pacifism but because he has costed a war."
 SPR_krcw_pestana:0 "Angel Pestana"
 SPR_krcw_pestana_desc:0 "The voice of the faction inside the CNT that argues for organisational discipline, and abused by his own comrades for thirty years on that account. His case is the hardest to hear and hardest to answer in the Iberian revolution: a federation refusing every central body can neither collect a tax nor hold a frontier, and Franco's remnants are waiting on the far side of the Pyrenees."
 SPR_krcw_ibarruri:0 "Dolores Ibarruri"
 SPR_krcw_ibarruri_desc:0 "La Pasionaria, author of the slogan of 1936, and now the strongest voice in the federation for central authority. Her quarrel with the anarchists can be traced through every military failure of the civil war, and her conclusion has never altered: the communes of Barcelona may decide what they produce and may not decide when they fight."
 SPR_krcw_tarradellas:0 "Josep Tarradellas"
 SPR_krcw_tarradellas_desc:0 "An administrator of the Catalan government who has spent twenty years translating between the anarchists and Madrid. What he wants pleases neither: a written federal constitution setting down what Catalonia, the Basque country and Portugal each retain. He has said something that discomforts both sides: \"A commune does not need a constitution. A federation does.\""
 CAN_krcw_coldwell:0 "M. J. Coldwell"
 CAN_krcw_coldwell_desc:0 "A Saskatoon schoolmaster and the political leader of the prairie cooperative movement. He speaks for the least revolutionary and most solid part of the Syndicalist Republic: wheat, cooperatives, credit unions and parish schools. He has no interest in exporting revolution east of the Mississippi, on the grounds that prairie farmers who cannot sell wheat vote a government out - and the Republic has not yet learned how to lose an election."
 CAN_krcw_mcewen:0 "Tom McEwen"
 CAN_krcw_mcewen_desc:0 "Editor of the union papers, the Republic's best propagandist, and the organiser of the system that moves American syndicalists across the border. He stands between Woodsworth's pacifism and Buck's exported revolution: no troops, and never close the underground line, because if the comrades on the east bank are taken by Long's men, this side of the border is next."
 CAN_krcw_murray:0 "Leonard Murray"
 CAN_krcw_murray_desc:0 "The founder of the Republic's navy, an officer who worked up from gunboats on the Great Lakes to North Atlantic convoys. His politics are a purely geographical judgement: Canada cannot hold a land frontier and it can make the St Lawrence unblockadeable by anyone. He argues the whole defence budget should go to sea, which sets him against every politician who came out of the army."
 krcw_wgr_the_arrivals:0 "The Arrivals"
 krcw_wgr_the_arrivals_desc:0 "Tens of thousands come across the wire every year, and they are not a random sample: doctors, engineers, lathe operators, teachers. The Republic receives a roll of skilled men someone else trained, and pays in housing, schools, and a sentence nobody wants to say aloud - the money that settles them was the housing budget for the workers already here."
 krcw_wgr_the_open_door:0 "The Open Door"
 krcw_wgr_the_open_door_desc:0 "The Republic's law is that any German who steps across this side is a citizen of it: no application, no screening. The law costs the equivalent of two divisions a year, and it works better than any broadcast, because it is not propaganda but a door that is actually open."
 krcw_wgr_the_managed_intake:0 "The Managed Intake"
 krcw_wgr_the_managed_intake_desc:0 "The other choice: an annual quota set by the housing and the jobs that actually exist, with the rest in a queue. It is ugly to defend and it is the only thing that administers: in 1951 the Ruhr reception centres held a hundred and ten thousand people, and forty thousand dwellings were built that year."
 krcw_wgr_the_workers_army:0 "The Workers' Army"
 krcw_wgr_the_workers_army_desc:0 "An army whose officers are chosen through the unions, whose soldiers have a right of complaint, and whose refusal of an unlawful order is protected in law. Professional soldiers say such a force cannot fight; the experience of 1943 says the opposite, because it is the one German army that will never be used against German workers."
 krcw_wgr_the_general_staff_returns:0 "The General Staff Returns"
 krcw_wgr_the_general_staff_returns_desc:0 "Bring back the staff officers purged in 1943: they understand how to run a campaign on the Central European plain and the Republic's union officers do not. The price is recorded in the votes against - these men swore to a Kaiser twenty years ago and to a different Germany ten years ago."
 krcw_wgr_the_german_inheritance:0 "The German Inheritance"
 krcw_wgr_the_german_inheritance_desc:0 "The two Germanies contest more than territory: Goethe, Bach, Humboldt and the archives. The Republic's position is that these belong to no regime but to the people who speak the language, so scholars from both sides may use them. The position costs little, and its effect is a yearly crop of DDR professors applying for extended \"academic visits\"."
 krcw_wgr_took_our_people:0 "Took Our People"
 krcw_wgr_arrivals_tt:0 "Arrivals index: [?krcw_wgr_arrivals]"
 krcw_wgr_the_reception_centres:0 "The Reception Centres"
 krcw_wgr_the_reception_centres_desc:0 "Convert old barracks in the Ruhr into reception centres for arrivals from the DDR. Citizenship is simple; housing, work and the children's schooling are not."
 krcw_wgr_the_door_stays_open:0 "Keep the Door Open"
 krcw_wgr_the_door_stays_open_desc:0 "The congress refuses to cap arrivals: restricting East Germans would concede that the demarcation line is a national frontier. Resettlement is expensive."
 krcw_wgr_the_intake_quota:0 "The Intake Quota"
 krcw_wgr_the_intake_quota_desc:0 "Set an annual intake by the housing and jobs actually available; the rest wait their turn. Local unions back it, because local families are waiting for housing too."
 krcw_wgr_what_they_brought:0 "Count the Skills That Came West"
 krcw_wgr_what_they_brought_desc:0 "Count the engineers, doctors and skilled workers among the arrivals from the DDR, and place them in the trades short of hands."
 krcw_wgr_rearming_germans:0 "Rebuild the Armed Forces"
 krcw_wgr_rearming_germans_desc:0 "The standing army has sixteen divisions against thirty-one across the river. Expanding it is not disputed; the question is how to make sure it can never be turned on the workers."
 krcw_wgr_the_union_officers:0 "Let the Unions Choose the Officers"
 krcw_wgr_the_union_officers_desc:0 "Officers are chosen through the unions, soldiers have a right of complaint, and refusing an unlawful order is protected in law. The army loses some efficiency and becomes politically the most reliable it can be."
 krcw_wgr_recall_the_staff:0 "Recall the Staff"
 krcw_wgr_recall_the_staff_desc:0 "Recall the staff officers purged in 1943, who know how to run large formations on the Central European plain. Many in the congress object, because they served the Empire."
 krcw_wgr_the_oath:0 "Revise the Military Oath"
 krcw_wgr_the_oath_desc:0 "The new military oath names no person and no government: the soldier swears to defend the constitution and to refuse any order that violates it."
 krcw_wgr_what_the_ruhr_is_for:0 "Set the Ruhr's Output Priorities"
 krcw_wgr_what_the_ruhr_is_for_desc:0 "With the Ruhr rebuilt, the defence, housing and trade ministries each claim the steel: armoured divisions, consumer goods, or exports for foreign exchange. The planning board decides."
 krcw_wgr_the_consumer_decade:0 "Put Consumer Goods First"
 krcw_wgr_the_consumer_decade_desc:0 "The second decade's steel goes first to housing, appliances and bicycles. The housing ministry argues that West Berlin's pull depends on there actually being goods in the shops."
 krcw_wgr_the_armoured_decade:0 "Put the Armoured Divisions First"
 krcw_wgr_the_armoured_decade_desc:0 "The second decade's steel goes first to armoured divisions. The defence ministry argues that the numerical edge across the Elbe has to be offset before anything else."
 krcw_wgr_the_two_inheritances:0 "Open the Cultural Heritage to All"
 krcw_wgr_the_two_inheritances_desc:0 "Goethe, Bach and the Humboldt library are all in the DDR. The Republic does not demand them back; it holds that the heritage belongs to all Germans and opens its own archives to East German scholars."
 krcw_wgr_60_t:0 "The People on the Housing List"
 krcw_wgr_60_d:0 "A small thing happens outside a Ruhr reception centre: local union men hang a banner reading \"We are on the list too.\" No confrontation, no chanting; the banner comes down by itself after two hours.\n\nThe housing minister puts it in that week's cabinet report with a judgement of his own: \"This is not xenophobia. It is two sets of people on one list, and the list is too short. If we do not answer this, somebody will answer it for us.\""
 krcw_wgr_60.a:0 "The local list comes first"
 krcw_wgr_60.b:0 "Both lists, and double the housing budget"
 krcw_wgr_60.c:0 "Send the arrivals straight to the works that need them"
 krcw_wgr_62_t:0 "Whose Orders It Takes"
 krcw_wgr_62_d:0 "On the fourth day of the rearmament debate an old delegate from Hamburg asks to speak. He was a sailor at Kiel in 1918 and watched the Freikorps enter Berlin in 1919.\n\n\"Comrades, I am not against divisions. I am against the thing I have seen twice in my life: a German army used against German workers. In 1919 the men who did it wore the uniform of a republic. So I ask one question - the third time, who stops them?\"\n\nThaelmann answers that afternoon in one sentence: \"The constitution. And the constitution depends on the lines we are writing now.\""
 krcw_wgr_62.a:0 "Write refusal of unlawful orders into military law"
 krcw_wgr_62.b:0 "Final command to the Congress"
 krcw_wgr_62.c:0 "Leave it: build the divisions first"
 krcw_wgr_64_t:0 "Three Drafts"
 krcw_wgr_64_d:0 "The planning board's minutes preserve three sentences, one from each minister.\n\nDefence: \"It is three hundred kilometres from the far bank of the Elbe to the Rhine.\"\nHousing: \"The West Berlin shop windows work because there is actually something in them.\"\nForeign trade: \"The steel these two gentlemen are discussing - we must sell part of it first to pay for the ore.\"\n\nAll three are right. At the foot of the minutes the board's chairman writes: \"This board is not competent to decide what this country is. Let the Congress decide.\""
 krcw_wgr_64.a:0 "Put it to the Congress in open debate"
 krcw_wgr_64.b:0 "A little of all three and offend nobody"
 krcw_wgr_64.c:0 "Defence decides: this is a front-line state"
 WGR_krcw_brandt:0 "Willy Brandt"
 WGR_krcw_brandt_desc:0 "The youngest of the generation that went into exile in Norway in 1933 and came back in 1945. He drafted the reception-centre system and the open-door law, on the grounds that he was himself a German who crossed a border. His politics rest on one judgement: the Republic cannot win an arms race and it can make the people on the other side vote with their feet."
 WGR_krcw_renn:0 "Ludwig Renn"
 WGR_krcw_renn_desc:0 "An aristocrat and old officer, a company commander in 1914, who wrote a book about war and became a communist, and commanded a battalion of the International Brigades in Spain in 1936. He is the one man entitled to propose the union-officer road, because he knows both the old army and the new, and his verdict on the old one is a single sentence: they fight very well, and they fight for whoever pays."
 krcw_ddr_succession_roll_tt:0 "When Schleicher dies, whether the handover goes smoothly depends on this decision."
 krcw_ddr_after_schleicher:0 "After Schleicher"
 krcw_ddr_after_schleicher_desc:0 "The whole structure of this regime rested on one man: the only one who could talk to the generals and the civilians at once. With him gone, the two sides discover they never learned to address each other directly, because for twenty years they never had to."
 krcw_ddr_the_marshals_republic:0 "The Marshals' Republic"
 krcw_ddr_the_marshals_republic_desc:0 "The General Staff takes over directly and stops pretending a civilian government exists. Decisions come much faster, and the Republic becomes in name what it long was in fact: the most barracks-like member of the Accord. Moscow expresses satisfaction, and that satisfaction is itself the problem."
 krcw_ddr_the_lawyers_republic:0 "The Lawyers' Republic"
 krcw_ddr_the_lawyers_republic_desc:0 "The other outcome: the constitutional court finds that the General Staff's veto over ministerial appointments never had a legal basis, and the army - to everyone's surprise - accepts the ruling. The reason is not noble: the generals discover they do not want the responsibility of governing a country."
 krcw_ddr_the_shop_window_war:0 "The War of the Shop Windows"
 krcw_ddr_the_shop_window_war_desc:0 "The Republic decides to fight on the ground where it is weakest: the shops. The department stores of Leipzig and Dresden reopen, and bicycles, radios and refrigerators go onto the first page of the plan. It is a hard war to fight, and the price of not fighting it is tens of thousands of people a year."
 krcw_ddr_the_other_germanys_problem:0 "That Is the Other Germany's Problem"
 krcw_ddr_the_other_germanys_problem_desc:0 "The other decision: do not compete with the Rhine over shops. The Republic's propaganda turns instead to what it does have - order, free universities, no unemployment, no strikes. The argument works on some people. It does not work on the ones standing in an underground station holding a one-way ticket."
 krcw_ddr_the_cage:0 "The Cage"
 krcw_ddr_the_cage_desc:0 "The Accord's front-line member enjoys the highest priority for military aid and bears the tightest restrictions: no separate negotiation with the west, no cut in the defence budget, no change of frontier policy over Moscow's objection. Warsaw's generals go to Moscow once a year. Berlin's go once a month."
 krcw_ddr_rival_germany:0 "The Germany Across the Wire"
 krcw_ddr_the_old_man:0 "Plan for Schleicher's Passing"
 krcw_ddr_the_old_man_desc:0 "Schleicher is sixty-seven in 1949, with no named successor and no party. The regime depends on him entirely."
 krcw_ddr_the_staff_takes_over:0 "The Staff Takes Over"
 krcw_ddr_the_staff_takes_over_desc:0 "After Schleicher's death the General Staff forms a Council of Defence to exercise the head of state's powers, promising civilian government once things settle. Moscow approves."
 krcw_ddr_the_court_rules:0 "Refer Appointments to the Court"
 krcw_ddr_the_court_rules_desc:0 "The constitutional court rules the General Staff's veto over civilian appointments unconstitutional, and the army accepts the ruling."
 krcw_ddr_the_republic_without_him:0 "Establish Collective Decision-Making"
 krcw_ddr_the_republic_without_him_desc:0 "Build a collective decision-making process that does not depend on Schleicher. The first year brings one cabinet crisis after another; things settle after that."
 krcw_ddr_thirty_one_divisions:0 "Review the Size of the Army"
 krcw_ddr_thirty_one_divisions_desc:0 "The Republic has thirty-one divisions to West Germany's sixteen. Review the size of the army and decide what it is mainly for."
 krcw_ddr_the_army_faces_west:0 "Face the Army Toward the Elbe"
 krcw_ddr_the_army_faces_west_desc:0 "The army is organised and deployed entirely for war with the Internationale, and internal order goes to the People's Police. Moscow adds equipment for two armoured divisions."
 krcw_ddr_the_army_faces_inward:0 "Keep the Reserve in the Interior"
 krcw_ddr_the_army_faces_inward_desc:0 "Two corps are kept near Leipzig and Dresden as a \"strategic reserve\" for internal order. The army is less fit for war and the regime more secure."
 krcw_ddr_the_oath_of_the_reichswehr:0 "Revise the Military Oath"
 krcw_ddr_the_oath_of_the_reichswehr_desc:0 "With the throne empty and the constitution open to the courts, the new oath is sworn only to \"the German National Republic\"."
 krcw_ddr_the_window_across_the_wire:0 "Study the West Berlin Effect"
 krcw_ddr_the_window_across_the_wire_desc:0 "Tens of thousands of East Germans enter West Berlin on day passes every day. Restricting the passes and official explanations have both failed, and the interior ministry looks for another answer."
 krcw_ddr_fight_for_the_window:0 "Expand the Supply of Consumer Goods"
 krcw_ddr_fight_for_the_window_desc:0 "Reopen the Leipzig and Dresden department stores and raise output of bicycles, radios and refrigerators at subsidised prices. The money is squeezed out of the armoured divisions."
 krcw_ddr_refuse_the_contest:0 "Promote the Social Guarantees"
 krcw_ddr_refuse_the_contest_desc:0 "Do not compete with West Germany on goods; propaganda stresses order, free universities and full employment instead."
 krcw_ddr_the_price_of_the_front:0 "Accept the Front-Line Obligations"
 krcw_ddr_the_price_of_the_front_desc:0 "As the Accord's front line, the Republic has first call on military aid, but may not negotiate with the west alone, cut defence spending, or change frontier policy against Moscow."
 DDR_krcw_heinrici:0 "Gotthard Heinrici"
 DDR_krcw_heinrici_desc:0 "A specialist in defensive war and a general famous for stinginess - with ground, with lives, and with words. He is the General Staff's candidate for what follows Schleicher, and his interest in the post is close to nil: governing is work for civilians, and a soldier's work is making sure the line on the Elbe never actually has to be held."
 DDR_krcw_bruning:0 "Heinrich Bruning"
 DDR_krcw_bruning_desc:0 "A fiscal specialist of the old Centre Party who survived three crises on austerity budgets. He is the civilians' best-qualified candidate and their least popular: his proposals are always right, always painful, and always acknowledged to have been right only afterwards. He argues for cutting the defence budget, on the grounds that a bankrupt front is not a front."
 DDR_krcw_joos:0 "Joseph Joos"
 DDR_krcw_joos_desc:0 "An editor out of the Catholic unions and the one politician in the Republic with an organised base belonging neither to the army nor the bureaucracy. He speaks for the people who want neither a marshal nor a lawyer, and his programme has one practical plank: restore post, family visits and freight with the far bank, because households the wire cut in half do not care whose constitution is more legitimate."
 krcw_ddrd_30_t:0 "One Man's Appointment Diary"
 krcw_ddrd_30_d:0 "The interior ministry's confidential assessment runs nine pages and its conclusion discomforts everyone who reads it: this regime has no procedure of succession. The throne is empty and lawfully so, the constitution says nothing about who acts when the head of state is absent, and the General Staff's veto over civilian appointments was never written into any law.\n\nThe final paragraph is a hypothetical: \"Were the head of state absent today, two bodies would tomorrow morning each claim the right to appoint a chancellor, and neither would be wrong.\""
 krcw_ddrd_30.a:0 "Legislate a procedure of succession"
 krcw_ddrd_30.b:0 "Let the General Staff name a deputy in advance"
 krcw_ddrd_30.c:0 "Destroy the assessment"
 krcw_ddrd_38_t:0 "The Death of Schleicher"
 krcw_ddrd_38_d0:0 "Kurt von Schleicher dies at his house in Potsdam. That afternoon the General Staff, acting on the designation filed in advance, announces that Colonel-General Gotthard Heinrici will exercise the head of state's powers. The People's Chamber confirms it unanimously the next day. Moscow's condolences and congratulations arrive together."
 krcw_ddrd_38_d1:0 "Kurt von Schleicher dies at his house in Potsdam. Under the new succession law the People's Chamber meets within ten days, and the General Staff's nominee Gotthard Heinrici is elected by a majority. Sixty-three members vote against, the first open votes against anything in the Republic's history."
 krcw_ddrd_38_d2:0 "Kurt von Schleicher dies at his house in Potsdam. The next morning the General Staff and the cabinet each issue a statement claiming the right to appoint an interim government. Both cite the constitution, which says nothing whatever on the matter. Two regiments of the Berlin garrison are moved into the city."
 krcw_ddrd_38.a:0 "Heinrici takes up the head of state's powers as arranged"
 krcw_ddrd_38.b:0 "The People's Chamber elects Heinrici"
 krcw_ddrd_38.c:0 "Let the General Staff hold things together first"
 krcw_ddrd_38.d:0 "Ask the constitutional court who may appoint"
 krcw_ddrd_32_t:0 "Two Corps on the Deployment Map"
 krcw_ddrd_32_d:0 "At a budget hearing a civilian deputy asks a question that should not have been asked in public: why are the Third and Seventh Corps garrisoned near Leipzig and Dresden rather than along the Elbe?\n\nThe defence ministry answers: \"strategic reserve.\" The deputy does not press it, and on the way out he says something to a colleague that is all over the building by the next morning: \"A strategic reserve belongs behind the front. Not beside the factories.\""
 krcw_ddrd_32.a:0 "Move both corps to the Elbe"
 krcw_ddrd_32.b:0 "Leave them and explain no further"
 krcw_ddrd_32.c:0 "Give internal tasks entirely to the People's Police"
 krcw_ddrd_34_t:0 "Persuaded by What They Have Seen"
 krcw_ddrd_34_d:0 "The statistical office's report has a single conclusion, and that conclusion overturns ten years of the interior ministry's method: \"They are not persuaded by argument. They are persuaded by what they have seen.\"\n\nAn annex gives the detail: of citizens crossing into West Berlin on day passes, seventy-four per cent return the same day and twenty-six per cent apply for a second pass within three months - and a considerable share of that twenty-six per cent never came back at all."
 krcw_ddrd_34.a:0 "Fight them on the shops"
 krcw_ddrd_34.b:0 "Restrict the passes"
 krcw_ddrd_34.c:0 "Change the subject of the propaganda"
 krcw_ddrd_36_t:0 "The Monthly Train"
 krcw_ddrd_36_d:0 "Berlin's chief of staff goes to Moscow once a month. It is not an honour but a system: the Accord's front-line member coordinates in advance on armaments, frontier policy and contacts with the west, and everyone understands what \"coordinate\" means in practice.\n\nIn 1952 a young staff officer writes a line in a private letter that the archives preserved: \"Warsaw's generals go once a year, Bucharest's once in two. We go once a month. We are not the Accord's most important member; we are its least free one, and the two look very much alike.\""
 krcw_ddrd_36.a:0 "Accept the price of the position"
 krcw_ddrd_36.b:0 "Demand the same treatment as Warsaw"
 krcw_ddrd_36.c:0 "Quietly open a direct channel to the Rhine"
 krcw_wgr_the_second_shift:0 "The Second Shift"
 krcw_wgr_the_second_shift_desc:0 "The Republic legislated equal pay long ago, and the nurseries, canteens and laundries were built in 1955. Before that a woman finishing her shift had a second, unpaid one waiting, and it took the unions ten years to concede that this too was a labour question."
 krcw_wgr_the_young_republic:0 "The Young Republic"
 krcw_wgr_the_young_republic_desc:0 "The children entering school in 1952 remember neither the Empire nor 1943. They are the first generation born into this country who consider it normal - and normality is the most complete victory a revolution can win, and the hardest thing for it to face."
 krcw_wgr_the_church_settlement:0 "The Settlement with the Churches"
 krcw_wgr_the_church_settlement_desc:0 "The Republic seizes no church property, forbids no sermon and runs no atheist campaign; the churches do not comment on elections, form no party, and hold whatever rite a family asks for its war dead. Neither side is satisfied and both kept it for thirty years."
 krcw_wgr_the_rhine_bridgehead:0 "The Rhine Bridgehead"
 krcw_wgr_the_rhine_bridgehead_desc:0 "The Internationale's integration is Paris's business on paper and the Rhine's in practice: every railway eastward, every transmission line, every German branch of the clearing house is here. The member whose frontier is the front line is also the whole bloc's transhipment yard."
 krcw_wgr_the_german_laboratories_two:0 "The German Laboratories"
 krcw_wgr_the_german_laboratories_two_desc:0 "Optics, chemicals, machine tools, radio: the industrial science the Empire left was not bombed away, only reassigned. The Republic handed it to technical institutes run by the unions, and ten years later the machine tool drawings of every Internationale member carry German tolerance marks."
 krcw_wgr_the_solidarity_brigades:0 "The Solidarity Brigades"
 krcw_wgr_the_solidarity_brigades_desc:0 "What the Republic sends to Asia, Africa and Latin America is not soldiers but engineering teams: railways, power stations, technical schools. The motive appears in no document and everyone involved understands it - a nation lately forgiven needs to be needed."
 krcw_wgr_the_question_of_the_women:0 "Answer the Krefeld Strike"
 krcw_wgr_the_question_of_the_women_desc:0 "In 1951 the women at the Krefeld textile mills strike with three demands: works nurseries, canteens, and rosters posted a week in advance."
 krcw_wgr_the_nurseries:0 "Build Nurseries and Canteens"
 krcw_wgr_the_nurseries_desc:0 "Build a nursery, a canteen and a laundry at every works, run by the works council and funded from the consumer budget."
 krcw_wgr_the_generation_without_memory:0 "Reform History Teaching"
 krcw_wgr_the_generation_without_memory_desc:0 "Children now starting school remember neither the Empire nor 1943. History teaching sets out the facts and no longer aims to instil fear."
 krcw_wgr_the_churches:0 "Sign an Agreement with the Churches"
 krcw_wgr_the_churches_desc:0 "The Republic seizes no church property and restricts no preaching; the churches stay out of elections and form no party. They may hold rites for the war dead of either side."
 krcw_wgr_the_war_dead:0 "Raise a Memorial to the War Dead"
 krcw_wgr_the_war_dead_desc:0 "Raise a memorial to the war dead with no list of names and no distinction of side, inscribed only \"To all who were sent\"."
 krcw_wgr_the_normal_country:0 "Accept What the Revolution Built"
 krcw_wgr_the_normal_country_desc:0 "Strikes and council attendance are falling and living standards rising. Old members see the revolution decaying; the party holds that it shows the revolution is secure."
 krcw_wgr_the_bridgehead:0 "Build the Rhine Transit Hub"
 krcw_wgr_the_bridgehead_desc:0 "The Internationale's eastbound railways, power lines and clearing-house branches all cross the Rhine. Making it the bloc's transit hub raises West Germany's standing in the Internationale."
 krcw_wgr_the_transhipment_yards:0 "The Transhipment Yards"
 krcw_wgr_the_transhipment_yards_desc:0 "Cargo landed at Rotterdam and Antwerp is regauged, broken down and marshalled here for the forward depots. In peace it is trade; in war it is supply."
 krcw_wgr_the_german_seat:0 "Demand Consent on Elbe Questions"
 krcw_wgr_the_german_seat_desc:0 "Germany holds one seat on the executive but provides a third of the bloc's heavy industry and the whole front line. Demand that no resolution touching the Elbe pass without German consent."
 krcw_wgr_the_common_defence_industry:0 "Standardise the Arms Industry"
 krcw_wgr_the_common_defence_industry_desc:0 "Tanks, lorries and guns are built to the Internationale's common specification, with parts and ammunition interchangeable. German arsenals now produce for other members' armies as well."
 krcw_wgr_the_veto_on_the_elbe:0 "Secure the Elbe Veto"
 krcw_wgr_the_veto_on_the_elbe_desc:0 "The Internationale accepts Berlin's demand: resolutions touching the Elbe need German consent. The final vote on war and peace passes to the member that would be hit first."
 krcw_wgr_the_federation_of_labour_german:0 "The Labour Federation (German Section)"
 krcw_wgr_the_federation_of_labour_german_desc:0 "The German union federation proposes that transnational bodies may allocate resources such as steel but may not direct the labour of local works. The principle goes into the federation statutes."
 krcw_wgr_optics_and_chemicals:0 "Develop Optics and Chemicals"
 krcw_wgr_optics_and_chemicals_desc:0 "Keep the research departments and staff of Zeiss, Bayer and BASF, and place them under the union-run technical institutes."
 krcw_wgr_the_machine_tool_standard:0 "Standardise the Machine Tools"
 krcw_wgr_the_machine_tool_standard_desc:0 "The members use four different tolerance standards and parts do not interchange. Adopt the German standard, the finest of the four, throughout."
 krcw_wgr_the_workers_technical_schools:0 "The Workers' Technical Institutes"
 krcw_wgr_the_workers_technical_schools_desc:0 "Open a technical institute in every industrial district, fees paid by the unions, entry by mathematics rather than Latin. Workers' children can become engineers."
 krcw_wgr_the_computing_institute:0 "The Computing Institute"
 krcw_wgr_the_computing_institute_desc:0 "Found a computing institute for Zuse, free of military supervision. Its first task is the planned economy's material balances, which take six months to work out by hand."
 krcw_wgr_the_engineers_abroad:0 "Send Engineering Teams Abroad"
 krcw_wgr_the_engineers_abroad_desc:0 "Send engineering teams, not troops, to Asia, Africa and Latin America to build railways and power stations and to run technical schools."
 krcw_wgr_the_technical_schools_abroad:0 "Technical Schools Abroad"
 krcw_wgr_the_technical_schools_abroad_desc:0 "Open bilingual technical schools in India, Indonesia and West Africa whose graduates stay to work at home. It is slow, cheap, and lasting."
 krcw_wgr_the_forgiven_nation:0 "Build the Calcutta Power Station"
 krcw_wgr_the_forgiven_nation_desc:0 "The power station built by German engineers at Calcutta comes on line. For the first time Germany's image abroad is tied to engineering and construction."
 krcw_wgr_the_other_germanys_shadow:0 "Compete with the East for Aid Projects"
 krcw_wgr_the_other_germanys_shadow_desc:0 "The DDR is also sending engineers and signing aid agreements in the third world. Recipient governments begin playing the two Germanies off against each other."
 krcw_wgr_70_t:0 "The Demands Mention No Wages"
 krcw_wgr_70_d:0 "The textile strike at Krefeld enters its sixth day, and what troubles the union executive is not the strike but the list of demands: not one of the five mentions wages. The first is a works nursery, the second a canteen, the third that the shift roster be posted a week in advance.\n\nA woman delegate says something at the negotiating table that none of the men present can answer: \"Comrades, we have your eight-hour day too. But when your shift ends, you are finished for the day.\""
 krcw_wgr_70.a:0 "Concede it all, out of the consumer budget"
 krcw_wgr_70.b:0 "Let the shop councils build them, not the state"
 krcw_wgr_70.c:0 "Wages first, nurseries in the next plan"
 krcw_wgr_72_t:0 "The Third Clause"
 krcw_wgr_72_d:0 "The negotiation with the churches settles the first two clauses quickly: the Republic leaves church property alone, the churches form no party. The third took four months.\n\nIt was about the war dead. The Republic wanted state ceremonies; the churches required that families be able to choose a religious burial - including for the men who died on the eastern front in Imperial uniform. At the deadlock a bishop said something both sides later quoted: \"The priest does not ask whose uniform the boy wore. Neither does his mother.\""
 krcw_wgr_72.a:0 "Accept the third clause"
 krcw_wgr_72.b:0 "State ceremonies only"
 krcw_wgr_74_t:0 "The Days After Winning"
 krcw_wgr_74_d:0 "The attendance returns lie on the presidium table: average attendance at shop council meetings has fallen from eighty-one per cent in 1949 to forty-three in 1965. Every economic indicator rose over the same period.\n\nIn his last address Thaelmann does not dodge the report: \"Comrades, I know what you want to hear. You want me to say this is betrayal, bureaucratisation, the enemies of the revolution at work. It is not. It is that we won. The days after winning are harder than the fighting, because nobody wrote down how to live them.\""
 krcw_wgr_74.a:0 "Accept that this is what victory looks like"
 krcw_wgr_74.b:0 "Launch a campaign to revive the councils"
 krcw_wgr_76_t:0 "One Seat"
 krcw_wgr_76_d:0 "The allocation of executive seats dates from 1946, when the German Socialist Republic had just been founded and its industry was still in rubble. Ten years later the holder of that one seat represents a third of the bloc's heavy industry and the whole of its front line.\n\nBerlin's proposal is restrained: not more seats, only a rule - no resolution touching the Elbe without German consent. Its closing sentence is quite calm: \"We do not ask for privilege. We ask to be in the room when it is decided whether we are destroyed.\""
 krcw_wgr_76.a:0 "Press for the rule"
 krcw_wgr_76.b:0 "Ask for more military aid instead"
 krcw_wgr_78_t:0 "The Table That Took Six Months"
 krcw_wgr_78_d:0 "Zuse's demonstration at the economics ministry took twenty minutes. The machine he brought computed a material balance - the allocation of steel, coal, cement and machine tools among every sector - in forty.\n\nThe ministry needs six months to compute the same table by hand, and the planning cycle is a year. After the meeting a young statistician said something in the corridor that someone wrote in the margin of the minutes: \"If it can compute the materials, it can compute the prices. Do we still need a planning board?\""
 krcw_wgr_78.a:0 "Use it for the plan"
 krcw_wgr_78.b:0 "Give it to the military: ballistics and air defence"
 krcw_wgr_78.c:0 "Let the institute choose its own direction"
 krcw_wgr_80_t:0 "This Time They Brought Electricity"
 krcw_wgr_80_d:0 "Three days after the Calcutta power station came on line, the foreign ministry in Berlin received a translation of the local paper's front page. The headline ran to one line: \"The Germans are back, and this time they brought electricity.\"\n\nThe foreign minister had the translation framed. Explaining why in cabinet, he said something with nothing to do with diplomacy: \"Gentlemen, in all the years my generation spent abroad, we never once heard anything like that said about Germans. I want it on the wall so the young ones know it is possible.\""
 krcw_wgr_80.a:0 "Expand the programme"
 krcw_wgr_80.b:0 "Turn the resources back home"
 WGR_krcw_zuse:0 "Konrad Zuse"
 WGR_krcw_zuse_desc:0 "The engineer who built a programmable machine in 1941, a fact the war then buried for eight years. He has no interest in politics and less in ideology; what he wants is a budget and no military supervision. The Republic gave him both, and his first proposal to it was to compute the material balances of the planned economy by machine."
 krcw_eng_the_union_of_four:0 "The Union of Four"
 krcw_eng_the_union_of_four_desc:0 "The Union of Britain has \"union\" in its name and for thirty years nobody wrote down who the members are. The charter of 1953 finally does: the industrial federations of England, Scotland, Wales and the northern counties each send delegates, seats apportioned by membership and not population - a rule that gives the Welsh miners more weight than their numbers would, which is exactly why it passed."
 krcw_eng_the_land_question_settled:0 "The Land Question Settled"
 krcw_eng_the_land_question_settled_desc:0 "Syndicalism has a complete theory of the factory and not one sentence about the farm. Two thirds of British food was imported in 1949, and that line is the whole reason rationing lasted to 1954. The answer in the end was neither collective farms nor landlords: county agricultural federations whose members are the farmers themselves, with machinery and fertiliser bought centrally."
 krcw_eng_the_merchant_fleet:0 "The Merchant Fleet"
 krcw_eng_the_merchant_fleet_desc:0 "The navy fights and the merchant fleet eats. For an island importing two thirds of its food the strategic asset is three thousand freighters under the red flag and the seamen's unions behind them - and that fleet is also the whole Internationale's carrying capacity: Iberian ore, Scandinavian timber and Indian cotton all move in her bottoms."
 krcw_eng_the_commonwealth_of_labour_idea:0 "The Commonwealth of Labour"
 krcw_eng_the_commonwealth_of_labour_idea_desc:0 "The Empire dissolved faster than anyone expected and what it left did not disappear: a common legal tradition, a common railway gauge, a common language and three generations of private connections. The Republic traded those for a new standing - not a metropole, but the place every former colony is willing to telephone."
 krcw_eng_what_the_union_is:0 "Draft the Union Charter"
 krcw_eng_what_the_union_is_desc:0 "The membership of the \"Union of Britain\" has never been written down. Draft a union charter defining the relationship between England, Scotland, Wales and the northern counties."
 krcw_eng_the_charter_of_the_four:0 "The Charter of the Four"
 krcw_eng_the_charter_of_the_four_desc:0 "The industrial federations of the four parts each send delegates, with seats by union membership rather than population. The well-organised Welsh miners take a large share."
 krcw_eng_the_single_congress:0 "The Single Congress"
 krcw_eng_the_single_congress_desc:0 "The Congress is the sole sovereign body and the Scottish and Welsh assemblies become regional administrations. England supports it; Scotland and Wales resent it deeply."
 krcw_eng_the_irish_question_after:0 "Sign a Labour Agreement with Dublin"
 krcw_eng_the_irish_question_after_desc:0 "Sign a labour agreement with the Syndicalist Republic in Dublin: workers of each country hold every right of a native worker in the other."
 krcw_eng_the_isles_settled:0 "Confirm the Isles Settlement"
 krcw_eng_the_isles_settled_desc:0 "Confirm the settlement of the isles: the Union of Britain and the Irish Syndicalist Republic each stand, the border is no longer disputed, and workers move freely between them."
 krcw_eng_the_farm_without_a_theory:0 "Draw Up an Agricultural Policy"
 krcw_eng_the_farm_without_a_theory_desc:0 "Two thirds of Britain's food is imported, which is why rationing lasted until 1954. Syndicalism has no ready answer for agriculture, and one has to be drawn up."
 krcw_eng_the_county_federations:0 "The County Federations"
 krcw_eng_the_county_federations_desc:0 "Form county agricultural federations: land held by the federation, use by the household, and machinery, fertiliser and seed bought centrally and supplied at cost."
 krcw_eng_farm_mech:0 "Farm Mechanisation"
 krcw_eng_the_tractor_and_the_fen:0 "Drain the Eastern Fens"
 krcw_eng_the_tractor_and_the_fen_desc:0 "Mechanise the farms, and use demobilised engineers to drain the eastern fens for more arable land."
 krcw_eng_the_end_of_the_import_bill:0 "Reach Half Food Self-Sufficiency"
 krcw_eng_the_end_of_the_import_bill_desc:0 "Food self-sufficiency passes half for the first time, and a blockade can no longer starve Britain."
 krcw_eng_three_thousand_freighters:0 "Organise the Merchant Fleet"
 krcw_eng_three_thousand_freighters_desc:0 "Organise the three thousand merchant ships into one centrally scheduled fleet. It feeds Britain and carries the whole Internationale's sea trade."
 krcw_eng_the_seamens_charter:0 "The Seamen's Charter"
 krcw_eng_the_seamens_charter_desc:0 "Issue the Seamen's Charter: a maximum voyage length, standards for food on board, and the right to leave ship in any Internationale port and go home at the fleet's expense."
 krcw_eng_what_the_empire_left:0 "Use the Old Imperial Ties"
 krcw_eng_what_the_empire_left_desc:0 "The legal traditions, railway standards and language of the old Empire remain. Use those ties to build new relations with the former colonies."
 krcw_eng_the_lawyers_and_the_engineers:0 "Send Technical Advisers to the Former Colonies"
 krcw_eng_the_lawyers_and_the_engineers_desc:0 "Send legal advisers, railway engineers and accountants to the former colonies to help set up their law, transport and audit systems."
 krcw_eng_the_place_everyone_telephones:0 "Penetrate the Indian Federation's Civil Service"
 krcw_eng_the_place_everyone_telephones_desc:0 "The Indian Federation's ministries still work from London's old forms and files. Union intelligence uses the technical-aid channel to recruit contacts among the Delhi civil servants and railway clerks. The foreign ministry fears that if it is exposed every former colony will shut its door."
 krcw_eng_90_t:0 "Four Federations or One Country"
 krcw_eng_90_d:0 "The charter committee sticks on Article One, and the substance of the argument is arithmetic rather than law: apportion seats by union membership and the Welsh miners take far more than their share of the population; apportion by population and England is permanently the majority, and the Scottish and Welsh assemblies are decoration.\n\nA Glasgow delegate puts it at bottom: \"Comrades, we can have a fair parliament or we can have a union. For thirty years we lived on ambiguity, and the ambiguity has now expired.\""
 krcw_eng_90.a:0 "By membership: a parliament of labour"
 krcw_eng_90.b:0 "By population: one man one vote"
 krcw_eng_90.c:0 "Two chambers: one by population, one by industry"
 krcw_eng_92_t:0 "Whether a Farmer Counts as a Worker"
 krcw_eng_92_d:0 "The agriculture ministry's memorandum puts a question avoided for thirty years before the Congress: in a syndicalist republic, what is a farmer who works land he owns?\n\nHe employs nobody, so he is no capitalist. He is employed by nobody, so he is no worker. He owns the means of production, and the whole programme of the revolution is that the means of production are held in common.\n\nA Lincolnshire farming delegate settled the debate at the hearing: \"Gentlemen, my land is in my hands, my tractor is in the bank's hands and my price is in yours. I am whatever you say I am - so long as you do not come and ask me during sowing.\""
 krcw_eng_92.a:0 "County federations: land to the federation, use to the household"
 krcw_eng_92.b:0 "State farms: full collectivisation"
 krcw_eng_92.c:0 "Leave the farms alone and go on importing"
 krcw_eng_94_t:0 "You Did It With Tractors"
 krcw_eng_94_d:0 "The 1953 self-sufficiency return was a routine paper at cabinet until the Admiralty's representative asked to speak.\n\n\"Gentlemen,\" the admiral said, \"for thirty years the navy's entire strategic problem was one sentence: cut us in the Atlantic and Britain starves. We built escorts for it, built anti-submarine aircraft for it, wrote countless war plans for it.\"\n\n\"This year that sentence is false for the first time. And you did it not with warships but with tractors and drainage pumps. I apologise on behalf of the Admiralty - we always regarded you as a secondary ministry.\""
 krcw_eng_94.a:0 "Move the saved naval budget to agriculture"
 krcw_eng_94.b:0 "Spend it on a bigger ocean fleet instead"
 krcw_eng_96_t:0 "More Comfortable Than an Empire"
 krcw_eng_96_d:0 "After the Indo-Pakistani water mediation the foreign ministry received an unexpected letter: the prime minister of a West African state asking whether the Republic would draft them a mining code.\n\nWhat the foreign minister wrote in that summary has been quoted many times since: \"Thirty years ago we sent a governor there with a guard of honour, and the people behind his back counted the days. Now they write and ask us for two lawyers.\n\nA country no longer able to compel anyone has discovered for the first time that it is wanted. This is more comfortable than an empire.\""
 krcw_eng_96.a:0 "Accept, and make it a standing service"
 krcw_eng_96.b:0 "Accept, and charge for it"
 ENG_krcw_bevan:0 "Aneurin Bevan"
 ENG_krcw_bevan_desc:0 "A miner's son from Tredegar out of the South Wales miners' federation, and the man who drove the membership-apportionment rule into the Charter of the Four. He never disguised the parochialism of his position: \"I represent the miners of South Wales. If the Union of Britain cannot make their lives better than 1926, what entitles it to be called a union.\""
 ENG_krcw_strachey_land:0 "John Strachey (Agriculture)"
 ENG_krcw_strachey_land_desc:0 "The man who carried the county-federation scheme, an administrator who treated the land as an engineering question rather than an ideological one. He worked from one principle, and that principle saved British food output: \"The man who decides when to sow must be standing in the field. Everything else is negotiable.\""
 krcw_ti_the_single_centre:0 "The Single Centre"
 krcw_ti_the_single_centre_desc:0 "A revolution needs somewhere that can decide. The Paris secretariat's resolutions bind its members, and the national federations submit to the majority on international questions - and the majority is French, because the French membership is largest.\nOpponents call it a new Second International. Supporters answer that the Second International dissolved in August 1914 precisely because it had no centre."
 krcw_ti_the_free_communes:0 "The Free Communes"
 krcw_ti_the_free_communes_desc:0 "The opposite principle: the Internationale is a covenant and not a government. No resolution binds a federation that dissents and any member may leave without being called a traitor.\nIt makes the bloc slow in a crisis, and in thirty years no member of it has been put down by the others - which has happened four times inside the Accord across the wire."
 krcw_ti_the_unions_alone:0 "The Unions Alone"
 krcw_ti_the_unions_alone_desc:0 "The purest current: the party is a bourgeois form and so is the state, and only the union is a thing the workers made themselves. So the Internationale should have no secretariat and no member \"states\" - only direct agreements between industrial federations.\nTheoretically the most consistent, administratively the most impossible, and its support on the docks, in the pits and on the railways is the hardest of all."
 krcw_ti_one_country_first:0 "One Country First"
 krcw_ti_one_country_first_desc:0 "Build what is in hand into a model nobody can deny, and let others come of themselves. Every attempt to export a revolution since 1917 has failed, this current argues, and a country where the workers live better than across the water is worth more than a division.\nOpponents call it betrayal, and its supporters are the majority in the unions - because the unions deal in wages."
 krcw_ti_world_revolution:0 "World Revolution"
 krcw_ti_world_revolution_desc:0 "An encircled revolution has two endings: expansion or rot. This current demands pushing east now, sending cadres to the colonies and building underground organisations in every Accord member.\nTheir argument is the map: eight hundred kilometres from the Elbe to the Atlantic and no second line behind it. Their opponents' argument is the casualty tables."
 krcw_ti_doctrinal_dispute:0 "A Dispute Over the Line"
 krcw_fra_what_the_internationale_is:0 "Revise the Internationale's Statutes"
 krcw_fra_what_the_internationale_is_desc:0 "Italy has refused to carry out the secretariat's Trieste resolution, and the statutes provide no sanction. Revise the statutes and decide what kind of body the Internationale is."
 krcw_fra_the_binding_secretariat:0 "Make the Secretariat Binding"
 krcw_fra_the_binding_secretariat_desc:0 "Secretariat resolutions bind the members, disputes go to a majority vote, and members that refuse lose their vote. France has the largest membership, so the majority is French."
 krcw_fra_the_covenant_of_communes:0 "Adopt the Covenant of the Communes"
 krcw_fra_the_covenant_of_communes_desc:0 "The Internationale becomes a covenant: resolutions do not bind federations that dissent, and members may leave freely. The bloc will be slower in a crisis."
 krcw_fra_the_federations_alone:0 "Abolish the Secretariat"
 krcw_fra_the_federations_alone_desc:0 "Abolish the secretariat and the member states' seats, leaving only direct agreements between the industrial federations of each country."
 krcw_fra_the_question_of_the_east:0 "Debate a Push East"
 krcw_fra_the_question_of_the_east_desc:0 "Debate whether the Internationale should push east. One side points out there is no second line west of the Elbe; the other cites the casualties of 1936 to 1943."
 krcw_fra_build_the_model_first:0 "Build the Model First"
 krcw_fra_build_the_model_first_desc:0 "Concentrate on building up France, making housing, wages and consumer goods into a model the Accord's propaganda cannot deny. Most of the federations back this line; the price is less money for cadres and arms sent east."
 krcw_fra_the_cadres_go_east:0 "Send Cadres East"
 krcw_fra_the_cadres_go_east_desc:0 "Send cadres into the Accord countries to build underground organisations in the Polish coalfields, the Hungarian steelworks and the Turkish railways. Frontier tension will rise."
 krcw_eng_the_argument_in_the_congress:0 "Hold the Debate on the Line"
 krcw_eng_the_argument_in_the_congress_desc:0 "The shop stewards who seized the works in 1925 and the Fabian administrators who have run them since have long been at odds. Hold a formal debate in Congress on who runs the factories."
 krcw_eng_the_administrators_republic:0 "Hand the Works to the Administrators"
 krcw_eng_the_administrators_republic_desc:0 "Hand the factories to accountants, engineers and statisticians, and stop the shop meetings voting on production. Efficiency will rise, and the stewards' movement will object strongly."
 krcw_eng_the_stewards_answer:0 "Return Power to the Shop Floor"
 krcw_eng_the_stewards_answer_desc:0 "Production plans are passed by a works vote, and managers are elected by the shop and recallable at any time. Efficiency will fall."
 krcw_eng_the_guild_settlement:0 "Adopt Guild Socialism"
 krcw_eng_the_guild_settlement_desc:0 "Each industry forms a national guild, self-governing within, trading with the others by contract, the state arbitrating only."
 krcw_eng_and_the_world:0 "Debate Exporting the Revolution"
 krcw_eng_and_the_world_desc:0 "The Internationale is debating whether to export revolution, and the shipping would be British. The seamen's union demands a vote on it."
 krcw_left_1_t:0 "The Trieste Precedent"
 krcw_left_1_d:0 "In 1950 the secretariat resolved on Trieste, requiring the Italian Socialist Republic to accept arbitration. Rome replied in one sentence - \"the secretariat's resolution has been received and studied\" - and then did nothing.\n\nThe secretariat discovered it held nothing at all: the statutes contain no sanction, no expulsion, not even the words \"resolutions shall bind\". A French delegate said something in closed session that discomforted everyone: \"Comrades, the body we spent six years building is, in law, a news agency.\""
 krcw_left_1.a:0 "Amend the statutes: a revolution needs somewhere that can decide"
 krcw_left_1.b:0 "That is the Internationale's strength, not its defect"
 krcw_left_1.c:0 "The secretariat should never have existed"
 krcw_left_3_t:0 "Two Documents"
 krcw_left_3_d:0 "Each side spread something on the table at the same session.\n\nThose for going east spread a map: eight hundred kilometres from the Elbe to the Atlantic, no second line between, and more than two hundred Accord divisions behind that line.\n\nThose against spread something else: the dead of every Internationale member from 1936 to 1943, grouped by age. On the second page there is a column headed \"eighteen to twenty-two\", and the man who spread the document put a finger on that column and said nothing."
 krcw_left_3.a:0 "Build the model first"
 krcw_left_3.b:0 "East, and now"
 krcw_left_3.c:0 "Neither: let each member decide for itself"
 krcw_left_5_t:0 "The First Cadres"
 krcw_left_5_d:0 "Nine months after the decision to send cadres east, the first bill comes back to Paris: eleven arrested in the Polish coalfields, four vanished in Hungary, one shot on the Turkish frontier. The Accord's newspapers call them spies, and they were indeed carrying pamphlets printed in Paris.\n\nThe secretariat faces a question nobody wants to answer: are these names acknowledged publicly? Acknowledge them and they are ours; do not, and they are sixteen foreigners who went missing."
 krcw_left_5.a:0 "Acknowledge them and demand consular access"
 krcw_left_5.b:0 "Deny them, and go on sending"
 krcw_left_5.c:0 "Stop the programme"
 krcw_left_7_t:0 "The Pamphlets Run the Factories"
 krcw_left_7_d:0 "On the third day of the 1951 congress an old steward from Clydebank asked to speak. He had been in the occupation of the yards in 1925 and was now a retired shipwright.\n\n\"Gentlemen,\" he said, \"I have not come to argue against efficiency. I built ships for forty years and I know the books must balance. I have come to ask one question. In 1925 while we were occupying the factories, you were writing pamphlets. Now the pamphlets run the factories, and my son must raise his hand to speak in his own shop. What was it that we won?\"\n\nThe hall was quiet a long time. Nobody on the platform was ready with an answer."
 krcw_left_7.a:0 "Give the decision back to the floor"
 krcw_left_7.b:0 "Efficiency is a workers' interest too"
 krcw_left_7.c:0 "Guilds: a third way between the two"
 krcw_left_9_t:0 "It Is Our Crews That Carry It"
 krcw_left_9_d:0 "The seamen's position on world revolution surprised the whole congress: not against, not for, but demanding a vote.\n\nTheir secretary spoke for three minutes. \"You in this hall vote to export a revolution, and the exporting is done by ships. The men on those ships are my members. If the Internationale's freighters begin carrying rifles, the people voting in Paris should know that it is not Paris that gets torpedoed.\n\nWe are not against it. We ask only to be in the room when it is decided.\""
 krcw_left_9.a:0 "Give the seamen a seat"
 krcw_left_9.b:0 "One trade cannot veto a strategic question"
 FRA_krcw_monatte:0 "Pierre Monatte"
 FRA_krcw_monatte_desc:0 "The old man of revolutionary syndicalism, founder of La Vie Ouvrière, expelled from the Communist Party in 1924 for opposing any party direction of the unions. He is the source of the federations-alone current: the party is a bourgeois form and so is the state, and only the union is a thing the workers made themselves. He is eighty now and attends every Paris congress, sitting at the back."
 FRA_krcw_marty:0 "Andre Marty"
 FRA_krcw_marty_desc:0 "The organiser of the Black Sea mutiny and chief commissar of the International Brigades in Spain, a man who believes every question of revolution resolves into a question of discipline. He authored both the cadres-east and binding-secretariat roads: the Internationale needs a centre that can give an order, and an order given must be carried out. His opponents say he treats every disagreement as a mutiny, and the charge is not baseless."
 ENG_krcw_cole:0 "G. D. H. Cole"
 ENG_krcw_cole_desc:0 "The theorist of guild socialism, a man who lived thirty years between the Fabians and the shop stewards with neither side quite trusting him. His scheme has each industry self-governing, trading with the others by contract and the state arbitrating only - and he admits the hardest part is unsolved: \"We have invented a market without capitalists. Now we must learn to manage it.\""
 krcw_sov_the_informer_economy:0 "The Economics of Denunciation"
 krcw_sov_the_informer_economy_desc:0 "The Okhrana does not run on terror but on bookkeeping: a useful denunciation is worth three ration coupons, one leading to an arrest a month of housing priority. The interior ministry's files hold two hundred and seventy thousand informer numbers, of which perhaps sixty thousand denounced a neighbour for a larger flat.\nThe system is cheap and it works. Its defect takes many years to show."
 krcw_sov_what_the_state_cannot_know:0 "What the State Cannot Know"
 krcw_sov_what_the_state_cannot_know_desc:0 "A government ruled through informers has one insoluble problem: every report it receives is written to be heard. Governors report good harvests because a governor who reports a bad one is replaced; informers report discontent because an informer who reports calm earns no coupons.\nAn internal audit in 1952 was classified at the highest level: \"This ministry cannot estimate how many people in this country support the government. We have never measured the figure and we have no means of measuring it.\""
 krcw_sov_administrative_exile:0 "Administrative Exile"
 krcw_sov_administrative_exile_desc:0 "Without trial, without a court, by an order over the interior minister's signature: east of the Yenisei, term indefinite, family permitted to follow. It is the old tsarist procedure, which Savinkov took over unaltered, down to the wording of the form.\nThe places of exile are not labour camps: they have villages, post offices and schools, and the exiled may farm, teach or practise medicine - only not leave. The distinction goes unmentioned in Russian propaganda and is mentioned constantly in the Internationale's."
 krcw_sov_throne_and_altar_idea:0 "Throne and Altar"
 krcw_sov_throne_and_altar_idea_desc:0 "The Patriarchate restored in 1943 is this regime's single most successful undertaking and the one whose cost is best hidden. The Church received its buildings, its seminaries and tax exemption; the state received an institution that reaches into every village. Clergy are confirmed by the interior ministry and sermon topics are issued quarterly.\nAnd every reopened church is propaganda against the \"atheism\" on the far side of the wire - which works on peasants better than any broadcast."
 krcw_sov_the_white_inheritance:0 "The White Inheritance"
 krcw_sov_the_white_inheritance_desc:0 "This regime's officer corps comes out of the White armies, and the Whites were never one thing: the monarchists want an emperor, the constitutionalists want the constitution of 1906, the Cossacks want their own hosts, and the remnants of the foreign interventions each remember whose war they were fighting.\nTheir hatreds of one another are older than their hatred of the Internationale. Savinkov holds them down while he lives, and he dies in 1954."
 krcw_sov_one_russia:0 "One Russia"
 krcw_sov_one_russia_desc:0 "The official position is that Russia has no national minorities, only Russians speaking different dialects. Ukrainian-language schools were converted to Russian instruction in 1947, the Caucasian administrative boundaries redrawn along rivers rather than nationalities, the mosques of Central Asia registered to the interior ministry.\nIt works in the cities and in the mountains it has produced a generation of enemies. Every internal security report of the 1950s names the same region, and every one recommends \"intensified work\"."
 krcw_sov_exile_protest:0 "Protest Over the Exiles"
 krcw_sov_the_informers_ledger:0 "The Informers' Ledger"
 krcw_sov_the_informers_ledger_desc:0 "The Okhrana pays informers in ration coupons and housing priority. Many denunciations are about neighbours wanting a larger flat, not politics."
 krcw_sov_the_emigre_desk:0 "The Émigré Desk"
 krcw_sov_the_emigre_desk_desc:0 "Set up an émigré desk to watch the Russian exile communities in Paris, Berlin, Shanghai and Belgrade. Savinkov himself was once an exile in Paris."
 krcw_sov_the_letters:0 "The Letters"
 krcw_sov_the_letters_desc:0 "Sample letters in and out of the country, as the Third Section did. What the readers mostly find are complaints, so the interior ministry knows the public mood better than anyone."
 krcw_sov_what_we_cannot_know:0 "Audit the Regime's Support"
 krcw_sov_what_we_cannot_know_desc:0 "After an internal audit the interior ministry admits it cannot estimate how much support the regime has, since every report is written to please its reader."
 krcw_sov_east_of_the_yenisei:0 "Restore Administrative Exile"
 krcw_sov_east_of_the_yenisei_desc:0 "Restore tsarist administrative exile: no trial, by order of the interior minister, east of the Yenisei, indefinite term, families allowed to follow. The settlements have villages and schools, but no one may leave."
 krcw_sov_the_settlements:0 "The Settlements"
 krcw_sov_the_settlements_desc:0 "The exiles include many teachers, doctors and engineers, and Siberian local administration relies on them more and more."
 krcw_sov_the_amnesty_question:0 "Issue Residence Certificates to Exiles"
 krcw_sov_the_amnesty_question_desc:0 "Of four hundred and seventy thousand exiles, a hundred and ten thousand have lost case files. Issue them administrative residence certificates as permanent residents."
 krcw_sov_the_second_russia:0 "Develop the Eastern Settlements"
 krcw_sov_the_second_russia_desc:0 "East of the Yenisei a society of exiles and their families has grown up, well educated and indifferent to the government. Invest in developing the region."
 krcw_sov_the_patriarchate:0 "The Patriarchate"
 krcw_sov_the_patriarchate_desc:0 "Restore the Patriarchate. The Church gets its buildings, seminaries and tax exemption; clergy are confirmed by the interior ministry and bishops appointed with government consent."
 krcw_sov_the_reopened_churches:0 "Reopen the Churches"
 krcw_sov_the_reopened_churches_desc:0 "Reopen churches across the country and organise pilgrimages to the Trinity Lavra. The propaganda contrast with Internationale members that closed churches is obvious."
 krcw_sov_the_price_of_the_protocol:0 "Deal with the Unregistered Churches"
 krcw_sov_the_price_of_the_protocol_desc:0 "A number of young priests refuse ministry confirmation and hold services in private houses. Decide what to do about the unregistered churches."
 krcw_sov_one_russia_f:0 "Russify the Provinces"
 krcw_sov_one_russia_f_desc:0 "Minorities are not recognised: Ukrainian schools switch to Russian, the Caucasus is divided by rivers rather than nationalities, and Central Asian mosques are registered to the interior ministry. Resistance in the mountains grows."
 krcw_sov_the_armies_that_lost:0 "Integrate the Old White Armies"
 krcw_sov_the_armies_that_lost_desc:0 "The officer corps comes from the White armies of the civil war, and monarchists, constitutionalists, Cossacks and old interventionists bear deep grudges. Bring them into one chain of command."
 krcw_sov_the_cossack_autonomy:0 "Restore the Hosts' Autonomy"
 krcw_sov_the_cossack_autonomy_desc:0 "The Cossacks were this regime's most reliable source of soldiers in the civil war, and the payment they wanted was the restoration of host autonomy: their own land, their own courts, their own military establishment.\n\nSavinkov gave half: the establishment restored, the land restored, the courts not - the interior ministry would let nobody have their own courts. The half-settlement has kept the Don and the Kuban loyal and resentful for thirty years, and every conscription season their officers raise the thing that was not given."
 krcw_sov_the_monarchist_question:0 "Shelve the Throne Question"
 krcw_sov_the_monarchist_question_desc:0 "Monarchists are a third of the officer corps and want an emperor, but cannot agree on a Romanov candidate. Keep the throne question shelved."
 krcw_sov_the_last_of_the_whites:0 "Retire the Old Generals"
 krcw_sov_the_last_of_the_whites_desc:0 "Twenty-seven civil war generals are still alive, each believing he has a claim to the succession. Retire them and hand over to the younger officers."
 krcw_black_1_t:0 "The Larger Flat"
 krcw_black_1_d:0 "The 1950 tabulation was compiled by a middle-ranking official on orders, and he asked for a transfer after finishing it.\n\nIt showed: of thirty-one thousand denounced that year, nineteen thousand were denounced by someone in the same building, the same courtyard or the same workshop. Where a motive could be established, eleven per cent were political. The rest were housing, promotion, ration coupons and marital disputes.\n\nThe compiling official added a note: \"Excellency, we have not built a system for preventing treason. We have built a market in which neighbours bid against each other.\""
 krcw_black_1.a:0 "Carry on: it works, and that suffices"
 krcw_black_1.b:0 "Abolish the material rewards; keep political reports only"
 krcw_black_1.c:0 "Destroy the tabulation and transfer the official"
 krcw_black_3_t:0 "It Goes to Three Men"
 krcw_black_3_d:0 "The letter-reading section handles three million a year and its quarterly digest is printed in five copies for three men: the Supreme Ruler, the interior minister, the chief of staff.\n\nOne paragraph of this quarter's digest was underlined by its compiler: \"Complaints concerning rations and housing are sixty-one per cent of all complaints; those concerning politics, four. Among letters that mention the government the sharpest in tone are not from opponents but from our own junior officials - their complaint is that their superiors do not listen to them.\""
 krcw_black_3.a:0 "Circulate the digest to the provincial governors"
 krcw_black_3.b:0 "As before: three men only"
 krcw_black_3.c:0 "Adjust rations and housing on the digest"
 krcw_sov_tree_bid_civ_10_tt:0 "Influence of the civilian technocrats: §G+10§!"
 krcw_black_5_t:0 "We Have Never Measured It"
 krcw_black_5_d:0 "The 1952 audit was ordered by the interior minister himself. He wanted to know something very simple: if a real election were held tomorrow, how many votes would this regime take?\n\nThe audit team worked seven months and delivered a conclusion of two sentences, and those two sentences made the minister lock the file in a safe to which he alone holds the key.\n\n\"This ministry cannot estimate how many people in this country support the government. Every report this ministry receives is written to be heard.\""
 krcw_black_5.a:0 "Build an independent survey that bypasses the governors"
 krcw_black_5.b:0 "Into the safe"
 krcw_black_5.c:0 "Try a real local election in one province"
 krcw_black_7_t:0 "The Form of 1905"
 krcw_black_7_d:0 "When exile was restored the ministry found it needed to design nothing new - the 1905 forms were still in the archive, and three of the officials who had used them were still in post. One of them, aged seventy-one, was brought back to train the young clerks.\n\nWhat he said in the first lesson was written in a trainee's notebook: \"Gentlemen, the merit of this form is that it requires no evidence, only a reason. And the box for the reason - I shall teach you how to fill it in.\""
 krcw_black_7.a:0 "Proceed as in 1905"
 krcw_black_7.b:0 "Require an evidence summary with every exile order"
 krcw_black_7.c:0 "Move the power from the ministry to the courts"
 krcw_black_9_t:0 "A Hundred and Ten Thousand Without Files"
 krcw_black_9_d:0 "The new interior minister, reading the memorandum, summoned the director of archives and asked a direct question: how do the files of a hundred and ten thousand people come to be missing?\n\nThe director's answer was equally direct: \"Excellency, between 1943 and 1947 exile orders were issued in four different cities, two of which were bombed during the war. We know where these people are, because they report to a police post monthly. We do not know why they are there.\""
 krcw_black_9.a:0 "Issue residence certificates and stop calling them exiles"
 krcw_black_9.b:0 "Release them all: no file, no grounds"
 krcw_black_9.c:0 "Re-open files, classified by present conduct"
 krcw_black_11_t:0 "The Price of Being Above Ground"
 krcw_black_11_d:0 "There were no journalists at the signing. Four men were present: Savinkov, the interior minister, the Patriarch, and a secretary taking the record.\n\nThe Patriarch read the text through, was silent a long while, and then asked one question: does the confirmation of clergy extend to priests who hear confession? The minister said it did not.\n\nThe Patriarch then signed, and said something the secretary recorded in full: \"We were underground twenty-five years. The price of being above ground we can pay. But remember one thing - what is said in the confessional you will never have.\""
 krcw_black_11.a:0 "Accept the reservation"
 krcw_black_11.b:0 "Demand the confessional too"
 krcw_black_13_t:0 "Unregistered Religious Activity"
 krcw_black_13_d:0 "The Okhrana devised a category for the young priests who would not accept confirmation, and when it reached the Patriarch he did something the ministry had not anticipated: he declined to condemn them.\n\n\"Excellency,\" he told the interior minister, \"twenty-five years ago the priest holding services in a private house was me. You ask me to sign a document condemning myself as I was. I can sign it, and having signed it I become, in the eyes of the faithful, a director of one of your departments. You would then have a director and not a Patriarch, and the two are of different use to you.\""
 krcw_black_13.a:0 "Accept the refusal"
 krcw_black_13.b:0 "Bypass him and suppress them directly"
 krcw_sov_tree_bid_mon_10_tt:0 "Influence of the monarchists: §G+10§!"
 krcw_black_15_t:0 "Opposite Sides of the Same Table"
 krcw_black_15_d:0 "A routine General Staff meeting turned into a shouting match over something small: at the thirtieth anniversary ceremony for the southern campaign, whose regimental colours march first.\n\nThe two men arguing were a monarchist general and a constitutionalist general, and the two units they were arguing about exchanged fire on the Don in the autumn of 1919, with dead on both sides. The minutes handle it briefly: \"The chairman adjourned the meeting.\"\n\nSavinkov said to the interior minister afterwards, privately: \"These men fought all their lives, and the men they hate most wear the same uniform they do.\""
 krcw_black_15.a:0 "Suppress it: both colours abreast"
 krcw_black_15.b:0 "Favour the monarchists: they are more numerous"
 krcw_black_15.c:0 "Cancel the ceremony"
 krcw_black_17_t:0 "He Is Waiting for Us to Die"
 krcw_black_17_d:0 "For the eleventh time a monarchist delegation submitted a petition to the Supreme Ruler asking for a decision on the throne. Savinkov's answer was the answer of the previous ten: the question requires a national consensus and there is no consensus yet.\n\nLeaving, the oldest general in the delegation said something in the carriage that an émigré memoir later quoted: \"He is not refusing us. He knows our average age is sixty-eight. He is waiting for us to die. And he will manage it - he is only four years younger, and he has never drunk.\""
 krcw_black_17.a:0 "Go on giving no answer"
 krcw_black_17.b:0 "Declare a republic and end it"
 krcw_black_17.c:0 "Convene a national assembly on the throne"
 krcw_black_19_t:0 "Time Made the Choice"
 krcw_black_19_d:0 "The succession crisis did not become a civil war, for a reason neither noble nor accidental.\n\nIn March 1951 nineteen of the twenty-seven surviving White generals attended the funeral. Their order of precedence before the coffin took three days to negotiate, and standing behind the coffin were the serving officers of the General Staff - not one of them under forty out of the White armies.\n\nA young staff officer wrote later: \"That day I looked at the old men in the front row and understood something. They are arguing about 1919. What we have to hold is the Elbe. The two have nothing to do with each other.\""
 krcw_black_19.a:0 "Give way to the younger generation"
 krcw_black_19.b:0 "Keep the old generals in their nominal places"
 krcw_fra_party_centre:0 "CGT (Secretariat)"
 krcw_fra_party_centre_long:0 "Confédération Générale du Travail (Secretariat)"
 krcw_fra_party_communes:0 "Federation of Communes"
 krcw_fra_party_communes_long:0 "Federation of the Communes of France"
 krcw_fra_party_unions:0 "Revolutionary Syndicalists"
 krcw_fra_party_unions_long:0 "Confédération Générale du Travail (Revolutionary Syndicalist)"
 krcw_fra_secretariat_inspectors:0 "Send Secretariat Inspectors"
 krcw_fra_secretariat_inspectors_desc:0 "The secretariat posts inspectors to the member federations to check that its resolutions are carried out. The smaller members resent it, and for the first time the resolutions are actually implemented."
 krcw_fra_one_cadre_school:0 "One Curriculum for the Cadre Schools"
 krcw_fra_one_cadre_school_desc:0 "Cadre schools in every member use one curriculum, written in Paris. Officials across the bloc now read resolutions the same way."
 krcw_fra_arbitration_between_federations:0 "Set Up a Court Between the Federations"
 krcw_fra_arbitration_between_federations_desc:0 "Disputes between members go to a court of judges nominated by each country, and the secretariat stays out. Its rulings cannot be enforced, and most parties comply anyway."
 krcw_fra_the_exit_clause:0 "Write In the Exit Clause"
 krcw_fra_the_exit_clause_desc:0 "The statutes now provide that any member may leave, without penalty, by a vote of its own congress. None leaves, and those who stay trust Paris more."
 krcw_fra_dissolve_the_ministries:0 "Dissolve the Ministries"
 krcw_fra_dissolve_the_ministries_desc:0 "The ministries are abolished and their work handed to the industrial federations: railways to the railwaymen, mines to the miners. The first year is administrative chaos."
 krcw_fra_direct_delegates:0 "Delegates Elected by the Federations"
 krcw_fra_direct_delegates_desc:0 "French delegates to the Internationale are no longer appointed by the government but elected directly by the industrial federations. Other members are invited to do the same."
 krcw_eng_party_admin:0 "TUC (Administrators)"
 krcw_eng_party_admin_long:0 "Trades Union Congress (Administrators)"
 krcw_eng_party_stewards:0 "Shop Stewards' Congress"
 krcw_eng_party_stewards_long:0 "National Congress of British Shop Stewards"
 krcw_eng_party_guild:0 "National Guilds League"
 krcw_eng_party_guild_long:0 "National Guilds League of Britain"
 krcw_eng_the_planning_office:0 "Create the National Planning Office"
 krcw_eng_the_planning_office_desc:0 "A planning office of engineers and statisticians draws up the national production plan. Shop meetings may still comment, but no longer vote on the targets."
 krcw_eng_managers_by_examination:0 "Appoint Managers by Examination"
 krcw_eng_managers_by_examination_desc:0 "Works managers are now appointed by examination instead of being elected by the shop. Efficiency rises, and the shop stewards' supporters object strongly."
 krcw_eng_recall_at_any_meeting:0 "Make Managers Recallable at Any Meeting"
 krcw_eng_recall_at_any_meeting_desc:0 "Any shop meeting may recall its manager. Management loses the ability to plan far ahead; the workers gain control of day-to-day production."
 krcw_eng_the_national_stewards_congress:0 "Convene the National Stewards' Congress"
 krcw_eng_the_national_stewards_congress_desc:0 "The national congress of shop stewards becomes the supreme authority, and the TUC executive answers to it."
 krcw_eng_the_national_guilds:0 "Form the National Guilds"
 krcw_eng_the_national_guilds_desc:0 "Each industry forms a national guild, self-governing within and trading with the others by contract. The state only arbitrates."
 krcw_eng_the_guild_court:0 "Set Up the Guild Court"
 krcw_eng_the_guild_court_desc:0 "Disputes between guilds over prices and deliveries go to an arbitration court. Coal and steel prices are settled instead of being fought over every year."
 krcw_fra_reconstruction_plan:0 "The First Reconstruction Plan"
 krcw_fra_reconstruction_plan_desc:0 "Pits, railways, power stations and ports come first, and consumer rationing stays in force while the plan runs. The Reconstruction Commissariat reports its progress to the Congress every quarter."
 krcw_fra_reconstruction_plan_heavy:0 "Reconstruction Plan: Steel and Machine Tools First"
 krcw_fra_reconstruction_plan_heavy_desc:0 "The last two years of investment go to steel, machine tools and chemicals. Housing and civilian industry wait until the plan is over."
 krcw_fra_reconstruction_plan_housing:0 "Reconstruction Plan: Housing and Civilian Goods First"
 krcw_fra_reconstruction_plan_housing_desc:0 "The last two years of investment shift to housing, schools and civilian industry, and the steel targets are cut."
 krcw_fra_reconstruction_complete:0 "Reconstruction Completed"
 krcw_fra_reconstruction_complete_desc:0 "The Reconstruction Commissariat has been wound up and its staff moved to the federations' planning offices. Future plans are drawn up by the federations themselves."
 krcw_fra_social_insurance:0 "National Social Insurance Fund"
 krcw_fra_social_insurance_desc:0 "Sickness, pension and accident funds are merged into one, run by a board elected by the contributors. Contributions are higher than before."
 krcw_fra_social_insurance_2:0 "Social Insurance and the Forty-Hour Week"
 krcw_fra_social_insurance_2_desc:0 "Besides the national insurance fund, the forty-hour week is being restored industry by industry. There is less overtime and output is slightly down."
 krcw_fra_social_insurance_3:0 "The Labour Protection System"
 krcw_fra_social_insurance_3_desc:0 "Social insurance, the forty-hour week, the national wage scale and the works medical posts together make up the Commune's labour protection system, paid for out of the insurance fund."
 krcw_fra_atomic_commissariat_2:0 "Commissariat for Atomic Energy: Marcoule"
 krcw_fra_atomic_commissariat_2_desc:0 "The Commissariat does research at Saclay and makes power and plutonium at Marcoule, with uranium from the Limousin and the overseas contracts. What the plutonium is for is for the Congress to decide."
 krcw_fra_atomic_commissariat_3:0 "Commissariat for Atomic Energy and the Power Federation"
 krcw_fra_atomic_commissariat_3_desc:0 "The power reactors are handed to the power federation to run, while the Commissariat keeps the fuel and the research. Nuclear stations begin feeding the grid."
 krcw_fra_first_reconstruction_plan:0 "Draw Up the First Reconstruction Plan"
 krcw_fra_first_reconstruction_plan_desc:0 "The Reconstruction Commissariat combines the repair lists sent in by the industrial federations into a four-year plan: pits, railways, power stations and ports first. The Congress approves it on condition that progress is published every quarter. Consumer rationing will not be eased while the plan runs."
 krcw_fra_reopen_the_nord_pits:0 "Reopen the Nord Pits"
 krcw_fra_reopen_the_nord_pits_desc:0 "Half the galleries of the northern coalfield were flooded during the war. The miners' federation wants the water pumped out and the props replaced before anyone talks about output targets. Pumps and pit timber must be imported from the Rhineland, which takes a large share of the foreign currency."
 krcw_fra_rail_electrification:0 "Railway Electrification"
 krcw_fra_electrify_paris_lyon:0 "Electrify the Paris to Lyon Line"
 krcw_fra_electrify_paris_lyon_desc:0 "The railwaymen's federation proposes to electrify the whole Paris to Lyon main line and free the wagons now hauling locomotive coal. The work needs hundreds of kilometres of overhead wire, and the Rhône stations must supply the railway first."
 krcw_fra_rebuild_le_havre:0 "Rebuild Le Havre"
 krcw_fra_rebuild_le_havre_desc:0 "The docks and centre of Le Havre were nearly flattened in the war. The Commissariat gives the port to the dockers' and building workers' federations jointly, quays first and housing after. Once it reopens, Atlantic cargo no longer has to go round by Brest."
 krcw_fra_genissiat_dam:0 "Build the Génissiat Dam"
 krcw_fra_genissiat_dam_desc:0 "Génissiat is the first step of the Rhône cascade; work began before the war and stopped when the fighting came. The power federation brings in tunnel crews from the Alps to restart it, and the riverside communes trade resettlement money for first call on the power. Once it is finished, the Lyon works no longer depend on northern coal."
 krcw_fra_plan_heavy_first:0 "Steel and Machine Tools First"
 krcw_fra_plan_heavy_first_desc:0 "The metalworkers' federation and the planning engineers want the last two years of investment concentrated on steel, machine tools and chemicals, since without machine tools there will be no housing later. The building workers and the communes must wait, and the towns keep living in timber huts a few years longer."
 krcw_fra_plan_housing_first:0 "Housing and Civilian Goods First"
 krcw_fra_plan_housing_first_desc:0 "The building workers' federation and the big-city communes want the last two years of investment moved to housing, schools and civilian industry. Many families in the Nord and Lorraine still live in wartime huts. The steel targets come down, and the metalworkers have already objected."
 krcw_fra_lacq:0 "Lacq Gas"
 krcw_fra_lacq_gas:0 "Develop the Lacq Gas Field"
 krcw_fra_lacq_gas_desc:0 "Oil prospectors strike high-pressure gas at Lacq in the Pyrenean foothills. The chemical federation builds the purification plant and the pipeline, and the gas is so sour that a new process is needed. When it works, the south-west has fuel of its own."
 krcw_fra_close_the_reconstruction_plan:0 "Close the Reconstruction Plan"
 krcw_fra_close_the_reconstruction_plan_desc:0 "The Reconstruction Commissariat presents its last quarterly report to the Congress and dissolves, its staff moving to the planning offices of the federations. Rationing ends, and the next plan will be drawn up by the federations themselves."
 krcw_fra_unified_social_insurance:0 "Unify the Social Insurance Funds"
 krcw_fra_unified_social_insurance_desc:0 "The federations' separate sickness, pension and accident funds merge into one national fund, run by a board the contributors elect. The metalworkers pushed it through; the small federations fear the big ones will spend their reserves. Contributions go up, and so do the costs to the enterprises."
 krcw_fra_forty_hour_week:0 "Restore the Forty-Hour Week"
 krcw_fra_forty_hour_week_desc:0 "Overtime became normal during reconstruction, and the unions want the forty-hour week back. The Commissariat agrees to restore it industry by industry, pits and railways last. Output will dip for a while."
 krcw_fra_national_wage_scale:0 "Draw Up a National Wage Scale"
 krcw_fra_national_wage_scale_desc:0 "Pay varies widely between federations: miners and metalworkers earn most, textile and farm workers least. The Congress resolves to draw up one national scale, with a ceiling on the ratio between the top and bottom rates. The high-paid federations object and the low-paid ones support it."
 krcw_fra_works_medical_service:0 "Set Up Works Medical Services"
 krcw_fra_works_medical_service_desc:0 "Every works of over a hundred people must keep a medical post, and the mining and chemical districts get occupational disease clinics, all paid for by the insurance fund. The doctors' federation agrees to take part, provided private surgeries stay."
 krcw_fra_saclay_reactor:0 "Saclay Research Reactor"
 krcw_fra_saclay_research_reactor:0 "Build a Research Reactor at Saclay"
 krcw_fra_saclay_research_reactor_desc:0 "The Commissariat builds a second research reactor on the Saclay campus, running on heavy water and natural uranium, mainly to make isotopes and train operators. The University of Paris physicists want it for basic research; the Commissariat's engineers would rather test fuel elements in it."
 krcw_fra_limousin:0 "Limousin Uranium"
 krcw_fra_limousin_uranium:0 "Mine Uranium in the Limousin"
 krcw_fra_limousin_uranium_desc:0 "Geologists find uranium veins near La Crouzille in the Haute-Vienne, and the miners' federation sends veteran pitmen down from the Nord to sink the shafts. Home uranium cuts the dependence on the Madagascar and Congo contracts, but the ore is poor and the mill has to be built on site."
 krcw_fra_marcoule:0 "Marcoule Reactors"
 krcw_fra_marcoule_reactors:0 "Build the Marcoule Reactors"
 krcw_fra_marcoule_reactors_desc:0 "At Marcoule on the lower Rhône two graphite gas-cooled reactors are to be built, for power and for plutonium. The Secretariat and the Commissariat both know that the Congress will have to decide later what the plutonium is for. The chemical federation runs the reprocessing shop."
 krcw_fra_nuclear_school:0 "School of Nuclear Engineering"
 krcw_fra_nuclear_engineering_school:0 "Found a School of Nuclear Engineering"
 krcw_fra_nuclear_engineering_school_desc:0 "A school of nuclear engineering opens at Saclay, taking graduates of the engineering schools for two years and posting them to Marcoule and the institutes. The university federation wants it run by staff and students together; the Commissariat insists on naming the director."
 krcw_fra_pierrelatte:0 "Pierrelatte Diffusion Plant"
 krcw_fra_pierrelatte_plant:0 "Build the Pierrelatte Diffusion Plant"
 krcw_fra_pierrelatte_plant_desc:0 "Gaseous diffusion can enrich uranium for reactors and bombs alike, but the plant eats power. The Commissariat sites it at Pierrelatte, next to the Rhône stations. The power federation complains that one works will use a whole département's electricity."
 krcw_fra_chinon_power_station:0 "Build the Chinon Nuclear Power Station"
 krcw_fra_chinon_power_station_desc:0 "At Chinon on the Loire the first station built purely for power goes up, run by the power federation. The power federation has asked for years to take over the power reactors; the Commissariat agrees provided it keeps control of the fuel."
 krcw_eng_steel_board:0 "The National Steel Board"
 krcw_eng_steel_board_desc:0 "The Corporation has become the National Steel Board, whose council seats delegates of the steelworkers, the yards and the steel-using industries. Steel is allocated under the national plan and the works no longer take their own orders."
 krcw_eng_coal_plan:0 "The National Plan for Coal"
 krcw_eng_coal_plan_desc:0 "The miners' federation closes old pits and enlarges or sinks new ones under a national plan. Until the new pits are producing, the coalfields work extra night shifts."
 krcw_eng_miners_charter:0 "The Miners' Charter"
 krcw_eng_miners_charter_desc:0 "A five-day week, pensions for underground workers and compensation for pneumoconiosis are written into the Miners' Charter and enforced by each pit's safety committee. The night shifts are over."
 krcw_eng_atomic_authority:0 "The Atomic Energy Authority"
 krcw_eng_atomic_authority_desc:0 "Harwell and the other atomic establishments are run by one Atomic Energy Authority reporting to the Congress's science committee. Its budget takes a share of the money for civilian construction."
 krcw_eng_atomic_authority_power:0 "The Atomic Energy Authority"
 krcw_eng_atomic_authority_power_desc:0 "Since Calder Hall began feeding the grid, the Grid Board carries part of the Authority's budget. Opposition to the programme in the Congress has eased."
 krcw_eng_merge_the_clyde_steelworks:0 "Merge the Clydeside Steelworks"
 krcw_eng_merge_the_clyde_steelworks_desc:0 "The Corporation merges the Motherwell, Glengarnock and Dalzell works into one concern supplying the Clyde yards. The stewards of all three feared losing their own works committees, and the talks took a whole winter."
 krcw_eng_expand_port_talbot:0 "Expand the Port Talbot Strip Mill"
 krcw_eng_expand_port_talbot_desc:0 "The Welsh steelworkers' federation wants a continuous strip mill at Port Talbot to supply the car and appliance works of the Midlands. The rolling mills have to be ordered from the Combined Syndicates, which takes a large part of the clearing quota."
 krcw_eng_scunthorpe_furnaces:0 "Build New Furnaces at Scunthorpe"
 krcw_eng_scunthorpe_furnaces_desc:0 "Lincolnshire ore is lean, but it need not be imported. The Corporation builds new furnaces beside the Scunthorpe ore field to cut its dependence on Swedish and Spanish ore. Until they are lit, part of the Clyde's allocation is held back."
 krcw_eng_sheffield_steel:0 "Sheffield Steel Research Institute"
 krcw_eng_sheffield_steel_institute:0 "Found the Sheffield Steel Research Institute"
 krcw_eng_sheffield_steel_institute_desc:0 "Sheffield's special-steel works and the university's metallurgy department found a joint institute for alloy steels, turbine blades and armour plate. Test results that each works used to keep secret are now exchanged openly at the institute."
 krcw_eng_national_steel_board:0 "Create the National Steel Board"
 krcw_eng_national_steel_board_desc:0 "The Corporation is reorganised as the National Steel Board, with a council of delegates from the steelworkers' federation, the yards and the steel-using industries. Steel is allocated under the national plan and the works no longer take their own orders. The small works that lose their independence object most, Sheffield above all."
 krcw_eng_oxygen_steel:0 "The Oxygen Converter"
 krcw_eng_oxygen_converter:0 "Trial the Oxygen Converter"
 krcw_eng_oxygen_converter_desc:0 "The Steel Board builds a trial converter at Port Talbot that blows the melt with pure oxygen instead of air, cutting the time for a heat sharply. The open-hearth men fear for their jobs, and the Board promises transfers, not dismissals."
 krcw_eng_national_coal_plan:0 "Draw Up the National Plan for Coal"
 krcw_eng_national_coal_plan_desc:0 "Arthur Horner of the miners' federation directs the national plan for coal: which pits close, which are enlarged, where new ones are sunk. Until the new pits are producing, the plan asks for extra night shifts, and the coalfields resent it."
 krcw_eng_sink_the_nottinghamshire_pits:0 "Sink New Pits in Nottinghamshire"
 krcw_eng_sink_the_nottinghamshire_pits_desc:0 "The Nottinghamshire and Derbyshire seams are thick and shallow, suited to large new pits. The federation moves men from worked-out pits in South Wales and builds houses for them on the new field. The South Wales miners object to losing their members."
 krcw_eng_coalface:0 "Mechanised Coalface"
 krcw_eng_mechanise_the_coalface:0 "Mechanise the Coalface"
 krcw_eng_mechanise_the_coalface_desc:0 "The pits change over to cutting machines and conveyors, and pick-and-shovel working is phased out. Fewer men are needed underground, and the surplus move into building and the power industry."
 krcw_eng_the_miners_charter:0 "Proclaim the Miners' Charter"
 krcw_eng_the_miners_charter_desc:0 "The Miners' Charter sets a five-day week, pensions for underground workers and compensation for pneumoconiosis, enforced by each pit's safety committee. The night shifts end and the targets of the coal plan are lowered to match."
 krcw_eng_billingham_coal_chemicals:0 "Expand the Billingham Coal Chemical Works"
 krcw_eng_billingham_coal_chemicals_desc:0 "The Billingham works left behind by the pre-revolution chemical combine make fertiliser and synthetic oil from coal. The chemical workers' federation wants it enlarged so the Union imports less oil. Part of the building materials come out of the new-towns allocation."
 krcw_eng_atomic_energy_authority:0 "Create the Atomic Energy Authority"
 krcw_eng_atomic_energy_authority_desc:0 "Harwell and the other atomic establishments come under a single Atomic Energy Authority reporting to the Congress's science committee. Horner opposes the grant in the Congress on the ground that it comes out of the housing programme."
 krcw_eng_windscale:0 "The Windscale Piles"
 krcw_eng_windscale_piles:0 "Build the Windscale Piles"
 krcw_eng_windscale_piles_desc:0 "Two air-cooled graphite piles go up at Windscale on the Cumberland coast to make plutonium. They generate no power, so the peace faction in the Congress demands that their output be published."
 krcw_eng_capenhurst:0 "Capenhurst Enrichment"
 krcw_eng_capenhurst_enrichment:0 "Build the Capenhurst Enrichment Plant"
 krcw_eng_capenhurst_enrichment_desc:0 "A gaseous diffusion plant at Capenhurst in Cheshire enriches uranium, drawing so much power that a station has to be built for it alone. With its own enriched uranium the Union need not rely entirely on the fuel Paris allocates."
 krcw_eng_calder_hall_tb:0 "Calder Hall"
 krcw_eng_calder_hall:0 "Build Calder Hall Power Station"
 krcw_eng_calder_hall_desc:0 "Beside Windscale, Calder Hall becomes the Union's first nuclear station to feed the grid, while it goes on making plutonium. The Authority uses it to show the Congress that the atomic programme serves civilian needs as well."
 krcw_eng_dounreay:0 "Dounreay"
 krcw_eng_dounreay_reactor:0 "Build the Dounreay Experimental Reactor"
 krcw_eng_dounreay_reactor_desc:0 "The fast breeder reactor goes to Dounreay in Caithness, at the far north of Scotland and away from any dense population. The Scottish congress agrees to the site on condition that Highland workers are hired first."
 krcw_wgr_ruhr_reconstruction_2:0 "Ruhr Reconstruction: Canals and Ports"
 krcw_wgr_ruhr_reconstruction_2_desc:0 "Duisburg harbour and the canals are open again, and Ruhr coal and steel go by water to Hamburg and Emden. Reconstruction moves from single plants to the district as a whole."
 krcw_wgr_ruhr_district_plan:0 "The Ruhr District Plan"
 krcw_wgr_ruhr_district_plan_desc:0 "The Ruhr planning office schedules pits, steelworks, railways and housing together. The towns no longer build each on its own, and the district grows to a single plan."
 krcw_wgr_alpine_grid:0 "The Alpine Grid"
 krcw_wgr_alpine_grid_desc:0 "Hydro power from Salzburg and Tyrol begins to flow into Bavaria. The grid is not yet joined up, and each station runs its own line to the nearest industrial town."
 krcw_wgr_alpine_grid_2:0 "The Alpine Power Federation"
 krcw_wgr_alpine_grid_2_desc:0 "The stations of the Austrian provinces and Bavaria join one power federation under a single dispatcher. In the dry winter the Ruhr sends coal power south; in summer Alpine hydro goes north."
 krcw_wgr_works_council_law:0 "The Works Councils Act"
 krcw_wgr_works_council_law_desc:0 "By law the works councils share in hiring, dismissal and investment. Plant directors are nominated by the council and appointed by the regional economic office."
 krcw_wgr_labour_code:0 "The Labour Code"
 krcw_wgr_labour_code_desc:0 "The Works Councils Act, the labour courts and social insurance are combined into one labour code, passed by the national congress of councils. The rules of the shop floor are now in one book."
 krcw_wgr_five_day_week:0 "The Five-Day Week"
 krcw_wgr_five_day_week_desc:0 "Saturday is no longer a working day. The plants make up part of the output with better shifts, and the rest is simply given up."
 krcw_wgr_forty_eight_hours:0 "The Forty-Eight-Hour Week"
 krcw_wgr_forty_eight_hours_desc:0 "The working week stays at forty-eight hours, and the extra capacity goes to the Elbe line. The works councils move to shorten it every year."
 krcw_wgr_ruhr_mine_federation:0 "Form the Ruhr Mining Federation"
 krcw_wgr_ruhr_mine_federation_desc:0 "The pits of Gelsenkirchen, Bochum and Recklinghausen pass to the miners' federation, whose board is elected by the pit councils. The miners want the underground gear repaired before output is raised, and the planners agree."
 krcw_wgr_rebuild_hamm_yard:0 "Rebuild the Hamm Marshalling Yard"
 krcw_wgr_rebuild_hamm_yard_desc:0 "The Hamm yard is where Ruhr coal leaves for the rest of the country, and after the bombing only half its tracks work. The railwaymen's federation wants first call on rails and signals, and other works wait."
 krcw_wgr_duisburg_harbour:0 "Restore Duisburg Harbour and the Canals"
 krcw_wgr_duisburg_harbour_desc:0 "Duisburg-Ruhrort harbour, the Rhine-Herne canal and the Dortmund-Ems canal are dredged and their locks repaired, so coal and ore can go by water to Emden. Water is cheap; the works take two winters of labour."
 krcw_wgr_take_over_vereinigte_stahlwerke:0 "Take Over the United Steelworks"
 krcw_wgr_take_over_vereinigte_stahlwerke_desc:0 "The United Steelworks' plants at Duisburg-Hamborn and Dortmund are taken over by their works councils and merged into one Ruhr steel combine. Most of the old managers stay on under council supervision."
 krcw_wgr_miners_housing:0 "Build Housing for the Mining Towns"
 krcw_wgr_miners_housing_desc:0 "Many miners still live in cellars and board huts. The union housing cooperatives build whole estates in the mining towns, and some of the steel and cement has to come out of factory building."
 krcw_wgr_restart_voelklingen:0 "Restart the Voelklingen Ironworks"
 krcw_wgr_restart_voelklingen_desc:0 "The Saar pits and the Voelklingen ironworks start up again, with part of the output assigned to France under the clearing union quotas. Saar workers welcome the jobs and not the quotas."
 krcw_wgr_ruhr_planning_office:0 "Set Up the Ruhr District Planning Office"
 krcw_wgr_ruhr_planning_office_desc:0 "The Ruhr towns, the mining federation and the steel combine send delegates to one district planning office that schedules pits, mills, railways and housing together. The mayors give up part of their building powers."
 krcw_wgr_ruhr_steel:0 "Ruhr Steel Combine"
 krcw_wgr_finish_kaprun:0 "Finish the Kaprun Power Station"
 krcw_wgr_finish_kaprun_desc:0 "The Kaprun station was begun before the war and abandoned during it. The Salzburg provincial government wants it finished, on condition that part of the power stays in the province."
 krcw_wgr_reorganise_linz_works:0 "Reorganise the Linz Ironworks"
 krcw_wgr_reorganise_linz_works_desc:0 "The Linz ironworks were enlarged for war production and have been kept going by a workers' committee since the war. Reorganised, they become a state enterprise of Upper Austria, and the wartime managers are replaced."
 krcw_wgr_tauern_arlberg_lines:0 "Repair the Tauern and Arlberg Lines"
 krcw_wgr_tauern_arlberg_lines_desc:0 "The Tauern line joins Salzburg to Carinthia and the Arlberg line joins Tyrol to Vorarlberg. Once both are electrified the Austrian provinces no longer have to route through Bavaria to reach each other."
 krcw_wgr_expand_erzberg:0 "Expand Mining at the Erzberg"
 krcw_wgr_expand_erzberg_desc:0 "The Erzberg in Styria feeds the furnaces at Linz and Donawitz. Opening up more of the open-cast workings needs new mining machinery, which the Ruhr plants supply."
 krcw_wgr_alpine_power_federation:0 "Form the Alpine Power Federation"
 krcw_wgr_alpine_power_federation_desc:0 "The stations of the Austrian provinces and Bavaria join one power federation dispatched from Munich. The provinces fear Munich will set their prices, so the statutes give each province its seats on the board."
 krcw_wgr_works_councils_act:0 "Pass the Works Councils Act"
 krcw_wgr_works_councils_act_desc:0 "The powers of the works councils are written into law: a say in hiring, dismissal and investment, and the right to nominate the plant director. Engineers and planners complain that decisions are slower."
 krcw_wgr_labour_courts:0 "Set Up the Labour Courts"
 krcw_wgr_labour_courts_desc:0 "Disputes between councils, directors and the industrial federations go to labour courts with lay judges chosen by the unions. A strike must first go to the court for conciliation."
 krcw_wgr_unified_social_insurance:0 "Unify Social Insurance"
 krcw_wgr_unified_social_insurance_desc:0 "The scattered sickness, accident and pension funds of the imperial era are merged into one insurance office run by the union federation. The plants pay contributions on their wage bill and their surpluses shrink."
 krcw_wgr_five_day_week_f:0 "Introduce the Five-Day Week"
 krcw_wgr_five_day_week_f_desc:0 "The metalworkers' union campaigns for Saturdays at home, and the councils' assembly votes for a five-day week by a majority. The general staff objects that the Elbe line needs the capacity."
 krcw_wgr_keep_the_long_week:0 "Keep the Forty-Eight-Hour Week"
 krcw_wgr_keep_the_long_week_desc:0 "Citing the front, the government asks to keep the forty-eight-hour week and put the extra output into arms and exports. The councils' assembly agrees reluctantly, on condition of a new vote every year."
 krcw_wgr_pass_the_labour_code:0 "Pass the Labour Code"
 krcw_wgr_pass_the_labour_code_desc:0 "The national congress of councils meets in Frankfurt and combines the Works Councils Act, the labour courts and social insurance into one labour code. It sits for three weeks and all other legislation waits."
 krcw_sov_ural_engineering:0 "The Ural Engineering Trust"
 krcw_sov_ural_engineering_desc:0 "The Ural machine, tractor and wagon works are merged into one trust that takes state orders as a single body. The army and the Ministry of Agriculture both queue for its output."
 krcw_sov_audited_trusts:0 "The Audited Trusts"
 krcw_sov_audited_trusts_desc:0 "State auditors sit permanently in the trusts and the books go to the Ministry of the Economy every quarter. The managers complain of paperwork, and deliveries now arrive on time."
 krcw_sov_baron_trusts:0 "The Ural Barons"
 krcw_sov_baron_trusts_desc:0 "The trust boards divide their own profits and the state takes only its dividend. The steel barons pay for churches and newspapers, and are more willing to back the government in the Council."
 krcw_sov_commune_title:0 "The Commune's Title"
 krcw_sov_commune_title_desc:0 "The commune's ownership of its land is written into the Land Law, and allotments are still redistributed by household size. The villages are quiet and the conscription rolls complete, but the fields stay in narrow strips and yields do not rise."
 krcw_sov_khutor_farms:0 "The Khutor Farms"
 krcw_sov_khutor_farms_desc:0 "Households may leave the commune with their allotments and consolidate them into a farm of their own. Savinkov's government finishes what Stolypin began, and the commune elders are unhappy about it."
 krcw_sov_atomic_project_2:0 "Project Number One: The Design Bureau"
 krcw_sov_atomic_project_2_desc:0 "The uranium mines, the reactor and the design bureau now form one chain. Each year the project takes more power and steel, and the Ministry of the Economy is no longer allowed to ask about its budget."
 krcw_sov_the_uralmash_trust:0 "Reorganise Uralmash"
 krcw_sov_the_uralmash_trust_desc:0 "The Uralmash works at Yekaterinburg becomes the parent plant of the trust and builds rolling mills and presses for the other factories. The Ural steel barons demand a majority on its board."
 krcw_sov_chelyabinsk_tractor_works:0 "Expand the Chelyabinsk Tractor Works"
 krcw_sov_chelyabinsk_tractor_works_desc:0 "The Chelyabinsk tractor works built tanks in the war, and now runs both lines: tractors for the villages and tank hulls for the army. The ministries of agriculture and defence argue for six months over which comes first."
 krcw_sov_nizhny_tagil_wagon_works:0 "Expand the Nizhny Tagil Wagon Works"
 krcw_sov_nizhny_tagil_wagon_works_desc:0 "The Nizhny Tagil works turns out both goods wagons and medium tanks. The General Staff wants it to become the main tank plant east of the Urals, out of range of any of the Internationale's bombers."
 krcw_sov_tree_bid_civ_5_tt:0 "Influence of the civilian technocrats: §G+5§!"
 krcw_sov_audit_the_trusts:0 "Send State Auditors into the Trusts"
 krcw_sov_audit_the_trusts_desc:0 "The Ministry of the Economy posts auditors to every trust, and for the first time there is an account of where the profits go. The civilian technocrats back it; the steel barons call it a breach of the bargain."
 krcw_sov_tree_bid_mon_5_tt:0 "Influence of the monarchists: §G+5§!"
 krcw_sov_leave_the_profits_to_the_boards:0 "Leave the Profits to the Boards"
 krcw_sov_leave_the_profits_to_the_boards_desc:0 "The government confirms that the trust boards may divide their own profits and the state takes only its dividend. The barons thank the Ruler and begin to attend the Council's receptions alongside the bishops."
 krcw_sov_the_tuymazy_field:0 "Develop the Tuymazy Field"
 krcw_sov_the_tuymazy_field_desc:0 "Bashkiria's Tuymazy field has struck oil in the deeper Devonian beds. Working it needs new rigs and a branch line to Ufa."
 krcw_sov_the_ufa_refinery:0 "Build the Ufa Refinery"
 krcw_sov_the_ufa_refinery_desc:0 "Crude cannot all leave in tank wagons. With the Ufa refinery built, Volga-Ural oil is refined locally into aviation spirit and diesel, and the air force is the first to benefit."
 krcw_sov_the_samara_pipeline:0 "Lay the Samara Pipeline"
 krcw_sov_the_samara_pipeline_desc:0 "A pipeline runs from Tuymazy to the Volga wharves at Samara, where the oil is loaded onto river tankers. The Railway Ministry gets back thousands of tank wagons."
 krcw_sov_the_peasant_land_bank:0 "Reopen the Peasant Land Bank"
 krcw_sov_the_peasant_land_bank_desc:0 "The Peasant Land Bank reopens and lends to communes and households for land and machinery over long terms. The Treasury must guarantee it, and the trusts hope the loans end up as tractor orders."
 krcw_sov_confirm_the_commune_title:0 "Confirm the Commune's Title"
 krcw_sov_confirm_the_commune_title_desc:0 "The Land Law vests the allotments in the commune, to be redistributed by its assembly. This was Savinkov's promise to the peasants, and the Council's populists insist it cannot change."
 krcw_sov_allow_separation_from_the_commune:0 "Allow Separation from the Commune"
 krcw_sov_allow_separation_from_the_commune_desc:0 "A household may leave the commune with its allotment and set up a farm of its own. The technocrats say it is the only way to raise yields; the elders and the populists say it tears up the bargain."
 krcw_sov_zemstvo_agronomists:0 "Zemstvo Agronomists for the Communes"
 krcw_sov_zemstvo_agronomists_desc:0 "The provincial zemstvos hire agronomists and vets for the communes to teach rotation and seed selection. The allotments are still strips, but each strip yields a little more."
 krcw_sov_land_consolidation_commissions:0 "Set Up Land Consolidation Commissions"
 krcw_sov_land_consolidation_commissions_desc:0 "County commissions send out surveyors to exchange the scattered strips of departing households for one consolidated plot. Disputes are many, and the county courts are booked into next year."
 krcw_sov_siberian_creamery_union:0 "Rebuild the Union of Siberian Creameries"
 krcw_sov_siberian_creamery_union_desc:0 "Before the revolution the creamery cooperatives of Kurgan and Omsk sold butter in London and Hamburg. The Land Bank pays to rebuild their union with separators and refrigerated wagons, and the foreign currency earned goes to the Ministry of the Economy."
 krcw_sov_grain_elevators:0 "Build a Network of Grain Elevators"
 krcw_sov_grain_elevators_desc:0 "Grain elevators go up along the railways at Voronezh, Saratov, Kurgan and in the Kuban, so the grain quota no longer waits in the open at the stations. For the first time the state grain reserve has the storage it needs."
 krcw_sov_khodzhent_uranium:0 "Mine the Khodzhent Uranium"
 krcw_sov_khodzhent_uranium_desc:0 "The Taboshar uranium mine lies in the hills north of Khodzhent, and the ore goes by lorry to the railway. The district is closed, and most of the miners are administrative exiles."
 krcw_sov_the_arzamas_bureau:0 "Found the Arzamas Design Bureau"
 krcw_sov_the_arzamas_bureau_desc:0 "The old Sarov monastery in Nizhny Novgorod province becomes a design bureau for the device itself. The Academy nominates the staff and State Security vets every one of their files."
 krcw_sov_the_novaya_zemlya_range:0 "Build the Novaya Zemlya Range"
 krcw_sov_the_novaya_zemlya_range_desc:0 "The Northern Fleet ships materials and men from Arkhangelsk to Novaya Zemlya, and the Nenets living on the islands are moved to the mainland. The range can only be built in summer."
 krcw_sov_bring_the_test_forward:0 "Bring the First Test Forward"
 krcw_sov_bring_the_test_forward_desc:0 "The design bureau reports that the device can be ready early if several safety trials are skipped. The General Staff agrees; several academicians object."
 krcw_ddr_reconstruction_office:0 "The Reconstruction Office"
 krcw_ddr_reconstruction_office_desc:0 "The Reconstruction Plan now has its own office, which allocates steel, cement and freight, and every ministry must submit its projects to it first. The ministers lose part of their budgets, and the sites run short of materials less often."
 krcw_ddr_reconstruction_second:0 "The Reconstruction Plan: Second Phase"
 krcw_ddr_reconstruction_second_desc:0 "The ruins are cleared, and the money of the second phase goes to enlarging the works and building housing. The new plants on the Oder and in Silesia begin to deliver, and the Reconstruction Office is cut back to supervising contracts."
 krcw_ddr_state_farm_system:0 "The State Farm System"
 krcw_ddr_state_farm_system_desc:0 "The great eastern estates are run as state farms, the machine stations supply the equipment and the state fixes the procurement prices. The Junkers keep their posts as managers and the labourers draw a fixed wage."
 krcw_ddr_ordnance_office:0 "The Army Ordnance Office"
 krcw_ddr_ordnance_office_desc:0 "The Army Ordnance Office reopens to choose designs, place orders and accept deliveries. Most of its officers did the same job under the Empire."
 krcw_ddr_ordnance_office_2:0 "The Army Ordnance Office"
 krcw_ddr_ordnance_office_2_desc:0 "The works at Suhl, Magdeburg and Jena all produce to Ordnance Office contracts, and for the first time fire control, small arms and tanks are coordinated by one office."
 krcw_ddr_set_up_the_reconstruction_office:0 "Set Up the Reconstruction Office"
 krcw_ddr_set_up_the_reconstruction_office_desc:0 "The Reconstruction Plan is handed to a dedicated office that allocates steel, cement and rail freight. The ministries of industry and transport must give up part of their budgets, and both ministers object."
 krcw_ddr_build_the_oder_steelworks:0 "Build the Oder Steelworks"
 krcw_ddr_build_the_oder_steelworks_desc:0 "Without the Ruhr, East Germany must make its own steel. The office sites a works at Fuerstenberg on the Oder, to run on Silesian coke and Russian ore shipped through Stettin. Steel quotas for the other sites are cut while it is built."
 krcw_ddr_reopen_the_waldenburg_pits:0 "Reopen the Waldenburg Pits"
 krcw_ddr_reopen_the_waldenburg_pits_desc:0 "The hard coal of Waldenburg in Lower Silesia is the only coking coal East Germany has. The pits flooded at the end of the war; pumping and shoring them will take two years, and the miners' union wants housing built first."
 krcw_ddr_rebuild_the_breslau_wagon_works:0 "Rebuild the Breslau Wagon Works"
 krcw_ddr_rebuild_the_breslau_wagon_works_desc:0 "The Linke-Hofmann works at Breslau once built locomotives and wagons for all of Germany. Rebuilt, it will first replace the Reichsbahn's losses and then fill Russian reparation orders."
 krcw_ddr_rebuild_schwarzheide:0 "Rebuild the Schwarzheide Fuel Works"
 krcw_ddr_rebuild_schwarzheide_desc:0 "The Schwarzheide works in Lusatia made petrol from lignite until it was bombed flat. The defence ministry wants it restored first, because the Russian fuel allocation can be cut at any time."
 krcw_ddr_second_phase_of_reconstruction:0 "Announce the Second Phase of Reconstruction"
 krcw_ddr_second_phase_of_reconstruction_desc:0 "The phase of clearing ruins ends, and the budget moves to enlarging the works and building housing in Leipzig and Dresden. The Reconstruction Office is cut down to supervising contracts, and the industry ministry gets its budget back."
 krcw_ddr_repair_the_reichsbahn:0 "Repair the Reichsbahn"
 krcw_ddr_repair_the_reichsbahn_desc:0 "The Russians took up the second track on many lines and shipped the rails east. The office restores the main lines between Magdeburg, Leipzig and Chemnitz first."
 krcw_ddr_build_the_berlin_outer_ring:0 "Build the Berlin Outer Ring"
 krcw_ddr_build_the_berlin_outer_ring_desc:0 "Every East German line leads to Berlin, and half of Berlin's junctions lie in the western sectors. An outer ring around West Berlin joins Potsdam to East Berlin, so the West can no longer block East German traffic by closing a station."
 krcw_ddr_expand_the_port_of_stettin:0 "Expand the Port of Stettin"
 krcw_ddr_expand_the_port_of_stettin_desc:0 "Stettin is East Germany's largest Baltic port, and Russian ore and Swedish machinery both come in through it. The port authority wants new quays and a repair yard, and the navy wants to borrow half of them."
 krcw_ddr_dredge_the_oder:0 "Dredge the Oder Waterway"
 krcw_ddr_dredge_the_oder_desc:0 "The Oder links Silesian coal with the port of Stettin, but the channel has silted up and barges sail half loaded. The waterways board takes on the dredging and the new locks, a job that will run across two winters."
 krcw_ddr_set_up_machine_stations:0 "Set Up the Machine Stations"
 krcw_ddr_set_up_machine_stations_desc:0 "The state farms' tractors and threshers are pooled in county machine stations and sent out to the farms by season. Most of the machines were bought on Russian credit, repaid out of the grain deliveries."
 krcw_ddr_drain_the_oderbruch:0 "Drain the Oderbruch"
 krcw_ddr_drain_the_oderbruch_desc:0 "The marshland of the lower Oder was flooded again when its dykes were blown up in the war. The waterways board and the state farms rebuild the dykes and ditches together; the work needs labour in bulk, and the army sends engineer battalions."
 krcw_ddr_settle_pomerania:0 "Settle New Farmers in Pomerania"
 krcw_ddr_settle_pomerania_desc:0 "Small plots on the edge of the Pomeranian estates go to farm labourers and refugees from the east, with machinery and seed from the state farms. The Junker wing of the National Front says it will strip the estates of labour."
 krcw_ddr_build_the_magdeburg_sugar_mills:0 "Build the Magdeburg Sugar Mills"
 krcw_ddr_build_the_magdeburg_sugar_mills_desc:0 "The sugar beet of the Magdeburg plain used to be refined in the west, and the demarcation line now separates the crop from the mills. The office builds new mills locally, and sugar returns to the town ration cards."
 krcw_ddr_fix_procurement_prices:0 "Fix the Procurement Prices"
 krcw_ddr_fix_procurement_prices_desc:0 "The state buys grain, beet and milk at fixed prices, and farm wages are tied to deliveries. Town rations become steady, and the finance ministry pays for the difference."
 krcw_ddr_reopen_the_ordnance_office:0 "Re-establish the Army Ordnance Office"
 krcw_ddr_reopen_the_ordnance_office_desc:0 "The conscripts of the service law need weapons. Manstein asks for the Army Ordnance Office to be restored to choose designs and place orders centrally, instead of each district begging equipment from the Russians."
 krcw_ddr_adopt_russian_patterns:0 "Adopt Russian Patterns"
 krcw_ddr_adopt_russian_patterns_desc:0 "The office accepts Russian calibres and drawings, and East German works build them under licence. Ammunition and spares become interchangeable with the Accord armies, and the German designers are out of work."
 krcw_ddr_keep_german_designs:0 "Keep German Designs"
 krcw_ddr_keep_german_designs_desc:0 "The General Staff insists on German designs, arguing that German works know how to build them. Moscow reads it as preparation for an independent arms industry, and the licence talks turn difficult."
 krcw_ddr_reopen_the_suhl_gunworks:0 "Reopen the Suhl Gunworks"
 krcw_ddr_reopen_the_suhl_gunworks_desc:0 "Suhl in Thuringia has made guns for centuries. The office merges the old firms into one state gunworks for rifles and machine guns."
 krcw_ddr_reopen_the_gruson_works:0 "Reopen the Gruson Works at Magdeburg"
 krcw_ddr_reopen_the_gruson_works_desc:0 "The Gruson works at Magdeburg built tanks before the war. Most of the halls still stand, but the Russians took the machine tools, and reopening it means buying a batch back off the reparations list."
 krcw_ddr_zeiss_fire_control:0 "Put Zeiss Jena on Fire Control"
 krcw_ddr_zeiss_fire_control_desc:0 "The Zeiss works at Jena has the best optical engineers in East Germany. The office gives it the sights and rangefinders for the artillery and the tanks, and the output of civilian cameras falls."
 krcw_ddr_schwarzheide:0 "Schwarzheide Fuel Works"
 krcw_ddr_russian_patterns:0 "Russian Patterns"
 krcw_ddr_russian_armour:0 "Russian Tank Licences"
 krcw_ddr_german_designs:0 "German Tank Designs"
 krcw_ddr_german_guns:0 "German Gun Designs"
 krcw_ddr_suhl:0 "Suhl Gunworks"
 krcw_ddr_zeiss:0 "Zeiss Jena"
 krcw_fra_containment_line:0 "The Containment Line"
 krcw_fra_containment_line_desc:0 "The Commune will not cross the Elbe first, and it gives the Accord no breathing space: intelligence, broadcasting and trade are all turned against it. The intelligence and propaganda budgets are funded at a wartime rate."
 krcw_fra_containment_plan:0 "The Plan to Break the Accord"
 krcw_fra_containment_plan_desc:0 "The intelligence bureau, the radio, the Clearing Union and the exile organisations work to one plan: to make the Accord wear itself out economically and politically. The Congress votes the money each year in closed session."
 krcw_fra_mobilisation_plan:0 "The General Mobilisation Plan"
 krcw_fra_mobilisation_plan_desc:0 "Every industrial federation keeps a mobilisation office whose registers say which works convert and which men report in wartime. The price is a larger staff of clerks in peacetime."
 krcw_fra_war_readiness:0 "Ready for General War"
 krcw_fra_war_readiness_desc:0 "Mobilisation, transport, air defence and joint command are all ready, and the Commune can go over to general war within a month. Whether to fight is still for the Congress to decide."
 krcw_fra_war_economy:0 "The War Economy Statute"
 krcw_fra_war_economy_desc:0 "In an emergency the Secretariat may direct factories, materials and transport itself, and the federations' self-government is suspended. Old officials fear the statute will never be repealed once passed."
 krcw_ti_mobilisation_registers_idea:0 "The Mobilisation Registers"
 krcw_ti_mobilisation_registers_idea_desc:0 "Every workshop and commune has registered the men, lorries and tools that report in wartime, and the registers are checked every year. Nobody will have to call the roll when the war comes."
 krcw_fra_ma_crisis_up2_tt:0 "§YAccord crisis +2§!"
 krcw_fra_ma_crisis_up3_tt:0 "§YAccord crisis +3§!"
 krcw_fra_geneva_station:0 "The Geneva Station"
 krcw_fra_radio_east:0 "The Eastern Broadcasts"
 krcw_fra_ma_crisis_up4_tt:0 "§YAccord crisis +4§!"
 krcw_fra_ma_crisis_up5_tt:0 "§YAccord crisis +5§!"
 krcw_fra_eastern_legions:0 "Raise the Eastern European Legions"
 krcw_fra_eastern_legions_desc:0 "Volunteers are recruited among exiled Polish, Czech and Hungarian workers and formed into legions under their own officers, to cross the Elbe with the first wave if war comes. The Accord will treat it as preparation for war."
 krcw_fra_ti_crisis_down5_tt:0 "§YInternationale crisis -5§!"
 krcw_fra_root_out_the_networks:0 "Root Out the Accord's Networks"
 krcw_fra_root_out_the_networks_desc:0 "The Federal Security Office goes after the networks the Accord has built in the unions, the docks and the universities, and arrests people in touch with White Russian émigré groups. Shop assemblies complain that the office oversteps, and some wrongful arrests will make the papers."
 krcw_fra_ti_crisis_down4_tt:0 "§YInternationale crisis -4§!"
 krcw_fra_counterintel:0 "Counter-Intelligence Committee"
 krcw_fra_internationale_counterintelligence:0 "Found the Internationale Counter-Intelligence Committee"
 krcw_fra_internationale_counterintelligence_desc:0 "The members' security services set up a joint committee in Paris to exchange suspect lists and intercepted cables. The small members fear the lists will be used against their own oppositions; Paris promises they will be used only against Accord agents."
 krcw_fra_recon_sat:0 "Reconnaissance Satellites"
 krcw_fra_berlin_airlift_reserve:0 "Build Up the Berlin Airlift Reserve"
 krcw_fra_berlin_airlift_reserve_desc:0 "The aviation federation assigns transports and crews permanently to the Berlin corridor and stocks fuel and flour at the Champagne and Alsace airfields. The West German government welcomes it; the air force complains that it eats training fuel."
 krcw_fra_army_of_the_rhine:0 "Station the Army of the Rhine in Germany"
 krcw_fra_army_of_the_rhine_desc:0 "Two armoured divisions and an air wing are stationed permanently in West Germany under the Franco-German joint command. The West German government pays for the barracks; some in the Congress ask whether the force will turn into an army of occupation."
 krcw_fra_general_mobilisation_plan:0 "Draw Up the General Mobilisation Plan"
 krcw_fra_general_mobilisation_plan_desc:0 "The General Staff and the industrial federations draw up the wartime mobilisation tables: which works convert, which men stay at the bench and which report within a day. Every federation must set up a mobilisation office and carry the extra clerks in peacetime."
 krcw_fra_mil_rail:0 "Military Railways"
 krcw_fra_rhine_elbe_railways:0 "Build the Military Railways to the Elbe"
 krcw_fra_rhine_elbe_railways_desc:0 "The lines from Lorraine and Alsace to the Rhine crossings are double-tracked, with military spurs and loading yards built inside West Germany. The railway federation does the work, and civilian freight gives way for two years."
 krcw_fra_armour_groups:0 "Armoured Army Groups"
 krcw_fra_armoured_army_groups:0 "Form the Armoured Army Groups"
 krcw_fra_armoured_army_groups_desc:0 "The armoured divisions scattered across the military districts are combined into two armoured army groups, quartered in Lorraine and Alsace at war strength. The Renault and SOMUA works add a shift to equip them."
 krcw_fra_forward_air:0 "Forward Air Bases"
 krcw_fra_forward_air_bases:0 "Move the Air Bases Forward"
 krcw_fra_forward_air_bases_desc:0 "The fighter wings move from around Paris to new fields in Champagne, Lorraine and Alsace, halving interception times. The new fields are closer to the Elbe and easier to bomb on the first day of a war."
 krcw_fra_convoys:0 "Atlantic Convoy Plan"
 krcw_fra_atlantic_convoy_plan:0 "Plan the Atlantic Convoys"
 krcw_fra_atlantic_convoy_plan_desc:0 "In wartime the lorries, nickel and grain from North America must cross the Atlantic. The fleet is reorganised into escort groups, Brest and Le Havre build more anti-submarine ships, and the Combined Syndicates and Canada provide part of the escort."
 krcw_fra_civil_defence_directorate:0 "Found the Civil Defence Directorate"
 krcw_fra_civil_defence_directorate_desc:0 "The Civil Defence Directorate takes charge of urban air defence, evacuation plans and shelters, and the Paris Métro stations are fitted out as air-raid shelters. Each commune must raise its own civil defence corps out of the local budget."
 krcw_fra_intel_decrypt:0 "Military Intelligence Bureau"
 krcw_fra_intel_radar:0 "Military Intelligence Bureau"
 krcw_fra_military_intelligence_bureau:0 "Expand the Federal Military Intelligence Bureau"
 krcw_fra_military_intelligence_bureau_desc:0 "The Military Intelligence Bureau adds listening posts in West Germany and Italy, watching the Accord's assembly areas in Poland and East Germany. Its task is to tell the General Staff where the enemy armour is before a war begins."
 krcw_fra_war_economy_statute:0 "Enact the War Economy Statute"
 krcw_fra_war_economy_statute_desc:0 "The Congress empowers the Secretariat to direct factories, materials and transport itself in an emergency, suspending the federations' self-government. Old federation officials fear it will never be repealed."
 krcw_fra_internationale_joint_command:0 "Set Up the Internationale Joint Command"
 krcw_fra_internationale_joint_command_desc:0 "In wartime the European members' forces pass to the joint command at Strasbourg, where each general staff keeps a standing representative. Every member must state in advance which divisions it commits and on which sector."
 krcw_fra_ww_prepared_tt:0 "The General Staff's §Ygeneral war plan§! is ready."
 krcw_fra_general_war_readiness:0 "Complete the Preparations for General War"
 krcw_fra_general_war_readiness_desc:0 "The General Staff reports to the Congress that mobilisation, transport, air defence and joint command are ready and the Commune can go over to general war within a month. Whether to fight is still for the Congress to decide, but the plan is on the table."
 krcw_fra_ti_crisis_down3_tt:0 "§YInternationale crisis -3§!"
 krcw_ti_stockholm_station:0 "The Stockholm Station"
 krcw_ti_mobilisation_registers:0 "Compile the Mobilisation Registers"
 krcw_ti_mobilisation_registers_desc:0 "Every workshop and commune registers the men, lorries and tools that report in wartime, and the lists are checked each year. The unions complain about the forms, but nobody will have to call the roll when war comes."
 krcw_ti_war_stockpiles:0 "Lay In War Stockpiles"
 krcw_ti_war_stockpiles_desc:0 "Ammunition, fuel and food are stored in inland depots so the country can fight alone until help arrives. The stockpile takes goods that would have been exported, and our Clearing Union account goes into deficit."
 krcw_ti_counter_infiltration:0 "Root Out Accord Infiltration"
 krcw_ti_counter_infiltration_desc:0 "The security service investigates union officials and émigré groups in touch with Accord intelligence and cuts the money coming through neutral countries. Some old members are wrongly arrested, and the congress holds hearings over it."
 krcw_ti_wartime_doctrine:0 "Wartime Joint Command"
 krcw_ti_wartime_command:0 "Place Our Forces Under Wartime Joint Command"
 krcw_ti_wartime_command_desc:0 "We sign a wartime command agreement with Paris: once war begins our divisions pass to the Internationale joint command, and our general staff handles the rear and mobilisation. Opponents call it surrendering sovereignty in war; supporters say a small country cannot hold out alone for long."
 krcw_ti_crisis_tt:0 "Internationale crisis: [?global.krcw_ti_crisis]/100"
 krcw_ma_crisis_tt:0 "Accord crisis: [?global.krcw_ma_crisis]/100"
 krcw_sov_long_confrontation:0 "The Programme of Long Confrontation"
 krcw_sov_long_confrontation_desc:0 "The Council of State confirms that the struggle with the Internationale will last a generation. The budget, the schools and the press are all planned to that horizon."
 krcw_sov_crush_the_forest_brothers:0 "Clear Out the Forest Brothers"
 krcw_sov_crush_the_forest_brothers_desc:0 "Gendarmes and frontier troops go into the Lithuanian and Latvian forests village by village, hunting the Internationale-funded partisans and their radios. Those caught are exiled by administrative order. The villages will hate the Russians more."
 krcw_sov_the_naval_infantry:0 "Raise the Naval Infantry"
 krcw_sov_the_naval_infantry_desc:0 "The Black Sea and Baltic fleets each raise a landing brigade, tasked with seizing the Straits and the Danish islands when war begins. The fleets must convert transports for them."
 krcw_sov_strategic_rocket_forces:0 "Form the Strategic Rocket Forces"
 krcw_sov_strategic_rocket_forces_desc:0 "The first intercontinental missile regiments leave the artillery and become a service of their own, answering to the Supreme Ruler. Their sites are dug in the Kazakh steppe and east of the Urals."
 krcw_sov_war_council:0 "The Supreme Defence Council"
 krcw_sov_war_council_desc:0 "The heads of the General Staff, the services, the railways and the arms trusts meet weekly and share out the budget by the needs of a war with the Internationale."
 krcw_sov_war_industry:0 "Arms Industry First"
 krcw_sov_war_industry_desc:0 "The arms trusts' orders get steel, power and wagons first. Civilian targets are cut to match."
 krcw_sov_general_war_plan:0 "The General War Plan"
 krcw_sov_general_war_plan_desc:0 "The general plan for war with the Internationale is approved: the mobilisation timetable, the first echelon's assembly areas, the railway movement tables and every Accord member's task are written. Only the order is missing."
 krcw_sov_the_supreme_defence_council:0 "Establish the Supreme Defence Council"
 krcw_sov_the_supreme_defence_council_desc:0 "The joint staff at Minsk can coordinate but not allocate money. The Supreme Defence Council puts the General Staff, the arms trusts and the railways at one table and ranks everything by the needs of a war with the Internationale. The Treasury loses its veto over defence spending."
 krcw_sov_the_western_mobilisation_plan:0 "Draw Up the Western Mobilisation Plan"
 krcw_sov_the_western_mobilisation_plan_desc:0 "The General Staff rewrites the 1944 mobilisation tables: reservists registered by district, every division in the western districts filled within thirty days. Every commune knows how many men and horses it owes."
 krcw_sov_enlarge_the_tank_armies:0 "Enlarge the Guards Tank Armies"
 krcw_sov_enlarge_the_tank_armies_desc:0 "The tank armies on the Elbe grow from three to five and the Kharkov and Nizhny Tagil works go to three shifts. Each army gets its own motor rifles and bridging troops."
 krcw_sov_the_frontline_air_armies:0 "Form the Frontline Air Armies"
 krcw_sov_the_frontline_air_armies_desc:0 "Every front gets an air army of its own, fighters and ground-attack aircraft massed on new fields around Minsk and Lvov. Pilot training hours are doubled, and so is the fuel ration."
 krcw_sov_the_convoy_war_plan:0 "Plan the War on the Atlantic Convoys"
 krcw_sov_the_convoy_war_plan_desc:0 "The Internationale's armies depend on arms shipped across the Atlantic from Canada and the Great Lakes. The Northern Fleet's submarines must cut that route in the first month of war, and Murmansk is enlarged for them."
 krcw_sov_the_okhrana_abroad:0 "Plant the Okhrana in the Internationale's Staffs"
 krcw_sov_the_okhrana_abroad_desc:0 "The Okhrana's émigré desk starts recruiting informers inside the staffs in Paris and London, after war plans and railway timetables. If it is exposed, relations will get worse."
 krcw_sov_the_western_rail_junctions:0 "Rebuild the Western Rail Junctions"
 krcw_sov_the_western_rail_junctions_desc:0 "The junctions at Minsk, Brest, Lvov and Daugavpils get extra sidings and transhipment yards so the first week of mobilisation can send enough trains west each day. The work takes the railway ministry's whole annual budget."
 krcw_sov_the_war_economy:0 "Put Industry on a War Footing"
 krcw_sov_the_war_economy_desc:0 "The arms trusts' orders get steel, power and wagons first, and part of every civilian works on the Urals and the Volga switches to ammunition. The shops will have less."
 krcw_sov_national_civil_defence:0 "Build the National Civil Defence"
 krcw_sov_national_civil_defence_desc:0 "Moscow, Petrograd and the Ural industrial towns get shelters, evacuation routes and reserve command posts. Every factory raises a civil defence team and every resident takes part in drills."
 krcw_sov_approve_the_general_war_plan:0 "Approve the General War Plan"
 krcw_sov_approve_the_general_war_plan_desc:0 "The Supreme Defence Council merges the services, the railways and the Accord members' tasks into one general plan for the Supreme Ruler to sign. Once signed, mobilisation can be done in a month. Paris will learn of the document sooner or later."
 krcw_sov_far_east_front:0 "The Far East Front"
 krcw_sov_far_east_front_desc:0 "The Far East forces have their own command, depots and supply line, and no longer wait for the Trans-Siberian to bring everything from Europe."
 krcw_sov_manchurian_plan:0 "The Manchurian Operation Plan"
 krcw_sov_manchurian_plan_desc:0 "If Nanjing crosses the Amur, the Far East Front holds Blagoveshchensk, Khabarovsk and Vladivostok first, then counter-attacks from the Transbaikal."
 krcw_sov_the_far_east_command:0 "Establish the Far East Front Command"
 krcw_sov_the_far_east_command_desc:0 "Nanjing wants Outer Manchuria back; it is already in China's schoolbooks. The Far East district becomes a front with its own headquarters and depots at Chita. Officers do not want to go, so the posting carries double pay."
 krcw_sov_fortify_the_amur_towns:0 "Fortify Blagoveshchensk and Khabarovsk"
 krcw_sov_fortify_the_amur_towns_desc:0 "A second fortified line goes up along the Amur and the Ussuri, turning Blagoveshchensk and Khabarovsk into towns that can hold alone. The engineers must pour concrete into permafrost, and only in summer."
 krcw_sov_double_the_eastern_line:0 "Double the Eastern Trans-Siberian"
 krcw_sov_double_the_eastern_line_desc:0 "The single track from Chita to Vladivostok is the Far East Front's only supply line, in places within ten kilometres of the Chinese border. The railways lay a second track and a branch line north of the river."
 krcw_sov_the_pacific_fleet:0 "Expand the Pacific Fleet at Vladivostok"
 krcw_sov_the_pacific_fleet_desc:0 "The Vladivostok yards get new slips and the Pacific Fleet more submarines and torpedo boats, tasked with closing the straits between China and Japan."
 krcw_sov_the_far_east_air_army:0 "Form the Far East Air Army"
 krcw_sov_the_far_east_air_army_desc:0 "Forward airfields go up around Khabarovsk and in the Amur region for an air army of their own, tasked with bombing the Harbin and Qiqihar railway bridges before Nanjing's armies can cross."
 krcw_sov_call_up_the_transbaikal_host:0 "Call Up the Transbaikal Host"
 krcw_sov_call_up_the_transbaikal_host_desc:0 "The Transbaikal and Amur Cossack hosts return to war establishment, and the new Siberian settlers are enrolled as militia by village. They know every channel on the frontier."
 krcw_sov_the_manchurian_plan:0 "Draw Up the Manchurian Operation Plan"
 krcw_sov_the_manchurian_plan_desc:0 "The Far East Front's operation plan is approved: hold the three frontier towns, then counter-attack from the Transbaikal toward Harbin. It keeps a full army in the Far East all year, and the west is short by that many divisions."
 krcw_sov_foreign_directorate:0 "The Foreign Intelligence Directorate"
 krcw_sov_foreign_directorate_desc:0 "The Okhrana's émigré desk and the General Staff's intelligence department are merged into one directorate aimed at the Internationale."
 krcw_sov_the_foreign_directorate:0 "Found the Foreign Intelligence Directorate"
 krcw_sov_the_foreign_directorate_desc:0 "At home the Okhrana has informers enough; abroad it has a few old men in the émigré circles. The new directorate draws staff from the General Staff and the Foreign Ministry to build networks inside the Internationale's states."
 krcw_sov_shortwave_to_the_communes:0 "Expand Shortwave Broadcasts to the Communes"
 krcw_sov_shortwave_to_the_communes_desc:0 "Radio Moscow adds French, English and German programmes reporting the rationing, strikes and trials the commune papers leave out. They must be accurate enough for the workers over there to believe them."
 krcw_sov_fund_the_anti_commune_underground:0 "Fund the Anti-Commune Underground in France"
 krcw_sov_fund_the_anti_commune_underground_desc:0 "Through Swiss and Spanish middlemen, send money and presses to the Catholic groups, former officers and dispossessed owners inside France. The Commune's security service will trace the money sooner or later."
 krcw_sov_buy_western_designs:0 "Buy the Internationale's Engineers"
 krcw_sov_buy_western_designs_desc:0 "The directorate looks for disaffected engineers at Saclay and de Havilland and trades money and a way out for drawings. The Academy must check what is real."
 krcw_sov_screen_the_emigres:0 "Screen the Emigrés for Internationale Agents"
 krcw_sov_screen_the_emigres_desc:0 "The Internationale uses the same methods against us. The Okhrana vets every émigré who returns from the west and every foreign worker on the railways and in the ports; suspects are exiled east of the Yenisei."
 krcw_sov_economic_war_on_the_internationale:0 "Wage Economic War on the Internationale"
 krcw_sov_economic_war_on_the_internationale_desc:0 "The Accord stops selling oil, chrome and timber to the Internationale and undercuts the same goods on neutral markets where the Internationale earns its hard currency. The members lose foreign earnings too."
 krcw_sov_coordinate_the_hidden_front:0 "Coordinate the Hidden Front"
 krcw_sov_coordinate_the_hidden_front_desc:0 "Broadcasts, the underground, economic war and counter-intelligence are run from the directorate, which reports the Internationale's crisis to the Supreme Ruler every quarter. The aim is for the Internationale to break without a war."
 krcw_ma_mobilisation_plan:0 "The National Mobilisation Plan"
 krcw_ma_mobilisation_plan_desc:0 "Reservists are registered by county, and the active divisions fill within a fortnight of the order."
 krcw_ma_war_readiness:0 "First-Degree Readiness"
 krcw_ma_war_readiness_desc:0 "The army, the railways and civil defence are organised on the war plan, and the Accord's joint staff knows where every one of our divisions is."
 krcw_ma_the_national_mobilisation_plan:0 "Draw Up the National Mobilisation Plan"
 krcw_ma_the_national_mobilisation_plan_desc:0 "If war comes the first shot is fired on our soil, and the Russian reinforcements need a week to arrive. The staff registers reservists by county and cuts mobilisation to a fortnight."
 krcw_ma_organise_civil_defence:0 "Organise Civil Defence"
 krcw_ma_organise_civil_defence_desc:0 "The capital and the frontier towns build shelters, and schools and factories drill evacuations. The Internationale's bombers are an hour away."
 krcw_ma_stockpile_war_materiel:0 "Stockpile War Materiel"
 krcw_ma_stockpile_war_materiel_desc:0 "Three months of ammunition, fuel and grain are laid up to the Accord standard, in depots in the hills away from the border. The money is squeezed from an already tight budget."
 krcw_ma_open_the_airfields:0 "Open Our Airfields to the Accord Air Forces"
 krcw_ma_open_the_airfields_desc:0 "Russian air regiments may base on our fields, and the runways are lengthened for jets. Our pilots train under Russian instructors."
 krcw_ma_root_out_the_commune_networks:0 "Root Out the Commune Networks"
 krcw_ma_root_out_the_commune_networks_desc:0 "The gendarmes go through the factories, universities and railways for groups in touch with the Internationale, and captured radios go to the Accord's joint intelligence office. The more arrests, the angrier the street."
 krcw_ma_join_the_first_echelon:0 "Join the Accord's First Echelon"
 krcw_ma_join_the_first_echelon_desc:0 "Our best divisions join the Accord's first echelon, with exercises and assembly areas set by the joint staff at Minsk. Our generals give up part of their command over them."
 krcw_ma_first_degree_readiness:0 "Go to First-Degree Readiness"
 krcw_ma_first_degree_readiness_desc:0 "The army, railways and civil defence are organised on the war plan, and the frontier divisions move into field positions. Holding this readiness is expensive, and the villages will be short of hands."
 krcw_wgr_war_plan_1:0 "The Elbe War Plan"
 krcw_wgr_war_plan_1_desc:0 "The staff plans for a war with the DDR: who holds which stretch of the river, how long West Berlin lasts and when the French divisions arrive. The plan is revised every six months."
 krcw_wgr_war_plan_2:0 "The Elbe War Plan: Mobilisation System"
 krcw_wgr_war_plan_2_desc:0 "The reservists are registered by factory and street, and the railways hold rolling stock against the mobilisation timetable. Within forty-eight hours of the order the front divisions can be brought to strength."
 krcw_wgr_war_plan_3:0 "The Republic Stands Ready for War"
 krcw_wgr_war_plan_3_desc:0 "The war plan, the mobilisation system, civil defence and the war economy ordinance are all in place. The Republic can fight on the Elbe at short notice, and every peacetime budget gives way to it."
 krcw_wgr_intelligence_directorate:0 "The State Intelligence Directorate"
 krcw_wgr_intelligence_directorate_desc:0 "Zaisser's directorate runs reconnaissance of the DDR and counter-intelligence at home. It reports to the Politburo, not to the army."
 krcw_wgr_war_economy:0 "The War Economy Ordinance"
 krcw_wgr_war_economy_desc:0 "The Ruhr's arms works hold steel and spares against wartime quotas, and every civilian plant has a conversion plan. The works councils keep their vote on hours."
 krcw_wgr_sole_representation:0 "The Sole Representation Doctrine"
 krcw_wgr_sole_representation_desc:0 "The Republic declares itself the only lawful German state. Any country that recognises the Potsdam regime loses its relations with the Republic."
 krcw_ddr_offensive_plan_1:0 "The Elbe Offensive Plan"
 krcw_ddr_offensive_plan_1_desc:0 "The General Staff's plan assumes the offensive: cross the Elbe in the first week and cut West Berlin off from the Ruhr. It needs the Russian tank armies alongside."
 krcw_ddr_offensive_plan_2:0 "The Elbe Offensive Plan: Joint Protocol"
 krcw_ddr_offensive_plan_2_desc:0 "The East German divisions share one war plan and one set of codes with the Russian armies; the crossing sectors, assembly areas and ammunition stocks are allotted."
 krcw_ddr_offensive_plan_3:0 "The Republic Stands Ready for War"
 krcw_ddr_offensive_plan_3_desc:0 "The offensive plan, the rail timetable, air defence and the war economy law are in place. The General Staff reports that the Republic can begin crossing within a week of the order."
 krcw_ddr_military_intelligence:0 "The Military Intelligence Office"
 krcw_ddr_military_intelligence_desc:0 "The old General Staff's intelligence section is restored to its former establishment, covering reconnaissance of West Germany and security inside the army. The political police of the interior ministry resent its reach."
 krcw_ddr_war_economy:0 "The War Economy Law"
 krcw_ddr_war_economy_desc:0 "Every factory in Saxony and Thuringia has a conversion plan, and steel, fuel and rubber are stocked against wartime quotas. Rationing can be restored at any moment."
 krcw_ddr_national_mission:0 "The Mission of Reunification"
 krcw_ddr_national_mission_desc:0 "The Republic makes the reunification of Germany state policy: the land west of the Elbe is occupied German soil to be recovered under the black-white-red flag. Niekisch's men run the propaganda and the officer corps welcomes it."
 krcw_ddr_chamber_government:0 "The Chamber Cabinet"
 krcw_ddr_chamber_government_desc:0 "The cabinet is formed from the People's Chamber majority, and budgets and appointments need its vote. The Republic stays in the Accord, but the general's office no longer decides alone."
 krcw_wgr_draw_up_the_elbe_war_plan:0 "Draw Up the Elbe War Plan"
 krcw_wgr_draw_up_the_elbe_war_plan_desc:0 "The staff draws up a formal plan for a war with the DDR and Russia: each division's sector, how long West Berlin must hold and when the French relief arrives. Kahle leads the drafting; the finance ministry pays for every stockpile the plan names."
 krcw_wgr_found_the_intelligence_directorate:0 "Found the State Intelligence Directorate"
 krcw_wgr_found_the_intelligence_directorate_desc:0 "The intelligence services scattered through the party, the army and the police are merged into one directorate under Zaisser. The army wants it under the defence ministry; the Politburo keeps it for itself."
 krcw_wgr_rail_mobilisation_timetable:0 "Draw Up the Rail Mobilisation Timetable"
 krcw_wgr_rail_mobilisation_timetable_desc:0 "The railway union and the staff draw up the mobilisation timetable together: which wagons are held for troop trains, which marshalling yards run day and night, which bridges get repair stores in advance. The lines toward Hanover and Kassel are widened first."
 krcw_wgr_found_the_civil_defence_office:0 "Found the Civil Defence Office"
 krcw_wgr_found_the_civil_defence_office_desc:0 "The Civil Defence Office builds shelters in the Ruhr and Hamburg, organises fire brigades and evacuation drills, and every block elects a warden. The money comes out of the housing budget; the housing minister voted against."
 krcw_wgr_break_the_eastern_spy_rings:0 "Break the Eastern Spy Rings"
 krcw_wgr_break_the_eastern_spy_rings_desc:0 "The directorate goes after the DDR military intelligence office's contacts in the Ruhr works, the ports and the airfields. The arrests come within a single month, and some works councils protest that the wrong men were taken."
 krcw_wgr_build_networks_in_the_east:0 "Build Networks in the East"
 krcw_wgr_build_networks_in_the_east_desc:0 "The directorate recruits contacts at the Saxon rail junctions, the Leuna works and near the East German barracks, to gather intelligence in peacetime and cut communications in war. Every contact exposed tightens the DDR's border controls."
 krcw_wgr_register_the_reserves:0 "Register the Reserves"
 krcw_wgr_register_the_reserves_desc:0 "Every man who has served is entered on the reserve rolls by factory and street, to report to a named station when mobilisation is ordered. The works councils check the rolls, and plead for those who fail to turn up."
 krcw_wgr_pass_the_war_economy_ordinance:0 "Pass the War Economy Ordinance"
 krcw_wgr_pass_the_war_economy_ordinance_desc:0 "The ordinance fixes wartime quotas for the arms works, conversion plans for civilian plants and stocks of raw materials. The industrial federations must hold capacity in reserve, and export contracts shrink."
 krcw_wgr_sign_the_forward_defence_agreement:0 "Sign the Forward Defence Agreement"
 krcw_wgr_sign_the_forward_defence_agreement_desc:0 "The Republic signs an agreement with Paris: in war the Internationale's reinforcements go straight into the Elbe line under the German front command. France's condition is that the Republic's mobilisation plan be vetted by the joint staff at Mainz."
 krcw_wgr_declare_the_republic_ready:0 "Declare the Republic Ready for War"
 krcw_wgr_declare_the_republic_ready_desc:0 "The Defence Council reports to the Congress that the war plan, the mobilisation system, civil defence and the war economy ordinance are all in place. The Congress approves the report, and next year's defence budget with it."
 krcw_ddr_draw_up_the_elbe_offensive:0 "Draw Up the Elbe Offensive Plan"
 krcw_ddr_draw_up_the_elbe_offensive_desc:0 "Manstein leads the drafting of the offensive plan against West Germany: cross the Elbe in the first week, encircle West Berlin and cut the Ruhr off from Hamburg. It needs the Russian tank armies moving at the same time, and the general's office sends officers to Moscow to arrange it."
 krcw_ddr_restore_military_intelligence:0 "Restore the Military Intelligence Office"
 krcw_ddr_restore_military_intelligence_desc:0 "The old General Staff's intelligence section is restored to its former establishment for reconnaissance of West Germany and security in the army. The interior ministry's political police ask for a share; the general's office refuses."
 krcw_ddr_reichsbahn_war_timetable:0 "Put the Reichsbahn on a War Timetable"
 krcw_ddr_reichsbahn_war_timetable_desc:0 "The Reichsbahn draws up a war timetable to fit the offensive plan; the double track toward Magdeburg and Potsdam is restored first, and part of the rail handed to the Russians is asked back. Civilian freight stops during exercises."
 krcw_ddr_refound_the_air_raid_league:0 "Re-found the Air Raid Protection League"
 krcw_ddr_refound_the_air_raid_league_desc:0 "The air raid protection league is re-formed in Leipzig, Dresden and East Berlin to build shelters, train fire crews and name a warden for every block. Dues and unpaid labour are levied through the enterprises."
 krcw_ddr_hunt_the_western_agents:0 "Hunt the Western Agents"
 krcw_ddr_hunt_the_western_agents_desc:0 "The intelligence office and the political police go after the West German directorate's contacts at the rail junctions, the chemical works and near the barracks. The trials are public and the defendants' families are moved away from the border."
 krcw_ddr_set_up_the_west_department:0 "Set Up the West Department"
 krcw_ddr_set_up_the_west_department_desc:0 "The intelligence office sets up a West Department to run informers in Hamburg harbour, the Ruhr arms works and the French garrisons, gathering intelligence in peace and cutting communications in war. Moscow pays and reads every report."
 krcw_ddr_stockpile_crossing_equipment:0 "Stockpile the Elbe Crossing Equipment"
 krcw_ddr_stockpile_crossing_equipment_desc:0 "The engineers build depots near Magdeburg and Wittenberg for pontoons, assault boats and bridging vehicles, and practise crossings on the Elbe twice a year. The Russians supply the drawings; the reconstruction office allots the steel."
 krcw_ddr_pass_the_war_economy_law:0 "Pass the War Economy Law"
 krcw_ddr_pass_the_war_economy_law_desc:0 "The People's Chamber passes the war economy law: every factory in Saxony and Thuringia keeps a conversion plan, and steel, fuel and rubber are stocked against wartime quotas. Rationing can return at any time, and the shop shelves grow barer."
 krcw_ddr_sign_the_joint_operations_protocol:0 "Sign the Joint Operations Protocol"
 krcw_ddr_sign_the_joint_operations_protocol_desc:0 "The Republic signs a joint operations protocol with Moscow: in war the East German divisions join a Russian front, with crossing sectors, assembly areas and ammunition stocks allotted in advance. The price is that wartime command passes to a Russian marshal."
 krcw_ddr_declare_war_readiness:0 "Declare the Republic Ready for War"
 krcw_ddr_declare_war_readiness_desc:0 "The General Staff reports to the People's Chamber that the offensive plan, the rail timetable, air defence and the war economy law are in place, and that crossing can begin within a week of the order. The Chamber approves the report and next year's army estimates."
 krcw_eng_the_gap_barrier:0 "The Iceland Gap Barrier"
 krcw_eng_the_gap_barrier_desc:0 "Hydrophone lines, minefields and standing patrol groups now cover the waters between Greenland, Iceland and the Faroes. A Russian submarine leaving Murmansk has to get through this line first."
 krcw_eng_gap_asw:0 "The Iceland Gap Barrier"
 krcw_eng_rev_ma_p2_tt:0 "Accord crisis: +2"
 krcw_eng_rev_ma_p3_tt:0 "Accord crisis: +3"
 krcw_eng_the_war_book:0 "The War Book"
 krcw_eng_the_war_book_desc:0 "Every ministry and federation knows what it must do on the day the mobilisation order goes out: which ships to requisition, which works to switch over, which trains to hand to the army."
 krcw_eng_the_war_footing:0 "The War Footing"
 krcw_eng_the_war_footing_desc:0 "The War Book has been rehearsed, the shadow factories are built and the Ministry of Supply holds the conversion lists. The Union can go over to war production within weeks."
 krcw_eng_the_joint_war_plan:0 "The Anglo-French War Plan"
 krcw_eng_the_joint_war_plan_desc:0 "The Union and Commune staffs have signed a common war plan: the fleet holds the Atlantic and the North Sea, the expeditionary force goes to the Elbe, and the two air forces fight under one command."
 krcw_eng_draw_up_the_war_book:0 "Draw Up the War Book"
 krcw_eng_draw_up_the_war_book_desc:0 "The Staff College and the industrial federations write a War Book setting out, item by item, what every department does on mobilisation day. The defence committee asked for it; the unions complain that it hands shop scheduling to the army."
 krcw_eng_fortify_the_channel_coast:0 "Fortify the Channel and North Sea Coasts"
 krcw_eng_fortify_the_channel_coast_desc:0 "Build anti-aircraft positions and radar stations along the Kent, East Anglian and Yorkshire coasts against Russian bombers and airborne landings. Army and air force both back it; the local federations share the cost."
 krcw_eng_expand_the_expeditionary_army:0 "Expand the Continental Expeditionary Army"
 krcw_eng_expand_the_expeditionary_army_desc:0 "Expand the expeditionary corps into a field army able to fight beside the Commune on the Elbe, with more armoured brigades and motorised artillery. Paris has been pressing for it; the recruits come from the federations' young workers."
 krcw_eng_rebuild_fighter_command:0 "Rebuild Fighter Command"
 krcw_eng_rebuild_fighter_command_desc:0 "Put the scattered interceptor squadrons under one command, tie them into the radar chain and divide the sky into sectors. The aircraft federation wants more jet interceptor orders; the bomber lobby says the money is being taken from them."
 krcw_eng_the_civil_defence_corps:0 "Form the Civil Defence Corps"
 krcw_eng_the_civil_defence_corps_desc:0 "Every union branch raises rescue, fire and gas teams, and the city underground railways are fitted out as shelters. Veterans of the Home Guard do the training; workers drill two evenings a week after their shifts."
 krcw_eng_requisition_rail_and_ports:0 "Plan the Requisition of Rail and Ports"
 krcw_eng_requisition_rail_and_ports_desc:0 "The railwaymen and the dockers draw up the wartime timetable: which lines carry troops, which ports load, and in how many days the expeditionary army can be ashore at Calais. Peacetime freight gives way to the rehearsals."
 krcw_eng_home_fleet_war_stations:0 "Send the Home Fleet to War Stations"
 krcw_eng_home_fleet_war_stations_desc:0 "The Home Fleet rotates through Scapa Flow and Rosyth on its war dispositions and rehearses every winter the interception of a Russian fleet coming south from the Barents Sea. The Admiralty wants it; it burns a great deal of fuel and ammunition."
 krcw_eng_build_the_shadow_factories:0 "Build the Shadow Factories"
 krcw_eng_build_the_shadow_factories_desc:0 "Beside the civilian works of the Midlands and the North stand spare lines that need only new jigs to turn out shells and engines in war. The Ministry of Supply pays; the federations complain it uses up their expansion quota."
 krcw_eng_expand_the_codebreakers:0 "Expand the Code Bureau"
 krcw_eng_expand_the_codebreakers_desc:0 "The code bureau at Bletchley gains staff and computers and concentrates on Russian fleet and Accord staff traffic. Part of the Manchester machine's time is taken from the planners and given to it."
 krcw_eng_sign_the_joint_war_plan:0 "Sign the Anglo-French War Plan"
 krcw_eng_sign_the_joint_war_plan_desc:0 "The Union and Commune staffs sign a common war plan: the fleet takes the Atlantic and the North Sea, the expeditionary army goes to the Elbe, and the two air forces fight under one command. The Congress ratifies it, knowing London can no longer decide alone whether to go to war."
 krcw_eng_rev_armour:0 "Expeditionary Armoured Brigades"
 krcw_eng_rev_landdoc:0 "Expeditionary Doctrine"
 krcw_eng_rev_fighters:0 "Fighter Command"
 krcw_eng_rev_logistics:0 "Wartime Movement Plan"
 krcw_eng_rev_navdoc:0 "Home Fleet War Stations"
 krcw_eng_rev_codes:0 "The Code Bureau"
 krcw_eng_found_the_intelligence_bureau:0 "Found the Union Intelligence Bureau"
 krcw_eng_found_the_intelligence_bureau_desc:0 "Merge the files left by the old military intelligence, the seamen's union's port contacts and the Home Guard's security sections into one bureau answering to the Congress defence committee. The stewards fear it will one day be turned on the unions."
 krcw_eng_rev_ma_p4_tt:0 "Accord crisis: +4"
 krcw_eng_fund_the_russian_underground:0 "Fund the Russian Syndicalist Underground"
 krcw_eng_fund_the_russian_underground_desc:0 "Money, duplicators and shortwave sets go by the Finnish and Baltic smuggling lines to the underground syndicalist cells of Petrograd and the Donbass. The bureau wants it; if it is exposed Savinkov will call it a cause for war."
 krcw_eng_rev_ti_m4_tt:0 "Internationale crisis: -4"
 krcw_eng_root_out_the_dockside_networks:0 "Root Out the Accord's Dockside Networks"
 krcw_eng_root_out_the_dockside_networks_desc:0 "Accord agents use the Blackshirt remnant and some dockers' branches as cover to watch the fleet. The bureau and the dockers' union go through them together; the arrests will offend some old members."
 krcw_eng_broadcast_to_russia:0 "Open Shortwave Broadcasts to Russia"
 krcw_eng_broadcast_to_russia_desc:0 "Broadcast daily in Russian, Ukrainian and Finnish, reporting the strikes, shortages and exile sentences the Accord press leaves out. The broadcasters' federation makes the programmes; the transmitters' power comes out of the civilian allocation."
 krcw_eng_rev_ti_m3_tt:0 "Internationale crisis: -3"
 krcw_eng_vet_the_arms_works:0 "Vet Security in the Arms Works"
 krcw_eng_vet_the_arms_works_desc:0 "Technicians at Harwell, Derby and the Clyde yards are vetted and drawings are kept by classification. The engineers' union protests but accepts a vetting board with union members on it."
 krcw_eng_rev_ma_p5_tt:0 "Accord crisis: +5"
 krcw_eng_shipping_embargo_on_the_accord:0 "Impose a Shipping Embargo on the Accord"
 krcw_eng_shipping_embargo_on_the_accord_desc:0 "Union freighters and the insurance market refuse Accord cargoes, and neutral owners who carry for Moscow lose their London cover. The seamen's union backs it; Liverpool's freight earnings will fall."
 krcw_eng_rev_radio:0 "Broadcasts to Russia"
 krcw_ent_rev_threshold:0 "The Nuclear Threshold"
 krcw_ent_the_southern_bastion:0 "The Southern Bastion"
 krcw_ent_the_southern_bastion_desc:0 "The northern coast has its bases, the Citizen Military Forces their camps, and patrol aircraft cover the Coral Sea. Any great power that wants to land here must first fight a war it does not want."
 krcw_ent_draw_up_the_southern_defence_plan:0 "Draw Up the Southern Defence Plan"
 krcw_ent_draw_up_the_southern_defence_plan_desc:0 "The staff rewrites the defence plan on the assumption that no imperial fleet is coming: the northern coast and the Tasman lanes are to be held with Antipodean forces alone. Army and navy divide the budget by one plan for the first time."
 krcw_ent_fortify_the_northern_coast:0 "Fortify the Northern Coast"
 krcw_ent_fortify_the_northern_coast_desc:0 "Naval bases, fuel depots and airfields are enlarged in the northern ports and the Torres Strait is mined. Every ton of material for the Northern Territory has to be shipped up from the south."
 krcw_ent_expand_the_citizen_forces:0 "Expand the Citizen Military Forces"
 krcw_ent_expand_the_citizen_forces_desc:0 "The Citizen Military Forces grow into reserve divisions that can be mobilised in three months, with six months' training for every eighteen-year-old man. The unions oppose conscription and the graziers complain of lost hands at shearing."
 krcw_ent_maritime_patrol_squadrons:0 "Form the Maritime Patrol Squadrons"
 krcw_ent_maritime_patrol_squadrons_desc:0 "Long-range patrol aircraft fly from Darwin, Townsville and Auckland over the Coral and Tasman Seas. The air force asks for it; the aircraft have to be bought from the Constitutional Coalition."
 krcw_ent_the_munitions_board:0 "Set Up the Munitions Board"
 krcw_ent_the_munitions_board_desc:0 "The Munitions Board takes over the Lithgow and Maribyrnong arsenals and adds shell lines at Newcastle, so the Antipodes can keep themselves in ammunition if the sea lanes are cut. The steel comes out of civilian building."
 krcw_ent_proclaim_the_southern_bastion:0 "Proclaim the Southern Defence Zone"
 krcw_ent_proclaim_the_southern_bastion_desc:0 "The government publishes the limits of the defence zone, from the Timor Sea to the Tasman: any foreign fleet entering must give notice. Both blocs protest, and both send men to ask the Antipodes their terms."
 krcw_ent_rev_landdoc:0 "Citizen Forces Training"
 krcw_ent_rev_patrol:0 "Maritime Patrol Aircraft"
 krcw_fra2_1_t:0 "The Agenda on the Statutes"
 krcw_fra2_1_d:0 "The Paris congress of 1950 puts the Internationale's statutes on the formal agenda for the first time: is the body a government, a covenant, or an agreement among unions. The year before, Italy declined to carry out the Secretariat's resolution on Trieste, and the Secretariat found it had neither a sanction nor an expulsion clause in hand.\n\nThe presidium must first decide how to debate it. A drafting committee would grind the differences down among a few; the floor of the whole congress would make them public, and settle them more firmly."
 krcw_fra2_1.a:0 "Refer it to a drafting committee"
 krcw_fra2_1.b:0 "Put it to the whole congress"
 krcw_fra2_2_t:0 "The Composition of the Committee"
 krcw_fra2_2_d:0 "The drafting committee has nine seats, and how many go to the Secretariat and how many to the federations will decide which way the draft leans. Marty wants a Secretariat majority, because \"a draft needs a direction\"; Monatte wants the federations to elect the members, because \"the direction is precisely the question.\""
 krcw_fra2_2.a:0 "A Secretariat majority"
 krcw_fra2_2.b:0 "Half and half, the chair drawn by lot"
 krcw_fra2_2.c:0 "The federations elect every member"
 krcw_fra2_3_t:0 "Three Speeches on the Floor"
 krcw_fra2_3_d:0 "The debate runs three days in the open. Marty's speech is the shortest: the Second International dissolved in August 1914 because it had no centre that could decide. Frachon argues the middle: the Internationale should be a covenant, but with an enforcement clause written into it. Monatte speaks last, eighty years old and seated at the back, and asks only this: we spent thirty years driving the state out of the workshop, and now we would build a new state inside the Internationale?"
 krcw_fra2_3.a:0 "Marty is right: a revolution needs a centre"
 krcw_fra2_3.b:0 "Frachon's middle course is the safest"
 krcw_fra2_3.c:0 "Monatte has named the danger"
 krcw_fra2_4_t:0 "Article Four of the Draft"
 krcw_fra2_4_d0:0 "The quarrel narrows to Article Four, and the drafting has already told in the Secretariat's favour: the concessions the centralists won in the earlier rounds are built into the wording. The delegations must take a position on whether a resolution binds a member that refuses it."
 krcw_fra2_4_d1:0 "The quarrel narrows to Article Four, and the drafting has already leaned toward the federations: the concessions the communard side won make any binding clause hard to pass. The delegations must take a position on whether a resolution binds a member that refuses it."
 krcw_fra2_4_d2:0 "The quarrel narrows to Article Four of the draft, the enforcement clause. The delegations must take a position: shall a resolution bind a member that refuses to carry it out."
 krcw_fra2_4.a:0 "Write in sanctions and suspension of the vote"
 krcw_fra2_4.b:0 "Only \"members shall endeavour to comply\""
 krcw_fra2_4.c:0 "Strike Article Four, and the Secretariat with it"
 krcw_fra2_5_t:0 "The Small Members Object"
 krcw_fra2_5_d:0 "The moment the binding draft circulates, several small delegations enter reservations. The Iberian Federation says it will never accept that any centre's resolution binds it; the Italian delegation reminds the hall how Rome answered the last time the Secretariat resolved anything. How the small members respond is not for Paris to decide for them."
 krcw_fra2_5.a:0 "Hold the clause; let objectors record reservations"
 krcw_fra2_5.b:0 "Add a voluntary opt-out for the small members"
 krcw_fra2_6_t:0 "A Charter Without Teeth"
 krcw_fra2_6_d:0 "The soft wording passes the charter easily, and it binds nothing. Nanjing's delegate says it plainly in the corridor: a charter like this is no different from a news agency's. The question now is whether to give the soft charter machinery for members to cooperate by consent, such as arbitration."
 krcw_fra2_6.a:0 "Set up arbitration and cooperation between members"
 krcw_fra2_6.b:0 "Add nothing: a covenant is a covenant"
 krcw_fra2_7_t:0 "The Vote on the Statutes"
 krcw_fra2_7_d0:0 "The day before the vote the Iberian and Italian delegations announce that if the binding clause passes they will not recognise it as valid for their countries. The Secretariat side still holds a majority, and everyone in the hall knows a majority cannot buy compliance. The congress must now choose among three texts."
 krcw_fra2_7_d1:0 "After the drafting, the debate and the fight over Article Four, the Secretariat side holds the majority. The congress must now choose among three texts, and the Secretariat's is the likeliest to pass."
 krcw_fra2_7_d2:0 "After the drafting, the debate and the fight over Article Four, the federations have the upper hand, and even the motion to abolish the Secretariat has the votes. The congress must now choose among three texts."
 krcw_fra2_7_d3:0 "The drafting and the debate have given no side a clear majority. The covenant is the only text certain to pass; whether the others have the votes depends on the support won in the earlier rounds."
 krcw_fra2_7.a:0 "Adopt the binding statutes"
 krcw_fra2_7.b:0 "Adopt the covenant of the communes"
 krcw_fra2_7.c:0 "Adopt the federations' direct agreements"
 krcw_fra2_8_t:0 "The First Resolution Under the New Statutes"
 krcw_fra2_8_d0:0 "Under the new statutes the Secretariat's first resolution requires every member to adopt one standard for border checks. Marty's inspectors are already on their way, and Iberia and Italy are waiting to see. Paris must decide whether to enforce it outright or settle it in private first."
 krcw_fra2_8_d1:0 "The first resolution under the covenant concerns a common standard for border checks, and under the covenant it binds only those who agree. The Netherlands and Belgium have signed; West Germany wants the wording changed first. Paris must decide whether to go by the covenant or settle it privately first."
 krcw_fra2_8_d2:0 "With the Secretariat gone, the standard for border checks is agreed directly by the railway and customs federations. The first agreement takes effect among France, Belgium and the Netherlands while the other federations are still discussing it. Paris must decide whether to go by the statutes or settle it privately first."
 krcw_fra2_8.a:0 "Do it by the statutes"
 krcw_fra2_8.b:0 "Settle it with the members in private first"
 krcw_fra2_suspend_the_dissenters:0 "Suspend the Votes of Those Who Refuse"
 krcw_fra2_suspend_the_dissenters_desc:0 "Under the new statutes the Secretariat suspends the vote of any member refusing a resolution, Italy first. The Roman delegation stays in the hall without a vote. The other small members begin to take the Secretariat's resolutions seriously."
 krcw_fra2_negotiated_exemptions:0 "Negotiate Exemptions with the Small Members"
 krcw_fra2_negotiated_exemptions_desc:0 "The Secretariat negotiates separately with Iberia and Italy, listing borders and land as matters no resolution can bind. Resolutions now apply to those two only where they consent. Marty calls it a hole in the statutes; Frachon calls it the way to keep them alive."
 krcw_fra2_court_of_the_covenant:0 "Found the Court of the Covenant"
 krcw_fra2_court_of_the_covenant_desc:0 "The arbitration the congress agreed is set up: each member nominates a judge, disputes between members go to the court, and each national congress carries out its rulings by consent. The first case is the Rhine shipping dues between West Germany and the Netherlands."
 krcw_fra2_crash_programme:0 "The Atomic Crash Programme"
 krcw_fra2_crash_programme_desc:0 "The General Staff wants the first test done by the end of 1952. The Marcoule and Saclay laboratories work three shifts, and all civilian reactor work gives way."
 krcw_fra2_10_t:0 "Who Directs the Commissariat"
 krcw_fra2_10_d:0 "Once the Commissariat exists, the first question is to whom it answers. Joliot-Curie wants it under the National Research Council, with its results public in principle; the General Staff wants it under the Federal Defence Committee, because its first task is to build a bomb."
 krcw_fra2_10.a:0 "Under the Research Council"
 krcw_fra2_10.b:0 "Under the Federal Defence Committee"
 krcw_fra2_11_t:0 "Joliot-Curie's Conditions"
 krcw_fra2_11_d:0 "Joliot-Curie accepts the chair of the Commissariat on one condition: reactor and isotope research is published in the Internationale's journals, and only weapon design stays secret. His reason is that every member's physicists will need the data sooner or later."
 krcw_fra2_11.a:0 "Agreed: reactor work is published"
 krcw_fra2_11.b:0 "Circulate it to Secretariat members only"
 krcw_fra2_12_t:0 "The General Staff's Timetable"
 krcw_fra2_12_d:0 "General Tanguy gives the Defence Committee a timetable: the first test before the end of 1950, with Marcoule and Saclay on three shifts and civilian reactor work suspended. Joliot-Curie says that if the timetable passes he will consider resigning."
 krcw_fra2_12.a:0 "Approve the crash programme"
 krcw_fra2_12.b:0 "Keep to the ordinary schedule"
 krcw_fra2_13_t:0 "Where to Put the Range"
 krcw_fra2_13_d:0 "The Commissariat's survey party chooses Reggane in the Algerian Sahara: no town for hundreds of kilometres, existing caravan routes, and an airstrip that can be extended. The trouble is that the Algerian Labour Federation has never been consulted."
 krcw_fra2_13.a:0 "Ask the Algiers federation first"
 krcw_fra2_13.b:0 "Have the congress declare Reggane a federal reserve"
 krcw_fra2_14_t:0 "The Answer from Algiers"
 krcw_fra2_14_d0:0 "The Algiers federation executive agrees to the range on condition that local workers are hired at French rates. The federation will arrange the rerouting of the Tuareg grazing routes."
 krcw_fra2_14_d1:0 "The Algiers federation executive agrees to the range with a list: local workers hired at French rates, a road from Adrar to Reggane, and more Algerian seats in the federal congress. The last can be discussed later; the first three must be paid up front."
 krcw_fra2_14.a:0 "Accept the federation's terms"
 krcw_fra2_15_t:0 "The Touat Oases Petition"
 krcw_fra2_15_d:0 "After Reggane is declared a federal reserve, the oasis communes of Touat and Tidikelt petition Paris jointly: the range cuts two of their grazing routes and nobody asked them. The Algiers federation forwards the petition to the congress with a note that this will be remembered."
 krcw_fra2_15.a:0 "Compensate the oases with new routes and wells"
 krcw_fra2_15.b:0 "The range is a defence work and not for debate"
 krcw_fra2_16_t:0 "Preparing \"Louise\""
 krcw_fra2_16_d:0 "The Reggane tower is up and the parts of the first device are moving from Marseille to Algiers. The Commissariat must decide how to hold the test: invite scientists from the members and the neutrals to observe, or admit only the Defence Committee."
 krcw_fra2_16.a:0 "Invite observers"
 krcw_fra2_16.b:0 "A closed test"
 krcw_fra2_17_t:0 "The Size of the Arsenal"
 krcw_fra2_17_d0:0 "Joliot-Curie resigned when the crash programme passed and now speaks as an ordinary delegate, asking that the number of weapons be fixed in law. The General Staff's proposal is a target list covering everything from Warsaw to the Urals. The congress must set the size of the arsenal."
 krcw_fra2_17_d1:0 "Since Joliot-Curie's open letter was printed, dozens of federation assemblies have passed resolutions backing him: the weapons exist only to make others' weapons useless. The General Staff has still submitted a target list reaching the Urals. The congress must set the size of the arsenal."
 krcw_fra2_17_d2:0 "With the Reggane test a success, the congress must set the size of the arsenal. Joliot-Curie argues that a handful is enough, capped, with no first use; the General Staff submits a target list covering everything from Warsaw to the Urals."
 krcw_fra2_17.a:0 "A handful will do: minimum deterrence"
 krcw_fra2_17.b:0 "Cover everything to the Urals: a full deterrent"
 krcw_fra2_no_first_use_statute:0 "Write No First Use into Law"
 krcw_fra2_no_first_use_statute_desc:0 "The congress writes the cap on warheads and no first use into the federal charter, amendable only by two thirds. Joliot-Curie drafts the text, and under it the test data goes to every member of the Secretariat."
 krcw_fra2_targeting:0 "Nuclear Targeting Committee"
 krcw_fra2_target_committee:0 "Form the Nuclear Targeting Committee"
 krcw_fra2_target_committee_desc:0 "The General Staff forms a nuclear targeting committee to keep the target list and the delivery plans, reporting only to the Defence Committee. From now on the congress sees only its annual budget."
 krcw_fra2_18_t:0 "The First Report on the Arsenal"
 krcw_fra2_18_d0:0 "The Commissariat files its first annual report under the charter: the warhead count is within the cap and the test data has gone to the members' academies. The General Staff adds a reservation in an annex, arguing the cap is too low."
 krcw_fra2_18_d1:0 "The targeting committee files its first report: the target list now reaches the Urals, and the bomber force needs two more years of training. The figures are not shown to the congress, and several federation delegates demand to know where the money goes."
 krcw_fra2_18.a:0 "Report it to the congress in open session"
 krcw_fra2_18.b:0 "Report only to the Defence Committee"
 krcw_fra2_20_t:0 "Who Spends the Development Fund"
 krcw_fra2_20_d:0 "The first money from the Algerian Development Fund reaches Algiers. The Algerian Labour Federation wants its own congress to decide where it goes; the commissioner sent from Paris holds that it is federal money and should be allotted by him to the Planning Directorate's targets."
 krcw_fra2_20.a:0 "Give it to the Algiers federation congress"
 krcw_fra2_20.b:0 "The Paris commissioner allots it"
 krcw_fra2_21_t:0 "Electing the Federation Council"
 krcw_fra2_21_d:0 "To run the fund the Algiers federation must elect a council. The dockers' secretary Mohammed Ben Ali proposes seats by membership, which gives the Muslim workers a majority; the European-led railway and power unions want seats by industry, which keeps them half."
 krcw_fra2_21.a:0 "Seats by membership"
 krcw_fra2_21.b:0 "Seats by industry"
 krcw_fra2_22_t:0 "Two Wage Scales at Oran"
 krcw_fra2_22_d:0 "The commissioner puts the fund into Oran harbour by the targets, and the new quay pays two scales: one for European workers and a lower one for Muslim workers. The Muslim dockers stop work while the Europeans carry on."
 krcw_fra2_22.a:0 "One wage scale for all"
 krcw_fra2_22.b:0 "Send territorial companies to keep the port running"
 krcw_fra2_23_t:0 "The Language of the Schools"
 krcw_fra2_23_d:0 "The fund's second tranche is to build schools. The Algiers federation wants Arabic and Tamazight primary schools alongside the French ones; the Paris teachers' federation argues that only French teaching will let Algerian workers into the national federations."
 krcw_fra2_23.a:0 "Schools in all three languages"
 krcw_fra2_23.b:0 "French teaching throughout"
 krcw_fra2_24_t:0 "Clashes on the Oran Quays"
 krcw_fra2_24_d:0 "After the territorial companies enter the port the striking dockers and the European workers fight on the loading quays, and there are gunshot wounds. The Algiers federation meets in emergency session and demands the companies withdraw and the scales be unified."
 krcw_fra2_24.a:0 "Withdraw the companies and unify the scales"
 krcw_fra2_24.b:0 "Talk once the port is in order"
 krcw_fra2_25_t:0 "Ben Ali's Delegation"
 krcw_fra2_25_d0:0 "Ben Ali comes to Paris with a delegation, the Oran casualty list and the Touat oases petition in hand. He says Algeria's workers no longer believe Paris will make them equals, and two roads are left: real autonomy, or independence."
 krcw_fra2_25_d1:0 "Ben Ali comes to Paris with a delegation. For some years the Algiers federation has spent the development fund, and most of the questions of schools and wages have been settled. He asks that this practice be written into a statute: Algeria self-governing within the Commune, with its own congress and budget."
 krcw_fra2_25_d2:0 "Ben Ali comes to Paris with a delegation and asks the congress one question: is Algeria a part of the Commune or its colony. The delegation brings no scheme of its own and asks only for an answer."
 krcw_fra2_25.a:0 "Draft the Algiers Statute: autonomy within the Commune"
 krcw_fra2_25.b:0 "Recognise an independent sister republic"
 krcw_fra2_25.c:0 "The Algerian departments are France"
 krcw_fra2_26_t:0 "Electing the Algerian Congress"
 krcw_fra2_26_d:0 "Under the statute Algeria elects its own congress for the first time. Paris does not decide the result; the strength of each side depends on how the fund and the schools have gone in the past years."
 krcw_fra2_26.a:0 "Recognise the result"
 krcw_fra2_27_t:0 "The Garrison in Algeria"
 krcw_fra2_27_d:0 "Paris has refused autonomy and sends two more divisions to Algeria. The General Staff must decide how to man them: raise territorial companies locally, or rotate units from metropolitan France."
 krcw_fra2_27.a:0 "Raise territorial companies locally"
 krcw_fra2_27.b:0 "Rotate metropolitan units only"
 krcw_fra2_algerian_assembly:0 "Convene the Algerian Congress"
 krcw_fra2_algerian_assembly_desc:0 "The newly elected Algerian congress opens in Algiers and takes over the development fund, the schools and the local budget. Its seats in the federal congress are reapportioned by population."
 krcw_fra2_algerian_territorials:0 "Reorganise the Algerian Garrison"
 krcw_fra2_algerian_territorials_desc:0 "The Algerian garrison is reorganised on the General Staff's plan and a military road is built from Algiers to the Sahara. The troops can hold the ports and the range, and the Algiers federation records every patrol."
 krcw_eng2_coalfield_bitterness:0 "Bitterness in the Coalfields"
 krcw_eng2_coalfield_bitterness_desc:0 "The Home Guard moved coal past the striking pits, and the miners of South Wales and Lanark remember it. The pits meet their quotas, but nobody at a lodge meeting speaks up for London any more."
 krcw_eng2_pit_federations:0 "The Pit Federations"
 krcw_eng2_pit_federations_desc:0 "Each coalfield runs its own output and manning through its miners' federation, and the Clyde yards contract for coal and men directly with the Lanark field."
 krcw_eng2_coal_board:0 "The National Coal Board"
 krcw_eng2_coal_board_desc:0 "The National Coal Board sets every field's output from one plan, closes worked-out pits and moves the miners to new shafts and yards. The local federations keep only safety and welfare."
 krcw_eng2_army_of_the_elbe:0 "The Army of the Elbe"
 krcw_eng2_army_of_the_elbe_desc:0 "The defence review put the army first. Four standing divisions sit on the west bank of the Elbe, sharing supply lines and a command net with the Commune's troops."
 krcw_eng2_ocean_fleet:0 "The Ocean Fleet First"
 krcw_eng2_ocean_fleet_desc:0 "The defence review put the fleet first. Shipbuilding money goes to carriers and escorts, and the army keeps only home defence and one brigade that sails with the fleet."
 krcw_eng2_rhine_squadron:0 "The Amphibious Compromise"
 krcw_eng2_rhine_squadron_desc:0 "The Congress took the amendment: one armoured brigade stays on the Continent and the rest form an amphibious force that sails with the fleet. Neither service got the whole budget."
 krcw_eng2_10_t:0 "The Closure List"
 krcw_eng2_10_d:0 "The National Coal Plan lists a number of nearly worked-out pits in Lanark and South Wales for closure, their men to go to the new Nottinghamshire shafts and the Clyde yards. Arthur Horner of the miners' federation wants each coalfield to draw up its own list. The planners say the list would then never be finished and the new shafts would go short of men."
 krcw_eng2_10.a:0 "Let each coalfield's federation draw up its own list"
 krcw_eng2_10.b:0 "Close them by the plan"
 krcw_eng2_11_t:0 "The Lodge Ballots"
 krcw_eng2_11_d0:0 "The lodges of each coalfield spent several weeks balloting. Lanark agrees to close its worked-out pits on condition that the Clyde yards take its younger miners as apprentices; South Wales wants the closures spread over several years. Both conditions cost money and both need other federations to agree."
 krcw_eng2_11.a:0 "Accept Lanark's condition"
 krcw_eng2_11.b:0 "Spread the closures over several years"
 krcw_eng2_12_t:0 "The Lanark Miners Walk Out"
 krcw_eng2_12_d0:0 "The day after the list went up at the Lanark pit-heads every pit on it stopped work, and the South Wales lodges began sending money. The strike committee says the plan was written in London without a single miner in the room. The coal plan is falling behind, and the yards are running short of boiler coal."
 krcw_eng2_12.a:0 "Send Horner to negotiate"
 krcw_eng2_12.b:0 "Have the Home Guard move the coal"
 krcw_eng2_13_t:0 "The Clyde's Answer"
 krcw_eng2_13_d0:0 "Horner has an agreement with the Lanark strike committee: the pits close and the younger miners go to the Clyde yards as apprentices. Now the yard stewards must decide whether to take them; they fear apprentices will undercut the shipwrights' rates."
 krcw_eng2_13_d1:0 "The closures are now spread over several years, and the Lanark men will move to the Clyde yards in batches. The yard stewards must vote on it first; they fear apprentices will undercut the shipwrights' rates."
 krcw_eng2_13_d2:0 "Lanark's condition has gone to Glasgow: the yards are to take the young miners left over by the closures as apprentices. The yard stewards must vote on it first; they fear apprentices will undercut the shipwrights' rates."
 krcw_eng2_13.a:0 "Give the yards an extra batch of merchant hulls"
 krcw_eng2_13.b:0 "Ask for solidarity without new orders"
 krcw_eng2_14_t:0 "The Clyde Stops in Sympathy"
 krcw_eng2_14_d0:0 "In the week the Home Guard's lorries drove into the Lanark field to move coal, the stewards of the Clyde yards stopped the cranes in sympathy with the miners. The Tyne branches wired their support. The navy's escort programme is slipping, and the shipbuilding federation wants London to say where it stands."
 krcw_eng2_14_d1:0 "The yard stewards voted not to take the miners without a guarantee on rates. When the planners pressed the closure list, the Clyde yards stopped work. The navy's escort programme is slipping, and the shipbuilding federation wants London to say where it stands."
 krcw_eng2_14.a:0 "Concede: no pit closes until the yards have places"
 krcw_eng2_14.b:0 "Hold to the plan"
 krcw_eng2_tt_pit_federations:0 "Unlocks focus: §YThe Pit Federations Charter§!"
 krcw_eng2_tt_coal_board:0 "Unlocks focus: §YFound the National Coal Board§!"
 krcw_eng2_15_t:0 "The Coalfields and the Yards Agree"
 krcw_eng2_15_d0:0 "The Clyde stewards voted to take the Lanark miners provided the apprentices are paid at shipwrights' rates. The coalfield federations now propose that future closures and transfers be settled directly between each field and the yards, with London setting only the totals."
 krcw_eng2_15_d1:0 "London gave way: no pit on the list closes until the yards have places for its men. Once the yards were back at work, the coalfield federations proposed that future closures and transfers be settled directly between each field and the yards, with London setting only the totals."
 krcw_eng2_15.a:0 "Draft a charter for the pit federations"
 krcw_eng2_16_t:0 "The Coal Board Scheme"
 krcw_eng2_16_d0:0 "The strikes are over and Lanark and the Clyde are back at work on the plan's terms. The planners propose a National Coal Board to set every field's output, closures and transfers. The miners' federation sent nobody to the drafting; Horner says the miners remember who drove the lorries."
 krcw_eng2_16_d1:0 "The yard stoppage dragged on for months and ended on the plan's terms. The planners propose a National Coal Board to set every field's output, closures and transfers, leaving the miners' federation only safety and welfare."
 krcw_eng2_16.a:0 "Send the scheme to the Congress"
 krcw_eng2_17_t:0 "The Pit Federations Charter"
 krcw_eng2_17_d0:0 "The Congress passed the charter: each coalfield manages its own output and men through its federation, and the yards contract directly with the fields. Horner said after the vote that it was the only thing the miners would sign after the Home Guard went into Lanark. The National Coal Plan is left with only the totals."
 krcw_eng2_17_d1:0 "The Congress passed the charter: each coalfield manages its own output and men through its federation, and the yards contract directly with the fields. The National Coal Plan is left with only the totals, and the planners complain they will find it hard to move men again."
 krcw_eng2_17.a:0 "The Clyde and Lanark sign a long contract"
 krcw_eng2_17.b:0 "Each field sets its own prices"
 krcw_eng2_18_t:0 "The National Coal Board Is Founded"
 krcw_eng2_18_d0:0 "The National Coal Board opens its offices in Doncaster and takes over output, closures and transfers in every field. The Lanark and South Wales lodges refused to send anyone to the opening. The planners must decide whether the miners' federation gets seats on the Board."
 krcw_eng2_18_d1:0 "The National Coal Board opens its offices in Doncaster and takes over output, closures and transfers in every field. The miners' federation wants its own seats on the Board; the planners think that would turn every closure into a negotiation."
 krcw_eng2_18.a:0 "Give the miners' federation seats on the Board"
 krcw_eng2_18.b:0 "The Board answers only to the planning ministry"
 krcw_eng2_19_t:0 "The Miners' Charter Is Signed"
 krcw_eng2_19_d0:0 "The Miners' Charter has been written into the pit federations' charter: an eight-hour day, safety inspectors elected by the men, and no closure without a vote of the field. Horner signed it in Cardiff, and the Lanark strike committee sent its people to watch."
 krcw_eng2_19_d1:0 "The Miners' Charter is signed by the Coal Board and the miners' federation: an eight-hour day and safety inspectors elected by the men. The Lanark lodges stayed away; they say nobody has yet apologised for the Home Guard moving coal."
 krcw_eng2_19_d2:0 "The Miners' Charter is signed by the Coal Board and the miners' federation: an eight-hour day, safety inspectors elected by the men, and a year's notice of any closure. Horner signed it in Doncaster, and the Board wrote it into the next output plan."
 krcw_eng2_19.a:0 "Have the charter read at every pit-head"
 krcw_eng2_19.b:0 "Tie the charter to the output targets"
 krcw_eng_the_pit_federations_charter:0 "The Pit Federations Charter"
 krcw_eng_the_pit_federations_charter_desc:0 "Extend the Clyde and Lanark settlement to every field: each coalfield runs its own output and men through its federation, and the yards and works contract with the fields directly. The miners back it; the planners lose the power to move men."
 krcw_eng_found_the_coal_board:0 "Found the National Coal Board"
 krcw_eng_found_the_coal_board_desc:0 "Set up a National Coal Board to decide output, closures and transfers in every field and allocate coal to the yards and works by plan. The planners want it; the coalfield federations are left with safety and welfare."
 krcw_eng2_30_t:0 "The Defence Review"
 krcw_eng2_30_d:0 "With the continental commitment passed, the Congress wants a defence review: the budget will only put one service first. The Admiralty wants carriers and escorts; the War Office wants four standing divisions on the Elbe. Both cases must be put in writing before the Congress votes."
 krcw_eng2_30.a:0 "Let the Admiralty write the paper"
 krcw_eng2_30.b:0 "Let the War Office write the paper"
 krcw_eng2_31_t:0 "The Admiralty Paper"
 krcw_eng2_31_d:0 "The Admiralty paper argues that Britain lives by the Atlantic lanes: without escorts the grain from Canada and the steel from the Syndicates cannot cross. It asks that shipbuilding come first and the army keep only home defence. The War Office records its dissent in an annex."
 krcw_eng2_31.a:0 "Put it to the Congress"
 krcw_eng2_32_t:0 "The War Office Paper"
 krcw_eng2_32_d:0 "The War Office paper argues that the next war will be fought on the Elbe: if West Germany falls, no fleet will stop the Accord's tanks reaching Calais. It asks for four standing divisions on the west bank of the Elbe, sharing supply lines with the Commune's troops. The Admiralty records its dissent in an annex."
 krcw_eng2_32.a:0 "Put it to the Congress"
 krcw_eng2_33_t:0 "The Congress Votes on the Review"
 krcw_eng2_33_d:0 "The delegates vote by region and trade. The shipbuilding and dock delegates back the fleet; most of the coal and steel men back the army. An amendment offers a compromise: one armoured brigade on the Continent and the rest as an amphibious force. The result waits on the count from every group."
 krcw_eng2_33.a:0 "Await the count"
 krcw_eng2_tt_review_fleet:0 "Unlocks focus: §YExpand the Ocean Fleet§!"
 krcw_eng2_tt_review_army:0 "Unlocks focus: §YRaise the Army of the Elbe§!"
 krcw_eng2_tt_review_amph:0 "Unlocks focus: §YRaise the Amphibious Force§!"
 krcw_eng2_34_t:0 "The Fleet Comes First"
 krcw_eng2_34_d:0 "The Congress carried the fleet-first case by a majority. Money for carriers and escorts is released first, and the Elbe garrison stays at its present size. The War Office delegates did not walk out, but recorded their reservations after the vote."
 krcw_eng2_34.a:0 "Approve the shipbuilding budget"
 krcw_eng2_35_t:0 "The Army Comes First"
 krcw_eng2_35_d:0 "The Congress carried the army-first case by a majority. Four standing divisions are to move to the west bank of the Elbe within the year, and the shipbuilding programme slips by a year. The Admiralty delegates said after the vote that the Commune's navy would have to cover the escort gap."
 krcw_eng2_35.a:0 "Approve the garrison plan"
 krcw_eng2_36_t:0 "The Amendment Carries"
 krcw_eng2_36_d:0 "Neither case won a majority, and the Congress carried the compromise amendment instead. One armoured brigade stays on the Continent and the rest form an amphibious force that sails with the fleet. Each service got only part of the budget."
 krcw_eng2_36.a:0 "Approve the amendment"
 krcw_eng2_37_t:0 "The Review in Practice"
 krcw_eng2_37_d0:0 "The first escorts are in the water and a carrier keel is laid on the Clyde. The merchant ships on the Atlantic run have full escort groups for the first time."
 krcw_eng2_37_d1:0 "The four standing divisions are in their camps on the west bank of the Elbe and have begun joint exercises with the Commune's troops. Their supply runs through Hamburg."
 krcw_eng2_37_d2:0 "The armoured brigade is on the Continent, and the amphibious force has carried out its first exercise at sea with the fleet. Both services complain of short budgets, but both can take the field."
 krcw_eng2_37.a:0 "Carry on"
 krcw_eng_expand_the_ocean_fleet:0 "Expand the Ocean Fleet"
 krcw_eng_expand_the_ocean_fleet_desc:0 "As the defence review decided, shipbuilding money goes first to carriers and escorts. The Clyde and Tyne yards take the orders, and the army keeps only home defence."
 krcw_eng_raise_the_army_of_the_elbe:0 "Raise the Army of the Elbe"
 krcw_eng_raise_the_army_of_the_elbe_desc:0 "As the defence review decided, four standing divisions go to the west bank of the Elbe, sharing supply lines and a command net with the Commune's troops. The shipbuilding programme waits."
 krcw_eng_raise_the_amphibious_force:0 "Raise the Amphibious Force"
 krcw_eng_raise_the_amphibious_force_desc:0 "As the amendment decided, one armoured brigade stays on the Continent and the rest form an amphibious force that sails with the fleet. Each service gets part of the budget."
 krcw_eng2_50_t:0 "Forming the Executive"
 krcw_eng2_50_d0:0 "The Congress chose the administrators' road: the secretariat and the ministries run the economy. The stewards and the guild men are still in the Congress and hold a good many union votes. The new executive must decide whether to give them seats."
 krcw_eng2_50_d1:0 "The Congress chose the shop stewards' road: power goes to the works congresses. The administrators and the guild men are still in the Congress and hold several ministries and many craft unions. The new executive must decide whether to give them seats."
 krcw_eng2_50_d2:0 "The Congress chose the guild socialists' road: each trade manages itself through its guild. The administrators and the stewards are still in the Congress and hold a good many union votes. The new executive must decide whether to give them seats."
 krcw_eng2_50.a:0 "Bring the losing currents into the executive"
 krcw_eng2_50.b:0 "Let the winning current govern alone"
 krcw_eng2_51_t:0 "A Shared Executive"
 krcw_eng2_51_d:0 "The executive offered each losing current two seats. They want a veto on wages and housing; the winners will offer only a consultative voice. Each current must go back to its unions before it answers."
 krcw_eng2_51.a:0 "Await their answer"
 krcw_eng2_52_t:0 "Governing Alone"
 krcw_eng2_52_d:0 "The winning current formed an executive of its own people. The two losing currents have formed a joint opposition in the Congress and begun canvassing for delegates in the unions. The executive must decide how to treat their papers and meetings."
 krcw_eng2_52.a:0 "Leave them be and argue it out in the Congress"
 krcw_eng2_52.b:0 "Restrict their papers"
 krcw_eng2_53_t:0 "The Losing Currents Decide"
 krcw_eng2_53_d:0 "The two losing currents meet in their own unions to decide whether to accept the executive's terms or stay in opposition. What they decide will shape how the Congress works for the next few years."
 krcw_eng2_53.a:0 "Await the outcome"
 krcw_eng2_tt_road_united:0 "Unlocks focus: §YForm a United Union Executive§!"
 krcw_eng2_tt_road_split:0 "Unlocks focus: §YGovern by the Majority§!"
 krcw_eng2_54_t:0 "The Currents Accept"
 krcw_eng2_54_d:0 "The losing currents took their seats on the executive, on condition that wages and housing are voted item by item in the Congress. The Congress is back in full session, and no current has walked out."
 krcw_eng2_54.a:0 "Agreed"
 krcw_eng2_55_t:0 "The Opposition Stays Out"
 krcw_eng2_55_d:0 "The losing currents turned down the executive's terms and stayed in opposition. They have won delegate elections in several big unions and begun blocking bills in the Congress."
 krcw_eng2_55.a:0 "The majority governs on"
 krcw_eng2_56_t:0 "The Congress Settles"
 krcw_eng2_56_d0:0 "The united executive has run for a year. Wages and housing go through the Congress item by item, slowly, but no current has walked out and the unions have not struck again."
 krcw_eng2_56_d1:0 "The majority has governed alone for a year. Its bills are often blocked in the Congress, but the executive has pushed its main plans through on its majority. The opposition has won a few more unions at the next elections."
 krcw_eng2_56.a:0 "Carry on"
 krcw_eng_form_a_united_union_executive:0 "Form a United Union Executive"
 krcw_eng_form_a_united_union_executive_desc:0 "Bring the two losing currents formally into the executive, with wages and housing voted item by item in the Congress. The unions all support it; the executive will decide more slowly."
 krcw_eng_govern_by_the_majority:0 "Govern by the Majority"
 krcw_eng_govern_by_the_majority_desc:0 "The winning current pushes its main plans through on its majority without waiting for the opposition. The executive works faster; the opposition in the unions grows louder."
 krcw_wgr2_party_discipline:0 "Party Discipline"
 krcw_wgr2_party_discipline_desc:0 "The party reasserts its lead over the unions and the works councils, and resolutions run from the top down. The Secretariat moves faster; the price is less argument on the shop floor, and some old organisers leave the party."
 krcw_wgr2_council_democracy:0 "The Shop Floor Decides"
 krcw_wgr2_council_democracy_desc:0 "The works councils keep their vote on hours, quotas and foremen, and the party must win its majority inside them. Morale in the plants is high, but on questions like the defence estimates the voting drags on."
 krcw_wgr2_corridor_regime:0 "The Corridor Reciprocity Regime"
 krcw_wgr2_corridor_regime_desc:0 "The access authority answers every East German obstruction in kind: a train of ours held means a DDR freight train held in the West. It keeps the corridor working and keeps Berlin permanently tense."
 krcw_ddr2_inner_trade:0 "The Leipzig Trade"
 krcw_ddr2_inner_trade_desc:0 "Through the Leipzig Fair and transit trade the Republic sells lignite, chemicals and optics to West Germany for machine tools and hard currency. The general's office uses the money to subsidise food; some in the Accord call it trading with the enemy."
 krcw_ddr2_junker_officers:0 "The Junker Officer Corps"
 krcw_ddr2_junker_officers_desc:0 "The estate owners east of the Elbe keep their land, and in exchange their sons fill the officer corps and the General Staff again. The army is steadier; the farmhands who were promised land feel the revolution passed them by."
 krcw_ddr2_land_reform:0 "The Division of the Estates"
 krcw_ddr2_land_reform_desc:0 "The Junkers' great estates are seized and shared among farmhands and refugees from the east. The regime wins the countryside; the old officer corps turns away from it, and grain output falls for the first few years."
 krcw_ddr2_blockade_command:0 "The Blockade Command"
 krcw_ddr2_blockade_command_desc:0 "The Reichsbahn, the river barges and the border troops come under one command that can tighten or ease the routes to West Berlin at will. It reports to the general's office, and Moscow approves each tightening."
 krcw_wgr2_1_t:0 "The Ruhr's First Full Year"
 krcw_wgr2_1_d:0 "The Ruhr's furnaces and pits are back to pre-war output, and the Secretariat must set a direction for the steel and coal. The union delegates want housing and consumer goods first; the staff and Kahle want the capacity held for the Army of the Rhine and the Elbe line. These are two different roads."
 krcw_wgr2_1.a:0 "Housing, consumer goods and civilian machines first"
 krcw_wgr2_1.b:0 "Hold the steel and coal for the Army of the Rhine"
 krcw_wgr2_2_t:0 "The Numbers on the Housing List"
 krcw_wgr2_2_d:0 "With housing first, the regional planning office brings the numbers: two hundred thousand households in the Ruhr still live in wartime huts and cellars. The office wants to concentrate the money on a few model new towns; the old union men want the worst huts pulled down first."
 krcw_wgr2_2.a:0 "Concentrate on model new towns"
 krcw_wgr2_2.b:0 "Clear the worst huts first"
 krcw_wgr2_3_t:0 "Casting the Guns for the Army of the Rhine"
 krcw_wgr2_3_d:0 "The Ruhr's arms works run to wartime quotas, and the first guns and armour steel go to the Rhine. Paris notes the West German output; the joint staff sends a proposal to cooperate, but asks to see the Republic's production plan. How Paris answers is for Paris to decide."
 krcw_wgr2_3.a:0 "Accept cooperation and show the plan"
 krcw_wgr2_3.b:0 "Build our own, show nothing"
 krcw_wgr2_4_t:0 "The Vote of the Works Councils"
 krcw_wgr2_4_d:0 "The Ruhr line must pass a congress of the works councils of the industrial federations. The party wants the congress to approve the Secretariat's plan and accept the party's lead; some old organisers want to use the congress to keep more decisions on the shop floor. How the delegates vote is for them to decide."
 krcw_wgr2_4.a:0 "Wait for the result"
 krcw_wgr2_5_t:0 "The Congress Backs the Secretariat"
 krcw_wgr2_5_d:0 "The congress passes the Secretariat's plan by a majority and confirms the party's lead in the federations. The Secretariat can push the Ruhr plan through faster, and must decide how to treat the old organisers who voted against."
 krcw_wgr2_5.a:0 "Write discipline into the federation statutes"
 krcw_wgr2_5.b:0 "Keep the opposition inside the federations"
 krcw_wgr2_6_t:0 "The Congress Keeps Power on the Shop Floor"
 krcw_wgr2_6_d:0 "The congress rejects direct party leadership and confirms the shop floor's vote over hours, quotas and foremen. Morale in the plants is high; the Secretariat fears that decisions like the defence estimates will now be delayed without end."
 krcw_wgr2_6.a:0 "Accept shop-floor democracy and slow the plan"
 krcw_wgr2_6.b:0 "Keep a fast track for wartime decisions"
 krcw_wgr2_7_t:0 "What the Ruhr Built"
 krcw_wgr2_7_d0:0 "After some years the Ruhr's output has become new housing, trams and refrigerators, and the Republic's workers live far better than those across the Elbe. It is the best propaganda against the DDR, though the Army of the Rhine stays a step behind in equipment."
 krcw_wgr2_7_d1:0 "After some years the Ruhr's steel and coal have become guns, armour and ammunition, and the Army of the Rhine can hold the Elbe on its own. The workers' housing has waited, and the party has held the matter down by discipline."
 krcw_wgr2_7_d2:0 "The Ruhr's direction is settled, and the output of the district has shaped what the Republic looks like these years."
 krcw_wgr2_7.a:0 "The Ruhr is the backbone of the Republic"
 krcw_wgr2_20_t:0 "The First Obstruction on the Corridor"
 krcw_wgr2_20_d:0 "East German guards hold a coal train bound for West Berlin at the Helmstedt checkpoint, citing faulty papers. The access authority must set a rule for such cases: answer in kind, or hand every obstruction to Paris. It decides how the corridor will be worked for years to come."
 krcw_wgr2_20.a:0 "Answer in kind against DDR freight"
 krcw_wgr2_20.b:0 "Put the corridor in Paris's hands"
 krcw_wgr2_21_t:0 "A Train for a Train"
 krcw_wgr2_21_d:0 "Reciprocity is in motion: a train of ours held, a DDR freight train held in the West. The corridor stays just open, but held wagons pile up in the yards on both sides and Berlin grows tenser."
 krcw_wgr2_21.a:0 "Keep answering, give nothing"
 krcw_wgr2_21.b:0 "Quietly negotiate a traffic code with the DDR"
 krcw_wgr2_22_t:0 "Paris Takes the Corridor"
 krcw_wgr2_22_d:0 "The Internationale takes over the West Berlin corridor; French diplomats deal with the DDR authorities at Helmstedt and French transports go on standby. How Paris handles it is for Paris to decide, and the Republic can only wait."
 krcw_wgr2_22.a:0 "Paris holds firm; the corridor is the Internationale's"
 krcw_wgr2_22.b:0 "Paris negotiates a traffic code"
 krcw_wgr2_23_t:0 "The DDR Tightens the Routes"
 krcw_wgr2_23_d:0 "The DDR's reaction comes through. The general's office will either tighten the rail and road to West Berlin to press the Accord, or hold the present state of things and avoid the brink. The step is Potsdam's and Moscow's to take, not the Republic's."
 krcw_wgr2_23.a:0 "Wait for word from Berlin"
 krcw_wgr2_24_t:0 "The Routes Narrow Again"
 krcw_wgr2_24_d:0 "The DDR cuts freight to West Berlin to the barest minimum, and the city's fuel and flour begin to run low. The Republic must choose between escalation and endurance: expand the airlift and confront openly, or cut West Berlin's consumption and ride the crisis out."
 krcw_wgr2_24.a:0 "Expand the airlift and confront openly"
 krcw_wgr2_24.b:0 "Cut consumption and ride it out"
 krcw_wgr2_25_t:0 "The Corridor Held"
 krcw_wgr2_25_d:0 "The DDR tightens no further, and the corridor keeps a tense sort of flow. The Republic can use the lull to top up West Berlin's stocks, or to turn the corridor rules into a written agreement in black and white."
 krcw_wgr2_25.a:0 "Top up West Berlin's stocks"
 krcw_wgr2_25.b:0 "Make the traffic rules a written agreement"
 krcw_wgr2_26_t:0 "Who Pays for West Berlin"
 krcw_wgr2_26_d:0 "The contest over the corridor comes to its close, and the bill is laid out: the standing airlift, the subsidised freight and the city's stocks all cost money. The Secretariat must decide whether the Republic carries it alone, keeping West Berlin in its own hand, or asks the Internationale to share it as the whole bloc's outpost."
 krcw_wgr2_26.a:0 "Carry it alone and keep West Berlin in hand"
 krcw_wgr2_26.b:0 "Share it with the Internationale as the bloc's outpost"
 krcw_wgr2_27_t:0 "The Rule on the Corridor"
 krcw_wgr2_27_d0:0 "The contest ends in a standing airlift and open confrontation; West Berlin lives, but Berlin has become a place where a shot could go off at any time, and the price the Accord pays for the city is always being counted."
 krcw_wgr2_27_d1:0 "The contest ends in a written traffic agreement; the corridor has rules in black and white and Berlin eases a little. The DDR keeps to them, though everyone knows it can tear the paper up whenever it likes."
 krcw_wgr2_27_d2:0 "The rule on the corridor is settled, and West Berlin still hangs in the middle of East German land, living by it."
 krcw_wgr2_27.a:0 "West Berlin will stay on the Republic's side"
 krcw_ddr2_1_t:0 "The Wedge of West Berlin"
 krcw_ddr2_1_d:0 "West Berlin sits wedged in the middle of the Republic's land, reached from the West by a railway, a road and a few barge channels. The general's office looks at those lines on the map and asks whether they can be a lever against the Accord. Some call the lines a weapon; others point out that the Republic earns its hard currency from the same West through the Leipzig Fair and transit trade."
 krcw_ddr2_1.a:0 "Trade first, and earn the hard currency"
 krcw_ddr2_1.b:0 "Make the routes a lever against the Accord"
 krcw_ddr2_2_t:0 "The Leipzig Ledger"
 krcw_ddr2_2_d:0 "With the transit trade running, the account is clear: West Germany gives machine tools and hard currency for the Republic's lignite, chemicals and Jena optics. The general's office uses the money to subsidise food and steady prices in the towns, but Moscow asks why the enemy's factories should have our chemicals."
 krcw_ddr2_2.a:0 "Widen the trade and keep it open"
 krcw_ddr2_2.b:0 "Sell only lignite, hold back strategic goods"
 krcw_ddr2_3_t:0 "A Hand on the Valve"
 krcw_ddr2_3_d:0 "The general's office decides to treat the routes as a lever. The Reichsbahn, the river barges and the border troops are drawn into one command that can tighten or ease the way to West Berlin at will. Hammerstein warns that the last blockade bought an Accord airlift and a crisis that nearly ran out of hand."
 krcw_ddr2_3.a:0 "Set up the blockade command"
 krcw_ddr2_3.b:0 "Keep only a plan that can tighten at short notice"
 krcw_ddr2_4_t:0 "How Moscow Sees It"
 krcw_ddr2_4_d:0 "Whichever road it takes, Berlin must ask Moscow first. An envoy carries the Republic's intentions to Savinkov's men: tighten the routes to West Berlin and use the crisis as a weapon, or hold the present state of things and give the Accord no pretext for war. Moscow's answer is Moscow's to decide."
 krcw_ddr2_4.a:0 "Wait for Moscow's answer"
 krcw_ddr2_5_t:0 "Moscow Gives the Nod"
 krcw_ddr2_5_d:0 "Moscow agrees to use the routes to West Berlin as a means of pressure, on condition that each tightening is reported in advance and that the decision for war stays in Moscow. The blockade command begins to cut freight in stages, and the pressure on Berlin climbs."
 krcw_ddr2_5.a:0 "Tighten in stages to force a concession"
 krcw_ddr2_5.b:0 "Tighten only enough to bargain"
 krcw_ddr2_6_t:0 "Moscow Holds Berlin Back"
 krcw_ddr2_6_d:0 "Moscow will not have the Berlin routes used as a weapon now: the Ohio ceasefire line is tense enough, and Moscow will not open another front over West Berlin. The general's office must put the blockade away and find another way to manage the problem of the city."
 krcw_ddr2_6.a:0 "Obey Moscow and tighten border controls instead"
 krcw_ddr2_6.b:0 "Obey in word, keep the blockade plan in reserve"
 krcw_ddr2_7_t:0 "What Became of West Berlin"
 krcw_ddr2_7_d0:0 "The Republic holds the routes to West Berlin in its hand and tightens them time and again to force the Accord to give way on the corridor. Berlin has become a place where a shot could go off at any time, and Moscow's vote weighs on the general's office throughout."
 krcw_ddr2_7_d1:0 "The Republic has not made the routes a weapon but earns West German hard currency through the Leipzig trade and subsidises food in the towns. Some in the Accord call it collaboration with the enemy, but prices in the Republic hold steady."
 krcw_ddr2_7_d2:0 "The contest over West Berlin is settled, and the opening and closing of the routes is from now on a card in the hands of Berlin and Moscow."
 krcw_ddr2_7.a:0 "The fate of West Berlin is in the East's hand"
 krcw_ddr2_20_t:0 "Who Is to Be an Officer"
 krcw_ddr2_20_d:0 "The army is to be rebuilt, and the first question is where the officers come from. The sons of the estate owners east of the Elbe have been officers for generations, and the General Staff wants them back; the farmhands and refugees who were given land ask whose Republic this is. The general's office must choose between the loyalty of the Junkers and the loyalty of the countryside."
 krcw_ddr2_20.a:0 "Fill the officer corps with the Junkers' sons"
 krcw_ddr2_20.b:0 "Seize the estates for farmhands and refugees"
 krcw_ddr2_21_t:0 "The Junkers Return to the Staff"
 krcw_ddr2_21_d:0 "The estate owners keep their land, and their sons fill the officer corps and the General Staff again. The army is steadier and trains faster, but the farmhands with their little plots feel the revolution passed them by, and the Internationale's broadcasts make the most of it."
 krcw_ddr2_21.a:0 "Buy their loyalty outright with bonds"
 krcw_ddr2_21.b:0 "Give the farmhands a little land too, placate both"
 krcw_ddr2_22_t:0 "The Estates Are Divided"
 krcw_ddr2_22_d:0 "The Junkers' great estates are seized and shared among farmhands and refugees from the east. The countryside stands with the regime for the first time, and the Internationale's broadcasts lose their audience in the east. The price is an old officer corps that turns away, and grain output that falls for the first few years."
 krcw_ddr2_22.a:0 "Raise new officers from farmhands and sergeants"
 krcw_ddr2_22.b:0 "Keep the old officers, take only their land"
 krcw_ddr2_23_t:0 "The Mood of the Officer Corps"
 krcw_ddr2_23_d:0 "With the land settled, the mood of the officer corps comes up. A number of younger officers are unhappy with what the regime has done and begin to talk among themselves in the barracks. Whether they oppose openly or accept the fait accompli in private is for the officer corps to decide, not the general's office."
 krcw_ddr2_23.a:0 "Wait for word from the barracks"
 krcw_ddr2_24_t:0 "The Talk in the Barracks"
 krcw_ddr2_24_d:0 "In a few regiments at Potsdam and Magdeburg the younger officers' discontent has grown into a petition. The general's office must choose: have the military intelligence office root out the ringleaders, or bring them to Potsdam and strike a new bargain face to face."
 krcw_ddr2_24.a:0 "Root out the ringleaders"
 krcw_ddr2_24.b:0 "Bring them to Potsdam to bargain"
 krcw_ddr2_25_t:0 "The Officer Corps Accepts"
 krcw_ddr2_25_d:0 "The officer corps does not oppose openly, and the younger officers accept the fait accompli. The general's office can use the calm to fix the corps' loyalty down: tie it either to the general's office itself, or to the throne that still stands empty."
 krcw_ddr2_25.a:0 "Tie the corps' loyalty to the general's office"
 krcw_ddr2_25.b:0 "Turn the corps toward the empty throne"
 krcw_ddr2_26_t:0 "Where the Army Belongs"
 krcw_ddr2_26_d0:0 "After the purge the barracks go quiet, and loyalty is kept by the military intelligence office. The army obeys the general's office, but everyone remembers the men who were taken, and the younger officers have learned to swallow their words."
 krcw_ddr2_26_d1:0 "The officer corps' loyalty has been turned toward the throne that still stands empty, and the officers think of the Hohenzollern, not of any general, when they swear their oath. It gives the regime a name above the parties, and roots the monarchists in the army."
 krcw_ddr2_26_d2:0 "Where the officer corps belongs is settled; the army is rebuilt, and only in these years has the question of whose it is found an answer."
 krcw_ddr2_26.a:0 "The army takes shape again"
 krcw_wgr2_paris_decides_tt:0 "§YParis§! will decide how to answer."
 krcw_wgr2_councils_vote_tt:0 "The §Yworks councils§! will cast their own vote."
 krcw_wgr2_ddr_decides_tt:0 "§YPotsdam and Moscow§! will decide the next step."
 krcw_ddr2_moscow_decides_tt:0 "§YMoscow§! will decide its answer."
 krcw_ddr2_officers_decide_tt:0 "The §Yofficer corps§! will decide its own mood."
 krcw_wgr2_the_ruhr_output:0 "Set the Ruhr's Direction"
 krcw_wgr2_the_ruhr_output_desc:0 "The Ruhr's line has been settled by the congress of works councils. The Secretariat writes the direction into the second five-year plan, and the whole district schedules its output accordingly."
 krcw_wgr2_the_consumer_ruhr:0 "Turn the Ruhr to Consumer Goods"
 krcw_wgr2_the_consumer_ruhr_desc:0 "The Ruhr's capacity turns to housing, trams and household goods, and the Republic's workers come to live a life visible but out of reach across the Elbe. The arms works must wait their turn to grow."
 krcw_wgr2_the_armoured_ruhr:0 "Turn the Ruhr to Arms"
 krcw_wgr2_the_armoured_ruhr_desc:0 "The Ruhr's steel and coal go first to the arms works, and the Army of the Rhine fills out its armour and guns. The consumer-goods plan is cut, and the works councils are asked to accept longer hours."
 krcw_wgr2_what_the_ruhr_built:0 "Reckon What the Ruhr Built"
 krcw_wgr2_what_the_ruhr_built_desc:0 "The Secretariat reckons up the Ruhr's output of these years and reports to the Congress on where the district has brought the Republic. The report is both a summing-up and the start of the next plan."
 krcw_wgr2_the_corridor_doctrine:0 "Settle the Corridor Doctrine"
 krcw_wgr2_the_corridor_doctrine_desc:0 "The contest over the West Berlin corridor is settled, and the Secretariat makes the handling of the corridor a standing rule. Each future obstruction is dealt with by it, without asking afresh."
 krcw_wgr2_the_standing_airlift:0 "Keep a Standing Airlift"
 krcw_wgr2_the_standing_airlift_desc:0 "The aviation federation keeps transports and crews assigned to the Berlin corridor and stocks fuel and flour in Champagne and Alsace. The moment the DDR tightens the routes again, the airlift can take over."
 krcw_wgr2_the_written_corridor:0 "Put the Corridor Rules in Writing"
 krcw_wgr2_the_written_corridor_desc:0 "The traffic rules of the corridor are turned into a written agreement, and the DDR passes trains, lorries and barges by it. Berlin eases a little, and the Republic saves the cost of a standing airlift."
 krcw_wgr2_the_island_city:0 "Make West Berlin a Land"
 krcw_wgr2_the_island_city_desc:0 "The contest over West Berlin comes to its close, and the Secretariat fixes the city's standing, reporting to the Congress on who pays for it and what it counts for in the Republic."
 krcw_ddr2_the_lever_or_the_ledger:0 "Settle the Line on West Berlin"
 krcw_ddr2_the_lever_or_the_ledger_desc:0 "The contest over West Berlin is settled, and the general's office makes the line on the routes a standing rule: either trade or blockade. There is no asking Moscow afresh each time."
 krcw_ddr2_the_blockade_weapon:0 "Keep the Routes as a Weapon"
 krcw_ddr2_the_blockade_weapon_desc:0 "The blockade command stays ready to cut the rail, road and water routes to West Berlin in stages and force the Accord to give way on the corridor. Each tightening is reported to Moscow first."
 krcw_ddr2_the_leipzig_window:0 "Make Leipzig a Shop Window"
 krcw_ddr2_the_leipzig_window_desc:0 "Rather than close the routes, the Republic makes the Leipzig Fair the shop window of the eastern bloc, earning West German hard currency through transit trade and subsidising food in the towns. Some in the Accord call it collaboration with the enemy."
 krcw_ddr2_the_fate_of_the_city:0 "Close the Account on West Berlin"
 krcw_ddr2_the_fate_of_the_city_desc:0 "The general's office closes the account on the contest over West Berlin and reports to the People's Chamber that the opening and closing of the routes is henceforth a card in the hands of Berlin and Moscow."
 krcw_ddr2_whose_army:0 "Settle Where the Army Belongs"
 krcw_ddr2_whose_army_desc:0 "Where the officer corps belongs is settled, and the general's office makes the selection, promotion and allegiance of officers a standing rule. It decides what kind of army is rebuilt."
 krcw_ddr2_the_staff_army:0 "The General's Army"
 krcw_ddr2_the_staff_army_desc:0 "The officer corps swears to the general's office, not to any monarch. The army is the regime's most reliable instrument, though whose it is will become a question again the moment the regime changes hands."
 krcw_ddr2_the_crowns_army:0 "The Crown's Army"
 krcw_ddr2_the_crowns_army_desc:0 "The officer corps' allegiance is turned toward the empty Hohenzollern throne, and the officers think of the Kaiser, not a general, as they swear. It gives the regime a name above the parties and roots the monarchists in the army."
 krcw_ddr2_the_oath_taken:0 "The Army Takes Its Oath"
 krcw_ddr2_the_oath_taken_desc:0 "The army is rebuilt and the officer corps swears by the new rule. The general's office reports to the People's Chamber whose army it is, a question that has only in these years found its answer."
 krcw_sov_the_sickroom:0 "The Ruler in the Sickroom"
 krcw_sov_the_sickroom_desc:0 "Savinkov is alive, but someone else must sign for him. Papers pile up in the chancellery, and whoever runs it decides which of them reach the sickroom first."
 krcw_sov_industrial_committee:0 "The State Industrial Committee"
 krcw_sov_industrial_committee_desc:0 "The State Industrial Committee appoints the directors of the Ural trusts and reviews their plans every quarter. The steel barons keep their shares and lose their boards."
 krcw_sov_ural_syndicate:0 "The Ural Syndicate"
 krcw_sov_ural_syndicate_desc:0 "The Ural steel, engineering and wagon trusts form one syndicate that takes state orders as a body and runs its own production and profits. The state draws only the dividend on its preference shares."
 krcw_sov2_vote_tt:0 "The Council of State will elect the new Supreme Ruler according to the factions' influence."
 krcw_sov_tree_bid_mil_10_tt:0 "Influence of the military pragmatists: §G+10§!"
 krcw_sov2_1_t:0 "The Supreme Ruler's Stroke"
 krcw_sov2_1_d:0 "Savinkov suffers a stroke in his Kremlin study; his right hand is paralysed and his speech laboured. The doctors report that he may live for some time but can no longer handle daily business. A week of ministry papers is already piling up in the chancellery, and the Council of State must decide who runs it in his place."
 krcw_sov2_1.a:0 "Speaker Nekrasov runs the chancellery"
 krcw_sov2_1.b:0 "The General Staff sends its adjutants to the chancellery"
 krcw_sov2_1.c:0 "Leave the sickroom to the Patriarch and the old household"
 krcw_sov2_2_t:0 "Nekrasov's Interim Protocol"
 krcw_sov2_2_d:0 "Nekrasov drafts a protocol: when the Supreme Ruler dies the Council meets within three days and elects within thirty, the Speaker acting in between. No faction objects, since each believes thirty days favour itself. What remains is whether to publish it."
 krcw_sov2_2.a:0 "Publish it in the newspapers"
 krcw_sov2_2.b:0 "Lock it in the Speaker's safe"
 krcw_sov2_drop_ext_5_tt:0 "Influence of the extremists: §R-5§!"
 krcw_sov2_3_t:0 "The General Staff's Manoeuvres"
 krcw_sov2_3_d:0 "In the second week after the General Staff's adjutants move into the chancellery, two Guards divisions come up from Tula to the outskirts of Moscow for the autumn manoeuvres. Vasilevsky tells the Council it is a precaution while the Supreme Ruler is gravely ill. The civilians notice that the manoeuvres have no end date."
 krcw_sov2_3.a:0 "Let the troops stay"
 krcw_sov2_3.b:0 "Order them back to barracks"
 krcw_sov2_drop_mon_5_tt:0 "Influence of the monarchists: §R-5§!"
 krcw_sov2_4_t:0 "The Priest at the Bedside"
 krcw_sov2_4_d:0 "The Patriarch sends his own confessor to read to Savinkov in the sickroom every day. The old household lets it be known that the Ruler has taken communion and asked after the Romanovs. Nobody can confirm it, but several Moscow papers have already printed it."
 krcw_sov2_4.a:0 "Let the Patriarch address the Council"
 krcw_sov2_4.b:0 "Bar the clergy from the sickroom"
 krcw_sov2_5_t:0 "State Security's Files"
 krcw_sov2_5_d0:0 "Five days after Savinkov's death the head of State Security sends two lists: the provincial organisers of Vonsyatsky's veterans' leagues, and the monarchists who meet at the Cathedral of the Saviour. The General Staff's adjutants have run the chancellery since the stroke, and they took the files to Vasilevsky first. The Council must elect within thirty days, and everyone on the lists means to act within them."
 krcw_sov2_5_d1:0 "Five days after Savinkov's death the head of State Security sends two lists: the provincial organisers of Vonsyatsky's veterans' leagues, and the monarchists who meet at the Cathedral of the Saviour. Nekrasov's chancellery has carried on business since the stroke, and the files went to the Speaker's desk as the rules require. The Council must elect within thirty days, and everyone on the lists means to act within them."
 krcw_sov2_5_d2:0 "Five days after Savinkov's death the head of State Security sends two lists: the provincial organisers of Vonsyatsky's veterans' leagues, and the monarchists who meet at the Cathedral of the Saviour. The Patriarch's people have kept watch outside the sickroom since the stroke, and the old household knew what was in the files before the Council did. The Council must elect within thirty days, and everyone on the lists means to act within them."
 krcw_sov2_5_d3:0 "Five days after Savinkov's death the head of State Security sends two lists: the provincial organisers of Vonsyatsky's veterans' leagues, and the monarchists who meet at the Cathedral of the Saviour. Savinkov died suddenly, and nobody in the chancellery is authorised to receive the files. The Council must elect within thirty days, and everyone on the lists means to act within them."
 krcw_sov2_5.a:0 "Raid the veterans' leagues"
 krcw_sov2_5.b:0 "Nekrasov, Vasilevsky and Sorokin govern jointly until the vote"
 krcw_sov2_5.c:0 "Give the files to the Patriarch and let him summon the estates"
 krcw_sov2_drop_ext_15_tt:0 "Influence of the extremists: §R-15§!"
 krcw_sov2_drop_ext_10_tt:0 "Influence of the extremists: §R-10§!"
 krcw_sov_tree_bid_ext_10_tt:0 "Influence of the extremists: §G+10§!"
 krcw_sov2_6_t:0 "The Raid on the Veterans' Leagues"
 krcw_sov2_6_d0:0 "In one night the gendarmes search the leagues' branches in fourteen provinces, arrest over four hundred men and dig rifles and machine guns out of depots in Tula and Samara. Vonsyatsky himself is not on the list; next day he tells the press the leagues never meant to overthrow the Council. The branch organisers are already on their way east of the Yenisei."
 krcw_sov2_6_d1:0 "The raids meet resistance in Moscow and Petrograd. League members barricade the working districts, three gendarmes are killed in the Vyborg side, and Vonsyatsky takes refuge in a barracks whose officers refuse to give him up. The Council vote is twenty days away."
 krcw_sov2_6.a:0 "Publish the seized lists and the arms inventory"
 krcw_sov2_6.b:0 "Keep the lists in State Security"
 krcw_sov2_6.c:0 "Bring the Guards divisions into the city"
 krcw_sov2_6.d:0 "Negotiate with Vonsyatsky"
 krcw_sov2_7_t:0 "The Interim Directorate"
 krcw_sov2_7_d0:0 "The assembly of the estates summoned by the Patriarch sits for three days and agrees that the Speaker, the Chief of Staff and Sorokin will form an interim directorate until the vote. The three meet in the Kremlin every day and co-sign every order. The Church delegates sit in the gallery and record every division."
 krcw_sov2_7_d1:0 "Nekrasov, Vasilevsky and Sorokin meet in the Kremlin every day and co-sign every order. In the first month each gives way once, on railway tariffs and on army pay. The ministries' papers go out on time again."
 krcw_sov2_7_d2:0 "The directorate lasts three weeks. Vasilevsky walks out over the defence cuts and returns to the General Staff building, and from then on the district telegrams no longer go to the Kremlin. Nekrasov and Sorokin go on signing, but the district commands start choosing which orders to carry out."
 krcw_sov2_7.a:0 "Print the directorate's orders in the Gazette"
 krcw_sov2_7.b:0 "Confine the directorate to the budget and the railways"
 krcw_sov2_7.c:0 "Back those who stayed, under the Speaker"
 krcw_sov2_7.d:0 "Ask Vasilevsky back on his own terms"
 krcw_sov_tree_bid_ext_15_tt:0 "Influence of the extremists: §G+15§!"
 krcw_sov2_8_t:0 "Bargains Before the Vote"
 krcw_sov2_8_d0:0 "The league organisers are on the road to exile, and Vonsyatsky has barely a dozen votes left in the Council. The other three factions begin counting in private. The constitution requires two thirds, which none of them has, so someone must trade terms."
 krcw_sov2_8_d1:0 "Vonsyatsky is still in his barracks and his men rally in the working districts every day. Council members pass gendarme posts to reach the chamber. The constitution requires two thirds, which no faction has, and some members have begun talking to the leagues."
 krcw_sov2_8_d2:0 "The directorate has broken up, and the General Staff and the Kremlin issue separate orders. The Council must vote regardless. The constitution requires two thirds, and every faction is looking for terms that will buy votes."
 krcw_sov2_8_d3:0 "The interim directorate has kept the state running for some months and the date of the vote is fixed. The constitution requires two thirds, which no faction has, and their delegates begin trading terms in the Kremlin corridors."
 krcw_sov2_8.a:0 "Promise the General Staff five years of defence budgets"
 krcw_sov2_8.b:0 "Form an electoral bloc with the economic ministries and the Academy"
 krcw_sov2_8.c:0 "Promise the bishops and the steel barons a Zemsky Sobor"
 krcw_sov2_8.d:0 "Admit the veterans' leagues to the Council"
 krcw_sov2_9_t:0 "The New Government's First Hundred Days"
 krcw_sov2_9_d0:0 "The government of Vasilevsky has held office for three months, and the defeated factions have not accepted it. Their papers are shut and reopen, several district commands drag their feet on orders from Moscow, and some Council members openly demand a new vote. The new government must decide how to treat them."
 krcw_sov2_9_d1:0 "The government of Sorokin has held office for three months, and the defeated factions have not accepted it. Their papers are shut and reopen, several district commands drag their feet on orders from Moscow, and some Council members openly demand a new vote. The new government must decide how to treat them."
 krcw_sov2_9_d2:0 "The government of the Emperor has held office for three months, and the defeated factions have not accepted it. Their papers are shut and reopen, several district commands drag their feet on orders from Moscow, and some Council members openly demand a new vote. The new government must decide how to treat them."
 krcw_sov2_9_d3:0 "The government of Vonsyatsky has held office for three months, and the defeated factions have not accepted it. Their papers are shut and reopen, several district commands drag their feet on orders from Moscow, and some Council members openly demand a new vote. The new government must decide how to treat them."
 krcw_sov2_9_d4:0 "Three months into the new government, the ministries' papers go out on time and the defeated factions have accepted the result. The terms promised before the vote now fall due."
 krcw_sov2_9.a:0 "Exile the ringleaders east of the Yenisei"
 krcw_sov2_9.b:0 "Give the losing faction some ministries"
 krcw_sov2_9.c:0 "Honour the promises made before the vote"
 krcw_sov_convene_the_electoral_session:0 "Convene the Electoral Session"
 krcw_sov_convene_the_electoral_session_desc:0 "The factions have finished trading, and the Speaker calls the electoral session for next week. The members will choose a new Supreme Ruler by the constitutional two thirds, and the result will reflect where the factions stand today."
 krcw_sov_disband_the_veterans_leagues:0 "Dissolve the Veterans' Leagues"
 krcw_sov_disband_the_veterans_leagues_desc:0 "After the raids the provincial branches have no leaders left. The Interior Ministry dissolves the leagues, seizes their halls and presses, and hands the membership rolls to State Security. Vonsyatsky loses his strength in the street."
 krcw_sov_the_guards_hold_moscow:0 "The Guards Hold Moscow"
 krcw_sov_the_guards_hold_moscow_desc:0 "Order in Moscow now rests on the army. Two Guards divisions set up a garrison command in the city and the curfew begins at ten. The General Staff becomes the only body whose word counts in the capital."
 krcw_sov_the_directorate_charter:0 "The Directorate's Charter"
 krcw_sov_the_directorate_charter_desc:0 "The interim directorate writes its division of labour into a charter: the Speaker has the Council, the Chief of Staff the army, Sorokin the budget. The charter dissolves the directorate after the vote, so every faction is willing to sign."
 krcw_sov2_stroke_tt:0 "The Supreme Ruler's health will soon fail."
 krcw_sov_ukrainian_faculty:0 "The Ukrainian Faculty at Kiev"
 krcw_sov_ukrainian_faculty_desc:0 "Kiev University opens a faculty of Ukrainian language and letters, teaching in the mother tongue. The students are satisfied, and the Interior Ministry sends men to sit in on every history lecture."
 krcw_sov_ukrainian_land_council:0 "The Ukrainian Land Council"
 krcw_sov_ukrainian_land_council_desc:0 "Kiev gets a council for land, schools and local taxes, elected by the districts. Moscow keeps defence, foreign affairs, the railways and the allocation of coal."
 krcw_sov_russified_ukraine:0 "A Russified Ukraine"
 krcw_sov_russified_ukraine_desc:0 "The Ukrainian-language papers and schools are shut and teaching is in Russian alone. The Donbass works run as before, and half the lecture rooms in Kiev stand empty."
 krcw_sov2_20_t:0 "The Kiev University Petition"
 krcw_sov2_20_d:0 "The professors and students of Kiev University petition the Council for a faculty of Ukrainian language and letters. The wording is humble and speaks only of language and letters, not politics. The Interior Ministry notes that forty of the three hundred signatories made trouble last year. Ukraine holds forty million people and half of Russia's coal, and how the letter is answered is not a small matter."
 krcw_sov2_20.a:0 "Grant the Ukrainian faculty"
 krcw_sov2_20.b:0 "Close Prosvita and expel the leading professors"
 krcw_sov2_20.c:0 "Refer the petition to the governor-general of Ukraine"
 krcw_sov2_21_t:0 "The Faculty's First Year"
 krcw_sov2_21_d0:0 "A year on, the faculty keeps its bargain to speak of language and not politics. The Kiev papers run a few articles on Shevchenko, and the Ministry's observers report nothing political in the lectures. Several neighbouring provinces send in the same request."
 krcw_sov2_21_d1:0 "The faculty students start a literary journal, and its third number carries a story about the famine of 1933. The story names no one, but every reader understands whose policy it means. The Ministry demands it be shut, and the rector asks for time."
 krcw_sov2_21.a:0 "Open faculties at Kharkov and Odessa too"
 krcw_sov2_21.b:0 "Let it rest there and grant no more"
 krcw_sov2_21.c:0 "Arrest the editors and close the faculty"
 krcw_sov2_21.d:0 "Tolerate the journal, but draw a line it may not cross"
 krcw_sov2_22_t:0 "After Prosvita"
 krcw_sov2_22_d0:0 "After Prosvita's halls are sealed, the students of Lvov and Kiev strike, and several expelled professors go underground. The Ministry reports Internationale-funded leaflets along the Galician border again. Closing a faculty has cost more than expected."
 krcw_sov2_22_d1:0 "With Prosvita closed, Kiev goes quiet. Two Ukrainian papers remain, confined to farming and sport. The Donbass coal output is unaffected, which is the figure Moscow actually watches."
 krcw_sov2_22.a:0 "Send more gendarmes and declare martial law"
 krcw_sov2_22.b:0 "Replace the governor-general and soften the line"
 krcw_sov2_22.c:0 "Leave it there and pursue it no further"
 krcw_sov2_23_t:0 "The Georgian Church's Request"
 krcw_sov2_23_d:0 "The Georgian Church in Tbilisi asks to recover its autocephaly, lost when the old Empire absorbed it into the Russian Church, a grievance it has nursed ever since. The Patriarch objects that one empire cannot have two churches. But the viceroy of the Caucasus reminds Moscow that the Georgian Church's temper bears on the quiet of the railway to the Baku oilfields."
 krcw_sov2_23.a:0 "Restore Georgian autocephaly"
 krcw_sov2_23.b:0 "Keep the Church one, but allow the liturgy in Georgian"
 krcw_sov2_23.c:0 "Refuse, and move the bishops to Russian monasteries"
 krcw_sov2_24_t:0 "Cossacks or a Land Council"
 krcw_sov2_24_d0:0 "With Ukraine russified, the Galician border is still restless. Moscow must choose how to hold Ukraine: by the Cossacks' sabres, or by a council of locals who can manage locals. The governor leans to the first, the economic ministry to the second."
 krcw_sov2_24_d1:0 "The faculty succeeded, but one faculty does not govern forty million people. Moscow must choose between two deeper measures: restore the Cossack hosts' policing powers, or set up a Ukrainian council for land and schools. The first is cheap and reliable, the second steadying but a loss of Moscow's direct rule."
 krcw_sov2_24.a:0 "Give the Kuban and Terek Cossack hosts policing powers"
 krcw_sov2_24.b:0 "Set up the Ukrainian Land Council with taxes and schools"
 krcw_sov2_24.c:0 "Set up nothing; keep the governor's direct rule"
 krcw_sov2_25_t:0 "The Land Council's First Session"
 krcw_sov2_25_d0:0 "The first session of the Ukrainian Land Council discusses only schools and local taxes and touches neither defence nor the railways. The delegates send a budget to Moscow, and the Ministry, having checked it, admits there is nothing separatist in it. The Donbass workers' delegates sit in the front row; they want wages, not a flag."
 krcw_sov2_25_d1:0 "At its first session the Land Council passes a resolution making Ukrainian the sole official language of the province and asking that Ukrainian conscripts serve at home. This goes beyond the powers Moscow granted it. The Interior Minister says it is exactly why he opposed the council in the first place."
 krcw_sov2_25.a:0 "Accept the council's schools and tax plan"
 krcw_sov2_25.b:0 "Veto the council's budget and keep Moscow's purse"
 krcw_sov2_25.c:0 "Dissolve the council and restore direct rule"
 krcw_sov2_25.d:0 "Fix the limits of the council but keep it"
 krcw_sov2_26_t:0 "The Answer of the Don Krug"
 krcw_sov2_26_d0:0 "The Don Krug meets at Novocherkassk and accepts the commission. Cossack patrols ride between the villages on both banks of the Dnieper, and for six months no more leaflets turn up on the Galician border. The Ukrainian villagers dislike them and do not cross them."
 krcw_sov2_26_d1:0 "Under the governor's direct rule, the Kuban and Don hosts volunteer patrols to help the gendarmes. They take orders from the governor alone, and he is pleased with the arrangement. The province goes quiet, and everyone knows the quiet is borrowed."
 krcw_sov2_26_d2:0 "A Cossack patrol burns a village in Poltava province over a stolen horse. The provincial paper dares not print it, but the news travels from Kiev to Lvov and from Lvov to the Paris broadcasts. The economics minister demands an inquiry, and the Don Krug refuses to hand anyone over."
 krcw_sov2_26.a:0 "Thank the hosts and extend their powers for five years"
 krcw_sov2_26.b:0 "Withdraw the policing powers but keep the cavalry"
 krcw_sov2_26.c:0 "Defend the hosts and bury the inquiry"
 krcw_sov2_27_t:0 "The Test on the Galician Border"
 krcw_sov2_27_d0:0 "An Internationale-funded band crosses from Galicia to raise a rising in Kiev province. The Land Council's district delegates report their route to the gendarmes, and twelve men are taken on the third day. The Paris broadcasts say Ukrainians have betrayed Ukraine; the Kiev papers print the prisoners' statements."
 krcw_sov2_27_d1:0 "An Internationale-funded band crosses from Galicia to raise a rising in Kiev province. Cossack patrols and gendarmes catch them in the border woods, and four of the twelve survive. Nobody in the villages came out to help them, which is what Moscow most wanted to know."
 krcw_sov2_27_d2:0 "An Internationale-funded band crosses from Galicia and finds shelter and guides in the villages east of Lvov. Within a fortnight it has blown a railway bridge and shot a district police chief, then vanished into the woods. The Ukrainian question is back on the Council's agenda."
 krcw_sov2_27.a:0 "Let the Land Council deal with them"
 krcw_sov2_27.b:0 "Reward the frontier gendarmes and Cossacks"
 krcw_sov2_27.c:0 "Send three divisions into Galicia"
 krcw_sov2_27.d:0 "Reopen talks with a list of concessions"
 krcw_sov_the_kiev_faculties:0 "Expand the Ukrainian Schools"
 krcw_sov_the_kiev_faculties_desc:0 "Building on the Kiev faculty, the primary schools of Ukraine may teach in the mother tongue to the fourth year, and the secondary schools add Ukrainian literature. The teachers are hired by the Land Council or the zemstvos, and the Interior Ministry approves the textbooks."
 krcw_sov_the_cossack_frontier_line:0 "The Cossack Frontier Line"
 krcw_sov_the_cossack_frontier_line_desc:0 "Kuban and Don Cossacks found settlements along the Galician border, each furnishing a squadron to patrol it. Their land comes from the Ukrainian villages that were moved away, which the Ukrainians will not forget."
 krcw_sov_the_georgian_exarchate:0 "Recognise the Catholicos at Mtskheta"
 krcw_sov_the_georgian_exarchate_desc:0 "The Georgian Church elects its own Catholicos-Patriarch, enthroned at Mtskheta. The Moscow Patriarch does not attend but sends a letter of greeting. The Tbilisi clergy pray for the Supreme Ruler in the liturgy, and the villages along the Baku railway are quiet."
 krcw_sov2_40_t:0 "The Uralmash Trust's Books"
 krcw_sov2_40_d:0 "A state auditor reports that the Uralmash trust has under-declared its profits three years running and put the difference into its own suppliers and a bank in Yekaterinburg. Most of the trust's directors are Ural steel barons who backed the regime since the civil war. By the bargain the state takes only its dividend; by the law, under-declaring profit is a crime."
 krcw_sov2_40.a:0 "Sue the trust before the arbitration court"
 krcw_sov2_40.b:0 "Settle privately with the steel barons for back-payment"
 krcw_sov2_40.c:0 "Arrest the board and have the state take the trust over"
 krcw_sov2_41_t:0 "The Arbitration Court's Verdict"
 krcw_sov2_41_d0:0 "The arbitration court sits for six weeks, finds against the trust, orders three years of under-declared profit repaid and the finance director removed. The Uralmash trust accepts the verdict, which matters more than the verdict itself. Several other trusts spend the night checking their own books."
 krcw_sov2_41_d1:0 "The trust's lawyers find a hole: the bargain says the state takes only its dividend and does not say the trust must open all its books. The court finds for the trust, two to one. The barons give a banquet in Yekaterinburg, and the economics minister throws the judgment on his desk."
 krcw_sov2_41.a:0 "Follow the verdict with a State Industrial Committee"
 krcw_sov2_41.b:0 "Accept the verdict but widen no audit"
 krcw_sov2_41.c:0 "Appeal, and bring the case to the Council"
 krcw_sov2_41.d:0 "Accept defeat, but keep the arbitration court"
 krcw_sov2_42_t:0 "The Deal with the Steel Barons"
 krcw_sov2_42_d0:0 "The barons agree to pay, and offer unprompted to fund a consumer-goods works at Chelyabinsk as \"a mark of respect to the state\". The technocrats call it a bribe and the monarchist faction calls it loyalty. Both are right."
 krcw_sov2_42_d1:0 "The barons meet in Yekaterinburg and then inform Moscow that the bargain does not require them to repay. They remind the Ruler that the Urals' tanks and tractors all come from their works. It is at once a defence and a threat."
 krcw_sov2_42.a:0 "Accept their offer to build a consumer-goods works"
 krcw_sov2_42.b:0 "Take the back-payment, then send the auditors anyway"
 krcw_sov2_42.c:0 "They refuse to pay; sue them after all"
 krcw_sov2_42.d:0 "Threaten to cancel their state orders"
 krcw_sov2_drop_mon_10_tt:0 "Influence of the monarchists: §R-10§!"
 krcw_sov2_43_t:0 "After the Seizure"
 krcw_sov2_43_d:0 "The state has arrested the Uralmash board and the economic ministry runs the works directly. The other Ural steel barons watch: some travel to Moscow overnight to pledge loyalty, others move their money. Seizing a works is easy; keeping it delivering on time is hard."
 krcw_sov2_43.a:0 "Set up a State Industrial Committee over all the big trusts"
 krcw_sov2_43.b:0 "Take only this one and reassure the rest"
 krcw_sov2_44_t:0 "The General Staff's Order"
 krcw_sov2_44_d0:0 "The General Staff wants the Guards tank armies raised from three to five within a year, which doubles the tank order at Nizhny Tagil and Chelyabinsk. But the same works have just taken on the consumer plan. The two plans draw on the same steel, the same wagons and the same men. Someone must wait."
 krcw_sov2_44_d1:0 "The General Staff places a tank order and the trust delivers on contract and on time, without crowding out the consumer plan. The new system works, and for the first time the allocation of steel has books that can be checked. Neither the army nor the economic ministry can fault it."
 krcw_sov2_44.a:0 "Order three shifts and defer the consumer plan"
 krcw_sov2_44.b:0 "Hold the trust to its contract and make the army wait"
 krcw_sov2_44.c:0 "Promise both and make up the difference from the budget"
 krcw_sov2_45_t:0 "An Industrial System"
 krcw_sov2_45_d0:0 "Two years on, the Ural works deliver both tanks and refrigerators, the books are clear and the deliveries on time. The economic ministry proposes extending this system of contract-plus-audit to the heavy industry of the Donbass and Siberia. The army no longer objects, because its orders arrive on time too."
 krcw_sov2_45_d1:0 "The State Industrial Committee controls too much detail; every purchase at the Yekaterinburg works waits on Moscow, and deliveries are slower, not faster. The barons say it is exactly what they warned of. The committee's head blames the mess left by the old boards."
 krcw_sov2_45.a:0 "Extend the system to all heavy industry"
 krcw_sov2_45.b:0 "Let it stop at the Urals"
 krcw_sov2_45.c:0 "Loosen control and restore the trusts' autonomy"
 krcw_sov2_45.d:0 "Replace the committee's head and tighten control"
 krcw_sov2_46_t:0 "An Industry That Works"
 krcw_sov2_46_d0:0 "The Uralmash case has in the end established a principle: in Savinkov's Russia a trust opens its books to the state and the state orders by contract. The State Industrial Committee becomes a standing body between ministry and trust. The barons have lost their boards and kept their shares and their works."
 krcw_sov2_46_d1:0 "The Ural trusts have merged into a syndicate that runs its own production and profits, the state holding only its preference dividend and a contract. The barons have won this round: the state proved it could not manage the detail and gave the detail back to them."
 krcw_sov2_46_d2:0 "Two years have passed since the Uralmash case. The quarrel over the books has died down, the works deliver on time, and state and trust have both learned to deal with the other. Nobody mentions the under-declared profit any more."
 krcw_sov2_46.a:0 "(End) Confirm the system"
 krcw_sov_the_state_industrial_committee:0 "The State Industrial Committee"
 krcw_sov_the_state_industrial_committee_desc:0 "A standing State Industrial Committee in Moscow may appoint the directors of the great trusts, review their plans and settle supply disputes. The Ural steel barons keep their shares and lose their direct hold on the works."
 krcw_sov_the_ural_syndicate:0 "The Ural Syndicate"
 krcw_sov_the_ural_syndicate_desc:0 "The Ural steel, engineering and wagon trusts merge into one syndicate that takes state orders as a body and runs its own production and profits. It is efficient, and Moscow knows nothing of its inner workings."
 krcw_sov_arm_the_tank_armies_first:0 "Arms for the Tank Armies First"
 krcw_sov_arm_the_tank_armies_first_desc:0 "With the industrial system fixed, the General Staff's orders come first in the allocation of steel and wagons. Nizhny Tagil and Chelyabinsk go to three shifts and the consumer plan is deferred. The army is satisfied, and the department store shelves are a little emptier."
 krcw_ita2_gorizia_volunteers:0 "The Gorizia Volunteer Companies"
 krcw_ita2_gorizia_volunteers_desc:0 "Parri's old partisans have formed volunteer companies in Friuli and along the Isonzo, armed from army stores. They guard the border, and could start trouble on it at any time."
 krcw_ita2_southern_fund_idea:0 "The Southern Development Fund"
 krcw_ita2_southern_fund_idea_desc:0 "The fund builds canals, roads and food-processing works in the south, paid by the northern federations in proportion. Turin and Milan complain of the burden; the southern villages get electric light for the first time."
 krcw_ita2_1_t:0 "The Secretariat's Second Resolution"
 krcw_ita2_1_d0:0 "The Paris congress has adopted binding statutes, and the Secretariat promptly sends a second resolution on Trieste: Italy must submit Trieste and Istria to arbitration within three months or lose its vote. This time refusal has a consequence."
 krcw_ita2_1_d1:0 "The Paris congress has adopted the covenant, and the Secretariat again recommends that Italy take Trieste and Istria to arbitration at Geneva. Under the covenant the resolution does not bind Rome; whether to accept is for Italy alone."
 krcw_ita2_1_d2:0 "The Secretariat again asks Italy to submit Trieste and Istria to arbitration. Matteotti wants to accept, because everything should go through procedure; Parri wants to refuse, because the Italians of Istria should not wait on a ruling from Geneva."
 krcw_ita2_1.a:0 "Accept arbitration"
 krcw_ita2_1.b:0 "\"The resolution has been received and studied\""
 krcw_ita2_2_t:0 "The Geneva Hearing"
 krcw_ita2_2_d0:0 "The tribunal sits at Geneva with judges from Britain, Iberia and Canada. The Yugoslav junta sends a representative who will discuss the use of the port and refuses to discuss territory. The Italian delegation must decide where to put its weight."
 krcw_ita2_2_d1:0 "The tribunal sits at Geneva and the Yugoslav junta refuses to attend, saying an Internationale court has no right to hear the borders of an Accord member. The court proceeds without it, but its ruling can bind only Italy. The Italian delegation must decide where to put its weight."
 krcw_ita2_2.a:0 "Submit the Istrian petitions"
 krcw_ita2_2.b:0 "Propose a free port at Trieste"
 krcw_ita2_3_t:0 "The Veterans at Gorizia"
 krcw_ita2_3_d:0 "When word reaches Friuli that Rome has refused arbitration, Parri's old partisans form volunteer companies at Gorizia and ask the government for arms. The generals do not want a force outside their command holding the border."
 krcw_ita2_3.a:0 "Fold the companies into the regular army"
 krcw_ita2_3.b:0 "Let them drill as a militia"
 krcw_ita2_4_t:0 "The Line at Trieste"
 krcw_ita2_4_d0:0 "Having refused arbitration Rome has one course left: hold the present line on the Isonzo. The volunteer companies are in the regular army, and the General Staff asks for this stretch of border to be put under military rule."
 krcw_ita2_4_d1:0 "Yugoslavia boycotted the hearing and the ruling is months away. Belgrade has sent more patrols to its side of the border. The government must decide who runs Trieste while the ruling is awaited."
 krcw_ita2_4_d2:0 "The Yugoslav representative attended the hearing and some progress was made on the use of the port, while territory remains open. The government must decide who runs Trieste while the ruling is awaited."
 krcw_ita2_4.a:0 "Wait for the ruling and keep Trieste under civil rule"
 krcw_ita2_4.b:0 "Hand the Isonzo line to the army"
 krcw_ita2_5_t:0 "An Incident on the Isonzo"
 krcw_ita2_5_d0:0 "A volunteer company crossed a shallow ford of the Isonzo at night and exchanged fire with a Yugoslav patrol. Belgrade sent a division to the border next day, and Moscow radio calls it a war the Internationale has started in the Balkans."
 krcw_ita2_5_d1:0 "A volunteer company crossed a shallow ford of the Isonzo at night and exchanged fire with a Yugoslav patrol. Belgrade lodged a formal protest and moved no troops."
 krcw_ita2_5.a:0 "Pull the companies back five kilometres"
 krcw_ita2_5.b:0 "Bring the Alpine divisions forward"
 krcw_ita2_party_partisan:0 "CGIL (Partisan Line)"
 krcw_ita2_party_partisan_long:0 "Italian General Confederation of Labour (Partisan Line)"
 krcw_ita2_party_procedure:0 "Federation of Factory Councils"
 krcw_ita2_party_procedure_long:0 "Federation of the Italian Factory Councils"
 krcw_ita2_6_t:0 "The Congress of the Republic"
 krcw_ita2_6_d0:0 "After the Isonzo affair the congress of the Republic meets early. Parri's supporters in the army and the Friuli federations want him to form a government that can hold the border; Di Vittorio's union apparatus wants nothing changed."
 krcw_ita2_6_d1:0 "With Trieste in Geneva's hands the congress of the Republic holds its regular session. Matteotti's supporters say this proves the worth of procedure and want him to form a government; Di Vittorio's union apparatus wants nothing changed."
 krcw_ita2_6.a:0 "Parri forms the government"
 krcw_ita2_6.b:0 "Matteotti forms the government"
 krcw_ita2_6.c:0 "Di Vittorio stays"
 krcw_ita2_7_t:0 "Rome Proposes a Free Port at Trieste"
 krcw_ita2_7_d:0 "Rome proposes to the Secretariat that Trieste become a free port of the Internationale, open to Yugoslav shipping, its customs collected by a joint commission. Rome hopes Paris will support the proposal in the Secretariat."
 krcw_ita2_7.a:0 "Back Rome in the Secretariat"
 krcw_ita2_7.b:0 "Leave it to the tribunal"
 krcw_ita2_8_t:0 "Paris's Answer"
 krcw_ita2_8_d0:0 "Paris backed the free-port proposal in the Secretariat, and Iberia and Britain voted for it too. The Trieste port commission is formed next month, and the first Yugoslav merchant ships are already asking about berthing."
 krcw_ita2_8_d1:0 "Paris says the free-port proposal should be ruled on by the tribunal with everything else, and the Secretariat will not vote on it separately. Trieste must wait some months more."
 krcw_ita2_8.a:0 "Proceed accordingly"
 krcw_ita2_8.b:0 "Protest to the Secretariat"
 krcw_ita2_geneva_petitions:0 "Take the Istrian Petitions to Geneva"
 krcw_ita2_geneva_petitions_desc:0 "The government gathers petitions from the Italian towns of Istria and Matteotti carries them to the tribunal at Geneva. They ask for a plebiscite, and many who signed have been registered by the Yugoslav police."
 krcw_ita2_isonzo_divisions:0 "Station the Alpine Divisions on the Isonzo"
 krcw_ita2_isonzo_divisions_desc:0 "Two Alpine divisions move to the Isonzo and dig field works between Gorizia and Monfalcone. The General Staff calls it a defensive deployment; Belgrade does not."
 krcw_ita2_trieste_free_port:0 "Propose a Free Port at Trieste"
 krcw_ita2_trieste_free_port_desc:0 "The government proposes to the Secretariat that Trieste become a free port of the Internationale, open to Yugoslav shipping with customs taken by a joint commission. The proposal needs Paris's support in the Secretariat."
 krcw_ita2_arm_gorizia:0 "Arm the Gorizia Volunteers"
 krcw_ita2_arm_gorizia_desc:0 "The army issues rifles and machine guns from its stores to the Gorizia volunteers, who patrol the Isonzo banks. Parri reviews the first companies himself."
 krcw_ita2_southern_land_conference:0 "Convene the Southern Land Conference"
 krcw_ita2_southern_land_conference_desc:0 "The great estates confiscated in the 1920s are still run in Calabria, Apulia and Sicily by their old stewards, state farms in name, the labourers paid much as before. The farm workers' federation demands a conference, and Di Vittorio himself started as a day labourer at Cerignola."
 krcw_ita2_agrarian_law:0 "Draft the Agrarian Law"
 krcw_ita2_agrarian_law_desc:0 "The conference's conclusions go to the congress to be drafted into law. The law must answer one question: to whom does the estate land go, and how is it worked."
 krcw_ita2_collective_farms:0 "Found the Federation of Collective Farms"
 krcw_ita2_collective_farms_desc:0 "The estates pass whole to the labourers' leagues as collective farms run by the farm workers' federation. Parish peasants stay out and keep their small plots as they were."
 krcw_ita2_peasant_cooperatives:0 "Charter the Peasant Cooperatives"
 krcw_ita2_peasant_cooperatives_desc:0 "The estates are divided into family holdings whose owners join cooperatives by choice to share machines and stores. Parish cooperatives register under the same charter, run jointly by Di Vittorio's federation and Gronchi's Catholic unions."
 krcw_ita2_machine_stations:0 "Set Up the Machine Stations"
 krcw_ita2_machine_stations_desc:0 "Every district gets a machine station with tractors and harvesters sent from Turin, shared among the collective farms by acreage."
 krcw_ita2_rural_credit:0 "Open the Rural Credit Banks"
 krcw_ita2_rural_credit_desc:0 "The cooperatives open credit banks lending smallholders money for seed and machines, at rates set by the members' meeting."
 krcw_ita2_southern_fund:0 "Found the Southern Development Fund"
 krcw_ita2_southern_fund_desc:0 "The fund builds canals, roads and processing works in the south, paid by the northern federations in proportion. Turin and Milan complain of the burden; the southern villages get electric light for the first time."
 krcw_ita2_10_t:0 "The Occupation at Melissa"
 krcw_ita2_10_d:0 "At Melissa in Calabria the labourers occupy an estate under the farm workers' federation and survey the land themselves. Catholic peasant associations in nearby villages are occupying too, but want it split into family plots. The government must decide whom to talk to first."
 krcw_ita2_10.a:0 "Talk to the labourers' leagues"
 krcw_ita2_10.b:0 "Send Gronchi to talk to the parishes"
 krcw_ita2_11_t:0 "The Farm Workers' Plan"
 krcw_ita2_11_d:0 "The farm workers' federation proposes that the estates pass whole to the leagues as collective farms. Some in the federation argue for giving part of the land to families so the parish peasants will join."
 krcw_ita2_11.a:0 "Whole estates to collective farms"
 krcw_ita2_11.b:0 "Part of it to families"
 krcw_ita2_12_t:0 "Gronchi's Condition"
 krcw_ita2_12_d:0 "Gronchi spends two weeks with the southern bishops and returns with a condition: parish cooperatives will join the land reform, but the church's schools and parish lands are not to be touched. The peasants of the south listen to their priests, he says, and the priests listen to him."
 krcw_ita2_12.a:0 "Accept the condition"
 krcw_ita2_12.b:0 "The parish lands are divided too"
 krcw_ita2_13_t:0 "The Estate Guards of Sicily"
 krcw_ita2_13_d:0 "On several Sicilian estates the old stewards have hired armed guards who fire on the occupying labourers. The Palermo federation demands that the government send men, or the leagues will arm themselves."
 krcw_ita2_13.a:0 "Send the federal militia to Sicily"
 krcw_ita2_13.b:0 "Arm the labourers' leagues"
 krcw_ita2_14_t:0 "Who Chairs the Land Commission"
 krcw_ita2_14_d:0 "With the method of division agreed, a land commission must survey and register the holdings. Gronchi wants the chair because the parish peasants trust him; Gabriotti wants it because he can get the registers finished on time."
 krcw_ita2_14.a:0 "Gronchi takes the chair"
 krcw_ita2_14.b:0 "Gabriotti takes the chair"
 krcw_ita2_15_t:0 "The Vote on the Agrarian Law"
 krcw_ita2_15_d0:0 "When the law comes to the vote the Sicilian leagues already have their own arms, and the Palermo federation says the law only records a fact. Northern delegates worry about an armed force in the south answering to no one."
 krcw_ita2_15_d1:0 "The law is drafted on the terms agreed with the bishops, leaving the church's schools and parish lands out of the division. The Catholic union delegates vote with the government in the congress for the first time."
 krcw_ita2_15_d2:0 "The agrarian law comes before the congress. Its form was settled by the negotiations since the land conference, and the delegates vote on what has already been agreed."
 krcw_ita2_15.a:0 "Pass the collective farms law"
 krcw_ita2_15.b:0 "Pass the peasant cooperatives law"
 krcw_ita2_16_t:0 "The First Harvest on the New Land"
 krcw_ita2_16_d0:0 "The first harvest on the new land beats the estate years, with Apulian wheat and Calabrian olives both above the usual. For the first time the peasants decide how much grain to sell to the towns."
 krcw_ita2_16_d1:0 "The first harvest is poor. Spring drought and the new farms' confusion leave Apulian wheat well short. Northern papers call the land reform a failure; the southern federations say one harvest proves nothing."
 krcw_ita2_16.a:0 "Deliver as usual"
 krcw_ita2_16.b:0 "Ship northern grain to the south"
 krcw_ita2_17_t:0 "Gabriotti's Southern Plan"
 krcw_ita2_17_d:0 "Gabriotti proposes a plan for the south: canals, roads and processing works, paid by the northern federations in proportion. What remains is who runs the fund."
 krcw_ita2_17.a:0 "The national federations run it"
 krcw_ita2_17.b:0 "The southern communes run it"
 krcw_aus_tree:0 "krcw_aus_tree"
 krcw_aus_sov_weak_tt:0 "Russia is in trouble: the world war has begun, or the Accord crisis is above 60, or Savinkov is dead and his succession is not settled"
 krcw_wgr_good_neighbour:0 "A Good Neighbour"
 AUS_krcw_renner:0 "Karl Renner"
 AUS_krcw_klahr:0 "Alfred Klahr"
 ADR_krcw_miklas:0 "Wilhelm Miklas"
 ADR_krcw_miklas_desc:0 "An elder of the Christian Socials who was Federal President of Austria from 1928. The Russians needed an Austrian with a name in Vienna who was not a socialist, and he agreed."
 krcw_aus_divided_country:0 "A Divided Austria"
 krcw_aus_divided_country_desc:0 "The constitution names Vienna as Austria's capital, but the government works out of the provincial assembly building in Salzburg. The Russian posts stand on the far bank of the Enns, and the one daily train from Linz to Vienna has its papers checked twice."
 krcw_aus_salzburg_capital:0 "The Republic in Salzburg"
 krcw_aus_salzburg_capital_desc:0 "The republic no longer waits for Vienna. Salzburg has ministries, a parliament and a university of its own; the constitution still names Vienna as the capital, and the budget is spent on the six western provinces."
 krcw_aus_council_republic:0 "The Council Republic"
 krcw_aus_council_republic_desc:0 "The councils of the factories, mines and villages elect the national council, and the ministers answer to it. The Christian Socials boycott the council elections, and the Tyrolean farmers call it a townsmen's government."
 krcw_aus_the_salzburg_republic:0 "Proclaim the Salzburg Republic"
 krcw_aus_the_salzburg_republic_desc:0 "In the spring of 1945 the assemblies of the six western provinces proclaimed the Socialist Republic of Austria in Salzburg. The constitution names Vienna as the capital; the government sits in the Salzburg provincial assembly building for now. Paris recognised it first."
 krcw_aus_the_achensee_station:0 "Expand the Achensee Station"
 krcw_aus_the_achensee_station_desc:0 "The Achensee station in Tyrol has run since 1927, one of the first big stations in the Alps. Enlarged, it can supply the factories of Innsbruck and Linz, and the republic buys less coal from Bavaria."
 krcw_aus_the_linz_works:0 "Take the Linz Works into Public Hands"
 krcw_aus_the_linz_works_desc:0 "The Linz works were enlarged for war production and have been kept going by a workers' committee since the war. The republic makes them its first state enterprise, with the committee holding half the seats on the board."
 krcw_aus_the_ranshofen_aluminium:0 "Build the Ranshofen Aluminium Works"
 krcw_aus_the_ranshofen_aluminium_desc:0 "Ranshofen on the Inn in Upper Austria has cheap hydro power. The Internationale's aircraft plants are the main buyers, and the ingots pay for French machine tools."
 krcw_aus_the_erzberg:0 "Expand the Erzberg Workings"
 krcw_aus_the_erzberg_desc:0 "The Erzberg in Styria feeds the furnaces at Donawitz and Linz. Opening up more of the workings needs mining machinery from the Ruhr, which the republic pays for in timber and power."
 krcw_aus_the_paris_plan:0 "Join the Internationale's Common Plan"
 krcw_aus_the_paris_plan_desc:0 "Salzburg sends delegates to the Clearing Union in Paris. Austrian steel, aluminium and timber enter the Internationale's common plan in exchange for machinery and credit; the price is that the planners may inspect the republic's books."
 krcw_aus_hold_the_enns:0 "Hold the Enns"
 krcw_aus_hold_the_enns_desc:0 "The Enns is the line between the republic and the Russian zone, and Linz sits on its western bank. The engineers build bunkers along the river and in the Styrian passes while the Russians watch from the far bank."
 krcw_aus_the_mountain_divisions:0 "Raise the Mountain Divisions"
 krcw_aus_the_mountain_divisions_desc:0 "The republic's army is small, so the staff stake everything on the mountains: Tyrolean and Carinthian mountain troops hold the Brenner and the Semmering, and the battles on the plains are left to the Internationale's armour."
 krcw_aus_the_workers_militia:0 "Raise the Workers' Militia"
 krcw_aus_the_workers_militia_desc:0 "The factories of Linz, Steyr and Graz each form a militia that drills at weekends and keeps its rifles in the works store. The staff find them undisciplined; the unions say they are the republic's real army."
 krcw_aus_the_cabinet_in_salzburg:0 "The Cabinet in Salzburg"
 krcw_aus_the_cabinet_in_salzburg_desc:0 "Adler's provisional government holds three camps: his own socialist alliance, Renner's social democrats and Klahr's revolutionary socialists. There has been no election in four years and the provisional constitution is running out; the cabinet must decide who governs next."
 krcw_aus_adlers_coalition:0 "Keep Adler's Coalition"
 krcw_aus_adlers_coalition_desc:0 "The socialist alliance governs on one principle: Austria is neither a German province nor a Russian dependency. Adler stays chairman and both Renner's and Klahr's camps stay in the cabinet, neither able to overrule the other."
 krcw_aus_party_sdap:0 "SDAP"
 krcw_aus_party_sdap_long:0 "Sozialdemokratische Arbeiterpartei Österreichs"
 krcw_aus_renners_grand_coalition:0 "Renner's Grand Coalition"
 krcw_aus_renners_grand_coalition_desc:0 "Renner brings the social democrats, the Christian Socials and the Agrarian League together, wins a majority in the constituent assembly and becomes chancellor. Farmers and Catholics have ministers of their own in Salzburg for the first time; Klahr's people call it a return to the old empire."
 krcw_aus_party_councils:0 "Councils"
 krcw_aus_party_councils_long:0 "Federation of Austrian Workers' Councils"
 krcw_aus_the_council_republic:0 "The Council Republic"
 krcw_aus_the_council_republic_desc:0 "The councils of the Linz works, the Tyrolean power stations and the Styrian mines make Klahr chairman of the national council, and power passes from the ministers to the councils of the factories and villages. Klahr says Austria will never be a German province; the Christian Socials announce a boycott."
 krcw_aus_not_councils_tt:0 "Klahr's councils are not in power"
 krcw_aus_the_vienna_question:0 "The Vienna Question"
 krcw_aus_the_vienna_question_desc:0 "Vienna, Lower Austria and Burgenland are in Russian hands, and Vienna's eastern and western districts are two Russian military districts. The republic's constitution says the capital is Vienna; the government is in Salzburg. The republic must decide: join Germany, accept the division, or take Vienna back."
 krcw_aus_a_german_austria:0 "A German Austria"
 krcw_aus_a_german_austria_desc:0 "The greater-German camp says Austria alone can neither hold the Enns nor retake Vienna, and only a return to Germany offers a way out. The republic agrees to talk terms of union with West Germany: the provinces keep their assemblies, and Austria's mountain divisions stay in the Alps."
 krcw_aus_salzburg_is_enough:0 "Salzburg Is Enough"
 krcw_aus_salzburg_is_enough_desc:0 "The republic accepts that Vienna will not come back soon and puts its energy into the six western provinces. The constitution still names Vienna as the capital; the money in the budget stays in Salzburg, Linz and Graz."
 krcw_aus_vienna_will_be_free:0 "Vienna Will Be Free"
 krcw_aus_vienna_will_be_free_desc:0 "The republic swears to take its capital back. It will not fire first, but it means the Viennese to know that Salzburg has not forgotten them, and it means the army to be ready for the day the Russians cannot attend to Austria."
 krcw_aus_referendum_tt:0 "Salzburg will decide whether to hold a referendum on union with Germany"
 krcw_aus_prepare_the_referendum:0 "Prepare the Union Referendum"
 krcw_aus_prepare_the_referendum_desc:0 "The provincial assemblies agree that if Germany formally invites Austria, a referendum on union will be held under Internationale observers, and its result will bind both sides."
 krcw_aus_build_the_capital:0 "Build a Capital in Salzburg"
 krcw_aus_build_the_capital_desc:0 "The government moves out of the provincial assembly building; Salzburg gets ministry offices and a new parliament, and the archbishop's palace becomes the president's residence. People from Vienna say Salzburg will always be a small town; the people of Salzburg do not mind."
 krcw_aus_underground_tt:0 "Unlocks the decision §YSupport the Vienna Strike§! (needs Russia to be in trouble)"
 krcw_aus_the_vienna_underground:0 "The Vienna Underground"
 krcw_aus_the_vienna_underground_desc:0 "The socialists of Vienna's working districts reconnect through the railway and tram unions. Every evening Salzburg radio broadcasts to Vienna and tells them the republic is waiting."
 krcw_aus_war_plan_tt:0 "Unlocks the decision §YCross the Enns§! (needs Russia to be in trouble, or the Vienna strike to have been crushed)"
 krcw_aus_vienna_s_hour:0 "Vienna's Hour"
 krcw_aus_vienna_s_hour_desc:0 "The staff finish the plan to cross the Enns and drive on Vienna: the mountain divisions hold Styria while two infantry divisions push east along the Danube. The plan has one condition: the Russians must be unable to attend to Austria."
 krcw_aus_10_t:0 "The Union Referendum"
 krcw_aus_10_d0:0 "The provincial assemblies have agreed to a referendum on union. Salzburg must set a date, and the Internationale has promised observers. The greater-German camp has posters up in every village; the socialist alliance says the republic's existence is being gambled."
 krcw_aus_10_d1:0 "The West German congress suggests that the Austrians vote on whether to join Germany. Salzburg's government must decide whether to hold the vote, and the Internationale has promised observers. The greater-German camp says Austrians have waited decades for this; the socialist alliance says the republic's existence is being gambled."
 krcw_aus_10.a:0 "Hold the referendum"
 krcw_aus_10.b:0 "No referendum"
 krcw_aus_11_t:0 "The Result"
 krcw_aus_11_d0:0 "Salzburg, Tyrol, Styria, Carinthia, Vorarlberg and Upper Austria have voted under Internationale observers, and the majority chooses union with the German Socialist Republic. Adler says the government respects the result; Klahr's people march against it in Linz. Now the formal invitation from West Germany must come."
 krcw_aus_11_d1:0 "Salzburg, Tyrol, Styria, Carinthia, Vorarlberg and Upper Austria have voted under Internationale observers, and the majority chooses to stay in an independent Austrian republic. The greater-German camp says the vote was held under Russian threat; Salzburg's government declares the matter closed."
 krcw_aus_11.a:0 "Accept the result"
 krcw_aus_20_t:0 "Germany's Invitation"
 krcw_aus_20_d0:0 "In line with the referendum, the German Socialist Republic formally invites Austria to join as a state. The provinces keep their assemblies, Austria's mountain divisions stay in the Alps, and Vienna's status is left for the united Germany to negotiate. The national assembly in Salzburg must take the final vote."
 krcw_aus_20_d1:0 "The German Socialist Republic formally invites Austria to join as a state. The provinces keep their assemblies, Austria's mountain divisions stay in the Alps, and Vienna's status is left for the united Germany to negotiate. The Austrians have never voted on it; the national assembly in Salzburg may accept or refuse."
 krcw_aus_20.a:0 "Accept and join Germany"
 krcw_aus_20.b:0 "Decline; Austria stays in the Internationale on its own"
 krcw_aus_21_t:0 "Salzburg Agrees"
 krcw_aus_21_d:0 "The national assembly in Salzburg accepts the invitation by a majority, the provisional government dissolves, and Austria's six provinces become states of the Republic. Vienna, Lower Austria and Burgenland are still in Russian hands; now they are a German question."
 krcw_aus_21.a:0 "Welcome Austria home"
 krcw_aus_22_t:0 "Austria Joins Germany"
 krcw_aus_22_d:0 "The national assembly in Salzburg has voted to accept West Germany's invitation, and Austria's six western provinces become states of the German Socialist Republic. Moscow calls it German expansion; Paris calls it the Austrians' own choice. Vienna is still in Russian hands."
 krcw_aus_22.a:0 "Germany grows again."
 krcw_aus_22.b:0 "And what of Vienna?"
 krcw_aus_30_t:0 "The Vienna Strike"
 krcw_aus_30_d:0 "The Vienna railwaymen and the Floridsdorf factories have stopped work, and the strike committee demands that the Russian army leave Vienna and the city return to the republic in Salzburg. Salzburg radio reports the strike every hour. The Russian commander in Vienna asks for orders."
 krcw_aus_30.a:0 "Hand Vienna back to Salzburg"
 krcw_aus_30.b:0 "Crush the strike"
 krcw_aus_31_t:0 "The Russians Leave Vienna"
 krcw_aus_31_d:0 "Russian lorry columns drive away east along the Danube. The strike committee hands the city hall to the people Salzburg has sent, and the government announces its return to Vienna. The capital in the constitution and the capital on the map are the same place at last."
 krcw_aus_31.a:0 "The capital returns to Vienna"
 krcw_aus_32_t:0 "The Strike Is Crushed"
 krcw_aus_32_d:0 "Russian armoured cars drive into Floridsdorf, the strike committee is arrested, and several hundred people escape across the Enns to Linz. Salzburg radio reads out the names of the arrested. The staff say that next time it will not be a strike."
 krcw_aus_32.a:0 "Remember these names"
 krcw_aus_33_t:0 "Vienna Returns to Austria"
 krcw_aus_33_d:0 "The Russian army has left Vienna, Lower Austria and Burgenland, and the government of the Socialist Republic of Austria moves from Salzburg back to its capital. Moscow says it was done for détente; Paris says it proves the Accord cannot hold its borders."
 krcw_aus_33.a:0 "Vienna is Austrian."
 krcw_aus_33.b:0 "A withdrawal, not a defeat."
 krcw_aus_40_t:0 "The Federal State in Vienna"
 krcw_aus_40_d:0 "The Russians proclaim the Federal State of Austria in Vienna; the old Christian Social Wilhelm Miklas becomes chancellor, and the Russian army stays on as an ally. Salzburg calls it a puppet; Vienna says it is Salzburg that is Paris's puppet. There are now two Austrias."
 krcw_aus_40.a:0 "That is not Austria."
 krcw_aus_40.b:0 "Vienna has a government of its own."
 krcw_aus_cat:0 "The Vienna Question"
 krcw_aus_cat_desc:0 "Vienna, Lower Austria and Burgenland are in Russian hands, and Salzburg's constitution names Vienna as the capital."
 krcw_aus_support_the_strike:0 "Back the Vienna Strike"
 krcw_aus_support_the_strike_desc:0 "The Vienna railway and tram unions are ready. Salzburg sends money, radios and leaflets, and the strike committee will demand that the Russian army leave Vienna. Whether the Russians give way or send in the armoured cars depends on how much trouble Moscow has of its own."
 krcw_aus_war_tt:0 "§RThis is an attack on the Moscow Accord: its members will join, and the Internationale may be drawn in.§!"
 krcw_aus_cross_the_enns:0 "Cross the Enns"
 krcw_aus_cross_the_enns_desc:0 "The mountain divisions hold Styria while two infantry divisions push down the Danube on Vienna. Once this war begins, it is a member of the Internationale making war on the Moscow Accord."
 krcw_adr_party_cs:0 "CS"
 krcw_adr_party_cs_long:0 "Christlichsoziale Partei"
 krcw_aus_release_east_austria:0 "Set Up the Federal State in Vienna"
 krcw_aus_release_east_austria_desc:0 "Salzburg claims to speak for all Austria. Russia can set up another Austria in Vienna, with the Christian Social Miklas as chancellor and the Russian army staying as an ally. Vienna would then no longer be a place Russia occupies, but a member of the Accord."
