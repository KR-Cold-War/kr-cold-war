l_english:
# krcw: years paced
 KRCW_BOOKMARK_NAME:0 "Red Flag and Black Eagle: 1949"
 KRCW_BOOKMARK_DESC:0 "The Second Weltkrieg ended not with a peace treaty but with a ceasefire. Across the barbed wire on the Elbe stand two irreconcilable worlds: the §RThird Internationale§! of Paris, London and Nanjing, and the §gMoscow Accord§! of Savinkov's Russian State and Huey Long's America. Berlin is divided, the American civil war lies frozen but unfinished along the Ohio ceasefire line, Zhou Enlai's KMT-left rebuilds a shattered China from Nanjing, and the House of Windsor and the old Entente wait for their chance in their Australian exile.\n\nPeace is only the pause before the next war. Red flag or black eagle - who will own the future?"
 KRCW_FRA_BM_DESC:0 "The §RCommune of France§! is the heart and leader of the Third Internationale. Under §YBenoit Frachon§! it broke the German Empire in the Second Weltkrieg and raised the red flag over the Rhine. Paris is now racing towards its own atomic bomb, expected in §Y1950§!, but a hardening revolutionary bureaucracy threatens the Commune's vitality, and the burden of world revolution rests on its shoulders."
 KRCW_ENG_BM_DESC:0 "The §RUnion of Britain§!, led by §YTom Wintringham§!, is the naval pillar of the Internationale. Its fleets guard the Atlantic lanes that carry aid to Canada and the Syndicalist Americans. The old royals have long fled overseas; now London must prove that a Britain without a king can still rule the waves."
 KRCW_CHI_BM_DESC:0 "The §RRepublic of China§! is governed by the Reorganised Kuomintang under §YZhou Enlai§!. In 1937 the National Revolutionary Army marched out of Longyan on the Second Northern Expedition, toppling the Qing by 1940, then fought four years against the Fengtian clique and Japanese intervention until the §YQingdao Armistice of 1944§!. Manchuria and Korea are free, but §YTaiwan remains Japanese§!. Land reform is unfinished and warlord remnants and party factions abound."
 KRCW_WCA_BM_DESC:0 "The §RCombined Syndicates of America§! hold New England, New York and the Great Lakes. Under §YWalter Reuther§! the syndicalist militias held off Long's armies and the Canadian intervention in the Second American Civil War. Since the §YSt. Louis Ceasefire of 1946§! the two Americas have faced each other across the Ohio ceasefire line - each constitution claims the whole nation, and the war has never truly ended."
 KRCW_SOV_BM_DESC:0 "The §gRussian State§! leads the Moscow Accord. §YBoris Savinkov§! rules in the name of National Populism; in the Second Weltkrieg he annexed the Baltic states and broke the German Empire, raising General Schleicher's National Republic east of the Elbe. His iron fist forged the largest army in Eurasia - but will his empire outlive him?"
 KRCW_USA_BM_DESC:0 "The §gUnited States of America§! is ruled by the Kingfish, §YHuey Long§!. He has just begun his fourth term, yet his health is failing and the succession stirs within his family and party. Russian arms flow in through Mexico, and Long's America must hold the South and the Midwest against the syndicalists across the Ohio, deal with the constitutional government in Sacramento beyond the Rockies, and one day reunite America."
 KRCW_WGR_BM_DESC:0 "The §RGerman Socialist Republic§! was born as the Internationale liberated the Rhineland, the Ruhr, Hamburg and Bavaria. §YErnst Thalmann§! leads this frontline state, facing Schleicher's National Republic across the river, while isolated §YWest Berlin§! is the rawest nerve of the whole Cold War."
 KRCW_ITA_BM_DESC:0 "The §RItalian Socialist Republic§! is the Internationale's Mediterranean pillar. Union leader §YGiuseppe Di Vittorio§! must rebuild a war-torn peninsula while guarding the Adriatic gate amid the undercurrents of Yugoslavia and the Balkans."
 KRCW_CAN_BM_DESC:0 "The §RSyndicalist Republic of Canada§! was born of a failed intervention. In 1938-40 the Entente exiles sent troops into New England to restore the old order and were routed at Albany and Buffalo; Canadian workers rose, and the crown fled once more. Today §YTim Buck's§! republic is the Internationale's lifeline to the Syndicalist Americans."
 KRCW_KOR_BM_DESC:0 "The §RRepublic of Korea§! threw off Japanese rule in 1944 with Chinese backing. §YKim Won-bong's§! Korean Volunteer Army fought beside the National Revolutionary Army, and his republic is now Nanjing's most loyal fraternal state. Across the strait, a vengeful Japan has never abandoned its designs on the peninsula."
 KRCW_RAJ_BM_DESC:0 "The §gFederation of India§! is the product of the Princely Federation's \"anti-Red\" unification of the subcontinent. Backed by Russian arms and advisers, the Maharaja of Gwalior §YJivajirao Scindia§! destroyed the Indian Commune in 1947. Yet caste, religion, princely particularism, famine and peasant revolt tear at this vast state - no nation needs reform more."
 KRCW_JAP_BM_DESC:0 "The §YEmpire of Japan§! was defeated in China and lost Korea and Manchuria, keeping only Taiwan thanks to its navy. Prime Minister §YNobusuke Kishi§! leads a nation seething with revanchism. Aligned with no bloc, Tokyo drifts ever closer to Moscow - a quasi-ally of the Accord in the Pacific."
 KRCW_DDR_BM_DESC:0 "The §gGerman National Republic§! is reduced to Brandenburg and Saxony. When the Empire collapsed in 1944 the Kaiser fled to Dar es Salaam, then on to Sweden when Mittelafrika fell the same year, and General §YKurt von Schleicher§! surrendered what was left of the Reichswehr to the Russians, signing the Treaty of Berlin in exchange for a German state east of the Elbe. It kept the black-white-red flag, the monarchists wait quietly for a restoration, and the real keys are held in Moscow. Schleicher must prove that a \"national\" Germany deserves Berlin more than the \"red\" one in the west."
 KRCW_MEX_BM_DESC:0 "§gMexico§!, under §YMaximino Avila Camacho§!, has thrown in its lot with Moscow. Russian arms and advisers pour through Mexican ports and railways into Long's America, making this \"Russian corridor\" a key piece of the Cold War in the Americas."
 KRCW_TIB_BM_DESC:0 "The §YTibetan Local Government§! signed the Lhasa Agreement with Nanjing in 1947, becoming a highly autonomous region of the Republic of China. The Fourteenth Dalai Lama is still a child, and §YRegent Reting Rinpoche§! rules in his name. Indian and Russian agents are deeply infiltrating the Lhasa aristocracy - the roof of the world could ignite at any moment."
 KRCW_AST_BM_DESC:0 "§BAustralia§! is the Entente's last refuge. The House of Windsor settled here after fleeing Canada and formed the Australasian Entente with New Zealand. They hate the Internationale that took their homelands, yet loathe Savinkov's tyranny and Long's dictatorship too - both blocs court this swing power of the oceans."
