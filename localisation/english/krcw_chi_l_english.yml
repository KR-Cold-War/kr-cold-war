 krcw_chi_151_t:0 "Fighting around Xi'an"
 krcw_chi_151_d:0 "The central army has entered Hu Zongnan's territory."
 krcw_chi_151.a:0 "Issue the captured weapons to the central army."
 krcw_chi_151.b:0 "Post a bounty and send troops into the hills."
 krcw_chi_wl_force_tt:0 "A larger central army and a steadier government make a clean disarmament likelier; otherwise part of his force will escape with its weapons."
 krcw_chi_wl_escaped_tt:0 "The men who got away will stage mutinies until they are hunted down or amnestied."
 krcw_chi_46_d1:0 "The men who escaped into the hills raid a county town's granary and telegraph office and kill the magistrate Nanjing sent. They still march under their old unit designation."
 krcw_chi_46_t:0 "Mutiny"
 krcw_chi_46_d:0 "A division refusing reorganization mutinies at night, kills the political officer sent from Nanjing and retreats into the mountains with its baggage. The papers call it \"the last warlord war\"."
 krcw_chi_46.a:0 "Encircle and suppress."
 krcw_chi_46.b:0 "Offer amnesty."
 krcw_chi_50_t:0 "Soong Ching-ling in Paris"
 krcw_chi_50_d:0 "The delegation led by Soong Ching-ling is received with pomp. The Commune's general secretary hosts a banquet at the Palace of the Unions, and talk turns to Wang Jingwei: many of the old Communards argued revolution with him in Latin Quarter cafés.\n\nThe next day's talks are more businesslike. The French will help; but what does China need most?"
 krcw_chi_50.a:0 "Credit through the Clearing Union."
 krcw_chi_50.b:0 "Technology and patents."
 krcw_chi_50.c:0 "Arms and military advisors."
 krcw_chi_51_d1:0 "The delegation returns with a Clearing Union credit agreement. Nanjing can use it to order machine tools and generators from French and Italian works, with settlement starting in five years. Soong tells the press: \"The Internationale is not an empire. It is a net, and we are one of its threads.\""
 krcw_chi_51_d2:0 "The delegation returns with a consignment of rifles and a French military mission. The mission's chief goes to the Central Military Academy the next day and asks to see the training syllabus. At her press conference Soong speaks only of the engineers and does not mention the mission."
 krcw_chi_51_t:0 "The Delegation Returns"
 krcw_chi_51_d:0 "The delegation returns with agreements, contracts and a list of twelve hundred French, British and Italian engineers willing to work in China. Soong tells the press: \"The Internationale is not an empire. It is a net, and we are one of its threads.\""
 krcw_chi_51.a:0 "Welcome, comrades."
 krcw_chi_paris_credit_tt:0 "When the Construction Programme begins, the Clearing Union credit will pay for a new factory."
 krcw_chi_52_t:0 "The Chinese Delegation"
 krcw_chi_52_d:0 "A delegation from the Republic of China arrives in Paris seeking Clearing Union credit, technology and a bigger voice in the Internationale. For the Commune, a strong and friendly China is the cornerstone of the Asian front."
 krcw_chi_52.a:0 "Help generously."
 krcw_chi_52.b:0 "Help, with conditions."
 krcw_chi_53_t:0 "The Paris Congress"
 krcw_chi_53_d:0 "The Fifth Congress of the Internationale meets in Paris, and Zhou Enlai, heading the Chinese delegation, takes the floor. What the Europeans want to hear is one question: are Asia's revolution and Europe's the same revolution?"
 krcw_chi_53.a:0 "\"The same revolution, by different roads.\""
 krcw_chi_53.b:0 "\"Asia's revolution must be led by Asians.\""
 krcw_chi_54_t:0 "Satellite 1871"
 krcw_chi_54_d:0 "Radios pick up the \"beep, beep\": the Commune's satellite 1871 is passing over China. In Nanjing students stand on the sports fields gazing at the night sky.\n\nThe next morning the president of Academia Sinica submits a report: China needs a space programme too."
 krcw_chi_54.a:0 "Cooperate with France on rocketry."
 krcw_chi_54.b:0 "The heavens can wait."
 krcw_chi_60_t:0 "Encounter on the Median Line"
 krcw_chi_60_d:0 "In the fog a Fujian squadron gunboat and a Japanese maritime guard patrol boat close to under eight hundred meters. Both uncover their guns. The Japanese captain flashes a signal: \"These are Imperial waters.\"\n\nThe captain requests orders."
 krcw_chi_60.a:0 "Reply \"These are the high seas\", hold course, do not fire."
 krcw_chi_60.b:0 "Turn away."
 krcw_chi_60.c:0 "Fire a warning shot."
 krcw_chi_61_t:0 "Gunfire in the Strait"
 krcw_chi_61_d:0 "A Chinese gunboat has fired a warning shot in the Taiwan Strait. Tokyo's papers splash \"Nanjing's provocation\" across their front pages. The cabinet demands a naval response."
 krcw_chi_61.a:0 "Protest and reinforce patrols."
 krcw_chi_61.b:0 "Seek assurances from Moscow."
 krcw_chi_62_t:0 "Landing Exercises on the Fujian Coast"
 krcw_chi_62_d:0 "Intelligence reports large-scale Chinese marine landing exercises on the Fujian coast. The General Staff judges Nanjing may move on Taiwan within a year or two."
 krcw_chi_62.a:0 "Reinforce Taiwan."
 krcw_chi_62.b:0 "Appeal to Russia."
 krcw_chi_63_t:0 "The Taiwan Autonomy Petition"
 krcw_chi_63_d:0 "The Taiwan Cultural Association and People's Party deliver their seventeenth autonomy petition to the Imperial Diet, this time with 120,000 signatures. Nanjing radio reads it out in full in Hokkien."
 krcw_chi_63.a:0 "Voice public support."
 krcw_chi_63.b:0 "Fund them covertly."
 krcw_chi_70_t:0 "Conference of the Brother Republics"
 krcw_chi_70_d:0 "Kim Won-bong, Nguyễn An Ninh, Son Ngoc Thanh, Souphanouvong and Aung San sit at a round table in the Foreign Ministry. Zhou insisted on the round table: \"Among brothers there is no seat of honor.\"\n\nBut everyone knows that whoever pays and whoever sends troops has the last word."
 krcw_chi_70.a:0 "Promise aid without strings."
 krcw_chi_70.b:0 "Send aid, with advisors attached."
 krcw_chi_71_t:0 "The Students of Rangoon"
 krcw_chi_71_d:0 "Rangoon University students march under the banner \"Burma for the Burmese\". They protest not Nanjing itself but its advisors' imperious manner in the ministries. Aung San asks Nanjing to recall several of them."
 krcw_chi_71.a:0 "Recall the advisors and apologize publicly."
 krcw_chi_71.b:0 "Ignore it."
 krcw_chi_72_t:0 "The Royal Palace at Phnom Penh"
 krcw_chi_72_d:0 "Cambodia's young king still lives in the Royal Palace. Son Ngoc Thanh's government needs his prestige to calm the countryside; radicals see the palace as the symbol of the old order. Nanjing's opinion carries great weight."
 krcw_chi_72.a:0 "Advise a constitutional monarch."
 krcw_chi_72.b:0 "Back the republicans."
 krcw_chi_73_t:0 "The Hills of Laos"
 krcw_chi_73_d:0 "Souphanouvong reports that Hmong and Lao Theung highlanders distrust the new government in Vientiane; some villages have been bought by Indian and Siamese agents. He asks Nanjing for medical and road teams, not troops."
 krcw_chi_73.a:0 "Send medical and road teams."
 krcw_chi_73.b:0 "Send a mountain regiment."
 krcw_chi_80_t:0 "The Sino-Korean Alliance"
 krcw_chi_80_d:0 "The Sino-Korean Treaty of Alliance is signed in Seoul. At the ceremony Kim Won-bong recalls Liaoxi: \"Our blood flowed on the same snow.\" The treaty provides for common defense and joint training."
 krcw_chi_80.a:0 "Brothers of one heart."
 krcw_chi_81_t:0 "Seoul's Loyalty"
 krcw_chi_81_d:0 "Japanese revanchists openly call in the Diet for \"recovering the peninsula\". Seoul convenes an emergency cabinet. Kim Won-bong's answer is short: \"The Korean Republic stands or falls with the Republic of China.\" He asks Nanjing to station an air regiment at Busan."
 krcw_chi_81.a:0 "Send the air regiment."
 krcw_chi_81.b:0 "Provide equipment, but no troops."
 krcw_chi_82_t:0 "Seoul Demands an Equal Treaty"
 krcw_chi_82_d:0 "Seoul formally asks Nanjing to revise the annexes of the 1944 Qingdao settlement: end China's right to garrison Korea and give Korea its own vote in the Internationale.\n\nThe note is polite in tone and firm in substance."
 krcw_chi_82.a:0 "Agree: brothers should be equals."
 krcw_chi_82.b:0 "Decline, and remind Seoul who drove out the Kwantung Army."
 krcw_chi_83_t:0 "Korea's Parliament"
 krcw_chi_83_d:0 "Korea's elections are over. The National Revolutionary Party wins, though the Korea Independence Party polls strongly in the southern provinces. Parliament's first resolution thanks the Chinese people."
 krcw_chi_83.a:0 "Cable congratulations."
 krcw_chi_90_t:0 "Discontent in Hanoi"
 krcw_chi_90_d:0 "Nanjing's announcement of a larger advisory mission causes uproar in Hanoi. Ninh tells the National Congress: \"We did not drive out one governor-general to welcome another.\"\n\nHanoi asks Nanjing to reconsider."
 krcw_chi_90.a:0 "(Vietnam) Lodge a formal protest."
 krcw_chi_90.b:0 "(Vietnam) Endure it."
 krcw_chi_91_t:0 "Advisors and Ministers"
 krcw_chi_91_d:0 "A Vietnamese deputy minister of economy resigns in Hanoi. His letter says: \"I cannot sign a single paper in my own ministry: every file must first be reviewed by the Chinese advisor.\" The letter is printed in the Hanoi papers."
 krcw_chi_91.a:0 "Curtail the advisors' powers."
 krcw_chi_91.b:0 "Oversight is necessary."
 krcw_chi_92_t:0 "A Note from Hanoi"
 krcw_chi_92_d:0 "Hanoi requests \"comprehensive, equal\" negotiations on relations. Ninh's envoy says in Nanjing: \"Vietnam is grateful to China, but Vietnam is not a Chinese province.\""
 krcw_chi_92.a:0 "Agree to negotiate."
 krcw_chi_92.b:0 "Stall."
 krcw_chi_93_t:0 "Vietnam's Border"
 krcw_chi_93_d:0 "Vietnam and Siam clash over the Mekong border. Giáp wants to handle it alone, without Chinese troops; Nanjing's military mission advises sending a division \"just in case\"."
 krcw_chi_93.a:0 "Respect Vietnam's judgment."
 krcw_chi_93.b:0 "Send the division."
 krcw_chi_94_t:0 "Hanoi's Vote"
 krcw_chi_94_d:0 "At the Internationale congress Vietnam votes against China's amendment to the Asian Bureau statutes. Nanjing's diplomats exchange glances. Zhou only smiles: \"They have grown up.\""
 krcw_chi_94.a:0 "\"They have grown up.\""
 krcw_chi_94.b:0 "Recall the ambassador from Hanoi."
 krcw_chi_revolt_down5_tt:0 "Tibetan revolt progress §G-5§!"
 krcw_chi_revolt_up5_tt:0 "Tibetan revolt progress §R+5§!"
 krcw_chi_100_t:0 "Rumors from Lhasa"
 krcw_chi_100_d:0 "A coded cable from the representative in Lhasa: unfamiliar Indian merchants have appeared in several ministers' mansions, bringing rifles and gold coins rather than tea and cloth. Regent Reting may or may not know."
 krcw_chi_100.a:0 "Raise concerns with the Kashag through official channels."
 krcw_chi_100.b:0 "Reinforce the Xikang frontier garrisons."
 krcw_chi_100.c:0 "Investigate covertly."
 krcw_chi_101_t:0 "A New Compact on Tibet"
 krcw_chi_101_d:0 "The smoke of the revolt has cleared. Zhou invites the Kashag's delegates to Nanjing. His proposal is simple: wider autonomy, no change of system; no work teams from the center, no foreign troops in Tibet."
 krcw_chi_101.a:0 "Sign the new compact."
 krcw_chi_101.b:0 "Revoke autonomy and rule directly."
 krcw_chi_110_t:0 "Savinkov Is Dead"
 krcw_chi_110_d:0 "Moscow radio announces Savinkov's death. The Foreign Ministry meets through the night: Russia's succession struggle may keep Moscow from looking east. Opportunity, or danger?"
 krcw_chi_110.a:0 "Stay restrained and send condolences."
 krcw_chi_110.b:0 "Strengthen the northern frontier."
 krcw_chi_111_t:0 "The Hotline"
 krcw_chi_111_d:0 "A hotline now links Paris and Moscow, so that one misjudgement does not start a general war. The Foreign Ministry in Nanjing worries that the two European powers will settle Asian questions over China's head."
 krcw_chi_111.a:0 "Insist that Paris consult Nanjing on Asian questions."
 krcw_chi_111.b:0 "Wait and see."
 krcw_chi_warlord_category:0 "Integrating the Strongmen"
 krcw_chi_warlord_category_desc:0 "The strongmen who joined the Expedition still keep their own armies. Each general needs his own negotiation, or his own campaign. Integrated so far: [?ROOT.krcw_chi_warlords_done]/3"
 krcw_chi_negotiate_yan:0 "Negotiate with Yan Xishan"
 krcw_chi_negotiate_yan_desc:0 "Trade pensions, honors and company shares for Yan Xishan's surrender of his troops."
 krcw_chi_disarm_yan:0 "Disarm Yan Xishan's Troops"
 krcw_chi_disarm_yan_desc:0 "Central divisions march into Yan Xishan's garrisons with a deadline to disarm."
 krcw_chi_negotiate_bai:0 "Negotiate with Bai Chongxi"
 krcw_chi_negotiate_bai_desc:0 "Trade pensions, honors and company shares for Bai Chongxi's surrender of his troops."
 krcw_chi_disarm_bai:0 "Disarm Bai Chongxi's Troops"
 krcw_chi_disarm_bai_desc:0 "Central divisions march into Bai Chongxi's garrisons with a deadline to disarm."
 krcw_chi_negotiate_hu:0 "Negotiate with Hu Zongnan"
 krcw_chi_negotiate_hu_desc:0 "Trade pensions, honors and company shares for Hu Zongnan's surrender of his troops."
 krcw_chi_disarm_hu:0 "Disarm Hu Zongnan's Troops"
 krcw_chi_disarm_hu_desc:0 "Central divisions march into Hu Zongnan's garrisons with a deadline to disarm."
 krcw_chi_warlord_negotiate_tt:0 "Nanjing will send an envoy."
 krcw_chi_strait_category:0 "The Taiwan Strait"
 krcw_chi_strait_category_desc:0 "Taiwan remains in Japanese hands. Every move across the strait sets nerves jangling in Tokyo, Moscow and Paris. Current world tension: [?global.krcw_tension]"
 krcw_chi_strait_show_of_force:0 "Show of Force in the Strait"
 krcw_chi_strait_show_of_force_desc:0 "The Fujian squadron sails the median line to show the flag."
 krcw_chi_strait_fisheries_talks:0 "Scale Back the Strait Patrols"
 krcw_chi_strait_fisheries_talks_desc:0 "Pull the Fujian squadron back inshore and suspend the median-line patrols to lower the risk of an accidental clash. Hawkish naval officers call it weakness."
 krcw_chi_fund_taiwanese_autonomists:0 "Fund the Taiwanese Underground"
 krcw_chi_fund_taiwanese_autonomists_desc:0 "Send money, radios and presses to the armed wing of the Cultural Association and the People's Party, to grow the anti-Japanese organisation on the island."
 krcw_chi_mine_the_strait:0 "Mine Warfare Exercises"
 krcw_chi_mine_the_strait_desc:0 "Hold large-scale minelaying and sweeping drills off Fujian in preparation for possible landings."
 krcw_chi_taiwan_support_tt:0 "Strength of the Taiwanese underground §G+10§! (current: [?ROOT.krcw_chi_taiwan_support])"
 krcw_chi_brother_category:0 "Aid to the Brother Republics"
 krcw_chi_brother_category_desc:0 "Korea, Vietnam, Cambodia, Laos and Burma were all born with China's help. Aid can win gratitude, or charges of being a new suzerain."
 krcw_chi_aid_kor_industry:0 "Industrial Aid to Korea"
 krcw_chi_aid_kor_industry_desc:0 "Send engineers and machinery to help Korea build factories."
 krcw_chi_aid_kor_arms:0 "Arms for Korea"
 krcw_chi_aid_kor_arms_desc:0 "Transfer rifles and ammunition from the national stocks to Korea."
 krcw_chi_aid_vin_industry:0 "Industrial Aid to Vietnam"
 krcw_chi_aid_vin_industry_desc:0 "Send engineers and machinery to help Vietnam build factories."
 krcw_chi_aid_vin_arms:0 "Arms for Vietnam"
 krcw_chi_aid_vin_arms_desc:0 "Transfer rifles and ammunition from the national stocks to Vietnam."
 krcw_chi_aid_cam_industry:0 "Industrial Aid to Cambodia"
 krcw_chi_aid_cam_industry_desc:0 "Send engineers and machinery to help Cambodia build factories."
 krcw_chi_aid_cam_arms:0 "Arms for Cambodia"
 krcw_chi_aid_cam_arms_desc:0 "Transfer rifles and ammunition from the national stocks to Cambodia."
 krcw_chi_aid_los_industry:0 "Industrial Aid to Laos"
 krcw_chi_aid_los_industry_desc:0 "Send engineers and machinery to help Laos build factories."
 krcw_chi_aid_los_arms:0 "Arms for Laos"
 krcw_chi_aid_los_arms_desc:0 "Transfer rifles and ammunition from the national stocks to Laos."
 krcw_chi_aid_brm_industry:0 "Industrial Aid to Burma"
 krcw_chi_aid_brm_industry_desc:0 "Send engineers and machinery to help Burma build factories."
 krcw_chi_aid_brm_arms:0 "Arms for Burma"
 krcw_chi_aid_brm_arms_desc:0 "Transfer rifles and ammunition from the national stocks to Burma."
 krcw_chi_asian_bureau_summit:0 "Convene the Asian Bureau"
 krcw_chi_asian_bureau_summit_desc:0 "Invite the brother republics and the Internationale's Asian members to Nanjing to coordinate development and defense."
 krcw_chi_brotherhood:0 "Brotherhood"
 krcw_chi_trade_partner:0 "Clearing Union Partner"
 krcw_chi_rival:0 "Friction"
 krcw_chi_1871:0 "Research Bonus"
 krcw_chi_anshan_push:0 "Research Bonus"
 krcw_chi_mines:0 "Research Bonus"
 krcw_chi_paris_tech:0 "Research Bonus"
 krcw_chi_programme_start:0 "Research Bonus"
 krcw_kor_elec:0 "Research Bonus"
 krcw_chi_sci:0 "Research Bonus"
 krcw_vin_doctrine:0 "Research Bonus"
 krcw_chi_motorized:0 "Research Bonus"
 krcw_kor_aa:0 "Research Bonus"
 krcw_chi_mechanized:0 "Research Bonus"
 krcw_vin_coal:0 "Research Bonus"
 krcw_chi_mountain:0 "Research Bonus"
 krcw_chi_sci2:0 "Research Bonus"
 krcw_chi_marines:0 "Research Bonus"
 krcw_kor_doctrine:0 "Research Bonus"
 krcw_br_counterins:0 "Research Bonus"
 krcw_kor_sub:0 "Research Bonus"
 krcw_br_doc:0 "Research Bonus"
 krcw_vin_doctrine2:0 "Research Bonus"
 krcw_kor_arty:0 "Research Bonus"
 krcw_vin_inf:0 "Research Bonus"
 krcw_br_edu:0 "Research Bonus"
 krcw_kor_edu:0 "Research Bonus"
 krcw_chi_air:0 "Research Bonus"
 krcw_chi_whampoa:0 "Research Bonus"
 krcw_chi_subs:0 "Research Bonus"
 KOR_krcw_kim_kyu_sik:0 "Kim Kyu-sik"
 KOR_krcw_kim_kyu_sik_desc:0 "The old diplomat who pleaded Korea's case at Versailles. He belongs to no armed faction, and for that reason every faction can just about accept him as the broker of the united front. He believes a parliamentary, tolerant Korea will outlast a well-drilled barracks."
 KOR_krcw_kim_mu_chong_leader:0 "Kim Mu-chong"
 KOR_krcw_kim_mu_chong_leader_desc:0 "The artillery general who marched the Long March and fought the Japanese in north China. He has no patience for parliamentary quarrels and holds that Korea's survival rests on a strong army and an unbreakable alliance with Nanjing. The moderates fear him; the soldiers love him."
 VIN_krcw_tran_van_giau:0 "Trần Văn Giàu"
 VIN_krcw_tran_van_giau_desc:0 "The organiser of the Saigon rising and leader of Vietnam's Trotskyists. He holds Ninh's \"national front\" a betrayal of the revolution: only by liquidating the landlords, taming the sects and scattering the tinder across Southeast Asia is Vietnam's revolution complete."
 VIN_krcw_pham_van_dong:0 "Phạm Văn Đồng"
 VIN_krcw_pham_van_dong_desc:0 "Ninh's most trusted administrator and a pragmatic builder. Should Ninh fall, it is he, not the soldiers or the Trotskyists, most likely to inherit Hanoi — a leader who rates the rice harvest above world revolution."
 CAM_krcw_tou_samouth:0 "Tou Samouth"
 CAM_krcw_tou_samouth_desc:0 "An elder of the Khmer revolution who would carry Cambodia from Son Ngoc Thanh's nationalism toward a fuller social revolution — while wary of Vietnam's shadow falling over Phnom Penh."
 BRM_krcw_than_tun:0 "Thakin Than Tun"
 BRM_krcw_than_tun_desc:0 "Leader of Burma's communists, Aung San's brother-in-law and rival. He wants a revolution deeper than the Freedom League's, and should Aung San's coalition break, the red flags in the hills will rise in his name."
 LOS_krcw_phetsarath:0 "Phetsarath"
 LOS_krcw_phetsarath_desc:0 "A Lao prince and elder of the independence movement. No revolutionary, but an old-school aristocrat who would keep Laos a measure of autonomy between China, Vietnam and Siam."
 KOR_krcw_kim_wonbong_desc:0 "Chief of the Heroic Corps and leader of the Korean National Revolutionary Party. After thirty years of assassination, exile and guerrilla war, he is independent Korea's first leader — a revolutionary more at home with bombs than budgets."
 VIN_krcw_nguyen_an_ninh_desc:0 "The France-educated journalist and philosopher, the conscience of the Vietnamese revolution. The revolution he led beat the French, but he refuses to let Vietnam pass from one master to another — even if that master is Nanjing."
 CAM_krcw_son_ngoc_thanh_desc:0 "The father of Khmer nationalism and champion of the republic. With the help of Chinese volunteers he overthrew the throne's colonial collaborators, and now must build a republic in the shadow of the crown."
 LOS_krcw_souphanouvong_desc:0 "The \"Red Prince\", leader of Lao freedom. Born to the royal house, he chose revolution and the republic; he would free Laos from France and spare it becoming a neighbour's vassal."
 BRM_krcw_aung_san_desc:0 "Father of Burmese independence and leader of the Anti-Fascist People's Freedom League. He holds the peoples and factions together under one flag, knowing the coalition could fall apart in his hands at any moment."
 krcw_chi_county_cadres:0 "The County Cadres"
 krcw_chi_county_cadres_desc:0 "The National Government's authority used to stop at the county wall; beyond the gate lay clans, headmen and militia. The new cadre schools send eight thousand men a year into the countryside, carrying land registers, literacy primers and a pistol."
 krcw_chi_frontier_autonomy:0 "Frontier Autonomy"
 krcw_chi_frontier_autonomy_desc:0 "Mongol, Hui, Tibetan, Yi, Miao: the problem the Empire and the Beiyang settled with the sword, Nanjing tries to settle with statutes of autonomy - local officials, local schools, local languages, on condition that the centre is acknowledged."
 krcw_chi_the_nanjing_spring:0 "The Nanjing Spring"
 krcw_chi_the_nanjing_spring_desc:0 "In his last years Zhou pushed the separation of party and state and elections to the provincial assemblies. The Kuomintang turned from a revolutionary party into a governing coalition: a change without bloodshed, and without a way back."
 krcw_chi_the_iron_rice_bowl:0 "The Iron Rice Bowl"
 krcw_chi_the_iron_rice_bowl_desc:0 "Workers in the state plants have housing, clinics, nurseries and a job for life. It is the most popular part of the cooperative programme and the heaviest line in the national budget."
 krcw_chi_reach_the_county:0 "Authority Reaches the County"
 krcw_chi_reach_the_county_desc:0 "Nanjing's decrees often go unenforced at county level for want of officials who understand them. Post cadres to every county to make sure the land law is carried out."
 krcw_chi_the_cadre_schools:0 "The Cadre Schools"
 krcw_chi_the_cadre_schools_desc:0 "A cadre school in every province, one year long: reading, accounts, land survey, official writing, and how to settle into a village that does not want you."
 krcw_chi_break_the_clans:0 "The Clans and the Headmen"
 krcw_chi_break_the_clans_desc:0 "The real rulers of the countryside are clan elders and village headmen. Either fold them into the new order or break them; Nanjing tried both and found the first far cheaper."
 krcw_chi_the_land_registry:0 "The Land Registry"
 krcw_chi_the_land_registry_desc:0 "The land is surveyed again and every deed re-registered. The work is dull, endless and offends everyone, but without it the land law is only a slogan."
 krcw_chi_the_frontier_statutes:0 "The Frontier Statutes"
 krcw_chi_the_frontier_statutes_desc:0 "The statutes of autonomy for the Mongol, Hui, Yi and Miao pass the National Assembly. Opponents call it the first step to breaking the country; Zhou answers that Tibet has already proved the sword cannot settle it."
 krcw_chi_the_third_programme:0 "The Third Programme"
 krcw_chi_the_third_programme_desc:0 "The first two programmes built railways, steelworks and schools. The third must solve a harder problem: making what the factories produce affordable to the peasants who need it."
 krcw_chi_manchurian_heavy_industry:0 "Manchurian Heavy Industry"
 krcw_chi_manchurian_heavy_industry_desc:0 "The Anshan steelworks and Fushun collieries left by the Fengtian clique are the most complete heavy-industrial base in China. The Japanese wrecked half of it; workers from northern Jiangsu carried it back by hand."
 krcw_chi_the_inland_railways:0 "The Inland Railways"
 krcw_chi_the_inland_railways_desc:0 "Chengdu-Chongqing, Baoji-Chengdu, Lanzhou-Xinjiang: the trunk lines that tie the west to the coast. Every kilometre means blasting a mountain, and every kilometre makes the country more of a country."
 krcw_chi_the_consumer_turn:0 "The Consumer Turn"
 krcw_chi_the_consumer_turn_desc:0 "The cooperative congress resolves that in the next five years the output of bicycles, sewing machines, vacuum flasks and rubber shoes shall triple. The army objects; the peasant associations applaud."
 krcw_chi_the_coordinated_plan:0 "The Coordinated Plan"
 krcw_chi_the_coordinated_plan_desc:0 "The state, the provincial bodies and the industrial cooperatives negotiate output and prices item by item, with deadlocks sent to an arbitration board. It is not efficient, and every side can live with it."
 krcw_chi_the_question_of_after:0 "Arrange Zhou Enlai's Succession"
 krcw_chi_the_question_of_after_desc:0 "Zhou was born in 1898 and nearly died of illness in the hills of Longyan. No one in the party discusses the succession openly, yet everyone watches three directions: the old men of the revolutionary committee, the technocrats of the cooperative system, or the new generation elected by the county assemblies."
 krcw_chi_the_party_school:0 "The Central Party School"
 krcw_chi_the_party_school_desc:0 "The party school trains three thousand middle cadres a year. The syllabus covers the Three Principles, cooperative economics, and a subject that was never taught before: how to keep working after losing an election."
 krcw_chi_separate_party_and_state:0 "Separate Party and State"
 krcw_chi_separate_party_and_state_desc:0 "The hardest step for a revolutionary party after it wins: to admit that the government is not the party. Zhou left this to last, knowing that once begun it cannot be stopped."
 krcw_chi_the_committee_endures:0 "Keep the Revolutionary Committee"
 krcw_chi_the_committee_endures_desc:0 "The old men of the revolutionary committee have a simple argument: the country is still caught between two blocs, with an independent Tibet and a Japan holding Taiwan. This is no time for parliamentary games."
 krcw_chi_the_new_generation:0 "Promote the Younger Cadres"
 krcw_chi_the_new_generation_desc:0 "Those who joined in the 1950s have no connection to the Long March, Longyan or the Second Northern Expedition. They are engineers, teachers and county magistrates whose first concern is cement output and school enrolment. When they inherit, revolution becomes administration."
 krcw_chi_the_asian_bureau:0 "The Asian Bureau"
 krcw_chi_the_asian_bureau_desc:0 "The Internationale's Asian affairs are coordinated by a bureau in Nanjing, with delegates from Korea, Vietnam, Cambodia, Laos and Burma coming quarterly. Paris knows the bureau exists and knows better than to ask too much."
 krcw_chi_the_rice_and_rail_compact:0 "The Rice and Rail Compact"
 krcw_chi_the_rice_and_rail_compact_desc:0 "Vietnamese and Burmese rice for Chinese machine tools and rail; the Kunming-Hanoi and Nanning-Hanoi lines jointly financed by five states. It is the first economic community in Asia not chaired by Europeans."
 krcw_chi_the_bandung_road:0 "The Road to the Young Nations"
 krcw_chi_the_bandung_road_desc:0 "Send delegations to Indonesia, Egypt and the West and East African Federations offering irrigation, railways and teachers, to win over the non-aligned states."
 krcw_chi_the_asian_internationale:0 "Propose an Asian Secretariat"
 krcw_chi_the_asian_internationale_desc:0 "A proposal is formally raised in Nanjing: the Internationale should have a second secretariat, in Asia. Paris's reply took eleven months to arrive and was phrased with extreme care."
 krcw_chi_300_t:0 "The Frontier's Terms"
 krcw_chi_300_d:0 "The statutes passed the National Assembly, but outside the chamber the minority delegates raise more concrete demands: their own military establishments, non-interference in religious affairs, and one no one wants in writing - that if the centre breaks the bargain, autonomy may withdraw its recognition of the centre.\n\nThe Mongol delegate puts it most plainly: \"We are watching Tibet.\""
 krcw_chi_300.a:0 "Accept every term"
 krcw_chi_300.b:0 "Cultural and religious autonomy only"
 krcw_chi_300.c:0 "Statutes as written, the army stays central"
 krcw_chi_302_t:0 "The Arbitration Board's First Case"
 krcw_chi_302_d:0 "The Wuhan steelworks and the Hubei cooperative federation take a dispute over the price of a steel consignment to the arbitration board. The works says the province is squeezing it; the province says the works lives off state orders.\n\nHow this is decided will determine whether the coordinated plan is a real set of rules or a polite veneer."
 krcw_chi_302.a:0 "For the province: the plan outranks the enterprise"
 krcw_chi_302.b:0 "For the works: a contract is a contract"
 krcw_chi_304_t:0 "Three Directions"
 krcw_chi_304_d:0 "A meeting with no minutes. Zhou calls three men together: the old secretary of the revolutionary committee, the chief engineer of the cooperative directorate, and a forty-year-old provincial governor.\n\nHe announces nothing, asking only: \"If I am gone tomorrow, what does this country most lack?\" The three give three completely different answers."
 krcw_chi_304.a:0 "Discipline - the old secretary is right"
 krcw_chi_304.b:0 "Efficiency - the chief engineer is right"
 krcw_chi_304.c:0 "Legitimacy - the governor is right"
 krcw_chi_306_t:0 "The First Real Election"
 krcw_chi_306_d:0 "The county assembly results fill three full pages of the newspapers. The Kuomintang won three hundred and eleven of four hundred and seventeen counties: a real victory and a real defeat, for a hundred and six county magistrates are not party members.\n\nIn his political report Zhou says a line that will be quoted for decades: \"We have won the majority, which is more durable than winning everything.\""
 krcw_chi_306.a:0 "Accept the results and keep opening"
 krcw_chi_306.b:0 "Accept the results, but stop here"
 krcw_chi_308_t:0 "The Temptation of Non-Alignment"
 krcw_chi_308_d:0 "Delegates from Jakarta, Cairo and Dhaka put an impolite question in Nanjing: if the Republic of China is Asia's largest revolutionary state, why does it still listen to Paris?\n\nThe answer is complicated - the Internationale gave China machine tools, credit and allies who pin Russia at the Elbe. But once asked, the question cannot be unasked."
 krcw_chi_308.a:0 "We are of the Internationale and of Asia"
 krcw_chi_308.b:0 "Asian affairs should be settled by Asians"
 krcw_chi_310_d1:0 "Eleven months later the secretariat's reply reaches Nanjing. Nanjing has said in public that Asians should settle Asian affairs, and Paris remembers: the secretariat agrees to an \"Asian Coordinating Office\", but Paris appoints its director, Nanjing may only recommend, and the secretariat holds the budget."
 krcw_chi_310_d2:0 "Eleven months later the secretariat's reply reaches Nanjing. Zhou told the Paris Congress it was \"the same revolution, by different roads\", and the secretariat has taken him at his word: the \"Asian Coordinating Office\" will have a director nominated by Nanjing and appointed by Paris, a shared budget, and Nanjing gets one more permanent seat on the secretariat."
 krcw_chi_310_t:0 "Paris's Reply"
 krcw_chi_310_d:0 "Eleven months later the secretariat's reply reaches Nanjing. It says neither no nor yes: the secretariat agrees to an \"Asian Coordinating Office\", its director nominated by Nanjing and appointed by Paris, its budget shared.\n\nZhou reads it and says only: \"They have learned to speak to an equal partner. Slowly, but they have learned.\""
 krcw_chi_310.a:0 "Accept the arrangement"
 krcw_chi_310.b:0 "Not enough - we want a real secretariat"
 krcw_chi_the_village_school:0 "The Village School"
 krcw_chi_the_village_school_desc:0 "A primary school in every township, its teacher a literate local youth and its textbooks printed by the state. A third of the children enrolled in the first year are girls, which was unimaginable in their mothers' time."
 krcw_chi_the_technical_generation:0 "The Technical Generation"
 krcw_chi_the_technical_generation_desc:0 "Enrolment in the engineering colleges has risen sixfold in a decade. These graduates do not discuss the history of the revolution, only cement grades and bearing tolerances. The Kuomintang mistrusted them at first and then found the state could not run without them."
 krcw_chi_cooperative_countryside:0 "The Cooperative Countryside"
 krcw_chi_cooperative_countryside_desc:0 "The land belongs to the household; the tools, the irrigation and the market belong to the cooperative. This is no collective farm - a peasant may leave, and some do - but those who stay can afford an iron plough for the first time."
 krcw_chi_the_constitutional_republic:0 "The Constitutional Republic"
 krcw_chi_the_constitutional_republic_desc:0 "The National Assembly is no longer a rubber stamp and the county elections no longer offer a single list. The Kuomintang still governs, but now it has to win."
 krcw_chi_the_unfinished_reform:0 "The Unfinished Reform"
 krcw_chi_the_unfinished_reform_desc:0 "The land law is implemented in half the provinces, a quarter of county magistrates are still old military men, and no one can read the cooperatives' accounts. Zhou told an internal meeting: we won the war, and now we must win a fight with no enemy in it."
 krcw_chi_the_education_question:0 "Set the Education Policy"
 krcw_chi_the_education_question_desc:0 "The literacy campaign taught thirty million people to read. And then? Does the country need peasants who can read a newspaper, or engineers who can calculate stress? Two factions in the education ministry argued three years, and the real subject was what kind of country this intends to be in twenty years."
 krcw_chi_a_school_in_every_township:0 "A School in Every Township"
 krcw_chi_a_school_in_every_township_desc:0 "Breadth first: a primary school in every township even if the classroom is a borrowed ancestral hall and the teacher finished only middle school. In twenty years these children will be the workers, soldiers and cadres."
 krcw_chi_the_key_universities:0 "The Key Universities"
 krcw_chi_the_key_universities_desc:0 "Depth first: concentrate scarce resources in twelve key institutions and produce men who can design machine tools, bridges and reactors. The village schools can wait another decade."
 krcw_chi_send_them_abroad:0 "Send Them Abroad"
 krcw_chi_send_them_abroad_desc:0 "Two thousand students a year to Paris, Lyon, Manchester and Milan. The Internationale's laboratories open to Chinese students on condition they work ten years for the cooperatives on return. Most of them come back."
 krcw_chi_the_new_script:0 "The Reform of the Script"
 krcw_chi_the_new_script_desc:0 "Simplify the characters, spread the phonetic alphabet, standardise the national pronunciation. Opponents call it cutting the root of the culture; supporters point out that of four hundred million people three hundred million cannot read, so the root is already used by only a few."
 krcw_chi_the_cooperative_question:0 "Settle the Scope of the Cooperatives"
 krcw_chi_the_cooperative_question_desc:0 "The land law gave the land to the peasants, but a household with three mu cannot afford a pump or command a decent price. Cooperatives are the answer; the question is how far they go - marketing only, or the land itself?"
 krcw_chi_marketing_cooperatives:0 "Marketing Cooperatives"
 krcw_chi_marketing_cooperatives_desc:0 "The land stays with the household and the cooperative handles only tools, irrigation, credit and the market. The peasant keeps the right to leave, and precisely because he may leave, those who stay commit in earnest."
 krcw_chi_production_cooperatives:0 "Production Cooperatives"
 krcw_chi_production_cooperatives_desc:0 "Land, livestock and tools all enter as shares, with distribution by labour. Efficiency is genuinely higher and mechanisation easier; the price is that the peasant loses the deed with his name on it, and that piece of paper is why the regime won him in the first place."
 krcw_chi_the_irrigation_decade:0 "The Irrigation Decade"
 krcw_chi_the_irrigation_decade_desc:0 "The Huai, the Hai and the Pearl River delta: two thousand small reservoirs and thirty thousand kilometres of canals in ten years. The work uses every hand the cooperatives have, and for the first time shows the peasants what cooperation is for."
 krcw_chi_the_rural_industries:0 "Rural Industry"
 krcw_chi_the_rural_industries_desc:0 "Set up small farm-machinery, fertiliser and brick works in the county towns. The equipment is crude, and it keeps farmers employed near home instead of drifting to the coastal cities."
 krcw_chi_the_constitutional_question:0 "Debate the End of Tutelage"
 krcw_chi_the_constitutional_question_desc:0 "The 1947 constitution vests sovereignty in the people, but Assembly delegates are nominated by the party and county heads appointed by the province. Debate when tutelage should end."
 krcw_chi_open_the_ballot:0 "Open the Ballot"
 krcw_chi_open_the_ballot_desc:0 "County elections admit non-party candidates, and the provincial assemblies follow. The Kuomintang wins three quarters of the seats in the first real contest: a result that relieved the reformers and alarmed the conservatives even more."
 krcw_chi_the_guided_assembly:0 "The Guided Assembly"
 krcw_chi_the_guided_assembly_desc:0 "Widen the Assembly's powers while the party still vets the candidates. The reasoning is practical: this country faces an independent Tibet, a Japan holding Taiwan and two blocs watching, and this is no moment to risk a change of government."
 krcw_chi_the_rule_of_law:0 "The Rule of Law"
 krcw_chi_the_rule_of_law_desc:0 "The new court system separates from the old military tribunals and the county magistrate is no longer also the judge. Among the first cases are peasants suing cooperatives and workers suing state plants; some are won and some lost, which is precisely the point."
 krcw_chi_the_nanjing_settlement:0 "The Nanjing Settlement"
 krcw_chi_the_nanjing_settlement_desc:0 "The Nanjing settlement takes shape: the Kuomintang governs, the National Assembly holds real power, the courts are independent, and the economy rests on cooperatives."
 krcw_chi_320_t:0 "Two Factions in the Education Ministry"
 krcw_chi_320_d:0 "The argument has run three years. One faction produces figures: four hundred million people, three hundred million illiterate, and without universal primary schooling no industrial plan will have the men. The other produces figures too: fewer than eight hundred engineers in the country can design a machine tool, and the first five-year programme needs twelve thousand.\n\nZhou hears both reports and says only: \"There is one pot of money.\""
 krcw_chi_320.a:0 "Breadth first: a school in every township"
 krcw_chi_320.b:0 "Depth first: concentrate on the key institutions"
 krcw_chi_320.c:0 "Both, on Internationale credit"
 krcw_chi_322_t:0 "A Peasant's Deed"
 krcw_chi_322_d:0 "In a village in Anhui the cooperative director asks the households to hand in their deeds as shares. A peasant named Chen refuses: the land law was signed by Chairman Zhou, he says, and it states that this land is his.\n\nIt would have stayed a local dispute, but a journalist wrote it up and the report reached Nanjing. Now the whole country waits for an answer: does that piece of paper count or not?"
 krcw_chi_322.a:0 "The deed counts: no compulsory shares"
 krcw_chi_322.b:0 "Cooperation first: shares are the future"
 krcw_chi_322.c:0 "Let each province decide"
 krcw_chi_324_t:0 "If We Held a Real Election"
 krcw_chi_324_d:0 "An unrecorded party meeting. The organisation secretary reports an internal survey: in an unrestricted national election the Kuomintang would take about sixty per cent - enough to govern, not enough to do as it pleases.\n\nThere is a long silence. Some say the figure means they should hold elections at once; others that it means they must never hold them. Zhou asks a third question: \"If we never hold one, what will that figure be in twenty years?\""
 krcw_chi_324.a:0 "Hold them now, while we can still win"
 krcw_chi_324.b:0 "Fix the economy first, elections later"
 krcw_chi_324.c:0 "Begin at the county level"
 krcw_chi_326_d1:0 "The country is very different from 1949. Cooperatives run in most counties, county assemblies are re-elected on schedule, and the courts hear peasants suing the government. Zhou decided to hold national elections while the Kuomintang could still win them, and it has not lost one since.\n\nA French journalist asks Zhou whether this counts as socialism. He thinks for a moment and says: \"It counts as China.\""
 krcw_chi_326_d2:0 "The country is very different from 1949. Cooperatives run in most counties and the courts hear peasants suing the government. Elections began at county level; the county assemblies have been re-elected several times, but no date has been set for a national vote.\n\nA French journalist asks Zhou whether this counts as socialism. He thinks for a moment and says: \"It counts as China.\""
 krcw_chi_326_t:0 "The Nanjing Settlement"
 krcw_chi_326_d:0 "The country is very different from 1949. Cooperatives run in most counties and the courts hear peasants suing the government. The economy came first; there has been no election yet, and the CEC says it will hold one when conditions are ripe.\n\nA French journalist asks Zhou whether this counts as socialism. He thinks for a moment and says: \"It counts as China.\""
 krcw_chi_326.a:0 "This is the road we meant to walk"
 CHI_krcw_zhou_enlai_desc:0 "Political commissar out of Whampoa and Deng Yanda's deputy on the Northern Expedition. In the 1946 party contest he joined Chen Gongbo's radicals to defeat Gu Mengyu's moderates and became Chairman of the National Government and of the CEC. He wants a thorough land law and fast industrialisation, and he kept Gu Mengyu in the government, because he believes that if the party splits the warlords come back."
 CHI_krcw_song_qingling_desc:0 "Sun Yat-sen's widow, holding no post on the Central Executive Committee. The peasant associations, the women's movement and the overseas Chinese all look to her. She opposes compromise with the landlords and opposes purging the moderates alike; both sides ask her to declare herself and she seldom does."
 CHI_krcw_deng_yanda_desc:0 "Founder of the Provisional Action Committee, who fought his way back to Nanjing in the 1930s civil war on the \"peasants and workers\" programme. Out of front-line office he still holds the Whampoa Classmates Association. He wants land to the tiller and the party over the gun, and treats the Syndicalist Party as an ally to be watched."
 CHI_krcw_li_jishen_desc:0 "An elder of the Cantonese group and chief of staff on the Northern Expedition. He is well regarded among the old generals and the provincial strongmen, favours coalition government and local self-rule, and is the man in the party most willing to deal with the Democratic League."
 krcw_chi_factions_tt:0 "Faction strength: RevCom [?krcw_chi_f_revcom]  Moderates [?krcw_chi_f_moderate]  Madame Sun [?krcw_chi_f_left]  Whampoa [?krcw_chi_f_whampoa]  CSP [?krcw_chi_f_csp]"
 krcw_chi_the_united_front:0 "The United Front"
 krcw_chi_the_united_front_desc:0 "The Kuomintang governs and the Syndicalist Party sits in the government as a junior partner. The two share the peasant associations and the unions, and many members hold both cards."
 krcw_chi_the_party_alone:0 "Tutelage by the Party Alone"
 krcw_chi_the_party_alone_desc:0 "The Syndicalist Party leaves the government and the Kuomintang rules alone. The CEC no longer has to consult anyone, and syndicalists in the peasant associations are told to choose one card."
 krcw_chi_coalition_government:0 "Coalition Government"
 krcw_chi_coalition_government_desc:0 "The Democratic League and the rural reconstruction group each take ministries, and a third of the seats in the National Assembly open to non-party members. Tutelage has not formally ended, but it is loosening."
 krcw_chi_the_factions_in_the_cec:0 "Map the Factions in the CEC"
 krcw_chi_the_factions_in_the_cec_desc:0 "The Central Executive Committee elected at the Sixth Congress is split between the Revolutionary Committee, Gu Mengyu's moderates, the left around Madame Sun and the Whampoa Classmates. Outside the party is the Syndicalist Party - the junior partner in the United Front, and the majority in the Shanghai and Wuhan unions."
 krcw_chi_consult_madame_sun:0 "Ask Madame Sun to Declare Herself"
 krcw_chi_consult_madame_sun_desc:0 "Soong Ching-ling holds no office, but the peasant associations and the women's movement listen to her alone. Before the second reading of the land law, Zhou Enlai sends to Shanghai to ask her to declare herself."
 krcw_chi_keep_gu_mengyu:0 "Keep Gu Mengyu in the Government"
 krcw_chi_keep_gu_mengyu_desc:0 "The Shanghai chambers of commerce and the banks deal with Gu Mengyu and no one else. Keep the moderates in the government and reform goes slower; let them go and the cities grow uneasy."
 krcw_chi_the_whampoa_question:0 "Settle the Whampoa Classmates' Standing"
 krcw_chi_the_whampoa_question_desc:0 "Deng Yanda founded the Whampoa Classmates Association to keep the officers loyal to the party. Now it is a faction in its own right, and every theatre commander is a member. Either fold it into the Military Commission or recognise it as a formal faction of the party."
 krcw_chi_renew_the_united_front:0 "Renew the United Front"
 krcw_chi_renew_the_united_front_desc:0 "Renew the agreement with the Syndicalist Party: it keeps two ministries, the unions and peasant associations stay under joint management, and dual membership goes unchallenged."
 krcw_chi_the_party_governs_alone:0 "The Party Governs Alone"
 krcw_chi_the_party_governs_alone_desc:0 "The Revolutionary Committee's view: during tutelage only one party can be responsible. The Syndicalist Party leaves the government and members are given a deadline to drop one of their cards. The Radical syndicalists are already meeting on the Shanghai docks."
 krcw_chi_open_the_government:0 "Open the Government to Other Parties"
 krcw_chi_open_the_government_desc:0 "Li Jishen's and the Democratic League's proposal: ministries for the League and the rural reconstruction group, and National Assembly seats open to non-members. Tutelage is not over, but the Kuomintang is no longer the only party in government."
 krcw_chi_the_seventh_congress:0 "Convene the Seventh Congress"
 krcw_chi_the_seventh_congress_desc:0 "A new Central Executive Committee is elected on the factions' actual strength. Whichever holds the majority decides who follows Zhou Enlai."
 krcw_chi_factions_cat:0 "The Party Factions"
 krcw_chi_factions_cat_desc:0 "The factions of the CEC and the Syndicalist Party outside it. Each bloc's strength is shown below; courting one usually costs you another."
 krcw_chi_court_revcom:0 "Give Governorships to the Revolutionary Committee"
 krcw_chi_court_revcom_desc:0 "Hand several provincial governorships to Revolutionary Committee men. The land law will be carried out faster there."
 krcw_chi_court_moderates:0 "Let Gu Mengyu Chair the Economic Conference"
 krcw_chi_court_moderates_desc:0 "Gu Mengyu convenes the chambers of commerce, the banks and the provincial treasuries to settle next year's budget and price policy."
 krcw_chi_court_left:0 "Fund the Women's Federation"
 krcw_chi_court_left_desc:0 "The women's federation Madame Sun chairs runs literacy classes and nurseries in the counties. A grant makes her circle's voice louder in the countryside."
 krcw_chi_court_whampoa:0 "Let the Whampoa Classmates Nominate Division Commanders"
 krcw_chi_court_whampoa_desc:0 "Appointments from division commander up go first through the Classmates Association. The officers become more biddable; the Military Commission loses power."
 krcw_chi_court_csp:0 "Negotiate the Trade Union Law with the CSP"
 krcw_chi_court_csp_desc:0 "The Syndicalist Party wants the right to strike and factory committees written into the trade union law. Grant it and the Shanghai unions back the government; refuse and Li Lisan's people cannot hold back the Radicals."
 krcw_chi_401_t:0 "Madame Sun's Reply"
 krcw_chi_401_d:0 "Soong Ching-ling's reply runs to a single page. She backs the land law as drafted and rejects the exemption leaving landlords a \"self-cultivated plot\"; at the same time she asks the CEC to guarantee that no moderate is dismissed for voting against it."
 krcw_chi_401.a:0 "Accept both conditions"
 krcw_chi_401.b:0 "Pass the land law as drafted; deal with the moderates later"
 krcw_chi_401.c:0 "Keep the exemption and buy Gu Mengyu's votes"
 krcw_chi_403_t:0 "The Classmates' List"
 krcw_chi_403_d:0 "The Whampoa Classmates Association sends the Military Commission a list: forty names for the next round of promotions, all members. Deng Yanda has signed it, which makes it hard for the Commission to refuse."
 krcw_chi_403.a:0 "Approve the list"
 krcw_chi_403.b:0 "Approve half; the Commission picks the rest"
 krcw_chi_403.c:0 "Return it: promotion by examination only"
 krcw_chi_405_t:0 "The Meeting on the Docks"
 krcw_chi_405_d:0 "The Radical syndicalists hold a mass meeting at Yangshupu in Shanghai, reject the deadline to choose a party card, and call on the docks and the cotton mills to prepare a strike. Li Lisan of the Orthodox faction says publicly that he does not support a strike - and does not support the order either."
 krcw_chi_405.a:0 "Withdraw the card deadline; the CSP only leaves the government"
 krcw_chi_405.b:0 "Talk to Li Lisan alone and bring the Orthodox faction back"
 krcw_chi_405.c:0 "Declare martial law in Yangshupu"
 krcw_chi_c7_vote_tt:0 "The congress will vote on the new CEC. Each faction's strength, the earlier succession arrangements and whom Zhou backs all weigh on the result."
 krcw_chi_407_t:0 "The Seventh Congress"
 krcw_chi_407_d:0 "The Seventh Congress elects a new Central Executive Committee. Each faction runs candidates on its strength in the provincial party branches and the unions, and the result will decide who becomes Chairman of the National Government after Zhou Enlai. Zhou can back one slate in public or stay silent."
 krcw_chi_407.a:0 "Back the slate of the Revolutionary Committee and Chen Gongbo"
 krcw_chi_407.b:0 "Back Gu Mengyu for Chairman"
 krcw_chi_407.c:0 "Ask Soong Ching-ling to stand"
 krcw_chi_407.d:0 "Propose a joint slate chaired by Li Jishen"
 krcw_chi_407.e:0 "Stay silent and let the delegates choose"
 krcw_chi_410_d1:0 "The slate Zhou backed has won a majority. The Revolutionary Committee and Chen Gongbo's radicals keep their majority in the new CEC, and the Chairman after Zhou will come from their ranks."
 krcw_chi_410_d2:0 "The delegates did not vote the way Zhou asked. The Revolutionary Committee and Chen Gongbo's radicals keep their majority in the new CEC, and the Chairman after Zhou will come from their ranks."
 krcw_chi_410_t:0 "The Revolutionary Committee Holds Its Majority"
 krcw_chi_410_d:0 "The Revolutionary Committee and Chen Gongbo's radicals keep their majority in the new CEC, and the Chairman after Zhou will come from their ranks."
 krcw_chi_410.a:0 "Carry on the Revolutionary Committee's line"
 krcw_chi_411_d1:0 "The slate Zhou backed has won a majority. The moderates and the Action Committee delegates combine to elect Gu Mengyu Chairman of the National Government. Chen Gongbo leaves the standing committee and goes back to editing the Revolutionary Critic."
 krcw_chi_411_d2:0 "The delegates did not vote the way Zhou asked. The moderates and the Action Committee delegates combine to elect Gu Mengyu Chairman of the National Government. Chen Gongbo leaves the standing committee and goes back to editing the Revolutionary Critic."
 krcw_chi_411_t:0 "Gu Mengyu Becomes Chairman"
 krcw_chi_411_d:0 "The moderates and the Action Committee delegates combine to elect Gu Mengyu Chairman of the National Government. Chen Gongbo leaves the standing committee and goes back to editing the Revolutionary Critic."
 krcw_chi_411.a:0 "Gu Mengyu forms a cabinet"
 krcw_chi_412_d1:0 "The slate Zhou backed has won a majority. The peasant, women's and union delegates vote for Soong Ching-ling. It is the first government post she has held."
 krcw_chi_412_d2:0 "The delegates did not vote the way Zhou asked. The peasant, women's and union delegates vote for Soong Ching-ling. It is the first government post she has held."
 krcw_chi_412_t:0 "Soong Ching-ling Is Elected"
 krcw_chi_412_d:0 "The peasant, women's and union delegates vote for Soong Ching-ling. It is the first government post she has held."
 krcw_chi_412.a:0 "Madame Sun takes office"
 krcw_chi_413_d1:0 "The slate Zhou backed has won a majority. No faction has a majority. The day before the close, the delegates settle on a compromise: Li Jishen will head the government."
 krcw_chi_413_d2:0 "The delegates did not vote the way Zhou asked. No faction has a majority. The day before the close, the delegates settle on a compromise: Li Jishen will head the government."
 krcw_chi_413_t:0 "Li Jishen Chairs a Joint Slate"
 krcw_chi_413_d:0 "No faction has a majority. The day before the close, the delegates settle on a compromise: Li Jishen will head the government."
 krcw_chi_413.a:0 "The factions govern together"
 krcw_chi_party_front:0 "United Front"
 krcw_chi_party_front_long:0 "United Front of the Kuomintang and the Syndicalist Party"
 krcw_chi_party_revcom:0 "KMT (Revolutionary Committee)"
 krcw_chi_party_revcom_long:0 "Kuomintang (Revolutionary Committee)"
 krcw_chi_party_coalition:0 "Coalition Government"
 krcw_chi_party_coalition_long:0 "Coalition of the Kuomintang and the Democratic League"
 krcw_chi_li_lisan_joins_the_cabinet:0 "Bring Li Lisan into the Cabinet"
 krcw_chi_li_lisan_joins_the_cabinet_desc:0 "Li Lisan of the Orthodox syndicalists becomes Minister of Labour and drafts the trade union law. The Radicals say he has been bought."
 krcw_chi_factory_committees_law:0 "Pass the Factory Committees Law"
 krcw_chi_factory_committees_law_desc:0 "Every factory of over a hundred workers sets up a works committee, half workers' representatives and half management. Strikes in Shanghai and Wuhan fall."
 krcw_chi_party_cells_in_the_unions:0 "Set Up Party Cells in the Unions"
 krcw_chi_party_cells_in_the_unions_desc:0 "The Kuomintang sets up branches in every union, and branch secretaries must approve any strike. The Radical syndicalists go underground."
 krcw_chi_the_tutelage_extended:0 "Extend the Period of Tutelage"
 krcw_chi_the_tutelage_extended_desc:0 "The CEC extends the period of tutelage by ten years. The constitutionalists protest; the Revolutionary Committee holds the majority."
 krcw_chi_league_ministers:0 "Appoint Democratic League Ministers"
 krcw_chi_league_ministers_desc:0 "The Democratic League takes Education and Justice, and the rural reconstruction group takes Agriculture."
 krcw_chi_open_the_national_assembly:0 "Open the National Assembly to Non-Members"
 krcw_chi_open_the_national_assembly_desc:0 "A third of the National Assembly seats are contested by non-members. In the first election the Democratic League wins a majority in Jiangsu and Zhejiang."
 krcw_chi_plan_commission:0 "State Planning Commission"
 krcw_chi_plan_commission_desc:0 "The Planning Commission allocates the programme's steel, cement and foreign exchange. The ministries no longer fight each other for materials, and every request now waits in the commission's queue."
 krcw_chi_plan_quotas:0 "Quotas from the Commission"
 krcw_chi_plan_quotas_desc:0 "Output quotas go straight from the Planning Commission to each works; the provincial offices and the federations carry them out. Construction is faster, and so is the grumbling on the shop floor."
 krcw_chi_plan_federations:0 "Quotas Negotiated with the Federations"
 krcw_chi_plan_federations_desc:0 "Each quota is agreed between the Planning Commission and the federation concerned, with deadlocks sent to the State Council. Quotas take longer to set, and once set they are seldom stalled."
 krcw_chi_restore_fushun_collieries:0 "Restore the Fushun Collieries"
 krcw_chi_restore_fushun_collieries_desc:0 "The Fushun open-pit mine is Anshan's main source of coking coal, and the Japanese flooded the pits before they left. The miners' federation and engineers of the National Resources Commission pump them dry and re-equip them; the first year yields almost nothing."
 krcw_chi_expand_benxi_steel:0 "Expand the Benxi Iron and Steel Works"
 krcw_chi_expand_benxi_steel_desc:0 "Benxi's low-phosphorus pig iron suits special steels, and the Ordnance Department has long wanted it. The enlarged works supplies gun steel and armour plate, and civilian users get less."
 krcw_chi_baotou_steel_base:0 "Build the Baotou Steel Base"
 krcw_chi_baotou_steel_base_desc:0 "The Bayan Obo iron deposit lies far from the coast, out of easy reach of foreign bombers. A third steel base at Baotou needs a railway into the grasslands first, and the local Mongol princes want a share of the mine."
 krcw_chi_wuhan_iron_and_steel:0 "Found the Wuhan Iron and Steel Company"
 krcw_chi_wuhan_iron_and_steel_desc:0 "The Hanyang ironworks is China's oldest steel plant and its equipment is half a century old. A new Wuhan Iron and Steel Company at Qingshan uses Daye ore and ships its steel up and down the Yangtze."
 krcw_chi_chengdu_chongqing_railway:0 "Build the Chengdu-Chongqing Railway"
 krcw_chi_chengdu_chongqing_railway_desc:0 "The railway-protection movement that helped bring down the Qing was fought over this line, and Sichuan has waited decades for it. The ministry turns demobilised southwestern troops into construction battalions; the Sichuan provincial government handles the land."
 krcw_chi_baoji_chengdu_railway:0 "Build the Baoji-Chengdu Railway"
 krcw_chi_baoji_chengdu_railway_desc:0 "The Baoji-Chengdu line has to cross the Qinling mountains, with far more tunnels and bridges than a line on the plains, and costs far more. Once it opens, Sichuan grain and salt can go straight north to the Guanzhong plain."
 krcw_chi_lanzhou_xinjiang_railway:0 "Build the Lanzhou-Xinjiang Railway"
 krcw_chi_lanzhou_xinjiang_railway_desc:0 "A line from Lanzhou through the Hexi Corridor to Urumqi is the first link between Xinjiang and China proper that does not depend on camel caravans. The provincial government backs it; local leaders in Ili and Kashgar fear that settlers will follow the rails."
 krcw_chi_lanzhou_refinery:0 "Build the Lanzhou Refinery"
 krcw_chi_lanzhou_refinery_desc:0 "Crude from the Yumen field used to leave the Hexi Corridor by lorry, with heavy losses on the way. With the railway at Lanzhou a refinery is built there; the army and the tractor stations are both waiting for its fuel."
 krcw_chi_repair_fengman_dam:0 "Repair the Fengman Hydroelectric Station"
 krcw_chi_repair_fengman_dam_desc:0 "The Fengman dam on the Songhua was left by the Japanese with a cracked wall and half its turbines removed. Once it is repaired, the factories of Jilin and Harbin can run around the clock again."
 krcw_chi_sanmenxia_dam:0 "Build the Sanmenxia Dam"
 krcw_chi_sanmenxia_dam_desc:0 "The Yellow River Conservancy Commission wants a dam at Sanmenxia to hold back the floods and the silt and to generate power. The reservoir will drown many villages on the lower Wei, and the Shaanxi government wants Nanjing to pay the whole cost of resettlement."
 krcw_chi_state_planning_commission:0 "Establish the State Planning Commission"
 krcw_chi_state_planning_commission_desc:0 "The Construction Commission runs the works, but nobody allocates the programme's targets, materials and money as a whole. Zhou Enlai proposes a State Planning Commission under Chen Gongbo, made up of ministers, federation delegates and experts from the National Resources Commission. The ministries lose the power to allocate their own materials and complain loudly."
 krcw_chi_commission_sets_quotas:0 "Let the Commission Set the Quotas"
 krcw_chi_commission_sets_quotas_desc:0 "The Revolutionary Committee wants the Planning Commission to send output quotas straight to the works, leaving the provincial offices and federations only to carry them out. Construction will be faster; the Syndicalist Party says it moves the yamen into the factory."
 krcw_chi_negotiate_quotas:0 "Negotiate the Quotas with the Federations"
 krcw_chi_negotiate_quotas_desc:0 "The Syndicalist Party and the moderates want every quota agreed between the Planning Commission and the federation concerned, with deadlocks going to the State Council. There are more meetings, and less foot-dragging once the works get their targets."
 krcw_chi_tech_schools:0 "Technical Schools"
 krcw_chi_tech_schools_prod:0 "Technical Schools"
 krcw_chi_technical_schools:0 "Open Technical Secondary Schools"
 krcw_chi_technical_schools_desc:0 "The works are short of engineers and shorter still of technicians and foremen who can read a drawing. Technical secondary schools open in Anshan, Wuhan, Chongqing and Shanghai; half the pupils are sent by the factories, and the federations pay their fees."
 krcw_chi_engineers_france:0 "Engineers Trained in France"
 krcw_chi_engineers_to_france:0 "Send Engineers to Train in France"
 krcw_chi_engineers_to_france_desc:0 "Thirty years ago Zhou Enlai and a group of young people went to France as work-study students; this time it is metallurgists, railwaymen and power engineers. They spend two years in the works at Le Creusot and Billancourt, then go to the Planning Commission and the big projects."
 krcw_chi_jilin_chemical_complex:0 "Build the Jilin Chemical Complex"
 krcw_chi_jilin_chemical_complex_desc:0 "The second programme has to close the gap in chemicals. Dye, fertiliser and carbide plants go up in Jilin city on power from Fengman. The fertiliser goes first to the state farms of the northeast; the cooperatives south of the Wall wait their turn."
 krcw_chi_taiwan_support_10_tt:0 "Strength of the Taiwanese underground §G+10§!"
 krcw_chi_amphibious_command_sp:0 "Amphibious Operations Command"
 krcw_chi_amphibious_command_sp_desc:0 "The amphibious command at Fuzhou directs the marines, the landing fleet and the army divisions assigned to the landings. The navy and the army each supply a deputy commander, and disputes often go up to the Military Affairs Commission."
 krcw_chi_penghu_plan:0 "The Penghu Plan"
 krcw_chi_penghu_plan_desc:0 "The plan for the crossing is approved: Penghu first, then the west coast of Taiwan. The landing divisions take turns at embarkation drills."
 krcw_chi_landing_craft:0 "Landing Craft"
 krcw_chi_naval_air:0 "Naval Aviation"
 krcw_chi_amphibious_command:0 "Form the Amphibious Operations Command"
 krcw_chi_amphibious_command_desc:0 "An amphibious operations command is set up at Fuzhou to direct the marines, the landing fleet and the army divisions that will make the landings. Chen Shaokuan wants the navy in charge; the army's generals insist the landing troops answer to the army."
 krcw_chi_strait_intelligence:0 "Build the Strait Intelligence Network"
 krcw_chi_strait_intelligence_desc:0 "Intelligence officers working from Xiamen and Hong Kong send agents into Taiwan to map Japanese harbours, airfields and batteries. Agents are regularly caught by the Japanese military police, and each arrest brings a protest from Tokyo."
 krcw_chi_yingtan_xiamen_railway:0 "Build the Yingtan-Xiamen Railway"
 krcw_chi_yingtan_xiamen_railway_desc:0 "A railway from Yingtan in Jiangxi to Xiamen, so that troops and ammunition for the front no longer depend on roads and coastal shipping. It must cross the Wuyi Mountains; railway troops and Fujianese labourers build it, at great cost."
 krcw_chi_landing_ships:0 "Build Landing Ships"
 krcw_chi_landing_ships_desc:0 "The Jiangnan and Mawei yards put some destroyer orders back and build tank landing ships and motor landing craft instead. The navy resents the delay to its fleet plan, but without landing craft the army cannot cross."
 krcw_chi_fujian_airfields:0 "Expand the Fujian Forward Airfields"
 krcw_chi_fujian_airfields_desc:0 "Forward airfields are built or enlarged at Fuzhou, Jinjiang and Longxi so that fighters can cover Penghu and Taiwan's west coast. The fields take a great deal of farmland, and the Fujian provincial government wants the centre to pay the compensation."
 krcw_chi_mobilise_the_junks:0 "Requisition the Coastal Junks"
 krcw_chi_mobilise_the_junks_desc:0 "The motor junks and fishing boats of the Fujian and Zhejiang coasts are registered and formed into transport groups at the navy's call in wartime. The fishing cooperatives want a daily hire and compensation for losses before they will sail."
 krcw_chi_naval_aviation:0 "Form the Naval Air Arm"
 krcw_chi_naval_aviation_desc:0 "Pilots are drawn from the air force to form a naval air arm trained to attack shipping and cover landings. The air force objects to losing men and machines; the navy says it cannot hold the air over the strait without aircraft of its own."
 krcw_chi_assemble_at_xiamen:0 "Assemble at Xiamen and Kinmen"
 krcw_chi_assemble_at_xiamen_desc:0 "The first-wave divisions, their ammunition and their ships gather around Xiamen and Kinmen, and the harbours get new quays and fuel depots. An assembly on this scale cannot be hidden, and Japan will reinforce Taiwan."
 krcw_chi_frontier_army:0 "Northeast Frontier Army"
 krcw_chi_frontier_army_desc:0 "The Northeast Frontier Army holds the Amur and Ussuri line under Lin Biao. Several of the best divisions have gone north, to the displeasure of the southern commands."
 krcw_chi_frontier_army_2:0 "Northeast Frontier Army"
 krcw_chi_frontier_army_2_desc:0 "The Northeast Frontier Army holds the Amur and Ussuri line. Every division has done a winter field camp and drawn fur coats and cold-weather lubricants."
 krcw_chi_northern_plan:0 "The Northern Operations Plan"
 krcw_chi_northern_plan_desc:0 "The plan to recover Outer Manchuria and Outer Mongolia is complete: the mechanised corps strikes along the Chinese Eastern Railway while cavalry and motorised troops move onto the Mongolian plateau."
 krcw_chi_winter_doctrine:0 "Cold-Weather Warfare"
 krcw_chi_second_mech:0 "Second Mechanised Corps"
 krcw_chi_northeast_frontier_army:0 "Form the Northeast Frontier Army"
 krcw_chi_northeast_frontier_army_desc:0 "A Northeast Frontier Army is formed at Harbin under Lin Biao and deployed along the Amur and the Ussuri. The army wants its best divisions sent north, which the southern commands resent."
 krcw_chi_amur_depots:0 "Build the Amur Depots"
 krcw_chi_amur_depots_desc:0 "Depots, stores and roads are built along the Amur and the Chinese Eastern Railway, stocked with a winter's food, fuel and ammunition. The work is on frozen ground, and only half the year is fit for building."
 krcw_chi_cold_weather_training:0 "Train for Cold-Weather Warfare"
 krcw_chi_cold_weather_training_desc:0 "The northern divisions take turns at winter camps in the Greater Khingan, learning to march, bivouac and keep their weapons working at thirty below. Frostbite takes its toll, and the quartermasters complain about the bill for furs and cold-weather oil."
 krcw_chi_harbin_arsenal:0 "Expand the Harbin Arsenal"
 krcw_chi_harbin_arsenal_desc:0 "Part of the Shenyang arsenal moves north to Harbin and Qiqihar, to supply the northern armies with guns and ammunition close at hand. The works are close to the border, and the air force wants anti-aircraft positions built with them."
 krcw_chi_ma_crisis_up3_tt:0 "Moscow Accord bloc crisis §G+3§!"
 krcw_chi_work_in_mongolia:0 "Open Work in Outer Mongolia"
 krcw_chi_work_in_mongolia_desc:0 "The Frontier Commission sends agents to the princes, the lamas and the young officers in Outer Mongolia who resent the Russian garrison, and runs an underground paper in Urga. The Mongols fear Russia and distrust China alike, and the frontier experts warn Nanjing not to promise too much."
 krcw_chi_northern_air_bases:0 "Build the Northern Air Bases"
 krcw_chi_northern_air_bases_desc:0 "Airfields are built or enlarged at Harbin, Hailar and Xilingol so that the air force can cover both the Amur and the Mongolian plateau. Northern airfields must be swept of snow day and night in winter, and upkeep is costly."
 krcw_chi_second_mechanised_corps:0 "Form the Second Mechanised Corps"
 krcw_chi_second_mechanised_corps_desc:0 "A Second Mechanised Corps forms at Changchun with French-designed tanks and trucks assembled at Shenyang. The Manchurian plain suits armour, and this corps is to lead any northern offensive."
 krcw_chi_the_aigun_campaign:0 "Campaign on the Shame of Aigun"
 krcw_chi_the_aigun_campaign_desc:0 "The Propaganda Department teaches the lands lost by the treaties of Aigun and Peking in schools, papers and on the radio, and every May becomes a month of the lost territories. The moderates fear it will drag China into a war with Russia before it is ready."
 krcw_chi_northern_operations_plan:0 "Draw Up the Northern Operations Plan"
 krcw_chi_northern_operations_plan_desc:0 "The General Staff completes the plan to recover Outer Manchuria and Outer Mongolia: the mechanised corps strikes along the Chinese Eastern Railway while cavalry and motorised troops move onto the Mongolian plateau. The plan needs the Internationale to pin the Russian army in Europe at the same time, and Paris has not yet answered."
 krcw_chi_north_ready_tt:0 "Unlocks the decision §YDemand Outer Manchuria and Outer Mongolia§!."
 krcw_chi_asian_intelligence:0 "Asian Bureau Intelligence Office"
 krcw_chi_asian_intelligence_desc:0 "The joint intelligence office in Nanjing gathers the Russian and Japanese agents caught by China and the brother republics, and pools the interrogations and the intelligence."
 krcw_chi_asian_freedom_radio:0 "Open the Overseas Broadcasting Station"
 krcw_chi_asian_freedom_radio_desc:0 "High-power transmitters at Shenyang and Fuzhou broadcast union news and banned books in Russian, Japanese and Mongolian to the Far East. Russia and Japan both jam them, and the Asian Bureau shares the cost of power and staff."
 krcw_chi_ma_crisis_up4_tt:0 "Moscow Accord bloc crisis §G+4§!"
 krcw_chi_siberian_regionalists:0 "Fund the Siberian Regionalists"
 krcw_chi_siberian_regionalists_desc:0 "The Siberian regionalists want Irkutsk and Omsk to control their own taxes and land, and Savinkov's governors treat them as rebels. Nanjing secretly funds their papers and cooperatives through the Russian émigré community in Harbin."
 krcw_kor_reserve_divisions_sp:0 "Reserve Divisions"
 krcw_kor_reserve_divisions_sp_desc:0 "Discharged veterans of the Liberation Army and the Volunteer Army form reserve divisions that train for a month each year. In war they can be mobilised within a fortnight."
 krcw_kor_busan_perimeter:0 "Fortify Busan and Ulsan"
 krcw_kor_busan_perimeter_desc:0 "Coastal batteries and beach defences are built at Busan harbour and Ulsan bay, where a Japanese landing is most likely. The money comes out of the harbour expansion, to the annoyance of the Busan shipyard union."
 krcw_kor_incheon_coast:0 "Fortify the Incheon Coast"
 krcw_kor_incheon_coast_desc:0 "Incheon is a day's march from Seoul; a landing there would cost the capital. The navy lays minefields off the harbour and the army builds coastal batteries."
 krcw_kor_reserve_divisions:0 "Raise the Reserve Divisions"
 krcw_kor_reserve_divisions_desc:0 "Discharged veterans of the Liberation Army and the Volunteer Army are formed into reserve divisions that train for a month each year. Kim Mu-chong wants them under the War Ministry; the assembly insists the provinces run them."
 krcw_kor_southern_air_bases:0 "Build the Busan and Jeju Air Bases"
 krcw_kor_southern_air_bases_desc:0 "Air bases are built at Busan and on Jeju so that fighters can intercept Japanese bombers and transports over the Tsushima Strait. The aircraft are on loan from Nanjing and the pilots train at Jianqiao."
 krcw_kor_jirisan_plan:0 "Prepare Guerrilla Bases in Jirisan"
 krcw_kor_jirisan_plan_desc:0 "Arms and grain are cached in the Jirisan and Taebaek mountains and local guerrilla bands are trained. If the southern coast falls, they are to hold out behind Japanese lines until relief arrives."
 krcw_kor_guerrilla:0 "Mountain Guerrilla Warfare"
 krcw_kor_joint_plan_with_nanjing:0 "Agree the Relief Plan with Nanjing"
 krcw_kor_joint_plan_with_nanjing_desc:0 "The joint Sino-Korean command agrees that if Japan lands, Chinese troops will reach Korea across the Yalu and by sea within ten days. Nanjing wants a Chinese general in joint command in wartime, and Seoul reluctantly agrees."
 krcw_chi_land_committees_cadres:0 "Land Committees Run by Cadres"
 krcw_chi_land_committees_cadres_desc:0 "The county land committees are run by the young people the cadre schools sent down, who survey and redistribute by Nanjing's rules. They are earnest and far too few, each covering three or four townships."
 krcw_chi_land_committees_notables:0 "Land Committees with the Notables"
 krcw_chi_land_committees_notables_desc:0 "The land committees take in literate gentry and the old grain-chiefs, who know the history of every plot. Redistribution goes quickly, and it goes gently on their own kind."
 krcw_chi_land_committees_associations:0 "Land Committees Run by the Associations"
 krcw_chi_land_committees_associations_desc:0 "The land committees are chosen by the peasant associations themselves. Redistribution is thorough and old rent-debts are cancelled outright, but those struggled against are not only landlords; the better-off farmers and old debtors are swept in too."
 krcw_chi_land_delivered_idea:0 "The Land Law Delivered"
 krcw_chi_land_delivered_idea_desc:0 "The land law has reached the household in most provinces, the deeds are reissued and the county committees have become cooperative offices. For the first time the peasants believe Nanjing means what it says."
 krcw_chi_land_stalled_idea:0 "The Half-Finished Land Law"
 krcw_chi_land_stalled_idea_desc:0 "The land law finished redistribution in the coastal provinces and stalled halfway inland: some counties reissued deeds, others never finished the survey. The associations say Nanjing broke its word; the gentry say there has been enough upheaval."
 krcw_chi_deepen_land_reform:0 "Deepen the Land Reform"
 krcw_chi_deepen_land_reform_desc:0 "With the land law delivered, press on while the iron is hot: clear the last of the hidden fields and turn the county committees on the spot into the base of the rural credit cooperatives. Only provinces where redistribution went cleanly can take this step."
 krcw_chi_salvage_land_reform:0 "Salvage the Land Reform"
 krcw_chi_salvage_land_reform_desc:0 "Half the inland counties never finished. Send people down again to complete the survey, this time not for a thorough job but to get the promised deeds into the peasants' hands. It is slow, and it steadies them."
 krcw_chi_the_land_tribunals:0 "Set Up the Land Tribunals"
 krcw_chi_the_land_tribunals_desc:0 "Redistribution leaves tens of thousands of disputes: whose boundary, whose old debt, who was wrongly classed. Special land tribunals hear these cases, and only once they rule does the countryside truly settle."
 krcw_chi_the_village_work_corps:0 "The Village Work Corps"
 krcw_chi_the_village_work_corps_desc:0 "The cadres sent down are formed into standing village work corps that stay in the villages year-round to run the cooperatives, settle disputes and organise irrigation. The more fully the land law was delivered, the more cadres are willing to stay."
 krcw_chi_work_corps:0 "Village Work Corps"
 krcw_chi_the_grain_procurement:0 "The Grain Procurement"
 krcw_chi_the_grain_procurement_desc:0 "Peasants with new land eat first, but the cities and the army must eat too. The state buys surplus grain from the cooperatives by contract at a negotiated price. The heavier the procurement quota, the louder the associations complain."
 krcw_chi2_1_d1:0 "The rent-reduction law has passed, and two thousand counties must form committees to register leases, fix the rents and hear eviction disputes. Nanjing can issue the rules but not enough people to run them. Who staffs these committees decides whether rent reduction is ever carried out in the villages."
 krcw_chi2_1_t:0 "The County Land Committees Open"
 krcw_chi2_1_d:0 "The land law is on the books, and two thousand counties must form committees to survey the fields, register the deeds and parcel out the land. Nanjing can issue the rules but not enough people to run them. Who staffs these committees decides what the reform actually looks like in the villages."
 krcw_chi2_1.a:0 "Send cadre-school graduates down to run them"
 krcw_chi2_1.b:0 "Take in the literate gentry and old grain-chiefs"
 krcw_chi2_1.c:0 "Let the peasant associations choose their own"
 krcw_chi2_2_t:0 "The Survey Begins"
 krcw_chi2_2_d:0 "The cadre work teams go into the villages with tapes, compasses and a book of rules. They know nothing of the old boundaries and must measure plot by plot and ask household by household. It is slow, but the records are clean and no one can say they favoured anyone."
 krcw_chi2_2.a:0 "Work county by county, by the book"
 krcw_chi2_2.b:0 "Pull in more hands and finish before the autumn harvest"
 krcw_chi2_3_t:0 "A Committee That Knows the Ground"
 krcw_chi2_3_d:0 "With the gentry and old grain-chiefs on board the survey goes surprisingly fast: they can tell at a glance which plot was under-reported and which rent is real. Yet when land is parcelled out, their own holdings always sit just under the thirty-mu line, and it is always someone else who is struggled against."
 krcw_chi2_3.a:0 "Look the other way and get the land handed out"
 krcw_chi2_3.b:0 "Send Control Yuan inspectors to recheck the rolls"
 krcw_chi2_4_t:0 "The Associations' Survey"
 krcw_chi2_4_d:0 "The committees the associations chose themselves survey fast and hard. Old rent-debts are cancelled outright and every hidden field is dug out. But more and more households are classed as landlords and struggled against, and in some counties the better-off farmers and tenants who had paid off their debts are swept in too."
 krcw_chi2_4.a:0 "Fix one standard for who counts as a landlord"
 krcw_chi2_4.b:0 "Let the associations have their head"
 krcw_chi2_5_d1:0 "In the second season of redistribution the landlords strike back. The cadre teams are strangers to the villages and the landlords go for them: lawsuits, rumours, and in central Hunan and southern Jiangxi two team members are beaten to death. The provincial governors telegraph Nanjing asking for a slower pace."
 krcw_chi2_5_d2:0 "In the second season the backlash comes from the other side. Tenants find the same few families sitting on the committees and the land they get is all slopes and poor fields; in northern Sichuan and eastern Guangxi peasants surround the county offices. The associations telegraph Nanjing that the land committees have become the gentry's committees."
 krcw_chi2_5_d3:0 "In the second season those struggled against strike back. Landlords and wrongly classed farmers flee to the towns to petition, some raise militias, and in western Hunan and northern Fujian they fight the associations. The provincial governors telegraph Nanjing that the countryside is heading for serious trouble."
 krcw_chi2_5_t:0 "The Landlords Strike Back"
 krcw_chi2_5_d:0 "In the second season of redistribution the landlords strike back. Some hide their deeds, some sue in the provincial courts, some hire men to burn the county committees' survey registers at night. The provincial governors telegraph Nanjing asking for a slower pace."
 krcw_chi2_5.a:0 "Send the security corps to guard the committees"
 krcw_chi2_5.b:0 "Leave it to the provincial governors"
 krcw_chi2_5.c:0 "Let the associations form field-guard squads"
 krcw_chi2_deadline_tt:0 "Whether the provinces meet the deadline depends on who runs the land committees, whether the rolls were rechecked and how stable the government is. Provinces that miss it will leave the land law half-finished."
 krcw_chi2_6_d1:0 "One year remains of the deadline the land law set. The coastal provinces have issued their new deeds, half the inland counties have not finished the survey, and in several counties the associations' field-guard squads face the landlords' militias. The CEC must decide how to finish: on schedule, in phases over a longer time, or by the mass campaign the associations are demanding."
 krcw_chi2_6_t:0 "The Final Year"
 krcw_chi2_6_d:0 "One year remains of the deadline the land law set. The coastal provinces have issued their new deeds, while half the inland counties have not finished the survey. The CEC must decide how to finish: on schedule, in phases over a longer time, or by the mass campaign the associations are demanding."
 krcw_chi2_6.a:0 "Finish on schedule: every province reports by the deadline"
 krcw_chi2_6.b:0 "Finish in phases: the inland provinces get three more years"
 krcw_chi2_6.c:0 "Launch a mass campaign and finish in one winter"
 krcw_chi2_7_t:0 "The New Deeds"
 krcw_chi2_7_d:0 "The last inland province reports in. Most counties in the country have issued new deeds stamped by the land committees, and the committees have turned into cooperative offices. The peasants tuck the deeds under the sleeping mat; it is the first paper with their own name on it that their families have held in generations."
 krcw_chi2_7.a:0 "The land law is delivered"
 krcw_chi2_8_d1:0 "The phased plan relieved the inland provinces, but the three-year deadline became no deadline at all: the postponed provinces put it off again and again and the books never balance. The coastal provinces finished, while great tracts of inland counties are stuck halfway through the survey. The associations say Nanjing broke its word; the gentry say it suits them well."
 krcw_chi2_8_t:0 "The Reform That Stopped Halfway"
 krcw_chi2_8_d:0 "The deadline comes and the books will not balance. The coastal provinces finished, while great tracts of inland counties are stuck halfway through the survey: some reissued deeds, others never measured the fields. The associations say Nanjing broke its word and the gentry say there has been enough upheaval; neither is content."
 krcw_chi2_8.a:0 "Admit the reform is only half done"
 krcw_chi2_salvage_tt:0 "Unlocks the focus §YSalvage the Land Reform§!, which can carry the half-finished reform to completion."
 krcw_chi2_9_t:0 "One Winter"
 krcw_chi2_9_d:0 "The mass campaign finishes redistribution in a single winter. Struggle meetings run into the night, debts are cancelled outright, and the landlords' land, livestock and tools are parcelled out on the spot. The old order of the countryside is torn up by the roots, and the households wrongly struggled against remember this winter for years."
 krcw_chi2_9.a:0 "The countryside is turned over"
 krcw_chi2_11_d1:0 "The first village work corps members reach the end of their three years. Redistribution went cleanly, the cooperatives are up and running, most of them renew, and new youth queue up to go down. The work corps has become the most reliable rung below the county."
 krcw_chi2_11_d2:0 "The first village work corps members reach the end of their three years. The reform was finished by salvage, trust came late in many inland villages, and few renew; but those willing to stay are the hard core."
 krcw_chi2_11_t:0 "Those Who Stayed"
 krcw_chi2_11_d:0 "The first village work corps members reach the end of their three years. How many will renew, and move their families to the countryside, has become a measure of whether the reform succeeded."
 krcw_chi2_11.a:0 "Honour those who stay and fill the gaps"
 krcw_chi2_12_t:0 "The Price of the Surplus"
 krcw_chi2_12_d:0 "The very first year of procurement runs into trouble. The cooperatives say the contract price is too low while the town grain shops say the price of grain is too high. The heavier the quota, the more the peasants with new land feel the bowl they just filled is being taken from them."
 krcw_chi2_12.a:0 "Raise the purchase price and procure less"
 krcw_chi2_12.b:0 "Quota first: the cities and the army must eat"
 krcw_chi_plan_command:0 "Direct Management by the Commission"
 krcw_chi_plan_command_desc:0 "The key works are run directly by the Planning Commission, the directors answer to it and materials move by the balance tables. Construction is faster, and fewer people speak up on the shop floor."
 krcw_chi_plan_bargained:0 "A Programme Contracted to the Federations"
 krcw_chi_plan_bargained_desc:0 "Each industrial federation contracts for its share of the programme and keeps what it produces over quota. The old coastal works are keen; the new inland works often cannot get a place in the queue."
 krcw_chi_plan_livelihood:0 "A Programme for Livelihoods"
 krcw_chi_plan_livelihood_desc:0 "The second half of the programme shifts investment to bicycles, sewing machines, vacuum flasks and rubber shoes. The cooperative shop shelves fill up, and the Ordnance Department's orders go to the back of the queue."
 krcw_chi2_france_tt:0 "Paris will answer in a month. Whether Nanjing has joined the Clearing Union, what Zhou has said in Paris and whether France is itself at war all weigh on the terms the Commune offers."
 krcw_chi2_20_d1:0 "The new Planning Commission allocates materials for the first time and the ministries' requests for steel far exceed a year of Anshan's output. The ministries have lost the power to allocate their own materials and are waiting to see how the commission settles it. Someone has to cover the gap, or give way."
 krcw_chi2_20_t:0 "The Steel Shortfall"
 krcw_chi2_20_d:0 "The Planning Commission allocates materials for the first time and the ministries' requests for steel far exceed a year of Anshan's output. The Ministry of Railways wants rails, the Ordnance Department gun steel, the construction offices steel for factory halls and workers' housing. Someone has to cover the gap, or give way."
 krcw_chi2_20.a:0 "Cut civilian building and protect the key projects"
 krcw_chi2_20.b:0 "Ask Paris for Clearing Union credit to buy steel"
 krcw_chi2_20.c:0 "Lower the programme's targets"
 krcw_chi2_21_t:0 "The Shanghai Workshops Stop"
 krcw_chi2_21_d:0 "With civilian building cut, the hardware workshops and builders of Shanghai and Tianjin cannot get steel and stop work by the hundred. The Syndicalist Party holds meetings in Yangshupu and Zhabei, and Li Lisan asks the Ministry of Labour for subsistence pay for the idle workers."
 krcw_chi2_21.a:0 "Pay the subsistence money; the steel stays where it is"
 krcw_chi2_21.b:0 "The key projects come first; the workers must find other work"
 krcw_chi2_22_t:0 "The Clearing Union Credit"
 krcw_chi2_22_d:0 "The Commune's finance commission approves the credit, and steel is shipped from the works at Le Creusot and Milan, with settlement starting in five years. Paris asks only that China's orders go first to the works of the Internationale."
 krcw_chi2_22.a:0 "The steel goes first to Anshan and Wuhan"
 krcw_chi2_22.b:0 "Share it between the railways and civilian building"
 krcw_chi2_23_t:0 "Paris's Conditions"
 krcw_chi2_23_d:0 "The Commune's finance commission agrees to the credit, with conditions: French engineers are to sit on the Planning Commission, and the programme's quotas are to be agreed with the industrial federations, not fixed by the commission alone. Paris calls it the Internationale's rule; the Revolutionary Committee calls it interference."
 krcw_chi2_23.a:0 "Accept the conditions"
 krcw_chi2_23.b:0 "Refuse the credit and cut civilian building instead"
 krcw_chi2_paris_terms_tt:0 "The focus §YLet the Commission Set the Quotas§! will no longer be available; the quotas must be negotiated with the federations."
 krcw_chi2_24_t:0 "The Lowered Targets"
 krcw_chi2_24_d:0 "The Planning Commission lowers the targets for steel, coal and cement. The Revolutionary Committee tells the CEC this is surrender to difficulty, and someone proposes keeping the published figures as they were while working to the new ones internally."
 krcw_chi2_24.a:0 "Publish the new targets openly"
 krcw_chi2_24.b:0 "Keep the published figures as they were"
 krcw_chi2_25_d1:0 "Halfway through the programme the Planning Commission sends inspection teams to the major works. They find that the published figures do not match the internal targets, and that some provinces have inflated their returns. The State Council must decide who runs the second half, and how to deal with the figures."
 krcw_chi2_25_d2:0 "Halfway through the programme the Planning Commission sends inspection teams to the major works. Most of the heavy-industry projects are on time, but the price of cutting civilian building is plain: housing and everyday goods are short in the towns and workers queue for soap and rubber shoes. The State Council must decide who runs the second half."
 krcw_chi2_25_t:0 "The Mid-Plan Inspection"
 krcw_chi2_25_d:0 "Halfway through the programme the Planning Commission sends inspection teams to the major works. Their report goes to the State Council: most of the heavy-industry projects are on time, civilian industry and housing lag far behind, and the ministries never stop wrangling. The council must decide who runs the second half."
 krcw_chi2_25.a:0 "The Planning Commission takes direct charge of the key works"
 krcw_chi2_25.b:0 "Contract the second half to the industrial federations"
 krcw_chi2_25.c:0 "Turn the second half to consumer industry"
 krcw_chi2_26_t:0 "The Director at Anshan"
 krcw_chi2_26_d:0 "The director the Planning Commission has sent to Anshan wants the workers' council confined to welfare, with production decided by him alone. The council refuses, and the Anshan union writes to the Syndicalist Party for help."
 krcw_chi2_26.a:0 "The director is in charge"
 krcw_chi2_26.b:0 "The director and the council share the charge"
 krcw_chi2_27_t:0 "The Federations' Books"
 krcw_chi2_27_d:0 "The industrial federations take on the programme's second half. The old coastal works exceed their quotas and the surplus goes first to the federations' own member works, so the new inland projects often cannot get equipment. The governors of the southwest and northwest jointly complain to the State Council."
 krcw_chi2_27.a:0 "Set up an arbitration board to decide"
 krcw_chi2_27.b:0 "A contract is a contract"
 krcw_chi2_whampoa_tt:0 "Whether the Whampoa Classmates accept the delay to their arms orders depends on their strength and on whether the army is under unified command."
 krcw_chi2_28_t:0 "Vacuum Flasks and Rubber Shoes"
 krcw_chi2_28_d:0 "The second half of the programme turns to bicycles, sewing machines, vacuum flasks and rubber shoes. The cooperative shelves fill and the grumbling in the towns dies down. The Ordnance Department's orders are put back, and the Whampoa generals pound the table at the Military Commission."
 krcw_chi2_28.a:0 "Livelihoods first; the arms orders wait"
 krcw_chi2_28.b:0 "Keep a share back for the Ordnance Department"
 krcw_chi2_plan_central_tt:0 "Unlocks the focus §YFound the Ministry of Heavy Industry§!."
 krcw_chi2_plan_devolved_tt:0 "Unlocks the focus §YThe Federation Councils§!."
 krcw_chi2_plan_consumer_tt:0 "Unlocks the focus §YFound the Light Industry Bureau§! and lets §YThe Consumer Turn§! be skipped."
 krcw_chi_ministry_of_heavy_industry:0 "Found the Ministry of Heavy Industry"
 krcw_chi_ministry_of_heavy_industry_desc:0 "With the Planning Commission running the key works directly, Anshan, Benxi, Wuhan and Baotou come under a new Ministry of Heavy Industry. Steel and equipment move by the balance tables and no province may hold them back."
 krcw_chi_the_federation_councils:0 "The Federation Councils"
 krcw_chi_the_federation_councils_desc:0 "Each industrial federation forms a council of management, workers' committees and the Planning Commission that divides the over-quota output by contract. The new inland works get permanent seats, and the old coastal works can no longer keep the surplus to themselves."
 krcw_chi_light_industry_bureau:0 "Found the Light Industry Bureau"
 krcw_chi_light_industry_bureau_desc:0 "The State Council founds a Light Industry Bureau over textiles, household hardware and food plants. The old Shanghai workshops are folded into local state works and the cooperative shops buy by order."
 krcw_chi_close_the_first_programme:0 "Close the Books on the First Programme"
 krcw_chi_close_the_first_programme_desc:0 "The First Five-Year Programme ends and the Planning Commission reports to the National Assembly. How the report reads depends on who ran the second half: the commission, the federations or the Light Industry Bureau."
 krcw_chi2_29_d1:0 "The Planning Commission's report goes to the National Assembly. Every steelworks and arsenal under the Ministry of Heavy Industry came on stream on time, but the arrears in housing and everyday goods have grown, and the Syndicalist delegates read them out one by one. The delegates are to vote on whether to approve the draft of the second programme."
 krcw_chi2_29_d2:0 "The Planning Commission's report goes to the National Assembly. Most of the part contracted to the federations exceeded its quotas, and the new inland works only caught up after the councils were formed, with several still behind. The delegates are to vote on whether to approve the draft of the second programme."
 krcw_chi2_29_d3:0 "The Planning Commission's report goes to the National Assembly. Steel and rail missed the original targets, but housing and everyday goods in the towns are far easier than when the programme began. The Whampoa delegates say defence was neglected; the association delegates say ordinary people can afford rubber shoes for the first time. The delegates are to vote on whether to approve the draft of the second programme."
 krcw_chi2_29_t:0 "The Programme Report"
 krcw_chi2_29_d:0 "The Planning Commission's report goes to the National Assembly. Steel, coal and railway mileage are several times what they were in 1949, while housing, everyday goods and the new inland works each have arrears. The delegates are to vote on whether to approve the draft of the second programme."
 krcw_chi2_29.a:0 "Approve the draft of the second programme"
 krcw_chi2_29.b:0 "Settle the arrears before the second programme"
 krcw_chi2_plan_heavy:0 "Ministry of Heavy Industry"
 krcw_chi2_plan_prod:0 "Federation Councils"
 krcw_chi_zhou_convalescent:0 "The Chairman on Sick Leave"
 krcw_chi_zhou_convalescent_desc:0 "Zhou convalesces in hospital and at the Tangshan sanatorium, and the papers go out to him once a day. The State Council is chaired by whoever acts for him, but the big decisions still wait for his nod, and much is left pending."
 krcw_chi_collective_leadership:0 "Collective Leadership"
 krcw_chi_collective_leadership_desc:0 "The CEC standing committee takes turns at the daily business, and both the Chairman of the National Government and the President of the Executive Yuan serve fixed terms. Zhou is still the weightiest man in the party, but no longer the only one who can decide."
 krcw_chi2_40_t:0 "Zhou Enlai Falls Ill"
 krcw_chi2_40_d:0 "Zhou Enlai collapses during a State Council meeting and is taken to the Central Hospital. The doctors diagnose heart strain and order several months' rest. Until he returns, someone must chair the State Council."
 krcw_chi2_40.a:0 "The standing committee chairs it together, convened by Chen Gongbo"
 krcw_chi2_40.b:0 "Ask Gu Mengyu of the moderates to act for him"
 krcw_chi2_40.c:0 "Ask Li Jishen to chair the State Council"
 krcw_chi2_41_t:0 "A Month of the Standing Committee"
 krcw_chi2_41_d:0 "The standing committee Chen Gongbo convenes meets daily and the papers move quickly; several of the Construction Commission's big works are approved in the same month. Deng Yanda comes on behalf of the Whampoa Classmates: with the chairman ill, the army wants a guarantee, and the vice-chairman of the Military Commission must be a man the Classmates nominate."
 krcw_chi2_41.a:0 "Grant the Classmates' demand"
 krcw_chi2_41.b:0 "Military appointments wait for the chairman"
 krcw_chi2_42_t:0 "Gu Mengyu Acting"
 krcw_chi2_42_d:0 "Once acting, Gu Mengyu first convenes the Shanghai chambers of commerce and the banks, and then tells the provincial land committees to stop taking new cases. Chen Gongbo and the Revolutionary Committee demand that the standing committee stop him."
 krcw_chi2_42.a:0 "Acting means acting; let him get on with it"
 krcw_chi2_42.b:0 "The standing committee sends someone to sit in and watch"
 krcw_chi2_43_t:0 "Li Jishen's State Council"
 krcw_chi2_43_d:0 "Chairing the State Council, Li Jishen invites the Democratic League and the rural reconstruction group to sit in on the budget debate. Non-party men sit in the council chamber for the first time, and the Revolutionary Committee says a precedent has been set that should not have been."
 krcw_chi2_43.a:0 "Let them sit in"
 krcw_chi2_43.b:0 "The State Council is for Kuomintang members only"
 krcw_chi2_frail_tt:0 "How far Zhou recovers depends on whether he rests enough now."
 krcw_chi2_44_t:0 "The Doctors' Report"
 krcw_chi2_44_d:0 "The doctors at the Central Hospital report that Zhou can go back to work, but his heart is damaged, and if he works the hours he used to, the next attack may kill him. Deng Yingchao asks the CEC to set him a timetable."
 krcw_chi2_44.a:0 "He works as before"
 krcw_chi2_44.b:0 "Half the work; the daily business goes to deputies"
 krcw_chi2_44.c:0 "Three months at a Lushan sanatorium"
 krcw_chi2_statute_tt:0 "The statute needs a CEC vote. Stronger moderates and a party already separated from the state make it likelier to pass; a stronger Revolutionary Committee makes rejection likelier."
 krcw_chi2_45_d1:0 "Zhou returns to the State Council, but everyone can see he has not recovered: by afternoon he must lie down, and his hand shakes when he signs. At his first meeting he raises the succession and wants the CEC to settle it while he can still have his say."
 krcw_chi2_45_d2:0 "Zhou returns to the State Council and Gu Mengyu hands back the papers of his acting term one by one, several of which Zhou will not sign. At his first meeting he raises the succession: this time the country nearly changed course, and he wants the CEC to settle it."
 krcw_chi2_45_t:0 "The Chairman Returns"
 krcw_chi2_45_d:0 "Zhou returns to the State Council and at his first meeting raises the succession: this time he was ill for months and the country nearly had no one who could decide. He wants the CEC to settle it while he can still have his say."
 krcw_chi2_45.a:0 "Draft a collective-leadership statute for the CEC to vote on"
 krcw_chi2_45.b:0 "Zhou names his successor"
 krcw_chi2_45.c:0 "Leave it to the Seventh Congress"
 krcw_chi2_46_t:0 "The Collective-Leadership Statute"
 krcw_chi2_46_d:0 "The CEC passes the collective-leadership statute: the standing committee takes turns at the daily business and the Chairman of the National Government and the President of the Executive Yuan serve fixed terms, renewable once. Zhou is the first to abide by it."
 krcw_chi2_46.a:0 "By the statute"
 krcw_chi2_heir_react_tt:0 "Whether the Whampoa Classmates accept the choice depends on their own strength."
 krcw_chi2_47_t:0 "The Named Successor"
 krcw_chi2_47_d:0 "Zhou decides to name his successor himself, in a letter to the CEC. The CEC may disagree, but no one wants to be the first to rebuff the chairman in public after his illness."
 krcw_chi2_47.a:0 "Chen Gongbo"
 krcw_chi2_47.b:0 "Gu Mengyu"
 krcw_chi2_47.c:0 "Li Jishen"
 krcw_chi2_48_d1:0 "The CEC votes down the collective-leadership statute; the Revolutionary Committee says this is no time to weaken the chairman. Zhou does not raise it again and names no successor. The next leader will be chosen by the CEC the Seventh Congress elects, and the factions are already canvassing in the provincial party branches and the unions."
 krcw_chi2_48_t:0 "Left to the Congress"
 krcw_chi2_48_d:0 "Zhou names no successor and makes no statute. The next leader will be chosen by the CEC the Seventh Congress elects, and the factions are already canvassing in the provincial party branches and the unions."
 krcw_chi2_48.a:0 "Let the factions contend"
 krcw_chi2_succ_inst_tt:0 "Unlocks the focus §YThe Rotating Standing Committee§!; §YThe Committee Endures§! is no longer available."
 krcw_chi2_succ_dauphin_tt:0 "Unlocks the focus §YGroom the Successor§!; §YSeparate Party and State§! is no longer available. The Seventh Congress will lean towards the chairman's choice."
 krcw_chi2_succ_congress_tt:0 "Unlocks the focus §YPrepare the Congress Election§!."
 krcw_chi_rotating_standing_committee:0 "The Rotating Standing Committee"
 krcw_chi_rotating_standing_committee_desc:0 "Under the statute the CEC standing committee changes its chair every six months, and every faction gets a turn. Zhou puts his own name last in the first rotation."
 krcw_chi_groom_the_successor:0 "Groom the Successor"
 krcw_chi_groom_the_successor_desc:0 "The chairman's chosen successor becomes Vice-Chairman of the National Government, with charge of the daily business of planning, foreign affairs and the Military Commission. The ministries' reports go to him before they go to the chairman."
 krcw_chi_prepare_the_congress_election:0 "Prepare the Congress Election"
 krcw_chi_prepare_the_congress_election_desc:0 "The CEC organisation department recalculates the delegate quotas of the provincial branches and the unions, and the Seventh Congress delegates are to be elected from more candidates than seats. Every faction sends people out to fight for places."
 krcw_chi_the_succession_settled:0 "The Succession Arranged"
 krcw_chi_the_succession_settled_desc:0 "The method of succession is settled; what remains is whether it holds on the day Zhou is not in the room."
 krcw_chi2_49_d1:0 "Zhou presides over the National Revolution anniversary before the Sun Yat-sen Mausoleum, his first public appearance since his illness. Behind him stands the whole standing committee, with the rotating chairman at his side. In the next day's photographs no one stands in his place."
 krcw_chi2_49_d2:0 "Zhou presides over the National Revolution anniversary before the Sun Yat-sen Mausoleum, his first public appearance since his illness. His chosen successor stands half a step behind him and reads half the speech for him. The provincial delegates see plainly whom they will report to in future."
 krcw_chi2_49_d3:0 "Zhou presides over the National Revolution anniversary before the Sun Yat-sen Mausoleum, his first public appearance since his illness. Behind him the faction leaders stand in a single row, none a step ahead. Who comes next waits on the ballots of the Seventh Congress."
 krcw_chi2_49_t:0 "Before the Mausoleum"
 krcw_chi2_49_d:0 "Zhou presides over the National Revolution anniversary before the Sun Yat-sen Mausoleum, his first public appearance since his illness. The men standing behind him are what the country will look like next."
 krcw_chi2_49.a:0 "The revolution is not yet complete"
 CHI_krcw_mao_zedong:0 "Mao Zedong"
 CHI_krcw_mao_zedong_desc:0 "From Xiangtan in Hunan, a graduate of the Hunan First Normal School and a student of Yang Changji. In 1918 he founded the Xinmin Study Society in Changsha with Cai Hesen, Xiao Zisheng and others; the next year he edited the Xiangjiang Review, and in the 1920s he ran the Peasant Movement Training Institute in Guangzhou. When Zhao Hengti's provincial army crushed the Autumn Harvest Uprising of 1932 the papers printed his death. In fact he was wounded and peasants carried him out of the Liuyang hills; he made his way to the Min-Gan uprising zone, organised peasant associations for Deng Yanda's Provisional Action Committee, and came back to Nanjing with the revolution. He is the party's most stubborn advocate of redemption and redistribution and of the associations over the county gentry, which sets him against Gu Mengyu's moderates and often against Chen Gongbo's Construction Commission over whether town or country comes first."
 krcw_chi_500_t:0 "The Report from the Hunan Associations"
 krcw_chi_500_d:0 "On the eve of the land-law debate a survey from the Hunan county peasant associations reaches the Legislative Yuan, signed Mao Zedong. The papers printed his death after the Autumn Harvest Uprising failed in 1932; he survived, and has spent the years since organising associations in Min-Gan and Hunan. The report says that rent reduction without redistribution leaves tenants afraid to stand up to the landlords, and that the associations will not last one rent season."
 krcw_chi_500.a:0 "Print it for every legislator and seat him on the land committee."
 krcw_chi_500.b:0 "File it with the land committee for reference."
 krcw_chi_501_d1:0 "Since Nanjing let the Hunan associations arm themselves, their rifles are the strongest thing in the countryside. Mao Zedong asks to go back and oversee the county land committees; the guns must answer to the committees, he says, and the committees to the peasants' assemblies. The moderates and the Whampoa Classmates do not want an armed force outside the Military Commission to gain another leader."
 krcw_chi_501_d2:0 "Nanjing has slowed the land law in Hunan to negotiate with the gentry. Mao Zedong asks to go back and oversee the county land committees; if the talks go on, he says, the gentry will be measuring their own fields. The moderates say the talks have only begun and his arrival would end them."
 krcw_chi_501_t:0 "Back to Hunan"
 krcw_chi_501_d:0 "After the central Hunan landlords burned the survey registers, the security corps moved into the counties. Mao Zedong asks to go back and oversee the county land committees; once the troops leave, he says, the committees will answer to the ancestral halls again. The moderates worry that once he is there the associations will run the counties."
 krcw_chi_501.a:0 "Send him back to oversee it."
 krcw_chi_501.b:0 "Keep him in Nanjing; the committees follow the regulations."
 krcw_chi_502_t:0 "The Hunan Grain Quota"
 krcw_chi_502_d:0 "The Construction Commission has set Hunan's grain quota by what the new Wuhan works need to feed their men. Mao Zedong cables the CEC from Changsha that households who have only just received land cannot pay that much and keep their seed grain. Chen Gongbo answers that if the factories cannot start, there will be no money to honour the land law's redemption bonds either. Zhou Enlai has to come down on one side."
 krcw_chi_502.a:0 "Back Mao and lower the Hunan quota."
 krcw_chi_502.b:0 "Back Chen Gongbo and keep the quota."
 krcw_chi_503_t:0 "The Xiangjiang Review Reprinted"
 krcw_chi_503_d:0 "A Changsha bookshop reprints the 1919 Xiangjiang Review, with a preface by Mao Zedong at the request of Zhou Shizhao and other old members of the Xinmin Study Society. The line from its opening manifesto, \"What is the greatest question in the world? The question of eating\", is going round the Hunan associations again. The moderate papers say a student magazine from thirty years ago is being used to campaign for the land law."
 krcw_chi_503.a:0 "Let the bookshop print it."
