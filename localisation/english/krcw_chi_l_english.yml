l_english:
# krcw: years paced
 krcw_chi_land_law_radical:0 "Land to the Tiller"
 krcw_chi_land_law_radical_desc:0 "The Land Law of 1950 bought out landlords' excess holdings with redemption bonds and redistributed them by household. For the first time the village feels that the revolution is more than a city slogan."
 krcw_chi_land_law_moderate:0 "Rent Reduction and Tenure"
 krcw_chi_land_law_moderate_desc:0 "The moderate version: rents capped at 37.5 percent and tenancy protected by law, but ownership left untouched. The landlords breathe easier; the peasant associations grumble."
 krcw_chi_peasant_associations_sp:0 "Peasant Associations and Cooperatives"
 krcw_chi_peasant_associations_sp_desc:0 "County and township associations run credit unions, seed stations and night schools. The \"peasant-worker policy\" Deng Yanda wrote in Longyan has finally reached the whole country's fields."
 krcw_chi_five_year_programme:0 "First Five-Year Construction Programme"
 krcw_chi_five_year_programme_desc:0 "Drawn up jointly by the National Construction Commission and the industrial federations, the programme is less a decree than a list bargained over by factory committees, provincial bureaus and the technical mission from Paris."
 krcw_chi_second_programme_sp:0 "Second Five-Year Construction Programme"
 krcw_chi_second_programme_sp_desc:0 "The second programme shifts from steel and rails to power, chemicals and technical education. Even its language has changed: \"coordination\" instead of \"quotas\"."
 krcw_chi_three_principles_coops_sp:0 "Three Principles and Cooperatives"
 krcw_chi_three_principles_coops_sp_desc:0 "Nationalism, democracy, livelihood: the Reorganized KMT reads Sun Yat-sen's testament as a programme of cooperative economy and grassroots democracy. The land goes to the peasant associations, the factories to the industrial federations, the counties govern themselves through people's councils, and the party leads from above."
 krcw_chi_party_struggle:0 "Struggle of the Party Lines"
 krcw_chi_party_struggle_desc:0 "The Revolutionary Committee faction and Gu Mengyu's moderates face off in the Central Executive Committee. Every vote is a small battle."
 krcw_chi_moderate_coalition:0 "Moderate Coalition"
 krcw_chi_moderate_coalition_desc:0 "Gu Mengyu's moderates hold the majority in the Central Executive Committee. Reform continues, slower and more genteel, mindful of urban capital and the gentry."
 krcw_chi_revcom_ascendant:0 "Revolutionary Committee Ascendant"
 krcw_chi_revcom_ascendant_desc:0 "Zhou Enlai's Revolutionary Committee holds the key posts in party, state and army. Nanjing's tempo quickens, and the silence of its critics deepens."
 krcw_chi_clean_government:0 "Rectified Administration"
 krcw_chi_clean_government_desc:0 "Circuit inspectors of the Control Yuan descend on county seats to audit, hear complaints and dismiss officials. The old rules of officialdom are crumbling bit by bit."
 krcw_chi_peoples_councils:0 "County and Township Councils"
 krcw_chi_peoples_councils_desc:0 "Councils elected by peasant associations, unions and cooperatives begin to review local budgets: the first step, as Zhou puts it, \"from tutelage to constitutional rule\"."
 krcw_chi_mass_literacy_sp:0 "Mass Literacy Movement"
 krcw_chi_mass_literacy_sp_desc:0 "Night schools, reading circles and mobile libraries: the old Ding County experiment is now carried to four hundred million people by the state."
 krcw_chi_warlord_buyout:0 "Buying Out the Strongmen"
 krcw_chi_warlord_buyout_desc:0 "Nanjing trades pensions, honorary posts and company shares for the strongmen's private armies and tax farms. Expensive, but cheaper than war."
 krcw_chi_warlord_crackdown:0 "Breaking the Strongmen by Force"
 krcw_chi_warlord_crackdown_desc:0 "Central troops march into the strongmen's garrisons. An undeclared civil war in which every disarmament can turn into a firefight."
 krcw_chi_unified_command_sp:0 "Unified Military Command"
 krcw_chi_unified_command_sp_desc:0 "The last unit bearing a provincial designation has been reorganized. For the first time the National Revolutionary Army is truly the nation's army."
 krcw_chi_french_advisors:0 "Commune Military Mission"
 krcw_chi_french_advisors_desc:0 "The military mission from Paris runs staff courses in Nanjing, Wuhan and Shenyang, bringing the lessons of mechanized war, and a certain disdain for militia traditions."
 krcw_chi_modern_nra_sp:0 "Modernized NRA"
 krcw_chi_modern_nra_sp_desc:0 "The veterans of Liaoxi now drive trucks and command artillery battalions. The NRA has transformed from an infantry host into a combined-arms force."
 krcw_chi_republican_navy_sp:0 "Republican Navy"
 krcw_chi_republican_navy_sp_desc:0 "Chen Shaokuan's navy grew from a river flotilla; now it plans a seagoing fleet. The slipways of the Jiangnan yard never rest."
 krcw_chi_strait_tension:0 "Strait Tension"
 krcw_chi_strait_tension_desc:0 "Guns and radars face each other across the Taiwan Strait. Fujian fishermen know that one patrol boat could start a war."
 krcw_chi_strait_status_quo:0 "The Strait Status Quo"
 krcw_chi_strait_status_quo_desc:0 "Nanjing declares that the future of the Taiwanese people should be decided by the Taiwanese themselves. Until that day, the navy guards but does not strike."
 krcw_chi_paris_clearing_union:0 "Paris Clearing Union Member"
 krcw_chi_paris_clearing_union_desc:0 "Through the Paris Clearing Union, Hankou mills settle for British machine tools, Italian motors and Canadian wheat in syndicalist francs. China plugs into a workers' world market."
 krcw_chi_transnational_federations_sp:0 "Transnational Industrial Federations"
 krcw_chi_transnational_federations_sp_desc:0 "The Wuhan Steel Federation has joined the Asian branch of the International Metallurgical Federation; engineers and worker delegates rotate between Lyon, Manchester and Anshan."
 krcw_chi_lhasa_guarantee:0 "Honoring the Lhasa Agreement"
 krcw_chi_lhasa_guarantee_desc:0 "Nanjing reaffirms that Tibet's present system and the Kashag's powers will not change, and that any reform awaits the Tibetans' own consent. The Lhasa nobles have one less reason to rebel."
 krcw_chi_tibet_reform_drive:0 "Pressing Reform in Tibet"
 krcw_chi_tibet_reform_drive_desc:0 "Nanjing sends work teams to introduce rent reduction and schools in Tibet. The nobles read it as a death sentence for the Lhasa Agreement."
 krcw_chi_himalayan_defense_sp:0 "Himalayan Defense"
 krcw_chi_himalayan_defense_sp_desc:0 "Outposts watch every pass from Ngari to Zayü. The Indian princes know that crossing the snows will not be easy."
 krcw_chi_asian_detente_sp:0 "Asian Détente"
 krcw_chi_asian_detente_sp_desc:0 "The first diplomatic hotlines link Nanjing, Tokyo and New Delhi. The front lines are still wired, but people have begun to speak of \"coexistence\"."
 krcw_chi_republic_consolidated:0 "The Revolution Carries On"
 krcw_chi_republic_consolidated_desc:0 "Land law, construction programmes, a unified army and local councils. Zhou has Sun Yat-sen's last words carved above the new assembly hall: \"The revolution is not yet complete; comrades, keep striving.\""
 krcw_kor_land_reform_sp:0 "Korean Land Reform"
 krcw_kor_land_reform_sp_desc:0 "The Oriental Development Company's colonial estates have been confiscated and distributed; Korean farmers own their paddies for the first time."
 krcw_kor_national_army_sp:0 "Korean National Army"
 krcw_kor_national_army_sp_desc:0 "Veterans of the Korean Volunteer Corps form the backbone of the National Army; many officers are Whampoa graduates."
 krcw_kor_own_line_sp:0 "Korea's Own Line"
 krcw_kor_own_line_sp_desc:0 "Seoul now stresses that the Korean Republic is a brother, not a vassal."
 krcw_kor_reconstruction_sp:0 "Three-Year Reconstruction Plan"
 krcw_kor_reconstruction_sp_desc:0 "The Hungnam fertilizer works, the Sup'ung dam and the Seoul-Busan railway are the three pillars of the reconstruction plan."
 krcw_vin_national_front_sp:0 "Vietnamese National Front"
 krcw_vin_national_front_sp_desc:0 "Nguyễn An Ninh has drawn the League, the Buddhist associations, the Cao Đài faithful and the southern unions into one front."
 krcw_vin_rice_cooperatives_sp:0 "Rice Cooperatives"
 krcw_vin_rice_cooperatives_sp_desc:0 "Mekong Delta tenants have taken back the French plantations' paddies through cooperatives."
 krcw_vin_peoples_army_sp:0 "Giáp's People's Army"
 krcw_vin_peoples_army_sp_desc:0 "Võ Nguyên Giáp believes Vietnam's wars must be fought the Vietnamese way."
 krcw_vin_equal_partner_sp:0 "Equal Partner"
 krcw_vin_equal_partner_sp_desc:0 "Hanoi and Nanjing sign a new treaty: advisors leave the ministries, military cooperation passes to a joint commission."
 krcw_br_chinese_advisors_sp:0 "Chinese Advisory Mission"
 krcw_br_chinese_advisors_sp_desc:0 "Engineers, teachers and officers from Nanjing help the young republic build a state. Indispensable, and often resented."
 krcw_br_traditional_compromise:0 "Compromise with Tradition"
 krcw_br_traditional_compromise_desc:0 "Monasteries, royal courts and hereditary chiefs are folded into the new order: stripped of privilege, left with dignity."
 krcw_br_self_reliance_sp:0 "Self-Reliance"
 krcw_br_self_reliance_sp_desc:0 "The republic now runs its own government and army. Its relationship with Nanjing turns from guardianship into alliance."
 CHI_krcw_chen_gongbo:0 "Chen Gongbo"
 CHI_krcw_gu_mengyu:0 "Gu Mengyu"
 CHI_krcw_song_qingling:0 "Soong Ching-ling"
 CHI_krcw_li_jishen:0 "Li Jishen"
 CHI_krcw_deng_yanda:0 "Deng Yanda"
 CHI_krcw_chen_gongbo_desc:0 "Leader and chief theorist of the Reorganisation Comrades Association's radical wing. He brought the radicals over to Zhou Enlai in 1946 and now sits on the CEC standing committee and chairs the Construction Commission, which is drafting the first five-year programme."
 CHI_krcw_gu_mengyu_desc:0 "Leader of the Reorganisation Comrades Association's moderate wing, an economist from Peking University. He lost the 1946 contest to Zhou Enlai but remains the man most trusted by chambers of commerce, intellectuals and the provincial gentry."
 krcw_chi_sixth_congress:0 "The Sixth National Congress"
 krcw_chi_sixth_congress_desc:0 "In spring 1949 the reorganised Kuomintang holds its Sixth National Congress in Nanjing. The Northern Expedition is over, and the land, industry, the army and the party itself all have to be rebuilt."
 krcw_chi_draft_land_law:0 "Draft the Land Law"
 krcw_chi_draft_land_law_desc:0 "\"Land to the tiller\" has been in the party programme for twenty-five years. Now the Legislative Yuan's land committee must answer concrete questions: whose land, for whom, and with what compensation?"
 krcw_chi_county_land_committees:0 "County Land Committees"
 krcw_chi_county_land_committees_desc:0 "The Land Law will succeed or fail not in Nanjing but in two thousand county seats. Each county forms a land committee of peasant delegates, officials and surveyors to measure fields, register deeds and settle disputes."
 krcw_chi_peasant_associations:0 "Peasant Associations and Cooperatives"
 krcw_chi_peasant_associations_desc:0 "Farmers with new land still need seed, oxen and credit. The associations turn mutual-aid teams into cooperatives; Deng Yanda's theory of the \"commoners' revolution\" finally takes on flesh."
 krcw_chi_rural_credit:0 "Rural Credit Cooperatives"
 krcw_chi_rural_credit_desc:0 "Usury was the countryside's strongest chain. County credit cooperatives replace the moneylenders with cheap loans; for the first time a farmer can borrow for fertilizer without pawning his daughter to the landlord."
 krcw_chi_mass_literacy:0 "Mass Literacy Movement"
 krcw_chi_mass_literacy_desc:0 "The same sentence is chalked on every night-school blackboard: \"To read is to stand up.\" Tens of thousands of students, teachers and demobilized soldiers go to the villages to teach."
 krcw_chi_harness_the_huai:0 "Harness the Huai"
 krcw_chi_harness_the_huai_desc:0 "The Huai floods nine years in ten. Engineers, peasant labor brigades and French hydrological advisors plan the great works together: reservoirs, spillways and new canals."
 krcw_chi_construction_commission:0 "National Construction Commission"
 krcw_chi_construction_commission_desc:0 "In his Plan for National Reconstruction Sun Yat-sen imagined a hundred thousand miles of railway and a great eastern port. The Construction Commission must turn those dreams into buildable drawings."
 krcw_chi_first_programme:0 "First Five-Year Construction Programme"
 krcw_chi_first_programme_desc:0 "The first five-year programme starts in 1950 with steel, coal, railways and power, its targets negotiated between the state, the provincial construction offices and the industrial federations."
 krcw_chi_anshan_steel:0 "Anshan Iron and Steel Combine"
 krcw_chi_anshan_steel_desc:0 "Half the blast furnaces the Japanese left behind were blown up. On the ruins, Anshan's workers' council and engineers build China's first integrated steel combine."
 krcw_chi_trunk_railways:0 "Draw Up the Trunk Railway Plan"
 krcw_chi_trunk_railways_desc:0 "The Ministry of Railways draws up the national trunk-line plan: double-track the old Beijing-Hankou and Tianjin-Pukou lines first, then build new lines to the southwest and northwest. The rails have to be fought for against Anshan's other customers."
 krcw_chi_wuhan_base:0 "Wuhan Industrial Base"
 krcw_chi_wuhan_base_desc:0 "The three cities of Wuhan lie at China's heart. The Hanyang arsenal, the Wuchang machine works and the new Yangtze bridge make it the hub of inland industry."
 krcw_chi_yangtze_power:0 "Power on the Yangtze"
 krcw_chi_yangtze_power_desc:0 "Power is the precondition of all construction. New plants in Chongqing, Yichang and Shanghai let the factories run through the night."
 krcw_chi_join_clearing_union:0 "Join the Paris Clearing Union"
 krcw_chi_join_clearing_union_desc:0 "The Paris Clearing Union spares syndicalist states from settling in dollars or gold. Joining means China's silk, tung oil and tungsten can be traded directly for European machine tools and patents."
 krcw_chi_transnational_federations:0 "Transnational Industrial Federations"
 krcw_chi_transnational_federations_desc:0 "The unions of Wuhan steel, Shanghai textiles and Fushun coal join the international industrial federations. Technology is no longer a secret but a gift exchanged among workers."
 krcw_chi_second_programme:0 "Second Five-Year Construction Programme"
 krcw_chi_second_programme_desc:0 "The first programme overfulfilled its steel targets but left light industry and rural power behind. The second must correct the imbalance."
 krcw_chi_technical_universities:0 "Technical Universities and Academies"
 krcw_chi_technical_universities_desc:0 "Tsinghua, Jiaotong and the new Wuhan Institute of Technology train tens of thousands of engineers a year; Academia Sinica sets up exchanges with the Commune's Academy of Sciences."
 krcw_chi_atomic_research:0 "Institute of Atomic Energy"
 krcw_chi_atomic_research_desc:0 "The French bomb of 1950 shook the world. Nanjing asks Paris to help found an atomic institute: for power, and so that no one can blackmail China with the bomb."
 krcw_chi_line_struggle:0 "The Struggle of Lines"
 krcw_chi_line_struggle_desc:0 "The Revolutionary Committee and Chen Gongbo's radicals want faster land reform and industrialization; Gu Mengyu's moderates want \"stability first\". The contest of 1946 never really ended: it just moved into the Central Executive Committee's meeting room."
 krcw_chi_revcom_line:0 "The Revolutionary Committee Line"
 krcw_chi_revcom_line_desc:0 "Zhou Enlai's Revolutionary Committee line prevails: a thorough land law, fast construction, a party rooted in the masses. Chen Gongbo's Construction Commission takes charge of the programme, and Gu Mengyu keeps his government post for the sake of party unity."
 krcw_chi_moderate_line:0 "The Moderate Coalition Line"
 krcw_chi_moderate_line_desc:0 "Zhou concedes to the moderates: Gu Mengyu becomes President of the Executive Yuan and the Legislative Yuan will set the pace of reform. The chambers of commerce cheer; peasant delegates sigh in the corridors."
 krcw_chi_control_yuan:0 "Control Yuan Circuit Inspections"
 krcw_chi_control_yuan_desc:0 "The censorial power of Sun Yat-sen's five-power constitution finally grows teeth. Circuit inspectors may seize county ledgers and dismiss corrupt magistrates on the spot."
 krcw_chi_three_principles_coops:0 "Three Principles and Cooperatives"
 krcw_chi_three_principles_coops_desc:0 "The Reorganized KMT's theorists annotate the Three Principles anew: nationalism as anti-imperialism and equality of peoples, democracy as local councils and union self-rule, livelihood as cooperatives and coordinated planning."
 krcw_chi_youth_league:0 "Reorganize the Youth League"
 krcw_chi_youth_league_desc:0 "The Youth League is no longer the party's honor guard but a shock force for village literacy and factory night schools: the cradle of tomorrow's cadres."
 krcw_chi_county_councils:0 "County and Township Councils"
 krcw_chi_county_councils_desc:0 "Zhou announces the end of tutelage at county level: each county will have a people's council chosen by the peasant associations, unions and cooperatives, with power over the budget and the magistrate. Old Revolutionary Committee cadres fear the gentry will take the counties back."
 krcw_chi_emergency_powers:0 "Emergency Powers Ordinance"
 krcw_chi_emergency_powers_desc:0 "Strongmen within, enemies without: the party hardliners want tutelage extended indefinitely and the country ruled by CEC ordinance. There will be order; freedom will have to wait."
 krcw_chi_revolution_carries_on:0 "The Revolution Is Not Yet Complete"
 krcw_chi_revolution_carries_on_desc:0 "The land has been distributed, the first programme's steelworks are producing and the army is united. The CEC declares the first stage of national construction complete and turns to consolidating the state and to defence."
 krcw_chi_ti_crisis_down3_tt:0 "Internationale bloc crisis §G-3§!"
 krcw_chi_ti_crisis_down2_tt:0 "Internationale bloc crisis §G-2§!"
 krcw_chi_warlord_question:0 "Deal with the Provincial Strongmen"
 krcw_chi_warlord_question_desc:0 "Yan Xishan, Bai Chongxi, Hu Zongnan: the generals who joined the Expedition still hold their own armies and revenues. For the nation to be one, these states within the state must go. The question is: gold or guns?"
 krcw_chi_buy_out_strongmen:0 "Buyout and Resettlement"
 krcw_chi_buy_out_strongmen_desc:0 "Give them pensions, honorary posts, company shares and a dignified exit. Costly, but every general who gives up his troops is a civil war avoided."
 krcw_chi_break_strongmen:0 "Break Them by Force"
 krcw_chi_break_strongmen_desc:0 "Central divisions, trained by French advisors, march into the provincial garrisons with a deadline to disarm. Those who refuse will be treated as rebels."
 krcw_chi_reorganize_provincial_armies:0 "Reorganize the Provincial Armies"
 krcw_chi_reorganize_provincial_armies_desc:0 "Provincial units are broken up, reorganized, and given uniform designations and pay. Veterans may stay on or demobilize with a land grant."
 krcw_chi_unified_command:0 "Unify the Military Command"
 krcw_chi_unified_command_desc:0 "When the last strongman surrenders his seal, the Military Affairs Commission proclaims: from today, China has only one army."
 krcw_chi_army_reform:0 "Reform the National Revolutionary Army"
 krcw_chi_army_reform_desc:0 "The NRA grew up in war: brave, seasoned, yet motley in equipment and bloated in establishment. The reform commission under Ye Ting and Xue Yue must write the prescription."
 krcw_chi_whampoa_reborn:0 "The New Whampoa"
 krcw_chi_whampoa_reborn_desc:0 "Whampoa moves to the foot of Purple Mountain. Its syllabus covers staff work alongside the Three Principles and peasant organizing. \"The gun obeys the party; the party obeys the people.\""
 krcw_chi_commune_military_mission:0 "The Commune Military Mission"
 krcw_chi_commune_military_mission_desc:0 "Paris sends a military mission led by protégés of Joseph Putz, bringing the lessons of the Rhine campaign and the blueprints of French tanks and trucks."
 krcw_chi_arsenals:0 "Standardize the Arsenals"
 krcw_chi_arsenals_desc:0 "The arsenals of Hanyang, Gongxian, Shenyang and Taiyuan each made their own rifles. Now they will share calibers, drawings and parts."
 krcw_chi_mechanized_corps:0 "The Mechanized Corps"
 krcw_chi_mechanized_corps_desc:0 "Liaoxi proved one thing: whoever has trucks owns the North China plain. The First Mechanized Corps forms at Xuzhou."
 krcw_chi_republican_air_force:0 "The Republican Air Force"
 krcw_chi_republican_air_force_desc:0 "The Jianqiao flying school expands and the Nanchang aircraft works begin licensed production of French jet fighters."
 krcw_chi_modern_nra:0 "A Modern NRA"
 krcw_chi_modern_nra_desc:0 "The reform is done: infantry divisions trimmed by a third, and every corps now has its own artillery and motor regiments. The Liaoxi veterans become the new army's instructors."
 krcw_chi_republican_navy:0 "Rebuild the Republican Navy"
 krcw_chi_republican_navy_desc:0 "The 1944 Qingdao Armistice left Taiwan to Japan only because the NRA could not cross the sea. Chen Shaokuan swears the humiliation will never be repeated."
 krcw_chi_jiangnan_yard:0 "Expand the Jiangnan Yard"
 krcw_chi_jiangnan_yard_desc:0 "The Jiangnan yard in Shanghai, the Mawei yard at Fuzhou and the Qingdao yard all expand. For the first time China can build its own destroyers."
 krcw_chi_strait_patrols:0 "Strait Patrols"
 krcw_chi_strait_patrols_desc:0 "The Fujian squadron begins patrolling the strait's median line. Every encounter with a Japanese patrol boat is a test of nerves."
 krcw_chi_blue_water:0 "The Blue-Water Programme"
 krcw_chi_blue_water_desc:0 "Modeled on the British Federation's red fleet, the navy plans cruisers and escort squadrons: for Taiwan, and for the South China Sea lanes."
 krcw_chi_taiwan_self_determination:0 "Contact the Taiwanese Underground"
 krcw_chi_taiwan_self_determination_desc:0 "Nanjing makes contact with the wing of the Taiwan Cultural Association and the People's Party that wants armed resistance to Japan, and supplies money and radios. If war comes they can cut communications and pass intelligence from inside the island. The Association's moderates fear it will end their petitions to Tokyo for self-rule."
 krcw_chi_taiwan_support_15_tt:0 "Strength of the Taiwanese underground §G+15§!"
 krcw_chi_prepare_liberation:0 "Prepare to Liberate Taiwan"
 krcw_chi_prepare_liberation_desc:0 "Marines rehearse landings on the Fujian coast and the staff drafts Operation Penghu. Tokyo has noticed; Moscow is watching too."
 krcw_chi_operation_penghu:0 "Approve the Penghu Operation Plan"
 krcw_chi_operation_penghu_desc:0 "The Military Affairs Commission approves the plan for the crossing: take the Penghu Islands as a stepping stone, then land on Taiwan's west coast. The troops, ships and airfields are in place; the State Council will decide when the war begins."
 krcw_chi_taiwan_ready_tt:0 "Unlocks the decision §YCross the Strait to Retake Taiwan§!."
 krcw_chi_paris_delegation:0 "The Delegation to Paris"
 krcw_chi_paris_delegation_desc:0 "The old friends of Wang Jingwei's Paris exile are now Commune ministers and federation chairmen. Nanjing sends a delegation under Soong Ching-ling to discuss credit, technology and China's voice in the Internationale."
 krcw_chi_asian_bureau:0 "The Internationale's Asian Bureau"
 krcw_chi_asian_bureau_desc:0 "Nanjing asks for an Asian Bureau within the Internationale's executive, chaired by China. Paris agrees, on condition that it be open to all members."
 krcw_chi_scientific_exchange:0 "Sino-French Scientific Exchange"
 krcw_chi_scientific_exchange_desc:0 "A thousand Chinese students go to France each year and hundreds of French professors lecture in Nanjing, Peiping and Wuhan. The old work-study tradition lives again in a new form."
 krcw_chi_asian_detente:0 "Set Up the Asian Bureau Intelligence Office"
 krcw_chi_asian_detente_desc:0 "The Asian Bureau sets up a joint intelligence office in Nanjing, where China and the brother republics share the lists of Russian and Japanese agents and coordinate arrests. Paris asks for the full lists; Nanjing sends summaries."
 krcw_chi_ti_crisis_down4_tt:0 "Internationale bloc crisis §G-4§!"
 krcw_chi_brother_republics:0 "Conference of the Brother Republics"
 krcw_chi_brother_republics_desc:0 "Delegates of Korea, Vietnam, Cambodia, Laos and Burma gather in Nanjing. They are grateful for China's help, and all want to know who, among brothers, has the final word."
 krcw_chi_korean_alliance:0 "Sino-Korean Treaty of Alliance"
 krcw_chi_korean_alliance_desc:0 "Kim Won-bong and Zhou Enlai are old Whampoa classmates. The new treaty provides for joint training and common defense against Japan."
 krcw_chi_equal_treaties:0 "Equal Treaties"
 krcw_chi_equal_treaties_desc:0 "Sun Yat-sen spent his life fighting unequal treaties; the Republic cannot repeat the Powers' sins against its brothers. Nanjing withdraws advisors from the ministries and widens each republic's autonomy."
 krcw_chi_guided_republics:0 "Expand the Advisory Missions"
 krcw_chi_guided_republics_desc:0 "Hardliners argue the young republics are too fragile to survive without China's guardianship; Japan or India would swallow them. The advisors stay, and grow in number."
 krcw_chi_asian_development_fund:0 "Asian Development Fund"
 krcw_chi_asian_development_fund_desc:0 "Nanjing, Hanoi and Seoul jointly fund dams and roads on the Mekong, the Irrawaddy and the Yalu. Aid becomes investment; investment becomes shared interest."
 krcw_chi_tibet_policy:0 "Tibet Policy"
 krcw_chi_tibet_policy_desc:0 "The 1947 Lhasa Agreement recognized the Kashag's high autonomy. Indian and Russian agents move among Lhasa's nobility. Nanjing must decide: keep the agreement, or push reform?"
 krcw_chi_honor_lhasa:0 "Honor the Lhasa Agreement"
 krcw_chi_honor_lhasa_desc:0 "Nanjing reaffirms that Tibet's present system stands. The center keeps only a representative in Lhasa, and no work teams. Reform must await the Tibetans themselves."
 krcw_chi_reform_tibet:0 "Press Reform in Tibet"
 krcw_chi_reform_tibet_desc:0 "Serfdom and corvée have no place in a revolutionary republic. Nanjing sends work teams to open schools and clinics and push rent reduction, whether the Kashag agrees or not."
 krcw_chi_himalayan_defense:0 "Himalayan Defense"
 krcw_chi_himalayan_defense_desc:0 "Build roads and depots in Xikang and Qinghai and train mountain troops. If Lhasa erupts, relief must arrive within two weeks."
 krcw_chi_tibet_settlement:0 "Conclude a New Compact with Lhasa"
 krcw_chi_tibet_settlement_desc:0 "Whatever became of the revolt, Nanjing and Lhasa need a new compact: wider autonomy, an unchanged system, and a frontier outsiders cannot pry open."
 krcw_chi_revolt_down_tt:0 "Tibetan revolt progress §G-10§!"
 krcw_chi_revolt_up_tt:0 "Tibetan revolt progress §R+20§!"
 krcw_brother_more_autonomy:0 "Toward Self-Rule"
 krcw_brother_closer_ties:0 "Closer Brotherhood"
 krcw_kor_republic_restored:0 "Consolidate the Korean Republic"
 krcw_kor_republic_restored_desc:0 "Five years since thirty-five years of colonial rule ended. The assembly sits in the old Government-General building, the taegukgi flying before it. Kim Won-bong's National Revolutionary Party must prove that an independent Korea can do better than a colony."
 krcw_kor_land_reform:0 "Confiscate the Colonial Estates"
 krcw_kor_land_reform_desc:0 "The Oriental Development Company and Japanese landlords left behind forty percent of the arable land. The assembly votes to hand it free of charge to those who till it."
 krcw_kor_reconstruction:0 "Three-Year Reconstruction Plan"
 krcw_kor_reconstruction_desc:0 "The Hungnam fertilizer works, the Sup'ung dam, the Seoul-Busan railway: the colonial industrial skeleton, sabotaged by the retreating Japanese, must now be repaired by Koreans."
 krcw_kor_hungnam:0 "The Hungnam Industrial Zone"
 krcw_kor_hungnam_desc:0 "Hungnam's chemical plants resume production; fertilizer flows south to the rice paddies."
 krcw_kor_gyeongbu:0 "Double-Track the Gyeongbu Line"
 krcw_kor_gyeongbu_desc:0 "From Busan to Seoul and on to Sinuiju, the railway is the peninsula's spine."
 krcw_kor_busan_yards:0 "The Busan Yards"
 krcw_kor_busan_yards_desc:0 "Busan's slipways begin building for the navy and the fishing cooperatives."
 krcw_kor_national_army:0 "The Korean National Army"
 krcw_kor_national_army_desc:0 "The Volunteer Corps, the Liberation Army and the local guerrillas merge into the National Army, with Ji Cheong-cheon as chief of staff and Kim Mu-chong as deputy commander."
 krcw_kor_whampoa_officers:0 "The Whampoa Officer Corps"
 krcw_kor_whampoa_officers_desc:0 "Many of the army's officers are Whampoa graduates; Nanjing sends new instructors to help found the Seoul Military Academy."
 krcw_kor_coastal_defense:0 "East Coast Defense"
 krcw_kor_coastal_defense_desc:0 "Japan lies just across the Tsushima Strait. The coastal batteries at Busan and Wonsan must be rebuilt."
 krcw_kor_joint_command:0 "Sino-Korean Joint Command"
 krcw_kor_joint_command_desc:0 "The two armies hold joint exercises on both banks of the Yalu and set up a common command and signals network."
 krcw_kor_line_question:0 "Seoul and Nanjing"
 krcw_kor_line_question_desc:0 "Korea is deeply grateful to China, but it is a nation that has known the loss of its sovereignty. Some would bind Seoul's fate to Nanjing's; others warn that \"elder brother\" already implies a hierarchy."
 krcw_kor_brotherhood:0 "Brothers of One Heart"
 krcw_kor_brotherhood_desc:0 "Kim Won-bong binds Seoul to Nanjing: Korea will be the Internationale's staunchest member in Northeast Asia."
 krcw_kor_own_line:0 "Korea's Own Line"
 krcw_kor_own_line_desc:0 "Korea is a brother, not a vassal. Seoul demands a new equal treaty with Nanjing and its own vote in the Internationale."
 krcw_kor_national_assembly:0 "National Assembly Elections"
 krcw_kor_national_assembly_desc:0 "The National Revolutionary Party, the Korea Independence Party and the farmers' unions contest the vote: the first time Koreans vote on their own soil."
 krcw_kor_hangul_schools:0 "Hangul Schools"
 krcw_kor_hangul_schools_desc:0 "Hangul, banned under colonial rule, returns to the classroom. National literacy is achieved within five years."
 krcw_kor_japan_question:0 "Set the Japan Policy"
 krcw_kor_japan_question_desc:0 "Tokyo's revanchists openly demand Korea back, and the Japanese army rehearses landings on Tsushima every year. The assembly makes defence against Japan the first priority, with the army and coastal defences first in the budget."
 krcw_kor_straits_treaty:0 "Draw Up the Peninsula Defence Plan"
 krcw_kor_straits_treaty_desc:0 "The General Staff expects Japanese landings at Busan and Incheon at once, and plans to hold the Nakdong and Han river lines until Chinese reinforcements arrive. Ji Cheong-cheon wants a larger army; the finance ministry says the money only stretches to fortifications."
 krcw_kor_seoul_industry:0 "The Seoul Industrial Belt"
 krcw_kor_seoul_industry_desc:0 "Textile, machinery and electronics plants along the Han make Seoul a rising star of Northeast Asia's syndicalist economy."
 krcw_kor_asian_bureau:0 "Take the Asian Bureau Vice-Chair"
 krcw_kor_asian_bureau_desc:0 "Korea's delegate becomes vice-chair of the Internationale's Asian Bureau. Seoul becomes a bridge between Nanjing and Paris."
 krcw_kor_republic_at_ten:0 "Mark the Fifteenth Year"
 krcw_kor_republic_at_ten_desc:0 "Fifteen years on, the Korean Republic has its own industry, army and parliament. It can stand straight and speak as an equal to anyone."
 krcw_vin_our_revolution:0 "Take Vietnam's Own Road"
 krcw_vin_our_revolution_desc:0 "The Vietnamese took their country back from the French, with much help from Chinese volunteers. But Nguyễn An Ninh never lets his comrades forget: it was Vietnamese who took Hanoi. Vietnam's revolution will follow Vietnam's road."
 krcw_vin_national_front:0 "The National Front"
 krcw_vin_national_front_desc:0 "The Revolutionary League, the Buddhist associations, Cao Đài, Hòa Hảo and the southern unions: Ninh wants all of them in one front."
 krcw_vin_rice_cooperatives:0 "Rice Cooperatives"
 krcw_vin_rice_cooperatives_desc:0 "Tenant cooperatives take over the plantations' paddies; the Saigon rice merchants no longer decide who eats."
 krcw_vin_three_regions:0 "Unify the Administration"
 krcw_vin_three_regions_desc:0 "The French ruled Vietnam in three pieces. The new constitution must make the three regions one nation while respecting the South's particularities."
 krcw_vin_haiphong:0 "The Port of Haiphong"
 krcw_vin_haiphong_desc:0 "Haiphong is Vietnam's gate to the world; the Paris Clearing Union's freighters unload machine tools here."
 krcw_vin_hanoi_saigon_rail:0 "The Transindochinois"
 krcw_vin_hanoi_saigon_rail_desc:0 "The railway from Hanoi to Saigon is complete; the three regions are finally joined."
 krcw_vin_industry:0 "Hand the Mills to Workers' Councils"
 krcw_vin_industry_desc:0 "The Nam Định textile mill and Saigon's machine shops pass to workers' committees; output doubles in two years."
 krcw_vin_peoples_army:0 "Form the People's Army"
 krcw_vin_peoples_army_desc:0 "Giáp distrusts borrowed doctrines. Vietnam's army will fight in jungle and mountain, and it will rely on militias and the people."
 krcw_vin_jungle_doctrine:0 "Jungle Doctrine"
 krcw_vin_jungle_doctrine_desc:0 "The lessons of the Việt Bắc base years are written into the new infantry manual."
 krcw_vin_militia:0 "Village Militias"
 krcw_vin_militia_desc:0 "Every village has its self-defense team: the army's reserve and the revolution's eyes."
 krcw_vin_hanoi_nanjing:0 "Hanoi and Nanjing"
 krcw_vin_hanoi_nanjing_desc:0 "Chinese advisors still sit in every Hanoi ministry. Some are grateful, some resentful: did Vietnam defeat the French only to acquire a new \"protector\"?"
 krcw_vin_equal_partner:0 "Renegotiate the Treaty with Nanjing"
 krcw_vin_equal_partner_desc:0 "Ninh negotiates a new treaty: advisors leave the ministries, cooperation passes to joint commissions. Vietnam stays in the Internationale, as an equal."
 krcw_vin_closer_to_nanjing:0 "Lean on Nanjing"
 krcw_vin_closer_to_nanjing_desc:0 "The League's pro-Chinese wing believes Vietnam will not survive the next war without China's aid."
 krcw_vin_constitution:0 "The Constitution of the Vietnamese Republic"
 krcw_vin_constitution_desc:0 "The National Congress adopts a constitution: equality of the three regions, freedom of religion, a cooperative economy and a parliament elected by universal suffrage."
 krcw_vin_buddhist_dialogue:0 "Dialogue with the Sangha"
 krcw_vin_buddhist_dialogue_desc:0 "The monks of Huế fear a secular revolution will strike at the pagodas. The government and the Buddhist General Association agree: land reform will spare temple lands, and monks may stand for office."
 krcw_vin_indochina_federation:0 "Indochinese Cooperation Council"
 krcw_vin_indochina_federation_desc:0 "Propose a cooperation council of Vietnam, Cambodia and Laos to develop the Mekong together."
 krcw_vin_mekong:0 "Developing the Mekong"
 krcw_vin_mekong_desc:0 "Canals and dikes in the Delta double the rice harvest; Vietnam becomes one of Asia's granaries."
 krcw_vin_giap_academy:0 "Đà Lạt Military Academy"
 krcw_vin_giap_academy_desc:0 "The old colonial officers' school becomes the People's Army command college."
 krcw_vin_independent_voice:0 "Vote Independently at the Congress"
 krcw_vin_independent_voice_desc:0 "Vietnam votes against Nanjing at the Internationale congress. Paris is surprised, Nanjing displeased, Hanoi exhilarated."
 krcw_vin_republic_matures:0 "Put Relations with China on an Equal Footing"
 krcw_vin_republic_matures_desc:0 "The Vietnamese Republic now chooses its own road. Its friendship with China rests henceforth on equality."
 krcw_vin_giap_offensive_doctrine:0 "Mobile Warfare Manual"
 krcw_vin_giap_offensive_doctrine_desc:0 "At Đà Lạt Giáp lectures on his theory of mobile war: concentrate, maneuver, outpace."
 krcw_br_liberated:0 "Form the Republican Government"
 krcw_br_liberated_desc:0 "Chinese volunteers and local independence fighters toppled colonial rule together. Now a people who never had a modern state must build a government within a few years."
 krcw_br_constituent_assembly:0 "Constituent Assembly"
 krcw_br_constituent_assembly_desc:0 "Delegates from every region and people meet in the capital to draft the first constitution."
 krcw_br_chinese_advisors:0 "The Chinese Advisory Mission"
 krcw_br_chinese_advisors_desc:0 "Nanjing sends engineers, teachers and officers to help build ministries, schools and an army."
 krcw_br_tradition:0 "Compromise with Tradition"
 krcw_br_tradition_desc:0 "Royal courts, monasteries and hereditary chiefs collaborated with the colonizers, yet the people revere them. The new government no longer seeks to topple them but invites them into constitutional life."
 krcw_br_popular_revolution:0 "The People's Revolution"
 krcw_br_popular_revolution_desc:0 "Radicals want to finish the job at a stroke: abolish royal privilege, seize monastic estates, give the land to the peasants."
 krcw_br_land_reform:0 "Land Reform"
 krcw_br_land_reform_desc:0 "The colonial plantations are shared among tenants and cooperatives begin to form."
 krcw_br_roads:0 "Roads and River Transport"
 krcw_br_roads_desc:0 "Roads built with Nanjing's aid join the capital to the remote provinces."
 krcw_br_first_factories:0 "The First Factories"
 krcw_br_first_factories_desc:0 "Rice mills, sawmills, textile mills: industrialization starts from the humblest places."
 krcw_br_national_army:0 "The National Army"
 krcw_br_national_army_desc:0 "Independence fighters and ethnic militias merge into a national army trained by Chinese instructors."
 krcw_br_ethnic_councils:0 "Councils of the Peoples"
 krcw_br_ethnic_councils_desc:0 "Karen, Shan, Hmong, Lao Theung: each people sets up a council in its own region to run schools and land."
 krcw_br_schools:0 "National Schools"
 krcw_br_schools_desc:0 "Every township has a school teaching the mother tongue, arithmetic and hygiene."
 krcw_br_border_guard:0 "Guarding the Frontier"
 krcw_br_border_guard_desc:0 "Siam, the Indian Union and bandit remnants in the jungle all watch the frontier."
 krcw_br_self_reliance:0 "Self-Reliance"
 krcw_br_self_reliance_desc:0 "The advisory mission has done its work. The republic thanks Nanjing and asks the advisors to go home."
 krcw_br_closer_to_nanjing:0 "Stay Close to Nanjing"
 krcw_br_closer_to_nanjing_desc:0 "The borders are unsafe and the economy is weak. The republic chooses to keep relying on China's aid and protection."
 krcw_br_mature_republic:0 "Complete the State-Building"
 krcw_br_mature_republic_desc:0 "Where ten years ago there were no ministries, no schools and no army, there is now a real state."
 krcw_br_mekong_irrawaddy:0 "Harnessing the Great River"
 krcw_br_mekong_irrawaddy_desc:0 "Irrigation and hydro works begin on the Mekong and the Irrawaddy, half-funded by the Asian Development Fund."
 krcw_kor_broad_front_sp:0 "The Broad National Front"
 krcw_kor_broad_front_sp_desc:0 "Kim Kyu-sik and Lyuh Woon-hyung's centrists keep the National Revolutionary Party, the Korea Independence Party and the farmers' unions at one table. The quarrels never stop, but no one is purged."
 krcw_kor_hardliners_sp:0 "The Pro-Nanjing Hardliners"
 krcw_kor_hardliners_sp_desc:0 "Kim Mu-chong's officers hold that Korea has one road only: grip Nanjing's coat-tails and build the country into a fortress against Japan. Dissenters are shown out of the assembly."
 krcw_kor_naval_yards_sp:0 "Yards on Two Seas"
 krcw_kor_naval_yards_sp_desc:0 "The slipways of Busan, Wonsan and Chinnampo all work at once. Korea seeks no ocean fleet, only to hold its own two seas."
 krcw_kor_hardline_bloc:0 "The Pro-Nanjing Hardliners"
 krcw_kor_hardline_bloc_desc:0 "Kim Mu-chong's soldiers tire of the assembly's bickering. Make the country wholly a fortress against Japan, they say, and drive the doubters out of Seoul. Nanjing will like an obedient Korea."
 krcw_kor_the_assembly_convenes:0 "Convene the National Congress"
 krcw_kor_the_assembly_convenes_desc:0 "Whichever road is taken, the assembly must endorse it. Seoul's first national congress will decide the character of the Korean Republic: a comrades' league, a republic of its own, or Nanjing's outpost."
 krcw_kor_coalition_cabinet:0 "A Coalition Cabinet"
 krcw_kor_coalition_cabinet_desc:0 "The broad-front cabinet seats socialists, nationalists and two independent professors. It decides slowly, but it gives every faction a choice other than winning or losing."
 krcw_kor_wonsan_yards:0 "The Wonsan and Chinnampo Yards"
 krcw_kor_wonsan_yards_desc:0 "The slipways on both coasts expand together. Korea's merchant fleet sails to Shanghai and Haiphong under its own flag for the first time."
 krcw_kor_electronics:0 "Electronics on the Han"
 krcw_kor_electronics_desc:0 "From radios to vacuum tubes, Seoul's new plants make things unthinkable in the colonial era."
 krcw_kor_coastal_navy:0 "A Coastal Navy"
 krcw_kor_coastal_navy_desc:0 "Korea cannot afford battleships, but submarines and torpedo boats are enough to make Japanese transports think twice in the Tsushima Strait."
 krcw_kor_air_defense:0 "Air Defence of the Peninsula"
 krcw_kor_air_defense_desc:0 "The flak regiments of Seoul and Pyongyang are trained by Chinese instructors. Japanese bombers can no longer roam as they did in the thirties."
 krcw_kor_diaspora:0 "Create an Overseas Koreans Commission"
 krcw_kor_diaspora_desc:0 "Two million Korean migrants live in China's northeast. Seoul sets up a diaspora commission and negotiates their nationality, schools and land with Nanjing — a delicate matter, for it is Chinese soil."
 krcw_kor_reparations_demand:0 "Reparations from Tokyo"
 krcw_kor_reparations_demand_desc:0 "Thirty-five years of colonial rule left a debt in blood. Backed by Paris, Seoul formally demands reparations and the return of looted treasures from Tokyo."
 krcw_vin_radical_sp:0 "The Permanent-Revolution Faction"
 krcw_vin_radical_sp_desc:0 "Trần Văn Giàu's Trotskyists hold that the revolution cannot halt at Hanoi's gates. Liquidate the landlords, break the religious sects, export the revolution to Siam — they want a revolution complete."
 krcw_vin_southern_autonomy_sp:0 "Cochinchinese Autonomy"
 krcw_vin_southern_autonomy_sp_desc:0 "The South's religious orders, Chinese merchants and cooperatives win a constitution that recognises regional autonomy. Saigon is no longer Hanoi's enemy, nor entirely its subject."
 krcw_vin_permanent_revolution:0 "Permanent Revolution"
 krcw_vin_permanent_revolution_desc:0 "Trần Văn Giàu's Trotskyists are not content with expelling the French. They would liquidate the landlords, tame the sects and make Vietnam the tinder of Southeast Asian revolution — though it alarms Nanjing and enrages Siam."
 krcw_vin_cochinchina_question:0 "Settle the Status of Cochinchina"
 krcw_vin_cochinchina_question_desc:0 "The South belongs to the religious orders, the Chinese merchants and the cooperatives, at odds with Hanoi's revolutionary cadres. Force unity, or grant Cochinchina a charter of autonomy?"
 krcw_vin_hoa_community:0 "Settle Overseas Chinese Nationality"
 krcw_vin_hoa_community_desc:0 "Cholon in Saigon is the largest Chinese city in Southeast Asia. Hanoi and Nanjing negotiate the overseas Chinese's nationality and trade — a lifeline of the economy and a diplomatic knot."
 krcw_vin_rubber:0 "Nationalise the Rubber Plantations"
 krcw_vin_rubber_desc:0 "The rubber plantations left by Michelin are nationalised; export earnings flow into Hanoi's treasury rather than Paris' ledgers for the first time."
 krcw_vin_coal_of_tonkin:0 "The Coal of Hongay"
 krcw_vin_coal_of_tonkin_desc:0 "Hongay in Tonkin holds some of Asia's finest anthracite. The miners' union — the earliest cradle of the Vietnamese revolution — now digs for the nation."
 krcw_vin_siam_border:0 "Reinforce the Siamese Border"
 krcw_vin_siam_border_desc:0 "Phibun's Siam shelters Vietnam's exiled landlords and French remnants, and eyes the west bank of the Mekong. Hanoi reinforces the frontier and sends Bangkok a carefully worded note."
 krcw_br_regional_pact_sp:0 "The Regional Pact"
 krcw_br_regional_pact_sp_desc:0 "The brother republics and Siam sit at one table — not an alliance but an understanding on the Mekong, the border and trade. Nanjing is displeased, but Paris praises it as \"an Asian peace of the Asians' own\"."
 krcw_br_nonaligned_sp:0 "Among the Young Nations"
 krcw_br_nonaligned_sp_desc:0 "Rather than choose between the two blocs, stand with the new states of Asia and Africa. Neutrality is not weakness but the wisdom of small nations."
 krcw_br_the_crossroads:0 "Choose a Foreign Policy"
 krcw_br_the_crossroads_desc:0 "The machinery of state is built, but the foreign course is not fixed. The republic can bind itself more closely to Nanjing, walk the non-aligned road with the young nations, or carry the revolution across the border by backing the opponents of Phibun in Siam."
 krcw_br_deep_integration:0 "Into the Nanjing System"
 krcw_br_deep_integration_desc:0 "The republic ties its tariffs, railways and defence to China. It is the safest road — at the price of being forever the \"little brother\"."
 krcw_br_young_nations:0 "Join the Young Nations Conference"
 krcw_br_young_nations_desc:0 "Burma's Aung San proposes: be no one's front line. Together with the new governments of India, Indonesia and Egypt, the brother republics explore a non-aligned road."
 krcw_br_siam_pact:0 "Back the Free Thai Movement"
 krcw_br_siam_pact_desc:0 "Pridi Banomyong's Free Thai set up camps and radio stations on our side of the border to fight Phibun's government in Bangkok. The republic gives them sanctuary, arms and passage. Bangkok will retaliate, and the border will see more clashes."
 krcw_br_free_thai_sp:0 "Backing the Free Thai"
 krcw_br_free_thai_sp_desc:0 "The Free Thai fighters in the border camps are supplied and trained by our army. Siamese border troops often pursue them across the line."
 krcw_br_cash_crops:0 "The Cash Crops"
 krcw_br_cash_crops_desc:0 "Burmese rice, Cambodian pepper, Lao timber: the brother republics trade raw exports for machine tools from Nanjing and Paris."
 krcw_br_pacify_the_hills:0 "Pacify the Hills"
 krcw_br_pacify_the_hills_desc:0 "Karen, Kachin and Hmong bands are still in the hills. Win them over, or root them out? Each republic chooses differently."
 krcw_chi_200_t:0 "Seoul Decides"
 krcw_chi_200_d:0 "The assembly hall is packed. Kim Won-bong sits at the rostrum, Kim Kyu-sik and Kim Mu-chong to either side. Three proposals lie before the delegates: one binds Korea's fate to Nanjing, one insists on Korea's independent character, one would build the country into a fortress against Japan. Beyond the windows stands a Seoul only just risen from ruins."
 krcw_chi_200.a:0 "Brothers of one heart — follow Nanjing"
 krcw_chi_200.b:0 "A republic of our own"
 krcw_chi_200.c:0 "A fortress against Japan"
 krcw_chi_210_t:0 "The Question of the South"
 krcw_chi_210_d:0 "Hanoi's cadres want a unified, revolutionary Vietnam; Saigon's religious orders, Chinese merchants and cooperatives want to keep their own corner. Ninh must choose: force the revolution down to the mouth of the Mekong, or grant Cochinchina a charter of autonomy?"
 krcw_chi_210.a:0 "A charter of Cochinchinese autonomy"
 krcw_chi_210.b:0 "The revolution must unify the whole country"
 krcw_chi_220_t:0 "The Brother Republic at the Crossroads"
 krcw_chi_220_d:0 "The state is built. The ministers argue around a map: north lies Nanjing's reliable arm and the permanent status of \"little brother\"; outward lies the non-aligned road beside the new nations of Asia and Africa; west lies a handshake with the old enemy Siam and a regional order of the Asians' own."
 krcw_chi_220.a:0 "Deeper into the Nanjing system"
 krcw_chi_220.b:0 "Walk the non-aligned road"
 krcw_chi_220.c:0 "Back the Siamese opposition"
 krcw_kor_strait_category:0 "The Tsushima Strait"
 krcw_kor_strait_category_desc:0 "Korea and Japan face each other across the water; every patrol in the strait is a diplomatic statement."
 krcw_kor_strait_patrol:0 "Patrol the Strait"
 krcw_kor_strait_patrol_desc:0 "Show the Republic's flag in the Tsushima Strait."
 krcw_kor_fisheries_deal:0 "Intercept Japanese Smugglers"
 krcw_kor_fisheries_deal_desc:0 "The coast guard stops boats smuggling tungsten and ginseng to Japan off Jeju and Busan, and seizes Japanese agents' radios."
 krcw_kor_request_chinese_fleet:0 "Invite the Chinese Fleet"
 krcw_kor_request_chinese_fleet_desc:0 "Invite the Chinese navy to Busan, showing Tokyo the joint resolve of China and Korea."
 krcw_vin_mekong_category:0 "Mekong Cooperation"
 krcw_vin_mekong_category_desc:0 "Develop the Mekong together with Cambodia and Laos: Hanoi brings the engineers, the others the land and labour."
 krcw_vin_mekong_survey:0 "Survey the Mekong"
 krcw_vin_mekong_survey_desc:0 "Send a joint survey team to site the dams and canals."
 krcw_vin_aid_the_brothers:0 "Aid the Brother Republics"
 krcw_vin_aid_the_brothers_desc:0 "Send Vietnamese engineers and machine tools to Phnom Penh and Vientiane."
 krcw_vin_delta_dams:0 "The Delta Dams"
 krcw_vin_delta_dams_desc:0 "Build irrigation and hydro works in the Mekong Delta."
 krcw_br_diplomacy_category:0 "Young-Nation Diplomacy"
 krcw_br_diplomacy_category_desc:0 "Beyond the two blocs, the brother republics build their own ties with the new states of Asia and Africa."
 krcw_br_attend_conference:0 "Attend the Young Nations' Conference"
 krcw_br_attend_conference_desc:0 "Send delegates to the conference of the new Asian and African states, to speak for the small nations."
 krcw_br_siam_detente:0 "Seek Aid from the Young Nations"
 krcw_br_siam_detente_desc:0 "Ask Indonesia, Egypt and the other young nations for credit and technicians, to depend less on either bloc."
 krcw_chi_1_t:0 "Nanjing, Spring 1949"
 krcw_chi_1_d:0 "Before the Sun Yat-sen Mausoleum under Purple Mountain, Zhou Enlai and the members of the National Government mark two years in office. From Longyan to Peking the National Revolution took twenty-three years.\n\nYet everyone at the mausoleum knows: the villages are still in the landlords' hands, the generals of the north and southwest still keep private armies, the factories lie ruined by war, and Taiwan still hangs in Japan's grip. Indian and Russian agents move in Lhasa; Tokyo's revanchists rant in the papers.\n\n\"Comrades,\" says Zhou, \"the revolution is not yet complete.\""
 krcw_chi_1.a:0 "Comrades, keep striving."
 krcw_chi_10_t:0 "The Great Land Law Debate"
 krcw_chi_10_d:0 "The Legislative Yuan's hall is packed. Peasant delegates bring bundles of petitions; chambers of commerce and gentry bring lawyers.\n\nThe Revolutionary Committee draft would have the state buy out all holdings above thirty mu with thirty-year redemption bonds and redistribute them by household to the landless and land-poor. The moderates' counter-draft would cap rents at 37.5 percent and protect tenancy, leaving ownership untouched for now.\n\nThe night before the vote Zhou tells his secretary: \"This is not a law. It is a revolution. The only difference is that we hope it will be bloodless.\""
 krcw_chi_10.a:0 "Pass the redemption-and-redistribution law."
 krcw_chi_10.b:0 "Adopt the moderate rent-reduction plan."
 krcw_chi_10.c:0 "Table it: the time is not right."
 krcw_chi_11_t:0 "The Landlords of Hunan"
 krcw_chi_11_d:0 "Two months after the Land Law, landlord militias in several central Hunan counties surround the county land committees and burn the survey registers. A peasant association chairman is killed before an ancestral hall.\n\nNanjing is in uproar. The Revolutionary Committee demands troops; the moderates say this is exactly what haste produces."
 krcw_chi_11.a:0 "Send the security corps and try the ringleaders by law."
 krcw_chi_11.b:0 "Let the peasant associations arm themselves."
 krcw_chi_11.c:0 "Slow down and negotiate with the gentry."
 krcw_chi_12_t:0 "The 37.5 Percent Ledger"
 krcw_chi_12_d:0 "Six months into rent reduction, the reports are mixed. Tenants in Zhejiang and Jiangsu really do pay less; but in Guangxi and Sichuan many landlords evict tenants under the pretext of \"resuming self-cultivation\".\n\nThe peasant delegates return to Nanjing with one question: \"Does land to the tiller still count?\""
 krcw_chi_12.a:0 "Amend the law: evictions are banned."
 krcw_chi_12.b:0 "Resubmit the redemption bill."
 krcw_chi_20_t:0 "The First Day of the Programme"
 krcw_chi_20_d:0 "A giant map hangs outside the Construction Commission: red lines for railways, blue dots for power plants, black triangles for mines. The head of the Paris technical mission, standing before it, tells Zhou: \"You want to do in five years what took us thirty.\"\n\nZhou smiles. \"That is why we need you: not as teachers, but as colleagues.\""
 krcw_chi_20.a:0 "Invite French engineers into the industrial federations."
 krcw_chi_20.b:0 "Learn their techniques, keep the decisions."
 krcw_chi_21_t:0 "The Anshan Quota"
 krcw_chi_21_d:0 "A letter from Anshan's workers' council: to meet the steel target, Blast Furnace No. 3 has run four hundred days straight and its lining could burn through at any moment. Some in the Commission say \"one more quarter\". The union delegate pounds the table: \"Quotas serve people, not people quotas!\""
 krcw_chi_21.a:0 "Shut it down for repairs and revise the target."
 krcw_chi_21.b:0 "One more quarter."
 krcw_chi_22_t:0 "The Chengdu-Chongqing Line Opens"
 krcw_chi_22_d:0 "In the summer of 1950 the first train runs from Chengdu to Chongqing. Farmers stand on the embankment with eggs and oranges to watch; Sichuan has waited forty years for this railway."
 krcw_chi_22.a:0 "Forty years. Worth it."
 krcw_chi_30_t:0 "A Night at the Central Executive Committee"
 krcw_chi_30_d:0 "The meeting runs from afternoon into the night. The young Revolutionary Committee members demand \"acceleration\": land law, nationalization and army reorganization all at once. Chen Gongbo spreads the Construction Commission's draft programme on the table and argues that only with heavy industry in public hands will the land law have the money and land to share out. Gu Mengyu rises unhurriedly: \"Gentlemen, we have fought for twenty years. What the people want is a quiet meal.\"\n\nThe hall falls silent. Everyone waits for Zhou."
 krcw_chi_30.a:0 "\"The revolution cannot stop.\" (back the Revolutionary Committee)"
 krcw_chi_30.b:0 "\"Mr. Gu has a point.\" (concede to the moderates)"
 krcw_chi_31_d1:0 "After Zhou sided with the Revolutionary Committee in the CEC, Gu Mengyu addresses the Shanghai General Chamber of Commerce and attacks \"campaigns in place of the rule of law\". The speech makes the front page of the Shen Bao; Nanjing's radical papers answer at once, and Chen Gongbo's Revolutionary Critic calls him \"the compradors' mouthpiece\".\n\nThe Revolutionary Committee wants him expelled. The moderates remind the CEC that behind Gu stand half of Shanghai and half the provincial construction bureaus, and that driving him out now would tell the cities Nanjing no longer wants them."
 krcw_chi_31_d2:0 "After Zhou conceded to the moderates, Gu Mengyu addresses the Shanghai General Chamber of Commerce, presents the new course as a moderate victory and attacks \"campaigns in place of the rule of law\". The speech makes the front page of the Shen Bao; Nanjing's radical papers answer at once, and Chen Gongbo's Revolutionary Critic calls him \"the compradors' mouthpiece\".\n\nThe Revolutionary Committee says Gu is claiming the government's concession as his own and wants him disciplined. But Zhou has only just made his compromise with the moderates, and punishing Gu now would tear it up."
 krcw_chi_31_t:0 "Gu Mengyu's Speech"
 krcw_chi_31_d:0 "Gu Mengyu addresses the Shanghai General Chamber of Commerce, attacking \"campaigns in place of the rule of law\". The speech makes the front page of the Shen Bao; Nanjing's radical papers answer at once, and Chen Gongbo's Revolutionary Critic calls him \"the compradors' mouthpiece\".\n\nSome want him expelled from the party. Others remind them that behind the moderates stand half of Shanghai and half the provincial construction bureaus."
 krcw_chi_31.a:0 "Bring Gu into the cabinet: unity first."
 krcw_chi_31.b:0 "Rebuke him publicly, but no sanctions."
 krcw_chi_31.c:0 "Expel him and purge the moderates."
 krcw_chi_faction_shift_tt:0 "This will shift the balance between the party factions later on."
 krcw_chi_32_d1:0 "Over a hundred counties in Jiangsu, Zhejiang and Hunan elect people's councils. Polling stations stand in ancestral halls, schools and cooperative granaries. Many women press their thumbprints for the first time.\n\nSince the Hunan peasant associations took up arms they have had the loudest voice in the countryside. The Reorganized KMT wins most seats, but in dozens of counties in Hunan and Jiangxi candidates of the associations and the Syndicalist Party beat the party's nominees. Annulling those results would mean facing peasant associations that have rifles."
 krcw_chi_32_d2:0 "Over a hundred counties in Jiangsu, Zhejiang and Hunan elect people's councils. Polling stations stand in ancestral halls, schools and cooperative granaries. Many women press their thumbprints for the first time.\n\nSince the land law was slowed down the gentry have regained their footing in many counties. The Reorganized KMT wins most seats, but in a dozen counties gentry-backed candidates beat the peasant associations' men."
 krcw_chi_32_t:0 "The First County Elections"
 krcw_chi_32_d:0 "Over a hundred counties in Jiangsu, Zhejiang and Hunan elect people's councils. Polling stations stand in ancestral halls, schools and cooperative granaries. Many women press their thumbprints for the first time.\n\nThe results surprise: the Reorganized KMT wins most seats, but in a dozen counties independents backed by the peasant associations defeat the party's nominees."
 krcw_chi_32.a:0 "Respect the results and extend the councils nationwide."
 krcw_chi_32.b:0 "Annul the results in some counties."
 krcw_chi_33_t:0 "Zhou and the Question of Succession"
 krcw_chi_33_d:0 "In the autumn of 1953 Zhou collapses from exhaustion in a meeting. The doctors say it is nothing serious; he needs rest. But everyone now realizes that the whole Reorganized KMT hangs on one man.\n\nThe first thing Zhou does on waking is ask for the draft revision of the party statutes: \"China must not wait for another strongman.\""
 krcw_chi_33.a:0 "Institute collective leadership and term limits."
 krcw_chi_33.b:0 "Leave things as they are."
 krcw_chi_wl_reply_tt:0 "His answer will arrive in two weeks. Better terms, a steadier government, a larger central army and more strongmen already integrated all make acceptance likelier."
 krcw_chi_wl_contained_tt:0 "He will be more likely to accept next time."
 krcw_chi_40_d1:0 "Yan Xishan has ruled Taiyuan for forty years; his \"model province\" has its own currency, arsenal and narrow-gauge railway.\n\nNanjing's envoy has come to Taiyuan with a settlement. Nanjing decides how much to offer; Yan Xishan decides whether to take it."
 krcw_chi_40_d2:0 "Yan Xishan has ruled Taiyuan for forty years; his \"model province\" has its own currency, arsenal and narrow-gauge railway.\n\nTwo central divisions have reached the outskirts of Taiyuan. Nanjing can give the order at once or first split his officers from him."
 krcw_chi_40_t:0 "Yan Xishan and Nanjing"
 krcw_chi_40_d:0 "Yan Xishan has ruled Taiyuan for forty years; his \"model province\" has its own currency, arsenal and narrow-gauge railway.\n\nNanjing's envoy is in Taiyuan. He must bring back an answer, but the terms are for Nanjing to set."
 krcw_chi_40.a:0 "Offer generous terms: keep his shares in the Northwest Industrial Company and give him a seat on the State Council."
 krcw_chi_40.b:0 "A pension and an honorary post, nothing more."
 krcw_chi_40.c:0 "Issue an ultimatum: hand over his garrisons and troops within thirty days."
 krcw_chi_40.d:0 "Pay his division commanders directly first, then demand he hand over."
 krcw_chi_40.e:0 "Recall the envoy; no showdown yet."
 krcw_chi_140_d1:0 "Yan Xishan takes Nanjing's terms: keep his shares in the Northwest Industrial Company and give him a seat on the State Council. He gives the envoy a farewell dinner in Taiyuan and hands over the arsenal and quartermaster ledgers the next day."
 krcw_chi_140_d2:0 "Yan Xishan takes the pension and the honorary post. The terms are thin, but he has done the sums: if he holds out, Nanjing will only offer less."
 krcw_chi_140_d3:0 "Three days before the ultimatum expires, Yan Xishan sends an open telegram declaring his obedience to the centre. The central divisions enter Taiyuan unopposed."
 krcw_chi_140_d4:0 "One by one the division commanders on Nanjing's payroll declare for reorganization. Yan Xishan finds he has no troops left to command, and signs."
 krcw_chi_140_t:0 "Yan Xishan Hands Over His Troops"
 krcw_chi_140_d:0 "Yan Xishan agrees to reorganization. The Shanxi-Suiyuan Army will take central army designations and pay."
 krcw_chi_140.a:0 "Fold the Shanxi-Suiyuan Army into the central army."
 krcw_chi_140.b:0 "Demobilize most of them; the veterans go home with land."
 krcw_chi_143_d1:0 "Yan Xishan sends the generous terms back. Shares and seats can be taken away at any time, he tells the envoy; only troops in his own hands count."
 krcw_chi_143_d2:0 "Yan Xishan will not be paid off with a pension. The envoy waits ten days in Taiyuan and receives only a politely worded refusal."
 krcw_chi_143_d3:0 "Yan Xishan moves first and replaces three division commanders who took Nanjing's pay with his own men. The money is spent and the officers are lost."
 krcw_chi_143_t:0 "Yan Xishan Refuses Reorganization"
 krcw_chi_143_d:0 "Yan Xishan rejects Nanjing's terms and the envoy returns empty-handed."
 krcw_chi_143.a:0 "Give him time and try again later."
 krcw_chi_143.b:0 "Move more garrisons up around his territory."
 krcw_chi_146_t:0 "Standoff with Yan Xishan"
 krcw_chi_146_d:0 "Yan Xishan refuses once more to give up his troops. The Shanxi-Suiyuan Army digs in outside Taiyuan, and two central divisions halt facing them."
 krcw_chi_146.a:0 "Order them disarmed by force."
 krcw_chi_146.b:0 "Pull the divisions back; no showdown yet."
 krcw_chi_149_d1:0 "After two days of firing the main body of the Shanxi-Suiyuan Army lays down its arms. Yan Xishan is escorted to Nanjing and lodged in a guarded house."
 krcw_chi_149_d2:0 "Yan Xishan's territory is taken, but two of his regiments have slipped into the hills with their rifles. Yan Xishan himself cannot be found."
 krcw_chi_149_t:0 "Fighting around Taiyuan"
 krcw_chi_149_d:0 "The central army has entered Yan Xishan's territory."
 krcw_chi_149.a:0 "Issue the captured weapons to the central army."
 krcw_chi_149.b:0 "Post a bounty and send troops into the hills."
 krcw_chi_41_d1:0 "The Guangxi clique fought among the best in the Expedition and is the least willing to give up its troops. Bai Chongxi's nickname, \"Little Zhuge\", is well earned.\n\nNanjing's envoy has come to Guilin with a settlement. Nanjing decides how much to offer; Bai Chongxi decides whether to take it."
 krcw_chi_41_d2:0 "The Guangxi clique fought among the best in the Expedition and is the least willing to give up its troops. Bai Chongxi's nickname, \"Little Zhuge\", is well earned.\n\nTwo central divisions have reached the outskirts of Guilin. Nanjing can give the order at once or first split his officers from him."
