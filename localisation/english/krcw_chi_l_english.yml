 krcw_chi_150_t:0 "Fighting around Guilin"
 krcw_chi_150_d:0 "The central army has entered Bai Chongxi's territory."
 krcw_chi_150.a:0 "Issue the captured weapons to the central army."
 krcw_chi_150.b:0 "Post a bounty and send troops into the hills."
 krcw_chi_42_d1:0 "Hu Zongnan's troops garrison Shaanxi and Gansu, nominally against Mongolia and Russia, in practice against Nanjing too.\n\nNanjing's envoy has come to Xi'an with a settlement. Nanjing decides how much to offer; Hu Zongnan decides whether to take it."
 krcw_chi_42_d2:0 "Hu Zongnan's troops garrison Shaanxi and Gansu, nominally against Mongolia and Russia, in practice against Nanjing too.\n\nTwo central divisions have reached the outskirts of Xi'an. Nanjing can give the order at once or first split his officers from him."
 krcw_chi_42_t:0 "Hu Zongnan and Nanjing"
 krcw_chi_42_d:0 "Hu Zongnan's troops garrison Shaanxi and Gansu, nominally against Mongolia and Russia, in practice against Nanjing too.\n\nNanjing's envoy is in Xi'an. He must bring back an answer, but the terms are for Nanjing to set."
 krcw_chi_42.a:0 "Offer generous terms: take his First Army into the central army as a whole unit and make him head of the Northwest Field Headquarters."
 krcw_chi_42.b:0 "A pension and an honorary post, nothing more."
