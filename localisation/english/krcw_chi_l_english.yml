 krcw_chi_41_d:0 "The Guangxi clique fought among the best in the Expedition and is the least willing to give up its troops. Bai Chongxi's nickname, \"Little Zhuge\", is well earned.\n\nNanjing's envoy is in Guilin. He must bring back an answer, but the terms are for Nanjing to set."
 krcw_chi_41.a:0 "Offer generous terms: let every Guangxi officer keep his rank and make Bai himself president of the Military Advisory Council."
 krcw_chi_41.b:0 "A pension and an honorary post, nothing more."
 krcw_chi_41.c:0 "Issue an ultimatum: hand over his garrisons and troops within thirty days."
 krcw_chi_41.d:0 "Pay his division commanders directly first, then demand he hand over."
 krcw_chi_41.e:0 "Recall the envoy; no showdown yet."
