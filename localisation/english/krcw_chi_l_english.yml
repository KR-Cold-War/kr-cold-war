 krcw_chi_148.a:0 "Order them disarmed by force."
 krcw_chi_148.b:0 "Pull the divisions back; no showdown yet."
 krcw_chi_151_d1:0 "After two days of firing the main body of the First Army lays down its arms. Hu Zongnan is escorted to Nanjing and lodged in a guarded house."
