 krcw_sov_council_bop_r1:0 "The Army Gains Ground"
 krcw_sov_council_bop_r2:0 "The General Staff Decides"
 krcw_sov_council_bop_l1:0 "The Ministries Gain Ground"
 krcw_sov_council_bop_l2:0 "The Planners Decide"
 krcw_chi_cec_bop:0 "The Central Executive Committee"
 krcw_chi_bop_revcom:0 "The Revolutionary Committee"
 krcw_chi_bop_moderate:0 "The Reorganisationist Moderates"
 krcw_chi_cec_bop_mid:0 "Zhou Holds the Balance"
 krcw_chi_cec_bop_r1:0 "RevCom Runs the Economic Council"
 krcw_chi_cec_bop_r2:0 "RevCom Holds Every Lever"
 krcw_chi_cec_bop_l1:0 "The Moderates Run the Treasury"
 krcw_chi_cec_bop_l2:0 "The Moderates Hold the CEC"
 krcw_dm_ddr_exodus:0 "The Exodus"
 krcw_dm_ddr_exodus_desc:0 "Every month engineers, doctors and skilled workers leave for the West through Berlin. The larger the flow, the more the factories and laboratories go short of people."
 krcw_dm_raj_princes:0 "The Princes and the Reform"
 krcw_dm_raj_princes_desc:0 "Unrest in the princely states slows construction and shakes the government; every step of the federal reform gives Delhi's orders more weight."
 krcw_dm_ohio_line:0 "The Mississippi Line"
 krcw_dm_ohio_line_desc:0 "The tighter the ceasefire line, the more both banks behave as if at war: queues at the recruiting offices, consumer lines in the factories turned over to munitions."
 krcw_dm_strait:0 "The Taiwan Strait"
 krcw_dm_strait_desc:0 "The tenser the strait, the busier both navies: patrol boats run lit all night and the papers print the other side's notes every day."
 krcw_dm_berlin:0 "The Berlin Corridor"
 krcw_dm_berlin_desc:0 "Every obstruction on the corridor makes West Germans readier to fight, and puts more of the railway wagons on coal and building materials for West Berlin."
 krcw_dm_ti_crisis:0 "Strain in the Internationale"
 krcw_dm_ti_crisis_desc:0 "The members' complaints, queues and strikes all reach Paris. The deeper the strain, the more of the secretariat's effort goes on mediation."
 krcw_dm_ma_crisis:0 "Strain in the Accord"
 krcw_dm_ma_crisis_desc:0 "The generals of the cordon and the princes of India are all watching Moscow. The deeper the strain, the more of Moscow's effort goes on reassuring its allies."
 krcw_dm_sov_street:0 "The Street in the Interregnum"
 krcw_dm_sov_street_desc:0 "Vonsyatsky's men hand out leaflets at the factory gates and the clergy pray for the dynasty from the pulpit. The stronger the extremists and the monarchists, the less settled Moscow is."
 krcw_crisis_missions_cat:0 "Crises"
 krcw_crisis_missions_cat_desc:0 "The crises this country faces. Each has a deadline: bring the situation under control in time, or bear the consequences."
 krcw_m_ddr_stem_the_flow:0 "Stem the Flow through Berlin"
 krcw_m_ddr_stem_the_flow_desc:0 "The exodus has reached the point where the government must act. Bring it down within half a year, or the General Staff will close the border on its own initiative."
 krcw_m_wgr_hold_berlin:0 "Hold West Berlin"
 krcw_m_wgr_hold_berlin_desc:0 "West Berlin has coal for a few months. Ease the pressure before the corridor is choked for good, or the Internationale's members will start to doubt that West Germany can hold the city."
 krcw_m_us_cool_the_line:0 "Cool the Ceasefire Line"
 krcw_m_us_cool_the_line_desc:0 "The posts on both banks have begun trading fire. Calm the line within half a year, or the St. Louis Commission will adjourn."
 krcw_m_raj_the_princes:0 "Settle the Princely States"
 krcw_m_raj_the_princes_desc:0 "The unrest has spread from Hyderabad to the Central Provinces. Steady the situation within eight months, or the states will declare for themselves one after another."
 krcw_m_fra_hold_the_internationale:0 "Hold the Internationale Together"
 krcw_m_fra_hold_the_internationale_desc:0 "Members' delegates are complaining about Paris openly in Congress. Calm them within nine months, or someone will leave."
 krcw_m_sov_hold_the_accord:0 "Hold the Accord Together"
 krcw_m_sov_hold_the_accord_desc:0 "The generals in Warsaw and Bucharest have begun talking to Paris in private. Bring them back within nine months, or a gap will open in the cordon."
 krcw_m_sov_contain_the_street:0 "Contain the Street"
 krcw_m_sov_contain_the_street_desc:0 "Vonsyatsky's men are marching in Moscow and Petrograd. Contain them before the Council votes, or the ballots will follow the street."
 krcw_m_chi_win_lhasa:0 "Keep Lhasa Loyal"
 krcw_m_chi_win_lhasa_desc:0 "Silver from Kalimpong and caravans from Kham are flowing into Lhasa. Win the nobles back within half a year, or a rising is only a matter of time."
 krcw_m_proxy_gre:0 "Clear the Pindus"
 krcw_m_proxy_gre_desc:0 "If the rebels last a year, this becomes an endless guerrilla war, and ever more foreign volunteers and advisers will come."
 krcw_m_proxy_per:0 "Retake Azerbaijan Province"
 krcw_m_proxy_per_desc:0 "If the rebels last a year, this becomes an endless guerrilla war, and ever more foreign volunteers and advisers will come."
 krcw_m_proxy_phi:0 "Pacify Central Luzon"
 krcw_m_proxy_phi_desc:0 "If the rebels last a year, this becomes an endless guerrilla war, and ever more foreign volunteers and advisers will come."
 krcw_m_proxy_brm:0 "Pacify the Shan States"
 krcw_m_proxy_brm_desc:0 "If the rebels last a year, this becomes an endless guerrilla war, and ever more foreign volunteers and advisers will come."
 krcw_m_proxy_mex:0 "Pacify Michoacán"
 krcw_m_proxy_mex_desc:0 "If the rebels last a year, this becomes an endless guerrilla war, and ever more foreign volunteers and advisers will come."
 krcw_m_open_chi:0 "Absorb the Provincial Strongmen"
 krcw_m_open_chi_desc:0 "Yan Xishan, Bai Chongxi and Hu Zongnan still hold their own armies and revenues. Absorb their troops into the National Revolutionary Army within a year, or the Whampoa generals will say Nanjing cannot govern its army."
 krcw_m_open_sov:0 "Prepare for the Succession"
 krcw_m_open_sov_desc:0 "Savinkov is seventy and has never named an heir. The Council of State must settle the procedure while he lives, or the street and the altar will decide after his death."
 krcw_m_open_fra:0 "Draft the Statutes of the Internationale"
 krcw_m_open_fra_desc:0 "The sections want a draft of the statutes before the first Congress. The longer Paris delays, the more the small members suspect the Internationale is the French foreign ministry under another name."
 krcw_m_open_eng:0 "Keep the Coal Coming"
 krcw_m_open_eng_desc:0 "The yards, the power stations and the railways are all waiting for coal, and the pits run on pre-war machinery. Produce a national coal plan within half a year, or there will be power cuts this winter."
 krcw_m_open_wgr:0 "Open the Berlin Lifeline"
 krcw_m_open_wgr_desc:0 "West Berlin's coal, grain and medicine all come down one corridor through East Germany. Organise the traffic within half a year, or the next obstruction will become a blockade."
 krcw_m_open_ddr:0 "Produce a Reconstruction Plan"
 krcw_m_open_ddr_desc:0 "Half of East Germany's factories are still rubble, and the workers look at the West Berlin shops every day. Produce a reconstruction plan within half a year, or people will start leaving for the West."
 krcw_m_open_usa:0 "Deliver Share Our Wealth"
 krcw_m_open_usa_desc:0 "Long promised every American a homestead. Get the act through Congress within half a year, or the state bosses will start making their own promises to the voters."
 krcw_m_open_wca:0 "Convene the Ninth Congress"
 krcw_m_open_wca_desc:0 "The Combined Syndicates have not held a Congress since the war ended. Convene one within half a year, or the locals will start electing their own delegates."
 krcw_m_open_raj:0 "Found the Federal Secretariat"
 krcw_m_open_raj_desc:0 "Delhi's orders go unexecuted once they reach the princely states. Found a federal secretariat within seven months, or the princes will treat the federation as an empty title."
 krcw_m_open_jap:0 "Resettle the Repatriates"
 krcw_m_open_jap_desc:0 "Five million people have come back from Manchuria and Korea and live in camps at the ports. Find them homes and work within half a year, or the revanchists will find them something to do."
 krcw_m_open_psa:0 "Review the War Powers Act"
 krcw_m_open_psa_desc:0 "The port military districts of the War Powers Act have been in force for seven years. Complete the review within half a year, or the San Francisco longshoremen will strike again."
 krcw_m_long_war:0 "The Endless War"
 krcw_m_long_war_desc:0 "The rebels have lasted their first year. The army holds the towns but not the countryside, and every month brings a new casualty list."
