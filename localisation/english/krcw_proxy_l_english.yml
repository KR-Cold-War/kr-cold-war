 krcw_proxy_321_t:0 "The Abadan Unions Banned"
 krcw_proxy_321_d:0 "The Qavam government has declared the oilfield and refinery unions of Khuzestan illegal, on the grounds that they take foreign money. The workers of the Abadan refinery have struck, and the provincial council refuses to carry out Tehran's orders."
 krcw_proxy_321_a:0 "Send the army to take over the refinery"
 krcw_proxy_321_b:0 "Negotiate with the provincial council"
 krcw_proxy_322_t:0 "The Ships from Basra"
 krcw_proxy_322_d:0 "The strike fund and the rifles come up from the Gulf and are landed at Khorramshahr by the dock unions. There are British syndicalist seamen on the ships. Tehran has protested to London; London replies that these are solidarity collections by the unions."
 krcw_proxy_322_a:0 "There is no avoiding it now"
 krcw_proxy_323_t:0 "Tehran Asks for Troops"
 krcw_proxy_323_d:0 "Qavam asks for Russian troops to go south into Khuzestan. The General Staff objects. The Persians remember the Anglo-Russian partition of 1907, and the moment Russian troops march south of Tehran the nationalists and the officer corps will turn against the Accord. The British fleet is in the Gulf, and an advance on Abadan would drag the Gulf oilfields into a war between the blocs. Qavam himself wants arms and advisers, not an army of occupation."
 krcw_proxy_323_a:0 "Send arms and a military mission"
 krcw_proxy_323_b:0 "Overrule the General Staff and send an expeditionary force"
 krcw_proxy_324_t:0 "The Khuzestan Council's Appeal"
 krcw_proxy_324_d:0 "The Khuzestan provincial council asks the Internationale for troops. Under the Internationale's statutes a section's war is supported by volunteers raised by each country's unions, and sending regular troops would amount to declaring war on the Accord. The unions of Paris, London, Chicago and Nanjing propose to open enlistment offices and form the volunteers into International Brigades led by their own officers."
 krcw_proxy_324_a:0 "Open the enlistment offices"
 krcw_proxy_324_b:0 "Send arms only"
 krcw_proxy_2_t:0 "The Khuzestan Rising"
 krcw_proxy_2_d:0 "After a three-week strike the refinery workers and dockers of Abadan have taken up arms. The Khuzestan provincial council declares autonomy and demands that Tehran recognise the unions and a land law. The Accord's advisers are on their way from Baku."
 krcw_proxy_2_a:0 "The rising begins"
 krcw_proxy_2_b:0 "Grant part of the provincial council's terms"
 krcw_proxy_621_t:0 "The Khuzestan Rising: The Front Breaks"
 krcw_proxy_621_d:0 "The council's militias have crossed the Zagros and are closing on Isfahan. Qavam asks Russia and the Accord's neighbours to send troops.\n\nThe front is breaking. The fear was that sending troops would turn a civil war into a war between the blocs; now losing the country would cost more. The Internationale has sent only volunteers, not regular troops, so this is still a civil war, and the Accord's troops can go in at the government's request."
 krcw_proxy_621_a:0 "Send an expeditionary force"
 krcw_proxy_621_b:0 "Keep our troops at home"
