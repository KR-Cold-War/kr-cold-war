 krcw_proxy_341_t:0 "Land Reform in the Shan States"
 krcw_proxy_341_d:0 "Rangoon has extended the land reform to the Shan States, abolishing the sawbwas' hereditary domains and their right to tax. The sawbwas have met at Taunggyi and refuse to comply. Some in Aung San's cabinet want troops sent into the Shan States first."
 krcw_proxy_341_a:0 "Send troops into the Shan States"
 krcw_proxy_341_b:0 "Postpone the reform in the Shan States"
 krcw_proxy_342_t:0 "Arms through the Thai Ports"
 krcw_proxy_342_d:0 "The sawbwas' guards have new rifles, brought in from the Thai ports by way of Chiang Mai. Officers who fled across the frontier are training their men. Rangoon has protested to Moscow; Moscow replies that this is the business of private arms dealers."
 krcw_proxy_342_a:0 "There is no avoiding it now"
 krcw_proxy_343_t:0 "Rangoon Asks for Troops"
 krcw_proxy_343_d:0 "Aung San asks China to send troops into the Shan States. The General Staff answers that the southwestern armies are needed on the Tibetan and Yunnan frontiers. If Chinese troops enter the Shan States, India and Russia will say China means to annex Burma, and the nationalists in Aung San's cabinet will object too. Nanjing decides to send a mission and arms, not troops."
 krcw_proxy_343_a:0 "Send arms and a military mission"
 krcw_proxy_343_b:0 "Overrule the General Staff and send an expeditionary force"
 krcw_proxy_344_t:0 "The Sawbwas' Appeal"
 krcw_proxy_344_d:0 "The Shan sawbwas ask the Accord for troops. Russia has no road to Burma, Indian troops would have to cross Assam, and Delhi does not want a war with China before its Himalayan front is ready. The General Staff advises sending arms through Thailand and a military mission."
 krcw_proxy_344_a:0 "Send arms and a military mission"
 krcw_proxy_344_b:0 "Stay out of it"
 krcw_proxy_4_t:0 "The Shan Revolt"
 krcw_proxy_4_d:0 "The Shan sawbwas reject Rangoon's land reform and have risen together with officers who fled across the frontier. Their arms come through Thai ports, and the Accord has not denied it."
 krcw_proxy_4_a:0 "The rising begins"
 krcw_proxy_4_b:0 "Leave the sawbwas their hereditary rank in exchange for a ceasefire"
 krcw_proxy_641_t:0 "The Shan Revolt: The Front Breaks"
 krcw_proxy_641_d:0 "The sawbwas' armies have taken Kalaw and threaten the Mandalay-Rangoon railway. Aung San asks China to send troops.\n\nThe front is breaking. The fear was that India and Russia would say China meant to annex Burma; now losing the Shan States would cost more. The Accord has sent only advisers and arms, so this is still a civil war, and Chinese troops can go in at Rangoon's request."
 krcw_proxy_641_a:0 "Send an expeditionary force"
 krcw_proxy_641_b:0 "Keep our troops at home"
 krcw_proxy_741_t:0 "The Shan Revolt Is Over"
 krcw_proxy_741_d:0 "The army has retaken Taunggyi. Some sawbwas have fled to Thailand by way of Chiang Mai; the rest accept Rangoon's terms, keeping their titles and giving up the right to tax. The Accord's mission has left by way of Bangkok."
 krcw_proxy_741_a:0 "Order is restored"
 krcw_proxy_742_t:0 "The Shan Revolt: The Shan States Leave"
 krcw_proxy_742_d:0 "The sawbwas' armies are closing on Mandalay. Aung San's cabinet gives way: under the secession clause of the 1947 Panglong Agreement, the Shan States leave the Union of Burma as the Federated Shan States."
 krcw_proxy_742_a:0 "A new era begins"
 krcw_proxy_745_a:0 "So it ends"
 krcw_proxy_746_a:0 "So it ends"
 krcw_proxy_804_t:0 "The Shan States Ask to Join the Accord"
 krcw_proxy_804_d:0 "The new Federated Shan States ask to join the Moscow Accord. The sawbwas say that without the Accord's protection Rangoon and Nanjing will be back sooner or later."
 krcw_proxy_804_a:0 "Admit them"
 krcw_proxy_804_b:0 "Not yet"
