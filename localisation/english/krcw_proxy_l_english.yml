 krcw_proxy_brm_gov_arms_desc:0 "Send a Shipment of Rifles. Every intervention raises world tension a little."
 krcw_proxy_brm_gov_mission:0 "Arm the Government: Send a Military Mission"
 krcw_proxy_brm_gov_mission_desc:0 "Send a Military Mission. Every intervention raises world tension a little."
 krcw_proxy_351_t:0 "Taking Back the Ejido Land"
 krcw_proxy_351_d:0 "The Ávila Camacho government has ordered part of the ejido land in Michoacán and Guerrero returned to the old hacendados. The ejidos refuse to give it up, and Cárdenas's old officers are organising militias there. The army wants federal troops sent to take the land."
 krcw_proxy_351_a:0 "Send federal troops to take the land"
 krcw_proxy_351_b:0 "Put the return of the land on hold"
 krcw_proxy_352_t:0 "The Small Ports of the Pacific Coast"
 krcw_proxy_352_d:0 "The militias' rifles come across the Pacific and are landed at small ports near Zihuatanejo. The ships sail from Vancouver, and the men aboard say they are dockers hired by the Combined Syndicates. Mexico City has protested to Chicago and Ottawa; both reply that this is union solidarity."
 krcw_proxy_352_a:0 "There is no avoiding it now"
 krcw_proxy_353_t:0 "Mexico City Asks for Troops"
 krcw_proxy_353_d:0 "Mexico City asks America to send troops into Michoacán. The War Department objects: the whole army is held on the Ohio ceasefire line. American troops in Mexico would recall Veracruz in 1914, and the Mexican officer corps would turn against Washington. Russian arms also come through Mexico, and that road must stay open. Long decides to send a mission and arms."
 krcw_proxy_353_a:0 "Send arms and a military mission"
 krcw_proxy_353_b:0 "Overrule the General Staff and send an expeditionary force"
 krcw_proxy_354_t:0 "The Cardenistas' Appeal"
 krcw_proxy_354_d:0 "The Cardenista militias asks the Internationale for troops. Under the Internationale's statutes a section's war is supported by volunteers raised by each country's unions, and sending regular troops would amount to declaring war on the Accord. The unions of Paris, London, Chicago and Nanjing propose to open enlistment offices and form the volunteers into International Brigades led by their own officers."
 krcw_proxy_354_a:0 "Open the enlistment offices"
 krcw_proxy_354_b:0 "Send arms only"
 krcw_proxy_5_t:0 "The Cardenista Rising"
 krcw_proxy_5_d:0 "The ejidos of Michoacán and Guerrero refuse to hand the land back to the hacendados, and Cárdenas's old officers have raised a militia there. They say the generals in the capital sold out the revolution. Long's America is already moving troops to the border."
 krcw_proxy_5_a:0 "The rising begins"
 krcw_proxy_5_b:0 "Halt the return of ejido land"
 krcw_proxy_651_t:0 "The Cardenista Rising: The Front Breaks"
 krcw_proxy_651_d:0 "The Cardenista militias have reached Toluca and Mexico City is under threat. The government asks America to send troops.\n\nThe front is breaking. The fear was that sending troops would turn a civil war into a war between the blocs; now losing the country would cost more. The Internationale has sent only volunteers, not regular troops, so this is still a civil war, and the Accord's troops can go in at the government's request."
 krcw_proxy_651_a:0 "Send an expeditionary force"
 krcw_proxy_651_b:0 "Keep our troops at home"
 krcw_proxy_751_t:0 "The Cardenista Rising Is Over"
 krcw_proxy_751_d:0 "The federal army has retaken Michoacán and Guerrero. The militia leaders have gone into the Sierra Madre del Sur, and the volunteers have sailed home."
 krcw_proxy_751_a:0 "Order is restored"
 krcw_proxy_752_t:0 "The Cardenista Rising: The Government Falls"
 krcw_proxy_752_d:0 "The Cardenista militias have entered Mexico City; the army has split and Ávila Camacho has fled north. The ejido federations have formed the Revolutionary Government of Mexico and announced that Mexico leaves the Moscow Accord."
 krcw_proxy_752_a:0 "A new era begins"
 krcw_proxy_755_a:0 "So it ends"
 krcw_proxy_756_a:0 "So it ends"
 krcw_proxy_805_t:0 "Revolutionary Government of Mexico Asks to Join the Internationale"
 krcw_proxy_805_d:0 "The provisional government of the Revolutionary Government of Mexico asks to join the Third Internationale. The Accord's armies are close by and it needs the Internationale's protection."
 krcw_proxy_805_a:0 "Admit them"
 krcw_proxy_805_b:0 "Not yet"
