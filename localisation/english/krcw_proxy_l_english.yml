 krcw_proxy_331_t:0 "Disarming the Huks"
 krcw_proxy_331_d:0 "Manila has declared the Huk militias illegal and given them a deadline to hand in the rifles they carried against the Japanese. The tenant unions of Central Luzon want the land divided first. The landlords' private guards have begun making arrests in the villages of Pampanga."
 krcw_proxy_331_a:0 "Send in the constabulary"
 krcw_proxy_331_b:0 "Negotiate with the Huk leaders"
 krcw_proxy_332_t:0 "The Junks on the Southern Coast"
 krcw_proxy_332_d:0 "Coast patrols have stopped several Chinese junks landing rifles on the west coast of Luzon. Captured Huk cadres say they were trained in Canton. Manila has protested to Nanjing, and Nanjing denies any part in it."
 krcw_proxy_332_a:0 "There is no avoiding it now"
 krcw_proxy_333_t:0 "Manila Asks for Troops"
 krcw_proxy_333_d:0 "Manila asks America to land a division on Luzon. The War Department answers that the whole army is held on the Ohio ceasefire line and cannot spare a division. Troopships for Manila would have to pass waters held by the Constitutional Coalition and Japan, and Sacramento will not let them through. Long decides to send a mission and a shipment of arms."
 krcw_proxy_333_a:0 "Send arms and a military mission"
 krcw_proxy_333_b:0 "Overrule the General Staff and send an expeditionary force"
 krcw_proxy_334_t:0 "The Huks' Appeal"
 krcw_proxy_334_d:0 "The Huks asks the Internationale for troops. Under the Internationale's statutes a section's war is supported by volunteers raised by each country's unions, and sending regular troops would amount to declaring war on the Accord. The unions of Paris, London, Chicago and Nanjing propose to open enlistment offices and form the volunteers into International Brigades led by their own officers."
 krcw_proxy_334_a:0 "Open the enlistment offices"
 krcw_proxy_334_b:0 "Send arms only"
 krcw_proxy_3_t:0 "The Huk Rising"
 krcw_proxy_3_d:0 "The tenant militias of Central Luzon will not give up their rifles. They organised against the Japanese and now demand the land; the Manila landlords demand that the government clear them out. The Internationale's radio reports on them daily."
 krcw_proxy_3_a:0 "The rising begins"
 krcw_proxy_3_b:0 "Pass a tenancy law first, then talk about the rifles"
 krcw_proxy_631_t:0 "The Huk Rising: The Front Breaks"
 krcw_proxy_631_d:0 "The Huks have pushed into Bulacan, and Manila is within range of their guns. The government asks America to land troops.\n\nThe front is breaking. The fear was that sending troops would turn a civil war into a war between the blocs; now losing the country would cost more. The Internationale has sent only volunteers, not regular troops, so this is still a civil war, and the Accord's troops can go in at the government's request."
 krcw_proxy_631_a:0 "Send an expeditionary force"
 krcw_proxy_631_b:0 "Keep our troops at home"
 krcw_proxy_731_t:0 "The Huk Rising Is Over"
 krcw_proxy_731_d:0 "The constabulary has retaken the last towns of Central Luzon. The Huk leaders have gone into the Sierra Madre, and the Chinese volunteers have sailed home."
 krcw_proxy_731_a:0 "Order is restored"
 krcw_proxy_732_t:0 "The Huk Rising: The Government Falls"
 krcw_proxy_732_d:0 "The Huks have entered Manila and the government has dissolved. The tenant unions of Central Luzon have formed a provisional government and proclaimed the Philippine Labour Republic. The landlords have sailed for Taiwan."
 krcw_proxy_732_a:0 "A new era begins"
 krcw_proxy_735_a:0 "So it ends"
 krcw_proxy_736_a:0 "So it ends"
