 krcw_proxy_624_b:0 "Keep our troops at home"
 krcw_proxy_721_t:0 "The Khuzestan Rising Is Over"
 krcw_proxy_721_d:0 "The army has retaken Abadan. The council's leaders have sailed for Basra and the refinery is under military management. The British volunteers have been sent home."
 krcw_proxy_721_a:0 "Order is restored"
 krcw_proxy_722_t:0 "The Khuzestan Rising: The Government Falls"
 krcw_proxy_722_d:0 "The Khuzestan workers' militias have entered Tehran. Qavam has fled to Mashhad and the Shah has gone abroad. The provincial council has formed a provisional government and proclaimed the Iranian Labour Republic. The Russian military mission has left through Tabriz, and Iran is no longer Russia's subject."
 krcw_proxy_722_a:0 "A new era begins"
 krcw_proxy_725_a:0 "So it ends"
 krcw_proxy_726_a:0 "So it ends"
