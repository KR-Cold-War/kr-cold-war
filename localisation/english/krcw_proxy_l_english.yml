 SHA_krcw_shwe_thaik:0 "Sao Shwe Thaik"
 SHA_krcw_shwe_thaik_desc:0 "The sawbwa of Yawnghwe and chairman of the Shan sawbwas' council. He opposes Rangoon's land reform and holds to the right of secession that the Panglong Agreement gave the Shan States."
 GRE_krcw_velouchiotis:0 "Aris Velouchiotis"
 GRE_krcw_velouchiotis_desc:0 "Born Athanasios Klaras, the commander of the Pindus partisans. He fought the Germans and Bulgarians in the mountains during the occupation and refused to give up his rifles afterwards. The syndicalist federation made him chairman of its provisional council because the men in the hills listen only to him."
 PER_krcw_soltanzadeh:0 "Avetis Soltanzadeh"
 PER_krcw_soltanzadeh_desc:0 "A socialist of the old generation who came back to Abadan after long exile and taught land reform and oil nationalisation in the refinery unions. The provincial council asked him to head its provisional government."
 PHI_krcw_evangelista:0 "Crisanto Evangelista"
 PHI_krcw_evangelista_desc:0 "An organiser of the Manila printers' union and an elder of the Philippine labour movement. The tenant unions of Central Luzon chose him to head their provisional government."
