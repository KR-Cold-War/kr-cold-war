# krcw: years paced
 krcw_proxy_tt:0 "A proxy war has begun. Both blocs may send volunteers and arms."
 krcw_proxy_mission_sov:0 "Russian Military Mission"
 krcw_proxy_mission_sov_desc:0 "The mission's officers work in the divisional staffs on training, signals and supply. They do not command in the field."
 krcw_proxy_mission_usa:0 "American Military Mission"
 krcw_proxy_mission_usa_desc:0 "The mission's officers work in the divisional staffs on training, signals and supply. They do not command in the field."
 krcw_proxy_mission_chi:0 "Chinese Military Mission"
 krcw_proxy_mission_chi_desc:0 "The mission's officers work in the divisional staffs on training, signals and supply. They do not command in the field."
 krcw_proxy_arms_tt:0 "Ship §Y2500§! rifles, §Y120§! guns and signals equipment"
 krcw_proxy_brigade_tt:0 "The Internationale's leading members open enlistment offices; §Yvolunteer divisions§! will go to the front and come home when the war ends."
 krcw_proxy_stage_tt:0 "The conflict is escalating."
 krcw_proxy_311_t:0 "Disbanding the Mountain Militias"
 krcw_proxy_311_d:0 "Athens has ordered the wartime mountain militias disbanded and their weapons handed in by a deadline. The syndicalist federation in the Pindus refuses, and several village councils in Epirus are now chosen by the federation. Papagos wants the gendarmerie sent into the mountains."
 krcw_proxy_311_a:0 "Send the gendarmerie to collect the rifles"
 krcw_proxy_311_b:0 "Extend the deadline"
 krcw_proxy_312_t:0 "Night Boats in the Coves of Epirus"
 krcw_proxy_312_d:0 "The gendarmerie has been ambushed in the mountains. Prisoners say the partisans' supplies and recruits come by night in Italian fishing boats from Otranto, with French and Italian syndicalists aboard. Athens has protested to Paris; Paris replies that these are volunteers who went in a private capacity."
 krcw_proxy_312_a:0 "There is no avoiding it now"
 krcw_proxy_313_t:0 "Athens Asks for Troops"
 krcw_proxy_313_d:0 "Papagos asks Russia to send two corps into Epirus. The General Staff objects. Russian troops would have to pass the Turkish Straits or Bulgaria, and Ankara does not want Russian armies on two sides of it. The British fleet is in the Aegean, and Paris could present Russian troops in Greece as the Accord moving first, turning a civil war into a war between the blocs. The Greek officer corps does not want Russian soldiers stationed in the country either. The General Staff advises sending arms and a military mission only."
 krcw_proxy_313_a:0 "Send arms and a military mission"
 krcw_proxy_313_b:0 "Overrule the General Staff and send an expeditionary force"
 krcw_proxy_314_t:0 "The Pindus Partisans' Appeal"
 krcw_proxy_314_d:0 "The Hellenic syndicalist federation asks the Internationale for troops. Under the Internationale's statutes a section's war is supported by volunteers raised by each country's unions, and sending regular troops would amount to declaring war on the Accord. The unions of Paris, London, Chicago and Nanjing propose to open enlistment offices and form the volunteers into International Brigades led by their own officers."
 krcw_proxy_314_a:0 "Open the enlistment offices"
 krcw_proxy_314_b:0 "Send arms only"
 krcw_proxy_1_t:0 "The Pindus Rising"
 krcw_proxy_1_d:0 "The syndicalist partisans have come down from the Pindus. They hold several districts of Epirus and have proclaimed a Hellenic Labour Republic, supplied by sea in Italian fishing boats. Athens asks Moscow for troops; Moscow promises only arms."
 krcw_proxy_1_a:0 "The rising begins"
 krcw_proxy_1_b:0 "Seal the mountains and arrest the village contacts"
 krcw_proxy_611_t:0 "The Pindus Rising: The Front Breaks"
 krcw_proxy_611_d:0 "The partisans have reached the plain of Thessaly and the troops in Athens cannot stop them. Papagos asks Russia and the Accord's neighbours to send troops.\n\nThe front is breaking. The fear was that sending troops would turn a civil war into a war between the blocs; now losing the country would cost more. The Internationale has sent only volunteers, not regular troops, so this is still a civil war, and the Accord's troops can go in at the government's request."
 krcw_proxy_611_a:0 "Send an expeditionary force"
 krcw_proxy_611_b:0 "Keep our troops at home"
 krcw_proxy_612_t:0 "The Pindus Rising: The Front Breaks"
 krcw_proxy_612_d:0 "The partisans have reached the plain of Thessaly and the troops in Athens cannot stop them. Papagos asks Russia and the Accord's neighbours to send troops.\n\nThe front is breaking. The fear was that sending troops would turn a civil war into a war between the blocs; now losing the country would cost more. The Internationale has sent only volunteers, not regular troops, so this is still a civil war, and the Accord's troops can go in at the government's request."
