 krcw_proxy_615_b:0 "Keep our troops at home"
 krcw_proxy_711_t:0 "The Pindus Rising Is Over"
 krcw_proxy_711_d:0 "The government has retaken the last valleys of the Pindus. The partisan leaders have escaped to Italy by fishing boat, and the foreign volunteers have been sent home."
 krcw_proxy_711_a:0 "Order is restored"
 krcw_proxy_712_t:0 "The Pindus Rising: The Government Falls"
 krcw_proxy_712_d:0 "The partisans have entered Athens. Papagos and the junta's officers have sailed from Piraeus for Istanbul. The syndicalist federation has set up a provisional council in the parliament building and proclaimed the Hellenic Labour Republic."
 krcw_proxy_712_a:0 "A new era begins"
 krcw_proxy_715_a:0 "So it ends"
 krcw_proxy_716_a:0 "So it ends"
 krcw_proxy_801_t:0 "Hellenic Labour Republic Asks to Join the Internationale"
 krcw_proxy_801_d:0 "The provisional government of the Hellenic Labour Republic asks to join the Third Internationale. The Accord's armies are close by and it needs the Internationale's protection."
 krcw_proxy_801_a:0 "Admit them"
 krcw_proxy_801_b:0 "Not yet"
