 krcw_intro_10_t:0 "The Commune of France: Background"
 krcw_intro_10_d:0 "This is a background briefing on The Commune of France in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_11_t:0 "The Commune of France: From the Armistice to the Commune"
 krcw_intro_11_d:0 "In 1919 the German offensive in the west succeeded and the Third Republic was forced into an armistice. That November the CGT called a revolutionary general strike; the country stopped and the bourgeois government fell. The military regime of the \"Party of Order\" could not restore control, and after a short and brutal civil war the old government, most of the officer corps and much of the propertied class crossed the sea to Algiers, where they founded \"National France\", later ruled by Marshal Pétain.\n\nThe unions, socialists and anarchists who stayed built the Commune. The provisional charter of 1921 divided power between communes, regional federations and the national congress; the Comité de Salut Public ran the administration and the Bourse Générale du Travail spoke for the unions. In the same year French socialists founded the Third Internationale in Paris.\n\nFor the next fifteen years the Commune rebuilt while guarding against Algiers and a German blockade. The British revolution of 1925 gave it its first great-power ally. In 1937 the Internationale went to war with the German Empire. The Rhine line broke in 1943; the Internationale occupied the Rhineland, the Ruhr, Hamburg and Bavaria, and the Empire collapsed in the spring of 1944. During the war the Commune's army crossed the Mediterranean and National France fell. The European war ended in a ceasefire on the Elbe, with no peace treaty."
 krcw_intro_12_t:0 "The Commune of France: Paris in 1949"
 krcw_intro_12_d:0 "Benoît Frachon, a miner by origin, has been general secretary of the CGT since 1946. In May 1949 its Fourteenth Congress opens in Paris and is expected to give him a new mandate to form the government. The Commune leads the Third Internationale: the International Secretariat sits in Paris, and the Paris Clearing Union settles trade between the members.\n\nThe Commune's problems are mostly internal. The federations' offices have grown for twenty years; a local commune that wants to build a bridge waits for a permit from Paris. In congress, reformers who want rotation of officials and recall of delegates are deadlocked with technicians who want planning concentrated in the General Planning Office at Saclay. The first generation born after the revolution is now at university. They never saw the barricades of 1921, and they have many complaints about the federation offices.\n\nAbroad, the Commune's armoured divisions hold the Elbe alongside the German Socialist Republic and the Union of Britain, facing Russia and Schleicher's German National Republic. Algeria is still governed from Paris, and calls there for autonomy or independence are growing. The atomic programme at Saclay and in the Sahara is under way. In America the Commune has sent money and ships to the Combined Syndicates in New York, but no troops."
 krcw_intro_13_t:0 "The Commune of France: The Choices Before Paris"
 krcw_intro_13_d:0 "The Commune's focuses turn on three questions. The first is the federations themselves: restrain the offices with rotation rules and recall, or streamline them for efficiency; write the young workers' demands into a new Labour Charter, or restore order in the federations first. The Strasbourg Congress must also decide whether Europe's workers are represented by a Labour Parliament or a Council of Federations.\n\nThe second is the Internationale. Paris can make the Secretariat's resolutions binding on every section, sign an equal Commune Pact with the others, or abolish the Secretariat altogether. Toward the Moscow Accord the Commune must choose between \"peaceful competition\" and \"permanent revolution\"; the latter means arming partisans in Eastern Europe and preparing to cross the Elbe.\n\nThe third is Algeria: an autonomy statute, or the position that \"the provinces are France\".\n\nBeyond these lie the size of the atomic arsenal, the expansion of the Clearing Union and aid to New York. Clashes on the Elbe and the Mississippi can escalate at any time, and if the two blocs go to open war, the decision rests with Paris and Moscow."
 krcw_intro_20_t:0 "The Union of Britain: Background"
 krcw_intro_20_d:0 "This is a background briefing on The Union of Britain in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_21_t:0 "The Union of Britain: From the General Strike to the Union"
 krcw_intro_21_d:0 "Britain gave almost a million men to the Weltkrieg and got nothing for it. Five years of unemployment, recession and political scandal followed. The Conservative-led National Government imposed austerity and planned army cuts, and the anger finally broke out in a national general strike that turned into civil war. In 1924-25 George Lansbury and Arthur Cook proclaimed the Union of Britain. After more than a year of fighting the red flag flew over London, and at the end of 1925 the Royal Family fled to Canada.\n\nThe decade after the revolution was stormy. Labour dominated the Union but was split into factions, and fear of royalist subversion made the government steadily more authoritarian. In the 1930s Oswald Mosley founded the Popular Revolution Party and for a time rose quickly inside the movement.\n\nIn 1937 the Union went to war with the German Empire alongside the Commune of France. The fleet held the Atlantic and North Sea routes, and London suffered heavily from air raids. The King's government in Ottawa sent troops south in 1938 to intervene in the American civil war and was beaten at Albany and Buffalo by syndicalist militia. In 1940 Canadian workers rose, and the King fled a second time, to Melbourne. The German Empire collapsed in 1944; the ceasefire on the Elbe still holds."
 krcw_intro_22_t:0 "The Union of Britain: London in 1949"
 krcw_intro_22_d:0 "The Union's general secretary is Tom Wintringham, wounded at the Jarama in Spain in 1936 as an International Brigade commander and known in the movement for tolerating dissent. The Trades Union Congress meets every autumn at Blackpool, and in 1949 it has one question on the agenda: what should the Union become twenty-five years after the revolution? Shop stewards on the Clyde and in Sheffield and Coventry complain about the London offices, and Scotland and Wales want more power of their own.\n\nThe Union is the Internationale's naval pillar. The Red Fleet guards the Atlantic routes and carries supplies to Canada and the Combined Syndicates of America. Most of the old Empire's colonies are independent, and London has to deal with them anew. Northern Ireland has been returned to the workers' republic in Dublin, to the anger of Protestant shipyard workers in Belfast; Gibraltar belongs to the Iberian Federation, and the Mediterranean squadron's harbour rights must be renegotiated.\n\nThe House of Windsor and the exiled government sit in Australia, joined with New Zealand in the Entente of Australasia, and still claim to be Britain's only lawful government. At home, wartime bombing burned out half of London's slums, the coal pits and their headframes are worn out, and the Lancashire textile industry needs rebuilding."
 krcw_intro_23_t:0 "The Union of Britain: The Choices Before London"
 krcw_intro_23_d:0 "The Union's focuses start from the Blackpool Congress and run along four lines.\n\nConstitution: the Union's members have never been written down. Congress must settle the relationship between England, Scotland, Wales and the northern counties: a Four-Part Charter with seats allotted by union membership, or a single congress as the only sovereign body. It must also settle the legal status of the House of Windsor and whether opposition parties may stand.\n\nIndustry: in the line debate the Union can hand the factories to administrators, give decisions back to the shop floor, or adopt Cole's guild socialism. Each choice brings different people and a different party into government.\n\nNavy and the atom: build a British device, join the Internationale's joint programme, or give up the bomb; how many carriers and submarines; how many of the Internationale's sea lanes the fleet will guard.\n\nAbroad: toward Canberra, write to the Entente of Australasia and seek contact, or declare the Union the only lawful government. There are also Canada, Ireland and the unions of the former colonies.\n\nWintringham's succession will come up sooner or later. The Union's fleet is the only force the Internationale has in the Atlantic that can match the Accord, and the supply line to America depends on it."
 krcw_intro_30_t:0 "The Socialist Republic of Italy: Background"
 krcw_intro_30_d:0 "This is a background briefing on The Socialist Republic of Italy in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_31_t:0 "The Socialist Republic of Italy: From Vicenza to the Po"
 krcw_intro_31_d:0 "In 1919 Italy signed an armistice with Austria that let Austrian troops occupy Lombardy and Venetia until a formal peace. The Treaty of Vicenza that followed disgraced the nation and the old order. Within days the socialists rose, mutinous units formed a Red Army, and the Italian Civil War began. The Red advance was stopped on the Po and the Abruzzo line, and a ceasefire came in 1920. The peninsula was divided: the Socialist Republic held the centre and north, Austria held Lombardy and Venetia, the Church-backed Italian Federation held the south, and the House of Savoy kept a kingdom on Sardinia.\n\nThe 1920 constitution created a single chamber, part elected by the unions and part by popular vote. In 1927 the moderate unionists failed to use the turmoil in the southern Federation to unite the peninsula, and the nationalists who claimed d'Annunzio's legacy, together with Mussolini's faction, grew strong inside the Republic and fought the syndicalist orthodoxy for years.\n\nIn 1937 the Republic went to war as part of the Third Internationale. In 1943 the Internationale's armies crossed the Alps from France, partisans fought from the mountains down to the Po plain, and Austrian rule in the north ended with the collapse of the Empire. The same year the Republic crossed the sea, overthrew King Zog of Albania and brought Fan Noli back to Tirana. When the war ended, Italy was united for the first time under the red flag."
 krcw_intro_32_t:0 "The Socialist Republic of Italy: Rome in 1949"
 krcw_intro_32_d:0 "The Italian General Confederation of Labour governs. Its secretary, Giuseppe Di Vittorio, was a farm labourer in Apulia and has more standing among the southern day labourers than anyone. He puts land reform ahead of industrialisation, which the northern factory councils dislike. Matteotti, who rebuilt the councils in Turin and Milan, wants everything put to a vote, war included. Gronchi, from the Catholic unions, is the Republic's bridge to the southern parishes and wants the Church's schools left alone. Gabriotti of Umbria says the Republic's real problem is that nobody collects taxes or mends roads.\n\nThe peninsula has only just been united and the gap between north and south is enormous. Southern land is still held by the great estates, northern factories were damaged in the war, and the finances are kept afloat by advisers such as the old liberal deputy Sardi.\n\nAbroad, Italy is the Internationale's pillar in the Mediterranean. In 1943 it crossed the Adriatic and overthrew King Zog of Albania; a year later the Yugoslav and Greek juntas drove it out again, Zog returned under Russian protection and Noli went into exile in Rome. Across the Adriatic sits the Yugoslav junta, a member of the Moscow Accord; Trieste, Istria and Dalmatia are all unresolved, and the followers of the partisan leader Parri do not want to wait for arbitration. In the Pindus mountains of Greece there are syndicalist partisans, supplied by boats that cross the Strait of Otranto from Italian ports at night."
 krcw_intro_33_t:0 "The Socialist Republic of Italy: The Choices Before Rome"
 krcw_intro_33_d:0 "Italy's focuses first have to settle its place in the Internationale: follow Paris, insist on organising its federations in its own tradition, or answer the Second Commune movement inside the Internationale that demands grassroots democracy. Each road leads to a different faction and a different way of planning.\n\nNext comes the economy. The Republic must pick its specialist industries in the Internationale's division of labour, decide whether to join the transnational industrial federations and the common plan, and build roads and a grid that tie the south into the national market. Di Vittorio's land reform and northern industry compete for the same money.\n\nThird are the borders and the neighbours: whether to arm Noli's Albanian exiles; whether to take Trieste to the Internationale's arbitration court or negotiate directly with Belgrade; and Dalmatia, where Di Vittorio told the union congress \"we are not Mussolini\", though not everyone agrees. If the Pindus rising in Greece spreads, Italy is the nearest member of the Internationale.\n\nThe Republic's army is mostly syndicalist militia and wartime partisan units. It must be fitted into the Internationale's joint command and take on the defence of the Alpine passes and the Adriatic."
 krcw_intro_40_t:0 "The German Socialist Republic: Background"
 krcw_intro_40_d:0 "This is a background briefing on The German Socialist Republic in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_41_t:0 "The German Socialist Republic: From Moabit to the Rhine"
 krcw_intro_41_d:0 "Victory in 1919 made the German Empire the master of Europe. After the Black Thursday crash on the Berlin exchange in 1925 the economic crisis and the strikes never really ended, and the imperial government answered the unions with martial law and prison. Ernst Thälmann, a Hamburg docker, spent ten years in Berlin's Moabit prison, together with Kahle, Renn, Zaisser and others.\n\nIn 1937 the Third Internationale went to war with the Empire while Russia attacked from the east. In 1943 the Internationale's armour crossed the Rhine, and within six months the Rhineland, the Ruhr, Hamburg and Bavaria had changed hands. Released from prison, Thälmann proclaimed the German Socialist Republic; most of its leaders came out of the imperial prisons with him.\n\nIn the spring of 1944 the Empire collapsed. Kaiser Wilhelm III fled to Dar es Salaam in Mittelafrika and in the autumn moved on to Stockholm. The Internationale's armies crossed the Alps and liberated Salzburg, Tyrol and Upper Austria, while Vienna stayed in Russian hands; in 1945 the western Austrian provinces formed their own socialist republic in Salzburg. General Schleicher surrendered what was left of the Reichswehr to the Russians and founded the German National Republic east of the Elbe. Berlin was split in two: West Berlin went to the Socialist Republic, surrounded on every side by Schleicher's territory."
 krcw_intro_42_t:0 "The German Socialist Republic: The Republic in 1949"
 krcw_intro_42_d:0 "Thälmann was born in 1886 and ten years in prison ruined his health; the party is quietly thinking about his successor. The Republic's power grew up from the factory councils of the Ruhr: every plant elects a council that sets production, allocates housing and settles disputes. Yet most of the Empire's judges, headmasters and policemen are still at their desks, and without them the state cannot run.\n\nThe army too must be built from nothing. Half of the old imperial officer corps is east of the Elbe and half is in prison; the new army's cadres come from the International Brigades, veterans of Spain and the factory councils. The French, British and German staffs share a headquarters in Mainz: the front belongs to the Germans, the depth to the French.\n\nWest Berlin is the Republic's rawest nerve. Flour, coal and medicine for two million people come through three air corridors, one railway and one canal, all across Schleicher's territory. The 1949 \"bread bridge\" airlift has only just ended.\n\nIn the economy, the blast furnaces of the Ruhr and the chemical works of the Rhineland are the Internationale's second industrial heart in Europe, but the Empire's reparations are to be paid by German workers through exports. The western Austrian provinces are administered by the Republic, and whether they become independent or join Germany is still open."
 krcw_intro_43_t:0 "The German Socialist Republic: The Choices Ahead"
 krcw_intro_43_d:0 "The Republic's focuses first have to answer the division of Germany. One road is socialist unity: propaganda, strike funds and organisers across the line, waiting for Schleicher's state to crack from within. The other is to accept that unity will not come in this generation and make West Germany the richest, freest and strongest member of the Internationale, and let the people in the east compare for themselves.\n\nAt home the relationship between party, unions and factory councils must be fixed: unified command, or a \"workshop republic\". Officers for the new army elected by the unions, or the old General Staff called back. The Ruhr builds consumer goods first, or panzer divisions first. More and more people are fleeing from the east: take them all unconditionally, or set quotas.\n\nToward Austria the Republic can recognise Salzburg's independence, or invite it to join Germany. Toward the eastern neighbour the Republic can pursue small steps that deal only with post, family visits and freight, or bypass Schleicher's government and invite East German unions, churches and local councils to an All-German Congress.\n\nWest Berlin's status, the Elbe fortifications and Thälmann's succession run through all of it. The Elbe is the only line in Europe where the two blocs touch directly, and any clash there reaches Paris and Moscow at once."
 krcw_intro_50_t:0 "The Combined Syndicates of America: Background"
 krcw_intro_50_d:0 "This is a background briefing on The Combined Syndicates of America in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_51_t:0 "The Combined Syndicates of America: From the Rising to St. Louis"
 krcw_intro_51_d:0 "After the Berlin crash of 1925 the German-centred financial order fell apart and America sank into a long depression. After the 1936 election its legitimacy was challenged on every side, strikes and street fighting grew worse, and the Army Chief of Staff, MacArthur, carried out War Plan White and took Washington with his troops. Socialists and unions in the industrial cities declared that they recognised no \"reactionary\" government and elected John Reed provisional president; Smedley Butler and a group of officers went over to the workers. In the South Huey Long also refused to obey Washington, and the West Coast states set up a constitutional government of their own in Sacramento. The Second American Civil War began as a three-way fight between the syndicalists, Long and MacArthur's federal army, with Sacramento holding out beyond the Rockies.\n\nIn 1938 the Entente government in exile in Canada sent an army into New England to restore the old order, and syndicalist militia routed it at Albany and Buffalo. In 1941 Washington fell, and MacArthur broke out to the west with the remains of the federal army and went over to Sacramento.\n\nBy the winter of 1943 syndicalist armour had reached the outskirts of Memphis. Then Russian rifles, trucks and guns began reaching Long through Tampico in Mexico, and Patton's armies pushed the syndicalists back to the east bank of the great river. Paris had its divisions on the Elbe and sent only money and ships. In 1946 the two sides signed the ceasefire at St. Louis and faced each other along the Mississippi and the Ohio. Both constitutions claim sovereignty over all of America."
 krcw_intro_52_t:0 "The Combined Syndicates of America: New York in 1949"
 krcw_intro_52_d:0 "In May 1949 the Ninth Congress of the Combined Syndicates meets in New York. Its chairman, Walter Reuther, came up through the Detroit auto workers' union. The East holds New England, New York, Washington, Pittsburgh, Detroit and Chicago; it has far more factories than Long's America, but fewer people. Appalachia was burned out in the civil war, the mines of Harlan County and West Virginia are flooded, and the disabled veterans need hospitals, artificial limbs and work.\n\nThe industrial federations do not defer to one another, and the auto, steel, mining, dock and garment federations each keep their own militia. Carlson is building a unified Syndicalist People's Army on the model of the National Revolutionary Army; Rickover wants a fleet that can hold the Atlantic coast. A. Philip Randolph of the sleeping car porters is organising Black workers in Birmingham. Every month people cross the river from the West: Black families, members of banned unions, deserters.\n\nAt the congress two factions face each other. Reuther's \"Builders\" want to make the East a model of industrial democracy first; Foster and Cannon's \"Liberators\" call the ceasefire a breathing space and want to cross the river soon. The old hands of the IWW want every federation merged into One Big Union. Aid from the Third Internationale comes through Canada and across the Atlantic, and Tim Buck's Canada is the East's nearest ally."
 krcw_intro_53_t:0 "The Combined Syndicates of America: The Choices Before New York"
 krcw_intro_53_d:0 "The Syndicates' focuses begin with the Ninth Congress. Congress must choose between Reuther's Industrial Democracy Charter and the Foster faction's Committee for the Liberation of the West, then hold a three-way debate to adopt the Builders' line, the Liberators' line, or One Big Union. The winning faction reshapes the executive committee, and the fate of the losers' seats also goes to a vote.\n\nIn the economy the East must rebuild Appalachia, pump out the flooded mines, reorganise the Tennessee Valley, split Detroit's capacity between tractors and tanks, and decide whether to join the Paris Clearing Union and the transnational industrial federations.\n\nIn the military, Carlson has to fold the federations' militias into the People's Army. The staff has drafted the \"John Brown Plan\": force a crossing between Memphis and Cairo, drive on Little Rock and Dallas, and call the sharecroppers and oil workers of the West to a general strike. The alternative is the \"Shield of the East\": never fire first, and prepare every factory as a strongpoint.\n\nAbroad, the East has to manage its relations with Canada, the Mexican railway lines and the Constitutional Coalition. Huey Long's health is failing, and the succession fight after him may be the moment to cross the river."
 krcw_intro_60_t:0 "The Republic of China: Background"
 krcw_intro_60_d:0 "This is a background briefing on The Republic of China in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_61_t:0 "The Republic of China: From Longyan to Beijing"
 krcw_intro_61_d:0 "In 1926 the National Revolutionary Army's Northern Expedition failed at Jinhua. In February 1927 Chiang Kai-shek was assassinated and Wang Jingwei went into exile in Paris; the same year the Zhili clique, with German backing, put Puyi back on the throne and the Qing were restored. The remnants of the Kuomintang withdrew into the hills of Fujian and Jiangxi and held out around Longyan in the Min-Gan Insurgent Zone under Li Jishen, Cheng Qian, Soong Ching-ling and Deng Yanda. After the failed Shanghai rising of 1932 they formed the Provisional Action Committee.\n\nIn 1936 Wang Jingwei returned from Paris, joined the Provisional Action Committee and reorganised the Kuomintang (Reorganisation Faction), with arms and advisers from the Commune of France. The Second Northern Expedition began in 1937. The NRA marched from Longyan through southern Jiangxi and up the Xiang, took Wuhan in 1938 and Nanjing in 1939. With Germany absorbed in the European war the Qing had no foreign support; Beijing fell in 1940, Puyi abdicated and the Qing court came to an end.\n\nBeyond the Great Wall, the Fengtian clique had never recognised the court in Beijing, and it would not bow to Nanjing either. Japan sent troops into Shandong and western Liaoning in the name of its \"special interests in Manchuria and Mongolia\" to back Zhang Xueliang's Fengtian army. The NRA fought the Japanese and Fengtian armies in the north for four years. In the Liaoxi campaign of 1943 forces under Ye Ting, Xue Yue and Lin Biao destroyed the main body of the Kwantung Army, with Kim Won-bong's Korean Volunteer Corps fighting alongside. The Qingdao Armistice of 1944 made Japan accept the loss of Manchuria and Korea, but the NRA's navy could not cross the strait, and Taiwan stayed Japanese."
 krcw_intro_62_t:0 "The Republic of China: Nanjing in 1949"
 krcw_intro_62_d:0 "Wang Jingwei died of illness in 1944. In 1946 Zhou Enlai, leader of the party's most radical current, the Revolutionary Committee faction, joined Chen Gongbo's radical wing of the Reorganisation Comrades Association to defeat Gu Mengyu's moderates, and became Chairman of the National Government and of the Central Executive Committee; Chen took the chair of the Construction Commission and charge of economic reconstruction. Zhou studied in France as a young man, came up through Whampoa, and has closer ties to the Commune than anyone else in the party. The Republic joined the Third Internationale in 1947; the same year the Kashag in Lhasa signed the Lhasa Agreement with Nanjing and became a highly autonomous local government. China then sent volunteers to help the Vietnamese revolution and backed Cambodia, Laos and Burma in founding \"brother republics\"; the Republic of Korea is led by Kim Won-bong.\n\nIn the spring of 1949 the party holds its Sixth National Congress in Nanjing. The Central Executive Committee is divided between the Revolutionary Committee faction, Gu Mengyu's moderates, the left around Soong Ching-ling and the Whampoa Association; outside the party, the Syndicalist Party is strong in the unions of Shanghai and Wuhan. Yan Xishan, Bai Chongxi, Hu Zongnan and other generals who came over during the Expedition still keep their own armies and revenues.\n\n\"Land to the tiller\" has been in the party programme for twenty-five years, and the villages are still in the landlords' hands. Half of Anshan's blast furnaces were destroyed, and the Huai floods every year. To the north is Savinkov's Russia, to the southwest India, allied to Russia, and to the east Japan, which holds Taiwan. Indian and Russian agents move about Lhasa."
 krcw_intro_63_t:0 "The Republic of China: The Choices Before Nanjing"
 krcw_intro_63_d:0 "Nanjing's focuses begin with the Sixth Congress and the Land Law. The party's line struggle must be settled between the Revolutionary Committee line, with a thorough land law and fast construction, and a coalition with the moderates that makes Gu Mengyu head of the Executive Yuan and leaves the pace of reform to the Legislative Yuan. Local government can be built on county and township people's councils or run under emergency regulations.\n\nThe regional strongmen can be bought out and resettled, or broken by force. When and how tutelage ends, through open elections or a party-guided National Assembly; whether the united front is renewed, the party governs alone, or a coalition government is formed; Zhou Enlai's successor and the separation of party and state all have to be decided in time.\n\nAbroad, China must settle its relations with the brother republics: equal treaties, or a larger advisory mission. On Taiwan it can back self-determination for the Taiwanese or prepare to liberate the island by sea. In Tibet it can keep to the Lhasa Agreement or push for reform.\n\nThe greatest outside danger is in the Himalaya. The Indian Federation is sending rifles to the Tibetan nobility through the passes of Sikkim and Bhutan, and if Tibet rises, both blocs will take a hand in that war."
 krcw_intro_70_t:0 "The Russian State: Background"
 krcw_intro_70_d:0 "This is a background briefing on The Russian State in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_71_t:0 "The Russian State: From the White Army to Savinkov"
 krcw_intro_71_d:0 "The Treaty of Brest-Litovsk in 1918 handed a vast stretch of western Russia to Germany and its client states. In the civil war that followed the Whites defeated the Bolsheviks, and the Russian Republic was built on the ruins, with a constitution in 1922.\n\nThe Republic never escaped the humiliation of the Brest system. Governments came and went, land reform was never delivered, the Tambov peasant rising was crushed, and the peasants' loyalty to the Socialist Revolutionaries broke. In 1934 Boris Savinkov, an old SR terrorist and a White commissar in the civil war, seized power. His \"National Narodism\" promised the land to the peasants, the factories to the state and the trusts, and politics to the Supreme Ruler; his movement claims to carry on all the blood shed from 1914 to 1922.\n\nIn 1937 Savinkov attacked the German Empire and Mitteleuropa from the east, at the same time as the Third Internationale struck from the west, without any pact between them. The Russian army broke into East Prussia, annexed the Baltic states and Finland, and took the part of Austria east of Vienna. When the Empire collapsed in 1944, General Schleicher surrendered what was left of the Reichswehr to the Russians and signed the Treaty of Berlin, and a German National Republic dependent on Moscow was set up east of the Elbe."
 krcw_intro_72_t:0 "The Russian State: Moscow in 1949"
 krcw_intro_72_d:0 "In 1949 Russia stretches from the Elbe to the Pacific. Savinkov, now past seventy, is the Supreme Ruler. The constitution says the Supreme Ruler is elected by the State Council, but two thirds of its members are his appointees and it has never truly elected anyone. The State Guard and the Okhrana are the political police; opponents are sent into administrative exile in Siberian settlements, and the Patriarchate is a department of state. The zemstvos once again build roads, run schools and hire doctors, but they may not discuss politics.\n\nRussia never collectivised. Commune land still belongs to the peasants and the state asks only for grain quotas. The Ural steel trusts are state-owned, supplied with military orders and run by private managers.\n\nRussia leads the Moscow Accord. The German National Republic's budget must be approved in Moscow; Mongolia, Persia and Afghanistan are client states; the regimes of Poland, Hungary, Romania, Bulgaria, Yugoslavia and others are allies. Russian arms reach Huey Long through Mexico and the Indian princes through Persia. At home, Ukrainian schools now teach in Russian and the Baltic provinces resent Russification.\n\nSavinkov has never named a successor. Vasilevsky of the General Staff, Sorokin of the Academy and the monarchists gathered around the Cathedral of Christ the Saviour are all waiting for that day."
 krcw_intro_73_t:0 "The Russian State: The Choices Before Moscow"
 krcw_intro_73_d:0 "Moscow's focuses first have to turn Savinkov's politics into institutions: write National Narodism into law, reorganise the State Guard, put commune land rights into the constitution and debate the succession. While he lives the state can cultivate the General Staff, sponsor the Academy of Sciences, or let the monarchists of \"Throne and Altar\" draw near to power.\n\nAfter Savinkov's death the State Council must elect a new Supreme Ruler, and the successor's line shapes Russia from then on: a general who audits the closed cities' budgets and rebuilds the army around firepower and signals; Sorokin, who cuts defence and turns to tractor plants and teachers' colleges; the monarchists, who rename the State Council the Imperial Duma and bring back an emperor; or the extremists of the \"final reckoning\".\n\nThe national question is just as pressing. The Baltic can receive an autonomy statute or continued Russification; the national regions can be put under governors-general, given a Nationalities Charter, or negotiated with province by province. In the Far East Moscow must choose between the \"Amur frontier\" and talks with Nanjing.\n\nAbroad, Russia must hold the Accord together: the Accord Council, a veto for members, the Mexican channel and arms for the Balkan members. Across the Elbe stand the Internationale's armoured divisions, and any general war between the blocs will begin there."
 krcw_intro_80_t:0 "The United States of America: Background"
 krcw_intro_80_d:0 "This is a background briefing on The United States of America in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_81_t:0 "The United States: From Baton Rouge to New Orleans"
 krcw_intro_81_d:0 "Huey Long became governor of Louisiana at the end of the 1920s on roads, free schoolbooks and taxes on the oil companies, and later became famous nationwide for the Share Our Wealth movement. After the Berlin crash of 1925 America sank into a long depression, and Long built the Union Party, bringing farmers, the unemployed and small proprietors of the South and Midwest to his side. The legitimacy of the 1936 election was challenged, the syndicalists rose in the North, Long refused to obey Washington, and the Second American Civil War began.\n\nIn the first half of the war Long's forces were a patchwork of National Guard, state police and private militias. In 1941 Washington fell and MacArthur broke out to the west with the remains of the federal army and went over to the constitutional government in Sacramento. The West Coast states had never answered to New Orleans since the war began. By the winter of 1943 syndicalist armour was outside Memphis, and Long's troops were down to hunting rifles and old Guard rifles.\n\nThe turn came from Russia. Savinkov needed an America that would tie down France's allies, and the first train from Tampico brought rifles, trucks and shells into San Antonio. Over the next two years Patton's armies pushed the syndicalists back to the east bank of the great river. In 1946 the two sides signed the ceasefire at St. Louis."
 krcw_intro_82_t:0 "The United States: New Orleans in 1949"
 krcw_intro_82_d:0 "In the spring of 1949 Huey Long takes his fourth oath of office in New Orleans. His America holds the South west of the Mississippi, Texas, the Great Plains and the Rockies; it is large and populous but much poorer than the East and has far fewer factories than the Syndicates. The state lives on cotton, Texas oil and Russian loans. The West Coast aircraft plants are in MacArthur's hands, so the aviation industry has had to start again at Wichita in Kansas.\n\nThe Union Party is a vast machine: from New Orleans to Denver every postmaster, county sheriff and road contractor owes Long a favour. The machine kept the West alive through the war, and it gives the East's radio a nightly joke about \"the Kingfish's ten percent\". Long's health is failing. His son Russell Long and his brother Earl Long are both possible heirs, and southern generals such as Patton and Moseley have plans of their own.\n\nHundreds of thousands of Black veterans fought for Long in the civil war and now demand the vote, while the southern party bosses threaten to shut the South down if anyone touches segregation. Russian arms and machinery come north through Mexican ports and railways, and in return Savinkov wants berths in the Gulf ports and long-term contracts for Texas oil."
 krcw_intro_83_t:0 "The United States: The Choices Before New Orleans"
 krcw_intro_83_d:0 "Long's focuses begin with the party machine: widen the federal patronage network, or send the Federal Audit Office to go through the books. The Share Our Wealth Act taxes the oil barons and railway magnates progressively and pays every family a \"homestead allowance\", and it also asks every family on the allowance to send a son to the National Guard. Texas oil, the Dallas arsenal, the Gulf shipyards and the Hoover-Fort Peck grid are what the West has to catch up with the East.\n\nThe Black veterans' petition needs an answer: the \"Little Rock Compromise\" with the southern senators, or holding the colour line.\n\nThe biggest question is the succession. When Long dies, Earl Long can call the governors, generals and legislative leaders into the Governor's Mansion and work out an arrangement in which everyone keeps his seat; or the southern generals can form a Committee of Generals, send Patton's tanks into New Orleans and declare \"the Constitution suspended\".\n\nAbroad, Long must win Russian loans, court the Constitutional Coalition and fortify the west bank of the Mississippi. The War Department has drafted \"Operation Appomattox\" to retake the East, while others argue for an offensive defence. Any clash across the ceasefire line could restart the civil war."
 krcw_intro_90_t:0 "The German National Republic: Background"
 krcw_intro_90_d:0 "This is a background briefing on The German National Republic in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_91_t:0 "The German National Republic: From the Fall of the Empire to the Treaty of Berlin"
 krcw_intro_91_d:0 "Victory in 1919 made the German Empire the master of Europe, but after the Black Thursday crash on the Berlin exchange in 1925 its economy and politics never settled again. Kurt von Schleicher was the most political general in the imperial army. For years he moved between the War Ministry and the General Staff and kept contacts with the nationalists in the unions and with the Junker landowners.\n\nIn 1937 the Third Internationale attacked the Empire from the west and Savinkov's Russia from the east. The Rhine line broke in 1943, and the Rhineland, the Ruhr, Hamburg and Bavaria fell to the Internationale. In the spring of 1944 the Empire collapsed. Kaiser Wilhelm III took the imperial government to Dar es Salaam in Mittelafrika, meaning to fight on in Africa. That autumn the colonial army of Mittelafrika disintegrated, the governor surrendered, and the Kaiser went into exile in Stockholm.\n\nSchleicher did not follow the Kaiser. He surrendered the remains of the Reichswehr and the General Staff to the Russians and signed the Treaty of Berlin, which bought a German state east of the Elbe: Brandenburg, Saxony, Thuringia and East Berlin. Berlin was split in two, and West Berlin went to the Socialist Republic in the west. Under the treaty the Russians took half of the machine tools as reparations, and the Republic's budget must be approved in Moscow."
 krcw_intro_92_t:0 "The German National Republic: East Berlin in 1949"
 krcw_intro_92_d:0 "Schleicher is sixty-seven in 1949. He has named no successor and built no party of his own. His \"Querfront\" brought the officer corps, the nationalists in the unions and the Junkers into one National Front: Niekisch's people want to \"face east\", the monarchists wait for the Kaiser, and the general nods to both. The provisional People's Chamber has only just reconvened; the monarchists are an opposition, and any restoration would need Moscow's consent.\n\nThe imperial General Staff survived 1944 under a new name. Civilian ministers need its approval, and Manstein is still there. The Treaty of Berlin caps the army's divisions, and every increase needs a new protocol.\n\nThe East has no Ruhr. It has Lusatian lignite, the coal chemistry of Leuna, the optics and machine tools of Saxony and the Rostock yards. Uranium has been found in the old silver mines of the Erzgebirge, and a Russian survey team with an armed escort has closed off the whole range.\n\nWest Berlin is an opening. East Germans can enter the city on passes, and some leave from there and never come back. The East Berlin papers announce every day that the division is temporary, while the city council still has to put streetlamps and checkpoints along the sector line."
 krcw_intro_93_t:0 "The German National Republic: The Choices Before Schleicher"
 krcw_intro_93_d:0 "The National Republic's focuses begin with reconstruction and the Elbe line. The first choice is Moscow: seek priority for Accord equipment and become the most reliable front line, or take an independent line and say carefully that Germany's interests lie in Germany. Revising the Treaty of Berlin, ending reparations and restoring a foreign ministry all mean trip after trip to Moscow.\n\nEmigration forces the general's office to decide: a full welfare-state programme with housing, pensions and hospitals to keep people, paid for by a smaller army; or closing the Berlin sector border to stop the flow, at the cost of the regime's image.\n\nWhat happens after Schleicher runs through everything. The Republic can hand itself entirely to the Russian army, or lobby Moscow for a constitutional Hohenzollern monarch. After his death the General Staff can take over through a Defence Council, or the Constitutional Court can rule the army's veto over civilian appointments unconstitutional. Whether the army faces the Elbe or keeps two corps at home to keep order must also be settled.\n\nAcross the Elbe stand the Internationale's armoured divisions. If war comes, East Germany is the first battlefield, and it must hold for seventy-two hours until Russia's tank armies arrive."
 krcw_intro_100_t:0 "The Indian Federation: Background"
 krcw_intro_100_d:0 "This is a background briefing on The Indian Federation in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_101_t:0 "The Indian Federation: The Princes Unite India"
 krcw_intro_101_d:0 "The doubling of the salt tax in 1923 was one of the sparks of the Indian rising. After the British revolution of 1925 British India lost its sovereign and the subcontinent fell into civil war. When the ceasefire came in 1927, India was divided: the Dominion in Delhi stayed loyal to the exiled King; revolutionaries in Bengal and the Gangetic plain founded the Indian Commune, close to the Third Internationale; and the princely states of the south formed the Princely Federation under the Nizam of Hyderabad, Osman Ali Khan. The Scindia family of Gwalior was driven from its state by socialist forces during the civil war and lived in Hyderabad from then on.\n\nIn the early 1940s, while the Internationale's main forces were fighting in Europe, the Princely Federation launched a war of unification under the banner of \"anti-Bolshevism\". Russia sent arms and advisers, and the Dominion in Delhi came over to the princes' side. During the war Jiwajirao Scindia, Maharaja of Gwalior, became the Federation's leader. In 1947 the Federation's armies destroyed the Indian Commune and united the whole subcontinent, including the Punjab, Sind and Bengal.\n\nThe war of unification wrecked the granaries of Bengal. Since then, whenever the monsoon fails, famine sweeps the Gangetic plain."
 krcw_intro_102_t:0 "The Indian Federation: Delhi in 1949"
 krcw_intro_102_d:0 "Two years after the war of unification, more than five hundred princes gather for the first time in the Chamber of Princes in Delhi. Scindia chairs the Chamber; the princes have brought elephants, jewels and demands of their own. The Federal Secretariat in New Delhi is staffed by officials on loan from the princely states. They have just begun drawing up a single budget for the whole subcontinent, and many of them are learning for the first time how poor the Federation is.\n\nThe Federation is a right-wing state ruled jointly by princes, nobles and soldiers. The princely states still go their own way: Hyderabad is reluctant to pay federal taxes, and in the paddy fields of Bengal the zamindars collect rent as before. Caste, religion, famine and peasant revolt are its greatest internal problems, and the peasants of Bihar and Telangana rise again and again.\n\nThe Federal Army has put Rajput cavalry, Sikh infantry and Gurkha mountain battalions into one uniform for the first time, but their pay still comes from their own princes. A Russian-trained constabulary is good at breaking up meetings and watching newspaper offices.\n\nThe Indian Federation is a member of the Moscow Accord. Moscow's credits have bought rolling mills in Bombay and an arsenal in Cawnpore, and every loan carries a \"friendship clause\". Beyond the Himalaya to the north lies Tibet under the Republic of China, and the princes' envoys are already dealing with Lhasa nobles in Darjeeling and Kalimpong."
 krcw_intro_103_t:0 "The Indian Federation: The Choices Before Delhi"
 krcw_intro_103_d:0 "Delhi's focuses start with convening the Chamber of Princes: the Chamber must elect a federal president and build a Council of Dewans and a common administration. The first great choice is land: veto land reform and sign a compact with the zamindars, or accept the young princes' memorandum and bring tenancy acts, temple entry and provincial councils with a limited franchise to the directly ruled provinces.\n\nFamine and unrest will return again and again. The Federation can set up a famine relief commission, build grain railways and open canal colonies, or declare indefinite martial law and rule through special tribunals. If tax revolts in the princely states and peasant risings break out together, the \"tradition\" on which the Princely Federation rests will collapse from within.\n\nThe economy and the army depend on Moscow: rouble loans, the Bombay mills, Jamshedpur steel, a Russian-style staff college. The army must decide who commands its divisions and when the princes' private troops pass to the Federation.\n\nAbroad, the most dangerous and most tempting question is Tibet. The Federation can reach the Khampa chiefs through the Kalimpong network and arm a \"Dharma Army\" to light a war on the plateau, or it can make peace with Nanjing. Either road will draw in Moscow and the Third Internationale."
 krcw_intro_110_t:0 "Japan: Background"
 krcw_intro_110_d:0 "This is a background briefing on Japan in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_111_t:0 "Japan: From Taisho to Qingdao"
 krcw_intro_111_d:0 "In the 1920s Japan had party cabinets and a lively Diet, unions and press; later liberals called it the Taisho years. In the 1930s the army and the bureaucrats of the Control Faction grew steadily stronger, and party cabinets gave way to governments run by officials and generals.\n\nIn 1940 Beijing fell and the Qing came to an end; north of it, the advancing National Revolutionary Army now faced Zhang Xueliang's Fengtian clique beyond the Great Wall. Japan sent troops into Shandong and western Liaoning in the name of its \"special interests in Manchuria and Mongolia\" to back the Fengtian army against the NRA. The war in north China lasted four years. In the Liaoxi campaign of 1943 the NRA under Ye Ting, Xue Yue and Lin Biao destroyed the main body of the Kwantung Army.\n\nThe Qingdao Armistice was signed in 1944. Japan accepted the loss of Manchuria and Korea, and the Republic of Korea was founded with Chinese backing. The armistice capped the Imperial Army at twenty divisions, with no heavy equipment and no strategic air arm. The NRA's navy could not cross the strait, so Taiwan stayed in Japanese hands, and the South Seas Mandate and the Kurils were kept too. The settlers, soldiers and officials on the mainland came home, and they need work, housing and an explanation."
 krcw_intro_112_t:0 "Japan: Tokyo in 1949"
 krcw_intro_112_d:0 "Prime Minister Kishi Nobusuke is called \"the Monster of Showa\". In the war he was a Control Faction economic bureaucrat who ran Manchurian industry and home-front munitions, and he escaped any reckoning after the defeat. Now he leads the National Spirit League and governs Japan through the bureaucratic machine of the Ministry of Commerce and Industry rather than through votes: foreign-exchange quotas, import licences and bank credit are all in that building. The directors of Mitsui, Mitsubishi and Sumitomo have been invited back into the Ministry.\n\nIshiwara Kanji's generals want an army that can retake the mainland; Kishi wants an army that can keep the government in power. Hardliners in the Diet ask why Manchuria is not being recovered, and Kishi answers that Russia will not allow it. The opposition is split: Ishibashi Tanzan's liberals argued for giving up the colonies as early as the 1920s, Katayama Tetsu's Social Masses Party wants legal unions and an army answerable to the cabinet, and Yoshida Shigeru's conservatives want arms kept to a minimum and the country devoted to trade.\n\nTaiwan has been under Japanese rule for fifty years. The Government-General in Taipei builds railways and sugar mills and also arrests the organisers of the self-rule movement, and Nanjing's radio broadcasts across the strait every night. Japan belongs to no bloc, but the Russians sell Tokyo Sakhalin oil at a fair price, and it is the Moscow Accord's quasi-ally in the Pacific."
 krcw_intro_113_t:0 "Japan: The Choices Before Tokyo"
 krcw_intro_113_d:0 "Tokyo's focuses first have to resettle the people who came back from the mainland and steady the country, then decide who runs the economy: industrial planning by the Ministry of Commerce and Industry, or the zaibatsu in charge; an economic bureaucracy, or the conservative merger. Shipbuilding, electronics and the Pacific industrial belt are what Japan has to recover with.\n\nIn politics Kishi must reach an agreement with the army. Japan can rearm, using a \"Police Reserve\" to get around the armistice's division limit, or return to the Taisho spirit, with cabinets formed by the Diet majority and no more imperial ordinances issued over the Diet's head.\n\nTaiwan is the most immediate question: open a Taiwan Assembly and let the Taiwanese set sugar prices, the language of schooling and the local police, or turn Taiwan into a fortress with batteries on the Pescadores and at Kaohsiung. Nanjing may start preparing a crossing at any time.\n\nAbroad, Japan must choose between joining the Moscow Accord and declaring Pacific neutrality. The price of the Accord is that Japan gives up any claim to Manchuria and Russia recognises Taiwan as Japanese; neutrality means exporting to both blocs and becoming the workshop of the Pacific."
 krcw_intro_120_t:0 "The American Constitutional Coalition: Background"
 krcw_intro_120_d:0 "This is a background briefing on The American Constitutional Coalition in three pages: how the country came to be, where it stands in 1949, and the choices ahead. You can read it now or skip it and start playing."
 krcw_intro_121_t:0 "The American Constitutional Coalition: From Washington to Sacramento"
 krcw_intro_121_d:0 "The crisis of the 1936 election ended with the Army Chief of Staff, Douglas MacArthur, carrying out War Plan White and taking Washington with his troops. The syndicalists rose in Chicago and Huey Long seized the South. The governors of the West Coast states refused to recognise the putsch government; the congressmen who reached Sacramento declared a quorum, declared the captive President unable to serve, and made Vice President Quentin Roosevelt acting President. General George Marshall offered his services, and the Pacific Fleet stayed on the West Coast with the governors; only a few ships loyal to MacArthur mutinied and sailed east.\n\nMacArthur held Washington for five years, fighting on two fronts. When it fell in the winter of 1941 he broke out to the west with the remains of the federal army and the War Department's files. Sacramento was short of troops, so Congress pardoned him and made him commander of the Western Defense Command. In 1942 Congress passed the War Powers Act, placing San Francisco, Oakland, Los Angeles, Seattle and the Sierra passes under military districts run by his command, to be renewed every year.\n\nThe Sacramento government holds California, Oregon, Washington, Nevada, Idaho and Alaska. Congress named it the American Constitutional Coalition, and it calls itself the only constitutional government of the United States. Governor Stainback of Hawaii refused to recognise it and proclaimed a republic; half the ships at Pearl Harbor sailed for the mainland and half stayed. The St. Louis ceasefire of 1946 was signed by the Syndicates and Long; Sacramento was not a party to it and recognises neither of the other two governments."
 krcw_intro_122_t:0 "The American Constitutional Coalition: Sacramento in 1949"
 krcw_intro_122_d:0 "In the 1948 election the Republican Earl Warren, running on the repeal of the War Powers Act, beat the Democrat Clarence Martin, and in January 1949 he succeeded Roosevelt as President. MacArthur, now sixty-nine, still commands the Western Defense Command from the Presidio in San Francisco; Wainwright, Halsey and the other officers who came west with him are known as the Presidio men, and they believe Congress cannot hold the West Coast. The Army Chief of Staff, Marshall, is loyal to Congress and has long wanted MacArthur retired. The dock unions of San Francisco, Oakland and Seattle have never obeyed the military districts.\n\nThe Coalition is cut off from the eastern factories and from the Texas oilfields. California oranges, Oregon timber and Washington aluminium need new buyers, and the Lockheed, Douglas and North American plants in Los Angeles have lost their federal orders. Power from Grand Coulee and Bonneville, the farms of the Central Valley and the mines of Nevada are what the States have, but they are short of oil and money.\n\nAdmiral Nimitz's Pacific Fleet is the one force in which the Coalition can match the other two Americas. The passes between the Sierra Nevada and the Rockies are the only way in for Long's army. Alaska is close to Russia, and its garrison is both an outpost and a bargaining chip.\n\nBoth blocs are courting Sacramento. New York's envoys come by train, New Orleans' by plane, and those of Paris and Moscow by ship. The Paris shipyard credits require the release of the dock union leaders held by the military districts; Moscow's oil requires that the Alaskan airfields someday be opened for \"common defence\"."
 krcw_intro_123_t:0 "The American Constitutional Coalition: The Choices Before Sacramento"
 krcw_intro_123_d:0 "The Coalition's focuses begin with the relationship between Sacramento and the Presidio. President Warren is to review the War Powers Act, and the first choice is whether to return the ports to civil government or to widen the military districts and renew the Act once more. Whether the dock unions are negotiated with or broken, New York and New Orleans are watching.\n\nThen comes the constitution itself: call a convention and repeal the War Powers Act, or let it run until the war is over. Who takes the Western Defense Command when MacArthur retires, Wainwright, a joint command of fleet and army, or nobody because the command is abolished, is also for Congress to vote on. If Congress keeps giving way, the Presidio men will in the end take over the government, Congress will go into recess, and MacArthur will chair a military council.\n\nAbroad, Sacramento can declare neutrality and negotiate a Pacific pact with Tokyo, Canberra and Honolulu; move toward New York and negotiate its own terms for joining the Third Internationale; or reconcile with New Orleans on Long's terms for reunification. If the Internationale wins Sacramento, the dock unions and the Democratic left will hold Congress; if Moscow wins, the Pacific Fleet will stand with Long."
