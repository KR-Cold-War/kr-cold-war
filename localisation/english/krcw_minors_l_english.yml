l_english:
# krcw: years paced
 KRCW_P_SEN_long:0 "Mouvement Socialiste Africain"
 KRCW_P_SEN:0 "MSA"
 KRCW_L_SEN:0 "Lamine Guèye"
 KRCW_L_SEN_desc:0 "After Algiers fell in 1942 the National French remnant fell back on Dakar. In 1943 the Senegalese Tirailleurs mutinied at Thiaroye and, together with the Dakar dockers, toppled the colonial regime; the 1945 Bamako constituent assembly founded the West African Federation, later joined by Gambia, Sierra Leone and the former Portuguese Guinea and Cape Verde. In 1946 the Federation joined the Internationale, and advisers from Paris and Clearing Union credit followed."
 KRCW_SEN:0 "West African Federation"
 KRCW_SEN_DEF:0 "the West African Federation"
 KRCW_SEN_ADJ:0 "West African"
 KRCW_P_RCG_long:0 "Movement for the Social Evolution of Black Africa"
 KRCW_P_RCG:0 "MESAN"
 KRCW_L_RCG:0 "Barthélemy Boganda"
 KRCW_L_RCG_desc:0 "In 1919 most of French Equatorial Africa was ceded to Germany and folded into Mittelafrika, while northern Chad stayed with National France. By 1944 neither master was left, and the councils of Brazzaville, Bangui, Libreville and Fort-Lamy formed the Equatorial African Federation; Río Muni and São Tomé, renounced by Iberia, joined later."
 KRCW_RCG:0 "Equatorial African Federation"
 KRCW_RCG_DEF:0 "the Equatorial African Federation"
 KRCW_RCG_ADJ:0 "Equatorial African"
 KRCW_P_DOC_long:0 "Alliance of the Bakongo"
 KRCW_P_DOC:0 "ABAKO"
 KRCW_L_DOC:0 "Joseph Kasa-Vubu"
 KRCW_L_DOC_desc:0 "The Congo was the economic heart of Mittelafrika. When the German colonial army dissolved in 1944, the Bakongo Alliance and the Kimbanguist church took the lower Congo while Katanga fell to the miners' councils; the 1946 Léopoldville Charter barely bound the two into one republic."
 KRCW_DOC:0 "Republic of the Congo"
 KRCW_DOC_DEF:0 "the Republic of the Congo"
 KRCW_DOC_ADJ:0 "Congolese"
 KRCW_P_CMR_long:0 "Union of the Peoples of Kamerun"
 KRCW_P_CMR:0 "UPC"
 KRCW_L_CMR:0 "Ruben Um Nyobè"
 KRCW_L_CMR_desc:0 "Kamerun was one of Germany's oldest African colonies. In 1944 the Douala dock and railway unions rose first; the trade unionist Um Nyobè proclaimed a united Kamerun, and Internationale aid has made it one of the most left-wing governments in Africa."
 KRCW_CMR:0 "Republic of Kamerun"
 KRCW_CMR_DEF:0 "the Republic of Kamerun"
 KRCW_CMR_ADJ:0 "Kamerunian"
 KRCW_P_NGA_long:0 "National Council of Nigeria"
 KRCW_P_NGA:0 "NCN"
 KRCW_L_NGA:0 "Nnamdi Azikiwe"
 KRCW_L_NGA_desc:0 "Britain was forced to cede Nigeria to Germany in the 1919 armistice. After Mittelafrika collapsed in 1944, Azikiwe in Lagos and the northern emirs signed the Kano Accord and kept the country whole as a federation, though the north-south rift never healed."
 KRCW_NGA:0 "Federation of Nigeria"
 KRCW_NGA_DEF:0 "the Federation of Nigeria"
 KRCW_NGA_ADJ:0 "Nigerian"
 KRCW_P_GHA_long:0 "Convention People's Party"
 KRCW_P_GHA:0 "CPP"
 KRCW_L_GHA:0 "Kwame Nkrumah"
 KRCW_L_GHA_desc:0 "The Gold Coast passed to Germany in 1919. After 1944 Nkrumah, back from war-torn America, built the Convention People's Party, took power and named the country after the ancient West African empire of Ghana."
 KRCW_GHA:0 "Republic of Ghana"
 KRCW_GHA_DEF:0 "the Republic of Ghana"
 KRCW_GHA_ADJ:0 "Ghanaian"
 KRCW_P_TOG_long:0 "Committee of Togolese Unity"
 KRCW_P_TOG:0 "CUT"
 KRCW_L_TOG:0 "Sylvanus Olympio"
 KRCW_L_TOG_desc:0 "Togoland returned whole to Germany in 1919. In 1944 it became the only Mittelafrikan province handed over peacefully: the merchant Olympio talked the last German officials into leaving, and east and west Togo were united."
 KRCW_TOG:0 "Republic of Togo"
 KRCW_TOG_DEF:0 "the Republic of Togo"
 KRCW_TOG_ADJ:0 "Togolese"
 KRCW_P_KEN_long:0 "East African Union"
 KRCW_P_KEN:0 "EAU"
 KRCW_L_KEN:0 "Jomo Kenyatta"
 KRCW_L_KEN_desc:0 "German East Africa was the heart of Mittelafrika. In the spring of 1944 the Kaiser fled to Dar es Salaam with the imperial government to carry on the war; that autumn the colonial army dissolved, the governor surrendered and the Kaiser left for Sweden. Afterwards Kenyatta came home from fifteen years among the London syndicalists and, with the Sultan of Zanzibar and the Tanganyikan cooperative movement, founded the East African Federation with its capital at Nairobi."
 KRCW_KEN:0 "East African Federation"
 KRCW_KEN_DEF:0 "the East African Federation"
 KRCW_KEN_ADJ:0 "East African"
 KRCW_P_UGA_long:0 "Lukiiko of Buganda"
 KRCW_P_UGA:0 "Lukiiko"
 KRCW_L_UGA:0 "Mutesa II"
 KRCW_L_UGA_desc:0 "The Germans always ruled Uganda through the King of Buganda. When the colonial army withdrew in 1944, the young Kabaka Mutesa II built a Kingdom of Uganda around Buganda and refused to join the East African Federation."
 KRCW_UGA:0 "Kingdom of Uganda"
 KRCW_UGA_DEF:0 "the Kingdom of Uganda"
 KRCW_UGA_ADJ:0 "Ugandan"
 KRCW_P_RWA_long:0 "Court of the Mwami"
 KRCW_P_RWA:0 "Court"
 KRCW_L_RWA:0 "Mutara III Rudahigwa"
 KRCW_L_RWA_desc:0 "These two ancient highland kingdoms kept their thrones under German rule. Since 1944 Mwami Mutara III of Ruanda has ruled both as a personal union."
 KRCW_RWA:0 "Kingdom of Ruanda-Urundi"
 KRCW_RWA_DEF:0 "the Kingdom of Ruanda-Urundi"
 KRCW_RWA_ADJ:0 "Rwandan"
 KRCW_P_ZAM_long:0 "African National Congress"
 KRCW_P_ZAM:0 "ANC"
 KRCW_L_ZAM:0 "Harry Nkumbula"
 KRCW_L_ZAM_desc:0 "Mittelafrika joined the Copperbelt and Nyasaland into a \"Zambezi Province\". In 1944 the Copperbelt strike committees, the Barotse kingdom and the Nyasaland African associations formed a federation; when Iberia renounced Mozambique in 1946 the Beira and Lourenço Marques dockers voted to join, giving the copper mines a port. The red miners' unions remain the government's deepest worry."
 KRCW_ZAM:0 "Zambezi Federation"
 KRCW_ZAM_DEF:0 "the Zambezi Federation"
 KRCW_ZAM_ADJ:0 "Zambezian"
 KRCW_P_SAF_long:0 "Reunited National Party"
 KRCW_P_SAF:0 "HNP"
 KRCW_L_SAF:0 "Daniel François Malan"
 KRCW_L_SAF_desc:0 "South Africa went its own way when the British Empire fell and annexed Rhodesia and the High Commission Territories in the 1930s; in 1944 it seized South West Africa as Mittelafrika collapsed. Malan's National Party won power in 1948: a white-minority regime ringed by newly independent African states, rebuffing the exiled court in Australia and both blocs alike."
 KRCW_SAF:0 "Union of South Africa"
 KRCW_SAF_DEF:0 "the Union of South Africa"
 KRCW_SAF_ADJ:0 "South African"
 KRCW_P_ANG_long:0 "Angolan Liberation Council"
 KRCW_P_ANG:0 "CLA"
 KRCW_L_ANG:0 "Agostinho Neto"
 KRCW_L_ANG_desc:0 "In 1946 revolutionary Portugal joined the Iberian Federation, whose CNT government renounced every colony. Luanda's mestiço intellectuals and the Benguela railwaymen formed a Liberation Council to take over, with the young doctor Neto as its voice."
 KRCW_ANG:0 "Republic of Angola"
 KRCW_ANG_DEF:0 "the Republic of Angola"
 KRCW_ANG_ADJ:0 "Angolan"
 KRCW_P_ETH_long:0 "Imperial Court"
 KRCW_P_ETH:0 "Court"
 KRCW_L_ETH:0 "Haile Selassie"
 KRCW_L_ETH_desc:0 "Ethiopia stayed neutral in the World War. When German Djibouti fell with Mittelafrika in 1944, Haile Selassie's army marched to the Gulf of Tadjoura and the Empire finally won its own sea outlet; the Sultan of Afar then submitted to the Emperor."
 KRCW_ETH:0 "Ethiopian Empire"
 KRCW_ETH_DEF:0 "the Ethiopian Empire"
 KRCW_ETH_ADJ:0 "Ethiopian"
 KRCW_P_SOM_long:0 "Somali Youth League"
 KRCW_P_SOM:0 "SYL"
 KRCW_L_SOM:0 "Abdulkadir Sheikh Sakhawudeen"
 KRCW_L_SOM_desc:0 "The British and Italian revolutions freed the Somalis in the 1920s. The Somali Youth League governs from Mogadishu and dreams of a Greater Somalia including the Ogaden and Djibouti."
 KRCW_SOM:0 "Somali Republic"
 KRCW_SOM_DEF:0 "the Somali Republic"
 KRCW_SOM_ADJ:0 "Somali"
 KRCW_P_LBA_long:0 "Senussi Order"
 KRCW_P_LBA:0 "Senussi"
 KRCW_L_LBA:0 "Idris I"
 KRCW_L_LBA_desc:0 "When the Ottoman Empire fell in 1944 the Senussi Emirate of Cyrenaica took over Tripolitania, and Idris I proclaimed himself King of Libya."
 KRCW_LBA:0 "Kingdom of Libya"
 KRCW_LBA_DEF:0 "the Kingdom of Libya"
 KRCW_LBA_ADJ:0 "Libyan"
 KRCW_P_TUN_long:0 "Socialist Destourian Party"
 KRCW_P_TUN:0 "PSD"
 KRCW_L_TUN:0 "Habib Bourguiba"
 KRCW_L_TUN_desc:0 "In 1942 the Commune's army took Tunis, ending National French rule in North Africa. Paris did not annex Tunisia but handed power to the Neo Destour and Farhat Hached's UGTT. In 1946 Bourguiba's party became the Socialist Destourian Party and Tunisia joined the Internationale, with the UGTT running the labour and planning ministries. It is the showcase of the Commune's anti-colonialism, and the argument every Algerian throws back at Paris."
 KRCW_TUN:0 "Tunisian Republic"
 KRCW_TUN_DEF:0 "the Tunisian Republic"
 KRCW_TUN_ADJ:0 "Tunisian"
 KRCW_P_MOR_long:0 "Makhzen"
 KRCW_P_MOR:0 "Makhzen"
 KRCW_L_MOR:0 "Mohammed V"
 KRCW_L_MOR_desc:0 "After the 1936 Iberian revolution Spain gave up its northern protectorate; when National France collapsed in 1942 Mohammed V declared full independence in Rabat and soon recovered the Tangier zone."
 KRCW_MOR:0 "Sultanate of Morocco"
 KRCW_MOR_DEF:0 "the Sultanate of Morocco"
 KRCW_MOR_ADJ:0 "Moroccan"
 KRCW_P_EGY_long:0 "Royal Court"
 KRCW_P_EGY:0 "Court"
 KRCW_L_EGY:0 "Farouk I"
 KRCW_L_EGY_desc:0 "After the British revolution Egypt shed its protectorate in the 1920s and took the formerly Anglo-Egyptian Sudan for itself. King Farouk's court is corrupt and lavish, and the Free Officers are already conspiring."
 KRCW_EGY:0 "Kingdom of Egypt and the Sudan"
 KRCW_EGY_DEF:0 "the Kingdom of Egypt and the Sudan"
 KRCW_EGY_ADJ:0 "Egyptian"
 KRCW_P_LIB_long:0 "True Whig Party"
 KRCW_P_LIB:0 "TWP"
 KRCW_L_LIB:0 "William Tubman"
 KRCW_L_LIB_desc:0 "Africa's oldest republic lost its only great-power patron when America fell into civil war, and now treads carefully among its newly independent neighbours."
 KRCW_LIB:0 "Republic of Liberia"
 KRCW_LIB_DEF:0 "the Republic of Liberia"
 KRCW_LIB_ADJ:0 "Liberian"
 KRCW_P_MAD_long:0 "Social Democratic Party"
 KRCW_P_MAD:0 "PSD"
 KRCW_L_MAD:0 "Philibert Tsiranana"
 KRCW_L_MAD_desc:0 "Madagascar and the Mascarenes were ceded to Germany in 1919 as Indian Ocean naval bases. The 1944 Tananarive rising drove out the German garrison, and delegates from the Comoros, Mauritius, the Seychelles and Réunion then joined the republic."
 KRCW_MAD:0 "Malagasy Republic"
 KRCW_MAD_DEF:0 "the Malagasy Republic"
 KRCW_MAD_ADJ:0 "Malagasy"
 KRCW_P_ISR_long:0 "National Concord"
 KRCW_P_ISR:0 "NC"
 KRCW_L_ISR:0 "Musa al-Alami"
 KRCW_L_ISR_desc:0 "In the Ottoman twilight the German-protected Mutasarrifate of Jerusalem held two communities, Arab notables and Jewish settlers. When the Empire fell in 1944 they signed the Jaffa Accord and founded a fragile binational republic under the moderate lawyer Musa al-Alami. There was no British Mandate here, and no Holocaust."
 KRCW_ISR:0 "Republic of Palestine"
 KRCW_ISR_DEF:0 "the Republic of Palestine"
 KRCW_ISR_ADJ:0 "Palestinian"
 KRCW_P_JOR_long:0 "Hashemite Court"
 KRCW_P_JOR:0 "Court"
 KRCW_L_JOR:0 "Abdullah I"
 KRCW_L_JOR_desc:0 "When the Ottoman Empire fell in 1944 Ibn Saud annexed the Hejaz and the Hashemite sharifs of Mecca fled north. Abdullah rallied the Bedouin tribes at Amman and founded the Kingdom of Jordan."
 KRCW_JOR:0 "Hashemite Kingdom of Jordan"
 KRCW_JOR_DEF:0 "the Hashemite Kingdom of Jordan"
 KRCW_JOR_ADJ:0 "Jordanian"
 KRCW_P_IRQ_long:0 "Covenant Society"
 KRCW_P_IRQ:0 "Ahd"
 KRCW_L_IRQ:0 "Nuri al-Said"
 KRCW_L_IRQ_desc:0 "In 1944 the Ottoman officers in Baghdad seized power and declared Iraq independent. The former Ottoman staff officer Nuri al-Said leads this officer-dominated republic, which the Kirkuk oilfields make both rich and restless."
 KRCW_IRQ:0 "Republic of Iraq"
 KRCW_IRQ_DEF:0 "the Republic of Iraq"
 KRCW_IRQ_ADJ:0 "Iraqi"
 KRCW_P_SYR_long:0 "National Bloc"
 KRCW_P_SYR:0 "NB"
 KRCW_L_SYR:0 "Shukri al-Quwatli"
 KRCW_L_SYR_desc:0 "The 1944 Damascus rising drove out the Ottoman governor. Quwatli's National Bloc proclaimed the Syrian Republic and claims all of Greater Syria for Damascus."
 KRCW_SYR:0 "Syrian Republic"
 KRCW_SYR_DEF:0 "the Syrian Republic"
 KRCW_SYR_ADJ:0 "Syrian"
 KRCW_P_LEB_long:0 "Constitutional Bloc"
 KRCW_P_LEB:0 "CB"
 KRCW_L_LEB:0 "Bechara El Khoury"
 KRCW_L_LEB_desc:0 "As the Ottoman Empire fell the sectarian leaders of Mount Lebanon signed the National Pact and built a republic on confessional power-sharing."
 KRCW_LEB:0 "Lebanese Republic"
 KRCW_LEB_DEF:0 "the Lebanese Republic"
 KRCW_LEB_ADJ:0 "Lebanese"
 KRCW_P_SAU_long:0 "House of Saud"
 KRCW_P_SAU:0 "Saud"
 KRCW_L_SAU:0 "Abdulaziz Ibn Saud"
 KRCW_L_SAU_desc:0 "Ibn Saud used the Ottoman collapse of 1944 to annex the Hejaz and Jabal Shammar, uniting most of the Arabian Peninsula."
 KRCW_SAU:0 "Kingdom of Saudi Arabia"
 KRCW_SAU_DEF:0 "the Kingdom of Saudi Arabia"
 KRCW_SAU_ADJ:0 "Saudi"
 KRCW_P_YEM_long:0 "Imamate"
 KRCW_P_YEM:0 "Imamate"
 KRCW_L_YEM:0 "Ahmad bin Yahya"
 KRCW_L_YEM_desc:0 "Once the British revolution withdrew the Aden garrison, the Imam of Yemen took Aden and the Hadhramaut in the 1920s."
 KRCW_YEM:0 "Mutawakkilite Kingdom of Yemen"
 KRCW_YEM_DEF:0 "the Kingdom of Yemen"
 KRCW_YEM_ADJ:0 "Yemeni"
 KRCW_P_OMA_long:0 "Sultan's Court"
 KRCW_P_OMA:0 "Court"
 KRCW_L_OMA:0 "Said bin Taimur"
 KRCW_L_OMA_desc:0 "The Imamate holds the interior; the Sultan rules only the coast."
 KRCW_OMA:0 "Sultanate of Muscat and Oman"
 KRCW_OMA_DEF:0 "the Sultanate of Muscat and Oman"
 KRCW_OMA_ADJ:0 "Omani"
 KRCW_P_SMI_long:0 "Ibadi Imamate"
 KRCW_P_SMI:0 "Imamate"
 KRCW_L_SMI:0 "Muhammad bin Abdullah al-Khalili"
 KRCW_L_SMI_desc:0 "The 1920 Treaty of Seeb confirmed the Imamate's rule over the interior."
 KRCW_SMI:0 "Imamate of Oman"
 KRCW_SMI_DEF:0 "the Imamate of Oman"
 KRCW_SMI_ADJ:0 "Imamate"
 KRCW_P_DUB_long:0 "Council of Rulers"
 KRCW_P_DUB:0 "Council"
 KRCW_L_DUB:0 "Saeed bin Maktoum"
 KRCW_L_DUB_desc:0 "After the Ottoman collapse the small emirates of the Gulf coast federated at Dubai in 1945 so as not to be swallowed by the Saudis; Abu Dhabi used the moment to throw off Saudi suzerainty."
 KRCW_DUB:0 "Federation of Gulf Emirates"
 KRCW_DUB_DEF:0 "the Federation of Gulf Emirates"
 KRCW_DUB_ADJ:0 "Emirati"
 KRCW_P_QAT_long:0 "House of Thani"
 KRCW_P_QAT:0 "Thani"
 KRCW_L_QAT:0 "Abdullah bin Jassim Al Thani"
 KRCW_L_QAT_desc:0 "Independent since the Ottoman garrison left in 1944."
 KRCW_QAT:0 "Emirate of Qatar"
 KRCW_QAT_DEF:0 "Qatar"
 KRCW_QAT_ADJ:0 "Qatari"
 KRCW_P_BHR_long:0 "House of Khalifa"
 KRCW_P_BHR:0 "Khalifa"
 KRCW_L_BHR:0 "Salman bin Hamad Al Khalifa"
 KRCW_L_BHR_desc:0 "Independent since the Ottomans left in 1944; the Manama oil workers are increasingly restive."
 KRCW_BHR:0 "Emirate of Bahrain"
 KRCW_BHR_DEF:0 "Bahrain"
 KRCW_BHR_ADJ:0 "Bahraini"
 KRCW_P_KUW_long:0 "House of Sabah"
 KRCW_P_KUW:0 "Sabah"
 KRCW_L_KUW:0 "Ahmad Al-Jaber Al-Sabah"
 KRCW_L_KUW_desc:0 "Independent since the Ottoman collapse; the Republic of Iraq has never recognised it."
 KRCW_KUW:0 "Emirate of Kuwait"
 KRCW_KUW_DEF:0 "Kuwait"
 KRCW_KUW_ADJ:0 "Kuwaiti"
 KRCW_P_INO_long:0 "Indonesian National Party"
 KRCW_P_INO:0 "PNI"
 KRCW_L_INO:0 "Sukarno"
 KRCW_L_INO_desc:0 "The Dutch East Indies governed itself from Batavia through the World War. When the 1946 Dutch revolution left the colonial government without a mother country, Sukarno and Hatta declared independence at Yogyakarta; in 1947 the Amsterdam workers' council government recognised the Republic, and the Internationale holds it up as a model of \"fraternal decolonisation\"."
 KRCW_INO:0 "Republic of Indonesia"
 KRCW_INO_DEF:0 "the Republic of Indonesia"
 KRCW_INO_ADJ:0 "Indonesian"
 KRCW_P_MAL_long:0 "United Malays National Organisation"
 KRCW_P_MAL:0 "UMNO"
 KRCW_L_MAL:0 "Onn Jaafar"
 KRCW_L_MAL_desc:0 "When German East Asia collapsed in 1944 the Malay sultans and Dato' Onn formed the Federation of Malaya, taking in Singapore, Penang and Malacca. Singapore's Chinese unions are the federation's most restless force, and Siam still holds four northern Malay states."
 KRCW_MAL:0 "Federation of Malaya"
 KRCW_MAL_DEF:0 "the Federation of Malaya"
 KRCW_MAL_ADJ:0 "Malayan"
 KRCW_P_BRU_long:0 "Sultan's Court"
 KRCW_P_BRU:0 "Court"
 KRCW_L_BRU:0 "Ahmad Tajuddin"
 KRCW_L_BRU_desc:0 "When the Germans left Borneo the Sultan of Brunei reclaimed Sarawak and North Borneo as his ancestral lands."
 KRCW_BRU:0 "Sultanate of Brunei"
 KRCW_BRU_DEF:0 "the Sultanate of Brunei"
 KRCW_BRU_ADJ:0 "Bruneian"
 KRCW_P_PHI_long:0 "Liberal Party"
 KRCW_P_PHI:0 "LP"
 KRCW_L_PHI:0 "Elpidio Quirino"
 KRCW_L_PHI_desc:0 "When the American Civil War broke out the Philippine Commonwealth declared early independence in 1937. The Huk peasant army is still active in the Luzon hills."
 KRCW_PHI:0 "Republic of the Philippines"
 KRCW_PHI_DEF:0 "the Republic of the Philippines"
 KRCW_PHI_ADJ:0 "Filipino"
 KRCW_P_SIA_long:0 "Khana Ratsadon"
 KRCW_P_SIA:0 "KR"
 KRCW_L_SIA:0 "Plaek Phibunsongkhram"
 KRCW_L_SIA_desc:0 "Siam stayed neutral in the World War, then watched Chinese-backed \"brother republics\" rise on both its flanks. Field Marshal Phibun, back in power since 1948, is determined Siam will not be next."
 KRCW_SIA:0 "Kingdom of Siam"
 KRCW_SIA_DEF:0 "the Kingdom of Siam"
 KRCW_SIA_ADJ:0 "Siamese"
 KRCW_P_SRL_long:0 "United National Party"
 KRCW_P_SRL:0 "UNP"
 KRCW_L_SRL:0 "D. S. Senanayake"
 KRCW_L_SRL_desc:0 "Ceylon was ceded to Germany in 1919. After the German garrison surrendered in 1944 Senanayake founded a republic; the Trotskyist unions of the Lanka Sama Samaja Party are the island's strongest opposition."
 KRCW_SRL:0 "Republic of Ceylon"
 KRCW_SRL_DEF:0 "the Republic of Ceylon"
 KRCW_SRL_ADJ:0 "Ceylonese"
 KRCW_P_MLD_long:0 "Sultan's Court"
 KRCW_P_MLD:0 "Court"
 KRCW_L_MLD:0 "Abdul Majeed Didi"
 KRCW_L_MLD_desc:0 "The sultanate regained its independence when the German Indian Ocean squadron left in 1944."
 KRCW_MLD:0 "Sultanate of the Maldives"
 KRCW_MLD_DEF:0 "the Sultanate of the Maldives"
 KRCW_MLD_ADJ:0 "Maldivian"
 KRCW_P_BHU_long:0 "Royal Court"
 KRCW_P_BHU:0 "Court"
 KRCW_L_BHU:0 "Jigme Wangchuck"
 KRCW_L_BHU_desc:0 "A Himalayan kingdom wedged between the Indian Federation and Tibet."
 KRCW_BHU:0 "Kingdom of Bhutan"
 KRCW_BHU_DEF:0 "the Kingdom of Bhutan"
 KRCW_BHU_ADJ:0 "Bhutanese"
 KRCW_P_NEP_long:0 "Rana Dynasty"
 KRCW_P_NEP:0 "Rana"
 KRCW_L_NEP:0 "Mohan Shumsher"
 KRCW_L_NEP_desc:0 "The King is a figurehead; the hereditary Rana prime ministers hold power. The Indian Federation took Nepal's southern lands in its 1940s unification war."
 KRCW_NEP:0 "Kingdom of Nepal"
 KRCW_NEP_DEF:0 "the Kingdom of Nepal"
 KRCW_NEP_ADJ:0 "Nepali"
 KRCW_P_TOA_long:0 "Royal House"
 KRCW_P_TOA:0 "Royal"
 KRCW_L_TOA:0 "Tāufaʻāhau Tupou"
 KRCW_L_TOA_desc:0 "The one South Pacific kingdom never colonised, under the protection of the exiled Entente court in Australia."
 KRCW_TOA:0 "Kingdom of Tonga"
 KRCW_TOA_DEF:0 "the Kingdom of Tonga"
 KRCW_TOA_ADJ:0 "Tongan"
 KRCW_P_HWI_long:0 "Democratic Party of Hawaii"
 KRCW_P_HWI:0 "DPH"
 KRCW_L_HWI:0 "Ingram Stainback"
 KRCW_L_HWI_desc:0 "When Washington fell in 1941 Territorial Governor Stainback refused Sacramento's authority, swore to neither New York nor New Orleans, and proclaimed a republic. Half of the Pearl Harbor ships sailed for the West Coast and half stayed; the longshoremen grow stronger in Honolulu every year."
 KRCW_HWI:0 "Republic of Hawaii"
 KRCW_HWI_DEF:0 "the Republic of Hawaii"
 KRCW_HWI_ADJ:0 "Hawaiian"
 KRCW_P_BAD_long:0 "West Indies Federal Labour Party"
 KRCW_P_BAD:0 "WIFLP"
 KRCW_L_BAD:0 "Grantley Adams"
 KRCW_L_BAD_desc:0 "After the British revolution the Caribbean colonies formed the West Indies Federation in the 1920s. When National France fell, Martinique, Guadeloupe and French Guiana voted to join; the Bahamas, Belize and Guyana came in during the 1940s."
 KRCW_BAD:0 "West Indies Federation"
 KRCW_BAD_DEF:0 "the West Indies Federation"
 KRCW_BAD_ADJ:0 "West Indian"
 KRCW_P_SUR_long:0 "National Party"
 KRCW_P_SUR:0 "NPS"
 KRCW_L_SUR:0 "Johan Ferrier"
 KRCW_L_SUR_desc:0 "After the 1946 Dutch revolution the new government in Amsterdam gave up the West Indian colonies, and Suriname and the Netherlands Antilles formed a joint state."
 KRCW_SUR:0 "Suriname and the Antilles"
 KRCW_SUR_DEF:0 "Suriname and the Antilles"
 KRCW_SUR_ADJ:0 "Surinamese"
 KRCW_P_CUB_long:0 "Cuban Revolutionary Party (Authentic)"
 KRCW_P_CUB:0 "PRC-A"
 KRCW_L_CUB:0 "Carlos Prío Socarrás"
 KRCW_L_CUB_desc:0 "The American Civil War lifted the shadow of the Platt Amendment, but Guantánamo remains in the hands of Long's navy."
 KRCW_CUB:0 "Republic of Cuba"
