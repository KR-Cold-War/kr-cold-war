l_english:
# krcw: years paced
 krcw_fill_fra_strike_committees:0 "Frachon's Shop Discipline"
 krcw_fill_fra_strike_committees_desc:0 "Frachon brought the old strike committee methods into the factories: every shop elects a steward who answers for attendance and delivery dates. Workers complain about the meetings, but the factories deliver on time."
 krcw_fill_fra_federal_charter:0 "The Federal Constitution"
 krcw_fill_fra_federal_charter_desc:0 "The powers of the communes, the regional federations and the national congress are now written into a formal constitution. Disputes between the provinces and Paris now start with the text before they reach the street."
 krcw_fill_fra_defence_council:0 "The Federal Defence Council"
 krcw_fill_fra_defence_council_desc:0 "The defence council elected by the congress oversees army, navy and air arm, and all three work from one budget and one plan. The generals report to the council every quarter."
 krcw_fill_fra_eastern_bureau:0 "The Secretariat Eastern Bureau"
 krcw_fill_fra_eastern_bureau_desc:0 "The secretariat set up an Eastern Bureau to handle all dealings with the Accord states and contact with exiled East European workers' groups. Young delegates find it too cautious, diplomats find it too radical."
 krcw_fill_fra_womens_delegates:0 "Women Shop Delegates"
 krcw_fill_fra_womens_delegates_desc:0 "The Women's Charter requires committees to have as many women delegates as the shop floor has women workers. In the textile and electronics plants, women workers now decide shift rotas and creches in committee."
 krcw_fill_fra_consumer_plan:0 "The Consumer Goods Plan"
 krcw_fill_fra_consumer_plan_desc:0 "The planning directorate moved part of the machine tool capacity to refrigerators, washing machines and radios. Export orders fell a little, and the waiting lists in Lille got shorter."
 krcw_fill_fra_secretariat_inspectors:0 "The Secretariat Inspectors"
 krcw_fill_fra_secretariat_inspectors_desc:0 "Inspectors sent from Paris to the member federations check how resolutions are carried out and report to the secretariat every month. Cadres in the smaller members treat them politely and coolly."
 krcw_fill_fra_cadre_textbooks:0 "The Paris Cadre Textbooks"
 krcw_fill_fra_cadre_textbooks_desc:0 "Cadre schools across the Internationale now use one set of textbooks written in Paris, for both political and military courses. Officers from different members now discuss operations in the same terms."
 krcw_fill_fra_exit_clause:0 "The Exit Clause"
 krcw_fill_fra_exit_clause_desc:0 "The Internationale's statute allows any member to leave by a vote of its own congress. Member delegations negotiate with Paris with less suspicion, and agreements are reached faster."
 krcw_fill_fra_federation_offices:0 "The Federation Offices"
 krcw_fill_fra_federation_offices_desc:0 "The railways are run by the railwaymen's federation and the mines by the miners' federation, and former ministry staff were moved into the federation offices. Paperwork often went to the wrong office the first year, but production scheduling got faster."
 krcw_fill_fra_wage_scale:0 "The National Wage Scale"
 krcw_fill_fra_wage_scale_desc:0 "A single national wage scale caps the ratio between the highest and lowest pay. Textile and farm workers got raises, while more skilled steel and mine workers changed jobs."
 krcw_fill_fra_federal_security:0 "The Federal Security Office"
 krcw_fill_fra_federal_security_desc:0 "The security office keeps permanent staff in the ports, unions and universities to trace contacts with White Russian emigre groups. Its powers are questioned at every shop assembly."
 krcw_fill_fra_strasbourg_command:0 "The Strasbourg Joint Command"
 krcw_fill_fra_strasbourg_command_desc:0 "The European general staffs keep standing representatives in Strasbourg, and each member lists in advance which divisions it commits and which sector they hold. French officers fill half the command posts."
 krcw_fill_eng_pacific_broadcasts:0 "The Australian Service"
 krcw_fill_eng_pacific_broadcasts_desc:0 "Union radio started a shortwave service aimed at Australian dockers and shearers, and the seamen's union carries papers into Sydney and Fremantle."
 krcw_fill_eng_union_papers:0 "The Federation Papers"
 krcw_fill_eng_union_papers_desc:0 "The miners', railwaymen's and engineers' federations each run their own papers without a line from the secretariat. The papers argue with each other often, and readers trust official statements more for it."
 krcw_fill_eng_chamber_of_industries:0 "The Chamber of Industries"
 krcw_fill_eng_chamber_of_industries_desc:0 "The old upper house became the Chamber of Industries, where the federations send delegates by membership to review the plan. Annual targets for coal, steel and engineering are agreed here before the congress votes."
 krcw_fill_eng_open_ballot:0 "The Open Ballot"
 krcw_fill_eng_open_ballot_desc:0 "Candidates opposed to the revolution may now stand for congress legally. They won a handful of seats, and the underground groups lost members."
 krcw_fill_eng_congress_secretariat:0 "The Congress Secretariat"
 krcw_fill_eng_congress_secretariat_desc:0 "After the Scottish and Welsh assemblies were reduced to regional administrations, London set up a standing secretariat to issue all instructions. Officials in Edinburgh and Cardiff now wait for London before acting."
 krcw_fill_eng_seamens_charter:0 "The Seamen's Charter"
 krcw_fill_eng_seamens_charter_desc:0 "The charter fixes the longest voyage and the ration scale, and lets a sailor sign off at any Internationale port with the fleet paying his way home. There are queues at the merchant and navy recruiting offices."
 krcw_fill_eng_recallable_managers:0 "Recallable Managers"
 krcw_fill_eng_recallable_managers_desc:0 "Any shop meeting can recall the manager. New lines come up to speed faster, but long retooling plans often change hands halfway."
 krcw_fill_eng_national_guilds:0 "The National Guilds"
 krcw_fill_eng_national_guilds_desc:0 "Each industry forms one national guild that runs itself and supplies others by contract. Competing for contracts, the guilds deliver faster than the old plan required."
 krcw_fill_eng_intelligence_bureau:0 "The Federal Intelligence Bureau"
 krcw_fill_eng_intelligence_bureau_desc:0 "The old military intelligence files, the seamen's union port contacts and the militia security sections were merged into one bureau that answers to the congress defence committee. The unions keep a watcher on the committee."
 krcw_fill_ti_congress_planning:0 "The Congress Planning Office"
 krcw_fill_ti_congress_planning_desc:0 "The congress has a planning office that turns each biennial resolution into yearly targets for every factory. The sessions run long, but the targets rarely change afterwards."
 krcw_fill_ti_youth_festival:0 "The Internationale Youth Festival"
 krcw_fill_ti_youth_festival_desc:0 "Every summer young people from the member states gather for music, films, debates and camping. Many go home with foreign friends' addresses and foreign records."
 krcw_fill_ti_shopfloor_delegates:0 "Shop Floor Youth Delegates"
 krcw_fill_ti_shopfloor_delegates_desc:0 "Delegates from the Second Commune movement now sit in the federation congress and bring the shop complaint books with them. The offices issue fewer orders and the shops hold more meetings."
 krcw_fill_ti_brigade_volunteers:0 "The Brigade Rolls"
 krcw_fill_ti_brigade_volunteers_desc:0 "Spanish Civil War veterans and new young recruits are listed on the same rolls, ready to be formed into battalions and sent overseas at short notice."
 krcw_fill_ti_aid_technicians:0 "Overseas Technicians"
 krcw_fill_ti_aid_technicians_desc:0 "Engineers, doctors and teachers from this country serve two or three years in Algiers, Dakar and Rangoon. Those who come back bring local orders with them, and some tropical diseases too."
 krcw_fill_ti_border_posts:0 "Joint Border Posts"
 krcw_fill_ti_border_posts_desc:0 "Border guards and customs run joint posts at the main crossings, checking papers and seizing Accord leaflets and money. Lorries wait several more hours to cross."
 krcw_fill_ti_national_language_records:0 "Records in Our Own Language"
 krcw_fill_ti_national_language_records_desc:0 "Resolutions and records are drafted in the national language, and Paris pays for the French translation. Local cadres no longer wait for a translation before acting."
 krcw_fill_ti_eighteen_months:0 "The Youth Caucus"
 krcw_fill_ti_eighteen_months_desc:0 "Delegates under twenty-five hold a third of the congress seats and push for shorter service and an end to cadre canteens. The general staff complains that recruits are not trained long enough."
 krcw_fill_ti_workshop_assemblies:0 "Workshop Assembly Sovereignty"
 krcw_fill_ti_workshop_assemblies_desc:0 "The Workshop Charter gives all power to the shop assemblies and communes, with the federations as their offices. Decisions take longer to reach the centre, and the shops are keen."
 krcw_fill_ti_labour_passbooks:0 "The Internationale Labour Book"
 krcw_fill_ti_labour_passbooks_desc:0 "Workers carry one labour book across the Internationale, recording seniority, pension and housing-queue place. Factories short of hands can now hire skilled workers from neighbouring members."
 krcw_fill_ti_reserve_training:0 "Eighteen Months and the Reserve"
 krcw_fill_ti_reserve_training_desc:0 "Service is set at eighteen months plus two weeks of reserve training each year. The reserve rolls are updated yearly, so on mobilisation every battalion knows where to report."
 krcw_fill_ti_welfare_charter:0 "The Common Social Charter"
 krcw_fill_ti_welfare_charter_desc:0 "A minimum wage, the 44-hour week, universal health care, maternity hospitals and nurseries are written into the common charter. New hospitals and nurseries take part of the industrial budget."
 krcw_fill_ti_mutual_defence_clause:0 "The Mutual Defence Clause"
 krcw_fill_ti_mutual_defence_clause_desc:0 "The congress declared that an attack on any member is an attack on this country. The national reserve is now scheduled together with the other members' mobilisation tables."
 krcw_fill_ti_counter_infiltration:0 "The Counter-Infiltration Section"
 krcw_fill_ti_counter_infiltration_desc:0 "The security service set up a counter-infiltration section to vet union cadres and exile groups with links to Accord intelligence. Those wrongly arrested can appeal to a congress hearing."
 krcw_fill_ent_new_textbooks:0 "The New National Textbooks"
 krcw_fill_ent_new_textbooks_desc:0 "The new textbooks start with the continent itself, and geography lessons treat Jakarta, Manila and Nanjing as the main neighbours. Secondary schools started teaching Asian languages."
 krcw_fill_ent_migrant_ships:0 "The Migrant Ships"
 krcw_fill_ent_migrant_ships_desc:0 "The immigration department charters old troopships to carry European refugees from Naples, Piraeus and Hamburg to Fremantle. New arrivals spend a year in camps before being sent to mines and dam sites."
 krcw_fill_ent_southern_legations:0 "The Southern Legations"
 krcw_fill_ent_southern_legations_desc:0 "Canberra keeps legations in Paris, Moscow and both Washingtons, with ambassadors named by the foreign ministry and not on any bloc's recommendation. Every trade agreement is negotiated separately."
 krcw_fill_ent_federal_parliament:0 "The Federal Parliament"
 krcw_fill_ent_federal_parliament_desc:0 "The federal parliament in Canberra has one hundred and twenty seats, twenty-two of them from New Zealand. The Wellington members demand a deputy chair on every committee."
 krcw_fill_ent_northern_coast_plan:0 "The Northern Coast Plan"
 krcw_fill_ent_northern_coast_plan_desc:0 "Army and navy defend the northern coast and the Tasman sea lanes under one plan, with forward bases at Darwin and Townsville. For the first time the budget is split between the services by task."
 krcw_fill_sov_okhrana_statute:0 "The State Security Statute"
 krcw_fill_sov_okhrana_statute_desc:0 "The State Security Bureau now has a statute, a budget and auditors, and every expense is reported to the Council of State. Operations are slower, but more foreign agents are caught."
 krcw_fill_sov_council_appointments:0 "The Council of State Appointments"
 krcw_fill_sov_council_appointments_desc:0 "The Supreme Ruler appoints two thirds of the Council of State himself. Generals, bishops and trust managers are on the list, and the Council never rejects his bills."
 krcw_fill_sov_succession_commission:0 "The Succession Commission"
 krcw_fill_sov_succession_commission_desc:0 "The Council of State sets up a secret commission to draft election rules and interim arrangements for a vacancy at the top. Every faction places its men in it to watch the others."
 krcw_fill_sov_staff_seat:0 "The General Staff Seat"
 krcw_fill_sov_staff_seat_desc:0 "The Chief of the General Staff attends every session of the Council of State, and military budgets and appointments pass his desk first. The army can now plan on a steady budget."
 krcw_fill_sov_provisional_administration:0 "The Provisional Administration Office"
 krcw_fill_sov_provisional_administration_desc:0 "Until a new Supreme Ruler is elected, the deputy ministers form an administration office that keeps the post, the wages and the army rations going out on time."
 krcw_fill_sov_ration_guarantee:0 "The Ration Guarantee"
 krcw_fill_sov_ration_guarantee_desc:0 "The new programme writes ration quotas and pay days into law, and the State Security Bureau makes the provinces comply. Factories set aside more capacity for consumer goods."
 krcw_fill_sov_nationalities_office:0 "The Nationalities Office"
 krcw_fill_sov_nationalities_office_desc:0 "The Interior Ministry opens a Nationalities Office that registers the schools, churches and local delegates of each people. Petitions from the provinces finally have a desk to go to."
 krcw_fill_sov_nationalities_resolution:0 "The Resolution on the National Question"
 krcw_fill_sov_nationalities_resolution_desc:0 "The Council of State resolution confirms the provincial autonomy agreements and their conscription duties. Recruits from the border provinces report on time and local garrisons shrink."
 krcw_fill_sov_press_statute:0 "The Press Statute"
 krcw_fill_sov_press_statute_desc:0 "Newspapers are no longer censored article by article, and editors draw the line themselves under the statute. Papers that cross it are closed, and the rest may criticise the ministries."
 krcw_fill_sov_trinity_pilgrimage:0 "The Trinity Pilgrimage"
 krcw_fill_sov_trinity_pilgrimage_desc:0 "The Church organises a yearly pilgrimage to the Trinity Lavra, and the railways run special trains for the pilgrims. The reopened churches pray for the army every Sunday."
 krcw_fill_sov_cossack_hosts:0 "The Cossack Host Establishments"
 krcw_fill_sov_cossack_hosts_desc:0 "The Don and Kuban Hosts have their own military establishments and lands again. They raise troops village by village and supply most of the cavalry and reconnaissance units."
 krcw_fill_sov_emigre_screening:0 "The Emigre Screening Office"
 krcw_fill_sov_emigre_screening_desc:0 "The Okhrana sets up screening offices at border stations and ports to question every returning emigre and foreign worker. Suspects are sent east of the Yenisei."
 krcw_fill_sov_export_quota_office:0 "The Export Quota Office"
 krcw_fill_sov_export_quota_office_desc:0 "Exports of oil, chromium and timber now need a licence from the Quota Office, and what is withheld from the Internationale goes to domestic factories. Foreign currency earnings fall."
 krcw_fill_sov_hidden_front_bureau:0 "The Hidden Front Bureau"
 krcw_fill_sov_hidden_front_bureau_desc:0 "The Foreign Intelligence Directorate brings broadcasting, the underground networks and the economic war under one bureau. Its quarterly reports go straight to the Supreme Ruler."
 krcw_fill_sov_moscow_garrison:0 "The Moscow Garrison Command"
 krcw_fill_sov_moscow_garrison_desc:0 "Two Guards divisions run a garrison command in Moscow, in charge of the curfew, the checkpoints and the guard on government buildings. Nothing happens in the capital without it."
 krcw_fill_sov_directorate_budget:0 "The Directorate Budget Office"
 krcw_fill_sov_directorate_budget_desc:0 "Under the charter Sorokin holds the budget and signs every ministry's monthly allocation. Both the Speaker and the Chief of Staff have to go through him for money."
 krcw_fill_wgr_moabit_circle:0 "The Moabit Circle"
 krcw_fill_wgr_moabit_circle_desc:0 "Thaelmann and a few former cellmates form the core of the party leadership and settle the important decisions among themselves. Members outside the circle find it hard to rise."
 krcw_fill_wgr_new_civil_service:0 "The New Civil Service Examinations"
 krcw_fill_wgr_new_civil_service_desc:0 "Judges, headmasters and police officers left over from the Empire must pass new examinations to keep their posts, and union nominees fill the vacancies. The ministries run slower for the first years."
 krcw_fill_wgr_textbook_commission:0 "The History Textbook Commission"
 krcw_fill_wgr_textbook_commission_desc:0 "The Education Ministry has teachers and historians rewrite the textbooks covering 1914 to 1943. The new books are introduced in every state at once."
 krcw_fill_wgr_technical_schools:0 "The Trade Union Technical Schools"
 krcw_fill_wgr_technical_schools_desc:0 "The halls of the old gymnastics and rifle clubs become trade union technical schools where young people learn lathe work and electrics. The factories get more skilled hands."
 krcw_fill_wgr_common_archive:0 "The All-German Archive"
 krcw_fill_wgr_common_archive_desc:0 "The archive collects dialect recordings, parish registers and local histories from both German states, and the radio runs a weekly programme on them. People in the East listen too."
 krcw_fill_wgr_constitutional_oath:0 "The Constitutional Oath"
 krcw_fill_wgr_constitutional_oath_desc:0 "Soldiers swear to defend the constitution and may refuse unconstitutional orders. Officers who dream of a coup find it harder to recruit accomplices."
 krcw_fill_wgr_war_memorial:0 "The Memorial to the War Dead"
 krcw_fill_wgr_war_memorial_desc:0 "The churches and the city hold a joint yearly service at the memorial. The families of the fallen receive a single standard pension."
 krcw_fill_wgr_labour_courts:0 "The Labour Courts"
 krcw_fill_wgr_labour_courts_desc:0 "Labour courts with union-elected lay judges hear workplace disputes, and strikes must go to mediation first. Fewer days are lost to stoppages."
 krcw_fill_wgr_social_insurance:0 "The Unified Social Insurance Office"
 krcw_fill_wgr_social_insurance_desc:0 "The union federation runs the merged sickness, accident and pension insurance, paid by factories out of their wage bills. Workers no longer pay up front to see a doctor."
 krcw_fill_wgr_ruhr_counterintelligence:0 "The Ruhr Counter-Intelligence Office"
 krcw_fill_wgr_ruhr_counterintelligence_desc:0 "The Intelligence Directorate posts counter-intelligence officers in Ruhr factories, ports and airfields to vet new hires. The works councils complain that the vetting is too strict."
 krcw_fill_ddr_national_front_office:0 "The National Front Liaison Office"
 krcw_fill_ddr_national_front_office_desc:0 "The Chancellery opens a liaison office that negotiates separately with the officer corps, the nationalist unions and the Junker landowners. Every faction's demands land here before Schleicher decides."
 krcw_fill_ddr_police_pretraining:0 "People's Police Pre-Training"
 krcw_fill_ddr_police_pretraining_desc:0 "Young men spend half a year in People's Police camps before transferring to the Reichswehr. The reserve rolls are not reported to Moscow."
 krcw_fill_ddr_peoples_chamber:0 "The Elected People's Chamber"
 krcw_fill_ddr_peoples_chamber_desc:0 "The People's Chamber is elected by universal suffrage, and the striking unions now have their own deputies. The defence budget has to be fought through the Chamber every year."
 krcw_fill_ddr_skilled_register:0 "The Skilled Worker Register"
 krcw_fill_ddr_skilled_register_desc:0 "Engineers, skilled workers and doctors are put on a register and need a permit to leave. Those who stay keep the factories running, and many families resent it."
 krcw_fill_ddr_cabinet_procedure:0 "The Cabinet Collective Procedure"
 krcw_fill_ddr_cabinet_procedure_desc:0 "Cabinet decisions are now taken by a vote of ministers, with the minutes filed at the constitutional court. The government can do its business without Schleicher."
 krcw_fill_ddr_republican_oath:0 "The Republican Oath"
 krcw_fill_ddr_republican_oath_desc:0 "The Reichswehr swears loyalty to the German National Republic and leaves the reading of the constitution to the courts. Officers need not choose between the general and the emperor."
 krcw_fill_ddr_counterintelligence:0 "The Abwehr Counter-Espionage Section"
 krcw_fill_ddr_counterintelligence_desc:0 "The Abwehr and the political police place informers around rail junctions, chemical plants and barracks. The families of the accused are moved out of the border districts."
 krcw_fill_ddr_officer_selection:0 "The Officer Selection Board"
 krcw_fill_ddr_officer_selection_desc:0 "The Chancellery sets up a selection board that reviews every officer's background, promotions and loyalty record. One office now decides who joins the officer corps."
 krcw_fill_ddr_crown_loyalty:0 "The Monarchists in the Ranks"
 krcw_fill_ddr_crown_loyalty_desc:0 "Officers salute the empty Hohenzollern throne when they take the oath, and the regiments hang the imperial colours again. The monarchists now have contacts in every regiment."
 krcw_fill_ma_royal_guard:0 "The Royal Guard"
 krcw_fill_ma_royal_guard_desc:0 "The king forms a guard answering only to the crown, with officers he appoints himself. Parliament has no say over its budget."
 krcw_fill_ma_university_charters:0 "The University Charters"
 krcw_fill_ma_university_charters_desc:0 "Universities regain the right to elect their rectors and hire their professors, and newspapers may report on trials. The gendarmes still log meetings at the gates."
 krcw_fill_ma_counter_insurgency_school:0 "The Accord Counter-Insurgency School"
 krcw_fill_ma_counter_insurgency_school_desc:0 "Officers from every member state learn blockades, village resettlement and amnesty offers at a joint school. Graduates go home to lead the sweeps in the mountains."
 krcw_fill_ma_gendarmerie_political_section:0 "The Gendarmerie Political Section"
 krcw_fill_ma_gendarmerie_political_section_desc:0 "The gendarmerie forms a political section that watches suspect groups in factories, universities and railways and hands captured radios to the Accord joint intelligence office."
 krcw_fill_usa_county_sheriffs:0 "The County Sheriffs"
 krcw_fill_usa_county_sheriffs_desc:0 "Every county sheriff and postmaster owes his job to the machine, and watches the local unions and the opposition for New Orleans."
 krcw_fill_usa_long_memorial_fund:0 "The Huey Long Memorial Fund"
 krcw_fill_usa_long_memorial_fund_desc:0 "The party raises money in every state for Long monuments and memorial libraries. Each heir attends the unveilings to show he is still Long's man."
 krcw_fill_usa_homestead_allowance:0 "The Homestead Allowance"
 krcw_fill_usa_homestead_allowance_desc:0 "Every family draws a monthly homestead allowance paid for by the graduated tax on oil and railroad companies. The Treasury ties up part of the factory output to fund it."
 krcw_fill_usa_veterans_legion:0 "The Civil War Veterans' Legion"
 krcw_fill_usa_veterans_legion_desc:0 "Veterans who received the bonus formed county chapters and help the Army drill recruits between harvests."
 krcw_fill_usa_charity_hospitals:0 "The State Charity Hospitals"
 krcw_fill_usa_charity_hospitals_desc:0 "Each district has a free public hospital staffed by state university medical schools, which also takes in Army wounded."
 krcw_fill_usa_counterintelligence_section:0 "The FBI Counterintelligence Section"
 krcw_fill_usa_counterintelligence_section_desc:0 "The FBI keeps standing counterintelligence sections on the docks and in the oil fields, and trades lists of eastern agents with the Russian Third Section."
 krcw_fill_usa_russian_advisory_group:0 "The Russian Military Advisory Group"
 krcw_fill_usa_russian_advisory_group_desc:0 "The Russian advisers stay at the War Department, help the committee draw up staff plans, and report to Moscow on the emergency regularly."
 krcw_fill_wca_memphis_transmitter:0 "The Memphis Transmitter"
 krcw_fill_wca_memphis_transmitter_desc:0 "The Memphis tower broadcasts west every night. Listeners there write back, and their letters often carry news of Long's army and offices."
 krcw_fill_wca_southern_textile_locals:0 "The Southern Textile Locals"
 krcw_fill_wca_southern_textile_locals_desc:0 "Black and white textile workers joined the same locals, and the southern mill committees can finally run the shifts under the uniform clause."
 krcw_fill_wca_river_brigades:0 "The River Brigades"
 krcw_fill_wca_river_brigades_desc:0 "Made up of union men and veterans who fled the west bank, they practise night crossings on the Ohio and keep contacts on the far side."
 krcw_fill_wca_regional_branches:0 "The Regional Union Branches"
 krcw_fill_wca_regional_branches_desc:0 "The merged union is organised by region, so one branch schedules the steel mills, mines and haulage of a whole city."
 krcw_fill_wca_four_districts:0 "The Four District Commands"
 krcw_fill_wca_four_districts_desc:0 "The Great Lakes, Atlantic, Appalachian and Southern districts each have a headquarters, and the Appalachian command holds the whole river line."
 krcw_fill_wca_factory_reserve:0 "The Factory Reserve Companies"
 krcw_fill_wca_factory_reserve_desc:0 "Each large plant's reserve company trains for a month a year, and the shop floor runs fewer lines while it is away."
 krcw_fill_wca_soldiers_committees:0 "The Soldiers' Committees"
 krcw_fill_wca_soldiers_committees_desc:0 "Soldiers' committees elect their platoon and company officers, and a soldiers' assembly confirms the battalion commanders. The ranks trust the men they chose."
 krcw_fill_wca_river_border_zone:0 "The Mississippi Border Zone"
 krcw_fill_wca_river_border_zone_desc:0 "The People's Army and the defence committees guard the river crossings together. Everyone who crosses is registered, so western agents can rarely hide among the refugees."
 krcw_fill_wca_new_york_screening_office:0 "The New York Harbour Screening Office"
 krcw_fill_wca_new_york_screening_office_desc:0 "The defence committee screens every arrival from Le Havre at New York harbour, technicians and students included."
 krcw_fill_wca_card_registry:0 "The Union Card Registry"
 krcw_fill_wca_card_registry_desc:0 "Each federation's registry issues the union cards and so decides who may vote. Those without a card resent the Congress more and more."
 krcw_fill_wca_bloc_voting:0 "Bloc Voting in Congress"
 krcw_fill_wca_bloc_voting_desc:0 "Congress votes by faction, so construction budgets and works bills pass on the first reading."
 krcw_fill_psa_martial_orders:0 "The Military District Orders"
 krcw_fill_psa_martial_orders_desc:0 "Under the War Powers Act the port districts of San Francisco, Oakland, Los Angeles and Seattle are run by the Western Defense Command, and the city police carry out the Presidio's orders."
 krcw_fill_psa_proconsular_office:0 "The Military District Administration"
 krcw_fill_psa_proconsular_office_desc:0 "The Western Defense Command's administration approves every port, yard and railway project in the military districts, and the state legislatures and city governments can no longer hold up the money."
 krcw_fill_psa_western_national_guard:0 "The Western National Guard"
 krcw_fill_psa_western_national_guard_desc:0 "Eighteen-year-old men serve a year in the National Guard and then go onto the county reserve rolls."
 krcw_fill_mex_state_committees:0 "The Party State Committees"
 krcw_fill_mex_state_committees_desc:0 "Maximino appoints every state committee secretary of the party himself, and each reports the state's taxes and transit takings to him monthly."
 krcw_fill_mex_land_registry:0 "The Ejido Land Registry"
 krcw_fill_mex_land_registry_desc:0 "The Agriculture Ministry sends surveyors to re-register every ejido, including the plots the generals and landlords have taken back."
 krcw_fill_mex_military_college:0 "The Officers' Refresher College"
 krcw_fill_mex_military_college_desc:0 "Generals who were not bought off are sent back to the military college to study the Russian equipment and the rules of civilian control alongside young officers."
 krcw_fill_yn_foreign_ministry:0 "The Independent Foreign Ministry"
 krcw_fill_yn_foreign_ministry_desc:0 "The Foreign Ministry keeps missions in both Paris and Moscow and hears out loan and aid offers from either side."
 krcw_fill_yn_land_committees:0 "The Village Land Committees"
 krcw_fill_yn_land_committees_desc:0 "Village land committees divide the nationalised plantations and estates among the tenants, and families who received land settle down in the countryside."
 krcw_fill_yn_national_radio:0 "The National Radio and Theatre"
 krcw_fill_yn_national_radio_desc:0 "The National Radio broadcasts news and folk songs in the national language, and the National Theatre tours the provinces on the Education Ministry's budget."
 krcw_fill_chi_reconstruction_commission:0 "National Reconstruction Commission"
 krcw_fill_chi_reconstruction_commission_desc:0 "The Sixth Congress set up a National Reconstruction Commission to direct postwar railways, factories and water works. Provincial building funds now need Nanjing's approval first."
 krcw_fill_chi_youth_league:0 "The Literacy Brigades"
 krcw_fill_chi_youth_league_desc:0 "Youth League members run literacy classes in the villages and night schools in the factories. The best of them are recommended to county party offices as clerks."
 krcw_fill_chi_central_tax_office:0 "Provincial Branches of the Central Tax Office"
 krcw_fill_chi_central_tax_office_desc:0 "The Finance Ministry opened tax branches in Shanxi, Guangxi and Shaanxi to take over land and transit taxes once collected by the local generals. A company of central troops guards each office."
 krcw_fill_chi_frontier_affairs_office:0 "Frontier Affairs Office"
 krcw_fill_chi_frontier_affairs_office_desc:0 "The office handles correspondence with the Kashag, issues passes into Tibet and keeps track of Lhasa nobles who meet Indian and Russian visitors."
 krcw_fill_chi_baojia_militia:0 "The New Baojia Militia"
 krcw_fill_chi_baojia_militia_desc:0 "Clan elders and baojia heads were folded into the township offices, and each baojia sends young men to a self-defence unit. The county pays and arms them and keeps the rolls for conscription."
 krcw_fill_chi_party_school:0 "The Central Party School"
 krcw_fill_chi_party_school_desc:0 "The school sends trained middle cadres to the provinces and ministries every year. Its lecturers include economics professors and party men with ten years in county work."
 krcw_fill_chi_phonetic_committee:0 "National Language Committee"
 krcw_fill_chi_phonetic_committee_desc:0 "The committee prints simplified-character primers and phonetic readers for every primary school and people's education hall. Old-school writers protest in the papers and the printing goes on."
 krcw_fill_chi_candidate_review:0 "Candidate Review Board"
 krcw_fill_chi_candidate_review_desc:0 "A board of the CEC organisation department vets every National Assembly candidate. Those struck off may appeal, and the same board hears the appeal."
 krcw_fill_chi_shanghai_chambers:0 "Shanghai Chamber Liaison Office"
 krcw_fill_chi_shanghai_chambers_desc:0 "Gu Mengyu set up a liaison office in the Executive Yuan where Shanghai mills, banks and shipping firms come each month to discuss orders and credit. The party left thinks the door is open too wide."
 krcw_fill_chi_trade_union_law:0 "The Trade Union Law"
 krcw_fill_chi_trade_union_law_desc:0 "Li Lisan's Trade Union Law sets the eight-hour day, collective contracts and labour arbitration courts. A factory must go to arbitration before a stoppage."
 krcw_fill_chi_tutelage_decree:0 "The Tutelage Extension Decree"
 krcw_fill_chi_tutelage_decree_desc:0 "Tutelage runs ten more years and the provincial and county party offices keep acting in place of assemblies. Constitutionalist journals must pass party review before printing."
 krcw_fill_chi_rural_reconstruction_ministry:0 "The Rural Reconstruction Ministry of Agriculture"
 krcw_fill_chi_rural_reconstruction_ministry_desc:0 "The rural reconstruction school took over the Ministry of Agriculture and is spreading the Dingxian and Zouping model: extension stations, peasant schools and cooperative granaries."
 krcw_fill_chi_non_party_seats:0 "The Open Seats"
 krcw_fill_chi_non_party_seats_desc:0 "A third of the National Assembly seats are contested outside the party. Democratic League delegates question ministers on the floor and the papers print every word."
 krcw_fill_chi_rural_credit_coops:0 "Rural Credit Cooperatives"
 krcw_fill_chi_rural_credit_coops_desc:0 "The county land committees became credit cooperatives where new landholders borrow against their deeds for seed and oxen. The old moneylending landlords lost their trade."
 krcw_fill_chi_land_tribunals:0 "The Land Tribunals"
 krcw_fill_chi_land_tribunals_desc:0 "Each county has a land tribunal for boundary, old-debt and misclassification cases. The county security corps enforces the rulings."
 krcw_fill_chi_rotating_chair:0 "Rotating Chair of the Standing Committee"
 krcw_fill_chi_rotating_chair_desc:0 "The Standing Committee changes its chair every six months and agenda and appointments go to a vote of all members. Decisions are slower and no one man can decide alone."
 krcw_fill_chi_seventh_congress_office:0 "Seventh Congress Credentials Office"
 krcw_fill_chi_seventh_congress_office_desc:0 "The credentials office of the organisation department sets delegate quotas for provincial branches and unions and hears complaints from losers. Every faction keeps a man on its staff."
 krcw_fill_jap_repatriation_bureau:0 "Repatriation Relief Bureau"
 krcw_fill_jap_repatriation_bureau_desc:0 "The bureau runs reception camps at Maizuru, Hakata and Sasebo and finds housing, rations and work for returning settlers and soldiers. The Hokkaido pioneer villages took the most."
 krcw_fill_jap_riot_police:0 "Metropolitan Police Riot Units"
 krcw_fill_jap_riot_police_desc:0 "The Metropolitan Police formed riot units to clear the black markets and register the right-wing groups. Gang bosses who cooperate got dock and construction contracts."
 krcw_fill_jap_joint_staff:0 "Joint Staff Council"
 krcw_fill_jap_joint_staff_desc:0 "The three chiefs of staff meet weekly at the Defence Agency and no operational plan goes out without the civilian director's signature. The services now share one set of maps and war games."
 krcw_fill_raj_young_princes:0 "The Young Princes' Reform Circle"
 krcw_fill_raj_young_princes_desc:0 "The young princes who signed the memorandum are trying schools, irrigation and land tax reform in their own states. The old princes say they are handing out sickles."
 krcw_fill_raj_durbar:0 "The Annual Delhi Durbar"
 krcw_fill_raj_durbar_desc:0 "Every winter the princes bring elephants and household troops to parade in Delhi and swear loyalty to the Federation. Each state also sends its quota of recruits to the federal army."
 krcw_fill_raj_security_corps:0 "Federal Security Corps Investigations Branch"
 krcw_fill_raj_security_corps_desc:0 "The branch keeps plainclothes men in Bombay, Calcutta and Kanpur checking union books and merchant remittances. Mill owners complain that someone is always taking names on the shop floor."
 krcw_fill_raj_kalimpong_network:0 "The Kalimpong Network"
 krcw_fill_raj_kalimpong_network_desc:0 "The trade agencies at Yatung and Gyantse send Kalimpong a monthly report on Chinese garrison units, snow on the passes and passing caravans."
 krcw_fill_tib_regency:0 "The Reting Regency Council"
 krcw_fill_tib_regency_desc:0 "The Reting Rinpoche gathers the ministers and the abbots of the three great monasteries and issues orders in the Dalai Lama's name. Every great family has placed its own man on the council."
 krcw_fill_tib_civil_office:0 "Kashag Office of Internal Affairs"
 krcw_fill_tib_civil_office_desc:0 "The Kashag created an internal affairs office to run schools, post stations and land tax. The Nanjing commissioner still comes to read the files once a week."
 krcw_fill_tib_amnesty:0 "Amnesty for the Faith Army"
 krcw_fill_tib_amnesty_desc:0 "Captured fighters of the faith army were released to their monasteries with the abbots as guarantors. Each monastery reports on them to the Kashag once a year."
 krcw_fill_kor_national_assembly:0 "The Korean National Assembly"
 krcw_fill_kor_national_assembly_desc:0 "Deputies of the National Revolutionary Party, the Independence Party and the peasant unions sit in the old Government-General building, passing budgets and questioning ministers."
 krcw_fill_kor_river_lines:0 "The Naktong and Han River Lines"
 krcw_fill_kor_river_lines_desc:0 "Engineers dig trenches and gun positions along the Naktong and the Han, and the General Staff puts anti-landing drills at Busan and Incheon into the yearly field exercises."
 krcw_fill_kor_coalition_cabinet:0 "The Broad Front Cabinet"
 krcw_fill_kor_coalition_cabinet_desc:0 "Socialists, nationalists and two non-party professors share the cabinet. Every bill is settled among them first, so the Assembly fights less."
 krcw_fill_vin_cooperative_economy:0 "The Cooperative Economy Clause"
 krcw_fill_vin_cooperative_economy_desc:0 "The constitution hands rice mills, fishing ports and rubber estates to cooperatives, with a federation in each of the three regions. Southern planters have taken many of these cases to court."
 krcw_fill_vin_buddhist_accord:0 "The Hue Buddhist Accord"
 krcw_fill_vin_buddhist_accord_desc:0 "The government and the Buddhist General Association agreed that temple land stays out of land reform and monks may stand for the Assembly. Hue's pagodas now lend rooms to government literacy classes."
 krcw_fill_br_drafting_committee:0 "Constitutional Drafting Committee"
 krcw_fill_br_drafting_committee_desc:0 "Delegates from every region and people form the drafting committee, with legal advisers from Nanjing explaining each article. The minutes are copied out in three languages."
 krcw_fill_br_plantation_coops:0 "Plantation Cooperatives"
 krcw_fill_br_plantation_coops_desc:0 "Colonial plantations were divided among tenants and the cooperatives buy and export the crop. Most of their bookkeepers learned accounting only months ago."
 krcw_fill_br_ethnic_councils:0 "The Ethnic Councils"
 krcw_fill_br_ethnic_councils_desc:0 "The Karen, Shan, Hmong and Lao Theung run councils in their own areas for schools and land registration. The capital gives each council a yearly road grant."
