# krcw: years paced
 krcw_chi_army_reorganisation:0 "The National Revolutionary Army under Reorganisation"
 krcw_chi_army_reorganisation_desc:0 "The unification wars left a hundred divisions, two in five of them absorbed provincial troops with their own establishments, equipment and pay scales. The Ministry of Military Administration is reorganising them one division at a time; until it is done, they all stay on the rolls."
 krcw_raj_princely_contingents:0 "The Princely Contingents"
 krcw_raj_princely_contingents_desc:0 "More than half the federal army is raised and paid by the individual states and only nominally under Delhi's command. The princes treat their troops as their bargaining stake in the Chamber of Princes, and no scheme to cut them gets through it."
