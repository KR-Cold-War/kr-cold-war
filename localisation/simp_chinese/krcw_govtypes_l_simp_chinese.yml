l_simp_chinese:
# krcw: years paced
 KRCW_GOV_SOV:0 "最高执政者专政"
 KRCW_GOV_SOV_DESC:0 "内战胜利后建立的军事独裁。最高执政者集行政与统帅权于一身，国家杜马只有咨询权，地方由总督治理。"
 KRCW_GOV_DDR:0 "总统内阁制"
 KRCW_GOV_DDR_DESC:0 "总统依紧急法令任命内阁，议会不能将其罢免。实际权力在总统府和国防军总参谋部手中。"
 KRCW_GOV_USA:0 "统一党总统制"
 KRCW_GOV_USA_DESC:0 "联邦宪法仍然有效，但选举由统一党组织，州长由总统提名。各州保留的权力比纸面上少得多。"
 KRCW_GOV_CHI:0 "国民党训政"
 KRCW_GOV_CHI_DESC:0 "依孙中山的建国大纲，由国民党代行国民主权，直到宪政条件成熟。中央执行委员会是最高权力机关。"
 KRCW_GOV_FRA:0 "公社联邦"
 KRCW_GOV_FRA_DESC:0 "权力自下而上委托：公社选出省议会，省议会与工会联合会共同选出全国代表大会。"
 KRCW_GOV_SYND:0 "工团主义共和国"
 KRCW_GOV_SYND_DESC:0 "国家由工会联合会和工人委员会治理，代表按行业与地区选出，工厂由工人管理。"
 KRCW_GOV_AUTH:0 "威权政府"
 KRCW_GOV_AUTH_DESC:0 "政府不经选举产生，由军队、王室或执政团体掌握，议会即使存在也没有实权。"
