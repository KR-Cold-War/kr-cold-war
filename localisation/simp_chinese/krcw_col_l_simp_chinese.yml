l_simp_chinese:
# krcw: years paced
 krcw_col_1_t:0 "配给证与黑市"
 krcw_col_1_d:0 "莫斯科和彼得格勒的国营商店货架空了，面包按证供应，黑市上什么都能买到。工厂的欠薪已经拖了几个月，国际的电台每天晚上都在报道这些事。"
 krcw_col.1.a:0 "严打黑市"
 krcw_col.1.b:0 "放开部分价格"
 krcw_col_2_t:0 "协定的裂痕"
 krcw_col_2_d:0 "协定的一个成员国宣布退出。它的政府说俄国已经无力兑现援助承诺，继续留在协定里只会被拖下去。其他成员国在观望。"
 krcw_col.2.a:0 "以武力相威胁"
 krcw_col.2.b:0 "让它走"
 krcw_col_3_t:0 "俄罗斯国的崩溃"
 krcw_col_3_d:0 "最高执政府已经无法发出工资，也无法调动军队。各加盟地区的议会相继宣布主权，莫斯科的将军们拒绝向人群开枪。临时政府宣布解散莫斯科协定，并在三个月内举行立宪会议选举。"
 krcw_col.3.a:0 "接受现实"
 krcw_col_4_t:0 "巴黎的长队"
 krcw_col_4_d:0 "联合会的计划配额连续两年没有完成，巴黎的商店门口排起了长队。几个行业联合会拒绝执行新的调配指令，协定的电台在反复播放罢工的消息。"
 krcw_col.4.a:0 "动用联合会的纪律"
 krcw_col.4.b:0 "向地方公社下放权力"
 krcw_col_5_t:0 "国际的裂痕"
 krcw_col_5_d:0 "国际的一个支部宣布退出，说巴黎的书记处只顾自己的经济，已经无力支援兄弟国家。其他支部在观望。"
 krcw_col.5.a:0 "以武力相威胁"
 krcw_col.5.b:0 "让它走"
 krcw_col_6_t:0 "公社的终结"
 krcw_col_6_d:0 "全国代表大会无法凑足法定人数，联合会之间的调配已经停止，各省公社开始自行其是。临时委员会宣布解散第三国际，并召开制宪议会。"
 krcw_col.6.a:0 "接受现实"
 krcw_col_10_t:0 "莫斯科协定解散"
 krcw_col_10_d:0 "俄罗斯国的临时政府宣布解散莫斯科协定。各成员国与俄国的条约义务全部终止，冷战以一方的解体结束。"
 krcw_col.10.a:0 "冷战结束了"
 krcw_col_11_t:0 "第三国际解散"
 krcw_col_11_d:0 "巴黎的临时委员会宣布解散第三国际。各支部与巴黎的义务全部终止，冷战以一方的解体结束。"
 krcw_col.11.a:0 "冷战结束了"
 krcw_col_cat:0 "隐蔽战线"
 krcw_col_cat_desc:0 "冷战也可以不开一枪就打赢：让对方的经济停转、让对方的人民不再相信自己的政府。\n\n国际危机度：[?global.krcw_ti_crisis]/100\n协定危机度：[?global.krcw_ma_crisis]/100\n到达100时，该阵营解体，冷战结束。"
 krcw_col_radio:0 "加强对敌广播"
 krcw_col_radio_desc:0 "增加对方语言的短波广播，报道对方报纸不登的罢工、短缺和审判。"
 krcw_col_underground:0 "资助对方的地下组织"
 krcw_col_underground_desc:0 "通过中立国把钱和印刷机送给对方境内的反对派。被发现会让关系更紧张。"
 krcw_col_econ_war:0 "发动经济战"
 krcw_col_econ_war_desc:0 "对对方的出口实行禁运，在中立市场上抛售对方急需换汇的商品。我们自己也要付出代价。"
 krcw_col_purge:0 "清查渗透网络"
 krcw_col_purge_desc:0 "警察和保卫部门清查境外资助的组织。抓的人越多，街上的人越不满。"
 krcw_col_stabilise:0 "经济稳定计划"
 krcw_col_stabilise_desc:0 "动用储备，优先保证食品和燃料供应，推迟一部分军工项目。"
