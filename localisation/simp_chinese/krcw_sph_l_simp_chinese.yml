 krcw_sph_RAJ_ultimatum_desc:0 "对方拒绝过我们的条约或建议，或投向了别的大国，又不在任何阵营里，我们可以要求它成为保护国，否则开战。需要当地影响力至少30，我们的陆军至少是对方的两倍。全世界每年只能发出一次这样的最后通牒，当地的其他大国可能给对方送武器或提供保障。\n\n我们在当地的影响力：§Y[?From.krcw_inf_RAJ|0]§!/100"
