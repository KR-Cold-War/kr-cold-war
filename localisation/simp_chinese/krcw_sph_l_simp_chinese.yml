 krcw_sph_war.c:0 "只提出抗议"
 krcw_sph_treaty_t:0 "[From.GetName]提议签订友好通商条约"
 krcw_sph_treaty_d:0 "[From.GetNameDef]提议和我们签订友好通商条约：双方互给最惠国待遇，不承担军事义务。它的商人和顾问在我们这里已经很活跃了。"
 krcw_sph_treaty.a:0 "签约"
 krcw_sph_treaty.b:0 "婉拒"
 krcw_sph_align_t:0 "[From.GetName]邀请我们结盟"
 krcw_sph_align_d_bloc:0 "[From.GetNameDef]邀请我们加入[From.GetFactionName]。如果我们在别的阵营里，就要先退出。接受意味着冷战里我们站到了它那一边，拒绝会让它不满。"
 krcw_sph_align_d_solo:0 "[From.GetNameDef]提出保障我们的独立，条件是给它的军队通行权。我们不用加入任何一个冷战阵营，但别的大国会把我们看作它的人。"
 krcw_sph_align.a:0 "接受"
 krcw_sph_align.b:0 "拒绝"
 krcw_sph_protect_t:0 "[From.GetName]提议我们成为它的保护国"
 krcw_sph_protect_d:0 "[From.GetNameDef]提议由它负责我们的外交和国防，我们的政府保留，但重大决定要征得它的同意。它在我们这里的影响力已经很大，拒绝的代价不小。"
 krcw_sph_protect.a:0 "接受保护"
 krcw_sph_protect.b:0 "拒绝"
 krcw_sph_ult_t:0 "[From.GetName]的最后通牒"
 krcw_sph_ult_d:0 "[From.GetNameDef]要求我们成为它的保护国，否则就开战。它的军队比我们强得多。当地有影响力的其他大国会得到消息，它们可能给我们送武器或提供保障。"
 krcw_sph_ult.a:0 "屈服"
 krcw_sph_ult.b:0 "拒绝"
 krcw_sph_20_t:0 "[From.GetName]签订了条约"
 krcw_sph_20_d:0 "[From.GetNameDef]接受了友好通商条约。我们在当地的影响力不会再自然下降。"
 krcw_sph_21_t:0 "[From.GetName]婉拒了条约"
 krcw_sph_21_d:0 "[From.GetNameDef]说现在不是签约的时候。半年后可以再提，我们也可以考虑最后通牒。"
 krcw_sph_22_t:0 "[From.GetName]站到了我们这边"
 krcw_sph_22_d:0 "[From.GetNameDef]接受了我们的建议。"
 krcw_sph_23_t:0 "[From.GetName]拒绝了我们"
 krcw_sph_23_d:0 "[From.GetNameDef]拒绝了我们的建议。一年内不能再提，但我们可以考虑最后通牒。"
 krcw_sph_24_t:0 "[From.GetName]成为我们的保护国"
 krcw_sph_24_d:0 "[From.GetNameDef]同意由我们负责它的外交和国防。一段时间后，我们可以开始把它并入本国。"
 krcw_sph_25_t:0 "[From.GetName]拒绝成为保护国"
 krcw_sph_25_d:0 "[From.GetNameDef]拒绝了我们的保护。一年内不能再提，但我们可以考虑最后通牒。"
 krcw_sph_26_t:0 "[From.GetName]屈服了"
 krcw_sph_26_d:0 "[From.GetNameDef]接受了我们的最后通牒，成为我们的保护国。"
 krcw_sph_31_t:0 "[From.GetName]抵制合并"
 krcw_sph_31_d:0 "[From.GetNameDef]的政府拒绝合并，收回了一部分自治权，并解散了联合指挥部。我们要重新合并军队指挥，才能再提合并。"
 krcw_sph_ok:0 "知道了"
 krcw_sph_28_t:0 "[From.GetName]拒绝了最后通牒"
 krcw_sph_28_d:0 "[From.GetNameDef]拒绝成为我们的保护国。我们可以开战，也可以退让，但退让会让我们丢脸。"
 krcw_sph_28.a:0 "开战"
 krcw_sph_28.b:0 "退让"
 krcw_sph_30_t:0 "[From.GetName]要求合并"
 krcw_sph_30_d:0 "我们和[From.GetNameDef]已经有了关税同盟和联合指挥部，政府的大部分部门都在听它的。现在它要求我们正式并入。接受后我们的领土将成为它的领土。"
 krcw_sph_30.a:0 "同意合并"
 krcw_sph_30.b:0 "抵制"
 krcw_sph_chi_nep_road:0 "修建拉萨至加德满都公路"
 krcw_sph_chi_nep_road_desc:0 "尼泊尔的对外贸易要走印度的铁路，加尔各答的商人说了算。一条翻越喜马拉雅山的公路能给加德满都另一条出路。路要修好几年，工程队和炸药都从西藏调。\n\n需要：[NEP.GetName]影响力30"
 krcw_sph_chi_bhu_schools:0 "在不丹援建学校和医院"
 krcw_sph_chi_bhu_schools_desc:0 "不丹几乎没有现代的学校和医院。南京出钱在廷布和普那卡各办一所中学和一所医院，教员由西藏的僧人和中国的教师一起担任。德里认为这是在插手它的势力范围。\n\n需要：[BHU.GetName]影响力25"
 krcw_sph_chi_sia_rice:0 "与暹罗签订大米收购协定"
 krcw_sph_chi_sia_rice_desc:0 "南京按固定价格收购暹罗几年的大米出口，换取华商在暹罗的经营自由。曼谷的政府不信任华商，但它需要这笔外汇。\n\n需要：[SIA.GetName]影响力25"
 krcw_sph_chi_malacca:0 "召开马六甲海峡航运会议"
 krcw_sph_chi_malacca_desc:0 "南京召集马来亚和印度尼西亚的航运公司和码头工会，商定海峡的运价、引水和避风港。日本的船公司没有被邀请。\n\n需要：[MAL.GetName]影响力25、[INO.GetName]影响力20"
 krcw_sph_raj_nep_gurkha:0 "续订廓尔喀募兵条约"
 krcw_sph_raj_nep_gurkha_desc:0 "印度每年从尼泊尔山村招募廓尔喀兵，他们的军饷和退休金是这些山村最主要的收入。新条约把名额增加一倍，费用由德里承担。\n\n需要：[NEP.GetName]影响力30"
 krcw_sph_raj_bhu_punakha:0 "增加普那卡条约的年金"
 krcw_sph_raj_bhu_punakha_desc:0 "按照1910年的普那卡条约，不丹的外交接受印度的指导，印度每年付给不丹王室一笔年金。德里提出把年金增加两倍，条件是不丹不与南京建交。\n\n需要：[BHU.GetName]影响力30"
 krcw_sph_jap_phi_davao:0 "扶持达沃的日侨"
 krcw_sph_jap_phi_davao_desc:0 "达沃的麻园大多由日本侨民经营。东京通过台湾银行给他们低息贷款，让他们买下更多土地，在马尼拉的议会里替日本说话。\n\n需要：[PHI.GetName]影响力25"
 krcw_sph_sov_irq_kirkuk:0 "争取基尔库克的石油租让权"
 krcw_sph_sov_irq_kirkuk_desc:0 "俄国的石油公司向巴格达提出比现有合同更好的分成条件，要求接手基尔库克油田。伊拉克的政府需要钱，也想让两边互相竞价。\n\n需要：[IRQ.GetName]影响力30"
 krcw_sph_fra_maghreb:0 "召开马格里布工会代表大会"
 krcw_sph_fra_maghreb_desc:0 "国际在突尼斯召开马格里布各国的工会代表大会，商定统一的劳动法和铁路联运。拉巴特的苏丹对此很警惕。\n\n需要：[MOR.GetName]影响力30、[TUN.GetName]影响力30"
 krcw_sph_usa_cub_sugar:0 "提高古巴的蔗糖配额"
 krcw_sph_usa_cub_sugar_desc:0 "统一党政府把古巴蔗糖的进口配额提高一倍，价格高于世界市场。哈瓦那的种植园主会记得是谁给的钱。\n\n需要：[CUB.GetName]影响力25"
 krcw_sph_wca_dockers:0 "组织加勒比码头工人联合会"
 krcw_sph_wca_dockers_desc:0 "世界产业工人联合会的组织者在哈瓦那、太子港和圣多明各的码头上活动，要把各港口的工会合成一个联合会。新奥尔良的船公司把这看作对美国的挑衅。\n\n需要：[CUB.GetName]影响力20、[HAI.GetName]影响力10、[DOM.GetName]影响力10"
 krcw_sph_ita_alb_noli:0 "资助罗马的诺利流亡政府"
 krcw_sph_ita_alb_noli_desc:0 "1944年被赶下台的诺利主教还在罗马。意大利给他的流亡政府经费和一座电台，向阿尔巴尼亚广播。索古和俄国人会把这看作挑衅。\n\n需要：[ALB.GetName]影响力5"
 krcw_sph_sov_alb_sazan:0 "租借萨赞岛"
 krcw_sph_sov_alb_sazan_desc:0 "俄国海军提出租借发罗拉湾口的萨赞岛，修建潜艇基地。索古得到一笔租金，俄国在亚得里亚海有了一个军港。意大利会把这看作直接威胁。\n\n需要：[ALB.GetName]影响力50"
 krcw_sph_eng_gha_cocoa:0 "包购黄金海岸的可可"
 krcw_sph_eng_gha_cocoa_desc:0 "英国的合作社批发联合会提出按保证价格收购加纳全部的可可，并帮助种植者组织合作社。种植者欢迎，阿克拉的中间商反对。\n\n需要：[GHA.GetName]影响力25"
 krcw_sph_psa_hwi_pearl:0 "租借珍珠港"
 krcw_sph_psa_hwi_pearl_desc:0 "萨克拉门托提出租借珍珠港九十九年，出钱修复船坞，让太平洋舰队常驻。夏威夷的政府能得到一笔租金和一支保护它的舰队。\n\n需要：[HWI.GetName]影响力35"
 krcw_sph_wgr_swe_ore:0 "签订瑞典铁矿砂长期合同"
 krcw_sph_wgr_swe_ore_desc:0 "鲁尔的钢厂需要基律纳的铁矿砂。德国按长期合同收购瑞典的矿砂，并给瑞典的工会提供德国工厂的技术培训。\n\n需要：[SWE.GetName]影响力25"
