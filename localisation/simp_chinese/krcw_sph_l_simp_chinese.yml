 krcw_sph_CHI_cat:0 "势力范围"
 krcw_sph_CHI_cat_desc:0 "东南亚和喜马拉雅山区的小国夹在几个大国之间。南京的华侨商会、工程队和合作社干部是我们的本钱，德里和东京也在争取同样的国家。\n\n我们在势力范围内的每个国家都有一个影响力（0-100）。投资、资助政党、情报行动和军事援助能提高它，并压低其他大国的影响力。没有条约关系时，影响力每月下降；对方的执政党和我们相同时，影响力会自己上升到50。\n35：友好通商条约。60（且其他大国都不超过40）：邀请加入我们的阵营。80：提议成为保护国。对方拒绝过我们，又不在任何阵营里，我们可以发出最后通牒。保护国可以分三步并入本国。\n\n我们的影响力（其他大国）：\n[SIA.GetName]：§Y[?SIA.krcw_inf_CHI|0]§!（[RAJ.GetName] [?SIA.krcw_inf_RAJ|0]，[JAP.GetName] [?SIA.krcw_inf_JAP|0]）\n[MAL.GetName]：§Y[?MAL.krcw_inf_CHI|0]§!（[JAP.GetName] [?MAL.krcw_inf_JAP|0]）\n[INO.GetName]：§Y[?INO.krcw_inf_CHI|0]§!（[JAP.GetName] [?INO.krcw_inf_JAP|0]）\n[PHI.GetName]：§Y[?PHI.krcw_inf_CHI|0]§!（[JAP.GetName] [?PHI.krcw_inf_JAP|0]，[PSA.GetName] [?PHI.krcw_inf_PSA|0]）\n[NEP.GetName]：§Y[?NEP.krcw_inf_CHI|0]§!（[RAJ.GetName] [?NEP.krcw_inf_RAJ|0]）\n[BHU.GetName]：§Y[?BHU.krcw_inf_CHI|0]§!（[RAJ.GetName] [?BHU.krcw_inf_RAJ|0]）\n[BRU.GetName]：§Y[?BRU.krcw_inf_CHI|0]§!（[JAP.GetName] [?BRU.krcw_inf_JAP|0]）"
