 krcw_sph_CHI_counter_desc:0 "华侨社团抵制其他国家的商号，在报纸上揭露它们的特务，在议会里替南京说话。\n\n我们在当地的影响力：§Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_arms:0 "送去剩余的步枪：[From.GetName]"
 krcw_sph_CHI_arms_desc:0 "统一战争留下了大量步枪。军政部把一部分送给[From.GetNameDef]的军队，附带教官。\n\n我们在当地的影响力：§Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_RAJ_invest:0 "王公资本的贷款：[From.GetName]"
 krcw_sph_RAJ_invest_desc:0 "海得拉巴和瓜廖尔的银行给[From.GetNameDef]贷款修铁路和水坝，利息低于市面，条件是用印度的承包商。\n\n我们在当地的影响力：§Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_RAJ_fund:0 "资助王室和传统派：[From.GetName]"
 krcw_sph_RAJ_fund_desc:0 "德里给[From.GetNameDef]的王室、贵族和宗教领袖送去年金和礼物，支持他们反对共和派和工会。\n\n我们在当地的影响力：§Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_RAJ_counter:0 "情报局的行动：[From.GetName]"
 krcw_sph_RAJ_counter_desc:0 "联邦情报局在[From.GetNameDef]收买官员，查出其他国家的特务并交给当地警察。\n\n我们在当地的影响力：§Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_RAJ_arms:0 "派拉杰普特教官：[From.GetName]"
 krcw_sph_RAJ_arms_desc:0 "联邦陆军派拉杰普特和廓尔喀军官去训练[From.GetNameDef]的军队，并送去一批武器。\n\n我们在当地的影响力：§Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_SOV_invest:0 "派贸易代表团：[From.GetName]"
 krcw_sph_SOV_invest_desc:0 "俄国的贸易代表团带着机器、粮食和低息贷款去[From.GetNameDef]，换取石油和原料的长期合同。\n\n我们在当地的影响力：§Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_SOV_fund:0 "资助民族主义政党：[From.GetName]"
 krcw_sph_SOV_fund_desc:0 "外交部通过东正教会和侨民协会给[From.GetNameDef]的民族主义政党送钱。\n\n我们在当地的影响力：§Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_SOV_counter:0 "第三厅的行动：[From.GetName]"
 krcw_sph_SOV_counter_desc:0 "第三厅在[From.GetNameDef]收买警官和记者，揭露其他国家的特务。\n\n我们在当地的影响力：§Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_SOV_arms:0 "派军事顾问和武器：[From.GetName]"
 krcw_sph_SOV_arms_desc:0 "总参谋部派一个顾问组去[From.GetNameDef]，带去步枪、火炮和训练条令。\n\n我们在当地的影响力：§Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_FRA_invest:0 "派工业联合会的援助团：[From.GetName]"
 krcw_sph_FRA_invest_desc:0 "公社的工业联合会派技术员和机器去[From.GetNameDef]，帮当地工人建立自己管理的工厂。\n\n我们在当地的影响力：§Y[?From.krcw_inf_FRA|0]§!/100"
 krcw_sph_FRA_fund:0 "资助工团主义组织：[From.GetName]"
 krcw_sph_FRA_fund_desc:0 "劳动总联合会给[From.GetNameDef]的工会和工团主义组织送去经费、报纸和培训名额。\n\n我们在当地的影响力：§Y[?From.krcw_inf_FRA|0]§!/100"
 krcw_sph_FRA_counter:0 "工会的抵制：[From.GetName]"
 krcw_sph_FRA_counter_desc:0 "国际的码头和铁路工会拒绝装卸其他国家运往[From.GetNameDef]的货物。\n\n我们在当地的影响力：§Y[?From.krcw_inf_FRA|0]§!/100"
 krcw_sph_FRA_arms:0 "送去工人民兵的武器：[From.GetName]"
 krcw_sph_FRA_arms_desc:0 "公社把一批武器送给[From.GetNameDef]的工人民兵，由国际纵队的老兵负责训练。\n\n我们在当地的影响力：§Y[?From.krcw_inf_FRA|0]§!/100"
 krcw_sph_ENG_invest:0 "派合作社联合会的援助团：[From.GetName]"
 krcw_sph_ENG_invest_desc:0 "不列颠合作社批发联合会给[From.GetNameDef]的合作社提供贷款和设备，并收购它们的产品。\n\n我们在当地的影响力：§Y[?From.krcw_inf_ENG|0]§!/100"
 krcw_sph_ENG_fund:0 "资助工党和工会：[From.GetName]"
 krcw_sph_ENG_fund_desc:0 "职工大会给[From.GetNameDef]的工党和工会送去经费和组织者。\n\n我们在当地的影响力：§Y[?From.krcw_inf_ENG|0]§!/100"
 krcw_sph_ENG_counter:0 "海员工会的行动：[From.GetName]"
 krcw_sph_ENG_counter_desc:0 "不列颠海员工会在[From.GetNameDef]的港口罢工，拒绝为其他国家的船只服务。\n\n我们在当地的影响力：§Y[?From.krcw_inf_ENG|0]§!/100"
 krcw_sph_ENG_arms:0 "派舰队访问：[From.GetName]"
 krcw_sph_ENG_arms_desc:0 "一支舰队访问[From.GetNameDef]，留下一批武器和一个训练组。\n\n我们在当地的影响力：§Y[?From.krcw_inf_ENG|0]§!/100"
 krcw_sph_USA_invest:0 "石油和棉花财团的投资：[From.GetName]"
 krcw_sph_USA_invest_desc:0 "新奥尔良的石油和棉花财团在[From.GetNameDef]投资港口和种植园，条件是优先用美国的公司。\n\n我们在当地的影响力：§Y[?From.krcw_inf_USA|0]§!/100"
 krcw_sph_USA_fund:0 "资助保守派政党：[From.GetName]"
 krcw_sph_USA_fund_desc:0 "统一党通过商会给[From.GetNameDef]的保守派和军方送钱。\n\n我们在当地的影响力：§Y[?From.krcw_inf_USA|0]§!/100"
 krcw_sph_USA_counter:0 "联邦调查局的行动：[From.GetName]"
 krcw_sph_USA_counter_desc:0 "联邦调查局在[From.GetNameDef]收买警官，查出其他国家的特务。\n\n我们在当地的影响力：§Y[?From.krcw_inf_USA|0]§!/100"
 krcw_sph_USA_arms:0 "派陆战队教官：[From.GetName]"
 krcw_sph_USA_arms_desc:0 "陆战队派教官去训练[From.GetNameDef]的国民警卫队，并送去一批武器。\n\n我们在当地的影响力：§Y[?From.krcw_inf_USA|0]§!/100"
 krcw_sph_JAP_invest:0 "财阀的贷款：[From.GetName]"
 krcw_sph_JAP_invest_desc:0 "三井和三菱给[From.GetNameDef]贷款修港口和矿山，条件是产品卖给日本。\n\n我们在当地的影响力：§Y[?From.krcw_inf_JAP|0]§!/100"
 krcw_sph_JAP_fund:0 "资助民族主义政党：[From.GetName]"
 krcw_sph_JAP_fund_desc:0 "外务省通过侨民协会给[From.GetNameDef]的民族主义政党送钱。\n\n我们在当地的影响力：§Y[?From.krcw_inf_JAP|0]§!/100"
 krcw_sph_JAP_counter:0 "宪兵队的行动：[From.GetName]"
 krcw_sph_JAP_counter_desc:0 "宪兵队在[From.GetNameDef]收买官员，查出其他国家的特务。\n\n我们在当地的影响力：§Y[?From.krcw_inf_JAP|0]§!/100"
 krcw_sph_JAP_arms:0 "派台湾军的教官：[From.GetName]"
 krcw_sph_JAP_arms_desc:0 "台湾军派教官去训练[From.GetNameDef]的军队，并送去一批武器。\n\n我们在当地的影响力：§Y[?From.krcw_inf_JAP|0]§!/100"
 krcw_sph_PSA_invest:0 "旧金山银行的信贷：[From.GetName]"
 krcw_sph_PSA_invest_desc:0 "旧金山的银行给[From.GetNameDef]提供信贷，修建港口和电站。\n\n我们在当地的影响力：§Y[?From.krcw_inf_PSA|0]§!/100"
 krcw_sph_PSA_fund:0 "资助宪政派政党：[From.GetName]"
 krcw_sph_PSA_fund_desc:0 "萨克拉门托给[From.GetNameDef]的宪政派政党送去经费。\n\n我们在当地的影响力：§Y[?From.krcw_inf_PSA|0]§!/100"
 krcw_sph_PSA_counter:0 "海军情报局的行动：[From.GetName]"
 krcw_sph_PSA_counter_desc:0 "太平洋舰队的情报局在[From.GetNameDef]查出其他国家的特务。\n\n我们在当地的影响力：§Y[?From.krcw_inf_PSA|0]§!/100"
 krcw_sph_PSA_arms:0 "派太平洋舰队访问：[From.GetName]"
 krcw_sph_PSA_arms_desc:0 "太平洋舰队访问[From.GetNameDef]，留下一批武器和一个训练组。\n\n我们在当地的影响力：§Y[?From.krcw_inf_PSA|0]§!/100"
 krcw_sph_ITA_invest:0 "合作社银行的贷款：[From.GetName]"
 krcw_sph_ITA_invest_desc:0 "博洛尼亚的合作社银行给[From.GetNameDef]贷款修港口和灌溉渠，条件是由意大利的合作社承建。\n\n我们在当地的影响力：§Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_ITA_fund:0 "资助当地的工会：[From.GetName]"
 krcw_sph_ITA_fund_desc:0 "意大利劳工总联合会给[From.GetNameDef]的工会和左翼政党送去经费和培训名额。\n\n我们在当地的影响力：§Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_ITA_counter:0 "安全部门的行动：[From.GetName]"
 krcw_sph_ITA_counter_desc:0 "意大利的安全部门在[From.GetNameDef]查出其他国家的特务，把名单交给当地的工会。\n\n我们在当地的影响力：§Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_ITA_arms:0 "派军事援助团：[From.GetName]"
 krcw_sph_ITA_arms_desc:0 "意大利军队派教官去训练[From.GetNameDef]的军队，并送去一批步枪。\n\n我们在当地的影响力：§Y[?From.krcw_inf_ITA|0]§!/100"
 krcw_sph_WGR_invest:0 "鲁尔的设备贷款：[From.GetName]"
 krcw_sph_WGR_invest_desc:0 "鲁尔的工厂以赊账的方式给[From.GetNameDef]提供机床和发电设备，由德国的技师安装。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WGR|0]§!/100"
 krcw_sph_WGR_fund:0 "资助当地的工人党派：[From.GetName]"
 krcw_sph_WGR_fund_desc:0 "德国的工会联合会给[From.GetNameDef]的工会和工人党派送去经费、印刷机和培训名额。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WGR|0]§!/100"
 krcw_sph_WGR_counter:0 "安全部门的行动：[From.GetName]"
 krcw_sph_WGR_counter_desc:0 "德国的安全部门在[From.GetNameDef]查出其他国家的特务，把名单交给当地的工会。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WGR|0]§!/100"
 krcw_sph_WGR_arms:0 "派军事援助团：[From.GetName]"
 krcw_sph_WGR_arms_desc:0 "德国军队派教官去训练[From.GetNameDef]的军队，并送去一批步枪。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WGR|0]§!/100"
 krcw_sph_WCA_invest:0 "工团的建设贷款：[From.GetName]"
 krcw_sph_WCA_invest_desc:0 "芝加哥的工团联合会给[From.GetNameDef]贷款修港口和铁路，由当地的合作社承建。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_fund:0 "资助当地的工会：[From.GetName]"
 krcw_sph_WCA_fund_desc:0 "世界产业工人联合会给[From.GetNameDef]的码头工人、蔗糖工人和种植园工人的工会送去经费。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_counter:0 "安全部门的行动：[From.GetName]"
 krcw_sph_WCA_counter_desc:0 "工团的安全部门在[From.GetNameDef]查出统一党的特务，把名单交给当地的工会。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_arms:0 "派工团的援助团：[From.GetName]"
 krcw_sph_WCA_arms_desc:0 "工团的军队派教官去训练[From.GetNameDef]的民兵，并送去一批步枪。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_CHI_treaty:0 "签订友好通商条约：[From.GetName]"
 krcw_sph_CHI_treaty_desc:0 "影响力达到35后，可以提议签订友好通商条约：双方互给最惠国待遇，不承担军事义务。签约后我们在当地的影响力不再下降。对方可能拒绝。\n\n我们在当地的影响力：§Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_align:0 "邀请加入我们的阵营：[From.GetName]"
 krcw_sph_CHI_align_desc:0 "影响力达到60、且其他大国都不超过40时，可以邀请对方加入我们的阵营。如果对方在另一个阵营里，它要先退出。当地有影响力的其他大国会提前得到消息。对方拒绝后一年内不能再提，但我们可以考虑最后通牒。\n\n我们在当地的影响力：§Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_protect:0 "提议成为保护国：[From.GetName]"
 krcw_sph_CHI_protect_desc:0 "影响力达到80、已有条约或同在一个阵营、且其他大国都不超过30时，可以提议对方成为我们的保护国：外交和国防交给我们，政府保留。对方可能拒绝。\n\n我们在当地的影响力：§Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_ultimatum:0 "发出最后通牒：[From.GetName]"
 krcw_sph_CHI_ultimatum_desc:0 "对方拒绝过我们的条约或建议，或投向了别的大国，又不在任何阵营里，我们可以要求它成为保护国，否则开战。需要当地影响力至少30，我们的陆军至少是对方的两倍。全世界每年只能发出一次这样的最后通牒，当地的其他大国可能给对方送武器或提供保障。\n\n我们在当地的影响力：§Y[?From.krcw_inf_CHI|0]§!/100"
 krcw_sph_CHI_int1:0 "建立关税同盟：[From.GetName]"
 krcw_sph_CHI_int1_desc:0 "取消我们和对方之间的关税，统一货币和铁路运价。对方的自治程度会下降。"
 krcw_sph_CHI_int2:0 "合并军队指挥：[From.GetName]"
 krcw_sph_CHI_int2_desc:0 "关税同盟满九个月后，把对方的军队编入我们的指挥体系。"
 krcw_sph_CHI_int3:0 "并入中华民国：[From.GetName]"
 krcw_sph_CHI_int3_desc:0 "联合指挥部满九个月后，请对方的政府同意并入本国。它的领土成为我们的核心领土。对方的政府可能抵制。"
 krcw_sph_RAJ_treaty:0 "签订友好通商条约：[From.GetName]"
 krcw_sph_RAJ_treaty_desc:0 "影响力达到35后，可以提议签订友好通商条约：双方互给最惠国待遇，不承担军事义务。签约后我们在当地的影响力不再下降。对方可能拒绝。\n\n我们在当地的影响力：§Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_RAJ_align:0 "邀请加入我们的阵营：[From.GetName]"
 krcw_sph_RAJ_align_desc:0 "影响力达到60、且其他大国都不超过40时，可以邀请对方加入我们的阵营。如果对方在另一个阵营里，它要先退出。当地有影响力的其他大国会提前得到消息。对方拒绝后一年内不能再提，但我们可以考虑最后通牒。\n\n我们在当地的影响力：§Y[?From.krcw_inf_RAJ|0]§!/100"
 krcw_sph_RAJ_protect:0 "提议成为保护国：[From.GetName]"
 krcw_sph_RAJ_protect_desc:0 "影响力达到80、已有条约或同在一个阵营、且其他大国都不超过30时，可以提议对方成为我们的保护国：外交和国防交给我们，政府保留。对方可能拒绝。\n\n我们在当地的影响力：§Y[?From.krcw_inf_RAJ|0]§!/100"
