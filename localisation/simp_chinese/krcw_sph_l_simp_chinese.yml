 krcw_sph_SOV_protect_desc:0 "影响力达到80、已有条约或同在一个阵营、且其他大国都不超过30时，可以提议对方成为我们的保护国：外交和国防交给我们，政府保留。对方可能拒绝。\n\n我们在当地的影响力：§Y[?From.krcw_inf_SOV|0]§!/100"
 krcw_sph_SOV_ultimatum:0 "发出最后通牒：[From.GetName]"
 krcw_sph_SOV_ultimatum_desc:0 "对方拒绝过我们的条约或建议，或投向了别的大国，又不在任何阵营里，我们可以要求它成为保护国，否则开战。需要当地影响力至少30，我们的陆军至少是对方的两倍。全世界每年只能发出一次这样的最后通牒，当地的其他大国可能给对方送武器或提供保障。\n\n我们在当地的影响力：§Y[?From.krcw_inf_SOV|0]§!/100"
