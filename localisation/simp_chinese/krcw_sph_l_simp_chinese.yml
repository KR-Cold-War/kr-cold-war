 krcw_sph_WGR_int3_desc:0 "联合指挥部满九个月后，请对方的政府同意并入本国。它的领土成为我们的核心领土。对方的政府可能抵制。"
 krcw_sph_WCA_treaty:0 "签订友好通商条约：[From.GetName]"
 krcw_sph_WCA_treaty_desc:0 "影响力达到35后，可以提议签订友好通商条约：双方互给最惠国待遇，不承担军事义务。签约后我们在当地的影响力不再下降。对方可能拒绝。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_align:0 "邀请加入我们的阵营：[From.GetName]"
 krcw_sph_WCA_align_desc:0 "影响力达到60、且其他大国都不超过40时，可以邀请对方加入我们的阵营。如果对方在另一个阵营里，它要先退出。当地有影响力的其他大国会提前得到消息。对方拒绝后一年内不能再提，但我们可以考虑最后通牒。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_protect:0 "提议成为保护国：[From.GetName]"
 krcw_sph_WCA_protect_desc:0 "影响力达到80、已有条约或同在一个阵营、且其他大国都不超过30时，可以提议对方成为我们的保护国：外交和国防交给我们，政府保留。对方可能拒绝。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_ultimatum:0 "发出最后通牒：[From.GetName]"
 krcw_sph_WCA_ultimatum_desc:0 "对方拒绝过我们的条约或建议，或投向了别的大国，又不在任何阵营里，我们可以要求它成为保护国，否则开战。需要当地影响力至少30，我们的陆军至少是对方的两倍。全世界每年只能发出一次这样的最后通牒，当地的其他大国可能给对方送武器或提供保障。\n\n我们在当地的影响力：§Y[?From.krcw_inf_WCA|0]§!/100"
 krcw_sph_WCA_int1:0 "建立关税同盟：[From.GetName]"
 krcw_sph_WCA_int1_desc:0 "取消我们和对方之间的关税，统一货币和铁路运价。对方的自治程度会下降。"
 krcw_sph_WCA_int2:0 "合并军队指挥：[From.GetName]"
 krcw_sph_WCA_int2_desc:0 "关税同盟满九个月后，把对方的军队编入我们的指挥体系。"
 krcw_sph_WCA_int3:0 "加入美利坚联合工团：[From.GetName]"
 krcw_sph_WCA_int3_desc:0 "联合指挥部满九个月后，请对方的政府同意并入本国。它的领土成为我们的核心领土。对方的政府可能抵制。"
 krcw_sph_1001_t:0 "[SOV.GetName]在拉拢[ALB.GetName]"
 krcw_sph_1001_d:0 "我们的情报说，[SOV.GetNameDef]即将向[ALB.GetNameDef]提出结盟或保护的建议。我们在当地还有影响力（§Y[?ALB.krcw_inf_ITA|0]§!），现在出手还来得及。"
