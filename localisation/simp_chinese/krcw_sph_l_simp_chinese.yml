 krcw_sph_2001_d:0 "[SOV.GetNameDef]要求[ALB.GetNameDef]成为它的保护国，被拒绝了。战争可能就要开始。我们可以给[ALB.GetNameDef]送武器，也可以正式保障它的独立，但后者可能把我们拖进战争。"
