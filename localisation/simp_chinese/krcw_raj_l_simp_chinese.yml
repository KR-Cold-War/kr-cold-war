l_simp_chinese:
# krcw: years paced
 krcw_raj_famine_relief:0 "饥荒救济委员会"
 krcw_raj_famine_relief_desc:0 "孟加拉的粮仓重新开仓，运粮火车沿着恒河平原一路向东。救济委员会的账本上写满了亏空，但村口的尸体少了。"
 krcw_raj_integrated_armies:0 "联邦陆军"
 krcw_raj_integrated_armies_desc:0 "拉杰普特的骑兵、锡克的步兵、廓尔喀的山地营第一次穿上同一种军服、听同一个参谋部的号令——虽然他们的军饷仍由各自的王公发放。"
 krcw_raj_russian_credits:0 "卢布贷款"
 krcw_raj_russian_credits_desc:0 "莫斯科的信贷换来了孟买的轧钢机和坎普尔的兵工厂。每一笔贷款都附带一份“友好条款”，印度的外交越来越像俄罗斯外交部的一个科室。"
 krcw_raj_himalayan_game:0 "喜马拉雅棋局"
 krcw_raj_himalayan_game_desc:0 "在大吉岭的茶园和噶伦堡的骡马店里，王公的特使与拉萨贵族的管家交换着礼物、枪支与誓言。这是一场不能留下书面记录的游戏。"
 krcw_raj_princely_revolt:0 "土邦之乱"
 krcw_raj_princely_revolt_desc:0 "海德拉巴拒绝缴纳联邦税，拉杰普塔纳的几位大君关闭了城门，特伦甘纳与比哈尔的农民烧掉了地契。王公联邦赖以立国的“传统”，正在从内部崩塌。"
 krcw_raj_gwalior_charter:0 "瓜廖尔宪章"
 krcw_raj_gwalior_charter_desc:0 "1964年，辛迪亚在瓜廖尔宫的杜巴大厅里签署了宪章：土邦的私兵收归联邦，佃农第一次拥有了法定租期，王公院之外增设由各省选举的人民院。王冠仍在，但它开始向法律低头。"
 krcw_raj_iron_durbar:0 "铁腕杜巴"
 krcw_raj_iron_durbar_desc:0 "叛乱被刺刀镇压了下去。王公院宣布永久戒严，特别法庭在各地巡回。秩序恢复了——代价是整整一代人的沉默。"
 krcw_raj_russian_expedition:0 "俄罗斯远征军"
 krcw_raj_russian_expedition_desc:0 "哥萨克骑兵出现在德干高原的尘土里。王公们松了一口气，而印度的民族主义者则把这一天称作“第二次殖民”。"
 krcw_raj_tenancy_acts:0 "佃租法令"
 krcw_raj_tenancy_acts_desc:0 "在联邦直辖的几个省份，佃农的租额被限定在收成的三分之一。王公们在院会上拍案而起，但法令还是在一票之差下通过了。"
 krcw_raj_high_altitude_training:0 "高原作战训练"
 krcw_raj_high_altitude_training_desc:0 "山地师轮流在古尔马格的高原作战学校受训，学习高原适应、雪地行军和驮载山炮。部队在山上更耐用，新兵的训练期也更长。"
 krcw_tib_protectors_of_faith:0 "护教军"
 krcw_tib_protectors_of_faith_desc:0 "从康区的马帮到拉萨的寺院，“护教军”的号角在雪山之间回荡。他们手里有印度的步枪，心里有被许诺的独立——以及一个谁也说不清的未来。"
 krcw_tib_mountain_war:0 "雪山上的战争"
 krcw_tib_mountain_war_desc:0 "护教军熟悉每一条山口和每一座寺院，补给靠马帮，宿营靠牧民。进攻的一方要在缺氧、严寒和漫长的运输线下作战，守住高原比夺取高原容易得多。"
 krcw_tib_expanded_autonomy:0 "扩大自治"
 krcw_tib_expanded_autonomy_desc:0 "南京在平叛之后没有废除噶厦，反而重申“不改变现行制度”，并把边防以外的全部内政交还拉萨。许多人第一次相信，《拉萨协定》不只是一纸空文。"
 krcw_tib_independent_kashag:0 "雪域独立"
 krcw_tib_independent_kashag_desc:0 "雪狮旗在布达拉宫上空升起。独立来得太快，噶厦还不知道该如何治理一个需要外交部与财政部的国家。"
 krcw_tib_chamdo_armistice:0 "昌都停战线"
 krcw_tib_chamdo_armistice_desc:0 "没有和约，只有一条停战线。国民革命军的哨所与护教军的碉楼隔着金沙江对峙——这是冷战中最高的一道铁丝网。"
 krcw_tib_chamdo_front:0 "昌都前线司令部"
 krcw_tib_chamdo_front_desc:0 "金沙江防线上的代本团、康巴骑兵和驮运队归昌都前线司令部统一指挥。维持前线的粮秣和银元占去了噶厦预算的一大块。"
 krcw_tib_monastic_levies:0 "寺院征兵"
 krcw_tib_monastic_levies_desc:0 "三大寺的僧兵被编为正规营队。喇嘛们说，这是为了保护佛法；噶厦说，这是为了保护噶厦。"
 krcw_tib_modern_schools:0 "新式学堂"
 krcw_tib_modern_schools_desc:0 "拉萨第一所新式学堂开学了，课本用藏文与汉文双语印刷。一些贵族担心，读过书的农奴子弟不会再低头。"
 krcw_chi_tibet_pacification:0 "高原平叛"
 krcw_chi_tibet_pacification_desc:0 "国民革命军在四千米的高原上作战，补给线从成都延伸到昌都。南京一边调兵，一边向巴黎解释：这不是殖民战争。"
 krcw_raj_princely_fragmentation_2:0 "土邦割据（缓和）"
 krcw_raj_princely_fragmentation_2_desc:0 "迪万会议让联邦第一次拥有了日常的行政机器。土邦仍然各行其是，但至少它们开始回复德里的公文了。"
 krcw_raj_caste_order_2:0 "松动的种姓秩序"
 krcw_raj_caste_order_2_desc:0 "寺门开了，但村井仍然分成两口。法律走在了习俗前面，习俗正在追赶——或者抵抗。"
 krcw_raj_princely_constabulary:0 "联邦保安总队"
 krcw_raj_princely_constabulary_desc:0 "俄罗斯顾问训练的保安总队擅长驱散集会、监视报馆。它让王公们安心，也让很多人学会了沉默。"
 krcw_raj_gurkhas:0 "廓尔喀传统"
 krcw_raj_gurkhas_desc:0 "“宁死不做懦夫”——廓尔喀团的古老格言，如今写在联邦陆军的营房门口。"
 krcw_raj_arming_tibet:0 "援藏军需"
 krcw_raj_arming_tibet_desc:0 "每个月都有骡队从锡金与不丹的山口出发，驮着步枪、弹药与银元。账本上它们被记作“寺院捐赠”。"
 krcw_chi_frontier_garrisons:0 "边防驻军"
 krcw_chi_frontier_garrisons_desc:0 "国民革命军在昌都、那曲与亚东增设驻军。噶厦抗议这违反了《拉萨协定》，南京回答说：这是为了保护协定。"
 krcw_raj_convene_chamber:0 "召集王公院"
 krcw_raj_convene_chamber_desc:0 "统一战争结束两年后，五百多位王公第一次齐聚德里的王公院。他们带来了象队、珠宝和各自的要求。辛迪亚必须让他们相信：联邦比他们的土邦更值得效忠。"
 krcw_raj_scindia_presidency:0 "瓜廖尔的总统职位"
 krcw_raj_scindia_presidency_desc:0 "王公院选举瓜廖尔大君为联邦总统——终身任期，但不得世袭。辛迪亚在宣誓时把手放在薄伽梵歌与联邦宪章上，两本书的分量一样重。"
 krcw_raj_federal_secretariat:0 "联邦秘书处"
 krcw_raj_federal_secretariat_desc:0 "在新德里的红砂岩官邸里，一群从土邦借调来的文官开始为整个次大陆编制统一的预算。许多人第一次知道，联邦到底有多穷。"
 krcw_raj_dewans_council:0 "迪万会议"
 krcw_raj_dewans_council_desc:0 "各土邦的首席大臣——迪万们——组成常设会议，在王公院休会期间处理联邦事务。真正的权力开始从宫殿流向办公室。"
 krcw_raj_guardians_of_tradition:0 "否决土地改革"
 krcw_raj_guardians_of_tradition_desc:0 "1951年，王公院以压倒多数否决了土地改革草案。辛迪亚在闭幕词中说：“印度的土地属于它的神祇、它的王公与它的祖先。”佃农们没有在场。"
 krcw_raj_cautious_reform:0 "接受少壮王公备忘录"
 krcw_raj_cautious_reform_desc:0 "少数年轻王公——他们在剑桥或莫斯科读过书——在王公院发表了一份备忘录：如果王冠不愿自己改革，别人会用镰刀替它改革。"
 krcw_raj_zamindar_compact:0 "地主盟约"
 krcw_raj_zamindar_compact_desc:0 "联邦与柴明达尔地主签订盟约：地主保证税收，联邦保证他们的地契。孟加拉的稻田里，什么都没有改变。"
 krcw_raj_princely_police:0 "王公警察"
 krcw_raj_princely_police_desc:0 "各土邦警察编入统一的联邦保安总队，由俄国顾问训练，主要用于驱散集会。"
 krcw_raj_sanctity_of_durbar:0 "举行德里杜巴"
 krcw_raj_sanctity_of_durbar_desc:0 "每年冬天，德里都会举行盛大的杜巴。王公们骑象游行，民众夹道欢呼——或者被要求欢呼。"
 krcw_raj_focus_tenancy_acts:0 "佃租法令"
 krcw_raj_focus_tenancy_acts_desc:0 "在联邦直辖省份，佃租上限被定为收成的三分之一。这是王公院里一场持续了七天的辩论的结果。"
 krcw_raj_temple_entry:0 "寺庙开放令"
 krcw_raj_temple_entry_desc:0 "特拉凡哥尔的先例被推广到联邦：所有印度教徒，不论种姓，都可以进入神庙。婆罗门祭司们抗议，但寺门还是打开了。"
 krcw_raj_provincial_councils:0 "省议会"
 krcw_raj_provincial_councils_desc:0 "孟买、马德拉斯和联合省第一次举行了有限选举：只有识字的纳税人可以投票。但投票站前的队伍，比任何人预想的都要长。"
 krcw_raj_face_the_storm:0 "应对饥荒与动乱"
 krcw_raj_face_the_storm_desc:0 "德干王公拒绝纳税，比哈尔农民起事。辛迪亚召集王公院紧急会议商议对策。"
 krcw_raj_charter_federal_courts:0 "联邦法院"
 krcw_raj_charter_federal_courts_desc:0 "瓜廖尔宪章设立的联邦最高法院第一次受理了佃农诉王公的案件。判决书只有三页，但整个次大陆都在传抄。"
 krcw_raj_charter_house_of_people:0 "人民院"
 krcw_raj_charter_house_of_people_desc:0 "王公院旁边多了一座新议厅。人民院的第一届议员里有律师、教师、工会干部，还有一位曾经的贱民——他在就职演说中只说了一句话：“我们来了。”"
 krcw_raj_charter_iron_order:0 "宣布无限期戒严"
 krcw_raj_charter_iron_order_desc:0 "特别法庭在全国巡回，王公院宣布无限期戒严。辛迪亚的画像挂满了每一所学校——在那些还开着门的学校里。"
 krcw_raj_famine_commission:0 "饥荒救济委员会"
 krcw_raj_famine_commission_desc:0 "统一战争把孟加拉变成了焦土。王公院第一项全体一致通过的法令，是成立饥荒救济委员会——没有人想在自己的土邦里看见饿殍。"
 krcw_raj_grain_railways:0 "运粮铁路"
 krcw_raj_grain_railways_desc:0 "从旁遮普到孟加拉的运粮专线日夜不停。铁路是英国人留下的，现在它们第一次为饥民而跑。"
 krcw_raj_canal_colonies:0 "运河垦殖区"
 krcw_raj_canal_colonies_desc:0 "旁遮普与信德的运河被重新疏浚，新的灌溉区分给退伍士兵。王公们发现，一个有地的士兵比一个有枪的士兵更忠诚。"
 krcw_raj_end_the_famine:0 "终结饥荒"
 krcw_raj_end_the_famine_desc:0 "1954年的季风如期而至，恒河平原迎来了十年来第一个丰年。救济委员会宣布完成使命——至少这一次。"
 krcw_raj_bombay_mills:0 "孟买纺织厂"
 krcw_raj_bombay_mills_desc:0 "孟买的纺织厂重新开工，棉布经卡拉奇运往德黑兰与撒马尔罕。俄罗斯的市场比伦敦的市场更饥渴，也更不挑剔。"
 krcw_raj_jamshedpur_steel:0 "贾姆谢德布尔钢铁"
 krcw_raj_jamshedpur_steel_desc:0 "塔塔家族的钢铁厂与联邦签订了合同：高炉由俄罗斯工程师改造，产量的一半用于联邦的兵工厂。"
 krcw_raj_rouble_credits:0 "卢布贷款"
 krcw_raj_rouble_credits_desc:0 "莫斯科同意提供一笔二十年期的巨额贷款。条件写在第七页的附录里：印度在日内瓦会议和国际清算中永远站在俄罗斯一边。"
 krcw_raj_kanpur_arsenal:0 "坎普尔兵工厂"
 krcw_raj_kanpur_arsenal_desc:0 "坎普尔的新兵工厂按照图拉兵工厂的图纸建造，生产的步枪上刻着梵文与西里尔字母。"
 krcw_raj_damodar_valley:0 "达摩达尔河谷"
 krcw_raj_damodar_valley_desc:0 "达摩达尔河上的水坝既是防洪工程，也是联邦的门面。每一次剪彩，辛迪亚都会亲自到场。"
 krcw_raj_second_plan:0 "第二个联邦发展纲要"
 krcw_raj_second_plan_desc:0 "第二个十年纲要把重点放在重工业上。经济学家们在德里争论：在一个半数人口不识字的国家，钢铁究竟是出路还是幻觉？"
 krcw_raj_federal_army:0 "联邦陆军"
 krcw_raj_federal_army_desc:0 "统一战争中的各路王公私兵被整编为一支联邦陆军。军旗上的孔雀是瓜廖尔的，但军服是俄罗斯式的。"
 krcw_raj_russian_staff_college:0 "俄式参谋学院"
 krcw_raj_russian_staff_college_desc:0 "德拉敦的军事学院换上了俄罗斯教官。学员们学习“纵深作战”，也学习如何在王公面前保持沉默。"
 krcw_raj_mountain_divisions:0 "山地师"
 krcw_raj_mountain_divisions_desc:0 "喜马拉雅边境需要能在五千米高度作战的部队。锡克与多格拉营被改编为山地师，驮骡比卡车更重要。"
 krcw_raj_gurkha_regiments:0 "廓尔喀团"
 krcw_raj_gurkha_regiments_desc:0 "尼泊尔的山民继续为德里当兵，就像他们曾经为伦敦当兵一样。雇主换了，弯刀没有换。"
 krcw_raj_armoured_corps:0 "装甲军"
 krcw_raj_armoured_corps_desc:0 "第一批俄罗斯坦克在卡拉奇卸船。旁遮普的平原是坦克的天然战场——无论敌人从西边还是从东边来。"
 krcw_raj_air_arm:0 "联邦空军"
 krcw_raj_air_arm_desc:0 "俄罗斯喷气机飞越德里上空，王公们仰头观看。有人说，孔雀终于长出了铁翅膀。"
 krcw_raj_himalayan_line:0 "喜马拉雅防线"
 krcw_raj_himalayan_line_desc:0 "从拉达克到阿萨姆，一串碉堡与机场沿着雪线修建。它们既防备中国人，也监视西藏的山口。"
 krcw_raj_indian_ocean_fleet:0 "印度洋舰队"
 krcw_raj_indian_ocean_fleet_desc:0 "孟买与维沙卡帕特南的船坞开始建造护卫舰。印度洋是莫斯科协定唯一的暖水海洋——而英国人的红色舰队仍在科伦坡外游弋。"
 krcw_raj_modern_army:0 "由印度军官统领各师"
 krcw_raj_modern_army_desc:0 "第一次，印度联邦的师级单位全部由印度军官指挥。俄罗斯顾问团缩减为一个联络处。"
 krcw_raj_moscow_compact:0 "莫斯科盟约"
 krcw_raj_moscow_compact_desc:0 "没有俄罗斯的军火和顾问，王公联邦不可能打赢统一战争。德里知道这一点，莫斯科更知道这一点。"
 krcw_raj_trans_iranian_railway:0 "跨伊朗铁路"
 krcw_raj_trans_iranian_railway_desc:0 "俄罗斯保护下的波斯同意修建一条从里海直达卡拉奇的铁路。从此，俄罗斯的军火不必再绕道好望角。"
 krcw_raj_khyber_accord:0 "开伯尔协定"
 krcw_raj_khyber_accord_desc:0 "喀布尔的查希尔国王与德里签订协定：普什图部落的问题由两国共同“管理”——也就是说，由俄罗斯顾问管理。开伯尔山口两千年来第一次安静下来。"
 krcw_raj_accord_summit:0 "德里峰会"
 krcw_raj_accord_summit_desc:0 "莫斯科协定的元首们第一次在德里聚会。朗的特使迟到了两天，萨文科夫的代表坐在主位，辛迪亚则确保每一位客人都有一头大象。"
 krcw_raj_russian_scientists:0 "俄罗斯科学家"
 krcw_raj_russian_scientists_desc:0 "一群俄罗斯物理学家来到班加罗尔，建立了印度科学院的第一个实验室。他们带来的不只是仪器，还有保密条例。"
 krcw_raj_overseas_broadcasts:0 "开办全印广播对外台"
 krcw_raj_overseas_broadcasts_desc:0 "全印广播电台在德里开设对外台，用僧伽罗语、泰米尔语、缅甸语和孟加拉语向锡兰、缅甸和东孟加拉广播。节目由协定新闻局供稿，专讲国际阵营里的物资短缺和罢工。经费从联邦秘书处的宣传预算里拨出。"
 krcw_raj_purge_clearing_agents:0 "清查清算联盟的代理人"
 krcw_raj_purge_clearing_agents_desc:0 "联邦保安总队清查孟买、加尔各答和坎普尔的工会与商号，逮捕替巴黎清算联盟传递资金和传单的人。王公院强硬派要求扩大清查，孟买的厂主担心工人借机罢工。"
 krcw_raj_accord_arms_quota:0 "争取协定军工配额"
 krcw_raj_accord_arms_quota_desc:0 "德里要求协定军工委员会把山炮、卡车和轻武器的一部分订单交给印度工厂生产，由俄国提供图纸和机床。莫斯科同意了，条件是产品先供应协定的南方各国。"
 krcw_raj_play_himalayan_game:0 "制定喜马拉雅战略"
 krcw_raj_play_himalayan_game_desc:0 "拉萨的贵族们对南京的承诺将信将疑，他们在噶伦堡和大吉岭都有产业。王公联邦的特使带着礼物上路了。"
 krcw_raj_kalimpong_network:0 "噶伦堡情报网"
 krcw_raj_kalimpong_network_desc:0 "噶伦堡的羊毛商、骡夫与喇嘛成了情报员。每一驮羊毛下面，都可能压着一箱步枪。"
 krcw_raj_kham_chieftains:0 "康巴首领"
 krcw_raj_kham_chieftains_desc:0 "康区的部落首领们世代与汉地军阀为敌。王公联邦的特使许诺他们：独立后的西藏，康区将由他们自己治理。"
 krcw_raj_protectors_of_faith:0 "护教军"
 krcw_raj_protectors_of_faith_desc:0 "在锡金的一座废弃寺院里，印度教官训练着第一批“护教军”。他们的誓词是：为了佛法、为了达赖喇嘛、为了雪域。"
 krcw_raj_tibet_aftermath:0 "处理西藏战后局面"
 krcw_raj_tibet_aftermath_desc:0 "无论高原上的战争怎样结束，德里都必须收拾残局：是承认一个新的邻国，还是假装什么都没有发生过？"
 krcw_raj_lhasa_legation:0 "在拉萨开设使馆"
 krcw_raj_lhasa_legation_desc:0 "联邦在拉萨开设使馆，公开保证西藏独立，并派军事联络官常驻噶厦。这等于告诉南京，再进高原就要和印度打仗。"
 krcw_raj_special_frontier_force:0 "组建特别边境部队"
 krcw_raj_special_frontier_force_desc:0 "起事失败后逃到锡金和大吉岭的护教军战士被编成特别边境部队，由廓尔喀军官训练，驻在德拉敦附近。王公院强硬派想让它随时能越境，外交委员会担心南京抓住把柄。"
 krcw_raj_border_roads:0 "成立边境道路组织"
 krcw_raj_border_roads_desc:0 "联邦陆军工兵和各土邦的劳工队合并为边境道路组织，负责修通从平原到雪线的公路。经费从国防税里出，王公们抱怨劳工被征走了。"
 krcw_raj_leh_road:0 "修通斯利那加至列城公路"
 krcw_raj_leh_road_desc:0 "修通从斯利那加翻越佐吉拉山口到列城的公路，并在列城修一座能起降运输机的机场。拉达克的部队从此不必靠驮队补给。"
 krcw_raj_nathu_la_road:0 "修筑西里古里至乃堆拉公路"
 krcw_raj_nathu_la_road_desc:0 "从西里古里经甘托克到乃堆拉山口的公路拓宽成军用公路，沿途设兵站和油库。锡金宫廷担心联邦驻军从此不走了。"
 krcw_raj_ladakh_scouts:0 "组建拉达克侦察营"
 krcw_raj_ladakh_scouts_desc:0 "从拉达克和巴尔蒂斯坦的山民中招募侦察营，巡逻阿克赛钦方向的无人高原。他们熟悉每一个山口，但要用联邦的军饷留住他们。"
 krcw_raj_nefa_agency:0 "设立东北边境特区"
 krcw_raj_nefa_agency_desc:0 "把阿萨姆以北的部落山区划为东北边境特区，由联邦直接派政务官管理，并在提斯普尔扩建机场。阿萨姆的王公失去了对山区的名义宗主权。"
 krcw_raj_yadong_station:0 "在亚东和江孜设立情报站"
 krcw_raj_yadong_station_desc:0 "以商务代表处的名义在亚东和江孜设立情报站，由噶伦堡情报网的人员主持，记录中国驻军的番号和山口的积雪。南京知道这些人是谁，但还没有理由赶走他们。"
 krcw_raj_high_altitude_school:0 "开办高原作战学校"
 krcw_raj_high_altitude_school_desc:0 "在古尔马格开办高原作战学校，每个山地师轮流上山训练半年，学习高原适应、雪地行军和驮载山炮。训练期间这些师不能执行其他任务。"
 krcw_raj_himalayan_airlift:0 "组建高原空运联队"
 krcw_raj_himalayan_airlift_desc:0 "联邦空军用俄国运输机组建高原空运联队，从提斯普尔、巴格多格拉和列城向前沿哨所空投补给。机组要在稀薄空气里起降，损失不会小。"
 krcw_raj_himalayan_war_plan:0 "制定喜马拉雅作战计划"
 krcw_raj_himalayan_war_plan_desc:0 "总参谋部拟定在西藏和中国作战的计划：西线从列城向阿克赛钦推进，东线从乃堆拉直取亚东和江孜。计划经王公院国防委员会批准，从此德里随时可以出兵。"
 krcw_tib_regency_council:0 "摄政会议"
 krcw_tib_regency_council_desc:0 "十四世达赖喇嘛年仅十四岁，热振活佛以摄政之名主持噶厦。拉萨的每一个贵族家族都在问同一个问题：摄政之后，是谁？"
 krcw_tib_honour_agreement:0 "信守协定"
 krcw_tib_honour_agreement_desc:0 "噶厦重申《拉萨协定》：西藏承认中华民国主权，南京承诺不改变现行制度。双方都知道，这份协定之所以有效，是因为双方都需要它有效。"
 krcw_tib_sichuan_road:0 "川藏驮道"
 krcw_tib_sichuan_road_desc:0 "南京出资修缮从雅安到拉萨的驮道。骡队的行程从三个月缩短到两个月，茶叶和布匹的价格第一次下降了。"
 krcw_tib_open_modern_schools:0 "新式学堂"
 krcw_tib_open_modern_schools_desc:0 "拉萨开办了第一所新式学堂，教授藏文、汉文、算术与地理。三大寺的堪布们派人来旁听——他们想知道，孩子们究竟在学什么。"
 krcw_tib_kashag_reform:0 "噶厦改革"
 krcw_tib_kashag_reform_desc:0 "噶厦第一次编制了年度预算，并废除了部分乌拉差役。贵族们抱怨说，这是南京的主意——其实这是年轻的达赖喇嘛的主意。"
 krcw_tib_dalai_lama_majority:0 "亲政"
 krcw_tib_dalai_lama_majority_desc:0 "十四世达赖喇嘛年满十八岁，正式亲政。他在布达拉宫的第一次讲话中说：“雪域的未来不在刀枪之中。”"
 krcw_tib_friends_in_kalimpong:0 "联络噶伦堡的贵族"
 krcw_tib_friends_in_kalimpong_desc:0 "拉萨的大贵族们在噶伦堡与大吉岭都有产业。印度的朋友说：如果有一天南京背弃了协定，雪域不会孤立无援。"
 krcw_tib_raise_monastic_levies:0 "寺院征兵"
 krcw_tib_raise_monastic_levies_desc:0 "色拉寺、哲蚌寺与甘丹寺的僧兵被编为正规营队，由印度来的“朝圣者”训练。"
 krcw_tib_kham_horsemen:0 "康巴骑手"
 krcw_tib_kham_horsemen_desc:0 "康区的骑手们发誓：如果汉人的军队越过金沙江，每一条峡谷都会变成坟墓。"
 krcw_tib_mountain_warfare:0 "高原战法"
 krcw_tib_mountain_warfare_desc:0 "在五千米的高度上，氧气比子弹更珍贵。护教军的教官们把这句话写进了操典。"
 krcw_tib_hidden_arsenals:0 "在寺院藏匿武器"
 krcw_tib_hidden_arsenals_desc:0 "在大殿的佛像背后、在经书的木箱里，印度步枪被一箱一箱地藏了起来。"
 krcw_tib_after_the_war:0 "确定战后国体"
 krcw_tib_after_the_war_desc:0 "枪声停了。无论结局如何，噶厦都必须回答一个问题：雪域要成为什么样的国家？"
 krcw_tib_snow_lion_state:0 "雪狮之国"
 krcw_tib_snow_lion_state_desc:0 "独立的西藏需要一支军队、一个外交部与一种货币。噶厦用了一年时间，才学会如何给外国使馆写照会。"
 krcw_tib_delhi_treaty:0 "德里条约"
 krcw_tib_delhi_treaty_desc:0 "西藏与印度联邦签订友好条约。德里保证西藏的独立，拉萨则向印度开放山口与市场。"
 krcw_tib_neutral_zone:0 "拒绝外国驻军"
 krcw_tib_neutral_zone_desc:0 "噶厦不与德里结约，也不允许任何外国军队驻扎，边防全靠自己的代本团和寺院民兵。年轻贵族认为这样才能不做任何一方的缓冲区，亲印派认为这是把西藏送回南京手里。"
 krcw_tib_jinsha_line:0 "修筑金沙江防线"
 krcw_tib_jinsha_line_desc:0 "在昌都以东的金沙江渡口和山口修筑碉楼与战壕，对面就是国民革命军的哨所。劳役由沿线庄园摊派，贵族们抱怨乌拉差役又加重了。"
 krcw_tib_regular_regiments:0 "改编藏军代本团"
 krcw_tib_regular_regiments_desc:0 "把护教军的骑兵纵队和寺院僧兵改编成统一编制的代本团，发统一的步枪和军饷。三大寺不愿交出僧兵的指挥权。"
 krcw_tib_chamdo_command:0 "设立昌都前线司令部"
 krcw_tib_chamdo_command_desc:0 "在昌都设立前线司令部，统一指挥金沙江防线上的代本团、康巴骑兵和驮运队。司令由噶厦任命，噶伦们第一次把军权交给一个不在拉萨的人。"
 krcw_tib_expanded_self_rule:0 "扩大噶厦内政权"
 krcw_tib_expanded_self_rule_desc:0 "南京兑现平叛时的承诺，除边防与外交以外的内政都交还噶厦。南京的驻藏专员仍然留在拉萨，亲印派贵族认为这只是缓兵之计。"
 krcw_tib_reconciliation:0 "和解"
 krcw_tib_reconciliation_desc:0 "被俘的护教军战士获得了大赦，回到了自己的寺院。一些人发誓永不再拿起武器，另一些人什么都没说。"
 krcw_tib_lhasa_power_station:0 "拉萨电站"
 krcw_tib_lhasa_power_station_desc:0 "拉萨河上的小水电站点亮了布达拉宫。喇嘛们说，这是新时代的酥油灯。"
 krcw_tib_middle_way:0 "中间道路"
 krcw_tib_middle_way_desc:0 "年轻的达赖喇嘛提出了一条“中间道路”：既不回到旧日的农奴制，也不照搬南京或德里的模式。改革要从寺院与庄园开始，由藏人自己完成。"
 krcw_tib_open_passes:0 "开放山口"
 krcw_tib_open_passes_desc:0 "无论是谁统治拉萨，羊毛、茶叶与盐都得翻过山口。乃堆拉与则里拉的商路重新繁荣起来。"
 krcw_tibrev.1.t:0 "雪山上的号角"
 krcw_tibrev.1.d:0 "拉萨三大寺的法号在黎明时分同时吹响。护教军的骑兵从康区的峡谷里冲出，占领了昌都的电报局；在布达拉宫里，一群年轻贵族把南京派驻的专员请出了门——很客气，但枪口是朝前的。\n\n他们宣布：《拉萨协定》已被南京背弃，雪域从今日起自立。噶厦里的老臣们面面相觑，没有人敢第一个开口。"
 krcw_tibrev.1.a:0 "升起雪狮旗！"
 krcw_tibrev.1.b:0 "在最后一刻与南京谈判。"
 krcw_tibrev.2.t:0 "西藏宣布自立"
 krcw_tibrev.2.d:0 "拉萨的电台——如果那台旧发报机可以被称为电台的话——宣布西藏脱离中华民国。南京称之为“一小撮贵族在外国势力唆使下的叛乱”，德里则保持了意味深长的沉默。\n\n从巴黎到莫斯科，参谋们都在翻找喜马拉雅的地图：这是冷战里第一场被双方默认必须“控制在山里”的战争。"
 krcw_tibrev.2.a:0 "世界屋脊燃起了战火。"
 krcw_tibrev.3.t:0 "高原上的叛乱"
 krcw_tibrev.3.d:0 "昌都失守的电报在凌晨三点送到国民政府。周恩来披着大衣读完，只问了一句：“德里的枪，还是拉萨的心？”\n\n军政部主张以雷霆之势收复拉萨；外交部提醒说，巴黎正看着我们——第三国际不能在亚洲打一场殖民战争。"
 krcw_tibrev.3.a:0 "恢复秩序，但承诺“不改变现行制度”。"
 krcw_tibrev.3.b:0 "噶厦已经背约，西藏必须改制。"
 krcw_tibrev.4.t:0 "拉萨的使者"
 krcw_tibrev.4.d:0 "起事前夜，噶厦的一位老臣秘密派人前往南京，带去一封信：年轻人被德里的承诺冲昏了头，但噶厦仍愿意谈。"
 krcw_tibrev.4.a:0 "重申协定，扩大自治。"
 krcw_tibrev.4.b:0 "逮捕带头的贵族。"
 krcw_tibrev.10.t:0 "布达拉宫下的停战"
 krcw_tibrev.10.d:0 "护教军的最后几支骑队退进了雪山。噶厦派出代表，在布达拉宫脚下与国民革命军的前线司令签署了停战书。\n\n如何处置这片高原，现在由南京决定。"
 krcw_tibrev.10.a:0 "扩大自治，不改变现行制度。"
 krcw_tibrev.10.b:0 "取消噶厦，设立西藏省。"
 krcw_tibrev.21.t:0 "高原上的僵局"
 krcw_tibrev.21.d:0 "高原上的战争拖了下来。补给车队在二郎山的冰道上翻覆，士兵们在五千米的哨所里冻伤了手脚。巴黎的来电一封比一封急，国际需要一个稳定的亚洲，不想要一场没有尽头的西藏战争。\n\n南京必须决定怎样结束它。"
 krcw_tibrev.21.a:0 "拉萨已在我们手中：恢复自治。"
 krcw_tibrev.21.b:0 "沿金沙江停战。"
 krcw_tibrev.21.c:0 "承认噶厦的独立。"
 krcw_tibrev.30.t:0 "高原重归平静"
 krcw_tibrev.30.d:0 "战争结束了。南京没有废除噶厦——至少在默认的剧本里没有——而是重申《拉萨协定》，并把边防以外的全部内政交还拉萨。德里的特使悄悄撤回了噶伦堡。\n\n观察家们说，这是冷战中第一场被“控制住”的战争。许多人希望它不是最后一场。"
 krcw_tibrev.30.a:0 "雪山沉默了。"
 krcw_tibrev.31.t:0 "雪狮旗飘扬"
 krcw_tibrev.31.d:0 "南京承认了西藏的独立。布达拉宫前，护教军的骑兵列队接受检阅，印度联邦的使节坐在观礼台的第一排。\n\n第三国际第一次在亚洲退让了一步。在巴黎，有人说这是明智；在南京，有人说这是耻辱。"
 krcw_tibrev.31.a:0 "喜马拉雅的地图改变了。"
 krcw_tibrev.32.t:0 "金沙江停战线"
 krcw_tibrev.32.d:0 "没有和约，也没有胜者。国民革命军守住了昌都，护教军守住了拉萨。南京拒绝承认噶厦，噶厦也拒绝承认南京——双方只在一件事上达成了一致：不再开枪。"
 krcw_tibrev.32.a:0 "一道冻结的前线。"
 krcw_tibrev.5.t:0 "噶伦堡来的客人"
 krcw_tibrev.5.d:0 "一位自称羊毛商的客人来到拉萨，带来了一箱印度银元和一封没有署名的信。信里说：雪域的朋友不止在南京。"
 krcw_tibrev.5.a:0 "收下礼物。"
 krcw_tibrev.5.b:0 "把信转交南京专员。"
 krcw_raj_remembered_tt:0 "王公院和农村都会记住这件事。土邦之乱爆发时，动荡会更高。"
 krcw_raj.10.t:0 "王公院的否决"
 krcw_raj.10.d:0 "土地改革草案在王公院只得到了十一票。投票结束后，海德拉巴的尼扎姆——次大陆最富有的人——在走廊里笑着对记者说：“土地改革？我们刚刚打完一场战争，就是为了不要这种东西。”\n\n在比哈尔的村庄里，没有人读报纸。但消息还是传开了。"
 krcw_raj.10.a:0 "传统得到了维护。"
 krcw_raj.10.b:0 "辛迪亚私下召见几位年轻王公。"
 krcw_raj.11.t:0 "季风迟到了"
 krcw_raj.11.d:0 "六月过去了，天空仍然是白的。比哈尔与奥里萨的稻田龟裂，粮价一周之内翻了三倍。饥荒救济委员会的电报堆满了德里的办公桌。"
 krcw_raj.11.a:0 "开仓放粮。"
 krcw_raj.11.b:0 "向莫斯科求援。"
 krcw_raj.11.c:0 "让土邦自己想办法。"
 krcw_raj.21.t:0 "德里的求援"
 krcw_raj.21.d:0 "德里请求俄罗斯紧急援助粮食。伏尔加河的粮仓并不宽裕，但盟友总得有盟友的样子。"
 krcw_raj.21.a:0 "装船运往卡拉奇。"
 krcw_raj.21.b:0 "我们自己也不够吃。"
 krcw_raj.22.t:0 "莫斯科的答复"
 krcw_raj.22.d0:0 "俄罗斯的运粮船到了卡拉奇。第一批小麦装上了开往巴特那的火车，俄罗斯领事在码头上拍了照。"
 krcw_raj.22.d1:0 "莫斯科回电说，伏尔加河的粮仓今年没有余粮。德里只能靠自己和王公们的粮仓。"
 krcw_raj.22.a:0 "把俄国粮食分到比哈尔和奥里萨。"
 krcw_raj.22.b:0 "由联邦出钱，请王公们开仓。"
 krcw_raj.22.c:0 "实行配给，军队优先。"
 krcw_raj.12.t:0 "加瓦姆的访问"
 krcw_raj.12.d:0 "波斯首相艾哈迈德·加瓦姆抵达德里。两位莫斯科的被保护人在红堡的晚宴上互相敬酒，谈论铁路、石油与俾路支部落——以及他们共同的俄罗斯顾问。"
 krcw_raj.12.a:0 "签订过境协定。"
 krcw_raj.12.b:0 "礼貌地听着。"
 krcw_raj.13.t:0 "瓦济里斯坦的枪声"
 krcw_raj.13.d:0 "一支普什图部落武装伏击了联邦的巡逻队，然后消失在阿富汗一侧的山里。喀布尔否认知情——他们的俄罗斯顾问也否认。"
 krcw_raj.13.a:0 "请莫斯科约束喀布尔。"
 krcw_raj.13.b:0 "越境追击。"
 krcw_raj.14.t:0 "萨文科夫之死"
 krcw_raj.14.d:0 "莫斯科传来消息：鲍里斯·萨文科夫去世了。王公院为他默哀三分钟——许多王公在低头时想的是同一件事：没有了萨文科夫，俄罗斯还会为印度流血吗？"
 krcw_raj.14.a:0 "向莫斯科重申忠诚。"
 krcw_raj.14.b:0 "是时候多想想印度自己了。"
 krcw_raj.15.t:0 "冬季杜巴"
 krcw_raj.15.d:0 "德里的冬季杜巴上，一百零一头大象列队经过红堡。俄罗斯大使坐在辛迪亚的右手边，法兰西公社的记者被拒绝入场。"
 krcw_raj.15.a:0 "孔雀王座熠熠生辉。"
 krcw_raj.16.t:0 "孟买纺织厂罢工"
 krcw_raj.16.d:0 "孟买二十万纺织工人宣布罢工。传单上印着法文与马拉地文——“巴黎清算联盟”的名字第一次出现在印度的工厂里。"
 krcw_raj.16.a:0 "派保安总队驱散。"
 krcw_raj.16.b:0 "让厂主加薪。"
 krcw_raj.17.t:0 "俄罗斯的原子弹"
 krcw_raj.17.d:0 "俄罗斯的原子弹在新地岛爆炸。德里的报纸称之为“盟友之剑”；班加罗尔的几位物理学家则在私下讨论：印度是否也需要一把剑？"
 krcw_raj.17.a:0 "我们在俄罗斯的核保护伞下。"
 krcw_raj.17.b:0 "成立原子能委员会。"
 krcw_raj.18.t:0 "继承人问题"
 krcw_raj.18.d:0 "辛迪亚已经四十五岁了。他的儿子马达夫拉奥在英国式的学校里长大，爱打板球，也读过一些不该读的书。王公们开始窃窃私语：瓜廖尔的总统职位，是否真的“不得世袭”？"
 krcw_raj.18.a:0 "宪章的规定就是规定。"
 krcw_raj.18.b:0 "让马达夫拉奥进入王公院。"
 krcw_raj.19.t:0 "热线之后"
 krcw_raj.19.d:0 "巴黎与莫斯科之间架起了一条热线。在德里，外交官们意识到：如果两个巨人开始直接说话，像印度这样的国家就必须学会自己说话。"
 krcw_raj.19.a:0 "一个新时代。"
 krcw_raj.30.t:0 "雪山起火了"
 krcw_raj.30.d:0 "护教军起事的消息传到德里。王公院的外交委员会连夜开会：南京已经在昌都集结军队，而巴黎的报纸已经把“德里”这个词印在了头版上。"
 krcw_raj.30.a:0 "继续暗中支援。"
 krcw_raj.30.b:0 "否认一切，关闭山口。"
 krcw_raj.40.t:0 "新的邻国"
 krcw_raj.40.d:0 "雪狮旗在拉萨飘扬。噶厦的使者来到德里，带来了哈达、金佛与一个问题：印度愿意保护西藏到什么程度？"
 krcw_raj.40.a:0 "保证其独立，建立贸易。"
 krcw_raj.40.b:0 "西藏应当成为联邦的保护国。"
 krcw_raj.50.t:0 "海德拉巴拒绝纳税"
 krcw_raj.50.d:0 "1963年春，海德拉巴的尼扎姆宣布拒绝缴纳新的联邦国防税，理由是“王公院无权向土邦征税”。三天之内，迈索尔、博帕尔与巴罗达都发表了措辞相似的声明。\n\n十二年前被否决的土地改革，十二年来一再歉收的土地，以及十二年来越来越沉重的军费——所有的账都在这一年到期了。"
 krcw_raj.50.a:0 "召开紧急王公院会议。"
 krcw_raj.50.b:0 "调联邦陆军进驻塞康德拉巴德。"
 krcw_raj.51.t:0 "拉杰普塔纳的城门"
 krcw_raj.51.d:0 "斋浦尔、焦特布尔与比卡内尔的大君们关闭了城门，把联邦派来的税务官挡在城外。他们宣称要“恢复1947年以前的古老权利”。"
 krcw_raj.51.a:0 "与他们谈判。"
 krcw_raj.51.b:0 "包围斋浦尔。"
 krcw_raj.52.t:0 "镰刀与地契"
 krcw_raj.52.d:0 "王公们在城堡里争夺税权的时候，特伦甘纳与比哈尔的农民走进了地主的账房，把地契堆在村口烧掉。他们不认识巴黎，也不认识莫斯科——他们只认识饥饿。"
 krcw_raj.52.a:0 "派兵恢复秩序。"
 krcw_raj.52.b:0 "宣布佃租减免。"
 krcw_raj.54.t:0 "瓜廖尔宫的夜晚"
 krcw_raj.54.d:0 "辛迪亚在瓜廖尔宫的书房里坐了整整一夜。桌上摆着两份文件：一份是由迪万会议起草的宪章——土邦私兵收归联邦、佃农的法定租期、一座由选举产生的人民院；另一份是王公院强硬派起草的戒严令。\n\n天亮时，他叫来了秘书。"
 krcw_raj.54.a:0 "签署瓜廖尔宪章。"
 krcw_raj.54.b:0 "签署戒严令。"
 krcw_raj.56.t:0 "瓜廖尔宪章"
 krcw_raj.56.d:0 "印度联邦总统吉瓦吉拉奥·辛迪亚签署了《瓜廖尔宪章》。土邦私兵被收归联邦，佃农获得了法定租期，一个由选举产生的人民院将与王公院并立。\n\n莫斯科对此表示“理解”；巴黎的评论员写道：这是次大陆第一次，王冠主动向法律低头。"
 krcw_raj.56.a:0 "王冠向法律低头。"
 krcw_raj.57.t:0 "风暴过去"
 krcw_raj.57.d:0 "1965年，最后一座关闭的城门重新打开。土邦之乱结束了——但每个人都知道，印度再也回不到1963年以前的样子。"
 krcw_raj.57.a:0 "新的印度。"
 krcw_raj.58.t:0 "红色德干"
 krcw_raj.58.d:0 "农民委员会在特伦甘纳宣布成立“德干农民共和国”。联邦陆军的几个营倒戈，带着武器加入了他们。王公联邦面临的已经不是叛乱，而是内战。"
 krcw_raj.58.a:0 "战斗到底！"
 krcw_raj.59.t:0 "土邦之乱"
 krcw_raj.59.d:0 "印度联邦陷入了自统一以来最严重的危机：多个大土邦拒绝向德里纳税，农民运动在德干与恒河平原同时兴起。莫斯科与巴黎都在密切关注——一个在观望是否需要出兵，一个在观望是否应该递上火种。"
 krcw_raj.59.a:0 "次大陆在动荡。"
 krcw_raj.60.t:0 "德干的农民"
 krcw_raj.60.d:0 "国际书记处收到一份来自海得拉巴地下组织的请求：他们需要步枪、印刷机与医生。支持他们，意味着在莫斯科协定的后院点火。"
 krcw_raj.60.a:0 "只提供医生与印刷机。"
 krcw_raj.60.b:0 "送去步枪。"
 krcw_raj.60.c:0 "这是印度人自己的事。"
 krcw_raj.61.t:0 "德里的请求"
 krcw_raj.61.d:0 "辛迪亚请求俄罗斯派出远征军帮助“恢复秩序”。总参谋部说，两个师就够了；外交部说，一个师都嫌多。"
 krcw_raj.61.a:0 "派出远征军。"
 krcw_raj.61.b:0 "只送军火和顾问。"
 krcw_raj2.1.t:0 "迪万们的佃租法案"
 krcw_raj2.1.d:0 "迪万会议起草了一份佃租法案：在联邦直辖省份，地租不得超过收成的三分之一，佃农的租期不得少于十年。起草人是迈索尔的老迪万米尔扎·伊斯梅尔爵士。辛迪亚可以把它交给王公院表决，也可以先交给一个王公委员会研究，海德拉巴的尼扎姆已经表示愿意主持这个委员会。"
 krcw_raj2.1.a:0 "交王公院表决。"
 krcw_raj2.1.b:0 "先交王公委员会研究。"
 krcw_raj2.2.t:0 "王公院表决"
 krcw_raj2.2.d0:0 "佃租法案以微弱多数在王公院通过。投反对票的王公们离席抗议，海德拉巴的尼扎姆对记者说，他的土邦不会执行“德里的法令”。法案只适用于联邦直辖省份，但比哈尔和联合省的佃农已经在传它的内容。"
 krcw_raj2.2.d1:0 "佃租法案在王公院被否决，只有十几位年轻王公投了赞成票。辛迪亚可以接受否决，把法案交给王公委员会；也可以绕过王公院，在联邦直辖的省份以总统令执行，代价是王公们会认为他在破坏宪章。"
 krcw_raj2.2.a:0 "执行法案。"
 krcw_raj2.2.b:0 "绕过王公院，以总统令在直辖省份执行。"
 krcw_raj2.2.c:0 "接受否决，交王公委员会。"
 krcw_raj2.3.t:0 "王公委员会"
 krcw_raj2.3.d:0 "由海德拉巴的尼扎姆主持的王公委员会提交了报告：佃租问题由各土邦自行处理，联邦与柴明达尔地主签订盟约，地主保证税收，联邦保证地契。辛迪亚可以照单全收，也可以坚持在直辖省份设一个地租上限。"
 krcw_raj2.3.a:0 "照单全收，签订地主盟约。"
 krcw_raj2.3.b:0 "签订盟约，但在直辖省份设地租上限。"
 krcw_raj2.4.t:0 "巴特那的农民大会"
 krcw_raj2.4.d0:0 "佃租法令在直辖省份生效以后，比哈尔农民协会在巴特那召开大会。斯瓦米·萨哈贾南德·萨拉斯瓦蒂宣布，三分之一的地租只是开始，农民要的是废除柴明达尔制度。王公们认为，这证明改革只会招来更多的要求。"
 krcw_raj2.4.d1:0 "地主盟约签订后，比哈尔的佃农发现地租一分也没少。比哈尔农民协会在巴特那召开大会，斯瓦米·萨哈贾南德·萨拉斯瓦蒂号召拒交地租，直到联邦废除柴明达尔制度。上千个村子派了代表。"
 krcw_raj2.4.a:0 "与萨哈贾南德谈判。"
 krcw_raj2.4.b:0 "取缔农民协会，逮捕萨哈贾南德。"
 krcw_raj2.5.t:0 "尼扎姆的抵制"
 krcw_raj2.5.d0:0 "总统令颁布后，海德拉巴宣布暂停缴纳联邦国防税，迈索尔和博帕尔发表了措辞相似的声明。王公院的强硬派说，辛迪亚今天可以绕过王公院，明天就可以废除土邦。"
 krcw_raj2.5.d1:0 "总统令颁布后，王公院里一片抗议声，几位大君联名致信辛迪亚。但没有一个土邦停缴国防税。尼扎姆私下表示，只要法令不进海德拉巴，他可以假装没看见。"
 krcw_raj2.5.a:0 "让各土邦自行其是，只在直辖省份执行。"
 krcw_raj2.5.b:0 "不让步。"
 krcw_raj2.6.t:0 "保安总队的清查"
 krcw_raj2.6.d:0 "联邦保安总队在比哈尔和联合省逮捕了农民协会的组织者，萨哈贾南德被关进了哈扎里巴格监狱。拒交地租的村子被罚款，地主的收租人在警察陪同下回到了村里。农民协会转入地下。"
 krcw_raj2.6.a:0 "秩序恢复了。"
 krcw_raj2.6.b:0 "半年后释放萨哈贾南德。"
 krcw_raj2.7.t:0 "地租法庭"
 krcw_raj2.7.d:0 "比哈尔和联合省设立了地租法庭，佃农可以起诉收租过高的地主。案子还没开审，柴明达尔地主已经把联邦告到了王公院的司法委员会。萨哈贾南德答应停止拒交地租运动，条件是法庭真正开庭。"
 krcw_raj2.7.a:0 "支持法庭开庭。"
 krcw_raj2.7.b:0 "让地主上诉，拖一拖。"
 krcw_raj2.8.t:0 "土地问题的结局"
 krcw_raj2.8.d0:0 "地租法庭在恒河平原的各县开庭，第一年就判了几千件案子，多数判佃农胜诉。地主在王公院里抱怨，农民协会的会员越来越多。王公院的强硬派要求废除法庭，辛迪亚拒绝了。"
 krcw_raj2.8.d1:0 "柴明达尔警察进驻了比哈尔和孟加拉的村子，军饷由地主出，枪由联邦发。拒交地租的村子被罚款，地契恢复了效力。农民协会的传单在夜里贴满了村口，白天又被撕掉。"
 krcw_raj2.8.a:0 "土地问题暂时放下了。"
 krcw_raj2_tt_settled:0 "佃租法案的结局已经确定"
 krcw_raj2_tt_no_reform:0 "没有与农民协会达成协议"
 krcw_raj2_tt_reform:0 "已与农民协会达成协议"
 krcw_raj2_rent_courts:0 "地租法庭"
 krcw_raj2_rent_courts_desc:0 "恒河平原各县设立了地租法庭，佃农可以起诉收租过高的地主。法庭的判决让农民协会安静了下来，也让王公院里的地主们越来越不满。"
 krcw_raj2_zamindari_police_idea:0 "柴明达尔警察"
 krcw_raj2_zamindari_police_idea_desc:0 "地主出钱、联邦发枪的乡村警察守在比哈尔和孟加拉的村子里。地租收上来了，农民协会在夜里活动。"
 krcw_raj2_tt_negotiated:0 "已与萨哈贾南德谈判"
 krcw_raj2_rent_tribunals:0 "设立地租法庭"
 krcw_raj2_rent_tribunals_desc:0 "在比哈尔、联合省和孟加拉设立地租法庭，佃农可以起诉收租过高的地主，判决由联邦法警执行。农民协会答应停止拒交地租，王公院的地主议员则准备上诉。"
 krcw_raj2_tt_banned:0 "农民协会已被取缔"
 krcw_raj2_zamindari_police:0 "组建柴明达尔警察"
 krcw_raj2_zamindari_police_desc:0 "地主出钱、联邦发枪，在比哈尔和孟加拉的村子里组建乡村警察，专门对付拒交地租和农民协会的地下组织。保安总队负责训练，王公院的地主议员负责军饷。"
 krcw_raj2.20.t:0 "救济委员会的第一份报告"
 krcw_raj2.20.d:0 "饥荒救济委员会的第一份报告说，比哈尔和孟加拉的公仓已经空了，王公和柴明达尔的私仓却是满的。委员会主席J·R·D·塔塔提出三个办法：征用私仓，向莫斯科求援，或者由孟买的商号出钱在市场上买粮。"
 krcw_raj2.20.a:0 "征用王公和地主的私仓。"
 krcw_raj2.20.b:0 "请莫斯科援助粮食。"
 krcw_raj2.20.c:0 "让孟买的商号在市场上买粮。"
 krcw_raj2.21.t:0 "王公们的粮仓"
 krcw_raj2.21.d0:0 "征用令下达以后，多数王公打开了私仓，有几位还派出了自己的牛车帮着运粮。王公院的强硬派说这是开了一个坏头，但没有人愿意被报纸写成囤粮的人。"
 krcw_raj2.21.d1:0 "海德拉巴、斋浦尔和焦特布尔拒绝开仓，说联邦无权征用土邦的粮食。其他王公在观望：如果德里退让，他们也不会开仓。辛迪亚可以派兵，也可以收回征用令。"
 krcw_raj2.21.a:0 "装车，运往比哈尔。"
 krcw_raj2.21.b:0 "派联邦军队开仓。"
 krcw_raj2.21.c:0 "收回征用令。"
 krcw_raj2.22.t:0 "德里的求粮电报"
 krcw_raj2.22.d:0 "印度联邦的饥荒救济委员会请求俄罗斯紧急援助小麦。伏尔加河的粮仓并不宽裕，外交部认为可以借机向德里要孟买纺织厂的股份，农业部则担心一个挨饿的盟友会让协定难堪。"
 krcw_raj2.22.a:0 "赊销小麦，运往卡拉奇。"
 krcw_raj2.22.b:0 "要求以孟买纺织厂的股份作抵押。"
 krcw_raj2.23.t:0 "孟买的粮商"
 krcw_raj2.23.d:0 "联邦的订单一到，孟买和加尔各答的粮商就把米价抬高了一倍，仓库里的存粮却不往外卖。塔塔建议由联邦规定收购价，孟买的报纸则要求起诉囤粮的商人。"
 krcw_raj2.23.a:0 "起诉囤粮的商人。"
 krcw_raj2.23.b:0 "按塔塔的办法定价收购。"
 krcw_raj2.24.t:0 "运粮列车"
 krcw_raj2.24.d0:0 "俄国的运粮船到了卡拉奇，小麦装上了开往巴特那的火车。救济委员会要决定先运到哪里：比哈尔和孟加拉的灾区，还是加尔各答和驻军。陆军部说，饿着肚子的士兵守不住边境。"
 krcw_raj2.24.d1:0 "联邦军队打开了海德拉巴和拉杰普塔纳的私仓，粮食装上了开往东方的火车。救济委员会要决定先运到哪里：灾区，还是加尔各答和驻军。被开仓的王公们已经在王公院里提出了抗议。"
 krcw_raj2.24.d2:0 "粮食凑齐了，运粮列车在旁遮普和信德装车。救济委员会要决定先运到哪里：比哈尔和孟加拉的灾区，还是加尔各答和驻军。陆军部说，饿着肚子的士兵守不住边境。"
 krcw_raj2.24.a:0 "先运往受灾的县。"
 krcw_raj2.24.b:0 "先供应军队和城市。"
 krcw_raj2.25.t:0 "饥荒蔓延"
 krcw_raj2.25.d:0 "比哈尔和孟加拉的农民离开村子，沿着铁路涌向加尔各答。《政治家报》登出了饥民的照片，王公院要求审查报纸，说这有损联邦的形象。救济委员会警告，再拖下去就会是又一次大饥荒。"
 krcw_raj2.25.a:0 "再向莫斯科求援。"
 krcw_raj2.25.b:0 "让土邦自己想办法。"
 krcw_raj2.26.t:0 "莫斯科的条件"
 krcw_raj2.26.d:0 "俄国人同意运粮，条件是孟买三家纺织厂的股份和一笔二十年期的卢布贷款。孟买的厂主们反对，财政部说没有别的办法。"
 krcw_raj2.26.a:0 "接受条件。"
 krcw_raj2.26.b:0 "拒绝，另想办法。"
 krcw_raj2.27.t:0 "季风之后"
 krcw_raj2.27.d0:0 "季风如期而至，恒河平原迎来了丰年。饥荒救济委员会撤销了粥厂，比哈尔和孟加拉的人口统计没有出现大的缺口。王公院为救济委员会颁发了勋章。"
 krcw_raj2.27.d1:0 "季风终于来了，饥荒过去了，但比哈尔和孟加拉的许多村子已经空了。王公院宣布饥荒结束，农民协会则在传单上列出了死者的村名。这件事会被记住。"
 krcw_raj2.27.a:0 "饥荒过去了。"
 krcw_raj2_tt_famine_over:0 "运粮列车已先运往灾区，或已过1953年"
 krcw_raj2_tt_famine_disaster:0 "如果饥荒被放任蔓延，要等到1954年"
 krcw_raj2_federal_granaries_idea:0 "联邦粮仓"
 krcw_raj2_federal_granaries_idea_desc:0 "联邦在恒河平原和德干修建公仓，丰年收购、荒年开仓，粮价由救济委员会核定。王公和地主的私仓不再能左右粮价。"
 krcw_raj2_tt_central:0 "饥荒救济由联邦统一调度"
 krcw_raj2_federal_granaries:0 "修建联邦粮仓"
 krcw_raj2_federal_granaries_desc:0 "在巴特那、勒克瑙和那格浦尔修建联邦公仓，由饥荒救济委员会管理，丰年按核定价收购，荒年开仓平粜。王公院的地主议员反对核定价，财政部为建仓发行了公债。"
 krcw_raj2_tt_market:0 "饥荒救济交给了孟买的商号"
 krcw_raj2_grain_exchange:0 "开设孟买谷物交易所"
 krcw_raj2_grain_exchange_desc:0 "由孟买的商号出资开设谷物交易所，粮食按期货买卖，联邦只在价格过高时干预。塔塔家族和巴罗达的银行家是最大的股东，农民协会说交易所只会让粮商发财。"
 krcw_raj2.40.t:0 "夏格巴到了噶伦堡"
 krcw_raj2.40.d:0 "噶厦的孜本夏格巴以商务代表团的名义来到噶伦堡，私下会见了联邦的政务官。他说拉萨的贵族不信任南京，但也不愿意为德里打仗。联邦可以通过噶厦送钱，可以绕开噶厦直接武装康区的首领，也可以先看一看。"
 krcw_raj2.40.a:0 "通过噶厦送钱。"
 krcw_raj2.40.b:0 "直接武装康区首领。"
 krcw_raj2.40.c:0 "先看一看。"
 krcw_raj2.41.t:0 "德里的礼物"
 krcw_raj2.41.d:0 "噶伦堡的商号送来了一笔银元，附有联邦政务官的一封信。摄政热振活佛可以悄悄收下，让噶厦欠德里一个人情；也可以把信交给南京驻拉萨的代表，证明噶厦忠于《拉萨协定》。"
 krcw_raj2.41.a:0 "悄悄收下。"
 krcw_raj2.41.b:0 "交给南京的代表。"
 krcw_raj2.42.t:0 "拉萨的回音"
 krcw_raj2.42.d0:0 "热振活佛收下了银元，没有回信。夏格巴从拉萨捎话说，噶厦里有一半的人愿意和德里来往，另一半在给南京写报告。联邦可以继续通过噶厦做事，只是要挑对人。"
 krcw_raj2.42.d1:0 "噶厦把联邦政务官的信交给了南京的代表。南京的报纸登出了信的全文，噶伦堡的商号被查封了两家。拉萨的路走不通了，联邦可以转向康区，也可以收手。"
 krcw_raj2.42.a:0 "继续和噶厦打交道。"
 krcw_raj2.42.b:0 "转向康区。"
 krcw_raj2.42.c:0 "收手观望。"
 krcw_raj2.43.t:0 "邦达昌兄弟"
 krcw_raj2.43.d:0 "芒康的邦达昌家族是康区最有势力的商家，自己养着马帮和枪队。邦达饶干对联邦的人说，只要德里给步枪，康巴人就会起事；条件是起事之后康区由康巴人自己治理，不归拉萨。"
 krcw_raj2.43.a:0 "答应他们的条件。"
 krcw_raj2.43.b:0 "只给步枪，不谈自治。"
 krcw_raj2.44.t:0 "德里的方针"
 krcw_raj2.44.d0:0 "南京已经知道德里在高原上做什么了。王公院的外交委员会开会讨论：是趁中国人还没有增兵就准备一场起事，还是先修好喜马拉雅防线，等高原自己乱起来。军方要防线，喜马拉雅棋局的人要起事。"
 krcw_raj2.44.d1:0 "康区的步枪已经运到了。王公院的外交委员会开会讨论：是现在就准备一场起事，还是先修好喜马拉雅防线，等南京在别处分心。邦达昌兄弟在等德里的信号。"
 krcw_raj2.44.d2:0 "噶伦堡的报告摆在王公院外交委员会的桌上。是准备一场起事，让西藏从中国手里脱离出来；还是先修好喜马拉雅防线，等高原自己乱起来。军方要防线，喜马拉雅棋局的人要起事。"
 krcw_raj2.44.a:0 "准备一场起事。"
 krcw_raj2.44.b:0 "先修好喜马拉雅防线。"
 krcw_raj2.45.t:0 "噶伦堡的线报"
 krcw_raj2.45.d0:0 "拉萨的代表送回了噶厦转交的信：印度联邦的政务官在用银元收买西藏贵族。南京可以增兵昌都、封锁通往锡金的山口，也可以先向德里提出正式抗议。"
 krcw_raj2.45.d1:0 "驻噶伦堡的领事报告：印度联邦的人在康区和锡金的山口活动，骡队里夹带着步枪。南京可以增兵昌都、封锁通往锡金的山口，也可以先向德里提出正式抗议。"
 krcw_raj2.45.a:0 "增兵昌都，封锁山口。"
 krcw_raj2.45.b:0 "向德里提出正式抗议。"
 krcw_raj2.46.t:0 "南京的照会"
 krcw_raj2.46.d0:0 "国民革命军增兵昌都、那曲和亚东，乃堆拉山口外设了新的检查站。锡金的骡队要一包一包地开箱检查，噶伦堡的商号生意少了一半。南京的大使同时递交了照会。"
 krcw_raj2.46.d1:0 "南京的大使向德里递交了照会，抗议印度联邦“干涉中华民国内政”。巴黎的报纸转载了照会全文。王公院的外交委员会要决定怎么回答。"
 krcw_raj2.46.a:0 "否认一切。"
 krcw_raj2.46.b:0 "公开支持西藏自治。"
 krcw_raj2.47.t:0 "雪线上的誓言"
 krcw_raj2.47.d0:0 "第一批护教军在锡金的一座废弃寺院里宣誓。他们的步枪来自坎普尔，教官来自廓尔喀团，誓词里没有提到德里。南京驻拉萨的代表已经知道这座寺院的名字。"
 krcw_raj2.47.d1:0 "锡金和不丹的山口上修起了一排边境哨所，噶伦堡情报网的人搬了进去。德里决定守住山口、记下南京的每一个番号，等高原上的局势自己变化。"
 krcw_raj2.47.a:0 "雪域的事还没完。"
 krcw_raj2_tt_not_watch:0 "德里没有选择观望"
 krcw_raj2_tt_forward:0 "德里决定准备一场起事"
 krcw_raj2_tt_line_first:0 "德里决定先修好喜马拉雅防线"
 krcw_raj2_frontier_watch:0 "设立喜马拉雅边境哨所"
 krcw_raj2_frontier_watch_desc:0 "在锡金、不丹和阿萨姆北部的山口修建边境哨所，由噶伦堡情报网的人和廓尔喀侦察兵驻守，记录中国驻军的番号和调动。德里暂时不在高原上点火，但要知道高原上发生的每一件事。"
 krcw_raj2_tt_kashag:0 "噶厦收下了德里的礼物"
 krcw_raj2_lhasa_stipends:0 "给拉萨贵族发年俸"
 krcw_raj2_lhasa_stipends_desc:0 "通过噶伦堡的商号，每年给噶厦里愿意和德里来往的贵族发一笔年俸。夏格巴开了一份名单，名单上的人不多，但都在噶厦里有位置。"
 krcw_raj2_tt_kham_armed:0 "联邦已经答应武装康区首领"
 krcw_raj2_pangdatsang_caravans:0 "武装邦达昌的马帮"
 krcw_raj2_pangdatsang_caravans_desc:0 "把坎普尔的步枪和弹药装进邦达昌家族的马帮，经锡金和不丹的小路运进康区。廓尔喀退役军官随马帮进山，训练康巴的枪队。"
 krcw_tibstage.1.t:0 "噶伦堡的银元"
 krcw_tibstage.1.d:0 "拉萨的贵族府邸里多了新的家具，三大寺的账房收到了来历不明的布施。南京派驻的专员在报告里写下一句话：噶伦堡方向的商队比去年多了三倍，而运进来的箱子比运出去的重。\n\n这还不是叛乱，但已经不是从前的西藏了。"
 krcw_tibstage.1.a:0 "加强监视。"
 krcw_tibstage.2.t:0 "康区的马帮"
 krcw_tibstage.2.d:0 "康区的马帮开始携带步枪。这本身不稀奇——那条路上从来不太平——稀奇的是枪都是新的，而且型号一致。\n\n成都军区把一份清单送到南京：过去六个月，至少有四千支印度联邦兵工厂的步枪进入了西藏。"
 krcw_tibstage.2.a:0 "这是一场代理战争。"
 krcw_tibstage.3.t:0 "拉萨的沉默"
 krcw_tibstage.3.d:0 "这一次，连亲南京的老臣也不再回话了。布达拉宫的接待室永远\"有事\"，噶厦的会议记录变得空洞而礼貌。军区司令用一句话总结了局势：山上的人已经决定了，只是还没有挑日子。\n\n距离起事只差一个信号。现在还来得及做点什么——但做什么？"
 krcw_tibstage.3.a:0 "先下手：现在就动。"
 krcw_tibstage.3.b:0 "再谈一次：派特使去拉萨。"
 krcw_raj_himalayan_game_cat:0 "喜马拉雅棋局"
 krcw_raj_himalayan_game_cat_desc:0 "西藏叛乱进度：[?TIB.krcw_revolt_progress]/100。进度达到100时，护教军将会起事。"
 krcw_raj_fund_nobility:0 "资助西藏贵族"
 krcw_raj_fund_nobility_desc:0 "通过噶伦堡的商号向拉萨贵族输送银元与礼物。"
 krcw_raj_send_advisors:0 "派遣顾问"
 krcw_raj_send_advisors_desc:0 "让退役的廓尔喀军官以“朝圣者”的身份前往康区，训练当地的马帮武装。"
 krcw_raj_smuggle_rifles:0 "走私步枪"
 krcw_raj_smuggle_rifles_desc:0 "把联邦兵工厂的步枪装进羊毛驮包，经锡金的乃堆拉山口运入西藏。"
 krcw_raj_ignite_revolt:0 "点燃雪山"
 krcw_raj_ignite_revolt_desc:0 "时机已到。给护教军发出信号。"
 krcw_sov_tibet_cat:0 "喜马拉雅方向"
 krcw_sov_fund_delhi_game:0 "资助德里的游戏"
 krcw_sov_fund_delhi_game_desc:0 "通过德里向西藏贵族提供卢布。"
 krcw_chi_tibet_policy_cat:0 "西藏事务"
 krcw_chi_tibet_policy_cat_desc:0 "噶厦中亲印度派的影响力：[?TIB.krcw_revolt_progress]/100。"
 krcw_chi_reaffirm_lhasa:0 "重申《拉萨协定》"
 krcw_chi_reaffirm_lhasa_desc:0 "派特使前往拉萨，公开承诺南京不改变西藏现行制度。"
 krcw_chi_dec_frontier_garrisons:0 "增设边防驻军"
 krcw_chi_dec_frontier_garrisons_desc:0 "在昌都、那曲与亚东增设驻军，封锁通往锡金的山口。"
 krcw_chi_honour_nobles:0 "册封贵族"
 krcw_chi_honour_nobles_desc:0 "授予拉萨大贵族以国民政府的荣誉头衔与年俸。"
 krcw_chi_arrest_pro_indian:0 "逮捕亲印派"
 krcw_chi_arrest_pro_indian_desc:0 "以“勾结外国”的罪名逮捕噶厦中的亲印度贵族。"
 krcw_tibet_war_cat:0 "西藏战争"
 krcw_raj_airdrop_supplies:0 "空投补给"
 krcw_raj_airdrop_supplies_desc:0 "联邦空军的运输机趁夜飞越喜马拉雅，向护教军空投弹药。"
 krcw_raj_protector_columns:0 "护教军志愿纵队"
 krcw_raj_protector_columns_desc:0 "在锡金与不丹集结的“志愿者”越过边境加入护教军。"
 krcw_raj_open_intervention:0 "公开干预"
 krcw_raj_open_intervention_desc:0 "撕下面纱：印度联邦陆军越过喜马拉雅，直接对中华民国宣战。"
 krcw_sov_arms_via_delhi:0 "经德里输送军火"
 krcw_sov_arms_via_delhi_desc:0 "俄罗斯的山炮与机枪经卡拉奇和德里转运到西藏。"
 krcw_fra_engineer_brigade:0 "国际工程兵旅"
 krcw_fra_engineer_brigade_desc:0 "第三国际派出一个由法国、意大利与越南工兵组成的旅，帮助中国修筑川藏公路。"
 krcw_chi_amnesty:0 "大赦令"
 krcw_chi_amnesty_desc:0 "宣布：凡放下武器的护教军成员一律免罪，寺院财产不受侵犯。"
 krcw_chi_mountain_roads:0 "抢修高原公路"
 krcw_chi_mountain_roads_desc:0 "征集民工抢修二郎山与雀儿山的公路。"
 krcw_chi_punish_sikkim:0 "惩戒锡金"
 krcw_chi_punish_sikkim_desc:0 "追击护教军的后方基地，直接越过乃堆拉山口进入印度。"
 krcw_tib_appeal_world:0 "向世界呼吁"
 krcw_tib_appeal_world_desc:0 "噶厦向巴黎、莫斯科与堪培拉同时发出呼吁书，请求国际调停。"
 krcw_raj_princely_crisis_cat:0 "土邦之乱"
 krcw_raj_princely_crisis_cat_desc:0 "动荡程度：[?RAJ.krcw_raj_unrest]/100。改革程度：[?RAJ.krcw_raj_reform]/100。动荡达到100且未签署宪章时，德干将爆发内战。"
 krcw_raj_negotiate_nizam:0 "与尼扎姆谈判"
 krcw_raj_negotiate_nizam_desc:0 "许诺海德拉巴保留部分关税权，换取其缴纳国防税。"
 krcw_raj_rent_remission:0 "减免佃租"
 krcw_raj_rent_remission_desc:0 "在动荡最严重的县份宣布一年的佃租减免。"
 krcw_raj_deploy_federal_army:0 "联邦陆军进驻"
 krcw_raj_deploy_federal_army_desc:0 "派遣联邦陆军进驻叛乱的土邦首府。"
