 krcw_econ_special_debt:0 "\n卢布债务：[?krcw_rouble_debt|0]（每月扣除债务÷60；到20时莫斯科催还）"
 krcw_econ_special_none:0 ""
 krcw_econ.1.t:0 "联合会经济的困境"
 krcw_econ.1.d0:0 "生产停了。罢工委员会接管了工厂，各地公社开始自己以物易物。联合会代表大会的决议在工厂门口被当众撕掉。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.1.d1:0 "罢工从一家机床厂开始，一周之内蔓延到整个工业区。工人要的是拖欠的设备和配额。清算联盟的账上第一次出现了逆差。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.1.d2:0 "原料配额又推迟了。几家大厂轮流停工，地方公社的代表在代表大会上质问中央：一份批文为什么要等三个月？\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.1.a:0 "召开紧急代表大会，重新分配配额"
 krcw_econ.1.b:0 "把权力下放给地方公社"
 krcw_econ.2.t:0 "联合会经济好转"
 krcw_econ.2.d0:0 "各联合会提前完成了配额。代表大会第一次在议程规定的时间内散会，工人报纸开始讨论缩短工作日。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.2.d1:0 "配额按时完成，商店里有了货。清算联盟的账上出现顺差，按公约自动转成对兄弟国家的设备贷款。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.2.a:0 "把顺差记进清算联盟的总账"
 krcw_econ.3.t:0 "托拉斯的麻烦"
 krcw_econ.3.d0:0 "托拉斯成批破产，工厂关门，失业的工人涌上街头。国家持股的托拉斯靠国家信用撑着，现在国家信用也撑不住了。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.3.d1:0 "银行门口排起长队，交易所的股价一天跌掉三成。托拉斯付不出债券利息，政府必须决定救谁、放弃谁。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.3.d2:0 "几家大托拉斯开始拖欠工资，物价每月上涨。托拉斯向国家银行借钱，国家银行向印钞厂借钱。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.3.a:0 "国家银行出手救市"
 krcw_econ.3.b:0 "让最差的几家破产"
 krcw_econ.4.t:0 "托拉斯景气"
 krcw_econ.4.d0:0 "高炉日夜不停，股价每周创新高，银行争着给托拉斯放款。财政部的报告提醒，账面以外的负债增长得一样快。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.4.d1:0 "军工订单和外国资本一起涌进来，托拉斯在扩建，交易所在上涨。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.4.a:0 "订单越多越好"
 krcw_econ.4.b:0 "派审计员去看看账"
 krcw_econ.5.t:0 "经济下行"
 krcw_econ.5.d0:0 "工厂停工，银行停兑，政府发不出工资。只有黑市还在营业。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.5.d1:0 "工厂倒闭，银行收紧贷款，失业的人在街上游行。债主要求先还旧债，再谈新贷款。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.5.d2:0 "订单减少，失业在增加，财政部要求各部削减开支。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.5.a:0 "削减政府开支"
 krcw_econ.5.b:0 "向莫斯科申请贷款"
 krcw_econ.6.t:0 "经济好转"
 krcw_econ.6.d0:0 "投资者排着队进来，报纸上全是新工厂剪彩的照片。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.6.d1:0 "订单增加，失业下降，商店里的货多了起来。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.6.a:0 "好日子"
 krcw_econ.7.t:0 "泡沫破裂"
 krcw_econ.7.d0:0 "一家大托拉斯宣布无力支付债券利息。三天之内，交易所的市值蒸发了一半，十几家银行停止兑付，工厂开始裁员。过热的账终于要结了。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.7.a:0 "国家接管破产的托拉斯"
 krcw_econ.7.b:0 "让市场自己出清"
 krcw_econ.8.t:0 "莫斯科交易所崩盘"
 krcw_econ.8.d0:0 "乌拉尔几家托拉斯同时违约，莫斯科交易所的抛售持续了一整周。俄罗斯国家银行宣布暂停对外放款，并要求各国提前偿还卢布贷款。靠卢布信贷撑着的政府都在开紧急会议。"
 krcw_econ.8.a:0 "资本主义的周期又来了"
 krcw_econ.8.b:0 "我们得靠自己了"
 krcw_econ.8.c:0 "幸好我们两边都没靠"
 krcw_econ.9.t:0 "卢布动摇"
 krcw_econ.9.d0:0 "萨文科夫死了。卢布的信用一直押在他个人身上：外国银行肯借，是因为相信他还得起；托拉斯敢扩张，是因为相信他会兜底。现在没人知道谁来接手，交易所在等。\n\n经济指数：[?krcw_econ|0]/100"
 krcw_econ.9.a:0 "动用储备稳住汇率"
 krcw_econ.9.b:0 "等新政府表态"
 krcw_econ.10.t:0 "卢布的新主人"
 krcw_econ.10.d0:0 "新政府宣布承认萨文科夫时期的全部债务，国家银行恢复对外放款。交易所收复了一部分失地。"
 krcw_econ.10.d1:0 "新政府削减了军工订单，把钱转给拖拉机厂和轻工业。托拉斯的股价跌了，卢布反而稳了下来。"
 krcw_econ.10.d2:0 "为加冕典礼，国库发行了一笔\"皇冠债券\"。外国银行不知道这笔钱最后由谁来还。"
 krcw_econ.10.d3:0 "新的最高执政者宣布暂停偿还一切外债，称之为战时措施。外国资本当晚开始撤离，卢布在协约内部一周贬值一半。"
 krcw_econ.10.a:0 "看他们怎么还账"
 krcw_econ.10.b:0 "莫斯科稳住了吗"
 krcw_econ_cat:0 "阵营经济"
 krcw_econ_cat_desc:0 "本国的经济、教育、民生和发展项目在顶栏的§Y国家发展§!栏目里。这里是阵营之间的援助、卢布信贷和还债。[KRCW_GetEconSpecial]"
 krcw_econ_send_mission:0 "派出技术援助团"
 krcw_econ_send_mission_desc:0 "巴黎清算公约规定，顺差国的盈余要转成对逆差国的技术援助。我们派工程师和设备过去，自己的工厂要少开一部分产能。"
 krcw_econ_rouble_credit:0 "放卢布信贷"
 krcw_econ_rouble_credit_desc:0 "俄罗斯国家银行向对方放一笔贷款。对方的工厂会重新开工，我们的账上多一个债务国。贷款放得越多，托拉斯越热。"
 krcw_econ_repay:0 "按期还款"
 krcw_econ_repay_desc:0 "从预算里挤出一笔钱还给莫斯科。"
 krcw_econ_concession:0 "让出特许权"
 krcw_econ_concession_desc:0 "把几座矿山和一段铁路的经营权让给俄国公司抵债。"
 krcw_econ_join_trusts:0 "并入托拉斯体系"
 krcw_econ_join_trusts_desc:0 "让俄国托拉斯持有我们最大几家工厂的股份，换掉一大笔债。从此我们的经济跟着莫斯科的交易所涨落。"
 krcw_econ_join_trusts_tt:0 "经济制度变为§Y托拉斯经济§!，过热从30起算。"
 krcw_econ_m_moscow_demands:0 "莫斯科催还"
 krcw_econ_m_moscow_demands_desc:0 "俄罗斯国家银行要求我们偿还到期的卢布贷款。按期还款、让出特许权，或者并入托拉斯体系；逾期不还，莫斯科会冻结所有新信贷。"
