 krcw_dev_planname_4_mkt:0 "国防优先"
 krcw_econ_tierdesc_fed_0:0 "生产停了。罢工委员会接管了工厂，各地公社开始自己以物易物，中央的配额表没人再看。联合会代表大会重新取得信任之前，停摆会一直持续。"
 krcw_econ_tierdesc_fed_1:0 "配额落空，劳动券兑不出东西。工人开始罢工，要的是拖欠的设备和配额。清算联盟的账上第一次出现了逆差。"
 krcw_econ_tierdesc_fed_2:0 "原料配额一再推迟，工厂开始轮流停工。地方公社抱怨中央的批文太慢，中央抱怨地方的报表不准。"
 krcw_econ_tierdesc_fed_3:0 "工厂归产业联合会自管，计划由各级代表大会协商，跨国结算记在巴黎清算联盟的总账上。它运转得不快，但很少停下来。"
 krcw_econ_tierdesc_fed_4:0 "配额按时完成，商店里有了货。清算联盟的账上出现顺差，按公约自动转成对兄弟国家的设备贷款。"
 krcw_econ_tierdesc_fed_5:0 "各联合会提前完成配额，代表大会第一次在议程规定的时间内散会。工人报纸开始讨论缩短工作日。"
 krcw_econ_tierdesc_trust_0:0 "托拉斯成批破产，工厂关门，失业的工人涌上街头。国家持股的托拉斯靠国家信用撑着，现在国家信用也撑不住了。"
 krcw_econ_tierdesc_trust_1:0 "银行门口排起长队，交易所的股价一天跌掉三成。托拉斯付不出债券利息，政府必须决定救谁、放弃谁。"
 krcw_econ_tierdesc_trust_2:0 "托拉斯开始拖欠工资，物价每月上涨。托拉斯向国家银行借钱，国家银行向印钞厂借钱。"
 krcw_econ_tierdesc_trust_3:0 "国家持股，军队下单，私人经理经营。它不算高效，也不算浪费，只是没人敢问利润去了哪里。"
 krcw_econ_tierdesc_trust_4:0 "军工订单和外国资本一起涌进来，托拉斯在扩建，交易所在上涨。账面以外的负债也在扩建。"
 krcw_econ_tierdesc_trust_5:0 "高炉日夜不停，股价每周创新高，银行争着给托拉斯放款。所有人都知道这不会永远持续，所有人都在买。"
 krcw_econ_tierdesc_mkt_0:0 "工厂停工，银行停兑，政府发不出工资。只有黑市还在营业。"
 krcw_econ_tierdesc_mkt_1:0 "工厂倒闭，银行收紧贷款，失业的人在街上游行。债主要求先还旧债，再谈新贷款。"
 krcw_econ_tierdesc_mkt_2:0 "政府削减开支，失业在增加。每一笔外国贷款都附带条件。"
 krcw_econ_tierdesc_mkt_3:0 "国内市场和外国信贷维持着经济。不算繁荣，也没有危机。"
 krcw_econ_tierdesc_mkt_4:0 "订单增加，失业下降，商店里的货多了起来。"
 krcw_econ_tierdesc_mkt_5:0 "投资者排着队进来，报纸上全是新工厂剪彩的照片。"
