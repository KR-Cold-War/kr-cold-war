 krcw_dev_obs_tt:0 "[KRCW_GetEconSystem]。GDP 世界第 [?krcw_dev_rank_gdp|0]。本月经济 [?krcw_econ_trend|+2]，民生 [?krcw_dev_w_trend|+2]。\n国家规划：[KRCW_GetDevPlan]。进行中的发展项目 [?krcw_dev_slots|0] 个。"
 krcw_dev_obs_1:0 "经济 §Y[?krcw_econ|0]§! [KRCW_GetEconTier]"
 krcw_dev_obs_2:0 "教育 §Y[?krcw_dev_edu|0]§!  民生 §Y[?krcw_dev_wel|0]§!"
 krcw_dev_obs_3:0 "GDP §Y[?grossdomesticproduct|0]§! 第[?krcw_dev_rank_gdp|0]  人口 §Y[?krcw_dev_pop|0]§!百万"
 krcw_dev_help_t0:0 "§Y三项指数§!"
 krcw_dev_help_b0:0 "§Y经济§!每月按方向涨落，来源在\"经济来源\"页。它会慢慢回到50附近：一次性的刺激会褪去，长期水平由制度、教育、规划和负担决定。经济影响建造速度、工厂产出和消费品。\n\n§Y教育§!由各州的识字率、小学、中学、大学比例算出，按人口加权。它影响科研速度和生产效率，也会抬高经济的长期水平。\n\n§Y民生§!每月向\"经济×0.6 + 教育×0.4\"靠拢，战争、缺粮和国家规划会推动它。它影响稳定、政治点和人口增长。"
 krcw_dev_help_t1:0 "§Y发展项目§!"
 krcw_dev_help_b1:0 "同时能进行2个项目，阵营盟主或民用工厂超过50个的国家3个。\n\n开工时花政治点，并占用一部分民用工厂，工期3到6个月，完工时才生效。鼠标移到项目名上能看到效果和现在能不能开工。\n\n州开发、交通和教育的提升是永久的；民生和经济的提升会慢慢回落，要接着投入。\n\n三种经济制度的项目名字不同，效果相同；\"制度改革\"和最后一个专属项目按制度不同。"
 krcw_dev_help_t2:0 "§Y国家规划§!"
 krcw_dev_help_b2:0 "五个方向选一个：均衡、重工业、民生、教育、国防。按钮在\"概况\"页底部，鼠标移上去能看到效果。\n\n每次更改花50政治点，之后12个月不能再改。\n\n重工业优先让经济涨得快、民生涨得慢；民生优先正好相反；教育优先每月提高识字率，并加快科研；国防优先加快军工建造，但经济和民生都会变慢。"
 krcw_dev_help_t3:0 "§Y三种经济制度§!"
 krcw_dev_help_b3:0 "§Y联合会经济§!（第三国际）：稳定，但机关会越来越臃肿，要靠\"联合会改组\"压下去。巴黎清算联盟每月把顺差成员的盈余转给困难成员。\n\n§Y托拉斯经济§!（莫斯科协约）：涨得快，但涨的同时在过热，过热到100泡沫破裂。白俄可以放卢布信贷，欠债的国家以后会被莫斯科催还。\n\n§Y市场经济§!：靠外国信贷，背着卢布债的国家每月都在付利息。不在两大阵营里的国家也按市场经济计算，加入阵营后会改成该阵营的制度。"
 krcw_dev_help_t4:0 "§Y危机和阵营§!"
 krcw_dev_help_b4:0 "经济掉到\"困难\"以下会弹出事件，让你选择怎么应对。\n\n阵营盟主陷入经济危机，整个阵营的瓦解危机度每月都会上升；阵营里困难的成员多了也一样。\n\n技术援助团、卢布信贷、还债在决议栏\"阵营经济\"里；经济战和经济稳定计划在\"隐蔽战线\"里。\n\n观察模式下右键任何国家，外交界面里能看到它的经济、教育、民生和国民生产。"
 krcw_econ.20.t:0 "发展项目完工"
 krcw_econ.20.d0:0 "[KRCW_GetDevLastProject]完工了。剪彩那天，报纸登了一整版照片。\n\n打开顶栏的\"国家发展\"可以开下一个项目。"
 krcw_econ.20.a:0 "好"
 krcw_econ.21.t:0 "识字的一代"
 krcw_econ.21.d0:0 "全国教育指数第一次超过60。工厂里的年轻工人大多能读报、能看图纸，技术夜校报名的人比座位多。"
 krcw_econ.21.a:0 "把他们送进技术学校"
 krcw_econ.21.b:0 "请他们读我们的报纸"
 krcw_econ.22.t:0 "大学城"
 krcw_econ.22.d0:0 "全国教育指数超过80。几座大学城已经能和旧帝国的名校比较，实验室开始从国外挖人。"
 krcw_econ.22.a:0 "拨款给实验室"
 krcw_econ.22.b:0 "让他们为工厂服务"
 krcw_econ.23.t:0 "丰裕的年代"
 krcw_econ.23.d0:0 "民生指数超过70。商店的货架满了，假日里去海边的火车要提前一周订票。"
 krcw_econ.23.a:0 "人民满意"
 krcw_econ.23.b:0 "请他们为国家多出一份力"
 krcw_econ.24.t:0 "面包队"
 krcw_econ.24.d0:0 "民生指数跌到20以下。面包店门口天不亮就排起长队，市场上的价格一周涨一次。"
 krcw_econ.24.a:0 "打开国家储备"
 krcw_econ.24.b:0 "让警察维持秩序"
