# krcw: years paced
 KRCW_BOOKMARK_NAME:0 "赤旗与黑鹰：1949"
 KRCW_BOOKMARK_DESC:0 "第二次世界大战在没有和约的停火中结束。易北河畔的铁丝网两侧，是两个互不相容的世界：以巴黎、伦敦、南京为轴心的§R第三国际§!，与萨文科夫的俄罗斯国、休伊·朗的美国结成的§g莫斯科协定§!。柏林被一分为二，美洲的内战在俄亥俄河停火线上凝固而未终结；南京的周恩来领导着国民党左派重建一个满目疮痍的中国；温莎王室与协约国的遗老则在澳大利亚的流亡朝廷中等待着翻盘的机会。\n\n和平只是下一场战争的间歇。赤旗与黑鹰，谁将主宰人类的未来？"
 KRCW_FRA_BM_DESC:0 "§R法兰西公社§!是第三国际的心脏与领袖。在§Y伯努瓦·弗拉雄§!的领导下，公社于第二次世界大战中击败了德意志帝国，将红旗插上了莱茵河畔。如今巴黎正秘密推进原子计划，预计§Y1952年§!试爆第一颗原子弹。然而革命的官僚化正在侵蚀公社的活力，世界革命的重担也全压在它的肩上。"
 KRCW_ENG_BM_DESC:0 "§R不列颠联邦§!在§Y汤姆·温特林厄姆§!的领导下，是第三国际的海上支柱。联邦舰队守卫着大西洋航线，向加拿大与美利坚联合工团输送援助。旧帝国的王室早已逃往大洋彼岸，但伦敦的工团主义者必须证明：没有国王的不列颠，同样能统治海洋。"
 KRCW_CHI_BM_DESC:0 "§R中华民国§!由§Y周恩来§!领导的国民党改组派执政。1937年，国民革命军从龙岩出发发动第二次北伐，1940年推翻大清；随后与奉系及日本干涉军苦战四年，直至1944年《青岛停战协定》。满洲与朝鲜重获自由，但§Y台湾仍在日本手中§!。土地改革未竟，军阀残余与党内派系林立，南京的改革之路才刚刚开始。"
 KRCW_WCA_BM_DESC:0 "§R美利坚联合工团§!控制着新英格兰、纽约与五大湖工业带。在§Y沃尔特·鲁瑟§!的领导下，工团民兵在第二次美国内战中顶住了朗的大军与加拿大干涉军。1946年《圣路易斯停火协定》后，南北美国隔着§Y俄亥俄河停火线§!对峙——双方的宪法都宣称对全美拥有主权，内战从未真正结束。"
 KRCW_SOV_BM_DESC:0 "§g俄罗斯国§!是莫斯科协定的领袖。§Y鲍里斯·萨文科夫§!以国家民粹主义之名统治着这片土地，在第二次世界大战中吞并了波罗的海三国，并迫使德意志帝国崩溃，在易北河以东扶植起施莱歇尔将军的民族共和国。萨文科夫的铁腕铸就了欧亚大陆上最庞大的陆军，但他的帝国能否在他身后延续？"
 KRCW_USA_BM_DESC:0 "§g美利坚合众国§!由“王鱼”§Y休伊·朗§!统治。他刚刚开始自己的第四个总统任期，却已健康每况愈下，继承问题在朗的家族与党内暗流涌动。俄罗斯的军火经墨西哥源源不断地运来，朗的美国必须在俄亥俄河对岸的工团主义者面前守住南方与中西部，还要对付落基山以西萨克拉门托的宪政政府，并最终“统一美国”。"
 KRCW_WGR_BM_DESC:0 "§R德意志社会主义共和国§!诞生于第三国际解放莱茵兰、鲁尔、汉堡与巴伐利亚的战火之中。§Y恩斯特·台尔曼§!领导着这个前线国家，它的国土与施莱歇尔的民族共和国隔河相望，而孤悬于敌境之中的§Y西柏林§!则是整个冷战最敏感的神经。"
 KRCW_ITA_BM_DESC:0 "§R意大利社会共和国§!是第三国际在地中海的支柱。工会领袖§Y朱塞佩·迪·维托里奥§!领导着这个年轻的共和国，它既要重建饱经战火的半岛，又要在南斯拉夫与巴尔干的暗流中守住亚得里亚海的门户。"
 KRCW_CAN_BM_DESC:0 "§R加拿大工团共和国§!诞生于一次失败的干涉。1938至1940年，协约国流亡政府派军进入新英格兰企图恢复旧秩序，结果在奥尔巴尼与布法罗被击溃；国内工人随即起义，王室再次出逃。如今§Y蒂姆·巴克§!的共和国是第三国际援助美利坚联合工团的生命线。"
 KRCW_KOR_BM_DESC:0 "§R朝鲜民国§!在中国的扶持下于1944年摆脱了日本的统治。§Y金元凤§!的朝鲜义勇队曾与国民革命军并肩作战，如今他领导的民国是南京最忠诚的兄弟之邦。海峡对岸，复仇心切的日本从未放弃重返半岛的野心。"
 KRCW_RAJ_BM_DESC:0 "§g印度联邦§!是王公联邦以“反赤化”为旗号统一南亚次大陆的产物。在俄罗斯的军火与顾问支持下，瓜廖尔大君§Y吉瓦吉拉奥·辛迪亚§!于1947年攻灭印度公社。然而种姓、宗教、土邦割据、饥荒与农民暴动正在撕裂这个庞大的国家——它比任何国家都更需要改革。"
 KRCW_JAP_BM_DESC:0 "§Y大日本帝国§!在对华战争中惨败，丢失了朝鲜与满洲，只凭海军保住了台湾。首相§Y岸信介§!领导着一个复仇主义盛行的国家，它不属于任何阵营，却与莫斯科日益接近，是莫斯科协定在太平洋上的准盟友。"
 KRCW_DDR_BM_DESC:0 "§g德意志民族共和国§!只剩下勃兰登堡与萨克森。1944年帝国崩溃时，皇帝逃往中非的达累斯萨拉姆，同年中非帝国瓦解，他又转往瑞典；§Y库尔特·冯·施莱歇尔§!将军带着残存的国防军向俄国人投降，签下《柏林条约》，换来了易北河以东的一个德意志国家。它保留了黑白红三色旗，君主派在暗中等待复辟，而真正的钥匙握在莫斯科手里。施莱歇尔必须证明：一个“民族的”德国，比西边那个“红色的”德国更配得上柏林。"
 KRCW_MEX_BM_DESC:0 "§g墨西哥§!在§Y马克西米诺·阿维拉·卡马乔§!的统治下倒向了莫斯科。俄罗斯的军火与顾问经由墨西哥的港口与铁路源源不断地流入朗的美国，这条“俄援通道”让墨西哥成为美洲冷战中举足轻重的一环。"
 KRCW_TIB_BM_DESC:0 "§Y西藏地方政府§!于1947年与南京签订《拉萨协定》，成为中华民国治下的高度自治地方。十四世达赖喇嘛尚且年幼，由§Y热振活佛§!摄政。印度联邦与俄罗斯的特工正在大量渗透拉萨的贵族上层，雪域高原随时可能被点燃。"
 KRCW_AST_BM_DESC:0 "§B澳大利亚§!是协约国最后的避难所。温莎王室从加拿大出逃后落脚于此，与新西兰组成“澳新协约”。他们仇恨夺走家园的第三国际，却也厌恶萨文科夫的暴政与朗的独裁——两大阵营都在争取这个大洋上的摇摆者。"
