l_simp_chinese:
# krcw: years paced
 krcw_fill_fra_strike_committees:0 "弗拉雄的车间纪律"
 krcw_fill_fra_strike_committees_desc:0 "弗拉雄把罢工委员会的老办法搬进工厂：每个车间选出督导员，负责出勤和交货期。工人抱怨开会太多，但工厂按时交货了。"
 krcw_fill_fra_federal_charter:0 "联邦宪法"
 krcw_fill_fra_federal_charter_desc:0 "公社、地区联合会和全国代表大会的权限写进了正式宪法。地方和巴黎的争执现在先翻条文，再上街。"
 krcw_fill_fra_defence_council:0 "联邦防务委员会"
 krcw_fill_fra_defence_council_desc:0 "代表大会选出的防务委员会统管陆海空三军，各军种按同一份预算和计划行事。将军们每季度要到委员会作报告。"
 krcw_fill_fra_eastern_bureau:0 "书记处东方局"
 krcw_fill_fra_eastern_bureau_desc:0 "书记处设立东方局，统一处理同协定国家的往来和流亡东欧工人组织的联络。年轻代表认为它太谨慎，外交官认为它太激进。"
 krcw_fill_fra_womens_delegates:0 "车间女代表"
 krcw_fill_fra_womens_delegates_desc:0 "妇女宪章要求委员会的女代表比例跟车间一致。纺织厂和电子厂的女工第一次能在委员会里决定排班和托儿所。"
 krcw_fill_fra_consumer_plan:0 "消费品专项计划"
 krcw_fill_fra_consumer_plan_desc:0 "计划总署把一部分机床产能划给冰箱、洗衣机和收音机。出口订单少了一些，里尔的排队名单短了一些。"
 krcw_fill_fra_secretariat_inspectors:0 "书记处监察团"
 krcw_fill_fra_secretariat_inspectors_desc:0 "巴黎派往各成员国联合会的监察员检查决议执行情况，每月向书记处写报告。小成员国的干部对他们客气但冷淡。"
 krcw_fill_fra_cadre_textbooks:0 "巴黎版干部教材"
 krcw_fill_fra_cadre_textbooks_desc:0 "国际各国的干部学校改用巴黎编写的同一套教材，政治课和军事课都有。各国军官讨论作战计划时用的是同一套术语。"
 krcw_fill_fra_exit_clause:0 "退出条款"
 krcw_fill_fra_exit_clause_desc:0 "国际章程写明成员可以经本国代表大会表决退出。各国代表跟巴黎谈判时少了戒心，条约谈得更快。"
 krcw_fill_fra_federation_offices:0 "产业联合会管理处"
 krcw_fill_fra_federation_offices_desc:0 "铁路由铁路工人联合会管，矿山由矿工联合会管，原来部委的职员分到各联合会的管理处。第一年文件常常寄错地方，生产调度反倒更快了。"
 krcw_fill_fra_wage_scale:0 "全国工资等级表"
 krcw_fill_fra_wage_scale_desc:0 "全国统一的工资等级表规定了最高和最低工资的倍数上限。纺织和农业工人加了工资，冶金和矿山的熟练工跳槽的人多了。"
 krcw_fill_fra_federal_security:0 "联邦保卫处"
 krcw_fill_fra_federal_security_desc:0 "保卫处在港口、工会和大学设了常驻人员，专查与白俄侨民组织有联系的人。车间大会每次开会都有人质问它的权限。"
 krcw_fill_fra_strasbourg_command:0 "斯特拉斯堡联合司令部"
 krcw_fill_fra_strasbourg_command_desc:0 "欧洲成员的总参谋部在斯特拉斯堡派驻常任代表，每个成员事先写明战时投入的师和防线段。法国军官占了司令部一半的岗位。"
 krcw_fill_eng_pacific_broadcasts:0 "对澳广播"
 krcw_fill_eng_pacific_broadcasts_desc:0 "联合会电台开了对澳大利亚的短波节目，面向码头工人和剪羊毛工人，海员工会负责把报纸带进悉尼和弗里曼特尔港。"
 krcw_fill_eng_union_papers:0 "联合会报刊"
 krcw_fill_eng_union_papers_desc:0 "矿工、铁路和机械工人联合会各自办报，书记处不统一口径。报纸之间经常吵架，读者对官方说法也更信得过。"
 krcw_fill_eng_chamber_of_industries:0 "产业院"
 krcw_fill_eng_chamber_of_industries_desc:0 "旧上院改成产业院，各产业联合会按会员人数派代表审议计划。煤、钢和机械的年度指标在这里先谈妥，再交代表大会表决。"
 krcw_fill_eng_open_ballot:0 "开放的选票"
 krcw_fill_eng_open_ballot_desc:0 "反对革命的候选人可以合法参加代表大会选举。他们拿到了几个席位，地下组织的人数也随之减少。"
 krcw_fill_eng_congress_secretariat:0 "代表大会常设秘书处"
 krcw_fill_eng_congress_secretariat_desc:0 "苏格兰和威尔士大会降为地区行政机关后，伦敦设了一个常设秘书处统一下发指令。爱丁堡和加的夫的官员要等伦敦批复才能办事。"
 krcw_fill_eng_seamens_charter:0 "海员宪章"
 krcw_fill_eng_seamens_charter_desc:0 "宪章规定了最长航次和伙食标准，海员可在任何国际港口下船回家，路费由船队出。商船和海军的招募处排起了队。"
 krcw_fill_eng_recallable_managers:0 "可随时罢免的厂长"
 krcw_fill_eng_recallable_managers_desc:0 "任何一次车间大会都能罢免厂长。新生产线上手更快，长期改造计划却常常半途换人。"
 krcw_fill_eng_national_guilds:0 "全国行会"
 krcw_fill_eng_national_guilds_desc:0 "每个产业组成一个全国行会，内部自治，对外按契约交货。各行会为了抢合同，交货期比计划总署定的还短。"
 krcw_fill_eng_intelligence_bureau:0 "联邦情报局"
 krcw_fill_eng_intelligence_bureau_desc:0 "旧军情部门的档案、海员工会的港口联络网和国民军保卫组合并成情报局，向代表大会国防委员会负责。工会在委员会里派了监督员。"
 krcw_fill_ti_congress_planning:0 "联合会代表大会计划处"
 krcw_fill_ti_congress_planning_desc:0 "代表大会下设计划处，把两年一次大会的决议拆成各工厂的年度指标。大会开得很长，指标却很少再改。"
 krcw_fill_ti_youth_festival:0 "国际青年联欢节"
 krcw_fill_ti_youth_festival_desc:0 "每年夏天各国青年在联欢节上听音乐、看电影、辩论和露营。不少人回国时带回了外国朋友的地址和外国的唱片。"
 krcw_fill_ti_shopfloor_delegates:0 "车间青年代表"
 krcw_fill_ti_shopfloor_delegates_desc:0 "第二公社运动的代表进了联合会大会，带来了车间的意见簿。办公室的批文少了，车间的会多了。"
 krcw_fill_ti_brigade_volunteers:0 "国际纵队志愿者名册"
 krcw_fill_ti_brigade_volunteers_desc:0 "西班牙内战留下的老兵和新报名的年轻人登记在同一本名册上，随时可以编成营开赴海外。"
 krcw_fill_ti_aid_technicians:0 "援外技术人员"
 krcw_fill_ti_aid_technicians_desc:0 "本国的工程师、医生和教师在阿尔及尔、达喀尔和仰光工作两到三年。回国的人带回了当地的订单，也带回了热带病的病例。"
 krcw_fill_ti_border_posts:0 "边境联合检查站"
 krcw_fill_ti_border_posts_desc:0 "边防和海关在主要路口设了联合检查站，查证件，截协定的传单和经费。过境的卡车要多等几个小时。"
 krcw_fill_ti_national_language_records:0 "本国语文件"
 krcw_fill_ti_national_language_records_desc:0 "本国的决议和档案用本国语言起草，法语译本由巴黎出钱翻译。地方干部不用再等译稿才能执行决议。"
 krcw_fill_ti_eighteen_months:0 "青年代表团"
 krcw_fill_ti_eighteen_months_desc:0 "二十五岁以下的代表占了代表大会三分之一的席位，推动缩短兵役、废除干部食堂。总参谋部抱怨新兵训练时间不够。"
 krcw_fill_ti_workshop_assemblies:0 "车间大会主权"
 krcw_fill_ti_workshop_assemblies_desc:0 "车间宪章把一切权力交给车间大会和市镇公社，联合会只是办事处。决议传到中央要多走好几层，车间里的积极性很高。"
 krcw_fill_ti_labour_passbooks:0 "跨国劳动手册"
 krcw_fill_ti_labour_passbooks_desc:0 "工人凭一本劳动手册在国际各国找工作，工龄、养老金和住房排队资格都记在上面。缺人的工厂能从邻国招到熟练工。"
 krcw_fill_ti_reserve_training:0 "十八个月兵役加预备役"
 krcw_fill_ti_reserve_training_desc:0 "兵役定为十八个月，退役后每年回营训练两周。预备役名册每年更新一次，动员时各营知道该去哪里报到。"
 krcw_fill_ti_welfare_charter:0 "共同社会宪章"
 krcw_fill_ti_welfare_charter_desc:0 "最低工资、每周四十四小时工作制、全民医疗、产科医院和幼儿园写进了共同宪章。新建的医院和幼儿园占用了一部分工业预算。"
 krcw_fill_ti_mutual_defence_clause:0 "共同防御条款"
 krcw_fill_ti_mutual_defence_clause_desc:0 "代表大会宣布，任何成员遭到进攻都视为对本国的进攻。本国的预备役和国际其他成员的动员表编在了一起。"
 krcw_fill_ti_counter_infiltration:0 "反渗透科"
 krcw_fill_ti_counter_infiltration_desc:0 "保卫部门设立反渗透科，审查与协定情报机关有联系的工会干部和流亡者组织。被错抓的人可以向代表大会听证会申诉。"
 krcw_fill_ent_new_textbooks:0 "新国民教科书"
 krcw_fill_ent_new_textbooks_desc:0 "新教科书从这片大陆本身讲起，地理课把雅加达、马尼拉和南京列为最重要的邻居。中学开始开设亚洲语言课。"
 krcw_fill_ent_migrant_ships:0 "移民船队"
 krcw_fill_ent_migrant_ships_desc:0 "移民部包租旧运兵船，从那不勒斯、比雷埃夫斯和汉堡把欧洲难民运到弗里曼特尔。新移民先在营地住一年，再分到矿山和水坝工地。"
 krcw_fill_ent_southern_legations:0 "南方使馆网"
 krcw_fill_ent_southern_legations_desc:0 "堪培拉在巴黎、莫斯科和两个华盛顿都设了使馆，大使由外交部直接任命，不经过任何一个阵营的推荐。每份贸易协定都单独谈。"
 krcw_fill_ent_federal_parliament:0 "澳新联邦议会"
 krcw_fill_ent_federal_parliament_desc:0 "堪培拉的联邦议会有一百二十席，新西兰占二十二席。惠灵顿的议员在每个委员会都要求一个副主席职位。"
 krcw_fill_ent_northern_coast_plan:0 "北部海岸防务计划"
 krcw_fill_ent_northern_coast_plan_desc:0 "陆海军按同一份计划守北部海岸和塔斯曼海航线，在达尔文和汤斯维尔修建前进基地。预算第一次在两个军种之间按任务分配。"
 krcw_fill_sov_okhrana_statute:0 "国家保卫局章程"
 krcw_fill_sov_okhrana_statute_desc:0 "保卫局有了章程、预算和审计员，每笔经费都要向国家会议报账。行动慢了一些，但抓到的外国特工更多了。"
 krcw_fill_sov_council_appointments:0 "国家会议任命名单"
 krcw_fill_sov_council_appointments_desc:0 "最高执政者亲自任命国家会议三分之二的议员。将军、主教和托拉斯经理都在名单上，会议从不否决他的提案。"
 krcw_fill_sov_succession_commission:0 "继承程序委员会"
 krcw_fill_sov_succession_commission_desc:0 "国家会议设立一个秘密委员会，起草最高执政者空缺时的选举规则和过渡安排。各派都派人进去，彼此盯着对方。"
 krcw_fill_sov_staff_seat:0 "总参谋部的会议席位"
 krcw_fill_sov_staff_seat_desc:0 "总参谋长列席国家会议的每一次会议，军费和人事安排都先经他过目。军队的计划因此有了稳定的预算。"
 krcw_fill_sov_provisional_administration:0 "临时政府行政处"
 krcw_fill_sov_provisional_administration_desc:0 "在选出新的最高执政者之前，各部的副部长组成行政处，保证邮件、工资和军粮照常发出。"
 krcw_fill_sov_ration_guarantee:0 "粮食定额保证"
 krcw_fill_sov_ration_guarantee_desc:0 "新纲领把粮食定额和工资发放日期写进法律，由国家保卫局监督各省执行。工厂多拨出一部分产能给民用品。"
 krcw_fill_sov_nationalities_office:0 "民族事务处"
 krcw_fill_sov_nationalities_office_desc:0 "内务部设立民族事务处，登记各民族的学校、教会和地方代表。从各省来的申诉第一次有了专门的人接收。"
 krcw_fill_sov_nationalities_resolution:0 "民族问题决议"
 krcw_fill_sov_nationalities_resolution_desc:0 "国家会议的决议确认了各省的自治协议和征兵义务。边疆各省的新兵按时报到，地方驻军减少。"
 krcw_fill_sov_press_statute:0 "新闻条例"
 krcw_fill_sov_press_statute_desc:0 "报纸不再逐篇送审，编辑按条例自己划线。越线的报纸会被停刊，其余的报纸可以批评各部。"
 krcw_fill_sov_trinity_pilgrimage:0 "三一修道院朝圣"
 krcw_fill_sov_trinity_pilgrimage_desc:0 "教会组织信徒每年前往三一修道院朝圣，铁路为朝圣者开行专列。各地重开的教堂在周日为军队祈祷。"
 krcw_fill_sov_cossack_hosts:0 "哥萨克军团编制"
 krcw_fill_sov_cossack_hosts_desc:0 "顿河和库班的军团恢复了自己的军事编制和土地。他们按村出兵，骑兵和侦察部队主要从这里补充。"
 krcw_fill_sov_emigre_screening:0 "侨民审查处"
 krcw_fill_sov_emigre_screening_desc:0 "奥克拉那在边境车站和港口设立审查处，逐一询问从西方回国的侨民和外籍工人。被怀疑的人送往叶尼塞河以东。"
 krcw_fill_sov_export_quota_office:0 "出口配额署"
 krcw_fill_sov_export_quota_office_desc:0 "石油、铬和木材的出口改由配额署统一审批，不卖给国际的部分留给本国工厂。外汇收入因此减少。"
 krcw_fill_sov_hidden_front_bureau:0 "隐蔽战线局"
 krcw_fill_sov_hidden_front_bureau_desc:0 "对外情报总局把广播、地下组织和经济战归入一个局统一安排。每季度的报告直接送到最高执政者手里。"
 krcw_fill_sov_moscow_garrison:0 "莫斯科警备司令部"
 krcw_fill_sov_moscow_garrison_desc:0 "两个近卫师在莫斯科设立警备司令部，负责宵禁、检查站和政府机关的警卫。首都的大事都要先经过司令部。"
 krcw_fill_sov_directorate_budget:0 "临时执政小组预算处"
 krcw_fill_sov_directorate_budget_desc:0 "索罗金按章程掌管预算，各部的拨款每月由他签字。议长和总参谋长都必须通过他拿钱。"
 krcw_fill_wgr_moabit_circle:0 "莫阿比特班底"
 krcw_fill_wgr_moabit_circle_desc:0 "台尔曼和几位狱友组成党的核心领导层，重要的决定都在他们中间商定。圈子以外的党员很难进入领导层。"
 krcw_fill_wgr_new_civil_service:0 "新文官考试"
 krcw_fill_wgr_new_civil_service_desc:0 "帝国留下的法官、校长和警官必须重新考试才能留任，空出的位置由工会推荐的人补上。各部门的效率在头几年下降。"
 krcw_fill_wgr_textbook_commission:0 "历史教科书委员会"
 krcw_fill_wgr_textbook_commission_desc:0 "教育部组织教师和历史学者重写一九一四年到一九四三年的课本。新课本在各州学校同时使用。"
 krcw_fill_wgr_technical_schools:0 "工会技术学校"
 krcw_fill_wgr_technical_schools_desc:0 "体操协会和射击俱乐部的场地改为工会技术学校，青年在这里学车床和电工。工厂得到了更多熟练工人。"
 krcw_fill_wgr_common_archive:0 "全德文献档案馆"
 krcw_fill_wgr_common_archive_desc:0 "档案馆收集两德的方言录音、教会记录和地方志，广播电台每周播出相关节目。东边的人也在收听。"
 krcw_fill_wgr_constitutional_oath:0 "宪法誓词"
 krcw_fill_wgr_constitutional_oath_desc:0 "军人宣誓保卫宪法，并有权拒绝违宪的命令。军官团里想搞政变的人更难找到同伙。"
 krcw_fill_wgr_war_memorial:0 "战争死难者纪念碑"
 krcw_fill_wgr_war_memorial_desc:0 "各教会和市政府在纪念碑前一起举行年度悼念。阵亡者家属领到了统一的抚恤金。"
 krcw_fill_wgr_labour_courts:0 "劳动法院"
 krcw_fill_wgr_labour_courts_desc:0 "劳动法院由工会推选的陪审员审理厂内争议，罢工前必须先经过调解。停工的天数减少了。"
 krcw_fill_wgr_social_insurance:0 "统一社会保险局"
 krcw_fill_wgr_social_insurance_desc:0 "工会联合会管理合并后的疾病、事故和养老保险，保费按工资总额从工厂收取。工人看病不再需要先交钱。"
 krcw_fill_wgr_ruhr_counterintelligence:0 "鲁尔反谍处"
 krcw_fill_wgr_ruhr_counterintelligence_desc:0 "情报总局在鲁尔的工厂、港口和机场派驻反谍人员，审查新雇用的工人。车间委员会抱怨审查太严。"
 krcw_fill_ddr_national_front_office:0 "民族阵线联络处"
 krcw_fill_ddr_national_front_office_desc:0 "将军府设立联络处，分别和军官团、民族派工会和容克地主谈判。各派的要求都先送到这里，再由施莱歇尔决定。"
 krcw_fill_ddr_police_pretraining:0 "人民警察预备训练"
 krcw_fill_ddr_police_pretraining_desc:0 "适龄青年先在人民警察营地受训半年，再转入国防军。后备役人员的名单不报给莫斯科。"
 krcw_fill_ddr_peoples_chamber:0 "民选人民议院"
 krcw_fill_ddr_peoples_chamber_desc:0 "人民议院按普选产生，罢工的工会有了自己的议员。军费预算每年都要在议院里吵一轮。"
 krcw_fill_ddr_skilled_register:0 "技工名册"
 krcw_fill_ddr_skilled_register_desc:0 "工程师、熟练技工和医生登记在册，出境须经许可。留下来的人保住了工厂的生产，许多家庭因此不满。"
 krcw_fill_ddr_cabinet_procedure:0 "内阁集体决策程序"
 krcw_fill_ddr_cabinet_procedure_desc:0 "内阁的决定改为部长投票，记录交宪法法院存档。没有施莱歇尔，政府的事务照样能办下去。"
 krcw_fill_ddr_republican_oath:0 "共和国军人誓词"
 krcw_fill_ddr_republican_oath_desc:0 "国防军宣誓效忠德意志民族共和国，宪法的解释交给法院。军官们不必在将军和皇帝之间选边。"
 krcw_fill_ddr_counterintelligence:0 "谍报局反谍科"
 krcw_fill_ddr_counterintelligence_desc:0 "谍报局和政治警察在铁路枢纽、化工厂和军营周围布置线人。被告的家属被迁出边境地区。"
 krcw_fill_ddr_officer_selection:0 "军官选拔委员会"
 krcw_fill_ddr_officer_selection_desc:0 "将军府设立选拔委员会，统一审核军官的出身、晋升和效忠记录。军官团的人选从此由一个机构决定。"
 krcw_fill_ddr_crown_loyalty:0 "军中君主派"
 krcw_fill_ddr_crown_loyalty_desc:0 "军官宣誓时向空着的霍亨索伦王座行礼，团队重新挂起帝国军旗。君主派在各团有了自己的联络人。"
 krcw_fill_ma_royal_guard:0 "王室近卫队"
 krcw_fill_ma_royal_guard_desc:0 "国王组建直属于王室的近卫队，军官由他本人任命。议会无权过问近卫队的开支。"
 krcw_fill_ma_university_charters:0 "大学自治章程"
 krcw_fill_ma_university_charters_desc:0 "大学恢复了自己选举校长和聘任教授的权利，报纸可以报道法院审判。宪兵仍在校门口登记集会。"
 krcw_fill_ma_counter_insurgency_school:0 "协定反游击学校"
 krcw_fill_ma_counter_insurgency_school_desc:0 "各成员国的军官在共同的学校里学习封锁、迁村和招降。毕业的军官回国后负责山区的清剿。"
 krcw_fill_ma_gendarmerie_political_section:0 "宪兵政治科"
 krcw_fill_ma_gendarmerie_political_section_desc:0 "宪兵队设立政治科，监视工厂、大学和铁路里的可疑小组，截获的电台交给协定联合情报处。"
 krcw_fill_usa_county_sheriffs:0 "县治安官网络"
 krcw_fill_usa_county_sheriffs_desc:0 "每个县的治安官和邮局局长都由党机器安排，他们替新奥尔良盯着本地的工会和反对派。"
 krcw_fill_usa_long_memorial_fund:0 "休伊·朗纪念基金"
 krcw_fill_usa_long_memorial_fund_desc:0 "党在各州募款修建朗的纪念碑和纪念图书馆，继承人们都要出席揭幕式，借此表明自己仍是他的人。"
 krcw_fill_usa_homestead_allowance:0 "家园津贴"
 krcw_fill_usa_homestead_allowance_desc:0 "每个家庭按月领取一笔家园津贴，钱来自石油和铁路公司的累进税。财政部为此占用了一部分工厂产能。"
 krcw_fill_usa_veterans_legion:0 "内战老兵协会"
 krcw_fill_usa_veterans_legion_desc:0 "领到津贴的老兵在各县组织了协会，农闲时帮陆军训练新兵。"
 krcw_fill_usa_charity_hospitals:0 "州立慈善医院"
 krcw_fill_usa_charity_hospitals_desc:0 "每个地区有一所免费公立医院，由州立大学医学院派驻医生，也接收陆军的伤员。"
 krcw_fill_usa_counterintelligence_section:0 "联邦调查局反间谍处"
 krcw_fill_usa_counterintelligence_section_desc:0 "联邦调查局在码头和油田设立常驻反间谍处，与俄国第三厅交换东岸特工的名单。"
 krcw_fill_usa_russian_advisory_group:0 "俄罗斯军事顾问团"
 krcw_fill_usa_russian_advisory_group_desc:0 "俄罗斯顾问团留在陆军部，帮委员会制定参谋计划，并定期向莫斯科汇报紧急状态的进展。"
 krcw_fill_wca_memphis_transmitter:0 "孟菲斯发射塔"
 krcw_fill_wca_memphis_transmitter_desc:0 "孟菲斯的发射塔每晚向西岸播音，西岸的听众写信回来，信里常有朗的军队和机关的消息。"
 krcw_fill_wca_southern_textile_locals:0 "南方纺织工会"
 krcw_fill_wca_southern_textile_locals_desc:0 "黑人和白人纺织工人加入了同一个工会，南方纺织区的工厂委员会第一次能按统一条款开工。"
 krcw_fill_wca_river_brigades:0 "渡河旅"
 krcw_fill_wca_river_brigades_desc:0 "由西岸逃来的工会成员和老兵组成，在俄亥俄河上练习夜间渡河，并在西岸保留着联络人。"
 krcw_fill_wca_regional_branches:0 "地区联合会支部"
 krcw_fill_wca_regional_branches_desc:0 "合并后的联合会按地区设支部，同一个城市的钢厂、矿井和车队由一个支部统一调度。"
 krcw_fill_wca_four_districts:0 "四大军区司令部"
 krcw_fill_wca_four_districts_desc:0 "五大湖、大西洋、阿巴拉契亚和南方四个军区各有司令部，阿巴拉契亚军区负责整条河防。"
 krcw_fill_wca_factory_reserve:0 "工厂预备役连"
 krcw_fill_wca_factory_reserve_desc:0 "每座大厂的预备役连每年集训一个月，集训期间车间要少开几条线。"
 krcw_fill_wca_soldiers_committees:0 "士兵委员会"
 krcw_fill_wca_soldiers_committees_desc:0 "连排长由士兵委员会选出，营以上军官要经士兵大会确认。部队信任自己选的军官。"
 krcw_fill_wca_river_border_zone:0 "密西西比河边防区"
 krcw_fill_wca_river_border_zone_desc:0 "人民军和保卫委员会共同看守沿河渡口，过河的人都要登记，西岸特工很难混进难民队伍。"
 krcw_fill_wca_new_york_screening_office:0 "纽约港审查处"
 krcw_fill_wca_new_york_screening_office_desc:0 "保卫委员会在纽约港审查每一个从勒阿弗尔来的入境者，技术员和留学生也要登记。"
 krcw_fill_wca_card_registry:0 "工会卡登记处"
 krcw_fill_wca_card_registry_desc:0 "各联合会的登记处负责发放工会卡，也就决定了谁能投票。没有卡的人对代表大会越来越不满。"
 krcw_fill_wca_bloc_voting:0 "派别统一表决"
 krcw_fill_wca_bloc_voting_desc:0 "代表大会按派别统一投票，建设拨款和工程议案一次就能通过。"
 krcw_fill_psa_martial_orders:0 "军区命令"
 krcw_fill_psa_martial_orders_desc:0 "依照《战时权力法》，旧金山、奥克兰、洛杉矶和西雅图的港口军区由西部防务司令部管辖，要塞的命令各市警察都要执行。"
 krcw_fill_psa_proconsular_office:0 "军区行政处"
 krcw_fill_psa_proconsular_office_desc:0 "军区里的港口、船坞和铁路工程由西部防务司令部的行政处统一批准，州议会和市政府不再能拖延拨款。"
 krcw_fill_psa_western_national_guard:0 "西部国民警卫队"
 krcw_fill_psa_western_national_guard_desc:0 "十八岁的男青年在国民警卫队服役一年，退役后编入各县的后备名册。"
 krcw_fill_mex_state_committees:0 "革命党州委"
 krcw_fill_mex_state_committees_desc:0 "革命党的每个州委书记都由马克西米诺亲自任命，每月向他汇报本州的税收和过境抽成。"
 krcw_fill_mex_land_registry:0 "村社土地登记处"
 krcw_fill_mex_land_registry_desc:0 "农业部派测量员重新登记全国的村社土地，将军和地主收回的地块也要列入册子。"
 krcw_fill_mex_military_college:0 "军官再教育课程"
 krcw_fill_mex_military_college_desc:0 "没被收买的将军被送进军校重修课程，与年轻军官一起学习俄国装备的用法和文官至上的规定。"
 krcw_fill_yn_foreign_ministry:0 "独立外交部"
 krcw_fill_yn_foreign_ministry_desc:0 "外交部同时在巴黎和莫斯科派驻使团，两边的贷款和援助提议都会认真听取。"
 krcw_fill_yn_land_committees:0 "乡村土改委员会"
 krcw_fill_yn_land_committees_desc:0 "各村的土改委员会把收归国有的种植园和庄园分给佃农，分到地的农家开始留在乡下成家。"
 krcw_fill_yn_national_radio:0 "国家电台与国家剧院"
 krcw_fill_yn_national_radio_desc:0 "国家电台用本国语言播送新闻和民歌，国家剧院到各省巡演，经费由教育部出。"
 krcw_fill_chi_reconstruction_commission:0 "全国建设委员会"
 krcw_fill_chi_reconstruction_commission_desc:0 "六大决议设立全国建设委员会，统一调度战后的铁路、工厂和水利工程。各省的建设款项从此要先报南京审批。"
 krcw_fill_chi_youth_league:0 "识字突击队"
 krcw_fill_chi_youth_league_desc:0 "三青团的队员下乡办识字班，进厂开夜校。表现好的团员会被推荐进县党部当干事。"
 krcw_fill_chi_central_tax_office:0 "中央税务署驻省分署"
 krcw_fill_chi_central_tax_office_desc:0 "财政部在山西、广西和陕西设立税务分署，接管原本由地方将领征收的田赋和厘金。分署门口常年驻着一个连的中央军。"
 krcw_fill_chi_frontier_affairs_office:0 "蒙藏边务处"
 krcw_fill_chi_frontier_affairs_office_desc:0 "边务处负责与噶厦往来公文、核发入藏通行证，并留意拉萨贵族与印度、俄国来客的接触。"
 krcw_fill_chi_baojia_militia:0 "新保甲自卫队"
 krcw_fill_chi_baojia_militia_desc:0 "宗族长老和保长被编进乡公所，各保抽调青壮组成自卫队。县政府发枪发饷，名册交给县兵役科。"
 krcw_fill_chi_party_school:0 "中央党校"
 krcw_fill_chi_party_school_desc:0 "党校每年为各省、各部输送受过训练的中层干部。讲台上有经济学教授，也有在县里干过十年的老党员。"
 krcw_fill_chi_phonetic_committee:0 "国语推行委员会"
 krcw_fill_chi_phonetic_committee_desc:0 "委员会编印简化字课本和注音读物，送到每一所小学和民众教育馆。旧派文人在报上写文章反对，课本照样印。"
 krcw_fill_chi_candidate_review:0 "候选人资格审查会"
 krcw_fill_chi_candidate_review_desc:0 "中执委组织部的审查会逐一核定国民大会候选人。被刷下的人可以申诉，申诉也由审查会处理。"
 krcw_fill_chi_shanghai_chambers:0 "上海商会联络处"
 krcw_fill_chi_shanghai_chambers_desc:0 "顾孟余在行政院设联络处，上海的纱厂、银行和船运公司每月派人来谈订货和贷款。党内左翼嫌这里的门开得太大。"
 krcw_fill_chi_trade_union_law:0 "工会法"
 krcw_fill_chi_trade_union_law_desc:0 "李立三起草的工会法规定了八小时工作制、集体合同和劳资仲裁庭。工厂停工前要先走仲裁程序。"
 krcw_fill_chi_tutelage_decree:0 "训政延长令"
 krcw_fill_chi_tutelage_decree_desc:0 "训政再延十年，省县两级的党部继续代行议会的职权。宪政派的刊物要先送党部审读才能付印。"
 krcw_fill_chi_rural_reconstruction_ministry:0 "乡建派主持的农业部"
 krcw_fill_chi_rural_reconstruction_ministry_desc:0 "乡建派接手农业部，把定县和邹平的办法推到更多县份：农业推广站、乡农学校和合作仓库。"
 krcw_fill_chi_non_party_seats:0 "党外竞选席位"
 krcw_fill_chi_non_party_seats_desc:0 "国民大会三分之一的席位由党外人士竞选产生。民主同盟的代表在会上质询部长，报纸逐字刊登。"
 krcw_fill_chi_rural_credit_coops:0 "农村信用合作社"
 krcw_fill_chi_rural_credit_coops_desc:0 "县土地委员会改成信用社，分到地的农户可以凭地契借种子钱和耕牛钱。放高利贷的地主没了生意。"
 krcw_fill_chi_land_tribunals:0 "土地法庭"
 krcw_fill_chi_land_tribunals_desc:0 "每个县设一个土地法庭，审地界、旧债和错划的案子。判决由县保安队负责执行。"
 krcw_fill_chi_rotating_chair:0 "常委会轮值主席"
 krcw_fill_chi_rotating_chair_desc:0 "常务委员会每半年换一位主持人，议程和人事案由全体常委表决。决定慢了，没有人能一个人说了算。"
 krcw_fill_chi_seventh_congress_office:0 "七大代表资格审查处"
 krcw_fill_chi_seventh_congress_office_desc:0 "组织部的审查处核定各省党部和工会的代表名额，处理落选者的申诉。各派都派了人在审查处坐班。"
 krcw_fill_jap_repatriation_bureau:0 "撤侨援护局"
 krcw_fill_jap_repatriation_bureau_desc:0 "援护局在舞鹤、博多和佐世保设立收容所，替撤回的移民和复员兵安排住房、口粮和工作。北海道的开拓村接收了最多的人。"
 krcw_fill_jap_riot_police:0 "警视厅机动队"
 krcw_fill_jap_riot_police_desc:0 "警视厅组建机动队，清理黑市并登记右翼团体。愿意配合的帮会头目拿到了码头和工地的承包权。"
 krcw_fill_jap_joint_staff:0 "统合幕僚会议"
 krcw_fill_jap_joint_staff_desc:0 "三支自卫队的参谋长每周在防卫厅开会，作战计划要由文官长官签字后才能下达。三军第一次共用一套地图和兵棋。"
 krcw_fill_raj_young_princes:0 "少壮王公改革会"
 krcw_fill_raj_young_princes_desc:0 "签署备忘录的年轻王公在各自的土邦试办学校、灌溉和地税改革。老派王公说他们在给别人递镰刀。"
 krcw_fill_raj_durbar:0 "德里年度杜巴"
 krcw_fill_raj_durbar_desc:0 "每年冬天王公们带着象队和私兵来德里列队，向联邦宣誓效忠。各土邦也要按名额向联邦军队输送新兵。"
 krcw_fill_raj_security_corps:0 "联邦保安总队清查处"
 krcw_fill_raj_security_corps_desc:0 "清查处在孟买、加尔各答和坎普尔派驻便衣，查工会账目和商号汇款。厂主们抱怨车间里总有人在记名字。"
 krcw_fill_raj_kalimpong_network:0 "噶伦堡情报网"
 krcw_fill_raj_kalimpong_network_desc:0 "亚东和江孜的商务代表处每月把中国驻军的番号、山口积雪和过往商队的情况送回噶伦堡。"
 krcw_fill_tib_regency:0 "热振摄政会议"
 krcw_fill_tib_regency_desc:0 "热振活佛召集噶伦和三大寺的堪布议事，以达赖喇嘛的名义发布命令。各大贵族都在会议里安插了自己的人。"
 krcw_fill_tib_civil_office:0 "噶厦内政局"
 krcw_fill_tib_civil_office_desc:0 "噶厦设内政局，接管学校、驿站和地税的管理。南京的驻藏专员仍然每周来局里看一次公文。"
 krcw_fill_tib_amnesty:0 "护教军大赦"
 krcw_fill_tib_amnesty_desc:0 "被俘的护教军战士获释回寺，由各寺堪布作保。寺院每年要向噶厦报一次他们的去向。"
 krcw_fill_kor_national_assembly:0 "朝鲜国会"
 krcw_fill_kor_national_assembly_desc:0 "民族革命党、韩国独立党和农民组合的议员坐进旧总督府改成的议事堂，审预算、问政府。"
 krcw_fill_kor_river_lines:0 "洛东江与汉江防线"
 krcw_fill_kor_river_lines_desc:0 "工兵在洛东江和汉江沿岸挖战壕、修火力点，参谋本部把釜山和仁川的反登陆演练写进每年的野外教程。"
 krcw_fill_kor_coalition_cabinet:0 "广泛阵线内阁"
 krcw_fill_kor_coalition_cabinet_desc:0 "社会主义者、民族主义者和两位无党派教授共同组阁。每项议案先在内阁里谈妥，国会里就少吵一些。"
 krcw_fill_vin_cooperative_economy:0 "合作社经济条款"
 krcw_fill_vin_cooperative_economy_desc:0 "宪法把碾米厂、渔港和橡胶园交给合作社经营，三圻各设一个合作社总社。南圻的种植园主为此打了不少官司。"
 krcw_fill_vin_buddhist_accord:0 "顺化佛教协议"
 krcw_fill_vin_buddhist_accord_desc:0 "政府与佛教总会签约，寺产不列入土地改革，僧人可以参选国会。顺化的寺院开始为政府的识字班提供教室。"
 krcw_fill_br_drafting_committee:0 "宪法起草委员会"
 krcw_fill_br_drafting_committee_desc:0 "各地、各族的代表组成起草委员会，南京派来的法学顾问负责逐条解释条文。会议记录用三种语言誊写。"
 krcw_fill_br_plantation_coops:0 "种植园合作社"
 krcw_fill_br_plantation_coops_desc:0 "殖民者留下的种植园分给佃农，由合作社统一收购和出口。合作社的会计大多是刚学会记账的年轻人。"
 krcw_fill_br_ethnic_councils:0 "各族议事会"
 krcw_fill_br_ethnic_councils_desc:0 "克伦、掸、苗、老听各族在本地设议事会，管理学校和土地登记。首都每年拨给各议事会一笔修路款。"
