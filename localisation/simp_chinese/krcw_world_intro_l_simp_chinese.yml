 krcw_wi_title:0 "赤旗与黑鹰"
 krcw_wi_date:0 "一九四九年五月"
 krcw_wi_body:0 "一九四四年春，德意志帝国崩溃。欧洲的战争以易北河上的停火结束，没有签订和约。五年之后，世界分成了两个互相敌视的阵营。\n\n地图上，红色和粉色是巴黎的第三国际，黑色和灰色是萨文科夫的俄罗斯领导的莫斯科协定，黄线是两个阵营在陆地上接壤的地方。蓝色是流亡澳大利亚的协约国和西海岸的美利坚宪政联盟，紫色是日本，浅褐色是中立国。两个阵营各国在游戏地图上的颜色与这张图相同。\n\n世界背景共四页，可以现在阅读，也可以直接开始。"
