 krcw_wintro_1_t:0 "一九一九至一九三六：德国的和平"
 krcw_wintro_1_d:0 "一九一九年，德军在西线的攻势终于成功，法国被迫停战，不列颠随后接受了和约。德意志帝国成了欧洲的主人。东方的《布列斯特-立陶夫斯克条约》让俄国交出了波兰、波罗的海、乌克兰和白罗斯，这些地方成了德国扶植的国家，被纳入由柏林主导的中欧同盟。\n\n战败国接连爆发革命。一九一九年十一月，法国劳动总联合会发动总罢工，旧政府和军官团退往阿尔及尔，留在本土的工会建立了法兰西公社。一九二一年，公社在巴黎发起成立第三国际。意大利在一九一九年陷入内战，半岛四分五裂。一九二四年不列颠的总罢工变成内战，一九二五年底王室逃往加拿大，不列颠联邦成立。\n\n一九二五年柏林股市的“黑色星期四”之后，以德国为中心的金融秩序垮了，世界陷入长期萧条。俄国的内战以白军获胜告终，共和国在布列斯特体系的屈辱里沉沦，一九三四年，老社会革命党人鲍里斯·萨文科夫的“祖国与自由保卫联盟”赢得杜马选举，他当选总统，此后以“国家民粹主义”和紧急状态把共和国变成了自己的国家。\n\n中国的北伐在一九二六年失败，次年大清在德国支持下复辟，国民党残部退入闽赣山区。美国在萧条中熬了十年，一九三六年大选之后，陆军参谋长麦克阿瑟带兵控制了华盛顿，北方的工团和南方的休伊·朗都不再服从华盛顿，西海岸各州在萨克拉门托另立宪政政府，第二次美国内战爆发。"
 krcw_wintro_2_t:0 "一九三七至一九四四：第二次世界大战"
 krcw_wintro_2_d:0 "一九三七年，第三国际向德意志帝国开战。法兰西公社、不列颠联邦和意大利社会共和国从西面和南面进攻，萨文科夫的俄罗斯同时从东面进攻帝国和中欧同盟。两边之间没有任何盟约，只有同一个敌人。\n\n战争打了七年。一九四三年莱茵河防线崩溃，国际的军队占领了莱茵兰、鲁尔、汉堡和巴伐利亚，出狱的恩斯特·台尔曼在西部宣布成立德意志社会主义共和国。意大利的军队翻过阿尔卑斯山，半岛第一次在红旗下统一；公社的军队渡过地中海，阿尔及尔的“国民法国”随之覆灭。东线的俄军打垮了中欧同盟，攻入东普鲁士，把《布列斯特-立陶夫斯克条约》割走的乌克兰、白罗斯、立陶宛和波罗的海公国重新并入俄国，又吞并了芬兰，占领了维也纳和奥地利东部。\n\n一九四四年春，帝国崩溃。皇帝威廉三世逃往中非帝国的达累斯萨拉姆，秋天中非殖民军瓦解，他转往斯德哥尔摩流亡。施莱歇尔将军带着残存的国防军向俄国人投降，签下《柏林条约》，在易北河以东建立了依附莫斯科的德意志民族共和国。柏林被一分为二，西柏林归社会主义共和国。中欧同盟的东部诸国由与莫斯科结盟的军政府接管。\n\n欧洲的战争以易北河上的停火结束，没有和约。两支获胜的军队隔着铁丝网对峙，这条线五年来一直没有动过。"
 krcw_wintro_3_t:0 "另外两场战争：美洲与亚洲"
 krcw_wintro_3_d:0 "美国的内战成了三方混战。一九三八年，流亡渥太华的协约国政府派兵南下新英格兰，想恢复旧秩序，在奥尔巴尼和布法罗被工团民兵击溃。一九四〇年加拿大工人起义，国王第二次出逃，去了墨尔本。一九四一年麦克阿瑟在华盛顿的政变政府垮台，残部退往西海岸，投奔了萨克拉门托的宪政政府。一九四三年冬天工团的装甲车开到了孟菲斯郊外，此后俄国的步枪和卡车经墨西哥的坦皮科运到朗的手里，朗的军队把工团推回了大河东岸。一九四六年的《圣路易斯停火协定》让双方隔着密西西比河对峙，两边的宪法都宣称对全美拥有主权，西海岸的美利坚宪政联盟两边都不承认。\n\n在中国，汪精卫一九三六年从巴黎回国，重组国民党。第二次北伐从龙岩出发，一九四〇年攻下北京，大清覆亡。关外的奉系不肯向南京低头，日本出兵支持奉系，一九四三年的辽西会战中国民革命军歼灭了关东军主力。一九四四年的《青岛停战协定》让满洲和朝鲜脱离了日本，朝鲜在中国扶持下成立了朝鲜民国，台湾仍在日本手中。一九四六至一九四八年，中国志愿军帮助越南革命，又扶持高棉、寮国和缅甸成立了“兄弟民国”。一九四六年周恩来出任国民政府主席，次年中华民国加入第三国际。\n\n在印度，王公联邦拿着俄国的军火发动统一战争，一九四七年攻灭了加尔各答的婆罗多人民共和国，统一了次大陆，随后加入莫斯科协定。"
 krcw_wintro_4_t:0 "一九四九：两个阵营"
 krcw_wintro_4_d:0 "第三国际以巴黎为中心：不列颠联邦、意大利、德意志社会主义共和国、美利坚联合工团、加拿大、中华民国和它的兄弟民国，加上低地国家、丹麦、挪威、伊比利亚和爱尔兰的工人国家。它的工业和人口占优，但分散在三个大洲，中国和联合工团都有大量内部问题要解决。\n\n莫斯科协定以俄罗斯为中心：朗的美国、墨西哥、印度联邦，东欧和巴尔干的军政府，以及德意志民族共和国、蒙古、波斯和阿富汗这些附庸。它的工业不如对手，陆军却更集中。\n\n两个阵营之间还有别的力量。温莎王室和协约国流亡政府在澳大利亚，与新西兰组成澳新协约，仍自称不列颠唯一的合法政府。日本战败后保住了台湾，不属于任何阵营，与俄国越走越近。西海岸的美利坚宪政联盟以萨克拉门托为首都，自称合众国的合法政府，握着太平洋舰队，两个阵营都在争取它。瑞典、瑞士和拉丁美洲的大部分国家保持中立。\n\n两个阵营在许多地方直接接触：密西西比河上的停火线，西柏林的空中走廊，希腊的山区，西藏的寺院，台湾海峡。第三国际和莫斯科协定打过同一场战争，却从未结盟。如今双方都不准备再打一场世界大战，也都不相信对方会先垮下去。"
