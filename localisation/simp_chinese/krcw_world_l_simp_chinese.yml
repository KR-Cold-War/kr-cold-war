 krcw_paris_clearing_union:0 "巴黎清算联盟"
 krcw_paris_clearing_union_desc:0 "产业联合会之间以“劳动清算单位”记账，顺差自动转化为技术援助与设备贷款。没有银行家的全球化。"
 krcw_dual_key_demand:0 "要求“双钥匙”"
 krcw_psa_courted:0 "拉拢宪政联盟"
 krcw_world.80.t:0 "落基山以西"
 krcw_world.80.d:0 "内战结束时，萨克拉门托的宪政政府既没有向纽约投降，也没有向新奥尔良低头。宪政联盟守住了从圣迭戈到阿拉斯加的海岸，一九三六年追随西海岸各州州长的太平洋舰队也还在它手里。萨克拉门托的国会照常开会，总统照常四年一选，今年一月宣誓就职的是厄尔·沃伦。可是一九四二年的《战时权力法》仍然有效，旧金山、奥克兰和西雅图的港口仍归麦克阿瑟将军的西部防务司令部管辖。\n\n宪政联盟太小，打不赢另外两个美国，又太重要，谁也不能无视它。新奥尔良与纽约都在向它招手，莫斯科与巴黎也是。燃料、零件、贷款、国会里的选票和要塞派将军们的忠诚，都有人在出价。"
 krcw_world.80.a:0 "合众国宪法在萨克拉门托。"
 krcw_world.81.t:0 "红色的旗舰"
 krcw_world.81.d:0 "旧金山码头的总罢工进入第三周，奥克兰的造船厂升起了红旗。萨克拉门托的国会以多数票废除《战时权力法》，授权总统同纽约和巴黎谈判。麦克阿瑟将军在一个雾夜登上飞往马尼拉的飞机，留在要塞里的上校们发现，巴黎的燃料和纽约的军饷早已让半支舰队站到了工人一边。\n\n问题只剩一个：以什么形式加入？作为美利坚联合工团的一员，还是作为第三国际中一个独立的成员？"
 krcw_world.81.a:0 "回到美国，回到工团的美国。"
 krcw_world.81.b:0 "以平等的身份加入第三国际。"
 krcw_world.81.c:0 "不，我们谁也不跟。"
 krcw_world.82.t:0 "新奥尔良的召唤"
 krcw_world.82.d:0 "总统和新奥尔良的特使在萨克拉门托谈了整整一夜，麦克阿瑟将军从要塞赶来列席。俄国人的石油和朗的贷款让宪政联盟撑过了最难的几年。朗许诺西海岸各州保留州长和国会议席，许诺给将军一根元帅杖；码头上那些罢工的鼓动者，已经在夜里被西部防务司令部悄悄送上了开往阿留申的补给船。国会以多数票批准了谈判。\n\n问题只剩一个：以什么形式加入？作为朗的合众国的一部分，还是作为莫斯科协定中一个独立的成员？"
 krcw_world.82.a:0 "回到美国，回到朗的美国。"
 krcw_world.82.b:0 "以平等的身份加入莫斯科协定。"
 krcw_world.82.c:0 "不，我们谁也不跟。"
 krcw_world.83.t:0 "太平洋舰队选边"
 krcw_world.83.d_ti:0 "萨克拉门托的国会今天投票结束了宪政联盟自内战以来的中立，加入第三国际一方。旧金山湾的要塞上，四十八星旗旁边升起了一面红旗。\n\n从阿留申到圣迭戈，太平洋的力量平衡在一夜之间被改写。新奥尔良称之为“叛国”，莫斯科则开始重新计算通往墨西哥的海上航线。"
 krcw_world.83.d_ma:0 "萨克拉门托的国会今天投票结束了宪政联盟自内战以来的中立，加入莫斯科协定一方。西海岸的港口从此向俄罗斯的运输船敞开。\n\n从阿留申到圣迭戈，太平洋的力量平衡在一夜之间被改写。纽约称之为“背叛宪法”，巴黎则开始紧急评估加拿大西海岸的防务。"
 krcw_world.83.a:0 "太平洋是工人的海洋。"
 krcw_world.83.b:0 "海洋属于强者。"
 krcw_world.83.c:0 "太平洋还会向我们开放吗？"
 krcw_world.84.t:0 "檀香山协议"
 krcw_world.84.d:0 "在热线与缓和的氛围中，巴黎、莫斯科和它们在北美的两个盟友在檀香山签署协议：宪政联盟的中立地位受到双方共同保障，西海岸港口向所有国家的商船开放，太平洋诸岛不得部署任何核武器。\n\n萨克拉门托的国会以多数票批准了协议。西部防务司令部的军区随之撤销，港口交还各市政府管理；要塞派的将军们公开表示不满，但没有人违抗国会。"
 krcw_world.84.a:0 "一片和平的海洋。"
 krcw_world.84.b:0 "一个可以接受的安排。"
 krcw_world.84.c:0 "运河开放了！"
 krcw_world.85.t:0 "新奥尔良的葬礼"
 krcw_world.85.d:0 "休伊·朗死了。新奥尔良的灵柩队伍长达六英里，而在纽约，工团报纸的头版只有一行字：“国王死了。”\n\n萨克拉门托的国会外交委员会彻夜开会，要塞里的将军们也在开会。朗的死让合众国陷入继承危机，也让宪政联盟的中立第一次显得不那么牢固：新奥尔良的新主人和纽约的联合工团，都在急切地寻找能让自己在太平洋站稳脚跟的盟友。"
 krcw_world.85.a:0 "向新奥尔良的新政府示好。"
 krcw_world.85.b:0 "与纽约的联合工团接触。"
 krcw_world.85.c:0 "中立不变。"
 krcw_psa_ti_aid:0 "燃料与零件"
 krcw_psa_ti_aid_desc:0 "圣迭戈的油罐只剩三成。一船燃料、一批雷达真空管，比一百篇社论更能打动那些舰长。"
 krcw_psa_ti_admirals:0 "争取国会和要塞"
 krcw_psa_ti_admirals_desc:0 "给萨克拉门托的国会委员会主席们送去贷款和订单，给要塞派的将军们许下晋升和战后的职位。国会要批准结盟，要塞要守住港口，两边都得打点。"
 krcw_psa_ti_propaganda:0 "西海岸广播"
 krcw_psa_ti_propaganda_desc:0 "通过短波电台，向旧金山的码头、西雅图的工厂、萨克拉门托的选民和每一艘战舰的收音机室播送我们的节目：音乐、新闻和我们对美国的主张。"
 krcw_psa_lean_ti_tt_8:0 "宪政联盟倾向第三国际：§G+8§!"
 krcw_psa_lean_ti_tt_12:0 "宪政联盟倾向第三国际：§G+12§!（对手倾向 -3）"
 krcw_psa_lean_ti_tt_5:0 "宪政联盟倾向第三国际：§G+5§!（对手倾向 -2）"
 krcw_psa_ma_aid:0 "燃料与零件"
 krcw_psa_ma_aid_desc:0 "圣迭戈的油罐只剩三成。一船墨西哥湾的原油、一批俄国造的炮管，比一百篇社论更能打动那些舰长。"
 krcw_psa_ma_admirals:0 "争取国会和要塞"
 krcw_psa_ma_admirals_desc:0 "给萨克拉门托的国会委员会主席们送去石油合同和贷款，给要塞派的将军们许下肩章和战后的职位。国会要批准结盟，要塞要守住港口，两边都得打点。"
 krcw_psa_ma_propaganda:0 "西海岸广播"
 krcw_psa_ma_propaganda_desc:0 "通过短波电台，向旧金山的码头、西雅图的工厂、萨克拉门托的选民和每一艘战舰的收音机室播送我们的节目：音乐、新闻和我们对美国的主张。"
 krcw_psa_lean_ma_tt_8:0 "宪政联盟倾向莫斯科协定：§G+8§!"
 krcw_psa_lean_ma_tt_12:0 "宪政联盟倾向莫斯科协定：§G+12§!（对手倾向 -3）"
 krcw_psa_lean_ma_tt_5:0 "宪政联盟倾向莫斯科协定：§G+5§!（对手倾向 -2）"
 krcw_world_berlin_night_flights:0 "夜间航班"
 krcw_world_berlin_night_flights_desc:0 "让运输机在夜里也起飞——危险，但每多一架次，西柏林的面包就多一天。"
 krcw_world_berlin_tighten:0 "收紧绞索"
 krcw_world_berlin_tighten_desc:0 "在柏林周围增派宪兵与探照灯，截断走私的小路与运河驳船。"
 krcw_world_summit:0 "提议首脑会晤"
 krcw_world_summit_desc:0 "在日内瓦、斯德哥尔摩或维也纳，与对方阵营的领袖坐到同一张桌子前。也许什么都谈不成——但谈话本身就是一种降温。"
 krcw_world_show_of_force:0 "武力展示"
 krcw_world_show_of_force_desc:0 "一次大规模的阅兵，一场靠近停火线的演习。让对方知道我们不怕。"
 krcw_world_peace_appeal:0 "和平呼吁"
 krcw_world_peace_appeal_desc:0 "作为一个不属于任何阵营的国家，我们可以在国际讲坛上提醒两大巨人：世界不止有你们两个。"
 krcw_psa_contest:0 "争夺宪政联盟"
 krcw_psa_contest_desc:0 "萨克拉门托的宪政联盟守着西海岸、阿拉斯加与太平洋舰队，纽约和新奥尔良它都不承认。哪一方的倾向先达到§Y100§!，西海岸就将倒向哪一方。\n\n当前倾向：第三国际§R[?PSA.krcw_psa_lean_ti|0]§!　莫斯科协定§g[?PSA.krcw_psa_lean_ma|0]§!"
 krcw_world_situation:0 "世界局势"
 krcw_world_situation_desc:0 "世界紧张度：§R[?global.krcw_tension|0]§! / 100\n缓和度：§G[?global.krcw_detente|0]§! / 100\n\n紧张度达到70以上时，危机更容易升级为战争；缓和度越高，世界越接近“共存”。"
