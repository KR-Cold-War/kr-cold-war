l_simp_chinese:
# krcw: years paced
 krcw_world.1.t:0 "铁丝网的年代"
 krcw_world.1.d:0 "一九四九年的初夏，世界在一场没有和约的停火中醒来。\n\n易北河畔，第三国际的红旗与施莱歇尔政权的黑白红三色旗之间，只隔着两道铁丝网和一片布雷的甜菜地；被一分为二的柏林像一枚卡在两块齿轮之间的钉子。莫斯科的萨文科夫总统在克里姆林宫里校阅着自波罗的海至兴都库什的“卫生带”，巴黎的联合会大楼里，工会代表们则在争论清算联盟的汇率与北非的铁路。\n\n大西洋彼岸，《圣路易斯停火协定》把美利坚劈成两半：密西西比河以东是美利坚联合工团的工业心脏纽约、芝加哥、底特律和匹兹堡；以西则是休伊·朗的合众国，从新奥尔良的码头一直延伸到落基山的矿区。工团赢了内战的一半：它打退了从加拿大南下的协约干涉军，干涉的惨败又让加拿大自己燃起了革命；可是俄国经墨西哥输送的军火让朗站稳了脚跟，巴黎的师团则留在了易北河。而在落基山以西，萨克拉门托的美利坚宪政联盟自称合众国的合法政府，纽约和新奥尔良它都不承认。它守着西海岸、阿拉斯加和太平洋舰队，冷眼旁观。\n\n南京的周恩来在修改土地法的草案，瓜廖尔的大君在王公议会上拒绝了它的印度版本；流亡澳洲的温莎王室，则在墨尔本的冬雨里等待着一个也许永远不会到来的复辟。\n\n没有人知道这道铁丝网会拉多长。但所有人都知道：下一场战争，将没有人能在废墟上宣布胜利。"
 krcw_world.1.a:0 "工人没有祖国，但有未来。"
 krcw_world.1.b:0 "秩序终将战胜混乱。"
 krcw_world.1.c:0 "愿我们能置身事外。"
 krcw_world.2.t:0 "巴黎清算联盟"
 krcw_world.2.d:0 "由总工会联合会、英国合作社批发协会与南京建设委员会共同起草的《巴黎清算公约》终于摆上了联合会代表大会的桌面。它的构想简单而大胆：各国的产业联合会之间不再用黄金或马克结算，而是以一种“劳动清算单位”记账，顺差国的盈余自动转化为对逆差国的技术援助与设备贷款。\n\n问题只剩一个：大门开多大？只对第三国际兄弟开放，还是连中立国、甚至莫斯科阵营里那些饥肠辘辘的小国，也可以来开户？"
 krcw_world.2.a:0 "大门向全世界敞开。"
 krcw_world.2.b:0 "先把兄弟们的账算清楚。"
 krcw_world.3.t:0 "劳动清算单位"
 krcw_world.3.d_open:0 "巴黎清算联盟今日在拉法耶特街的旧交易所大楼正式开业。第一笔记账业务来自里昂的纺织联合会与南京的丝绸合作社。联合会宣布，任何国家——无论属于哪个阵营——只要愿意按公约记账，都可以开设清算账户。伦敦的《工人日报》称之为“没有银行家的全球化”；莫斯科的《俄罗斯言论报》则称之为“披着工装的特洛伊木马”。"
 krcw_world.3.d_closed:0 "巴黎清算联盟今日开业，首批成员限于第三国际各国。联合会的发言人说：“先让兄弟之间的账目透明起来，然后再谈世界。”中立国的商会对此失望，而莫斯科则松了一口气。"
 krcw_world.3.a:0 "账本也是一种团结。"
 krcw_world.3.b:0 "红色的钱依旧是钱。"
 krcw_world.3.c:0 "也许我们可以去开个户……"
 krcw_world.10.t:0 "封锁走廊"
 krcw_world.10.d:0 "西柏林是插在勃兰登堡心脏里的一面红旗。每天有十四列火车从汉诺威驶来，满载着煤、面粉和传单；每天夜里，也有成百上千的波茨坦青年搭乘这些列车的回程，一去不返。\n\n总参谋部送来的备忘录只有一页：以“铁轨检修”为名关闭马格德堡至柏林的铁路走廊。没有枪声，没有宣战——只是让西柏林的面包店在一个月后空空如也。莫斯科已经默许。"
 krcw_world.10.a:0 "铁轨需要“检修”。"
 krcw_world.10.b:0 "加强检查就够了，不必封锁。"
 krcw_world.11.t:0 "西柏林被围"
 krcw_world.11.d:0 "今晨四时，马格德堡以东的信号灯全部转为红色。最后一列驶入柏林的货车带来的是一封电报：“走廊无限期关闭，理由：技术原因。”\n\n西柏林有二百一十万人口，面粉库存可维持三十六天，煤可维持四十五天。台尔曼从法兰克福打来电话，声音嘶哑：“公社是否还记得巴黎被围的冬天？”\n\n联合会防务委员会摆出了三份方案：动用全部运输机，架起一座横跨勃兰登堡的“面包之桥”；派一支装甲护卫车队沿公路强行通过；或者，接受东德的谈判条件，用西柏林的政治让步换取铁路重开。"
 krcw_world.11.a:0 "架起面包之桥！"
 krcw_world.11.b:0 "装甲车队开路。"
 krcw_world.11.c:0 "坐下来谈。"
 krcw_world.12.t:0 "面包之桥"
 krcw_world.12.d:0 "柏林上空的轰鸣声已经持续了三个星期。每隔九十秒，就有一架涂着红色五角星与法国三色标记的运输机降落在滕珀尔霍夫机场。飞行员们把巧克力绑在小降落伞上，从舱门扔给机场篱笆外等候的孩子们。\n\n“他们可以关闭铁路，”西柏林工人委员会主席在广播里说，“但他们关不上天空。”波茨坦的宪兵队接到命令：不得向飞机开火。至少现在还没有。"
 krcw_world.12.a:0 "一架接着一架，直到封锁崩溃。"
 krcw_world.12.b:0 "他们能飞多久？一个冬天？"
 krcw_world.12.c:0 "全世界都在看着滕珀尔霍夫。"
 krcw_world.13.t:0 "莫斯科的决断"
 krcw_world.13.d:0 "波茨坦发来急电：第三国际的车队已经抵达走廊入口，而东德的装甲部队在另一侧严阵以待。曼施坦因请求授权——如果对方越过界桩，是否开火？\n\n萨文科夫在电报的边缘写了一行字，又划掉了。俄罗斯需要柏林这颗钉子，但俄罗斯不需要为了它在一九五〇年打一场世界大战。"
 krcw_world.13.a:0 "命令波茨坦让路。"
 krcw_world.13.b:0 "让他们来试试。"
 krcw_world.14.t:0 "桥还在"
 krcw_world.14.d:0 "封锁已经进入第三个月。西柏林的面包依旧按配给出售，但没有人饿死；滕珀尔霍夫的跑道被扩建了两次，第三国际甚至开始从空中运送钢琴和印刷机来炫耀。\n\n波茨坦的空军将领提出了一个危险的主意：用探照灯干扰和“意外”的高射炮演习，让运输机的飞行员们知道，天空并不属于他们。"
 krcw_world.14.a:0 "封锁失败了，重开铁路。"
 krcw_world.14.b:0 "骚扰空中走廊。"
 krcw_world.15.t:0 "柏林走廊重开"
 krcw_world.15.d:0 "凌晨一点零五分，第一列货车鸣着汽笛驶入西柏林的夏洛滕堡货运站。等候在月台上的人群唱起了《国际歌》，一些老人唱的则是《守卫莱茵》——没有人去纠正他们。\n\n“面包危机”结束了。双方都宣称自己取得了胜利，而双方都心知肚明：在柏林，谁也不敢开第一枪。这或许正是冷战的第一条规则。"
 krcw_world.15.a:0 "天空是自由的，柏林也是。"
 krcw_world.15.b:0 "一次战术性的调整。"
 krcw_world.15.c:0 "世界松了一口气。"
 krcw_world.16.t:0 "探照灯下的运输机"
 krcw_world.16.d:0 "昨夜，一架运输机在波茨坦上空被高射炮弹片击中，迫降在滕珀尔霍夫，机组两人重伤。东德称之为“演习事故”。\n\n空军联合会要求为运输机护航，并对肇事的高炮阵地进行“对等回应”。防务委员会的老工团分子们沉默不语：一旦护航战斗机开火，柏林就不再是面包问题了。"
 krcw_world.16.a:0 "不还击，继续飞。"
 krcw_world.16.b:0 "摧毁那个高炮阵地。"
 krcw_world.17.t:0 "柏林上空的枪声"
 krcw_world.17.d:0 "易北河的停火结束了。今晨，勃兰登堡的炮兵向西柏林的外围阵地开火，第三国际的战斗机群则扑向了波茨坦的机场。\n\n在巴黎和莫斯科，没有人愿意承认是自己先开的枪；在柏林的地下室里，人们只知道炮声又回来了。世界各国的首都都在问同一个问题：这是一场局部战争——还是第三次世界大战的第一天？"
 krcw_world.17.a:0 "是他们逼我们的。"
 krcw_world.17.b:0 "柏林将属于整个德意志。"
 krcw_world.17.c:0 "愿上帝怜悯欧洲。"
 krcw_world.18.t:0 "柏林的妥协"
 krcw_world.18.d:0 "经过数周的紧张谈判，东德与西德的代表在中立的瑞士伯尔尼签署了一份关于柏林铁路走廊“技术管理”的议定书。列车照常运行，但每节车厢都将接受联合检查。\n\n台尔曼称之为“苦涩的面包”，波茨坦称之为“主权的胜利”。而对西柏林的家庭主妇们来说，最重要的是：面包店的货架又满了。"
 krcw_world.18.a:0 "苦涩，但不致命。"
 krcw_world.18.b:0 "他们退缩了。"
 krcw_world.18.c:0 "至少没有打起来。"
 krcw_world.30.t:0 "雷加内的太阳"
 krcw_world.30.d:0 "阿尔及利亚撒哈拉深处，雷加内试验场。一座三十米高的钢塔顶端，挂着公社科学家们口中的“路易丝”——以巴黎公社的女英雄路易丝·米歇尔命名。\n\n原子能委员会的报告称，一切准备就绪。只需联合会防务委员会最后签字。问题是：公社要以什么姿态向世界宣布这颗新的太阳？"
 krcw_world.30.a:0 "让莫斯科看见它。"
 krcw_world.30.b:0 "同时提议禁止在城市上空使用它。"
 krcw_world.31.t:0 "公社拥有了原子弹"
 krcw_world.31.d:0 "今晨五时十分，撒哈拉的天空被一道比正午更亮的白光撕开。法兰西公社宣布，其第一枚原子装置“路易丝”在雷加内试验成功。\n\n“这颗太阳不属于任何将军，”联合会的公报写道，“它属于那些不愿再看到城市被焚毁的工人。”莫斯科保持了二十个小时的沉默，然后宣布俄罗斯国“完全有能力、也必将”拥有同样的武器。"
 krcw_world.31.a:0 "和平有了盾牌。"
 krcw_world.31.b:0 "我们必须加快。"
 krcw_world.31.c:0 "世界从此不同了。"
 krcw_world.32.t:0 "新地岛"
 krcw_world.32.d:0 "北冰洋，新地岛，“北极光”工程。十二年来，这项工程吞下了乌拉尔三分之一的电力和成千上万名劳改犯的生命。今天，科学家们报告：装置已经就位。\n\n自雷加内的那道白光以来，莫斯科已经在巴黎的阴影下活了五年。现在，是让世界知道俄罗斯也有自己的太阳的时候了。"
 krcw_world.32.a:0 "引爆。"
 krcw_world.32.b:0 "引爆，并宣布“只用于报复”。"
 krcw_world.33.t:0 "恐怖的平衡"
 krcw_world.33.d:0 "俄罗斯国宣布，其第一枚原子弹已在新地岛成功试爆。挪威北部的地震仪记录下了这次爆炸。\n\n从今天起，世界上有了两颗人造的太阳，分别悬挂在巴黎和莫斯科的头顶。评论家们开始使用一个新的词汇——“恐怖的平衡”。易北河、密西西比河、喜马拉雅山……每一条停火线的意义，都在这一夜被重新改写。"
 krcw_world.33.a:0 "我们必须更努力地维护和平。"
 krcw_world.33.b:0 "俄罗斯不再低头。"
 krcw_world.33.c:0 "两个太阳，一个世界。"
 krcw_world.41.t:0 "“一八七一号”"
 krcw_world.41.d:0 "哈马吉尔发射场，阿尔及利亚。一枚“宝石”运载火箭矗立在沙漠的晨光中，整流罩里是一个直径五十八厘米、重八十三公斤的铝球，四根天线像蝴蝶的触须。\n\n它的名字早就定好了：“一八七一号”——为了纪念那个只存在了七十二天的公社。联合会只需要决定一件事：它发出的无线电信号，是公社的密码，还是全世界任何一台收音机都能收听的明码？"
 krcw_world.41.a:0 "让它在天上唱《国际歌》。"
 krcw_world.41.b:0 "向全世界的科学家公开遥测数据。"
 krcw_world.42.t:0 "俄罗斯的星辰"
 krcw_world.42.d:0 "丘拉塔姆的草原上，一枚粗壮的R型火箭在寒风中喷出白雾。总设计师科罗廖夫已经三天没有合眼。\n\n情报显示，法国人的“一八七一号”距离发射只有几个星期了。如果俄罗斯先行一步，这将是萨文科夫之后的莫斯科第一次在全世界面前抬起头来。"
 krcw_world.42.a:0 "点火！"
 krcw_world.43.t:0 "天上的公社"
 krcw_world.43.d_open:0 "法兰西公社宣布，其第一颗人造卫星“一八七一号”已进入环绕地球的轨道。每隔九十六分钟，它就从人们头顶掠过一次，发出清脆的“嘀——嘀——”声。公社同时宣布，全部遥测数据向世界各国的天文台开放。从雷克雅未克到墨尔本，业余无线电爱好者们整夜守在收音机旁。就连莫斯科大学的天文学家，据说也在偷偷记录它的轨道。"
 krcw_world.43.d_closed:0 "法兰西公社宣布，其第一颗人造卫星“一八七一号”已进入环绕地球的轨道。它发出的无线电信号，据说是用摩尔斯电码拍出的《国际歌》前四个小节。巴黎的街头，人们仰望夜空寻找那颗移动的星星；莫斯科则宣布加倍投入自己的火箭计划。太空竞赛开始了。"
 krcw_world.43.a:0 "先是巴黎，然后是星辰。"
 krcw_world.43.b:0 "我们会追上去的。"
 krcw_world.43.c:0 "今夜，所有人都在仰望。"
 krcw_world.44.t:0 "俄罗斯的第一颗卫星"
 krcw_world.44.d:0 "出乎所有人的意料，俄罗斯国抢先发射了人类第一颗人造卫星。莫斯科的广播中，播音员用颤抖的声音宣布：“俄罗斯的星辰，今夜照耀着巴黎。”\n\n巴黎的联合会大楼里爆发了激烈的争吵：“一八七一号”为什么晚了一步？而在世界各地，人们第一次意识到，那道从雷加内和新地岛升起的火光，也可以把人类带向另一个方向。"
 krcw_world.44.a:0 "我们输了一局，没有输掉比赛。"
 krcw_world.44.b:0 "俄罗斯领先了！"
 krcw_world.44.c:0 "星辰不属于任何阵营。"
 krcw_world.50.t:0 "“伏尔加”行动"
 krcw_world.50.d:0 "总参谋部的地图上，一条红线从明斯克延伸到芝加哥。法国人的中程导弹在加拿大的温尼伯和工团美国的匹兹堡已经部署了两年，每一枚都能在十五分钟内飞抵朗的合众国的任何一座城市。而俄罗斯的导弹，还远在大洋彼岸。\n\n“伏尔加”行动的方案是：以农业机械的名义，把四十二枚中程导弹经墨西哥和新奥尔良运入合众国，秘密部署在明尼苏达、艾奥瓦和密苏里的玉米地里——从那里，芝加哥、底特律、多伦多乃至整个五大湖工业带，都在射程之内。\n\n如果行动成功，恐怖的平衡将第一次真正“平衡”。如果被发现……"
 krcw_world.50.a:0 "执行“伏尔加”。"
 krcw_world.50.b:0 "太冒险了，取消行动。"
 krcw_world.58.t:0 "玉米地里的“拖拉机”"
 krcw_world.58.d:0 "俄国人的“农业机械”已经卸在新奥尔良的码头上，沿着密西西比河西岸的公路一路北上。每一台都需要二十个人、一辆平板拖车和一个不许拍照的命令。\n\n新奥尔良的将军们兴奋不已：终于，芝加哥和底特律的红色政委们也要尝尝被导弹瞄准的滋味了。但也有人低声提醒：如果巴黎决定先下手为强，第一批落下的弹头将砸在得梅因、圣路易斯和明尼阿波利斯。"
 krcw_world.58.a:0 "欢迎俄国朋友。"
 krcw_world.58.b:0 "要求“双钥匙”——发射需经我方同意。"
 krcw_world.51.t:0 "两万米高空的照片"
 krcw_world.51.d:0 "一架从伊利诺伊起飞的工团空军高空侦察机，在两万米高空拍下了艾奥瓦与明尼苏达交界处的一组照片。照片分析室的灯亮了一整夜。凌晨，分析员把放大后的照片钉在墙上：发射架、燃料车、呈品字形排列的混凝土基座。\n\n中程导弹。射程两千公里。芝加哥、底特律、克利夫兰、多伦多、温尼伯都在圈内。\n\n联合会防务委员会紧急召开。桌上有三个方案：宣布对墨西哥湾与加利福尼亚沿海实施“海上检疫”，阻止更多导弹运入；向莫斯科发出四十八小时的最后通牒，否则空袭导弹阵地；或者暂不声张，通过秘密渠道与莫斯科讨价还价。"
 krcw_world.51.a:0 "海上检疫。"
 krcw_world.51.b:0 "四十八小时最后通牒。"
 krcw_world.51.c:0 "暂不声张，秘密谈判。"
 krcw_world.52.t:0 "五大湖导弹危机"
 krcw_world.52.d_q:0 "法兰西公社今晚公布了艾奥瓦与明尼苏达玉米地中俄罗斯导弹阵地的照片，并宣布即日起对墨西哥湾和墨西哥太平洋沿岸实施“海上检疫”：任何驶往朗的合众国的船只都必须接受第三国际海军的检查。\n\n在芝加哥、底特律和多伦多，民防警报第一次在非演习状态下拉响；五大湖畔的市民们开始往地下室里囤积罐头。世界屏住了呼吸，等待莫斯科的回答。"
 krcw_world.52.d_u:0 "法兰西公社今晚公布了艾奥瓦与明尼苏达玉米地中俄罗斯导弹阵地的照片，并向莫斯科发出最后通牒：四十八小时内撤走导弹，否则第三国际空军将摧毁这些阵地。\n\n芝加哥、底特律、新奥尔良、达拉斯——北美大陆上的每一座城市都在同一张地图上。广播里一遍遍播放着防空洞的位置。这可能是人类历史上最漫长的四十八小时。"
 krcw_world.52.a:0 "我们不会在湖畔的导弹面前退缩。"
 krcw_world.52.b:0 "他们在加拿大的导弹又算什么？"
 krcw_world.52.c:0 "求求你们，都冷静下来。"
 krcw_world.57.t:0 "警报声中的五大湖"
 krcw_world.57.d:0 "导弹的射程圈覆盖了我们的大半国土——五大湖的每一座工厂、每一个工会大厅。工会大厅里挤满了自愿报名的民防队员，学校在教孩子们躲到课桌下面。有人在工厂的墙上刷了一行大字：“我们不是棋子。”"
 krcw_world.57.a:0 "动员民防。"
 krcw_world.57.b:0 "呼吁巴黎保持克制。"
 krcw_world.53.t:0 "莫斯科的抉择"
 krcw_world.53.d_q:0 "第三国际的驱逐舰已经在墨西哥湾拦下了第一艘俄罗斯货轮。另有六艘正在大西洋上继续航行，它们的船长在等待克里姆林宫的命令。\n\n与此同时，一位法国外交官通过维也纳的秘密渠道递来一张纸条：如果俄罗斯撤走五大湖的导弹，公社将在六个月内悄悄撤走温尼伯和匹兹堡的导弹，并承诺不对合众国发动入侵。"
 krcw_world.53.d_u:0 "巴黎的最后通牒还剩三十个小时。第三国际的轰炸机已经在芝加哥和温尼伯的跑道上加满了油。\n\n俄罗斯的将军们分成了两派：一派要求让导弹进入战备状态，“让他们知道莫斯科也会开枪”；另一派则提醒：玉米地里的导弹阵地根本没有防空能力，而一旦开战，第一个被焚毁的将是我们的美国盟友。"
 krcw_world.53.a:0 "以撤换撤——接受交易。"
 krcw_world.53.d:0 "撤走导弹。莫斯科不会为了芝加哥而焚毁莫斯科。"
 krcw_world.53.b:0 "船队继续前进。"
 krcw_world.53.c:0 "让导弹进入战备状态。"
 krcw_world.54.t:0 "黑色星期六"
 krcw_world.54.d:0 "俄罗斯的船队没有掉头。今天上午，一架第三国际的侦察机在艾奥瓦上空被击落，飞行员阵亡。下午，一艘驱逐舰向一艘拒绝停船的俄罗斯潜艇投下了练习用深水炸弹。\n\n防务委员会里，有人拍着桌子要求立即空袭；也有人拿出那张维也纳的纸条：“他们还在谈。只要还在谈，我们就还没有输。”"
 krcw_world.54.a:0 "再给谈判一次机会——私下接受他们的条件。"
 krcw_world.54.b:0 "空袭导弹阵地。"
 krcw_world.55.t:0 "危机结束了"
 krcw_world.55.d_deal:0 "莫斯科电台今晨宣布，“出于对和平的责任”，俄罗斯将拆除部署在艾奥瓦与明尼苏达的“防御性武器”。几个小时后，巴黎宣布将“重新评估”在加拿大和工团美国的导弹部署。\n\n没有人赢，也没有人输——或者说，所有人都赢了。芝加哥和底特律的居民从地下室里走出来，看见了十三天来的第一个晴天。在巴黎和莫斯科，两位领导人都说了同一句话：“绝不能再有下一次。”"
 krcw_world.55.d_ti:0 "在最后通牒到期前六个小时，俄罗斯的导弹开始撤离密西西比河西岸。莫斯科没有得到任何交换条件。\n\n巴黎的街头一片欢腾，而在克里姆林宫，将军们沉默地看着地图——他们不会忘记这次屈辱。但在这一次的边缘之后，就连最强硬的人也开始认真考虑：两个核大国之间，是否需要一条永远不会占线的电话线？"
 krcw_world.55.d_ma:0 "第三国际没有空袭。经过秘密谈判，公社同意撤走温尼伯和匹兹堡的导弹，而俄罗斯的导弹——至少暂时——留在了密西西比河西岸，瞄准着五大湖。\n\n莫斯科宣布了“和平的胜利”；巴黎的联合会代表大会上，防务委员会遭到了严厉的质询。但所有人都明白：世界曾离深渊只有一步之遥。"
 krcw_world.55.a:0 "理智获胜了。"
 krcw_world.55.b:0 "我们守住了尊严。"
 krcw_world.55.c:0 "我们还活着。"
 krcw_world.56.t:0 "湖上的火焰"
 krcw_world.56.d:0 "今晨，第三国际的轰炸机群越过了密西西比河。在它们身后，是整整一个大陆的战争。\n\n莫斯科宣布与法兰西公社进入战争状态；在密西西比河，停火十六年的战线被炮火重新点燃。世界各国的广播电台中断了正常节目。易北河、喜马拉雅山、台湾海峡——所有的停火线都在等待着同一个问题的答案：第一枚原子弹，会落在哪里？"
 krcw_world.56.a:0 "为了人类的未来，战斗吧。"
 krcw_world.56.b:0 "他们先动的手。"
 krcw_world.56.c:0 "上帝啊……"
 krcw_world.64.t:0 "巴黎—莫斯科热线"
 krcw_world.64.d:0 "一条穿过赫尔辛基、斯德哥尔摩和哥本哈根的电传线路，今天把联合会大楼与克里姆林宫直接连在了一起。第一条测试电文是巴黎发出的：“快速的棕色狐狸跳过了懒狗。1234567890。”莫斯科的回电是一首普希金的诗。\n\n它不是和平，只是一根电线。但在五大湖的十三天之后，这根电线也许比任何条约都重要。"
 krcw_world.64.a:0 "先是电话，然后是对话。"
 krcw_world.64.b:0 "至少他们听得到我们了。"
 krcw_world.64.c:0 "世界终于可以喘口气了。"
 krcw_world.60.t:0 "斯德哥尔摩暂停协议"
 krcw_world.60.d:0 "在中立的瑞典首都，法兰西公社与俄罗斯国的代表签署了《斯德哥尔摩暂停协议》：双方承诺停止在大气层、外层空间和水下进行核试验。协议只有七页，其中三页是签字。\n\n“我们没有拆除一枚导弹，”巴黎的代表坦言，“但我们第一次同意了一件事——孩子们喝的牛奶里，不应该有锶-90。”"
 krcw_world.60.a:0 "第一步。"
 krcw_world.60.b:0 "代价不大。"
 krcw_world.60.c:0 "天空干净了一点。"
 krcw_world.61.t:0 "伏尔加的小麦，罗讷的机床"
 krcw_world.61.d:0 "一九五三年的歉收让俄罗斯的粮仓见了底。出人意料的是，莫斯科向巴黎清算联盟递交了开户申请——用西伯利亚的木材与石油，换取第三国际的化肥、拖拉机与机床。\n\n联合会代表大会以微弱多数批准了这笔交易。反对者说这是在“喂养敌人”，赞成者则引用了一句老话：“互相做买卖的人，很少互相开枪。”"
 krcw_world.61.a:0 "团结也可以做成生意。"
 krcw_world.61.b:0 "面包比骄傲更重要。"
 krcw_world.61.c:0 "铁幕上开了一扇窗。"
 krcw_world.62.t:0 "柏林的探亲通行证"
 krcw_world.62.d:0 "十五年来第一次，东西柏林的居民可以凭“探亲通行证”越过分界线，在圣诞节与复活节各探望亲人三天。第一天，边检站前排起了四公里长的队伍。\n\n一位八十岁的老妇人在检查站的铁栏杆前哭了很久。她的女儿住在五条街以外。"
 krcw_world.62.a:0 "铁丝网开始生锈了。"
 krcw_world.62.b:0 "一次人道主义的姿态。"
 krcw_world.62.c:0 "柏林在微笑。"
 krcw_world.63.t:0 "恐怖平衡之后"
 krcw_world.63.d_warm:0 "回首一九五〇年代，世界曾在柏林的面包、雷加内的白光与五大湖的导弹之间一次次站到悬崖边上。如今，巴黎与莫斯科之间有了热线，天空中没有了试验的蘑菇云，清算联盟的账本上甚至出现了俄罗斯的名字。\n\n冷战没有结束。但一种新的词汇开始出现在报纸上：“共存”。"
 krcw_world.63.d_cold:0 "一九五三年，世界依旧被铁丝网和导弹分割。每一次缓和的尝试都在猜疑中夭折，两大阵营的军费仍在逐年上涨。\n\n评论家们说，这是一个“冰冻的和平”。也许冰层终有一天会融化——但不是今天。"
 krcw_world.63.a:0 "未来属于合作。"
 krcw_world.63.b:0 "我们依然警惕。"
 krcw_world.63.c:0 "让我们期待更好的年代。"
 krcw_world.70.t:0 "斯德哥尔摩奥运会"
 krcw_world.70.d:0 "第十五届奥林匹克运动会在中立的斯德哥尔摩开幕。这是战后第一次两大阵营的运动员同场竞技。开幕式上，第三国际代表团举着红旗入场，俄罗斯代表团则穿着双头鹰图案的白色制服——两队之间，瑞典组委会特意安排了冰岛和瑞士。\n\n最受关注的是足球半决赛：法兰西公社对俄罗斯。九万名观众，一百二十分钟，比分二比二，点球大战。无论谁赢，第二天的报纸都会说那是“意识形态的胜利”。"
 krcw_world.70.a:0 "公社的球队踢的是集体足球！"
 krcw_world.70.b:0 "俄罗斯的意志不可战胜！"
 krcw_world.70.c:0 "体育就是体育。"
 krcw_world.71.t:0 "苏黎世的棋盘"
 krcw_world.71.d:0 "世界国际象棋冠军赛在苏黎世举行。对阵双方的身份比棋局本身更具戏剧性：代表俄罗斯国出战的，是被迫加入俄国籍的爱沙尼亚人保尔·克列斯；代表法兰西公社出战的，则是一位生于基辅、流亡巴黎的俄罗斯白侨之子——尼古拉·罗索利莫。\n\n“一个为俄罗斯下棋的爱沙尼亚人，对一个为公社下棋的俄罗斯人，”《新苏黎世报》写道，“这就是我们这个时代的全部讽刺。”"
 krcw_world.71.a:0 "每一步都是自由的选择。"
 krcw_world.71.b:0 "纪律赢得棋局。"
 krcw_world.71.c:0 "棋盘上没有铁幕。"
 krcw_world.72.t:0 "墨尔本的“国王的运动会”"
 krcw_world.72.d:0 "第十六届奥运会在墨尔本开幕，流亡的温莎国王亲自主持开幕式。对第三国际而言，这是一个难题：派代表团，等于在一位被自己推翻的国王面前列队；不派，则会把整个南太平洋的舞台拱手让给莫斯科。\n\n最后，不列颠联邦的运动员们还是来了。当他们走过主席台时，国王站起身来，向这些曾经的臣民脱帽致意。看台上一片寂静，然后是经久不息的掌声。"
 krcw_world.72.a:0 "运动员属于人民，不属于国王。"
 krcw_world.72.b:0 "澳洲人会记得谁更尊重他们。"
 krcw_world.72.c:0 "一个优雅的时刻。"
 krcw_world.73.t:0 "布鲁塞尔世界博览会"
 krcw_world.73.d:0 "布鲁塞尔世界博览会开幕。最引人注目的是两座相邻的展馆：第三国际的“劳动之塔”展出了控制论计划机、合作社城市模型和一台可以同时为二十个工厂排班的电子计算机；俄罗斯国的“帝国之门”展馆则陈列着拖拉机、破冰船模型和一座高达十二米的萨文科夫铜像。\n\n据统计，参观“劳动之塔”的俄罗斯游客，比参观俄罗斯馆的法国游客多出一倍。"
 krcw_world.73.a:0 "未来已经展出。"
 krcw_world.73.b:0 "俄罗斯的钢铁更坚实。"
 krcw_world.73.c:0 "多么奇妙的时代！"
 krcw_world.76.t:0 "午夜将至"
 krcw_world.76.d:0 "日内瓦三个停火委员会的季度报告同时送到了各国外交部。易北河、俄亥俄河和台湾海峡三条停火线上的违约记录都创了新高，委员们已经停止在报告末尾写“局势可控”。\n\n瑞士的委员会主席对记者说：“每一条停火线都在冒烟，而手里拿着火柴的人不止一个。”"
 krcw_world.76.a:0 "这正是我们需要团结的原因。"
 krcw_world.76.b:0 "软弱者才害怕。"
 krcw_world.76.c:0 "我们能做什么？"
 krcw_world.77.t:0 "解冻的迹象"
 krcw_world.77.d:0 "日内瓦停火委员会的季度报告显示，易北河与俄亥俄河两条停火线上的违约记录已经连续三个季度下降。第一个贸易代表团越过了易北河，巴黎和莫斯科的科学院也交换了访问学者。\n\n“冰层很厚，”委员会主席说，“但我们已经听见了它碎裂的声音。”"
 krcw_world.77.a:0 "世界正在向前走。"
 krcw_world.77.b:0 "保持警惕，但可以谈。"
 krcw_world.77.c:0 "春天总会来的。"
