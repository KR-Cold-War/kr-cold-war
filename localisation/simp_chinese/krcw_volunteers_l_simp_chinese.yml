l_simp_chinese:
# krcw: years paced
 krcw_volunteers_tt:0 "§Y志愿军§!可以派往该战场"
 krcw_volunteer_mobilisation:0 "志愿军动员"
 krcw_volunteer_mobilisation_desc:0 "报名处设在工会大厅和大学食堂门口。官方的说法是\"个人自愿的国际主义行动\"，而报名表的背面印着部队编号与集结地点。"
 krcw_proxy_commitment:0 "代理战争的负担"
 krcw_proxy_commitment_desc:0 "没有人宣战，可是军火、顾问与抚恤金都是真的。每一场\"别人的战争\"都在本国的预算上留下一行字。"
 krcw_vol_gratitude:0 "志愿军的血"
 krcw_vol_resentment:0 "干涉我们的战争"
 krcw_ti_brigades_cat:0 "国际纵队"
 krcw_ti_brigades_cat_desc:0 "西班牙的传统没有死。凡是有人举起红旗的地方，巴黎的报名处就会排起队伍。"
 krcw_ti_open_the_enlistment:0 "开设报名处"
 krcw_ti_open_the_enlistment_desc:0 "工会大厅门口摆起桌子。官方称之为个人自愿的国际主义行动，谁都知道这话是什么意思。"
 krcw_ti_brigade_to_lhasa:0 "雪山上的纵队"
 krcw_ti_brigade_to_lhasa_desc:0 "中华民国是国际的亚洲支柱。如果拉萨的叛乱得胜，印度的王公就赢了一场冷战。"
 krcw_ti_brigade_to_katanga:0 "支援加丹加矿工"
 krcw_ti_brigade_to_katanga_desc:0 "铜带的矿工委员会举着红旗。巴黎不能对着一场真正的工人起义坐视不理——哪怕它发生在赞比西联邦的境内。"
 krcw_ti_brigade_to_pindus:0 "品都斯的游击队"
 krcw_ti_brigade_to_pindus_desc:0 "希腊的工团主义者在山里已经打了三年。意大利的渔船夜里渡过奥特朗托海峡，可以把步枪、电台和医生送到伊庇鲁斯的海湾。"
 krcw_ti_brigade_to_the_ohio:0 "俄亥俄河的志愿者"
 krcw_ti_brigade_to_the_ohio_desc:0 "美利坚联合工团在大河对岸独自作战。加拿大的铁路可以把人和枪一起送过去。"
 krcw_ma_advisers_cat:0 "军事顾问团"
 krcw_ma_advisers_cat_desc:0 "莫斯科不派\"志愿军\"——它派顾问、教官和技术人员。区别在文件上，不在战场上。"
 krcw_ma_open_the_missions:0 "组建顾问团"
 krcw_ma_open_the_missions_desc:0 "总参谋部抽调军官，护照上写着\"农业专家\"。他们的行李里有条令、地图和一台电台。"
 krcw_ma_advisers_to_lhasa:0 "拉萨的顾问"
 krcw_ma_advisers_to_lhasa_desc:0 "一个自立的西藏会把中华民国的注意力永远钉在喜马拉雅山上。这笔投资很便宜。"
 krcw_ma_advisers_to_lusaka:0 "支援卢萨卡"
 krcw_ma_advisers_to_lusaka_desc:0 "赞比西联邦不是协定的成员，但它在镇压一场工团主义叛乱。这已经足够成为朋友。"
 krcw_ma_advisers_to_athens:0 "雅典的反游击顾问"
 krcw_ma_advisers_to_athens_desc:0 "帕帕戈斯的军队在品都斯山里追了三年游击队。莫斯科派去的顾问带来了山地作战条令与直升机。"
 krcw_ma_advisers_to_new_orleans:0 "新奥尔良的军械"
 krcw_ma_advisers_to_new_orleans_desc:0 "经坦皮科上岸的军火已经养活了朗的军队十年。战争一开始，这条通道的流量要翻三倍。"
