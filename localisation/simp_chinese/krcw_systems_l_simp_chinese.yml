 krcw_dm_ddr_exodus:0 "人口外流"
 krcw_dm_ddr_exodus_desc:0 "每个月都有工程师、医生和熟练工人经柏林去了西边。外流越多，工厂和实验室缺的人越多。"
 krcw_dm_raj_princes:0 "土邦与改革"
 krcw_dm_raj_princes_desc:0 "各土邦的骚乱拖慢建设、动摇政局；联邦的改革每推进一步，德里的政令就多一分分量。"
 krcw_dm_ohio_line:0 "密西西比停火线"
 krcw_dm_ohio_line_desc:0 "停火线越紧，两岸越像在打仗：征兵站排起了队，工厂里的消费品生产线改成了弹药线。"
 krcw_dm_strait:0 "台湾海峡"
 krcw_dm_strait_desc:0 "海峡越紧张，两岸的海军越忙：巡逻艇夜里不熄灯，报纸每天都登对岸的照会。"
 krcw_dm_berlin:0 "柏林走廊"
 krcw_dm_berlin_desc:0 "走廊上的每一次刁难都让西德人更愿意打仗，也让运往西柏林的建材和煤占掉更多的车皮。"
 krcw_dm_ti_crisis:0 "国际内部的危机"
 krcw_dm_ti_crisis_desc:0 "成员国的抱怨、排队和罢工都会传到巴黎。危机越深，书记处花在调解上的精力越多。"
 krcw_dm_ma_crisis:0 "协定内部的危机"
 krcw_dm_ma_crisis_desc:0 "卫生带各国的将军和印度的王公都在观望莫斯科。危机越深，莫斯科花在安抚盟友上的精力越多。"
 krcw_dm_sov_street:0 "空位期的街头"
 krcw_dm_sov_street_desc:0 "沃尔夏茨基的人在工厂门口发传单，教会在讲台上为皇室祈祷。极端派和君主派越强，莫斯科越不安定。"
 krcw_crisis_missions_cat:0 "危机"
 krcw_crisis_missions_cat_desc:0 "本国正在面对的危机。每一项都有期限，期限之前把局势压下去，否则要承担后果。"
 krcw_m_ddr_stem_the_flow:0 "堵住柏林的口子"
 krcw_m_ddr_stem_the_flow_desc:0 "外流已经到了政府不能不管的地步。半年内把它压下去，否则总参谋部会自己去封边界。"
 krcw_m_wgr_hold_berlin:0 "守住西柏林"
 krcw_m_wgr_hold_berlin_desc:0 "西柏林的存煤只够几个月。在走廊被彻底卡死之前缓和局势，否则国际的盟友会怀疑西德守不守得住这座城。"
 krcw_m_us_cool_the_line:0 "让停火线冷下来"
 krcw_m_us_cool_the_line_desc:0 "两岸的哨所已经开始对射。半年内把局势降下来，否则圣路易斯委员会就会休会。"
 krcw_m_raj_the_princes:0 "平息土邦"
 krcw_m_raj_the_princes_desc:0 "骚乱从海得拉巴蔓延到了中央邦。八个月内把局面稳住，否则土邦会一个接一个宣布自行其是。"
 krcw_m_fra_hold_the_internationale:0 "稳住国际"
 krcw_m_fra_hold_the_internationale_desc:0 "成员国的代表在代表大会上公开抱怨巴黎。九个月内平息不满，否则会有人退出。"
 krcw_m_sov_hold_the_accord:0 "稳住协定"
 krcw_m_sov_hold_the_accord_desc:0 "华沙和布加勒斯特的将军们开始私下接触巴黎。九个月内重新拉住他们，否则卫生带会出现缺口。"
 krcw_m_sov_contain_the_street:0 "管住街头"
 krcw_m_sov_contain_the_street_desc:0 "沃尔夏茨基的人在莫斯科和彼得格勒组织游行。在国家会议投票之前压住他们，否则票数会跟着街头走。"
 krcw_m_chi_win_lhasa:0 "稳住拉萨"
 krcw_m_chi_win_lhasa_desc:0 "噶伦堡的银元和康区的马帮都在往拉萨流。半年内把贵族们拉回来，否则起事只是时间问题。"
 krcw_m_proxy_gre:0 "剿灭品都斯游击队"
 krcw_m_proxy_gre_desc:0 "起义军撑过一年，这场仗就会变成拖不完的游击战，外国的志愿军和顾问也会越来越多。"
 krcw_m_proxy_per:0 "收复阿塞拜疆省"
 krcw_m_proxy_per_desc:0 "起义军撑过一年，这场仗就会变成拖不完的游击战，外国的志愿军和顾问也会越来越多。"
 krcw_m_proxy_phi:0 "平定中吕宋"
 krcw_m_proxy_phi_desc:0 "起义军撑过一年，这场仗就会变成拖不完的游击战，外国的志愿军和顾问也会越来越多。"
 krcw_m_proxy_brm:0 "平定掸邦"
 krcw_m_proxy_brm_desc:0 "起义军撑过一年，这场仗就会变成拖不完的游击战，外国的志愿军和顾问也会越来越多。"
 krcw_m_proxy_mex:0 "平定米却肯"
 krcw_m_proxy_mex_desc:0 "起义军撑过一年，这场仗就会变成拖不完的游击战，外国的志愿军和顾问也会越来越多。"
 krcw_m_open_chi:0 "收编地方实力派"
 krcw_m_open_chi_desc:0 "阎锡山、白崇禧和胡宗南还握着自己的军队和税源。一年之内把他们的部队收编进国民革命军，否则黄埔的将领们会说南京管不了军队。"
 krcw_m_open_sov:0 "为身后事做准备"
 krcw_m_open_sov_desc:0 "萨文科夫七十岁了，从未指定继承人。国家会议必须在他还活着的时候定下继承的程序，否则他死后将由街头和祭坛决定。"
 krcw_m_open_fra:0 "起草国际的章程"
 krcw_m_open_fra_desc:0 "各支部要求在第一次代表大会之前看到章程草案。巴黎拖得越久，小成员国越怀疑国际只是法国的外交部。"
 krcw_m_open_eng:0 "煤炭不能断"
 krcw_m_open_eng_desc:0 "船厂、电厂和铁路都在等煤，矿区的设备却是战前的。半年内拿出全国煤炭计划，否则今年冬天会拉闸限电。"
 krcw_m_open_wgr:0 "打通柏林生命线"
 krcw_m_open_wgr_desc:0 "西柏林的煤、粮和药品全靠一条穿过东德的走廊。半年内把运输组织起来，否则下一次刁难就会变成封锁。"
 krcw_m_open_ddr:0 "拿出重建计划"
 krcw_m_open_ddr_desc:0 "东德的工厂一半还是废墟，工人每天都在看西柏林的商店。半年内拿出重建计划，否则人会开始往西走。"
 krcw_m_open_usa:0 "兑现分享财富"
 krcw_m_open_usa_desc:0 "朗答应过每个美国人一份家产。半年内让国会通过法案，否则各州的党魁会开始自己向选民许诺。"
 krcw_m_open_wca:0 "召开第九次代表大会"
 krcw_m_open_wca_desc:0 "战争结束后工团联合会还没有开过代表大会。半年内召开大会，否则各地的工会会开始自己选代表。"
 krcw_m_open_raj:0 "建立联邦秘书处"
 krcw_m_open_raj_desc:0 "德里的命令到了各土邦就没人执行。七个月内建起联邦秘书处，否则王公们会把联邦当成一个空名号。"
 krcw_m_open_jap:0 "安置撤侨"
 krcw_m_open_jap_desc:0 "五百万人从满洲和朝鲜撤回本土，住在港口的营地里。半年内给他们找到住处和工作，否则复仇主义者会替他们找。"
 krcw_m_open_psa:0 "复审战时权力法"
 krcw_m_open_psa_desc:0 "《战时权力法》下的港口军区已经实行了七年。半年内完成复审，否则旧金山的码头工会会再次罢工。"
 krcw_m_long_war:0 "拖不完的战争"
 krcw_m_long_war_desc:0 "起义军撑过了第一年。政府军守得住城镇，守不住乡村，每个月都有新的伤亡名单。"
