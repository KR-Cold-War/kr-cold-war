# -*- coding: utf-8 -*-
l_simp_chinese:
 LOADING_TIP_0:0 "1919年德国赢得了世界大战。1944年第三国际与萨文科夫的俄罗斯从东西两面夹击，第二次世界大战以德意志帝国的崩溃告终。"
 LOADING_TIP_1:0 "战后，胜利者之间的裂痕变成了一道横贯世界的铁丝网：巴黎与伦敦的公社，对阵新奥尔良与莫斯科的铁腕。"
 LOADING_TIP_2:0 "易北河畔，铁丝网两侧的哨兵日夜对峙。柏林被一分为二，面包桥是西柏林唯一的生命线。"
 LOADING_TIP_3:0 "美国内战在俄亥俄河停火线上凝固而未终结。朗的美国、工团和萨克拉门托的宪政政府都自称合众国。"
 LOADING_TIP_4:0 "周恩来领导国民党左派重建了一个满目疮痍的中国。南京政府在中苏边界上守卫着东方的平衡。"
 LOADING_TIP_5:0 "温莎王室与协约国的遗老在澳大利亚的流亡朝廷中等待着翻盘的机会。"
 LOADING_TIP_6:0 "国民法国、中非帝国与奥斯曼帝国的崩溃留下了一片权力真空。新独立的国家在两大阵营之间寻找自己的位置。"
 LOADING_TIP_7:0 "王公的印度、施莱歇尔的德意志民族共和国、东欧的军人政权——莫斯科协定是一个由利益而非意识形态维系的联盟。"
 LOADING_TIP_8:0 "1949年5月，两个世界在铁丝网两侧对视。和平只是下一场战争的间歇。"
 LOADING_TIP_9:0 "第三国际的清算联盟用劳动单位取代了黄金。公社国家的工人们相信：未来不属于资本，而属于劳动。"
 LOADING_TIP_10:0 "萨文科夫的俄罗斯不输出革命，只输出坦克和秩序。对许多新独立的国家来说，这就够了。"
 LOADING_TIP_11:0 "1950年代的柏林危机、1960年代的五大湖导弹危机——每一次，世界都站在深渊边缘。"
 LOADING_TIP_12:0 "休伊·朗与萨文科夫都已年迈。谁将继承他们的权力？继承者会延续铁腕，还是打开解冻的窗口？"
 LOADING_TIP_13:0 "西藏叛乱、印度的王公危机、日本的民主化——亚洲的冷战从不平静。"
 LOADING_TIP_14:0 "刚果的铜矿、巴勒斯坦的《雅法协定》、埃及的自由军官——新世界的每一寸土地都是两大阵营的角力场。"
 LOADING_TIP_15:0 "赤旗与黑鹰，谁将主宰人类的未来？"
