l_simp_chinese:
# krcw: years paced
 krcw_chi_land_law_radical:0 "耕者有其田"
 krcw_chi_land_law_radical_desc:0 "一九五〇年土地法把地主的超额田地以赎买债券收归县土地委员会，再按人口分给佃农与雇农。乡村第一次感到革命不只是城里人的口号。"
 krcw_chi_land_law_moderate:0 "减租保佃"
 krcw_chi_land_law_moderate_desc:0 "温和派的版本：租额一律减至三成七五，佃权受法律保护，但土地本身仍归原主。地主松了口气，农会却在暗中不满。"
 krcw_chi_peasant_associations_sp:0 "农会与合作社"
 krcw_chi_peasant_associations_sp_desc:0 "县乡农会不仅分田，也办信用社、种子站和夜校。邓演达当年在龙岩写下的“农工政策”，终于落在了全国的田埂上。"
 krcw_chi_five_year_programme:0 "第一个五年建设纲要"
 krcw_chi_five_year_programme_desc:0 "国家建设委员会与各产业联合会共同拟定的纲要：不是一纸指令，而是一张由工厂委员会、省建设厅与巴黎技术代表团反复讨价还价的清单。"
 krcw_chi_second_programme_sp:0 "第二个五年建设纲要"
 krcw_chi_second_programme_sp_desc:0 "第二个纲要把重点从钢铁与铁路转向电力、化工与技术教育。计划的语言也变了：“协作”代替了“指标”。"
 krcw_chi_three_principles_coops_sp:0 "三民主义与合作社"
 krcw_chi_three_principles_coops_sp_desc:0 "民族、民权、民生：改组派把孙中山的遗训重新解释为合作社经济与基层民主的纲领。土地归农会，工厂归产业联合会，县乡由人民会议自治，党在上面领导。"
 krcw_chi_party_struggle:0 "党内路线之争"
 krcw_chi_party_struggle_desc:0 "革命委员会派与顾孟余的温和派在中央执行委员会里针锋相对。每一次表决都像一次小型的战役。"
 krcw_chi_moderate_coalition:0 "温和派联合政府"
 krcw_chi_moderate_coalition_desc:0 "顾孟余的温和派取得了中央执行委员会的多数。改革会继续，但会慢一些、更体面一些，也更照顾城市资本与乡绅。"
 krcw_chi_revcom_ascendant:0 "革命委员会当政"
 krcw_chi_revcom_ascendant_desc:0 "周恩来的革命委员会派掌握了党、政、军的主要职位。南京的节奏快了起来，但反对者的沉默也更深了。"
 krcw_chi_clean_government:0 "整饬官箴"
 krcw_chi_clean_government_desc:0 "监察院的巡回检查团下到县城，查账、听诉、撤职。旧官场的规矩在一点一点瓦解。"
 krcw_chi_peoples_councils:0 "县乡人民会议"
 krcw_chi_peoples_councils_desc:0 "由农会、工会与合作社推选的县乡人民会议开始审议预算。这是周恩来口中的“训政走向宪政”的第一步。"
 krcw_chi_mass_literacy_sp:0 "平民识字运动"
 krcw_chi_mass_literacy_sp_desc:0 "夜校、识字班、流动图书车。晏阳初当年在定县的实验，如今由国家推向四万万人。"
 krcw_chi_warlord_buyout:0 "赎买地方实力派"
 krcw_chi_warlord_buyout_desc:0 "南京以养老金、荣誉职位与企业股份换取地方军头交出私兵与税源。这很昂贵，但比打仗便宜。"
 krcw_chi_warlord_crackdown:0 "以兵削藩"
 krcw_chi_warlord_crackdown_desc:0 "中央军开进了地方实力派的防区。这是一场没有宣战的内战，每一次缴械都可能擦枪走火。"
 krcw_chi_unified_command_sp:0 "军政统一"
 krcw_chi_unified_command_sp_desc:0 "最后一支挂着地方番号的部队已经整编完毕。国民革命军第一次真正成为一支国家的军队。"
 krcw_chi_french_advisors:0 "公社军事顾问团"
 krcw_chi_french_advisors_desc:0 "来自巴黎的军事顾问团在南京、武汉和沈阳开设参谋课程。他们带来了机械化战争的经验，也带来了对民兵传统的不以为然。"
 krcw_chi_modern_nra_sp:0 "现代化国民革命军"
 krcw_chi_modern_nra_sp_desc:0 "辽西会战的老兵如今开着卡车、指挥着炮兵营。国民革命军完成了从步兵军队到合成军队的蜕变。"
 krcw_chi_republican_navy_sp:0 "民国海军"
 krcw_chi_republican_navy_sp_desc:0 "陈绍宽的海军从江防舰队起步，第一次开始规划远洋的舰队。江南造船所的船台昼夜不停。"
 krcw_chi_strait_tension:0 "海峡紧张"
 krcw_chi_strait_tension_desc:0 "台湾海峡两岸的炮口与雷达互相对准。福建沿海的渔民知道，一艘巡逻艇就足以点燃一场战争。"
 krcw_chi_strait_status_quo:0 "海峡现状"
 krcw_chi_strait_status_quo_desc:0 "南京宣布：台湾人民的前途应由台湾人民自己决定。在那一天到来之前，民国海军只守不攻。"
 krcw_chi_paris_clearing_union:0 "巴黎清算联盟成员"
 krcw_chi_paris_clearing_union_desc:0 "通过巴黎清算联盟，汉口的纱厂可以用工团法郎结算英国的机床、意大利的电机和加拿大的小麦。中国从此接入了一个劳工的世界市场。"
 krcw_chi_transnational_federations_sp:0 "跨国产业联合会"
 krcw_chi_transnational_federations_sp_desc:0 "武汉钢铁联合会加入了国际冶金联合会亚洲分会，工程师和工人代表在里昂、曼彻斯特与鞍山之间轮换。"
 krcw_chi_lhasa_guarantee:0 "恪守拉萨协定"
 krcw_chi_lhasa_guarantee_desc:0 "南京重申：西藏现行制度不变，噶厦的权力不变，任何改革须待西藏人民自愿。这让拉萨的贵族少了一个造反的理由。"
 krcw_chi_tibet_reform_drive:0 "推动西藏改革"
 krcw_chi_tibet_reform_drive_desc:0 "南京派出工作队，试图在西藏推行减租与学校。贵族们把这看作《拉萨协定》的死刑判决书。"
 krcw_chi_himalayan_defense_sp:0 "喜马拉雅防务"
 krcw_chi_himalayan_defense_sp_desc:0 "从阿里到察隅的山口都部署了哨所。印度联邦的王公们知道，翻过雪山并不容易。"
 krcw_chi_asian_detente_sp:0 "亚洲缓和"
 krcw_chi_asian_detente_sp_desc:0 "南京、东京与新德里之间开通了第一条外交热线。前线仍然布满铁丝网，但人们开始谈论“共存”。"
 krcw_chi_republic_consolidated:0 "革命尚未成功，同志仍须努力"
 krcw_chi_republic_consolidated_desc:0 "土地法、建设纲要、军政统一与县乡会议——孙中山遗嘱里的那句话，被周恩来刻在了南京新国会的门楣上。"
 krcw_kor_land_reform_sp:0 "朝鲜土地改革"
 krcw_kor_land_reform_sp_desc:0 "日本殖民地时代的东洋拓殖会社土地被没收分配，朝鲜农民第一次拥有自己的水田。"
 krcw_kor_national_army_sp:0 "朝鲜国民军"
 krcw_kor_national_army_sp_desc:0 "朝鲜义勇队的老兵构成了国民军的骨干，军官多出身黄埔。"
 krcw_kor_own_line_sp:0 "朝鲜自主路线"
 krcw_kor_own_line_sp_desc:0 "汉城开始强调：朝鲜民国是兄弟，而非附庸。"
 krcw_kor_reconstruction_sp:0 "三年复兴计划"
 krcw_kor_reconstruction_sp_desc:0 "兴南的化肥厂、水丰的电站和京釜铁路是复兴计划的三根支柱。"
 krcw_vin_national_front_sp:0 "越南民族统一战线"
 krcw_vin_national_front_sp_desc:0 "阮安宁把革命同盟会、佛教团体、高台教徒与南方的工会拉进了同一个战线。"
 krcw_vin_rice_cooperatives_sp:0 "稻米合作社"
 krcw_vin_rice_cooperatives_sp_desc:0 "湄公河三角洲的佃农以合作社收回了法国人留下的种植园稻田。"
 krcw_vin_peoples_army_sp:0 "武元甲的人民军"
 krcw_vin_peoples_army_sp_desc:0 "武元甲坚信：越南的战争必须靠越南人自己的办法打。"
 krcw_vin_equal_partner_sp:0 "平等的伙伴"
 krcw_vin_equal_partner_sp_desc:0 "河内与南京签订了新条约：顾问团撤出部委，军事合作改为联合委员会。"
 krcw_br_chinese_advisors_sp:0 "中国顾问团"
 krcw_br_chinese_advisors_sp_desc:0 "来自南京的工程师、教员与军官帮助新生的民国建立政府。他们不可或缺，也时常惹人不满。"
 krcw_br_traditional_compromise:0 "与传统和解"
 krcw_br_traditional_compromise_desc:0 "寺院、王室与土司被纳入新秩序：他们失去了特权，但保留了尊严。"
 krcw_br_self_reliance_sp:0 "自力更生"
 krcw_br_self_reliance_sp_desc:0 "民国已能自行运转政府与军队。与南京的关系从监护变为同盟。"
 CHI_krcw_chen_gongbo:0 "陈公博"
 CHI_krcw_gu_mengyu:0 "顾孟余"
 CHI_krcw_song_qingling:0 "宋庆龄"
 CHI_krcw_li_jishen:0 "李济深"
 CHI_krcw_deng_yanda:0 "邓演达"
 CHI_krcw_chen_gongbo_desc:0 "改组同志会激进派的领袖和首席理论家。一九四六年他带着激进派支持周恩来，现任中执委常务委员兼建设委员会委员长，主持起草第一个五年纲要。"
 CHI_krcw_gu_mengyu_desc:0 "改组同志会温和派的领袖，北京大学出身的经济学家。一九四六年在党内竞争中输给了周恩来，但仍是城市商会、知识界与地方士绅最信任的人。"
 krcw_chi_sixth_congress:0 "南京第六次全国代表大会"
 krcw_chi_sixth_congress_desc:0 "一九四九年春，国民党改组派在南京召开第六次全国代表大会。北伐已经结束，土地、工业、军队和党本身都需要重建。"
 krcw_chi_draft_land_law:0 "起草土地法"
 krcw_chi_draft_land_law_desc:0 "“耕者有其田”写进党纲已有二十五年。现在，立法院的土地委员会必须回答一个具体的问题：田从哪里来，给谁，用什么补偿？"
 krcw_chi_county_land_committees:0 "县土地委员会"
 krcw_chi_county_land_committees_desc:0 "土地法的成败不在南京，而在两千个县城。每个县都要成立由农会代表、县政府与技术员组成的土地委员会，丈量田亩、登记地契、审理纠纷。"
 krcw_chi_peasant_associations:0 "农会与合作社"
 krcw_chi_peasant_associations_desc:0 "分到了田的农民还需要种子、耕牛和贷款。农会把互助组升格为合作社，邓演达的“平民革命”理论终于有了血肉。"
 krcw_chi_rural_credit:0 "农村信用合作社"
 krcw_chi_rural_credit_desc:0 "高利贷曾是乡村最坚固的锁链。县信用社以低息贷款取代钱庄，农民第一次可以借钱买化肥，而不必把女儿押给地主。"
 krcw_chi_mass_literacy:0 "平民识字运动"
 krcw_chi_mass_literacy_desc:0 "农会夜校的黑板上写着同一句话：“识字就是翻身。”数以万计的大学生、小学教员与退伍军人下乡教书。"
 krcw_chi_harness_the_huai:0 "根治淮河"
 krcw_chi_harness_the_huai_desc:0 "淮河十年九灾。水利工程师、农会民工与法国水利顾问共同规划了治淮工程：水库、分洪道与新的灌渠。"
 krcw_chi_construction_commission:0 "国家建设委员会"
 krcw_chi_construction_commission_desc:0 "孙中山在《建国方略》里描绘了十万英里铁路与东方大港。国家建设委员会要把那些蓝图变成可以施工的图纸。"
 krcw_chi_first_programme:0 "第一个五年建设纲要"
 krcw_chi_first_programme_desc:0 "第一个五年纲要从一九五〇年开始，重点是钢铁、煤炭、铁路和电力，指标由国家、省建设厅和各产业联合会协商确定。"
 krcw_chi_anshan_steel:0 "鞍山钢铁联合企业"
 krcw_chi_anshan_steel_desc:0 "日本人留下的高炉被炸毁了一半。鞍钢的工人委员会与技术员在废墟上重建了中国的第一个钢铁联合企业。"
 krcw_chi_trunk_railways:0 "制定干线铁路计划"
 krcw_chi_trunk_railways_desc:0 "铁道部拟定全国干线铁路计划：先给京汉、津浦两条旧干线铺复线，再向西南和西北修新线。筑路的钢轨要和鞍钢的其他用户抢。"
 krcw_chi_wuhan_base:0 "武汉工业基地"
 krcw_chi_wuhan_base_desc:0 "武汉三镇位于中国的心脏。汉阳兵工厂、武昌机械厂与新建的长江大桥使它成为内陆工业的枢纽。"
 krcw_chi_yangtze_power:0 "长江电力"
 krcw_chi_yangtze_power_desc:0 "电力是一切建设的前提。重庆、宜昌与上海的新电厂让工厂可以在夜里继续运转。"
 krcw_chi_join_clearing_union:0 "加入巴黎清算联盟"
 krcw_chi_join_clearing_union_desc:0 "巴黎清算联盟让工团国家之间不必再用美元或黄金结算。加入它，意味着中国的丝绸、桐油和钨砂可以直接换回欧洲的机床与专利。"
 krcw_chi_transnational_federations:0 "跨国产业联合会"
 krcw_chi_transnational_federations_desc:0 "武汉钢铁、上海纺织与抚顺煤矿的工会加入了国际产业联合会。技术不再是秘密，而是工人之间交换的礼物。"
 krcw_chi_second_programme:0 "第二个五年建设纲要"
 krcw_chi_second_programme_desc:0 "第一个纲要超额完成了钢铁指标，却让轻工业与农村电力落在后面。第二个纲要要纠正这种偏差。"
 krcw_chi_technical_universities:0 "技术大学与研究院"
 krcw_chi_technical_universities_desc:0 "清华、交大与新建的武汉工学院每年培养数万名工程师；中央研究院与法兰西公社科学院建立了交换制度。"
 krcw_chi_atomic_research:0 "原子能研究所"
 krcw_chi_atomic_research_desc:0 "一九五〇年法国的原子弹震动了世界。南京请求巴黎协助建立原子能研究所——为了发电，也为了不被人用原子弹要挟。"
 krcw_chi_line_struggle:0 "路线之争"
 krcw_chi_line_struggle_desc:0 "革命委员会派和陈公博的激进派要求加快土地改革与工业化，顾孟余的温和派则主张“先稳后进”。一九四六年的党内竞争没有真正结束，它只是转入了中央执行委员会的会议室。"
 krcw_chi_revcom_line:0 "革命委员会路线"
 krcw_chi_revcom_line_desc:0 "周恩来的革命委员会路线胜出：土地法要彻底，建设要快，党要扎根群众。陈公博的建设委员会拿到了纲要的主导权，顾孟余仍保留政府职位，以维持党的团结。"
 krcw_chi_moderate_line:0 "温和派联合路线"
 krcw_chi_moderate_line_desc:0 "周恩来向温和派让步：顾孟余出任行政院长，改革的节奏交由立法院裁定。城市商会欢呼，农会的代表却在走廊里叹气。"
 krcw_chi_control_yuan:0 "监察院巡回检查"
 krcw_chi_control_yuan_desc:0 "孙中山五权宪法中的监察权，终于长出了牙齿。巡回检查团有权查封县府账簿，当场撤换贪污的县长。"
 krcw_chi_three_principles_coops:0 "三民主义与合作社"
 krcw_chi_three_principles_coops_desc:0 "改组派的理论家们为三民主义写下新的注解：民族是反帝与各民族平等，民权是县乡会议与工会自治，民生是合作社与协作计划。"
 krcw_chi_youth_league:0 "三民主义青年团改组"
 krcw_chi_youth_league_desc:0 "青年团不再是党的仪仗队，而是下乡识字、进厂办夜校的突击队。它也是未来干部的摇篮。"
 krcw_chi_county_councils:0 "县乡人民会议"
 krcw_chi_county_councils_desc:0 "周恩来宣布结束县一级的训政：各县由农会、工会与合作社推选人民会议，审议县预算与县长任免。革命委员会派的老干部担心县政会被乡绅重新把持。"
 krcw_chi_emergency_powers:0 "非常时期条例"
 krcw_chi_emergency_powers_desc:0 "内有军阀，外有强敌——党内强硬派主张无限期延长训政，由中央执行委员会以条例治国。秩序会有的，自由则要等一等。"
 krcw_chi_revolution_carries_on:0 "革命尚未成功"
 krcw_chi_revolution_carries_on_desc:0 "土地已经分配，第一个纲要的钢厂已经投产，军队已经统一。中执委宣布建国的第一阶段完成，工作重心转向巩固政权和对外防务。"
 krcw_chi_ti_crisis_down3_tt:0 "国际阵营危机度 §G-3§!"
 krcw_chi_ti_crisis_down2_tt:0 "国际阵营危机度 §G-2§!"
 krcw_chi_warlord_question:0 "处置地方实力派"
 krcw_chi_warlord_question_desc:0 "阎锡山、白崇禧、胡宗南……北伐中归顺的将领们仍掌握着自己的军队与税源。国家要统一，这些“国中之国”就必须消失。问题是：用金子，还是用枪？"
 krcw_chi_buy_out_strongmen:0 "赎买与安置"
 krcw_chi_buy_out_strongmen_desc:0 "给他们养老金、名誉职位、企业股份与体面的退场。代价高昂，但每一个交出兵权的将军都是一场避免了的内战。"
 krcw_chi_break_strongmen:0 "以兵削藩"
 krcw_chi_break_strongmen_desc:0 "中央军与法国顾问训练的机械化师开进地方防区，限期缴械。那些拒绝的人将被视为叛军。"
 krcw_chi_reorganize_provincial_armies:0 "整编地方部队"
 krcw_chi_reorganize_provincial_armies_desc:0 "地方部队被拆散、整编、换上统一的番号与军饷。老兵可以选择留下或者复员领田。"
 krcw_chi_unified_command:0 "军政统一"
 krcw_chi_unified_command_desc:0 "当最后一个地方实力派交出印信，军事委员会宣布：从今天起，中国只有一支军队。"
 krcw_chi_army_reform:0 "国民革命军改制"
 krcw_chi_army_reform_desc:0 "国民革命军是一支在战争中长大的军队：勇敢、老练，却装备杂乱、编制臃肿。叶挺与薛岳主持的改制委员会要为它开出药方。"
 krcw_chi_whampoa_reborn:0 "新黄埔"
 krcw_chi_whampoa_reborn_desc:0 "黄埔军校迁到南京紫金山下，课程表上既有参谋业务，也有三民主义与农会工作。“枪杆子要听党的，党要听人民的。”"
 krcw_chi_commune_military_mission:0 "公社军事顾问团"
 krcw_chi_commune_military_mission_desc:0 "巴黎派来了以约瑟夫·普茨的门生为首的军事顾问团。他们带来了莱茵河战役的经验，也带来了法式的坦克与卡车图纸。"
 krcw_chi_arsenals:0 "统一兵工标准"
 krcw_chi_arsenals_desc:0 "汉阳、巩县、沈阳、太原的兵工厂各造各的枪。现在它们要统一口径、统一图纸、统一零件。"
 krcw_chi_mechanized_corps:0 "机械化军"
 krcw_chi_mechanized_corps_desc:0 "辽西会战证明了一件事：谁拥有卡车，谁就拥有华北平原。第一机械化军在徐州组建。"
 krcw_chi_republican_air_force:0 "民国空军"
 krcw_chi_republican_air_force_desc:0 "笕桥航校扩建，南昌的飞机制造厂开始仿制法国喷气式战斗机。"
 krcw_chi_modern_nra:0 "现代化国民革命军"
 krcw_chi_modern_nra_desc:0 "改制完成：步兵师精简了三分之一，每个军都有了自己的炮兵与汽车团。辽西的老兵们成了新军队的教官。"
 krcw_chi_republican_navy:0 "重建民国海军"
 krcw_chi_republican_navy_desc:0 "一九四四年的青岛停战协定之所以把台湾留给日本，只因为国民革命军无力渡海。陈绍宽发誓，这样的耻辱不会再有第二次。"
 krcw_chi_jiangnan_yard:0 "扩建江南造船所"
 krcw_chi_jiangnan_yard_desc:0 "上海江南造船所、福州马尾船政与青岛船厂同时扩建。中国第一次能自己建造驱逐舰。"
 krcw_chi_strait_patrols:0 "海峡巡逻"
 krcw_chi_strait_patrols_desc:0 "福建舰队开始在台湾海峡中线巡逻。每一次与日本巡逻艇的遭遇，都是一场神经的较量。"
 krcw_chi_blue_water:0 "远洋舰队计划"
 krcw_chi_blue_water_desc:0 "以英国联邦海军为师，民国海军规划巡洋舰与护航舰队。它的任务不仅是台湾，还有南海的航线。"
 krcw_chi_taiwan_self_determination:0 "联络台湾地下组织"
 krcw_chi_taiwan_self_determination_desc:0 "南京与台湾文化协会和民众党中主张武装抗日的一派建立联系，提供经费和电台。一旦开战，他们可以在岛内破坏交通、传递情报。协会里的温和派担心这会断送向东京请愿自治的路。"
 krcw_chi_taiwan_support_15_tt:0 "台湾地下组织力量 §G+15§!"
 krcw_chi_prepare_liberation:0 "准备解放台湾"
 krcw_chi_prepare_liberation_desc:0 "陆战队在福建沿海演练登陆，参谋部拟定了代号“澎湖”的作战计划。东京已经察觉，莫斯科也在注视。"
 krcw_chi_operation_penghu:0 "批准澎湖作战计划"
 krcw_chi_operation_penghu_desc:0 "军事委员会批准渡海作战计划：先夺取澎湖列岛作为跳板，再在台湾西岸登陆。部队、船只和机场都已就位，开战的时间由国务会议决定。"
 krcw_chi_taiwan_ready_tt:0 "解锁决议§Y渡海收复台湾§!。"
 krcw_chi_paris_delegation:0 "赴巴黎代表团"
 krcw_chi_paris_delegation_desc:0 "汪精卫当年流亡巴黎的旧友，如今都是公社的部长与联合会主席。南京派出由宋庆龄率领的代表团，去谈贷款、技术与第三国际中的发言权。"
 krcw_chi_asian_bureau:0 "第三国际亚洲局"
 krcw_chi_asian_bureau_desc:0 "南京要求在第三国际执行局中设立亚洲局，由中国主持。巴黎同意了——条件是亚洲局必须对所有成员开放。"
 krcw_chi_scientific_exchange:0 "中法科学交流"
 krcw_chi_scientific_exchange_desc:0 "每年一千名中国学生赴法留学，数百名法国教授在南京、北平与武汉讲学。“勤工俭学”的传统以另一种方式复活了。"
 krcw_chi_asian_detente:0 "设立亚洲局联合情报处"
 krcw_chi_asian_detente_desc:0 "亚洲局在南京设立联合情报处，中国与各兄弟民国的情报机关共享俄国和日本特务的名单，协同抓捕。巴黎要求看到全部名单，南京只给摘要。"
 krcw_chi_ti_crisis_down4_tt:0 "国际阵营危机度 §G-4§!"
 krcw_chi_brother_republics:0 "兄弟民国会议"
 krcw_chi_brother_republics_desc:0 "朝鲜、越南、高棉、寮国与缅甸的代表齐聚南京。他们感谢中国的援助，也都想知道：兄弟之间，究竟谁说了算？"
 krcw_chi_korean_alliance:0 "中朝同盟条约"
 krcw_chi_korean_alliance_desc:0 "金元凤与周恩来是黄埔的老同学。新条约规定两国军队联合训练、共同防御日本。"
 krcw_chi_equal_treaties:0 "平等条约"
 krcw_chi_equal_treaties_desc:0 "孙中山一生都在反对不平等条约。中华民国不能对自己的兄弟重复列强的做法。南京撤回部委中的顾问，扩大各民国的自治权。"
 krcw_chi_guided_republics:0 "扩大顾问团"
 krcw_chi_guided_republics_desc:0 "强硬派认为，年轻的民国还太脆弱，没有中国的监护就会被日本或印度吞掉。顾问团将留下，并且扩大。"
 krcw_chi_asian_development_fund:0 "亚洲开发基金"
 krcw_chi_asian_development_fund_desc:0 "南京、河内与汉城共同出资，在湄公河、伊洛瓦底江与鸭绿江上修电站与公路。援助变成了投资，投资变成了共同的利益。"
 krcw_chi_tibet_policy:0 "西藏政策"
 krcw_chi_tibet_policy_desc:0 "一九四七年的《拉萨协定》承认噶厦的高度自治。印度联邦与俄罗斯的特务在拉萨的贵族间出入。南京必须决定：是恪守协定，还是推动改革？"
 krcw_chi_honor_lhasa:0 "恪守拉萨协定"
 krcw_chi_honor_lhasa_desc:0 "南京重申：西藏的现行制度不变。中央在拉萨只派驻代表，不派驻工作队。改革要等西藏人自己提出。"
 krcw_chi_reform_tibet:0 "推动西藏改革"
 krcw_chi_reform_tibet_desc:0 "农奴制与封建差役不应存在于一个革命共和国之中。南京派出工作队，开办学校与诊所，推动减租——无论噶厦是否同意。"
 krcw_chi_himalayan_defense:0 "喜马拉雅防务"
 krcw_chi_himalayan_defense_desc:0 "在西康与青海修筑公路与兵站，训练山地部队。万一拉萨有变，援军要能在两周内抵达。"
 krcw_chi_tibet_settlement:0 "与拉萨订立新约"
 krcw_chi_tibet_settlement_desc:0 "无论叛乱是否发生、如何收场，南京与拉萨都需要一份新的约定：扩大的自治、不变的制度，以及一条不会被外人撬开的边界。"
 krcw_chi_revolt_down_tt:0 "西藏叛乱进度 §G-10§!"
 krcw_chi_revolt_up_tt:0 "西藏叛乱进度 §R+20§!"
 krcw_brother_more_autonomy:0 "走向自主"
 krcw_brother_closer_ties:0 "更紧密的兄弟关系"
 krcw_kor_republic_restored:0 "巩固朝鲜民国"
 krcw_kor_republic_restored_desc:0 "三十五年的殖民统治结束才五年。汉城的国会大厦曾是朝鲜总督府，如今门前飘着太极旗。金元凤的民族革命党要证明：独立的朝鲜能比殖民地活得更好。"
 krcw_kor_land_reform:0 "没收东拓土地"
 krcw_kor_land_reform_desc:0 "东洋拓殖会社和日本地主留下的土地占全国耕地的四成。国会通过法案，把它们无偿分给耕种者。"
 krcw_kor_reconstruction:0 "三年复兴计划"
 krcw_kor_reconstruction_desc:0 "兴南化肥厂、水丰水电站、京釜铁路——殖民时代的工业骨架被日本人撤退时破坏，如今要由朝鲜人自己修复。"
 krcw_kor_hungnam:0 "兴南工业区"
 krcw_kor_hungnam_desc:0 "兴南的化工厂恢复生产，化肥源源不断运往南方的稻田。"
 krcw_kor_gyeongbu:0 "京釜铁路复线"
 krcw_kor_gyeongbu_desc:0 "从釜山到汉城、再到新义州，铁路是朝鲜半岛的脊梁。"
 krcw_kor_busan_yards:0 "釜山船厂"
 krcw_kor_busan_yards_desc:0 "釜山港的船台开始为民国海军和渔业合作社建造船只。"
 krcw_kor_national_army:0 "朝鲜国民军"
 krcw_kor_national_army_desc:0 "朝鲜义勇队、光复军与各地游击队合编为国民军。池青天与金武亭分任参谋长与副总司令。"
 krcw_kor_whampoa_officers:0 "黄埔军官团"
 krcw_kor_whampoa_officers_desc:0 "国民军的许多军官毕业于黄埔。南京派来新一批教官，帮助建立汉城陆军士官学校。"
 krcw_kor_coastal_defense:0 "东海岸防御"
 krcw_kor_coastal_defense_desc:0 "日本就在对马海峡对岸。釜山与元山的海岸炮台必须重修。"
 krcw_kor_joint_command:0 "中朝联合司令部"
 krcw_kor_joint_command_desc:0 "两国军队在鸭绿江两岸举行联合演习，建立共同的指挥与通信体系。"
 krcw_kor_line_question:0 "汉城与南京"
 krcw_kor_line_question_desc:0 "朝鲜对中国感激不尽，但它毕竟是一个经历过亡国之痛的民族。有人主张与南京同呼吸共命运，也有人提醒：“兄长”这个词里，本就藏着等级。"
 krcw_kor_brotherhood:0 "兄弟同心"
 krcw_kor_brotherhood_desc:0 "金元凤选择与南京同进退：朝鲜将是第三国际在东北亚最坚定的一员。"
 krcw_kor_own_line:0 "朝鲜自主路线"
 krcw_kor_own_line_desc:0 "朝鲜是兄弟，而非附庸。汉城要求与南京签订新的平等条约，并在第三国际中拥有独立的一票。"
 krcw_kor_national_assembly:0 "国会选举"
 krcw_kor_national_assembly_desc:0 "民族革命党、韩国独立党与各地农民组合同场竞选。这是朝鲜人第一次在自己的土地上投票。"
 krcw_kor_hangul_schools:0 "韩文学校"
 krcw_kor_hangul_schools_desc:0 "殖民时代被禁止的韩文重新成为课堂语言。全国扫盲在五年内完成。"
 krcw_kor_japan_question:0 "制定对日方针"
 krcw_kor_japan_question_desc:0 "东京的复仇派公开要求收回朝鲜，日本陆军每年都在对马岛演练登陆。国会决定把对日防务列为第一要务，预算优先给陆军和海岸防御。"
 krcw_kor_straits_treaty:0 "制定半岛防御计划"
 krcw_kor_straits_treaty_desc:0 "参谋本部判断日军会在釜山和仁川同时登陆，计划先守住洛东江和汉江两道防线，等待中国援军。池青天要求扩编陆军，财政部说钱只够修工事。"
 krcw_kor_seoul_industry:0 "汉城工业带"
 krcw_kor_seoul_industry_desc:0 "汉江两岸的纺织、机械与电子工厂，让汉城成为东北亚工团经济的一颗新星。"
 krcw_kor_asian_bureau:0 "出任亚洲局副主席"
 krcw_kor_asian_bureau_desc:0 "朝鲜代表在第三国际亚洲局中担任副主席。汉城成了南京与巴黎之间的一座桥梁。"
 krcw_kor_republic_at_ten:0 "庆祝建国十五周年"
 krcw_kor_republic_at_ten_desc:0 "十五年过去了。朝鲜民国有了自己的工业、军队与议会。它可以挺直腰杆，与任何人平等对话。"
 krcw_vin_our_revolution:0 "走越南自己的路"
 krcw_vin_our_revolution_desc:0 "越南人从法国人手中夺回了国家，中国志愿军帮了大忙——但阮安宁总是提醒同志们：打下河内的是越南人。越南的革命，要走越南的路。"
 krcw_vin_national_front:0 "民族统一战线"
 krcw_vin_national_front_desc:0 "革命同盟会、佛教团体、高台教、和好教与南方工会——阮安宁要把它们全都拉进一个战线。"
 krcw_vin_rice_cooperatives:0 "稻米合作社"
 krcw_vin_rice_cooperatives_desc:0 "法国种植园主留下的稻田由佃农合作社接管，西贡的米商不再能决定农民的饥饱。"
 krcw_vin_three_regions:0 "统一行政区划"
 krcw_vin_three_regions_desc:0 "法国人把越南切成三块统治。新宪法要让三圻真正成为一个国家，同时照顾南方的特殊性。"
 krcw_vin_haiphong:0 "海防港"
 krcw_vin_haiphong_desc:0 "海防港是越南通向世界的大门，巴黎清算联盟的商船在这里卸下机床。"
 krcw_vin_hanoi_saigon_rail:0 "统一铁路"
 krcw_vin_hanoi_saigon_rail_desc:0 "从河内到西贡的铁路全线贯通，三圻终于连在一起。"
 krcw_vin_industry:0 "由工人委员会接管工厂"
 krcw_vin_industry_desc:0 "南定纺织厂与西贡的机械厂由工人委员会接管，产量两年翻了一番。"
 krcw_vin_peoples_army:0 "组建人民军"
 krcw_vin_peoples_army_desc:0 "武元甲不相信照搬的战法。越南的军队要在丛林与山地里打仗，要依靠民兵和百姓。"
 krcw_vin_jungle_doctrine:0 "丛林战术"
 krcw_vin_jungle_doctrine_desc:0 "越北根据地时代的经验被写进了新的步兵条令。"
 krcw_vin_militia:0 "乡村民兵"
 krcw_vin_militia_desc:0 "每个村子都有自己的自卫队。它们既是军队的后备，也是革命的眼睛。"
 krcw_vin_hanoi_nanjing:0 "河内与南京"
 krcw_vin_hanoi_nanjing_desc:0 "中国顾问依然坐在河内的各个部委里。有人感激，有人不满：越南打败了法国人，难道是为了换一个新的“保护者”？"
 krcw_vin_equal_partner:0 "与南京重订条约"
 krcw_vin_equal_partner_desc:0 "阮安宁与南京谈判新条约：顾问撤出部委，合作改由联合委员会进行。越南仍在第三国际之中——作为平等的一员。"
 krcw_vin_closer_to_nanjing:0 "依靠南京"
 krcw_vin_closer_to_nanjing_desc:0 "同盟会中的亲华派认为，没有中国的援助，越南撑不过下一场战争。"
 krcw_vin_constitution:0 "越南民国宪法"
 krcw_vin_constitution_desc:0 "国民大会通过了宪法：三圻平等、宗教自由、合作社经济与普选的国会。"
 krcw_vin_buddhist_dialogue:0 "与佛教界对话"
 krcw_vin_buddhist_dialogue_desc:0 "顺化的高僧们担心世俗革命会冲击寺院。政府与佛教总会达成协议：土地改革不涉寺产，僧人可参政。"
 krcw_vin_indochina_federation:0 "印度支那协作会议"
 krcw_vin_indochina_federation_desc:0 "倡议越南、高棉、寮国建立协作会议，共同开发湄公河。"
 krcw_vin_mekong:0 "湄公河开发"
 krcw_vin_mekong_desc:0 "三角洲的灌渠与堤坝工程让稻米产量翻番，越南成为亚洲的粮仓之一。"
 krcw_vin_giap_academy:0 "大叻军事学院"
 krcw_vin_giap_academy_desc:0 "法国殖民军的旧军校被改造成人民军的指挥学院。"
 krcw_vin_independent_voice:0 "在大会上独立投票"
 krcw_vin_independent_voice_desc:0 "越南在第三国际大会上投出与南京不同的一票。巴黎惊讶，南京不快，河内却觉得扬眉吐气。"
 krcw_vin_republic_matures:0 "确立平等的对华关系"
 krcw_vin_republic_matures_desc:0 "越南民国已能自己决定自己的道路。与中国的友谊，从此建立在平等之上。"
 krcw_vin_giap_offensive_doctrine:0 "运动战条令"
 krcw_vin_giap_offensive_doctrine_desc:0 "武元甲在大叻讲授他的“运动战”理论：集中、机动、以快制慢。"
 krcw_br_liberated:0 "组建民国政府"
 krcw_br_liberated_desc:0 "中国志愿军与本地的独立战士一起推翻了殖民政权。现在，一个从未有过现代国家机器的民族，要在几年之内建起一个政府。"
 krcw_br_constituent_assembly:0 "制宪会议"
 krcw_br_constituent_assembly_desc:0 "来自各地、各族的代表齐聚首都，起草第一部宪法。"
 krcw_br_chinese_advisors:0 "中国顾问团"
 krcw_br_chinese_advisors_desc:0 "南京派来工程师、教员和军官，帮助组建部委、学校与军队。"
 krcw_br_tradition:0 "与传统和解"
 krcw_br_tradition_desc:0 "王室、寺院与土司曾是殖民者的合作者，也是百姓敬重的对象。新政府不再打倒他们，而是请他们参与宪政。"
 krcw_br_popular_revolution:0 "人民革命"
 krcw_br_popular_revolution_desc:0 "激进派主张一鼓作气：废除王室特权、没收寺产、把土地分给农民。"
 krcw_br_land_reform:0 "土地改革"
 krcw_br_land_reform_desc:0 "殖民地种植园被分配给佃农，合作社开始组建。"
 krcw_br_roads:0 "公路与河运"
 krcw_br_roads_desc:0 "南京援建的公路把首都与边远省份连接起来。"
 krcw_br_first_factories:0 "第一批工厂"
 krcw_br_first_factories_desc:0 "碾米厂、锯木厂、纺织厂——工业化从最朴素的地方开始。"
 krcw_br_national_army:0 "国民军"
 krcw_br_national_army_desc:0 "独立战士与各族武装合编为国民军，由中国教官训练。"
 krcw_br_ethnic_councils:0 "民族议事会"
 krcw_br_ethnic_councils_desc:0 "克伦、掸、苗、老听……各族在自己的地区设立议事会，管理教育与土地。"
 krcw_br_schools:0 "国民学校"
 krcw_br_schools_desc:0 "每个乡都有了一所学校，教母语，也教算术与卫生。"
 krcw_br_border_guard:0 "边境守备"
 krcw_br_border_guard_desc:0 "暹罗、印度联邦与丛林中的残余匪帮都在边境窥伺。"
 krcw_br_self_reliance:0 "自力更生"
 krcw_br_self_reliance_desc:0 "顾问团的使命完成了。民国感谢南京，并请顾问们回家。"
 krcw_br_closer_to_nanjing:0 "紧随南京"
 krcw_br_closer_to_nanjing_desc:0 "边境不稳，经济仍弱。民国决定继续依靠中国的援助与保护。"
 krcw_br_mature_republic:0 "完成国家建设"
 krcw_br_mature_republic_desc:0 "十年前还没有部委、没有学校、没有军队的地方，如今有了一个真正的国家。"
 krcw_br_mekong_irrawaddy:0 "大河开发"
 krcw_br_mekong_irrawaddy_desc:0 "湄公河与伊洛瓦底江上的灌溉与水电工程开始动工，亚洲开发基金出资一半。"
 krcw_kor_broad_front_sp:0 "广泛民族阵线"
 krcw_kor_broad_front_sp_desc:0 "金奎植与吕运亨的中间派把民族革命党、韩独党与农民组合拢在一张桌子上。争吵不断，但没有人被清洗。"
 krcw_kor_hardliners_sp:0 "亲华强硬派"
 krcw_kor_hardliners_sp_desc:0 "金武亭一系的军人认为，朝鲜的生路只有一条：紧紧抓住南京的军装带，把国家建成一座对日本的堡垒。异见者被请出国会。"
 krcw_kor_naval_yards_sp:0 "两洋造船"
 krcw_kor_naval_yards_sp_desc:0 "釜山、元山、镇南浦的船台同时开工。朝鲜不求远洋舰队，只求能守住自己的两片海。"
 krcw_kor_hardline_bloc:0 "亲华强硬派"
 krcw_kor_hardline_bloc_desc:0 "金武亭的军人集团不满于议会的争吵。他们主张：把国家彻底建成对日堡垒，把不同意的人赶出汉城。南京会喜欢一个听话的朝鲜。"
 krcw_kor_the_assembly_convenes:0 "召开全国代表大会"
 krcw_kor_the_assembly_convenes_desc:0 "不论走哪条路，国会都要为它背书。汉城的第一次全国代表大会将决定朝鲜民国的性格——是同志的联盟，是自主的共和国，还是南京的前哨。"
 krcw_kor_coalition_cabinet:0 "联合内阁"
 krcw_kor_coalition_cabinet_desc:0 "广泛阵线的内阁里坐着社会主义者、民族主义者与两位无党派的教授。它议而难决，却让每一派都有了输赢之外的选择。"
 krcw_kor_wonsan_yards:0 "元山与镇南浦船厂"
 krcw_kor_wonsan_yards_desc:0 "东西两岸的船台同时扩建。朝鲜的商船队第一次挂着自己的旗子驶向上海与海防。"
 krcw_kor_electronics:0 "汉江电子"
 krcw_kor_electronics_desc:0 "从收音机到真空管，汉城的新工厂开始生产殖民时代想都不敢想的东西。"
 krcw_kor_coastal_navy:0 "近海舰队"
 krcw_kor_coastal_navy_desc:0 "朝鲜买不起战列舰，但潜艇与鱼雷艇足以让日本的运输船在对马海峡三思。"
 krcw_kor_air_defense:0 "半岛防空"
 krcw_kor_air_defense_desc:0 "汉城与平壤的高射炮团由中国教官训练。日本的轰炸机再不能像三十年代那样如入无人之境。"
 krcw_kor_diaspora:0 "设立侨务委员会"
 krcw_kor_diaspora_desc:0 "中国东北有两百万朝鲜移民。汉城设立侨务委员会，与南京协商他们的国籍、学校与土地——一件微妙的事，因为那是中国的领土。"
 krcw_kor_reparations_demand:0 "向东京索赔"
 krcw_kor_reparations_demand_desc:0 "三十五年的殖民统治留下了一笔血账。在巴黎的支持下，汉城正式向东京提出赔偿与归还文物的要求。"
 krcw_vin_radical_sp:0 "不断革命派"
 krcw_vin_radical_sp_desc:0 "陈文饶一系的托派认为，越南的革命不能停在河内城下。清算地主、镇压宗教势力、把革命输出到暹罗——他们要一场彻底的革命。"
 krcw_vin_southern_autonomy_sp:0 "南圻自治"
 krcw_vin_southern_autonomy_sp_desc:0 "南方的宗教团体、华商与合作社换来了一部承认地方自治的宪法。西贡不再是河内的敌人，也不再完全是河内的属地。"
 krcw_vin_permanent_revolution:0 "不断革命"
 krcw_vin_permanent_revolution_desc:0 "陈文饶的托派不满足于赶走法国人。他们要清算地主、驯服宗教团体、把越南变成东南亚革命的火种——哪怕这会吓坏南京，也惹恼暹罗。"
 krcw_vin_cochinchina_question:0 "确定南圻地位"
 krcw_vin_cochinchina_question_desc:0 "南方是宗教团体、华商与合作社的天下，与河内的革命干部格格不入。是强行统一，还是给南圻一部自治宪章？"
 krcw_vin_hoa_community:0 "与南京商定华侨国籍"
 krcw_vin_hoa_community_desc:0 "西贡的堤岸是东南亚最大的华人城。河内与南京就华侨的国籍与生意反复磋商——这些人既是经济命脉，也是外交难题。"
 krcw_vin_rubber:0 "将橡胶园收归国有"
 krcw_vin_rubber_desc:0 "法国米其林留下的橡胶园收归国有，出口的外汇第一次流进河内的国库而非巴黎的账户。"
 krcw_vin_coal_of_tonkin:0 "鸿基煤矿"
 krcw_vin_coal_of_tonkin_desc:0 "北圻的鸿基是亚洲最好的无烟煤矿之一。矿工工会——越南革命最早的摇篮——如今为国家挖煤。"
 krcw_vin_siam_border:0 "加强暹罗边防"
 krcw_vin_siam_border_desc:0 "披汶的暹罗窝藏着越南的流亡地主与法国残党，还对湄公河西岸虎视眈眈。河内加强了边防，也向曼谷递去了一封措辞谨慎的照会。"
 krcw_br_regional_pact_sp:0 "地区公约"
 krcw_br_regional_pact_sp_desc:0 "兄弟民国与暹罗坐到了一张桌子旁——不是结盟，而是就湄公河、边境与贸易达成谅解。南京不太高兴，但巴黎称赞这是\"亚洲人自己的和平\"。"
 krcw_br_nonaligned_sp:0 "青年国家的一员"
 krcw_br_nonaligned_sp_desc:0 "与其在两大阵营之间选边，不如和亚非的新兴国家站在一起。中立不是软弱，而是小国的智慧。"
 krcw_br_the_crossroads:0 "决定外交方向"
 krcw_br_the_crossroads_desc:0 "国家机器已经建成，外交方向还没有定。可以更深地融入南京的体系，可以同青年国家一起走不结盟的路，也可以把革命推过边界，支援暹罗国内反对銮披汶的力量。"
 krcw_br_deep_integration:0 "融入南京体系"
 krcw_br_deep_integration_desc:0 "兄弟民国把关税、铁路与国防与中国对接。这是最安全的路——代价是永远做那个\"小兄弟\"。"
 krcw_br_young_nations:0 "加入青年国家会议"
 krcw_br_young_nations_desc:0 "缅甸的昂山提议：不做任何人的前线。兄弟民国与印度、印尼、埃及的新政府一起，探索一条不结盟的道路。"
 krcw_br_siam_pact:0 "支援自由泰运动"
 krcw_br_siam_pact_desc:0 "比里·帕侬荣的自由泰运动在边境一侧设立营地和电台，反对曼谷的銮披汶政府。兄弟民国为他们提供庇护、武器和过境通道。曼谷一定会报复，边境上的冲突会越来越多。"
 krcw_br_free_thai_sp:0 "支援自由泰运动"
 krcw_br_free_thai_sp_desc:0 "边境营地里的自由泰武装由本国军队提供补给和训练。暹罗边防军时常越境追击。"
 krcw_br_cash_crops:0 "经济作物"
 krcw_br_cash_crops_desc:0 "缅甸的稻米、柬埔寨的胡椒、老挝的木材——兄弟民国靠出口原料换取南京与巴黎的机床。"
 krcw_br_pacify_the_hills:0 "绥靖山区"
 krcw_br_pacify_the_hills_desc:0 "克伦、克钦、苗族的武装还在山里。是招抚，还是清剿？各民国的选择不尽相同。"
 krcw_chi_200_t:0 "汉城的抉择"
 krcw_chi_200_d:0 "国会大厦座无虚席。金元凤坐在主席台上，金奎植、金武亭各据一方。三份提案摆在代表面前：一份把朝鲜的命运与南京牢牢绑在一起，一份坚持朝鲜的独立人格，一份要把国家建成一座对日堡垒。窗外，是刚刚从废墟里站起来的汉城。"
 krcw_chi_200.a:0 "兄弟同心——追随南京"
 krcw_chi_200.b:0 "自主的共和国"
 krcw_chi_200.c:0 "对日的堡垒"
 krcw_chi_210_t:0 "南圻的问题"
 krcw_chi_210_d:0 "河内的干部要一个统一的、革命的越南；西贡的宗教团体、华商与合作社要保住自己的一片天。阮安宁必须选择：是强行把革命推到湄公河口，还是给南圻一部承认自治的宪章？"
 krcw_chi_210.a:0 "南圻自治宪章"
 krcw_chi_210.b:0 "革命必须统一全国"
 krcw_chi_220_t:0 "兄弟民国的十字路口"
 krcw_chi_220_d:0 "国家建成了。部长们围着地图争论：向北，是南京可靠的臂膀与永远的\"小兄弟\"身份；向外，是与亚非新国家并肩的不结盟之路；向西，是与昔日的敌人暹罗握手，建立一个亚洲人自己的地区秩序。"
 krcw_chi_220.a:0 "更深地融入南京"
 krcw_chi_220.b:0 "走不结盟之路"
 krcw_chi_220.c:0 "支援暹罗的反对派"
 krcw_kor_strait_category:0 "对马海峡"
 krcw_kor_strait_category_desc:0 "朝鲜与日本隔海对峙，海峡上的每一次巡逻都是一次外交表态。"
 krcw_kor_strait_patrol:0 "海峡巡逻"
 krcw_kor_strait_patrol_desc:0 "让民国海军在对马海峡展示旗帜。"
 krcw_kor_fisheries_deal:0 "拦截日本走私船"
 krcw_kor_fisheries_deal_desc:0 "海防队在济州和釜山外海拦截向日本走私钨砂、人参的船只，也查获日本特务的电台。"
 krcw_kor_request_chinese_fleet:0 "请求中国舰队访问"
 krcw_kor_request_chinese_fleet_desc:0 "邀请中国海军访问釜山，向东京展示中朝的联合决心。"
 krcw_vin_mekong_category:0 "湄公河协作"
 krcw_vin_mekong_category_desc:0 "与高棉、寮国共同开发湄公河，河内出技术，各国出土地与人力。"
 krcw_vin_mekong_survey:0 "湄公河勘测"
 krcw_vin_mekong_survey_desc:0 "派出联合勘测队，为大坝与灌渠选址。"
 krcw_vin_aid_the_brothers:0 "援建兄弟民国"
 krcw_vin_aid_the_brothers_desc:0 "把越南的工程师与机床送往金边与万象。"
 krcw_vin_delta_dams:0 "三角洲大坝"
 krcw_vin_delta_dams_desc:0 "在湄公河三角洲修建灌溉与水电枢纽。"
 krcw_br_diplomacy_category:0 "青年国家外交"
 krcw_br_diplomacy_category_desc:0 "在两大阵营之外，兄弟民国与亚非的新国家建立自己的联系。"
 krcw_br_attend_conference:0 "出席青年国家会议"
 krcw_br_attend_conference_desc:0 "派代表出席亚非新国家的会议，为小国发声。"
 krcw_br_siam_detente:0 "争取青年国家的援助"
 krcw_br_siam_detente_desc:0 "请印度尼西亚、埃及等青年国家提供贷款和技术员，减少对任何一个阵营的依赖。"
 krcw_chi_1_t:0 "南京，一九四九年春"
 krcw_chi_1_d:0 "紫金山下的中山陵前，周恩来率国民政府委员宣誓就职两周年。从龙岩到北京，国民革命用了整整二十三年。\n\n可是，站在陵前的人都清楚：乡村仍在地主手中，北方与西南的将军们仍握着私兵，工厂在战火中残破，台湾仍悬在日本手里。印度与俄罗斯的特务在拉萨出没，东京的复仇派在报纸上叫嚣。\n\n“同志们，”周恩来说，“革命尚未成功。”"
 krcw_chi_1.a:0 "同志仍须努力。"
 krcw_chi_10_t:0 "土地法大辩论"
 krcw_chi_10_d:0 "立法院的会场座无虚席。农会代表带来了成捆的请愿书，城市商会与乡绅代表带来了律师。\n\n革命委员会派的草案主张：地主超过三十亩的田地由国家以三十年期赎买债券收购，按人口分给无地与少地的农户。温和派的对案则主张一律减租至三成七五，保护佃权，暂不触动所有权。\n\n周恩来在开会前夜对秘书说：“这不是一部法律，这是一次革命。区别只在于，我们希望它不流血。”"
 krcw_chi_10.a:0 "通过赎买分田的土地法。"
 krcw_chi_10.b:0 "采纳减租保佃的温和方案。"
 krcw_chi_10.c:0 "再议——现在还不是时候。"
 krcw_chi_11_t:0 "湖南的地主"
 krcw_chi_11_d:0 "土地法颁布后的第二个月，湘中几个县的地主武装包围了县土地委员会，烧毁了丈量册。一位农会主席在祠堂前被杀。\n\n消息传到南京，党内一片哗然。革命委员会派要求派兵；温和派则说，这正是操之过急的结果。"
 krcw_chi_11.a:0 "派保安部队，依法审判首犯。"
 krcw_chi_11.b:0 "准许农会自行武装。"
 krcw_chi_11.c:0 "放缓执行，与乡绅协商。"
 krcw_chi_12_t:0 "三成七五的账本"
 krcw_chi_12_d:0 "减租令实施半年，各地报告喜忧参半。浙江与江苏的佃农确实交得少了；可是在广西与四川，许多地主以“收回自耕”为名撤佃，把佃农赶出了祖辈耕种的土地。\n\n农会代表再次来到南京，他们只问一句话：“耕者有其田，还算不算数？”"
 krcw_chi_12.a:0 "补充立法：禁止撤佃。"
 krcw_chi_12.b:0 "重新提交赎买分田案。"
 krcw_chi_20_t:0 "纲要的第一天"
 krcw_chi_20_d:0 "国家建设委员会大楼前挂出了巨幅的地图：红线是铁路，蓝点是电厂，黑色三角是矿山。来自巴黎的技术代表团团长站在地图前，对周恩来说：“你们要在五年里做完我们三十年做的事。”\n\n周恩来笑了笑：“所以我们需要你们——不是作为老师，而是作为同事。”"
 krcw_chi_20.a:0 "邀请法国工程师参与各产业联合会。"
 krcw_chi_20.b:0 "技术要学，决策要自己做。"
 krcw_chi_21_t:0 "鞍钢的指标"
 krcw_chi_21_d:0 "鞍钢的工人委员会来信：为了完成纲要的钢铁指标，三号高炉已经连续运转了四百天，炉衬随时可能烧穿。建设委员会里有人主张“再坚持一个季度”，工会代表却拍了桌子：“指标是为人服务的，不是人为指标服务的！”"
 krcw_chi_21.a:0 "停炉检修，修订指标。"
 krcw_chi_21.b:0 "再坚持一个季度。"
 krcw_chi_22_t:0 "成渝铁路通车"
 krcw_chi_22_d:0 "一九五〇年夏，第一列火车从成都开进重庆。沿线的农民提着鸡蛋和橘子站在路基上看热闹；四川人等这条铁路，已经等了四十年。"
 krcw_chi_22.a:0 "四十年，值得。"
 krcw_chi_30_t:0 "中央执行委员会的夜晚"
 krcw_chi_30_d:0 "会议从下午开到深夜。革命委员会派的年轻委员们要求“加速”：土地法、国营化、军队整编一起推。陈公博把建设委员会的纲要草案摊在桌上，说重工业收归国营，土地法才有钱有地可分。顾孟余慢条斯理地站起来：“诸位，我们打了二十年的仗，老百姓要的是一口安稳饭。”\n\n会场安静下来。所有人都在等周恩来开口。"
 krcw_chi_30.a:0 "“革命不能停下脚步。”（支持革命委员会派）"
 krcw_chi_30.b:0 "“顾先生说得有理。”（向温和派让步）"
 krcw_chi_31_d1:0 "周恩来在中执委支持了革命委员会派之后，顾孟余在上海总商会发表演说，批评“以运动代替法治”。演说稿第二天登上了《申报》头版，南京的激进派报纸立刻回击，陈公博主编的《革命评论》称他是“买办的代言人”。\n\n革命委员会派要求开除他的党籍。温和派提醒中执委：顾孟余背后是半个上海与一半的省建设厅，现在把他赶走，城市里的人会认为南京已经不要他们了。"
 krcw_chi_31_d2:0 "周恩来向温和派让步之后，顾孟余在上海总商会发表演说，把政府的新方针讲成了温和派的胜利，批评“以运动代替法治”。演说稿第二天登上了《申报》头版，南京的激进派报纸立刻回击，陈公博主编的《革命评论》称他是“买办的代言人”。\n\n革命委员会派认为顾孟余在借政府的让步抢功，要求处分他。可是周恩来刚刚和温和派达成妥协，现在处分顾孟余，等于撕毁这个妥协。"
 krcw_chi_31_t:0 "顾孟余的演说"
 krcw_chi_31_d:0 "顾孟余在上海总商会发表演说，批评“以运动代替法治”。演说稿第二天登上了《申报》头版，南京的激进派报纸立刻回击，陈公博主编的《革命评论》称他是“买办的代言人”。\n\n党内有人建议开除他的党籍；也有人提醒：温和派背后是半个上海与一半的省建设厅。"
 krcw_chi_31.a:0 "邀请顾孟余入阁，团结为上。"
 krcw_chi_31.b:0 "公开批评，但不处分。"
 krcw_chi_31.c:0 "开除党籍，清理温和派。"
 krcw_chi_faction_shift_tt:0 "这会改变党内各派日后的力量对比。"
 krcw_chi_32_d1:0 "江苏、浙江与湖南的一百多个县举行了人民会议选举。投票站设在祠堂、学校和合作社的仓库里。许多妇女第一次按下了自己的手印。\n\n湖南的农会自从武装起来，就成了乡下说话最硬的一方。国民党改组派赢得了大多数席位，但在湖南和江西的几十个县，农会和工团党推举的候选人击败了党的提名人。宣布这些结果无效，就要和有枪的农会对着干。"
 krcw_chi_32_d2:0 "江苏、浙江与湖南的一百多个县举行了人民会议选举。投票站设在祠堂、学校和合作社的仓库里。许多妇女第一次按下了自己的手印。\n\n土地法放缓执行以后，乡绅在许多县又站稳了脚跟。国民党改组派赢得了大多数席位，但在十几个县，地方士绅支持的候选人击败了农会的人。"
 krcw_chi_32_t:0 "第一次县乡选举"
 krcw_chi_32_d:0 "江苏、浙江与湖南的一百多个县举行了人民会议选举。投票站设在祠堂、学校和合作社的仓库里。许多妇女第一次按下了自己的手印。\n\n结果出人意料：国民党改组派赢得了大多数席位，但在十几个县，农会推举的无党派候选人击败了党的提名人。"
 krcw_chi_32.a:0 "尊重结果，推广到全国。"
 krcw_chi_32.b:0 "宣布部分县选举无效。"
 krcw_chi_33_t:0 "周恩来与继承问题"
 krcw_chi_33_d:0 "一九五三年秋，周恩来在一次会议上累倒了。医生说无大碍，只需要休息。但这件事让所有人意识到：改组派的一切都系于一人之身。\n\n周恩来醒来后的第一件事，是要求秘书把党章修改草案拿来：“不能让中国再等一个强人。”"
 krcw_chi_33.a:0 "建立集体领导与任期制。"
 krcw_chi_33.b:0 "维持现状。"
 krcw_chi_wl_reply_tt:0 "他的答复将在两周后到达。条件越优厚、政局越稳定、中央军越强、已归顺的人越多，他接受的可能越大。"
 krcw_chi_wl_contained_tt:0 "下一次交涉时，他接受的可能更大。"
 krcw_chi_40_d1:0 "阎锡山在太原经营了四十年，他的“山西模范省”有自己的钱币、兵工厂与窄轨铁路。\n\n南京的特使带着安置方案到了太原。方案的轻重由南京定，接不接受由阎锡山定。"
 krcw_chi_40_d2:0 "阎锡山在太原经营了四十年，他的“山西模范省”有自己的钱币、兵工厂与窄轨铁路。\n\n中央军的两个师已经开到太原外围。南京可以直接下令，也可以先分化他的部下。"
 krcw_chi_40_t:0 "阎锡山与南京"
 krcw_chi_40_d:0 "阎锡山在太原经营了四十年，他的“山西模范省”有自己的钱币、兵工厂与窄轨铁路。\n\n南京的特使到了太原。他要带回一个答复，但开什么条件由南京决定。"
 krcw_chi_40.a:0 "开出优厚条件：保留他在西北实业公司的股份，并给他一个国民政府委员的席位。"
 krcw_chi_40.b:0 "只给养老金和一个名誉职位，不再加价。"
 krcw_chi_40.c:0 "下最后通牒：三十天内交出防区与兵权。"
 krcw_chi_40.d:0 "先直接给他的师长们发饷，再要他交权。"
 krcw_chi_40.e:0 "召回特使，暂不摊牌。"
 krcw_chi_140_d1:0 "阎锡山接受了南京的条件：保留他在西北实业公司的股份，并给他一个国民政府委员的席位。他在太原设宴送走特使，第二天把兵工厂和军需处的账册交了出来。"
 krcw_chi_140_d2:0 "阎锡山收下了养老金和名誉职位。条件不算优厚，但他算过账：再拖下去，南京的条件只会更少。"
 krcw_chi_140_d3:0 "最后通牒到期前三天，阎锡山发出通电，宣布服从中央。中央军进入太原时没有遇到抵抗。"
 krcw_chi_140_d4:0 "领到南京军饷的师长们一个接一个表态服从整编。阎锡山发现自己手里已经没有可以调动的部队，只好签字。"
 krcw_chi_140_t:0 "阎锡山交出兵权"
 krcw_chi_140_d:0 "阎锡山同意整编。晋绥军的部队将换上中央军的番号与军饷。"
 krcw_chi_140.a:0 "把晋绥军整编进中央军。"
 krcw_chi_140.b:0 "遣散大部，老兵复员领田。"
 krcw_chi_143_d1:0 "阎锡山把南京的优厚条件退了回来。他对特使说，股份和席位随时可以收回，兵在自己手里才算数。"
 krcw_chi_143_d2:0 "阎锡山认为一份养老金打发不了他。特使在太原等了十天，只等到一封措辞客气的回绝信。"
 krcw_chi_143_d3:0 "阎锡山抢先撤换了三个收过南京军饷的师长，换上了自己的亲信。南京的钱花了，人没有争取过来。"
 krcw_chi_143_t:0 "阎锡山拒绝整编"
 krcw_chi_143_d:0 "阎锡山拒绝了南京的条件，特使空手回来。"
 krcw_chi_143.a:0 "给他时间，过些日子再谈。"
 krcw_chi_143.b:0 "在他的防区周边增派驻军。"
 krcw_chi_146_t:0 "阎锡山部对峙"
 krcw_chi_146_d:0 "阎锡山再次拒绝交出兵权。晋绥军在太原城外挖了战壕，中央军的两个师在对面停了下来。"
 krcw_chi_146.a:0 "下令强行缴械。"
 krcw_chi_146.b:0 "撤回部队，暂不摊牌。"
 krcw_chi_149_d1:0 "两天的交火之后，晋绥军的主力放下了武器。阎锡山本人被护送到南京，安排在一处宅院里居住。"
 krcw_chi_149_d2:0 "阎锡山的防区拿下来了，但他的两个团带着枪退进了山里。阎锡山本人下落不明。"
 krcw_chi_149_t:0 "太原防区的战斗"
 krcw_chi_149_d:0 "中央军进入了阎锡山的防区。"
 krcw_chi_149.a:0 "把缴获的武器编入中央军。"
 krcw_chi_149.b:0 "悬赏缉拿，派兵进山。"
