 krcw_chi_151.a:0 "把缴获的武器编入中央军。"
 krcw_chi_151.b:0 "悬赏缉拿，派兵进山。"
 krcw_chi_wl_force_tt:0 "中央军越强、政局越稳，缴械越可能顺利；否则他的部分部队会带枪逃走。"
 krcw_chi_wl_escaped_tt:0 "逃进山里的部队会引发兵变，直到被剿灭或招安。"
 krcw_chi_46_d1:0 "逃进山里的旧部袭击了一个县城的粮库和电报局，打死了南京派去的县长。他们打出的仍是原来的番号。"
 krcw_chi_46_t:0 "兵变"
 krcw_chi_46_d:0 "一个拒绝整编的师在夜里哗变，打死了南京派来的政治部主任，裹挟着辎重退进了山里。报纸称之为“最后的军阀战争”。"
 krcw_chi_46.a:0 "围剿。"
 krcw_chi_46.b:0 "招安。"
 krcw_chi_50_t:0 "宋庆龄在巴黎"
 krcw_chi_50_d:0 "宋庆龄率领的代表团在巴黎受到了盛大欢迎。公社的总书记在工团宫设宴，席间谈起了汪精卫——许多公社老人当年都和他一起在拉丁区的咖啡馆里讨论过革命。\n\n第二天的谈判则务实得多。法国人愿意提供帮助，但他们想知道：中国最需要什么？"
 krcw_chi_50.a:0 "清算联盟的信用额度。"
 krcw_chi_50.b:0 "技术与专利。"
 krcw_chi_50.c:0 "武器与军事顾问。"
 krcw_chi_51_d1:0 "代表团带回了清算联盟的信用协议。南京可以用它向法国和意大利的工厂订购机床与发电设备，账目五年后才开始结算。宋庆龄在记者会上说：“第三国际不是一个帝国，它是一张网。我们也是这张网的一根线。”"
 krcw_chi_51_d2:0 "代表团带回了一批步枪和一个法国军事顾问团。顾问团团长第二天就去了南京的中央军校，要求看训练大纲。宋庆龄在记者会上只谈了工程师，没有提顾问团。"
 krcw_chi_51_t:0 "代表团归来"
 krcw_chi_51_d:0 "代表团带回了协议、合同和一千二百名愿意来华工作的法国、英国与意大利工程师的名单。宋庆龄在记者会上说：“第三国际不是一个帝国，它是一张网。我们也是这张网的一根线。”"
 krcw_chi_51.a:0 "欢迎同志们。"
 krcw_chi_paris_credit_tt:0 "建设纲要开始时，清算联盟的信用将用于建一座新的工厂。"
 krcw_chi_52_t:0 "中国代表团"
 krcw_chi_52_d:0 "中华民国的代表团抵达巴黎。南京希望获得清算联盟的信用、技术与在第三国际中更大的发言权。对公社而言，一个强大而友好的中国，是亚洲战线的基石。"
 krcw_chi_52.a:0 "慷慨相助。"
 krcw_chi_52.b:0 "有条件地帮助。"
 krcw_chi_53_t:0 "巴黎代表大会"
 krcw_chi_53_d:0 "第三国际第五次代表大会在巴黎召开。中国代表团团长周恩来获得了大会发言的机会。欧洲的代表们想听的是一个问题：亚洲的革命与欧洲的革命，是同一场革命吗？"
 krcw_chi_53.a:0 "“是同一场革命，但有不同的道路。”"
 krcw_chi_53.b:0 "“亚洲的革命应由亚洲人领导。”"
 krcw_chi_54_t:0 "一八七一号"
 krcw_chi_54_d:0 "无线电收音机里传来了“嘀——嘀——”的声音：法兰西公社的人造卫星“一八七一号”正从中国上空掠过。南京的大学生们在操场上仰望夜空。\n\n中央研究院的院长第二天就递交了报告：中国也需要一个航天计划。"
 krcw_chi_54.a:0 "与法国合作研究火箭。"
 krcw_chi_54.b:0 "天上的事，以后再说。"
 krcw_chi_60_t:0 "海峡中线的遭遇"
 krcw_chi_60_d:0 "雾中，福建舰队的一艘炮艇与日本海上警备队的巡逻艇相距不到八百米。双方的炮口都褪下了炮衣。日本艇长用信号灯打出了一句话：“此处为帝国领海。”\n\n艇长请求指示。"
 krcw_chi_60.a:0 "回复“此处为公海”，保持航向，不得开火。"
 krcw_chi_60.b:0 "转向避让。"
 krcw_chi_60.c:0 "鸣炮警告。"
 krcw_chi_61_t:0 "海峡的炮声"
 krcw_chi_61_d:0 "中国炮艇在台湾海峡鸣炮警告。东京的报纸以“南京的挑衅”为通栏标题。内阁要求海军作出回应。"
 krcw_chi_61.a:0 "提出抗议，加强巡逻。"
 krcw_chi_61.b:0 "寻求莫斯科的保证。"
 krcw_chi_62_t:0 "福建沿海的登陆演习"
 krcw_chi_62_d:0 "情报显示，中国海军陆战队正在福建沿海大规模演练登陆。参谋本部判断，南京可能在一两年内对台湾动手。"
 krcw_chi_62.a:0 "增兵台湾。"
 krcw_chi_62.b:0 "向俄罗斯求援。"
 krcw_chi_63_t:0 "台湾自治请愿"
 krcw_chi_63_d:0 "台湾文化协会与台湾民众党向东京的帝国议会递交了第十七次自治请愿书，这一次有十二万人签名。南京的电台用闽南话全文播出。"
 krcw_chi_63.a:0 "公开声援。"
 krcw_chi_63.b:0 "秘密资助。"
 krcw_chi_70_t:0 "兄弟民国会议"
 krcw_chi_70_d:0 "金元凤、阮安宁、山玉成、苏发努冯与昂山围坐在南京外交部的圆桌旁。圆桌是周恩来特意要求的——“兄弟之间没有上座”。\n\n可是每个人都知道，谁出钱、谁出兵，谁就有最后的发言权。"
 krcw_chi_70.a:0 "承诺援助，不附条件。"
 krcw_chi_70.b:0 "援助与顾问一同派出。"
 krcw_chi_71_t:0 "仰光的学生"
 krcw_chi_71_d:0 "仰光大学的学生上街游行，标语上写着：“缅甸人的缅甸。”他们抗议的不是南京，而是南京顾问在各部委里的“太上皇”作风。昂山请求南京撤换几位顾问。"
 krcw_chi_71.a:0 "撤换顾问，公开道歉。"
 krcw_chi_71.b:0 "不予理会。"
 krcw_chi_72_t:0 "金边王宫"
 krcw_chi_72_d:0 "高棉的年轻国王仍住在金边王宫里。山玉成的政府需要他的威望来安抚农村；激进派则认为王宫是旧秩序的象征。南京的意见被认为举足轻重。"
 krcw_chi_72.a:0 "建议保留虚君，写入宪法。"
 krcw_chi_72.b:0 "支持共和派。"
 krcw_chi_73_t:0 "寮国的山地"
 krcw_chi_73_d:0 "苏发努冯报告：苗族与老听族山民不信任万象的新政府，一些村寨被印度联邦与暹罗的特务收买。他请求南京派遣医疗队与道路工程队，而不是军队。"
 krcw_chi_73.a:0 "派出医疗队与工程队。"
 krcw_chi_73.b:0 "派出一个山地团。"
 krcw_chi_80_t:0 "中朝同盟"
 krcw_chi_80_d:0 "中朝同盟条约在汉城签署。金元凤在仪式上回忆起辽西会战：“我们的血流在同一片雪地上。”条约规定两国共同防御，军队联合训练。"
 krcw_chi_80.a:0 "兄弟同心。"
 krcw_chi_81_t:0 "汉城的忠诚"
 krcw_chi_81_d:0 "日本复仇派在国会里公开叫嚣“收复半岛”。汉城紧急召开国务会议。金元凤的回答简洁有力：“朝鲜民国与中华民国共进退。”他请求南京增派一个航空团驻扎釜山。"
 krcw_chi_81.a:0 "派出航空团。"
 krcw_chi_81.b:0 "提供装备，但不派兵。"
 krcw_chi_82_t:0 "汉城要求平等条约"
 krcw_chi_82_d:0 "朝鲜政府正式照会南京，要求修订一九四四年的《青岛协定》附件：取消中国军队在朝鲜的驻兵权，朝鲜在第三国际中拥有独立的一票。\n\n照会的语气很客气，但态度很坚决。"
 krcw_chi_82.a:0 "同意——兄弟本应平等。"
 krcw_chi_82.b:0 "婉拒，并提醒汉城是谁赶走了关东军。"
 krcw_chi_83_t:0 "朝鲜的国会"
 krcw_chi_83_d:0 "朝鲜国会选举结束。民族革命党获胜，但韩国独立党在南方各道得票不少。国会的第一项决议，是向中国人民致谢。"
 krcw_chi_83.a:0 "回电祝贺。"
 krcw_chi_90_t:0 "河内的不满"
 krcw_chi_90_d:0 "南京宣布扩大驻越顾问团的消息在河内引起了轩然大波。阮安宁在国民大会上说：“我们没有赶走一个总督，去迎接另一个总督。”\n\n越南政府请求南京重新考虑。"
 krcw_chi_90.a:0 "（越南）正式提出抗议。"
 krcw_chi_90.b:0 "（越南）忍耐。"
 krcw_chi_91_t:0 "顾问与部长"
 krcw_chi_91_d:0 "河内经济部的一位越南副部长辞职了。他在辞职信里写道：“我在自己的部里签不了一个字——所有文件都要先经中国顾问审阅。”信件在河内的报纸上刊登出来。"
 krcw_chi_91.a:0 "削减顾问的权限。"
 krcw_chi_91.b:0 "这是必要的监督。"
 krcw_chi_92_t:0 "河内来的照会"
 krcw_chi_92_d:0 "越南政府请求就两国关系进行“全面的、平等的”谈判。阮安宁的特使在南京说：“越南感谢中国，但越南不是中国的一个省。”"
 krcw_chi_92.a:0 "同意谈判。"
 krcw_chi_92.b:0 "拖延。"
 krcw_chi_93_t:0 "越南的边境"
 krcw_chi_93_d:0 "越南与暹罗在湄公河上的边界发生摩擦。武元甲主张独立处理，不需要中国出兵。南京的军事代表团则建议派一个师“以防万一”。"
 krcw_chi_93.a:0 "尊重越南的判断。"
 krcw_chi_93.b:0 "派兵。"
 krcw_chi_94_t:0 "河内的一票"
 krcw_chi_94_d:0 "在第三国际代表大会上，越南代表团投票反对中国提出的亚洲局章程修正案。南京的外交官们面面相觑。周恩来却只是笑笑：“他们长大了。”"
 krcw_chi_94.a:0 "“他们长大了。”"
 krcw_chi_94.b:0 "召回驻河内大使。"
 krcw_chi_revolt_down5_tt:0 "西藏叛乱进度 §G-5§!"
 krcw_chi_revolt_up5_tt:0 "西藏叛乱进度 §R+5§!"
 krcw_chi_100_t:0 "拉萨的传闻"
 krcw_chi_100_d:0 "驻拉萨代表发来密电：几位噶伦的府邸里出现了陌生的印度商人，他们带来的不是茶叶和布匹，而是步枪与金币。热振摄政对此或许知情，或许不知情。"
 krcw_chi_100.a:0 "通过正式渠道向噶厦表达关切。"
 krcw_chi_100.b:0 "增加西康边境的驻军。"
 krcw_chi_100.c:0 "派人秘密调查。"
 krcw_chi_101_t:0 "西藏问题的新约定"
 krcw_chi_101_d:0 "叛乱的硝烟散去了。周恩来邀请噶厦代表到南京谈判。他提出的方案简单明了：扩大自治，不改制度；中央不派工作队，西藏不许外国驻军。"
 krcw_chi_101.a:0 "签订新约定。"
 krcw_chi_101.b:0 "取消自治，直接治理。"
 krcw_chi_110_t:0 "萨文科夫之死"
 krcw_chi_110_d:0 "莫斯科电台宣布萨文科夫逝世。南京的外交部连夜开会：俄罗斯的继承斗争也许会让莫斯科暂时无暇东顾——这是机会，还是危险？"
 krcw_chi_110.a:0 "保持克制，发唁电。"
 krcw_chi_110.b:0 "加强北方边境。"
 krcw_chi_111_t:0 "热线"
 krcw_chi_111_d:0 "巴黎与莫斯科之间开通了热线，以免一次误判引发全面战争。南京的外交部担心，欧洲的两大国会在亚洲问题上越过中国私下商量。"
 krcw_chi_111.a:0 "要求巴黎事先与南京协商亚洲问题。"
 krcw_chi_111.b:0 "静观其变。"
 krcw_chi_warlord_category:0 "整编地方实力派"
 krcw_chi_warlord_category_desc:0 "北伐中归顺的地方实力派仍拥兵自重。每一位将军都需要单独的谈判——或者单独的讨伐。已完成整编：[?ROOT.krcw_chi_warlords_done]/3"
 krcw_chi_negotiate_yan:0 "与阎锡山谈判"
 krcw_chi_negotiate_yan_desc:0 "以养老金、荣誉职位与企业股份换取阎锡山交出兵权。"
 krcw_chi_disarm_yan:0 "缴械阎锡山部"
 krcw_chi_disarm_yan_desc:0 "中央军开进阎锡山的防区，限期缴械。"
 krcw_chi_negotiate_bai:0 "与白崇禧谈判"
 krcw_chi_negotiate_bai_desc:0 "以养老金、荣誉职位与企业股份换取白崇禧交出兵权。"
 krcw_chi_disarm_bai:0 "缴械白崇禧部"
 krcw_chi_disarm_bai_desc:0 "中央军开进白崇禧的防区，限期缴械。"
 krcw_chi_negotiate_hu:0 "与胡宗南谈判"
 krcw_chi_negotiate_hu_desc:0 "以养老金、荣誉职位与企业股份换取胡宗南交出兵权。"
 krcw_chi_disarm_hu:0 "缴械胡宗南部"
 krcw_chi_disarm_hu_desc:0 "中央军开进胡宗南的防区，限期缴械。"
 krcw_chi_warlord_negotiate_tt:0 "南京将派出特使。"
 krcw_chi_strait_category:0 "台湾海峡"
 krcw_chi_strait_category_desc:0 "台湾仍在日本手中。海峡两岸的每一次举动，都会牵动东京、莫斯科与巴黎的神经。当前世界紧张度：[?global.krcw_tension]"
 krcw_chi_strait_show_of_force:0 "海峡示威航行"
 krcw_chi_strait_show_of_force_desc:0 "福建舰队沿海峡中线航行，展示民国海军的存在。"
 krcw_chi_strait_fisheries_talks:0 "收缩海峡巡逻"
 krcw_chi_strait_fisheries_talks_desc:0 "把福建舰队撤回近岸，暂停中线巡逻，降低擦枪走火的风险。主战的海军军官认为这是示弱。"
 krcw_chi_fund_taiwanese_autonomists:0 "资助台湾地下组织"
 krcw_chi_fund_taiwanese_autonomists_desc:0 "向台湾文化协会和民众党的武装派输送经费、电台和印刷机，扩大岛内的抗日组织。"
 krcw_chi_mine_the_strait:0 "海峡布雷演习"
 krcw_chi_mine_the_strait_desc:0 "在福建沿海进行大规模布雷与扫雷演习，为可能的登陆作战做准备。"
 krcw_chi_taiwan_support_tt:0 "台湾地下组织力量 §G+10§!（当前：[?ROOT.krcw_chi_taiwan_support]）"
 krcw_chi_brother_category:0 "援助兄弟民国"
 krcw_chi_brother_category_desc:0 "朝鲜、越南、高棉、寮国与缅甸都是在中国帮助下诞生的民国。援助可以赢得感激，也可能招致“新宗主”的指责。"
 krcw_chi_aid_kor_industry:0 "援建朝鲜工业"
 krcw_chi_aid_kor_industry_desc:0 "派遣工程师与设备，帮助朝鲜建设工厂。"
 krcw_chi_aid_kor_arms:0 "向朝鲜提供武器"
 krcw_chi_aid_kor_arms_desc:0 "从国库中调拨步枪与弹药给朝鲜。"
 krcw_chi_aid_vin_industry:0 "援建越南工业"
 krcw_chi_aid_vin_industry_desc:0 "派遣工程师与设备，帮助越南建设工厂。"
 krcw_chi_aid_vin_arms:0 "向越南提供武器"
 krcw_chi_aid_vin_arms_desc:0 "从国库中调拨步枪与弹药给越南。"
 krcw_chi_aid_cam_industry:0 "援建高棉工业"
 krcw_chi_aid_cam_industry_desc:0 "派遣工程师与设备，帮助高棉建设工厂。"
 krcw_chi_aid_cam_arms:0 "向高棉提供武器"
 krcw_chi_aid_cam_arms_desc:0 "从国库中调拨步枪与弹药给高棉。"
 krcw_chi_aid_los_industry:0 "援建寮国工业"
 krcw_chi_aid_los_industry_desc:0 "派遣工程师与设备，帮助寮国建设工厂。"
 krcw_chi_aid_los_arms:0 "向寮国提供武器"
 krcw_chi_aid_los_arms_desc:0 "从国库中调拨步枪与弹药给寮国。"
 krcw_chi_aid_brm_industry:0 "援建缅甸工业"
 krcw_chi_aid_brm_industry_desc:0 "派遣工程师与设备，帮助缅甸建设工厂。"
 krcw_chi_aid_brm_arms:0 "向缅甸提供武器"
 krcw_chi_aid_brm_arms_desc:0 "从国库中调拨步枪与弹药给缅甸。"
 krcw_chi_asian_bureau_summit:0 "召开亚洲局会议"
 krcw_chi_asian_bureau_summit_desc:0 "邀请各兄弟民国与第三国际亚洲成员在南京开会，协调发展与防务。"
 krcw_chi_brotherhood:0 "兄弟情谊"
 krcw_chi_trade_partner:0 "清算联盟伙伴"
 krcw_chi_rival:0 "龃龉"
 krcw_chi_1871:0 "研究加成"
 krcw_chi_anshan_push:0 "研究加成"
 krcw_chi_mines:0 "研究加成"
 krcw_chi_paris_tech:0 "研究加成"
 krcw_chi_programme_start:0 "研究加成"
