 KOR_krcw_kim_kyu_sik:0 "金奎植"
 KOR_krcw_kim_kyu_sik_desc:0 "在巴黎和会上为朝鲜奔走的老外交家。他不属于任何武装派系，正因如此，各派都能勉强接受他做联合阵线的调停人。他相信一个议会的、宽容的朝鲜，比一个纪律严明的兵营更长久。"
 KOR_krcw_kim_mu_chong_leader:0 "金武亭"
 KOR_krcw_kim_mu_chong_leader_desc:0 "走过长征、在华北打过日本人的炮兵将领。他对议会的争吵毫无耐心，坚信朝鲜的生存取决于一支强大的军队和与南京牢不可破的同盟。温和派怕他，士兵爱他。"
 VIN_krcw_tran_van_giau:0 "陈文饶"
 VIN_krcw_tran_van_giau_desc:0 "西贡起义的组织者，越南托派的领袖。他认为阮安宁的\"民族阵线\"是对革命的背叛：只有清算地主、驯服宗教团体、把火种撒向整个东南亚，越南的革命才算完成。"
 VIN_krcw_pham_van_dong:0 "范文同"
 VIN_krcw_pham_van_dong_desc:0 "阮安宁最信任的行政家，务实的建设者。若阮安宁不在，是他而非军人或托派最有可能继承河内——一个把稻米产量看得比世界革命更重的领袖。"
 CAM_krcw_tou_samouth:0 "杜斯木"
 CAM_krcw_tou_samouth_desc:0 "高棉人民革命的元老，主张把柬埔寨从山玉成的民族主义带向更彻底的社会革命——但也警惕越南的影子笼罩金边。"
 BRM_krcw_than_tun:0 "德钦丹东"
 BRM_krcw_than_tun_desc:0 "缅甸共产主义者的领袖，昂山的姻亲与对手。他要一场比自由同盟更彻底的革命，若昂山的联合政府破裂，山区的红旗就会打着他的名号。"
 LOS_krcw_phetsarath:0 "碧沙拉"
 LOS_krcw_phetsarath_desc:0 "寮国亲王，独立运动的元老。他不是革命者，而是一个想在中国、越南与暹罗之间为寮国保住一点自主的老派贵族。"
 KOR_krcw_kim_wonbong_desc:0 "义烈团的团长，朝鲜民族革命党的领袖。三十年的暗杀、流亡与游击战之后，他成了独立朝鲜的第一任领导人——一个更习惯于炸弹而非预算的革命家。"
 VIN_krcw_nguyen_an_ninh_desc:0 "留法的记者与哲学家，越南革命的良心。他领导的革命打败了法国，但他拒绝让越南从一个主人手里换到另一个主人手里——即使那个主人是南京。"
 CAM_krcw_son_ngoc_thanh_desc:0 "高棉民族主义之父，共和的倡导者。他借中国志愿军之力推翻了王室的殖民合作者，如今要在王座的阴影下建起一个共和国。"
 LOS_krcw_souphanouvong_desc:0 "\"红亲王\"，寮国自由的领袖。出身王室，却选择了革命与共和；他要让寮国摆脱法国，也要让它免于成为邻国的附庸。"
 BRM_krcw_aung_san_desc:0 "缅甸独立之父，反法西斯人民自由同盟的领袖。他把各族、各派勉强拢在一面旗下，深知这个联盟随时可能在他手中散架。"
 krcw_chi_county_cadres:0 "县级干部"
 krcw_chi_county_cadres_desc:0 "国民政府的统治过去只到县城为止，出了城门就是宗族、保长与团练的天下。新的干部学校每年送出八千人下乡——他们带着土地簿、扫盲课本和一支手枪。"
 krcw_chi_frontier_autonomy:0 "边疆自治"
 krcw_chi_frontier_autonomy_desc:0 "蒙、回、藏、彝、苗——帝国和北洋都用刀解决的问题，南京试着用自治章程解决：本族的官、本族的学校、本族的语言，条件是承认中央。"
 krcw_chi_the_nanjing_spring:0 "南京之春"
 krcw_chi_the_nanjing_spring_desc:0 "周恩来晚年推动党政分开与地方议会选举。国民党从一个革命党变成一个执政联盟——这个转变没有流血，但也没有回头路。"
 krcw_chi_the_iron_rice_bowl:0 "铁饭碗"
 krcw_chi_the_iron_rice_bowl_desc:0 "国营厂的工人有住房、医疗、托儿所和一份干到死的工作。这是合作社纲领最受欢迎的部分，也是国家预算里最沉重的一行。"
 krcw_chi_reach_the_county:0 "政权下县"
 krcw_chi_reach_the_county_desc:0 "南京的法令到了县一级常常无人执行，缺的是懂政策的基层干部。向各县派驻干部，确保土地法落实。"
 krcw_chi_the_cadre_schools:0 "干部学校"
 krcw_chi_the_cadre_schools_desc:0 "每省一所干部学校，学制一年：识字、算账、土地测量、公文写作，还有怎么在一个不欢迎你的村子里住下来。"
 krcw_chi_break_the_clans:0 "宗族与保甲"
 krcw_chi_break_the_clans_desc:0 "乡下真正的统治者是宗族长老与保长。要么把他们编进新政权，要么把他们拆掉——南京两条路都试过，发现第一条便宜得多。"
 krcw_chi_the_land_registry:0 "土地清册"
 krcw_chi_the_land_registry_desc:0 "全国土地重新丈量，地契重新登记。这项工作枯燥、漫长、得罪所有人——但没有它，土地法只是一句口号。"
 krcw_chi_the_frontier_statutes:0 "边疆自治章程"
 krcw_chi_the_frontier_statutes_desc:0 "蒙、回、彝、苗的自治章程在国民大会通过。反对者说这是分裂国家的第一步；周恩来回答说，西藏的例子已经证明，刀解决不了这个问题。"
 krcw_chi_the_third_programme:0 "第三个五年纲要"
 krcw_chi_the_third_programme_desc:0 "前两个纲要修铁路、建钢厂、办学校。第三个要解决一个更难的问题：让农民买得起工厂造出来的东西。"
 krcw_chi_manchurian_heavy_industry:0 "东北重工业"
 krcw_chi_manchurian_heavy_industry_desc:0 "奉系留下的鞍山钢铁厂与抚顺煤矿是中国最完整的重工业基地。日本人炸掉了一半，苏北的工人用手把它们抬了回来。"
 krcw_chi_the_inland_railways:0 "内陆铁路"
 krcw_chi_the_inland_railways_desc:0 "成渝、宝成、兰新——把西部与沿海连起来的干线。每公里都要炸山，但每公里都让这个国家更像一个国家。"
 krcw_chi_the_consumer_turn:0 "消费品转向"
 krcw_chi_the_consumer_turn_desc:0 "合作社大会通过一项决议：下一个五年，自行车、缝纫机、暖水瓶与胶鞋的产量要翻三倍。军方反对，农会鼓掌。"
 krcw_chi_the_coordinated_plan:0 "协商计划"
 krcw_chi_the_coordinated_plan_desc:0 "国家、省级机构与产业合作社逐项协商产量与价格，谈不拢的交仲裁委员会裁决。效率不高，但各方都能接受。"
 krcw_chi_the_question_of_after:0 "安排周恩来接班"
 krcw_chi_the_question_of_after_desc:0 "周恩来一八九八年生，在龙岩的山里害过一次大病。党内没有人公开谈继承，但每个人都在看三个方向：革命委员会的老人、合作社系统的技术官僚、还是县议会选出来的新一代。"
 krcw_chi_the_party_school:0 "中央党校"
 krcw_chi_the_party_school_desc:0 "党校每年培训三千名中层干部。课程里有三民主义、合作社经济学，也有一门从前不会教的课：如何在选举中落选之后继续工作。"
 krcw_chi_separate_party_and_state:0 "党政分开"
 krcw_chi_separate_party_and_state_desc:0 "一个革命党在打赢之后最难的一步：承认政府不等于党。周恩来把这件事留到了最后，因为他知道它一旦开始就停不下来。"
 krcw_chi_the_committee_endures:0 "保留革命委员会"
 krcw_chi_the_committee_endures_desc:0 "革命委员会的老人们有一个简单的论点：这个国家还在被两个阵营夹着，还有一个自立的西藏和一个占着台湾的日本。现在不是玩议会游戏的时候。"
 krcw_chi_the_new_generation:0 "提拔青年干部"
 krcw_chi_the_new_generation_desc:0 "一九五〇年代入党的人和长征、龙岩、第二次北伐都没有关系。他们是工程师、教师和县长，最关心的是水泥产量和小学入学率。这一代人接班的时候，革命会变成行政。"
 krcw_chi_the_asian_bureau:0 "亚洲局"
 krcw_chi_the_asian_bureau_desc:0 "国际的亚洲事务由南京的一个办事处协调：朝鲜、越南、柬埔寨、老挝、缅甸的代表每季度来一次。巴黎知道这个机构的存在，也知道最好不要多问。"
 krcw_chi_the_rice_and_rail_compact:0 "米与铁路公约"
 krcw_chi_the_rice_and_rail_compact_desc:0 "越南与缅甸的米换中国的机床与铁轨，昆明到河内、南宁到河内的铁路由五国合资。这是亚洲第一个不由欧洲人主持的经济共同体。"
 krcw_chi_the_bandung_road:0 "与青年国家结盟"
 krcw_chi_the_bandung_road_desc:0 "向印度尼西亚、埃及、西非联邦和东非联邦派出代表团，提供水利、铁路和教师援助，争取不结盟国家。"
 krcw_chi_the_asian_internationale:0 "提议设立亚洲书记处"
 krcw_chi_the_asian_internationale_desc:0 "一个提议在南京被正式提出：国际应该有第二个书记处，设在亚洲。巴黎的答复花了十一个月才到，而且措辞极其谨慎。"
 krcw_chi_300_t:0 "边疆的条件"
 krcw_chi_300_d:0 "自治章程在国民大会通过了，可是各族代表在会外提出了更具体的要求：本族的军队编制、宗教事务不受干涉、以及一条谁都不愿写进文件的——如果中央违约，自治可以取消对中央的承认。\n\n蒙古的代表说得最直接：\"我们看着西藏。\""
 krcw_chi_300.a:0 "接受全部条件"
 krcw_chi_300.b:0 "只给文化与宗教自治"
 krcw_chi_300.c:0 "章程照旧，军队归中央"
 krcw_chi_302_t:0 "仲裁委员会的第一个案子"
 krcw_chi_302_d:0 "武汉钢铁厂与湖北省合作社联合会为一批钢材的价格吵到了仲裁委员会。钢厂说省里压价，省里说钢厂拿国家订单养自己。\n\n这个案子怎么判，会决定协商计划到底是一套真规则，还是一层客气的外衣。"
 krcw_chi_302.a:0 "判省里胜：计划高于企业"
 krcw_chi_302.b:0 "判钢厂胜：合同就是合同"
 krcw_chi_304_t:0 "三个方向"
 krcw_chi_304_d:0 "一次没有记录的会议。周恩来把三个人叫到一起：革命委员会的老书记、合作社总署的总工程师、以及一个四十岁的省长。\n\n他没有宣布任何决定，只问了一个问题：\"如果明天我不在了，这个国家最缺的是什么？\"三个人给了三个完全不同的答案。"
 krcw_chi_304.a:0 "纪律——老书记是对的"
 krcw_chi_304.b:0 "效率——总工程师是对的"
 krcw_chi_304.c:0 "合法性——省长是对的"
 krcw_chi_306_t:0 "第一次真正的选举"
 krcw_chi_306_d:0 "县议会选举的结果在报纸上登了整整三版。国民党在四百一十七个县里赢了三百一十一个——这是一个真实的胜利，也是一个真实的失败：一百零六个县的县长不是党员。\n\n周恩来在政治报告里说了一句被反复引用的话：\"我们赢得了大多数，这比赢得全部更可靠。\""
 krcw_chi_306.a:0 "承认结果，继续开放"
 krcw_chi_306.b:0 "承认结果，但停在这里"
 krcw_chi_308_t:0 "不结盟的诱惑"
 krcw_chi_308_d:0 "雅加达、开罗与达卡的代表在南京提出了一个不太礼貌的问题：中华民国既然是亚洲最大的革命国家，为什么还要听巴黎的？\n\n这个问题的答案很复杂：国际给了中国机床、贷款与在易北河牵制俄罗斯的盟友。但问题一旦被问出来，就再也无法收回。"
 krcw_chi_308.a:0 "我们是国际的一员，也是亚洲的一员"
 krcw_chi_308.b:0 "亚洲的事应该由亚洲人决定"
 krcw_chi_310_d1:0 "十一个月后，国际书记处的答复到了南京。南京此前公开说过亚洲的事应由亚洲人决定，巴黎记住了这句话：书记处同意设立“亚洲协调办公室”，但主任由巴黎任命，南京只能推荐，预算由书记处掌握。"
 krcw_chi_310_d2:0 "十一个月后，国际书记处的答复到了南京。周恩来在巴黎代表大会上讲过“同一场革命，不同的道路”，书记处接受了这个说法：“亚洲协调办公室”的主任由南京提名、巴黎任命，预算由双方分担，南京在书记处另外得到一个常任席位。"
 krcw_chi_310_t:0 "巴黎的答复"
 krcw_chi_310_d:0 "十一个月后，国际书记处的答复到了南京。它没有说不，也没有说好：书记处同意设立\"亚洲协调办公室\"，办公室主任由南京提名、巴黎任命，预算由双方分担。\n\n周恩来读完只说了一句：\"他们学会了跟一个平等的伙伴说话——学得很慢，但学会了。\""
 krcw_chi_310.a:0 "接受这个安排"
 krcw_chi_310.b:0 "不够——我们要一个真正的书记处"
 krcw_chi_the_village_school:0 "乡村小学"
 krcw_chi_the_village_school_desc:0 "每个乡一所小学，教员是本地识字的青年，课本是国家印的。第一年入学的孩子里有三分之一是女孩——这在他们母亲的年代是不可想象的。"
 krcw_chi_the_technical_generation:0 "技术的一代"
 krcw_chi_the_technical_generation_desc:0 "工科院校的招生数十年里翻了六倍。这些毕业生不谈革命史，只谈水泥标号与轴承公差——国民党最初对他们不放心，后来发现国家离不开他们。"
 krcw_chi_cooperative_countryside:0 "合作化的农村"
 krcw_chi_cooperative_countryside_desc:0 "土地归农户，农具、水利与销路归合作社。这不是集体农庄——农民可以退出，也确实有人退出——但留下来的人第一次买得起铁犁。"
 krcw_chi_the_constitutional_republic:0 "宪政共和"
 krcw_chi_the_constitutional_republic_desc:0 "国民大会不再只是橡皮图章，县议会的选举也不再只有一张候选人名单。国民党仍然执政，但它现在必须赢。"
 krcw_chi_the_unfinished_reform:0 "改革未竟"
 krcw_chi_the_unfinished_reform_desc:0 "土地法只在半数省份落实，四分之一的县长还是旧军政人员，合作社的账目没人看得懂。周恩来在内部会议上说过一句话：我们赢了战争，现在要赢一场没有敌人的仗。"
 krcw_chi_the_education_question:0 "制定教育方针"
 krcw_chi_the_education_question_desc:0 "扫盲运动教会了三千万人认字，然后呢？国家需要的是能读报纸的农民，还是能算应力的工程师？教育部的两派为此吵了三年——争论的真正内容是：这个国家打算在二十年后变成什么样。"
 krcw_chi_a_school_in_every_township:0 "乡乡有小学"
 krcw_chi_a_school_in_every_township_desc:0 "广度优先：先让每个乡都有一所小学，哪怕教室是借的祠堂、教员只读过初中。二十年后这批孩子会成为工人、士兵和干部。"
 krcw_chi_the_key_universities:0 "重点大学"
 krcw_chi_the_key_universities_desc:0 "深度优先：把有限的资源集中到十二所重点院校，先造出一批能设计机床、桥梁与反应堆的人。农村的小学可以再等十年。"
 krcw_chi_send_them_abroad:0 "派出去"
 krcw_chi_send_them_abroad_desc:0 "每年两千名留学生去巴黎、里昂、曼彻斯特与米兰。国际的实验室对中国学生开放，条件是他们回国后为合作社工作十年。大部分人回来了。"
 krcw_chi_the_new_script:0 "文字改革"
 krcw_chi_the_new_script_desc:0 "简化汉字、推广注音、统一国语读音。反对者说这是砍断文化的根，支持者指出四亿人里三亿不识字，根已经只剩下少数人在用了。"
 krcw_chi_the_cooperative_question:0 "确定合作社的范围"
 krcw_chi_the_cooperative_question_desc:0 "土地法把地分给了农民，可是一户三亩地买不起水泵，也卖不出好价钱。合作社是答案——问题是合作社该走多远：只管买卖，还是连土地一起归公？"
 krcw_chi_marketing_cooperatives:0 "供销合作社"
 krcw_chi_marketing_cooperatives_desc:0 "土地仍然是农户的，合作社只管农具、水利、贷款与销路。农民保留了退出的权利——正因为可以退出，留下来的人才真心投入。"
 krcw_chi_production_cooperatives:0 "生产合作社"
 krcw_chi_production_cooperatives_desc:0 "土地、牲畜与农具一并入股，按劳分配。效率确实更高，机械化也更容易——代价是农民失去了那块写着自己名字的地契，而那张纸是这个政权当初赢得他们的原因。"
 krcw_chi_the_irrigation_decade:0 "水利十年"
 krcw_chi_the_irrigation_decade_desc:0 "淮河、海河、珠江三角洲——十年内建成两千座小型水库与三万公里灌渠。这项工程动用了合作社的全部劳力，也第一次让农民看见了合作的好处。"
 krcw_chi_the_rural_industries:0 "乡村工业"
 krcw_chi_the_rural_industries_desc:0 "在县城兴办小型农机厂、化肥厂和砖瓦厂。设备简陋，但能让农民就近就业，减少向沿海城市的流动。"
 krcw_chi_the_constitutional_question:0 "讨论结束训政"
 krcw_chi_the_constitutional_question_desc:0 "一九四七年宪法规定主权属于国民全体，但国大代表由党推荐，县长由省里委派。讨论何时结束训政。"
 krcw_chi_open_the_ballot:0 "开放选举"
 krcw_chi_open_the_ballot_desc:0 "县议会选举允许非党候选人参选，省议会随后跟上。国民党在第一次真正的选举里赢了四分之三的席位——这个结果让改革派松了一口气，也让保守派更加警惕。"
 krcw_chi_the_guided_assembly:0 "指导下的国民大会"
 krcw_chi_the_guided_assembly_desc:0 "扩大国民大会的权力，但候选人仍由党审核。理由是现实的：这个国家有一个自立的西藏、一个占着台湾的日本和两个虎视眈眈的阵营，现在不是让政权更换的时候。"
 krcw_chi_the_rule_of_law:0 "法治"
 krcw_chi_the_rule_of_law_desc:0 "新的法院系统与旧的军法体系分开，县长不再兼任法官。第一批案子里就有农民起诉合作社、工人起诉国营厂——判决有输有赢，而这正是重点。"
 krcw_chi_the_nanjing_settlement:0 "南京体制"
 krcw_chi_the_nanjing_settlement_desc:0 "南京体制成型：国民党执政，国民大会握有实权，法院独立，经济以合作社为主体。"
 krcw_chi_320_t:0 "教育部的两派"
 krcw_chi_320_d:0 "争论已经三年了。一派拿出数字：四亿人口，三亿文盲，如果不先普及小学，任何工业计划都缺人。另一派也拿出数字：全国能设计一台机床的工程师不到八百人，而第一个五年纲要需要一万两千人。\n\n周恩来听完两边的报告，只说了一句：\"钱只有一份。\""
 krcw_chi_320.a:0 "先普及：乡乡有小学"
 krcw_chi_320.b:0 "先拔高：集中办重点院校"
 krcw_chi_320.c:0 "两头都要，借国际的钱"
 krcw_chi_322_t:0 "一个农民的地契"
 krcw_chi_322_d:0 "安徽的一个村子里，合作社主任要求农户把地契交上来入股。一个姓陈的农民拒绝了——他说土地法是周主席签的，上面写着这块地是他的。\n\n这件事本来只是一桩纠纷，可是记者把它写成了报道，报道传到了南京。现在整个国家都在等一个答案：那张纸到底算不算数？"
 krcw_chi_322.a:0 "地契算数：合作社不得强制入股"
 krcw_chi_322.b:0 "合作化优先：土地入股是方向"
 krcw_chi_322.c:0 "各省自行决定"
 krcw_chi_324_t:0 "如果我们真的选举"
 krcw_chi_324_d:0 "一次没有记录的党内会议。组织部长报告了一项内部调查的结果：如果现在在全国举行不受限制的选举，国民党大约能拿到百分之六十的选票——足以执政，但不足以为所欲为。\n\n会场上沉默了很久。有人说这个数字说明我们应该赶快选，有人说它说明我们绝对不能选。周恩来问了第三个问题：\"如果我们永远不选，二十年后这个数字是多少？\""
 krcw_chi_324.a:0 "现在就选，趁我们还赢得了"
 krcw_chi_324.b:0 "先把经济办好，选举以后再说"
 krcw_chi_324.c:0 "从县一级开始试"
 krcw_chi_326_d1:0 "这个国家已经和一九四九年大不一样。农村合作社办到了大多数县，县议会按期改选，法院受理农民起诉政府的案子。周恩来当年决定趁国民党还赢得了就举行全国选举，国民党至今一次也没有输过。\n\n一个法国记者问周恩来，这算不算社会主义。他想了一会儿说：\"这算中国。\""
 krcw_chi_326_d2:0 "这个国家已经和一九四九年大不一样。农村合作社办到了大多数县，法院受理农民起诉政府的案子。选举从县一级试起，县议会已经改选了几届，全国选举的日期还没有定。\n\n一个法国记者问周恩来，这算不算社会主义。他想了一会儿说：\"这算中国。\""
 krcw_chi_326_t:0 "南京体制"
 krcw_chi_326_d:0 "这个国家已经和一九四九年大不一样。农村合作社办到了大多数县，法院受理农民起诉政府的案子。经济先上去了，选举还没有举行，中执委说等条件成熟再办。\n\n一个法国记者问周恩来，这算不算社会主义。他想了一会儿说：\"这算中国。\""
 krcw_chi_326.a:0 "这就是我们要走的路"
 CHI_krcw_zhou_enlai_desc:0 "黄埔出身的政治部主任，北伐时期邓演达的副手。一九四六年党内竞争中，他联合陈公博的激进派击败顾孟余的温和派，出任国民政府主席兼中执委主席。他主张土地法要彻底、工业要快，同时把顾孟余留在政府里，因为他认为党一分裂，军阀就会回来。"
 CHI_krcw_song_qingling_desc:0 "孙中山的遗孀，在中执委里没有职务。农会、妇女界和海外华侨都认她。她反对和地主妥协，也反对清洗党内温和派——两边都请她表态，她很少开口。"
 CHI_krcw_deng_yanda_desc:0 "临时行动委员会的创始人，一九三〇年代内战中带着\"农工政策\"打回南京。他退出一线后仍掌握黄埔同学会，主张土地归耕者、党指挥枪，对工团党既合作又防备。"
 CHI_krcw_li_jishen_desc:0 "粤系元老，北伐时的总参谋长。他在军队老将和地方实力派中人望很高，主张联合政府和地方自治，是党内最愿意和民主同盟打交道的人。"
 krcw_chi_factions_tt:0 "党内各派影响力：革委会派 [?krcw_chi_f_revcom]　温和派 [?krcw_chi_f_moderate]　孙夫人一系 [?krcw_chi_f_left]　黄埔 [?krcw_chi_f_whampoa]　工团党 [?krcw_chi_f_csp]"
 krcw_chi_the_united_front:0 "统一战线"
 krcw_chi_the_united_front_desc:0 "国民党执政，工团党以小伙伴身份参加政府。两党共用农会和工会，党员很多是双重党籍。"
 krcw_chi_the_party_alone:0 "一党训政"
 krcw_chi_the_party_alone_desc:0 "工团党退出政府，国民党单独执政。中执委的决定不再需要和任何人商量，农会里的工团党员被要求二选一。"
 krcw_chi_coalition_government:0 "联合政府"
 krcw_chi_coalition_government_desc:0 "民主同盟和乡建派各得几个部长席位，国民大会的代表名额向党外开放三分之一。训政期名义上还没结束，实际上已经在松动。"
 krcw_chi_the_factions_in_the_cec:0 "摸清中执委各派"
 krcw_chi_the_factions_in_the_cec_desc:0 "第六次代表大会选出的中执委里，革命委员会派、顾孟余的温和派、孙夫人身边的左派和黄埔同学会各占一块。党外还有工团党，它在统一战线里是小伙伴，在上海和武汉的工会里却是多数。"
 krcw_chi_consult_madame_sun:0 "请孙夫人表态"
 krcw_chi_consult_madame_sun_desc:0 "宋庆龄没有职务，但农会和妇女界只听她的。土地法二读之前，周恩来派人去上海请她公开表态。"
 krcw_chi_keep_gu_mengyu:0 "留住顾孟余"
 krcw_chi_keep_gu_mengyu_desc:0 "上海的商会和银行只认顾孟余。让温和派留在政府里，改革就要慢一点；让他们走，城市就不稳。"
 krcw_chi_the_whampoa_question:0 "确定黄埔同学会地位"
 krcw_chi_the_whampoa_question_desc:0 "邓演达当年建黄埔同学会，是为了让军官听党的。现在同学会自己成了一派，各战区司令都是会员。要么把它收归军委，要么承认它是党内的一个正式派别。"
 krcw_chi_renew_the_united_front:0 "续订统一战线"
 krcw_chi_renew_the_united_front_desc:0 "和工团党续签合作协议：工团党保留两个部长席位，工会和农会继续由两党共管，双重党籍不追究。"
 krcw_chi_the_party_governs_alone:0 "由党单独训政"
 krcw_chi_the_party_governs_alone_desc:0 "革命委员会派的主张：训政时期只能有一个党负责。工团党退出政府，党员限期退出其中一个党。工团党激进派已经在上海的码头上开会了。"
 krcw_chi_open_the_government:0 "开放联合政府"
 krcw_chi_open_the_government_desc:0 "李济深和民主同盟的方案：给民主同盟和乡建派部长席位，国民大会代表向党外开放。训政还没结束，但国民党不再是唯一在政府里的党。"
 krcw_chi_the_seventh_congress:0 "召开第七次代表大会"
 krcw_chi_the_seventh_congress_desc:0 "新的中执委按各派的实际力量改选。哪一派占多数，就决定周恩来之后由谁接班。"
 krcw_chi_factions_cat:0 "党内各派"
 krcw_chi_factions_cat_desc:0 "中执委里的各派和党外的工团党。每一派的影响力在下方显示，拉拢一派通常会得罪另一派。"
 krcw_chi_court_revcom:0 "给革委会派安排省主席"
 krcw_chi_court_revcom_desc:0 "把几个省主席的位置交给革命委员会派的人。土地法在这些省执行得会快一些。"
 krcw_chi_court_moderates:0 "请顾孟余主持财经会议"
 krcw_chi_court_moderates_desc:0 "由顾孟余召集商会、银行和各省财政厅开会，定下一年的预算和物价政策。"
 krcw_chi_court_left:0 "拨款给妇女联合会"
 krcw_chi_court_left_desc:0 "宋庆龄主持的妇女联合会在各县办识字班和托儿所。拨一笔款，孙夫人一系在农村的声音会更大。"
 krcw_chi_court_whampoa:0 "让黄埔同学会推荐师长"
 krcw_chi_court_whampoa_desc:0 "师长以上的任命先经同学会推荐。军官会更听话，军委的权力会更小。"
 krcw_chi_court_csp:0 "和工团党谈工会法"
 krcw_chi_court_csp_desc:0 "工团党要求工会法写明罢工权和厂务委员会。给了，上海的工会会支持政府；不给，李立三那边会压不住激进派。"
 krcw_chi_401_t:0 "孙夫人的答复"
 krcw_chi_401_d:0 "宋庆龄的回信只有一页。她支持土地法按原案通过，不同意给地主留\"自耕田\"的例外；同时她要求中执委保证，温和派的人不会因为投反对票被撤职。"
 krcw_chi_401.a:0 "两条都接受"
 krcw_chi_401.b:0 "按原案通过土地法，温和派的事以后再说"
 krcw_chi_401.c:0 "保留自耕田例外，换顾孟余的票"
 krcw_chi_403_t:0 "同学会的名单"
 krcw_chi_403_d:0 "黄埔同学会把一份名单送到军委：下一轮晋升的四十个人选，全是会员。邓演达在名单上签了字，这让军委很难拒绝。"
 krcw_chi_403.a:0 "照单批准"
 krcw_chi_403.b:0 "批一半，另一半由军委自己挑"
 krcw_chi_403.c:0 "退回名单，晋升一律按考绩"
 krcw_chi_405_t:0 "码头上的大会"
 krcw_chi_405_d:0 "工团党激进派在上海杨树浦召开大会，宣布不接受\"限期退党\"，号召码头和纺织厂准备罢工。工团党正统派的李立三公开表示不支持罢工，但也不支持退党令。"
 krcw_chi_405.a:0 "撤回退党令，只要求工团党退出政府"
 krcw_chi_405.b:0 "和李立三单独谈，把正统派拉回来"
 krcw_chi_405.c:0 "戒严杨树浦"
 krcw_chi_c7_vote_tt:0 "代表大会将投票改选中执委。各派的影响力、此前的接班安排和周恩来支持谁，都会影响结果。"
 krcw_chi_407_t:0 "第七次代表大会"
 krcw_chi_407_d:0 "第七次代表大会改选中执委。各派按自己在省党部和工会里的实力推出候选人，选举结果将决定周恩来之后谁出任国民政府主席。周恩来可以公开支持一份名单，也可以不表态。"
 krcw_chi_407.a:0 "支持革命委员会派和陈公博的名单"
 krcw_chi_407.b:0 "支持顾孟余出任主席"
 krcw_chi_407.c:0 "请宋庆龄出来参选"
 krcw_chi_407.d:0 "提议由李济深主持一个各派共同的名单"
 krcw_chi_407.e:0 "不表态，让代表们自己选"
 krcw_chi_410_d1:0 "周恩来支持的名单拿到了多数。革命委员会派和陈公博的激进派在新的中执委里仍占多数，周恩来之后的国民政府主席将从他们中间产生。"
 krcw_chi_410_d2:0 "代表们没有按周恩来的意思投票。革命委员会派和陈公博的激进派在新的中执委里仍占多数，周恩来之后的国民政府主席将从他们中间产生。"
 krcw_chi_410_t:0 "革命委员会派保住多数"
 krcw_chi_410_d:0 "革命委员会派和陈公博的激进派在新的中执委里仍占多数，周恩来之后的国民政府主席将从他们中间产生。"
 krcw_chi_410.a:0 "继续革命委员会的路线"
 krcw_chi_411_d1:0 "周恩来支持的名单拿到了多数。温和派和行动委员会的代表联合起来，选顾孟余出任国民政府主席。陈公博退出常务委员会，回去主编《革命评论》。"
 krcw_chi_411_d2:0 "代表们没有按周恩来的意思投票。温和派和行动委员会的代表联合起来，选顾孟余出任国民政府主席。陈公博退出常务委员会，回去主编《革命评论》。"
 krcw_chi_411_t:0 "顾孟余出任主席"
 krcw_chi_411_d:0 "温和派和行动委员会的代表联合起来，选顾孟余出任国民政府主席。陈公博退出常务委员会，回去主编《革命评论》。"
 krcw_chi_411.a:0 "顾孟余组阁"
 krcw_chi_412_d1:0 "周恩来支持的名单拿到了多数。农会、妇女界和工会的代表投给了宋庆龄。她第一次担任政府职务。"
 krcw_chi_412_d2:0 "代表们没有按周恩来的意思投票。农会、妇女界和工会的代表投给了宋庆龄。她第一次担任政府职务。"
 krcw_chi_412_t:0 "宋庆龄当选"
 krcw_chi_412_d:0 "农会、妇女界和工会的代表投给了宋庆龄。她第一次担任政府职务。"
 krcw_chi_412.a:0 "孙夫人就职"
 krcw_chi_413_d1:0 "周恩来支持的名单拿到了多数。没有一派拿到多数。各派代表在闭幕前一天谈成了妥协，由李济深出面主持政府。"
 krcw_chi_413_d2:0 "代表们没有按周恩来的意思投票。没有一派拿到多数。各派代表在闭幕前一天谈成了妥协，由李济深出面主持政府。"
 krcw_chi_413_t:0 "李济深主持联合名单"
 krcw_chi_413_d:0 "没有一派拿到多数。各派代表在闭幕前一天谈成了妥协，由李济深出面主持政府。"
 krcw_chi_413.a:0 "各派共同执政"
 krcw_chi_party_front:0 "统一战线"
 krcw_chi_party_front_long:0 "国民党与工团党统一战线"
 krcw_chi_party_revcom:0 "国民党（革委会派）"
 krcw_chi_party_revcom_long:0 "中国国民党（革命委员会派）"
 krcw_chi_party_coalition:0 "联合政府"
 krcw_chi_party_coalition_long:0 "中国国民党与民主同盟联合政府"
 krcw_chi_li_lisan_joins_the_cabinet:0 "请李立三入阁"
 krcw_chi_li_lisan_joins_the_cabinet_desc:0 "工团党正统派的李立三出任劳工部长，负责起草工会法。工团党激进派认为他被收买了。"
 krcw_chi_factory_committees_law:0 "颁布厂务委员会法"
 krcw_chi_factory_committees_law_desc:0 "每家百人以上的工厂设厂务委员会，工人代表与厂方各占一半。上海和武汉的罢工次数下降。"
 krcw_chi_party_cells_in_the_unions:0 "在工会建立党支部"
 krcw_chi_party_cells_in_the_unions_desc:0 "国民党在各工会建立支部，由党支部书记审批工会的罢工决定。工团党激进派转入地下。"
 krcw_chi_the_tutelage_extended:0 "延长训政期"
 krcw_chi_the_tutelage_extended_desc:0 "中执委宣布训政期再延长十年。宪政派抗议，但革命委员会派掌握着多数。"
 krcw_chi_league_ministers:0 "任命民主同盟部长"
 krcw_chi_league_ministers_desc:0 "民主同盟得到教育、司法两部，乡建派得到农业部。"
 krcw_chi_open_the_national_assembly:0 "国民大会向党外开放"
 krcw_chi_open_the_national_assembly_desc:0 "国民大会三分之一的代表名额由党外人士竞选产生。第一次选举中，民主同盟拿下了江浙两省的多数。"
 krcw_chi_plan_commission:0 "国家计划委员会"
 krcw_chi_plan_commission_desc:0 "计划委员会统一分配纲要的钢材、水泥和外汇。各部不再各自争物资，但所有申请都要排队等委员会批。"
 krcw_chi_plan_quotas:0 "计划委员会下达指标"
 krcw_chi_plan_quotas_desc:0 "产量指标由计划委员会直接下达到厂，省建设厅和产业联合会负责执行。工程进度快了，车间里的抱怨也多了。"
 krcw_chi_plan_federations:0 "与产业联合会协商定额"
 krcw_chi_plan_federations_desc:0 "每项指标由计划委员会和相关产业联合会谈定，谈不拢再交国务会议。定额下达得慢，但下达以后很少有人拖着不办。"
 krcw_chi_restore_fushun_collieries:0 "恢复抚顺煤矿"
 krcw_chi_restore_fushun_collieries_desc:0 "抚顺露天矿是鞍钢焦煤的主要来源，日本人撤走前淹了矿坑。矿工联合会和资源委员会的工程师一起排水、更换设备，头一年几乎没有产量。"
 krcw_chi_expand_benxi_steel:0 "扩建本溪钢铁公司"
 krcw_chi_expand_benxi_steel_desc:0 "本溪湖的低磷生铁适合炼特种钢，兵工署一直想要。扩建后的本溪厂专供炮钢和装甲板，民用钢材的份额相应减少。"
 krcw_chi_baotou_steel_base:0 "建设包头钢铁基地"
 krcw_chi_baotou_steel_base_desc:0 "白云鄂博铁矿远离海岸，外国飞机很难够到。在包头建第三个钢铁基地，先要把铁路修到草原上，当地的蒙古王公要求分得矿区收益。"
 krcw_chi_wuhan_iron_and_steel:0 "兴建武汉钢铁公司"
 krcw_chi_wuhan_iron_and_steel_desc:0 "汉阳铁厂是中国最老的钢厂，设备已经用了半个世纪。在青山新建武汉钢铁公司，用大冶的铁矿，钢材走长江运往上下游。"
 krcw_chi_chengdu_chongqing_railway:0 "修建成渝铁路"
 krcw_chi_chengdu_chongqing_railway_desc:0 "清末的保路运动就是为这条铁路而起，四川人等了几十年。铁道部把西南的复员部队编成筑路队，征地由四川省政府负责。"
 krcw_chi_baoji_chengdu_railway:0 "修建宝成铁路"
 krcw_chi_baoji_chengdu_railway_desc:0 "宝成铁路要翻越秦岭，隧道和桥梁比平原线路多得多，造价也高得多。通车以后，四川的粮食和盐可以直接北运关中。"
 krcw_chi_lanzhou_xinjiang_railway:0 "修建兰新铁路"
 krcw_chi_lanzhou_xinjiang_railway_desc:0 "从兰州经河西走廊到迪化的铁路，是新疆和内地之间第一条不靠驼队的通道。新疆省政府支持修路，伊犁和喀什的地方领袖担心移民会跟着铁路来。"
 krcw_chi_lanzhou_refinery:0 "建设兰州炼油厂"
 krcw_chi_lanzhou_refinery_desc:0 "玉门油矿的原油以前要用卡车运出河西走廊，路上损耗很大。铁路通到兰州后在那里建炼油厂，军队和各地拖拉机站都在等这批油。"
 krcw_chi_repair_fengman_dam:0 "修复丰满水电站"
 krcw_chi_repair_fengman_dam_desc:0 "松花江上的丰满大坝是日本人留下的，坝体有裂缝，一半机组被拆走了。修好以后，吉林和哈尔滨的工厂可以恢复全天生产。"
 krcw_chi_sanmenxia_dam:0 "修建三门峡水利枢纽"
 krcw_chi_sanmenxia_dam_desc:0 "黄河水利委员会主张在三门峡筑坝，拦住黄河的洪水和泥沙，同时发电。水库要淹掉渭河下游的许多村庄，陕西省政府要求移民费用全部由中央负担。"
 krcw_chi_state_planning_commission:0 "成立国家计划委员会"
 krcw_chi_state_planning_commission_desc:0 "建设委员会管工程，纲要的指标、物资和资金却没有人统一安排。周恩来提议成立国家计划委员会，由陈公博兼任委员长，委员是各部部长、产业联合会代表和资源委员会的专家。各部失去了自行分配物资的权力，意见很大。"
 krcw_chi_commission_sets_quotas:0 "由计划委员会下达指标"
 krcw_chi_commission_sets_quotas_desc:0 "革命委员会派要求计划委员会直接向工厂下达产量指标，省建设厅和产业联合会只管执行。工程会快一些，工团党说这是把衙门搬进了工厂。"
 krcw_chi_negotiate_quotas:0 "由产业联合会协商定额"
 krcw_chi_negotiate_quotas_desc:0 "工团党和温和派主张每项指标都由计划委员会和相关产业联合会谈定，谈不拢再交国务会议。开会的时间多了，工厂执行时的扯皮少了。"
 krcw_chi_tech_schools:0 "中等技术学校"
 krcw_chi_tech_schools_prod:0 "中等技术学校"
 krcw_chi_technical_schools:0 "创办中等技术学校"
 krcw_chi_technical_schools_desc:0 "工厂缺工程师，更缺看得懂图纸的技术员和工长。在鞍山、武汉、重庆和上海开办中等技术学校，一半学生由工厂选送，学费由产业联合会承担。"
 krcw_chi_engineers_france:0 "留法工程师"
 krcw_chi_engineers_to_france:0 "选派工程师赴法实习"
 krcw_chi_engineers_to_france_desc:0 "三十年前周恩来和一批青年以勤工俭学的名义去了法国，这次去的是冶金、铁路和电力工程师。他们在勒克勒佐和比扬古的工厂实习两年，回国后分到计划委员会和各大工程。"
 krcw_chi_jilin_chemical_complex:0 "兴建吉林化学工业区"
 krcw_chi_jilin_chemical_complex_desc:0 "第二个纲要要补上化工这块短板。在吉林市建染料、化肥和电石厂，用丰满电站的电。化肥先供东北的国营农场，关内的合作社要排队等。"
 krcw_chi_taiwan_support_10_tt:0 "台湾地下组织力量 §G+10§!"
 krcw_chi_amphibious_command_sp:0 "两栖作战司令部"
 krcw_chi_amphibious_command_sp_desc:0 "福州的两栖作战司令部统一指挥陆战队、登陆舰队和担任登陆的陆军师。海军和陆军各出一名副司令，遇事常要军委会裁决。"
 krcw_chi_penghu_plan:0 "澎湖作战计划"
 krcw_chi_penghu_plan_desc:0 "渡海作战的计划已经批准：先取澎湖，再登台湾西岸。登陆部队按计划轮流进行乘船演练。"
 krcw_chi_landing_craft:0 "登陆舰艇"
 krcw_chi_naval_air:0 "海军航空兵"
 krcw_chi_amphibious_command:0 "组建两栖作战司令部"
 krcw_chi_amphibious_command_desc:0 "在福州设立两栖作战司令部，统一指挥海军陆战队、登陆舰队和担任登陆的陆军师。陈绍宽要求由海军主导，陆军将领坚持登陆部队归陆军指挥。"
 krcw_chi_strait_intelligence:0 "建立海峡情报网"
 krcw_chi_strait_intelligence_desc:0 "情报部门以厦门和香港为基地向台湾派遣人员，查明日军港口、机场和炮台的位置。常有人被日本宪兵抓获，每次都会引来东京的抗议。"
 krcw_chi_yingtan_xiamen_railway:0 "修建鹰厦铁路"
 krcw_chi_yingtan_xiamen_railway_desc:0 "修建从江西鹰潭到厦门的铁路，前线的部队和弹药不必再靠公路和沿海航运。铁路要穿过武夷山，由铁道兵和福建民工施工，造价很高。"
 krcw_chi_landing_ships:0 "建造登陆舰艇"
 krcw_chi_landing_ships_desc:0 "江南和马尾船厂推迟部分驱逐舰订单，改为建造坦克登陆舰和机帆登陆艇。海军不满舰队计划被推后，但没有登陆艇，陆军过不了海峡。"
 krcw_chi_fujian_airfields:0 "扩建福建前线机场"
 krcw_chi_fujian_airfields_desc:0 "在福州、晋江和龙溪修建或扩建前线机场，让战斗机的航程覆盖澎湖和台湾西岸。修机场要征用大片农田，福建省政府要求中央拨付补偿。"
 krcw_chi_mobilise_the_junks:0 "征用沿海民船"
 krcw_chi_mobilise_the_junks_desc:0 "登记福建和浙江沿海的机帆船与渔船，编成运输大队，战时由海军调用。渔业合作社要求按日付租金并赔偿损失，否则不肯出船。"
 krcw_chi_naval_aviation:0 "组建海军航空兵"
 krcw_chi_naval_aviation_desc:0 "从空军抽调飞行员组建海军航空兵，专门训练攻击舰船和掩护登陆。空军反对分走飞行员和飞机，海军认为没有自己的飞机就控制不住海峡上空。"
 krcw_chi_assemble_at_xiamen:0 "集结厦门与金门"
 krcw_chi_assemble_at_xiamen_desc:0 "第一波登陆部队、弹药和船只集中到厦门与金门一带，港口加修码头和油库。这样规模的集结瞒不住人，日本一定会向台湾增兵。"
 krcw_chi_frontier_army:0 "东北边防军"
 krcw_chi_frontier_army_desc:0 "东北边防军驻守黑龙江和乌苏里江一线，由林彪指挥。最好的几个师调到了北方，南方各战区为此不满。"
 krcw_chi_frontier_army_2:0 "东北边防军"
 krcw_chi_frontier_army_2_desc:0 "东北边防军驻守黑龙江和乌苏里江一线，各师都经过了冬季野营训练，配发了皮袄和防冻油料。"
 krcw_chi_northern_plan:0 "北方作战计划"
 krcw_chi_northern_plan_desc:0 "收复外东北与外蒙古的作战计划已经完成：机械化军沿中东铁路出击，骑兵和摩托化部队进入蒙古高原。"
 krcw_chi_winter_doctrine:0 "寒区作战"
 krcw_chi_second_mech:0 "第二机械化军"
 krcw_chi_northeast_frontier_army:0 "组建东北边防军"
 krcw_chi_northeast_frontier_army_desc:0 "在哈尔滨组建东北边防军，由林彪任司令，沿黑龙江和乌苏里江布防。陆军要把最好的师调往北方，南方各战区对此不满。"
 krcw_chi_amur_depots:0 "修筑黑龙江沿岸兵站"
 krcw_chi_amur_depots_desc:0 "沿黑龙江和中东铁路修建兵站、仓库和公路，储备一个冬季的粮食、燃料和弹药。工程在冻土上施工，每年只有半年能干活。"
 krcw_chi_cold_weather_training:0 "开展寒区作战训练"
 krcw_chi_cold_weather_training_desc:0 "北调各师轮流在大兴安岭进行冬季野营，学习在零下三十度的气温里行军、宿营和保养武器。冻伤减员不少，军需部门抱怨皮袄和防冻油料的开支。"
 krcw_chi_harbin_arsenal:0 "扩建哈尔滨兵工厂"
 krcw_chi_harbin_arsenal_desc:0 "把沈阳兵工厂的一部分设备北迁到哈尔滨和齐齐哈尔，就近供应北方部队的枪炮和弹药。工厂离边境太近，空军要求同时加修防空阵地。"
 krcw_chi_ma_crisis_up3_tt:0 "莫斯科协定阵营危机度 §G+3§!"
 krcw_chi_work_in_mongolia:0 "开展外蒙古工作"
 krcw_chi_work_in_mongolia_desc:0 "边疆委员会派人联络外蒙古的王公、喇嘛和不满俄国驻军的青年军官，在库伦办地下报纸。蒙古人既怕俄国也防中国，边疆派提醒南京不要许诺太多。"
 krcw_chi_northern_air_bases:0 "在北方修建空军基地"
 krcw_chi_northern_air_bases_desc:0 "在哈尔滨、海拉尔和锡林郭勒修建或扩建机场，让空军能够掩护黑龙江和蒙古高原两个方向。北方的机场冬天要日夜扫雪，维护费用很高。"
 krcw_chi_second_mechanised_corps:0 "组建第二机械化军"
 krcw_chi_second_mechanised_corps_desc:0 "在长春组建第二机械化军，装备法国设计、沈阳组装的坦克和卡车。东北平原适合装甲部队展开，这个军将担任北方作战的主攻。"
 krcw_chi_the_aigun_campaign:0 "宣传《瑷珲条约》国耻"
 krcw_chi_the_aigun_campaign_desc:0 "宣传部在学校、报纸和电台讲述《瑷珲条约》和《北京条约》割去的土地，每年五月定为收复失地宣传月。温和派担心这会把中国提前拖进对俄战争。"
 krcw_chi_northern_operations_plan:0 "制定北方作战计划"
 krcw_chi_northern_operations_plan_desc:0 "参谋本部完成收复外东北与外蒙古的作战计划：机械化军沿中东铁路出击，骑兵和摩托化部队进入蒙古高原。计划要求国际在欧洲同时牵制俄军，巴黎还没有答复。"
 krcw_chi_north_ready_tt:0 "解锁决议§Y索还外东北与外蒙古§!。"
 krcw_chi_asian_intelligence:0 "亚洲局联合情报处"
 krcw_chi_asian_intelligence_desc:0 "南京的联合情报处汇总中国和各兄弟民国查获的俄国与日本特务，统一审讯和交换情报。"
 krcw_chi_asian_freedom_radio:0 "开办对外广播电台"
 krcw_chi_asian_freedom_radio_desc:0 "在沈阳和福州建大功率电台，用俄语、日语和蒙古语向远东广播工会新闻和被禁的书籍。俄国和日本都在干扰，电台的电费和人员开支由亚洲局分担。"
 krcw_chi_ma_crisis_up4_tt:0 "莫斯科协定阵营危机度 §G+4§!"
 krcw_chi_siberian_regionalists:0 "资助西伯利亚区域派"
 krcw_chi_siberian_regionalists_desc:0 "西伯利亚区域派要求伊尔库茨克和鄂木斯克自行管理税收和土地，萨文科夫的总督把他们当作叛乱分子。南京经哈尔滨的俄侨社团秘密资助他们的报纸和合作社。"
 krcw_kor_reserve_divisions_sp:0 "预备役师"
 krcw_kor_reserve_divisions_sp_desc:0 "退伍的光复军和义勇队老兵编入预备役师，每年集训一个月。战时两周内可以动员完毕。"
 krcw_kor_busan_perimeter:0 "修筑釜山与蔚山海防"
 krcw_kor_busan_perimeter_desc:0 "在釜山港和蔚山湾修筑海岸炮台和滩头工事，日军最可能在这里登陆。工事占用了港口扩建的钱，釜山的船厂工会对此不满。"
 krcw_kor_incheon_coast:0 "设防仁川海岸"
 krcw_kor_incheon_coast_desc:0 "仁川离汉城只有一天的路程，日军一旦在这里登陆，首都就守不住。海军在仁川港外布设水雷区，陆军修筑海岸炮台。"
 krcw_kor_reserve_divisions:0 "组建预备役师"
 krcw_kor_reserve_divisions_desc:0 "把退伍的光复军和义勇队老兵编成预备役师，每年集训一个月。金武亭要求预备役归军部直接指挥，国会坚持由各道管理。"
 krcw_kor_southern_air_bases:0 "修建釜山与济州空军基地"
 krcw_kor_southern_air_bases_desc:0 "在釜山和济州岛修建空军基地，战斗机可以在对马海峡上空拦截日本的轰炸机和运输船。飞机要向南京借，飞行员在笕桥受训。"
 krcw_kor_jirisan_plan:0 "预设智异山游击基地"
 krcw_kor_jirisan_plan_desc:0 "在智异山和太白山预先埋藏武器和粮食，训练地方游击队。一旦南部沿海失守，他们要在日军后方坚持到援军到来。"
 krcw_kor_guerrilla:0 "山地游击战"
 krcw_kor_joint_plan_with_nanjing:0 "与南京商定援朝预案"
 krcw_kor_joint_plan_with_nanjing_desc:0 "中朝联合司令部商定：日军一旦登陆，中国军队经鸭绿江和海路在十天内入朝增援。南京要求战时由中国将领担任联合司令，汉城勉强同意。"
 krcw_chi_land_committees_cadres:0 "干部主持的土地委员会"
 krcw_chi_land_committees_cadres_desc:0 "县土地委员会由干部学校派下乡的年轻人主持，照南京的章程丈量和分地。他们认真，但人太少，一个人要管三四个乡。"
 krcw_chi_land_committees_notables:0 "乡绅参与的土地委员会"
 krcw_chi_land_committees_notables_desc:0 "土地委员会吸收了识字的乡绅和旧粮长，他们熟悉每一块田的来历，分地分得快，也分得对自己人有利。"
 krcw_chi_land_committees_associations:0 "农会主持的土地委员会"
 krcw_chi_land_committees_associations_desc:0 "土地委员会由农会直接推选。分地分得彻底，欠租旧债一笔勾销，可是被斗的人家不止地主，连富农和还过债的也算进去了。"
 krcw_chi_land_delivered_idea:0 "土地法已兑现"
 krcw_chi_land_delivered_idea_desc:0 "土地法在大多数省份落实到户，地契换了新的，县土地委员会改成了合作社的办事处。农民第一次相信南京说的话算数。"
 krcw_chi_land_stalled_idea:0 "半途而废的土地法"
 krcw_chi_land_stalled_idea_desc:0 "土地法在沿海几省分完了地，内地的清丈停在半路：有的县换了地契，有的县连田都没量完。农会说南京失信，乡绅说折腾够了。"
 krcw_chi_deepen_land_reform:0 "深化土地改革"
 krcw_chi_deepen_land_reform_desc:0 "土地法既已兑现，就趁热打铁：清退最后一批隐田，把县土地委员会就地改成农村信用社的基础。只有分地分得干净的省份才做得了这一步。"
 krcw_chi_salvage_land_reform:0 "补救土地改革"
 krcw_chi_salvage_land_reform_desc:0 "内地半数的县还没分完地。重新派人下去把清丈做完，这一次不求彻底，只求把已经许下的地契发到农民手里。进度慢，但能稳住人心。"
 krcw_chi_the_land_tribunals:0 "设立土地法庭"
 krcw_chi_the_land_tribunals_desc:0 "分地留下成千上万件纠纷：谁的地界、谁的旧债、谁被错划。设立专门的土地法庭审这些案子，判决一出，乡下才算真正安定下来。"
 krcw_chi_the_village_work_corps:0 "农村工作队"
 krcw_chi_the_village_work_corps_desc:0 "把下乡的干部编成常设的农村工作队，常年驻村，办合作社、调解纠纷、组织水利。土地法兑现得越彻底，愿意留下来的干部越多。"
 krcw_chi_work_corps:0 "农村工作队"
 krcw_chi_the_grain_procurement:0 "征购粮食"
 krcw_chi_the_grain_procurement_desc:0 "分了地的农民要先吃饱，城市和军队也要吃饭。国家按合同向合作社定购余粮，价格由双方谈。征购的指标压得越重，农会的意见越大。"
 krcw_chi2_1_d1:0 "减租保佃令已经通过，两千个县要成立土地委员会，登记租约、核定租额、审理撤佃纠纷。南京发得出章程，发不出足够的人。谁来主持这些委员会，决定了减租在乡下究竟能不能落实。"
 krcw_chi2_1_t:0 "县土地委员会开张"
 krcw_chi2_1_d:0 "土地法已经立法，两千个县要成立土地委员会，丈量田亩、登记地契、分配土地。南京发得出章程，发不出足够的人。谁来主持这些委员会，决定了这场改革在乡下究竟是什么样子。"
 krcw_chi2_1.a:0 "派干部学校的人下乡主持"
 krcw_chi2_1.b:0 "吸收识字的乡绅和旧粮长"
 krcw_chi2_1.c:0 "由农会自行推选"
 krcw_chi2_2_t:0 "清丈开始了"
 krcw_chi2_2_d:0 "干部工作队带着皮尺、罗盘和一本章程进了村。他们对田亩的新旧界限一无所知，只能一块一块地量，一户一户地问。进度慢，但账目干净，没有人能说他们偏袒谁。"
 krcw_chi2_2.a:0 "按章程一个县一个县做"
 krcw_chi2_2.b:0 "抽调更多人，赶在秋收前量完"
 krcw_chi2_3_t:0 "熟门熟路的委员会"
 krcw_chi2_3_d:0 "有了乡绅和旧粮长，清丈快得出奇：他们一眼就看得出哪块地瞒报了、哪笔租是真的。可是分地的时候，他们自家的田总是刚好压在三十亩的线下，被斗的也总是别人家。"
 krcw_chi2_3.a:0 "睁一只眼闭一只眼，先把地分下去"
 krcw_chi2_3.b:0 "派监察院巡回检查组复核"
 krcw_chi2_4_t:0 "农会的清丈"
 krcw_chi2_4_d:0 "农会自己选的委员会丈量得又快又狠。欠租旧债一笔勾销，瞒报的隐田全部挖出来。可是被划成地主、挨斗的人家越来越多，有些县连富农和还清了债的佃户也算了进去。"
 krcw_chi2_4.a:0 "划定成分的标准必须统一"
 krcw_chi2_4.b:0 "放手让农会去做"
 krcw_chi2_5_d1:0 "分地进行到第二季，各地的地主开始反扑。干部工作队人生地不熟，地主就专挑他们下手：告状、造谣，在湘中和赣南有两个工作队员被人打死。省主席们给南京发电报，要求放慢进度。"
 krcw_chi2_5_d2:0 "分地进行到第二季，反扑来自另一个方向。佃农们发现委员会里坐的还是那几户人家，分到手的尽是坡地和薄田，在川北和桂东有农民围了县政府。农会给南京发电报，说土地委员会已经成了乡绅的委员会。"
 krcw_chi2_5_d3:0 "分地进行到第二季，被斗的人家开始反扑。地主和被错划的富农逃进城里告状，有的拉起了民团，在湘西和闽北和农会的人打了起来。省主席们给南京发电报，说再这样下去乡下要出大乱子。"
 krcw_chi2_5_t:0 "地主的反扑"
 krcw_chi2_5_d:0 "分地进行到第二季，各地的地主开始反扑：有的把田契藏起来，有的告到省政府，有的雇人夜里烧了县土地委员会的丈量册。省主席们给南京发电报，要求放慢进度。"
 krcw_chi2_5.a:0 "派保安部队保护土地委员会"
 krcw_chi2_5.b:0 "让省主席们自行处置"
 krcw_chi2_5.c:0 "准许农会组织护田队"
 krcw_chi2_deadline_tt:0 "各省能否按期完成，取决于土地委员会由谁主持、清丈是否经过复核、政局是否稳定。没有完成的省份将使土地法半途而废。"
 krcw_chi2_6_d1:0 "土地法规定的期限还剩一年。沿海几省已经发完新地契，内地还有一半的县没量完田，农会的护田队已经在好几个县和地主的民团对峙。中执委要决定怎么收尾：按期完成，分期分批慢慢做，或者像农会要求的那样发动一场群众运动。"
 krcw_chi2_6_t:0 "最后一年"
 krcw_chi2_6_d:0 "土地法规定的期限还剩一年。沿海几省已经发完新地契，内地还有一半的县没量完田。中执委要决定怎么收尾：按期完成，分期分批慢慢做，或者像农会要求的那样发动一场群众运动。"
 krcw_chi2_6.a:0 "按期完成，各省限期交账"
 krcw_chi2_6.b:0 "分期分批，内地各省延后三年"
 krcw_chi2_6.c:0 "发动群众运动，一个冬天分完"
 krcw_chi2_7_t:0 "新地契"
 krcw_chi2_7_d:0 "最后一个内地省份交了账。全国大多数县都发出了盖着县土地委员会大印的新地契，县委员会改成了合作社的办事处。农民把地契压在炕席底下，这是他们家几代人第一次拥有一张写着自己名字的纸。"
 krcw_chi2_7.a:0 "土地法兑现了"
 krcw_chi2_8_d1:0 "分期分批的办法让内地各省松了口气，可是三年的期限成了没有期限：延后的省份一拖再拖，账始终交不齐。沿海几省分完了地，内地还有大片的县停在清丈的半路上。农会说南京失信，乡绅说这样正好。"
 krcw_chi2_8_t:0 "停在半路的改革"
 krcw_chi2_8_d:0 "期限到了，账还交不齐。沿海几省分完了地，内地还有大片的县停在清丈的半路上：有的换了地契，有的连田都没量完。农会说南京失信，乡绅说折腾够了，两边都不满意。"
 krcw_chi2_8.a:0 "承认改革只做了一半"
 krcw_chi2_salvage_tt:0 "解锁国策§Y补救土地改革§!，可以把半途而废的改革做完。"
 krcw_chi2_9_t:0 "一个冬天"
 krcw_chi2_9_d:0 "群众运动只用了一个冬天就把地分完了。斗争大会开到深夜，欠债一笔勾销，地主的田、牲口和农具当场分掉。乡下的旧秩序被连根拔起，可是被错斗、被多分了成分的人家，很多年里都记着这个冬天。"
 krcw_chi2_9.a:0 "乡村翻了身"
 krcw_chi2_11_d1:0 "第一批农村工作队员的三年期满了。土地法分得干净，合作社办得起来，大半的人续了签，还有新的青年排着队要下乡。工作队成了县以下最可靠的一级。"
 krcw_chi2_11_d2:0 "第一批农村工作队员的三年期满了。改革是补救着做完的，内地许多村子的信任来得很晚，续签的人不多，但愿意留下的都是硬骨头。"
 krcw_chi2_11_t:0 "留下来的人"
 krcw_chi2_11_d:0 "第一批农村工作队员的三年期满了。愿意续签、把家搬到乡下的人数，成了衡量这场改革成败的一把尺子。"
 krcw_chi2_11.a:0 "表彰留下来的，补齐缺额"
 krcw_chi2_12_t:0 "余粮的价钱"
 krcw_chi2_12_d:0 "第一年的征购就碰上了难题。合作社说定购的价格太低，城里的粮店却嫌粮价太高。征购指标压得越重，分到地的农民越觉得刚端上的饭碗又被动了。"
 krcw_chi2_12.a:0 "提高收购价，少征一些"
 krcw_chi2_12.b:0 "指标优先，城市和军队要吃饭"
 krcw_chi_plan_command:0 "计划委员会直接管理"
 krcw_chi_plan_command_desc:0 "重点工程由计划委员会直接管理，厂长对委员会负责，物资按平衡表调拨。工程进度快了，车间里说话的人少了。"
 krcw_chi_plan_bargained:0 "联合会承包的纲要"
 krcw_chi_plan_bargained_desc:0 "各产业联合会按合同承包纲要的指标，超产的部分归联合会自行分配。沿海的老厂干得起劲，内地的新厂常常排不上号。"
 krcw_chi_plan_livelihood:0 "民生优先的纲要"
 krcw_chi_plan_livelihood_desc:0 "纲要后半段的投资转向自行车、缝纫机、暖水瓶和胶鞋。供销社的货架满了起来，兵工署的订单往后排。"
 krcw_chi2_france_tt:0 "巴黎的答复要一个月才到。南京加入清算联盟、周恩来在巴黎讲过的话、法国自己是否在打仗，都会影响公社开出的条件。"
 krcw_chi2_20_d1:0 "新成立的计划委员会第一次统一分配物资，各部报上来的钢材需要量比鞍钢一年的产量多出一大截。各部失去了自行分配物资的权力，正等着看委员会怎么摆平。缺口必须有人来补，或者有人让步。"
 krcw_chi2_20_t:0 "钢材的缺口"
 krcw_chi2_20_d:0 "计划委员会第一次统一分配物资，各部报上来的钢材需要量比鞍钢一年的产量多出一大截。铁道部要钢轨，兵工署要炮钢，建设厅要盖厂房和工人宿舍。缺口必须有人来补，或者有人让步。"
 krcw_chi2_20.a:0 "压缩民用建设，保重点工程"
 krcw_chi2_20.b:0 "向巴黎申请清算联盟贷款买钢"
 krcw_chi2_20.c:0 "调低纲要指标"
 krcw_chi2_21_t:0 "上海的作坊停了工"
 krcw_chi2_21_d:0 "民用建设压缩以后，上海和天津的五金作坊、营造厂接不到钢材，成批地停工。工团党在杨树浦和闸北开会，李立三向劳工部要求给停工的工人发生活费。"
 krcw_chi2_21.a:0 "发生活费，钢材照旧不给"
 krcw_chi2_21.b:0 "重点工程优先，工人另谋出路"
 krcw_chi2_22_t:0 "清算联盟的贷款"
 krcw_chi2_22_d:0 "公社的财政委员会批准了贷款，钢材从勒克勒佐和米兰的工厂装船运来，五年后开始结算。巴黎只提了一个要求：中国的订单优先给国际各国的工厂。"
 krcw_chi2_22.a:0 "钢材先给鞍钢和武汉"
 krcw_chi2_22.b:0 "钢材分给铁路和民用建设"
 krcw_chi2_23_t:0 "巴黎的条件"
 krcw_chi2_23_d:0 "公社的财政委员会同意贷款，但附了条件：法国工程师要进计划委员会，纲要的指标要和各产业联合会协商着定，不能由委员会一家说了算。巴黎说这是国际的规矩，革命委员会派说这是干涉。"
 krcw_chi2_23.a:0 "接受条件"
 krcw_chi2_23.b:0 "拒绝贷款，压缩民用建设"
 krcw_chi2_paris_terms_tt:0 "国策§Y由计划委员会下达指标§!将不再可选；纲要的指标必须与产业联合会协商。"
 krcw_chi2_24_t:0 "调低了的指标"
 krcw_chi2_24_d:0 "计划委员会把钢、煤和水泥的指标都调低了。革命委员会派在中执委说这是向困难低头，有人提议：对外公布的数字照旧，只在内部按新指标执行。"
 krcw_chi2_24.a:0 "公开公布新指标"
 krcw_chi2_24.b:0 "对外的数字照旧"
 krcw_chi2_25_d1:0 "纲要执行到一半，计划委员会派出检查组到各大工程。检查组发现，对外公布的数字和内部执行的指标对不上，各省报上来的产量也有虚报。国务会议要决定后半段由谁来管，还要决定这些数字怎么收场。"
 krcw_chi2_25_d2:0 "纲要执行到一半，计划委员会派出检查组到各大工程。重工业的工程大多按期，可是压缩民用建设的代价也显出来了：城里的住房和日用品紧缺，工人排队买肥皂和胶鞋。国务会议要决定后半段由谁来管。"
 krcw_chi2_25_t:0 "纲要的中期检查"
 krcw_chi2_25_d:0 "纲要执行到一半，计划委员会派出检查组到各大工程。报告摆在国务会议上：重工业的工程大多按期，民用工业和住房远远落后，各部之间扯皮不断。会议要决定后半段由谁来管。"
 krcw_chi2_25.a:0 "由计划委员会直接管理重点工程"
 krcw_chi2_25.b:0 "把后半段承包给各产业联合会"
 krcw_chi2_25.c:0 "后半段转向民生工业"
 krcw_chi2_26_t:0 "鞍钢的厂长"
 krcw_chi2_26_d:0 "计划委员会派到鞍钢的厂长要求工人委员会只管生活福利，生产由他一个人说了算。工人委员会不同意，鞍钢工会给工团党写信求援。"
 krcw_chi2_26.a:0 "厂长负责制"
 krcw_chi2_26.b:0 "厂长和工人委员会共同负责"
 krcw_chi2_27_t:0 "联合会的账本"
 krcw_chi2_27_d:0 "各产业联合会接下了纲要的后半段。沿海的老厂超产了，超出的部分先分给联合会自己的会员厂，内地的新工程常常拿不到设备。西南和西北的省主席联名告到国务会议。"
 krcw_chi2_27.a:0 "设立仲裁委员会裁决"
 krcw_chi2_27.b:0 "合同就是合同"
 krcw_chi2_whampoa_tt:0 "黄埔同学会会不会接受兵工订单被推后，要看同学会的势力和军队是否已经统一指挥。"
 krcw_chi2_28_t:0 "暖水瓶与胶鞋"
 krcw_chi2_28_d:0 "纲要后半段的投资转向自行车、缝纫机、暖水瓶和胶鞋。供销社的货架满了起来，城里的抱怨少了。兵工署的订单被推后，黄埔同学会的将领们在军委会上拍了桌子。"
 krcw_chi2_28.a:0 "民生优先，兵工订单照推"
 krcw_chi2_28.b:0 "留出一部分给兵工署"
 krcw_chi2_plan_central_tt:0 "解锁国策§Y设立重工业部§!。"
 krcw_chi2_plan_devolved_tt:0 "解锁国策§Y产业联合会理事会§!。"
 krcw_chi2_plan_consumer_tt:0 "解锁国策§Y设立轻工业局§!，并可以跳过§Y消费品转向§!。"
 krcw_chi_ministry_of_heavy_industry:0 "设立重工业部"
 krcw_chi_ministry_of_heavy_industry_desc:0 "计划委员会直接管理重点工程以后，鞍钢、本溪、武汉和包头归一个新设的重工业部统管。钢材和设备按平衡表调拨，各省不得截留。"
 krcw_chi_the_federation_councils:0 "产业联合会理事会"
 krcw_chi_the_federation_councils_desc:0 "每个产业联合会成立理事会，厂方、工人委员会和计划委员会各派代表，按合同分配超产部分。内地新厂在理事会里有了固定席位，沿海老厂不再能独占超产。"
 krcw_chi_light_industry_bureau:0 "设立轻工业局"
 krcw_chi_light_industry_bureau_desc:0 "国务院设立轻工业局，统管纺织、日用五金和食品工厂。上海的老作坊被编进地方国营厂，供销社按订单收货。"
 krcw_chi_close_the_first_programme:0 "结算第一个纲要"
 krcw_chi_close_the_first_programme_desc:0 "第一个五年纲要到期，计划委员会向国民大会提交总结报告。报告怎么写，取决于后半段由谁来管：委员会、联合会，还是轻工业局。"
 krcw_chi2_29_d1:0 "计划委员会的总结报告提交国民大会。重工业部管下的钢厂和兵工厂全部按期投产，可是住房和日用品的欠账更大了，工团党的代表在会上一项项念出来。代表们要表决是否批准第二个纲要的草案。"
 krcw_chi2_29_d2:0 "计划委员会的总结报告提交国民大会。联合会承包的部分大多超产，内地的新工程在理事会成立以后才追上来，有几项还拖着。代表们要表决是否批准第二个纲要的草案。"
 krcw_chi2_29_d3:0 "计划委员会的总结报告提交国民大会。钢和铁路没有达到原定的指标，城里的住房和日用品却比纲要开始时宽裕得多。黄埔的代表说国防被耽误了，农会的代表说老百姓第一次买得起胶鞋。代表们要表决是否批准第二个纲要的草案。"
 krcw_chi2_29_t:0 "纲要的总结报告"
 krcw_chi2_29_d:0 "计划委员会的总结报告提交国民大会。钢、煤和铁路的里程都比一九四九年多了几倍，可是住房、日用品和内地的新工程各有欠账。代表们要表决是否批准第二个纲要的草案。"
 krcw_chi2_29.a:0 "批准第二个纲要的草案"
 krcw_chi2_29.b:0 "先还欠账，再谈第二个纲要"
 krcw_chi2_plan_heavy:0 "重工业部"
 krcw_chi2_plan_prod:0 "联合会理事会"
 krcw_chi_zhou_convalescent:0 "主席病休"
 krcw_chi_zhou_convalescent_desc:0 "周恩来在医院和汤山的疗养院里休养，文件每天送去一次。国务会议由代理的人主持，大事还要等他点头，许多事就这样压着。"
 krcw_chi_collective_leadership:0 "集体领导"
 krcw_chi_collective_leadership_desc:0 "中执委常务委员会轮流主持日常工作，国民政府主席和行政院长都有任期。周恩来仍然是党内最有分量的人，但他已经不是唯一能拍板的人。"
 krcw_chi2_40_t:0 "周恩来病倒"
 krcw_chi2_40_d:0 "周恩来在国务会议上晕倒，送进中央医院。医生说是心脏劳损，至少要休养几个月。在他回来之前，国务会议必须有人主持。"
 krcw_chi2_40.a:0 "由常务委员会集体主持，陈公博召集"
 krcw_chi2_40.b:0 "请温和派的顾孟余代理"
 krcw_chi2_40.c:0 "请李济深主持国务会议"
 krcw_chi2_41_t:0 "常务委员会的一个月"
 krcw_chi2_41_d:0 "陈公博召集的常务委员会每天开会，文件批得很快，建设委员会的几个大工程也趁这个月批了下去。邓演达代表黄埔同学会来见常务委员会：主席病着，军队要一个保证，军委的副主席要由同学会推荐的人担任。"
 krcw_chi2_41.a:0 "答应同学会的要求"
 krcw_chi2_41.b:0 "军委人选等主席回来再定"
 krcw_chi2_42_t:0 "顾孟余代理"
 krcw_chi2_42_d:0 "顾孟余代理以后，第一件事是召集上海的商会和银行开会，第二件事是让各省的土地委员会暂停受理新的案子。陈公博带着革命委员会派要求常务委员会出来制止。"
 krcw_chi2_42.a:0 "代理就是代理，由他去做"
 krcw_chi2_42.b:0 "由常务委员会派人列席监督"
 krcw_chi2_43_t:0 "李济深的国务会议"
 krcw_chi2_43_d:0 "李济深主持国务会议以后，请民主同盟和乡建派的人列席讨论预算。党外人士第一次坐进了国务会议的会议室，革命委员会派说这是开了一个不该开的头。"
 krcw_chi2_43.a:0 "让他们列席"
 krcw_chi2_43.b:0 "国务会议只限国民党人"
 krcw_chi2_frail_tt:0 "周恩来能恢复到什么程度，要看他接下来休息得够不够。"
 krcw_chi2_44_t:0 "医生的报告"
 krcw_chi2_44_d:0 "中央医院的医生报告说，周恩来可以回去工作，但心脏受了损伤，再像从前那样一天工作十几个小时，下一次就不一定救得回来。邓颖超请中执委替他定一个工作时间表。"
 krcw_chi2_44.a:0 "照常工作"
 krcw_chi2_44.b:0 "工作减半，日常事务交给副手"
 krcw_chi2_44.c:0 "去庐山疗养三个月"
 krcw_chi2_statute_tt:0 "条例要中执委表决通过。温和派越强、党政越是已经分开，通过的可能越大；革命委员会派越强，越可能被否决。"
 krcw_chi2_45_d1:0 "周恩来回到国务会议，可是谁都看得出他没有恢复：开到下午他就要躺下休息，签字的手在抖。他在第一次会议上提出了继承问题，要中执委在他还能做主的时候把这件事定下来。"
 krcw_chi2_45_d2:0 "周恩来回到国务会议，顾孟余把代理期间的文件一份份交还给他，其中有几份他不会签。第一次会议上他提出了继承问题：这一次国家差一点就换了路线，他要中执委把这件事定下来。"
 krcw_chi2_45_t:0 "主席回来了"
 krcw_chi2_45_d:0 "周恩来回到国务会议，第一次会议就提出了继承问题：这一次他病倒了几个月，国家差一点没有人能拍板。他要中执委在他还能做主的时候，把这件事定下来。"
 krcw_chi2_45.a:0 "起草集体领导条例，交中执委表决"
 krcw_chi2_45.b:0 "由周恩来指定继承人"
 krcw_chi2_45.c:0 "留给第七次代表大会决定"
 krcw_chi2_46_t:0 "集体领导条例"
 krcw_chi2_46_d:0 "中执委表决通过了集体领导条例：常务委员会轮流主持日常工作，国民政府主席和行政院长都有任期，连任不得超过两届。周恩来是第一个按条例办事的人。"
 krcw_chi2_46.a:0 "照条例办"
 krcw_chi2_heir_react_tt:0 "黄埔同学会会不会接受这个人选，要看同学会自己的势力。"
 krcw_chi2_47_t:0 "指定的继承人"
 krcw_chi2_47_d:0 "周恩来决定亲自指定继承人，名字将写进他给中执委的信里。中执委可以不同意，但没有人愿意在主席病后第一次公开驳他的面子。"
 krcw_chi2_47.a:0 "陈公博"
 krcw_chi2_47.b:0 "顾孟余"
 krcw_chi2_47.c:0 "李济深"
 krcw_chi2_48_d1:0 "中执委否决了集体领导条例，革命委员会派说现在不是削弱主席权力的时候。周恩来没有再提，也没有指定继承人。下一任由第七次代表大会改选的中执委决定，各派已经开始在省党部和工会里拉票。"
 krcw_chi2_48_t:0 "留给代表大会"
 krcw_chi2_48_d:0 "周恩来没有指定继承人，也没有立条例。下一任由第七次代表大会改选的中执委决定，各派已经开始在省党部和工会里拉票。"
 krcw_chi2_48.a:0 "让各派去争"
 krcw_chi2_succ_inst_tt:0 "解锁国策§Y常务委员会轮值制§!；§Y委员会长存§!不再可选。"
 krcw_chi2_succ_dauphin_tt:0 "解锁国策§Y培养继承人§!；§Y党政分开§!不再可选。第七次代表大会将倾向于主席指定的人。"
 krcw_chi2_succ_congress_tt:0 "解锁国策§Y筹备代表大会选举§!。"
 krcw_chi_rotating_standing_committee:0 "常务委员会轮值制"
 krcw_chi_rotating_standing_committee_desc:0 "按集体领导条例，中执委常务委员会每半年轮换一次主持人，各派都有人轮到。周恩来把自己的名字排在第一轮的最后。"
 krcw_chi_groom_the_successor:0 "培养继承人"
 krcw_chi_groom_the_successor_desc:0 "主席指定的继承人出任国民政府副主席，分管计划、外交和军委的日常工作。各部的报告先送到他那里，再送主席。"
 krcw_chi_prepare_the_congress_election:0 "筹备代表大会选举"
 krcw_chi_prepare_the_congress_election_desc:0 "中执委组织部重新核定各省党部和工会的代表名额，第七次代表大会的代表由差额选举产生。各派都派人下去争名额。"
 krcw_chi_the_succession_settled:0 "继承问题的安排"
 krcw_chi_the_succession_settled_desc:0 "继承的办法定下来了，接下来要看它能不能经得住周恩来不在场的那一天。"
 krcw_chi2_49_d1:0 "周恩来在中山陵前主持了国民革命纪念日的仪式，这是他病后第一次公开露面。站在他身后的是常务委员会的全体委员，轮值主席站在他旁边。报纸第二天登出的照片里，没有一个人站在他的位置上。"
 krcw_chi2_49_d2:0 "周恩来在中山陵前主持了国民革命纪念日的仪式，这是他病后第一次公开露面。他指定的继承人站在他身边半步之后，替他念了一半的讲稿。各省的代表都看清楚了将来要向谁报告。"
 krcw_chi2_49_d3:0 "周恩来在中山陵前主持了国民革命纪念日的仪式，这是他病后第一次公开露面。站在他身后的各派领袖排成一排，谁也没有站得更靠前。下一任是谁，要等第七次代表大会的选票。"
 krcw_chi2_49_t:0 "中山陵前"
 krcw_chi2_49_d:0 "周恩来在中山陵前主持了国民革命纪念日的仪式，这是他病后第一次公开露面。站在他身后的人，就是这个国家下一步的样子。"
 krcw_chi2_49.a:0 "革命尚未成功"
 CHI_krcw_mao_zedong:0 "毛泽东"
 CHI_krcw_mao_zedong_desc:0 "湖南湘潭人，毕业于湖南第一师范，受业于杨昌济。一九一八年他和蔡和森、萧子升等人在长沙发起新民学会，第二年主编《湘江评论》，二十年代在广州主持过农民运动讲习所。一九三二年秋收起义被赵恒惕的省军镇压，报纸登了他的死讯，其实他受了伤，被农民抬出浏阳山区，辗转到了闽赣起义区，为邓演达的临时行动委员会组织农会，后来随革命回到南京。他是党内最坚持赎买分田、主张农会压过县里乡绅的人，因此和顾孟余的温和派不和，也常和陈公博的建设委员会争城乡的先后。"
 krcw_chi_500_t:0 "湖南农会的报告"
 krcw_chi_500_d:0 "土地法辩论前夕，一份湖南各县农会的调查报告送到了立法院，署名毛泽东。报纸在一九三二年秋收起义失败后登过他的死讯，他其实活了下来，这些年一直在闽赣和湖南组织农会。报告说，只减租不分田，佃户还是不敢和地主争，农会撑不过一个收租季。"
 krcw_chi_500.a:0 "把报告印发全体立法委员，请他列席土地委员会。"
 krcw_chi_500.b:0 "交土地委员会存档备查。"
 krcw_chi_501_d1:0 "南京准许湖南农会自行武装以后，乡下最硬的是农会的枪。毛泽东请求回湖南督办县土地委员会，他说枪要听委员会的，委员会要听农民大会的。温和派和黄埔同学会都不愿看到一支不归军委管的武装再多一个带头人。"
 krcw_chi_501_d2:0 "南京放缓了湖南的土地法，改和乡绅协商。毛泽东请求回湖南督办县土地委员会，他说协商下去，丈量的就是乡绅自己。温和派认为协商才开了头，他这一去就谈不下去了。"
 krcw_chi_501_t:0 "回湖南去"
 krcw_chi_501_d:0 "湘中的地主烧了丈量册以后，保安部队已经开到了县里。毛泽东请求回湖南督办县土地委员会，他说部队一撤，委员会还得听祠堂的。温和派担心他一到湖南，县里的事就由农会说了算。"
 krcw_chi_501.a:0 "派他回湖南督办。"
 krcw_chi_501.b:0 "留他在南京，土地委员会照章办事。"
 krcw_chi_502_t:0 "湖南的征粮指标"
 krcw_chi_502_d:0 "建设委员会按武汉新厂的口粮定了湖南的征粮指标。毛泽东从长沙给中执委发电报，说刚分到地的农户交了这么多就留不下种粮。陈公博回答，工厂开不了工，土地法的赎买债券也没有钱兑付。周恩来要在两人之间表态。"
 krcw_chi_502.a:0 "支持毛泽东，降低湖南的指标。"
 krcw_chi_502.b:0 "支持陈公博，指标不变。"
 krcw_chi_503_t:0 "《湘江评论》重印"
 krcw_chi_503_d:0 "长沙的书店重印了一九一九年的《湘江评论》，周世钊等新民学会的老会员请毛泽东写了序。创刊宣言里那句“世界什么问题最大？吃饭问题最大”又在湖南的农会里传开了。温和派的报纸说，这是拿三十年前的学生刊物给土地法造势。"
 krcw_chi_503.a:0 "由书店去印。"
