l_simp_chinese:
# krcw: years paced
 krcw_late.1.t:0 "第二公社运动"
 krcw_late.1.d:0 "一九五四年五月，巴黎的街头重新出现了路障。学生、青年工人与激进的市政委员要求"工人自治"、"直接民主"和"拒绝官僚"。第一公社的老人们不知道该感到骄傲还是恐惧。"
 krcw_late.1.a:0 "官僚化是个问题"
 krcw_late.1.b:0 "秩序是第一位的"
 krcw_late.1.c:0 "让他们试试看"
 krcw_late.2.t:0 "工人宪章"
 krcw_late.2.d:0 "代表大会通过了新的《工人宪章》：企业委员会任期两年，不得连任三届；大区委员会的代表由抽签产生；一切官僚职位都可以被罢免。改革派说这是回到了第一公社的精神，保守派说这是向混乱投降。"
 krcw_late.2.a:0 "新宪章万岁"
 krcw_late.3.t:0 "技术官僚的胜利"
 krcw_late.3.d:0 "公安部逮捕了"第二公社"的组织者，巴黎市政厅换上了新的班子——他们不是从工厂里选出来的，而是从理工学院毕业的。第一公社交给了计划局。"
 krcw_late.3.a:0 "这不是我们想要的公社"
 krcw_late.4.t:0 "公社的裂痕"
 krcw_late.4.d:0 "意大利、西德与比利时的激进派拒绝承认巴黎代表大会的权威，宣布退出第三国际。他们说第一公社已经死了，现在是建立"真正的第三国际"的时候了。"
 krcw_late.4.a:0 "我们失去了他们"
 krcw_late.10.t:0 "周恩来去世"
 krcw_late.10.d:0 "一九五四年一月八日，总理周恩来在南京病逝。他主持政府二十六年，见证了中国从战争废墟走向工业化的全过程。举国缟素，但每个人都在问同一个问题：谁来接替他？"
 krcw_late.10.a:0 "他留下了一个新中国"
 krcw_late.11.t:0 "南京之春"
 krcw_late.11.d:0 "四月五日，南京街头贴满了大字报："要民主，不要独裁"、"宪法不是一纸空文"、"让人民选择自己的代表"。学生与工人要求开放党禁、实行真正的选举。中央执行委员会陷入了僵局。"
 krcw_late.11.a:0 "改革是唯一的出路"
 krcw_late.11.b:0 "维持现状"
 krcw_late.12.t:0 "多党制宪法"
 krcw_late.12.d:0 "一九五四年的新宪法允许"在宪法范围内"组建政党。第一批登记的有社会民主党、农民党和青年党。国民党的老人们说，这就是他们二十六年前想要的东西。"
 krcw_late.12.a:0 "新时代开始了"
 krcw_late.24.t:0 "沙皇归来"
 krcw_late.24.d:0 "一九五四年，克里姆林宫的政变把弗拉基米尔·基里洛维奇大公推上了宝座。他宣布自己为全俄罗斯沙皇，解散了国家杜马，恢复了贵族头衔。西方的报纸说这是"二十世纪的复辟"。"
 krcw_late.24.a:0 "历史倒退了"
 krcw_late.33.t:0 "五大湖的蘑菇云"
 krcw_late.33.d:0 "一九五四年八月，底特律的导弹发射井打开了。二十分钟后，芝加哥化为火海；四十分钟后，纽约消失在闪光中。第三次世界大战打了六个小时，人类文明的三分之一化为灰烬。"
 krcw_late.33.a:0 "世界末日"
 krcw_late.40.t:0 "东京的民主化"
 krcw_late.40.d:0 "一九五四年，天皇发表诏书，宣布放弃神权，承认议会主权。第一次真正的普选在一九五四年举行，社会党赢得了众议院的多数席位。"
 krcw_late.40.a:0 "民主的胜利"
 krcw_late.50.t:0 "最后的杜巴"
 krcw_late.50.d:0 "一九五五年冬天，德里举行了最后一次杜巴。辛迪亚宣布解散土邦联盟，王公们的私产收归国有，爵位不再世袭。红堡的台阶下，一百零一头大象最后一次列队经过。"
 krcw_late.50.a:0 "旧时代结束了"
 krcw_late.80.t:0 "计划局的统治"
 krcw_late.80.d:0 "一九五五年，巴黎的代表大会被无限期推迟。国家计划局宣布，"经济建设需要效率，不需要争论"。第一公社的最后一盏灯熄灭了。"
 krcw_late.80.a:0 "这是背叛"
 krcw_late_romanov_restoration:0 "罗曼诺夫复辟"
 krcw_late_romanov_restoration_desc:0 "沙皇归来了，但这不是一八一四年。"
 krcw_late_technocratic_turn:0 "技术官僚转向"
 krcw_late_technocratic_turn_desc:0 "效率第一，民主第二。"
 krcw_late_technocratic_dictatorship:0 "计划局独裁"
 krcw_late_technocratic_dictatorship_desc:0 "第一公社死了。"
