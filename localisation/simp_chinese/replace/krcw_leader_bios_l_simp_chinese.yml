 FRA_krcw_frachon_desc:0 "§Y出生：§!§g1893年5月13日，法兰西共和国卢瓦尔省勒尚邦-弗热罗勒§!\n§Y所属派别：§!§g劳动总联合会（CGT）多数派§!\n§Y经历：§!§L弗拉雄生在圣艾蒂安附近的工业小镇，父亲是矿工。他十三岁进冶金厂当学徒，很快加入了当地的工会和工团主义青年小组。大战期间他应征入伍，战败后回到卢瓦尔，内战中在圣艾蒂安一带组织工人武装守卫工厂和铁路。\n公社建立后，他一直在卢瓦尔和里昂的冶金工会里工作，以能把罢工坚持到底、又懂得及时收场出名。他是工团主义者中同情无政府派的一翼，多次在联合会内部充当调停人。第二次世界大战期间他负责军工生产的劳动调配，1946年当选劳动总联合会总书记，成为公社和第三国际的实际领导人。\n他现在面对两件事。一是国际书记处的决议该不该约束成员国：马蒂要一个能下命令的中心，莫纳特要干脆取消书记处，弗拉雄站在两者之间。二是阿尔及尔的代表大会要求公社兑现1921年“废除一切殖民地”的宣言。联合会机关越来越臃肿，而他本人就是在这套机关里升上来的。§!"
 FRA_krcw_de_gaulle_desc:0 "§Y出生：§!§g1890年11月22日，法兰西共和国北方省里尔§!\n§Y所属派别：§!§g国民法兰西流亡派§!\n§Y经历：§!§L戴高乐出身里尔一个信奉天主教、倾向保王的家庭。1912年他从圣西尔军校毕业，分到贝当上校指挥的第33步兵团。大战中他在迪南负伤，1916年在凡尔登再次负伤并被德军俘虏，后来从战俘营逃出，回国时已经小有名气。\n1919年战败和随后的革命之后，他随政府和军队退到阿尔及尔，成为贝当身边“青年近卫”军官集团的首领，以军事理论和讲课出名。流亡初期议会的混乱让他接受了法兰西行动的主张，认为共和制救不了法国。此后二十年，他在阿尔及尔做的一切都是为了收复本土。\n1942年国民法兰西在大战中崩溃，阿尔及尔被公社接收，戴高乐带着一小批军官流亡海外。他现在没有军队，也没有领土，但许多流亡的法国人仍把他看作唯一的领袖。莫斯科不喜欢他的傲慢和他对俄国人的不信任，可是如果公社有一天在战争中倒下，协定找不到第二个能让法国人服从的人。§!"
 FRA_krcw_marty_desc:0 "§Y出生：§!§g1886年11月6日，法兰西共和国东比利牛斯省佩皮尼昂§!\n§Y所属派别：§!§g中央集权派（书记处派）§!\n§Y经历：§!§L马蒂出生在佩皮尼昂，进了海军的机械学校，此后在舰上当机械师。1919年4月，他所在的鱼雷艇“普罗泰”号在黑海参与干涉俄国内战，他策划兵变，事泄被捕，被判二十年苦役。本土随即战败，革命爆发，他从监狱里被放了出来。\n内战期间他在地中海沿岸的港口组建水兵委员会，后来长期在公社的国际联络部门工作。1936年伊比利亚革命时，他以国际纵队总政委的身份驻在阿尔巴塞特，负责志愿者的训练和纪律，对逃兵和可疑分子处置严厉，在纵队里名声很坏。第二次世界大战中他在德国前线主管部队的政治工作。\n他是“干部东去”和“有约束力的书记处”两条路线的提出者：国际需要一个能下命令的中心，命令下了就必须执行，按多数票裁决的话，多数票在法国手里。他的支持者在老一代干部和军队的政工系统中。对手说他把每一次分歧都当成叛变处理，工团主义者和无政府派都不信任他。§!"
 FRA_krcw_monatte_desc:0 "§Y出生：§!§g1881年1月15日，法兰西共和国上卢瓦尔省蒙莱§!\n§Y所属派别：§!§g革命工团主义老派（“只有联合会”派）§!\n§Y经历：§!§L莫纳特出身上卢瓦尔的农村，读完中学后在学校当过学监，后来在巴黎的印刷厂做校对工。1904年他加入劳动总联合会，1906年库里耶尔矿难后因参加抗议被捕，1908年为躲避逮捕一度流亡瑞士。1909年他创办《工人生活》，这份刊物成了革命工团主义的理论阵地。1914年他反对工会与政府的“神圣联盟”，辞去联合会的职务，不久被征召上了前线。\n革命后他是“正统派”的主要组织者，把中间派和极端派拉到一起，赢得1926年的选举，出任公社主席，此后十年靠同无政府派的脆弱联盟维持执政。1936年的选举后他离开了主席职位，回到联合会和刊物的工作。\n他快七十岁了，每次巴黎大会仍然到场，坐在后排。他是“取消书记处”一派的理论来源：党和国家都是资产阶级的形式，国际只应该是各国产业联合会之间的直接协议。年轻的激进派尊敬他，书记处的干部则认为照他的方案，国际在战时将无人指挥。§!"
 ENG_krcw_wintringham_desc:0 "§Y出生：§!§g1898年5月15日，英格兰林肯郡格里姆斯比§!\n§Y所属派别：§!§g职工大会（TUC）多数派§!\n§Y经历：§!§L温特林厄姆生在格里姆斯比一个律师家庭，在格雷沙姆学校读书，1915年考进牛津大学贝利奥尔学院。1916年起他在皇家飞行队当机械师和摩托车传令兵，战败后回到牛津，开始参加工人运动。\n1925年革命时他在伦敦码头区参加了战斗，此后在联合会的军事委员会里研究民兵和人民战争的组织方法，写了许多关于步兵战术的文章。1936年伊比利亚革命爆发，他带不列颠志愿营去了西班牙，在哈拉马河负伤。回国后他进入职工大会领导层，第二次世界大战期间主持本土民兵的训练和大西洋运输的组织，战后当选总书记。\n他主张不列颠做国际的海上支柱：舰队守住大西洋航线，向加拿大和美利坚联合工团输送援助。在党内他以容忍不同意见出名，大会上的反对派很少受到追究。他坚持不指定接班人，说那是国王的做法，因此霍纳、加拉赫和威尔金森三派都在为他之后的局面做准备。§!"
 ENG_krcw_bevan_desc:0 "§Y出生：§!§g1897年11月15日，威尔士蒙茅斯郡特雷德加§!\n§Y所属派别：§!§g南威尔士矿工联合会§!\n§Y经历：§!§L比万是特雷德加一个矿工家庭十个孩子中的一个，父亲大卫是矿工，也是浸礼会信徒。他十三岁离开学校，在蒂-特里斯特煤矿下井，十九岁当选矿工分会主席。1919年他拿到南威尔士矿工联合会的奖学金，去伦敦的中央劳工学院读书，在那里读了马克思和丹尼尔·德莱昂。\n他回到特雷德加时，南威尔士正在罢工和失业中挣扎。革命期间他在蒙茅斯郡组织矿工纠察队，此后一直在矿工联合会和地方议会里工作。不列颠联盟制定“四方宪章”时，那条按工会会员数而非人口分配席位的规则是他推动的，组织率最高的威尔士矿工因此在大会里占了较多席位。\n他说话尖锐，从不掩饰自己代表的是南威尔士：联盟的政策首先要看它能不能改善矿区的住房和医疗。英格兰各郡的代表认为他把地方利益放在全国之上。他和霍纳出自同一个联合会，在资源分配上却经常争吵。§!"
 ENG_krcw_cole_desc:0 "§Y出生：§!§g1889年9月25日，英格兰剑桥§!\n§Y所属派别：§!§g行会社会主义派§!\n§Y经历：§!§L柯尔生在剑桥，在伦敦西郊的伊灵长大，先后就读于圣保罗公学和牛津贝利奥尔学院，1908年加入费边社，毕业后留在牛津任教。1915年他参与创建全国行会联盟，主张每个产业由本行业的工人组成全国行会自己管理。大战期间他为机械工人联合会做研究，和车间代表运动走得很近，也因此和费边社的老一代闹翻。\n革命后他在职工大会的研究部门工作，写了大量关于产业组织和工资制度的书，妻子玛格丽特也是研究部的骨干。他长期担任霍纳派的理论顾问，第二次世界大战后成为该派的副手。\n他的方案是让每个产业组成自治的全国行会，行会之间按契约交易，国家只负责仲裁。他自己承认，这套办法等于建立一个没有资本家的市场，行会之间的价格和竞争怎样管理还没有答案。费边派嫌他太激进，车间代表运动嫌他太像教授。他患糖尿病多年，工作量却从未减少。§!"
 ENG_krcw_edward_viii_desc:0 "§Y出生：§!§g1894年6月23日，英格兰萨里郡里士满白屋§!\n§Y所属派别：§!§g温莎王室（流亡朝廷）§!\n§Y经历：§!§L爱德华是约克公爵，也就是后来的乔治五世的长子，在奥斯本和达特茅斯的海军学院受训，1910年受封威尔士亲王，后进入牛津莫德林学院。大战爆发后他加入掷弹兵近卫团，被安排在参谋部门，多次请求上前线都没有获准。\n1925年革命后，他随王室和政府流亡渥太华。1936年乔治五世在加拿大病逝，他继承王位，在渥太华的基督教堂大教堂加冕，是第一个没有在威斯敏斯特加冕的英国国王。1938年，他和流亡政府决定出兵新英格兰恢复美国宪政，加拿大远征军在奥尔巴尼和布法罗被工团民兵击溃，国内随即发生征兵危机和总罢工，金斯顿驻军哗变。1940年他第二次出逃，带着王室去了澳大利亚。\n他现在是墨尔本流亡朝廷的国王，仍然自称大不列颠的君主。澳大利亚和新西兰的议会支持王室，但不愿为收复伦敦出兵，孟席斯政府对他的任何冒险都有所保留，加拿大人则把干涉失败算在他头上。莫斯科协定答应过，如果不列颠在战争中投降，就让他回到白金汉宫，条件是政府由协定认可的人组成。§!"
 ENG_krcw_gallacher_desc:0 "§Y出生：§!§g1881年12月25日，苏格兰伦弗鲁郡佩斯利§!\n§Y所属派别：§!§g车间代表运动§!\n§Y经历：§!§L加拉赫生在佩斯利，父亲是爱尔兰移民，在他很小的时候去世，母亲靠做洗衣工养家。他十岁起打零工，后来在格拉斯哥的工厂当黄铜精整工，年轻时参加过禁酒运动和社会民主联盟。大战期间他领导克莱德工人委员会反对《军需法》，组织罢工抵制战时劳动管制，1916年因在报上发表反战文章被捕入狱。\n出狱后他进入格拉斯哥行业委员会。1925年革命时，他把这个委员会改造成一支能作战的工人民兵，控制了克莱德河两岸的船厂和码头。革命后他一直不肯在联合会的办公楼里办公，坚持到车间和船厂里开会，是代表大会里最能把互相看不上的联合会说服到同一份决议上的人。\n他主张把生产的决定权还给车间：计划由厂级投票通过，厂长由车间选举，可以随时罢免。他也主张宪法必须写成文字，包括允许反对革命的候选人参选的条款。克莱德河的年轻车间代表拥护他，计划局和各郡的行政官认为他的办法会让产量下降。§!"
 ENG_krcw_horner_desc:0 "§Y出生：§!§g1894年4月5日，威尔士格拉摩根郡梅瑟蒂德菲尔§!\n§Y所属派别：§!§g霍纳派（南威尔士矿工）§!\n§Y经历：§!§L霍纳是梅瑟蒂德菲尔一个铁路工人的儿子，早年当过福音派的平信徒传道人，后来去朗达河谷下井。他追随基尔·哈迪加入独立工党，又成为诺亚·阿布利特的学生，接受了马克思主义和工团主义。大战期间他拒绝服兵役，逃到爱尔兰，1916年参加了詹姆斯·康诺利的爱尔兰公民军和复活节起义，回来后坐了牢。\n革命中他先是组织起义的士兵，后来作为代表进入加的夫公社，给阿布利特当秘书。革命胜利后他重组全国少数派运动，受到汤姆·曼的器重，1931年当选威尔士地区主席，以善于谈判出名，人称“谈判者”。此后他长期担任矿工联合会书记，第二个十年计划里“住宅、供暖、自来水、学校”那份草案是他起草的。\n他反对核计划，理由只有一条：那笔钱要从住宅计划里挪出来。他的基础是全国组织最严密的矿工。他不信任伦敦的机关，也不喜欢克莱德河那些嫌他太慢的年轻人。他是温特林厄姆之后的三个候选人之一。§!"
 ENG_krcw_strachey_desc:0 "§Y出生：§!§g1901年10月21日，英格兰萨里郡吉尔福德§!\n§Y所属派别：§!§g计划派§!\n§Y经历：§!§L斯特雷奇是《旁观者》周刊主编约翰·圣洛·斯特雷奇的儿子，在伊顿公学和牛津莫德林学院读书，没有拿学位就离开了。他年轻时做记者，一度出入奥斯瓦尔德·莫斯利的圈子。1925年革命时莫斯利逃往加拿大，斯特雷奇留了下来，和他断绝了来往。\n革命后他在职工大会的经济研究部门工作，以写作通俗的经济学小册子出名，后来进入计划局，第二次世界大战期间负责军工和运输的统计。战后他主持内阁的科学与计划委员会，是联盟里少数能同时和工程师、经济学家打交道的政治人物。\n剑桥那份三页的备忘录由他执笔。前两页讨论技术上是否可行和要花多少钱，第三页的问题“如果我们能做，我们要不要做”是他自己加上的。他在内阁给出的答案是不要：他计算过一件核武器在一座岛上能保护什么，结论是岛国没有纵深可以还击，只能抢先动手。海军和支持核计划的人认为他在拖后腿，许多老工团主义者也忘不了他年轻时跟过莫斯利。§!"
 ENG_krcw_strachey_land_desc:0 "§Y出生：§!§g1901年10月21日，英格兰萨里郡吉尔福德§!\n§Y所属派别：§!§g计划派（农业联合会）§!\n§Y经历：§!§L斯特雷奇是《旁观者》周刊主编约翰·圣洛·斯特雷奇的儿子，在伊顿公学和牛津莫德林学院读书，没有拿学位就离开了。他年轻时做记者，一度出入奥斯瓦尔德·莫斯利的圈子。1925年革命时莫斯利逃往加拿大，斯特雷奇留了下来，和他断绝了来往。\n革命后他在职工大会的经济研究部门工作，后来进入计划局。第二次世界大战期间不列颠的粮食进口时断时续，他被派去主管粮食配给和农业生产，从此把全部精力放在土地问题上。\n郡农业联合会方案是他主持的：每个郡的农业工人和小农组成联合会，机器和种子统一调配，播种、收割和轮作由联合会在当地决定，伦敦只定收购价和交售量。他处理土地问题像处理工程问题，只坚持一条原则，决定什么时候播种的人必须在田里。这套办法让不列颠的粮食产量恢复过来。农业工人工会要求把土地一次收归公有，计划局嫌各郡自行其是，佃农出身的小农又担心联合会迟早会收走他们的地。§!"
 ENG_krcw_wilkinson_desc:0 "§Y出生：§!§g1891年10月8日，英格兰曼彻斯特乔尔顿-昂-梅德洛克§!\n§Y所属派别：§!§g联邦派（新城镇计划）§!\n§Y经历：§!§L威尔金森的父亲是曼彻斯特的保险推销员，卫理公会信徒，家境清贫。她十六岁加入独立工党，靠奖学金在1910年进入曼彻斯特大学学历史。毕业后她为全国妇女选举权协会做组织工作，1915年起担任合作社职员工会的全国组织员，大战期间在曼彻斯特组织店员和女工的罢工。\n革命后她长期负责联盟的教育工作，管过工人夜校和地方学校的改组，后来成为西尔维娅·潘克赫斯特的副手。潘克赫斯特不愿再担任领导职务后，她成为联邦派指定的接班人，人们叫她“红色艾伦”。第二次世界大战后她主持新城镇计划，在老工业区周围建造住宅、诊所、学校和公共浴室。\n她主张把工厂交给会计、工程师和统计员管理，车间大会不再表决生产事务，理由是住宅和日用品要靠效率造出来。这让她和加拉赫的车间代表运动势不两立。她工作时间极长，烟不离手，哮喘一直没有好过，身边的人都担心她的身体。§!"
 ITA_krcw_di_vittorio_desc:0 "§Y出生：§!§g1892年8月11日，意大利王国福贾省切里尼奥拉§!\n§Y所属派别：§!§g意大利劳动总联合会（劳总）§!\n§Y经历：§!§L迪·维托里奥的父亲是普利亚的雇农，在他十岁时去世，他因此辍学，接替父亲下田干活。十二岁时他用自己的工钱买了一本词典自学，先接触无政府主义，十五岁参与创办切里尼奥拉的社会主义青年俱乐部，随后加入当地的农业工会。大战爆发时他在墨索里尼的《意大利人民报》上撰文支持参战，上前线负了伤。\n战后的意大利内战中，他转向共和派和社会主义者，也因此与家乡普利亚疏远。他离开以农村为基础的意大利工团联盟，加入以城市工人为主、愿意同温和派妥协的劳动总联合会，并反对朱列蒂与墨索里尼的结盟。“第二次复兴运动”之后，他把大多数工会团结到自己身后，成为社会共和国的领导人。第二次世界大战中社会共和国统一了半岛，1943年又渡海推翻阿尔巴尼亚的索古国王，把范·诺利请了回去，一年后被南斯拉夫和希腊的军政府赶回海对岸，索古复位。\n他在南方雇农中威望最高，主张土地改革优先于工业化。他的难题来自两方面：帕里一派要求在的里雅斯特和伊斯特拉问题上动武，国际书记处要求意大利接受仲裁；诺利的阿尔巴尼亚流亡者要罗马给他们武器，希腊品都斯山区游击队的补给船也从意大利的港口出发。§!"
 ITA_krcw_gabriotti_desc:0 "§Y出生：§!§g1883年4月26日，意大利王国翁布里亚卡斯泰洛城§!\n§Y所属派别：§!§g劳总行政派§!\n§Y经历：§!§L加布里奥蒂生在翁布里亚北部的卡斯泰洛城，年轻时在当地的天主教合作社和农民互助会里做事。大战期间他以军官身份在前线服役，战后回到上台伯河谷，组织烟草和农业工人。\n意大利内战以后，他离开天主教组织，加入劳动总联合会，在翁布里亚和马尔凯管理工厂委员会和合作社的账目。他把工厂委员会当作行政机关来经营：委员会负责收税、修路和办学校，账目每季度公开一次。第二次世界大战中翁布里亚是前线的后方，他负责组织运输和征集粮食，也带过一支山地游击队。\n他的主张在意大利不受欢迎，但很实用：共和国的问题出在执行上，没有人收税，没有人修路，火车不准时。革命的道理交给别人去讲，他要的是一份能执行的预算和一支能干活的公务员队伍。讲纲领的理论家嫌他没有思想，南方的雇农领袖嫌他只关心中部，他在罗马也没有自己的派系。§!"
 ITA_krcw_gronchi_desc:0 "§Y出生：§!§g1887年9月10日，意大利王国比萨省蓬泰代拉§!\n§Y所属派别：§!§g天主教工人派§!\n§Y经历：§!§L格隆基是托斯卡纳人，在比萨大学读文学，年轻时追随罗莫洛·穆里神父的基督教民主运动。毕业后他在中学教书，大战爆发后以步兵军官身份参战，获得过勋章。\n战后托斯卡纳的反教会暴力让他迁往米兰，在那里参与斯图尔佐神父创建人民党，组织天主教工会，同工团主义者争夺工人。他是人民党的左翼，斯图尔佐辞职后曾与罗迪诺、斯帕塔罗组成三人领导小组，后来当选意大利共和国总统。第二次世界大战中这个共和国瓦解，他没有流亡，带着天主教工会的大部分组织加入了统一后的社会共和国。\n他在共和国里的作用没有人能替代：南方的农民听神父的，许多神父听他的。他主张共和国不去碰教会的学校和堂区，以此换取教会对土地改革和工会的支持。反教权的老工团主义者认为他是教会安插进来的人，梵蒂冈也不完全信任他。§!"
 ITA_krcw_matteotti_desc:0 "§Y出生：§!§g1921年，意大利王国罗马§!\n§Y所属派别：§!§g劳总程序派§!\n§Y经历：§!§L马泰奥·马泰奥蒂是贾科莫·马泰奥蒂的儿子。他的父亲出身波莱西内，是意大利共和国里社会民主派“民主改良联盟”的领袖，长期与博诺米政府合作，后来被右翼武装分子杀害。家里失去了依靠，母亲带着孩子们越过阿尔卑斯山去了法国。\n他在巴黎读完中学，进入工团的青年组织，在冶金厂和联合会的夜校里接受了公社的训练。1943年他作为联络干部随国际的军队回到意大利，此后主持都灵和米兰工厂委员会的重建，把选举、罢免和会议记录的规则写进了每一家工厂的章程。\n他主张意大利社会共和国做国际里最讲程序的成员：一切重大决定都要投票，包括战争。他因此反对帕里在的里雅斯特问题上的强硬路线，也不赞成书记处替成员国做决定。北方的工厂委员会支持他，老一代革命者则觉得他太年轻，又是在法国长大的。§!"
 ITA_krcw_parri_desc:0 "§Y出生：§!§g1890年1月19日，意大利王国都灵省皮内罗洛§!\n§Y所属派别：§!§g游击队老兵派§!\n§Y经历：§!§L帕里在米兰当过中学教师，也为《晚邮报》撰稿。大战中他以军官身份参战，三次负伤，多次获得勋章，战争末期在总参谋部任职，亲眼看着意大利军队在奥德联军的攻势下一再失败。\n停战后他随一批被奥地利人放回国内的军官协助维持秩序。他对奥地利的意图心存戒备，又害怕社会主义，在米兰组织过对付赤色渗透的民团。1930年意大利共和国成立后，他成为博诺米自由民主党的骨干，在米兰一家大电力公司任经理，后来接过了党的领导。\n第二次世界大战改变了他的立场。奥地利驻军和共和国政府垮台时，他在阿尔卑斯山区组织游击队，一路打到波河平原，队伍里多数是工人和农民，战后他带着这批人加入了社会共和国。他认为的里雅斯特和伊斯特拉的意大利人不该等日内瓦的判决。他的支持者在军队里，反对者说他会为几个港口把国际拖进战争，也有人记得他二十年前站在另一边。§!"
 ITA_krcw_sardi_desc:0 "§Y出生：§!§g1889年1月25日，意大利王国阿奎拉省苏尔莫纳§!\n§Y所属派别：§!§g自由派（财政顾问）§!\n§Y经历：§!§L萨尔迪生在阿布鲁佐山区的苏尔莫纳，大战中以军官身份参战。战后他回到阿布鲁佐，参加过地方民团，后来当选意大利联邦议会的议员，属于自由派，长期在预算委员会工作，熟悉国债、铁路和公共工程的账目。\n第二次世界大战中联邦政府垮台，大多数旧议员去了撒丁岛或者流亡国外，也有人被捕入狱。萨尔迪留在罗马，把财政部的档案交给了新政府，此后以财政顾问的身份为共和国工作。他留下的理由很简单：意大利的国债是他那一代人借的，他不想让别人来解释它。\n他不是社会主义者，在共和国里没有政治基础，但财政部和国家银行的日常运转离不开他。他反对帕里在的里雅斯特的冒险，理由是他算过一场战争要花多少钱，共和国付不起。工团主义者怀疑他替旧债权人说话，老自由派则把他看作叛徒。§!"
 WGR_krcw_thalmann_desc:0 "§Y出生：§!§g1886年4月16日，德意志帝国汉堡自由汉萨城§!\n§Y所属派别：§!§g德意志总工会§!\n§Y经历：§!§L恩斯特·台尔曼生于汉堡一个经营小杂货铺的家庭，少年时就在港口和远洋货船上做工。1903年他加入社会民主党，次年加入运输工人工会。大战期间他在西线当了三年炮兵，战争结束后回到汉堡码头。\n德国赢得战争之后，他成为汉堡港口工人中最有名的鼓动者。1923年汉堡起义失败，他转入地下，此后十年一直在帝国反煽动法的通缉名单上，罪名包括组织秘密团体和与法兰西公社的情报机关联络。1933年他被捕，检察官要求判处死刑，最后他被关进柏林莫阿比特监狱，一关就是十年。\n1943年他获释，随即宣布成立德意志社会主义共和国，出任德意志总工会主席。他在工人中的威望无人能比，但十年牢狱拖垮了他的身体，他已经很少离开汉堡。卡勒、沃伦贝格和施罗德分别代表军队、车间委员会和工会机关，都在为接班做准备，而他至今没有表态支持其中任何一人。§!"
 WGR_krcw_kahle_desc:0 "§Y出生：§!§g1899年4月22日，德意志帝国普鲁士王国勃兰登堡省柏林§!\n§Y所属派别：§!§g德意志总工会，“统一指挥”派§!\n§Y经历：§!§L汉斯·卡勒出身军官家庭，少年时进入普鲁士军官学校，1917年以少尉身份上了西线，大战最后一年被俘，停战后才回到德国。他在帝国的和平里找不到位置，1920年代转向社会主义运动，因反煽动法的追查离开德国，在法兰西公社做过记者和军事教官。\n1936年他去了西班牙，任国际纵队第十一旅旅长，在那里认识了后来共和国军队的大部分指挥官。1943年他随第三国际的军队回到德国，此后一直负责易北河防线和西柏林的防务。\n他是“统一指挥”派的核心，主张前线国家只能有一个政府，工会、车间委员会和国防部必须服从同一套命令。车间委员会认为他要把共和国变成一座兵营，沃伦贝格公开说卡勒一辈子只服从过军队。他在国际的军事顾问中很受信任，在汉堡和鲁尔的工人中却没有自己的基础。§!"
 WGR_krcw_mierendorff_desc:0 "§Y出生：§!§g1897年3月24日，德意志帝国萨克森王国德累斯顿行政区大海恩§!\n§Y所属派别：§!§g社会民主派，“小步骤”路线§!\n§Y经历：§!§L卡洛·米伦多夫在达姆施塔特长大，1914年中学毕业就志愿参军，在西线服役到战争结束，得过铁十字勋章。战后他在海德堡读经济学并取得博士学位，1920年加入社会民主党，很快成为黑森党组织里最能写也最能讲的年轻人。\n1930年代他当选帝国议会议员，是社会民主党内主张与帝国政府正面对抗的年轻一派的代表，经常在《前进报》上批评党的领导层过于软弱。1937年战争开始后，帝国政府按战时法令逮捕社会民主党左翼的活动分子，他转入黑森的地下，一直坚持到1943年。\n共和国成立后，他主持起草了共和国宪法，也是“小步骤”路线的作者：暂时不谈统一，先与易北河对岸谈邮政、探亲和货运。革命社会主义者认为他是旧社会民主党的残余，卡勒一派认为他的办法会让对面的特务自由进出。他在议会里人缘很好，在工会里的基础却很薄。§!"
 WGR_krcw_renn_desc:0 "§Y出生：§!§g1889年4月22日，德意志帝国萨克森王国德累斯顿§!\n§Y所属派别：§!§g革命社会主义，“工会推选军官”路线§!\n§Y经历：§!§L路德维希·雷恩原名阿诺德·菲特·冯·戈尔瑟瑙，出身萨克森的贵族家庭。1910年他进入萨克森王家近卫掷弹兵第100团，大战中在西线先后任连长和营长，一直打到1919年。\n战后他离开军队，在哥廷根和慕尼黑读法律、经济和艺术史。1928年他以“路德维希·雷恩”为笔名出版了小说《战争》，写的是一个普通士兵在西线的四年，这本书在帝国销量很大，也让他与自己的阶级决裂。同年他加入社会主义运动，此后几次被捕，最后流亡法国。1936年他去了西班牙，在国际纵队第十一旅指挥一个营，后来任该旅参谋长。\n1943年他随国际的军队回国，此后替共和国办过几次对外交涉。他主张军官由工会推选，理由是他在旧军队和国际纵队都当过军官，知道两者各自的长处。职业军人说他是写小说的，车间委员会说他终究是个贵族，两边都不完全信任他。§!"
 WGR_krcw_schroder_desc:0 "§Y出生：§!§g1884年11月13日，德意志帝国普鲁士王国波美拉尼亚省波尔青§!\n§Y所属派别：§!§g德意志总工会，工会机关派§!\n§Y经历：§!§L卡尔·施罗德在波美拉尼亚长大，读大学时学的是德国文学，后来在社会民主党的工人教育机构讲课，给工会干部上历史和文学课。大战期间他站到党内反对战争的左翼一边，与党的领导层决裂。\n战后他是德国议会外左派的组织者之一，主张工人在工厂里建立自己的联合会，不经过政党直接管理生产。帝国的反煽动法把他列为头号通缉对象之一，他在各地的秘密小组之间辗转了二十年，靠化名和工人家庭的掩护一直没有被抓。\n1943年后他出任德意志总工会书记，把分散的车间联合会整编成全国统一的工会系统。他主张工会是共和国的主干，因为工会同时管着生产和人。他不信任卡勒的军队，也不信任沃伦贝格的车间大会，两边都指责他在建立一个新的官僚机关。他年过六十五，身体尚好，但在工会之外几乎没有公众知名度。§!"
 WGR_krcw_wollenberg_desc:0 "§Y出生：§!§g1892年8月15日，德意志帝国普鲁士王国东普鲁士省柯尼斯堡§!\n§Y所属派别：§!§g德意志总工会，车间委员会派§!\n§Y经历：§!§L埃里希·沃伦贝格生于柯尼斯堡，战前在大学读医科。1914年他应征入伍，在前线几次负伤，升到少尉。战争最后一年他在部队里组织士兵委员会，从此离开了医学。\n1923年汉堡起义时，他是起义的军事组织者。起义失败后他流亡国外，先后加入过三个不同的社会主义组织，每一次都因为反对上级下达的命令被开除。1930年代他在法兰西公社和西班牙的工人武装中做军事教员，1943年回到鲁尔。\n车间委员会把他当作自己的人。他主张共和国的一切重大决定都应由车间大会表决，包括动员和宣战，理由是凡事表决的国家不容易被一个将军拖进战争。卡勒认为这套办法在打仗时会误事，国防部的动员演习报告也支持卡勒的看法。他在鲁尔和汉堡的工厂里很有号召力，在党的机关里几乎没有朋友。§!"
 WGR_krcw_brandt_desc:0 "§Y出生：§!§g1913年12月18日，德意志帝国吕贝克自由汉萨城§!\n§Y所属派别：§!§g社会民主派§!\n§Y经历：§!§L威利·勃兰特原名赫伯特·弗拉姆，是吕贝克一个女店员的非婚生子，由当卡车司机的外祖父带大。他中学时就加入社会主义青年组织，十几岁已经在吕贝克的工人报纸上发表文章。\n1933年帝国警察按反煽动法追查吕贝克的社会主义青年团体，他坐渔船逃到挪威，从此改用“威利·勃兰特”这个名字。他在奥斯陆做记者，加入了挪威工人运动，1937年曾以记者身份去过西班牙。流亡十二年间，他一直替德国流亡者办理证件和住处。\n1945年他回到社会主义共和国，是那一批流亡者里最年轻的一个。他主持起草了难民收容所制度和“门继续开着”的边界法律，让从易北河对岸过来的人可以留下。他的判断是共和国在军备上比不过对面，但可以让对面的人自己选择过来。安全部门认为收容所是对方特务的入口，革命派认为他太像一个北欧的社会民主党人。§!"
 WGR_krcw_zuse_desc:0 "§Y出生：§!§g1910年6月22日，德意志帝国普鲁士王国勃兰登堡省柏林-威尔默斯多夫§!\n§Y所属派别：§!§g无党派，经济部技术顾问§!\n§Y经历：§!§L康拉德·楚泽生于柏林，童年随做邮政官员的父亲在东普鲁士的布劳恩斯贝格和萨克森的霍耶斯韦达度过。他在柏林-夏洛滕堡工业大学学土木工程，1935年毕业后进入亨舍尔飞机公司，负责机翼的应力计算。\n手工计算太慢，他在父母的公寓里自己动手造计算机器。1938年他造成了第一台机械式样机，1941年造成了可以按程序运算的继电器计算机。帝国的军方对此兴趣不大，战争后期他的大部分机器和图纸在柏林的空袭与巷战中损毁。柏林分区时，他的住处和工作间落在西柏林一侧。\n他对政治没有兴趣，要的只是经费和不受军方监督。1949年社会主义共和国的经济部给了他这两样，他的第一个提议是用机器计算全国计划的物资平衡表。计划部门的老职员不相信机器，国防部则想把他的机器先用来计算弹道。§!"
 DDR_krcw_schleicher_desc:0 "§Y出生：§!§g1882年4月7日，德意志帝国普鲁士王国勃兰登堡省勃兰登堡§!\n§Y所属派别：§!§g民族阵线§!\n§Y经历：§!§L库尔特·冯·施莱歇尔出身普鲁士军人家庭，1900年进入第三近卫步兵团，在那里结识了终生的朋友哈默施泰因。大战期间他是格勒纳手下战时办公室的参谋，批评军火商发战争财，主张改善工人待遇，在军中得了“红色将军”的外号。\n战后他在泽克特手下做总参谋部与文官政府之间的联络人，与皇储威廉交好，1931年出任普鲁士陆军大臣。1936年大选没有产生多数，他被任命为帝国首相，此后主持了对第三国际和俄国的两线战争。1944年春帝国崩溃，德皇带着帝国政府去了达累斯萨拉姆，他留在柏林，把残存的国防军交给俄国人，签订了《柏林条约》，在勃兰登堡和萨克森建立德意志民族共和国，由民族阵线执政。\n他是这个国家唯一能同时让将军、文官和莫斯科满意的人。他的健康从1930年代起就不好，却一直没有指定继承人，总参谋部、文官和君主派各自在准备。德皇从斯德哥尔摩寄来的信他从不公开回复。§!"
 DDR_krcw_hammerstein_desc:0 "§Y出生：§!§g1878年9月26日，德意志帝国梅克伦堡-施特雷利茨大公国欣里希斯哈根§!\n§Y所属派别：§!§g民族阵线，军官团派§!\n§Y经历：§!§L库尔特·冯·哈默施泰因-埃魁德出身梅克伦堡的贵族军人世家，先后在普伦和大利希特费尔德的军官学校受训，毕业后分到第三近卫步兵团，与施莱歇尔成为朋友。大战期间他在总参谋部和前线司令部任参谋。\n战后他支持泽克特把陆军改成一支更小、更职业化的军队。施莱歇尔当上普鲁士陆军大臣后，把他推上了最高统帅部的首脑位置。战争期间他几次拒绝执行自己认为会白白葬送部队的命令，靠与施莱歇尔的交情才没有被撤职。1944年他赞成向俄国投降，理由是保住军队比保住首都重要。\n他年过七十，是民族阵线里资格最老的将军。他主张国家应当由军官团来管，因为在他看来军队是这个国家唯一还没有腐败的机构；他同时反对军队对西柏林采取行动。文官们害怕他，蔡塞尔的警察系统和他互相提防，年轻一代的参谋更愿意支持海因里齐。§!"
 DDR_krcw_heinrici_desc:0 "§Y出生：§!§g1886年12月25日，德意志帝国普鲁士王国东普鲁士省贡宾嫩§!\n§Y所属派别：§!§g民族阵线，总参谋部派§!\n§Y经历：§!§L戈特哈德·海因里齐是东普鲁士一个牧师的儿子，娶了普鲁士贵族家的女儿，靠这层关系在军中立足。大战中他先后任连长和营长，在凡尔登负伤，伤愈后调任参谋。\n战后他很早就参与了德意志祖国党的活动，这在不问政治的军官团里并不常见，上级因此一度压着他的晋升。凭着指挥能力，他还是一路升了上去，成为陆军里最有名的防御战专家。第二次世界大战的最后一年，他负责把残存的部队撤到易北河东岸并布置防线。他的家乡东普鲁士如今已不属于德国。\n他是总参谋部在施莱歇尔之后的人选，但本人对这个位置没有多大兴趣。他认为治理国家应当交给文官，军人的任务是守住易北河，并让这条线不必真的开战。他用兵节省，说话也少，在部队中威望很高，在政治上却几乎没有盟友。哈默施泰因认为他太软弱，文官们则担心他一旦上台就会被总参谋部架空。§!"
 DDR_krcw_heuss_desc:0 "§Y出生：§!§g1884年1月31日，德意志帝国符腾堡王国内卡河行政区布拉肯海姆§!\n§Y所属派别：§!§g民族阵线，文官自由派§!\n§Y经历：§!§L特奥多尔·豪斯生于符腾堡一个工程官员的家庭，在慕尼黑和柏林读经济学、历史和艺术史，1905年以一篇关于海尔布隆葡萄种植业的论文取得博士学位。此后他在柏林为弗里德里希·瑙曼编辑《救助》周刊，1912年回海尔布隆主编《内卡报》，成为瑙曼一派自由主义的年轻代表。\n战后他是帝国议会里左翼自由派的知名人物，在柏林的政治学院讲授宪法和政治史，写了大量关于议会制度的文章。战争结束时他留在柏林，没有随帝国政府南撤。施莱歇尔建立民族共和国时需要一个能代表文官的名字，他接受了邀请，此后一直是政府里最有名的非军人。\n他主张“文官的转向”：把预算从军队挪向住宅和铁路，理由是没人愿意留下的国家守不住边界。将军们容忍他，因为外国记者和外交官愿意和他谈话。他在民族阵线里没有自己的组织，他的地位完全取决于施莱歇尔是否需要他，哈默施泰因一派早就想把他换掉。§!"
 DDR_krcw_jarres_desc:0 "§Y出生：§!§g1875年9月21日，德意志帝国普鲁士王国莱茵省雷姆沙伊德§!\n§Y所属派别：§!§g民族阵线，市政保守派§!\n§Y经历：§!§L卡尔·亚雷斯是雷姆沙伊德人，在波恩等地读法律，此后一直在市政系统工作。1910年他任雷姆沙伊德市长，1914年起任杜伊斯堡市长，在这个位置上干了近三十年，把杜伊斯堡的港口、电车和市政财政管理得井井有条，在右翼自由派中很有名望。\n1943年鲁尔被第三国际占领时，他带着市政府的档案和一部分官员撤到东边，从此再也没有回过杜伊斯堡。民族共和国成立后，他负责整顿地方行政和市政财政，许多县长和市长是他提拔的人。\n他代表共和国里那些既不信任军队也不信任革命的人，主张先把市政、行政、警察和预算这四件事办好。他对王位问题的态度在政府里最坦白：复辟要花钱、要莫斯科点头，让王位空着什么都不用花。君主派因此恨他，将军们嫌他只会算账。他年过七十，身边没有年轻的继承者。§!"
 DDR_krcw_bruning_desc:0 "§Y出生：§!§g1885年11月26日，德意志帝国普鲁士王国威斯特法伦省明斯特§!\n§Y所属派别：§!§g民族阵线，中央党文官派§!\n§Y经历：§!§L海因里希·布吕宁生于明斯特一个天主教商人家庭，先后在慕尼黑、斯特拉斯堡、伦敦和波恩读哲学、历史和经济学，1915年在波恩以关于英国铁路国有化的论文取得博士学位。他随即志愿参军，在西线任机枪连连长，得过铁十字勋章。\n战后他在施特格瓦尔德的基督教工会任总干事，后来进入帝国议会，成为中央党的财政专家。1930年代中央党内部争夺领导权时，他与约斯、门尼希组成三人领导层，与施特格瓦尔德对抗。他主持过几轮紧缩预算，每一次都不受欢迎，事后又被承认是必要的。战争结束时他留在柏林，他的家乡明斯特如今在易北河另一侧。\n他是文官一方资格最硬的候选人，也是最不受欢迎的一个。他主张削减军费，把前线国家的财政先稳住，这让他与总参谋部和莫斯科的军事顾问都处不好。他为人冷淡，不善于拉拢人，天主教工人更愿意跟约斯走。§!"
 DDR_krcw_joos_desc:0 "§Y出生：§!§g1878年11月13日，德意志帝国阿尔萨斯-洛林帝国直辖领上阿尔萨斯区科尔马县温岑海姆§!\n§Y所属派别：§!§g基督教民主派，天主教工人运动§!\n§Y经历：§!§L约瑟夫·约斯生于阿尔萨斯，年轻时学过手艺，后来投身天主教工人协会。1900年代起他在门兴格拉德巴赫编辑天主教工人协会的机关报《西德工人报》，编了二十多年，成为天主教工人运动在报刊上最有影响的声音。\n战后他作为中央党议员进入帝国议会，代表党内的工人一翼。1930年代中央党内部争夺领导权时，他与布吕宁、门尼希组成三人领导层，与施特格瓦尔德对抗。1943年莱茵兰和鲁尔落入第三国际之手，他的报社和大部分读者都留在了西边，他本人在柏林。\n在民族共和国里，他是少数既不属于军队也不属于官僚、又有自己组织基础的政治家，靠的是教区和天主教工人协会的网络。他的实际主张只有一条：与莱茵河那一侧恢复通信、探亲和货运，让被铁丝网隔开的家庭能够来往。蔡塞尔的警察把教区网络看作安全隐患，莫斯科对任何与西边的往来都不放心。§!"
 DDR_krcw_zaisser_desc:0 "§Y出生：§!§g1893年6月20日，德意志帝国普鲁士王国威斯特法伦省盖尔森基兴§!\n§Y所属派别：§!§g民族阵线，治安系统§!\n§Y经历：§!§L威廉·蔡塞尔是盖尔森基兴一个宪兵的儿子，在埃森读师范，毕业后做过小学教师。大战期间他在东线和西线服役，升到预备役少尉。\n战后他没有回到讲台，留在军中做情报工作，1920年代和1930年代一直在总参谋部的情报部门，熟悉鲁尔的矿区和工人组织。第二次世界大战期间他负责后方的反间谍工作。1944年投降后，施莱歇尔让他组建人民警察，他从零开始建立了共和国的档案、户籍名册和线人网络。\n他是封闭柏林分区边界那份方案的作者，理由是每年都有医生、工程师和技术工人从西柏林离开，共和国培养不出这么多人。他谈安全问题时从不谈意识形态，这让将军们放心，也让文官们害怕。哈默施泰因认为警察不该插手军队的事，豪斯和约斯则把他看作共和国最大的危险。§!"
 SOV_krcw_savinkov_desc:0 "§Y出生：§!§g1879年1月31日，俄罗斯帝国哈尔科夫省哈尔科夫§!\n§Y所属派别：§!§g全俄国民同盟（国家民粹主义）§!\n§Y经历：§!§L鲍里斯·维克托罗维奇·萨文科夫生于哈尔科夫一个中等官员家庭，在华沙长大。他很早加入社会革命党的战斗组织，参与策划了1904年刺杀内务大臣普列韦和1905年刺杀谢尔盖大公的行动，后来以“罗普申”的笔名写过小说《灰色马》。1917年他任西南方面军政委和临时政府陆军部副部长。\n内战中他从恐怖分子变成了北方志愿军的领导人，战后建立保卫祖国与自由同盟，提出“国家民粹主义”，最终以选举和街头力量夺取政权，建立强势总统制的俄罗斯国。第二次世界大战中他从东方进攻德意志帝国与中欧同盟，吞并了波罗的海三国和芬兰，逼施莱歇尔签订《柏林条约》，由此成为莫斯科协定的领袖。\n在国内，他恢复了奥克拉那作为直属于他的“第三厅”，用行政流放处置政敌，把牧首公署变成国家机构。他年过七十，没有指定继承人。军人、文官和君主派都在等他之后的位置，他的身体状况是克里姆林宫里最重要的秘密。§!"
 SOV_krcw_nekrasov_desc:0 "§Y出生：§!§g1879年11月1日，俄罗斯帝国圣彼得堡省圣彼得堡§!\n§Y所属派别：§!§g立宪民主派（文官派）§!\n§Y经历：§!§L尼古拉·维萨里昂诺维奇·涅克拉索夫是神父之子，以优等成绩毕业于圣彼得堡交通工程学院，在托木斯克教过数学。1905年革命后他加入立宪民主党，在第三届杜马中以演说和精力出名，1917年二月革命后出任临时政府交通部长。\n内战中他躲过了布尔什维克，战后参与把立宪民主党改组为立宪民主联盟，成为党内左翼领袖，一手促成了1920年代社会革命党与立宪民主派的联合政府。萨文科夫上台打破了这个联盟，涅克拉索夫没有流亡，也没有被流放，留在国家会议里做一个不惹事的老议员。\n他没有军队，也没有群众组织。他的价值在于各派都知道他不会清洗任何人。如果萨文科夫死后将军们和同盟的人僵持不下，他是最可能被推出来的过渡人选。他想趁这个机会恢复议会对政府的约束，但他在党内的旧同僚大多已经老了或散了。§!"
 SOV_krcw_shlyapnikov_desc:0 "§Y出生：§!§g1885年8月30日，俄罗斯帝国弗拉基米尔省穆罗姆§!\n§Y所属派别：§!§g俄国工会流亡派（工团主义）§!\n§Y经历：§!§L亚历山大·加夫里洛维奇·什利亚普尼科夫出身于贫穷的旧礼仪派家庭，十岁起做工，后来成为五金工人。他自学读书，很早加入社会民主工党，1908年起与柯伦泰结成终身的政治同盟，战前在法国和英国的工厂里做过工。1917年他是布尔什维克中负责工会工作的人，内战时期领导“工人反对派”，反对军事化和党对地方工会的指挥。\n1921年他以叛国罪被判苦役，1932年马克拉科夫总统大赦时获释，但被禁止担任公职。他回到工会活动中，成为反对萨文科夫的主要声音之一，之后被迫出国。此后他在巴黎和伦敦替俄国流亡工会奔走，与法国劳动总联合会的关系很深。\n他主张工人自己管理工厂，国家和政党都不能越过工会。第三国际需要一个能代表俄国工人签字的人，他是工会里名望最高的一个。他的弱点也很清楚：他离开俄国太久，国内的新一代工人大多只听说过他的名字。§!"
 SOV_krcw_sorokin_desc:0 "§Y出生：§!§g1889年2月4日，俄罗斯帝国沃洛格达省图里亚§!\n§Y所属派别：§!§g文官改革派（国家民主主义）§!\n§Y经历：§!§L皮季里姆·亚历山德罗维奇·索罗金的父亲是科米族的手艺人，家里很穷。一位神父发现了他的天分，送他去读书。他十七岁加入社会革命党，坐过牢，出狱后在北方各省为党做农村调查。在圣彼得堡他师从社会学家马克西姆·科瓦列夫斯基，革命中参加过北方志愿军的行动。\n战后他成为俄国最有名的社会学家，在教育部任职多年，后来进入科学院。萨文科夫政权需要他的调查数据，也容忍他在学术刊物上写些不合时宜的东西。战争结束后，他主持了关于农村、人口和工业劳动力的几次大规模调查。\n他的主张是俄罗斯赢不了与第三国际的军备竞赛，只能靠提高生产率和普及教育取胜，因此要削减军费、给农民学校和信贷。部长们传阅他的备忘录，将军们说这是投降的学术说法。他在同盟里没有自己的派系，只有学生。§!"
 SOV_krcw_vasilevsky_leader_desc:0 "§Y出生：§!§g1895年9月30日，俄罗斯帝国科斯特罗马省新戈尔奇哈§!\n§Y所属派别：§!§g军人稳定派（军人执政）§!\n§Y经历：§!§L亚历山大·米哈伊洛维奇·华西列夫斯基是乡村神父之子，最初受的是宗教教育，想当农艺师或土地测量员。1915年他进入阿列克谢耶夫军校，在西南方面军作战。内战开始后他复员回乡，在村里教小学，1919年被征入红军，随后带着整营人投奔白军。\n内战结束后他留在军中，1931年从总参谋部学院毕业，是马尔科夫将军的学生，在大本营编写新兵教材。第二次世界大战中他在总参谋部策划了对东普鲁士和维也纳方向的进攻，战后出任总参谋长。\n他不演讲，不写书，不允许别人在办公室挂他的像。他认为俄国打完那场战争已经到了极限，现在需要的是卡车、道路和不打仗的十年。军官团和士兵都信任他，萨文科夫的同盟干部却不信任一个从不表态效忠的将军。他本人从未说过想接班。§!"
 SOV_krcw_vladimir_romanov_desc:0 "§Y出生：§!§g1917年8月30日，俄罗斯帝国芬兰大公国波尔沃§!\n§Y所属派别：§!§g君主派（君主主义）§!\n§Y经历：§!§L弗拉基米尔·基里洛维奇是基里尔·弗拉基米罗维奇大公与维多利亚·梅利塔大公夫人的独子，亚历山大二世的曾孙。他出生时父母已经逃到芬兰，此后一直在国外长大，童年大部分时间住在德国科堡。1924年他的父亲自称流亡中的全俄皇帝，1938年父亲去世后，他成为罗曼诺夫家族皇位继承顺序的首位。\n他从未统治过任何地方，也没有打过仗。萨文科夫不允许他回国，但也从不公开否认他的身份，因为君主派的将军和主教仍是政权的一部分。德意志帝国崩溃后他离开科堡，住在中立国，莫斯科的君主派通过教会和旧近卫军的关系与他保持联系。\n他本人性格温和，不善演讲，对政治细节兴趣不大。支持他的人看中的正是这一点：一个年轻、干净、没有参与过任何清洗的皇帝，可以让军队、教会和实业家在萨文科夫死后团结在同一面旗帜下。反对他的人则指出，他对今天的俄国几乎一无所知。§!"
 SOV_krcw_vonsyatsky_desc:0 "§Y出生：§!§g1898年6月12日，俄罗斯帝国波兰王国华沙§!\n§Y所属派别：§!§g同盟战斗队强硬派（民族布尔什维主义）§!\n§Y经历：§!§L阿纳斯塔西·安德烈耶维奇·冯夏茨基出身于一个俄化的波兰德意志没落贵族家庭。他的父亲是宪兵军官，1910年被波兰社会主义者刺杀，这让他一生仇视社会主义。内战中他在邓尼金的骑兵部队服役，曾与部下杀害三名被怀疑是间谍的犹太平民。\n战后他加入极端君主派，组织过“天使长米迦勒俄罗斯军团”，该组织被取缔后他转投萨文科夫的保卫祖国与自由同盟，负责同盟的战斗队。在坦波夫骚乱中他带人在街头与警察冲突，由此成名。萨文科夫掌权后用他，也提防他。\n他穿自己设计的制服，手下是街头出身的打手，最常重复的一句话是“萨文科夫太软弱了”。他认为1944年停在易北河边是历史性的错误，主张在第三国际完成重建之前重开战争。将军们看不起他，文官怕他，他的支持来自失业的复员军人和各省的同盟基层。§!"
 RAJ_krcw_scindia_desc:0 "§Y出生：§!§g1916年6月26日，英属印度中印度专员区瓜廖尔土邦§!\n§Y所属派别：§!§g王公院（王公联邦）§!\n§Y经历：§!§L吉瓦吉拉奥·辛迪亚是瓜廖尔大君马达夫·拉奥·辛迪亚的儿子，1925年父亲去世时他九岁，继承了中印度最大的马拉塔土邦，由摄政会议代管到成年。他在瓜廖尔接受私人教育，1936年正式亲政。\n英国革命后，印度分裂为王公联邦、印度公社和海德拉巴等几块。辛迪亚在王公院里以“反赤化”为号召，1940年代初接受俄国的军火和顾问，发动统一战争，1947年攻灭印度公社，把次大陆重新合为一个国家。他由此成为印度联邦王公院主席，与莫斯科结盟。\n联邦是王公和军人共治的国家。各土邦保留自己的法庭、税收和军队，农村的租佃制度原封未动，孟加拉的饥荒和各地的农民暴动一直没有停过。他反对土地改革，认为那会让王公院失去存在的理由。他三十出头，没有打过败仗，但王公院内部的改革派、旁遮普的地主和孟买的实业家都在等他让步。§!"
 RAJ_krcw_scindia_heir_desc:0 "§Y出生：§!§g1895年9月18日，英属印度卡提阿瓦专员区纳瓦纳加尔土邦萨多达尔§!\n§Y所属派别：§!§g王公院改革派（家长式保守主义）§!\n§Y经历：§!§L迪格维杰辛吉是纳瓦纳加尔王公、板球名将兰吉特辛吉的侄子。他在拉杰果德的王子学院和英国读书，1919年起在军中服役多年。1933年伯父去世，他继位为纳瓦纳加尔的贾姆王公。\n英国革命后，他是王公院里最早主张联合各土邦、组建统一政府的人之一。统一战争中他负责卡提阿瓦和古吉拉特方向的土邦部队，战后在王公院里领导一个人数不多的改革派。\n他的主张对同侪很不客气：王公们如果不主动交出一部分司法权和税收权，迟早会被议会或者农民全部拿走。他支持有限的土地改革和一部成文宪法，但坚持王公院要保留对军队的控制。他在西藏问题上是鹰派，认为一个守住北方边疆的王公院更难被废除。辛迪亚把他留在身边，也把他排除在决策之外。§!"
 RAJ_krcw_tata_desc:0 "§Y出生：§!§g1904年7月29日，法兰西第三共和国塞纳省巴黎§!\n§Y所属派别：§!§g孟买实业界（自由保守主义）§!\n§Y经历：§!§L杰罕吉尔·拉坦吉·达达博伊·塔塔出身于孟买的帕西人实业家族，母亲是法国人，第一语言是法语。他在巴黎的法国中学读书，又先后在孟买、横滨和英国上学，1923年进入剑桥学习工程。英国革命后他回到印度，放弃法国国籍。1929年他取得印度第一张民用飞行执照，此后创办塔塔航空公司，1938年起主持塔塔集团。\n印度内战期间，塔塔的钢铁厂和工厂在两边之间艰难维持。统一后，塔塔集团成为联邦最大的钢铁与航空企业，也为俄国顾问团提供车辆和机修。\n他的政治要求只有一条：让联邦成为一个能自己造东西的国家。为此他要统一的关税、铁路和电力，反对土邦各收各的税，也反对议会里保护地主的粮食关税。王公和议会都需要他的钱，他从未参加选举。他的弱点是在农村没有任何基础，工人运动也把他看作头号对手。§!"
 RAJ_krcw_tiwana_desc:0 "§Y出生：§!§g1900年8月7日，英属印度旁遮普省查克穆扎法拉巴德§!\n§Y所属派别：§!§g旁遮普统一党（国家民主主义）§!\n§Y经历：§!§L希扎尔·哈亚特·提瓦纳出身于旁遮普最有势力的地主家族之一，父亲是提瓦纳家族的族长乌马尔·哈亚特·汗。他在拉合尔的艾奇逊学院读书，1919年在英印陆军中参加过第三次英阿战争。\n提瓦纳家族是旁遮普统一党的支柱。凭借父亲的影响和努恩家族的支持，他在1934年选举前成为党的领袖并赢得选举，出任旁遮普总理。统一党让穆斯林、印度教和锡克教地主共同分享省里的税收和官职，这套安排让旁遮普在内战中少受了很多破坏，也让它在统一时以一个完整省份的身份加入联邦。\n他把联邦看作若干省份之间的交易，主张各省保留财政自主，反对德里集权，也反对任何触动地主土地的改革。党内的道尔塔纳和哈亚特家族一直想换人，而锡克教农民和城市的穆斯林联盟派对这套地主联盟越来越不满。§!"
 RAJ_krcw_wavell_holdover_desc:0 "§Y出生：§!§g1883年5月5日，英国埃塞克斯郡科尔切斯特§!\n§Y所属派别：§!§g旧印度军军官团（自由保守主义）§!\n§Y经历：§!§L阿奇博尔德·珀西瓦尔·韦维尔出身军人世家，毕业于温彻斯特公学和桑赫斯特，1901年进入黑卫士团，参加过布尔战争和印度西北边境的作战。1915年他在伊普尔失去左眼，此后在高加索的俄军中当过联络官，又在巴勒斯坦的艾伦比司令部任参谋。\n英国革命后，印度军队中的大部分英国军官回国或流亡，韦维尔选择留下。他在王公联邦的军中做参谋和教官，从未公开解释过留下的理由。统一战争中他负责后勤和山地作战的规划，战后成为联邦国防部的顾问，喜马拉雅方向的补给线图是他主持测绘的。\n他没有政治野心，也没有自己的派系，王公和议会都把他当作一个可以暂时托管局面的人。他对西藏的建议一贯冷淡：那条边界守得住，但联邦负担不起一场高原上的长期战争。印度军官们尊重他，民族主义者则认为一个英国人不该坐在德里的国防部里。§!"
 JAP_krcw_kishi_desc:0 "§Y出生：§!§g1896年11月13日，日本帝国山口县山口§!\n§Y所属派别：§!§g国民精神同盟（民族主义）§!\n§Y经历：§!§L岸信介生于山口县的佐藤家，后过继给父亲的本家岸家，他的弟弟佐藤荣作也走上了政坛。他1920年毕业于东京帝国大学法学部，进入农商务省，很快成为主张国家统制经济的“革新官僚”代表人物。\n中国北伐与奉系战争期间，他先后主管日本在满洲的工业开发和本土的军需生产。1944年《青岛停战协定》后日本失去朝鲜和满洲，军部和政党都声誉扫地，他因为属于文官而没有被清算，反而以重建经济的名义掌握了通产省和国民精神同盟。\n他靠官僚机器统治，选举只是形式。他要恢复日本的工业和海军，保住台湾，并与俄国保持亲近，但不愿让石原莞尔那样的将军把国家再拖进一场对中国的战争。议会里的吉田派和社会党人反对他的统制，军中的复仇派则嫌他太谨慎。§!"
 JAP_krcw_ishibashi_desc:0 "§Y出生：§!§g1884年9月25日，日本帝国东京府东京市§!\n§Y所属派别：§!§g议会自由派（自由民主主义）§!\n§Y经历：§!§L石桥湛山是日莲宗僧人杉田湛誓的儿子，在山梨县长大，少年时寄养在寺院。他1907年毕业于早稻田大学哲学科，1911年进入东洋经济新报社，后来成为主笔和社长。\n早在1920年代，他就在社论中主张放弃满洲和朝鲜，把这一主张称为“小日本主义”：殖民地的开支超过收益，日本的出路在贸易和国内市场。军部和政党都把他当作不合时宜的书生。1944年日本在中国战败，丢掉了朝鲜和满洲，他的旧社论被重新翻印，他本人也成了议会自由派的旗帜。\n他要一个没有殖民地、靠贸易和国内消费富起来的日本，主张裁减军费、与南京和巴黎恢复通商、让通产省放松对企业的控制。他与岸信介的分歧在统制经济，与吉田茂的分歧在对俄国的态度。他身体不好，在党内的组织能力也远不如他的文章有名。§!"
 JAP_krcw_katayama_desc:0 "§Y出生：§!§g1887年7月28日，日本帝国和歌山县田边§!\n§Y所属派别：§!§g社会大众党（社会民主主义）§!\n§Y经历：§!§L片山哲生于和歌山县田边，1912年毕业于东京帝国大学法学部，此后在东京做律师，专门为佃农、工人和贫困当事人提供法律援助。他是虔诚的基督徒，受安部矶雄等基督教社会主义者的影响很深。\n1926年他参与创建社会民众党，1932年后成为社会大众党的骨干。在日本干涉中国的那些年里，他的党被警察监视，集会屡遭禁止。1944年战败后，复员军人、失业工人和失去土地的农民涌进城市，社会大众党在工会和佃农组合中重新壮大，他成为党的领袖。\n他要一个议会民主的日本：工会合法，佃农分到土地，军队服从内阁，宪法写明主权属于国民。他反对岸信介的统制经济，也反对重整军备。他性格温和，不擅长斗争，党内的左派认为他对资本家太客气，东京街头的右翼团体则把他当作第三国际的代理人。§!"
 JAP_krcw_yoshida_desc:0 "§Y出生：§!§g1878年9月22日，日本帝国东京府东京§!\n§Y所属派别：§!§g保守合同派（保守民主主义）§!\n§Y经历：§!§L吉田茂是自由民权运动家竹内纲的儿子，幼年过继给横滨的富商吉田健三。他1906年毕业于东京帝国大学，进入外务省，娶了元老牧野伸显的女儿雪子。他在奉天和天津当过领事，1920年代后期任外务次官，此后出任驻意大利大使。\n在日本干涉中国期间，他属于反对扩大战争的外交官一派，被军部排挤出权力中心。1944年战败后，他以前外交官和牧野家女婿的身份，成为议会保守派各党合并谈判的中心人物，领导保守合同派。\n他主张把军备压到最低，把力气用在工业和商船队上，让别人去承担对抗的成本。他既不信任莫斯科，也不信任巴黎，希望在两个阵营之间做生意。他与岸信介同属保守阵营，但反对通产省控制一切，也反对军人干政。他脾气坏，看不起政党政治家，党内团结全靠他的名望。§!"
 CHI_krcw_zhou_enlai_desc:0 "§Y出生：§!§g1898年3月5日，大清国江苏省淮安府山阳县§!\n§Y所属派别：§!§g中国国民党（改组派）革命委员会派（革命社会主义）§!\n§Y经历：§!§L周恩来祖籍浙江绍兴，生于淮安一个没落的士绅家庭，幼年过继给叔父，家境清贫。他在天津南开学校读书，受《新青年》影响，成为学生运动中能说会写的人，后来与邓颖超结婚。他去法国考察那里的革命，1924年回国，进入新成立的黄埔军校，出任政治部副主任，在学员中讲授三民主义，也大量吸收左派青年。\n北伐在金华失败后，他留在国内参加早期游击活动，组织了称作“红队”的情报小组。1932年上海起义失败时他险些被杀，被秘密送往欧洲，在流亡中出任黄埔政治部主任。1936年他随汪精卫从巴黎回到龙岩，此后在第二次北伐和奉系战争中主持政治工作。汪精卫1944年病逝后，他以革命委员会派领袖的身份，联合陈公博的改组同志会激进派，在1946年击败顾孟余的温和派，出任国民政府主席兼中央执行委员会主席，次年带领中华民国加入第三国际。\n他主张土地法要彻底，工业化要快，把经济建设交给陈公博，同时把顾孟余和温和派留在政府里，因为他认为党一分裂，军阀就会回来。黄埔同学会的将军们尊重他但不完全听他，工团党激进派嫌他太慢，地方士绅则在等土地法出错。§!"
 CHI_krcw_chen_gongbo_desc:0 "§Y出生：§!§g1892年10月19日，大清国广东省广州府§!\n§Y所属派别：§!§g中国国民党改组同志会激进派（革命社会主义）§!\n§Y经历：§!§L陈公博早年参加过辛亥革命，1920年毕业于北京大学哲学系，回广州后是中国工团党广东支部的创建人之一。1922年他因为支持陈炯明退出工团党，次年赴美国哥伦比亚大学读书，1925年经廖仲恺介绍加入国民党。\n北伐失败后他随党流亡法国，与顾孟余一起创建改组同志会，主编《革命评论》，成为汪精卫最亲近的助手。他用唯物史观解释三民主义，常把“矛盾”“总体”挂在嘴边，改组同志会里的前工团党人大多聚在他周围，成了激进派。1936年他随汪精卫回国，第二次北伐期间主持财政和城市接收工作。汪精卫去世后，他带着激进派站到周恩来一边，1946年一起击败了顾孟余的温和派，此后任中执委常务委员、建设委员会委员长，主持第一个五年纲要的起草。\n他主张重工业收归国营、物资按计划分配，党要变成工人和农民自己的组织，和工团党激进派走得很近。温和派说他是穿着国民党制服的马克思主义者，黄埔的将军们嫌他不懂兵。很多人认为他是周恩来最可能的继承人，他本人从不接这个话。§!"
 CHI_krcw_gu_mengyu_desc:0 "§Y出生：§!§g1888年10月18日，大清国直隶省顺天府宛平县§!\n§Y所属派别：§!§g中国国民党改组同志会温和派（民主社会主义）§!\n§Y经历：§!§L顾孟余早年留学德国，学电机，后来改学政治经济学，精通英、法、德三国语言。回国后在北京大学任经济系主任和教务长，经蔡元培、李石曾介绍加入国民党，主编过《前进》。\n北伐失败后他随中央委员会流亡巴黎，与陈公博一起创建改组同志会，但两人从一开始就意见不合：陈公博讲阶级斗争，顾孟余认为中国没有工业社会那样的阶级，阶级斗争无从谈起。他主张把农民组织进农会，由农会推动土地改革和地方自治；他也反对群众运动，认为革命要靠党的坚强领导。1936年他随汪精卫回国，主管铁道和交通。汪精卫去世后，他领导改组同志会的温和派，1946年在党内竞争中输给周恩来和陈公博的联盟。\n他主张土地改革分阶段进行，给地主赎买，保护城市工商业，与第三国际合作但保持中国的自主。他仍是中执委委员，是城市商会、知识界和地方士绅最信任的人。周恩来需要他来稳住这些人，激进派则认为他迟早会带着温和派另立门户。§!"
 CHI_krcw_deng_yanda_desc:0 "§Y出生：§!§g1895年3月1日，大清国广东省惠州府§!\n§Y所属派别：§!§g中国国民党临时行动委员会、黄埔同学会（民主社会主义）§!\n§Y经历：§!§L邓演达出身于惠州一个读书人家庭，父亲是光绪年间的塾师。1911年他参加辛亥革命，1916年与叶挺等人一同进入保定军官学校。陈炯明叛变后他站在孙中山一边，1923年随国民党回到广东，后任黄埔军校教练部副主任，又到法兰西公社考察。1926年孙中山去世后他回国，任黄埔教育长，准备北伐。\n北伐失败后，他秘密回到闽赣起义区，在宋庆龄和李济深之间做联络人，1932年上海起义失败后与宋庆龄一起创建临时行动委员会。他主张革命要从农民和工人开始，提出“农工政策”。第二次北伐中他指挥过赣南和湘江方向的部队，并把历届黄埔学生组织成黄埔同学会。\n他现在已退出一线指挥，但黄埔同学会仍听他的。他主张土地归耕者、党指挥枪，对工团党既合作又防备。他与周恩来是黄埔时期的老同事，也是党内唯一能让军队服从周恩来的人。军委里有人担心，他一旦与周恩来翻脸，军队会跟他走。§!"
 CHI_krcw_li_jishen_desc:0 "§Y出生：§!§g1885年11月5日，大清国广西省梧州府§!\n§Y所属派别：§!§g粤桂军中元老（社会民主主义）§!\n§Y经历：§!§L李济深少年时在梧州中学读书，是胡汉民的学生。1904年他进入广东的两广陆军速成学堂，毕业后北上进入北洋陆军军官学堂，即后来的保定军校。1911年辛亥革命时他在江苏参加革命军，之后回北京完成学业。\n1920年他应同学邓铿之邀到广东，在粤军中升任要职，后任黄埔军校副校长。北伐开始时他是广东省主席兼黄埔代理校长，北伐失败后被指责未能守住落入德国人手中的广州。党的多数人流亡法国，他留在闽赣山区收拢国民革命军残部。1932年上海起义失败后，他仍是军中最受尊敬的老将之一。第二次北伐期间他任总参谋长，统筹各路部队。\n他在军队老将和两广、福建的地方实力派中人望很高，主张联合政府和地方自治，是党内最愿意和民主同盟、乡建派打交道的人。激进派认为他代表的正是土地法要打破的那种地方势力，他本人则担心南京的集权会逼反各省。§!"
 CHI_krcw_song_qingling_desc:0 "§Y出生：§!§g1893年1月27日，大清国江苏省上海公共租界§!\n§Y所属派别：§!§g中国国民党临时行动委员会（革命社会主义）§!\n§Y经历：§!§L宋庆龄是商人、传教士宋嘉树的次女，1913年毕业于美国佐治亚州的威斯里安女子学院。1915年她不顾父母反对，在东京与孙中山结婚。1922年陈炯明炮击总统府时，她坚持让孙中山先走，自己在突围中流产，此后再未生育。1925年孙中山去世时，她在病床边。\n北伐失败后，她与国民党左派将领一起转入闽赣起义区，在起义区和上海之间往返，为游击战争筹款筹械。1932年她与邓演达创建临时行动委员会。第二次北伐和奉系战争期间，她主持妇女和救护工作，并多次代表南京去巴黎争取贷款和援助。\n她在中央执行委员会里没有职务，但农会、妇女界和海外华侨都认她。她主持的妇女联合会在各县办识字班。她反对和地主妥协，也反对清洗党内的温和派。两边都请她表态，她很少开口。她没有自己的组织和军队，影响力全靠孙中山遗孀的身份和多年的声望。§!"
 CHI_krcw_zhang_xueliang_desc:0 "§Y出生：§!§g1901年6月3日，大清国盛京将军辖区八角台§!\n§Y所属派别：§!§g奉系旧部（国家民主主义）§!\n§Y经历：§!§L张学良是奉系首领张作霖的长子。与父亲不同，他从小有私人教师，对西方的东西很感兴趣。他毕业于东三省陆军讲武堂炮兵科，随即被父亲任命为东北卫队旅旅长。第一次直奉战争奉系战败后，他奉命议和，此后主管东北航空处，为奉军买来一支现代空军。第二次直奉战争奉系一度控制北京，但几年后直系又夺回了北京。\n1927年直系在北京拥立溥仪复辟，关外的奉系从不承认北京的朝廷。1940年北京陷落、清廷覆亡后，他不肯向南京低头，在日本的支持下与国民革命军在华北和辽西打了四年。1943年辽西会战关东军主力被歼，1944年《青岛停战协定》让满洲脱离日本控制，奉系随之瓦解，他流亡海外。\n他仍有一些旧部散在东北和海外，也有吸食鸦片和赌博的名声。莫斯科协定需要一个不属于国民党的中国政府时，他是少数还有旧部可用、名字在东北仍有分量的人。东北的农民和工人记得奉系的苛捐，国民党则把他看作引日本人进关的人。§!"
 USA_krcw_huey_long_desc:0 "§Y出生：§!§g1893年8月30日，美利坚合众国路易斯安那州温菲尔德§!\n§Y所属派别：§!§g统一党§!\n§Y经历：§!§L休伊·皮尔斯·朗生于路易斯安那北部温菲尔德的一个农户家庭，年轻时做过推销员，只读了一年法律课程就在1915年通过了律师考试。他在州铁路委员会里与标准石油公司作对起家，1928年当选州长，在路易斯安那修公路、发免费课本、建医院，同时把州议会、法院和警察都变成了朗家的机器。人们叫他“鱼王”。\n1936年大选引发的危机中内战爆发，他以“分享我们的财富”为号召，把南方和中西部的农民拉进了自己的阵营。1941年华盛顿陷落后，他以新奥尔良为首都，统治密西西比河以西的美国。1943年起，俄国的步枪和卡车经坦皮科运进得克萨斯，巴顿的军队借此把工团推回大河东岸，1946年双方签订《圣路易斯停火协定》。\n1949年他第四次“当选”总统。他靠石油、棉花和俄国贷款维持政权，宪法仍宣称对全美拥有主权，但他清楚自己的军队没有能力渡河。他的健康正在变坏，却没有公开指定继承人：弟弟厄尔会做交易，儿子拉塞尔还年轻，而巴顿和莫斯利这些南方将领并不认为继承问题应该由政客来决定。§!"
 USA_krcw_earl_long_desc:0 "§Y出生：§!§g1895年8月26日，美利坚合众国路易斯安那州温菲尔德§!\n§Y所属派别：§!§g统一党§!\n§Y经历：§!§L厄尔·肯普·朗是休伊·朗的弟弟，比哥哥小两岁。他年轻时做过推销员，后来在新奥尔良读完法律，一直替哥哥跑选区、拉选票。1932年休伊不让他竞选副州长，兄弟俩为此公开翻脸，过了几年才重新和好。\n内战期间，休伊忙于前线和华盛顿的争夺，厄尔留在路易斯安那管理州政府，后来出任州长。新奥尔良成为首都以后，州议会、港口、油田和赌场的交易都要经过他的手。他粗鲁、嗜赌，说话不看场合，但他记得每个县长欠他什么，也知道每个将军想要什么。\n他对“统一全美”兴趣不大，更关心预算、选票和棉花价格。休伊在世时，大家把他看作那个不成器的弟弟；休伊的健康变坏以后，他成了唯一能同时稳住州长、议会和军方的人。他的弱点同样明显：南方将领看不起他，俄国人不了解他，关于他酗酒和精神不稳定的传言一直没有停过。§!"
 USA_krcw_moseley_desc:0 "§Y出生：§!§g1874年9月28日，美利坚合众国伊利诺伊州埃文斯顿§!\n§Y所属派别：§!§g南方将领集团§!\n§Y经历：§!§L乔治·范·霍恩·莫斯利1899年毕业于西点军校，以骑兵少尉的身份去了菲律宾，参加过对当地起义者的作战。此后他长期做参谋，先后读完陆军参谋学院和陆军军事学院，1916年随潘兴进入墨西哥，负责后勤。1921年他协助道斯组建联邦预算局，随后晋升准将，又在陆军部主管工业动员，升为少将。1934年他与陆军参谋长麦克阿瑟闹翻。\n内战爆发后，他离开联邦军，投奔朗的南方政府。朗的阵营缺少能组织参谋部的人，他在内战前期出任参谋长，把各州的国民警卫队和志愿民兵编成正规师团。他公开发表反犹和反移民的言论，把工团主义看作外来的阴谋。\n他已七十多岁，不再指挥部队，却仍是南方将领集团的门面，巴顿等人把他推到前台，作为“秩序”的象征。他认为休伊·朗之后的美国不该再交给政客，一旦继承出现危机，他准备以委员会的名义暂停宪法。他的弱点是年龄和名声：年轻军官尊敬他，但很少有人愿意在他手下重新打一场内战，新奥尔良的政客们也一直在防着他。§!"
 PSA_krcw_warren_desc:0 "§Y出生：§!§g1891年3月19日，美利坚合众国加利福尼亚州洛杉矶§!\n§Y所属派别：§!§g共和党（进步派）§!\n§Y经历：§!§L厄尔·沃伦的父亲是挪威移民，在南太平洋铁路公司做修理工。他在贝克斯菲尔德长大，1914年从加州大学伯克利分校法学院毕业，后来在阿拉米达县当检察官，以查办贿赂和私酒案出名。\n1936年华盛顿政变后，他留在加州，协助萨克拉门托的国会组织战时的法院。1939年他当选加州总检察长，1942年当选州长。他支持过《战时权力法》的第一次续期，后来又后悔，认为军区正在把宪法变成一张废纸。1948年他以废除战时权力法为竞选纲领，击败民主党的克拉伦斯·马丁，1949年1月宣誓就任总统。\n他主张恢复各州的文官政府，扩大公共工程和州立大学，对码头工会既谈判也执法。他不信任纽约，也不信任新奥尔良，认为合众国的宪法只在萨克拉门托还活着。共和党里的保守派嫌他太像民主党人，要塞派认为他不懂打仗，而他手里能约束麦克阿瑟的，只有国会的拨款权和马歇尔的忠诚。§!"
 PSA_krcw_martin_desc:0 "§Y出生：§!§g1886年6月29日，美利坚合众国华盛顿州奇尼§!\n§Y所属派别：§!§g民主党§!\n§Y经历：§!§L克拉伦斯·马丁出身华盛顿州东部的磨坊主家庭，从华盛顿大学毕业后回奇尼经营家里的面粉厂，当过奇尼市长。1932年他当选华盛顿州州长，推动修建大古力水坝，用公共工程救济失业的人。\n内战中他是西北各州最早承认萨克拉门托国会的州长之一，此后连任。1948年他代表民主党竞选总统，主张继续新政式的救济和水利工程，在战时权力法问题上比沃伦谨慎，最后落选。\n他仍是民主党在国会里的领袖。民主党在西北的农场和工会里有基础，如果沃伦和要塞派闹翻，或者码头上的罢工收不住，下一次大选民主党有机会赢回总统职位。§!"
 PSA_krcw_macarthur_desc:0 "§Y出生：§!§g1880年1月26日，美利坚合众国阿肯色州小石城§!\n§Y所属派别：§!§g要塞派（西部防务司令部）§!\n§Y经历：§!§L道格拉斯·麦克阿瑟是亚瑟·麦克阿瑟中将的儿子，在西部的军营里长大。1903年他以全班第一的成绩从西点军校毕业，进入工兵部队，去过菲律宾，1914年参加了占领韦拉克鲁斯的行动。1919年起他出任西点军校校长，改革了学校的课程，1925年成为陆军最年轻的少将，此后升任陆军参谋长。\n1936年大选危机中，他执行“白色作战计划”，带兵控制了华盛顿。西海岸各州州长和赶到萨克拉门托的议员因此另立政府，太平洋舰队也跟着州长们走了，只有少数忠于他的军舰哗变东去。他守着华盛顿打了五年，1941年冬天城破，他没有投降，也没有投奔新奥尔良，带着残存的联邦军和陆军部的档案突围西撤。萨克拉门托缺兵，国会赦免了他，任命他为西部防务司令。\n1942年的《战时权力法》把港口城市和内华达山的隘口交给他的司令部管辖，旧金山要塞成了萨克拉门托之外的第二个权力中心。温赖特、哈尔西等跟他西来的军官被称为“要塞派”，他们认为国会守不住西海岸。沃伦总统答应废除战时权力法，马歇尔一直想让他退役。他已年近七十，旧金山和西雅图的码头工人从来不站在他一边。§!"
 WCA_krcw_reuther_desc:0 "§Y出生：§!§g1907年9月1日，美利坚合众国西弗吉尼亚州惠灵§!\n§Y所属派别：§!§g美利坚联合工团（建设派）§!\n§Y经历：§!§L沃尔特·鲁瑟出生在惠灵一个德裔社会党人家庭，父亲是酿酒工人工会的组织者。他十九岁到底特律，在福特的工厂里做工具与模具工。1932年起他作为社会党的代表在英国和法国的工厂里工作，亲眼看到了工团组织如何运转。回国后他领导汽车工人联合会第174分会，1936年在“天桥之战”中被福特公司的打手打成重伤。\n革命爆发后，他当选底特律公社主席，负责组织整个钢铁带的生产，东岸的工厂大多由他的联合会接管。1946年停火以后，他起草了“产业民主宪章”，规定工厂计划由车间委员会与地区联合会共同拟定，并当选联合工团主席。\n他主张先把密西西比河以东建成工业民主的样板，再谈渡河，理由是阿巴拉契亚已经打成了焦土，工团经不起一场打不赢的战争。解放派的福斯特和坎农指责他为了底特律忘了河对岸的佃农，世界产业工人联合会的老人则认为他的宪章在制造新的官僚。他的权力来自代表大会里的多数，而这个多数并不稳固。§!"
 WCA_krcw_cannon_desc:0 "§Y出生：§!§g1890年2月11日，美利坚合众国堪萨斯州罗斯代尔§!\n§Y所属派别：§!§g美利坚联合工团（解放派）§!\n§Y经历：§!§L詹姆斯·帕特里克·坎农生在堪萨斯的一个爱尔兰裔工人家庭，1911年加入世界产业工人联合会，跟着“大比尔”海伍德在中西部组织罢工。他早年崇拜布尔什维克；俄国革命失败、法国工团主义者取得胜利以后，他转向了更重视基层自治的社会主义。\n他在美国社会党内长期担任要职，1932年在党内斗争中被洛夫斯通一派撤去执行书记的职务。此后他作为社会党的代表长住法国和英国，与巴黎和伦敦的联合会领导人都有交情。内战爆发后他回国，负责接待国际志愿者和第三国际的顾问，以善于管理出名。\n停火以后，他和福斯特领导解放派，主张尽快渡过密西西比河，理由是河对岸的工会组织者正在被朗的人处决，西岸的佃农和油田工人每多等一年，就要在朗的机器下多过一年。他在代表大会上说过，停火协定只是还没准备好的借口。他的难处在于东岸的工人已经厌倦战争，而渡河所需的武器和运输都要依靠巴黎和加拿大。§!"
 WCA_krcw_flynn_desc:0 "§Y出生：§!§g1890年8月7日，美利坚合众国新罕布什尔州康科德§!\n§Y所属派别：§!§g世界产业工人联合会传统派§!\n§Y经历：§!§L伊丽莎白·格利·弗林在纽约布朗克斯长大，父母都是爱尔兰裔社会主义者。她十五岁在哈莱姆的社会主义俱乐部第一次公开演讲，随后成为世界产业工人联合会的组织者，参与过1912年劳伦斯纺织工人罢工和1913年帕特森丝绸工人罢工，前后被捕十次，人称“叛逆女孩”。1920年她参与创建美国公民自由联盟，为罢工者组织法律辩护。\n内战前夕，她帮助组织了西海岸的码头工人大罢工。战争期间，她在中央委员会上发言支持征兵，这让不少拒服兵役的委员对她不满，却让前线的矿工和码头工人信任她。麦克阿瑟占据西海岸以后，她的很多老部下留在了旧金山和西雅图的码头上。\n她代表联合工团里最老的传统：取消各产业联合会之间的界线，全北美只要一个大工会，由地方公社自己管理生产。她反对鲁瑟的宪章把权力交给地区联合会的机关，也不赞成坎农把一切押在渡河上。她的支持者分散在矿区和港口，人数不少，却很少能在代表大会上凑成多数。§!"
 CAN_krcw_buck_desc:0 "§Y出生：§!§g1891年1月6日，大不列颠及爱尔兰联合王国英格兰萨福克郡贝克尔斯§!\n§Y所属派别：§!§g工人团结同盟§!\n§Y经历：§!§L蒂姆·巴克十四岁辍学当学徒，1910年移民加拿大，在多伦多做机械工，加入了机械师工会。1920年代他在安大略的工厂里组织工人，1929年创建工人团结同盟，把老工会不肯接纳的非熟练工人组织起来。1931年他和同盟的其他领导人依据《刑法》第98条被判入狱，关在金斯顿监狱，1934年出狱。\n1938年流亡政府出兵新英格兰，巴克公开反对，说这场战争要由安大略的工人付出代价。奥尔巴尼和布法罗两次战败后，1940年春政府扩大征兵，魁北克拒绝服从，蒙特利尔和汉密尔顿全面罢工，开往前线的部队在金斯顿停下来选出了士兵委员会。巴克领导工人团结同盟接管了罢工委员会，国王第二次出逃，去了墨尔本。\n他是加拿大工团共和国的创建者之一和现任领导人。共和国是第三国际援助美利坚联合工团的通道，他主张积极支持密西西比河东岸的工团，与朗的美国保持对抗。同盟的一端是伍兹沃思和科德威尔，担心加拿大被拖进一场打不起的战争；另一端的人要他把革命推过边界。他的位置取决于能否让两边都留在同盟里。§!"
 CAN_krcw_buck_hard_desc:0 "§Y出生：§!§g1891年1月6日，大不列颠及爱尔兰联合王国英格兰萨福克郡贝克尔斯§!\n§Y所属派别：§!§g工人团结同盟（强硬派）§!\n§Y经历：§!§L蒂姆·巴克1910年从英格兰移民多伦多，做机械工出身。1929年他创建工人团结同盟，1931年依据《刑法》第98条被判入狱，在金斯顿监狱关到1934年。1940年春，干涉新英格兰的战争失败，征兵引发总罢工和金斯顿兵变，他领导同盟接管罢工委员会，国王出逃墨尔本，工团共和国由此建立。\n那场干涉战争让他得出一个结论：一个肯出兵的邻国能把革命扼杀在起点。1938年出兵的是加拿大，下一次出兵的会是朗的美国。随着俄国的武器经墨西哥源源运到朗的手里，他在同盟里站到了主张输出革命的一端。\n在强硬派的路线下，他相信朗迟早会来，与其等着，不如现在就把加拿大变成北美革命的军械库：武装密西西比河东岸的工团，在五大湖上造炮艇，把志愿者送过边界。代价是更大的军队、更重的征用和草原省份的不满。伍兹沃思公开反对他，麦克尤恩只同意保留地下通道、不同意派兵，默里则认为钱应该花在海军上。§!"
 CAN_krcw_woodsworth_desc:0 "§Y出生：§!§g1874年7月29日，加拿大自治领安大略省埃托比科克§!\n§Y所属派别：§!§g工人团结同盟（和平派）§!\n§Y经历：§!§L詹姆斯·沙弗·伍兹沃思是卫理公会牧师的儿子，在马尼托巴长大，毕业于温尼伯的卫斯理学院，又在牛津学过神学。他在温尼伯的移民区主持全民传道会多年，从那里接受了社会福音思想。1917年他反对征兵，次年因为和平主义立场辞去牧职，到温哥华的码头做装卸工。1919年温尼伯总罢工期间，他为罢工者的报纸写文章，以煽动性诽谤罪被捕，后来检方撤回了指控。1921年他当选温尼伯的议员，在议会里为失业者和移民说话。\n1938年流亡政府出兵新英格兰时，他是议会里少数投票反对的人。1940年的罢工和兵变以后，他加入了新成立的共和国，理由是这场战争毁掉了旧政府。\n他已七十多岁，是工团共和国里少数主张和平主义的领袖。他反对在五大湖驻军，反对向密西西比河东岸运送武器，也反对任何针对流亡王室的报复，理由是加拿大打不起任何一场战争。同盟里的年轻人说他天真，但草原的农民和教会团体仍然听他的，他在代表大会上的票数不容忽视。§!"
 CAN_krcw_coldwell_desc:0 "§Y出生：§!§g1888年12月2日，大不列颠及爱尔兰联合王国英格兰德文郡锡顿§!\n§Y所属派别：§!§g草原合作社运动§!\n§Y经历：§!§L梅杰·詹姆斯·科德威尔在英格兰读的师范，1910年移民加拿大，先在阿尔伯塔教书，后来到萨斯喀彻温的里贾纳当学校校长，并参与组织教师协会。1920年代他当选里贾纳市议员，1932年出任萨斯喀彻温农工党的领袖，把小麦合作社、信用社和城里的工会拉到同一张选票上。\n1940年的总罢工从东部城市开始，草原省份起初只是观望。科德威尔带着合作社运动加入共和国，条件是农场留在农民手里，小麦的收购和出口由合作社管理。这笔交易让共和国在西部站稳了脚跟，也让草原的合作社成了工团共和国里最不革命、也最稳固的一块。\n他关心的是小麦出口、信用社和教区学校。他对密西西比河以东的革命输出没有兴趣，因为草原的农民卖不出小麦，就会在下一次选举里把政府换掉。巴克的强硬派认为合作社拖住了共和国，他则提醒他们，共和国的面包来自草原。他在城市工会里没有什么根基，这是他最大的弱点。§!"
 CAN_krcw_mcewen_desc:0 "§Y出生：§!§g1891年2月11日，大不列颠及爱尔兰联合王国苏格兰阿伯丁郡斯通黑文§!\n§Y所属派别：§!§g工人团结同盟§!\n§Y经历：§!§L汤姆·麦克尤恩在苏格兰学的是铁匠手艺，1912年移民加拿大，在萨斯卡通一带做工。1920年代他在草原上组织农业工人和铁路工人，给工会报纸写稿，后来成为工人团结同盟的全国书记。1931年他与巴克一同依据《刑法》第98条被判入狱，在金斯顿监狱关到1934年。\n1940年罢工期间，他负责罢工委员会的报纸和传单。共和国成立后他继续当工会报纸的编辑，是共和国里最好的宣传家。美国内战的后几年，他组织了一套地下通道，把朗控制区里遭到追捕的工团主义者从草原边界接进加拿大，再送往东岸。\n他的立场介于伍兹沃思的和平主义与巴克的输出革命之间：不派兵，但也不关上那条地下通道。他认为密西西比河东岸的同志如果被朗的人抓住，下一个就轮到边界这一侧。他的根基只在报社和工会里，军队和草原的合作社都不把他当作自己人。§!"
 CAN_krcw_murray_desc:0 "§Y出生：§!§g1896年6月22日，加拿大自治领新斯科舍省格兰顿§!\n§Y所属派别：§!§g共和国海军§!\n§Y经历：§!§L伦纳德·沃伦·默里1911年考入新成立的加拿大皇家海军学院，是第一批学员之一。大战期间他作为见习军官在皇家海军的舰只上服役，在北大西洋执行护航和巡逻任务。1919年协约国战败后，加拿大海军只剩下几艘旧舰，他在哈利法克斯和埃斯奎莫尔特之间辗转，做参谋和训练工作。\n1938年到1940年的干涉战争中，他负责大湖区的炮艇和运输船。1940年国王出逃时，海军里有一部分军官随流亡政府去了澳大利亚，他留在了哈利法克斯，把剩下的舰只和船坞交给了罢工委员会。他因此成为共和国海军的建立者，从大湖区的炮艇一直管到北大西洋的护航。\n他的政治立场出自地理判断：加拿大守不住一条陆上边界，但可以让任何人都无法封锁圣劳伦斯河。他主张共和国的军费主要花在海上，这让他与所有陆军出身的政治家为敌。同盟里有人始终不信任这个前皇家海军军官，他在党内没有派系，能依靠的只有舰队。§!"
 AST_krcw_menzies_desc:0 "§Y出生：§!§g1894年12月20日，维多利亚殖民地杰帕里特§!\n§Y所属派别：§!§g澳大利亚联合党§!\n§Y经历：§!§L罗伯特·戈登·孟席斯是维多利亚乡下一个店主的儿子，靠奖学金读完墨尔本大学法律系，1918年取得律师资格，此后在宪法诉讼中出名。大战期间他没有参军，这件事被政敌提了一辈子。1928年他进入维多利亚州议会，1934年转入联邦议会出任司法部长，后来成为联合党领袖和总理。\n1940年，国王和流亡政府在加拿大的罢工和兵变之后第二次出逃，落脚墨尔本，后来迁到堪培拉。孟席斯是接待朝廷的人，也是此后十年里在王室和澳大利亚议会之间维持平衡的人。流亡的大臣和澳大利亚的部长在同一栋楼里开会，谁才是真正的政府一直没有说清楚。\n他是王室的坚定支持者，但他把问题摆上了桌面：澳大利亚是一个供养流亡朝廷的殖民地，还是一个碰巧拥有一位国王的国家？他首先要求讲清楚朝廷的开支由谁来付。他对收复不列颠持保留态度，更关心澳新自身的防务和太平洋的贸易。复国派指责他只顾澳大利亚，共和派则认为他对王室让步太多。§!"
 NZL_krcw_holland_desc:0 "§Y出生：§!§g1893年10月18日，新西兰殖民地格林代尔§!\n§Y所属派别：§!§g改革党§!\n§Y经历：§!§L西德尼·乔治·霍兰是坎特伯雷一个农场主的儿子，父亲后来当过基督城市长。大战期间他在新西兰野战炮兵服役，因病退役回国。战后他在基督城经营工程机械生意，1935年当选基督城北区议员，后来成为改革党的领袖。\n1940年流亡朝廷迁到澳大利亚以后，新西兰和澳大利亚组成澳新协约。霍兰支持王室，也赞成两国在防务上合作，但他对合并保持警惕，担心新西兰的利益会被墨尔本和堪培拉忽视。他坚持惠灵顿保留自己的议会、预算和对外贸易。\n作为新西兰总理，他的选民是坎特伯雷的农场主和城市里的商人。他们要的是羊毛、黄油和肉类的出口市场，而这些市场大多在第三国际手里。王室派希望他更紧地靠拢堪培拉，工党则要求他与不列颠的工团政府恢复贸易。他至今没有在这两件事上作出决定，改革党内部也为此分成了两派。§!"
 TIB_krcw_reting_desc:0 "§Y出生：§!§g1912年，西藏达布§!\n§Y所属派别：§!§g噶厦§!\n§Y经历：§!§L第五世热振活佛图丹绛白益西坚赞生于达布地区，幼年被认定为热振寺活佛的转世，在热振寺和色拉寺接受经院教育，与十三世达赖喇嘛关系亲近。1933年十三世达赖喇嘛圆寂，次年他被推举为摄政，当时二十岁出头。摄政初期他依靠噶伦赤门维持局面，对主张改革的官员和亲英的军官都很严厉。\n他主持了十四世达赖喇嘛转世灵童的寻访，灵童在安多被找到，迎回拉萨坐床。北伐期间，噶厦对南京保持观望。1947年，噶厦与南京签订《拉萨协定》：西藏承认中华民国的主权，南京承诺不改变西藏现行制度。\n十四世达赖喇嘛现年十四岁，热振仍以摄政的身份主持噶厦。他在南京和噶伦堡之间周旋：南京派来的工作队要推行减租和办学校，从噶伦堡来的印度商人则带来步枪和金币。贵族和色拉、哲蚌、甘丹三大寺各有自己的打算。他的摄政只能维持到达赖喇嘛成年，拉萨的贵族家族都在考虑那以后自己站在哪一边。§!"
 SPR_krcw_durruti_desc:0 "§Y出生：§!§g1896年7月14日，西班牙王国莱昂省莱昂§!\n§Y所属派别：§!§g全国劳工联合会（无政府共产主义）§!\n§Y经历：§!§L杜鲁蒂的父亲是莱昂的铁路工人和工会会员，他十四岁进机车修理厂当学徒。1917年全国总罢工被国民卫队镇压后，他逃往法国，回国时被捕，又越狱再次越过边境，正赶上法兰西第三共和国的最后几年。他加入马赛的一个革命小组，在争夺马赛的巷战中出了名，公社随后派他带着一船欧战剩下的武器去巴塔哥尼亚支援罢工的牧工。那场仗打成了僵局，他回到西班牙，后来又和马赫诺一起去过一次巴塔哥尼亚。\n1936年伊比利亚革命爆发，他带着一支从巴塞罗那出发的民兵纵队开赴阿拉贡前线，这支纵队后来以他的名字命名。革命胜利后，西班牙没有设总统，只有联邦委员会和各地的自由市；1946年葡萄牙革命，葡萄牙并入联邦，全国劳工联合会政府宣布放弃全部殖民地。杜鲁蒂从不担任部长，却是联邦里说话最有分量的人。\n他反对任何有约束力的中央机构，无论是马德里的还是巴黎的。国际书记处要求伊比利亚统一军需和外贸，他每次都把问题退回各地的联合会表决。他身边的比森特·罗霍等职业军官认为，这样的联邦守不住比利牛斯山；工团派中的温和派则希望建立全国经济委员会。他今年五十三岁，联邦还没有想过没有他的时候该怎么办。§!"
 IRE_krcw_odonnell_desc:0 "§Y出生：§!§g1893年2月22日，爱尔兰多尼戈尔郡邓格洛附近§!\n§Y所属派别：§!§g共和国大会（革命社会主义）§!\n§Y经历：§!§L奥唐奈生在多尼戈尔一个讲爱尔兰语的小农家庭，当过阿伦莫尔岛上的小学教师，亲眼看着岛上的年轻人每年夏天坐船去苏格兰当季节工。1918年他辞去教职，替爱尔兰运输与普通工人工会在德里和蒂龙组织工人，随后参加了独立战争。\n独立战争结束后，他以分治为由反对条约，在反条约的新芬党里主编党报《自由邦》，把它办成宣传社会主义的阵地。法国、意大利和不列颠相继革命之后，他被新芬党开除，眼看爱尔兰从英国资本的手里换到了德国资本的手里，便另立“爱尔兰自由”党，报纸也被政府查封。1940年代德国势力退出西欧后，他和汤姆·巴里等老共和军军官掌握了都柏林，共和国大会成为执政党。1947年《都柏林协定》把北爱尔兰交还爱尔兰，条件之一是爱尔兰加入第三国际。\n他现在要做的是把阿尔斯特真正并进来：贝尔法斯特的新教工人有自己的工会和自己的恐惧，天主教会也不信任一个社会主义政府。他坚持都柏林与伦敦平等相待，在阿尔斯特和海上通道问题上一步不让，这让他与格拉斯哥和伦敦的同志关系时常紧张。§!"
 NOR_krcw_tranmael_desc:0 "§Y出生：§!§g1879年6月27日，挪威王国南特伦德拉格郡梅尔许斯§!\n§Y所属派别：§!§g挪威工人党（工团派）§!\n§Y经历：§!§L特兰梅尔是梅尔许斯一个小农家的儿子，年轻时当油漆工。1900年到1905年他在美国做工，接触了世界产业工人联合会，回国后把直接行动和产业工会的主张带进了挪威工会。1911年他在特隆赫姆提出的决议要求工会放弃长期集体合同、用罢工和怠工逼资方让步，挪威工会中的“工会反对派”由此形成，特隆赫姆成了他的根据地。\n1918年他领导的激进派接管了挪威工人党，此后多年担任党的书记，主编《工人报》。挪威在德国主导的战后秩序里保持中立，他坚持党的工团派路线，也坚持党不必听命于巴黎。大战后期德国的势力退出北欧，工人党掌握了政权，挪威随后加入第三国际。挪威的铝厂和水电站如今在国际的共同计划里占有一席之地。\n他今年七十岁，日常党务和政府工作已交给年轻一代，自己仍主持党的全国委员会。党内一派主张挪威做国际最可靠的成员，因为俄罗斯的北方舰队离挪威只隔着一道峡湾；另一派担心挪威的师被调去易北河。他在两派之间做最后的裁决，但已经很少出门了。§!"
 DEN_krcw_larsen_desc:0 "§Y出生：§!§g1897年8月5日，丹麦王国欧登塞§!\n§Y所属派别：§!§g丹麦联合工团（工团主义）§!\n§Y经历：§!§L拉尔森生在欧登塞一个穷人家，小时候换过很多份零工，家里支持社会民主党，他也跟着去听党的集会。1918年11月他参加了哥本哈根蔬菜市场广场的骚乱，此后越来越激进。社会民主党和丹麦工会联合会与资方达成妥协后，他退出社会民主党，加入新成立的左翼社会党，这个党一年后与工团派合并。\n1920年代后期他去法国和不列颠考察过两国的革命，回来时很失望，认为丹麦用不着照搬法国和英国的做法，应该有自己的社会主义，也要把受城市化冲击的农民拉到工人一边。1930年斯陶宁出任首相后不久，他成为左翼社会党的领袖，一边争取社会民主党里的激进派，一边在农村发展组织。大战后期德国的势力崩溃，丹麦发生革命，联合工团掌握了政权；冰岛随后在1944年宣布成为独立的共和国。\n他主张丹麦在国际里专做造船和航运，把哥本哈根和奥胡斯的船厂接进共同计划，避免卷进大国之间的争执。丹麦扼守通往波罗的海的海峡，俄国人和巴黎都盯着这件事，他的中立打算因此很难维持。§!"
 BEL_krcw_lahaut_desc:0 "§Y出生：§!§g1884年9月6日，比利时王国列日省瑟兰§!\n§Y所属派别：§!§g比利时工团联合会（工团主义）§!\n§Y经历：§!§L拉奥是瑟兰一个工人家庭的儿子，十四岁进科克里尔钢铁厂当学徒，后来当上锅炉工。1905年他参与创办了冶金工人工会“站起来”，从此以工会组织者为业。欧战期间他志愿加入比利时装甲汽车军团，随军到俄国前线作战。\n战后德国主导的秩序下，比利时的工会受到严格限制，他在列日和沙勒罗瓦的钢铁厂里组织过多次罢工，也因此多次入狱。1940年代初第三国际的军队越过莱茵河，德国在比利时的驻军撤走，列日的钢铁工人接管了工厂，他成为新成立的工团联合会的领袖。比利时的化工和钢铁如今是国际共同计划的一部分。\n他主张比利时、荷兰和卢森堡在国际内部一起投票、一起谈判，好让小国在巴黎和伦敦面前多一点分量。佛兰德斯的天主教工会和工团联合会一直合不来，安特卫普港的码头工人也有自己的打算。他今年六十五岁，以敢在街头带头著称，不擅长在委员会里讨价还价。§!"
 AUS_krcw_klahr_desc:0 "§Y出生：§!§g1904年9月16日，奥匈帝国下奥地利大公国维也纳§!\n§Y所属派别：§!§g革命社会主义，奥地利民族派§!\n§Y经历：§!§L阿尔弗雷德·克拉尔生于维也纳一个犹太家庭，在维也纳大学读政治学并取得博士学位，二十出头就加入了奥地利的社会主义运动。1920年代他为党报撰稿，因参加罢工和示威多次被捕。\n1937年他以笔名发表了一组文章，论证奥地利人是一个独立的民族，有自己的历史和语言习惯，不应被当作德意志民族的一部分。当时德奥两国的社会主义者几乎都主张“大德意志”的工人共和国，这组文章让他在党内陷入孤立。\n1945年西部各州在萨尔茨堡组成共和国，他进了阿德勒的内阁，旧文章成了共和国的立国理由。他主张由工厂和村庄的工人委员会掌权，坚决反对并入德国；汉堡的许多人认为他在分裂德意志工人阶级，伦纳与他目标一致，在方法上与他争论多年。§!"
 AUS_krcw_renner_desc:0 "§Y出生：§!§g1870年12月14日，奥匈帝国摩拉维亚边区下塔诺维茨§!\n§Y所属派别：§!§g奥地利社会民主工人党§!\n§Y经历：§!§L卡尔·伦纳生在摩拉维亚一个子女众多的贫苦农家，靠奖学金读完中学，在维也纳大学学法律，毕业后在帝国议会图书馆工作。1890年代起他以笔名发表关于民族问题的著作，主张多民族帝国内各民族按文化自治，不按地域划分。1907年他当选帝国议会议员，是奥地利社会民主工人党的主要理论家之一。\n大战之后，他在维也纳领导社会民主党人与基督教社会党合作，推动了教育和社会保险方面的改革，此后长期是党在议会里的领袖。1945年他在萨尔茨堡进了阿德勒的内阁，是社会民主派在共和国里的代表。\n他年近八十，比党内的对手们都活得长。他对奥地利前途的主张只有一条：先让奥地利作为一个国家存在，再和德国人、俄国人谈条件。他愿意和基督教社会党人组成大联合政府，克拉尔认为他太愿意和任何一方妥协，阿德勒的人则把他看作旧帝国议会政治的遗老。§!"
 TUR_krcw_cakmak_desc:0 "§Y出生：§!§g1876年1月12日，奥斯曼帝国君士坦丁堡吉汉吉尔§!\n§Y所属派别：§!§g共和人民党（军事委员会）§!\n§Y经历：§!§L恰克马克是一名炮兵上校的儿子，祖父教他波斯语和阿拉伯语。他1893年进入奥斯曼军事学院，1896年进入参谋学院，以参谋上尉身份毕业，此后在塞尔维亚和阿尔巴尼亚服役，结识了统一与进步委员会的成员。巴尔干战争中他在西线军团任第一师参谋长。欧战中他在加里波利指挥第五军，后来转战高加索和巴勒斯坦，1918年升任中将，同年圣诞前夕被任命为奥斯曼帝国总参谋长。\n战后他以战争英雄的身份留在军中，经好友穆斯塔法·凯末尔推荐晋升元帅，多年不过问政治，只负责镇压安纳托利亚的游击队。1940年代德国的秩序崩溃，奥斯曼帝国在1942年到1945年间解体。他认为共和人民党已经乱得无法执政，便以军事委员会的名义接管了安卡拉。\n他把陆军交给莫斯科协定，却不肯把海峡交出去：俄国黑海舰队进出地中海要看土耳其的脸色，莫斯科一直要求自由通行，他一直不答应。军政府里的泛突厥派希望向东边的突厥人扩张，他认为土耳其没有与俄国对抗的力量。他今年七十三岁，还没有指定继任者。§!"
 GRE_krcw_papagos_desc:0 "§Y出生：§!§g1883年12月9日，希腊王国阿提卡州雅典§!\n§Y所属派别：§!§g军事督政府（军政府）§!\n§Y经历：§!§L帕帕戈斯出身雅典的军官家庭，先后在布鲁塞尔的比利时军事学院和伊普尔的骑兵学校受训，1906年以骑兵少尉身份回到希腊陆军。巴尔干战争中他在骑兵部队和参谋部服役，此后成为陆军里最受信任的参谋军官之一。\n两次大战之间，希腊的政局在王党和共和派之间来回摇摆，他始终站在王室一边，一路升到总参谋长。第二次世界大战期间希腊爆发内战，民主军的游击队在北方和群岛上作战，工团主义者是其中的骨干。帕帕戈斯指挥政府军打完了这场战争，1945年内战结束，他以军事督政府的名义执政，随后带着希腊加入了莫斯科协定。\n民主军的残部退进了品都斯山和伊庇鲁斯的海岸，补给由意大利的渔船夜里从奥特朗托运来。雅典多次向罗马抗议，罗马的回答是那些是私人的船。他在山里追剿游击队已经几年了，俄国顾问带来了山地作战条令，也带来了莫斯科对雅典外交的干预。王党希望他早日把权力交还国王，他没有给出任何日期。§!"
 POL_krcw_rydz_desc:0 "§Y出生：§!§g1886年3月11日，奥匈帝国加利西亚与洛多梅里亚王国布热扎内§!\n§Y所属派别：§!§g民族统一阵营（军政府）§!\n§Y经历：§!§L雷兹是东加利西亚一个穷人家的孩子，不到十岁就失去了父母，由养父母供他读书。他在克拉科夫的雅盖隆大学学过美术，加入了积极斗争联盟和射手协会，成为毕苏斯基的追随者，“希米格维”是他当时的化名。1914年他离开奥匈军队投奔毕苏斯基的波兰军团，升迁很快。1917年宣誓危机中他拒绝向德皇效忠，被禁止穿军装，随即到克拉科夫接手波兰军事组织，同时对抗同盟国和俄国。\n1919年德国胜局已定，他转入和平反对派。1925年奥古斯特四世国王大赦军团老兵，他才得以回国，被禁止带兵，当选参议员，成为老军团士兵的代言人。他和志同道合的人组建了民族统一阵营，后来发动政变，以第一元帅的身份掌握了国家。1940年代德国崩溃，波兰废除君主制，成为波兰共和国，保住了1919至1921年的边界和东普鲁士南部，并加入莫斯科协定。\n波美拉尼亚、诺伊马克和西里西亚却划给了施莱歇尔的德意志民族共和国，而后者也是协定成员。雷兹每年都派总参谋长带着同一份文件去莫斯科，每年得到的答复都是时机未到。君主派还在，瓦迪斯瓦夫·安德斯这样的将领在军中另有威望，他的政权靠的是军队的等级制度和不问政治的名声。§!"
 CZE_krcw_syrovy_desc:0 "§Y出生：§!§g1888年1月24日，奥匈帝国波希米亚王国特热比奇§!\n§Y所属派别：§!§g民族团结督政府（军政府）§!\n§Y经历：§!§L瑟洛维学的是建筑，在奥匈军队服过兵役后到华沙的一家建筑公司工作。欧战爆发时他在俄国，1914年加入俄军里由捷克侨民组成的“捷克亲兵队”，这支部队后来扩编为捷克斯洛伐克军团。1917年7月兹博罗夫战役中他失去了右眼，此后戴着黑眼罩，军中都认得他。1918年他指挥军团在西伯利亚铁路沿线作战。\n俄国内战结束后军团回到欧洲，波希米亚仍在哈布斯堡治下，军团老兵长期受到警察监视。1940年代哈布斯堡君主国在大战中瓦解，布拉格宣布独立，老军团军官掌握了新国家的军队，瑟洛维作为军团里资历最老的将领出任督政府首脑。\n捷克夹在红色的德意志社会主义共和国和莫斯科之间。督政府选择了俄罗斯的保护，以服从换取军援，代价是国内的工会和左翼政党被严格管控，比尔森和布拉格的工人组织只能半公开活动。卢德维克·斯沃博达等年轻一些的军团军官在军中另有威望，他们与俄国顾问的关系也更近。§!"
 YUG_krcw_simovic_desc:0 "§Y出生：§!§g1882年10月28日，塞尔维亚王国克拉古耶瓦茨§!\n§Y所属派别：§!§g王家军政府（军政府）§!\n§Y经历：§!§L西莫维奇毕业于贝尔格莱德的军事学院，是塞尔维亚陆军的职业军官。他参加了两次巴尔干战争，欧战中随塞尔维亚军队撤过阿尔巴尼亚的群山，又在萨洛尼卡战线作战。\n战后他长期在塞尔维亚陆军的参谋部门任职，后来主管陆军的航空部队，是军中少数懂飞机的高级将领。1940年代哈布斯堡君主国和德国的秩序相继崩溃，南部斯拉夫各地并入由卡拉乔尔杰维奇王朝统治的南斯拉夫王国。1945年他率领军官推翻了保罗摄政王，以国王的名义组成王家军政府，出任国家元首，随后加入莫斯科协定。\n军政府自称是临时的，但至今没有恢复议会。俄国的贷款养着军队，也维持着克罗地亚人与塞尔维亚人之间的平静。马其顿问题让他同时与保加利亚和希腊对立，贝尔格莱德的强硬派主张在国内承认马其顿民族，而这两个邻国都是协定成员，莫斯科要求他克制。贝尔格莱德的知识分子已经开始公开质疑军政府还要执政多久。§!"
 HUN_krcw_bardossy_desc:0 "§Y出生：§!§g1890年12月10日，奥匈帝国匈牙利王国沃什州松博特海伊§!\n§Y所属派别：§!§g民族团结党（专制主义）§!\n§Y经历：§!§L巴尔多希出身松博特海伊的一个小贵族家庭。他在布达佩斯大学读法律，毕业后进入匈牙利宗教与教育部任职，此后转入外交部门，以谨慎和守口如瓶著称，在奥匈共同外交部门任职多年，一度派驻布加勒斯特。\n1940年代哈布斯堡君主国在大战中瓦解，俄军夺取了维也纳以东的奥地利领土，布达佩斯宣布匈牙利完全独立。在俄国人和匈牙利旧统治阶层都能接受的人选中，这位没有党派背景的外交官最合适，他出任总理，组建民族团结党，带着匈牙利加入了莫斯科协定。\n他的政府靠的是大地主和军官团：土地改革被一再推迟，布达佩斯郊区的工人组织受到警察监视。君主派希望迎回哈布斯堡家族，这需要莫斯科点头，而莫斯科不愿意。特兰西瓦尼亚问题让他和同为协定成员的罗马尼亚互不信任，两国的中学地图把它划给不同的国家，莫斯科则要求双方都不得公开提出领土要求。§!"
 ROM_krcw_antonescu_desc:0 "§Y出生：§!§g1882年6月2日，罗马尼亚王国阿尔杰什县皮特什蒂§!\n§Y所属派别：§!§g军人政府（军政府）§!\n§Y经历：§!§L安东内斯库是一名军官的儿子，在克拉约瓦的军校和布加勒斯特的军事学校受训，1904年成为骑兵少尉。1907年农民起义时他带兵镇压了加拉茨一带的暴动。1916年罗马尼亚参加欧战，他在北方集团军任作战处长，1917年马拉谢什蒂战役的防御计划有他的一份功劳。他脾气暴躁，头发发红，军中称他“红狗”。\n战后罗马尼亚处在德国主导的秩序里，他历任驻外武官、总参谋长和国防部长，与政党政客的关系一直很坏，几次被免职又被召回。1940年代德国的秩序崩溃，罗马尼亚倒向俄国，他以国王的名义组建军人政府，国王只保留名义。\n普洛耶什蒂的油田是莫斯科协定最重要的石油来源，这是他在协定里说话的本钱，也是俄国顾问常驻布加勒斯特的原因。特兰西瓦尼亚问题让他与匈牙利对立，莫斯科禁止两国谈论此事。铁卫团的残余分子把他当作敌人，自由派政客想让国王收回权力，他对两者都不信任。§!"
 BUL_krcw_georgiev_desc:0 "§Y出生：§!§g1882年8月11日，奥斯曼帝国东鲁米利亚帕扎尔吉克§!\n§Y所属派别：§!§g环节派（军政府）§!\n§Y经历：§!§L格奥尔基耶夫出生在东鲁米利亚与保加利亚合并之前的帕扎尔吉克，家境中等。和许多没有家产的同辈人一样，他进了军校，以步兵中尉身份毕业，参加了两次巴尔干战争和欧战，在欧战中失去了一只眼睛。不能再上前线后，他转任教官和参谋，并参与组织了由现役和预备役军官组成的军事同盟。\n1920年代他当教官，在马其顿指挥部队对付塞尔维亚的切特尼克，也在军校授课。塞尔维亚革命之后，他支持康斯坦丁·格奥尔基耶夫的威权政府，出任铁路与电报部长。1928年他与达米扬·韦尔切夫创立了环节派，主张由军人收拾政党留下的烂摊子，有没有王座都一样。1940年代德国的秩序崩溃后，环节派掌握了索非亚，他以沙皇的名义执政，沙皇只保留名义，保加利亚随后加入莫斯科协定。\n马其顿问题让他与南斯拉夫针锋相对，而南斯拉夫也是协定成员，莫斯科要求双方克制。内马其顿革命组织的老成员嫌他太软，农民联盟的人嫌他太硬，军官团里还有人盼着沙皇收回实权。§!"
 PER_krcw_qavam_desc:0 "§Y出生：§!§g1873年1月2日，波斯崇高国德黑兰§!\n§Y所属派别：§!§g伊朗民主党（专制主义）§!\n§Y经历：§!§L加瓦姆出身恺加王朝的一个官宦世家，兄长沃苏格·道莱也多次出任首相。他少年时进宫当差，给纳赛尔丁沙阿做过侍从，后来在宫廷书记处任职。1906年立宪运动中，莫扎法尔丁沙阿颁布的立宪诏书由他起草。此后他历任内政、司法、财政和战争大臣，1918年出任呼罗珊省省长。\n1920年代起他多次出任首相，每次都在国王、议会和外国使馆之间周旋，也几次被政敌赶下台、流亡欧洲。大战期间俄国的影响越过了里海，德黑兰在1940年代成了莫斯科的保护国。他组建了伊朗民主党，在议会里拉起一个亲政府的多数，重新当上首相。\n他靠的是与俄国人打交道的本事：石油租让、驻军和铁路都要谈，谈到什么程度由他掌握。北方阿塞拜疆的工人和农民运动是他最大的心病，大不里士的工会得到巴黎的同情，也有人说得到了巴黎的钱。部落首领、宗教界和国王身边的人都不喜欢他，他今年七十六岁。§!"
 AFG_krcw_zahir_desc:0 "§Y出生：§!§g1914年10月15日，阿富汗埃米尔国喀布尔省喀布尔§!\n§Y所属派别：§!§g王室（绝对君主制）§!\n§Y经历：§!§L查希尔是穆罕默德·纳迪尔的儿子，在喀布尔的英语和法语学校读完中小学，又被送到德国的军事学校受训。阿曼努拉在位时，父亲坚持让他当了战争部副大臣和教育部副大臣。\n达鲁拉曼王宫遭到洗劫之后，纳迪尔收复喀布尔，自立为王，阿曼努拉起兵争夺王位，阿富汗陷入内战。查希尔在内战中带过步兵，战后得到了丰厚的嘉奖。阿曼努拉兵败出逃，但他的余党没有散尽，纳迪尔后来死于据说由他们策划的一次爆炸，查希尔随即加冕。大战期间俄国的势力南下，喀布尔在1940年代成了莫斯科的保护国。\n他性格谨慎，国事多由几位叔父拿主意，他们个个有主见，也个个有野心。他对莫斯科和德里都保持距离，与德里签订的协定把普什图部落的问题交由两国共同“管理”，实际上管事的是俄罗斯顾问。阿曼努拉的旧党、主张改革的年轻官员和边境部落都在等机会，他今年三十五岁，还没有真正确立自己的权威。§!"
 MON_krcw_magsarjav_desc:0 "§Y出生：§!§g1877年，大清外蒙古赛因诺颜汗部中末旗§!\n§Y所属派别：§!§g摄政会议（专制主义）§!\n§Y经历：§!§L马克思尔扎布出身旗里的贵族家庭，十一岁开始识字，十六岁成家，从旗长那里分得了产业，二十五岁时给旗长的儿子当属官，自己有畜群和骆驼队，继承父亲的爵位后仍过着游牧生活。1911年他被派到科布多，给清朝的科布多参赞大臣溥熙当副手，不久外蒙古宣布脱离清朝独立，建立博克多汗国。他请溥熙自行离境，遭到拒绝，便与丹丁苏伦、丹毕坚赞一起围攻科布多，因此获封“坚毅英雄”。1913年他在锡林郭勒与中国军队作战，1914年因失去俄国援助撤回，后来又奉命讨伐图谋复辟清朝的巴布扎布，1918年得到自己的封地。\n此后他因涉嫌与苏赫巴托尔有联系被捕受刑，恩琴男爵攻占库伦后获释，短暂代理过总理，后任陆军大臣，协助恩琴把中国军队赶出蒙古。他怀疑恩琴的真实意图，拒绝参加对满洲的远征，与男爵的关系越来越坏。大战之后，恩琴的神秘主义政权被他自己的军官推翻，摄政会议以博克多汗的名义执政，马克思尔扎布成为会议的首脑。\n摄政会议的秩序靠俄国驻军的步枪维持，库伦的财政也靠俄国的贷款。他对南京在内蒙古的影响保持警惕，也担心恩琴的旧部和寺院里的喇嘛。他今年七十二岁，会议里的王公们已经在考虑他之后的事。§!"
