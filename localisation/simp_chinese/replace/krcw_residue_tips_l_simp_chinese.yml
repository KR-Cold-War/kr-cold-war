 LOADING_TIP_142:0 "第三国际的顾问和清算联盟的贷款到哪里，那里的工会联合会就跟着壮大。"
 LOADING_TIP_143:0 "休伊·朗的统一党控制着密西西比河以西的大片土地，新奥尔良是莫斯科协定在美洲的支柱。"
 LOADING_TIP_144:0 "周恩来的南京政府是国民党左派的政府，第三国际把它视为东方最重要的盟友。"
 LOADING_TIP_145:0 "这场冷战只会以两种方式结束：一场新的世界大战，或者一个阵营从内部崩溃。"
 LOADING_TIP_146:0 "1946年的圣路易斯停火结束了第二次美国内战的战斗，但没有一方签署和约。"
 LOADING_TIP_147:0 "日内瓦停火制度监督着世界各地的停战线。代表们谈下的停火远多于和约。"
 LOADING_TIP_148:0 "萨文科夫的俄罗斯国由最高执政者统治。东正教会是国家的一个部门，政治犯被行政流放到西伯利亚。"
 LOADING_TIP_149:0 "台尔曼的德意志社会主义共和国与施莱歇尔的德意志民族共和国隔着易北河对峙。"
 LOADING_TIP_150:0 "日本保住了台湾，却失去了朝鲜和满洲。岸信介的政府决心把它们夺回来。"
 LOADING_TIP_151:0 "金元凤的朝鲜民国与越南、柬埔寨、老挝和缅甸一样，是南京的兄弟共和国。"
