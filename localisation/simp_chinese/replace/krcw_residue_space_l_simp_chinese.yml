 Space_News_Global_Lunar_Orbiter_Title_SOV:0 "[GetNewspaperHeader]俄罗斯将世界首个航天器送入绕月轨道"
 Space_News_Global_Lunar_Orbiter_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]已将世界首艘航天器送入绕月轨道，标志着超越此前深空任务的重要一步。官员证实探测器已完成从地球出发的旅程，执行了计划中的机动动作，并进入了稳定的绕月轨道。这一成就比飞掠更具挑战性，需要精确的导航、可靠的通信以及在另一个天体附近的谨慎控制。科学家预计此次任务将传回对月球表面的宝贵观测数据，并为未来的着陆尝试提供经验。全球报纸纷纷将此次成功描述为竞逐月球的主导权之战中的转折点。外国政府正在密切研究此次任务，因为绕月轨道具有科学、政治和战略意义。官员们强调和平探索，但更广泛的意义已然清晰：航天器如今已能在另一个世界的周围运行。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
