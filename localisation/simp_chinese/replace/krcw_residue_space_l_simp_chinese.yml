 Space_News_Global_Interplanetary_Probe_Title_SOV:0 "[GetNewspaperHeader]俄罗斯完成世界首次行星际探测任务"
 Space_News_Global_Interplanetary_Probe_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]发射了世界首个专用行星际探测器，将航天器送入地球邻近区域之外的长期任务。官员证实该探测器已脱离初始轨道，与地面站保持通信，并开始从深空传回数据。与瞄准单一近距目标的探测任务不同，这艘航天器旨在研究行星之间更广阔的环境，包括辐射、太阳活动、磁场、尘埃以及在巨大距离间航行的困难。科学家期望这项任务能为未来深入太阳系的探索提供宝贵经验。世界各地的报纸将这一成就描述为太空探索的新阶段。外国政府正在密切研究这项任务，因为行星际活动具有科学、政治和战略意义。航天正成为地球之外一种持续的存在。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
