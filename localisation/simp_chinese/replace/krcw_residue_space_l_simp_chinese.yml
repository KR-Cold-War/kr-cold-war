 Space_News_Global_Pluto_Probe_Title_SOV:0 "[GetNewspaperHeader]俄罗斯探测器抵达冥王星"
 Space_News_Global_Pluto_Probe_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]完成了世界上首次成功的冥王星任务，将航天器送往外太阳系，并从最遥远的已知世界之一传回了数据。官员确认探测器在长达数年的旅程中幸存，与地面站保持通信，并传回了交会期间的观测信息。这次任务代表着远距离探索的非凡进步，证明航天器能够在数十亿英里的尺度上运行。科学家期望这些观测能增进对冥王星表面、大气、卫星以及行星系统边缘附近条件的了解。全球报纸将这一成就描述为太空探索的里程碑。外国政府正在密切研究这项任务，因为抵达冥王星具有巨大的科学、政治和战略意义。人类技术现已触及外边界。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
