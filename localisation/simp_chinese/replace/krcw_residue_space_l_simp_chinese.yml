 Space_News_Global_Planetary_Lander_Title_SOV:0 "[GetNewspaperHeader]俄罗斯完成世界首次地外行星着陆"
 Space_News_Global_Planetary_Lander_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]成功实现了世界首次登陆另一颗行星，将航天器送入行星际空间并安置在行星表面。官方确认探测器在旅程中存活，完成了下降程序，并在着陆后开始传输数据。这次任务标志着比起飞掠与轨道探测获得重大进步，证明了探测器可以抵达另一颗行星、在行星环境中下降，并在着陆后继续运作。科学家期望着陆器传回有关表面状况、大气、地形、温度及未来探测挑战等方面的宝贵信息。世界各地的报纸称此成就为星球探索的转折点。各国政府正在密切关注此次任务，因为行星登陆能力具有科学、政治和战略意义。如今，人类已经在另一颗行星上操控了一台机器。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
