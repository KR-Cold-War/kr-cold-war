 Space_News_Global_Mars_Explorer_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]完成了全球首次载人火星远征，将人类送往行星际空间并在红色星球附近成功执行任务。官方确认，航天器经受住了漫长旅程的考验，与地面站保持通讯，完成了既定目标，并已开始返程。这项成就标志着太空时代的重大转折点，证明人类能够远赴月球之外，在另一颗行星附近活动。科学家将此次任务誉为生命保障、辐射防护、推进、导航与人类耐力的胜利。全球各大报纸纷纷将这次远征称为探索史上最伟大的成就之一。外国政府正在密切关注此次任务，因为载人火星能力承载着巨大的科学、政治与战略意义。人类如今已抵达另一颗行星。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
