 Space_News_Global_Outer_Solar_System_Probe_Title_SOV:0 "[GetNewspaperHeader]俄罗斯探测器抵达外太阳系"
 Space_News_Global_Outer_Solar_System_Probe_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]成功完成了世界上第一个外太阳系探测器任务，将航天器送至内行星之外的遥远区域并从深空传回数据。官员证实，探测器历经漫长旅程并保持与地面站的通信，传回了从未直接研究过的区域的观测资料。该任务标志着远程探索领域的非凡进步，证明航天器能在太阳系最偏远的区域运行多年。科学家期待这些数据能够增进对遥远行星环境、辐射、磁场、行星际尘埃以及太阳影响外缘的了解。全球报纸将这一成就描述为太空探索的里程碑。外国政府正密切关注这项任务，因为外太阳系行动具有重大的科学、政治和战略意义。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
