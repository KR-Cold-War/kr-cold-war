 Space_News_Global_Venus_Mission_Title_SOV:0 "[GetNewspaperHeader]俄罗斯探测器抵达金星"
 Space_News_Global_Venus_Mission_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]完成了世界上首次成功的金星探测任务，发射航天器穿越行星际空间，并从地球的邻近行星传回了数据。官方证实探测器经受住了旅程考验，与地面站保持通信并完成了计划中的观测。此次任务标志着人类在月球探索之外迈出了重大一步，证明航天器能够在内太阳系运行，并直接研究另一颗行星。科学家预计，这些数据将增进对金星大气层、温度及行星环境的了解，同时也有助于筹备未来的行星探测任务。世界各地的报纸都将这一成就描述为太空探索的转折点。鉴于行星际航行能力具有科学、政治和战略意义，各国政府正在密切关注这次任务。航天飞行如今已抵达另一颗行星。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
