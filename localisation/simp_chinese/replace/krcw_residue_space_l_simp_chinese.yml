 CWIC_SPACE_NEWS_USA.5300.nationfirst.d:0 "嘲鸫-[?USA.mission_number_5300_attempts]号任务顺利完成，美国首次把探测器送入了环月轨道。别国已经先走了一步，但国家航空局认为差距正在缩小。[USA.GetLeader]承诺继续拨款。"
 CWIC_SPACE_NEWS_USA.5300.nationfirst.t:0 "[GetNewspaperHeader]嘲鸫-[?USA.mission_number_5300_attempts]号：美国的第一个环月轨道器"
 CWIC_SPACE_NEWS_USA.5300.subsequent.a:0 "又前进了一步。"
 CWIC_SPACE_NEWS_USA.5300.subsequent.d:0 "嘲鸫-[?USA.mission_number_5300_attempts]号任务顺利完成，再次把探测器送入了环月轨道。这样的飞行已不再是头条新闻，但每一次都为国家航空局积累了经验。下一阶段的计划已提交[USA.GetLeader]审批。"
