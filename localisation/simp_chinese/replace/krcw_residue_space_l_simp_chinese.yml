 Space_News_Global_Lunar_Landing_Title_SOV:0 "[GetNewspaperHeader]俄罗斯完成世界首次无人月球着陆"
 Space_News_Global_Lunar_Landing_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]实现了世界上首次无人月球着陆，历史上第一次将航天器放置在月球表面。官方确认，探测器经受住了从地球出发的旅程，完成了下降序列，并在着陆后开始传输数据。此次任务标志着超越飞越和轨道探测器的重要飞跃，证明了航天器能被引导抵达另一个世界并继续在那里运行。科学家们期望着陆器能够传回有关月球表面状况、着陆技术以及未来任务可能面临挑战的宝贵信息。世界各地的报纸将这一成就描述为登月竞赛的转折点。外国政府正在密切关注这次任务，因为月球着陆能力承载着重大的科学、政治和战略意义。人类已触及另一个世界。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
