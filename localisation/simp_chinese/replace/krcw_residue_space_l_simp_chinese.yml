 Space_News_Global_Cosmonaut_Module_Title_SOV:0 "[GetNewspaperHeader]俄罗斯建成世界首个轨道实验室"
 Space_News_Global_Cosmonaut_Module_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]发射了世界上首个轨道实验室，开启了载人航天的新阶段。官员们证实，载人舱已成功入轨，并开始在地球上空运行。此前的任务证明人类能在短暂的太空旅程中存活，但这个实验室旨在展示人类可以长时间在那里工作。科学家们预计，这次任务将支持医学研究、工程实验、通信研究以及对下方行星的观测。世界各地的报纸将这次发射描述为一个迹象，表明太空正变得不仅仅是象征性首次成就的目的地。外国政府正在密切研究这次任务，因为持续的轨道运行可能影响声望、侦察、军事规划及未来的太空建设。官员们强调和平研究，但其更广泛的意义已经显而易见。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
