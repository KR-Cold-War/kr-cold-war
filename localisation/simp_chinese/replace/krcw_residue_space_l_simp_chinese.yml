 Space_News_Global_Lunar_Outpost_Title_SOV:0 "[GetNewspaperHeader]俄罗斯建立世界首个月球前哨站"
 Space_News_Global_Lunar_Outpost_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]建立了世界上第一个月球前哨站，在月球表面建立了持续的人类与技术存在。官员们证实，前哨站各要素已成功部署，通信已建立，初始运作已经开始。这一成就标志着超越此前月球任务的重大一步，证明了月球能够支持持续活动，不再只能短暂造访。科学家们期望该设施能够为表面研究、资源勘查、生命支持、发电、建造，以及在恶劣环境中的长期运行提供宝贵经验。世界各地的报纸将这个前哨站描述为太空时代的转折点。各国政府正在密切研究此次任务，因为月球基础设施可能具有巨大的科学、政治和战略意义。人类已开始在地球之外进行建设。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
