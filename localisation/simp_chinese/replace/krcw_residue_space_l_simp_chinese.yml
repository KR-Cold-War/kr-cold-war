 Space_News_Global_Space_Station_Title_SOV:0 "[GetNewspaperHeader]俄罗斯发射世界首座空间站"
 Space_News_Global_Space_Station_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]已将全球首座空间站送入轨道，标志着人类在地球以外持续活动迈出历史性一步。官员确认，空间站已抵达预定轨道，与地面控制中心建立通信，并开始初步运作。有别于既往的载人飞行或短期实验室，该空间站旨在支持更长周期的任务、重复往返以及更广泛的太空工作项目。科学家期待该设施在医学、工程、对地观测、通信及未来轨道建设方面积累宝贵经验。世界各地的报纸称这一成就为太空时代的转折点。由于永久性轨道平台可能具备重大科学、政治与战略意义，外国政府正密切研究这一任务。太空不再仅是目的地，它正成为人类持续存在之地。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
