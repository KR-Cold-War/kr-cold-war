 Space_News_Global_Unmanned_Mars_Orbital_Probe_Title_SOV:0 "[GetNewspaperHeader]俄罗斯将世界首个航天器送入火星轨道"
 Space_News_Global_Unmanned_Mars_Orbital_Probe_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]已将全球首艘航天器送入环火星轨道，标志着人类对这颗红色星球的探索迈出了重要一步。官方证实，探测器在经历了漫长的行星际空间飞行后成功存活，完成了入轨机动，并开始从火星轨道传输数据。这一成就超越了飞掠探测，证明航天器不仅能抵达火星，还能驻留该处开展持续的科学探测。科学家们预计，此次任务将为研究火星大气、地表特征、天气模式及未来任务的潜在着陆点提供宝贵观测数据。全球报纸将这次成功誉为行星际探索的转折点。外国政府正密切研究该任务，因为环绕火星的轨道承载着科学、政治与战略意义。人类如今可以从高空观测火星了。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
