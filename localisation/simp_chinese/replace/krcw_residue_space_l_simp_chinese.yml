 Space_News_Global_Unmanned_Mars_Flyby_Title_SOV:0 "[GetNewspaperHeader]俄罗斯完成世界首次火星飞掠"
 Space_News_Global_Unmanned_Mars_Flyby_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]完成了世界上首次成功的火星飞越，将航天器送入行星际空间，并从这颗红色星球传回了数据。官员证实，探测器经受住了漫长旅程的考验，与地面站保持了通信，并完成了预定的火星相遇。这次任务标志着超越月球探索的一大步，证明了航天器能够在浩瀚距离中航行，并在另一颗行星附近运行。科学家预计，这些观测将增进对火星大气、表面特征以及未来任务所面临挑战的了解。世界各地的报纸将这一成就称为行星际探索的转折点。外国政府正在密切研究这项任务，因为抵达火星具有巨大的科学、政治和战略意义。航天飞行如今已到达人类最引人入胜的目的地之一。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
 Space_News_Global_Unmanned_Mars_Flyby_Title_USA:0 "[GetNewspaperHeader]美国完成世界首次火星飞掠"
