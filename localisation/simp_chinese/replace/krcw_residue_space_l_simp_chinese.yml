 Space_News_Global_Orbital_Telescope_Title_SOV:0 "[GetNewspaperHeader]俄罗斯部署世界首台轨道望远镜"
 Space_News_Global_Orbital_Telescope_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]发射了世界上第一台轨道望远镜，首次将科学观测站置于大气层之上。官员们确认，该航天器已进入预定轨道，与地面站建立了通信，并已开始初步观测。由于运行在大气畸变之外，该望远镜有望提供比地面仪器更清晰的行星、恒星、星云和遥远星系的影像。科学家们预计，该任务将促进天文学、光学、航天器稳定、电子学以及长时间在轨运行等领域的发展。世界各地的报纸将这次发射描述为和平利用太空进行科学发现的一个转折点。外国政府正在密切研究这一成就，因为轨道观测也可能对地球成像、侦察和战略规划产生影响。太空已成为深入观测宇宙的平台。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
