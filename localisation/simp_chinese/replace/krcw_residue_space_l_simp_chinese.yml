 Space_News_Global_Manned_Mars_Landing_Title_SOV:0 "[GetNewspaperHeader]俄罗斯将人类送上火星"
 Space_News_Global_Manned_Mars_Landing_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]实现了世界上首次载人火星登陆，将人类首次送上了另一颗行星的表面。官员证实，航天器经受住了星际旅程的考验，成功完成下降、安全着陆，并在这颗红色星球上开始了地表作业。这一成就标志着太空时代最伟大的转折点之一，证明了人类可以跨越月球、抵达其他行星，并直接在其表面开展工作。科学家们将此次任务描述为推进、生命支持、辐射防护、下降控制、地表系统以及人类耐力方面的胜利。世界各地的报纸称这次登陆为探索史上的决定性时刻。外国政府正密切关注此次任务，因为人类首次踏足火星具有巨大的科学、政治和战略意义。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
