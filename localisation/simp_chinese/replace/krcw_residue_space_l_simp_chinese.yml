 Space_News_Global_Lunar_Flyby_Title_SOV:0 "[GetNewspaperHeader]俄罗斯完成世界首次月球飞掠"
 Space_News_Global_Lunar_Flyby_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]完成了世界上首次月球飞掠，将航天器送出地球轨道并掠过月球。官员们证实，该探测器遵循预定轨迹飞行，经受住了深空旅程的考验，并在飞越月球表面时传回了观测数据。此次任务标志着太空时代的一次决定性进展，证明了航天器能够飞出地球轨道并在另一天体附近运行。世界各地的报纸都把这一成就称为登月竞赛的转折点。预计外国政府将仔细研究这次飞行，因为月球任务需要强大的火箭、精确的制导和远程通信网络。官员们强调这是一次和平的科学探索，但其更广泛的政治意义显而易见。月球已不再超出人类科技所能触及的范围。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
