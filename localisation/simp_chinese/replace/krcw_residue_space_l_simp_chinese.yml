 UR_700_desc:0 "为登月及更远任务设计的俄国超重型助推器。"
 Zenit_RD_8_desc:0 "推力大、工作可靠的俄国液体推进剂上面级。"
 Saturn_2_desc:0 "海湾系列的改进型重型上面级。"
 Saturn_4b_desc:0 "海湾系列的美国上面级，用于重型载荷。"
 Saturn_Ib_desc:0 "海湾系列的美国重型助推器。"
 SOV_woodmetal_frames:0 "第一代液体火箭"
 SOV_woodmetal_frames_desc:0 "俄国第一种实用的液体燃料弹道火箭。射程不远，精度也低，但它让工厂和发射部队积累了制造与使用火箭的经验。"
 SOV_woodmetal_frames_short:0 "第一代火箭"
 SOV_pressure_vessel1:0 "中程火箭"
 SOV_pressure_vessel1_desc:0 "射程更远的单级火箭，弹头在飞行末段分离，精度比第一代明显提高。"
 SOV_pressure_vessel1_short:0 "中程火箭"
 SOV_pressure_vessel2:0 "勇士号运载火箭"
 SOV_pressure_vessel2_desc:0 "由洲际火箭改造而来的运载火箭，能把卫星和载人舱送入地球轨道。"
 SOV_pressure_vessel2_short:0 "勇士号"
 SOV_pressure_vessel3:0 "登月超重型火箭"
 SOV_pressure_vessel3_desc:0 "为登月任务设计的超重型运载火箭，以大批发动机并联推力，把载人飞船送出近地轨道。"
 SOV_pressure_vessel3_short:0 "登月火箭"
 SOV_pressure_vessel4:0 "超重型通用运载火箭"
 SOV_pressure_vessel4_desc:0 "可搭载大型空间站舱段和可重复使用轨道飞行器的超重型运载火箭。"
 SOV_pressure_vessel4_short:0 "超重型火箭"
 SOV_pressure_vessel6:0 "新一代超重型运载火箭"
 SOV_pressure_vessel6_desc:0 "为月球与行星任务设计的新一代超重型运载火箭，运载能力和可靠性都超过前代。"
 SOV_pressure_vessel6_short:0 "新超重型火箭"
 SOV_liquid_propellant:0 "高效液体火箭发动机"
 SOV_liquid_propellant_desc:0 "以液氧和煤油为推进剂的闭式循环火箭发动机，推力大，燃料利用率高，可用于大型火箭的第一级。"
 SOV_liquid_propellant_short:0 "液体发动机"
 SOV_nuclear_pulse_propulsion:0 "核热火箭发动机"
 SOV_nuclear_pulse_propulsion_desc:0 "用核反应堆加热推进剂的火箭发动机，比冲远高于化学发动机，适合飞往其他行星的长途任务。"
 SOV_nuclear_pulse_propulsion_short:0 "核热发动机"
 SOV_geosynchronous_network:0 "卫星导航网"
 SOV_geosynchronous_network_desc:0 "由导航卫星和地面站组成的系统，让舰船和飞机随时确定自己的位置。"
 SOV_geosynchronous_network_short:0 "导航网"
