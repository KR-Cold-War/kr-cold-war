 Space_News_Global_Space_Mining_Title_SOV:0 "[GetNewspaperHeader]俄罗斯完成世界首次太空采矿"
 Space_News_Global_Space_Mining_Desc_SOV:0 "[Space_TAG_Subject.GetNameDefCap]完成了世界上首次成功的太空采矿任务，证明地球之外可以提取与加工有用物质。官员证实，该航天器已抵达目标，部署了设备，并传回了数据，表明太空资源可以被收集或处理。这项任务标志着从探索到实际开发的重大转变，预示着未来的航天器、空间站和建设项目有朝一日可能依赖在地球之外采集的材料。科学家们期望这一成就将为机器人技术、资源勘探、精确操作及长期工业规划提供宝贵经验。世界各地的报纸都将此次任务描述为太空经济利用的转折点。外国政府正在密切研究这一成就，因为获取太空资源可能具有重大的科学、政治和战略意义。莫斯科的[Space_TAG_Subject.GetLeader]政府把这一成就归功于俄罗斯的工程师和全体国民。"
