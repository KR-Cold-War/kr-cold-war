l_simp_chinese:
 GOV_TYPE_COM:0 "联邦总体主义国家"
 GOV_TYPE_COM_DESC:0 "先锋党按民主集中制组织，但政府权力在中央与地方之间划分。地方能在多大程度上自行其是，因国而异。"
 GOV_TYPE_COM_2:0 "单一总体主义共和国"
 GOV_TYPE_COM_2_DESC:0 "国家作为一个整体组织起来，全部权力集中在由先锋党掌握的中央政府手中。"
 GOV_TYPE_MAO:0 "单一极致主义共和国"
 GOV_TYPE_MAO_DESC:0 "极致派认为革命不能等待工业成熟，主张由工人、农民和士兵的统一阵线立即夺取政权。权力集中在单一的中央机关。"
 KRCW_GOV_RAJ:0 "王公联邦"
 KRCW_GOV_RAJ_DESC:0 "五百多个土邦的王公共同组成王公院，由瓜廖尔大君主持。中央只管军队、外交与铁路，土邦保留自己的法庭和税收。"
 KRCW_GOV_PSA:0 "宪政总统制"
 KRCW_GOV_PSA_DESC:0 "萨克拉门托的国会与总统仍按1787年宪法选举产生。沿海港口和山口由西部防务司令部管理，它的战时权力每年由国会续期。"
 KRCW_GOV_BRO:0 "革命训政"
 KRCW_GOV_BRO_DESC:0 "革命党代行国民主权，直到宪政条件成熟。中国顾问参与军队与财政。"
 KRCW_GOV_REG:0 "摄政王国"
 KRCW_GOV_REG_DESC:0 "王位空悬或君主不能亲政，摄政与军官团以君主的名义统治，议会只能表决政府提交的法案。"
