l_simp_chinese:
# krcw: years paced
 FRA_krcw_de_gaulle:0 "夏尔·戴高乐"
 FRA_krcw_de_gaulle_desc:0 "国民法兰西的将军，二十年来在阿尔及尔与巴黎之间只做一件事：等公社倒台。莫斯科不喜欢他，但找不到第二个能让法国人服从的名字。"
 ENG_krcw_edward_viii:0 "爱德华八世"
 ENG_krcw_edward_viii_desc:0 "一九二五年革命后随王室流亡加拿大的国王。协定让他回到白金汉宫，条件是政府由协定认可的人组成。"
 CHI_krcw_zhang_xueliang:0 "张学良"
 CHI_krcw_zhang_xueliang_desc:0 "奉系旧主，国民党统一后长年在海外。协定需要一个不是国民党的中国政府，他是少数还有旧部可用的人。"
 SOV_krcw_shlyapnikov:0 "亚历山大·什利亚普尼科夫"
 SOV_krcw_shlyapnikov_desc:0 "工人反对派的老领袖，内战后在国外为俄国工会奔走。国际需要一个俄国人来签停战书，他是工会里名望最高的人。"
 krcw_ww_total_mobilisation:0 "全面动员"
 krcw_ww_total_mobilisation_desc:0 "预备役分批征召，工厂转产军品，民用消费让位于前线。"
 krcw_ww_cat:0 "全面战争"
 krcw_ww_cat_desc:0 "两个阵营都已经重建了工业和军队。冷战可以一直冷下去，也可以在我们选定的时刻结束。"
 krcw_ww_war_plan:0 "批准全面战争计划"
 krcw_ww_war_plan_desc:0 "总参谋部的计划早就写好了，缺的只是签字。动员无法保密，对方会知道。"
 krcw_ww_ultimatum:0 "发出最后通牒"
 krcw_ww_ultimatum_desc:0 "要求对方解散阵营、撤出争议地区。对方可以让步，也可以拒绝，拒绝就是战争。"
 krcw_ww_1_t:0 "对方开始全面动员"
 krcw_ww_1_d:0 "预备役被召回，铁路时刻表改成了军列，边境上的驻军在增加。对方没有宣战，但也不再掩饰。"
 krcw_ww.1.a:0 "我们也动员"
 krcw_ww.1.b:0 "保持冷静，不作回应"
 krcw_ww_2_t:0 "最后通牒"
 krcw_ww_2_d:0 "对方要求我们解散阵营、撤出争议地区，限期答复。让步能避免战争，但阵营里没有人会忘记这件事。"
 krcw_ww.2.a:0 "让步"
 krcw_ww.2.b:0 "拒绝"
 krcw_ww_3_t:0 "世界大战"
 krcw_ww_3_d:0 "第三国际与莫斯科协定正式进入战争状态，两个阵营的成员国相继宣战。上一次世界大战结束还不到二十年。"
 krcw_ww.3.a:0 "战争开始了"
 krcw_ww_asia_cat:0 "东亚的旧账"
 krcw_ww_asia_cat_desc:0 "《青岛停战协定》只是停火。台湾还在日本手里，外东北和蒙古在俄国手里，东京也没有忘记朝鲜。"
 krcw_ww_retake_taiwan:0 "渡海收复台湾"
 krcw_ww_retake_taiwan_desc:0 "海军已经能把部队送过海峡。对日本开战，东京会向莫斯科求援。"
 krcw_ww_demand_north:0 "索还外东北与外蒙古"
 krcw_ww_demand_north_desc:0 "要求俄国归还《瑷珲条约》和《北京条约》割去的土地，并放弃对蒙古的控制。俄国拒绝就开战。"
 krcw_ww_march_north:0 "北进：夺回朝鲜"
 krcw_ww_march_north_desc:0 "一九四四年失去的朝鲜是陆军念念不忘的旧账。进攻朝鲜民国，南京必然出兵。"
 krcw_ww_41_t:0 "中国军队渡海"
 krcw_ww_41_d:0 "南京对我们宣战，目标是台湾。台湾驻军只能撑一段时间，能否守住取决于莫斯科是否出手。"
 krcw_ww.41.a:0 "守住台湾"
 krcw_ww_42_t:0 "日本求援"
 krcw_ww_42_d:0 "中国对日本开战，东京请求协定出兵。日本不是协定成员，但它倒下后太平洋上就只剩国际的舰队。"
 krcw_ww.42.a:0 "全面参战，把阵营带进战争"
 krcw_ww.42.b:0 "只提供武器和顾问"
 krcw_ww_43_t:0 "南京的领土要求"
 krcw_ww_43_d:0 "中国要求归还阿穆尔河以北和乌苏里江以东的土地，并要求我们放弃对蒙古的控制。南京说，拒绝就是战争。"
 krcw_ww.43.a:0 "让步"
 krcw_ww.43.b:0 "拒绝"
 krcw_ww_44_t:0 "日本进攻朝鲜"
 krcw_ww_44_d:0 "日军在釜山和仁川登陆，朝鲜民国请求南京出兵。按一九四四年的约定，中国是朝鲜的保证国。"
 krcw_ww.44.a:0 "出兵朝鲜"
 krcw_ww.44.b:0 "只送武器"
 krcw_ww_45_t:0 "中俄开战"
 krcw_ww_45_d:0 "中国与俄国在阿穆尔河开战。南京请求国际履行义务。国际一旦参战，战争就会在易北河和密西西比河同时开打。"
 krcw_ww.45.a:0 "全面参战，把阵营带进战争"
 krcw_ww.45.b:0 "只提供武器和顾问"
 krcw_ww_party_sov:0 "工人反对派"
 krcw_ww_party_sov_long:0 "全俄工会工人反对派"
 krcw_ww_20_t:0 "处置投降的协定国家"
 krcw_ww_20_d:0 "[krcw_ww_loser.GetNameDefCap]已经投降。国际要决定在那里建立什么样的政府，以及它今后站在哪一边。"
 krcw_ww.20.a:0 "支持什利亚普尼科夫组建俄罗斯劳动者共和国"
 krcw_ww.20.b:0 "由联合工团统一美国"
 krcw_ww.20.c:0 "在西德领导下统一德国"
 krcw_ww.20.d:0 "实行军事管制，扶植工团政府"
 krcw_ww_party_fra:0 "法兰西人民联盟"
 krcw_ww_party_fra_long:0 "法兰西人民联盟"
 krcw_ww_party_eng:0 "国王政府"
 krcw_ww_party_eng_long:0 "大不列颠国王陛下政府"
 krcw_ww_party_chi:0 "北京政府"
 krcw_ww_party_chi_long:0 "中华民国北京政府"
 krcw_ww_21_t:0 "处置投降的国际国家"
 krcw_ww_21_d:0 "[krcw_ww_loser.GetNameDefCap]已经投降。协定要决定在那里扶植谁，以及那里的旧政权还剩下什么。"
 krcw_ww.21.a:0 "请戴高乐组建临时政府"
 krcw_ww.21.b:0 "迎爱德华八世回国复位"
 krcw_ww.21.c:0 "扶植张学良的北京政府"
 krcw_ww.21.d:0 "由华盛顿统一美国"
 krcw_ww.21.e:0 "在东德领导下统一德国"
 krcw_ww.21.f:0 "实行军事管制，扶植民族政府"
 krcw_ww_30_t:0 "俄罗斯投降"
 krcw_ww_30_d:0 "最高执政者的政府接受了停战条件。莫斯科协定失去了它的领袖，剩下的成员国要自己决定是否继续打下去。"
 krcw_ww.30.a:0 "协定的战争结束了"
 krcw_ww_31_t:0 "法兰西投降"
 krcw_ww_31_d:0 "巴黎的公社政府接受了停战条件。第三国际失去了它的中心，其余支部要自己决定是否继续打下去。"
 krcw_ww.31.a:0 "国际的战争结束了"
 krcw_ww_32_t:0 "国家统一"
 krcw_ww_32_d:0 "战败的一方被并入了胜利的同胞国家。分裂以占领的方式结束了。"
 krcw_ww.32.a:0 "统一"
 SOV_trotskyism:0 "俄罗斯劳动者共和国"
 SOV_trotskyism_DEF:0 "俄罗斯劳动者共和国"
 SOV_trotskyism_ADJ:0 "俄罗斯"
