l_simp_chinese:
 nuke_dropped.1.t:0 "[GetNewspaperHeader]历史上第一次核攻击"
 nuke_dropped.1.d:0 "一颗原子弹今天在[From.From.GetName]上空爆炸。这是核武器第一次被用于战争。上一场世界大战打了许多年，却从未用过这种武器。破坏的规模还在统计之中，使用者和全人类将为此付出什么，现在还无人能够回答。\n\n全世界都在等待下一步。[From.From.owner.GetNameDef]会为了避免更多的城市被毁而投降，还是会以同样的手段报复？"
 nuke_dropped.4.d:0 "今天，[GetDateText]，柏林遭到原子弹攻击。这座分裂的城市在上一场战争中饱受战火，但那些破坏都无法与今天相比。自三十年战争以来，柏林从未遭受过这样的浩劫。\n\n炸弹偏离了预定的爆心，城中的地下掩体至少有一部分保存了下来。据说[From.From.owner.GetLeader]还活着，并且怒不可遏。[From.From.owner.GetAdjective]领导人如何撤离、能否躲过放射性尘埃，现在还不清楚。"
 nuke_dropped.5.d:0 "今天，一颗原子弹摧毁了伦敦城。这座城市有防空设施，[From.From.owner.GetNameDef]还是没能挡住这次攻击。[GetDateText]，威斯敏斯特的大钟最后一次敲响，随即在爆炸中熔化。最早的报告说，白厅的政府大楼已被夷平，许多工会代表和部门官员下落不明。\n\n[From.From.owner.GetLeader]已确认幸存，正在准备今天稍晚的广播讲话。不列颠的士气跌到了谷底，人们需要这篇讲话，或者一份体面的投降书。"
 nuke_dropped.5.b:0 "红旗会在这里飘扬！"
 nuke_dropped.8.d:0 "今天，一颗原子弹在华盛顿上空爆炸。白宫、国会大厦和国家广场上的纪念碑在一瞬间化为灰烬。这座城市曾是合众国的首都，自1814年英军火烧华盛顿以来，它从未遭受过这样的破坏。\n\n[From.From.owner.GetLeader]已被转移到安全地点，但整个国家都受到了震动。两次内战中，美国人互相开火，却从未用过这种武器。现在它落在了华盛顿。"
 nuke_dropped.8.a:0 "两次内战都没能毁掉华盛顿，一颗炸弹做到了。"
 SOV_Soviet_Space_Program:0 "俄国航天计划"
 nuke_dropped.12.d:0 "今天，哥本哈根的市区遭到了一次核爆攻击。丹麦在世界大战中保持中立，这座城市因此躲过了战火，一直在发展。自拿破仑战争以来，丹麦首都还从未遭受过这样的破坏。厄勒海峡两岸落满了放射性尘埃，幸存者担心还有下一次攻击，已经开始逃往菲英岛和日德兰。\n\n[From.From.owner.GetLeader]的下落还不清楚，全国的士气都被这次攻击击垮了。这是不是欧洲最古老的国家之一走向终结的开始，现在还无法判断。"
 CWIC_ECON_PENALTIES.1.t:0 "实行紧缩"
 CWIC_ECON_PENALTIES.1.d:0 "为了避免预算和支付危机，政府将实行紧缩措施。这些措施是债权国提出的条件，不接受就拿不到下一笔贷款。如果不实行，国家财政可能会陷入崩溃。紧缩会让许多国民的生活变得艰难，但政府认为这是保住经济的唯一办法。"
 CWIC_ECON_PENALTIES.1.a:0 "只能如此。"
 CWIC_ECON_PENALTIES.2.t:0 "宣布违约"
 CWIC_ECON_PENALTIES.2.d:0 "政府宣布无力偿还到期的债务，消息已经在全国引起恐慌。债权国要求立即实行它们提出的经济改革。经济再一次下滑，国家只能大幅削减开支，设法恢复人们对本国经济的信心。许多企业和政府机构因为没有资金维持运转，已经被迫关门。"
 CWIC_ECON_PENALTIES.2.a:0 "糟糕。"
 election.2.communism:0 "总体主义者"
 election.2.maoism:0 "极致主义者"
 election.2.trotskyism:0 "工团主义者"
 election.2.socialist:0 "激进社会主义者"
 ARAB_LEAGUE_RESOLUTION.0.d:0 "\n经过和[arab_league_nation_global_target.GetAdjective]当局几个月的谈判，几个星期的作证、辩论和争论之后，阿拉伯联盟投票决定与对方一起走向繁荣的未来。[arab_league_nation_global_target.GetAdjective]的代表希望建立牢固的关系，这可能带来更多，甚至是加入它的阵营、得到它的防务保护。这份善意至少会维持几年，或者维持到下一次重大事件。"
 ARAB_LEAGUE_RESOLUTION.01.d:0 "\n经过和我国当局几个月的谈判，几个星期的作证、辩论和争论之后，阿拉伯联盟投票决定与我们一起走向繁荣的未来。阿拉伯联盟的代表希望建立牢固的关系，这可能带来更多，甚至是加入我们的阵营、得到我们的防务保护。这份善意至少会维持几年，或者维持到下一次重大事件。"
 ARAB_LEAGUE_RESOLUTION.92.b:0 "承担责任，送上一份丰厚的“礼物”"
 ARAB_LEAGUE_RESOLUTION.30.d:0 "\n最近的一项决议[ARAB_LEAGUE_SELECTION_BUTTON_3]被一个成员国否决了。联盟理事会的决议需要全体一致，一些代表批评说，这一票让辩论和协商都失去了意义；另一些人说，这是在袒护友好国家。也有国家支持否决，认为这项决议从一开始就别有用心。无论如何，这项决议已经作废。"
 NATO.3.d:0 "[From.GetName]遭到了外国的攻击，并援引了我们之间的共同防御条约。这意味着我们必须参加它的战争。"
 ADL.3.a:0 "履行条约，出兵援助。"
 ADL.3.b:0 "这场战争与我们无关。"
 ARAB_LEAGUE_RESOLUTION.9.t:0 "[GetNewspaperHeader]阿拉伯联盟呼吁终止[arab_league_nation_global_target.GetName]原子能计划"
 ARAB_LEAGUE_RESOLUTION.10.t:0 "[GetNewspaperHeader]阿拉伯联盟呼吁消除[arab_league_nation_global_target.GetName]大规模毁灭性武器"
 ARAB_LEAGUE_RESOLUTION.19.d:0 "\n阿拉伯联盟宣布[FROM.GetName]拒绝接受和平谈判的提议。阿拉伯联盟的主要外交官强调，他们对这一拒绝感到失望，指出阿拉伯联盟作为一个中立的全球机构的地位将使它成为和平谈判的理想伙伴。预计联盟理事会将在下届会议上讨论这一新的事态发展。由于这种拒绝，人们越来越担心冲突只会加剧，而且阿拉伯联盟缺乏实现其创始国愿望的影响力。"
 ARAB_LEAGUE_RESOLUTION.23.d:0 "\n阿拉伯联盟内部投票决定取消对[arab_league_nation_global_target.GetName]的贸易制裁。联盟理事会注意到[arab_league_nation_global_target.GetName]在结束阿拉伯联盟最初实施贸易制裁的做法方面取得了很大进展。秘书长在对投票作出回应时指出，该制裁并不是要惩罚国家，他希望这次投票能帮助[arab_league_nation_global_target.GetName]重返国际社会。[arab_league_nation_global_target.GetName]的代表对这一决定表示欢迎，并表示这次投票将在关系正常化进程中发挥重要作用。"
 ARAB_LEAGUE_RESOLUTION.24.d:0 "\n阿拉伯联盟内部最近通过投票决定对[arab_league_nation_global_target.GetName]取消武器禁令。联盟理事会认为武器禁令的理由已不再合理，[arab_league_nation_global_target.GetName]政府的态度也令人满意。秘书长发表了讲话，并指出该组织不再感到存在威胁。他希望[arab_league_nation_global_target.GetName]政府将继续它那些积极步骤。一些外交官赞同这些声明，称制裁往往是最后的手段，一旦看到积极的变化，就没有继续制裁的愿望。然而，一些代表私下指出，他们担心解除制裁可能导致该区域的军备竞赛。"
 ARAB_LEAGUE_RESOLUTION.27.d:0 "\n[FROM.GetName]政府坚决反对阿拉伯联盟关于[arab_league_nation_global_target.GetAdjective]独立的提议。在声明中，他们认为阿拉伯联盟没有管辖权或权力对他们的内部事务发号施令。接受阿拉伯联盟的决议不仅会牺牲他们的主权，而且还会开创一个危险的先例。声明还指出，这项决议和国际运动很可能是国际阴谋，目的是破坏[FROM.GetName]的团结和力量。阿拉伯联盟冷冰冰地接受了这一挑衅声明，秘书长对此表示严重失望。联盟理事会可能在下届会议上讨论这一问题。"
 ARAB_LEAGUE_RESOLUTION.131.d:0 "\n[arab_league_state_owner_global_target.GetName]否决了阿拉伯联盟和国际社会归还[arab_league_state_global_target.GetName]的建议。拒绝的决定在有争议的地区和阿拉伯联盟以外引发愤怒的抗议，因为该决议的支持者要求采取行动。在声明中，[arab_league_state_owner_global_target.GetName]政府说，阿拉伯联盟的决议是对其内部事务的直接干涉，是非法的。它补充说，任何有关其神圣土地和人民的决定都将由国家决定，而不是由外国干涉别国的事务。阿拉伯联盟理事会预计将在下届会议上对这些最新事态发展作出反应。"
 war_justification.3.t:0 "[Root.GetLeader]警告[From.GetAdjective]总体主义"
 war_justification.3.d:0 "“还有什么比总体主义更能威胁我们的生活？总体主义瘟疫的威胁在于它让奴隶，而不是主人去统治国家，其将毁掉国家本身，乃至这个国家的人民与他们的历史。我们会采用[From.GetName]来抵御总体主义的瘟疫。”\n\n在[Root.GetRulingParty]的崛起之前，[Root.GetLeader]对总体派的仇恨就已经广为所知，但随着最近[From.GetAdjective]政府这一特例的出现，仇恨被更加地深化了。我们试图将马克思主义从地球上抹去的努力应该从这里开始。"
 war_justification.7.t:0 "[From.GetAdjective]总体主义的失败"
 war_justification.11.d:0 "“毫无疑问，在这个年代里，[From.GetName]的总体主义是自由与秩序最大的敌人之一。它不仅无情地吞噬着[From.GetAdjective]的人们对一个富强民主社会的希望，而且还对其邻居的人民虎视眈眈。倘若我们现在还不采取行动的话，我们就会看到这第一张多米诺骨牌的倒下，随之更多社会制度的试验会宣告失败。在我们干涉之前还要牺牲多少人？”\n\n政权颠覆运动威胁着我们民主制度的安全。在[From.GetAdjective]的野心推动下，这已经成为了最近的社会焦点讨论问题。反对派代表称“红祸”之称其实是旨在对[From.GetName]发动战争，[Root.GetRulingParty]的言论最近大受欢迎。"
 war_justification.15.d:0 "“[Root.GetAdjective]的民族精神很强大，但不是每一个国家都同样那么幸运。[From.GetName]的传统被毁灭了，它的合法统治者被谋害了，而这一切的始作俑者就是所谓伟大的马克思主义革命。我们有义务为这个被冷血的篡位者引入歧途的世界重塑秩序，让[Root.GetName]的力量扶助世人对抗这个威胁。”\n\n虽然[Root.GetRulingParty]向来反对总体主义，但是[From.GetName]却成为了近来多场演讲的主要攻击目标。无论总体主义对[Root.GetAdjective]国的威胁是否真的存在，对[From.GetAdjective]的总体主义政权的先发制人攻击已经开始了。"
 war_justification.203.t:0 "[From.GetLeader]警告[Root.GetAdjective]的总体主义"
 war_justification.203.d:0 "“有什么比总体主义更加威胁我们的生活方式的吗？这个瘟疫般的思想打算让奴隶们打倒主人、夺权管理每一个国家，摧毁国家的概念、消灭民族的界限。我们会夺过[From.GetName]并且消灭这场总体主义瘟疫。”\n\n[From.GetLeader]对总体派的憎恨早在[From.GetRulingParty]上位前就已经是家喻户晓的，但是在[Root.GetAdjective]政府这个个例中却愈演愈烈。我们想要将马克思主义从地球上铲除的话，可以考虑从那里开始。"
 war_justification.205.d:0 "“虽然[From.GetName]的社会主义社会的地位已得到巩固，但世界上仍有许多国家在遭受封建制度的折磨。[Root.GetName]的工人没有发声的权力、没法建立起自己的组织，任何尝试建立社会主义制度的人都会遭到[Root.GetLeader]治下体制的野蛮摧残。我们不能等着革命的齿轮自行带动[Root.GetAdjective]人民，我们在这里成功摧毁了资本主义的压迫，我们也必将摧毁[Root.Capital.GetName]的资本主义压迫！”\n\n[From.GetLeader]放弃与我们政府进行外交谈判。总体主义无国界这个目标如今变成了要彻底消除我们的国界。"
 war_justification.206.d:0 "“有比[Root.GetAdjective]人民获得自由更大的谎言吗？他们一度被掌控石油资源的皇室贵族奴役，如今又被迫为工厂主出卖自己的劳动力。自由选择自己的主子根本不能叫做自由。同样，所谓自由选举领袖也不过是花言巧语，政府从来就不允许真正的社会主义者掌权。只有通过[From.GetAdjective]介入才能拯救被彻底洗脑的人民。”\n\n[From.GetName]的总体主义政权不愿承认我们的人民满意当今的社会体制，公然威胁要向我国发动战争。恐怕这场冲突是无法以和平方式来解决了。"
 war_justification.207.t:0 "[Root.GetAdjective]总体主义的失败"
 war_justification.208.a:0 "消灭总体主义者！"
 war_justification.211.d:0 "“[Root.GetName]的总体主义无疑是当今世上自由和秩序的头号威胁。它不仅无情地吞噬着[Root.GetAdjective]人民最求繁荣、民主社会的希望，对周边国家来说也同样如此。如果我们依然无动于衷，民主国家就会一个接一个地沦陷，萌芽中的民主社会也将夭折。为什么不趁牺牲进一步扩大前行动起来呢？”\n\n工人运动正威胁着[From.GetAdjective]领袖，虽然这些领袖中的代表性人物将运动称为红色威胁并扬言要向我们发动战争，但[From.GetRulingParty]目前正取得优秀成果。"
 war_justification.215.d:0 "“[From.GetAdjective]有坚强的民族精神，但不是所有国家都能如此幸运。因为马克思主义者的革命行动，[Root.GetName]的传统遭到破坏、合法统治者惨遭杀害。这个世界被嗜血篡权者引入歧途，我们必须为其恢复秩序，用[From.GetName]的力量来对抗这场威胁。”\n\n[From.GetRulingParty]一直以来都反对总体主义，近期则将矛头指向[Root.GetName]。他们担心自己的国家无法抵挡工人革命的浪潮，决定对[Root.GetAdjective]总体主义采取先发制人的攻势。"
