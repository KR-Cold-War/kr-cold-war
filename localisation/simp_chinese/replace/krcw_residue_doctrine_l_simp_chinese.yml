l_simp_chinese:
 air_doctrine_integral_7b_desc:0 "由俄国人开发的喷气攻击机战术是一种大规模机动和地面支援战术，旨在提高地面支援任务的效率和杀伤力。"
 air_doctrine_integral_8c_desc:0 "将空域作战与合成部队的攻击结合起来，有助于确保进攻中的空中和地面单位更有可能存活并取得成功。"
 cw_dprk_1960s_doctrine_desc:0 "朝鲜军的学说强调前沿部署、夜间渗透和沿停火线的持续施压。"
 cw_dprk_1960s_doctrine_header_desc:0 "\n朝鲜军以坚固阵地、密集火力和政治可靠的部队为基础，强调快速动员和猛烈的炮火准备，为开战时的决定性突破创造条件。"
 cw_dprk_1960s_forward_deployed_infiltration_echelons_desc:0 "\n\n\n\n\n\n\n\n专门的渗透梯队部署在接触线附近，练习夜间行动和分散执行，力求在几乎没有预警的情况下穿透敌方防线。"
 cw_dprk_1970s_entrenched_forward_assault_culture_desc:0 "\n\n\n\n\n\n\n\n步兵从前沿的坚固阵地带直接发起进攻，依靠预置的补给和火力迅速出击。"
 cw_dprk_1970s_rapid_night_assault_doctrine_desc:0 "\n\n\n\n夜间成为机动和突击的首选时段，可以避开敌方空中力量和远距离观察。部队在天亮前完成接敌、突击和脱离。"
 cw_dprk_1980s_doctrine_desc:0 "朝鲜军把特种作战、饱和炮击和地下指挥体系结合起来，实施协调一致的进攻。"
 cw_dprk_1980s_emergency_mobilization_infrastructure_desc:0 "\n\n\n\n\n\n\n\n工厂、交通网和民间组织都按战时需要编组，开战后能迅速扩充和补充部队，即使在空袭下也不中断。"
 cw_dprk_1980s_integrated_infiltration_fire_coordination_desc:0 "\n\n\n\n\n\n\n\n渗透分队负责标定目标、牵制敌军，炮兵和火箭炮随即在预定火力区实施打击。"
 cw_dprk_1980s_rocket_artillery_saturation_systems_desc:0 "\n\n\n\n\n\n\n\n依托地下库存和预先测定的射击区，火箭炮部队在地面接触前对敌集结地、后方和交通线实施同步齐射。"
 cw_dprk_1990s_deception_and_maskirovka_systems_desc:0 "\n\n\n\n假阵地、假电台通信和诱饵补给点用来误导敌方侦察和打击。部队严守无线电纪律，并经常改变行动规律。"
 cw_dprk_1990s_fortified_operational_continuity_desc:0 "\n\n\n\n\n\n\n\n指挥所、补给枢纽和集结地都经过加固并分散配置，在持续轰炸下仍能维持指挥和作战。"
 cw_france_1980s_selective_nato_interoperability:0 "有选择的盟国协同"
 cw_france_1980s_selective_nato_interoperability_desc:0 "\n\n\n\n法国在通信程序、后勤标准和战术方法上与盟国保持兼容，但战略与指挥权留在本国手中。"
 cw_ins_1950s_protracted_war_planning_doctrine_desc:0 "\n\n\n\n起义军把时间当作最大的优势，按阶段制定计划：先求生存，再扩大根据地，逐步正规化，最终夺取要地或政权。"
 cw_maoist_1960s_doctrine_desc:0 "革命学说强调持久斗争、从乡村包围城镇、发动群众，逐步瓦解国家的权威。"
 cw_maoist_1960s_mass_line_political_work_desc:0 "\n\n\n\n骨干深入乡村，收集群众的诉求，再把它们变成土地改革、调解纠纷和粮食保障等具体措施。"
 cw_maoist_1960s_revolutionary_continuity_bonds_desc:0 "\n\n\n\n\n\n\n\n政治教育、游击战争和群众参与结合在一起，维持对领导层的忠诚和长期动员。"
 cw_maoist_1960s_strategic_defensive_phase_doctrine_desc:0 "\n\n\n\n在战略防御阶段，起义军火力处于劣势，重点在于保存骨干、扩大群众基础、积蓄力量，只在有利条件下作战。"
 cw_maoist_1970s_consolidated_base_area_administration_desc:0 "\n\n\n\n\n\n\n\n在解放的根据地内建立行政、后勤和治安机构，把游击据点变成能支撑长期战争的政权。"
 cw_maoist_1980s_advanced_guerrilla_layering_techniques_desc:0 "\n\n\n\n\n\n\n\n地方民兵、机动部队和地区部队分层配合，形成纵深，使敌方的清剿行动更加困难。"
 cw_maoist_1980s_doctrine_desc:0 "革命武装协调民兵、机动部队和地区指挥机构，使敌方的清剿行动更加困难。"
 cw_maoist_1990s_adaptive_survival_governance_desc:0 "\n\n\n\n\n\n\n\n在强大的清剿压力下，运动转向分散和灵活的管理，首先保住组织和民心，避免决定性的失败。"
 cw_maoist_1990s_doctrine_desc:0 "面对严厉镇压，革命运动把分散、坚持和政治生存放在扩张之前。"
 cw_nato_1940s_armored_infantry_coordination_desc:0 "\n\n\n\n战后各盟国重新研究步兵与装甲兵的协同。各国在战争中形成了不同的做法，这项学说把它们统一为共同的操典。"
 cw_nato_1940s_coalition_logistics_interoperability_desc:0 "\n\n\n\n各成员国的车辆、弹药口径、燃料和补给程序互不相同。这项学说制定共同标准，并勘定关键的交通设施。"
 cw_nato_1940s_doctrine_desc:0 "战后的联军学说强调盟国之间的协同作战、常规部队的重建与集体防御计划。"
 cw_nato_1940s_doctrine_title:0 "联军协同学说基础"
 cw_nato_1940s_early_atomic_support_integration_desc:0 "\n\n\n\n原子武器出现后，规划人员研究如何把它纳入作战计划，同时不削弱常规部队的作用。"
 cw_nato_1940s_forward_deterrence_planning_desc:0 "\n\n\n\n为防止战略突袭，联军为中央战线制定了详细的增援、动员和部署安排。"
 cw_nato_1940s_integrated_arms_reorganization_desc:0 "\n\n\n\n联军成立初期，首要任务是把编制传统和作战经验各异的各国军队纳入共同的集体防御框架。"
 cw_nato_1940s_joint_operational_planning_staffs_desc:0 "\n\n\n\n借鉴战时联合司令部的经验，联军统一了计划周期、术语和参谋程序，建立常设的联合参谋机构。"
 cw_nato_1950s_atomic_battlefield_readiness_desc:0 "\n\n\n\n部队接受在辐射、污染和基础设施被毁的环境中作战的训练，并配备防护装备。"
 cw_nato_1950s_decentralized_command_networks_desc:0 "\n\n\n\n上级指挥部可能被核打击摧毁或切断，下级指挥官因此获得更大的自主权，按作战意图独立行动。"
 cw_nato_1950s_dispersed_maneuver_formations_desc:0 "\n\n\n\n核武器使集中兵力变得危险。部队分散在更宽的地域，需要时再迅速集中实施决定性行动。"
 cw_nato_1950s_doctrine_desc:0 "联军学说把核威慑与前沿防御和分散的常规部队结合起来。"
 cw_nato_1950s_doctrine_header_desc:0 "\n这一时期的联军态势以核威慑为后盾，部队分散部署并准备快速增援。地面部队的任务是挺过第一次打击、守住要地，为战略反击争取时间。"
 cw_nato_1950s_pentomic_battle_group_structure_desc:0 "\n\n\n\n为了在核战场上生存，师被改编为五个能独立行动的战斗群，可以分散部署，必要时再合并作战。"
 cw_nato_1950s_tactical_nuclear_fire_planning_desc:0 "\n\n\n\n低当量核武器被纳入炮兵和空中支援的火力计划，用来阻止敌军推进、打击敌军集结或为机动创造机会。"
 cw_nato_1960s_counterinsurgency_adaptation_framework_desc:0 "\n\n\n\n盟国在亚洲、非洲和中东的平叛作战中总结经验，强调政治与军事手段相互配合。"
 cw_nato_1960s_doctrine_desc:0 "联军强调控制冲突升级、保持常规力量平衡，并在不同层次的冲突中协调应对。"
 cw_nato_1960s_doctrine_header_desc:0 "\n全面核升级的风险太大，联军转向逐级应对，加强常规战备，统一空地计划，并以可控的防御限制冲突升级。"
 cw_nato_1960s_expanded_combat_support_networks_desc:0 "\n\n\n\n机动而分散的部队需要更强的保障。联军加大了对工程兵、通信、医疗后送和后勤部队的投入。"
 cw_nato_1960s_flexible_response_doctrine_desc:0 "\n\n\n\n大战一开始就动用核武器的设想被放弃，代之以常规防御、可控升级和必要时的核选项。这需要大量投资于常规部队。"
 cw_nato_1960s_helicopter_air_mobility_integration_desc:0 "\n\n\n\n可靠的运输直升机让地面部队能够越过障碍、增援受威胁的地段，并快速后送和补给。"
 cw_nato_1960s_road_division_structure_desc:0 "\n\n\n\n师恢复以旅和营为基本单位，指挥官可以根据任务灵活编组部队，取代了僵化的五群编制。"
 cw_nato_1960s_transitional_combined_arms_cohesion_desc:0 "\n\n\n\n\n\n\n\n新技术与传统的合成兵种原则相结合，装甲、步兵、炮兵和空中支援编入灵活的部队结构，可应对常规战争和有限战争。"
 cw_nato_1970s_active_defense_posture_desc:0 "到了20世纪70年代初，联军的战略规划者们已经意识到，面对在数量上占绝对优势的莫斯科协定军队，单靠静态前沿防御已无法保证自身的生存。这种态势承认，为了保存战斗力和维持指挥体系的连贯与稳固，可能需要暂时放弃部分领土。与此同时，盟国各部队之间更加强调情报共享、指挥协同以及快速决策能力。“主动防御”深切反映了联军当时的战略困境：既要在核战升级的阴影下开展常规作战，又要为盟军增援和政治解决争取宝贵的时间。"
 cw_nato_1970s_air_land_coordination_framework_desc:0 "现代战争的速度和杀伤力迫使空军和陆军打破隔阂，近距空中支援、战场遮断和目标共享成为陆战的一部分。"
 cw_nato_1970s_airland_battle_preparations_desc:0 "联军开始把纵深打击、机动部队和防御行动整合为统一的作战方法，在敌军后续梯队、补给和指挥体系投入战斗前将其打乱。"
 cw_nato_1970s_doctrine_desc:0 "联军学说强调多层防御、有控制的反击和消耗作战，以遏止敌军突破。"
 cw_nato_1970s_doctrine_header_desc:0 "\n这一阶段的重点是以多层火力、预设阵地和严格掌握的预备队挡住莫斯科协定的进攻，依靠战场侦察和协同的炮兵、空中支援阻止突破。"
 cw_nato_1970s_integrated_air_defense_support_desc:0 "为应对开战初期敌方的大规模空袭和导弹打击，雷达网、截击机、防空导弹和指挥中心跨国连成一体。"
 cw_nato_1970s_maneuver_warfare_emphasis_desc:0 "单纯的阵地防御有其局限。机动预备队对暴露的敌军实施反突击，并利用地形弥补数量上的劣势。"
 cw_nato_1970s_unified_operational_logistics_backbone_desc:0 "\n\n\n\n\n\n\n\n后勤被视为持久高强度作战的决定因素。统一标准和互通的补给体系让多国部队能够持续作战。"
 cw_nato_1980s_deep_attack_integration_desc:0 "纵深打击成为陆战的核心任务。侦察、火力和机动结合起来，打击敌军第二梯队，迟滞其增援。"
 cw_nato_1980s_doctrine_desc:0 "联军学说把空中和地面力量结合起来，在整个作战纵深打击敌军。"
 cw_nato_1980s_doctrine_header_desc:0 "\n这一时期的联军学说要击败敌军的后续梯队，而不只是第一波进攻。精确火力、纵深遮断和快速机动部队相互配合，打乱敌人的作战进度。"
 cw_nato_1980s_joint_operational_synchronization_desc:0 "陆空力量按同一个作战节奏行动，统一计划周期和优先目标，使火力、机动、防空和补给在决定性时刻集中发挥作用。"
 cw_nato_1980s_precision_and_maneuver_synergy_desc:0 "\n\n\n\n\n\n\n\n精确火力与机动部队紧密结合，远程火力和情报支援在纵深打乱敌军，同时让前线部队保持灵活。"
 cw_nato_1980s_rapid_maneuver_brigades_desc:0 "为速度和反突击而组建的旅，依靠合成兵种编组、分散指挥和紧密的空地协同，打击暴露的侧翼并夺取要地。"
 cw_nato_1980s_reconnaissance_strike_coordination_desc:0 "侦察与火力迅速衔接，炮兵和空中力量可以打击时敏目标，使敌军的机动和指挥节点无处隐藏。"
 cw_nato_1990s_air_mobile_expeditionary_brigades_desc:0 "可快速部署的空中机动旅在危机升级前进入动荡地区，夺取要地并保护关键设施。"
 cw_nato_1990s_cjtf_joint_task_force_command_desc:0 "多国联合特遣部队在统一的司令部和共同的参谋程序下，在主战线以外执行危机应对任务。"
 cw_nato_1990s_doctrine_desc:0 "联军转向联合远征部队、危机应对任务和维稳行动。"
 cw_nato_1990s_doctrine_header_desc:0 "\n联军转向危机应对和战区外行动，依靠联合特遣部队、互通的通信、精确打击和专业化的后勤。"
 cw_nato_1990s_joint_precision_campaigning_desc:0 "精确打击、制空和地面机动被整合为统一的战役方法，用来孤立敌军并控制冲突升级。"
 cw_nato_1990s_networked_warfare_continuum_desc:0 "\n\n\n\n\n\n\n\n指挥、情报和打击能力连成一个网络，盟军部队共享战场态势，决策更快。"
 cw_nato_1990s_strategic_airlift_and_prepositioning_desc:0 "战略空运、海运计划和前沿预置装备缩短了部署时间，使多国部队抵达后能立即投入战斗。"
 cw_prc_1940s_doctrine_desc:0 "革命军的学说依靠根据地、运动战、政治动员和民兵配合来应对围剿。"
 cw_prc_1940s_doctrine_header_desc:0 "\n革命军的基本方法是发动群众、加强政治领导，以灵活的游击战逐步转入正规进攻。它强调坚持、局部优势和化劣势为优势。"
 cw_prc_1940s_mobile_encirclement_doctrine_desc:0 "\n\n\n\n部队避开敌军的火力优势，寻找防守薄弱的道路，切断交通线，在敌军纵队或据点重新集结前将其包围歼灭。"
 cw_prc_1940s_peoples_militia_mobilization_desc:0 "\n\n\n\n地方社会被组织起来提供兵员、情报和后勤。民兵负责警戒、守护道路和仓库，在紧急时增援正规部队。"
 cw_prc_1940s_political_military_integration_desc:0 "\n\n\n\n政治工作被视为作战的必要部分。共同的理念、严明的纪律和统一的领导提高士气，减少逃亡。"
 cw_prc_1950s_doctrine_desc:0 "中国引入外国的训练模式，统一编制，扩充炮兵，并建立了初步的防空学说。"
 cw_prc_1950s_doctrine_header:0 "正规化合成兵种"
 cw_prc_1950s_doctrine_title:0 "正规化与常规改革"
 cw_prc_1950s_field_artillery_expansion_desc:0 "\n\n\n\n持续的火力是突破坚固防御的关键。军队增加火炮、加强炮手训练，并统一火力计划和弹药管理。"
 cw_prc_1950s_infiltration_oriented_assault_tactics_desc:0 "\n\n\n\n在较正规的编制中保留渗透战术：部队利用夜色和地形，直插敌方指挥所和支援火器，减少正面强攻的代价。"
 cw_prc_1950s_integrated_air_defense_beginnings_desc:0 "\n\n\n\n军队建立初步的预警和报知网，组建防空部队，并训练指挥员在空袭威胁下分散和隐蔽部队。"
 cw_prc_1950s_soviet_advisory_training_model:0 "外国顾问训练模式"
 cw_prc_1950s_soviet_advisory_training_model_desc:0 "\n\n\n\n在外国顾问的指导下，军队引入正规的训练和参谋方法，统一操练、图上作业和后勤程序。"
 cw_prc_1960s_hardened_infrastructure_and_civil_defense_desc:0 "\n\n\n\n指挥设施加固，仓库分散，运输线受到保护，并具备快速抢修能力。民防包括疏散和防空掩体。"
 cw_prc_1960s_independent_tactical_development_desc:0 "\n\n\n\n外援有限，军队依靠试验和战后总结，发展适合本国地形、兵员和工业条件的战术。"
 cw_prc_1960s_light_infantry_mobility_doctrine_desc:0 "\n\n\n\n步兵练习长途行军和分散机动，在山地和内地迅速占领防御阵地，以机动避免被包围。"
 cw_prc_1970s_precursor_combined_arms_formations_desc:0 "\n\n\n\n步兵、装甲、炮兵、工兵和后勤开始编成统一的作战集团，并制定共同的火力申请和工程作业程序。"
 cw_prc_1980s_doctrine_desc:0 "革命军的改革强调合成集团军、职业化、机械化和战区一级的协调。"
 cw_prc_1980s_doctrine_header_desc:0 "\n军队转向打赢短期的边境和局部冲突，依靠更好的训练、机动和火力协调，以有选择的现代化代替全面动员。"
 cw_prc_1980s_local_wars_doctrine_desc:0 "\n\n\n\n现代化围绕短期、有限的冲突展开，强调快速动员、前沿部署和集中的合成兵种行动，以求尽早夺取主动。"
 cw_prc_1980s_professionalization_and_nco_development_desc:0 "\n\n\n\n军队提高职业标准和训练质量，培养一支能干的士官队伍，由他们负责小分队的纪律、技术和主动性。"
 cw_prc_1980s_reform_era_professional_cohesion_desc:0 "\n\n\n\n\n\n\n\n改革时期的军队统一训练、改进指挥方法并有选择地更新装备，从群众动员型军队转向纪律严明的职业军队。"
 cw_prc_1990s_amphibious_and_airborne_expansion_desc:0 "\n\n\n\n军队扩充两栖和空降能力，训练夺取机场、港口和桥梁，为后续部队和补给打开通道。"
 cw_prc_1990s_high_tech_strike_emphasis_desc:0 "\n\n\n\n打击敌方的关键系统、指挥节点和后勤，以较少的消耗取得作战优势。"
 cw_prc_1990s_networked_battlefield_awareness_desc:0 "\n\n\n\n加强传感器、报告和通信纪律，使侦察情报迅速传到各级部队，缩短决策时间。"
 cw_prc_1990s_rapid_reaction_task_groups_desc:0 "\n\n\n\n快速反应部队按任务模块化编组，迅速部署，夺取要地，在大部队到达前稳定局势。"
 cw_warsaw_1940s_doctrine_desc:0 "俄国学说强调作战纵深、集中火力和梯次突击，以求决定性突破。"
 cw_warsaw_1940s_doctrine_header_desc:0 "\n莫斯科协定的学说源于俄国战后对机械化机动、集中炮兵和作战纵深的总结，追求在集中指挥和周密后勤支持下的高速突破。"
 cw_warsaw_1940s_front_level_counteroffensive_coordination_desc:0 "\n\n\n\n方面军一级的集中指挥协调多个集团军、炮兵群和保障力量，使各路突击相互支援。"
 cw_warsaw_1940s_massed_artillery_breakthroughs_desc:0 "\n\n\n\n火力是塑造战场的主要手段。高密度的火炮以周密计划的弹幕摧毁工事和指挥所，并与步兵的推进同步延伸。"
 cw_warsaw_1940s_mechanized_exploitation_forces_desc:0 "\n\n\n\n突破口打开后，机动部队直插敌军后方，夺取渡口、切断补给线，在敌预备队重新集结前将其打乱。"
 cw_warsaw_1940s_sequential_offensive_operations_desc:0 "\n\n\n\n一系列相互衔接的打击接连展开，每一次都为下一次创造条件，迫使敌人不断投入预备队。"
 cw_warsaw_1940s_shock_army_penetration_tactics_desc:0 "\n\n\n\n在狭窄地段集中兵力和火力，以重炮摧毁支撑点，步兵与坦克、工兵紧密协同突破障碍。"
 cw_warsaw_1950s_centralized_operational_control_desc:0 "\n\n\n\n关于预备队、炮兵、空中支援和主攻方向的决定集中在高级司令部，确保统一行动。"
 cw_warsaw_1950s_doctrine_desc:0 "莫斯科协定的学说把核火力与大规模装甲部队和集中的作战指挥结合起来。"
 cw_warsaw_1950s_echeloned_assault_planning_desc:0 "\n\n\n\n进攻力量分梯队配置：第一梯队突破防线，第二梯队扩大突破口并击退反击，后续部队向纵深发展。"
 cw_warsaw_1950s_forward_layered_defense_desc:0 "\n\n\n\n防御由多道地带组成，设有预设阵地、交叉火力和预定的撤退线，用来迟滞并消耗进攻者。"
 cw_warsaw_1950s_rapid_mobilization_framework_desc:0 "\n\n\n\n预先制定的征召程序、预备役编组、装备储存和运输计划，使和平时期的骨干部队能在短时间内扩充为战时大军。"
 cw_warsaw_1960s_centralized_offensive_planning_desc:0 "\n\n\n\n随着作战节奏加快，高级司令部统一决定进攻方向、梯队投入时机和火力分配，并协调防空与后勤。"
 cw_warsaw_1960s_combined_arms_divisional_reform_desc:0 "\n\n\n\n师被改编为均衡、自成体系的作战单位，把机械化步兵、装甲、炮兵、工兵、侦察和防空编在一起，指挥关系固定。"
 cw_warsaw_1960s_doctrine_desc:0 "学说进一步完善梯次突击、合成兵种协同和对联军防御地带的纵深突破。"
 cw_warsaw_1960s_echeloned_assault_refinement_desc:0 "\n\n\n\n\n\n\n\n部队分成连续的突击波次，依靠梯队之间的协调、集中的火力准备和严格的作战控制扩大突破。"
 cw_warsaw_1970s_doctrine_desc:0 "莫斯科协定的部队强调使用快速机动集群扩张突破并扰乱敌方后方。"
 cw_warsaw_1970s_doctrine_header_desc:0 "\n这一阶段的计划以连续梯队和不间断的压力瘫痪敌方体系，迅速转移主攻方向，以协同火力阻止联军组织反击。"
 cw_warsaw_1970s_high_mass_fire_preparation_desc:0 "\n\n\n\n火力准备分为压制、摧毁和瘫痪几个阶段，在决定性地点打掉反坦克火器、指挥所和观察所，为快速机动开路。"
 cw_warsaw_1970s_offensive_depth_optimization_desc:0 "\n\n\n\n\n\n\n\n进攻延伸到前线以外，打击整个战区的预备队、后勤和指挥体系，加速敌人的崩溃。"
 cw_warsaw_1980s_doctrine_header:0 "纵深打击学说"
 cw_warsaw_1980s_doctrine_header_desc:0 "\n这一学说把侦察、精确火力和高速机动结合成一个整体，切断敌方的指挥，使联军无法喘息重建防线。"
 cw_warsaw_1980s_doctrine_title:0 "纵深打击学说"
 cw_warsaw_1980s_integrated_strike_maneuver_architecture_desc:0 "\n\n\n\n\n\n\n\n炮兵、导弹、航空兵和地面部队协同行动，在整个纵深同时施压，以压倒敌方的防御。"
 cw_warsaw_1980s_operational_counter_penetration_measures_desc:0 "\n\n\n\n迅速发现敌方的突破，灵活投入预备队，在火力和电子干扰支援下组织反击，在敌人扩大战果前恢复态势。"
 cw_warsaw_1980s_precision_non_nuclear_engagement_desc:0 "\n\n\n\n依靠更高的精度、更好的目标选择和周密的常规火力，在不越过核门槛的情况下取得决定性效果。"
 cw_warsaw_1990s_doctrine_header:0 "冷战后期作战现代化"
 cw_warsaw_1990s_doctrine_header_desc:0 "\n在资源紧张的情况下，学说转向精干的职业骨干、更可靠的指挥通信和有选择的现代化，强调灵活的合成编组和电子战。"
 cw_warsaw_1990s_high_tech_operational_maturity_desc:0 "\n\n\n\n\n\n\n\n自动化、更好的指挥系统和侦察手段被纳入既有的作战框架，使原有的进攻方法得到更新。"
 cw_warsaw_1990s_operational_maneuver_resilience_desc:0 "\n\n\n\n在干扰、损失和信息被切断的情况下继续机动，依靠可靠的指挥、冗余的通信、灵活的后勤和小分队的主动性。"
