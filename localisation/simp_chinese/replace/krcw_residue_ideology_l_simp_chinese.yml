 syndicalism_desc:0 "£Ideology_Syndicalism_pic\n\n\n\n\n\n\n\n\n工团主义主张由按行业组织的工会掌握生产资料，以罢工和工人委员会取代议会与资本家的统治。它源于蒲鲁东、索雷尔和十九世纪末法国工会的斗争。1919年以后，法兰西公社与不列颠联邦把它变成了国家制度，第三国际是它的国际联合会。"
 regency:0 "摄政"
 regency_desc:0 "£Ideology_Regency_pic\n\n\n\n\n\n\n\n\n君主年幼或无法亲政时，由摄政代行君主的权力与职责，直到君主能够亲政。"
 ibadi_immamate:0 "伊巴德派伊玛目国"
 sandanista_desc:0 "£Ideology_Sandanista_pic\n\n\n\n\n\n\n\n\n桑地诺主义得名于尼加拉瓜游击领袖奥古斯托·塞萨尔·桑地诺。它主张赶走外国驻军，把土地分给农民，并由工人和农民的组织管理国家。"
 marhaenism_desc:0 "£Ideology_Marhaenism_pic\n\n\n\n\n\n\n\n\n马尔哈恩主义是苏加诺在1920年代提出的学说，得名于西爪哇的农民马尔哈恩。它认为印度尼西亚的小农、小工匠与小商贩应当联合起来，反对殖民资本，建立人民自己的国家。"
 nkrumaism_desc:0 "£Ideology_Nkrumaism_pic\n\n\n\n\n\n\n\n\n恩克鲁玛主义是夸梅·恩克鲁玛提出的政治学说，主张彻底结束殖民统治，实现非洲的团结，并由国家主导工业化。"
 peronism_desc:0 "£Ideology_Center_Peronism_pic\n\n\n\n\n\n\n\n\n庇隆主义以胡安·庇隆上校命名，主张社会正义、工人权利与经济民族主义，自称资本主义与社会主义之外的“第三立场”，依靠工会和军队的支持。"
