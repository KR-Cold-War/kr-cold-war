 krcw_sov_clients_tt:0 "附庸们的反应将在几个月后揭晓。"
 krcw_sov_ext_banned_tt:0 "极端派的影响力：§R-25§!"
 krcw_sov_technocrat_bonus:0 "技术派的计划"
 krcw_ent_courted:0 "殷勤的追求者"
 krcw_ent_rebuffed:0 "被拒绝的追求"
 krcw_ent_courting_category:0 "争取堪培拉"
 krcw_ent_courting_category_desc:0 "协约国的流亡王室坐在堪培拉，统治着澳大利亚与新西兰。它恨夺走了不列颠的第三国际，也厌恶萨文科夫的绞架。两大集团都想让它倒向自己一边——或者至少不要倒向对方。"
 krcw_ent_lean_p15_tt:0 "堪培拉倾向于巴黎：§G+15§!"
 krcw_ent_ti_wool_contracts:0 "羊毛的长期合同"
 krcw_ent_ti_wool_contracts_desc:0 "联合会以高于市场的价格包下澳大利亚十年的羊毛产量。这不是施舍，这是提醒堪培拉：它的顾客在哪里。"
 krcw_ent_lean_p20_tt:0 "堪培拉倾向于巴黎：§G+20§!"
 krcw_ent_ti_technical_mission:0 "技术代表团"
 krcw_ent_ti_technical_mission_desc:0 "一百名法国与不列颠的工程师去悉尼和墨尔本帮忙建造电站与机床厂。他们被要求不谈政治，大部分人做到了。"
 krcw_ent_ti_recognise_the_crown:0 "承认流亡王室"
 krcw_ent_ti_recognise_the_crown_desc:0 "国际从未承认过堪培拉的王室对不列颠的主张，现在也不会。但它可以承认另一件事：这个王室是澳大利亚与新西兰的合法政府。"
 krcw_ent_lean_m15_tt:0 "堪培拉倾向于莫斯科：§R-15§!"
 krcw_ent_ma_arms_sales:0 "廉价的坦克"
 krcw_ent_ma_arms_sales_desc:0 "莫斯科卖给澳新的坦克比国际给的便宜一半，而且不附带任何关于工会的条件。"
 krcw_ent_lean_m20_tt:0 "堪培拉倾向于莫斯科：§R-20§!"
 krcw_ent_ma_pacific_squadron:0 "太平洋分舰队来访"
 krcw_ent_ma_pacific_squadron_desc:0 "符拉迪沃斯托克的巡洋舰在悉尼港下锚。岸上的欢迎仪式比预想的热烈，工会码头工人拒绝为它们装煤。"
 krcw_ent_ma_anti_syndicalist_compact:0 "反工团主义公约"
 krcw_ent_ma_anti_syndicalist_compact_desc:0 "一份秘密的情报合作协定：国家保卫局与澳大利亚安全情报局交换关于工会“颠覆分子”的档案。"
 krcw_ent_canberra_category:0 "堪培拉的抉择"
 krcw_ent_canberra_category_desc:0 "两个集团都在敲门。流亡的王室必须决定：开哪一扇门，还是把两扇都锁上。"
 krcw_ent_declare_armed_neutrality:0 "宣布武装中立"
 krcw_ent_declare_armed_neutrality_desc:0 "谁也不站，但谁也别想在这里登陆。堪培拉宣布：澳新既不加入国际，也不加入协定。"
 krcw_ent_play_both_sides:0 "左右逢源"
 krcw_ent_play_both_sides_desc:0 "让巴黎的工程师和莫斯科的武官住在同一家酒店，让他们互相看见。报价立刻都提高了。"
 krcw_ent_canberra_conference:0 "堪培拉会议"
 krcw_ent_canberra_conference_desc:0 "一个没有加入任何集团的国家，邀请两个集团在它的首都谈判太平洋的航道、捕鲸与核试验。这是它三十年来第一次不再只是流亡者。"
 krcw_ent_1_t:0 "巴黎的提议"
 krcw_ent_1_d:0 "国际的特使带来了一份条约草案：长期贸易协定、技术援助、互不侵犯，以及一句写在附件里的话——“缔约双方不在对方领土上从事政治宣传”。\n\n内阁里有人说，这是二十五年来第一次有人把堪培拉当作一个国家而不是一个流亡者来对待。另一个人提醒大家：签字的那支笔来自夺走伦敦的那些人。"
 krcw_ent_1.a:0 "签字：面包比王冠重要"
 krcw_ent_1.b:0 "我们记得伦敦"
 krcw_ent_2_t:0 "莫斯科的提议"
 krcw_ent_2_d:0 "俄罗斯的武官带来的是一份防务协定：坦克、截击机、一支常驻达尔文港的顾问团，以及两国情报机构之间的“全面合作”。没有一个字提到工会，也没有一个字提到选举。\n\n国防部长认为这是澳大利亚得到过的最好的报价。外交部长问了一个问题：一个吊死自己工人的政权，会对我们的工人做什么？"
 krcw_ent_2.a:0 "签字：敌人的敌人"
 krcw_ent_2.b:0 "我们不要绞架"
 krcw_ent_3_t:0 "堪培拉的答复"
 krcw_ent_3_d0:0 "堪培拉签署了与国际的条约。流亡王室的报纸称之为“务实的一步”，而悉尼的码头工人在港口挂起了红旗——内阁假装没有看见。"
 krcw_ent_3_d1:0 "堪培拉签署了与莫斯科的防务协定。第一批俄罗斯顾问已在达尔文港登岸，澳大利亚工会理事会宣布举行全国总罢工以示抗议。"
 krcw_ent_3_d2:0 "堪培拉礼貌地拒绝了。外交照会的措辞无可挑剔，意思却很清楚：流亡王室不会为任何人放弃它最后的一点独立。"
 krcw_ent_3.a:0 "（第三国际）记下来"
 krcw_ent_3.b:0 "（莫斯科协定）记下来"
 krcw_ent_4_t:0 "堪培拉会议"
 krcw_ent_4_d:0 "一个不属于任何集团的国家，邀请两个集团在它的首都谈判太平洋的航道、捕鲸与核试验。会议持续了三周，签署了四份技术性协定——以及一份谁都没想到会签成的声明：南太平洋是无核区。\n\n二十五年来，堪培拉的王室一直是一个关于过去的故事。这一次，它讲了一个关于未来的故事。"
 krcw_ent_4.a:0 "（第三国际）一个值得尊重的中立者"
 krcw_ent_4.b:0 "（莫斯科协定）他们会后悔的"
 krcw_ent_4.c:0 "南太平洋的和平"
 krcw_ti_comrades_in_arms:0 "战友"
 krcw_ma_loyal_member:0 "忠诚的成员"
 krcw_ma_wayward_member:0 "不听话的成员"
 krcw_ti_federal_militia:0 "工团民兵"
 krcw_ti_federal_militia_desc:0 "每个车间一个排，每个联合会一个营。民兵平时上班，周末在城外的靶场练习——国际的小国养不起大军，但每一个工人都知道自己的集合点在哪里。"
 krcw_ma_land_reform:0 "迟来的土地改革"
 krcw_ma_land_reform_desc:0 "莫斯科三十年前就把土地给了农民，协定的其他成员却一直拖着。现在，边界那一侧的广播再也不能用这件事来煽动农民了。"
 krcw_ti_minor_tree:0 "krcw_ti_minor_tree"
 krcw_ti_our_place_in_the_internationale:0 "确定在国际中的立场"
 krcw_ti_our_place_in_the_internationale_desc:0 "巴黎是国际的首都，但不是国际的全部。每个成员都有自己的革命、自己的传统和自己的难处——以及在联合会代表大会上的一票。"
 krcw_ti_the_federation_congress:0 "联合会代表大会"
 krcw_ti_the_federation_congress_desc:0 "全国的工会、农会与市镇公社每两年派代表开一次大会。它既是议会，也是经济计划委员会——会开得很长，但决议没有人敢不执行。"
 krcw_ti_our_own_road:0 "本国的革命道路"
 krcw_ti_our_own_road_desc:0 "国际章程承认各成员按本国传统组织公社。哥本哈根、都柏林和阿姆斯特丹各有各的做法。"
 krcw_ti_against_the_offices:0 "反对办公室"
 krcw_ti_against_the_offices_desc:0 "革命二十年，联合会的干部比车间的工人坐得更舒服了。新的章程规定干部任期两年、可随时罢免。"
 krcw_ti_festival_of_youth:0 "青年联欢节"
 krcw_ti_festival_of_youth_desc:0 "音乐、电影、辩论和露营。国际的年轻一代在夏天的联欢节上认识彼此——他们对革命的理解和他们的父母不太一样。"
 krcw_ti_the_second_commune_dialogue:0 "与第二公社对话"
 krcw_ti_the_second_commune_dialogue_desc:0 "车间里的年轻人说革命被办公室偷走了。与其驱散他们的集会，不如请他们的代表进联合会大会。"
 krcw_ti_join_the_federations:0 "加入产业联合会"
 krcw_ti_join_the_federations_desc:0 "交出一部分定价权与生产计划，换来技术图纸、配额与一个不会被封锁的市场。小国算过这笔账，都签了。"
 krcw_ti_roads_and_power_lines:0 "公路与电网"
 krcw_ti_roads_and_power_lines_desc:0 "联合会的第一笔贷款用在了最不起眼的地方：乡村公路、变电站和通往港口的铁路支线。"
 krcw_ti_federation_factories:0 "引进联合会工厂"
 krcw_ti_federation_factories_desc:0 "机床从里昂和谢菲尔德运来，工人在本地招募，产品按配额销往整个国际。"
 krcw_ti_our_specialisation:0 "选定专长行业"
 krcw_ti_our_specialisation_desc:0 "在一个跨国计划里，每个成员都要找到自己最擅长的东西：丹麦的船、荷兰的电器、挪威的铝、意大利的汽车。"
 krcw_ti_shared_laboratories:0 "交换研究人员"
 krcw_ti_shared_laboratories_desc:0 "萨克雷、哈韦尔和代尔夫特的实验室交换研究员与数据。小国出不起一台回旋加速器的钱，但它们可以出物理学家。"
 krcw_ti_the_clearing_ledger:0 "清算总账"
 krcw_ti_the_clearing_ledger_desc:0 "赤字国不必紧缩，盈余国不能囤积。巴黎的总账上，每个成员都有一页。"
 krcw_ti_hold_the_line:0 "前线戒备"
 krcw_ti_hold_the_line_desc:0 "易北河、阿尔卑斯山口、波罗的海的入口——国际的小国正好坐在这些地方。它们的国防计划只有一条：撑住，直到巴黎的装甲师赶到。"
 krcw_ti_the_union_militia:0 "工团民兵"
 krcw_ti_the_union_militia_desc:0 "每个车间一个排，每个联合会一个营。小国养不起大军，但每个工人都知道自己的集合点在哪里。"
 krcw_ti_air_defence_network:0 "防空网"
 krcw_ti_air_defence_network_desc:0 "雷达站连成一条从北角到西西里的链条，每个成员负责自己的一段。"
 krcw_ti_coastal_flotillas:0 "沿海舰队"
 krcw_ti_coastal_flotillas_desc:0 "护卫舰、扫雷艇和鱼雷快艇。小国的海军不去争夺大洋，它们守的是自己的海峡与港口。"
 krcw_ti_the_federal_army:0 "编入联合指挥部"
 krcw_ti_the_federal_army_desc:0 "本国的师编入国际的联合指挥部，军官在巴黎的参谋学院受训。一支小军队，在一个大体系里。"
 krcw_ti_international_brigades:0 "国际纵队"
 krcw_ti_international_brigades_desc:0 "西班牙之后，国际纵队从未真正解散。每个成员都有一批愿意去任何地方的志愿者——亚洲、非洲，或者密西西比河东岸。"
 krcw_ti_southern_solidarity:0 "派遣援外技术人员"
 krcw_ti_southern_solidarity_desc:0 "向阿尔及尔、达喀尔和仰光派遣工程师、医生和教师。小国派出的援助人员更容易被当地接受。"
 krcw_ti_a_bridge_to_the_east:0 "开办对东方的短波电台"
 krcw_ti_a_bridge_to_the_east_desc:0 "本国电台用波兰语、匈牙利语和俄语向铁丝网另一侧广播，播报协定报纸不登的罢工和短缺。小国的电台比巴黎的更容易被听众相信，也更容易招来协定的干扰和报复。"
 krcw_ti_europe_without_walls:0 "整顿边境检查站"
 krcw_ti_europe_without_walls_desc:0 "边防和海关联合整顿检查站，核查越境人员的证件，截留协定送来的印刷品和经费。商人和探亲的人要多排几个小时的队，边境居民对此不满。"
 krcw_ti_fraternal_dispute:0 "兄弟间的争执"
 krcw_ti_secretariat_favour:0 "书记处的青睐"
 krcw_ti_border_grievance:0 "边界的旧账"
 krcw_ti_loyal_pillar:0 "国际的支柱"
 krcw_ti_loyal_pillar_desc:0 "书记处的分配表上，可靠的成员排在前面。本国的师编入联合指挥部，本国的计划与巴黎的计划同一本账——代价是再也没有人问本国的意见。"
 krcw_ti_national_road:0 "民族的道路"
 krcw_ti_national_road_desc:0 "章程第三条写着“各联合会按自身传统组织”。二十年来这一条是客套话，现在它成了本国的国策——在国际之内，但不在巴黎之下。"
 krcw_ti_commune_democracy:0 "车间民主"
 krcw_ti_commune_democracy_desc:0 "计划不再从部里发下来，而是从车间大会报上去。会议开得很长，决议改得很慢，可是一旦通过，没有人需要被监督。"
 krcw_ti_professional_cadre:0 "职业军官团"
 krcw_ti_professional_cadre_desc:0 "民兵在自己的街区里很能打，可是它开不出国境。一支小而专业的常备军——军官在巴黎的参谋学院受训，士官读得懂无线电手册。"
 krcw_ti_maritime_federation:0 "海洋联合会"
 krcw_ti_maritime_federation_desc:0 "哥本哈根、鹿特丹、奥斯陆、热那亚和都柏林的船东工会合成一个联合会。它的商船队比任何一国的海军都重要——国际的血液走海路。"
 krcw_ti_atomic_participant:0 "原子计划的参与国"
 krcw_ti_atomic_participant_desc:0 "本国出不起一座反应堆，但出得起二十个物理学家和一座重水厂。萨克雷的名单上，本国的名字排在第四栏——参与国，不是拥有国。"
 krcw_ti_frontline_burden:0 "前线的负担"
 krcw_ti_frontline_burden_desc:0 "易北河、亚得里亚海、北海的入口——铁丝网就在国境上。军费吃掉了预算的三分之一，而每一个家庭都有人在边境的哨所里。"
 krcw_ti_the_question_of_paris:0 "提出巴黎的地位问题"
 krcw_ti_the_question_of_paris_desc:0 "国际的章程说成员平等，可是书记处在巴黎，清算联盟的总账在巴黎，装甲师也在巴黎。代表大会必须回答一个二十年来没人敢正式提出的问题：我们究竟是一个联邦的成员，还是一个首都的省份？"
 krcw_ti_the_loyal_pillar:0 "紧跟巴黎"
 krcw_ti_the_loyal_pillar_desc:0 "小国在两个巨人之间没有第三条路。与其为自主权吵到嗓子哑，不如做国际最可靠的一根柱子——可靠的成员在书记处的分配表上排在前面。"
 krcw_ti_the_national_road:0 "要求按传统组织"
 krcw_ti_the_national_road_desc:0 "革命是在本国的工厂里赢的，不是在巴黎的会议室里。章程第三条写着“各联合会按自身传统组织”——现在我们要求按字面执行它。"
 krcw_ti_the_second_commune_current:0 "回应第二公社运动"
 krcw_ti_the_second_commune_current_desc:0 "第二公社运动的青年认为各级机关都管得太多，要求把权力还给车间大会。"
 krcw_ti_the_joint_command:0 "联合指挥部"
 krcw_ti_the_joint_command_desc:0 "本国的参谋部搬进了巴黎联合指挥部的一间办公室。作战计划、补给标准、无线电频率全部统一——本国的将军在会议桌上有一把椅子，但没有否决权。"
 krcw_ti_the_secretariat_quota:0 "争取更高配额"
 krcw_ti_the_secretariat_quota_desc:0 "忠诚是有回报的：本国在产业联合会的配额提高了一档，机床与轴承的交货期从两年缩短到十个月。"
 krcw_ti_the_model_member:0 "模范成员"
 krcw_ti_the_model_member_desc:0 "巴黎的宣传部门把本国拍成纪录片：一个小国如何在国际的帮助下从废墟走向繁荣。片子在整个第三国际放映，本国的代表在大会上得到了掌声。"
 krcw_ti_the_federal_budget:0 "联邦预算"
 krcw_ti_the_federal_budget_desc:0 "国际的共同预算第一次包含了本国的国防开支。这意味着巴黎替我们付一部分军费——也意味着巴黎知道我们每一分钱花在哪里。"
 krcw_ti_the_permanent_delegation:0 "常驻代表团"
 krcw_ti_the_permanent_delegation_desc:0 "本国在巴黎设立常驻代表团，团长的地位仅次于大国代表。小国的影响力不在于军队的规模，而在于走廊里的熟人。"
 krcw_ti_the_shield_of_the_west:0 "承担最险防段"
 krcw_ti_the_shield_of_the_west_desc:0 "本国自愿承担国际防线上最难守的一段。这是一份荣誉，也是一份保险单：守着国际的门，国际就不会让门倒下。"
 krcw_ti_first_among_the_small:0 "小国之首"
 krcw_ti_first_among_the_small_desc:0 "在书记处的走廊里，本国成了其他小成员的代言人。大国说话的时候我们不插嘴，但大国说完之后，小国听我们的。"
 krcw_ti_our_own_general_staff:0 "收回本国师指挥权"
 krcw_ti_our_own_general_staff_desc:0 "本国的师从联合指挥部撤回本国指挥。巴黎的军事代表抗议说这会破坏统一防御——本国的回答是：统一防御从未问过本国的地形。"
 krcw_ti_national_accounting:0 "自主编制计划"
 krcw_ti_national_accounting_desc:0 "清算联盟的总账仍然记在巴黎，但本国的计划委员会不再把草案送去审批。配额可以谈，但计划是本国的事。"
 krcw_ti_the_language_of_the_revolution:0 "以本国语言记录文件"
 krcw_ti_the_language_of_the_revolution_desc:0 "国际的文件一律用法语起草。本国的代表大会通过决议：本国的革命用本国的语言记录，翻译的费用由巴黎承担。"
 krcw_ti_bilateral_trade:0 "双边贸易"
 krcw_ti_bilateral_trade_desc:0 "不通过清算联盟，本国直接与中国、与青年国家、甚至与中立的瑞典签订贸易协定。巴黎的经济学家说这是倒退，本国的商人说这是利润。"
 krcw_ti_the_veto_demand:0 "要求领土事务否决权"
 krcw_ti_the_veto_demand_desc:0 "本国在代表大会上提出修改章程：任何涉及成员国领土与军队的决议，须经该成员国同意。大国反对，其他小国沉默地支持。"
 krcw_ti_armed_autonomy:0 "自主设计武器"
 krcw_ti_armed_autonomy_desc:0 "一个国家要有自己的外交，就得有自己的军工。本国的兵工厂开始生产自己设计的步枪与火炮——不再等巴黎的图纸。"
 krcw_ti_a_federation_of_equals:0 "改书记处为轮值制"
 krcw_ti_a_federation_of_equals_desc:0 "经过四年的争吵，新章程在里昂通过：书记处改为轮值，清算联盟的理事会按人口而非工业产值分配席位。国际没有分裂，成员反而更多了。"
 krcw_ti_the_recallable_delegate:0 "实行代表随时罢免"
 krcw_ti_the_recallable_delegate_desc:0 "车间大会可以在任何一次会议上罢免自己的代表。干部们抱怨没法做长远计划，工人们回答说这正是重点。"
 krcw_ti_the_shop_floor_plan:0 "改由车间上报指标"
 krcw_ti_the_shop_floor_plan_desc:0 "生产指标不再由部里下达，而由车间自己上报，再在地区联合会里汇总。第一年的产量掉了百分之三，第三年超出计划百分之十一。"
 krcw_ti_the_young_congress:0 "增加青年代表名额"
 krcw_ti_the_young_congress_desc:0 "二十五岁以下的代表在代表大会上占了三分之一的席位。他们提出的第一项决议是把兵役期从三年减到十八个月，第二项是废除干部食堂。"
 krcw_ti_the_commune_militia:0 "组建车间民兵"
 krcw_ti_the_commune_militia_desc:0 "第二公社不信任常备军——常备军是办公室的武器。国防交给车间民兵：装备差，训练少，但每一个连都选举自己的连长。"
 krcw_ti_the_cybernetic_workshop:0 "控制论车间"
 krcw_ti_the_cybernetic_workshop_desc:0 "如果车间自己做计划，车间就需要算力。本国的第一台计算机装在工会大楼的地下室里，用来核对三千个车间报上来的数字。"
 krcw_ti_the_charter_of_the_workshops:0 "车间宪章"
 krcw_ti_the_charter_of_the_workshops_desc:0 "新宪章写明：一切权力属于车间大会与市镇公社，联合会只是它们的办事处。这是国际内部最彻底的一次民主实验，也是最脆弱的一次。"
 krcw_ti_the_second_international_call:0 "向全国际散发车间宪章"
 krcw_ti_the_second_international_call_desc:0 "本国把车间宪章的文本印成三十万份，送往巴黎、伦敦、罗马和纽约。巴黎的书记处称之为“分裂主义”，可是里昂的车间已经开始投票了。"
 krcw_ti_the_specialisation_compact:0 "专长公约"
 krcw_ti_the_specialisation_compact_desc:0 "跨国计划的逻辑很简单：谁做得最好，谁就多做。丹麦造船，荷兰造电器，挪威炼铝，意大利造汽车，伊比利亚挖矿——本国签下了自己的那一栏。"
 krcw_ti_the_yards_and_the_sea:0 "扩建船厂"
 krcw_ti_the_yards_and_the_sea_desc:0 "哥本哈根、鹿特丹、奥斯陆、贝尔法斯特与热那亚的船台上同时铺着龙骨。国际的商船队要在十年内翻一倍——否则封锁一来，联邦就断成几截。"
 krcw_ti_the_electrical_trust:0 "电气托拉斯"
 krcw_ti_the_electrical_trust_desc:0 "飞利浦的工厂在革命后由工人委员会接管，却保住了它的实验室。整个国际的灯泡、收音机与雷达管都从这里出来。"
 krcw_ti_aluminium_and_fjords:0 "发展峡湾铝业"
 krcw_ti_aluminium_and_fjords_desc:0 "挪威的水电便宜得近乎免费，而炼铝是把电变成金属的生意。国际的每一架飞机里都有一块挪威的铝。"
 krcw_ti_the_motor_works:0 "汽车工场"
 krcw_ti_the_motor_works_desc:0 "都灵的菲亚特厂由工人委员会经营。同一条生产线上下来卡车、拖拉机和装甲车——国际的机械化靠这几条线。"
 krcw_ti_the_iberian_mines:0 "交由矿工管理矿山"
 krcw_ti_the_iberian_mines_desc:0 "里奥廷托、阿尔马登和阿斯图里亚斯的矿山收归公有后，矿工要求由自己管理。"
 krcw_ti_the_common_market_of_labour:0 "劳动的共同市场"
 krcw_ti_the_common_market_of_labour_desc:0 "工人可以在国际之内自由迁移，工龄、养老金与住房排队资格跨国承认。一个都柏林的焊工可以去鹿特丹干三年再回来，不损失任何东西。"
 krcw_ti_shared_laboratories_two:0 "联合研究院"
 krcw_ti_shared_laboratories_two_desc:0 "萨克雷、代尔夫特、哈韦尔与都灵理工的联合研究院。小国出不起大科学，但四个小国合起来出得起。"
 krcw_ti_the_atomic_annex:0 "原子附加协议"
 krcw_ti_the_atomic_annex_desc:0 "国际的原子计划由巴黎主持，但重水、铀矿与一部分离心机在小国境内。本国签署了附加协议：提供设施与人员，换取数据与一票发言权。"
 krcw_ti_the_rotterdam_agreement:0 "鹿特丹协定"
 krcw_ti_the_rotterdam_agreement_desc:0 "国际所有成员的港务工会签订统一费率与统一罢工规则。这听起来枯燥，可它意味着任何一个港口都不能被用来勒索联邦。"
 krcw_ti_the_third_plan:0 "第三个五年计划"
 krcw_ti_the_third_plan_desc:0 "前两个计划修复了战争的破坏，第三个计划要让本国的工人过上比革命前更好的日子——住宅、诊所、电冰箱、每年两周的带薪假。"
 krcw_ti_the_defence_review:0 "国防检讨"
 krcw_ti_the_defence_review_desc:0 "一九五〇年的国防检讨提出一个尖锐的问题：本国究竟要一支能守住自己街区的民兵，还是一支能跟着国际出征的常备军？两者的钱只够办一样。"
 krcw_ti_the_professional_army:0 "职业军队"
 krcw_ti_the_professional_army_desc:0 "民兵在自己的街区里很能打，可它开不出国境。一支小而专业的常备军：军官在巴黎受训，士官读得懂无线电手册，全员服役五年。"
 krcw_ti_the_frontier_fortifications:0 "边境工事"
 krcw_ti_the_frontier_fortifications_desc:0 "易北河、阿尔卑斯山口、亚得里亚海岸、北海的入口——铁丝网就在国境上。混凝土一年年加厚，可是谁都知道混凝土只能买来时间。"
 krcw_ti_the_conscript_question:0 "调整兵役期"
 krcw_ti_the_conscript_question_desc:0 "青年代表要求缩短兵役，总参谋部要求延长。最后的妥协是十八个月加每年两周的预备役训练——两边都不满意，两边都能接受。"
 krcw_ti_the_coastal_command:0 "海岸司令部"
 krcw_ti_the_coastal_command_desc:0 "潜艇、鱼雷艇、水雷与岸炮。小国的海军不去争夺大洋，它要做的是让任何人在本国海岸附近都不舒服。"
 krcw_ti_the_air_wing:0 "战斗机联队"
 krcw_ti_the_air_wing_desc:0 "组建两个截击机联队和一套雷达网，提高敌方空袭的代价。"
 krcw_ti_the_seventy_two_hours:0 "制定七十二小时防御计划"
 krcw_ti_the_seventy_two_hours_desc:0 "所有的计划都建立在同一个数字上：本国必须独自撑住七十二小时，之后国际的装甲师会赶到。演习一年做四次，每一次都在计算这个数字。"
 krcw_ti_the_civil_defence_corps:0 "民防队"
 krcw_ti_the_civil_defence_corps_desc:0 "如果原子弹落在鹿特丹或都灵，没有军队能帮上忙。每个街区组织民防队，地铁站改成掩体，学校里教孩子听警报。"
 krcw_ti_the_unfinished_borders:0 "列出未决边界"
 krcw_ti_the_unfinished_borders_desc:0 "革命重画了欧洲的地图，却留下了几条没人满意的线：阿尔斯特、亚得里亚海、直布罗陀、柏林、五大湖。国际的章程禁止成员间开战——但没禁止吵架。"
 krcw_ti_the_ulster_question:0 "处理贝尔法斯特船厂工会"
 krcw_ti_the_ulster_question_desc:0 "北爱尔兰在一九四七年归了都柏林，可是贝尔法斯特的造船工人多半是新教徒，他们的工会宁愿听格拉斯哥的话。这是国际内部最尴尬的一条边界。"
 krcw_ti_the_adriatic_question:0 "交涉的里雅斯特问题"
 krcw_ti_the_adriatic_question_desc:0 "的里雅斯特与伊斯特拉的意大利人要求归罗马，南斯拉夫的军政府拒绝讨论。这是国际成员与协定成员之间唯一一条直接对峙的陆上边界。"
 krcw_ti_the_rock:0 "交涉直布罗陀"
 krcw_ti_the_rock_desc:0 "直布罗陀仍然挂着不列颠联邦的旗。伊比利亚联邦每年在代表大会上提出一次，不列颠每年礼貌地拒绝一次——两边都知道这块岩石卡着地中海的门。"
 krcw_ti_west_berlin:0 "西柏林"
 krcw_ti_west_berlin_desc:0 "一座被铁丝网围住的城市，靠一条空中走廊活着。它是国际最脆弱的一点，也是国际最有力的一句宣传——只要它还亮着灯。"
 krcw_ti_the_great_lakes:0 "五大湖"
 krcw_ti_the_great_lakes_desc:0 "加拿大与密西西比河东岸的工团共和国共用四个湖。湖上没有军舰——两国在一九四七年签了协议——可是湖南岸的朗随时可能让这份协议变成废纸。"
 krcw_ti_the_arbitration_court:0 "仲裁法庭"
 krcw_ti_the_arbitration_court_desc:0 "本国提议在日内瓦设立国际内部的仲裁法庭：成员之间的领土争执交给它，判决由代表大会背书。这不解决争执，但它把争执从军队手里拿走了。"
 krcw_ti_the_young_nations_bureau:0 "青年国家事务局"
 krcw_ti_the_young_nations_bureau_desc:0 "小国比大国更容易被新独立的国家相信——本国没有殖民地，也没有舰队去要回殖民地。事务局派出工程师、教师和医生，不派顾问。"
 krcw_ti_the_neutral_channel:0 "在斯德哥尔摩设立情报站"
 krcw_ti_the_neutral_channel_desc:0 "本国在斯德哥尔摩设立情报站，通过中立国的商人和船员与协定境内的地下组织联络。站点由本国保卫部门管理，情报同时报送巴黎。"
 krcw_ti_the_welfare_charter:0 "福利宪章"
 krcw_ti_the_welfare_charter_desc:0 "国际成员国签署共同社会宪章：最低工资、每周四十四小时工作制、全民医疗、产科医院和幼儿园。"
 krcw_ti_the_television_age:0 "开播电视"
 krcw_ti_the_television_age_desc:0 "本国第一座电视塔开播，信号覆盖到边境另一侧的城市。电视台由工会和市镇公社共同管理，节目里的住房、商店和假期让协定的宣传更难自圆其说。"
 krcw_ti_the_university_expansion:0 "扩大大学招生"
 krcw_ti_the_university_expansion_desc:0 "入学人数十年翻了三倍。这批学生将在一九五四年走上街头，要求把他们父母赢得的革命再往前推一步。"
 krcw_ti_the_space_contribution:0 "参与国际航天计划"
 krcw_ti_the_space_contribution_desc:0 "国际的航天计划由法国主持，可是跟踪站要设在挪威、加拿大和西非，光学仪器来自荷兰，燃料泵来自都灵。本国的名字写在“一八七一号”的铭牌上。"
 krcw_ti_the_container_revolution:0 "集装箱革命"
 krcw_ti_the_container_revolution_desc:0 "鹿特丹与哥本哈根的码头工会本来该抵制集装箱——它消灭了一半的装卸工。工会反而接管了它：转岗培训、提前退休、剩下的人加薪。"
 krcw_ti_the_generation_of_sixty_eight:0 "回应六八年运动"
 krcw_ti_the_generation_of_sixty_eight_desc:0 "一九五四年的春天，学生与青年工人占领了大学与几家工厂。他们不要求推翻公社——他们要求公社兑现自己的章程。本国政府必须选择怎样回答。"
 krcw_ti_a_federation_that_lasted:0 "巩固联邦"
 krcw_ti_a_federation_that_lasted_desc:0 "冷战的压力没有让国际散成一堆国家，本国与各成员的防务、计划和清算已经绑在一起。代表大会宣布，任何成员遭到进攻都视为对本国的进攻。"
 krcw_tim_1_t:0 "代表大会上的三派"
 krcw_tim_1_d:0 "代表大会的大厅里坐着三派人。一派说小国的安全只能靠国际，应当做最忠诚的成员；一派说革命是本国工人赢的，主权不该交给巴黎；第三派说前两派都在争谁来当官，真正的问题是官太多了。\n\n主席台必须让大会作出选择。"
 krcw_tim_1.a:0 "做国际最可靠的支柱"
 krcw_tim_1.b:0 "争取本国的自主权"
 krcw_tim_1.c:0 "把权力还给车间"
 krcw_tim_3_t:0 "否决权的表决"
 krcw_tim_3_d:0 "本国的修章提案摆在代表大会面前：涉及成员国领土与军队的决议须经该成员国同意。法国与不列颠的代表团反对，指出这会让国际在危机中瘫痪。可是其他八个小成员的代表都没有举手反对。\n\n表决结果出来之前，本国还有一次机会决定要把这件事推到多远。"
 krcw_tim_3.a:0 "坚持到表决"
 krcw_tim_3.b:0 "换成一份不具约束力的决议"
 krcw_tim_5_t:0 "国防预算的两个方案"
 krcw_tim_5_d:0 "总参谋部和工会联合会各交上一份国防预算。参谋部的方案要一支五年服役的常备军，装备统一，能编入国际的联合指挥；工会的方案要把钱花在民兵的武器库、街区的防空洞和预备役训练上。\n\n两份方案的总额一样，用途完全不同。"
 krcw_tim_5.a:0 "采纳参谋部方案"
 krcw_tim_5.b:0 "采纳工会方案"
 krcw_tim_7_t:0 "贝尔法斯特的造船工人"
 krcw_tim_7_d:0 "北爱尔兰归了都柏林两年，哈兰德与沃尔夫船厂的工会仍然把会费寄往格拉斯哥。船厂的工人多半是新教徒，他们并不反对工团主义——他们反对的是被都柏林管。\n\n爱尔兰政府可以强行接管工会，也可以给贝尔法斯特一个特殊地位。"
 krcw_tim_7.a:0 "给贝尔法斯特特殊地位"
 krcw_tim_7.b:0 "强行接管工会"
 krcw_tim_9_t:0 "那块岩石的答复"
 krcw_tim_9_d:0 "不列颠联邦的回信很客气：直布罗陀的工人在一九二七年自己投票加入了不列颠联邦，联邦不能违背他们的意愿把他们交出去。伊比利亚的代表指出，投票的时候岩石上驻着一个旅的英军。\n\n这件事可以继续争，也可以换个办法。"
 krcw_tim_9.a:0 "提交国际仲裁"
 krcw_tim_9.b:0 "在代表大会上年年提出"
 krcw_tim_11_t:0 "一九五四年春"
 krcw_tim_11_d:0 "大学被占领了，三家工厂的青年工人跟着停工。占领者的传单上写的不是打倒公社，而是章程第一条的原文：“一切权力属于生产者的集会。”他们说这句话已经二十年没有被执行过。\n\n警察在街口等命令。"
 krcw_tim_11.a:0 "接受他们的要求，改革章程"
 krcw_tim_11.b:0 "谈判，但不改章程"
 krcw_tim_11.c:0 "清场"
 krcw_tim_13_t:0 "专长的代价"
 krcw_tim_13_d:0 "跨国计划给本国分配了一个专长，也就等于告诉本国其他产业不必发展。计划委员会的年轻经济学家提出警告：如果配额有一天取消，本国将只剩下一个行业。\n\n书记处的答复是：配额不会取消。"
 krcw_tim_13.a:0 "接受分工，做到最好"
 krcw_tim_13.b:0 "偷偷发展第二产业"
 krcw_tim_15_t:0 "七十二小时之后"
 krcw_tim_15_d:0 "今年的联合演习第一次让本国的参谋部看到了完整的作战计划。计划的第四页写着：若前线在七十二小时内崩溃，国际的装甲师将在本国境内的第二道防线集结。\n\n也就是说，本国的一半国土在计划里是战场。"
 krcw_tim_15.a:0 "要求修改计划"
 krcw_tim_15.b:0 "接受，但要求更多装备"
 krcw_ti_congress_cat:0 "代表大会的政治"
 krcw_ti_congress_cat_desc:0 "在国际的代表大会与书记处走廊里为本国争取位置。"
 krcw_ti_lobby_the_secretariat:0 "游说书记处"
 krcw_ti_lobby_the_secretariat_desc:0 "本国的常驻代表在走廊里工作一个月，换来配额表上的一行改动。"
 krcw_ti_table_a_resolution:0 "提出决议案"
 krcw_ti_table_a_resolution_desc:0 "在代表大会上提出一项决议。小国的决议很少通过，但提出过的事情会被记住。"
 krcw_ti_small_members_caucus:0 "小国党团会议"
 krcw_ti_small_members_caucus_desc:0 "八个小成员在表决前一晚开一次非正式会议。大国从不承认这个会议存在。"
 krcw_ti_host_the_congress:0 "主办代表大会"
 krcw_ti_host_the_congress_desc:0 "代表大会轮到本国主办。一个星期里，本国的首都是国际的首都。"
 krcw_ti_specialisation_cat:0 "产业专长"
 krcw_ti_specialisation_cat_desc:0 "在跨国计划里经营本国分到的那一栏。"
 krcw_ti_bid_for_a_contract:0 "争取联合会订单"
 krcw_ti_bid_for_a_contract_desc:0 "产业联合会的下一批订单在里昂分配。本国的代表带着价格表和一份交货保证去了。"
 krcw_ti_request_machine_tools:0 "申请机床配额"
 krcw_ti_request_machine_tools_desc:0 "里昂与谢菲尔德的机床要排两年的队。忠诚的成员排在前面。"
 krcw_ti_second_industry:0 "发展第二产业"
 krcw_ti_second_industry_desc:0 "计划没有给本国这一栏，但计划也没有明文禁止。"
 krcw_ti_send_workers_abroad:0 "派遣工人"
 krcw_ti_send_workers_abroad_desc:0 "劳动共同市场允许本国的工人去别国干活，他们寄回来的钱进了本国的清算账户。"
 krcw_ti_border_cat:0 "边界的事务"
 krcw_ti_border_cat_desc:0 "阿尔斯特、亚得里亚海、直布罗陀、柏林、五大湖——国际内部与边缘的旧账。"
 krcw_ti_reinforce_the_frontier:0 "加强边防"
 krcw_ti_reinforce_the_frontier_desc:0 "在争议的边界上多派一个营，多修一段混凝土。对面会看见，这正是目的。"
 krcw_ti_quiet_talks:0 "安静的会谈"
 krcw_ti_quiet_talks_desc:0 "不在代表大会上吵，而在日内瓦的一间小会议室里谈。这样双方都不必让步给对方看。"
 krcw_ti_refer_to_arbitration:0 "提交仲裁法庭"
 krcw_ti_refer_to_arbitration_desc:0 "把争执交给日内瓦的仲裁法庭。判决未必对本国有利，但它把争执从军队手里拿走了。"
 krcw_ti_fund_the_kin_across:0 "资助对面的同胞"
 krcw_ti_fund_the_kin_across_desc:0 "边界那一侧有说本国语言的人。给他们的学校、报纸和合唱团寄钱——这不违反任何条约。"
 ITA_krcw_matteotti:0 "马泰奥蒂"
 ITA_krcw_matteotti_desc:0 "被法西斯杀害的社会党人的儿子，在法国长大，一九四三年随国际的军队回到意大利。他主持了都灵与米兰工厂委员会的重建，主张意大利社会共和国应当是国际里最讲程序的成员：一切都要投票，包括战争。"
 ITA_krcw_parri:0 "费鲁乔·帕里"
 ITA_krcw_parri_desc:0 "游击战争的组织者，从阿尔卑斯山打到波河平原。他不相信仲裁法庭那一套：的里雅斯特与伊斯特拉的意大利人不该等日内瓦的判决。他的支持者在军队里，他的反对者说他会把国际拖进一场为了几个港口的战争。"
 SPR_krcw_garcia_oliver:0 "胡安·加西亚·奥利韦尔"
 SPR_krcw_garcia_oliver_desc:0 "全国劳工联合会的老战士，一九三六年七月在巴塞罗那街头指挥过工人纵队。他反对一切中央机构——包括巴黎的书记处和马德里的联邦政府。伊比利亚的公社运动把他当作自己的代言人，联邦的部长们则希望他留在巴塞罗那。"
 IRE_krcw_larkin:0 "小吉姆·拉金"
 IRE_krcw_larkin_desc:0 "运输工人工会的书记，老拉金的儿子。他继承了父亲的组织，也继承了父亲与贝尔法斯特造船工人的旧仇。他主张爱尔兰应当把北方的工会强行并入都柏林的联合会——这是国际内部最不受欢迎的主张之一。"
 NOR_krcw_tranmael_heir:0 "哈孔·利"
 NOR_krcw_tranmael_heir_desc:0 "特兰梅尔之后挪威工会联合会的实际管理者。他是个会计式的革命者：算得清每一千瓦时电、每一吨铝的成本，也算得清一支挪威师在易北河能撑多久。他主张挪威做国际最可靠的成员，因为挪威离俄罗斯的北方舰队只有一道峡湾。"
 HOL_krcw_sneevliet:0 "亨克·斯内夫利特"
 HOL_krcw_sneevliet_desc:0 "荷兰革命社会主义者，早年在爪哇组织过铁路工会，一九二六年被殖民当局驱逐。一九四六年荷兰放弃东印度时，他是政府里唯一主张“立刻、无条件、不谈判”的人。他现在要求把同样的原则用在国际内部：不该有首都，只该有联合会。"
 CAN_krcw_woodsworth:0 "J·S·伍兹沃思"
 CAN_krcw_woodsworth_desc:0 "温尼伯总罢工的老人，加拿大工团共和国里少数主张和平主义的领袖。他反对在五大湖驻军，反对向密西西比河东岸运送武器，也反对任何针对流亡王室的报复。他的对手说他天真，他的回答是加拿大打不起任何一场战争。"
 CAN_krcw_buck_hard:0 "蒂姆·巴克（强硬派）"
 CAN_krcw_buck_hard_desc:0 "加拿大工团共和国的创立者之一，也是主张把革命推过边界的那一派。他相信朗的美国迟早会来，与其等着，不如现在就武装密西西比河东岸的工团、在五大湖上造炮艇、把加拿大变成北美革命的军械库。"
 krcw_ma_minor_tree:0 "krcw_ma_minor_tree"
 krcw_ma_member_of_the_accord:0 "履行协定义务"
 krcw_ma_member_of_the_accord_desc:0 "莫斯科协定不是一个意识形态的国际。匈牙利的地主、土耳其的将军和波斯的国王没有共同的信条，只有共同的敌人——以及同一个供应坦克的人。"
 krcw_ma_the_officers_republic:0 "由上校组阁"
 krcw_ma_the_officers_republic_desc:0 "选举暂停，议会休会，内阁由上校们组成。理由永远是同一个：紧急状态尚未结束。"
 krcw_ma_a_civilian_cabinet:0 "文官内阁"
 krcw_ma_a_civilian_cabinet_desc:0 "上校们回到了兵营，律师和教授们回到了部里。莫斯科不太高兴，但也没有反对——一个稳定的盟友比一个顺从的盟友更有用。"
 krcw_ma_the_belated_land_reform:0 "迟来的土地改革"
 krcw_ma_the_belated_land_reform_desc:0 "边界那一侧的广播每天都在提醒农民：他们的地主还在。把大庄园分掉，广播就没什么可说的了。"
 krcw_ma_roads_to_the_frontier:0 "修建边境公路"
 krcw_ma_roads_to_the_frontier_desc:0 "俄罗斯的工兵勘测路线，本地的工人铺路面。这些公路和平时期运粮食，战争时期运坦克。"
 krcw_ma_the_national_bank:0 "国家银行"
 krcw_ma_the_national_bank_desc:0 "卢布计价的贷款利率很高，而本国的货币在国际市场上一文不值。一家像样的国家银行至少能让预算按时公布。"
 krcw_ma_arms_from_moscow:0 "俄罗斯军援"
 krcw_ma_arms_from_moscow_desc:0 "莫斯科的军工托拉斯把过时的型号连图纸一起卖给协定成员，价格低廉，条件是不得转售，也不得自行改进。"
 krcw_ma_our_own_arsenal:0 "改进俄制图纸"
 krcw_ma_our_own_arsenal_desc:0 "“不得自行改进”——这一条从来没有人真正遵守过。本地的兵工厂把俄罗斯的图纸拆开，再按自己的需要装回去。"
 krcw_ma_fortify_the_frontier:0 "加固边境"
 krcw_ma_fortify_the_frontier_desc:0 "缓冲区的用途是被打烂——除非它足够硬。边境上的混凝土工事一年年加厚。"
 krcw_ma_mountain_and_steppe:0 "山地与草原"
 krcw_ma_mountain_and_steppe_desc:0 "喀尔巴阡山、巴尔干山、兴都库什与蒙古高原——协定的成员国大多守着难走的地形。训练适合它们的部队。"
 krcw_ma_the_front_state:0 "前线国家"
 krcw_ma_the_front_state_desc:0 "如果战争来临，第一枪将在我们的土地上打响。协定的联合参谋部终于同意了我们的要求：本国的师由本国的将军指挥。"
 krcw_ma_fidelity_to_moscow:0 "忠于莫斯科"
 krcw_ma_fidelity_to_moscow_desc:0 "协定的成员中，有的人只在需要坦克的时候才想起莫斯科。我们不一样——至少我们要让莫斯科这样相信。"
 krcw_ma_an_independent_line:0 "坚持本国的外交自主"
 krcw_ma_an_independent_line_desc:0 "政府宣布，本国的对外政策首先服从本国的利益，协定的决议只在与之一致时执行。莫斯科的大使提出抗议。其他成员国在观望。"
 krcw_ma_a_regional_pact:0 "地区公约"
 krcw_ma_a_regional_pact_desc:0 "协定的中小成员之间签订了一份自己的协议：共享铁路、协调防空，以及——没写在纸上的——在莫斯科面前互相支持。"
 krcw_ma_a_neutral_window:0 "组建边境保安警察"
 krcw_ma_a_neutral_window_desc:0 "地区公约的成员共享边境上截获的情报，各自组建一支专门对付越境特工和走私电台的保安警察。经费由内政部承担，军队不满意自己的边防任务被分走。"
 krcw_yn_friend_of_paris:0 "巴黎的朋友"
 krcw_yn_friend_of_moscow:0 "莫斯科的朋友"
 krcw_yn_young_nations:0 "青年国家的团结"
 krcw_yn_colonial_legacy:0 "殖民地的遗产"
 krcw_yn_colonial_legacy_desc:0 "旧宗主国走了，留下的是为出口原料而修的铁路、只懂得服从的文官、几所教会学校和一支由外国人训练的军队。独立只是开始。"
 krcw_yn_nonaligned:0 "不结盟"
 krcw_yn_nonaligned_desc:0 "我们不属于巴黎，也不属于莫斯科。两个集团都想要我们的港口、矿山和联合会大会上的一票——而我们两边都做生意。"
 krcw_yn_development_plan:0 "国家发展计划"
 krcw_yn_development_plan_desc:0 "五年一期的发展计划：公路、电站、学校和第一批本国工厂。钱不够，人也不够，但每一个村子都知道计划里有自己。"
 krcw_nonaligned_tree:0 "krcw_nonaligned_tree"
 krcw_yn_between_the_blocs:0 "宣布独立外交"
 krcw_yn_between_the_blocs_desc:0 "世界大战摧毁了柏林、阿尔及尔与君士坦丁堡的帝国，却没有给我们留下和平：巴黎与莫斯科正在瓜分它们的遗产。我们的国家小，但我们的选择是自己的。"
 krcw_yn_the_founding_charter:0 "建国宪章"
 krcw_yn_the_founding_charter_desc:0 "宪法由制宪会议写成，由全民公决通过。它许诺的东西比国家能兑现的多，但它给了新政府第一份合法性。"
 krcw_yn_land_to_the_tiller:0 "耕者有其田"
 krcw_yn_land_to_the_tiller_desc:0 "旧宗主国的种植园、外国公司的租地与大地主的庄园被收归国有，再分给耕种它们的人。"
 krcw_yn_the_literacy_campaign:0 "扫盲运动"
 krcw_yn_the_literacy_campaign_desc:0 "每个识字的人教一个不识字的人。学生、教士和退伍军人被派往乡村，课本是用本国语言新印的。"
 krcw_yn_our_own_civil_service:0 "开办文官学校"
 krcw_yn_our_own_civil_service_desc:0 "最后一批外国顾问的合同到期了。新的文官学校每年毕业数百名本国官员——他们也许不如前任熟练，但他们知道为谁工作。"
 krcw_yn_a_national_culture:0 "民族文化"
 krcw_yn_a_national_culture_desc:0 "国家电台、国家剧院、国家足球队。一个新的民族不仅需要边界，也需要自己的歌。"
 krcw_yn_the_development_plan:0 "国家发展计划"
 krcw_yn_the_development_plan_desc:0 "第一个五年计划。它的每一页都写着同一个问题：钱从哪里来？"
 krcw_yn_roads_to_the_interior:0 "修建内地公路"
 krcw_yn_roads_to_the_interior_desc:0 "殖民时代的铁路只通向港口。新的公路要把内地的村庄和首都连起来。"
 krcw_yn_our_resources_our_own:0 "将外资矿山收归国有"
 krcw_yn_our_resources_our_own_desc:0 "矿山、油田与种植园的外国股份被收归国有。赔偿款会分期付清——如果国家付得起的话。"
 krcw_yn_credit_from_paris:0 "接受巴黎清算联盟贷款"
 krcw_yn_credit_from_paris_desc:0 "国际的清算联盟愿意提供低息贷款与技术员，条件是新工厂按照联合会的方式管理。"
 krcw_yn_loans_from_moscow:0 "接受莫斯科贷款"
 krcw_yn_loans_from_moscow_desc:0 "俄罗斯的贷款附带军火、军事顾问和一座兵工厂。莫斯科不在乎我们怎么管工厂，只在乎我们在联合会大会上怎么投票。"
 krcw_yn_self_reliance:0 "自力更生"
 krcw_yn_self_reliance_desc:0 "不借巴黎的钱，也不借莫斯科的钱。发展会慢一些，但没有人能用债务来勒索我们。"
 krcw_yn_the_great_dam:0 "大坝"
 krcw_yn_the_great_dam_desc:0 "一座横跨大河的水坝：电力给城市，灌溉给田野，还有一张印在每一张钞票上的照片。"
 krcw_yn_the_national_university:0 "国立大学"
 krcw_yn_the_national_university_desc:0 "第一所国立大学开学了。工程系和医学系的招生名额永远不够。"
 krcw_yn_a_national_army:0 "国民军"
 krcw_yn_a_national_army_desc:0 "殖民军的营房换上了新国旗，士兵们换上了新军装。但军官团里还有太多人记得旧宗主国的操典。"
 krcw_yn_the_officer_academy:0 "军官学校"
 krcw_yn_the_officer_academy_desc:0 "本国的军官学校取代了外国教官。第一批毕业生宣誓效忠宪法——但愿他们记住这句誓言。"
 krcw_yn_guard_the_borders:0 "守卫边界"
 krcw_yn_guard_the_borders_desc:0 "殖民者在地图上用直尺画下的边界，如今要由我们自己来守。"
 krcw_yn_a_small_air_force:0 "组建空军"
 krcw_yn_a_small_air_force_desc:0 "几十架买来的旧飞机和一座像样的机场。它不能打赢一场战争，但能让邻国三思。"
 krcw_yn_seek_paris:0 "靠近巴黎"
 krcw_yn_seek_paris_desc:0 "国际帮助过印度尼西亚与突尼斯独立，它的报纸称我们为“兄弟人民”。也许兄弟可以互相帮助。"
 krcw_yn_true_nonalignment:0 "坚持不结盟"
 krcw_yn_true_nonalignment_desc:0 "两个集团都说自己是和平的保卫者。我们的回答是：请你们都离远一点。"
 krcw_yn_seek_moscow:0 "靠近莫斯科"
 krcw_yn_seek_moscow_desc:0 "萨文科夫的俄罗斯不输出革命，只输出坦克和秩序。对一个害怕自己街头的政府来说，这就够了。"
 krcw_yn_join_the_internationale:0 "加入第三国际"
 krcw_yn_join_the_internationale_desc:0 "我们在巴黎的联合会代表大会上领到了一个座位。从今以后，任何对我们的进攻都是对整个国际的进攻。"
 krcw_yn_the_conference_of_young_nations:0 "青年国家会议"
 krcw_yn_the_conference_of_young_nations_desc:0 "亚洲与非洲的新国家第一次坐到了同一张桌子旁。宣言很长，行动计划很短，但它告诉了巴黎和莫斯科：世界不只有两极。"
 krcw_yn_join_the_accord:0 "加入莫斯科协定"
 krcw_yn_join_the_accord_desc:0 "俄罗斯的军事代表团带着合同来了：军火、顾问与一份共同防御条约。"
 krcw_yn_the_peace_zone:0 "和平地带"
 krcw_yn_the_peace_zone_desc:0 "青年国家宣布自己的领土为无核区、无外国军事基地区。两个集团都不喜欢这份宣言，却都不愿第一个违反它。"
 krcw_ddr_monarchist_sympathy:0 "君主派的同情"
 krcw_ddr_kaiser_shadow:0 "流亡皇帝的阴影"
 krcw_ddr_kaiser_shadow_desc:0 "威廉三世在斯德哥尔摩的流亡朝廷每周都向柏林发信。"
 krcw_ddr_reparations_unrest:0 "赔款与骚乱"
 krcw_ddr_reparations_unrest_desc:0 "工厂的机器被拆走运往俄国，工人的配给一减再减。"
 krcw_ddr_1_t:0 "斯德哥尔摩来信"
 krcw_ddr_1_d:0 "流亡的德皇威廉三世又一次从斯德哥尔摩写信给国民议会。信很短：\n\n\"施莱歇尔将军曾向我父亲效忠。《柏林条约》是在枪口下签的，不算数。德意志需要的不是将军的共和国，而是合法的君主。我已准备好回国。\"\n\n信的副本已经送到了莫斯科。"
 krcw_ddr_1.a:0 "君主派还有市场"
 krcw_ddr_2_t:0 "施莱歇尔的继承人"
 krcw_ddr_2_d:0 "施莱歇尔已经六十八岁了，国民议会开始讨论继承问题。宪法规定最高统帅由议会选举产生，但从来没有人真的选过——1944年是施莱歇尔的坦克让议会投票的。\n\n现在议会里有三派：效忠施莱歇尔的将军们、想恢复君主制的保守派，以及一小群想让德意志变成真正的共和国的自由派。"
 krcw_ddr_2.a:0 "维持现状"
 krcw_ddr_2.b:0 "向君主派示好"
 krcw_ddr_2.c:0 "向自由派开放"
 krcw_ddr_berlin_cat:0 "柏林问题"
 krcw_ddr_berlin_cat_desc:0 "西柏林是国际的飞地，铁丝网把它围在中间。"
 krcw_ddr_issue_permits:0 "发放探亲通行证"
 krcw_ddr_issue_permits_desc:0 "允许西柏林人凭通行证探望东区的亲属。"
 krcw_ddr_tighten_checkpoints:0 "收紧检查站"
 krcw_ddr_tighten_checkpoints_desc:0 "加强边境管制，减少人员流动。"
 krcw_ddr_3_t:0 "莱比锡的罢工"
 krcw_ddr_3_d:0 "莱比锡的工人罢工了。起因是工厂又被拆走了一批机器，配给又减少了。罢工者喊的口号是\"我们要面包，不要赔款\"。\n\n施莱歇尔召开紧急内阁会议。有人建议出动军队，也有人建议向莫斯科请求减免赔款。"
 krcw_ddr_3.a:0 "镇压"
 krcw_ddr_3.b:0 "谈判"
 krcw_ddr_3.c:0 "请莫斯科减免"
 krcw_ddr_4_t:0 "莫斯科的回应"
 krcw_ddr_4_d:0 "俄罗斯驻柏林大使转交了莫斯科的回信。信很短：\n\n\"《柏林条约》规定的赔款期限是二十年。条约是神圣的。如果德意志工人觉得太苦，请他们回忆一下1941年到1944年俄罗斯工人是怎么过的。\"\n\n内阁沉默了。"
 krcw_ddr_4.a:0 "别无选择"
 krcw_ddr_4.b:0 "把回信登在报纸上"
 krcw_ddr_5_t:0 "莫斯科的让步"
 krcw_ddr_5_d:0 "俄罗斯驻柏林大使带来的不是回信，而是一份议定书草案：未来三年的拆迁机器减少一半，莱比锡与开姆尼茨的四家工厂从拆迁名单上删除。作为交换，东德陆军的两个师划归协定联合参谋部直接指挥。\n\n内阁讨论了一个下午。没有人反对减免，争论全在那两个师上。"
 krcw_ddr_5.a:0 "签字：先让工厂开工"
 krcw_ddr_5.b:0 "接受减免，把师的问题拖到下次"
 krcw_ddr_moscow_decides_tt:0 "莫斯科是否减免，取决于它对柏林的看法和莫斯科由谁执政。"
 krcw_ddr_10_t:0 "柏林的探亲通行证"
 krcw_ddr_10_d:0 "东德开始发放一日探亲通行证，允许西柏林人探望东区的亲属。东柏林的报纸把它当作人道姿态来宣传，东德保卫部门则借申请表登记每个访客的住址和工作单位。\n\n西柏林的警察局长要求在过境点询问返回的访客。"
 krcw_ddr_10.a:0 "让家人团聚"
 krcw_ddr_10.b:0 "在过境点询问返回的访客"
 krcw_eng_30_t:0 "北爱尔兰的归还"
 krcw_eng_30_d:0 "1947年《都柏林协定》把北爱尔兰交还给了爱尔兰，作为爱尔兰加入第三国际的条件之一。如今格拉斯哥的工人突然发现：原来新教徒是可以\"出卖\"的。那苏格兰的工人呢？"
 krcw_eng_30.a:0 "这是必要的妥协"
 krcw_eng_30.b:0 "我们不该放弃同志"
 krcw_eng_31_t:0 "格拉斯哥的不满"
 krcw_eng_31_d:0 "格拉斯哥的工会大会通过了一项决议：要求联邦议会保证苏格兰的自治权，并\"永远不会像对待北爱尔兰那样对待苏格兰\"。\n\n决议没有提\"独立\"二字，但每个人都听出了潜台词。"
 krcw_eng_31.a:0 "重申苏格兰的地位"
 krcw_eng_31.b:0 "警告格拉斯哥"
 krcw_ita_1_t:0 "诺利在罗马"
 krcw_ita_1_d:0 "1943年意大利社会共和国渡海推翻了索古国王，扶上了范·诺利。一年后南斯拉夫和希腊的军政府把意大利人赶回海对岸，索古在俄国人的保护下复位，诺利流亡罗马。阿尔巴尼亚流亡者委员会请求罗马支持山区的反索古游击队，劳动总联合会的领导层担心这会让莫斯科协定的军队开到奥特朗托海峡对岸。"
 krcw_ita_1.a:0 "只给流亡者庇护，不给武器"
 krcw_ita_1.b:0 "暗中武装流亡者"
 krcw_ita_2_t:0 "亚得里亚海的对岸"
 krcw_ita_2_d:0 "南斯拉夫军政府控制着达尔马提亚海岸，那里曾经是威尼斯共和国的领地，一九四四年把意大利人赶出阿尔巴尼亚的也是它。罗马的一些人开始说：达尔马提亚和阿尔巴尼亚都应该是意大利的。\n\n迪·维托里奥在工会大会上回应：第三国际不靠征服扩张。"
 krcw_ita_2.a:0 "我们不是法西斯"
 krcw_ita_2.b:0 "但达尔马提亚是意大利的"
 krcw_wgr_1_t:0 "易北河的前线"
 krcw_wgr_1_d:0 "易北河是第三国际和莫斯科协约的分界线，西德工团主义共和国的边防军每天都在河对岸看到俄国的坦克。台尔曼在汉堡的演讲中说：易北河不是分裂线，而是保卫线——我们守护着工人革命的西方堡垒。"
 krcw_wgr_1.a:0 "坚守易北河"
 krcw_wgr_1.b:0 "我们不想和俄国打仗"
 krcw_wgr_2_t:0 "西柏林的飞地"
 krcw_wgr_2_d:0 "西柏林是工团主义的飞地，被铁丝网和检查站围在莫斯科协约的腹地。每次柏林危机都让汉堡的人捏一把汗：俄国会不会真的切断通道？\n\n台尔曼说：只要西柏林的工人还举着红旗，我们就不会放弃它。"
 krcw_wgr_2.a:0 "西柏林是不可放弃的"
 krcw_wgr_2.b:0 "我们应该寻求妥协"
 krcw_wgr_3_t:0 "奥地利问题"
 krcw_wgr_3_d:0 "奥地利西部是萨尔茨堡的社会主义共和国，第三国际的成员；维也纳、下奥地利和布尔根兰在俄国人手里。共和国大会里有人提出：德意志工人应该团结，为什么不让奥地利加入西德？\n\n台尔曼的回答很谨慎：奥地利人自己还没决定要不要统一，而且莫斯科不会允许维也纳也跟着过来。"
 krcw_wgr_3.a:0 "先等奥地利人自己决定"
 krcw_wgr_3.b:0 "我们应该推动统一"
 krcw_can_1_t:0 "澳大利亚的王位"
 krcw_can_1_d:0 "协约国流亡到澳大利亚已经十多年了，现在澳大利亚的孟席斯开始提出：既然国王住在堪培拉，为什么加拿大还要听从澳大利亚的命令？\n\n渥太华的保守党议员反驳：协约国是一个整体，国王的驻地不代表宗主权的转移。"
 krcw_can_1.a:0 "协约国是平等的联盟"
 krcw_can_1.b:0 "加拿大才是协约国的核心"
 krcw_can_2_t:0 "魁北克的不满"
 krcw_can_2_d:0 "魁北克的法语人口从来没有真正认同过协约国的事业——他们认为这是英国人的战争。现在魁北克的民族主义者开始提出：如果联合工团能建立自己的国家，为什么魁北克不能？\n\n渥太华的回应是加强法语教育和文化自治，但这能满足魁北克吗？"
 krcw_can_2.a:0 "加强魁北克的自治"
 krcw_can_2.b:0 "重申加拿大的统一"
 krcw_can_3_t:0 "支援联合工团"
 krcw_can_3_d:0 "加拿大一直在向美国东部的联合工团提供物资——主要是粮食和工业品。保守党说这是投资未来的盟友，但自由党质疑：我们为什么要帮助社会主义者？"
 krcw_can_3.a:0 "继续支援"
 krcw_can_3.b:0 "减少支援"
 krcw_jap_1_t:0 "复仇主义的呼声"
 krcw_jap_1_d:0 "日本在第二次世界大战中失去了满洲和朝鲜，但保住了台湾、密克罗尼西亚和千岛群岛。现在议会里的强硬派开始提出：为什么我们不收复满洲？\n\n岸信介的回答很现实：因为俄国不会允许，而我们还没准备好和俄国开战。"
 krcw_jap_1.a:0 "先积蓄力量"
 krcw_jap_1.b:0 "放弃复仇主义"
 krcw_jap_2_t:0 "民主化的压力"
 krcw_jap_2_d:0 "日本的自由派和社会党开始提出：战争已经结束了，为什么我们还要维持军国主义的体制？议会应该有真正的权力，而不是只为军部盖章。\n\n岸信介的立场很明确：日本需要的是强大的政府，而不是软弱的议会政治。"
 krcw_jap_2.a:0 "维持现状"
 krcw_jap_2.b:0 "有限的民主化"
 krcw_jap_3_t:0 "台湾的治理"
 krcw_jap_3_d:0 "台湾在日本统治下已经五十年了，台湾人中有人想要独立，也有人想回归中国，还有人接受日本统治但要求更多自治权。\n\n岸信介的政策是\"皇民化\"——让台湾人变成日本人。但这能成功吗？"
 krcw_jap_3.a:0 "继续皇民化"
 krcw_jap_3.b:0 "给台湾更多自治权"
 krcw_jap_4_t:0 "密克罗尼西亚的托管地"
 krcw_jap_4_d:0 "日本在战后保住了密克罗尼西亚的托管地——马绍尔群岛、加罗林群岛和马里亚纳群岛。这些岛屿在战略上很重要，但经济上是负担。\n\n议会里有人提出：我们为什么要为这些无用的岛屿花钱？"
 krcw_jap_4.a:0 "这些岛屿是战略要地"
 krcw_jap_4.b:0 "减少在岛屿上的投入"
 krcw_tur_1_t:0 "海峡的主权"
 krcw_tur_1_d:0 "博斯普鲁斯海峡和达达尼尔海峡是俄国黑海舰队通往地中海的唯一通道。莫斯科一直要求土耳其保证海峡的自由通行，但安卡拉的军政府认为：海峡是土耳其的领土，我们有权关闭它。"
 krcw_tur_1.a:0 "坚持土耳其的主权"
 krcw_tur_1.b:0 "向莫斯科妥协"
 krcw_tur_2_t:0 "失去的阿拉伯行省"
 krcw_tur_2_d:0 "土耳其在第一次世界大战中失去了叙利亚、伊拉克和阿拉伯半岛。现在军政府里的泛突厥主义者开始提出：我们应该向东扩张，而不是向南——中亚的突厥人才是我们的兄弟。\n\n恰克马克元帅的回答很谨慎：我们没有力量对抗俄国。"
 krcw_tur_2.a:0 "放弃阿拉伯梦想"
 krcw_tur_2.b:0 "我们总有一天会回去"
 krcw_gre_1_t:0 "平都斯山的游击队"
 krcw_gre_1_d:0 "希腊内战在1945年结束，但平都斯山区还有民主军游击队的残部。他们藏在伊庇鲁斯的山里，弹药从海上运来，偶尔袭击政府军的哨所。\n\n帕帕戈斯元帅说：只要伊庇鲁斯的海岸还开着，游击队就不会消失。"
 krcw_gre_1.a:0 "继续清剿"
 krcw_gre_1.b:0 "提议大赦"
 krcw_gre_2_t:0 "奥特朗托的夜船"
 krcw_gre_2_d:0 "游击队的弹药来自意大利的港口：渔船夜里从布林迪西和奥特朗托出发，在伊庇鲁斯的海湾卸货。雅典要求罗马截住这些船，罗马的答复是那是私人的船，政府没有参与。"
 krcw_gre_2.a:0 "向罗马施压"
 krcw_gre_2.b:0 "接受现状"
 krcw_gre_10_t:0 "希腊的抗议"
 krcw_gre_10_d:0 "雅典向罗马正式抗议：意大利的港口在为希腊游击队运送弹药，这是对希腊主权的侵犯。\n\n迪·维托里奥的回应：意大利管不了每一条渔船。"
 krcw_gre_10.a:0 "那是渔民的事"
 krcw_yug_1_t:0 "军政府的合法性"
 krcw_yug_1_d:0 "南斯拉夫军政府在1945年推翻了保罗摄政王，西莫维奇将军成为国家元首。军政府声称自己是临时的，但七年过去了，还是没有恢复议会政治的迹象。\n\n贝尔格莱德的知识分子开始质疑：我们什么时候才能有真正的选举？"
 krcw_yug_1.a:0 "维持军政府"
 krcw_yug_1.b:0 "承诺恢复议会"
 krcw_yug_2_t:0 "马其顿问题"
 krcw_yug_2_d:0 "马其顿在南斯拉夫、保加利亚和希腊之间一直是争议地区。现在贝尔格莱德的强硬派开始提出：马其顿是南斯拉夫的，我们应该在国内承认马其顿民族。\n\n但这会激怒保加利亚和希腊，而它们都是莫斯科协约的成员。"
 krcw_yug_2.a:0 "承认马其顿民族"
 krcw_yug_2.b:0 "维持现状"
 krcw_ent_tree:0 "krcw_ent_tree"
 krcw_ent_dominion_partner:0 "自治领伙伴"
 krcw_ent_the_old_flag:0 "旧日的旗帜"
 krcw_ent_pacific_understanding:0 "太平洋谅解"
 krcw_ent_colonial_grievance:0 "殖民的旧怨"
 krcw_ent_the_court_in_melbourne:0 "墨尔本的宫廷"
 krcw_ent_the_court_in_melbourne_desc:0 "国王住在墨尔本郊外一座借来的宅子里，御前会议在市政厅的二楼开会。流亡朝廷给了澳大利亚一个它从未要求过的东西：整个旧世界的合法性。它也给了澳大利亚一笔账单——供养一个没有国土的王室，以及一群仍然自称大臣的老人。"
 krcw_ent_dominion_of_our_own:0 "我们自己的自治领"
 krcw_ent_dominion_of_our_own_desc:0 "御前会议搬到了堪培拉，但决定预算的是澳大利亚的议会。国王仍然是国王，只是他现在是澳大利亚的国王，而不是一个等着回伦敦的流亡者。三十年来第一次，这个国家为自己而存在。"
 krcw_ent_the_restoration_project:0 "复国计划"
 krcw_ent_the_restoration_project_desc:0 "参谋部的保险柜里有一份计划：一支远征军、一次登陆、一份由王室署名的复国宣言。将军们知道它办不到，大臣们知道将军们知道，可是没有人敢提议把它烧掉——因为烧掉它，就等于承认不列颠已经不是他们的了。"
 krcw_ent_the_australian_republic:0 "澳大利亚共和国"
 krcw_ent_the_australian_republic_desc:0 "公投以微弱多数通过了。王室体面地搬去了新西兰，或者搬回了它来的地方——报纸对此语焉不详。澳大利亚成了一个共和国，一个没有历史包袱、也没有历史光环的太平洋国家。"
 krcw_ent_the_wool_cheque:0 "羊毛的支票"
 krcw_ent_the_wool_cheque_desc:0 "羊毛、小麦、铁矿砂——澳新卖的是别人做衣服和造机器的原料。两大集团都需要它，这是堪培拉唯一的筹码，也是它最大的软弱：一个卖原料的国家，永远由买家决定它的价格。"
 krcw_ent_southern_industry:0 "南方的工业"
 krcw_ent_southern_industry_desc:0 "如果两大集团都可能封锁南太平洋，那么钢、机床与弹药就必须在纽卡斯尔和惠阳自己造出来。这项计划昂贵、缓慢，而且第一次让澳大利亚不再只是一个牧场。"
 krcw_ent_the_island_mandates:0 "岛屿托管地"
 krcw_ent_the_island_mandates_desc:0 "斐济、所罗门、新赫布里底、瑙鲁——德国人和英国人留下的岛屿现在由堪培拉管理。青年国家会议每年都点名批评这件事，而岛上的地方议会开始学会引用国际的宣言来反驳总督。"
 krcw_ent_the_pacific_commonwealth:0 "太平洋联邦"
 krcw_ent_the_pacific_commonwealth_desc:0 "托管地变成了成员国。斐济、所罗门、萨摩亚各派代表进入一个共同的联邦会议，堪培拉从总督变成了主席。这没有让澳新变富，但它让南太平洋第一次成为一个“我们”。"
 krcw_ent_open_the_gates:0 "打开大门"
 krcw_ent_open_the_gates_desc:0 "白澳政策被废除了。第一批船载来的是逃离饥荒的印度人、逃离征兵的日本人、逃离俄国顾问的波斯人。街头有骚动，工厂有了工人，而这个国家的样子在一代人之内彻底变了。"
 krcw_ent_fortress_antipodes:0 "南方的堡垒"
 krcw_ent_fortress_antipodes_desc:0 "新加坡的教训是：依赖一个不在这里的舰队，等于没有舰队。澳新自己的海军从此以护航、扫雷与远洋巡逻为核心——不求决战，只求没有人能在这里从容登陆。"
 krcw_ent_the_crown_in_exile:0 "安置流亡王室"
 krcw_ent_the_crown_in_exile_desc:0 "温莎王室两度流亡，最终在墨尔本落脚。澳新供养着一个没有国土的朝廷和一群仍在筹划收复不列颠的老将军。"
 krcw_ent_the_privy_council:0 "御前会议"
 krcw_ent_the_privy_council_desc:0 "流亡政府的内阁与澳大利亚的内阁每周在同一栋楼里开两次会，谁也说不清哪一个才是真正的政府。孟席斯提议先解决一个更小的问题：这个朝廷的账，由谁来付？"
 krcw_ent_the_restoration_committee:0 "复国委员会"
 krcw_ent_the_restoration_committee_desc:0 "成立复国委员会，维持流亡行政体系，训练远征军，在不列颠寻找仍效忠王室的人。代价很高。"
 krcw_ent_the_canberra_settlement:0 "堪培拉和解"
 krcw_ent_the_canberra_settlement_desc:0 "国王保留王位和礼仪，流亡大臣领取养老金，不再签署政令，预算和外交归澳大利亚议会。王室由此成为澳大利亚的王室。"
 krcw_ent_the_republican_petition:0 "受理共和派请愿"
 krcw_ent_the_republican_petition_desc:0 "悉尼的工会、墨尔本的大学生和一部分工党议员联署了一份请愿书：一个流亡的国王不能代表一个太平洋国家。他们要求公投。王室的支持者称之为背叛，而请愿书上的签名一个月里从三万变成了四十万。"
 krcw_ent_the_exile_ministries:0 "流亡各部"
 krcw_ent_the_exile_ministries_desc:0 "流亡的殖民部、印度事务部与海军部继续运作，尽管它们管辖的一切都已不在王室手中。这些办公室保存着帝国全部的档案、名册与地图——如果有一天要回去，这些纸就是唯一的依据。"
 krcw_ent_the_loyal_diaspora:0 "安置效忠派流亡者"
 krcw_ent_the_loyal_diaspora_desc:0 "从不列颠、加拿大与南非逃出来的旧官员、旧军官与旧地主陆续抵达。他们带来了经验、怨恨和一种在澳大利亚人看来相当刺眼的优越感——但他们也是这个国家唯一的现成干部。"
 krcw_ent_plan_albion:0 "阿尔比昂计划"
 krcw_ent_plan_albion_desc:0 "修订收复不列颠的阿尔比昂计划。它需要一支远征军、国际内部的动乱，以及至少一个大国的默许。"
 krcw_ent_an_australian_citizenship:0 "澳大利亚国籍"
 krcw_ent_an_australian_citizenship_desc:0 "在此之前，这个国家的居民法律上都是“不列颠臣民”——一个已经不存在的国家的臣民。新的国籍法第一次写下了“澳大利亚公民”和“新西兰公民”这两个词。"
 krcw_ent_the_anzac_union:0 "澳新联盟"
 krcw_ent_the_anzac_union_desc:0 "澳大利亚与新西兰签署了一份联盟条约：共同的关税、共同的防务、共同的护照。塔斯曼海两岸的争吵没有消失，但两个自治领第一次把彼此当作唯一真正可靠的伙伴。"
 krcw_ent_tree_lean_p5_tt:0 "堪培拉倾向于巴黎：§G+5§!"
 krcw_ent_a_pacific_nation:0 "改写国民教科书"
 krcw_ent_a_pacific_nation_desc:0 "教科书改写了：澳大利亚的历史不再从一七七〇年的库克船长开始，而从这片大陆自己开始；地理课上，最重要的邻居不再是伦敦，而是雅加达、马尼拉与南京。这个国家终于承认了自己所在的位置。"
 krcw_ent_the_referendum:0 "公投"
 krcw_ent_the_referendum_desc:0 "投票日是一个星期六。王室没有公开干预，可是每一座教堂的布告板、每一份保守派报纸的头版都在提醒选民：没有王冠，我们还剩下什么？"
 krcw_ent_tree_lean_p10_tt:0 "堪培拉倾向于巴黎：§G+10§!"
 krcw_ent_the_new_constitution:0 "新宪法"
 krcw_ent_the_new_constitution_desc:0 "共和国的宪法在堪培拉起草。它保留了议会制、联邦制与普通法，只把国家元首从一个继承的国王换成了一个选举的总统。反对者说这不过是换了一块招牌；支持者说，招牌就是全部的意义。"
 krcw_ent_a_clean_slate:0 "重新起草宪法"
 krcw_ent_a_clean_slate_desc:0 "共和国没有帝国的债务，也没有帝国的敌人。它可以与国际谈生意，也可以与莫斯科谈生意，因为它不再代表任何被推翻的东西。这是三十年来堪培拉第一次拥有的东西：一份干净的履历。"
 krcw_ent_the_lesson_of_singapore:0 "建设独立海军"
 krcw_ent_the_lesson_of_singapore_desc:0 "一九四二年，澳大利亚等待的援军没有来——因为派援军的那个帝国已经不存在了。海军部把这件事写成了一份只有八页的报告，结论只有一句：从今以后，我们只能指望停泊在我们自己港口里的军舰。"
 krcw_ent_the_royal_australian_navy:0 "皇家澳大利亚海军"
 krcw_ent_the_royal_australian_navy_desc:0 "舰队老化严重。科卡图岛船厂开始自造护卫舰和扫雷艇，用于守卫塔斯曼海和珊瑚海。"
 krcw_ent_the_coast_watchers:0 "海岸观察队"
 krcw_ent_the_coast_watchers_desc:0 "几百名志愿者带着电台散布在从达尔文到所罗门群岛的海岸线上。他们打不了仗，但任何一支舰队想要悄悄接近澳新，都必须先把他们一个一个找出来。"
 krcw_ent_the_anzac_divisions:0 "澳新军团师"
 krcw_ent_the_anzac_divisions_desc:0 "两次世界大战的老兵还在，军团的传统也还在。新的常备军规模不大，但它的训练标准是按照“在别人的大陆上作战”定的——这是澳新唯一真正出口过的东西。"
 krcw_ent_the_raaf:0 "皇家空军"
 krcw_ent_the_raaf_desc:0 "澳大利亚买不起战略轰炸机，但它能造教练机、巡逻机与运输机。距离是这个国家最大的敌人，也是它最好的防御——而对付距离的办法是飞机。"
 krcw_ent_the_southern_shipyards:0 "扩建南方船厂"
 krcw_ent_the_southern_shipyards_desc:0 "科卡图岛、威廉斯敦与奥克兰的船厂扩建了。它们仍然造不出战列舰，但它们能修好任何一艘开进南太平洋的船——这本身就是一种权力。"
 krcw_ent_the_wool_clip:0 "统购羊毛出口"
 krcw_ent_the_wool_clip_desc:0 "世界上每三件毛衣里有一件来自澳大利亚的羊背。两大集团都需要它，这让堪培拉手里第一次有了一张牌——尽管这张牌的价格由买家决定。"
 krcw_ent_the_wheat_belt:0 "小麦带"
 krcw_ent_the_wheat_belt_desc:0 "南澳与西澳的麦田扩大了一倍。世界上正在挨饿的地方很多，而愿意用硬通货买小麦的地方更多。"
 krcw_ent_the_pilbara_iron:0 "铁矿砂"
 krcw_ent_the_pilbara_iron_desc:0 "西澳的铁矿几乎无穷无尽，而且离日本的钢厂比离任何人都近。问题不在于挖不挖，而在于卖给谁——以及卖矿砂还是卖钢。"
 krcw_ent_newcastle_steel:0 "兴建纽卡斯尔钢厂"
 krcw_ent_newcastle_steel_desc:0 "卖矿砂的国家永远比买矿砂的国家穷。纽卡斯尔与惠阳的高炉点火了，这是澳大利亚第一次决定自己把矿石变成钢。"
 krcw_ent_the_snowy_scheme:0 "雪山工程"
 krcw_ent_the_snowy_scheme_desc:0 "把雪山的河水穿过山脉引到内陆的灌溉区，顺便发电。这是这个国家历史上最大的工程，施工队里有一半人是刚下船的移民。"
 krcw_ent_the_national_university:0 "国立大学"
 krcw_ent_the_national_university_desc:0 "堪培拉的国立大学成立了。它的物理系招募了从不列颠与中欧逃出来的学者——他们在自己的国家已经无处可去，而这里给了他们一间实验室。"
 krcw_ent_new_markets:0 "开拓亚洲市场"
 krcw_ent_new_markets_desc:0 "不列颠的市场没有了，帝国的关税优惠也没有了。贸易代表团被派往南京、雅加达、东京与旧金山，澳大利亚必须学会向亚洲卖东西。"
 krcw_ent_the_island_administration:0 "岛屿行政"
 krcw_ent_the_island_administration_desc:0 "斐济、所罗门、新赫布里底、瑙鲁、新不列颠——德国人和英国人留下的岛屿都归堪培拉管。总督们发回的报告年复一年地说着同样的事：磷矿在赚钱，学校不够，地方议会开始问问题了。"
 krcw_ent_nauru_phosphate:0 "开采瑙鲁磷矿"
 krcw_ent_nauru_phosphate_desc:0 "瑙鲁整座岛几乎就是一块磷矿石，而磷肥是小麦带的命脉。岛民得到的是一笔象征性的租金和一座被挖空的家园——青年国家会议每年都要提这件事。"
 krcw_ent_the_island_councils:0 "岛屿议会"
 krcw_ent_the_island_councils_desc:0 "斐济与所罗门的地方议会要求实权：自己的预算、自己的法官、自己的学校。堪培拉可以镇压，也可以让步——而镇压的成本正在逐年上升。"
 krcw_ent_the_pacific_commonwealth_f:0 "太平洋联邦"
 krcw_ent_the_pacific_commonwealth_f_desc:0 "托管地变成了成员国。斐济、所罗门与萨摩亚的代表进入一个共同的联邦会议，堪培拉从总督变成了主席。青年国家会议第一次称赞了澳新，而磷矿的租金翻了三倍。"
 krcw_ent_the_colour_line:0 "检讨白澳政策"
 krcw_ent_the_colour_line_desc:0 "白澳政策是这个国家四十年来的共识：一个小小的欧洲人社会守着一片空旷的大陆，北边是亚洲的十亿人。可是现在欧洲已经不欢迎他们了，而北边的国家正在变成他们唯一的客户。"
 krcw_ent_populate_or_perish:0 "要么移民，要么灭亡"
 krcw_ent_populate_or_perish_desc:0 "八百万人守不住一个大陆。移民部长的口号很直白：要么移民，要么灭亡。第一批来的是逃离欧洲废墟的人——而他们远远不够。"
 krcw_ent_the_open_door:0 "打开大门"
 krcw_ent_the_open_door_desc:0 "废除白澳政策的法案以三票之差通过。这是这个国家历史上最不受欢迎、也最有远见的一次投票：它承认了澳大利亚在亚洲，而不在欧洲的边缘。"
 krcw_ent_a_new_australia:0 "开放移民"
 krcw_ent_a_new_australia_desc:0 "一代人之后，墨尔本的街上说着二十种语言。这个国家不再是不列颠的一块碎片，而是一个属于太平洋的移民国家——保守派至今没有原谅那三票。"
 krcw_ent_between_the_blocs:0 "奉行不结盟外交"
 krcw_ent_between_the_blocs_desc:0 "国际的特使坐船从西边来，莫斯科的武官坐船从北边来，而华盛顿——两个华盛顿——都派人来问同一个问题：你们到底站在哪一边？堪培拉的回答向来是：我们站在南边。"
 krcw_ent_tree_lean_p15_tt:0 "堪培拉倾向于巴黎：§G+15§!"
 krcw_ent_talks_with_paris:0 "与巴黎会谈"
 krcw_ent_talks_with_paris_desc:0 "派代表去巴黎，谈军火、航运和对俄国舰队关闭港口的条件。国际需要南太平洋的港口，堪培拉需要一个不要求王室退位的盟友。王室派认为这是向革命者低头。"
 krcw_ent_the_wool_and_the_ledger:0 "羊毛与清算总账"
 krcw_ent_the_wool_and_the_ledger_desc:0 "加入巴黎清算联盟意味着稳定的市场和低息的信贷，代价是把定价权交给一个由工团组成的委员会。牧场主们咬着牙算了这笔账，发现自己别无选择。"
 krcw_ent_a_seat_at_the_congress:0 "以联系国身份加入国际"
 krcw_ent_a_seat_at_the_congress_desc:0 "澳新以“联系国”的身份进入国际的代表大会。澳新不是正式成员，也不交出主权，但在大会上有投票权。"
 krcw_ent_tree_lean_m15_tt:0 "堪培拉倾向于莫斯科：§R-15§!"
 krcw_ent_arms_from_moscow:0 "购买俄国军械"
 krcw_ent_arms_from_moscow_desc:0 "萨文科夫的俄罗斯从不谈意识形态，只谈价钱。它的坦克便宜、它的顾问守规矩、它的条件里没有一个字提到工会——对一个害怕自己左翼的政府来说，这是无法拒绝的诱惑。"
 krcw_ent_the_darwin_mission:0 "达尔文顾问团"
 krcw_ent_the_darwin_mission_desc:0 "一支俄罗斯军事顾问团常驻达尔文。他们训练澳新的军队，也顺便记录下每一个不可靠的工会领袖。反工团主义把两个毫无共同点的政权绑在了一起。"
 krcw_ent_the_accord_guarantee:0 "接受协定防务保障"
 krcw_ent_the_accord_guarantee_desc:0 "莫斯科提供一份防务保障：任何对澳新的进攻都将被视为对协定的进攻。代价是达尔文与弗里曼特尔的港口向俄罗斯太平洋舰队开放。流亡的王室，成了黑色俄罗斯的被保护人。"
 krcw_ent_the_southern_cross:0 "确立南太平洋身份"
 krcw_ent_the_southern_cross_desc:0 "既不向巴黎交出王室，也不向莫斯科交出港口。第三条路最难走，因为它要求这个八百万人的国家独自站在两个巨人之间——但它也是唯一一条不出卖任何东西的路。"
 krcw_ent_the_canberra_initiative:0 "召开堪培拉海上防务会议"
 krcw_ent_the_canberra_initiative_desc:0 "邀请太平洋沿岸不属于任何集团的国家来堪培拉，商定航道巡逻的分区和潜艇动向的通报办法。海军部推动此事，各国都不愿交出自己的舰队指挥权。"
 krcw_ent_the_pacific_pact:0 "签订太平洋共同防御公约"
 krcw_ent_the_pacific_pact_desc:0 "堪培拉、惠灵顿与萨克拉门托约定：任何一方的领土或航道遭到攻击，其余各方共同磋商并派舰支援。公约让两大集团都更难在南太平洋施压，代价是澳新要为别人的海岸出兵。"
 krcw_ent_the_armed_neutral:0 "武装中立"
 krcw_ent_the_armed_neutral_desc:0 "中立不是软弱。澳新宣布：谁也不站，但谁也别想在这里从容登陆。舰队、空军、海岸观察队与本土师被编织成一张网，让任何一个大国都觉得吞下这块大陆不值得。"
 krcw_ent_the_woomera_range:0 "沃默拉靶场"
 krcw_ent_the_woomera_range_desc:0 "在南澳沙漠的沃默拉建火箭靶场，由陆军和墨尔本大学的物理系共同管理。国际、莫斯科与宪政联盟都派人打听这里在做什么，靶场周围划为禁区。"
 krcw_ent_the_lucas_heights:0 "卢卡斯海茨反应堆"
 krcw_ent_the_lucas_heights_desc:0 "一座研究用反应堆在悉尼郊外建成。澳大利亚不造原子弹——它没有钱，也没有必要——但它要确保，如果有一天必须造，它懂得怎么造。"
 krcw_ent_the_southern_hemisphere:0 "保持核门槛能力"
 krcw_ent_the_southern_hemisphere_desc:0 "卢卡斯海茨的反应堆和沃默拉的火箭试验保持运转，铀矿储量和工程图纸列为国家机密，使澳大利亚在需要时能在一年内造出原子弹。国防部主张此事，财政部认为这是在为一件永远不造的武器付钱。"
 krcw_ent_20_t:0 "谁的政府？"
 krcw_ent_20_d:0 "两个内阁在同一栋楼里开会。流亡政府的大臣们签署着关于印度、马来亚与西非的政令——那些地方早已不听他们的了；澳大利亚的部长们则要为这些空文付账。\n\n孟席斯把问题摆在了桌面上：我们是一个供养流亡朝廷的殖民地，还是一个碰巧拥有一位国王的国家？"
 krcw_ent_20.a:0 "王室的事业就是我们的事业"
 krcw_ent_20.b:0 "先解决澳大利亚的问题"
 krcw_ent_20.c:0 "这个问题该由人民回答"
 krcw_ent_22_t:0 "请愿书"
 krcw_ent_22_d:0 "四十万个签名送到了总督府。悉尼的码头工人、墨尔本的学生、伯斯的矿工——他们的要求只有一句：让澳大利亚人决定澳大利亚的国家元首。\n\n王室的支持者提醒政府：一场公投可能会撕裂这个国家，而且不管结果如何，都会让两大集团看到澳新的虚弱。"
 krcw_ent_22.a:0 "举行公投"
 krcw_ent_22.b:0 "搁置请愿，但许诺改革"
 krcw_ent_tree_lean_m25_tt:0 "堪培拉倾向于莫斯科：§R-25§!"
 krcw_ent_24_t:0 "阿尔比昂计划"
 krcw_ent_24_d:0 "计划摊在参谋部的桌上：三个师、四十艘运输船、一次在西南英格兰的登陆，以及一份假定不列颠人会起而响应的附件。\n\n海军上将指出，这支舰队连印度洋都过不去，除非有人为它护航。陆军上将指出，就算登陆成功，国际的装甲师会在两周内把他们赶回海里。国王问了一个问题：如果我们永远不试，历史会怎么写我们？"
 krcw_ent_24.a:0 "把计划锁回保险柜"
 krcw_ent_24.b:0 "继续准备，等待时机"
 krcw_ent_24.c:0 "寻求莫斯科的护航"
 krcw_ent_26_t:0 "投票前夜"
 krcw_ent_26_d:0 "明天就是投票日。王室没有公开干预，可是教堂的布告板和保守派报纸都站在王冠一边。共和派的集会在悉尼、墨尔本与纽卡斯尔的工人区场场爆满，在乡村却没有人来。\n\n内阁还能决定的，只有政府自己在最后一天做什么。结果由选民决定。"
 krcw_ent_26.a:0 "政府公开为共和动员"
 krcw_ent_26.b:0 "政府保持中立，交给选民"
 krcw_ent_27_t:0 "计票：共和"
 krcw_ent_27_d:0 "计票持续了三天。乡村选区几乎一致地支持王室，悉尼、墨尔本与纽卡斯尔的工人区则相反。共和派以不到两个百分点的差距胜出。\n\n王室在墨尔本发表声明，表示尊重投票结果。投反对票的选民集中在乡村选区，这些选区的议员在下一届议会里仍然是一个大党团。"
 krcw_ent_27.a:0 "宣布共和"
 krcw_ent_29_t:0 "计票：王冠"
 krcw_ent_29_d:0 "计票持续了三天。乡村选区几乎一致地支持王室，悉尼、墨尔本与纽卡斯尔的工人区则相反。王室以不到两个百分点的差距保住了王位。\n\n共和派的领袖在悉尼市政厅前承认失败，并说这个问题十年之内不会再付诸投票。"
 krcw_ent_29.a:0 "接受结果"
 krcw_ent_28_t:0 "岛屿议会的要求"
 krcw_ent_28_d:0 "斐济、所罗门与新赫布里底的地方议会联合递交了一份文件。它写得很客气，但意思很清楚：托管地要自己的预算、自己的法官和自己的学校，而且要一个明确的日期。\n\n青年国家会议已经把这件事列入了议程。堪培拉可以拖，可以镇压，也可以抢在别人替它做决定之前，自己做出决定。"
 krcw_ent_28.a:0 "给予自治，走向联邦"
 krcw_ent_28.b:0 "维持总督统治"
 krcw_ent_28.c:0 "把磷矿收益分给岛民"
 krcw_ent_30_t:0 "肤色的界线"
 krcw_ent_30_d:0 "移民部长的报告指出两件矛盾的事实：这个国家需要人口，否则守不住大陆；而这个国家的法律禁止它接受唯一愿意大量前来的那些人。\n\n北边的中华民国与印尼已经在国际论坛上点名批评白澳政策。而澳大利亚的工会——历史上白澳政策最坚定的支持者——第一次出现了分裂。"
 krcw_ent_30.a:0 "只从欧洲移民"
 krcw_ent_30.b:0 "悄悄地开一道缝"
 krcw_ent_30.c:0 "废除白澳政策"
 krcw_ent_south_seas_category:0 "南洋事务"
 krcw_ent_south_seas_category_desc:0 "斐济、所罗门、新赫布里底、瑙鲁与新几内亚的日常管理——磷矿、学校、地方议会，以及每年一次来自青年国家会议的批评。"
 krcw_ent_island_schools:0 "岛屿学校计划"
 krcw_ent_island_schools_desc:0 "在每个岛群建一所中学。二十年后，这些学校的毕业生会成为地方议会的议员——这既是投资，也是风险。"
 krcw_ent_phosphate_quota:0 "提高磷矿配额"
 krcw_ent_phosphate_quota_desc:0 "小麦带需要肥料，而瑙鲁的矿山还能再挖快一点。岛民的抗议信会送到堪培拉，但小麦的收成不等人。"
 krcw_ent_island_patrol:0 "群岛巡逻"
 krcw_ent_island_patrol_desc:0 "护卫舰在斐济与所罗门之间来回巡航。它们的任务一半是缉私，一半是提醒岛民：堪培拉还在。"
 krcw_ent_answer_the_conference:0 "答复青年国家会议"
 krcw_ent_answer_the_conference_desc:0 "每年的批评都要答复。可以反驳，可以沉默，也可以宣布一个去殖民化的时间表——最后这一种做法最疼，但也最有用。"
 krcw_ent_pacific_scholarships:0 "太平洋奖学金"
 krcw_ent_pacific_scholarships_desc:0 "把岛屿与亚洲邻国的学生送进悉尼与惠灵顿的大学。二十年后，这些人会是雅加达、苏瓦与莫尔斯比港的部长。"
 AST_krcw_the_king_in_exile:0 "流亡的国王"
 AST_krcw_the_king_in_exile_desc:0 "他十二岁那年随家人离开伦敦，二十岁那年离开渥太华。如今他是澳大利亚的国王、新西兰的国王，以及一个不存在的不列颠的国王。他从不公开谈论第三件事，但御前会议每次开会，那把空着的椅子都摆在那里。"
 AST_krcw_restorationist_pm:0 "复国派首相"
 AST_krcw_restorationist_pm_desc:0 "他在加里波利失去了一条腿，在一九二五年失去了祖国。他从政的全部目的就是有一天把王室送回白金汉宫——他知道这不可能，但他认为一个放弃了这个目标的国家就不再是这个国家了。"
 AST_krcw_dominion_pm:0 "自治领派首相"
 AST_krcw_dominion_pm_desc:0 "一个务实到近乎冷酷的律师。他对王室保持着完美的礼节，同时耐心地把流亡政府的每一项权力搬进澳大利亚的部门里。他的名言是：“我们不废除任何东西，我们只是接管它。”"
 AST_krcw_republican_leader:0 "共和派领袖"
 AST_krcw_republican_leader_desc:0 "码头工人的儿子，工会律师出身。他的论点从来不是反对国王本人，而是一个简单的问题：一个在伦敦出生、在渥太华长大的人，凭什么代表一个太平洋国家？"
 AST_krcw_admiral:0 "舰队司令"
 AST_krcw_admiral_desc:0 "他在一九四二年指挥过一艘等不到援军的巡洋舰。此后他用二十年时间建立了一个原则：澳新的舰队不为任何遥远的帝国而战，只为塔斯曼海与珊瑚海的航道而战。"
 NZL_krcw_dominion_pm:0 "新西兰自治领首相"
 NZL_krcw_dominion_pm_desc:0 "惠灵顿的看法一向比堪培拉清醒：新西兰太小，不可能靠自己活下去，所以它必须让澳大利亚离不开它。他把塔斯曼海两岸的联盟当作毕生事业，而不是当作施舍。"
 NZL_krcw_conservative_pm:0 "新西兰保守派首相"
 NZL_krcw_conservative_pm_desc:0 "他相信新西兰唯一的安全保障是王室与旧秩序。当澳大利亚讨论共和国的时候，他公开表示：如果墨尔本不要国王，惠灵顿要。"
 AST_krcw_pacific_statesman:0 "太平洋外交家"
 AST_krcw_pacific_statesman_desc:0 "他是第一个说出“我们是一个亚洲国家”的澳大利亚首相，为此被保守派报纸攻击了十年。堪培拉会议、无核区宣言与太平洋公约都出自他的办公室。"
 krcw_wgr_tree:0 "krcw_wgr_tree"
 krcw_wgr_german_brothers:0 "德意志的兄弟"
 krcw_wgr_elbe_provocation:0 "易北河上的挑衅"
 krcw_wgr_the_island_city:0 "孤岛之城"
 krcw_wgr_the_island_city_desc:0 "西柏林在东德的包围中，靠三条空中走廊和一条铁路活着。它是国际最骄傲的展品，也是它最脆弱的人质。"
 krcw_wgr_the_elbe_watch:0 "易北河守望"
 krcw_wgr_the_elbe_watch_desc:0 "从吕贝克到帕绍，一条河把德意志分成两个。河这边的每个师都知道，战争开始的第一个小时里，他们要独自撑住。"
 krcw_wgr_ruhr_reconstruction:0 "鲁尔重建"
 krcw_wgr_ruhr_reconstruction_desc:0 "鲁尔的高炉在一九四三年的轰炸里塌了一半。工人委员会用拆下来的钢梁重建了另一半——这一次，工厂属于他们。"
 krcw_wgr_council_democracy:0 "委员会民主"
 krcw_wgr_council_democracy_desc:0 "每个车间选出自己的委员会，每个委员会派代表进地区大会。开会的时间比生产的时间还长，但没有人再替工人做决定。"
 krcw_wgr_front_militarisation:0 "前线军事化"
 krcw_wgr_front_militarisation_desc:0 "易北河的压力压在每一个部门上：铁路按军令时刻表运行，工厂留出战时产能，年轻人先服役再上大学。"
 krcw_wgr_the_german_question:0 "德意志问题"
 krcw_wgr_the_german_question_desc:0 "两个德意志政府，一个德意志民族。柏林的每一次谈判、每一张通行证、每一封跨河的信，都是这个问题的一部分。"
 krcw_wgr_austrian_provinces:0 "奥地利问题"
 krcw_wgr_austrian_provinces_desc:0 "萨尔茨堡的奥地利共和国是国际的成员，维也纳还在俄国人手里。共和国里有人说奥地利人就是德意志人，应该回到德国；也有人说奥地利从来不是德国的一部分。这件事每年都要在大会上吵一次。"
 krcw_wgr_the_republic_on_the_rhine:0 "宣布德意志社会主义共和国"
 krcw_wgr_the_republic_on_the_rhine_desc:0 "一九四三年国际的装甲师渡过莱茵河，帝国西半部在半年内易帜。台尔曼宣布成立德意志社会主义共和国，它是国际在欧洲最前沿的成员，东面就是施莱歇尔的军队。"
 krcw_wgr_the_moabit_generation:0 "组建莫阿比特班底"
 krcw_wgr_the_moabit_generation_desc:0 "党的领导层是从帝国监狱里走出来的：台尔曼、卡勒、雷恩、蔡塞尔——他们坐了十年牢，彼此之间有牢房里结下的信任，也有牢房里结下的仇。"
 krcw_wgr_the_works_councils:0 "车间委员会"
 krcw_wgr_the_works_councils_desc:0 "鲁尔的每一座工厂都有一个选出来的委员会。它决定生产计划、分配住房、也裁决工人之间的争吵——国家的权力在这里是自下而上长出来的。"
 krcw_wgr_the_unity_congress:0 "统一代表大会"
 krcw_wgr_the_unity_congress_desc:0 "共产党、社会民主党左翼与自由工会在多特蒙德合并成统一工人党。合并的条件是：不许有第二个中央，也不许有第二份纲领。"
 krcw_wgr_denazify_the_civil_service:0 "清洗旧官僚"
 krcw_wgr_denazify_the_civil_service_desc:0 "帝国的法官、校长与警官还坐在原来的位置上——没有他们，国家就转不动；留着他们，革命就是一句空话。"
 krcw_wgr_the_succession_question:0 "讨论台尔曼接班"
 krcw_wgr_the_succession_question_desc:0 "台尔曼一八八六年生，在莫阿比特的十年毁了他的身体。党内没有人敢公开讨论继承，可是每个人都在数票：车间委员会的人、前线的军官、还是莫斯科都能接受的中间派？"
 krcw_wgr_socialist_unification:0 "社会主义统一"
 krcw_wgr_socialist_unification_desc:0 "统一只有一种方式：把革命带到易北河对岸。宣传、罢工基金、越境的组织者。如果施莱歇尔的国家从内部裂开，德意志就会在红旗下重新合为一体。"
 krcw_wgr_the_neutral_federation:0 "准备以武力统一德国"
 krcw_wgr_the_neutral_federation_desc:0 "政治局认定易北河不会在谈判桌上打开。一旦协定进攻柏林或自己出现裂缝，共和国的师就渡河东进。这条路线要一支预算还养不起的军队。"
 krcw_wgr_two_german_states:0 "建设西德样板"
 krcw_wgr_two_german_states_desc:0 "承认现实：统一在这一代人手里不会发生。把西德建成国际最富、最自由、最强的成员，让东边的人自己去比较。"
 krcw_wgr_the_new_constitution:0 "新宪法"
 krcw_wgr_the_new_constitution_desc:0 "一部把委员会制写进国家结构的宪法：地区大会选举执行委员会，中央只保留国防、外交与计划。它是国际内部最彻底的联邦制实验。"
 krcw_wgr_the_berlin_lifeline:0 "柏林生命线"
 krcw_wgr_the_berlin_lifeline_desc:0 "三条空中走廊、一条铁路、一条运河。西柏林两百万人的面粉、煤和药品全靠它们，而它们全部穿过施莱歇尔的国土。"
 krcw_wgr_the_airlift_standing_plan:0 "常备空运计划"
 krcw_wgr_the_airlift_standing_plan_desc:0 "一九四九年的面包桥不是最后一次。参谋部把空运变成常备计划：跑道、仓库、气象站与一支专门的运输机部队随时待命。"
 krcw_wgr_the_showcase_city:0 "展示之城"
 krcw_wgr_the_showcase_city_desc:0 "在西柏林集中兴建住宅、大学、剧院与商店。每天持通行证进城的东德人，回去时会带着对比。"
 krcw_wgr_the_transit_agreement:0 "设立柏林通道管理局"
 krcw_wgr_the_transit_agreement_desc:0 "管理局登记每一列火车、每一辆卡车和每一条驳船，记录东德的每一次阻挠，并对途经西德的东德货运采取对等措施。运输部和铁路工会分担人员。"
 krcw_wgr_the_city_garrison:0 "城市卫戍"
 krcw_wgr_the_city_garrison_desc:0 "在西柏林驻扎一个师。它守不住城市，但能让任何进攻都成为战争行为。"
 krcw_wgr_berlin_is_not_negotiable:0 "柏林不容谈判"
 krcw_wgr_berlin_is_not_negotiable_desc:0 "政府正式宣布西柏林的地位不在任何谈判桌上。莫斯科对此提出抗议。"
 krcw_wgr_the_workers_militia:0 "工人民兵"
 krcw_wgr_the_workers_militia_desc:0 "每座工厂一个连，武器锁在厂里的军械库，钥匙由车间大会保管。这支军队不能远征，但任何人想占领鲁尔都得一条街一条街地打。"
 krcw_wgr_the_elbe_fortifications:0 "易北河筑垒"
 krcw_wgr_the_elbe_fortifications_desc:0 "从吕讷堡到卡塞尔，混凝土工事沿着河岸延伸。参谋部的计算很简单：撑住七十二小时，巴黎的装甲师就能赶到。"
 krcw_wgr_the_new_reichswehr:0 "新国防军"
 krcw_wgr_the_new_reichswehr_desc:0 "旧帝国的军官团一半在东岸，一半在监狱里。新军队的干部来自国际纵队、西班牙的老兵和车间委员会——他们懂政治，正在学战争。"
 krcw_wgr_the_panzer_question:0 "研制新型坦克"
 krcw_wgr_the_panzer_question_desc:0 "德国的坦克设计局在东岸，可是图纸和工程师跑了一半过来。鲁尔的钢加上巴黎的发动机，能造出守住这条河的东西。"
 krcw_wgr_the_air_umbrella:0 "空中保护伞"
 krcw_wgr_the_air_umbrella_desc:0 "俄罗斯的轰炸机从波兰起飞只需九十分钟。雷达链、截击机联队与高射炮网必须覆盖鲁尔与汉堡——那里是国际在欧洲的第二个工业心脏。"
 krcw_wgr_the_joint_command:0 "联合指挥部"
 krcw_wgr_the_joint_command_desc:0 "法国、不列颠与德意志的参谋部在美因茨合署办公。指挥权归谁是一个吵了三年的问题，最后的方案是：前线归德国人，纵深归法国人。"
 krcw_wgr_demilitarise_the_river:0 "请求法国师进驻易北河"
 krcw_wgr_demilitarise_the_river_desc:0 "共和国请求国际把两个法国装甲师常驻吕讷堡和卡塞尔，使任何越过易北河的进攻都立即成为对整个国际的战争。巴黎同意，驻军费用由西德承担。"
 krcw_wgr_the_ruhr_rebuilt:0 "鲁尔重建"
 krcw_wgr_the_ruhr_rebuilt_desc:0 "埃森、多特蒙德与杜伊斯堡的高炉重新点火，工厂由车间委员会接管。"
 krcw_wgr_the_rhineland_chemicals:0 "莱茵兰化工"
 krcw_wgr_the_rhineland_chemicals_desc:0 "勒沃库森与路德维希港的化工厂是欧洲最大的。没有油田的国家靠煤化工造汽油、橡胶与肥料。"
 krcw_wgr_the_hamburg_yards:0 "汉堡船厂"
 krcw_wgr_the_hamburg_yards_desc:0 "汉堡与不来梅的船厂造不了战列舰，但能造货轮、渔船与潜艇。北海的贸易是这个国家的第二条生命线。"
 krcw_wgr_join_the_federations:0 "加入产业联合会"
 krcw_wgr_join_the_federations_desc:0 "把定价权与生产计划交给跨国的产业联合会，换来配额、图纸与一个不会被封锁的市场。德国的工业规模让它在联合会里说话很响。"
 krcw_wgr_the_reparations_question:0 "以出口偿付赔款"
 krcw_wgr_the_reparations_question_desc:0 "帝国欠下的赔款由谁来还？东岸说由资本家还，西岸的资本家已经不存在了。国际的裁决是：由德国的工人用出口偿付。"
 krcw_wgr_consumer_goods_first:0 "先造消费品"
 krcw_wgr_consumer_goods_first_desc:0 "车间委员会投票通过了一项决议：在坦克之前先造锅、鞋与自行车。军方反对，但委员会的票数比军方多。"
 krcw_wgr_the_german_laboratories:0 "留住哥廷根的物理学家"
 krcw_wgr_the_german_laboratories_desc:0 "哥廷根与海德堡的物理学家留下来了。他们与萨克莱、哈韦尔交换数据——国际的原子计划里，德国人管理论。"
 krcw_wgr_the_austrian_provinces:0 "萨尔茨堡的邻居"
 krcw_wgr_the_austrian_provinces_desc:0 "一九四四年国际的军队翻过阿尔卑斯山，奥地利西部各州在萨尔茨堡组成了共和国，维也纳却在俄国人手里。阿德勒的政府每个月都派人来，商量电力、铁路和边界上的事。共和国要先决定，它怎样看待这个邻居。"
 krcw_wgr_the_alpine_economy:0 "并入阿尔卑斯水电"
 krcw_wgr_the_alpine_economy_desc:0 "蒂罗尔与萨尔茨堡的水电站是欧洲最好的。奥地利并入共和国以后，它们可以接进德国的电网，鲁尔的高炉就不必再烧那么多煤。"
 krcw_wgr_austria_united_tt:0 "奥地利已并入共和国"
 krcw_wgr_the_vienna_question:0 "答复萨尔茨堡的代表团"
 krcw_wgr_the_vienna_question_desc:0 "萨尔茨堡派来了正式的代表团，请共和国表态：承认奥地利是一个独立的国家，还是把它看作迟早要回来的德意志土地。代表团还带来一个问题：如果有一天维也纳回来了，它是回到奥地利，还是回到德国。"
 krcw_wgr_an_austrian_republic:0 "承认奥地利独立"
 krcw_wgr_an_austrian_republic_desc:0 "共和国承认奥地利是第三国际里一个独立的成员，放弃一切合并的要求。萨尔茨堡可以在国际的会议上和共和国平起平坐，莫斯科也少了一个说德国人要扩张的理由。"
 krcw_wgr_greater_germany:0 "邀请奥地利加入共和国"
 krcw_wgr_greater_germany_desc:0 "共和国正式邀请奥地利以一个州的身份加入德意志社会主义共和国。奥地利的大德意志派几十年来一直要求并入德国，多瑙河的君主国在时，这只是一个口号。萨尔茨堡可以接受，也可以拒绝。"
 krcw_wgr_the_reckoning_with_the_empire:0 "清理帝国遗产"
 krcw_wgr_the_reckoning_with_the_empire_desc:0 "博物馆里的帝国军旗要不要收起来？学校的历史课本怎么讲一九一四与一九四三？一个国家在战败之后必须重新决定自己是谁。"
 krcw_wgr_demilitarise_the_schools:0 "去军国主义化"
 krcw_wgr_demilitarise_the_schools_desc:0 "解散体操协会、射击俱乐部与旧青年团，代之以工会青年团与技术学校。老一代普遍反对。"
 krcw_wgr_the_german_broadcast:0 "德意志广播"
 krcw_wgr_the_german_broadcast_desc:0 "科隆电台开设对东岸广播，包括新闻、音乐和答复东德听众来信的节目。施莱歇尔政府开始干扰信号。"
 krcw_wgr_one_nation_two_states:0 "设立全德事务部"
 krcw_wgr_one_nation_two_states_desc:0 "新设的全德事务部统一管理对东德的广播、出版、难民安置和统一宣传。东德称之为颠覆部，部里的预算逐年增加。"
 krcw_wgr_congress_tt:0 "接班人由下一次党代表大会选出。政府支持的人最有希望，但不一定当选。"
 krcw_wgr_10_t:0 "台尔曼之后"
 krcw_wgr_10_d:0 "医生的报告放在政治书记的桌上，只有一行结论：不要让他再作长篇演讲。党内三股力量立刻动了起来——车间委员会要一个自己人，前线的军官要一个懂军事的人，而巴黎希望看到一个它能打电话的人。谁来接班，决定的不只是一个人的前途，而是这个共和国往哪个方向走。"
 krcw_wgr_10.a:0 "车间委员会的人：沃伦贝格"
 krcw_wgr_10.b:0 "前线的军人：卡勒"
 krcw_wgr_10.c:0 "作家与外交家：雷恩"
 krcw_wgr_11_t:0 "第三次党代表大会"
 krcw_wgr_11_d0:0 "台尔曼在开幕式上讲了二十分钟，宣布不再担任政治书记。代表们用了三天、四轮投票选出继任者：埃里希·沃伦贝格，车间委员会推举的候选人。他在当选后的第一次讲话里说，共和国的重大决定今后都要先交地区大会讨论。"
 krcw_wgr_11_d1:0 "台尔曼在开幕式上讲了二十分钟，宣布不再担任政治书记。代表们用了三天、四轮投票选出继任者：汉斯·卡勒，易北河防线的司令。前线各师的代表几乎全体投了他的票。他在当选后的第一次讲话里只谈了易北河。"
 krcw_wgr_11_d2:0 "台尔曼在开幕式上讲了二十分钟，宣布不再担任政治书记。代表们用了三天、四轮投票选出继任者：路德维希·雷恩，作家，前国际纵队军官，巴黎最熟悉的德国人。他在当选后的第一次讲话里提到了巴黎两次，莫斯科一次。"
 krcw_wgr_11.a:0 "沃伦贝格接任政治书记"
 krcw_wgr_11.b:0 "卡勒接任政治书记"
 krcw_wgr_11.c:0 "雷恩接任政治书记"
 krcw_wgr_12_t:0 "中立的代价"
 krcw_wgr_12_d:0 "中立联邦的方案送到了巴黎。答复是冷淡的：国际不会为了一个统一的德意志放弃易北河防线，除非俄罗斯先撤走它的坦克集团军。而莫斯科的答复更简单——它想知道，一个中立的德意志会不会在二十年后又变成一个强国。两个首都都在问同一个问题：德国人凭什么值得信任？"
 krcw_wgr_12.a:0 "坚持下去，向两边同时施压"
 krcw_wgr_12.b:0 "接受现实，暂时搁置"
 krcw_wgr_13_t:0 "两个首都的答复"
 krcw_wgr_13_d0:0 "莫斯科的答复先到：俄罗斯愿意在日内瓦讨论\"德意志问题的各种方案\"，前提是两个德国的代表同时在场。巴黎的答复晚了一个星期，内容相同。这是一九四四年以来两个阵营第一次同意为德国坐到同一张桌子旁。"
 krcw_wgr_13_d1:0 "巴黎没有正式答复，只让驻汉堡的代表转达了书记处的意见：联邦方案\"值得研究\"。莫斯科的答复是一份外交部声明，称西德的提议是\"把第三国际的防线向东推进的新办法\"。两个首都都没有拒绝，也都没有派人。"
 krcw_wgr_13.a:0 "接受会谈，把代表团派到日内瓦"
 krcw_wgr_13.b:0 "继续施压，等莫斯科换人"
 krcw_wgr_13.c:0 "放弃联邦方案"
 krcw_wgr_capitals_tt:0 "巴黎与莫斯科如何回应由它们自己决定；萨文科夫去世后、缓和度高时更可能同意会谈。"
 krcw_wgr_14_t:0 "新宪法的辩论"
 krcw_wgr_14_d:0 "制宪大会开了十一个星期。争论的核心只有一条：国防与计划归中央，那么中央由谁来控制？车间委员会的代表要求一切权力经由地区大会；前线的军官指出，一支要在七十二小时内决定国家存亡的军队不能等着开会。最后的条文是一个妥协，两边都不满意，但两边都签了字。"
 krcw_wgr_14.a:0 "委员会至上：一切权力经由大会"
 krcw_wgr_14.b:0 "国防优先：中央保留紧急权力"
 krcw_wgr_14.c:0 "两院制：车间一院，地区一院"
 krcw_wgr_16_t:0 "过境谈判"
 krcw_wgr_16_d:0 "东柏林的谈判代表在第四天提出了真正的条件：西德承认德意志民族共和国的国籍法，换取每年二十万张探亲通行证。这是一笔残酷的交易——承认对岸是一个国家，等于承认分裂是永久的；可是拒绝，就等于让两百万柏林人继续与亲戚隔绝。"
 krcw_wgr_16.a:0 "签下协定：通行证比原则重要"
 krcw_wgr_16.b:0 "拒绝：一个民族不能有两种国籍"
 krcw_wgr_18_t:0 "赔款的账单"
 krcw_wgr_18_d:0 "国际的清算委员会送来了账单：帝国在两次战争中造成的损失，由继承它工业的国家偿付。西德的工人委员会算了一笔账——按这个数额，鲁尔要为法国和意大利白干十四年。有人说这是正义，有人说这是新的凡尔赛。"
 krcw_wgr_18.a:0 "照单全付，用出口偿还"
 krcw_wgr_18.b:0 "要求重新核算"
 krcw_wgr_18.c:0 "以技术与专利抵偿"
 krcw_wgr_19_t:0 "清算委员会的复核"
 krcw_wgr_19_d0:0 "清算委员会用了四个月复核西德提交的账目，最后接受了其中一半的异议：拆走的设备按折旧后的价值计算，战时被法国征用的鲁尔煤从账单里扣除。新的数字比原来少了三分之一。"
 krcw_wgr_19_d1:0 "清算委员会的复核结论只有两页：原账单的计算方法符合国际章程，不予调整。附函说，委员会理解西德工人的负担，但\"其他成员国的负担同样真实\"。法国代表在表决时投了赞成票。"
 krcw_wgr_19.a:0 "接受新数字"
 krcw_wgr_19.b:0 "照原数付款"
 krcw_wgr_19.c:0 "在大会上公开抗议"
 krcw_wgr_commission_tt:0 "清算委员会是否减免，取决于巴黎对西德的看法。"
 krcw_wgr_20_t:0 "萨尔茨堡来的人"
 krcw_wgr_20_d:0 "阿德勒派来的代表团由伦纳带队。他们的请求很直接：请共和国承认奥地利是一个独立的国家，不要让奥地利成为第二个德国的问题。共和国大会里的大德意志派则要求代表团回去问问奥地利人自己：要不要回到德国。"
 krcw_wgr_20.a:0 "承诺尊重奥地利的独立"
 krcw_wgr_20.b:0 "不表态"
 krcw_wgr_20.c:0 "请奥地利人投票决定"
 krcw_wgr_referendum_tt:0 "萨尔茨堡决定是否举行公投；投票结果决定共和国之后能走哪条路。"
 krcw_wgr_22_t:0 "探亲的火车"
 krcw_wgr_22_d:0 "第一列探亲专列从科隆开往莱比锡。站台上没有官方仪式，只有两千个提着行李的人和站在柱子后面记录的两国便衣。当火车驶过易北河桥的时候，车厢里安静下来——二十年来第一次，一条河变回了一条河，而不是一道边界。"
 krcw_wgr_22.a:0 "扩大往来，每年加开班次"
 krcw_wgr_22.b:0 "谨慎推进，防止渗透"
 krcw_ti_cadre_reform:0 "干部改革"
 krcw_ti_cadre_reform_desc:0 "革命的军队靠热情打赢了内战，可是热情不会画作战地图。新的军官学校从车间里挑人，用三年把他们教成参谋——这是公社第一次承认，打仗是一门专业。"
 krcw_ti_combined_arms:0 "联合兵种"
 krcw_ti_combined_arms_desc:0 "装甲、炮兵与步兵在同一套无线电频率上作战。听起来平淡，做起来要重新训练每一个营长——但没有它，易北河上的反击只是一次昂贵的散步。"
 krcw_ti_standing_reserve:0 "常备后备军"
 krcw_ti_standing_reserve_desc:0 "每个联合会保留一个满编的后备师，装备封存在厂区，人员每年集训一个月。俄罗斯的一百四十八个师是常备的；公社的回答是让自己的师能在七十二小时内变成两倍。"
 krcw_ti_operational_art:0 "战役法"
 krcw_ti_operational_art_desc:0 "总参谋部花了十年研究一个问题：如果俄罗斯的坦克集团军在第一天突破，第二天该怎么办。答案写成四百页条令，每个师长必须背下其中八十页。"
 krcw_fra_elbe_lesson_tt:0 "开启军事成长链：干部改革、联合兵种、后备役与战役法"
 krcw_fra_the_lesson_of_the_elbe:0 "重新评估易北河防线"
 krcw_fra_the_lesson_of_the_elbe_desc:0 "兵棋推演显示，易北河与莱茵河之间国际只有三十几个师，对面有六十多个，后面还有俄国西部的八十多个师。重新评估莱茵河以东的防御。"
 krcw_fra_the_officer_cadres:0 "军官干部"
 krcw_fra_the_officer_cadres_desc:0 "圣西尔军校在革命中被关掉了，因为它是贵族的学校。二十八年后，公社重新开办它——这一次学员来自车间和矿井，教官是西班牙内战和第二次世界大战的老兵。"
 krcw_fra_combined:0 "联合兵种研究"
 krcw_fra_combined_arms_doctrine:0 "联合兵种条令"
 krcw_fra_combined_arms_doctrine_desc:0 "装甲联合会、炮兵与步兵第一次在同一次演习里使用同一套频率。演习的结论很难听：三个兵种互相听不懂对方在说什么。条令必须重写。"
 krcw_fra_the_reserve_statute:0 "后备役条例"
 krcw_fra_the_reserve_statute_desc:0 "新条例规定：每个产业联合会维持一个后备师，装备封存在本厂，人员每年集训一个月。工会最初反对——这等于每年从生产线上抽走一个月的工时。代表大会以微弱多数通过。"
 krcw_fra_opart:0 "战役法研究"
 krcw_fra_operational_art_focus:0 "战役法"
 krcw_fra_operational_art_focus_desc:0 "总参谋部把十年的推演写成了条令：不在边界上决战，而是让对手的装甲集团军深入，再从侧翼切断它的补给。这套打法需要纪律、无线电和一支能后退而不溃散的军队——三样东西公社现在都有了。"
 krcw_fra_the_federal_manoeuvre:0 "联邦大演习"
 krcw_fra_the_federal_manoeuvre_desc:0 "国际欧洲成员在莱茵兰举行联合演习，法国装甲师、西德步兵、不列颠空军和意大利山地部队在同一指挥部下行动。"
 krcw_ti_expeditionary_habit:0 "远征的习惯"
 krcw_ti_expeditionary_habit_desc:0 "不列颠的陆军从来不大，但它两百年来一直在别人的海岸上登陆。工团接管了这套本事：把一个师从利物浦送到汉堡的时间，比从莱茵兰行军过去还短。"
 krcw_eng_continental_tt:0 "开启军事成长链：干部、远征、后备与战役法"
 krcw_eng_the_continental_commitment:0 "大陆义务"
 krcw_eng_the_continental_commitment_desc:0 "不列颠传统上只保留小规模陆军，但易北河防线撑不住时舰队帮不上忙。向大陆派驻一支常备远征军。"
 krcw_eng_the_staff_college:0 "参谋学院"
 krcw_eng_the_staff_college_desc:0 "坎伯利的参谋学院在革命后关了十年，因为它的毕业生大半跟着旧政府去了加拿大。重开的学院招收工会推荐的学员，课程里第一次出现了\"如何在陆地上对抗坦克集团军\"。"
 krcw_eng_the_expeditionary_corps:0 "远征军团"
 krcw_eng_the_expeditionary_corps_desc:0 "组建四个师的远征军，配备专用运输船队，在汉堡和鹿特丹预置补给，任务是在易北河防线崩溃前把援军送到。"
 krcw_eng_the_reserve_divisions:0 "后备师"
 krcw_eng_the_reserve_divisions_desc:0 "territorial 的传统还在：每个郡的工会维持一个后备营，每年在威尔士的山里集训一个月。这套制度让不列颠的陆军在动员后能翻一倍。"
 krcw_eng_opart:0 "战役法研究"
 krcw_eng_operational_art:0 "战役法"
 krcw_eng_operational_art_desc:0 "不列颠的参谋们把法国人的条令翻译过来，加上自己的一章：如何在失去空中优势的情况下撤退而不溃散。这一章后来被萨克雷的法国同行悄悄借了回去。"
 krcw_wgr_72h_tt:0 "开启军事成长链：干部、兵种、后备与战役法"
 krcw_wgr_seventy_two_hours:0 "制定七十二小时防御计划"
 krcw_wgr_seventy_two_hours_desc:0 "参谋部的计算从来没有变过：如果战争在清晨开始，共和国要独自撑住七十二小时，巴黎的装甲师才能赶到易北河。前线的十六个师知道这个数字，也知道它意味着什么。"
 krcw_wgr_the_new_staff:0 "组建新参谋部"
 krcw_wgr_the_new_staff_desc:0 "旧总参谋部的档案在东岸，它的军官一半在监狱里。新的参谋部由国际纵队的老兵、西班牙的幸存者和车间委员会推荐的年轻人组成——他们懂政治，正在学战争，而且学得比任何人预料的都快。"
 krcw_wgr_combined:0 "联合兵种研究"
 krcw_wgr_panzer_and_infantry:0 "装甲与步兵"
 krcw_wgr_panzer_and_infantry_desc:0 "鲁尔的钢、巴黎的发动机、德国工程师的图纸。第一个联合兵种师在明斯特成军，演习的结论是：在防御中，一个懂得与步兵协同的装甲营值三个不懂的。"
 krcw_wgr_the_factory_reserves:0 "工厂后备队"
 krcw_wgr_the_factory_reserves_desc:0 "每座鲁尔的工厂维持一个后备营，武器就锁在厂区的军械库里。这是工人民兵制度的延伸，也是一个前线国家能想到的最快的动员办法。"
 krcw_wgr_opart:0 "弹性防御研究"
 krcw_wgr_elastic_defence:0 "弹性防御"
 krcw_wgr_elastic_defence_desc:0 "不在河岸上拼光每一个师，而是让俄罗斯的装甲集团军深入，再从北莱茵与黑森的侧翼切断它。这套打法要求把一部分国土当作战场——这在政治上几乎说不出口，但参谋部坚持它是唯一可行的方案。"
 krcw_ti_bloc_plan_tt:0 "开启军事成长链：干部、后备与战役法"
 krcw_ti_the_bloc_defence_plan:0 "阵营防务计划"
 krcw_ti_the_bloc_defence_plan_desc:0 "国际的小成员单独都守不住自己的边界，可是合起来它们有一百四十多个师、三条山脉和两个海。巴黎的联合参谋部第一次给每个成员分配了明确的任务：谁守山口，谁守海峡，谁提供预备队。"
 krcw_ti_the_shared_academy:0 "共同军校"
 krcw_ti_the_shared_academy_desc:0 "一所设在里昂的联合军校，学员来自意大利、伊比利亚、荷兰、斯堪的纳维亚与爱尔兰。他们用同一套条令、同一套地图符号，毕业后回国指挥自己的师——这比任何条约都更能让一个阵营协同作战。"
 krcw_ti_the_militia_statute:0 "民兵条例"
 krcw_ti_the_militia_statute_desc:0 "每个工团维持一个后备连，装备存在本地，每年集训一个月。对小国来说这是唯一负担得起的办法：战时兵力翻倍，平时几乎不花钱。"
 krcw_ti_terrain:0 "地形作战研究"
 krcw_ti_mountains_and_straits:0 "分配山口与海峡防务"
 krcw_ti_mountains_and_straits_desc:0 "阿尔卑斯的山口、比利牛斯的隘道、丹麦的海峡、爱尔兰海——国际的小成员守的都是这种地形。联合参谋部为每一种地形写了专门的条令，其中有一条是共通的：地形值十个师。"
 krcw_sov_the_okhrana_state:0 "奥克拉那国家"
 krcw_sov_the_okhrana_state_desc:0 "萨文科夫从沙皇的秘密警察那里继承了名字，从自己的地下岁月里继承了方法。他知道每一种阴谋的做法，因为他年轻时全都做过。"
 krcw_sov_the_client_burden:0 "附庸的账单"
 krcw_sov_the_client_burden_desc:0 "东德的赔款、波兰的军备、波斯的油田、朗的美国的军火——协定的每一个成员都在向莫斯科要东西。帝国的代价是按季度付的。"
 krcw_sov_the_veterans_republic:0 "老兵的共和国"
 krcw_sov_the_veterans_republic_desc:0 "两场战争的老兵是这个政权最可靠的支柱：他们分到了土地、优先的工作和在村里说话的分量。他们也是唯一能在萨文科夫死后维持秩序的人。"
 krcw_sov_the_okhrana:0 "奥克拉那"
 krcw_sov_the_okhrana_desc:0 "这个名字是从沙皇那里借来的，方法却是萨文科夫自己的：他年轻时炸过内务大臣的马车，知道一个恐怖组织需要什么才能运转，也知道怎么让它运转不起来。"
 krcw_sov_the_village_bargain:0 "保留村社土地"
 krcw_sov_the_village_bargain_desc:0 "萨文科夫从来没有搞集体化——这是他与红色道路最大的分歧，也是他政权最深的根。村社保有土地，国家收走粮食定额。公平吗？不公平。但没有饥荒。"
 krcw_sov_the_press_statute:0 "新闻条例"
 krcw_sov_the_press_statute_desc:0 "报纸不再逐篇送审，但必须遵守明确的界限。新条例把界限写得很清楚：国家可以批评，元首不可以；政策可以讨论，布列斯特不可以。"
 krcw_sov_the_loyal_intelligentsia:0 "优待技术知识分子"
 krcw_sov_the_loyal_intelligentsia_desc:0 "工程师、医生与教授得到了公寓、配给与出国的机会，代价是不谈政治。大多数人接受了这笔交易。"
 krcw_sov_the_price_of_empire:0 "核算协定的开支"
 krcw_sov_the_price_of_empire_desc:0 "协定看上去是俄罗斯的势力范围，账本上却是另一回事：东德要机床，波兰要坦克，波斯要贷款，朗的美国要军火，而莫斯科要的只是他们别出乱子。"
 krcw_sov_arms_for_the_juniors:0 "向成员国出售旧装备"
 krcw_sov_arms_for_the_juniors_desc:0 "把上一代的坦克与飞机卖给协定的成员，既能收钱，又能让他们的参谋部依赖俄罗斯的零件和条令。这是帝国最便宜的一根锁链。"
 krcw_sov_the_junior_revolt:0 "重新谈判驻军费用"
 krcw_sov_the_junior_revolt_desc:0 "布加勒斯特、贝尔格莱德与安卡拉的代表在协定理事会上第一次联合起来，要求重新谈判赔款与驻军费用。他们没有说\"否则\"，但每个人都听见了。"
 krcw_sov_the_protocols_revised:0 "修订议定书"
 krcw_sov_the_protocols_revised_desc:0 "莫斯科让步一半：赔款减免，驻军费用分担，外交与军备仍由理事会协调。成员国拿到了钱，莫斯科保住了指挥权。"
 krcw_sov_the_accord_general_staff:0 "协定总参谋部"
 krcw_sov_the_accord_general_staff_desc:0 "一个设在明斯克的联合参谋部，协定各国的军官在同一张地图前作业。俄罗斯出总参谋长，附庸国出师。各国都对这个安排有意见，但它能指挥作战。"
 krcw_sov_the_shoes_of_ryazan:0 "整顿轻工业计划"
 krcw_sov_the_shoes_of_ryazan_desc:0 "一份内务部的报告送到萨文科夫桌上：梁赞州去年生产了四十万双鞋，其中三十一万双尺码相同。报告的结论只有一句：这不是产量问题。"
 krcw_sov_the_light_industry_turn:0 "轻工业转向"
 krcw_sov_the_light_industry_turn_desc:0 "把重工业的一部分产能转向轻工业，这在总参谋部看来近乎叛国。萨文科夫的回答是：一个买不到鞋的国家守不住易北河。"
 krcw_sov_the_housing_decade:0 "住房十年"
 krcw_sov_the_housing_decade_desc:0 "十年内为城市工人建造三百万套住房。这些楼房丑陋、狭小、千篇一律，但它们有自来水、暖气和一扇属于自己的门。"
 krcw_sov_the_commercial_courts:0 "商事法庭"
 krcw_sov_the_commercial_courts_desc:0 "托拉斯之间的合同纠纷交给仲裁法庭，而不是部里的电话。这在俄罗斯是新鲜事：一份合同可能比一个人的关系更管用。"
 krcw_sov_60_t:0 "协定理事会上的联合行动"
 krcw_sov_60_d:0 "罗马尼亚、南斯拉夫与土耳其的代表把一份联署备忘录放在理事会桌上：赔款、驻军费用、军备采购价格，逐条要求重谈。三国事先没有通知莫斯科。\n\n萨文科夫的外交人民委员在电话里问了一句：\"他们是在要钱，还是在试探？\"答案是两者都有。"
 krcw_sov_60.a:0 "让步：帝国要靠合作维持"
 krcw_sov_60.b:0 "分化：单独跟每一个谈"
 krcw_sov_60.c:0 "拒绝：提醒他们谁的坦克在他们首都"
 krcw_sov_61_t:0 "三国的答复"
 krcw_sov_61_d0:0 "单独谈判奏效了。安卡拉先签了字：驻军费用减免三成，换取海峡问题上与莫斯科协调立场。布加勒斯特和贝尔格莱德得知消息后撤回了联署备忘录，各自派代表来莫斯科谈自己的条件。"
 krcw_sov_61_d1:0 "强硬的答复起了作用。罗马尼亚代表在下一次理事会上宣读了一份声明，称联署备忘录\"只是一份讨论稿\"。南斯拉夫和土耳其没有再提。驻布加勒斯特的俄军司令部报告，当地报纸已经不再讨论赔款。"
 krcw_sov_61_d2:0 "三国没有退让。罗马尼亚与南斯拉夫的代表缺席了下两次理事会，贝尔格莱德的报纸开始刊登赔款的具体数字。土耳其外交部长在记者会上说，安卡拉\"愿意与任何尊重海峡主权的国家谈判\"，这句话在巴黎被逐字转发。"
 krcw_sov_61.a:0 "把土耳其的协议当作样板"
 krcw_sov_61.b:0 "让步一半，把他们请回理事会"
 krcw_sov_61.c:0 "不让步，让他们自己回来"
 krcw_sov_61.d:0 "他们记住了"
 krcw_sov_62_t:0 "第一次仲裁"
 krcw_sov_62_d:0 "乌拉尔机械托拉斯起诉顿巴斯煤业托拉斯违约供煤，要求赔偿。被告的总经理是内战的老兵，原告的总工程师是科学院院士。仲裁法庭的三名法官里有两名从前是律师——这在俄罗斯已经三十年没有发生过。\n\n判决本身不重要。重要的是双方都接受了判决。"
 krcw_sov_62.a:0 "让法庭继续开下去"
 krcw_sov_62.b:0 "把纠纷收回部里解决"
 krcw_fra_the_shop_floor_plan:0 "车间的计划"
 krcw_fra_the_shop_floor_plan_desc:0 "计划总署不再下达指标，而是收集各车间提出的产量与需求，再把它们对上。这套办法慢得让工程师抓狂，但没有人再假报数字——因为数字是自己报的。"
 krcw_fra_the_reckoning_with_algiers:0 "与阿尔及尔的清算"
 krcw_fra_the_reckoning_with_algiers_desc:0 "公社宣布殖民主义已被革命废除，可是阿尔及利亚的省份仍然由巴黎派出的专员治理。二十八年来没有人愿意先说出那个词：这也是殖民地。"
 krcw_fra_the_cultural_front:0 "文化战线"
 krcw_fra_the_cultural_front_desc:0 "电影、爵士、画报与足球。公社发现一件让老一代干部难以接受的事：一支拿过世界杯的球队比一百场演讲更能巩固政权。"
 krcw_fra_the_generation_of_the_congress:0 "代表大会的一代"
 krcw_fra_the_generation_of_the_congress_desc:0 "一九四九年在劳动交易所投票的人，到一九五三年都过了六十岁。接班的这批人没有见过街垒，只见过预算表——他们对革命的理解是\"把它办成\"。"
 krcw_fra_the_second_generation:0 "培养第二代干部"
 krcw_fra_the_second_generation_desc:0 "弗拉雄六十七岁，代表大会主席团的平均年龄五十九岁。革命二十八年之后，一个尴尬的问题开始在走廊里流传：接班的人在哪里，他们凭什么接班？"
 krcw_fra_the_workshop_schools:0 "车间学校"
 krcw_fra_the_workshop_schools_desc:0 "每个大厂办一所技术学校，学生上午做工下午上课。这套制度培养出的工程师既懂机床也懂车间政治——公社的干部从此不再从党校里来。"
 krcw_fra_the_womens_charter:0 "妇女宪章"
 krcw_fra_the_womens_charter_desc:0 "同工同酬写进了劳动宪章，可是车间委员会里的女代表只占十一分之一。新宪章规定：任何委员会的性别比例不得低于该车间的实际比例。老工人说这是形式主义，女工说形式主义也比没有好。"
 krcw_fra_the_cultural_front_focus:0 "文化战线"
 krcw_fra_the_cultural_front_focus_desc:0 "公社停止了对爵士乐的批判，开始给它发放演出许可。电影厂拍的不再只是革命史，还有侦探片和爱情片。老干部在代表大会上抗议，年轻代表投票赞成。"
 krcw_fra_the_consumer_question:0 "增加消费品产能"
 krcw_fra_the_consumer_question_desc:0 "重建结束了，机床出口世界第一，可是里尔的工人要等十四个月才能买到一台冰箱。计划总署的报告承认：我们把产能都放在了生产资料上。"
 krcw_fra_the_shop_floor_plan_focus:0 "改由车间上报计划"
 krcw_fra_the_shop_floor_plan_focus_desc:0 "指标改由车间上报产量与需求，计划总署负责汇总和对账。"
 krcw_fra_housing_for_the_communes:0 "兴建公社住宅"
 krcw_fra_housing_for_the_communes_desc:0 "巴黎红带的棚户区还住着三十万人。新的住房计划十年内建造一百万套——建筑师是年轻人，风格粗野，但每一套都有热水。"
 krcw_fra_the_consumer_turn:0 "消费品转向"
 krcw_fra_the_consumer_turn_desc:0 "代表大会通过决议：下一个五年，冰箱、洗衣机、汽车与电视机的产量翻四倍。总参谋部反对，工会代表鼓掌——这是公社第一次在大炮与黄油之间公开选择了黄油。"
 krcw_fra_the_european_clearing_zone:0 "欧洲清算区"
 krcw_fra_the_european_clearing_zone_desc:0 "清算联盟从国际内部的结算机制变成了一个真正的货币区：劳动单位可以在巴黎、伦敦、罗马、马德里与汉堡之间自由结算。这比任何条约都更牢固地把这些国家绑在一起。"
 krcw_fra_the_word_no_one_says:0 "讨论阿尔及利亚独立"
 krcw_fra_the_word_no_one_says_desc:0 "阿尔及利亚三省名义上是法国领土，实际由巴黎派专员治理，当地工会在代表大会只有观察员席位。阿尔及尔代表公开称之为殖民地。"
 krcw_fra_the_algiers_statute:0 "阿尔及尔章程"
 krcw_fra_the_algiers_statute_desc:0 "阿尔及利亚成为公社内的自治联合会，拥有本地代表大会、工会、语言和学校，外交与国防仍归巴黎。"
 krcw_fra_the_departments_are_france:0 "省就是法国"
 krcw_fra_the_departments_are_france_desc:0 "内政部的立场从未改变：阿尔及利亚的三个省和罗讷省一样是法国的一部分，讨论自治等于讨论分裂。为了证明这一点，巴黎向阿尔及利亚增派了两个师。"
 krcw_fra_the_sahara_and_the_south:0 "撒哈拉与南方"
 krcw_fra_the_sahara_and_the_south_desc:0 "哈西迈萨乌德的石油和撒哈拉的试验场让阿尔及利亚从一个政治问题变成一个战略资产。无论巴黎怎么处理自治问题，这两样东西都不能放手。"
 krcw_fra_60_t:0 "爵士与革命"
 krcw_fra_60_d:0 "代表大会为一件小事吵了两天：要不要允许美国的爵士唱片进口。老一代说那是资本主义的颓废音乐；年轻代表指出，那是黑人工人的音乐，而且里尔的工人已经在听了——从工团自己的电台上听。\n\n一个五十岁的代表在发言的最后说了一句让全场笑起来的话：\"同志们，我们赢得了两场战争，难道会输给一支萨克斯管？\""
 krcw_fra_60.a:0 "开放：文化不需要保护"
 krcw_fra_60.b:0 "有限开放：工团自己录制"
 krcw_fra_62_t:0 "大炮还是黄油"
 krcw_fra_62_d:0 "总参谋部把一份备忘录送到代表大会：如果消费品产能翻四倍，一九五三年代的坦克产量将下降三分之一，而易北河对面的俄罗斯不会因为法国工人买到了冰箱就少一个师。\n\n工会的答复同样直接：如果工人买不到冰箱，他们会开始问革命到底给了他们什么。两份文件都有道理，而代表大会只能选一个。"
 krcw_fra_62.a:0 "黄油：工人先买得到东西"
 krcw_fra_62.b:0 "大炮：易北河不等人"
 krcw_fra_62.c:0 "两者兼顾：延长工作周"
 krcw_fra_64_t:0 "阿尔及尔的代表"
 krcw_fra_64_d:0 "那个说出\"殖民地\"一词的代表叫穆罕默德·本·阿里，阿尔及尔港的码头工会书记，一九三六年就加入了工团。他在讲台上讲了四十分钟，没有喊口号，只念了一串数字：阿尔及利亚有三百万穆斯林工人，代表大会里有十一个阿尔及利亚代表，其中九个是欧洲人。\n\n他讲完之后，主席团宣布休会一小时。所有人都知道，休会结束后要么给出一个答案，要么这个问题会自己找到答案。"
 krcw_fra_64.a:0 "给阿尔及利亚平等的代表权"
 krcw_fra_64.b:0 "成立调查委员会（拖延）"
 krcw_fra_64.c:0 "这是内部事务，不容讨论"
 krcw_eng_the_congress_governs:0 "大会执政"
 krcw_eng_the_congress_governs_desc:0 "总工会大会曾经是一个施压的机构，现在它是国家本身。开会的人还是那些人，可是他们面前的文件从罢工通告变成了预算草案——不列颠的革命者发现，管一个国家比推翻一个国家难得多。"
 krcw_eng_the_post_imperial_economy:0 "后帝国经济"
 krcw_eng_the_post_imperial_economy_desc:0 "帝国留下的不只是耻辱，还有一套为殖民地贸易而建的经济：兰开夏的纺织厂等着印度的棉花，格拉斯哥的船厂等着帝国的订单。现在两样都没有了，机器还在那里。"
 krcw_eng_the_maritime_commitment:0 "海洋的责任"
 krcw_eng_the_maritime_commitment_desc:0 "国际的补给线全在海上：法国的机床、意大利的粮食、中国的钨砂、美洲工团的卡车。守住这些航线是不列颠在这个阵营里唯一无人能替的工作。"
 krcw_eng_after_the_old_guard:0 "老卫队之后"
 krcw_eng_after_the_old_guard_desc:0 "一九二五年在街垒上的那批人正在退场。接班的是在工团学校里长大的一代：他们没打过巷战，但他们懂统计、懂机床、也懂怎么在大会上数票。"
 krcw_eng_the_congress_as_state:0 "由代表大会直接执政"
 krcw_eng_the_congress_as_state_desc:0 "总工会大会每年开会两周，决定预算、外交与国防。其余五十周，一个由各行业联合会派出的执行委员会管着这个国家。这套制度效率不高，但它从来没有产生过一个独裁者。"
 krcw_eng_the_scottish_assembly:0 "苏格兰大会"
 krcw_eng_the_scottish_assembly_desc:0 "克莱德的船厂工人从来觉得伦敦离他们太远。新的章程给苏格兰一个自己的产业大会，管本地的煤、船与铁路——条件是国防与外交仍归伦敦。"
 krcw_eng_the_welsh_federation:0 "威尔士联合会"
 krcw_eng_the_welsh_federation_desc:0 "南威尔士的矿工工会是不列颠最激进的组织，一九二六年就是他们先动的手。给他们一个自治的煤业联合会，既是承认历史，也是把最难管的一群人纳进体制。"
 krcw_eng_the_handover:0 "交班"
 krcw_eng_the_handover_desc:0 "温特林厄姆一九〇五年生，一九二五年在曼彻斯特的街垒上，一九三七年在西班牙。到一九五三年代，大会里超过一半的代表比革命本身年轻——他们对革命的忠诚是学来的，不是打出来的。"
 krcw_eng_the_mills_without_cotton:0 "救济兰开夏纺织业"
 krcw_eng_the_mills_without_cotton_desc:0 "兰开夏的纺织机是为印度的棉花设计的，而印度现在是王公的联邦，站在莫斯科那一边。曼彻斯特的失业率是全国最高的，而失业的人都是最早支持革命的人。"
 krcw_eng_retool:0 "北方改装计划"
 krcw_eng_retool_the_north:0 "改造北方工业"
 krcw_eng_retool_the_north_desc:0 "把纺织厂改成机械厂、把棉纺工人送进技校。这项计划要花十年和一大笔钱，可是替代方案是让兰开夏变成一片工业废墟。"
 krcw_eng_newtrades:0 "新兴行业"
 krcw_eng_the_new_trades:0 "发展新兴行业"
 krcw_eng_the_new_trades_desc:0 "航空、电子、化工、汽车——不列颠在这些行业里落后于法国，但它有一样别人没有的东西：一百年的机械工人传统。问题只是把他们从旧机器旁边挪开。"
 krcw_eng_the_atlantic_trade:0 "大西洋贸易"
 krcw_eng_the_atlantic_trade_desc:0 "帝国的市场没有了，可是美洲工团联合会需要机床、意大利需要煤、中国需要船。清算联盟的账本上，不列颠第一次成了净出口国。"
 krcw_eng_the_lanes_of_the_internationale:0 "承担国际航线防务"
 krcw_eng_the_lanes_of_the_internationale_desc:0 "国际靠海运维系，海军几乎全是不列颠的。把阵营航线防务正式列为不列颠海军的首要任务。"
 krcw_eng_escort:0 "护航技术"
 krcw_eng_the_escort_groups:0 "护航支队"
 krcw_eng_the_escort_groups_desc:0 "俄国潜艇是其海军最危险的部分。组建大量廉价的护航支队，配备雷达、声呐和直升机。"
 krcw_eng_carrier:0 "航母技术"
 krcw_eng_the_carrier_question:0 "决定航母数量"
 krcw_eng_the_carrier_question_desc:0 "海军部要六艘舰队航母，预算委员会只批三艘。争论的实质是不列颠是否还要保留全球投送能力。"
 krcw_eng_the_fleet_of_the_bloc:0 "组建联合舰队司令部"
 krcw_eng_the_fleet_of_the_bloc_desc:0 "不列颠、法国、意大利与伊比利亚的海军在同一个指挥部下演习。英国出航母与护航支队，法国出潜艇，意大利与伊比利亚出近海舰艇——这是国际第一支真正的联合舰队。"
 krcw_eng_the_arctic_convoys:0 "北极航线"
 krcw_eng_the_arctic_convoys_desc:0 "如果战争来临，挪威与丹麦的生存取决于一条穿过北海和挪威海的航线。海军部在斯卡帕湾和特隆赫姆之间画了一条线，并且开始每年在冬天演练它。"
 krcw_eng_the_two_republics:0 "讨论与爱尔兰合并"
 krcw_eng_the_two_republics_desc:0 "阿尔斯特的问题解决之后，一个更大的问题浮上来：不列颠联邦与爱尔兰工人共和国同属一个国际，说同一种语言，卖同样的煤和船。为什么还是两个国家？"
 krcw_eng_the_isles_compact:0 "群岛公约"
 krcw_eng_the_isles_compact_desc:0 "与爱尔兰签订群岛公约：共同关税、共同电网、共同渔区，两国工会相互承认。政治统一暂不讨论。"
 krcw_eng_the_commonwealth_of_labour:0 "劳动联邦"
 krcw_eng_the_commonwealth_of_labour_desc:0 "旧自治领各走各路：加拿大成为工团共和国，澳新追随流亡王室，南非由白人少数统治。提议成立劳动共同体，联系各地的工人组织。"
 krcw_eng_technocrat:0 "统计局的方法"
 krcw_eng_60_t:0 "温特林厄姆之后"
 krcw_eng_60_d:0 "大会的走廊里流传着三个名字：一个是一九二五年街垒上的老同志，克莱德船厂工会的书记；一个是计划局的统计学家，四十三岁，从来没参加过罢工；还有一个是南威尔士矿工工会的女书记，她父亲死在一九二六年的大罢工里。\n\n温特林厄姆本人一句话也不说。他知道他一开口，这件事就不再是大会的决定了。"
 krcw_eng_60.a:0 "街垒的一代：克莱德的老同志"
 krcw_eng_60.b:0 "计划的一代：统计学家"
 krcw_eng_60.c:0 "矿工的一代：南威尔士的女书记"
 krcw_eng_62_t:0 "都柏林的答复"
 krcw_eng_62_d:0 "爱尔兰工人共和国的答复礼貌而坚决：他们欢迎公约、关税同盟与渔业协定，但\"统一\"这个词在都柏林有八百年的历史，现在还不是提它的时候。\n\n奥唐奈在私下里对英国特使说了一句更直接的话：\"我们刚刚从你们手里拿回阿尔斯特。让我们先享受二十年再说。\""
 krcw_eng_62.a:0 "接受：先做公约，统一留给下一代"
 krcw_eng_62.b:0 "继续推动统一"
 krcw_eng_64_t:0 "劳动联邦大会"
 krcw_eng_64_d:0 "第一届劳动联邦大会在伦敦开幕，来的代表比预期的多：加拿大的工团、印度的纺织工会（王公政府并不知情）、西非联邦、东非联邦、锡兰、还有两个从澳大利亚偷偷过来的码头工会代表。\n\n会议没有通过任何有约束力的决议，但它做了一件更重要的事：它证明了帝国解体之后，那些语言、法律与铁路留下的联系还在——只是现在连接它们的是工会，而不是总督。"
 krcw_eng_64.a:0 "把它办成常设机构"
 krcw_eng_64.b:0 "保持松散，避免激怒莫斯科"
 krcw_integration_step_tt:0 "§Y欧洲一体化进程 +1§!"
 krcw_integration:0 "欧洲一体化进程"
 krcw_eu_clearing_member:0 "清算联盟成员"
 krcw_eu_clearing_member_desc:0 "巴黎的总账上，每个成员都有一页。赤字国不必紧缩，盈余国不能囤积——黄金退场，劳动单位登场。这是国际经济学最激进的实验，而它已经运转了八年。"
 krcw_eu_common_plan:0 "共同计划"
 krcw_eu_common_plan_desc:0 "钢、煤、机床与铁路车辆的产量由一个跨国委员会分配。效率高得惊人，代价也很清楚：里尔的车间委员会再也不能单独决定自己明年生产什么。"
 krcw_eu_labour_parliament:0 "劳动议会"
 krcw_eu_labour_parliament_desc:0 "每个成员按工会会员数派出代表，议会在斯特拉斯堡开会。它的决议对各国联合会有约束力——这是第一个凌驾于民族国家之上的工人机构。"
 krcw_eu_shop_floor_veto:0 "车间的否决权"
 krcw_eu_shop_floor_veto_desc:0 "一体化的代价被写进了章程的最后一条：任何跨国计划，若被三分之一以上的地方联合会否决，必须重新协商。欧洲的计划从此慢了一倍，但它是工人的计划。"
 krcw_fra_the_clearing_union_step:0 "扩展清算联盟"
 krcw_fra_the_clearing_union_step_desc:0 "清算联盟已经运转了八年，账面上的劳动单位比黄金更可信。巴黎的经济学家提出了一个从前不敢提的问题：如果结算可以跨国，为什么计划不可以？"
 krcw_fra_the_division_of_labour:0 "参加机床分工"
 krcw_fra_the_division_of_labour_desc:0 "法国放弃了一部分自己的机床产能，换来意大利的汽车与不列颠的船。这在民族国家之间叫贸易，在国际里叫分工。区别在于分工要由一个共同的委员会决定。"
 krcw_fra_the_common_plan:0 "加入共同计划"
 krcw_fra_the_common_plan_desc:0 "把本国的钢、煤与机床产能交给跨国委员会分配。收益是整个大陆的市场与规模，代价是本国车间委员会失去了对自己产量的最终发言权。这是一体化真正的门槛。过了它，主权就不只是让出一部分了。"
 krcw_eng_the_clearing_union_step:0 "伦敦与总账"
 krcw_eng_the_clearing_union_step_desc:0 "不列颠的银行家曾经统治过世界的结算。他们的孙子现在在清算联盟的办公室里工作，用劳动单位记账——老行长们说这是堕落，年轻人说这至少还是记账。"
 krcw_eng_the_division_of_labour:0 "加入海运共同池"
 krcw_eng_the_division_of_labour_desc:0 "不列颠把商船队并入国际的共同池：船还挂着自己的旗，但航线、货载与运价由联合会统一调配。这是不列颠对一体化最实质的贡献，也是它最难交出的东西。"
 krcw_eng_the_common_plan:0 "加入共同计划"
 krcw_eng_the_common_plan_desc:0 "把本国的钢、煤与机床产能交给跨国委员会分配。收益是整个大陆的市场与规模，代价是本国车间委员会失去了对自己产量的最终发言权。这是一体化真正的门槛。过了它，主权就不只是让出一部分了。"
 krcw_wgr_the_clearing_union_step:0 "鲁尔与总账"
 krcw_wgr_the_clearing_union_step_desc:0 "鲁尔的煤和钢是整个国际工业的基础。把它们放进共同计划，等于把西德最后一张牌交出去——也等于让任何人都无法再单独封锁它。"
 krcw_wgr_the_division_of_labour:0 "煤钢共同体"
 krcw_wgr_the_division_of_labour_desc:0 "鲁尔、洛林、萨尔与上西里西亚的煤钢产能合为一个联合体。这个方案在旧世界曾被提出过，当时它是为了防止德法再打仗；现在提出它，是因为两国的工人已经在同一个工会里。"
 krcw_wgr_the_common_plan:0 "加入共同计划"
 krcw_wgr_the_common_plan_desc:0 "把本国的钢、煤与机床产能交给跨国委员会分配。收益是整个大陆的市场与规模，代价是本国车间委员会失去了对自己产量的最终发言权。这是一体化真正的门槛。过了它，主权就不只是让出一部分了。"
 krcw_tim_the_clearing_union_step:0 "争取共同计划订单"
 krcw_tim_the_clearing_union_step_desc:0 "小成员在一体化里得到的比失去的多：它们太小，撑不起完整的工业体系，而共同计划让丹麦的船厂、荷兰的电器厂与挪威的铝厂都拿到了整个大陆的订单。"
 krcw_tim_the_division_of_labour:0 "登记专长行业"
 krcw_tim_the_division_of_labour_desc:0 "每个小成员在共同计划里登记自己的专长：丹麦的船、荷兰的电器、挪威的铝、爱尔兰的食品、比利时的化工。分工写进了文件，从此不必每年重新争一次。"
 krcw_tim_the_common_plan:0 "加入共同计划"
 krcw_tim_the_common_plan_desc:0 "把本国的钢、煤与机床产能交给跨国委员会分配。收益是整个大陆的市场与规模，代价是本国车间委员会失去了对自己产量的最终发言权。这是一体化真正的门槛。过了它，主权就不只是让出一部分了。"
 krcw_eu_the_strasbourg_congress:0 "斯特拉斯堡大会"
 krcw_eu_the_strasbourg_congress_desc:0 "一九五三年，国际欧洲成员的工会联合会在斯特拉斯堡召开联席大会，讨论是否建立具有约束力的劳动议会。"
 krcw_eu_the_parliament_of_labour:0 "劳动议会"
 krcw_eu_the_parliament_of_labour_desc:0 "代表按工会会员数分配，不按人口，也不按国界。法国最大，其次是不列颠与德意志社会主义共和国；丹麦与卢森堡加起来只有七席，但它们的票和别人的一样重。"
 krcw_eu_the_council_of_federations:0 "联合会理事会"
 krcw_eu_the_council_of_federations_desc:0 "不建议会，只建理事会：每国一票，决议需一致通过。这保住了每个成员的否决权，代价是一体化从此只能以最慢的那一个成员的速度前进。"
 krcw_eu_the_shop_floor_charter:0 "车间宪章"
 krcw_eu_the_shop_floor_charter_desc:0 "一体化最大的阻力来自车间。颁布车间宪章：三分之一的地方联合会可以否决任何跨国计划。"
 krcw_eu_the_federation_of_labour:0 "欧洲劳动联邦"
 krcw_eu_the_federation_of_labour_desc:0 "欧洲劳动联邦章程生效：共同计划、共同货币单位、共同议会，各成员保留退出权和车间否决权。"
 krcw_eui_1_t:0 "斯特拉斯堡的辩论"
 krcw_eui_1_d:0 "辩论持续了九天。法国的代表团主张一个有实权的议会，理由是没有约束力的机构什么也做不成；不列颠的代表团反对，理由同样充分——一个能约束不列颠工会的外国机构，在曼彻斯特是卖不出去的。\n\n真正的分歧在第七天才被说清楚：这不是国家之间的争论，而是\"更大的计划\"与\"车间自治\"之间的争论，而这两样东西都是革命许诺过的。"
 krcw_eui_1.a:0 "有实权的议会"
 krcw_eui_1.b:0 "一致通过的理事会"
 krcw_eui_1.c:0 "两院制：议会加车间否决权"
 krcw_eui_2_t:0 "联邦成立之日"
 krcw_eui_2_d:0 "章程在斯特拉斯堡签署的那天，巴黎、伦敦、罗马、马德里、汉堡、哥本哈根与都柏林的工厂同时停工一小时。不是罢工——是各国联合会一致通过的庆祝。\n\n一个记者问弗拉雄，这算不算欧洲统一。他说：\"欧洲的国王和皇帝试了四百年没做成的事，工会用了十六年。因为我们要统一的不是领土，是车间。\""
 krcw_eui_2.a:0 "欧洲的工人有了自己的大陆"
 krcw_eui_10_t:0 "交出产量的决定"
 krcw_eui_10_d:0 "共同计划的第一份分配表送到了各国的联合会。表上写着明年该生产多少钢、多少机床、多少车辆——数字是合理的，效率是明显的，可是没有一个车间委员会投票通过过它。\n\n一个老工人在联合会大会上问了一个没人答得上来的问题：\"我们一九二一年夺取工厂，是为了让巴黎的委员会替我们决定，还是为了自己决定？\""
 krcw_eui_10.a:0 "接受分配表：规模就是力量"
 krcw_eui_10.b:0 "接受，但要求车间否决权"
 krcw_eui_11_t:0 "交出产量的决定"
 krcw_eui_11_d:0 "共同计划的第一份分配表送到了各国的联合会。表上写着明年该生产多少钢、多少机床、多少车辆——数字是合理的，效率是明显的，可是没有一个车间委员会投票通过过它。\n\n一个老工人在联合会大会上问了一个没人答得上来的问题：\"我们一九二一年夺取工厂，是为了让巴黎的委员会替我们决定，还是为了自己决定？\""
 krcw_eui_11.a:0 "接受分配表：规模就是力量"
 krcw_eui_11.b:0 "接受，但要求车间否决权"
 krcw_eui_12_t:0 "交出产量的决定"
 krcw_eui_12_d:0 "共同计划的第一份分配表送到了各国的联合会。表上写着明年该生产多少钢、多少机床、多少车辆——数字是合理的，效率是明显的，可是没有一个车间委员会投票通过过它。\n\n一个老工人在联合会大会上问了一个没人答得上来的问题：\"我们一九二一年夺取工厂，是为了让巴黎的委员会替我们决定，还是为了自己决定？\""
 krcw_eui_12.a:0 "接受分配表：规模就是力量"
 krcw_eui_12.b:0 "接受，但要求车间否决权"
 krcw_eui_13_t:0 "交出产量的决定"
 krcw_eui_13_d:0 "共同计划的第一份分配表送到了各国的联合会。表上写着明年该生产多少钢、多少机床、多少车辆——数字是合理的，效率是明显的，可是没有一个车间委员会投票通过过它。\n\n一个老工人在联合会大会上问了一个没人答得上来的问题：\"我们一九二一年夺取工厂，是为了让巴黎的委员会替我们决定，还是为了自己决定？\""
 krcw_eui_13.a:0 "接受分配表：规模就是力量"
 krcw_eui_13.b:0 "接受，但要求车间否决权"
 krcw_ent_the_tasman_compact:0 "塔斯曼公约"
 krcw_ent_the_tasman_compact_desc:0 "共同的关税、共同的航运、共同的羊毛销售局。两个自治领仍然是两个国家，但在经济上它们已经分不开了——惠灵顿的预算有四分之一取决于悉尼的决定。"
 krcw_ent_the_pacific_federation:0 "太平洋联邦"
 krcw_ent_the_pacific_federation_desc:0 "一个议会、一支军队、一面新的国旗——南十字星留了下来，联合王国的旗角去掉了。惠灵顿保留了自己的省议会，也保留了在联邦议会里永远不够用的席位数。"
 krcw_ent_the_junior_dominion:0 "次等自治领"
 krcw_ent_the_junior_dominion_desc:0 "新西兰有六个省、一支两艘巡洋舰的海军和一个在墨尔本没有多少分量的代表。它的忠诚从来不成问题，它的意见从来不算数——这两件事有因果关系。"
 krcw_ent_the_tasman_question:0 "讨论澳新合并"
 krcw_ent_the_tasman_question_desc:0 "澳大利亚和新西兰制度相同，讨论是否合并为一个国家。新西兰担心合并后由澳大利亚说了算。"
 krcw_ent_the_tasman_compact_f:0 "塔斯曼公约"
 krcw_ent_the_tasman_compact_f_desc:0 "不合并，但把两国的经济连成一体：共同关税、共同航运、共同的羊毛与冻肉销售局，两国公民自由往来与就业。主权一分不让，好处一分不少——这是新西兰能接受的最大限度。"
 krcw_ent_the_federation_act:0 "联邦法案"
 krcw_ent_the_federation_act_desc:0 "两国议会通过联邦法案：一个议会、一支军队、一部宪法。新西兰各省保留地方议会和法院，并获得固定席位和财政拨款。"
 krcw_ent_one_parliament:0 "召开联邦议会"
 krcw_ent_one_parliament_desc:0 "第一届联邦议会在堪培拉开幕，一百二十席里新西兰占二十二席。惠灵顿的报纸算过一笔账：即使所有新西兰议员一致投票，他们也无法否决任何议案。这笔账每个新西兰人都会算。"
 krcw_ent_the_southern_dominion_navy:0 "南方自治领海军"
 krcw_ent_the_southern_dominion_navy_desc:0 "无论合并与否，两国的海军必须合为一支：塔斯曼海以东以西的所有航线都靠这十几艘军舰。指挥权归澳大利亚，这一点从来没有争论过——因为船是澳大利亚造的。"
 krcw_ent_40_t:0 "惠灵顿的算术"
 krcw_ent_40_d:0 "新西兰内阁为此开了两天会。财政部长的报告很直白：联邦能带来澳大利亚的市场、澳大利亚的资本与澳大利亚海军的保护，而新西兰在联邦议会里最多能拿到五分之一的席位。\n\n总理在会议结束时说了一句话：\"问题不是我们会不会过得更好。问题是过得更好之后，我们还是不是我们。\""
 krcw_ent_40.a:0 "经济一体化，但保持主权"
 krcw_ent_40.b:0 "认真谈联邦"
 krcw_ent_42_t:0 "太平洋联邦成立"
 krcw_ent_42_d:0 "一九五一年一月一日，太平洋联邦在堪培拉宣告成立。两个自治领的国旗同时降下，新的旗帜升起——南十字星还在，联合王国的旗角没有了。\n\n流亡的王室出席了仪式，但没有讲话。一个英国记者注意到，新宪法的正文里\"国王\"这个词只出现了两次，而且都在附则里。协约国的法统还在，只是它现在住在别人的房子里，而房东刚刚换了锁。"
 krcw_ent_42.a:0 "一个国家，一支军队"
 KRCW_AST_PACFED:0 "太平洋联邦"
 KRCW_AST_PACFED_DEF:0 "太平洋联邦"
 KRCW_AST_PACFED_ADJ:0 "太平洋"
 krcw_ma_regional_partner:0 "地区伙伴"
 krcw_ma_territorial_grievance:0 "领土宿怨"
 krcw_ma_the_window_west:0 "向西的窗口"
 krcw_ma_cordon_doctrine:0 "警戒线学说"
 krcw_ma_cordon_doctrine_desc:0 "莫斯科把它的小盟友想象成一道防波堤：不需要它们赢，只需要它们在俄罗斯的坦克赶到之前撑住。"
 krcw_ma_collective_bargaining:0 "集体议价"
 krcw_ma_collective_bargaining_desc:0 "一个协定小国在莫斯科面前无足轻重，十一个协定小国站在一起，莫斯科就不能不听。"
 krcw_ma_the_open_window:0 "敞开的窗户"
 krcw_ma_the_open_window_desc:0 "缓冲区第一次向两边同时敞开了窗户。生意人先来，然后是记者，然后是外交官。"
 krcw_ma_reigning_monarch:0 "亲政的君主"
 krcw_ma_reigning_monarch_desc:0 "国王不再只是墙上的画像。他主持内阁，签署法律，也承担起了责任——这是一场豪赌。"
 krcw_ma_colonels_in_office:0 "当权的上校"
 krcw_ma_colonels_in_office_desc:0 "紧急状态没有结束的一天。上校们说，只要边界那侧还有一支公社军队，紧急状态就必须继续。"
 krcw_ma_national_arsenal:0 "本国兵工厂"
 krcw_ma_national_arsenal_desc:0 "“不得改进俄制图纸”——这一条从来没人真守过。本国的工程师把它们拆开，按自己的需要装回去。"
 krcw_ma_frontier_fortress:0 "边境要塞"
 krcw_ma_frontier_fortress_desc:0 "缓冲区存在的意义就是被打烂——除非它足够坚硬。边境的混凝土一年年加厚。"
 krcw_ma_mountain_war_school:0 "山地作战学校"
 krcw_ma_mountain_war_school_desc:0 "喀尔巴阡、巴尔干、兴都库什、蒙古高原——协定的成员大多守着难走的地形。为它训练部队。"
 krcw_ma_air_defence_net:0 "防空网"
 krcw_ma_air_defence_net_desc:0 "国际的轰炸机从对岸起飞只需一小时。买不起截击机联队，就用俄罗斯的雷达与高射炮罩住城市。"
 krcw_ma_national_bank_2:0 "稳固的通货"
 krcw_ma_national_bank_2_desc:0 "本国货币在世界市场上一文不值，卢布贷款利率高昂。一家像样的国家银行至少能让预算按时公布。"
 krcw_ma_resource_concessions:0 "资源特许"
 krcw_ma_resource_concessions_desc:0 "罗马尼亚的石油、南斯拉夫的铝土、土耳其的铬——莫斯科要它们，也肯为它们付钱，只是从不肯付够。"
 krcw_ma_partisan_country:0 "游击队的国度"
 krcw_ma_partisan_country_desc:0 "希腊的品都斯山、南斯拉夫的迪纳拉山里，公社的游击队从来没有被真正肃清过。反游击战是一门永远学不完的功课。"
 krcw_ma_transit_state:0 "过境走廊"
 krcw_ma_transit_state_desc:0 "铁路和公路在和平时期运粮食，战争时期运坦克。莫斯科出钱修，也保留了随时使用的权利。"
 krcw_ma_modern_officer_corps:0 "现代军官团"
 krcw_ma_modern_officer_corps_desc:0 "伏龙芝学院的进修班回来了一批年轻军官，带着新的操典，也带着一些莫斯科没打算教给他们的想法。"
 krcw_ma_the_shield_of_the_east:0 "东方之盾"
 krcw_ma_the_shield_of_the_east_desc:0 "我们接受了自己的角色：站在最前线，替莫斯科挡住第一击。作为回报，协定最好的装备第一批就运到我们手里。"
 krcw_ma_the_warsaw_protocols:0 "华沙议定书"
 krcw_ma_the_warsaw_protocols_desc:0 "协定的联合参谋部在华沙签署了一系列议定书：统一的口径、统一的铁轨、统一的作战计划。我们交出了独立指挥权，换来了不被抛弃的保证。"
 krcw_ma_the_marshal_of_the_frontier:0 "接受协定元帅军衔"
 krcw_ma_the_marshal_of_the_frontier_desc:0 "莫斯科授予我们的总司令协定元帅的军衔。这既是荣誉，也是枷锁——从此他既向本国政府负责，也向华沙的联合参谋部负责。"
 krcw_ma_reward_of_loyalty:0 "领取忠诚的回报"
 krcw_ma_reward_of_loyalty_desc:0 "莫斯科兑现了承诺：一座现代化的坦克厂、一个飞行团、以及对本国边界的正式保证。忠诚，至少这一次，得到了回报。"
 krcw_ma_the_juniors_league:0 "次要国联盟"
 krcw_ma_the_juniors_league_desc:0 "协定里的小国厌倦了被莫斯科当成筹码。它们私下里达成默契：在莫斯科面前，我们互相支持。"
 krcw_ma_shared_industry:0 "共享工业"
 krcw_ma_shared_industry_desc:0 "一国造发动机，一国造车体，一国造光学仪器。次要国联盟的产业分工让每个成员都造得起从前造不起的东西。"
 krcw_ma_the_league_staff:0 "联盟参谋部"
 krcw_ma_the_league_staff_desc:0 "联盟成立了自己的联合参谋部——不与华沙对抗，而是让华沙不能各个击破。协定的小国第一次有了集体的军事声音。"
 krcw_ma_bargain_with_moscow:0 "与莫斯科议价"
 krcw_ma_bargain_with_moscow_desc:0 "联盟带着一份共同清单去了莫斯科：更公道的资源价格、更少的驻军、本国指挥本国的师。莫斯科皱着眉头，但也第一次坐下来谈。"
 krcw_ma_the_league_charter:0 "联盟宪章"
 krcw_ma_the_league_charter_desc:0 "一份正式的宪章把默契变成了制度：共同的关税、共同的防空、共同的外交立场。协定之内，出现了一个协定。"
 krcw_ma_quiet_contacts:0 "接受西方的秘密贷款"
 krcw_ma_quiet_contacts_desc:0 "一家瑞士银行代表巴黎的清算联盟提供一笔不公开的贷款，用于本国的机床进口。条件没有写在合同里，但每个人都知道对方要什么。奥克拉那已经在调查这笔钱。"
 krcw_ma_trade_both_ways:0 "向两个集团同时要价"
 krcw_ma_trade_both_ways_desc:0 "政府让莫斯科知道巴黎的报价，也让巴黎知道莫斯科的。两边都加码，协定的团结则少了一分。"
 krcw_ma_the_neutral_temptation:0 "试探中立"
 krcw_ma_the_neutral_temptation_desc:0 "如果我们既不属于巴黎也不属于莫斯科，会怎么样？这个念头一旦说出口，就再也收不回去了。莫斯科的大使要求一个解释。"
 krcw_ma_leave_the_cordon:0 "退出莫斯科协定"
 krcw_ma_leave_the_cordon_desc:0 "政府通知莫斯科退出协定，要求协定的驻军在期限内撤离。这是协定成立以来第一次有成员公开出走。俄罗斯的坦克离边界只有一天的路程。"
 krcw_ma_the_neutral_belt:0 "请求国际的安全保证"
 krcw_ma_the_neutral_belt_desc:0 "出走以后，唯一能挡住俄罗斯坦克的是另一个集团的承诺。政府派人去巴黎，请求一份安全保证和一批反坦克炮。莫斯科会把这当作挑衅。"
 krcw_ma_the_question_of_the_regime:0 "确定政体"
 krcw_ma_the_question_of_the_regime_desc:0 "每个协定小国都在同一个问题上挣扎：谁来统治？将军、文官，还是那顶一直挂在墙上的王冠？"
 krcw_ma_the_crown_reigns:0 "王冠亲政"
 krcw_ma_the_crown_reigns_desc:0 "国王走下画像，坐进内阁。罗马尼亚、保加利亚、阿富汗、蒙古与匈牙利的王座上，坐着的第一次是一个真正做决定的人。"
 krcw_ma_the_royal_prerogative:0 "王室特权"
 krcw_ma_the_royal_prerogative_desc:0 "国王收回了军队的效忠、外交的最终决定权和解散议会的权力。这是稳定，还是一场等待爆发的宫廷政变？"
 krcw_ma_dynasty_and_accord:0 "调和王室与协定义务"
 krcw_ma_dynasty_and_accord_desc:0 "一个亲政的君主对莫斯科既是保证也是麻烦：他稳定，却也有自己的算盘。莫斯科决定容忍——王冠比上校更难被公社的宣传煽动。"
 krcw_ma_the_officers_take_over:0 "军官掌权"
 krcw_ma_the_officers_take_over_desc:0 "选举无限期推迟，议会无限期休会。上校们说，只要边界那侧还有一支公社军队，紧急状态就不能结束。"
 krcw_ma_the_national_command:0 "国家指挥部"
 krcw_ma_the_national_command_desc:0 "军政府把国家变成一座兵营：军官管工厂，军官管学校，军官管报纸。效率提高了，但没有人再敢说真话。"
 krcw_ma_the_permanent_emergency:0 "永久紧急状态"
 krcw_ma_the_permanent_emergency_desc:0 "紧急状态成了永久的制度。军政府用它来对付公社的游击队，也用它来对付任何要求恢复选举的人。"
 krcw_ma_the_civilian_settlement:0 "文官安排"
 krcw_ma_the_civilian_settlement_desc:0 "上校回到兵营，律师和教授回到部里。莫斯科不太高兴，但一个稳定的盟友比一个顺从的盟友更有用。"
 krcw_ma_managed_elections:0 "举行受控选举"
 krcw_ma_managed_elections_desc:0 "选举回来了，但只有获准的政党能参选。这是一场戏，却是一场比赤裸裸的军管更体面的戏。"
 krcw_ma_a_breathing_society:0 "放宽新闻管制"
 krcw_ma_a_breathing_society_desc:0 "有限的新闻自由、独立的法院、大学里的辩论，文官政府给了社会一点空间。莫斯科盯着看，随时准备收紧。"
 krcw_ma_licenced_arsenal:0 "特许兵工厂"
 krcw_ma_licenced_arsenal_desc:0 "莫斯科出图纸，本国出厂房与工人。造出来的坦克比俄罗斯的差半代，但它们是自己的——而且零件不必等西伯利亚的火车。"
 krcw_ma_belated_land_reform:0 "迟来的土地改革"
 krcw_ma_belated_land_reform_desc:0 "莫斯科三十年前就把土地给了农民，协定的其他成员一直拖着。现在边界那一侧的广播再也不能用这件事来煽动村庄了。"
 krcw_ma_the_frontier_economy:0 "边境经济"
 krcw_ma_the_frontier_economy_desc:0 "通往边界的每一条铁路都有双重用途：平时运煤和小麦，战时运师。协定的工程师从来不为这两件事分别设计。"
 krcw_ma_the_disputed_border:0 "争议的边界"
 krcw_ma_the_disputed_border_desc:0 "协定内部的地图上有几条线是用铅笔画的。莫斯科要求成员之间不得为此争吵，可是外交部的抽屉里，每一国都锁着一份自己的版本。"
 krcw_ma_arms_from_the_licence:0 "特许生产"
 krcw_ma_arms_from_the_licence_desc:0 "莫斯科终于同意出让上一代坦克与步枪的图纸。这既是恩惠也是锁链：从此本国的军工体系按俄罗斯的标准建立，口径、螺纹与无线电频率都是莫斯科定的。"
 krcw_ma_the_land_question:0 "推行土地改革"
 krcw_ma_the_land_question_desc:0 "协定的成员国里，大地主还占着最好的土地。莫斯科不断提醒：边界那一侧的电台每天都在对你们的农民广播。土改是保住政权的代价，而付这笔代价的是政权自己的支持者。"
 krcw_ma_rail_to_the_frontier:0 "修建边境铁路"
 krcw_ma_rail_to_the_frontier_desc:0 "双轨、重载、站台长度按一个师的编制设计。协定的参谋部对每一条新线都有一票，而经济部门发现，只要把铁路画向西边，预算就永远批得下来。"
 krcw_ma_our_own_arsenal_f:0 "自行设计武器"
 krcw_ma_our_own_arsenal_f_desc:0 "仿制了十年之后，本国的设计局第一次提出了自己的方案。莫斯科的顾问礼貌地指出其中的缺陷，但没有反对——一个能自己造炮的附庸，比一个只会等船的附庸更有用。"
 krcw_ma_the_resource_bargain:0 "与莫斯科议定资源价格"
 krcw_ma_the_resource_bargain_desc:0 "土耳其的铬、罗马尼亚的石油、南斯拉夫的铝土、波兰的煤——协定按莫斯科定的价格收购这些东西，再按莫斯科定的价格卖回机床。成员国算过账，但没有人算得过。"
 krcw_ma_the_cordon_fortifications:0 "警戒线筑垒"
 krcw_ma_the_cordon_fortifications_desc:0 "从波罗的海到爱琴海，在西部边界修筑混凝土工事。这条防线挡不住装甲师，但能迫使对方公开发动战争。"
 krcw_ma_mountain_and_marsh:0 "山地与沼泽"
 krcw_ma_mountain_and_marsh_desc:0 "协定的地形是它最好的资产：喀尔巴阡山、巴尔干的峡谷、波列西耶的沼泽、安纳托利亚的高原。参谋部为每一种地形写了专门的条令，而共通的一条是：让对手付出时间。"
 krcw_ma_the_air_defence_net:0 "防空网"
 krcw_ma_the_air_defence_net_desc:0 "国际的轰炸机要飞越协定成员国才能到达俄国。莫斯科提供雷达和截击机，成员国提供机场和人员。"
 krcw_ma_the_counter_insurgency_school:0 "反游击学校"
 krcw_ma_the_counter_insurgency_school_desc:0 "协定的成员国几乎都有山里的游击队：希腊的品都斯、南斯拉夫的波斯尼亚、土耳其的库尔德山区。一所共同的学校教授同一套办法——封锁、迁村、招降，以及不要让记者进去。"
 krcw_ma_the_pencil_lines:0 "清点领土争端"
 krcw_ma_the_pencil_lines_desc:0 "协定成员之间的领土争端从不列入议程，但各国都有自己的地图。清点这些争端，莫斯科借此控制各成员。"
 krcw_ma_the_pindus_campaign:0 "清剿品都斯游击队"
 krcw_ma_the_pindus_campaign_desc:0 "希腊的工团主义游击队在品都斯山里已经打了三年。他们的补给来自意大利：渔船夜里渡过奥特朗托海峡，在伊庇鲁斯的海湾卸货。要彻底剿灭他们，就必须封锁伊奥尼亚海岸，在海上截住挂意大利旗的船。"
 krcw_ma_the_macedonian_question:0 "处理马其顿问题"
 krcw_ma_the_macedonian_question_desc:0 "索非亚说马其顿人是保加利亚人，贝尔格莱德说他们是塞尔维亚人的一支，雅典说北方根本没有马其顿人。三个协定成员为同一片土地上的同一群人吵了半个世纪，而这群人自己的意见从来没有被问过。"
 krcw_ma_the_straits_question:0 "坚守海峡主权"
 krcw_ma_the_straits_question_desc:0 "莫斯科要求海峡通行权乃至驻军权。安卡拉视海峡为土耳其主权的底线，拒绝让步。"
 krcw_ma_transylvania:0 "特兰西瓦尼亚"
 krcw_ma_transylvania_desc:0 "布加勒斯特和布达佩斯都是协定成员，都有莫斯科的驻军，都在同一份文件上签过字——而两国的中学地图上，特兰西瓦尼亚属于不同的国家。莫斯科的仲裁是：谁也不许提。"
 krcw_ma_the_german_line:0 "提出德国边界问题"
 krcw_ma_the_german_line_desc:0 "波美拉尼亚和西里西亚仍在东德手中，东德也是协定成员。华沙每年都向莫斯科提出这一问题，每年都被拒绝。"
 krcw_ma_moscow_arbitrates:0 "请莫斯科仲裁"
 krcw_ma_moscow_arbitrates_desc:0 "成员国之间的争端最终都交给莫斯科裁决。裁决未必公正，但各国都接受，因为谁也打不起内战。"
 krcw_mad_10_t:0 "谁的土地"
 krcw_mad_10_d:0 "土改法案送到议会，反对最激烈的不是大地主——他们早就明白挡不住——而是军官团。协定成员国的军官大多出身乡绅，他们的家产就在这份法案要分掉的名单上。\n\n莫斯科的大使在私下里说了一句话：\"你们可以失去庄园，也可以失去村庄。选一个。\""
 krcw_mad_10.a:0 "照案通过，补偿军官"
 krcw_mad_10.b:0 "打折执行：只分教会与外国人的地"
 krcw_mad_10.c:0 "拖下去，赌农民没有收音机"
 krcw_mad_12_t:0 "价格的算术"
 krcw_mad_12_d:0 "经济部的报告很简单：本国的铬、石油与铝土按协定价格卖给莫斯科，换回的机床按协定价格买入，两边的价差每年相当于本国工业投资的四分之一。\n\n报告的最后一句话被部长亲手划掉了，但抄本已经流出去了。那句话是：\"我们在补贴一个比我们富的国家。\""
 krcw_mad_12.a:0 "向莫斯科要求重新定价"
 krcw_mad_12.b:0 "接受价差，换取军备与安全"
 krcw_mad_12.c:0 "悄悄向西方出口一部分"
 krcw_mad_20_t:0 "伊奥尼亚海上的巡逻"
 krcw_mad_20_d:0 "总参谋部的结论是明确的：只要伊庇鲁斯的海岸还开着，品都斯的游击队就剿不完。可是运货的船挂着意大利旗，而意大利是国际的成员，在海上拦它们等于向国际挑战。\n\n莫斯科的答复模棱两可：我们支持你们维持内部秩序，但我们不希望在巴尔干有一场战争。"
 krcw_mad_20.a:0 "封锁海岸，接受后果"
 krcw_mad_20.b:0 "山区大清剿，不碰海岸"
 krcw_mad_20.c:0 "大赦：给游击队一条出路"
 krcw_mad_22_t:0 "马其顿人自己"
 krcw_mad_22_d:0 "一份没有人预料到的请愿书送到了协定理事会：斯科普里的教师、铁路工人与神职人员联名要求承认马其顿民族，并给予自治。请愿书同时送给了索非亚、贝尔格莱德与莫斯科。\n\n三个首都的第一反应完全一样：查是谁组织的。莫斯科的反应不同——它把请愿书归了档，然后什么也没做。这份沉默本身就是一种态度。"
 krcw_mad_22.a:0 "承认马其顿民族"
 krcw_mad_22.b:0 "给文化自治，不给政治自治"
 krcw_mad_22.c:0 "查办组织者"
 krcw_mad_24_t:0 "海峡的代价"
 krcw_mad_24_d:0 "莫斯科的提案写得很客气：一支俄罗斯黑海舰队的分舰队常驻伊斯坦布尔，名义上是协定联合演习的常设安排。安卡拉的参谋部一眼就看明白了这份提案的含义。\n\n总参谋长在内阁会议上说：\"我们一九四四年从奥斯曼帝国的废墟里捡到的东西只有两样：这个国家，和这两道水。\""
 krcw_mad_24.a:0 "拒绝：海峡不容驻军"
 krcw_mad_24.b:0 "同意通行权，不同意驻军"
 krcw_mad_24.c:0 "全部接受，换取工业援助"
 krcw_mad_26_t:0 "两本地图"
 krcw_mad_26_d:0 "一件小事引发了一场风波：布加勒斯特的中学地图册和布达佩斯的中学地图册同时被送到协定理事会的桌上，两本册子上特兰西瓦尼亚的颜色不一样。\n\n俄罗斯代表看了很久，然后说了一句让两国代表都不舒服的话：\"在莫斯科印的地图上，这块地方是协定的。\""
 krcw_mad_26.a:0 "接受莫斯科的说法"
 krcw_mad_26.b:0 "坚持本国版本"
 krcw_mad_28_t:0 "每年的那次会面"
 krcw_mad_28_d:0 "华沙的总参谋长每年去莫斯科一次，每次都带同一份文件：波美拉尼亚与西里西亚的人口、工业与铁路统计，附一份历史备忘录。\n\n今年的答复和往年一样，只是措辞更明确了一点：\"德意志民族共和国是协定的前线。你们是协定的纵深。前线不能动摇。\"总参谋长回国后把文件锁进保险柜，并在日历上标好了明年的日期。"
 krcw_mad_28.a:0 "接受，继续等"
 krcw_mad_28.b:0 "转而要求工业与军备补偿"
 krcw_ma_reprice_tt:0 "莫斯科是否重新定价由莫斯科决定；萨文科夫去世后更可能。"
 krcw_wgr_the_corridor_regime:0 "走廊制度"
 krcw_wgr_the_corridor_regime_desc:0 "三条空中走廊、一条铁路、一条公路，每一条的宽度、高度与时刻表都写在一九四五年的协定里。柏林的生存是一份法律文件，而对面的国家每年都要重读一遍这份文件，寻找里面没写清楚的地方。"
 krcw_wgr_the_council_question:0 "委员会问题"
 krcw_wgr_the_council_question_desc:0 "党说方向，工会说条件，车间委员会说不。三者都是革命的产物，三者都认为自己代表工人，而一个前线国家不能同时听三个声音。"
 krcw_wgr_the_single_command:0 "统一指挥"
 krcw_wgr_the_single_command_desc:0 "柏林危机之后，工会与委员会同意在国防事务上让党拥有最后的决定权。这个让步只限于国防事务——大家都清楚，在一个以易北河为边界的国家里，什么事不算国防事务。"
 krcw_wgr_the_shop_floor_republic:0 "车间共和国"
 krcw_wgr_the_shop_floor_republic_desc:0 "相反的答案：让委员会保留否决权，哪怕这意味着动员计划要经过三万个车间的表决。支持者说这才是他们打仗要保护的东西，反对者说这场仗打不起来就先输了。"
 krcw_wgr_the_reactor_programme:0 "反应堆计划"
 krcw_wgr_the_reactor_programme_desc:0 "德国的物理学家分散在三个国家里，其中最好的一批留在了这一边。国际给了钱，条件是成果共享；柏林的实验室接受了这个条件，并在议定书上加了一句：用途限于发电。"
 krcw_wgr_one_germany_someday:0 "总有一天的德国"
 krcw_wgr_one_germany_someday_desc:0 "统一不再写在纲领的第一条，但它也没有被删掉——它挪到了最后一条，前面加了\"当条件成熟时\"。每一代政治家都相信条件会在自己任内成熟。"
 krcw_wgr_corridor_squeeze:0 "走廊上的压迫"
 krcw_berlin_pressure_tt:0 "柏林压力：[?global.krcw_berlin_pressure]"
 krcw_wgr_the_corridor_law:0 "制定走廊法"
 krcw_wgr_the_corridor_law_desc:0 "西柏林的对外交通靠一九四五年的一份技术协定维持，东德正在找其中的漏洞。把协定条款写进本国法律，并向各国公布全文。"
 krcw_wgr_the_permanent_airlift:0 "常备空运"
 krcw_wgr_the_permanent_airlift_desc:0 "把空运从应急措施改为常设职能：专用机场、专用机队、专用装卸部队，每季度演练一次。"
 krcw_wgr_the_city_that_is_watched:0 "建设西柏林橱窗"
 krcw_wgr_the_city_that_is_watched_desc:0 "优先保障西柏林的商店、住房与公共交通，使它明显好于东柏林。开支很大，但对东德居民的影响最直接。"
 krcw_wgr_the_hostage_arithmetic:0 "确定西柏林驻军规模"
 krcw_wgr_the_hostage_arithmetic_desc:0 "西柏林守军无论多少都撑不过一周，驻军的作用是让任何进攻都成为对整个国际的进攻。据此确定驻军规模。"
 krcw_wgr_the_wire_and_the_trains:0 "开辟多条对外通道"
 krcw_wgr_the_wire_and_the_trains_desc:0 "在铁路之外增加公路、运河、空运等多条通道，任何一条被切断都不至于让城市断供。"
 krcw_wgr_berlin_is_a_land_of_ours:0 "将西柏林设为州"
 krcw_wgr_berlin_is_a_land_of_ours_desc:0 "把西柏林设为共和国的一个州，派代表进入联邦议会。东德和莫斯科会视之为单方面吞并。"
 krcw_wgr_party_union_council:0 "协调党、工会与委员会"
 krcw_wgr_party_union_council_desc:0 "党、工会联合会和车间委员会三套机构同时存在，彼此都有否决权。一九五〇年的动员演习显示，命令在工厂层面会被拖延。"
 krcw_wgr_the_single_command_f:0 "统一指挥"
 krcw_wgr_the_single_command_f_desc:0 "国防事务由党作最终决定，工会与委员会保留工资、工时与厂务等其他权力。反对者担心国防的范围会越划越大。"
 krcw_wgr_the_shop_floor_republic_f:0 "车间共和国"
 krcw_wgr_the_shop_floor_republic_f_desc:0 "委员会的否决权包括国防事务：动员计划逐厂表决，军工排期与工会协商。决策更慢，但委员会制度得以完整保留。"
 krcw_wgr_the_factory_and_the_front:0 "建立战时生产预案"
 krcw_wgr_the_factory_and_the_front_desc:0 "按战争随时可能爆发的前提，为鲁尔的工厂准备库存、备件、疏散方案与替代生产线。"
 krcw_wgr_the_reactor_at_karlsruhe:0 "建设卡尔斯鲁厄反应堆"
 krcw_wgr_the_reactor_at_karlsruhe_desc:0 "在卡尔斯鲁厄建设反应堆，由国际出资，成果共享。议定书规定用途限于发电。"
 krcw_wgr_the_german_engineers:0 "留用帝国时期教授"
 krcw_wgr_the_german_engineers_desc:0 "工程学院有一半教授曾为帝国工作。共和国决定不追究过去，只审查现在的教学内容。"
 krcw_wgr_the_two_state_reality:0 "奉行单独代表原则"
 krcw_wgr_the_two_state_reality_desc:0 "外交部宣布共和国是德意志民族唯一合法的国家，任何承认波茨坦政权的政府都将失去与共和国的外交关系。几个中立国因此推迟了与东德建交，出口部门抱怨丢了订单。"
 krcw_wgr_the_small_steps:0 "资助东德地下组织"
 krcw_wgr_the_small_steps_desc:0 "情报总局通过西柏林向东德的工会反对派和教会青年组织输送经费、印刷机和电台。行动一旦暴露，参与者会被判重刑，柏林的紧张也会升级。"
 krcw_wgr_the_one_germany_congress:0 "全德大会"
 krcw_wgr_the_one_germany_congress_desc:0 "邀请东德的工会、教会与地方议会派代表参加全德大会，绕过施莱歇尔政府直接与东德社会接触。东德会视之为干涉。"
 krcw_wgr_the_nation_that_waits:0 "保存共同的民族遗产"
 krcw_wgr_the_nation_that_waits_desc:0 "学校、广播与档案馆共同保存两德共同的语言、历史与文化，为将来可能的统一保留基础。"
 WGR_krcw_kahle:0 "汉斯·卡勒"
 WGR_krcw_kahle_desc:0 "西班牙国际纵队第十一旅的旅长，一九四三年随国际的军队回到德国，此后一直管着易北河防线。他是主张\"统一指挥\"那一派的核心：一个前线国家不能有三个政府。他的反对者提醒人们，他这辈子服从过的唯一机构是军队。"
 WGR_krcw_wollenberg:0 "埃里希·沃伦贝格"
 WGR_krcw_wollenberg_desc:0 "一九二三年汉堡起义的军事组织者，后来因为反对一切\"从上面来的命令\"而被三个不同的组织开除过。车间委员会把他当作自己的人。他主张共和国的强处恰恰在于它慢——一个凡事要表决的国家不会被一个将军拖进战争。"
 WGR_krcw_mierendorff:0 "卡洛·米伦多夫"
 WGR_krcw_mierendorff_desc:0 "社会民主派的幸存者，一九四三年以前在地下工作，此后主持了共和国的宪法起草。他是\"小步骤\"路线的作者：不谈统一，只谈邮政、探亲与货运。他说自己这一代人的任务不是完成德国，而是让德国活到下一代手上。"
 WGR_krcw_schroder:0 "卡尔·施罗德"
 WGR_krcw_schroder_desc:0 "工会联合会的书记，一个把革命当作组织问题来处理的人。他既不信任卡勒的军队也不信任沃伦贝格的车间大会，主张工会应当是共和国的脊梁，因为只有工会同时管着生产与人。"
 krcw_wgr_berlin_cat:0 "柏林走廊"
 krcw_wgr_berlin_cat_desc:0 "西柏林靠三条空中走廊、一条铁路与一条公路活着。压力表越高，这座城市离被切断越近；两边都能推动它。"
 krcw_wgr_reinforce_the_airlift:0 "加开空运班次"
 krcw_wgr_reinforce_the_airlift_desc:0 "在时刻表之外加开班次，把柏林的储备从三十天提到六十天。这既是后勤也是信号。"
 krcw_wgr_publish_the_agreement:0 "公布协定原文"
 krcw_wgr_publish_the_agreement_desc:0 "把一九四五年协定的全文与对面每一次违规的记录一起发给全世界的报社。这不能运进一吨煤，但它让下一次封锁的代价变高。"
 krcw_wgr_day_passes_west:0 "放宽通行证"
 krcw_wgr_day_passes_west_desc:0 "让更多东德人拿着通行证进来看一眼西柏林。这是共和国最便宜也最有效的武器，而它的代价是对面的边防会因此更严。"
 krcw_ddr_inspect_the_trains:0 "加强列车检查"
 krcw_ddr_inspect_the_trains_desc:0 "协定规定了列车的数量，没有规定检查需要多久。每一列车在边界上多停四个小时，柏林的煤就少一天。"
 krcw_ddr_corridor_exercises:0 "走廊内的空军演习"
 krcw_ddr_corridor_exercises_desc:0 "在走廊的边缘安排演习。不封锁，不射击，只是让每一个飞进柏林的机组都知道有人在看着他们。"
 krcw_ddr_seal_the_sector_border:0 "封闭部门边界"
 krcw_ddr_seal_the_sector_border_desc:0 "柏林市内的边界是整个铁幕上唯一还能走过去的地方。封闭它能止住人口外流，代价是全世界的相机都会拍到那道墙。"
 krcw_wgr_40_t:0 "七十页的协定"
 krcw_wgr_40_d:0 "法律顾问们把一九四五年协定逐条读了一遍，报告的结论让内阁沉默了一会儿：协定对空中走廊写得很细，对地面通道写得很粗，而对\"维护\"、\"检查\"与\"安全\"这三个词根本没有定义。\n\n国防部长问了一个实际的问题：\"如果他们不封锁，只是把每列车的检查时间延长到八小时，我们怎么办？\"没有人回答。"
 krcw_wgr_40.a:0 "准备常备空运，不依赖地面"
 krcw_wgr_40.b:0 "重新谈判协定，把词都定义清楚"
 krcw_wgr_40.c:0 "声明任何阻碍视为战争行为"
 krcw_wgr_42_t:0 "三个声音"
 krcw_wgr_42_d:0 "动员演习的报告摊在桌上。命令在四十分钟内下到了所有军区，在鲁尔的工厂里卡了十一个小时——因为车间委员会按章程要求先开会，而章程是共和国自己写的。\n\n卡勒把演习记录推到桌子中间：\"同志们，易北河对面到布伦瑞克是九十公里。\"沃伦贝格把记录推回去：\"那我们守的是什么？一个不开会的德国，和对面有什么区别？\""
 krcw_wgr_42.a:0 "国防事务归党，其余不动"
 krcw_wgr_42.b:0 "委员会保留否决权"
 krcw_wgr_42.c:0 "交给工会来协调两边"
 krcw_wgr_44_t:0 "那份不公开的文件"
 krcw_wgr_44_d:0 "外交部的内部评估只有六页，结论写在第一页：在可预见的将来，统一不会发生；任何以统一为前提的政策都是在为一个不会到来的日期做准备。\n\n文件在内阁里传阅了一圈，没有人反驳它，也没有人愿意签字。最后它被归入档案，编号之后加了一行铅笔字：\"不得引用。\"\n\n米伦多夫在走出会议室时对同事说了一句话：\"我们这一代人的任务不是完成德国。是让它活到下一代手上。\""
 krcw_wgr_44.a:0 "照这个前提制定政策"
 krcw_wgr_44.b:0 "归档，继续对外说统一"
 krcw_wgr_46_t:0 "谁会来"
 krcw_wgr_46_d:0 "全德大会的邀请函寄出去了六百份，寄给东德的工会、教会、地方议会与大学。施莱歇尔的政府宣布参加者将失去公职。\n\n开会那天，来了一百七十四人。其中最引人注目的是德累斯顿一家机车厂的工会代表团——七个人，全都带了辞职书，因为他们知道回不去了。"
 krcw_wgr_46.a:0 "给他们公民身份与工作"
 krcw_wgr_46.b:0 "把大会变成常设机构"
 krcw_wgr_48_t:0 "柏林市内的那道墙"
 krcw_wgr_48_d:0 "八月的一个星期日凌晨，东德的工程兵在柏林市内的部门边界上拉起了铁丝网。到中午，混凝土桩已经立起来了；到晚上，地铁的四个车站封了。\n\n整个铁幕上唯一还能走过去的地方没有了。全世界的相机都拍到了那道墙，而共和国的报纸第二天只用了一个标题：\"他们承认自己输了什么。\""
 krcw_wgr_48.a:0 "让世界看清这道墙"
 krcw_wgr_50_t:0 "货运单上的数字"
 krcw_wgr_50_d:0 "没有封锁，没有声明，什么也没有发生——只是本季度进入柏林的货运量比上季度少了百分之九。检查时间延长了，\"维护\"占用了走廊，某条公路的桥\"需要修\"。\n\n柏林市长在市议会上说：\"他们不会关门。他们会把门缝一年调窄一厘米，直到有一天我们发现自己在门外面。\""
 krcw_wgr_50.a:0 "提高储备，不作声"
 krcw_wgr_50.b:0 "公开每一次延误"
 krcw_wgr_52_t:0 "走廊变窄了"
 krcw_wgr_52_d:0 "一架运输机在走廊内被两架东德的截击机贴近伴飞了十一分钟，距离近到机组能看清对方的面孔。东德的解释是例行识别。\n\n同一周，柏林的煤储备第一次跌到二十天以下。参谋部把两件事写进了同一份报告，并在结尾加了一句：这两件事的时间点不是巧合。"
 krcw_wgr_52.a:0 "派战斗机护航"
 krcw_wgr_52.b:0 "全面空运，一天三百架次"
 krcw_wgr_52.c:0 "请国际出面，把这变成阵营问题"
 krcw_wgr_54_t:0 "二十天"
 krcw_wgr_54_d:0 "储备剩二十天。地面通道全部以各种技术理由停了，三条空中走廊里有两条被\"演习\"占用。这不是封锁——没有任何一份文件上写着封锁——而柏林正在被关上。\n\n内阁面前有三个选项，参谋部对每一个都做了评估，而三份评估的第一句话都一样：本方案有导致战争的可能。"
 krcw_wgr_54.a:0 "派装甲纵队沿公路开进去"
 krcw_wgr_54.b:0 "全阵营空运，把柏林变成阵营的义务"
 krcw_wgr_54.c:0 "谈：用东德要的东西换走廊"
 krcw_ddr_the_haemorrhage:0 "失血"
 krcw_ddr_the_haemorrhage_desc:0 "每年有几万人经柏林市内的部门边界离开共和国，而走的人不是随机的：医生、工程师、车床工、教师。统计局的报告按职业分了类，而这份分类比总数更让内阁难受。"
 krcw_ddr_the_stopped_wound:0 "止住的伤口"
 krcw_ddr_the_stopped_wound_desc:0 "边界封上了，人不再走了，工厂的技工名册第一次两年不变。代价是这个政权从此在全世界的照片里以一道墙作为背景，而它自己的国民知道那道墙是朝哪个方向修的。"
 krcw_ddr_the_officers_republic:0 "军官的共和国"
 krcw_ddr_the_officers_republic_desc:0 "帝国的总参谋部没有被解散，只是换了招牌。共和国的部长有一半穿过军服，而另一半的任命需要穿过军服的那一半同意。这个国家不是被一个党统治的，是被一个军官团统治的。"
 krcw_ddr_the_civilian_turn:0 "文官的转向"
 krcw_ddr_the_civilian_turn_desc:0 "相反的选择：把预算从军队挪向住宅、消费品与铁路，让共和国第一次看起来像一个可以生活的地方而不是一个兵营。总参谋部同意了这件事，条件是他们自己来决定挪多少。"
 krcw_ddr_the_junker_bargain:0 "容克的交易"
 krcw_ddr_the_junker_bargain_desc:0 "东部的庄园终于被分了，但分法是政权自己的：地主拿到国债与军中的位置，佃农拿到地契与三十年的贷款。两边都不满意，两边都没有理由再听边界那一侧的广播。"
 krcw_ddr_the_price_of_the_patron:0 "宗主的价格"
 krcw_ddr_the_price_of_the_patron_desc:0 "莫斯科给图纸、给石油、给一个用得上的军事同盟，要的是优先权、基地与在共和国国防事务上的最后一票。每一届政府都算过这笔账，每一届政府都发现自己没有第二个选择。"
 krcw_ddr_the_thief_across:0 "偷走我们的人的邻居"
 krcw_ddr_wgr_centres_tt:0 "西德是否放慢接收，由西德决定；签过过境协定或由雷恩执政时更可能。"
 krcw_ddr_emigration_tt:0 "外流人口指数：[?krcw_ddr_emigration]"
 krcw_ddr_the_open_door_in_berlin:0 "统计经柏林外流人口"
 krcw_ddr_the_open_door_in_berlin_desc:0 "边界上唯一还能通行的是柏林市内的部门边界，每年有几万人经此离开。统计外流人口，按职业分类。"
 krcw_ddr_give_them_a_reason_to_stay:0 "优先建设住宅"
 krcw_ddr_give_them_a_reason_to_stay_desc:0 "提高住房、工资和消费品供应，减少人口外流。资金要从军费中挪出，总参谋部反对。"
 krcw_ddr_the_skilled_man_register:0 "技工名册"
 krcw_ddr_the_skilled_man_register_desc:0 "登记关键职业人员，出境须经许可。登记在册的人无法离开，其他人开始担心自己也会被登记。"
 krcw_ddr_the_question_of_the_wall:0 "审议封界方案"
 krcw_ddr_the_question_of_the_wall_desc:0 "总参谋部早有封闭柏林部门边界的方案，技术上不难。施莱歇尔担心的是它对政权形象的长期影响。"
 krcw_ddr_the_republic_worth_staying_in:0 "推行福利国家计划"
 krcw_ddr_the_republic_worth_staying_in_desc:0 "不封边界，改为全面推行福利：住宅、退休金、八小时工作制、每县一所医院。代价是缩减军队规模。"
 krcw_ddr_the_concrete_answer:0 "封闭柏林部门边界"
 krcw_ddr_the_concrete_answer_desc:0 "封闭柏林部门边界，扩大技工名册，出境须说明理由。人口外流停止，政权的国际形象严重受损。"
 krcw_ddr_the_staff_that_never_dissolved:0 "从未解散的总参谋部"
 krcw_ddr_the_staff_that_never_dissolved_desc:0 "帝国总参谋部在一九四四年后改名保留下来，文官部长的任命须经它同意。施莱歇尔是唯一能同时约束将军和文官的人。"
 krcw_ddr_the_estates_divided:0 "赎买容克庄园"
 krcw_ddr_the_estates_divided_desc:0 "赎买东部的容克庄园：地主获得国债和军中职位，佃农获得地契和三十年贷款。"
 krcw_ddr_what_moscow_asks:0 "与莫斯科谈判军援条件"
 krcw_ddr_what_moscow_asks_desc:0 "莫斯科提供图纸、石油和军事同盟，要求采购优先权、两处空军基地，以及对共和国国防事务的最终决定权。"
 krcw_ddr_the_barracks_or_the_housing:0 "裁定军费与住房预算"
 krcw_ddr_the_barracks_or_the_housing_desc:0 "同一笔预算，参谋部要用来组建十二个新师，住房部要用来建二十万套住宅。由施莱歇尔裁定。"
 krcw_ddr_the_throne_decided:0 "以宪法冻结皇位问题"
 krcw_ddr_the_throne_decided_desc:0 "宪法承认君主制，但规定继位须经国民议会三分之二多数通过。皇位继续空缺，不再列入议程。"
 krcw_ddr_the_third_germany_stands:0 "拒绝承认莱茵共和国"
 krcw_ddr_the_third_germany_stands_desc:0 "外交部宣布只有民族共和国代表德意志民族，与承认西德政权的国家不建交。协定各国照此办理，中立国的贸易代表团因此少了一半。"
 DDR_krcw_hammerstein:0 "库尔特·冯·哈默施泰因"
 DDR_krcw_hammerstein_desc:0 "帝国陆军的老将，一个以拒绝服从著称的军人——他这辈子最有名的事是几次拒绝执行他认为荒谬的命令。他主张共和国应当由军官团来管，因为在他看来这个国家眼下只剩下军队还没有腐坏；他也同时主张军队不该碰柏林，因为一支军队打不赢一场用照相机打的仗。"
 DDR_krcw_heuss:0 "特奥多尔·豪斯"
 DDR_krcw_heuss_desc:0 "自由派学者、记者、宪法学家，共和国里最有名的非军人政治家。他主张\"文官的转向\"：把预算从军队挪向住宅与铁路，因为一个没人愿意留下的国家守不住任何边界。将军们容忍他，因为他是这个政权唯一能拿给外国记者看的人。"
 DDR_krcw_jarres:0 "卡尔·亚雷斯"
 DDR_krcw_jarres_desc:0 "老式的市政保守派，杜伊斯堡市长出身，一九二五年差点当上帝国总统。他代表共和国里那一批既不信军队也不信革命的人：市政、行政、警察、预算，把这四件事办好，别的都等得起。他对王座的态度是全国最坦率的——\"填上它要花一年，空着它一分钱不要。\""
 DDR_krcw_zaisser:0 "威廉·蔡塞尔"
 DDR_krcw_zaisser_desc:0 "人民警察的组织者，一个把国家安全当作工程问题来处理的人。他建立了共和国的档案、名册与线人网络，也是封闭柏林部门边界那份方案的作者。他的论点从不涉及意识形态：每年走掉的人里有八百名医生，而共和国一年培养不出八百名医生。"
 krcw_ddrd_10_t:0 "按职业分类的报表"
 krcw_ddrd_10_d:0 "统计局送来的报表把去年经柏林离开的人按职业分了类。总数是七万四千，内阁对总数已经习惯了；分类是新的：八百二十一名医生，一千四百名工程师，三千一百名车床与铣床工，两千七百名教师。\n\n蔡塞尔把报表放下，说了一句没人反驳的话：\"共和国一年培养不出八百名医生。这不是政治问题，这是算术。\""
 krcw_ddrd_10.a:0 "用住宅与工资留住他们"
 krcw_ddrd_10.b:0 "登记关键职业，限制出境"
 krcw_ddrd_10.c:0 "把账算给莫斯科看，要补偿"
 krcw_ddrd_12_t:0 "保险柜里的方案"
 krcw_ddrd_12_d:0 "方案本身只有十一页，附件里有工程兵的器材清单与一张标好每一条街的柏林地图。技术上毫无困难：一个星期日的凌晨，三天内换成混凝土。\n\n哈默施泰因是唯一明确反对的人。他的理由不是道义：\"各位，一支军队打不赢一场用照相机打的仗。那道墙立起来的第二天，全世界都会知道我们这一边的人想走，而他们那一边的人不想。这件事一旦被拍下来，我们就再也擦不掉了。\""
 krcw_ddrd_12.a:0 "批准方案，等时机"
 krcw_ddrd_12.b:0 "暂不批准，先试住宅与工资"
 krcw_ddrd_12.c:0 "销毁方案，公开承诺不封边界"
 krcw_ddrd_14_t:0 "穿军服的那一半"
 krcw_ddrd_14_d:0 "一份关于部长任命程序的内部争论摆到了施莱歇尔面前。豪斯的问题很直接：宪法里哪一条规定了文官部长的任命需要总参谋部同意？\n\n答案是：没有哪一条。这个惯例从一九四四年沿用至今，从来没有人写下来，也从来没有人违反过。施莱歇尔听完之后说了一句：\"豪斯博士，您问的是一个法律问题，而我要处理的是一个事实问题。\""
 krcw_ddrd_14.a:0 "把惯例写进宪法"
 krcw_ddrd_14.b:0 "维持惯例，不写下来"
 krcw_ddrd_14.c:0 "废除惯例，文官任命归议会"
 krcw_ddrd_16_t:0 "十二个师还是二十万套住宅"
 krcw_ddrd_16_d:0 "两份预算方案并排放在桌上，数字几乎一样。参谋部的方案给十二个新的师；住房部的方案给二十万套住宅，主要建在莱比锡、德累斯顿与哈勒——统计局报表上外流人口最多的三个城市。\n\n施莱歇尔没有表态，只问了一句：\"如果人都走了，十二个师从哪里来？\"会议记录在这里空了四行。"
 krcw_ddrd_16.a:0 "给军队：前线需要师"
 krcw_ddrd_16.b:0 "给住宅：留住人才有前线"
 krcw_ddrd_16.c:0 "两样都要，向莫斯科借"
 krcw_ddrd_18_t:0 "合法地空着"
 krcw_ddrd_18_d:0 "宪法修正案以三分之二多数通过：共和国承认君主制为国体，皇位继承须经国民议会三分之二多数确认。修正案通过的当天，没有任何一位候选人被提名。\n\n亚雷斯在走廊里对一名记者说了一句被广泛引用的话：\"填上那个位置要花一年的政治资本，空着它一分钱不要。我们刚刚用法律的形式把这件事确定下来了。\""
 krcw_ddrd_18.a:0 "就这样，别再提了"
 krcw_ddrd_20_t:0 "莱比锡的那家机车厂"
 krcw_ddrd_20_d:0 "莱比锡一家机车厂的工具车间上个月走了十九个人，全部是技工，全部经柏林。车间主任的报告写得很平静，最后一句是：\"我们现在用学徒开精密车床。\"\n\n这样的报告本季度收到了四十一份。"
 krcw_ddrd_20.a:0 "给技工加薪与住房"
 krcw_ddrd_20.b:0 "把这些工厂列入重点名册"
 krcw_ddrd_22_t:0 "这个国家在漏"
 krcw_ddrd_22_d:0 "今年的数字是十四万。统计局这次没有按职业分类，因为分类已经没有意义了——走的是所有能走的人。柏林的四个地铁站每天早晨挤满了带着两个箱子的人，而他们买的是单程票，票价三十芬尼。\n\n蔡塞尔在内阁会议上把方案第二次拿出来。这一次哈默施泰因也没有说话。"
 krcw_ddrd_22.a:0 "动用方案：封闭部门边界"
 krcw_ddrd_22.b:0 "最后一次赌住宅与工资"
 krcw_ddrd_22.c:0 "向西德要求关闭接收站"
 krcw_mam_1_t:0 "谁来统治"
 krcw_mam_1_d:0 "一九四九年，协定的每个小国都在同一个问题上打转：谁来统治？\n\n将军们说，只有军队在一九四四年的崩溃里没有散掉；文官们说，一个靠戒严令活着的政权在莫斯科眼里不值钱；而在有些国家，那顶王冠还挂在墙上——没有人敢戴，也没有人敢取下来。\n\n莫斯科对这个问题的态度出人意料地冷淡。它的大使只说了一句：\"我们不在乎你们的宪法写什么。我们在乎你们的师听谁的命令。\""
 krcw_mam_1.a:0 "军人执政：秩序先于其他一切"
 krcw_mam_1.b:0 "文官执政：把戒严令收起来"
 krcw_mam_1.c:0 "把王冠取下来戴上"
 krcw_mam_1.d:0 "谁也不动：让这个问题继续挂在墙上"
 krcw_mam_10_t:0 "共同清单"
 krcw_mam_10_d:0 "联盟的代表团带着一份清单去了莫斯科：更公道的资源价格、更少的驻军、本国的师由本国指挥。这是协定成立以来第一次有人把这些话写在一张纸上。\n\n会谈进行了四天。俄罗斯人没有拒绝，也没有答应，而是把清单拆成了三份：价格可以谈，驻军可以减，指挥权不能动。\n\n代表团回国时带回了一个谁都没预料到的结论：莫斯科比他们想象的更需要这个联盟。这个发现比清单上任何一条都值钱。"
 krcw_mam_10.a:0 "拿下价格，把指挥权留到下一次"
 krcw_mam_10.b:0 "要驻军减少，哪怕价格照旧"
 krcw_mam_10.c:0 "坚持指挥权，接受一次难看的僵局"
 krcw_mam_20_t:0 "大使要一个解释"
 krcw_mam_20_d:0 "那句话是在一次本该无聊的议会辩论里说出来的：\"如果我们既不属于巴黎也不属于莫斯科，会怎么样？\"说的人是个二线议员，第二天全国的报纸都登了这句话。\n\n俄罗斯大使在四十八小时内要求觐见。他很客气，也很清楚：协定的条约里没有一条禁止成员国讨论中立，但也没有一条保证一个讨论中立的成员国还能继续拿到石油、图纸与备件。\n\n外交部长在会见后写了一行字：\"我们今天学到的是，这条路不是被封住的——它是被标好价格的。\""
 krcw_mam_20.a:0 "公开否认，处理那个议员"
 krcw_mam_20.b:0 "不否认，也不推进：让这个念头留在空气里"
 krcw_mam_20.c:0 "开始悄悄算这条路的价格"
 TUR_krcw_inonu:0 "伊斯梅特·伊诺努"
 TUR_krcw_inonu_desc:0 "共和国的第二号人物，一个在谈判桌上比在战场上更危险的人。他主张土耳其的生存靠的是把两个阵营都拖住而不属于任何一个——海峡的通行权可以谈，驻军权一寸不让。将军们嫌他软，而他每次谈判回来都带着更多的机床。"
 TUR_krcw_orbay:0 "侯赛因·劳夫·奥尔巴伊"
 TUR_krcw_orbay_desc:0 "海军出身的老政治家，一九一八年在停战协定上签过字的人——他这辈子最不愿意再做一次的事。正因为如此，他在海峡问题上是全国最强硬的声音：他见过一个帝国把海峡交出去之后发生了什么。"
 TUR_krcw_karabekir:0 "卡齐姆·卡拉贝基尔"
 TUR_krcw_karabekir_desc:0 "东部军团的司令，安纳托利亚高原上所有工事的设计者。他对协定的看法很实际：莫斯科的师可以帮土耳其守住东边，但莫斯科的舰队一旦进了海峡就再也不会走。他的方案是把陆军交给协定，把海峡留给自己。"
 TUR_krcw_kivilcimli:0 "希克梅特·克维尔吉姆勒"
 TUR_krcw_kivilcimli_desc:0 "在共和国的监狱里断断续续待了二十年的马克思主义者。他的主张在土耳其几乎没有人敢公开支持：协定不是保护，是抵押；土耳其应当退出，然后自己决定和谁做生意。军政府一直没有处死他，因为他的读者比他们以为的多。"
 TIB_krcw_dalai:0 "第十四世达赖喇嘛"
 TIB_krcw_dalai_desc:0 "一九四九年他十四岁，政务由摄政代理，而所有人都在等他成年。他自己受的教育是经院的，不是政治的，但每一方——南京、噶伦堡、三大寺——都已经在为将来那个能自己下决定的成年人准备说辞。他将来的每一句话都会被三个首都逐字分析。"
 TIB_krcw_ngapoi:0 "阿沛·阿旺晋美"
 TIB_krcw_ngapoi_desc:0 "昌都的总管，贵族出身而主张现代化的少数人之一。他的判断冷静得让同僚不舒服：西藏守不住，唯一的问题是用什么条件交换自治——而条件谈得越早越好，因为等到军队开过金沙江，就没有条件可谈了。"
 TIB_krcw_tsarong:0 "擦绒·达桑占堆"
 TIB_krcw_tsarong_desc:0 "从平民爬到贵族顶端的旧军队统帅，一个务实到近乎冷酷的人。他主张西藏需要的不是祈祷也不是投降，而是一支真正的常备军与一条通往印度的公路——而这两样东西都要花钱，所以他对噶伦堡送来的银元从来没有道德上的疑问。"
 TIB_krcw_lungshar:0 "龙厦·多吉次杰"
 TIB_krcw_lungshar_desc:0 "去过英国、见过议会、回来之后主张限制贵族与寺院权力的财政官。他的改革一度让他成为拉萨最有权的俗人，也让他成为三大寺最想除掉的人。他代表的那条路——一个自己改革的西藏——是三方博弈里最脆弱也最少有人押注的一条。"
 RAJ_krcw_tata:0 "J·R·D·塔塔"
 RAJ_krcw_tata_desc:0 "工业家、飞行员、联邦最大的钢铁与航空集团的主人。他对政治的兴趣只有一条：让联邦成为一个能自己造东西的国家。他既不喜欢王公的税制也不喜欢议会的关税辩论，而两边都需要他的钱——这让他成为联邦里最有影响力而从未参选的人。"
 RAJ_krcw_tiwana:0 "希扎尔·哈亚特·提瓦纳"
 RAJ_krcw_tiwana_desc:0 "旁遮普的地主政治家，一个把联邦看作若干省份的交易而不是一个民族的人。他的全部政治技艺在于让印度教徒、穆斯林与锡克教徒在同一张桌子上分税收而不掀桌子——这件事他做成过十年，而他自己说这十年靠的是运气。"
 RAJ_krcw_scindia_heir:0 "迪格维杰辛吉"
 RAJ_krcw_scindia_heir_desc:0 "纳瓦纳加尔的王公，王公院里少数主张自我改革的人。他的论点对同侪很不客气：王公们如果不自己交出一部分权力，二十年内会被议会全部拿走——而议会不会给补偿。他在西藏问题上是鹰派，因为他相信一个有边疆功绩的王公院更难被废除。"
 RAJ_krcw_wavell_holdover:0 "阿奇博尔德·韦维尔"
 RAJ_krcw_wavell_holdover_desc:0 "旧印度军队最后一批英国将官中留下来的一个，现在的身份是联邦国防部的顾问。他留下来的理由从来没有对外解释过，而联邦留下他的理由很清楚：喜马拉雅山的补给线图是他画的。他对西藏的建议一贯冷淡——那条边界能守，但守不起一场战争。"
 krcw_eng_the_settled_republic:0 "安定的共和国"
 krcw_eng_the_settled_republic_desc:0 "三十年之后，革命不再需要每天证明自己。宪法写完了，王室的法律地位定下来了，上院的位置由产业代表坐着。一个不必再随时防备复辟的国家，可以把精力花在别处——代价是它也失去了那种随时准备战斗的紧张。"
 krcw_eng_the_planned_isles:0 "有计划的不列颠"
 krcw_eng_the_planned_isles_desc:0 "计划的第一个十年修了铁路与高炉，第二个十年修房子。被轰炸过的街区终于重建，配给制在一九五一年结束，而工会联合会发现，一个有暖气与自来水的工人对革命的热情反而更持久。"
 krcw_eng_the_independent_deterrent:0 "自己的威慑"
 krcw_eng_the_independent_deterrent_desc:0 "不列颠有物理学家，一九四六年之后也不再有帝国可以花钱。第一枚装置在赫布里底群岛以西的海上引爆，公报只有两行字。从此这个国家在国际内部说话的分量变了，而它的消费品指标推迟了六年。"
 krcw_eng_the_shared_deterrent:0 "共有的威慑"
 krcw_eng_the_shared_deterrent_desc:0 "把浓缩设施、图纸与人交给国际的联合计划，换取共同所有权与巴黎的投资。这在技术上是效率，在政治上是一场赌博：不列颠赌的是，一件由三个国家共同掌握的武器，任何一个国家都不敢单独使用。"
 krcw_eng_the_refusal:0 "拒绝"
 krcw_eng_the_refusal_desc:0 "工会代表大会以一百四十七票之差否决了核计划。理由写在决议里：\"一件不能只用来对付军队的武器，不属于一个工人的国家。\"这个决定让不列颠在莫斯科与巴黎眼里都轻了一些，也让它的钱回到了房子与学校上。"
 krcw_eng_nuclear_partner:0 "核计划的伙伴"
 krcw_eng_the_constitution_finished:0 "写完宪法"
 krcw_eng_the_constitution_finished_desc:0 "不列颠三十年来靠代表大会的决议治理，从未有成文宪法。第一代革命者正在老去，起草一部宪法，规定代表大会与地方联合会的权限。"
 krcw_eng_the_chamber_of_industries:0 "产业院"
 krcw_eng_the_chamber_of_industries_desc:0 "空置三十年的上院改为产业院，由各产业联合会按会员数派代表。"
 krcw_eng_the_windsor_question:0 "确定温莎王室法律地位"
 krcw_eng_the_windsor_question_desc:0 "流亡的温莎王室在墨尔本以\"不列颠国王\"名义签署条约。以法律形式确定王室的身份：叛国者、外国君主，或不予承认。"
 krcw_eng_the_election_we_might_lose:0 "允许反对派参选"
 krcw_eng_the_election_we_might_lose_desc:0 "宪法允许反对革命的候选人参加代表大会选举。革命派内部争议很大，温特林厄姆最终表示支持。"
 krcw_eng_the_second_decade:0 "制定第二个十年计划"
 krcw_eng_the_second_decade_desc:0 "第一个十年重建了铁路、高炉与船坞。第二个十年计划以住宅、供暖、自来水和学校为重点。"
 krcw_eng_the_end_of_rationing:0 "废除配给制"
 krcw_eng_the_end_of_rationing_desc:0 "一九五一年七月废止配给券制度。政府没有举行庆祝活动。"
 krcw_eng_the_second_new_towns:0 "新市镇"
 krcw_eng_the_second_new_towns_desc:0 "一部分被炸毁的工人区原地重建，另一部分人口迁往旧城外的新市镇。每个新街区的中心建一座工人俱乐部。"
 krcw_eng_what_the_plan_is_for:0 "调整计划的优先次序"
 krcw_eng_what_the_plan_is_for_desc:0 "钢铁产量与住宅建设争夺同一笔资金。代表大会决定先保障住房改善，再扩大钢铁产能。"
 krcw_eng_nuclear_research:0 "核物理研究"
 krcw_eng_the_physicists_we_kept:0 "留下来的物理学家"
 krcw_eng_the_physicists_we_kept_desc:0 "战后欧洲最好的一批物理学家留在了不列颠。剑桥实验室提交报告：本国有能力研制核装置，是否研制需要政治决定。"
 krcw_eng_a_deterrent_of_our_own:0 "自行研制核装置"
 krcw_eng_a_deterrent_of_our_own_desc:0 "不经巴黎与莫斯科，自行研制核装置。拥有核威慑后，不列颠在易北河问题上的发言权会增加。"
 krcw_eng_the_bloc_programme:0 "加入国际联合核计划"
 krcw_eng_the_bloc_programme_desc:0 "加入三国联合核计划：不列颠出科学家和钚，法国出资金，西德出工程能力。所有权共有，使用须一致同意。"
 krcw_eng_the_trades_congress_refuses:0 "放弃核计划"
 krcw_eng_the_trades_congress_refuses_desc:0 "代表大会否决核计划预算。许多矿工代表投了反对票，因为这笔钱原本要从住宅计划中挪出。"
 krcw_eng_sub_tech:0 "潜艇技术"
 krcw_eng_the_fleet_and_the_bomb:0 "部署海基威慑"
 krcw_eng_the_fleet_and_the_bomb_desc:0 "把威慑力量部署在海上，岛国的陆上设施太容易被找到。"
 ENG_krcw_strachey:0 "约翰·斯特雷奇"
 ENG_krcw_strachey_desc:0 "物理学家、前海军军官，剑桥那份三页备忘录的执笔人。第三页上那个问题——\"如果我们能做，我们要不要做？\"——是他自己加上去的，而他本人的答案是不要：他算过一件武器在一座岛上能保护什么，结论是一座岛没有纵深可以用来还击。"
 krcw_eng_70_t:0 "三十年没写下来的东西"
 krcw_eng_70_d:0 "起草委员会的第一次会议开了九个小时，而九个小时里没有写下一个字。争论卡在第一条上：主权属于代表大会，还是属于地方联合会的总和？\n\n这不是学术问题。一九三四年的煤矿罢工里，代表大会下过复工令而南威尔士的联合会拒绝执行，双方都认为自己有权。那次靠妥协过去了，而妥协没有留下先例——这正是现在必须写下来的原因。"
 krcw_eng_70.a:0 "主权属于代表大会"
 krcw_eng_70.b:0 "主权属于地方联合会"
 krcw_eng_70.c:0 "两者并列，争议交仲裁庭"
 krcw_eng_72_t:0 "以国王的名义"
 krcw_eng_72_d:0 "墨尔本的那个朝廷以\"不列颠国王\"的名义签署了一份贸易协定。这在法律上是个麻烦：如果不列颠承认那个签名有效，等于承认王室还代表不列颠；如果宣布无效，就得说明为什么，而任何说明都要先回答王室到底是什么。\n\n外交部提交了三个方案，而法务部门在每一个下面都写了同一句批注：\"本方案会被对方引用。\""
 krcw_eng_72.a:0 "宣布王室为外国私人，签名无效"
 krcw_eng_72.b:0 "不予置评：连否认都是一种承认"
 krcw_eng_72.c:0 "正式追诉叛国，并要求引渡"
 krcw_eng_74_t:0 "我父亲还住在他出生的那间屋子里"
 krcw_eng_74_d:0 "第二个十年的草案辩论进行到第四天，一名南威尔士的矿工代表站起来，没有念稿子。他说的话后来被印在了住宅部每一份年度报告的扉页上：\n\n\"我们赢了革命。我们国有化了矿井，赶走了国王，在西班牙打过仗。我父亲还住在他出生的那间屋子里，那间屋子后面还是那个院子里的厕所。同志们，我们赢了什么？\"\n\n草案当天下午通过，没有人要求分组表决。"
 krcw_eng_74.a:0 "住宅优先，钢铁指标推后"
 krcw_eng_74.b:0 "两样都要，向国际借款"
 krcw_eng_76_t:0 "第三页上的那个问题"
 krcw_eng_76_d:0 "剑桥的备忘录送到内阁时，第一页与第二页都没有引起争论：技术上可行，成本相当于两个十年的住宅计划的三分之一。\n\n争论全部集中在第三页那一个问题上。斯特雷奇——备忘录的执笔人、写下那个问题的人——在内阁会议上给了自己的答案：\"各位，我算过这件东西在一座岛上能保护什么。一座岛没有纵深可以用来还击。它只有一次机会先动手，而那不是威慑，那是别的东西。\""
 krcw_eng_76.a:0 "继续研究，把决定留到有了装置再说"
 krcw_eng_76.b:0 "现在就把问题交给代表大会"
 krcw_eng_76.c:0 "先问巴黎愿不愿意合办"
 krcw_eng_78_t:0 "赫布里底以西"
 krcw_eng_78_d:0 "一九五三年十月十四日清晨，不列颠在赫布里底群岛以西的海上引爆了第一枚装置。官方公报两行字，没有照片，没有记者，没有庆祝。\n\n莫斯科的反应是一份十四页的抗议。巴黎的反应是一通私下的电话，内容从未公开。而代表大会当天的议程照常进行——第一项是南威尔士的住宅拨款。"
 krcw_eng_78.a:0 "这改变了我们说话的分量"
 ITA_krcw_gronchi:0 "乔瓦尼·格隆基"
 ITA_krcw_gronchi_desc:0 "天主教工会出身的左派，一个证明了意大利的信教工人可以既不背弃教会也不背弃革命的人。他在共和国里的作用没有人能替代：南方的农民听神父的话，而神父听他的话。他主张共和国不要碰教会的学校与堂区，因为那笔账算下来，教会能给的比它要的多。"
 ITA_krcw_gabriotti:0 "韦南齐奥·加布里奥蒂"
 ITA_krcw_gabriotti_desc:0 "翁布里亚的工会组织者，一个把工厂委员会当作行政机关来经营的人。他的主张在意大利不受欢迎但很实用：共和国的问题不是纲领错了，而是没有人收税、没有人修路、没有人让火车准时。革命交给别人去讲，他要的是一份能执行的预算。"
 ITA_krcw_sardi:0 "亚历山德罗·萨尔迪"
 ITA_krcw_sardi_desc:0 "旧自由派议员中少数没有流亡也没有入狱的人，现在的身份是共和国的财政顾问。他留下来的理由很简单：意大利的国债是他那一代人借的，他不想让别人来解释它。他反对帕里在的里雅斯特的冒险——不是出于和平主义，而是因为他算过一场战争要花多少。"
 SPR_krcw_pestana:0 "安赫尔·佩斯塔尼亚"
 SPR_krcw_pestana_desc:0 "全国劳工联合会里主张组织纪律的那一派的代言人，因此被自己的同志骂了三十年。他的论点是伊比利亚革命最难听也最难反驳的一条：一个拒绝一切中央机构的联邦既收不了税也守不住边界，而佛朗哥的残部正在比利牛斯山那一侧等着。"
 SPR_krcw_ibarruri:0 "多洛雷斯·伊巴露丽"
 SPR_krcw_ibarruri_desc:0 "\"热情之花\"，一九三六年那句口号的作者，如今是联邦里主张中央集权的最强声音。她与无政府主义者的争执可以追溯到内战期间的每一次军事失败，而她的结论从未改变：巴塞罗那的公社可以自己决定生产什么，但不能自己决定什么时候打仗。"
 SPR_krcw_tarradellas:0 "若塞普·塔拉德利亚斯"
 SPR_krcw_tarradellas_desc:0 "加泰罗尼亚自治政府的行政官，一个在无政府主义者与马德里之间做了二十年翻译工作的人。他要的东西两边都不喜欢：一部写下来的联邦宪法，规定加泰罗尼亚、巴斯克与葡萄牙各自保留什么。他说过一句让两边都不舒服的话：\"公社不需要宪法，联邦需要。\""
 CAN_krcw_coldwell:0 "M·J·科德威尔"
 CAN_krcw_coldwell_desc:0 "萨斯卡通的教师，草原合作社运动的政治领袖。他代表的是工团共和国里最不革命也最稳固的一块：小麦、合作社、信用社与教区学校。他对密西西比河以东的革命输出没有兴趣，理由是草原的农民卖不出小麦就会投票把政府换掉——而工团共和国还没有学会怎么输掉一场选举。"
 CAN_krcw_mcewen:0 "汤姆·麦克尤恩"
 CAN_krcw_mcewen_desc:0 "工会报纸的编辑，共和国里最好的宣传家，也是把美国工团主义者偷渡过边界那套系统的组织者。他的立场介于伍兹沃思的和平主义与巴克的输出革命之间：不派兵，但也绝不关上那条地下通道，因为\"密西西比河东岸的同志\"如果被朗的人抓住，下一个就是边界这一侧。"
 CAN_krcw_murray:0 "伦纳德·默里"
 CAN_krcw_murray_desc:0 "共和国海军的建立者，一个从大湖区的炮艇起步管到北大西洋护航的军官。他的政治立场是纯粹的地理判断：加拿大守不住一条陆上边界，但它可以让任何人都无法封锁圣劳伦斯河。他主张共和国的全部军费应该花在海上，而这让他与所有陆军出身的政治家为敌。"
 krcw_wgr_the_arrivals:0 "来的人"
 krcw_wgr_the_arrivals_desc:0 "每年有几万人从铁丝网那边过来，而他们不是随机的一群：医生、工程师、车床工、教师。共和国得到的是一份别人培养好的技工名册，付出的是住房、学校与一句没人愿意说出口的话——安置他们的钱，本来是本国工人的住宅预算。"
 krcw_wgr_the_open_door:0 "敞开的门"
 krcw_wgr_the_open_door_desc:0 "共和国的法律规定：任何一个德国人踏进这一侧就是本国公民，不需要申请，不需要审查。这条法律每年花掉相当于两个师的钱，而它比任何广播都有效——因为它不是宣传，它是一扇真的开着的门。"
 krcw_wgr_the_managed_intake:0 "有额度的接收"
 krcw_wgr_the_managed_intake_desc:0 "相反的选择：按住房与工作岗位的实际数量设定年度额度，超出的人排队。这在道义上很难看，在行政上是唯一能运转的办法——一九五一年鲁尔的收容所里住了十一万人，而那年新建的住宅是四万套。"
 krcw_wgr_the_workers_army:0 "工人的军队"
 krcw_wgr_the_workers_army_desc:0 "一支由工会推选军官、士兵有申诉权、拒绝非法命令受法律保护的军队。职业军人认为这样的部队打不了仗；一九四三年的经验说恰恰相反，因为这是唯一一支不会被用来对付本国工人的德国军队。"
 krcw_wgr_the_general_staff_returns:0 "总参谋部回来了"
 krcw_wgr_the_general_staff_returns_desc:0 "把一九四三年清洗掉的那批参谋军官请回来——他们懂得怎么在中欧平原上指挥一场战役，而共和国的工会军官不懂。代价写在代表大会的反对票里：这些人二十年前效忠的是皇帝，十年前效忠的是另一个德国。"
 krcw_wgr_the_german_inheritance:0 "德意志的遗产"
 krcw_wgr_the_german_inheritance_desc:0 "两个德国争的不只是领土，还有歌德、巴赫、洪堡与那些档案。共和国的立场是：这些东西不属于任何一个政权，属于说这门语言的人，因此两边的学者都可以来用——这个立场花的钱不多，效果是每年有一批东德的教授申请长期\"学术访问\"。"
 krcw_wgr_took_our_people:0 "收走我们的人"
 krcw_wgr_arrivals_tt:0 "接收人口指数：[?krcw_wgr_arrivals]"
 krcw_wgr_the_reception_centres:0 "收容所"
 krcw_wgr_the_reception_centres_desc:0 "把鲁尔的旧兵营改成收容所，接收从东德过来的人。入籍手续简单，难的是住房、工作和子女入学。"
 krcw_wgr_the_door_stays_open:0 "坚持无条件接收"
 krcw_wgr_the_door_stays_open_desc:0 "代表大会拒绝设定接收额度：限制东德人入境，等于承认分界线是国境线。安置费用很高。"
 krcw_wgr_the_intake_quota:0 "接收额度"
 krcw_wgr_the_intake_quota_desc:0 "按现有住房与工作岗位设定每年的接收额度，其余人排队等候。本地工会支持这一方案，因为本地居民也在等住房。"
 krcw_wgr_what_they_brought:0 "统计东来人才"
 krcw_wgr_what_they_brought_desc:0 "统计东德来者中的工程师、医生与熟练技工，把他们分配到最缺人的行业。"
 krcw_wgr_rearming_germans:0 "重建武装力量"
 krcw_wgr_rearming_germans_desc:0 "常备军只有十六个师，对面有三十一个。扩军本身没有争议，争议在于如何保证这支军队不会被用来对付工人。"
 krcw_wgr_the_union_officers:0 "由工会推选军官"
 krcw_wgr_the_union_officers_desc:0 "军官由工会推选，士兵有申诉权，拒绝非法命令受法律保护。军队的效率会下降，但政治上最可靠。"
 krcw_wgr_recall_the_staff:0 "召回参谋部"
 krcw_wgr_recall_the_staff_desc:0 "召回一九四三年被清洗的参谋军官，他们熟悉中欧平原上的大兵团作战。代表大会中反对声很大，因为他们曾效忠帝国。"
 krcw_wgr_the_oath:0 "修订军人誓词"
 krcw_wgr_the_oath_desc:0 "新的军人誓词不提任何人名，也不提政府，只宣誓保卫宪法，并拒绝执行违宪的命令。"
 krcw_wgr_what_the_ruhr_is_for:0 "确定鲁尔的生产方向"
 krcw_wgr_what_the_ruhr_is_for_desc:0 "鲁尔重建完成后，国防部、住房部与外贸部各自提出了钢材的用途：装甲师、消费品，或出口换汇。由计划委员会裁定。"
 krcw_wgr_the_consumer_decade:0 "优先发展消费品"
 krcw_wgr_the_consumer_decade_desc:0 "第二个十年的钢优先用于住房、电器和自行车。住房部认为，西柏林的影响力取决于商店里真有东西可买。"
 krcw_wgr_the_armoured_decade:0 "优先建设装甲师"
 krcw_wgr_the_armoured_decade_desc:0 "第二个十年的钢优先用于装甲师。国防部认为，易北河对岸的兵力优势必须先抵消，其他事情可以等。"
 krcw_wgr_the_two_inheritances:0 "开放文化遗产"
 krcw_wgr_the_two_inheritances_desc:0 "歌德、巴赫与洪堡大学的藏书都在东德境内。共和国不要求归还，而是主张这些遗产属于全体德国人，向东德学者开放本国档案馆。"
 krcw_wgr_60_t:0 "住宅名单上的人"
 krcw_wgr_60_d:0 "鲁尔一座收容所外面出了一件小事：本地工会的人拉了一条横幅，上面写着\"我们也在名单上\"。没有冲突，没有口号，横幅挂了两个小时就自己收了。\n\n住房部长把这件事写进了当周的内阁报告，并且加了一句自己的判断：\"这不是排外。这是两拨人排在同一份名单上，而名单太短。如果我们不回答这个问题，会有人替我们回答。\""
 krcw_wgr_60.a:0 "优先安置本地名单上的人"
 krcw_wgr_60.b:0 "两边并列，把住宅预算翻倍"
 krcw_wgr_60.c:0 "把来的人直接送去缺人的工厂"
 krcw_wgr_62_t:0 "这支军队听谁的"
 krcw_wgr_62_d:0 "扩军案的辩论到第四天，一名来自汉堡的老代表要求发言。他一九一八年在基尔当水兵，一九一九年在柏林见过自由军团进城。\n\n\"同志们，我不反对师。我反对的是我这辈子见过两次的那件事：德国的军队被用来对付德国的工人。一九一九年干这件事的人穿的是共和国的军服。所以我只问一句——第三次的时候，谁来拦住他们？\"\n\n台尔曼当天下午回答了这个问题，回答只有一句：\"宪法。而宪法要靠我们现在写的这几行字。\""
 krcw_wgr_62.a:0 "把拒绝非法命令写进军法"
 krcw_wgr_62.b:0 "军队的最终指挥权交给代表大会"
 krcw_wgr_62.c:0 "现在不谈这个，先把师建起来"
 krcw_wgr_64_t:0 "三份草案"
 krcw_wgr_64_d:0 "计划委员会的会议记录留下了三句话，分别来自三位部长。\n\n国防部长：\"从易北河对岸到莱茵河三百公里。\"\n住房部长：\"西柏林的橱窗之所以有效，是因为里面真的有东西。\"\n外贸部长：\"这两位说的钢，我们还得先卖掉一部分才付得起买铁矿石的钱。\"\n\n三个人都对。计划委员会主席在记录的末尾写了一句：\"本委员会无权决定这个国家是什么。请代表大会决定。\""
 krcw_wgr_64.a:0 "交给代表大会公开辩论"
 krcw_wgr_64.b:0 "三样都要一点，谁也不得罪"
 krcw_wgr_64.c:0 "由国防部决定：这是前线国家"
 WGR_krcw_brandt:0 "威利·勃兰特"
 WGR_krcw_brandt_desc:0 "一九三三年流亡挪威，一九四五年回来的那一代人里最年轻的一个。他主持了收容所与\"门继续开着\"那条法律的起草，理由是他自己就是一个越过边界的德国人。他的政治判断建立在一件事上：共和国赢不了军备竞赛，但它可以让对面的人用脚投票。"
 WGR_krcw_renn:0 "路德维希·雷恩"
 WGR_krcw_renn_desc:0 "贵族出身的旧军官，一九一四年的连长，后来写了一本关于战争的书而成了共产党人，一九三六年在西班牙指挥过国际纵队的一个营。他是\"工会推选军官\"那条路线唯一有资格提出的人，因为他同时懂旧军队和新军队，而他对旧军队的评价只有一句：他们很能打，而且谁给钱就替谁打。"
 krcw_ddr_succession_roll_tt:0 "施莱歇尔去世时，权力交接是否平稳取决于这里的决定。"
 krcw_ddr_after_schleicher:0 "施莱歇尔之后"
 krcw_ddr_after_schleicher_desc:0 "这个政权的全部结构建立在一个人身上：唯一能同时和将军与文官说话的人。他走了以后，两边发现他们从来没有学会直接对话——因为二十年里从来不需要。"
 krcw_ddr_the_marshals_republic:0 "元帅的共和国"
 krcw_ddr_the_marshals_republic_desc:0 "总参谋部直接接管，不再假装文官政府存在。这让决策快了很多，也让共和国第一次名副其实地成为协定里最像军营的成员——莫斯科对此表示满意，而这句满意本身就说明了问题。"
 krcw_ddr_the_lawyers_republic:0 "法学家的共和国"
 krcw_ddr_the_lawyers_republic_desc:0 "相反的结局：宪法法院裁定总参谋部对部长任命的否决权从来没有法律依据，而军方——出乎所有人意料——接受了这个裁决。接受的理由不高尚：将军们发现自己不想承担治理一个国家的责任。"
 krcw_ddr_the_shop_window_war:0 "橱窗的战争"
 krcw_ddr_the_shop_window_war_desc:0 "共和国决定在自己最不擅长的战场上应战：商店。莱比锡与德累斯顿的百货公司重新开张，自行车、收音机与冰箱的产量写进了计划的第一页。这场仗打得很吃力，而不打的代价是每年几万人。"
 krcw_ddr_the_other_germanys_problem:0 "那是另一个德国的问题"
 krcw_ddr_the_other_germanys_problem_desc:0 "相反的决定：不和莱茵河比商店。共和国的宣传转而强调它有的东西——秩序、免费的大学、没有失业、没有罢工。这套说法对一部分人有效，而对拿着单程票站在地铁站里的人无效。"
 krcw_ddr_the_cage:0 "笼子"
 krcw_ddr_the_cage_desc:0 "协定的前线成员享有最高的军援优先权，也承受最严的限制：不得单独与西方谈判，不得削减军费，不得在莫斯科反对时改变边界政策。华沙的将军每年去莫斯科一次；柏林的将军每月去一次。"
 krcw_ddr_rival_germany:0 "对面的德国"
 krcw_ddr_the_old_man:0 "讨论施莱歇尔身后安排"
 krcw_ddr_the_old_man_desc:0 "施莱歇尔一九四九年已六十七岁，没有指定继承人，也没有建立政党。政权的运转完全依赖他本人。"
 krcw_ddr_the_staff_takes_over:0 "总参谋部接管"
 krcw_ddr_the_staff_takes_over_desc:0 "施莱歇尔死后，总参谋部成立国防委员会行使元首职权，并承诺局势稳定后恢复文官政府。莫斯科表示支持。"
 krcw_ddr_the_court_rules:0 "交宪法法院裁决任命权"
 krcw_ddr_the_court_rules_desc:0 "宪法法院裁定总参谋部对文官任命的否决权违宪，军方接受了裁决。"
 krcw_ddr_the_republic_without_him:0 "建立集体决策程序"
 krcw_ddr_the_republic_without_him_desc:0 "建立不依赖施莱歇尔的集体决策程序。第一年接连出现内阁危机，此后逐渐稳定。"
 krcw_ddr_thirty_one_divisions:0 "审查陆军规模"
 krcw_ddr_thirty_one_divisions_desc:0 "共和国有三十一个师，西德只有十六个。审查陆军规模，决定这支军队的主要任务。"
 krcw_ddr_the_army_faces_west:0 "以易北河为主要方向"
 krcw_ddr_the_army_faces_west_desc:0 "陆军全部按对国际作战来编组和部署，国内秩序交给人民警察。莫斯科追加了两个装甲师的装备。"
 krcw_ddr_the_army_faces_inward:0 "部署战略预备队于内地"
 krcw_ddr_the_army_faces_inward_desc:0 "两个军以\"战略预备队\"名义驻在莱比锡与德累斯顿附近，用于维持国内秩序。作战能力下降，政权更稳。"
 krcw_ddr_the_oath_of_the_reichswehr:0 "修订军人誓词"
 krcw_ddr_the_oath_of_the_reichswehr_desc:0 "皇位空缺，宪法可由法院解释，新的军人誓词只宣誓效忠\"德意志民族共和国\"。"
 krcw_ddr_the_window_across_the_wire:0 "研究西柏林的影响"
 krcw_ddr_the_window_across_the_wire_desc:0 "每天有几万东德人持通行证进入西柏林。限制通行证和官方解释都没有效果，内务部开始研究对策。"
 krcw_ddr_fight_for_the_window:0 "扩大消费品供应"
 krcw_ddr_fight_for_the_window_desc:0 "重开莱比锡和德累斯顿的百货公司，增加自行车、收音机和冰箱产量，价格由国家补贴。资金从装甲师预算中挤出。"
 krcw_ddr_refuse_the_contest:0 "宣传社会保障成就"
 krcw_ddr_refuse_the_contest_desc:0 "不与西德比商品，宣传转而强调本国的秩序、免费大学和充分就业。"
 krcw_ddr_the_price_of_the_front:0 "接受协定前线义务"
 krcw_ddr_the_price_of_the_front_desc:0 "作为协定前线，共和国享有最高军援优先权，但不得单独与西方谈判，不得削减军费，边界政策须服从莫斯科。"
 DDR_krcw_heinrici:0 "戈特哈德·海因里齐"
 DDR_krcw_heinrici_desc:0 "防御战的专家，一个以吝啬著称的将军——吝啬于阵地、吝啬于人命、吝啬于言辞。他是总参谋部在施莱歇尔之后的人选，而他对这个位置的兴趣近乎于零：他认为治理国家是文官的活，军人的活是让易北河这条线不需要被真正防守。"
 DDR_krcw_bruning:0 "海因里希·布吕宁"
 DDR_krcw_bruning_desc:0 "旧中央党的财政专家，一个靠紧缩预算活过三场危机的人。他是文官一方最有资格的候选人，也是最不受欢迎的：他的方案总是正确的，总是痛苦的，而且总是在事后才被承认是正确的。他主张削减军费，理由是一个破产的前线不是前线。"
 DDR_krcw_joos:0 "约瑟夫·约斯"
 DDR_krcw_joos_desc:0 "天主教工会的编辑，共和国里唯一有组织基础而不属于军队也不属于官僚的政治家。他代表的是那些既不想要元帅也不想要法学家的人，而他的纲领只有一条实际主张：与莱茵河那一侧恢复通信、探亲与货运，因为被铁丝网分开的家庭不关心谁的宪法更正当。"
 krcw_ddrd_30_t:0 "一个人的日程表"
 krcw_ddrd_30_d:0 "内政部那份机密评估只有九页，而它的结论让读到的人都不舒服：本政权没有继承程序。王座是空的且合法地空着，宪法没有规定元首缺位时谁代理，而总参谋部对文官任命的否决权从来没有写进任何法律。\n\n评估的最后一段是一个假设：\"如果元首今天缺位，明天上午会有两个机构同时宣称自己有权任命总理，而它们都没有错。\""
 krcw_ddrd_30.a:0 "立法确定继承程序"
 krcw_ddrd_30.b:0 "由总参谋部预先指定代理人"
 krcw_ddrd_30.c:0 "销毁这份评估"
 krcw_ddrd_38_t:0 "施莱歇尔之死"
 krcw_ddrd_38_d0:0 "库尔特·冯·施莱歇尔在波茨坦的寓所里去世。当天下午，总参谋部按照事先存档的指定书宣布，戈特哈德·海因里齐上将代理元首职权。人民议院在第二天一致追认。莫斯科的唁电与贺电同时到达。"
 krcw_ddrd_38_d1:0 "库尔特·冯·施莱歇尔在波茨坦的寓所里去世。人民议院按照新的继承法在十天内召开选举会议，总参谋部提名的戈特哈德·海因里齐以多数票当选。反对票有六十三张，这是共和国历史上第一次有人公开投反对票。"
 krcw_ddrd_38_d2:0 "库尔特·冯·施莱歇尔在波茨坦的寓所里去世。第二天上午，总参谋部与内阁各自发表声明，宣布由自己负责任命临时政府。两份声明都引用了宪法，而宪法对这个问题一个字也没有写。柏林卫戍区的两个团被调进了市区。"
 krcw_ddrd_38.a:0 "海因里齐按预定程序代理元首职权"
 krcw_ddrd_38.b:0 "人民议院选出海因里齐"
 krcw_ddrd_38.c:0 "先让总参谋部稳住局面"
 krcw_ddrd_38.d:0 "请宪法法院裁定谁有权任命"
 krcw_ddrd_32_t:0 "部署图上的两个军"
 krcw_ddrd_32_d:0 "预算听证会上，一名文官议员问了一个本来不该在公开场合问的问题：为什么第三军和第七军的驻地在莱比锡与德累斯顿附近，而不是在易北河沿线？\n\n国防部的答复是\"战略预备队\"。提问的议员没有追问，但他在散会后对同僚说了一句话，第二天传遍了整栋楼：\"战略预备队的位置，应该在前线后面。不应该在工厂旁边。\""
 krcw_ddrd_32.a:0 "把两个军调往易北河"
 krcw_ddrd_32.b:0 "维持现状，不再解释"
 krcw_ddrd_32.c:0 "把内部任务全部交给人民警察"
 krcw_ddrd_34_t:0 "他们被看见的东西说服"
 krcw_ddrd_34_d:0 "统计局的报告只有一句结论，而这句结论推翻了内政部十年的工作方法：\"他们不是被说服的。他们是被看见的东西说服的。\"\n\n报告附了一份细目：持通行证进入西柏林的公民里，百分之七十四在同一天返回，百分之二十六在三个月内申请了第二次通行证，而这百分之二十六里有相当一部分再也没有回来。"
 krcw_ddrd_34.a:0 "在商店上应战"
 krcw_ddrd_34.b:0 "限制通行证"
 krcw_ddrd_34.c:0 "改变宣传的题目"
 krcw_ddrd_36_t:0 "每月一次的那趟火车"
 krcw_ddrd_36_d:0 "柏林的总参谋长每月去莫斯科一次。这不是荣誉，是制度：协定的前线成员在军备、边界政策与对西方接触上都需要事先协调，而\"协调\"这个词在实践中的含义所有人都明白。\n\n一九五二年，一名年轻的参谋官在私人信件里写了一句后来被档案馆保存下来的话：\"华沙的将军每年去一次，布加勒斯特的将军两年去一次。我们每月去一次。我们不是协定最重要的成员，我们是它最不自由的成员，而这两件事看起来很像。\""
 krcw_ddrd_36.a:0 "接受这个位置的代价"
 krcw_ddrd_36.b:0 "要求与华沙同等的待遇"
 krcw_ddrd_36.c:0 "悄悄开一条与莱茵河的直接渠道"
 krcw_wgr_the_second_shift:0 "第二班"
 krcw_wgr_the_second_shift_desc:0 "共和国的法律早就规定男女同工同酬，而托儿所、食堂与洗衣房是一九五二年才修起来的。在那之前，女工下班以后还有一份没有报酬的工作等着她们，而工会用了十年才承认这也是劳动问题。"
 krcw_wgr_the_young_republic:0 "年轻的共和国"
 krcw_wgr_the_young_republic_desc:0 "一九五二年入学的孩子对帝国没有记忆，对一九四三年也没有。他们是第一代在这个国家出生并认为它正常的人——而正常是革命能取得的最彻底的胜利，也是它最难面对的一件事。"
 krcw_wgr_the_church_settlement:0 "与教会的和解"
 krcw_wgr_the_church_settlement_desc:0 "共和国不没收教产，不禁止讲道，也不办无神论的宣传;教会不评论选举，不组织政党，并且为战争中死去的人举行任何家属要求的仪式。双方都不满意，双方都遵守了三十年。"
 krcw_wgr_the_rhine_bridgehead:0 "莱茵桥头"
 krcw_wgr_the_rhine_bridgehead_desc:0 "国际的一体化在纸面上是巴黎的事，在实际上是莱茵河的事：所有向东的铁路、所有输电线、所有清算所的德国分行都在这里。一个边界就是前线的成员国，也是整个阵营的转运站。"
 krcw_wgr_the_german_laboratories_two:0 "德国的实验室"
 krcw_wgr_the_german_laboratories_two_desc:0 "光学、化工、机床、无线电——帝国留下的工业科学基础没有被轰炸掉，只是换了主人。共和国把它交给了工会办的技术学院，而十年后国际所有成员的机床图纸上都写着德文的公差标注。"
 krcw_wgr_the_solidarity_brigades:0 "团结旅"
 krcw_wgr_the_solidarity_brigades_desc:0 "共和国向亚洲、非洲与拉丁美洲派出的不是军队而是工程队：修铁路、建发电站、办技工学校。这件事的动机没有写在文件上，但每个参与的人都明白：一个刚刚被原谅的民族，需要被人需要。"
 krcw_wgr_the_question_of_the_women:0 "回应克雷菲尔德罢工"
 krcw_wgr_the_question_of_the_women_desc:0 "一九五一年克雷菲尔德纺织厂罢工，女工提出三项要求：厂区托儿所、食堂和提前一周公布排班表。"
 krcw_wgr_the_nurseries:0 "兴建托儿所与食堂"
 krcw_wgr_the_nurseries_desc:0 "每个厂区建一间托儿所、一间食堂和一间洗衣房，由车间委员会管理，经费从消费品预算中拨出。"
 krcw_wgr_the_generation_without_memory:0 "改革历史教育"
 krcw_wgr_the_generation_without_memory_desc:0 "战后入学的孩子对帝国和一九四三年都没有记忆。历史课改为讲清事实，不再以培养恐惧为目的。"
 krcw_wgr_the_churches:0 "与教会签订协议"
 krcw_wgr_the_churches_desc:0 "共和国不没收教产、不限制讲道，教会不介入选举、不组建政党。教会可为任何一方的战死者举行宗教仪式。"
 krcw_wgr_the_war_dead:0 "建立战争死难者纪念碑"
 krcw_wgr_the_war_dead_desc:0 "为战死者建一座纪念碑，不列名单，不分阵营，只刻\"给所有被送去的人\"。"
 krcw_wgr_the_normal_country:0 "承认革命的成果"
 krcw_wgr_the_normal_country_desc:0 "罢工和委员会出席率都在下降，生活水平在上升。老党员认为革命在退化，党的立场是这说明革命已经站稳。"
 krcw_wgr_the_bridgehead:0 "建设莱茵转运枢纽"
 krcw_wgr_the_bridgehead_desc:0 "国际向东的铁路、输电线和清算所分行都经过莱茵河。把这里建成全阵营的转运枢纽，西德在国际中的地位随之上升。"
 krcw_wgr_the_transhipment_yards:0 "转运场"
 krcw_wgr_the_transhipment_yards_desc:0 "在鹿特丹与安特卫普上岸的货物在这里换轨、分装、编组，再运往前线仓库。平时是贸易，战时是补给。"
 krcw_wgr_the_german_seat:0 "要求易北河事务同意权"
 krcw_wgr_the_german_seat_desc:0 "德国在国际执行局只有一席，却提供阵营三分之一的重工业和全部前线。要求任何涉及易北河的决议须经德国同意。"
 krcw_wgr_the_common_defence_industry:0 "统一军工规格"
 krcw_wgr_the_common_defence_industry_desc:0 "坦克、卡车与火炮按国际统一规格生产，零件和弹药在各成员国通用。德国兵工厂从此也为其他成员国的军队生产。"
 krcw_wgr_the_veto_on_the_elbe:0 "取得易北河否决权"
 krcw_wgr_the_veto_on_the_elbe_desc:0 "国际接受柏林的要求：涉及易北河的决议须经德国同意。战与和的最后一票交给了首当其冲的成员。"
 krcw_wgr_the_federation_of_labour_german:0 "欧洲劳动联邦（德国）"
 krcw_wgr_the_federation_of_labour_german_desc:0 "德国工会联合会提出，跨国机构可以分配钢铁等资源，但不能支配各地车间的劳动。这一原则被写入联邦章程。"
 krcw_wgr_optics_and_chemicals:0 "发展光学与化工"
 krcw_wgr_optics_and_chemicals_desc:0 "保留蔡司、拜耳与巴斯夫的研究部门和人员，划归工会办的技术学院管理。"
 krcw_wgr_the_machine_tool_standard:0 "统一机床标准"
 krcw_wgr_the_machine_tool_standard_desc:0 "国际各国使用四套不同的公差标准，零件无法互换。统一采用最精细的德国标准。"
 krcw_wgr_the_workers_technical_schools:0 "工人技术学院"
 krcw_wgr_the_workers_technical_schools_desc:0 "每个工业区开办一所技术学院，学费由工会支付，入学考数学而不考拉丁文。工人子弟可以成为工程师。"
 krcw_wgr_the_computing_institute:0 "计算研究所"
 krcw_wgr_the_computing_institute_desc:0 "为楚泽建立计算研究所，不受军方监督。首要任务是计算计划经济的物资平衡表，这项工作过去靠人工要算六个月。"
 krcw_wgr_the_engineers_abroad:0 "派遣海外工程队"
 krcw_wgr_the_engineers_abroad_desc:0 "向亚洲、非洲和拉丁美洲派出工程队，修铁路、建电站、办技校，而不派军队。"
 krcw_wgr_the_technical_schools_abroad:0 "海外技工学校"
 krcw_wgr_the_technical_schools_abroad_desc:0 "在印度、印度尼西亚和西非开办双语技工学校，毕业生留在本国工作。见效慢，但成本低，影响持久。"
 krcw_wgr_the_forgiven_nation:0 "在加尔各答建发电站"
 krcw_wgr_the_forgiven_nation_desc:0 "德国工程队在加尔各答建成的发电站投入运行。德国在海外的形象第一次与工程和建设联系在一起。"
 krcw_wgr_the_other_germanys_shadow:0 "与东德竞争援外项目"
 krcw_wgr_the_other_germanys_shadow_desc:0 "东德也在第三世界派工程师、签援助协定。受援国开始让两个德国相互竞价。"
 krcw_wgr_70_t:0 "要求书上没有提工资"
 krcw_wgr_70_d:0 "克雷菲尔德的纺织厂罢工进入第六天，而让工会执行委员会为难的不是罢工本身，是那份要求书：五条要求里没有一条提到工资。第一条是厂区托儿所，第二条是食堂，第三条是把班次表提前一周公布。\n\n一名女工代表在谈判桌上说了一句让在座的男人都没法反驳的话：\"同志们，你们的八小时工作制我们也有。可是你们下班以后就下班了。\""
 krcw_wgr_70.a:0 "全部接受，从消费品预算里出钱"
 krcw_wgr_70.b:0 "由车间委员会自己办，国家不管"
 krcw_wgr_70.c:0 "先解决工资，托儿所下一个五年计划"
 krcw_wgr_72_t:0 "第三条"
 krcw_wgr_72_d:0 "与教会的谈判在前两条上很快达成：共和国不动教产，教会不组织政党。第三条谈了四个月。\n\n争的是战争中死去的人。共和国希望国家仪式，教会要求家属可以选择宗教葬礼——包括那些穿着帝国军服死在东线的人。一名主教在僵持的时候说了一句话，后来被双方都引用：\"神父不问那个孩子穿的是哪一边的军服。母亲也不问。\""
 krcw_wgr_72.a:0 "接受第三条"
 krcw_wgr_72.b:0 "只允许国家仪式"
 krcw_wgr_74_t:0 "赢了以后的日子"
 krcw_wgr_74_d:0 "代表大会的出席率报告摆在主席台上：车间委员会的平均出席率从一九四九年的百分之八十一降到了一九五三年的百分之四十三。经济指标同期全部上升。\n\n台尔曼在他最后一次讲话里没有回避这份报告：\"同志们，我知道你们想听什么。你们想听我说这是背叛，是官僚化，是革命的敌人在起作用。不是。这是我们赢了。赢了以后的日子比打的时候难过，因为没有人写过怎么过。\""
 krcw_wgr_74.a:0 "接受这是胜利的形状"
 krcw_wgr_74.b:0 "发动一次重振委员会的运动"
 krcw_wgr_76_t:0 "一席"
 krcw_wgr_76_d:0 "执行局的席位分配是一九四六年定的，当时德意志社会主义共和国刚刚成立，工业还在废墟里。十年后，这一席的持有者代表着阵营三分之一的重工业和百分之百的前线。\n\n柏林的提案很克制：不要求更多席位，只要求一条规则——任何涉及易北河的决议需要德国同意。提案的最后一句写得很平静：\"我们不是要求特权。我们是要求在决定我们是否被摧毁时在场。\""
 krcw_wgr_76.a:0 "坚持这条规则"
 krcw_wgr_76.b:0 "换成要求更多的军援"
 krcw_wgr_78_t:0 "六个月的表"
 krcw_wgr_78_d:0 "楚泽在经济部的演示只用了二十分钟。他带来的机器算完了一张物资平衡表——钢、煤、水泥、机床在全国各部门之间的分配——用了四十分钟。\n\n经济部手算同一张表需要六个月，而计划的周期是一年。会议结束后一名年轻的统计员在走廊里说了一句话，被记在了当天的会议记录边缘：\"如果这东西能算物资，它也能算价格。那我们还需要计划委员会吗？\""
 krcw_wgr_78.a:0 "用它来做计划"
 krcw_wgr_78.b:0 "交给军方：弹道与防空"
 krcw_wgr_78.c:0 "让研究所自己决定研究方向"
 krcw_wgr_80_t:0 "这次带着电"
 krcw_wgr_80_d:0 "加尔各答那座发电站通电的第三天，柏林的外交部收到了一份翻译好的当地报纸头版。标题只有一行：\"德国人回来了，这次带着电。\"\n\n外交部长把这份翻译裱了起来。他在内阁会议上解释原因时，说的话与外交无关：\"各位，我这一代人在国外听过的关于德国人的话，没有一句是这样的。我想让这句话挂在墙上，让年轻人知道这是可能的。\""
 krcw_wgr_80.a:0 "扩大这个计划"
 krcw_wgr_80.b:0 "把资源转回国内"
 WGR_krcw_zuse:0 "康拉德·楚泽"
 WGR_krcw_zuse_desc:0 "一九四一年就造出可编程机器的工程师，然后战争把这件事埋了八年。他对政治毫无兴趣，对意识形态更没有——他要的只是预算和不被军方监督。共和国给了他这两样，而他给共和国的第一个提议是用机器计算计划经济的物资平衡表。"
 krcw_eng_the_union_of_four:0 "四个联合会的联盟"
 krcw_eng_the_union_of_four_desc:0 "不列颠联盟的名字里有\"联盟\"两个字，而三十年来没有人写清楚联盟的成员是谁。一九五三年的宪章终于写下来了：英格兰、苏格兰、威尔士与北方各郡的产业联合会各自派代表，席位按会员数而不按人口——这条规则让威尔士的矿工比人口给他们的分量更重，而这正是通过它的原因。"
 krcw_eng_the_land_question_settled:0 "土地问题的解决"
 krcw_eng_the_land_question_settled_desc:0 "工团主义对工厂有一整套理论，对农场一句也没有。一九四九年不列颠的粮食有三分之二靠进口，而配给制之所以拖到一九五一年，原因就写在这一行里。最后的办法既不是集体农场也不是地主：郡一级的农业联合会，成员是农民自己，机械与化肥由国家统一采购。"
 krcw_eng_the_merchant_fleet:0 "商船队"
 krcw_eng_the_merchant_fleet_desc:0 "海军打仗，商船队吃饭。一个进口三分之二粮食的岛国，它的战略资产是三千艘挂着红旗的货轮和它们背后的船东工会——而这支船队同时是整个国际的运力：伊比利亚的矿砂、斯堪的纳维亚的木材、印度的棉花都走它的船。"
 krcw_eng_the_commonwealth_of_labour_idea:0 "劳动的共同体"
 krcw_eng_the_commonwealth_of_labour_idea_desc:0 "帝国解散得比任何人预料的都快，而留下的东西没有消失：共同的法律传统、共同的铁路规格、共同的语言与三代人的私人关系。共和国用这些东西换了一个新的位置——不是宗主国，是一个所有前殖民地都愿意打电话过来的地方。"
 krcw_eng_what_the_union_is:0 "起草联盟宪章"
 krcw_eng_what_the_union_is_desc:0 "\"不列颠联盟\"的成员从未写明。起草联盟宪章，确定英格兰、苏格兰、威尔士与北方各郡的关系。"
 krcw_eng_the_charter_of_the_four:0 "四方宪章"
 krcw_eng_the_charter_of_the_four_desc:0 "四地的产业联合会各派代表，席位按工会会员数而非人口分配。组织率高的威尔士矿工因此占了较多席位。"
 krcw_eng_the_single_congress:0 "单一代表大会"
 krcw_eng_the_single_congress_desc:0 "代表大会为唯一主权机构，苏格兰与威尔士的大会降为地区行政机关。英格兰支持，苏格兰和威尔士强烈不满。"
 krcw_eng_the_irish_question_after:0 "与都柏林签订劳工协定"
 krcw_eng_the_irish_question_after_desc:0 "与都柏林的工团共和国签订劳工协定：两国工人在对方国家享有本国工人的全部权利。"
 krcw_eng_the_isles_settled:0 "确认群岛现状"
 krcw_eng_the_isles_settled_desc:0 "确认群岛现状：不列颠联盟与爱尔兰工团共和国各自存在，边界不再争议，两国工人自由流动。"
 krcw_eng_the_farm_without_a_theory:0 "制定农业政策"
 krcw_eng_the_farm_without_a_theory_desc:0 "不列颠三分之二的粮食依赖进口，配给制因此拖到一九五一年。工团主义没有现成的农业方案，需要制定一套。"
 krcw_eng_the_county_federations:0 "郡农业联合会"
 krcw_eng_the_county_federations_desc:0 "在郡一级成立农业联合会：土地归联合会，使用权归农户，机械、化肥与种子由国家统一采购、按成本分配。"
 krcw_eng_farm_mech:0 "农业机械化"
 krcw_eng_the_tractor_and_the_fen:0 "排干东部沼泽"
 krcw_eng_the_tractor_and_the_fen_desc:0 "推广农业机械，同时动用退役工兵排干东部沼泽地，扩大耕地面积。"
 krcw_eng_the_end_of_the_import_bill:0 "实现粮食半数自给"
 krcw_eng_the_end_of_the_import_bill_desc:0 "粮食自给率首次过半，海上封锁不再能使不列颠陷入饥荒。"
 krcw_eng_three_thousand_freighters:0 "整合商船队"
 krcw_eng_three_thousand_freighters_desc:0 "把三千艘商船整合为统一调度的船队。它既供应不列颠的粮食，也承担整个国际的海运。"
 krcw_eng_the_seamens_charter:0 "海员宪章"
 krcw_eng_the_seamens_charter_desc:0 "颁布海员宪章：规定最长航次和伙食标准，海员可在任何国际成员国港口下船回家，费用由船队承担。"
 krcw_eng_what_the_empire_left:0 "利用旧帝国的联系"
 krcw_eng_what_the_empire_left_desc:0 "旧帝国留下的法律传统、铁路规格和语言仍在。利用这些联系，发展与前殖民地的新关系。"
 krcw_eng_the_lawyers_and_the_engineers:0 "向前殖民地派技术顾问"
 krcw_eng_the_lawyers_and_the_engineers_desc:0 "向前殖民地派遣法律顾问、铁路工程师和会计，协助它们建立法律、交通与审计制度。"
 krcw_eng_the_place_everyone_telephones:0 "渗透印度联邦的文官系统"
 krcw_eng_the_place_everyone_telephones_desc:0 "印度联邦的部委仍在用伦敦当年的表格和档案。联邦情报部门借技术援助的渠道，在德里的文官和铁路职员中发展联络人。外交部担心一旦暴露，前殖民地都会关上大门。"
 krcw_eng_90_t:0 "四个联合会还是一个国家"
 krcw_eng_90_d:0 "宪章委员会卡在第一条上，而争论的实质不是法律而是算术：如果席位按工会会员数分配，威尔士的矿工会拿到远超人口比例的席位；如果按人口分配，英格兰永远是多数，苏格兰与威尔士的大会就只是装饰。\n\n一名格拉斯哥代表把这件事说到了底：\"各位，我们可以有一个公平的议会，也可以有一个联盟。三十年来我们靠含糊过日子，而含糊现在到期了。\""
 krcw_eng_90.a:0 "按会员数：这是劳动的议会"
 krcw_eng_90.b:0 "按人口：一人一票"
 krcw_eng_90.c:0 "两院制：一院按人口，一院按产业"
 krcw_eng_92_t:0 "农民算不算工人"
 krcw_eng_92_d:0 "农业部的备忘录把一个回避了三十年的问题摆到了代表大会面前：一个自己耕种自己土地的农民，在一个工团主义共和国里算什么？\n\n他不雇工，所以不是资本家;他不受雇，所以不是工人;他拥有生产资料，而革命的全部纲领是生产资料归集体所有。\n\n一名林肯郡的农民代表在听证会上的发言解决了这场辩论：\"诸位先生，我的地在我手里，我的拖拉机在银行手里，我的价格在你们手里。你们说我是什么，我就是什么——只要别在播种的时候来问我。\""
 krcw_eng_92.a:0 "郡农业联合会：土地归联合会，使用权归农户"
 krcw_eng_92.b:0 "国营农场：彻底集体化"
 krcw_eng_92.c:0 "不动农业，继续进口"
 krcw_eng_94_t:0 "你们用的是拖拉机"
 krcw_eng_94_d:0 "一九五三年的粮食自给率报告在内阁会议上本来只是一份例行文件，直到海军部的代表要求发言。\n\n\"各位，\"那名上将说，\"三十年来海军的全部战略问题是一句话：有人在大西洋上切断我们，不列颠就要饿。我们为此造了护航舰、造了反潜机、写了无数份作战计划。\"\n\n\"今年这句话第一次不成立了。而你们做到这件事用的不是军舰，是拖拉机和排水泵。我代表海军部向农业部道歉——我们从前一直认为你们是次要部门。\""
 krcw_eng_94.a:0 "把省下的军费转给农业"
 krcw_eng_94.b:0 "省下的钱造更多远洋舰队"
 krcw_eng_96_t:0 "比帝国舒服"
 krcw_eng_96_d:0 "印巴水源调停成功之后，外交部收到了一封没有预料到的信：一个西非国家的总理询问，共和国是否愿意为他们起草一部矿业法。\n\n外交部长在那份总结里写下的话后来被引用了很多次：\"三十年前，我们派一个总督去那里，他带着一支卫队，而当地人在他背后数着日子。现在他们写信来请我们派两个律师。\n\n一个不再有能力强迫任何人的国家，第一次发现自己被人需要。这比帝国舒服。\""
 krcw_eng_96.a:0 "接受，并把这变成一项制度"
 krcw_eng_96.b:0 "接受，但收费"
 ENG_krcw_bevan:0 "阿奈林·比万"
 ENG_krcw_bevan_desc:0 "特雷德加的矿工之子，威尔士矿工联合会出身，\"四方宪章\"里那条按会员数分配席位的规则是他推动的。他的政治立场从来不掩饰其地方性：\"我代表的是南威尔士的矿工。如果不列颠联盟不能让南威尔士的矿工过得比一九二六年好，那它凭什么叫联盟。\""
 ENG_krcw_strachey_land:0 "约翰·斯特雷奇"
 ENG_krcw_strachey_land_desc:0 "主持了郡农业联合会方案的人，一个把土地问题当作工程问题而不是意识形态问题处理的行政官。他的原则只有一条，而这条原则救了不列颠的粮食产量：\"决定什么时候播种的人必须在田里。剩下的都可以谈。\""
 krcw_ti_the_single_centre:0 "唯一的中心"
 krcw_ti_the_single_centre_desc:0 "革命需要一个能下决定的地方。巴黎书记处对成员国的决议具有约束力，各国的联合会在国际事务上服从多数——而多数票在法国手里，因为法国的会员最多。\n反对者管这叫新的第二国际。支持者的回答是：第二国际在一九一四年八月散了，因为它没有中心。"
 krcw_ti_the_free_communes:0 "自由公社"
 krcw_ti_the_free_communes_desc:0 "相反的原则：国际是一份公约，不是一个政府。任何决议对不同意它的联合会没有约束力，任何成员可以退出而不被视为叛徒。\n这让阵营在危机里反应缓慢，也让它三十年里没有发生过一次成员国被镇压的事——而对面的协定发生过四次。"
 krcw_ti_the_unions_alone:0 "只有工会"
 krcw_ti_the_unions_alone_desc:0 "最纯粹的一派：党是资产阶级的形式，国家是资产阶级的形式，只有工会是工人自己创造的组织。因此国际不应该有书记处，也不应该有成员\"国\"——应该只有产业联合会之间的直接协议。\n这一派在理论上最彻底，在行政上最难办，而它在码头、矿井与铁路上的支持最硬。"
 krcw_ti_one_country_first:0 "先建成一国"
 krcw_ti_one_country_first_desc:0 "把手里的东西建成一个没有人能否认的样板，然后让别人自己来。这条路线的支持者说，一九一七年以来所有输出革命的尝试都失败了，而一个工人过得比对岸好的国家，比一个师管用。\n反对者叫它背叛，而它的支持者在工会里占多数——因为工会管的是工资。"
 krcw_ti_world_revolution:0 "世界革命"
 krcw_ti_world_revolution_desc:0 "一个被包围的革命只有两个结局：扩张或者腐坏。这一派要求现在就向东推进、向殖民地输送干部、在协定的每一个成员国里建立地下组织。\n他们的论据是地图：从易北河到大西洋是八百公里，而国际没有第二道防线。反对者的论据是伤亡表。"
 krcw_ti_doctrinal_dispute:0 "路线分歧"
 krcw_fra_what_the_internationale_is:0 "修订国际章程"
 krcw_fra_what_the_internationale_is_desc:0 "意大利拒绝执行书记处关于的里雅斯特的决议，而章程没有任何制裁手段。修订章程，确定国际的性质。"
 krcw_fra_the_binding_secretariat:0 "赋予书记处约束力"
 krcw_fra_the_binding_secretariat_desc:0 "书记处决议对成员国有约束力，分歧按多数票裁决，拒不执行的成员暂停表决权。法国会员最多，多数票在法国手里。"
 krcw_fra_the_covenant_of_communes:0 "订立公社公约"
 krcw_fra_the_covenant_of_communes_desc:0 "国际改为一份公约：决议对不同意的联合会无约束力，成员可以自由退出。阵营应对危机会变慢。"
 krcw_fra_the_federations_alone:0 "取消书记处"
 krcw_fra_the_federations_alone_desc:0 "取消书记处和成员国席位，国际只保留各国产业联合会之间的直接协议。"
 krcw_fra_the_question_of_the_east:0 "辩论是否东进"
 krcw_fra_the_question_of_the_east_desc:0 "讨论国际是否向东推进。主张推进的一方强调易北河以西没有第二道防线，反对的一方以一九三六至四三年的伤亡为据。"
 krcw_fra_build_the_model_first:0 "先建成样板"
 krcw_fra_build_the_model_first_desc:0 "集中力量建设本国，把住房、工资和消费品做成协定宣传无法否认的样板。联合会的多数支持这条路线，代价是向东输送干部和武器的经费要削减。"
 krcw_fra_the_cadres_go_east:0 "派遣干部东进"
 krcw_fra_the_cadres_go_east_desc:0 "向协定各成员国派遣干部，在波兰矿区、匈牙利钢厂和土耳其铁路上建立地下组织。边境紧张会随之上升。"
 krcw_eng_the_argument_in_the_congress:0 "召开路线辩论"
 krcw_eng_the_argument_in_the_congress_desc:0 "一九二五年夺取工厂的车间代表运动，与此后管理工厂的费边派行政官之间积怨已久。在代表大会上正式辩论工厂由谁管理。"
 krcw_eng_the_administrators_republic:0 "交由行政官管理工厂"
 krcw_eng_the_administrators_republic_desc:0 "工厂交给会计、工程师和统计员管理，车间大会不再表决生产事务。效率会提高，车间代表运动会强烈反对。"
 krcw_eng_the_stewards_answer:0 "把决定权还给车间"
 krcw_eng_the_stewards_answer_desc:0 "生产计划由厂级投票通过，厂长由车间选举、可随时罢免。效率会下降。"
 krcw_eng_the_guild_settlement:0 "推行行会社会主义"
 krcw_eng_the_guild_settlement_desc:0 "每个产业组成全国行会，内部自治，行会之间按契约交易，国家只负责仲裁。"
 krcw_eng_and_the_world:0 "讨论输出革命"
 krcw_eng_and_the_world_desc:0 "国际正在讨论是否向外输出革命，而运输要靠不列颠的商船队。海员工会要求在这个问题上有表决权。"
 krcw_left_1_t:0 "的里雅斯特的先例"
 krcw_left_1_d:0 "一九五〇年，书记处就的里雅斯特问题做出决议，要求意大利社会共和国接受仲裁。罗马的答复只有一句：\"书记处的决议我们已经收到并研究了。\"然后什么也没做。\n\n书记处这才发现自己手上什么也没有：章程里没有制裁条款，没有开除条款，连\"决议具有约束力\"这句话都没有写。一名法国代表在内部会议上说了一句让所有人不舒服的话——\"同志们，我们花了六年建立的这个机构，在法律上是一个通讯社。\""
 krcw_left_1.a:0 "必须修章程：革命需要一个能下决定的地方"
 krcw_left_1.b:0 "这恰恰是国际的长处，不是缺点"
 krcw_left_1.c:0 "书记处本来就不该存在"
 krcw_left_3_t:0 "两份文件"
 krcw_left_3_d:0 "争论的双方在同一次会议上各自摊开了一份东西。\n\n主张东进的把地图摊在桌上：易北河到大西洋八百公里，中间没有第二道防线，而协定在那条线后面有两百多个师。\n\n主张不东进的摊开另一份：一九三六到一九四三年，国际各成员国的阵亡统计，按年龄分组。第二页上有一栏是\"十八至二十二岁\"，而摊开这份文件的人在那一栏上按了一下手指，没有说话。"
 krcw_left_3.a:0 "先建成样板"
 krcw_left_3.b:0 "现在就向东"
 krcw_left_3.c:0 "都不选：把这个问题交给各国自己决定"
 krcw_left_5_t:0 "第一批干部"
 krcw_left_5_d:0 "向东输送干部的决定做出九个月之后，第一份代价送回了巴黎：十一个人在波兰的矿区被捕，四个人在匈牙利失踪，一个人在土耳其的边境上被击斃。协定的报纸把这些人称为间谍，而他们的确带着巴黎印的小册子。\n\n书记处面前有一个没人愿意回答的问题：这些人的名字要不要公开承认？承认了，他们就是我们的人;不承认，他们就只是十六个失踪的外国人。"
 krcw_left_5.a:0 "公开承认，要求领事探视"
 krcw_left_5.b:0 "不承认，继续派"
 krcw_left_5.c:0 "停止这个计划"
 krcw_left_7_t:0 "小册子管着工厂"
 krcw_left_7_d:0 "一九五一年大会的第三天，一名来自克莱德班的老车间代表要求发言。他一九二五年参加过占领造船厂，现在是一间造船厂的退休工人。\n\n\"各位先生，\"他说，\"我不是来反对效率的。我造了四十年的船，我知道账目要平。我是来问一个问题的：一九二五年我们占领工厂的时候，你们在写小册子。现在小册子管着工厂，而我的儿子在他自己的车间里要举手才能说话。那我们当年到底赢了什么？\"\n\n会场安静了很久。主席台上没有人准备好回答这个问题。"
 krcw_left_7.a:0 "把决定权还给车间"
 krcw_left_7.b:0 "效率也是工人的利益"
 krcw_left_7.c:0 "行会：两者之间的第三条路"
 krcw_left_9_t:0 "运的是我们的船员"
 krcw_left_9_d:0 "海员工会对\"世界革命\"这个议题的立场让整个代表大会意外：他们不是反对，也不是支持，而是要求一票。\n\n海员工会书记的发言只有三分钟：\"诸位在这个大厅里投票决定向外输送革命，而输送这件事是由船完成的。船上的人是我的会员。如果国际的货轮开始运枪，那么在巴黎投票的人应该知道，被鱼雷击沉的不是巴黎的人。\n\n我们不反对。我们只要求在决定的时候在场。\""
 krcw_left_9.a:0 "给海员工会一个席位"
 krcw_left_9.b:0 "战略问题不能由一个行业否决"
 FRA_krcw_monatte:0 "皮埃尔·莫纳特"
 FRA_krcw_monatte_desc:0 "革命工团主义的老人，《工人生活》的创办者，一九二四年因为反对任何政党对工会的领导而被开除出共产党。他是\"只有联合会\"那一派的理论来源：党是资产阶级的形式，国家是资产阶级的形式，只有工会是工人自己造出来的东西。他现在八十岁，而每次巴黎大会他都到场，坐在后排。"
 FRA_krcw_marty:0 "安德烈·马蒂"
 FRA_krcw_marty_desc:0 "黑海舰队叛变的组织者，西班牙国际纵队的总政委，一个相信革命的问题最终都是纪律问题的人。他是\"干部东去\"与\"有约束力的书记处\"两条路线的同一个作者：国际需要一个能下命令的中心，而下了命令就要有人执行。他的对手说他把每一次分歧都当成叛变来处理，而这个指控并非全无根据。"
 ENG_krcw_cole:0 "G·D·H·柯尔"
 ENG_krcw_cole_desc:0 "行会社会主义的理论家，一个在费边派与车间代表运动之间活了三十年而两边都不完全信任他的人。他的方案是让每个产业自治、彼此按契约交易、国家只做仲裁——而他自己承认这个方案最难的部分还没解决：\"我们发明了一种没有资本家的市场。现在我们要学着管它。\""
 krcw_sov_the_informer_economy:0 "举报的经济学"
 krcw_sov_the_informer_economy_desc:0 "奥克拉那不靠恐怖运转，它靠账目运转：一份有用的举报值三张配给券，一份导致逮捕的举报值一个月的住房优先权。内务部的档案里有二十七万个线人编号，而其中大约六万个人举报的是自己的邻居为了一间更大的房子。\n这套制度很便宜，也很有效。它的缺陷要到很多年以后才显出来。"
 krcw_sov_what_the_state_cannot_know:0 "国家无法知道的事"
 krcw_sov_what_the_state_cannot_know_desc:0 "一个靠密探治国的政府有一个无法解决的问题：它收到的每一份报告都是写给它想听的。省长报告丰收，因为报告歉收的省长会被换掉;线人报告不满，因为报告平静的线人拿不到配给券。\n一九五二年内务部做过一次内部核查，结论被列为最高机密：\"本部无法估计本国有多少人支持政府。这个数字我们从未测量过，也没有办法测量。\""
 krcw_sov_administrative_exile:0 "行政流放"
 krcw_sov_administrative_exile_desc:0 "不经审判，不经法庭，由内务大臣签署一纸命令发配到叶尼塞河以东，刑期不定，允许带家属。这是沙俄的老办法，萨文科夫把它原封不动地接过来，连表格格式都没改。\n流放地不是劳改营：那里有村庄、邮局、学校，流放者可以务农、教书、行医，只是不许离开。这个区别在本国的宣传里从来不提，而在国际的宣传里被反复提及。"
 krcw_sov_throne_and_altar_idea:0 "王座与祭坛"
 krcw_sov_throne_and_altar_idea_desc:0 "一九四三年恢复的牧首区是这个政权最成功的一件事，也是代价最隐蔽的一件事。教会得到了教堂、神学院与免税地位;国家得到了一个能进入每一个村庄的机构。神职人员由内务部核准，讲道题目每季度下发。\n而每一座重开的教堂都是对铁丝网那一侧\"无神论\"的一次宣传——这件事对农民比任何广播都有效。"
 krcw_sov_the_white_inheritance:0 "白色的遗产"
 krcw_sov_the_white_inheritance_desc:0 "这个政权的军官团来自内战中的白军，而白军从来不是一个东西：君主派要一个皇帝，立宪派要一部一九零六年的宪法，哥萨克要自己的自治领，而外国干涉军的旧部各自还记得自己当年替谁打仗。\n他们互相之间的仇恨比对国际的仇恨更久。萨文科夫活着的时候压得住，而他一九五一年就要死了。"
 krcw_sov_one_russia:0 "一个俄罗斯"
 krcw_sov_one_russia_desc:0 "官方的立场是俄罗斯不存在少数民族，只有说不同方言的俄罗斯人。乌克兰语的学校在一九四七年改为俄语授课，高加索的行政区划按河流而不按民族重划，中亚的清真寺登记在内务部名下。\n这套政策在城市里有效，在山区里造出了一代人的敌人。一九五零年代的每一份内部治安报告都提到同一个地区，而每一份都建议\"加强工作\"。"
 krcw_sov_exile_protest:0 "流放的抗议"
 krcw_sov_the_informers_ledger:0 "线人名册"
 krcw_sov_the_informers_ledger_desc:0 "奥克拉那按举报给线人发配给券和住房优先权。很多举报出于邻里争房，而非政治原因。"
 krcw_sov_the_emigre_desk:0 "侨民处"
 krcw_sov_the_emigre_desk_desc:0 "设立侨民处，监视巴黎、柏林、上海和贝尔格莱德的俄国流亡社区。萨文科夫本人当年也是巴黎的流亡者。"
 krcw_sov_the_letters:0 "书信检查"
 krcw_sov_the_letters_desc:0 "按第三科的老办法抽检出入境信件。检查员收集到的主要是民众的抱怨，内务部因此比其他部门更了解民情。"
 krcw_sov_what_we_cannot_know:0 "核查政权支持度"
 krcw_sov_what_we_cannot_know_desc:0 "内务部核查后承认，无法估计政权到底有多少支持者，因为各级报告都迎合上级。"
 krcw_sov_east_of_the_yenisei:0 "恢复行政流放"
 krcw_sov_east_of_the_yenisei_desc:0 "恢复沙俄的行政流放：不经审判，由内务大臣下令，发配到叶尼塞河以东，刑期不定，允许家属同行。流放地有村庄和学校，但不得离开。"
 krcw_sov_the_settlements:0 "流放村"
 krcw_sov_the_settlements_desc:0 "流放者中有大量教师、医生和工程师，西伯利亚的地方行政越来越依赖他们。"
 krcw_sov_the_amnesty_question:0 "为无案卷流放者发居留证"
 krcw_sov_the_amnesty_question_desc:0 "四十七万流放者中有十一万人的案卷已经遗失。给他们发放行政居留证，改为永久居民。"
 krcw_sov_the_second_russia:0 "发展东部流放区"
 krcw_sov_the_second_russia_desc:0 "叶尼塞河以东形成了由流放者及其家属组成的社会，受教育程度高，对政府态度冷漠。投资发展这一地区。"
 krcw_sov_the_patriarchate:0 "牧首区"
 krcw_sov_the_patriarchate_desc:0 "恢复牧首区。教会得到教堂、神学院和免税地位；神职人员由内务部核准，主教任命须经政府同意。"
 krcw_sov_the_reopened_churches:0 "重开教堂"
 krcw_sov_the_reopened_churches_desc:0 "重开各地教堂，组织前往三一修道院的朝圣。宣传上与国际一些成员国关闭教堂形成对比。"
 krcw_sov_the_price_of_the_protocol:0 "处置非登记教会"
 krcw_sov_the_price_of_the_protocol_desc:0 "一批年轻神父拒绝接受内务部核准，在私人住宅做礼拜。决定如何处置这些非登记教会。"
 krcw_sov_one_russia_f:0 "推行俄罗斯化"
 krcw_sov_one_russia_f_desc:0 "官方不承认少数民族：乌克兰语学校改用俄语教学，高加索按河流而非民族划区，中亚清真寺登记在内务部名下。山区的抵抗随之增加。"
 krcw_sov_the_armies_that_lost:0 "整合白军旧部"
 krcw_sov_the_armies_that_lost_desc:0 "军官团来自内战时的白军，君主派、立宪派、哥萨克和干涉军旧部之间积怨很深。把他们整合进同一个指挥体系。"
 krcw_sov_the_cossack_autonomy:0 "恢复军团自治"
 krcw_sov_the_cossack_autonomy_desc:0 "哥萨克在内战里是这个政权最可靠的兵源，而他们要的报酬是恢复军团自治：自己的土地、自己的法庭、自己的军事编制。\n\n萨文科夫给了一半：军事编制恢复了，土地恢复了，法庭没有——内务部不肯让任何人有自己的法庭。这个半数解决方案让顿河与库班在三十年里既忠诚又怨恨，而每一次征兵季节，他们的军官都会重提那件没给的东西。"
 krcw_sov_the_monarchist_question:0 "搁置皇位问题"
 krcw_sov_the_monarchist_question_desc:0 "君主派占军官团三分之一，要求立皇帝，但无法在罗曼诺夫家族候选人上达成一致。继续搁置皇位问题。"
 krcw_sov_the_last_of_the_whites:0 "让老将军退役"
 krcw_sov_the_last_of_the_whites_desc:0 "内战时期的老将军仍有二十七人在世，都认为自己有资格继承。让他们退役，由年轻一代军官接手。"
 krcw_black_1_t:0 "那间更大的房子"
 krcw_black_1_d:0 "一九五〇年的内部统计是一名中级官员奉命编制的，而他编完之后请求调职。\n\n统计显示：本年度被举报的三万一千人里，有一万九千人是被同一栋楼、同一个院子、或者同一个车间的人举报的。而在能查明动机的案子里，政治动机占百分之十一，其余的是住房、职位、配给券，以及婚姻纠纷。\n\n编制这份统计的官员在附言里写了一句话：\"大人，我们建立的不是一个防止叛国的系统。我们建立的是一个让邻居互相出价的市场。\""
 krcw_black_1.a:0 "照旧：它有效就够了"
 krcw_black_1.b:0 "取消物质奖励，只留政治举报"
 krcw_black_1.c:0 "把这份统计销毁，调走那个官员"
 krcw_black_3_t:0 "只上呈三个人"
 krcw_black_3_d:0 "书信检查科每年处理三百万封信，而它的季度摘要只印五份，上呈三个人：最高执政者、内务大臣、总参谋长。\n\n这一季的摘要里有一段被摘要编制人加了下划线：\"关于配给与住房的抱怨占全部抱怨的百分之六十一，关于政治的占百分之四。在提到政府的信件里，语气最激烈的不是反对者，是本党的基层官员——他们抱怨的是上级不听他们说话。\""
 krcw_black_3.a:0 "把摘要发给各省长"
 krcw_black_3.b:0 "照旧，只给三个人"
 krcw_black_3.c:0 "按摘要调整配给与住房政策"
 krcw_sov_tree_bid_civ_10_tt:0 "文官技术派的影响力：§G+10§!"
 krcw_black_5_t:0 "我们从未测量过"
 krcw_black_5_d:0 "一九五二年那次核查是内务大臣自己下令做的，他想知道一件很简单的事：如果明天举行一次真正的选举，这个政权能得多少票?\n\n核查组工作了七个月，最后交上来的结论是两句话，而这两句话让内务大臣把文件锁进了保险柜，钥匙只有他自己有。\n\n\"本部无法估计本国有多少人支持政府。本部收到的每一份报告都是写给本部想听的。\""
 krcw_black_5.a:0 "建立一套不经过省长的独立调查"
 krcw_black_5.b:0 "锁进保险柜"
 krcw_black_5.c:0 "在一个省试办真正的地方选举"
 krcw_black_7_t:0 "一九零五年的表格"
 krcw_black_7_d:0 "流放制度恢复时，内务部发现自己不需要设计任何新东西——一九零五年的表格还在档案里，而当年用过这套表格的官员里有三个还在职。其中一位七十一岁，被请回来培训年轻的办事员。\n\n他在第一堂课上说的话被一名学员记在笔记本上：\"诸位，这份表格的好处是它不需要证据，只需要理由。而理由这一栏，我教诸位怎么填。\""
 krcw_black_7.a:0 "照一九零五年的办法办"
 krcw_black_7.b:0 "要求每一份流放令附一份证据摘要"
 krcw_black_7.c:0 "把流放权从内务部收归法院"
 krcw_black_9_t:0 "找不到案卷的十一万人"
 krcw_black_9_d:0 "新任内务大臣读到那份备忘录时叫来了档案司长，问了一个很直接的问题：十一万个人的案卷怎么会找不到?\n\n档案司长的答复也很直接：\"大人，一九四三到四七年间，流放令是在四个不同的城市签发的，其中两个城市在战争中被炸过。我们知道这些人在哪里，因为他们每月去警察所报到。我们不知道他们为什么在那里。\""
 krcw_black_9.a:0 "发行政居留证，不再称他们流放者"
 krcw_black_9.b:0 "全部释放：没有案卷就没有依据"
 krcw_black_9.c:0 "重新立卷：按现在的表现定性"
 krcw_black_11_t:0 "地上的代价"
 krcw_black_11_d:0 "议定书的签字仪式没有记者。参加的人只有四个：萨文科夫、内务大臣、牧首，以及一名做记录的书记官。\n\n牧首读完全文之后沉默了很久，然后问了一个问题：\"神职人员的核准，是否包括听告解的神父?\"内务大臣说不包括。牧首于是签了字，并且说了一句被书记官完整记下来的话：\n\n\"我们在地下待了二十五年。地上的代价我们付得起。但是有一条，你们记住——告解室里的事，你们永远得不到。\""
 krcw_black_11.a:0 "接受这个保留"
 krcw_black_11.b:0 "要求告解室也在核准范围内"
 krcw_black_13_t:0 "非登记宗教活动"
 krcw_black_13_d:0 "奥克拉那给那些不肯接受核准的年轻神父编了一个分类，而这个分类送到牧首面前时，牧首做了一件内务部没有预料到的事：他拒绝谴责他们。\n\n\"大人，\"他对内务大臣说，\"二十五年前在私人住宅里做礼拜的神父就是我。您要我签署一份文件，谴责二十五年前的我自己。这份文件我可以签，而签了之后我在信众眼里就是政府的一个司长。那时候您得到的是一个司长，不是一个牧首——两者的用处不一样。\""
 krcw_black_13.a:0 "接受他的拒绝"
 krcw_black_13.b:0 "绕过牧首，直接取缔"
 krcw_sov_tree_bid_mon_10_tt:0 "君主派的影响力：§G+10§!"
 krcw_black_15_t:0 "同一张桌子的两侧"
 krcw_black_15_d:0 "总参谋部的一次例行会议因为一件小事变成了一场争吵：南方战役三十周年的纪念仪式上，哪一支部队的旗帜排在前面。\n\n争吵的双方是一名君主派上将与一名立宪派上将，而他们争的那两支部队在一九一九年秋天在顿河交过火——双方都死了人。会议记录对这件事的处理很简练：\"主席宣布休会。\"\n\n萨文科夫后来在私下对内务大臣说：\"这些人打了一辈子仗，而他们最恨的人和他们穿同一种军服。\""
 krcw_black_15.a:0 "压住这件事：两支旗帜并排"
 krcw_black_15.b:0 "偏向君主派：他们人多"
 krcw_black_15.c:0 "取消纪念仪式"
 krcw_black_17_t:0 "他在等我们死"
 krcw_black_17_d:0 "君主派的代表团第十一次向最高执政者递交请愿书，要求就皇位问题作出决定。萨文科夫的答复和前十次一样：这个问题需要全国的共识，而现在还没有共识。\n\n代表团离开之后，团里最年长的那位上将在马车上对同行者说了一句话，后来被侨民的回忆录引用：\"他不是在拒绝我们。他知道我们平均六十八岁。他是在等我们死。而他会等到的——他只比我们小四岁，可他从来不喝酒。\""
 krcw_black_17.a:0 "继续不给答案"
 krcw_black_17.b:0 "宣布共和国，把这件事了结"
 krcw_black_17.c:0 "召开一次皇位问题的国民会议"
 krcw_black_19_t:0 "时间替这个国家做了选择"
 krcw_black_19_d:0 "继承危机没有变成内战，而原因既不高尚也不偶然。\n\n一九五一年三月，二十七名内战时期的白军将领里有十九名参加了葬礼。他们在灵柩前排的次序花了三天时间协商，而在灵柩后面站着的是总参谋部的现役军官——四十岁以下的，一个白军出身的也没有。\n\n一名年轻的参谋官后来写道：\"那天我看着前排那些老人，忽然明白了一件事：他们争的是一九一九年。而我们要守的是易北河。这两件事没有关系。\""
 krcw_black_19.a:0 "让位给年轻一代"
 krcw_black_19.b:0 "维持老将们的名义地位"
 krcw_fra_party_centre:0 "总工会书记处派"
 krcw_fra_party_centre_long:0 "法国总工会（书记处派）"
 krcw_fra_party_communes:0 "公社联合会"
 krcw_fra_party_communes_long:0 "法兰西公社联合会"
 krcw_fra_party_unions:0 "革命工团派"
 krcw_fra_party_unions_long:0 "法国总工会（革命工团派）"
 krcw_fra_secretariat_inspectors:0 "派出书记处监察团"
 krcw_fra_secretariat_inspectors_desc:0 "书记处向各成员国的联合会派驻监察员，检查决议的执行情况。小成员国不满，但决议第一次得到了执行。"
 krcw_fra_one_cadre_school:0 "统一干部学校教材"
 krcw_fra_one_cadre_school_desc:0 "国际所有成员国的干部学校使用同一套教材，由巴黎编写。各国干部对决议的理解从此一致。"
 krcw_fra_arbitration_between_federations:0 "设立联合会仲裁庭"
 krcw_fra_arbitration_between_federations_desc:0 "成员国之间的争议交给一个由各国推举法官组成的仲裁庭，书记处不再插手。裁决没有强制力，但各方大多遵守。"
 krcw_fra_the_exit_clause:0 "写入退出条款"
 krcw_fra_the_exit_clause_desc:0 "国际章程写明：任何成员经本国代表大会表决即可退出，不受处罚。没有成员退出，而留下来的成员更信任巴黎。"
 krcw_fra_dissolve_the_ministries:0 "撤销各部委"
 krcw_fra_dissolve_the_ministries_desc:0 "各部委撤销，工作交给相应的产业联合会：铁路部交给铁路工人联合会，矿业部交给矿工联合会。第一年行政混乱。"
 krcw_fra_direct_delegates:0 "由产业联合会直选代表"
 krcw_fra_direct_delegates_desc:0 "出席国际大会的法国代表不再由政府指派，而由各产业联合会直接选举。其他成员国被邀请照此办理。"
 krcw_eng_party_admin:0 "职工大会（行政派）"
 krcw_eng_party_admin_long:0 "职工大会（行政派）"
 krcw_eng_party_stewards:0 "车间代表大会"
 krcw_eng_party_stewards_long:0 "不列颠车间代表全国大会"
 krcw_eng_party_guild:0 "全国行会联合会"
 krcw_eng_party_guild_long:0 "不列颠全国行会联合会"
 krcw_eng_the_planning_office:0 "设立国家计划局"
 krcw_eng_the_planning_office_desc:0 "计划局由工程师和统计员组成，负责编制全国生产计划。车间大会仍可提意见，但不再表决指标。"
 krcw_eng_managers_by_examination:0 "考试录用厂长"
 krcw_eng_managers_by_examination_desc:0 "厂长改为考试录用，不再由车间选举。效率提高，车间代表运动的支持者强烈反对。"
 krcw_eng_recall_at_any_meeting:0 "实行厂长随时罢免"
 krcw_eng_recall_at_any_meeting_desc:0 "任何一次车间大会都可以罢免厂长。管理层失去了长期计划的能力，工人得到了对日常生产的控制。"
 krcw_eng_the_national_stewards_congress:0 "召开全国车间代表大会"
 krcw_eng_the_national_stewards_congress_desc:0 "全国车间代表大会成为最高权力机关，职工大会的执行委员会向它负责。"
 krcw_eng_the_national_guilds:0 "成立全国行会"
 krcw_eng_the_national_guilds_desc:0 "每个产业组成一个全国行会，内部自治，对外按契约与其他行会交易。国家只负责仲裁。"
 krcw_eng_the_guild_court:0 "设立行会仲裁院"
 krcw_eng_the_guild_court_desc:0 "行会之间的价格和供货争议交由仲裁院裁决。煤价、钢价由此定下来，不再每年重吵一次。"
 krcw_fra_reconstruction_plan:0 "第一个重建计划"
 krcw_fra_reconstruction_plan_desc:0 "煤矿、铁路、电站和港口优先，民用消费品的配给在计划期间不放宽。重建委员会每个季度向代表大会公布执行情况。"
 krcw_fra_reconstruction_plan_heavy:0 "重建计划：钢铁与机床优先"
 krcw_fra_reconstruction_plan_heavy_desc:0 "计划后两年的投资集中到钢铁、机床和化工。住房和民用工业要等计划结束以后。"
 krcw_fra_reconstruction_plan_housing:0 "重建计划：住房与民用优先"
 krcw_fra_reconstruction_plan_housing_desc:0 "计划后两年的投资转向住房、学校和民用工业，钢铁指标下调。"
 krcw_fra_reconstruction_complete:0 "重建完成"
 krcw_fra_reconstruction_complete_desc:0 "重建委员会已经解散，人员并入各产业联合会的计划处。以后的计划由联合会自己编制。"
 krcw_fra_social_insurance:0 "全国社会保险金库"
 krcw_fra_social_insurance_desc:0 "疾病、养老和工伤互助金合并为一个金库，管理委员会由缴费的工人选举。缴费率比以前高。"
 krcw_fra_social_insurance_2:0 "社会保险与四十小时工作周"
 krcw_fra_social_insurance_2_desc:0 "全国社会保险金库之外，四十小时工作周分行业恢复。加班减少，产量略有下降。"
 krcw_fra_social_insurance_3:0 "劳动保障体系"
 krcw_fra_social_insurance_3_desc:0 "社会保险、四十小时工作周、全国工资等级表和工厂医务所一起构成了公社的劳动保障体系。费用由社会保险金库支出。"
 krcw_fra_atomic_commissariat_2:0 "原子能委员会：马库尔"
 krcw_fra_atomic_commissariat_2_desc:0 "委员会在萨克雷做研究，在马库尔发电和生产钚，铀来自利穆赞和海外合同。钚的用途由代表大会决定。"
 krcw_fra_atomic_commissariat_3:0 "原子能委员会与电力联合会"
 krcw_fra_atomic_commissariat_3_desc:0 "发电堆移交电力联合会运营，原子能委员会保留燃料和研究。核电站开始向电网供电。"
 krcw_fra_first_reconstruction_plan:0 "编制第一个重建计划"
 krcw_fra_first_reconstruction_plan_desc:0 "重建委员会把各产业联合会报上来的修复清单汇成一份四年计划，先修煤矿、铁路、电站和港口。代表大会批准了计划，条件是每个季度公布执行情况。计划期间，民用消费品的配给不会放宽。"
 krcw_fra_reopen_the_nord_pits:0 "恢复北方煤矿"
 krcw_fra_reopen_the_nord_pits_desc:0 "北方煤田有一半巷道在战争中被水淹了。矿工联合会要求先抽水、换支架，再谈产量指标。排水泵和坑木要从莱茵兰进口，占用了一大笔外汇。"
 krcw_fra_rail_electrification:0 "铁路电气化"
 krcw_fra_electrify_paris_lyon:0 "电气化巴黎至里昂铁路"
 krcw_fra_electrify_paris_lyon_desc:0 "铁路工人联合会提出把巴黎到里昂的干线全部改为电力牵引，腾出运煤的车皮。工程要架设几百公里接触网，罗讷河电站的电要优先供给铁路。"
 krcw_fra_rebuild_le_havre:0 "重建勒阿弗尔港"
 krcw_fra_rebuild_le_havre_desc:0 "勒阿弗尔的码头和市中心在战争中几乎被夷平。重建委员会把港口交给码头工人联合会和建筑工人联合会共同承建，先修码头，后修住宅。港口修好以后，大西洋航线的货物不必再绕道布雷斯特。"
 krcw_fra_genissiat_dam:0 "修建热尼西亚水坝"
 krcw_fra_genissiat_dam_desc:0 "热尼西亚坝是罗讷河梯级的第一级，战前开工，打仗时停了下来。电力联合会调来阿尔卑斯的隧道工复工，沿岸公社用供电优先权换取移民安置费。大坝建成后，里昂的工厂不再依赖北方的煤。"
 krcw_fra_plan_heavy_first:0 "钢铁与机床优先"
 krcw_fra_plan_heavy_first_desc:0 "冶金联合会和计划局的工程师主张把计划后两年的投资集中到钢铁、机床和化工，理由是没有机床就没有以后的住房。建筑工人联合会和市镇公社要再等几年，城里的临时木板房也要再住几年。"
 krcw_fra_plan_housing_first:0 "住房与民用优先"
 krcw_fra_plan_housing_first_desc:0 "建筑工人联合会和各大城市公社要求把后两年的投资转向住房、学校和民用工业。北方和洛林还有很多家庭住在战时的临时房里。钢铁指标因此下调，冶金联合会已经表示反对。"
 krcw_fra_lacq:0 "拉克天然气"
 krcw_fra_lacq_gas:0 "开发拉克天然气田"
 krcw_fra_lacq_gas_desc:0 "石油勘探队在比利牛斯山脚的拉克钻到了高压天然气。化工联合会负责修建净化厂和输气管，因为气里含硫太多，需要一套新工艺。成功以后，西南部的工厂就有了自己的燃料。"
 krcw_fra_close_the_reconstruction_plan:0 "结束重建计划"
 krcw_fra_close_the_reconstruction_plan_desc:0 "重建委员会向代表大会提交最后一份季度报告，然后解散，人员并入各产业联合会的计划处。配给制取消，下一份计划由联合会自己编制。"
 krcw_fra_unified_social_insurance:0 "统一社会保险金库"
 krcw_fra_unified_social_insurance_desc:0 "各联合会原有的疾病、养老和工伤互助金合并为一个全国金库，由缴费的工人选举管理委员会。金属工人联合会推动了这件事，小联合会担心自己的储备被大联合会用掉。缴费率提高，企业的负担也随之加重。"
 krcw_fra_forty_hour_week:0 "恢复四十小时工作周"
 krcw_fra_forty_hour_week_desc:0 "重建期间加班成了常态，各工会要求恢复四十小时工作周。重建委员会同意分行业逐步恢复，矿山和铁路最后执行。产量会暂时下降。"
 krcw_fra_national_wage_scale:0 "制定全国工资等级表"
 krcw_fra_national_wage_scale_desc:0 "各联合会的工资标准差距很大，矿工和冶金工人拿得最多，纺织和农业工人最少。代表大会决定制定一张全国统一的等级表，并规定最高和最低工资之间的倍数上限。高工资的联合会反对，低工资的联合会支持。"
 krcw_fra_works_medical_service:0 "建立工厂医务所"
 krcw_fra_works_medical_service_desc:0 "百人以上的工厂必须设医务所，矿区和化工区另设职业病诊所，费用由社会保险金库支出。医生联合会同意参加，条件是保留私人门诊。"
 krcw_fra_saclay_reactor:0 "萨克雷实验堆"
 krcw_fra_saclay_research_reactor:0 "在萨克雷建设实验堆"
 krcw_fra_saclay_research_reactor_desc:0 "原子能委员会在萨克雷园区建第二座实验反应堆，用重水和天然铀，主要用来生产同位素和培训操作员。巴黎大学的物理学家希望把它用于基础研究，委员会的工程师更想用它试验燃料元件。"
 krcw_fra_limousin:0 "利穆赞铀矿"
 krcw_fra_limousin_uranium:0 "开采利穆赞铀矿"
 krcw_fra_limousin_uranium_desc:0 "地质队在上维埃纳省的拉克鲁齐耶附近找到了铀矿脉，矿工联合会从北方调来一批老矿工开井。国产铀可以减少对马达加斯加和刚果合同的依赖，但矿石品位低，选矿厂必须建在当地。"
 krcw_fra_marcoule:0 "马库尔反应堆"
 krcw_fra_marcoule_reactors:0 "建设马库尔反应堆"
 krcw_fra_marcoule_reactors_desc:0 "罗讷河下游的马库尔将建两座石墨气冷堆，既发电也生产钚。书记处和原子能委员会都清楚，钚的用途要由代表大会以后决定。化工联合会负责后处理车间。"
 krcw_fra_nuclear_school:0 "核工程学院"
 krcw_fra_nuclear_engineering_school:0 "成立核工程学院"
 krcw_fra_nuclear_engineering_school_desc:0 "萨克雷开办核工程学院，招收各工科学校的毕业生，学制两年，毕业后分配到马库尔和各研究所。大学联合会要求学院由教师和学生共同管理，原子能委员会坚持由自己任命院长。"
 krcw_fra_pierrelatte:0 "皮埃尔拉特扩散厂"
 krcw_fra_pierrelatte_plant:0 "建设皮埃尔拉特扩散厂"
 krcw_fra_pierrelatte_plant_desc:0 "气体扩散法能把铀浓缩到反应堆和炸弹都能用的程度，但工厂耗电极大。原子能委员会把厂址选在皮埃尔拉特，紧挨罗讷河电站。电力联合会抱怨这一座厂就要用掉一个省的电。"
 krcw_fra_chinon_power_station:0 "建设希农核电站"
 krcw_fra_chinon_power_station_desc:0 "卢瓦尔河畔的希农将建第一座专门发电的核电站，由电力联合会运营。电力联合会多年来一直要求接管发电堆，原子能委员会同意移交，条件是燃料仍归自己管。"
 krcw_eng_steel_board:0 "全国钢铁局"
 krcw_eng_steel_board_desc:0 "钢铁联合公司改组为全国钢铁局，理事会由钢铁工人、船厂和用钢产业的代表组成。钢材按全国计划分配，各厂不再自行接单。"
 krcw_eng_coal_plan:0 "全国煤炭计划"
 krcw_eng_coal_plan_desc:0 "矿工联合会按全国计划关闭老井、扩建和新开矿井。新井投产之前，各矿区要多开夜班。"
 krcw_eng_miners_charter:0 "矿工宪章"
 krcw_eng_miners_charter_desc:0 "五天工作制、井下工人退休金和尘肺病赔偿写进了矿工宪章，由各矿的安全委员会监督执行。夜班取消了。"
 krcw_eng_atomic_authority:0 "原子能管理局"
 krcw_eng_atomic_authority_desc:0 "哈韦尔和其他原子能机构归原子能管理局统一管理，向代表大会的科学委员会汇报。经费占用了一部分民用建设的拨款。"
 krcw_eng_atomic_authority_power:0 "原子能管理局"
 krcw_eng_atomic_authority_power_desc:0 "考尔德霍尔向电网送电之后，原子能管理局的经费一部分由电网委员会承担。代表大会对这项计划的反对少了。"
 krcw_eng_merge_the_clyde_steelworks:0 "合并克莱德河钢厂"
 krcw_eng_merge_the_clyde_steelworks_desc:0 "钢铁联合公司把莫瑟韦尔、格伦加诺克和达尔泽尔的钢厂并成一个企业，统一供应克莱德河的船厂。三家厂的车间代表都担心失去自己的厂务委员会，谈判拖了一个冬天。"
 krcw_eng_expand_port_talbot:0 "扩建塔尔博特港带钢厂"
 krcw_eng_expand_port_talbot_desc:0 "威尔士钢铁工人联合会要求在塔尔博特港建一座连续轧制的带钢厂，供应中部的汽车厂和家电厂。轧机要向美利坚联合工团订购，清算联盟的外汇额度为此用掉了一大块。"
 krcw_eng_scunthorpe_furnaces:0 "修建斯肯索普新高炉"
 krcw_eng_scunthorpe_furnaces_desc:0 "林肯郡的铁矿石品位低，但不用进口。钢铁联合公司在斯肯索普矿区旁建新高炉，减少对瑞典和西班牙矿砂的依赖。高炉建成之前，克莱德河的钢材配额要让出一部分。"
 krcw_eng_sheffield_steel:0 "谢菲尔德钢铁研究所"
 krcw_eng_sheffield_steel_institute:0 "设立谢菲尔德钢铁研究所"
 krcw_eng_sheffield_steel_institute_desc:0 "谢菲尔德的特种钢厂和大学冶金系合办研究所，研究合金钢、涡轮叶片和装甲板。各厂过去各自保密的试验数据，从此在研究所里公开交换。"
 krcw_eng_national_steel_board:0 "成立全国钢铁局"
 krcw_eng_national_steel_board_desc:0 "钢铁联合公司改组为全国钢铁局，理事会由钢铁工人联合会、船厂和用钢产业各派代表组成。钢材按全国计划分配，各厂不再自行接单。失去自主权的小厂意见最大，其中以谢菲尔德为甚。"
 krcw_eng_oxygen_steel:0 "氧气顶吹转炉"
 krcw_eng_oxygen_converter:0 "试验氧气顶吹转炉"
 krcw_eng_oxygen_converter_desc:0 "钢铁局在塔尔博特港建一座试验转炉，用纯氧代替空气吹炼钢水，一炉钢的时间大大缩短。平炉车间的工人担心失业，钢铁局承诺只转岗、不裁员。"
 krcw_eng_national_coal_plan:0 "编制全国煤炭计划"
 krcw_eng_national_coal_plan_desc:0 "矿工联合会书记阿瑟·霍纳主持编制全国煤炭计划，决定哪些矿井关闭、哪些扩建、哪里开新井。新井投产之前计划要求多开夜班，矿区对此很不满。"
 krcw_eng_sink_the_nottinghamshire_pits:0 "开凿诺丁汉郡新矿井"
 krcw_eng_sink_the_nottinghamshire_pits_desc:0 "诺丁汉郡和德比郡的煤层厚、埋得浅，适合开大矿井。联合会从南威尔士的枯竭老矿调人过去，在新矿区给他们盖住房。南威尔士矿工联合会反对会员被调走。"
 krcw_eng_coalface:0 "井下机械化"
 krcw_eng_mechanise_the_coalface:0 "推广井下截煤机"
 krcw_eng_mechanise_the_coalface_desc:0 "各矿改用截煤机和传送带，手镐采煤逐步淘汰。井下需要的人少了，多出来的矿工转到建筑和电力行业。"
 krcw_eng_the_miners_charter:0 "颁布矿工宪章"
 krcw_eng_the_miners_charter_desc:0 "矿工宪章规定五天工作制、井下工人退休金和尘肺病赔偿，由各矿的安全委员会监督执行。夜班取消，全国煤炭计划的指标相应调低。"
 krcw_eng_billingham_coal_chemicals:0 "扩建比灵厄姆煤化工厂"
 krcw_eng_billingham_coal_chemicals_desc:0 "革命前的化学公司留下的比灵厄姆工厂用煤生产化肥和合成油。化工工人联合会要求扩建，让联邦少进口石油。扩建用的建材有一部分是从新城镇计划里调来的。"
 krcw_eng_atomic_energy_authority:0 "成立原子能管理局"
 krcw_eng_atomic_energy_authority_desc:0 "哈韦尔和各原子能机构归一个原子能管理局统一管理，向代表大会的科学委员会汇报。霍纳在代表大会上反对这笔拨款，认为它挤占了住宅计划。"
 krcw_eng_windscale:0 "温斯凯尔反应堆"
 krcw_eng_windscale_piles:0 "修建温斯凯尔反应堆"
 krcw_eng_windscale_piles_desc:0 "坎伯兰海边的温斯凯尔建起两座空气冷却的石墨反应堆，专门生产钚。反应堆不发电，代表大会里的和平派因此要求公开它的产量。"
 krcw_eng_capenhurst:0 "卡彭赫斯特铀浓缩厂"
 krcw_eng_capenhurst_enrichment:0 "修建卡彭赫斯特铀浓缩厂"
 krcw_eng_capenhurst_enrichment_desc:0 "柴郡的卡彭赫斯特建起气体扩散厂浓缩铀，耗电量大到要为它单独建一座电厂。有了自己的浓缩铀，联邦不必完全依赖巴黎分配的核燃料。"
 krcw_eng_calder_hall_tb:0 "考尔德霍尔核电站"
 krcw_eng_calder_hall:0 "修建考尔德霍尔核电站"
 krcw_eng_calder_hall_desc:0 "温斯凯尔旁边的考尔德霍尔建起联邦第一座向电网送电的核电站，同时继续生产钚。原子能管理局借此向代表大会说明，原子能计划也能为民用服务。"
 krcw_eng_dounreay:0 "道恩雷试验堆"
 krcw_eng_dounreay_reactor:0 "修建道恩雷试验堆"
 krcw_eng_dounreay_reactor_desc:0 "快中子增殖堆建在苏格兰最北端凯斯内斯的道恩雷，远离人口稠密的地区。苏格兰代表大会同意选址，条件是工程优先雇用高地的工人。"
 krcw_wgr_ruhr_reconstruction_2:0 "鲁尔重建：运河与港口"
 krcw_wgr_ruhr_reconstruction_2_desc:0 "杜伊斯堡港和运河重新通航，鲁尔的煤和钢可以走水路运到汉堡和埃姆登。重建的重点从单个工厂转到整个工业区。"
 krcw_wgr_ruhr_district_plan:0 "鲁尔区域规划"
 krcw_wgr_ruhr_district_plan_desc:0 "鲁尔区域规划局统一安排矿井、钢厂、铁路和住宅的建设。各城市不再各自为政，工业区按一张图纸发展。"
 krcw_wgr_alpine_grid:0 "阿尔卑斯电网"
 krcw_wgr_alpine_grid_desc:0 "萨尔茨堡和蒂罗尔的水电开始送往巴伐利亚。电网还没有连成一片，各电站的输电线路各自通往最近的工业城市。"
 krcw_wgr_alpine_grid_2:0 "阿尔卑斯电力联合会"
 krcw_wgr_alpine_grid_2_desc:0 "奥地利诸省和巴伐利亚的电站并入一个电力联合会，统一调度。冬季枯水时鲁尔送煤电南下，夏季阿尔卑斯的水电北上。"
 krcw_wgr_works_council_law:0 "车间委员会法"
 krcw_wgr_works_council_law_desc:0 "车间委员会依法参与招工、解雇和投资决定。厂长由委员会提名，由地区经济局任命。"
 krcw_wgr_labour_code:0 "劳动法典"
 krcw_wgr_labour_code_desc:0 "车间委员会法、劳动法院和社会保险合编为一部劳动法典，由全国委员会代表大会通过。工厂里的规矩从此写在一本书里。"
 krcw_wgr_five_day_week:0 "五天工作周"
 krcw_wgr_five_day_week_desc:0 "星期六不再上班。工厂靠提高班次效率弥补一部分产量，另一部分就此没有了。"
 krcw_wgr_forty_eight_hours:0 "四十八小时工作周"
 krcw_wgr_forty_eight_hours_desc:0 "工作周保持四十八小时，多出来的产能留给易北河防线。车间委员会每年都提出缩短工时的动议。"
 krcw_wgr_ruhr_mine_federation:0 "成立鲁尔煤矿联合会"
 krcw_wgr_ruhr_mine_federation_desc:0 "盖尔森基兴、波鸿和雷克林豪森的矿井交给矿工联合会统一经营，各矿的委员会选出联合会理事会。矿工要求先修井下设备再提产量，计划局同意了。"
 krcw_wgr_rebuild_hamm_yard:0 "重建哈姆编组站"
 krcw_wgr_rebuild_hamm_yard_desc:0 "哈姆编组站是鲁尔煤炭外运的总枢纽，轰炸后只剩一半股道能用。铁路工人联合会要求优先拨给钢轨和信号设备，其他工程因此推迟。"
 krcw_wgr_duisburg_harbour:0 "整修杜伊斯堡港与运河"
 krcw_wgr_duisburg_harbour_desc:0 "杜伊斯堡-鲁尔奥特港、莱茵-黑尔讷运河和多特蒙德-埃姆斯运河清淤修闸，煤和矿石改走水路到埃姆登。水运便宜，但工程要占用两个冬天的劳力。"
 krcw_wgr_take_over_vereinigte_stahlwerke:0 "接管联合钢铁公司"
 krcw_wgr_take_over_vereinigte_stahlwerke_desc:0 "联合钢铁公司在杜伊斯堡-汉博恩和多特蒙德的钢厂由各厂委员会接管，合并成一个鲁尔钢铁联合企业。原来的经理大多留任，改由委员会监督。"
 krcw_wgr_miners_housing:0 "修建矿区工人住宅"
 krcw_wgr_miners_housing_desc:0 "矿区的工人还有很多住在地下室和临时木板房里。工会住房合作社在各矿区成片修建住宅，钢材和水泥因此要从工厂建设里分出一部分。"
 krcw_wgr_restart_voelklingen:0 "恢复弗尔克林根钢厂"
 krcw_wgr_restart_voelklingen_desc:0 "萨尔的煤矿和弗尔克林根钢厂重新开工，产品按清算联盟的配额分给法国一部分。萨尔的工人欢迎开工，不欢迎配额。"
 krcw_wgr_ruhr_planning_office:0 "设立鲁尔区域规划局"
 krcw_wgr_ruhr_planning_office_desc:0 "鲁尔各城市、矿工联合会和钢铁联合企业派代表组成区域规划局，统一安排矿井、钢厂、铁路和住宅。各市市长交出了一部分审批权。"
 krcw_wgr_ruhr_steel:0 "鲁尔钢铁联合企业"
 krcw_wgr_finish_kaprun:0 "续建卡普伦水电站"
 krcw_wgr_finish_kaprun_desc:0 "卡普伦水电站在大战前开工，战争期间停建。萨尔茨堡州政府要求续建，条件是电站的一部分电力留在本省使用。"
 krcw_wgr_reorganise_linz_works:0 "改组林茨钢铁厂"
 krcw_wgr_reorganise_linz_works_desc:0 "林茨钢铁厂是大战期间为军需扩建的，战后一直由工人委员会看管。改组后它成为上奥地利的国营企业，战时留下的经理被撤换。"
 krcw_wgr_tauern_arlberg_lines:0 "修复陶恩与阿尔贝格铁路"
 krcw_wgr_tauern_arlberg_lines_desc:0 "陶恩铁路连接萨尔茨堡和克恩滕，阿尔贝格铁路连接蒂罗尔和福拉尔贝格。两条线电气化以后，奥地利诸省之间不必再绕道巴伐利亚。"
 krcw_wgr_expand_erzberg:0 "扩大埃尔茨山铁矿开采"
 krcw_wgr_expand_erzberg_desc:0 "施蒂利亚的埃尔茨山铁矿供应林茨和多纳维茨的高炉。扩大露天开采需要新的矿山机械，由鲁尔的工厂供应。"
 krcw_wgr_alpine_power_federation:0 "成立阿尔卑斯电力联合会"
 krcw_wgr_alpine_power_federation_desc:0 "奥地利诸省和巴伐利亚的电站并入一个电力联合会，由慕尼黑统一调度。各省担心电价由慕尼黑决定，联合会章程因此规定理事会按省份分配席位。"
 krcw_wgr_works_councils_act:0 "颁布车间委员会法"
 krcw_wgr_works_councils_act_desc:0 "车间委员会的权力写进法律：参与招工、解雇和投资决定，厂长由委员会提名。技术人员和计划局抱怨决策变慢了。"
 krcw_wgr_labour_courts:0 "设立劳动法院"
 krcw_wgr_labour_courts_desc:0 "委员会、厂长和产业联合会之间的争议交给劳动法院，陪审员由工会推选。罢工前必须先经过法院调解。"
 krcw_wgr_unified_social_insurance:0 "统一社会保险"
 krcw_wgr_unified_social_insurance_desc:0 "帝国时代分散的疾病、事故和养老保险基金合并为一个社会保险机构，由工会联合会管理。保费由工厂按工资总额缴纳，工厂的利润因此减少。"
 krcw_wgr_five_day_week_f:0 "实行五天工作周"
 krcw_wgr_five_day_week_f_desc:0 "金属工人工会提出\"星期六属于家庭\"，车间委员会大会以多数通过五天工作周。参谋部反对，认为易北河防线需要这部分产能。"
 krcw_wgr_keep_the_long_week:0 "保留四十八小时工作周"
 krcw_wgr_keep_the_long_week_desc:0 "政府以前线形势为由，要求维持四十八小时工作周，多出的产量用于军工和出口。委员会大会勉强同意，条件是每年重新表决一次。"
 krcw_wgr_pass_the_labour_code:0 "通过劳动法典"
 krcw_wgr_pass_the_labour_code_desc:0 "全国委员会代表大会在法兰克福开会，把车间委员会法、劳动法院和社会保险合编为一部劳动法典。代表大会为此开了三周，政府的其他立法全部推迟。"
 krcw_sov_ural_engineering:0 "乌拉尔机器制造托拉斯"
 krcw_sov_ural_engineering_desc:0 "乌拉尔的机器厂、拖拉机厂和车辆厂归入一个托拉斯，统一接受国家订单。军队和农业部都在排队等它的产品。"
 krcw_sov_audited_trusts:0 "受审计的托拉斯"
 krcw_sov_audited_trusts_desc:0 "国家审计员常驻托拉斯，账目每季度上报经济部。经理们抱怨文书太多，但交货期比以前准了。"
 krcw_sov_baron_trusts:0 "乌拉尔的钢铁大王"
 krcw_sov_baron_trusts_desc:0 "托拉斯的利润由董事会自行分配，国家只收股息。钢铁大王们出钱修教堂、办报纸，也更愿意在国家会议上支持政府。"
 krcw_sov_commune_title:0 "村社的地契"
 krcw_sov_commune_title_desc:0 "村社对土地的所有权写进了土地法，份地按人口定期重分。村子稳定，征兵名册齐全，但田地仍然分成细条，产量上不去。"
 krcw_sov_khutor_farms:0 "独立农庄"
 krcw_sov_khutor_farms_desc:0 "农户可以带着份地退出村社，合并成一块自己的农庄。斯托雷平当年没有做完的事，萨文科夫的政府接着做，村社的老人们很不高兴。"
 krcw_sov_atomic_project_2:0 "第一号工程：设计局"
 krcw_sov_atomic_project_2_desc:0 "铀矿、反应堆和设计局已经连成一条线。工程每年吃掉的电力和钢材越来越多，经济部不再被允许过问它的预算。"
 krcw_sov_the_uralmash_trust:0 "改组乌拉尔机器制造厂"
 krcw_sov_the_uralmash_trust_desc:0 "叶卡捷琳堡的乌拉尔机器制造厂改组为托拉斯的总厂，负责为其他工厂制造轧机和压力机。乌拉尔的钢铁大王们要求在董事会里占多数。"
 krcw_sov_chelyabinsk_tractor_works:0 "扩建车里雅宾斯克拖拉机厂"
 krcw_sov_chelyabinsk_tractor_works_desc:0 "车里雅宾斯克拖拉机厂在战时造坦克，现在两条生产线并存：一条造拖拉机给村子，一条造坦克底盘给军队。农业部和国防部为排产顺序吵了半年。"
 krcw_sov_nizhny_tagil_wagon_works:0 "扩建下塔吉尔车辆厂"
 krcw_sov_nizhny_tagil_wagon_works_desc:0 "下塔吉尔车辆厂同时生产铁路货车和中型坦克。总参谋部希望它成为乌拉尔以东的主要坦克厂，远离任何一架国际轰炸机的航程。"
 krcw_sov_tree_bid_civ_5_tt:0 "文官技术派的影响力：§G+5§!"
 krcw_sov_audit_the_trusts:0 "派国家审计员进驻托拉斯"
 krcw_sov_audit_the_trusts_desc:0 "经济部向每个托拉斯派驻审计员，利润的去向第一次有了账目。文官技术派支持这样做，钢铁大王们认为这是对契约的背叛。"
 krcw_sov_tree_bid_mon_5_tt:0 "君主派的影响力：§G+5§!"
 krcw_sov_leave_the_profits_to_the_boards:0 "让托拉斯自行分配利润"
 krcw_sov_leave_the_profits_to_the_boards_desc:0 "政府确认托拉斯董事会有权自行分配利润，国家只收股息。钢铁大王们感谢执政者，并开始和主教们一起出席国家会议的招待会。"
 krcw_sov_the_tuymazy_field:0 "开发图伊马济油田"
 krcw_sov_the_tuymazy_field_desc:0 "巴什基尔的图伊马济油田在更深的泥盆系地层里找到了油。开发它需要新的钻机和一条通往乌法的铁路支线。"
 krcw_sov_the_ufa_refinery:0 "修建乌法炼油厂"
 krcw_sov_the_ufa_refinery_desc:0 "原油不能只装进油罐车运走。乌法炼油厂建成后，伏尔加-乌拉尔的油可以在当地炼成航空汽油和柴油，空军最先得到好处。"
 krcw_sov_the_samara_pipeline:0 "铺设萨马拉输油管"
 krcw_sov_the_samara_pipeline_desc:0 "一条输油管从图伊马济通到萨马拉的伏尔加河码头，油从那里装船南下。铁道部因此腾出了几千节油罐车。"
 krcw_sov_the_peasant_land_bank:0 "重开农民土地银行"
 krcw_sov_the_peasant_land_bank_desc:0 "农民土地银行重新开业，向村社和农户发放购地和购买农机的长期贷款。财政部要为它担保，托拉斯希望贷款最后变成拖拉机订单。"
 krcw_sov_confirm_the_commune_title:0 "确认村社土地所有权"
 krcw_sov_confirm_the_commune_title_desc:0 "土地法规定份地属于村社，由村社大会定期重分。这是萨文科夫当年对农民的承诺，国家会议里的民粹派坚持不能改。"
 krcw_sov_allow_separation_from_the_commune:0 "准许农户退社立户"
 krcw_sov_allow_separation_from_the_commune_desc:0 "农户可以带着自己的份地退出村社，建立独立农庄。经济部的技术派说这是提高产量的唯一办法，村社的老人和民粹派说这是在撕毁契约。"
 krcw_sov_zemstvo_agronomists:0 "由地方自治会派驻农艺师"
 krcw_sov_zemstvo_agronomists_desc:0 "各省地方自治会为村社聘请农艺师和兽医，教村子轮作和选种。份地仍然是细条，但每一条上的收成多了一些。"
 krcw_sov_land_consolidation_commissions:0 "设立土地整理委员会"
 krcw_sov_land_consolidation_commissions_desc:0 "各县的土地整理委员会派出测量员，把退社农户分散的细条地换成一整块。纠纷很多，县法院的案子排到了明年。"
 krcw_sov_siberian_creamery_union:0 "重建西伯利亚奶油合作社联合会"
 krcw_sov_siberian_creamery_union_desc:0 "革命前库尔干和鄂木斯克的奶油合作社曾把黄油卖到伦敦和汉堡。土地银行出钱重建联合会，给各村配齐分离机和冷藏车厢，出口换回的外汇归经济部支配。"
 krcw_sov_grain_elevators:0 "修建粮食升降机网"
 krcw_sov_grain_elevators_desc:0 "沃罗涅日、萨拉托夫、库尔干和库班沿铁路修起粮食升降机，粮食定额不必再堆在车站的露天场地上。国家粮食储备第一次有了足够的仓容。"
 krcw_sov_khodzhent_uranium:0 "开采苦盏铀矿"
 krcw_sov_khodzhent_uranium_desc:0 "塔博沙尔的铀矿在苦盏以北的山里，矿石要用卡车运到铁路。矿区划为禁区，工人大多是行政流放的人。"
 krcw_sov_the_arzamas_bureau:0 "成立阿尔扎马斯设计局"
 krcw_sov_the_arzamas_bureau_desc:0 "下诺夫哥罗德省的萨罗夫修道院旧址改成了一座设计局，负责原子装置本身。科学院推荐了人选，保卫局负责审查每一个人的履历。"
 krcw_sov_the_novaya_zemlya_range:0 "修建新地岛试验场"
 krcw_sov_the_novaya_zemlya_range_desc:0 "北方舰队从阿尔汉格尔斯克向新地岛运送建材和人员，岛上的涅涅茨人被迁往大陆。试验场只能在夏季施工。"
 krcw_sov_bring_the_test_forward:0 "提前进行首次试爆"
 krcw_sov_bring_the_test_forward_desc:0 "设计局报告装置可以提前完成，条件是跳过几项安全试验。总参谋部同意，科学院的几位院士反对。"
 krcw_ddr_reconstruction_office:0 "重建总署"
 krcw_ddr_reconstruction_office_desc:0 "重建计划有了自己的机关：重建总署分配钢材、水泥和运力，各部要先向它报项目。部长们失去了一部分预算权，工地上缺料的情况少了。"
 krcw_ddr_reconstruction_second:0 "重建计划第二阶段"
 krcw_ddr_reconstruction_second_desc:0 "废墟清理完毕，第二阶段的钱转向扩建工厂和新建住宅。奥得河和西里西亚的新厂开始交货，重建总署的职权缩小到监督合同。"
 krcw_ddr_state_farm_system:0 "国营农场体制"
 krcw_ddr_state_farm_system_desc:0 "东部的大庄园由国营农场经营，农机站供应机器，收购价由国家固定。容克保住了管理人的职位，雇农拿到了固定工资。"
 krcw_ddr_ordnance_office:0 "陆军兵器局"
 krcw_ddr_ordnance_office_desc:0 "陆军兵器局重新开张，负责选型、订货和验收。它的军官大多在帝国时代干过同一份工作。"
 krcw_ddr_ordnance_office_2:0 "陆军兵器局"
 krcw_ddr_ordnance_office_2_desc:0 "苏尔、马格德堡和耶拿的工厂都按兵器局的合同生产，火控、枪械和坦克的配套第一次由同一个机关协调。"
 krcw_ddr_set_up_the_reconstruction_office:0 "设立重建总署"
 krcw_ddr_set_up_the_reconstruction_office_desc:0 "重建计划交给一个专门的总署执行，由它分配钢材、水泥和铁路运力。工业部和交通部要交出一部分预算，两位部长都反对。"
 krcw_ddr_build_the_oder_steelworks:0 "修建奥得河钢铁厂"
 krcw_ddr_build_the_oder_steelworks_desc:0 "东德没有鲁尔，只能自己炼钢。总署在奥得河畔的菲尔斯滕贝格选址建厂，用西里西亚的焦炭和经斯德丁运来的俄国矿石。建设期间其他工地的钢材配额要削减。"
 krcw_ddr_reopen_the_waldenburg_pits:0 "恢复瓦尔登堡煤矿"
 krcw_ddr_reopen_the_waldenburg_pits_desc:0 "下西里西亚瓦尔登堡的硬煤是东德唯一能炼焦的煤。矿井在战争末期被淹，排水和加固要花两年，矿工工会要求先修矿工住宅。"
 krcw_ddr_rebuild_the_breslau_wagon_works:0 "重建布雷斯劳车辆厂"
 krcw_ddr_rebuild_the_breslau_wagon_works_desc:0 "布雷斯劳的林克-霍夫曼工厂曾为全德国造机车和车皮。重建后它先为国营铁路补车，再给俄罗斯交付赔偿订单。"
 krcw_ddr_rebuild_schwarzheide:0 "重建施瓦茨海德燃料厂"
 krcw_ddr_rebuild_schwarzheide_desc:0 "卢萨蒂亚的施瓦茨海德厂用褐煤造汽油，战时被炸成废墟。国防部要它优先恢复，因为俄国人的油料配给随时可能减少。"
 krcw_ddr_second_phase_of_reconstruction:0 "宣布重建计划第二阶段"
 krcw_ddr_second_phase_of_reconstruction_desc:0 "清理废墟的阶段结束，预算转向扩建工厂和在莱比锡、德累斯顿建住宅。重建总署缩编为合同监督机关，工业部拿回了自己的预算。"
 krcw_ddr_repair_the_reichsbahn:0 "整修国营铁路"
 krcw_ddr_repair_the_reichsbahn_desc:0 "俄国人把许多复线拆成了单线，拆下的钢轨运去了东方。重建总署先恢复马格德堡、莱比锡和开姆尼茨之间的干线。"
 krcw_ddr_build_the_berlin_outer_ring:0 "修建柏林外环铁路"
 krcw_ddr_build_the_berlin_outer_ring_desc:0 "东德的铁路都通向柏林，而柏林的枢纽站有一半在西区。外环铁路绕开西柏林，把波茨坦和东柏林连起来，西德从此不能用关闭车站来卡住东德的交通。"
 krcw_ddr_expand_the_port_of_stettin:0 "扩建斯德丁港"
 krcw_ddr_expand_the_port_of_stettin_desc:0 "斯德丁是东德在波罗的海最大的港口，俄国矿石和瑞典设备都从这里进来。港务局要新码头和一座修船厂，海军想借用其中一半。"
 krcw_ddr_dredge_the_oder:0 "疏浚奥得河航道"
 krcw_ddr_dredge_the_oder_desc:0 "奥得河把西里西亚的煤和斯德丁的港口连在一起，但河道淤塞，驳船只能半载。疏浚和修船闸的工程由水利局负责，工期要跨过两个冬天。"
 krcw_ddr_set_up_machine_stations:0 "设立农机站"
 krcw_ddr_set_up_machine_stations_desc:0 "国营农场的拖拉机和脱粒机集中到县农机站，按季节派往各农场。机器大多是用俄国贷款买的，还款从粮食交售里扣。"
 krcw_ddr_drain_the_oderbruch:0 "排干奥得河沼泽"
 krcw_ddr_drain_the_oderbruch_desc:0 "奥得河下游的沼泽地在战争中被炸毁的堤坝重新淹没。水利局与国营农场一起修复堤坝和排水渠，工程需要大批劳力，陆军派了工兵营。"
 krcw_ddr_settle_pomerania:0 "在波美拉尼亚安置新农户"
 krcw_ddr_settle_pomerania_desc:0 "波美拉尼亚的庄园边上划出小块土地，分给雇农和从东方来的难民，由国营农场提供机器和种子。民族阵线里的容克派认为这会挖走庄园的劳力。"
 krcw_ddr_build_the_magdeburg_sugar_mills:0 "修建马格德堡糖厂"
 krcw_ddr_build_the_magdeburg_sugar_mills_desc:0 "马格德堡平原的甜菜过去送到西部加工，现在分界线把原料和工厂隔开了。重建总署在本地新建糖厂，城里的配给卡上第一次恢复了糖。"
 krcw_ddr_fix_procurement_prices:0 "规定农产品收购价格"
 krcw_ddr_fix_procurement_prices_desc:0 "国家按固定价格收购粮食、甜菜和牛奶，农场工资与交售量挂钩。城市的配给稳定下来，财政部要为差价付账。"
 krcw_ddr_reopen_the_ordnance_office:0 "重建陆军兵器局"
 krcw_ddr_reopen_the_ordnance_office_desc:0 "义务兵役法带来的新兵需要武器。曼施坦因要求恢复陆军兵器局，由它统一选型和订货，而不是每个军区各自向俄国人要装备。"
 krcw_ddr_adopt_russian_patterns:0 "采用俄罗斯制式装备"
 krcw_ddr_adopt_russian_patterns_desc:0 "兵器局接受俄罗斯的口径和图纸，东德工厂按许可证生产。弹药和备件可以与协定军队通用，德国设计师失去了工作。"
 krcw_ddr_keep_german_designs:0 "保留德国自己的设计"
 krcw_ddr_keep_german_designs_desc:0 "总参谋部坚持用德国人自己的设计，理由是德国工厂熟悉它们。莫斯科认为这是在为独立的军工做准备，许可证谈判变得困难。"
 krcw_ddr_reopen_the_suhl_gunworks:0 "重开苏尔枪械厂"
 krcw_ddr_reopen_the_suhl_gunworks_desc:0 "图林根的苏尔做了几百年枪。兵器局把几家老厂合并成一家国营枪械厂，专门生产步枪和机枪。"
 krcw_ddr_reopen_the_gruson_works:0 "重开马格德堡格鲁森工厂"
 krcw_ddr_reopen_the_gruson_works_desc:0 "马格德堡的格鲁森工厂战前造过坦克，厂房大部分还在，机床被俄国人拆走了。重开它需要从赔偿清单里赎回一批设备。"
 krcw_ddr_zeiss_fire_control:0 "让耶拿蔡司厂生产火控仪器"
 krcw_ddr_zeiss_fire_control_desc:0 "耶拿的蔡司厂有东德最好的光学工程师。兵器局把炮兵和坦克的瞄准镜、测距仪订单交给它，民用相机的产量随之减少。"
 krcw_ddr_schwarzheide:0 "施瓦茨海德燃料厂"
 krcw_ddr_russian_patterns:0 "俄罗斯制式装备"
 krcw_ddr_russian_armour:0 "俄罗斯坦克许可证"
 krcw_ddr_german_designs:0 "德国坦克设计"
 krcw_ddr_german_guns:0 "德国火炮设计"
 krcw_ddr_suhl:0 "苏尔枪械厂"
 krcw_ddr_zeiss:0 "耶拿蔡司厂"
 krcw_fra_containment_line:0 "遏制方针"
 krcw_fra_containment_line_desc:0 "公社不主动越过易北河，但也不给协定任何喘息的时间：情报、广播和贸易都用来削弱对方。情报与宣传经费按战时标准拨付。"
 krcw_fra_containment_plan:0 "瓦解协定的总方针"
 krcw_fra_containment_plan_desc:0 "情报局、电台、清算联盟和流亡组织按同一份计划行动，目标是让协定在经济和政治上拖垮自己。每年的经费由代表大会秘密会议批准。"
 krcw_fra_mobilisation_plan:0 "总动员计划"
 krcw_fra_mobilisation_plan_desc:0 "每个产业联合会都设有动员处，名册上写明战时哪些工厂转产、哪些工人报到。平时多养一批办事员，是计划的代价。"
 krcw_fra_war_readiness:0 "大战准备就绪"
 krcw_fra_war_readiness_desc:0 "动员、运输、防空和联合指挥的准备都已完成，公社可以在一个月内转入全面战争。是否开战仍由代表大会决定。"
 krcw_fra_war_economy:0 "战时经济条例"
 krcw_fra_war_economy_desc:0 "紧急状态下，书记处可以直接调配工厂、原料和运输，产业联合会的自主权暂停。老干部担心条例通过以后就不会再废除。"
 krcw_ti_mobilisation_registers_idea:0 "动员名册"
 krcw_ti_mobilisation_registers_idea_desc:0 "每个车间和市镇公社都登记了战时报到的人员、卡车和工具，名册每年核对一次。开战时不必再临时点名。"
 krcw_fra_ma_crisis_up2_tt:0 "§Y协定危机度 +2§!"
 krcw_fra_ma_crisis_up3_tt:0 "§Y协定危机度 +3§!"
 krcw_fra_geneva_station:0 "日内瓦情报站"
 krcw_fra_radio_east:0 "对东方广播"
 krcw_fra_ma_crisis_up4_tt:0 "§Y协定危机度 +4§!"
 krcw_fra_ma_crisis_up5_tt:0 "§Y协定危机度 +5§!"
 krcw_fra_eastern_legions:0 "组建东欧流亡军团"
 krcw_fra_eastern_legions_desc:0 "从流亡的波兰、捷克和匈牙利工人中招募志愿兵，编成由本国军官指挥的军团。开战时他们随第一批部队越过易北河，协定会把这件事当作战争准备。"
 krcw_fra_ti_crisis_down5_tt:0 "§Y国际危机度 -5§!"
 krcw_fra_root_out_the_networks:0 "清查协定情报网"
 krcw_fra_root_out_the_networks_desc:0 "联邦保卫处清查协定在工会、港口和大学里发展的情报网，逮捕与白俄侨民组织有联系的人。车间大会抱怨保卫处越权，一些错抓的案子会在报纸上闹大。"
 krcw_fra_ti_crisis_down4_tt:0 "§Y国际危机度 -4§!"
 krcw_fra_counterintel:0 "国际反间谍委员会"
 krcw_fra_internationale_counterintelligence:0 "成立国际反间谍委员会"
 krcw_fra_internationale_counterintelligence_desc:0 "各成员国的保卫部门在巴黎设立联合委员会，交换嫌疑人名单和截获的电报。小国担心名单会被用来对付本国的反对派，巴黎承诺名单只用于追查协定的间谍。"
 krcw_fra_recon_sat:0 "侦察卫星"
 krcw_fra_berlin_airlift_reserve:0 "储备柏林空运力量"
 krcw_fra_berlin_airlift_reserve_desc:0 "航空联合会把一批运输机和机组固定划给柏林走廊，在香槟和阿尔萨斯的机场储备燃料和面粉。西德政府欢迎这件事，航空兵则抱怨这占用了训练用的油料。"
 krcw_fra_army_of_the_rhine:0 "向西德派驻莱茵集团军"
 krcw_fra_army_of_the_rhine_desc:0 "两个装甲师和一个航空联队常驻西德，由法德联合指挥部指挥。西德政府承担营房费用，代表大会里有人质疑这支部队会不会变成占领军。"
 krcw_fra_general_mobilisation_plan:0 "编制总动员计划"
 krcw_fra_general_mobilisation_plan_desc:0 "总参谋部和各产业联合会一起编制战时动员表：哪些工厂转产，哪些工人留在车间，哪些人在二十四小时内报到。每个联合会都要设立动员处，平时就多养一批办事员。"
 krcw_fra_mil_rail:0 "军用铁路"
 krcw_fra_rhine_elbe_railways:0 "修建通往易北河的军用铁路"
 krcw_fra_rhine_elbe_railways_desc:0 "从洛林和阿尔萨斯通往莱茵河渡口的铁路加铺复线，在西德境内修建军用支线和装卸站。铁路联合会承担施工，民用货运要为此让路两年。"
 krcw_fra_armour_groups:0 "装甲集团军"
 krcw_fra_armoured_army_groups:0 "组建装甲集团军"
 krcw_fra_armoured_army_groups_desc:0 "把分散在各军区的装甲师合编为两个装甲集团军，平时就按战时编制驻扎在洛林和阿尔萨斯。雷诺和索穆阿的工厂要为此增加一个班次。"
 krcw_fra_forward_air:0 "前推航空兵基地"
 krcw_fra_forward_air_bases:0 "前推航空兵基地"
 krcw_fra_forward_air_bases_desc:0 "战斗机联队从巴黎周边迁往香槟、洛林和阿尔萨斯的新机场，截击时间缩短一半。新机场离易北河更近，开战第一天也更容易遭到轰炸。"
 krcw_fra_convoys:0 "大西洋护航计划"
 krcw_fra_atlantic_convoy_plan:0 "制定大西洋护航计划"
 krcw_fra_atlantic_convoy_plan_desc:0 "战时从北美运来的卡车、镍和粮食都要横渡大西洋。舰队按护航编队重新编组，布雷斯特和勒阿弗尔增建反潜舰艇，工团美洲和加拿大分担一部分护航舰。"
 krcw_fra_civil_defence_directorate:0 "成立民防总局"
 krcw_fra_civil_defence_directorate_desc:0 "民防总局负责城市防空、疏散计划和地下掩体，巴黎地铁站改建为防空洞。市镇公社要组织自己的民防队，经费由地方预算承担。"
 krcw_fra_intel_decrypt:0 "军事情报局"
 krcw_fra_intel_radar:0 "军事情报局"
 krcw_fra_military_intelligence_bureau:0 "扩充联邦军事情报局"
 krcw_fra_military_intelligence_bureau_desc:0 "军事情报局在西德和意大利增设监听站，重点监视协定在波兰和东德的集结地域。它的任务是在开战前告诉总参谋部对方的装甲师在哪里。"
 krcw_fra_war_economy_statute:0 "颁布战时经济条例"
 krcw_fra_war_economy_statute_desc:0 "代表大会授权书记处在紧急状态下直接调配工厂、原料和运输，产业联合会的自主权暂停。老联合会干部担心条例一旦通过就不会再废除。"
 krcw_fra_internationale_joint_command:0 "建立国际联合司令部"
 krcw_fra_internationale_joint_command_desc:0 "欧洲成员的军队在战时交由斯特拉斯堡的联合司令部指挥，各国总参谋部派驻常任代表。每个成员都要事先写明投入哪些师，在哪一段防线上作战。"
 krcw_fra_ww_prepared_tt:0 "总参谋部的§Y全面战争计划§!已经准备就绪。"
 krcw_fra_general_war_readiness:0 "完成大战准备"
 krcw_fra_general_war_readiness_desc:0 "总参谋部向代表大会报告：动员、运输、防空和联合指挥的准备已经完成，公社可以在一个月内转入全面战争。是否开战仍由代表大会决定，但计划已经放在桌上。"
 krcw_fra_ti_crisis_down3_tt:0 "§Y国际危机度 -3§!"
 krcw_ti_stockholm_station:0 "斯德哥尔摩情报站"
 krcw_ti_mobilisation_registers:0 "建立动员名册"
 krcw_ti_mobilisation_registers_desc:0 "每个车间和市镇公社登记战时报到的人员、卡车和工具，名册每年核对一次。工会抱怨登记表太多，但开战时不必再临时点名。"
 krcw_ti_war_stockpiles:0 "储备战时物资"
 krcw_ti_war_stockpiles_desc:0 "在内地仓库里储存弹药、燃料和粮食，保证本国在援军到来前能独立作战。储备要占用一部分出口货物，清算联盟的账上会出现赤字。"
 krcw_ti_counter_infiltration:0 "清查协定渗透"
 krcw_ti_counter_infiltration_desc:0 "保卫部门清查与协定情报机关有联系的工会干部和流亡者组织，截断经中立国送来的经费。有些老党员被错抓，代表大会要为此召开听证会。"
 krcw_ti_wartime_doctrine:0 "战时联合指挥"
 krcw_ti_wartime_command:0 "接受联合司令部战时指挥"
 krcw_ti_wartime_command_desc:0 "本国与巴黎签署战时指挥协定：开战后本国的师归国际联合司令部指挥，本国总参谋部负责后方和动员。反对者说这等于交出战时主权，支持者说小国单独撑不了多久。"
 krcw_ti_crisis_tt:0 "国际危机度：[?global.krcw_ti_crisis]/100"
 krcw_ma_crisis_tt:0 "协定危机度：[?global.krcw_ma_crisis]/100"
 krcw_sov_long_confrontation:0 "长期对抗纲领"
 krcw_sov_long_confrontation_desc:0 "国家会议确认：与国际的对抗要持续一代人。预算、教育和宣传都按这个期限安排。"
 krcw_sov_crush_the_forest_brothers:0 "清剿森林兄弟"
 krcw_sov_crush_the_forest_brothers_desc:0 "宪兵和边防部队进入立陶宛与拉脱维亚的林区，逐村搜查国际资助的游击队和他们的电台。抓到的人按行政程序流放。村子里对俄罗斯人的仇恨会更深。"
 krcw_sov_the_naval_infantry:0 "组建海军登陆兵"
 krcw_sov_the_naval_infantry_desc:0 "黑海和波罗的海舰队各组建一个登陆旅，任务是战争开始时夺取海峡和丹麦的岛屿。舰队要为此改装一批运输船。"
 krcw_sov_strategic_rocket_forces:0 "组建战略火箭部队"
 krcw_sov_strategic_rocket_forces_desc:0 "第一批洲际导弹团脱离炮兵，编成一个独立军种，直接向最高执政者负责。发射阵地修在哈萨克草原和乌拉尔以东。"
 krcw_sov_war_council:0 "国防总会议"
 krcw_sov_war_council_desc:0 "总参谋部、各军种、铁路部和军工托拉斯的负责人每周开一次会，按对国际作战的需要分配预算。"
 krcw_sov_war_industry:0 "军工优先"
 krcw_sov_war_industry_desc:0 "军工托拉斯的订单优先得到钢材、电力和车皮。民用工厂的计划指标相应下调。"
 krcw_sov_general_war_plan:0 "总体战计划"
 krcw_sov_general_war_plan_desc:0 "对国际作战的总计划已经批准：动员时间表、第一梯队的集结地域、铁路的军运图和协定各国的任务都已写定。缺的只是一道命令。"
 krcw_sov_the_supreme_defence_council:0 "设立国防总会议"
 krcw_sov_the_supreme_defence_council_desc:0 "明斯克的联合参谋部只能协调，不能分配预算。国防总会议把总参谋部、军工托拉斯和铁路部放在同一张桌子上，按对国际作战的需要排定优先顺序。财政部失去了对军费的否决权。"
 krcw_sov_the_western_mobilisation_plan:0 "编制西线动员计划"
 krcw_sov_the_western_mobilisation_plan_desc:0 "总参谋部重写一九四四年的动员表：预备役人员按军区登记，三十天内补满西部军区的所有师。每个村社都知道该交出多少人和马。"
 krcw_sov_enlarge_the_tank_armies:0 "扩编近卫坦克集团军"
 krcw_sov_enlarge_the_tank_armies_desc:0 "易北河前线的坦克集团军由三个增加到五个，哈尔科夫和下塔吉尔的工厂转入三班制。每个集团军配属自己的摩托化步兵和架桥部队。"
 krcw_sov_the_frontline_air_armies:0 "组建前线航空集团军"
 krcw_sov_the_frontline_air_armies_desc:0 "每个方面军配属一个航空集团军，歼击机和强击机在明斯克与利沃夫周围的新机场集中。飞行员的训练时数翻倍，燃料配额也随之增加。"
 krcw_sov_the_convoy_war_plan:0 "制定大西洋破交计划"
 krcw_sov_the_convoy_war_plan_desc:0 "国际的军队靠大西洋航线从加拿大和五大湖运来军火。北方舰队的潜艇要在战争第一个月切断这条航线。摩尔曼斯克为此扩建潜艇基地。"
 krcw_sov_the_okhrana_abroad:0 "派奥克拉那渗透国际参谋部"
 krcw_sov_the_okhrana_abroad_desc:0 "奥克拉那的侨民处开始在巴黎和伦敦的参谋机关里物色线人，目标是作战计划和铁路时刻表。一旦暴露，两边的关系会更紧张。"
 krcw_sov_the_western_rail_junctions:0 "改建西部铁路枢纽"
 krcw_sov_the_western_rail_junctions_desc:0 "明斯克、布列斯特、利沃夫和道加夫匹尔斯的枢纽加铺站线、修建换装场，保证动员第一周每天能向西发出足够的军列。工程占用了铁路部全年的投资。"
 krcw_sov_the_war_economy:0 "工业转入战时轨道"
 krcw_sov_the_war_economy_desc:0 "军工托拉斯的订单优先得到钢材、电力和车皮，乌拉尔与伏尔加的民用工厂各有一部分车间改产弹药。商店里的货会更少。"
 krcw_sov_national_civil_defence:0 "建立全国民防体系"
 krcw_sov_national_civil_defence_desc:0 "莫斯科、彼得格勒和乌拉尔的工业城市修建防空洞、疏散路线和备用指挥所。每个工厂都要组建民防队，每个居民都要参加演习。"
 krcw_sov_approve_the_general_war_plan:0 "批准总体战计划"
 krcw_sov_approve_the_general_war_plan_desc:0 "国防总会议把各军种、铁路和协定各国的任务合成一份总计划，交最高执政者签署。计划签署以后，动员可以在一个月内完成。巴黎迟早会知道这份文件的存在。"
 krcw_sov_far_east_front:0 "远东方面军"
 krcw_sov_far_east_front_desc:0 "远东的部队有了自己的司令部、仓库和补给线，不必再等西伯利亚大铁路从欧洲运来一切。"
 krcw_sov_manchurian_plan:0 "满洲作战预案"
 krcw_sov_manchurian_plan_desc:0 "如果南京越过阿穆尔河，远东方面军先守住海兰泡、伯力和海参崴，再从外贝加尔方向反击。"
 krcw_sov_the_far_east_command:0 "成立远东方面军司令部"
 krcw_sov_the_far_east_command_desc:0 "南京要收回外满洲，这已经写进了中国的教科书。远东军区升格为方面军，在赤塔设立独立司令部和仓库。军官们不愿意去，调令附带双倍薪饷。"
 krcw_sov_fortify_the_amur_towns:0 "加固海兰泡与伯力筑垒地域"
 krcw_sov_fortify_the_amur_towns_desc:0 "沿阿穆尔河和乌苏里江修建第二道筑垒地域，把海兰泡和伯力改成能独立坚守的要塞城市。工兵要在冻土上浇混凝土，工期只能在夏天。"
 krcw_sov_double_the_eastern_line:0 "复线化西伯利亚铁路东段"
 krcw_sov_double_the_eastern_line_desc:0 "赤塔到海参崴的单线铁路是远东方面军唯一的补给线，离中国边界最近处不到十公里。铁路部加铺第二条线，并在河岸以北另修一条支线。"
 krcw_sov_the_pacific_fleet:0 "扩建海参崴太平洋舰队"
 krcw_sov_the_pacific_fleet_desc:0 "海参崴的船厂扩建船台，太平洋舰队增加潜艇和鱼雷艇，任务是封锁中国和日本之间的海峡。"
 krcw_sov_the_far_east_air_army:0 "组建远东航空集团军"
 krcw_sov_the_far_east_air_army_desc:0 "在伯力和阿穆尔州修建前进机场，配属一个航空集团军。它的任务是在南京的军队渡河前炸毁哈尔滨和齐齐哈尔的铁路桥。"
 krcw_sov_call_up_the_transbaikal_host:0 "征召外贝加尔哥萨克军"
 krcw_sov_call_up_the_transbaikal_host_desc:0 "外贝加尔和阿穆尔的哥萨克军恢复了战时编制，西伯利亚的新移民也按村编入民兵。他们熟悉边境的每一条河汊。"
 krcw_sov_the_manchurian_plan:0 "制定满洲作战预案"
 krcw_sov_the_manchurian_plan_desc:0 "远东方面军的作战预案经国防会议批准：先守住三座边境城市，再从外贝加尔向哈尔滨反击。预案要求远东常年保持一个满员集团军，西线因此少了几个师。"
 krcw_sov_foreign_directorate:0 "对外情报总局"
 krcw_sov_foreign_directorate_desc:0 "奥克拉那的侨民处和总参谋部的情报处合并为一个总局，专门对付国际。"
 krcw_sov_the_foreign_directorate:0 "成立对外情报总局"
 krcw_sov_the_foreign_directorate_desc:0 "奥克拉那在国内有足够的线人，在国外却只有侨民圈子里的几个老人。新的总局从总参谋部和外交部调人，专门在国际的国家里建立情报网。"
 krcw_sov_shortwave_to_the_communes:0 "扩大对国际的短波广播"
 krcw_sov_shortwave_to_the_communes_desc:0 "莫斯科电台增加法语、英语和德语节目，报道公社报纸不登的配给、罢工和审判。节目要真实到让对方的工人相信。"
 krcw_sov_fund_the_anti_commune_underground:0 "资助法国的反公社组织"
 krcw_sov_fund_the_anti_commune_underground_desc:0 "通过瑞士和西班牙的中间人，把钱和印刷机送给法国境内的天主教团体、旧军官和被没收产业的业主。公社的保卫部门迟早会查到钱的来源。"
 krcw_sov_buy_western_designs:0 "收买国际的技术人员"
 krcw_sov_buy_western_designs_desc:0 "对外情报总局在萨克雷和德·哈维兰的工程师里物色对公社不满的人，用钱和出境的承诺换图纸。拿到的东西要由科学院鉴别真假。"
 krcw_sov_screen_the_emigres:0 "清查侨民中的国际特工"
 krcw_sov_screen_the_emigres_desc:0 "国际也在用同样的办法对付我们。奥克拉那逐一审查从西方回国的侨民和铁路、港口的外籍工人，可疑者流放到叶尼塞河以东。"
 krcw_sov_economic_war_on_the_internationale:0 "对国际发动经济战"
 krcw_sov_economic_war_on_the_internationale_desc:0 "协定各国停止向国际出售石油、铬和木材，并在中立市场上压价抛售国际急需换汇的同类商品。协定成员的外汇收入也会减少。"
 krcw_sov_coordinate_the_hidden_front:0 "统一指挥隐蔽战线"
 krcw_sov_coordinate_the_hidden_front_desc:0 "广播、地下组织、经济战和反渗透由对外情报总局统一安排，每季度向最高执政者报告国际的危机程度。目标是让国际在不开战的情况下垮掉。"
 krcw_ma_mobilisation_plan:0 "本国动员计划"
 krcw_ma_mobilisation_plan_desc:0 "预备役按县登记，动员令下达后两周内补满现役各师。"
 krcw_ma_war_readiness:0 "一级战备"
 krcw_ma_war_readiness_desc:0 "军队、铁路和民防都按战时预案编组，协定的联合参谋部掌握本国每一个师的位置。"
 krcw_ma_the_national_mobilisation_plan:0 "制定本国动员计划"
 krcw_ma_the_national_mobilisation_plan_desc:0 "如果战争来临，第一枪在我们的土地上打响，俄罗斯的援军要一周以后才能到。总参谋部按县登记预备役，把动员时间压缩到两周。"
 krcw_ma_organise_civil_defence:0 "建立民防体系"
 krcw_ma_organise_civil_defence_desc:0 "首都和边境城市修建防空洞，学校和工厂组织疏散演习。国际的轰炸机一小时就能飞到。"
 krcw_ma_stockpile_war_materiel:0 "储备战争物资"
 krcw_ma_stockpile_war_materiel_desc:0 "按协定的标准储备三个月的弹药、燃料和粮食，仓库设在远离边界的山区。储备要从本已紧张的预算里挤出来。"
 krcw_ma_open_the_airfields:0 "向协定空军开放机场"
 krcw_ma_open_the_airfields_desc:0 "本国机场允许俄罗斯的航空团进驻，跑道加长以起降喷气式飞机。本国的飞行员跟着俄罗斯教官训练。"
 krcw_ma_root_out_the_commune_networks:0 "清查境内的公社网络"
 krcw_ma_root_out_the_commune_networks_desc:0 "宪兵清查工厂、大学和铁路里与国际有联系的小组，截获的电台交给协定的联合情报处。抓的人越多，街上的不满越大。"
 krcw_ma_join_the_first_echelon:0 "编入协定第一梯队"
 krcw_ma_join_the_first_echelon_desc:0 "本国最好的师编入协定的第一梯队，由明斯克的联合参谋部统一安排演习和集结地域。本国将军失去了对这些师的一部分指挥权。"
 krcw_ma_first_degree_readiness:0 "进入一级战备"
 krcw_ma_first_degree_readiness_desc:0 "军队、铁路和民防按战时预案编组，边境各师进入野战阵地。长期保持一级战备很费钱，农村也会缺少劳力。"
 krcw_wgr_war_plan_1:0 "易北河作战计划"
 krcw_wgr_war_plan_1_desc:0 "参谋部按一场与东德的战争编制作战计划：谁守哪一段河岸，西柏林撑多久，法国的师何时到达。计划每半年修订一次。"
 krcw_wgr_war_plan_2:0 "易北河作战计划：动员体制"
 krcw_wgr_war_plan_2_desc:0 "后备役人员已按工厂和街区登记，铁路按动员时刻表预留车皮。命令下达后四十八小时内，前线各师可以补满。"
 krcw_wgr_war_plan_3:0 "共和国已作好战争准备"
 krcw_wgr_war_plan_3_desc:0 "作战计划、动员体制、民防与战时经济条例都已到位。共和国随时可以在易北河上作战，代价是和平时期的每一项预算都要让路。"
 krcw_wgr_intelligence_directorate:0 "国家情报总局"
 krcw_wgr_intelligence_directorate_desc:0 "蔡塞尔主持的情报总局负责对东德的侦察和国内的反间谍。它向政治局报告，不向军方报告。"
 krcw_wgr_war_economy:0 "战时经济条例"
 krcw_wgr_war_economy_desc:0 "鲁尔的军工厂按战时定额储备钢材和备件，民用工厂各有一份转产预案。车间委员会保留对工时的表决权。"
 krcw_wgr_sole_representation:0 "单独代表原则"
 krcw_wgr_sole_representation_desc:0 "共和国宣布自己是德意志民族唯一合法的国家。任何承认波茨坦政权的国家，都将失去与共和国的外交关系。"
 krcw_ddr_offensive_plan_1:0 "易北河攻势计划"
 krcw_ddr_offensive_plan_1_desc:0 "总参谋部的计划以进攻为前提：开战后第一周渡过易北河，割断西柏林与鲁尔的联系。计划需要莫斯科的装甲集团军配合。"
 krcw_ddr_offensive_plan_2:0 "易北河攻势计划：协同议定书"
 krcw_ddr_offensive_plan_2_desc:0 "东德各师与俄罗斯集团军共用一套作战计划和通信密码，渡河地段、集结地域和弹药储备都已分配。"
 krcw_ddr_offensive_plan_3:0 "共和国已作好战争准备"
 krcw_ddr_offensive_plan_3_desc:0 "攻势计划、铁路时刻表、防空与战时经济法都已到位。总参谋部报告，共和国可以在接到命令后的一周内开始渡河。"
 krcw_ddr_military_intelligence:0 "军事谍报局"
 krcw_ddr_military_intelligence_desc:0 "旧总参谋部的谍报处恢复了原来的编制，负责对西德的侦察和军内的保卫。内政部的政治警察对它的权限有意见。"
 krcw_ddr_war_economy:0 "战时经济法"
 krcw_ddr_war_economy_desc:0 "萨克森和图林根的工厂各有一份转产预案，钢材、燃料和橡胶按战时定额储备。配给制度随时可以恢复。"
 krcw_ddr_national_mission:0 "民族统一的使命"
 krcw_ddr_national_mission_desc:0 "共和国把统一德意志写进国策：易北河以西是被占领的德国土地，终将在黑白红旗下收回。尼基施的人主持宣传，军官团乐于接受。"
 krcw_ddr_chamber_government:0 "人民议院内阁"
 krcw_ddr_chamber_government_desc:0 "内阁由人民议院的多数组成，预算和任命须经议院表决。共和国仍是协定成员，但将军府不再单独决定国家大事。"
 krcw_wgr_draw_up_the_elbe_war_plan:0 "制定易北河作战计划"
 krcw_wgr_draw_up_the_elbe_war_plan_desc:0 "参谋部按一场与东德和俄罗斯的战争编制正式作战计划，规定各师的防区、西柏林的坚守时间和法国援军的到达时间。卡勒主持起草，财政部要为计划中的每一项储备付款。"
 krcw_wgr_found_the_intelligence_directorate:0 "成立国家情报总局"
 krcw_wgr_found_the_intelligence_directorate_desc:0 "分散在党、军队和警察里的情报机构合并为国家情报总局，由蔡塞尔领导。军方希望它归国防部，政治局坚持由自己直接管辖。"
 krcw_wgr_rail_mobilisation_timetable:0 "编制铁路动员时刻表"
 krcw_wgr_rail_mobilisation_timetable_desc:0 "铁路工会与参谋部一起编制动员时刻表：哪些车皮留作军运，哪些编组站昼夜开放，哪些桥梁预先布置抢修器材。汉诺威和卡塞尔方向的线路优先扩建。"
 krcw_wgr_found_the_civil_defence_office:0 "成立民防总署"
 krcw_wgr_found_the_civil_defence_office_desc:0 "民防总署在鲁尔和汉堡修建防空洞、组织消防队和疏散演习，每个街区选出一名民防员。经费从住宅预算里拨出，住房部长投了反对票。"
 krcw_wgr_break_the_eastern_spy_rings:0 "清查东德谍报网"
 krcw_wgr_break_the_eastern_spy_rings_desc:0 "情报总局清查东德军事谍报局在鲁尔工厂、港口和机场里的联络人。逮捕在一个月内集中进行，一些车间委员会抗议抓错了人。"
 krcw_wgr_build_networks_in_the_east:0 "在东德建立联络网"
 krcw_wgr_build_networks_in_the_east_desc:0 "情报总局在萨克森的铁路枢纽、洛伊纳化工厂和东德军营附近发展联络人，平时收集情报，战时破坏交通。每个暴露的联络人都会让东德的边境管制更严。"
 krcw_wgr_register_the_reserves:0 "实行后备役登记"
 krcw_wgr_register_the_reserves_desc:0 "所有服过役的男子按工厂和街区登记进后备役名册，动员令下达后到指定车站报到。车间委员会负责核对名册，也负责替缺勤的人说情。"
 krcw_wgr_pass_the_war_economy_ordinance:0 "颁布战时经济条例"
 krcw_wgr_pass_the_war_economy_ordinance_desc:0 "条例规定军工厂的战时定额、民用工厂的转产预案和原材料储备。产业联合会必须按条例预留产能，出口合同因此减少。"
 krcw_wgr_sign_the_forward_defence_agreement:0 "签订前沿防御协定"
 krcw_wgr_sign_the_forward_defence_agreement_desc:0 "共和国与巴黎签订协定：开战时国际的援军直接进入易北河防线，由德国前线指挥部统一指挥。法国的条件是共和国的动员计划必须交给美因茨的联合参谋部审核。"
 krcw_wgr_declare_the_republic_ready:0 "宣布共和国战备完成"
 krcw_wgr_declare_the_republic_ready_desc:0 "国防委员会向代表大会报告：作战计划、动员体制、民防和战时经济条例都已到位。代表大会批准了报告，也批准了下一年的军费。"
 krcw_ddr_draw_up_the_elbe_offensive:0 "制定易北河攻势计划"
 krcw_ddr_draw_up_the_elbe_offensive_desc:0 "曼施坦因主持编制对西德的攻势计划：开战第一周渡过易北河，包围西柏林，切断鲁尔与汉堡的联系。计划要莫斯科的装甲集团军同时出动，将军府为此派人去莫斯科。"
 krcw_ddr_restore_military_intelligence:0 "恢复军事谍报局"
 krcw_ddr_restore_military_intelligence_desc:0 "旧总参谋部的谍报处恢复原来的编制，负责对西德的侦察和军内保卫。内政部的政治警察要求分管，将军府没有同意。"
 krcw_ddr_reichsbahn_war_timetable:0 "制定国营铁路战时时刻表"
 krcw_ddr_reichsbahn_war_timetable_desc:0 "国营铁路按攻势计划编制战时时刻表，马格德堡和波茨坦方向的复线优先恢复，拆给俄国人的钢轨要求返还一部分。民用货运在演习期间停运。"
 krcw_ddr_refound_the_air_raid_league:0 "重建防空协会"
 krcw_ddr_refound_the_air_raid_league_desc:0 "防空协会在莱比锡、德累斯顿和东柏林重新组织起来，修防空洞、训练消防队、每个街区指定一名防空员。会员费和义务劳动由各企业摊派。"
 krcw_ddr_hunt_the_western_agents:0 "清查西方间谍"
 krcw_ddr_hunt_the_western_agents_desc:0 "谍报局和政治警察一起清查西德情报总局在铁路枢纽、化工厂和军营附近发展的联络人。审判公开进行，被告的家属被迁出边境地区。"
 krcw_ddr_set_up_the_west_department:0 "设立西方工作局"
 krcw_ddr_set_up_the_west_department_desc:0 "谍报局设立西方工作局，在汉堡港、鲁尔的兵工厂和法军驻地发展线人，平时收集情报，战时破坏交通。经费来自莫斯科，报告也要抄送莫斯科。"
 krcw_ddr_stockpile_crossing_equipment:0 "储备易北河渡河器材"
 krcw_ddr_stockpile_crossing_equipment_desc:0 "工兵部队在马格德堡和维滕贝格附近建仓库，储存浮桥、冲锋舟和架桥车，每年在易北河上演练两次渡河。俄国人提供图纸，钢材由重建总署调拨。"
 krcw_ddr_pass_the_war_economy_law:0 "通过战时经济法"
 krcw_ddr_pass_the_war_economy_law_desc:0 "人民议院通过战时经济法：萨克森和图林根的工厂各备一份转产预案，钢材、燃料和橡胶按战时定额储备。消费品配给随时可以恢复，商店的货架因此更空。"
 krcw_ddr_sign_the_joint_operations_protocol:0 "签订联合作战议定书"
 krcw_ddr_sign_the_joint_operations_protocol_desc:0 "共和国与莫斯科签订联合作战议定书：开战时东德各师编入俄罗斯方面军，渡河地段、集结地域和弹药储备都事先分配。代价是东德的战时指挥权交给俄国元帅。"
 krcw_ddr_declare_war_readiness:0 "宣布共和国战备完成"
 krcw_ddr_declare_war_readiness_desc:0 "总参谋部向人民议院报告：攻势计划、铁路时刻表、防空和战时经济法都已到位，接到命令一周内可以开始渡河。议院批准了报告和下一年的军费。"
 krcw_eng_the_gap_barrier:0 "冰岛缺口屏障"
 krcw_eng_the_gap_barrier_desc:0 "格陵兰、冰岛与法罗群岛之间布设了水听器线、雷区和常驻巡逻编队。俄国潜艇从摩尔曼斯克出航后，要先从这条线上穿过去。"
 krcw_eng_gap_asw:0 "冰岛缺口屏障"
 krcw_eng_rev_ma_p2_tt:0 "协定危机度：+2"
 krcw_eng_rev_ma_p3_tt:0 "协定危机度：+3"
 krcw_eng_the_war_book:0 "战争手册"
 krcw_eng_the_war_book_desc:0 "每个部委和联合会都知道动员令下达那天自己要做什么：征用哪些船、关闭哪些工厂、把哪些列车交给军队。"
 krcw_eng_the_war_footing:0 "战时体制"
 krcw_eng_the_war_footing_desc:0 "战争手册已经演练过，影子工厂已经建成，军需部掌握着转产清单。联邦随时可以在几周内转入战时生产。"
 krcw_eng_the_joint_war_plan:0 "英法联合作战计划"
 krcw_eng_the_joint_war_plan_desc:0 "联邦与公社的参谋部签署了共同作战计划：舰队守大西洋和北海，远征军上易北河，两国空军统一指挥。"
 krcw_eng_draw_up_the_war_book:0 "编制战争手册"
 krcw_eng_draw_up_the_war_book_desc:0 "参谋学院与各产业联合会一起编写战争手册，逐项规定动员日每个部门的任务。国防委员会要求此事，工会方面抱怨它把车间的调度权交给了军队。"
 krcw_eng_fortify_the_channel_coast:0 "加固海峡与北海海岸"
 krcw_eng_fortify_the_channel_coast_desc:0 "在肯特、东英格兰和约克郡海岸修建高射炮阵地和雷达站，防备俄国轰炸机和空降部队。陆军与空军都支持，费用由地方联合会分摊。"
 krcw_eng_expand_the_expeditionary_army:0 "扩编大陆远征军"
 krcw_eng_expand_the_expeditionary_army_desc:0 "把远征军团扩编成可以在易北河与公社并肩作战的野战军，增加装甲旅和摩托化炮兵。巴黎一直在催，征兵名额要从各联合会的青年工人中抽。"
 krcw_eng_rebuild_fighter_command:0 "重建战斗机司令部"
 krcw_eng_rebuild_fighter_command_desc:0 "把分散在各地的截击机中队统一交给一个司令部，接入雷达链，按地区划分防空扇区。航空联合会要更多喷气截击机的订单，轰炸机派则认为钱被分走了。"
 krcw_eng_the_civil_defence_corps:0 "组建民防团"
 krcw_eng_the_civil_defence_corps_desc:0 "每个工会分部组建救援、灭火和防毒小组，城市地下铁路改为防空掩体。人民国民军的老兵负责训练，工人要在下班后再参加每周两晚的操练。"
 krcw_eng_requisition_rail_and_ports:0 "拟定铁路与港口征用计划"
 krcw_eng_requisition_rail_and_ports_desc:0 "铁路联合会与码头工会拟定战时时刻表：哪些线路运兵，哪些港口装船，远征军多少天内能在加来上岸。平时的货运要为演练让路。"
 krcw_eng_home_fleet_war_stations:0 "本土舰队进入战位"
 krcw_eng_home_fleet_war_stations_desc:0 "本土舰队按战时部署轮换驻泊斯卡帕湾和罗赛斯，每年冬天演练拦截从巴伦支海南下的俄国舰队。海军部要求此事，燃油和弹药消耗很大。"
 krcw_eng_build_the_shadow_factories:0 "建立影子工厂"
 krcw_eng_build_the_shadow_factories_desc:0 "在中部和北方的民用工厂旁边建好备用生产线，战时只需换上夹具就能生产弹药和发动机。军需部出资，联合会抱怨占用了扩建厂房的名额。"
 krcw_eng_expand_the_codebreakers:0 "扩建密码局"
 krcw_eng_expand_the_codebreakers_desc:0 "布莱奇利的密码局增加人员和计算机，专门截收俄国舰队和协定参谋部的电报。曼彻斯特计算机的一部分机时从计划部门调给了它。"
 krcw_eng_sign_the_joint_war_plan:0 "签署英法联合作战计划"
 krcw_eng_sign_the_joint_war_plan_desc:0 "联邦与公社的参谋部签署共同作战计划：舰队负责大西洋与北海，远征军上易北河，两国空军统一指挥。代表大会批准了计划，也知道从此伦敦不能独自决定是否参战。"
 krcw_eng_rev_armour:0 "远征军装甲旅"
 krcw_eng_rev_landdoc:0 "远征军条令"
 krcw_eng_rev_fighters:0 "战斗机司令部"
 krcw_eng_rev_logistics:0 "战时运输计划"
 krcw_eng_rev_navdoc:0 "本土舰队战位"
 krcw_eng_rev_codes:0 "密码局"
 krcw_eng_found_the_intelligence_bureau:0 "成立联邦情报局"
 krcw_eng_found_the_intelligence_bureau_desc:0 "把旧军情部门留下的档案、海员工会的港口联络网和国民军的保卫组合并为一个情报局，直接对代表大会国防委员会负责。车间代表担心它将来会被用来监视工会。"
 krcw_eng_rev_ma_p4_tt:0 "协定危机度：+4"
 krcw_eng_fund_the_russian_underground:0 "资助俄国的工团地下组织"
 krcw_eng_fund_the_russian_underground_desc:0 "经芬兰和波罗的海的走私线，把钱、油印机和短波电台送给彼得格勒与顿巴斯的地下工团小组。情报局主张此事，一旦暴露，萨文科夫会把它当作开战的理由。"
 krcw_eng_rev_ti_m4_tt:0 "国际危机度：-4"
 krcw_eng_root_out_the_dockside_networks:0 "清查码头的协定网络"
 krcw_eng_root_out_the_dockside_networks_desc:0 "协定的情报人员借黑衫残党和部分码头分部的掩护收集舰队情报。情报局与码头工会一起清查，抓人会得罪一部分老会员。"
 krcw_eng_broadcast_to_russia:0 "开办对俄短波广播"
 krcw_eng_broadcast_to_russia_desc:0 "用俄语、乌克兰语和芬兰语每天广播，报道协定报纸不登的罢工、短缺和流放判决。广播联合会负责节目，发射机的电力从民用配额里扣。"
 krcw_eng_rev_ti_m3_tt:0 "国际危机度：-3"
 krcw_eng_vet_the_arms_works:0 "审查军工厂的保密"
 krcw_eng_vet_the_arms_works_desc:0 "哈韦尔、德比和克莱德船厂的技术人员接受背景审查，图纸按密级保管。工程师工会抗议，但接受了审查委员会里有工会代表的方案。"
 krcw_eng_rev_ma_p5_tt:0 "协定危机度：+5"
 krcw_eng_shipping_embargo_on_the_accord:0 "对协定实行航运禁运"
 krcw_eng_shipping_embargo_on_the_accord_desc:0 "联邦商船和保险市场拒绝承运和承保协定的货物，中立国船东若为莫斯科运货也会失去伦敦的保险。海员工会支持，利物浦的运费收入会下降。"
 krcw_eng_rev_radio:0 "对俄广播"
 krcw_ent_rev_threshold:0 "核门槛"
 krcw_ent_the_southern_bastion:0 "南方堡垒"
 krcw_ent_the_southern_bastion_desc:0 "北部海岸有了基地，公民军有了训练营，巡逻机覆盖了珊瑚海。任何一个大国要在这里登陆，都得先打一场它不想打的仗。"
 krcw_ent_draw_up_the_southern_defence_plan:0 "制定南方防务计划"
 krcw_ent_draw_up_the_southern_defence_plan_desc:0 "参谋部重写防务计划：不再假定有帝国舰队来援，只按澳新自己的兵力守北部海岸和塔斯曼海航线。陆军和海军第一次按同一份计划分配预算。"
 krcw_ent_fortify_the_northern_coast:0 "加强北部海岸防御"
 krcw_ent_fortify_the_northern_coast_desc:0 "在北部各港扩建海军基地、油库和机场，托雷斯海峡布设雷区。北领地的工程要从南方运去全部材料。"
 krcw_ent_expand_the_citizen_forces:0 "扩编公民军"
 krcw_ent_expand_the_citizen_forces_desc:0 "把公民军扩编成可以在三个月内动员的后备师，所有十八岁男子接受半年训练。工会反对义务兵役，农场主抱怨剪毛季缺人。"
 krcw_ent_maritime_patrol_squadrons:0 "组建远洋巡逻航空队"
 krcw_ent_maritime_patrol_squadrons_desc:0 "远程巡逻机从达尔文、汤斯维尔和奥克兰起飞，覆盖珊瑚海和塔斯曼海。空军要求此事，飞机要从宪政联盟购买。"
 krcw_ent_the_munitions_board:0 "设立军需生产局"
 krcw_ent_the_munitions_board_desc:0 "军需生产局接管利思戈、马里伯农的兵工厂，并在纽卡斯尔增建弹药线，使澳新在海路被切断时仍能自己补充弹药。钢铁配额要从民用建设里挤出来。"
 krcw_ent_proclaim_the_southern_bastion:0 "宣布南方防卫区"
 krcw_ent_proclaim_the_southern_bastion_desc:0 "政府公布防卫区的范围：从帝汶海到塔斯曼海，任何外国舰队进入都要事先通报。两大集团都提出抗议，但都派人来问澳新的条件。"
 krcw_ent_rev_landdoc:0 "公民军训练"
 krcw_ent_rev_patrol:0 "远洋巡逻机"
 krcw_fra2_1_t:0 "国际章程的议程"
 krcw_fra2_1_d:0 "一九五〇年的巴黎大会第一次把国际的章程问题列入正式议程：国际究竟是一个政府、一份公约，还是几个工会之间的协议。前一年意大利拒不执行书记处关于的里雅斯特的决议，而书记处发现自己手里既没有制裁条款也没有开除条款。\n\n主席团先要决定怎么讨论这件事。交给一个起草委员会，分歧会在少数人之间磨平；放到大会全体辩论，分歧会公开，但也会定得更牢。"
 krcw_fra2_1.a:0 "交给起草委员会"
 krcw_fra2_1.b:0 "放到大会全体辩论"
 krcw_fra2_2_t:0 "起草委员会的构成"
 krcw_fra2_2_d:0 "起草委员会由九个人组成，而九个人里有几个书记处的人、几个联合会的人，决定了草案会往哪边写。马蒂要求书记处占多数，理由是“起草需要方向”；莫纳特要求联合会直选委员，理由是“方向正是问题所在”。"
 krcw_fra2_2.a:0 "书记处占多数"
 krcw_fra2_2.b:0 "各半，主席由抽签决定"
 krcw_fra2_2.c:0 "联合会直选全部委员"
 krcw_fra2_3_t:0 "大会上的三篇发言"
 krcw_fra2_3_d:0 "辩论公开进行了三天。马蒂的发言最短：第二国际在一九一四年八月散掉，是因为它没有一个能下决定的中心。弗拉雄主张折中：国际应当是一份公约，但公约里要写进一条执行条款。莫纳特最后发言，他八十岁了，坐在后排，只问了一句：我们花三十年把国家赶出工厂，现在要在国际里造一个新国家吗。"
 krcw_fra2_3.a:0 "马蒂说得对：革命需要一个中心"
 krcw_fra2_3.b:0 "弗拉雄的折中最稳妥"
 krcw_fra2_3.c:0 "莫纳特说出了那个危险"
 krcw_fra2_4_t:0 "草案的第四条"
 krcw_fra2_4_d0:0 "争论最后集中到第四条，而起草的过程已经让书记处占了上风：前几轮里中央派赢得的让步，都写进了措辞里。各国代表团必须表态，决议对拒不执行的成员是否具有约束力。"
 krcw_fra2_4_d1:0 "争论最后集中到第四条，而起草的过程已经偏向了联合会：前几轮里公社派赢得的让步，让任何强制条款都很难通过。各国代表团必须表态，决议对拒不执行的成员是否具有约束力。"
 krcw_fra2_4_d2:0 "争论最后集中到草案的第四条，也就是执行条款。各国代表团必须表态：决议对拒不执行的成员是否具有约束力。"
 krcw_fra2_4.a:0 "写入制裁与表决权暂停"
 krcw_fra2_4.b:0 "只写\"成员应尽力执行\""
 krcw_fra2_4.c:0 "删掉第四条，连同整个秘书处"
 krcw_fra2_5_t:0 "小成员国的异议"
 krcw_fra2_5_d:0 "强制条款的草案一传出去，几个小成员国的代表团立刻表示保留。伊比利亚联邦说它绝不会接受任何中心的决议具有约束力；意大利代表团提醒大家，上一次书记处发决议的时候，罗马是怎么回答的。这些国家会按本国的处境自己表态，巴黎替它们决定不了。"
 krcw_fra2_5.a:0 "坚持条款，让反对者记录保留意见"
 krcw_fra2_5.b:0 "为小成员国加一条自愿退出的保障"
 krcw_fra2_6_t:0 "没有牙齿的章程"
 krcw_fra2_6_d:0 "软性的措辞让章程顺利通过了，可是它什么也约束不了。南京的代表在走廊里说得很直白：这样一份章程，和一个通讯社的章程没有区别。现在的问题是，要不要给这份软章程配一套让成员自愿协作的机制，比如仲裁。"
 krcw_fra2_6.a:0 "设立成员间的仲裁与协作机制"
 krcw_fra2_6.b:0 "什么也不加：公约就是公约"
 krcw_fra2_7_t:0 "章程的表决"
 krcw_fra2_7_d0:0 "表决前一天，伊比利亚和意大利的代表团宣布，如果强制条款通过，它们将不承认它对本国有效。书记处派依然掌握着多数，但会场上每个人都知道，这个多数买不来执行。代表大会现在要在三份文本之间作出选择。"
 krcw_fra2_7_d1:0 "起草、辩论和第四条的争论下来，书记处派掌握了多数。代表大会现在要在三份文本之间作出选择，书记处的文本最有希望通过。"
 krcw_fra2_7_d2:0 "起草、辩论和第四条的争论下来，联合会一派占了上风，连撤销书记处的动议都有了足够的票数。代表大会现在要在三份文本之间作出选择。"
 krcw_fra2_7_d3:0 "起草和辩论没有让任何一派取得明确多数。公约的文本是唯一能确定通过的一份，其余文本是否有足够的票数，要看前几轮争取到的支持。"
 krcw_fra2_7.a:0 "通过有约束力的章程"
 krcw_fra2_7.b:0 "通过公社的公约"
 krcw_fra2_7.c:0 "通过联合会的直接协议"
 krcw_fra2_8_t:0 "新章程下的第一份决议"
 krcw_fra2_8_d0:0 "新章程生效后，书记处的第一份决议就要求各成员国统一边境检查标准。马蒂派出的监察员已经上路，伊比利亚和意大利还在观望。现在要决定是直接执行，还是先在私下谈妥。"
 krcw_fra2_8_d1:0 "公约生效后的第一份决议是关于边境检查标准的，按公约它只约束同意的成员。荷兰和比利时已经签字，西德要求先修改措辞。现在要决定是照公约办事，还是先私下协调。"
 krcw_fra2_8_d2:0 "书记处撤销以后，边境检查标准由铁路和海关两个跨国联合会直接签约。第一份协议在法国、比利时和荷兰之间生效，其他国家的联合会还在讨论。现在要决定是照章程办事，还是先私下协调。"
 krcw_fra2_8.a:0 "照章程办事"
 krcw_fra2_8.b:0 "先和各成员国私下协调"
 krcw_fra2_suspend_the_dissenters:0 "暂停拒不执行者的表决权"
 krcw_fra2_suspend_the_dissenters_desc:0 "章程通过后，书记处对拒不执行决议的成员暂停表决权，意大利是第一个。罗马的代表团还留在会场，但不能举手。其他小成员国开始认真对待书记处的决议。"
 krcw_fra2_negotiated_exemptions:0 "同小成员国谈判豁免"
 krcw_fra2_negotiated_exemptions_desc:0 "书记处和伊比利亚、意大利分别谈判，把边界和土地问题列为不受决议约束的事项。决议从此只在两国同意的事项上执行。马蒂认为这是在章程上开洞，弗拉雄认为这是让章程活下去的办法。"
 krcw_fra2_court_of_the_covenant:0 "设立公约仲裁院"
 krcw_fra2_court_of_the_covenant_desc:0 "代表大会决定的仲裁机制落地：各成员推举一名法官，成员之间的争议由仲裁院裁决，裁决由各国代表大会自愿执行。第一宗案子是西德和荷兰之间的莱茵河航运费。"
 krcw_fra2_crash_programme:0 "原子弹突击计划"
 krcw_fra2_crash_programme_desc:0 "总参谋部要求在一九五〇年底以前完成第一次试验。马库尔和萨克雷的实验室三班倒，民用反应堆的工作全部让路。"
 krcw_fra2_10_t:0 "原子能委员会归谁领导"
 krcw_fra2_10_d:0 "原子能委员会成立以后，第一个问题是它向谁负责。约里奥-居里要求委员会归全国研究理事会领导，研究成果原则上公开；总参谋部要求委员会归联邦防务委员会领导，因为它的第一项任务是造出炸弹。"
 krcw_fra2_10.a:0 "归研究理事会领导"
 krcw_fra2_10.b:0 "归联邦防务委员会领导"
 krcw_fra2_11_t:0 "约里奥-居里的条件"
 krcw_fra2_11_d:0 "约里奥-居里接受了委员会主任的职务，并提出一个条件：反应堆和同位素的研究要在国际的期刊上发表，只有武器的设计保密。他的理由是，国际各成员的物理学家迟早都要用到这些数据。"
 krcw_fra2_11.a:0 "接受：反应堆研究公开发表"
 krcw_fra2_11.b:0 "只向书记处成员内部通报"
 krcw_fra2_12_t:0 "总参谋部的时间表"
 krcw_fra2_12_d:0 "唐吉将军向防务委员会提交了时间表：一九五〇年底以前完成第一次试验，为此马库尔和萨克雷要三班倒，民用反应堆的工作暂停。约里奥-居里表示，如果时间表通过，他会考虑辞职。"
 krcw_fra2_12.a:0 "批准突击计划"
 krcw_fra2_12.b:0 "按正常进度进行"
 krcw_fra2_13_t:0 "试验场选在哪里"
 krcw_fra2_13_d:0 "委员会的勘测队选中了阿尔及利亚撒哈拉的雷加内：方圆几百公里没有城镇，有现成的骆驼道和一处可以扩建的机场。问题是，阿尔及利亚劳工联合会从未被征求过意见。"
 krcw_fra2_13.a:0 "先征求阿尔及尔联合会的同意"
 krcw_fra2_13.b:0 "由代表大会宣布雷加内为联邦保留地"
 krcw_fra2_14_t:0 "阿尔及尔的答复"
 krcw_fra2_14_d0:0 "阿尔及尔联合会的执行委员会同意了试验场，条件是雇用当地工人并按法国的工资标准付酬。图阿雷格人的牧道改线由联合会负责协调。"
 krcw_fra2_14_d1:0 "阿尔及尔联合会的执行委员会同意了试验场，但开出一份清单：雇用当地工人，按法国工资付酬，修通从阿德拉尔到雷加内的公路，并在联邦代表大会里给阿尔及利亚增加席位。最后一条要以后再谈，前三条要先兑现。"
 krcw_fra2_14.a:0 "接受联合会的条件"
 krcw_fra2_15_t:0 "图瓦特绿洲的请愿"
 krcw_fra2_15_d:0 "雷加内被宣布为联邦保留地以后，图瓦特和提迪克尔特的绿洲公社联名向巴黎请愿：试验场切断了他们的两条牧道，而没有人来问过他们。阿尔及尔联合会把请愿书转给了代表大会，附了一句话：这件事会被记住。"
 krcw_fra2_15.a:0 "赔偿绿洲公社，修新的牧道和水井"
 krcw_fra2_15.b:0 "试验场是国防工程，不予讨论"
 krcw_fra2_16_t:0 "准备“路易丝”"
 krcw_fra2_16_d:0 "雷加内的钢塔已经立起来，第一枚装置的部件正在从马赛运往阿尔及尔。委员会要决定试验的方式：邀请国际各成员和中立国的科学家到场观察，还是只让防务委员会的人在场。"
 krcw_fra2_16.a:0 "邀请观察员"
 krcw_fra2_16.b:0 "封闭试验"
 krcw_fra2_17_t:0 "核武库的规模"
 krcw_fra2_17_d0:0 "约里奥-居里在突击计划通过后辞了职，现在以普通代表的身份在大会上发言，要求把核武器的数量写进法律。总参谋部的方案是一份覆盖从华沙到乌拉尔全部目标的名单。代表大会要决定核武库的规模。"
 krcw_fra2_17_d1:0 "约里奥-居里的公开信登报以后，几十个联合会的大会通过决议支持他：核武器只用来让别人的核武器失去作用。总参谋部仍然提交了一份覆盖到乌拉尔的目标名单。代表大会要决定核武库的规模。"
 krcw_fra2_17_d2:0 "雷加内的试验成功以后，代表大会要决定核武库的规模。约里奥-居里主张几枚就够，数量封顶，不首先使用；总参谋部提交了一份覆盖从华沙到乌拉尔全部目标的名单。"
 krcw_fra2_17.a:0 "几枚就够：最低限度威慑"
 krcw_fra2_17.b:0 "覆盖到乌拉尔：全面威慑"
 krcw_fra2_no_first_use_statute:0 "把不首先使用写进法律"
 krcw_fra2_no_first_use_statute_desc:0 "代表大会把核武器的数量上限和不首先使用写进联邦宪章，修改要经三分之二多数。约里奥-居里起草了条文，试验数据按条文向书记处全体成员公开。"
 krcw_fra2_targeting:0 "核目标委员会"
 krcw_fra2_target_committee:0 "成立核目标委员会"
 krcw_fra2_target_committee_desc:0 "总参谋部成立核目标委员会，负责维护目标名单和投送计划，委员会只向防务委员会报告。代表大会以后只能看到委员会的年度预算。"
 krcw_fra2_18_t:0 "核武库的第一份报告"
 krcw_fra2_18_d0:0 "原子能委员会按宪章交出第一份年度报告：弹头数量没有超过上限，试验数据已经送到各成员的科学院。总参谋部在附件里写了一条保留意见，认为上限过低。"
 krcw_fra2_18_d1:0 "核目标委员会交出第一份报告：目标名单已经覆盖到乌拉尔，轰炸机部队的训练还需要两年。报告的数字没有给代表大会看，几个联合会的代表要求知道这笔钱花在哪里。"
 krcw_fra2_18.a:0 "向代表大会公开报告"
 krcw_fra2_18.b:0 "只向防务委员会报告"
 krcw_fra2_20_t:0 "发展基金由谁支配"
 krcw_fra2_20_d:0 "阿尔及利亚发展基金的第一笔钱到了阿尔及尔。阿尔及利亚劳工联合会要求由本地的联合会代表大会决定钱花在哪里；巴黎派驻的专员认为，基金是联邦的钱，应当由他按计划总署的指标分配。"
 krcw_fra2_20.a:0 "交给阿尔及尔的联合会代表大会"
 krcw_fra2_20.b:0 "由巴黎的专员分配"
 krcw_fra2_21_t:0 "联合会理事会的选举"
 krcw_fra2_21_d:0 "为了管理基金，阿尔及尔联合会要选一个理事会。码头工会书记穆罕默德·本·阿里提出按会员人数分配席位，这样穆斯林工人会占多数；欧洲裔的铁路和电力工会要求按行业分配，这样它们能保住一半。"
 krcw_fra2_21.a:0 "按会员人数分配"
 krcw_fra2_21.b:0 "按行业分配"
 krcw_fra2_22_t:0 "奥兰的两种工资"
 krcw_fra2_22_d:0 "专员按指标把基金投进了奥兰港，新码头的工资表却分成两档：欧洲裔工人一档，穆斯林工人低一档。穆斯林码头工人停了工，欧洲裔工人照常上班。"
 krcw_fra2_22.a:0 "统一工资表"
 krcw_fra2_22.b:0 "派地方防卫队维持港口运转"
 krcw_fra2_23_t:0 "学校用什么语言"
 krcw_fra2_23_d:0 "基金的第二批钱要用来办学校。阿尔及尔联合会要求阿拉伯语和塔马齐格特语的小学与法语学校并列；巴黎的教育联合会认为，统一用法语教学才能让阿尔及利亚的工人进入全国的联合会。"
 krcw_fra2_23.a:0 "三种语言的学校并列"
 krcw_fra2_23.b:0 "统一用法语教学"
 krcw_fra2_24_t:0 "奥兰码头的冲突"
 krcw_fra2_24_d:0 "地方防卫队进港以后，停工的码头工人和欧洲裔工人在装卸区打了起来，有人受了枪伤。阿尔及尔联合会召开紧急会议，要求撤出防卫队并统一工资表。"
 krcw_fra2_24.a:0 "撤出防卫队，统一工资表"
 krcw_fra2_24.b:0 "港口恢复秩序以后再谈"
 krcw_fra2_25_t:0 "本·阿里的代表团"
 krcw_fra2_25_d0:0 "本·阿里带着一个代表团来到巴黎，手里是奥兰的伤员名单和图瓦特绿洲的请愿书。他说，阿尔及利亚的工人已经不相信巴黎会给他们平等的地位，现在只剩两条路：真正的自治，或者独立。"
 krcw_fra2_25_d1:0 "本·阿里带着一个代表团来到巴黎。发展基金由阿尔及尔的联合会支配了几年，学校和工资的问题大都谈妥了。他要求把这些做法写成一部章程：阿尔及利亚在公社之内自治，有自己的代表大会和预算。"
 krcw_fra2_25_d2:0 "本·阿里带着一个代表团来到巴黎，要求代表大会回答一个问题：阿尔及利亚是公社的一部分，还是公社的殖民地。代表团没有提出具体方案，只要求一个答复。"
 krcw_fra2_25.a:0 "起草阿尔及尔章程：公社内的自治"
 krcw_fra2_25.b:0 "承认一个独立的兄弟共和国"
 krcw_fra2_25.c:0 "阿尔及利亚的省份就是法国"
 krcw_fra2_26_t:0 "阿尔及利亚代表大会的选举"
 krcw_fra2_26_d:0 "章程通过以后，阿尔及利亚第一次选举自己的代表大会。选举结果不由巴黎决定，几派的力量要看过去几年基金和学校办得怎么样。"
 krcw_fra2_26.a:0 "承认选举结果"
 krcw_fra2_27_t:0 "阿尔及利亚的驻军"
 krcw_fra2_27_d:0 "巴黎拒绝了自治方案，向阿尔及利亚增派两个师。总参谋部要决定这些部队怎么编：从本地招募地方防卫连，还是全部由本土的部队轮换。"
 krcw_fra2_27.a:0 "在本地招募地方防卫连"
 krcw_fra2_27.b:0 "全部由本土部队轮换"
 krcw_fra2_algerian_assembly:0 "召开阿尔及利亚代表大会"
 krcw_fra2_algerian_assembly_desc:0 "新选出的阿尔及利亚代表大会在阿尔及尔开幕，接管了发展基金、学校和地方预算。它在联邦代表大会里的席位按人口重新分配。"
 krcw_fra2_algerian_territorials:0 "整编阿尔及利亚驻军"
 krcw_fra2_algerian_territorials_desc:0 "阿尔及利亚驻军按总参谋部的方案整编，修筑从阿尔及尔到撒哈拉的军用公路。部队能守住港口和试验场，但每一次巡逻都会被阿尔及尔联合会记下来。"
 krcw_eng2_coalfield_bitterness:0 "煤田的怨气"
 krcw_eng2_coalfield_bitterness_desc:0 "国民军替罢工的矿井运过煤，南威尔士和拉纳克的矿工记得这件事。矿井按时出煤，但联合会的会议上没有人再替伦敦说话。"
 krcw_eng2_pit_federations:0 "矿区联合会"
 krcw_eng2_pit_federations_desc:0 "每个煤田由自己的矿工联合会管理产量和人员调配，克莱德河的船厂直接与拉纳克煤田签订供货和招工合同。"
 krcw_eng2_coal_board:0 "全国煤炭局"
 krcw_eng2_coal_board_desc:0 "全国煤炭局按一份统一计划分配各煤田的产量，关闭枯竭的矿井，把矿工调往新井和船厂。各地联合会只保留安全与福利事务。"
 krcw_eng2_army_of_the_elbe:0 "易北河常备军"
 krcw_eng2_army_of_the_elbe_desc:0 "防务审查把陆军放在首位。四个常备师驻在易北河西岸，与公社的部队共用补给线和指挥网。"
 krcw_eng2_ocean_fleet:0 "远洋舰队优先"
 krcw_eng2_ocean_fleet_desc:0 "防务审查把舰队放在首位。造船预算先给航母和护航舰，陆军只保留本土防卫和一个可以随舰出动的旅。"
 krcw_eng2_rhine_squadron:0 "两栖折中方案"
 krcw_eng2_rhine_squadron_desc:0 "代表大会接受了修正案：一个装甲旅常驻大陆，其余部队编成可以随舰队出动的两栖兵力。两个军种都没拿到全部预算。"
 krcw_eng2_10_t:0 "煤炭计划的关闭名单"
 krcw_eng2_10_d:0 "全国煤炭计划列出了拉纳克和南威尔士一批快要采空的矿井，准备关闭，矿工转到诺丁汉郡的新井和克莱德河的船厂。矿工联合会书记阿瑟·霍纳要求名单由各煤田自己来定。计划部门认为那样一来名单永远定不下来，新井也会缺人。"
 krcw_eng2_10.a:0 "让各煤田联合会自己定名单"
 krcw_eng2_10.b:0 "按计划关闭"
 krcw_eng2_11_t:0 "矿区投票"
 krcw_eng2_11_d0:0 "各煤田的矿区分会花了几个星期投票。拉纳克同意关闭采空的矿井，条件是克莱德河的船厂接收它的年轻矿工当学徒；南威尔士要求把关闭分摊到几年里。两个条件都要钱，也都要别的联合会点头。"
 krcw_eng2_11.a:0 "接受拉纳克的条件"
 krcw_eng2_11.b:0 "把关闭分摊到几年里"
 krcw_eng2_12_t:0 "拉纳克矿工罢工"
 krcw_eng2_12_d0:0 "关闭名单在拉纳克的矿井门口贴出来的第二天，名单上的矿井全部停工，南威尔士的分会开始给他们寄钱。罢工委员会说计划是在伦敦写的，写的时候没有一个矿工在场。煤炭计划开始落后，船厂的锅炉用煤也跟着紧张。"
 krcw_eng2_12.a:0 "派霍纳去谈"
 krcw_eng2_12.b:0 "让国民军运煤"
 krcw_eng2_13_t:0 "克莱德的回答"
 krcw_eng2_13_d0:0 "霍纳与拉纳克罢工委员会达成了协议：矿井关闭，年轻矿工进克莱德河船厂当学徒。现在要由船厂的车间代表来决定收不收这些人，他们担心学徒会压低造船工人的工资。"
 krcw_eng2_13_d1:0 "关闭改为分几年进行，拉纳克的矿工会陆续转到克莱德河的船厂。船厂的车间代表要先投票，他们担心学徒会压低造船工人的工资。"
 krcw_eng2_13_d2:0 "拉纳克的条件转到了格拉斯哥：船厂收下矿井关闭后多出来的年轻矿工当学徒。船厂的车间代表要先投票，他们担心学徒会压低造船工人的工资。"
 krcw_eng2_13.a:0 "给船厂加一批商船订单"
 krcw_eng2_13.b:0 "只请求团结，不加订单"
 krcw_eng2_14_t:0 "克莱德声援停工"
 krcw_eng2_14_d0:0 "国民军的卡车开进拉纳克矿区运煤的那个星期，克莱德河各船厂的车间代表停下了吊车，声援罢工的矿工。泰恩河的分会发来电报表示支持。海军的护航舰工期开始延误，造船联合会要求伦敦表态。"
 krcw_eng2_14_d1:0 "船厂的车间代表投票拒绝在没有工资保障的情况下接收矿工。煤炭计划部门催促执行关闭名单时，克莱德河各船厂停了工。海军的护航舰工期开始延误，造船联合会要求伦敦表态。"
 krcw_eng2_14.a:0 "让步：船厂安置好人之前不关矿井"
 krcw_eng2_14.b:0 "坚持计划"
 krcw_eng2_tt_pit_federations:0 "解锁国策：§Y矿区联合会章程§!"
 krcw_eng2_tt_coal_board:0 "解锁国策：§Y成立全国煤炭局§!"
 krcw_eng2_15_t:0 "煤田与船厂的协议"
 krcw_eng2_15_d0:0 "克莱德河的车间代表投票同意接收拉纳克的矿工，条件是学徒按造船工人的工资标准拿钱。各煤田的联合会提出，以后的关闭和调配都由煤田自己与船厂直接商定，伦敦只管总量。"
 krcw_eng2_15_d1:0 "伦敦让了步：船厂安置好人之前，名单上的矿井一座也不关。船厂复工后，各煤田的联合会提出，以后的关闭和调配都由煤田自己与船厂直接商定，伦敦只管总量。"
 krcw_eng2_15.a:0 "起草矿区联合会章程"
 krcw_eng2_16_t:0 "煤炭局方案"
 krcw_eng2_16_d0:0 "罢工结束了，拉纳克和克莱德河都按计划复工。计划部门提出设立全国煤炭局，统一决定各煤田的产量、关闭和人员调配。矿工联合会没有派人参加起草，霍纳说矿工记得是谁开的卡车。"
 krcw_eng2_16_d1:0 "船厂的停工拖了几个月，最后按计划复工。计划部门提出设立全国煤炭局，统一决定各煤田的产量、关闭和人员调配，矿工联合会只保留安全和福利事务。"
 krcw_eng2_16.a:0 "把方案交给代表大会"
 krcw_eng2_17_t:0 "矿区联合会章程"
 krcw_eng2_17_d0:0 "代表大会通过了章程：每个煤田由自己的矿工联合会管理产量和人员，船厂直接与煤田签合同。霍纳在表决后说，这份章程是国民军开进拉纳克之后矿工唯一愿意签的东西。全国煤炭计划只剩下总量指标。"
 krcw_eng2_17_d1:0 "代表大会通过了章程：每个煤田由自己的矿工联合会管理产量和人员，船厂直接与煤田签合同。全国煤炭计划只剩下总量指标，计划部门抱怨以后很难再调动人手。"
 krcw_eng2_17.a:0 "克莱德与拉纳克签长期合同"
 krcw_eng2_17.b:0 "各煤田自定价格"
 krcw_eng2_18_t:0 "全国煤炭局成立"
 krcw_eng2_18_d0:0 "全国煤炭局在唐卡斯特挂牌，接管了各煤田的产量、关闭和调配。拉纳克和南威尔士的分会拒绝派人出席成立大会。计划部门要决定，矿工联合会在煤炭局里有没有席位。"
 krcw_eng2_18_d1:0 "全国煤炭局在唐卡斯特挂牌，接管了各煤田的产量、关闭和调配。矿工联合会要求在煤炭局里有自己的席位，计划部门认为那会让每一次关闭都变成谈判。"
 krcw_eng2_18.a:0 "让矿工代表进煤炭局"
 krcw_eng2_18.b:0 "煤炭局只对计划部负责"
 krcw_eng2_19_t:0 "矿工宪章签署"
 krcw_eng2_19_d0:0 "矿工宪章写进了矿区联合会章程：八小时工作日、井下安全检查员由矿工选举、矿井关闭须经本煤田投票。霍纳在卡迪夫签字，拉纳克的罢工委员会派人到场。"
 krcw_eng2_19_d1:0 "矿工宪章由煤炭局与矿工联合会签署：八小时工作日、井下安全检查员由矿工选举。拉纳克的分会没有到场，他们说国民军运煤的事还没有人道歉。"
 krcw_eng2_19_d2:0 "矿工宪章由煤炭局与矿工联合会签署：八小时工作日、井下安全检查员由矿工选举、矿井关闭须提前一年通知。霍纳在唐卡斯特签字，煤炭局把宪章写进了下一份产量计划。"
 krcw_eng2_19.a:0 "在各矿区宣读宪章"
 krcw_eng2_19.b:0 "把宪章与产量指标挂钩"
 krcw_eng_the_pit_federations_charter:0 "矿区联合会章程"
 krcw_eng_the_pit_federations_charter_desc:0 "把克莱德与拉纳克达成的办法推广到所有煤田：每个煤田由自己的联合会管理产量和人员，船厂和工厂直接与煤田签合同。矿工联合会支持，计划部门会失去调配人手的权力。"
 krcw_eng_found_the_coal_board:0 "成立全国煤炭局"
 krcw_eng_found_the_coal_board_desc:0 "设立全国煤炭局，统一决定各煤田的产量、关闭和人员调配，船厂和工厂的用煤由煤炭局按计划分配。计划部门主张此事，各煤田的联合会只剩安全和福利事务。"
 krcw_eng2_30_t:0 "防务审查"
 krcw_eng2_30_d:0 "大陆承诺通过后，代表大会要求一份防务审查：预算只够优先发展一个军种。海军部要航母和护航舰，陆军部要在易北河常驻四个师。两份方案都要先写成书面意见，再交代表大会表决。"
 krcw_eng2_30.a:0 "由海军部起草意见"
 krcw_eng2_30.b:0 "由陆军部起草意见"
 krcw_eng2_31_t:0 "海军部的意见书"
 krcw_eng2_31_d:0 "海军部的意见书认为，不列颠的安全取决于大西洋航线：没有护航舰，从加拿大来的粮食和从联合工团来的钢材都运不过来。它要求把造船预算放在首位，陆军只保留本土防卫。陆军部在附件里表示反对。"
 krcw_eng2_31.a:0 "提交代表大会表决"
 krcw_eng2_32_t:0 "陆军部的意见书"
 krcw_eng2_32_d:0 "陆军部的意见书认为，下一场战争会在易北河打响：如果西德守不住，舰队再强也挡不住协定的坦克开到加来。它要求在易北河西岸常驻四个师，与公社的部队共用补给线。海军部在附件里表示反对。"
 krcw_eng2_32.a:0 "提交代表大会表决"
 krcw_eng2_33_t:0 "代表大会表决防务审查"
 krcw_eng2_33_d:0 "代表们按地区和行业分组投票。造船和码头的代表支持舰队，煤矿和钢铁工会的代表大多支持陆军。有一份修正案提出折中：一个装甲旅常驻大陆，其余部队编成两栖兵力。投票结果要等各组的票数汇总。"
 krcw_eng2_33.a:0 "等待计票"
 krcw_eng2_tt_review_fleet:0 "解锁国策：§Y扩建远洋舰队§!"
 krcw_eng2_tt_review_army:0 "解锁国策：§Y组建易北河常备军§!"
 krcw_eng2_tt_review_amph:0 "解锁国策：§Y组建两栖兵力§!"
 krcw_eng2_34_t:0 "舰队优先"
 krcw_eng2_34_d:0 "代表大会以多数票通过了舰队优先的方案。航母和护航舰的预算先行拨付，易北河的驻军维持现有规模。陆军部的代表没有退席，但在会后的声明里保留了意见。"
 krcw_eng2_34.a:0 "批准造船预算"
 krcw_eng2_35_t:0 "陆军优先"
 krcw_eng2_35_d:0 "代表大会以多数票通过了陆军优先的方案。四个常备师将在一年内调往易北河西岸，造船计划推迟一年。海军部的代表在会后提出，护航舰的缺口要由公社的海军来补。"
 krcw_eng2_35.a:0 "批准驻军计划"
 krcw_eng2_36_t:0 "修正案获得通过"
 krcw_eng2_36_d:0 "两个方案都没有拿到多数，代表大会转而通过了折中修正案。一个装甲旅常驻大陆，其余部队编成可以随舰队出动的两栖兵力。两个军种都只拿到了一部分预算。"
 krcw_eng2_36.a:0 "批准修正案"
 krcw_eng2_37_t:0 "防务审查执行情况"
 krcw_eng2_37_d0:0 "第一批护航舰已经下水，航母的龙骨在克莱德河铺设。大西洋航线上的商船第一次有了完整的护航编队。"
 krcw_eng2_37_d1:0 "四个常备师已经在易北河西岸的营地驻扎，与公社的部队开始联合演习。补给线经由汉堡港。"
 krcw_eng2_37_d2:0 "装甲旅已在大陆驻扎，两栖兵力完成了第一次随舰队出动的演习。两个军种都抱怨预算不够，但都能出动。"
 krcw_eng2_37.a:0 "继续执行"
 krcw_eng_expand_the_ocean_fleet:0 "扩建远洋舰队"
 krcw_eng_expand_the_ocean_fleet_desc:0 "按防务审查的决定，造船预算先给航母和护航舰。克莱德河和泰恩河的船厂接下订单，陆军只保留本土防卫。"
 krcw_eng_raise_the_army_of_the_elbe:0 "组建易北河常备军"
 krcw_eng_raise_the_army_of_the_elbe_desc:0 "按防务审查的决定，四个常备师调往易北河西岸，与公社的部队共用补给线和指挥网。造船计划推迟。"
 krcw_eng_raise_the_amphibious_force:0 "组建两栖兵力"
 krcw_eng_raise_the_amphibious_force_desc:0 "按修正案的决定，一个装甲旅常驻大陆，其余部队编成可以随舰队出动的两栖兵力。两个军种各拿一部分预算。"
 krcw_eng2_50_t:0 "执行委员会的组成"
 krcw_eng2_50_d0:0 "代表大会选了行政派的道路，由书记处和各部委统一管理经济。车间代表派和行会派的代表还在大会里，他们手里有不少工会的票。新的执行委员会要决定是否给他们留位置。"
 krcw_eng2_50_d1:0 "代表大会选了车间代表派的道路，权力交给各厂的车间代表大会。行政派和行会派的代表还在大会里，他们控制着几个大部和不少技术工会。新的执行委员会要决定是否给他们留位置。"
 krcw_eng2_50_d2:0 "代表大会选了行会社会主义的道路，各行业按行会自行管理。行政派和车间代表派的代表还在大会里，手里有不少工会的票。新的执行委员会要决定是否给他们留位置。"
 krcw_eng2_50.a:0 "请落败的派别进入执行委员会"
 krcw_eng2_50.b:0 "由获胜的派别单独执政"
 krcw_eng2_51_t:0 "分享执行委员会"
 krcw_eng2_51_d:0 "执行委员会给了落败的两派各两个席位。他们要求在工资和住房政策上有否决权，获胜的一派只肯给一个咨询席位。各派要回去问自己的工会，再决定接不接受。"
 krcw_eng2_51.a:0 "等待各派的答复"
 krcw_eng2_52_t:0 "单独执政"
 krcw_eng2_52_d:0 "获胜的一派组成了清一色的执行委员会。落败的两派在大会里组成了联合反对派，开始在各工会里争取代表。执行委员会要决定如何对待他们的报纸和集会。"
 krcw_eng2_52.a:0 "不干涉，让他们在大会里争"
 krcw_eng2_52.b:0 "收紧他们的报纸"
 krcw_eng2_53_t:0 "落败派别的决定"
 krcw_eng2_53_d:0 "落败的两派在各自的工会里开会，讨论是接受执行委员会的条件，还是留在反对派。他们的决定会影响代表大会在以后几年里怎么运转。"
 krcw_eng2_53.a:0 "等待结果"
 krcw_eng2_tt_road_united:0 "解锁国策：§Y组成工会联合执行委员会§!"
 krcw_eng2_tt_road_split:0 "解锁国策：§Y以多数派执政§!"
 krcw_eng2_54_t:0 "各派接受条件"
 krcw_eng2_54_d:0 "落败的两派接受了执行委员会的席位，条件是工资和住房政策要在大会上逐项表决。代表大会恢复了全体会议，没有派别退席。"
 krcw_eng2_54.a:0 "接受"
 krcw_eng2_55_t:0 "反对派留在大会外"
 krcw_eng2_55_d:0 "落败的两派拒绝了执行委员会的条件，留在反对派。他们在几个大工会里赢得了代表改选，开始在大会里阻挠议案。"
 krcw_eng2_55.a:0 "由多数派继续执政"
 krcw_eng2_56_t:0 "代表大会的新秩序"
 krcw_eng2_56_d0:0 "联合执行委员会运转了一年。工资和住房议案在大会上逐项表决，进度慢，但没有派别退席，各工会也没有再罢工。"
 krcw_eng2_56_d1:0 "多数派单独执政了一年。议案在大会上屡受阻挠，但执行委员会靠多数票推行了主要的计划。反对派在下一次改选中又赢了几个工会。"
 krcw_eng2_56.a:0 "继续"
 krcw_eng_form_a_united_union_executive:0 "组成工会联合执行委员会"
 krcw_eng_form_a_united_union_executive_desc:0 "把落败的两派正式纳入执行委员会，工资和住房政策在大会上逐项表决。各工会都支持，执行委员会的决定会慢一些。"
 krcw_eng_govern_by_the_majority:0 "以多数派执政"
 krcw_eng_govern_by_the_majority_desc:0 "由获胜的一派凭多数票推行主要计划，不再等待反对派同意。执行委员会的效率更高，各工会里的反对声会更大。"
 krcw_wgr2_party_discipline:0 "党的纪律"
 krcw_wgr2_party_discipline_desc:0 "党重新确立了对工会和车间委员会的领导权，决议自上而下执行。书记处办事更快，代价是基层的争论少了，一些老组织者退出了党。"
 krcw_wgr2_council_democracy:0 "车间说了算"
 krcw_wgr2_council_democracy_desc:0 "车间委员会保留对工时、定额和车间主任的表决权，党只在委员会里争取多数。工厂里的士气很高，但遇到国防预算这样的问题，表决常常拖很久。"
 krcw_wgr2_corridor_regime:0 "走廊对等制度"
 krcw_wgr2_corridor_regime_desc:0 "通道管理局对东德的每一次刁难都采取对等措施：东德扣我们一列火车，我们就扣一列过境的东德货运。这套制度让走廊运转，也让柏林的气氛一直紧绷。"
 krcw_ddr2_inner_trade:0 "莱比锡的交易"
 krcw_ddr2_inner_trade_desc:0 "共和国通过莱比锡博览会和过境贸易向西德出售褐煤、化工品和光学仪器，换回机床和硬通货。将军府用这笔钱补贴食品，但协定里有人说这是在资助敌人。"
 krcw_ddr2_junker_officers:0 "容克的军官团"
 krcw_ddr2_junker_officers_desc:0 "易北河以东的庄园主保住了土地，作为交换，他们的儿子重新填满了军官团和总参谋部。军队更可靠了，但分到土地的雇农觉得革命从他们头上绕了过去。"
 krcw_ddr2_land_reform:0 "庄园的分配"
 krcw_ddr2_land_reform_desc:0 "容克的大庄园被没收，分给雇农和东部的难民。农村的支持换来了，代价是旧军官团对政权离心，粮食产量在头几年也掉了下来。"
 krcw_ddr2_blockade_command:0 "封锁指挥部"
 krcw_ddr2_blockade_command_desc:0 "国营铁路、内河航运和边防军归一个联合指挥部统一调度，随时可以收紧或放开通往西柏林的通道。指挥部直接向将军府报告，由莫斯科批准每一次收紧。"
 krcw_wgr2_1_t:0 "鲁尔的第一个满产年"
 krcw_wgr2_1_d:0 "鲁尔的高炉和矿井重新开到战前的产量，书记处要为这些钢和煤定一个方向。工会代表想先造住房和消费品，参谋部和卡勒要把产能留给莱茵集团军和易北河防线。这是两条不同的路。"
 krcw_wgr2_1.a:0 "先造住房、消费品和民用机器"
 krcw_wgr2_1.b:0 "把钢和煤留给莱茵集团军"
 krcw_wgr2_2_t:0 "住房名册上的数字"
 krcw_wgr2_2_d:0 "住房先行的决定下来以后，区域规划局报来数字：鲁尔有二十万户人家还住在战时的工棚和地窖里。规划局想把钱集中修几座样板新城，老工会干部要求先把最差的工棚拆掉。"
 krcw_wgr2_2.a:0 "集中资金建样板新城"
 krcw_wgr2_2.b:0 "先拆最差的工棚"
 krcw_wgr2_3_t:0 "为莱茵集团军铸炮"
 krcw_wgr2_3_d:0 "鲁尔的军工按战时定额开工，第一批火炮和装甲钢运往莱茵河。巴黎注意到了西德的军工产能，联合参谋部送来一份合作提议，但也要求查看共和国的生产计划。巴黎如何回应由巴黎决定。"
 krcw_wgr2_3.a:0 "接受合作，交出生产计划"
 krcw_wgr2_3.b:0 "自己造，不交计划"
 krcw_wgr2_4_t:0 "车间委员会的表决"
 krcw_wgr2_4_d:0 "鲁尔的路线要由产业联合会的车间委员会大会表决通过。党希望大会批准书记处的方案并接受党的领导，一部分老组织者却想借这次大会把更多的决定权留在车间。表决的结果由代表们自己决定。"
 krcw_wgr2_4.a:0 "等待大会的结果"
 krcw_wgr2_5_t:0 "大会批准了书记处的方案"
 krcw_wgr2_5_d:0 "车间委员会大会以多数通过了书记处的方案，并确认党在联合会里的领导地位。书记处可以更快地执行鲁尔计划，但要决定如何对待投反对票的那批老组织者。"
 krcw_wgr2_5.a:0 "把纪律写进联合会章程"
 krcw_wgr2_5.b:0 "给反对派留在联合会里"
 krcw_wgr2_6_t:0 "大会把权力留在车间"
 krcw_wgr2_6_d:0 "车间委员会大会否决了党直接领导的方案，确认车间对工时、定额和车间主任的表决权。工厂里的士气很高，书记处却担心这样下去，国防预算这样的决定会被无休止地拖延。"
 krcw_wgr2_6.a:0 "接受车间民主，调整计划节奏"
 krcw_wgr2_6.b:0 "为战时保留一条快速决定的通道"
 krcw_wgr2_7_t:0 "鲁尔造出来的东西"
 krcw_wgr2_7_d0:0 "几年过去，鲁尔的产量变成了新住宅、电车和冰箱，共和国的工人住得比易北河对岸好得多。这成了对东德最有力的宣传，只是莱茵集团军的装备始终差着一截。"
 krcw_wgr2_7_d1:0 "几年过去，鲁尔的钢和煤变成了火炮、装甲和弹药，莱茵集团军已能在易北河上独当一面。工人的住房等了下来，党靠纪律把这件事压住了。"
 krcw_wgr2_7_d2:0 "鲁尔的方向已经定了，这个工业区的产出决定了共和国这几年的样子。"
 krcw_wgr2_7.a:0 "鲁尔是共和国的脊梁"
 krcw_wgr2_20_t:0 "走廊上的第一次刁难"
 krcw_wgr2_20_d:0 "东德的边防在赫尔姆斯泰特关卡扣下一列运往西柏林的煤车，理由是单据不符。通道管理局要为这类事情定一套规矩：要么对等反制，要么把每一次刁难都交给巴黎去办。这决定了往后几年走廊上的来往方式。"
 krcw_wgr2_20.a:0 "对东德货运采取对等反制"
 krcw_wgr2_20.b:0 "把走廊问题交给巴黎"
 krcw_wgr2_21_t:0 "以火车还火车"
 krcw_wgr2_21_d:0 "对等反制开始运转：东德扣我们一列，我们就在西德扣下一列过境的东德货运。走廊勉强保持畅通，但两边的货场上都堆起了被扣的车皮，柏林的气氛越来越紧。"
 krcw_wgr2_21.a:0 "继续对等，寸步不让"
 krcw_wgr2_21.b:0 "私下与东德谈一套通行细则"
 krcw_wgr2_22_t:0 "巴黎接手走廊"
 krcw_wgr2_22_d:0 "国际把西柏林走廊的交涉接了过去，法国的外交官在赫尔姆斯泰特和东德当局周旋，法国的运输机进入待命状态。巴黎如何处理这件事由巴黎决定，共和国只能等消息。"
 krcw_wgr2_22.a:0 "巴黎顶住，走廊归国际管"
 krcw_wgr2_22.b:0 "巴黎谈成一套通行细则"
 krcw_wgr2_23_t:0 "东德收紧了通道"
 krcw_wgr2_23_d:0 "东德的反应传了过来。将军府决定要么收紧通往西柏林的铁路和公路，向协定施压，要么维持现状、避免把事情闹到战争边缘。这一步由波茨坦和莫斯科决定，不由共和国决定。"
 krcw_wgr2_23.a:0 "等柏林传来消息"
 krcw_wgr2_24_t:0 "通道又窄了一截"
 krcw_wgr2_24_d:0 "东德把通往西柏林的货运减到维持生存的最低限度，城里的燃料和面粉开始见底。共和国要在升级和忍耐之间选择：扩大空运、公开对抗，还是削减西柏林的消耗、把危机拖下去。"
 krcw_wgr2_24.a:0 "扩大空运，公开对抗"
 krcw_wgr2_24.b:0 "削减消耗，把危机拖下去"
 krcw_wgr2_25_t:0 "维持住的走廊"
 krcw_wgr2_25_d:0 "东德没有进一步收紧，走廊维持着一种紧张的通畅。共和国可以借这段喘息把西柏林的储备补足，也可以趁机把通道的规则谈成一份白纸黑字的协定。"
 krcw_wgr2_25.a:0 "趁机补足西柏林的储备"
 krcw_wgr2_25.b:0 "把通行规则谈成书面协定"
 krcw_wgr2_26_t:0 "谁为西柏林付账"
 krcw_wgr2_26_d:0 "围绕走廊的较量到了收尾的阶段，账单摆了出来：常备空运、补贴的运费和城里的储备都要钱。书记处要决定是让共和国全额承担，把西柏林攥在自己手里，还是请国际分担，把它当成整个阵营的前哨。"
 krcw_wgr2_26.a:0 "共和国独力承担，攥紧西柏林"
 krcw_wgr2_26.b:0 "请国际分担，当作阵营前哨"
 krcw_wgr2_27_t:0 "走廊上的规矩"
 krcw_wgr2_27_d0:0 "较量以常备空运和公开对抗收场，西柏林活了下来，但柏林成了随时可能擦枪走火的地方，协定内部为这座城市付出的代价一直有人在算。"
 krcw_wgr2_27_d1:0 "较量以一份书面的通行协定收场，走廊的来往有了白纸黑字的规矩，柏林的气氛缓和了一些。东德照规矩办事，但谁都知道它什么时候都可以撕掉这份纸。"
 krcw_wgr2_27_d2:0 "走廊的规矩定了下来，西柏林仍然悬在东德的国土中央，靠这套规矩活着。"
 krcw_wgr2_27.a:0 "西柏林会留在共和国这边"
 krcw_ddr2_1_t:0 "西柏林这颗楔子"
 krcw_ddr2_1_d:0 "西柏林嵌在共和国的国土中央，一条铁路、一条公路和几条驳船航道从西德通向它。将军府看着地图上的这几条线，问能不能把它当作对付协定的筹码。有人说这几条线是武器，也有人说，共和国同样靠莱比锡博览会和过境贸易挣西德的硬通货。"
 krcw_ddr2_1.a:0 "先做生意，把西德的硬通货挣到手"
 krcw_ddr2_1.b:0 "把通道当作对付协定的筹码"
 krcw_ddr2_2_t:0 "莱比锡的账本"
 krcw_ddr2_2_d:0 "过境贸易做起来以后，账算得很清楚：西德用机床和硬通货换共和国的褐煤、化工品和耶拿的光学仪器。将军府拿这笔钱补贴食品，稳住了城里的物价，但莫斯科问，为什么要让敌人的工厂拿到我们的化工品。"
 krcw_ddr2_2.a:0 "扩大贸易，公开挂账"
 krcw_ddr2_2.b:0 "只卖褐煤，扣下战略物资"
 krcw_ddr2_3_t:0 "把手放在闸门上"
 krcw_ddr2_3_d:0 "将军府决定把通道当作筹码。国营铁路、内河航运和边防军被编入一个联合指挥部，随时可以收紧或放开通往西柏林的通道。哈默施泰因提醒说，上一次封锁换来的是协定的空运和一场几乎失控的危机。"
 krcw_ddr2_3.a:0 "成立封锁指挥部"
 krcw_ddr2_3.b:0 "只留一套随时能收紧的预案"
 krcw_ddr2_4_t:0 "莫斯科怎么看这件事"
 krcw_ddr2_4_d:0 "无论走哪条路，柏林都要先问过莫斯科。使节带着共和国的打算去见萨文科夫的人：是收紧对西柏林的通道、把危机当成武器，还是维持现状、不给协定开战的借口。莫斯科的答复由莫斯科决定。"
 krcw_ddr2_4.a:0 "等莫斯科的答复"
 krcw_ddr2_5_t:0 "莫斯科点了头"
 krcw_ddr2_5_d:0 "莫斯科同意把西柏林的通道作为施压的手段，条件是每一次收紧都要事先报备，开战的决定权留在莫斯科。封锁指挥部开始分批减少过境货运，柏林的压力一点点升高。"
 krcw_ddr2_5.a:0 "分批收紧，逼协定让步"
 krcw_ddr2_5.b:0 "只收紧到足以谈判的程度"
 krcw_ddr2_6_t:0 "莫斯科按住了柏林"
 krcw_ddr2_6_d:0 "莫斯科不同意现在把柏林的通道当武器：协定在俄亥俄的停火线上已经够紧张，莫斯科不想为了西柏林再开一条战线。将军府只能收起封锁的打算，另找办法应付城里的难题。"
 krcw_ddr2_6.a:0 "服从莫斯科，转而加强边境管制"
 krcw_ddr2_6.b:0 "口头服从，暗中保留封锁预案"
 krcw_ddr2_7_t:0 "西柏林这件事的结局"
 krcw_ddr2_7_d0:0 "共和国把西柏林的通道攥在手里，一次次收紧，逼协定在走廊问题上让步。柏林成了随时可能擦枪走火的地方，莫斯科的那一票始终压在将军府头上。"
 krcw_ddr2_7_d1:0 "共和国没有把通道当武器，而是靠莱比锡的贸易挣西德的硬通货、补贴城里的食品。协定里有人骂这是通敌，但共和国的物价稳住了。"
 krcw_ddr2_7_d2:0 "围绕西柏林的这场较量定了调，通道的开合从此是柏林和莫斯科手里的一张牌。"
 krcw_ddr2_7.a:0 "西柏林的命运攥在东方手里"
 krcw_ddr2_20_t:0 "谁来当军官"
 krcw_ddr2_20_d:0 "国防军要重建，第一个问题是军官从哪里来。易北河以东的庄园主的儿子世代当军官，总参谋部要他们回来；分到土地的雇农和东部的难民则问，这个共和国到底是谁的。将军府要在容克的忠诚和农村的忠诚之间选一边。"
 krcw_ddr2_20.a:0 "让容克的儿子填满军官团"
 krcw_ddr2_20.b:0 "没收庄园，分给雇农和难民"
 krcw_ddr2_21_t:0 "容克回到总参谋部"
 krcw_ddr2_21_d:0 "庄园主保住了土地，他们的儿子重新填满了军官团和总参谋部。军队更可靠，训练更快，但分到小块土地的雇农觉得革命从他们头上绕了过去，国际的广播正拿这件事说事。"
 krcw_ddr2_21.a:0 "给庄园主国债，彻底换取忠诚"
 krcw_ddr2_21.b:0 "同时给雇农一点土地，两头安抚"
 krcw_ddr2_22_t:0 "庄园分了"
 krcw_ddr2_22_d:0 "容克的大庄园被没收，分给雇农和东部的难民。农村第一次站到了政权这边，国际的广播在东部没有了听众。代价是旧军官团对政权离心，粮食产量在头几年掉了下来。"
 krcw_ddr2_22.a:0 "从雇农和士官里提拔新军官"
 krcw_ddr2_22.b:0 "保留旧军官，只动他们的土地"
 krcw_ddr2_23_t:0 "军官团的态度"
 krcw_ddr2_23_d:0 "土地的事定了以后，军官团的态度传了上来。一部分年轻军官对政权的做法不满，开始在军营里串联。他们是会公开反对，还是私下接受既成事实，由军官团自己决定，不由将军府决定。"
 krcw_ddr2_23.a:0 "等军营里的消息"
 krcw_ddr2_24_t:0 "军营里的串联"
 krcw_ddr2_24_d:0 "几个驻波茨坦和马格德堡的团里，年轻军官的不满传成了一份要求书。将军府要在两条路里选一条：用军事谍报局把为首的人清查出去，还是把他们请到波茨坦，当面谈一笔新的交易。"
 krcw_ddr2_24.a:0 "清查为首的军官"
 krcw_ddr2_24.b:0 "请他们来波茨坦谈一笔交易"
 krcw_ddr2_25_t:0 "军官团认了账"
 krcw_ddr2_25_d:0 "军官团没有公开反对，年轻军官接受了既成事实。将军府可以借这段平静把军官团的忠诚固定下来，要么把它绑在将军府身上，要么绑在那张还空着的王座上。"
 krcw_ddr2_25.a:0 "把忠诚绑在将军府身上"
 krcw_ddr2_25.b:0 "把忠诚引向空着的王座"
 krcw_ddr2_26_t:0 "军队的归属"
 krcw_ddr2_26_d0:0 "清洗过后，军营里安静了下来，忠诚是靠军事谍报局维持的。军队听将军府的话，但谁都记得被带走的那些人，年轻军官学会了把话咽回去。"
 krcw_ddr2_26_d1:0 "军官团的忠诚被引向了那张还空着的王座，军官们宣誓时想的是霍亨索伦，不是哪一位将军。这给了政权一个凌驾于党派之上的名分，也让君主派在军中扎下了根。"
 krcw_ddr2_26_d2:0 "军官团的归属定了下来，国防军重建起来，但它究竟属于谁，这几年才算有了答案。"
 krcw_ddr2_26.a:0 "国防军重新成型"
 krcw_wgr2_paris_decides_tt:0 "§Y巴黎§!将自行决定如何回应。"
 krcw_wgr2_councils_vote_tt:0 "§Y车间委员会大会§!将自行表决。"
 krcw_wgr2_ddr_decides_tt:0 "§Y波茨坦和莫斯科§!将自行决定下一步。"
 krcw_ddr2_moscow_decides_tt:0 "§Y莫斯科§!将自行决定答复。"
 krcw_ddr2_officers_decide_tt:0 "§Y军官团§!将自行决定态度。"
 krcw_wgr2_the_ruhr_output:0 "确定鲁尔的产出方向"
 krcw_wgr2_the_ruhr_output_desc:0 "鲁尔的路线已经由车间委员会大会定了下来。书记处把这个方向写进第二个五年计划，整个工业区按这个方向排产。"
 krcw_wgr2_the_consumer_ruhr:0 "把鲁尔转向消费品"
 krcw_wgr2_the_consumer_ruhr_desc:0 "鲁尔的产能转向住房、电车和家用电器，共和国的工人过上了易北河对岸看得见、够不着的日子。军工的扩张要往后排。"
 krcw_wgr2_the_armoured_ruhr:0 "把鲁尔转向军工"
 krcw_wgr2_the_armoured_ruhr_desc:0 "鲁尔的钢和煤优先供给军工，莱茵集团军的装甲和火炮由此补齐。消费品的计划削减，车间委员会被要求接受较长的工时。"
 krcw_wgr2_what_the_ruhr_built:0 "清点鲁尔造出来的东西"
 krcw_wgr2_what_the_ruhr_built_desc:0 "书记处盘点鲁尔这几年的产出，向代表大会报告这个工业区把共和国带到了什么地方。报告既是总结，也是下一个计划的起点。"
 krcw_wgr2_the_corridor_doctrine:0 "确立走廊方针"
 krcw_wgr2_the_corridor_doctrine_desc:0 "围绕西柏林走廊的较量定了调，书记处把处理走廊的方针写成常设制度。往后每一次刁难都按这套方针办，不再临时请示。"
 krcw_wgr2_the_standing_airlift:0 "维持常备空运"
 krcw_wgr2_the_standing_airlift_desc:0 "航空联合会把一批运输机和机组固定划给柏林走廊，在香槟和阿尔萨斯储备燃料和面粉。只要东德再收紧通道，空运随时可以顶上。"
 krcw_wgr2_the_written_corridor:0 "把走廊规则写成协定"
 krcw_wgr2_the_written_corridor_desc:0 "通道的通行细则谈成了一份书面协定，东德照规矩放行火车、卡车和驳船。柏林的气氛缓和了一些，共和国省下了常备空运的开销。"
 krcw_wgr2_the_island_city:0 "把西柏林办成一个州"
 krcw_wgr2_the_island_city_desc:0 "围绕西柏林的较量到了收尾，书记处把这座城市的地位固定下来，向代表大会报告谁来为它付账、它在共和国里算什么。"
 krcw_ddr2_the_lever_or_the_ledger:0 "确定对西柏林的方针"
 krcw_ddr2_the_lever_or_the_ledger_desc:0 "围绕西柏林的较量定了调，将军府把对通道的方针写成常设制度：要么是贸易，要么是封锁。往后不再临时请示莫斯科。"
 krcw_ddr2_the_blockade_weapon:0 "把通道作为武器"
 krcw_ddr2_the_blockade_weapon_desc:0 "封锁指挥部保持待命，随时可以分批收紧通往西柏林的铁路、公路和航道，逼协定在走廊问题上让步。每一次收紧都要先报莫斯科。"
 krcw_ddr2_the_leipzig_window:0 "把莱比锡办成橱窗"
 krcw_ddr2_the_leipzig_window_desc:0 "共和国不封通道，而是把莱比锡博览会办成东方阵营的橱窗，用过境贸易挣西德的硬通货、补贴城里的食品。协定里有人骂这是通敌。"
 krcw_ddr2_the_fate_of_the_city:0 "为西柏林这件事定案"
 krcw_ddr2_the_fate_of_the_city_desc:0 "将军府为围绕西柏林的较量定案，向人民议院报告通道的开合从此是柏林和莫斯科手里的一张牌。"
 krcw_ddr2_whose_army:0 "确定军队的归属"
 krcw_ddr2_whose_army_desc:0 "军官团的归属定了下来，将军府把军官的选拔、晋升和效忠对象写成常设制度。这决定了国防军重建成一支什么样的军队。"
 krcw_ddr2_the_staff_army:0 "将军府的军队"
 krcw_ddr2_the_staff_army_desc:0 "军官团效忠将军府，而不是哪一位君主。军队是政权手里最可靠的工具，但政权一旦交替，这支军队的归属也会随之成为问题。"
 krcw_ddr2_the_crowns_army:0 "王座的军队"
 krcw_ddr2_the_crowns_army_desc:0 "军官团的效忠引向了那张还空着的霍亨索伦王座，军官宣誓时想的是皇帝，不是将军。这给了政权一个凌驾于党派之上的名分，也让君主派在军中扎下了根。"
 krcw_ddr2_the_oath_taken:0 "国防军宣誓"
 krcw_ddr2_the_oath_taken_desc:0 "国防军重建完成，军官团按新的规矩宣誓。将军府向人民议院报告这支军队究竟属于谁，这几年才算有了答案。"
 krcw_sov_the_sickroom:0 "病中的执政者"
 krcw_sov_the_sickroom_desc:0 "萨文科夫还活着，但他的签字要由别人代笔。各部的公文在办公厅里积压，谁接管办公厅，谁就决定哪些公文先送进病房。"
 krcw_sov_industrial_committee:0 "国家工业委员会"
 krcw_sov_industrial_committee_desc:0 "国家工业委员会任免乌拉尔各托拉斯的总经理，每季度审核一次生产计划。钢铁大王们保留股份，失去了董事会。"
 krcw_sov_ural_syndicate:0 "乌拉尔辛迪加"
 krcw_sov_ural_syndicate_desc:0 "乌拉尔的钢铁、机器和车辆托拉斯合并为一个辛迪加，统一接受国家订单，自行安排生产和利润。国家只拿优先股的股息。"
 krcw_sov2_vote_tt:0 "国家会议将按各派的影响力选出新的最高执政者。"
 krcw_sov_tree_bid_mil_10_tt:0 "军方稳定派的影响力：§G+10§!"
 krcw_sov2_1_t:0 "最高执政者中风"
 krcw_sov2_1_d:0 "萨文科夫在克里姆林宫的书房里中风，右手瘫痪，说话吃力。医生的报告说他还能活一段时间，但不能再处理日常公文。各部的文件已经在办公厅里积压了一个星期，国家会议必须决定由谁替他管理办公厅。"
 krcw_sov2_1.a:0 "由国家会议议长涅克拉索夫代管办公厅"
 krcw_sov2_1.b:0 "由总参谋部派副官进驻办公厅"
 krcw_sov2_1.c:0 "由牧首和宫中旧人照料病房"
 krcw_sov2_2_t:0 "涅克拉索夫的临时议定书"
 krcw_sov2_2_d:0 "涅克拉索夫起草了一份议定书：最高执政者去世后，国家会议三日内开会，三十日内选举，其间由议长代行职权。各派都没有反对，因为每一派都觉得三十天对自己有利。剩下的问题是要不要公布它。"
 krcw_sov2_2.a:0 "在报纸上公布"
 krcw_sov2_2.b:0 "锁进议长的保险柜"
 krcw_sov2_drop_ext_5_tt:0 "极端派的影响力：§R-5§!"
 krcw_sov2_3_t:0 "总参谋部的演习"
 krcw_sov2_3_d:0 "总参谋部的副官进驻办公厅后的第二周，两个近卫师从图拉调到莫斯科近郊参加秋季演习。华西列夫斯基对国家会议说，这是最高执政者病重期间的预防措施。文官们注意到，演习没有写结束的日期。"
 krcw_sov2_3.a:0 "让部队留在莫斯科近郊"
 krcw_sov2_3.b:0 "命令部队回营"
 krcw_sov2_drop_mon_5_tt:0 "君主派的影响力：§R-5§!"
 krcw_sov2_4_t:0 "病床边的神父"
 krcw_sov2_4_d:0 "牧首派自己的忏悔神父每天到病房为萨文科夫读经。宫中的旧人传出话来，说执政者领了圣餐，还问起了罗曼诺夫家族。没有人能证实这句话，但莫斯科的几家报纸已经登了出来。"
 krcw_sov2_4.a:0 "让牧首在国家会议上讲话"
 krcw_sov2_4.b:0 "不许教士再进病房"
 krcw_sov2_5_t:0 "保卫局的档案"
 krcw_sov2_5_d0:0 "萨文科夫死后第五天，保卫局局长送来两份名单：冯夏茨基的退伍军人联合会在各省的骨干，和在救主大教堂聚会的君主派。总参谋部的副官从中风那天起就掌管着办公厅，他们先把档案送到了华西列夫斯基手里。国家会议要在三十天内选举，名单上的人都打算在这三十天里有所动作。"
 krcw_sov2_5_d1:0 "萨文科夫死后第五天，保卫局局长送来两份名单：冯夏茨基的退伍军人联合会在各省的骨干，和在救主大教堂聚会的君主派。涅克拉索夫的办公厅从中风那天起就在代行公务，档案按规矩先送到了议长桌上。国家会议要在三十天内选举，名单上的人都打算在这三十天里有所动作。"
 krcw_sov2_5_d2:0 "萨文科夫死后第五天，保卫局局长送来两份名单：冯夏茨基的退伍军人联合会在各省的骨干，和在救主大教堂聚会的君主派。牧首的人从中风那天起就守在病房外，宫中旧人比国家会议更早知道档案里有什么。国家会议要在三十天内选举，名单上的人都打算在这三十天里有所动作。"
 krcw_sov2_5_d3:0 "萨文科夫死后第五天，保卫局局长送来两份名单：冯夏茨基的退伍军人联合会在各省的骨干，和在救主大教堂聚会的君主派。萨文科夫走得很突然，办公厅里没有人被授权接收这些档案。国家会议要在三十天内选举，名单上的人都打算在这三十天里有所动作。"
 krcw_sov2_5.a:0 "搜查退伍军人联合会"
 krcw_sov2_5.b:0 "由涅克拉索夫、华西列夫斯基和索罗金共同执政到选举"
 krcw_sov2_5.c:0 "把档案交给牧首，请他召集各界代表"
 krcw_sov2_drop_ext_15_tt:0 "极端派的影响力：§R-15§!"
 krcw_sov2_drop_ext_10_tt:0 "极端派的影响力：§R-10§!"
 krcw_sov_tree_bid_ext_10_tt:0 "极端派的影响力：§G+10§!"
 krcw_sov2_6_t:0 "搜查退伍军人联合会"
 krcw_sov2_6_d0:0 "宪兵在一夜之间搜查了十四个省的联合会分部，抓了四百多人，在图拉和萨马拉的仓库里起出了步枪和机枪。冯夏茨基本人不在名单上，他第二天在报上发表声明，说联合会从未打算推翻国家会议。各分部的骨干已经被押往叶尼塞河以东。"
 krcw_sov2_6_d1:0 "搜查在莫斯科和彼得格勒都遇到了抵抗。联合会的成员在工人区筑起路障，三个宪兵在维堡区被打死，冯夏茨基躲进了一处兵营，那里的军官拒绝交人。国家会议的选举还有二十天。"
 krcw_sov2_6.a:0 "公布查获的名单和武器清单"
 krcw_sov2_6.b:0 "名单留在保卫局"
 krcw_sov2_6.c:0 "调近卫师进城"
 krcw_sov2_6.d:0 "与冯夏茨基谈判"
 krcw_sov2_7_t:0 "临时执政小组"
 krcw_sov2_7_d0:0 "牧首召集的各界代表会议开了三天，最后同意由议长、总参谋长和索罗金组成临时执政小组，到选举为止。三人每天在克里姆林宫碰一次头，共同签署每一道命令。教会的代表坐在旁听席上，记录每一次表决。"
 krcw_sov2_7_d1:0 "涅克拉索夫、华西列夫斯基和索罗金每天在克里姆林宫碰一次头，共同签署每一道命令。第一个月里，三人在铁路运价和军饷上各让了一步。各部的公文又开始按时发出。"
 krcw_sov2_7_d2:0 "执政小组只维持了三个星期。华西列夫斯基因为军费削减的方案退出，回到了总参谋部大楼，从那以后军区的电报不再抄送克里姆林宫。涅克拉索夫和索罗金继续签字，但各军区司令部开始自己决定执行哪些命令。"
 krcw_sov2_7.a:0 "把小组的命令登在政府公报上"
 krcw_sov2_7.b:0 "让小组只管预算和铁路"
 krcw_sov2_7.c:0 "支持留下的人，由议长主持"
 krcw_sov2_7.d:0 "请华西列夫斯基回来，条件由他提"
 krcw_sov_tree_bid_ext_15_tt:0 "极端派的影响力：§G+15§!"
 krcw_sov2_8_t:0 "选举前的交易"
 krcw_sov2_8_d0:0 "退伍军人联合会的骨干已经在流放的路上，国家会议里属于冯夏茨基的票只剩下十几张。剩下的三派开始私下点票。按宪法，当选需要三分之二，任何一派都不够，必须有人和别人交换条件。"
 krcw_sov2_8_d1:0 "冯夏茨基仍躲在兵营里，他的人每天在工人区集会。国家会议的议员们开会要经过宪兵的岗哨。按宪法，当选需要三分之二，任何一派都不够，有的议员已经开始和联合会的人接触。"
 krcw_sov2_8_d2:0 "执政小组散了，总参谋部和克里姆林宫各发各的命令。国家会议要在这种情况下投票。按宪法，当选需要三分之二，每一派都在找能换来票的条件。"
 krcw_sov2_8_d3:0 "临时执政小组让国家运转了几个月，选举的日子也定了下来。按宪法，当选需要三分之二，任何一派都不够。各派的代表开始在克里姆林宫的走廊里谈条件。"
 krcw_sov2_8.a:0 "向总参谋部保证五年的国防预算"
 krcw_sov2_8.b:0 "与经济部和科学院结成选举同盟"
 krcw_sov2_8.c:0 "答应主教和钢铁大王们召开全俄缙绅会议"
 krcw_sov2_8.d:0 "让退伍军人联合会的人进入国家会议"
 krcw_sov2_9_t:0 "新政府的头一百天"
 krcw_sov2_9_d0:0 "华西列夫斯基的政府执政已经三个月。落选的各派没有接受结果：他们的报纸停刊又复刊，几个军区司令部拖延执行莫斯科的命令，国家会议里有人公开要求重新投票。新政府必须决定怎样对待这些人。"
 krcw_sov2_9_d1:0 "索罗金的政府执政已经三个月。落选的各派没有接受结果：他们的报纸停刊又复刊，几个军区司令部拖延执行莫斯科的命令，国家会议里有人公开要求重新投票。新政府必须决定怎样对待这些人。"
 krcw_sov2_9_d2:0 "皇帝的政府执政已经三个月。落选的各派没有接受结果：他们的报纸停刊又复刊，几个军区司令部拖延执行莫斯科的命令，国家会议里有人公开要求重新投票。新政府必须决定怎样对待这些人。"
 krcw_sov2_9_d3:0 "冯夏茨基的政府执政已经三个月。落选的各派没有接受结果：他们的报纸停刊又复刊，几个军区司令部拖延执行莫斯科的命令，国家会议里有人公开要求重新投票。新政府必须决定怎样对待这些人。"
 krcw_sov2_9_d4:0 "新政府上任三个月，各部的公文按时发出，落选的各派接受了结果。选举前许下的条件现在要兑现了。"
 krcw_sov2_9.a:0 "把领头的人流放到叶尼塞河以东"
 krcw_sov2_9.b:0 "给失败的一派几个部长职位"
 krcw_sov2_9.c:0 "履行选举前的承诺"
 krcw_sov_convene_the_electoral_session:0 "召开国家会议选举会议"
 krcw_sov_convene_the_electoral_session_desc:0 "各派的条件已经谈完，议长宣布国家会议的选举会议在下周召开。议员们按宪法以三分之二多数选出新的最高执政者，投票的结果就是各派此刻的实力。"
 krcw_sov_disband_the_veterans_leagues:0 "解散退伍军人联合会"
 krcw_sov_disband_the_veterans_leagues_desc:0 "搜查之后，联合会的各省分部已经没有领导人。内务部下令解散联合会，没收它的会所和印刷厂，会员名单交保卫局登记。冯夏茨基失去了他在街头的力量。"
 krcw_sov_the_guards_hold_moscow:0 "近卫师驻守莫斯科"
 krcw_sov_the_guards_hold_moscow_desc:0 "莫斯科的秩序要靠部队维持。两个近卫师在城内设立警备司令部，宵禁从晚上十点开始。总参谋部由此成为首都唯一说话算数的机构。"
 krcw_sov_the_directorate_charter:0 "临时执政小组章程"
 krcw_sov_the_directorate_charter_desc:0 "临时执政小组把自己的分工写成章程：议长管国家会议，总参谋长管军队，索罗金管预算。章程规定小组在选举后自动解散，这让各派都愿意签字。"
 krcw_sov2_stroke_tt:0 "最高执政者的病情将很快恶化。"
 krcw_sov_ukrainian_faculty:0 "基辅的乌克兰语学部"
 krcw_sov_ukrainian_faculty_desc:0 "基辅大学设立乌克兰语文学部，用本族语言教学。学生们很满意，内务部派人旁听每一堂历史课。"
 krcw_sov_ukrainian_land_council:0 "乌克兰土地会议"
 krcw_sov_ukrainian_land_council_desc:0 "基辅设立一个管理土地、学校和地方税的会议，由各县选出代表。莫斯科保留国防、外交、铁路和煤的调拨权。"
 krcw_sov_russified_ukraine:0 "乌克兰的俄罗斯化"
 krcw_sov_russified_ukraine_desc:0 "乌克兰语的报纸和学校被关闭，教学一律用俄语。顿巴斯的工厂运转如常，而基辅的大学里空了一半。"
 krcw_sov2_20_t:0 "基辅大学的请愿书"
 krcw_sov2_20_d:0 "基辅大学的教授和学生联名向国家会议请愿，要求设立一个乌克兰语文学部。请愿书措辞谦恭，只谈语言和文学，不谈政治。内务部的报告却指出，签名的三百人里有四十个是去年闹过事的。乌克兰有四千万人和俄罗斯一半的煤，怎样回答这封信不是一件小事。"
 krcw_sov2_20.a:0 "设立乌克兰语文学部"
 krcw_sov2_20.b:0 "关闭\"启蒙社\"，驱逐带头的教授"
 krcw_sov2_20.c:0 "把请愿书转给乌克兰总督处理"
 krcw_sov2_21_t:0 "学部的头一年"
 krcw_sov2_21_d0:0 "学部开办了一年，教授们守着谈语言不谈政治的约定。基辅的报纸登了几篇关于谢甫琴科的文章，内务部的旁听员报告说，课堂上没有出现政治内容。几个邻省也递来了同样的申请。"
 krcw_sov2_21_d1:0 "学部的学生办了一本文学杂志，第三期登了一篇谈一九三三年饥荒的小说。小说没有点名，但每个读者都明白写的是谁的政策。内务部要求查封，大学校长请求宽限。"
 krcw_sov2_21.a:0 "设立哈尔科夫和敖德萨分部"
 krcw_sov2_21.b:0 "就到此为止，不再扩大"
 krcw_sov2_21.c:0 "逮捕编辑，关闭学部"
 krcw_sov2_21.d:0 "容忍杂志，划定不可逾越的界限"
 krcw_sov2_22_t:0 "启蒙社关闭之后"
 krcw_sov2_22_d0:0 "启蒙社的会所被查封后，利沃夫和基辅的学生罢课，几个被开除的教授转入地下。内务部的报告说，加利西亚的边境又出现了国际资助的传单。关闭一所学部比预想的要贵。"
 krcw_sov2_22_d1:0 "启蒙社关闭后，基辅安静了下来。乌克兰语的报纸还剩两家，内容限于农业和体育。顿巴斯的产煤量没有受到影响，这是莫斯科真正关心的数字。"
 krcw_sov2_22.a:0 "增派宪兵，宣布戒严"
 krcw_sov2_22.b:0 "撤换乌克兰总督，缓和政策"
 krcw_sov2_22.c:0 "就这样，不再追究"
 krcw_sov2_23_t:0 "格鲁吉亚教会的请求"
 krcw_sov2_23_d:0 "第比利斯的格鲁吉亚教会请求恢复自主地位——它在旧帝国时代被并入俄罗斯教会，一直不满。牧首反对，说一个帝国不能有两个教会。可是高加索总督提醒莫斯科，格鲁吉亚教会的态度关系到巴库油田铁路沿线的安宁。"
 krcw_sov2_23.a:0 "恢复格鲁吉亚教会的自主地位"
 krcw_sov2_23.b:0 "维持教会统一，另给格鲁吉亚语弥撒"
 krcw_sov2_23.c:0 "拒绝，并把主教调往俄罗斯的修道院"
 krcw_sov2_24_t:0 "哥萨克还是土地会议"
 krcw_sov2_24_d0:0 "乌克兰被俄罗斯化之后，加利西亚边境仍然不安。莫斯科要选一种办法来守住乌克兰：靠哥萨克的马刀，还是靠一个本地人管得了本地人的会议。总督倾向于前者，经济部倾向于后者。"
 krcw_sov2_24_d1:0 "学部办成了，但光靠一个学部治不了四千万人。莫斯科要在两种更深的办法里选一种：恢复哥萨克军团的治安权，还是设立一个管土地和学校的乌克兰会议。前者便宜而可靠，后者稳定却削弱莫斯科的直辖。"
 krcw_sov2_24.a:0 "恢复库班与捷列克哥萨克军团的治安权"
 krcw_sov2_24.b:0 "设立乌克兰土地会议，交出地方税和学校"
 krcw_sov2_24.c:0 "什么都不设，维持总督直辖"
 krcw_sov2_25_t:0 "土地会议的第一次会议"
 krcw_sov2_25_d0:0 "乌克兰土地会议的头一次会议只讨论了学校和地方税，没有碰国防和铁路。代表们把一份预算案送到莫斯科，内务部检查后承认里面没有分裂的内容。顿巴斯的工人代表坐在前排，他们要的是工资，不是国旗。"
 krcw_sov2_25_d1:0 "土地会议的第一次会议就通过了一项决议，要求乌克兰语成为省内唯一的官方语言，还要求把征兵的乌克兰士兵留在本省服役。这超出了莫斯科交给它的权限。内务部长说，这正是他当初反对设立会议的理由。"
 krcw_sov2_25.a:0 "接受会议的学校和税收方案"
 krcw_sov2_25.b:0 "否决会议的预算，保留莫斯科的拨款权"
 krcw_sov2_25.c:0 "解散会议，恢复总督直辖"
 krcw_sov2_25.d:0 "划清会议的权限，但保留它"
 krcw_sov2_26_t:0 "顿河军团大会的答复"
 krcw_sov2_26_d0:0 "顿河军团大会在新切尔卡斯克开会，接受了莫斯科的委托。哥萨克巡逻队在第聂伯河两岸的村子之间来回，半年里加利西亚边境没有再出现传单。乌克兰的村民不喜欢他们，但也不敢惹他们。"
 krcw_sov2_26_d1:0 "总督直辖下，库班和顿河的军团自愿派出巡逻队协助宪兵。他们只听总督一个人的命令，总督对这个安排很满意。省里平静了下来，每个人都知道这份平静是借来的。"
 krcw_sov2_26_d2:0 "哥萨克巡逻队在波尔塔瓦省烧了一个村子，起因是一匹被偷的马。省报不敢登，消息却从基辅传到了利沃夫，又从利沃夫传到了巴黎的广播里。经济部长要求调查，顿河军团大会拒绝交人。"
 krcw_sov2_26.a:0 "感谢军团，把治安权延长五年"
 krcw_sov2_26.b:0 "收回治安权，只留骑兵编制"
 krcw_sov2_26.c:0 "为军团辩护，压下调查"
 krcw_sov2_27_t:0 "加利西亚边境的考验"
 krcw_sov2_27_d0:0 "国际资助的一支小队从加利西亚越境，想在基辅省发动起义。土地会议的县代表把他们的路线报告给了宪兵，十二个人在越境后第三天被捕。巴黎的广播说乌克兰人背叛了乌克兰，基辅的报纸登出了被捕者的供词。"
 krcw_sov2_27_d1:0 "国际资助的一支小队从加利西亚越境，想在基辅省发动起义。哥萨克巡逻队和宪兵在边境的林子里截住了他们，十二个人里活下来四个。村子里没有人出来帮他们，这是莫斯科最想知道的事。"
 krcw_sov2_27_d2:0 "国际资助的一支小队从加利西亚越境，在利沃夫以东的村子里找到了藏身处和向导。两个星期里他们炸了一座铁路桥、打死了一个县警察局长，然后消失在林子里。乌克兰问题又回到了国家会议的议程上。"
 krcw_sov2_27.a:0 "让土地会议去对付他们"
 krcw_sov2_27.b:0 "奖励边境的宪兵和哥萨克"
 krcw_sov2_27.c:0 "派三个师进入加利西亚"
 krcw_sov2_27.d:0 "重开谈判，拿出一份让步的清单"
 krcw_sov_the_kiev_faculties:0 "扩建乌克兰语学校"
 krcw_sov_the_kiev_faculties_desc:0 "在基辅学部的基础上，乌克兰各县的小学可以用本族语言教到四年级，中学开设乌克兰文学课。教师由土地会议或地方自治会聘请，教科书要经过内务部审定。"
 krcw_sov_the_cossack_frontier_line:0 "哥萨克边防线"
 krcw_sov_the_cossack_frontier_line_desc:0 "库班和顿河的哥萨克在加利西亚边境沿线建立屯垦村，每村出一个骑兵连巡逻边界。他们分到的土地来自被迁走的乌克兰村子，这一点乌克兰人不会忘记。"
 krcw_sov_the_georgian_exarchate:0 "承认姆茨赫塔的牧首"
 krcw_sov_the_georgian_exarchate_desc:0 "格鲁吉亚教会选出自己的大公教长，在姆茨赫塔登座。莫斯科牧首没有出席，但派来了贺信。第比利斯的神父们在礼拜中为最高执政者祈祷，巴库铁路沿线的村子安静了。"
 krcw_sov2_40_t:0 "乌拉尔机器托拉斯的账目"
 krcw_sov2_40_d:0 "一名国家审计员报告，乌拉尔机器托拉斯连续三年少报利润，把差额投入了自己的供应商和一家在叶卡捷琳堡的银行。托拉斯的董事大多是内战时期就跟着政权的乌拉尔钢铁大王。按契约，国家只收股息；按法律，少报利润是犯罪。"
 krcw_sov2_40.a:0 "在仲裁法庭起诉托拉斯"
 krcw_sov2_40.b:0 "私下和钢铁大王们谈一笔补缴"
 krcw_sov2_40.c:0 "逮捕董事会，由国家接管托拉斯"
 krcw_sov2_41_t:0 "仲裁法庭的判决"
 krcw_sov2_41_d0:0 "仲裁法庭开了六周，判托拉斯败诉，责令补缴三年少报的利润，并撤换财务董事。乌拉尔机器托拉斯接受了判决——这件事本身比判决更重要。几家别的托拉斯连夜检查了自己的账目。"
 krcw_sov2_41_d1:0 "托拉斯请的律师找到了一个漏洞：契约写的是国家只收股息，没写托拉斯必须公开全部账目。仲裁法庭以二比一判托拉斯胜诉。钢铁大王们在叶卡捷琳堡设宴庆祝，而经济部长把判决书摔在了桌上。"
 krcw_sov2_41.a:0 "按判决设立国家工业委员会"
 krcw_sov2_41.b:0 "接受判决，但不扩大审计"
 krcw_sov2_41.c:0 "上诉，把案子提交国家会议"
 krcw_sov2_41.d:0 "接受败诉，但保住仲裁法庭"
 krcw_sov2_42_t:0 "与钢铁大王们的交易"
 krcw_sov2_42_d0:0 "钢铁大王们同意补缴，而且主动提出出资在车里雅宾斯克建一座消费品厂，作为\"对国家的敬意\"。经济部的技术派认为这是收买，牧首派认为这是忠诚。两种说法都对。"
 krcw_sov2_42_d1:0 "钢铁大王们在叶卡捷琳堡开了一次会，然后通知莫斯科：契约没有规定他们必须补缴。他们提醒执政者，乌拉尔的坦克和拖拉机都出自他们的工厂。这既是辩解，也是威胁。"
 krcw_sov2_42.a:0 "接受他们出资建一座消费品厂"
 krcw_sov2_42.b:0 "拿了补缴款，再派审计员"
 krcw_sov2_42.c:0 "他们拒绝补缴，改为起诉"
 krcw_sov2_42.d:0 "威胁取消他们的国家订单"
 krcw_sov2_drop_mon_10_tt:0 "君主派的影响力：§R-10§!"
 krcw_sov2_43_t:0 "接管之后"
 krcw_sov2_43_d:0 "国家逮捕了乌拉尔机器托拉斯的董事会，由经济部直接接管工厂。乌拉尔的其他钢铁大王们看着这件事，有的连夜去了莫斯科表忠心，有的把资金转走了。接管一家工厂容易，让它继续按时交货难。"
 krcw_sov2_43.a:0 "设立国家工业委员会，接管所有大托拉斯"
 krcw_sov2_43.b:0 "只接管这一家，安抚其余的大王"
 krcw_sov2_44_t:0 "总参谋部的订单"
 krcw_sov2_44_d0:0 "总参谋部要在一年内把近卫坦克集团军从三个扩到五个，下塔吉尔和车里雅宾斯克的坦克订单因此翻倍。可是同一批工厂刚接下消费品计划的任务。两份计划用的是同样的钢材、同样的车皮和同样的工人。有人必须等。"
 krcw_sov2_44_d1:0 "总参谋部下了一批坦克订单，托拉斯按合同在期限内交了货，没有挤占消费品计划。新的生产制度运转良好，钢材的分配第一次有了可以查对的账目。军队和经济部都挑不出毛病。"
 krcw_sov2_44.a:0 "下令三班制生产，推迟消费品计划"
 krcw_sov2_44.b:0 "坚持合同，让军队等"
 krcw_sov2_44.c:0 "两边都答应，自己补差额"
 krcw_sov2_45_t:0 "一个工业制度"
 krcw_sov2_45_d0:0 "两年下来，乌拉尔的工厂既交了坦克，也交了冰箱，账目清楚，交货准时。经济部提议把这套\"合同加审计\"的制度推广到顿巴斯和西伯利亚的大工业。军队不再反对，因为它的订单也按时到了。"
 krcw_sov2_45_d1:0 "国家工业委员会管得太细，叶卡捷琳堡的工厂每一笔采购都要等莫斯科批复，交货反而更慢了。钢铁大王们说，这正是他们警告过的结果。委员会的领导把问题归咎于旧董事会留下的烂摊子。"
 krcw_sov2_45.a:0 "把这套制度推广到全国的大工业"
 krcw_sov2_45.b:0 "就到乌拉尔为止"
 krcw_sov2_45.c:0 "放松管制，恢复托拉斯的自主权"
 krcw_sov2_45.d:0 "换掉委员会的领导，收紧管制"
 krcw_sov2_46_t:0 "一套能用的工业"
 krcw_sov2_46_d0:0 "乌拉尔机器托拉斯的案子最终确立了一个原则：在萨文科夫的俄罗斯，托拉斯要向国家公开账目，国家要按合同下单。国家工业委员会成了部与托拉斯之间的常设机构。钢铁大王们失去了董事会，但保住了股份和工厂。"
 krcw_sov2_46_d1:0 "乌拉尔的托拉斯合并成一个辛迪加，自行安排生产和利润，国家只拿优先股的股息和一纸合同。钢铁大王们赢了这一局：国家证明了自己管不了那么细，于是把细节还给了他们。"
 krcw_sov2_46_d2:0 "乌拉尔机器托拉斯的案子过去两年了。账目的争端平息下来，工厂按时交货，国家和托拉斯都学会了和对方打交道。没有人再提起当初那笔少报的利润。"
 krcw_sov2_46.a:0 "（结束）确立这套制度"
 krcw_sov_the_state_industrial_committee:0 "国家工业委员会"
 krcw_sov_the_state_industrial_committee_desc:0 "一个常设的国家工业委员会设在莫斯科，有权任免各大托拉斯的总经理、审核生产计划、裁定供货纠纷。乌拉尔的钢铁大王们保住了股份，失去了对工厂的直接控制。"
 krcw_sov_the_ural_syndicate:0 "乌拉尔辛迪加"
 krcw_sov_the_ural_syndicate_desc:0 "乌拉尔的钢铁、机器和车辆托拉斯合并成一个辛迪加，统一接受国家订单，自行安排生产和分配利润。它的效率很高，但莫斯科对它的内部一无所知。"
 krcw_sov_arm_the_tank_armies_first:0 "坦克集团军优先供货"
 krcw_sov_arm_the_tank_armies_first_desc:0 "工业制度确立之后，总参谋部的订单在钢材和车皮的分配上排在最前面。下塔吉尔和车里雅宾斯克转入三班制，消费品计划相应推迟。军队满意了，百货商店的货架空了一些。"
 krcw_ita2_gorizia_volunteers:0 "戈里齐亚志愿连"
 krcw_ita2_gorizia_volunteers_desc:0 "帕里的老游击队员在弗留利和伊松佐河一带组织了志愿连，武器来自军队的仓库。他们守在边界上，也随时可能在边界上惹出事来。"
 krcw_ita2_southern_fund_idea:0 "南方发展基金"
 krcw_ita2_southern_fund_idea_desc:0 "基金为南方修水渠、道路和农产品加工厂，钱由北方的产业联合会按比例分摊。都灵和米兰的工人抱怨负担，南方的村庄第一次通上了电。"
 krcw_ita2_1_t:0 "书记处的第二份决议"
 krcw_ita2_1_d0:0 "巴黎大会通过了有约束力的章程，书记处随即发来第二份关于的里雅斯特的决议：意大利须在三个月内把的里雅斯特和伊斯特拉问题提交仲裁，否则将暂停表决权。这一次，不执行是有后果的。"
 krcw_ita2_1_d1:0 "巴黎大会通过了公约，书记处再次建议意大利把的里雅斯特和伊斯特拉问题提交日内瓦仲裁。按公约，这份决议对罗马没有约束力，接受与否由意大利自己决定。"
 krcw_ita2_1_d2:0 "书记处再次要求意大利把的里雅斯特和伊斯特拉问题提交仲裁。马泰奥蒂主张接受，理由是一切都应当通过程序解决；帕里主张拒绝，理由是伊斯特拉的意大利人不该等日内瓦的判决。"
 krcw_ita2_1.a:0 "接受仲裁"
 krcw_ita2_1.b:0 "“决议我们已经收到并研究了”"
 krcw_ita2_2_t:0 "日内瓦的听证"
 krcw_ita2_2_d0:0 "仲裁庭在日内瓦开庭，三名法官分别来自不列颠、伊比利亚和加拿大。南斯拉夫军政府派来了代表，但只讨论港口的使用，拒绝讨论领土。意大利代表团要决定把重点放在哪里。"
 krcw_ita2_2_d1:0 "仲裁庭在日内瓦开庭，南斯拉夫军政府拒绝出席，说一个国际的法庭无权审理协定成员的边界。法庭决定缺席审理，但它的裁决只能约束意大利一方。意大利代表团要决定把重点放在哪里。"
 krcw_ita2_2.a:0 "提交伊斯特拉的请愿书"
 krcw_ita2_2.b:0 "提出把的里雅斯特办成自由港"
 krcw_ita2_3_t:0 "戈里齐亚的老兵"
 krcw_ita2_3_d:0 "罗马拒绝仲裁的消息传到弗留利，帕里的老游击队员在戈里齐亚组织了志愿连，要求政府发给他们武器。军队的将领不愿意让一支不归他们指挥的部队守边界。"
 krcw_ita2_3.a:0 "把志愿连编入正规军"
 krcw_ita2_3.b:0 "让他们作为民兵自行训练"
 krcw_ita2_4_t:0 "的里雅斯特的防线"
 krcw_ita2_4_d0:0 "拒绝仲裁以后，罗马只剩下一个办法：在伊松佐河一线守住现状。志愿连已经编入正规军，总参谋部要求把这一段边界交给军队管理。"
 krcw_ita2_4_d1:0 "南斯拉夫缺席了听证，仲裁庭的裁决还要等几个月。贝尔格莱德在边界另一侧增派了巡逻队。政府要决定在等裁决的这段时间里，的里雅斯特由谁来管。"
 krcw_ita2_4_d2:0 "南斯拉夫的代表出席了听证，港口使用的问题谈出了一些眉目，领土问题仍然悬着。政府要决定在等裁决的这段时间里，的里雅斯特由谁来管。"
 krcw_ita2_4.a:0 "等仲裁庭的裁决，由文官管理的里雅斯特"
 krcw_ita2_4.b:0 "把伊松佐河一线交给军队"
 krcw_ita2_5_t:0 "伊松佐河上的事件"
 krcw_ita2_5_d0:0 "一支志愿连在夜里越过了伊松佐河的一处浅滩，和南斯拉夫的巡逻队交了火。贝尔格莱德第二天就向边界增派了一个师，莫斯科的电台说这是国际在巴尔干挑起的战争。"
 krcw_ita2_5_d1:0 "一支志愿连在夜里越过了伊松佐河的一处浅滩，和南斯拉夫的巡逻队交了火。贝尔格莱德提出了正式抗议，但没有调动部队。"
 krcw_ita2_5.a:0 "志愿连后撤五公里"
 krcw_ita2_5.b:0 "调阿尔卑斯师上前线"
 krcw_ita2_party_partisan:0 "意大利劳动总联合会（游击队派）"
 krcw_ita2_party_partisan_long:0 "意大利劳动总联合会（游击队派）"
 krcw_ita2_party_procedure:0 "工厂委员会联合会"
 krcw_ita2_party_procedure_long:0 "意大利工厂委员会联合会"
 krcw_ita2_6_t:0 "共和国代表大会"
 krcw_ita2_6_d0:0 "伊松佐河的事件以后，共和国代表大会提前召开。帕里的支持者在军队和弗留利的联合会里，他们要求由帕里组织一个能守住边界的政府；迪·维托里奥的工会机关希望一切照旧。"
 krcw_ita2_6_d1:0 "的里雅斯特的事情交给日内瓦以后，共和国代表大会召开例会。马泰奥蒂的支持者认为这证明了程序的价值，要求由他组织政府；迪·维托里奥的工会机关希望一切照旧。"
 krcw_ita2_6.a:0 "帕里组织政府"
 krcw_ita2_6.b:0 "马泰奥蒂组织政府"
 krcw_ita2_6.c:0 "迪·维托里奥留任"
 krcw_ita2_7_t:0 "罗马提议的里雅斯特自由港"
 krcw_ita2_7_d:0 "意大利政府向书记处提议：把的里雅斯特办成国际的自由港，向南斯拉夫的船只开放，关税由一个联合委员会征收。罗马希望巴黎在书记处里支持这份提议。"
 krcw_ita2_7.a:0 "在书记处支持罗马"
 krcw_ita2_7.b:0 "交给仲裁庭决定"
 krcw_ita2_8_t:0 "巴黎的答复"
 krcw_ita2_8_d0:0 "巴黎在书记处支持了自由港的提议，伊比利亚和不列颠也投了赞成票。的里雅斯特的港口委员会下个月成立，第一批南斯拉夫商船已经在打听停靠的手续。"
 krcw_ita2_8_d1:0 "巴黎表示自由港的提议应当由仲裁庭一并裁决，书记处不单独表决。这意味着的里雅斯特还要再等几个月。"
 krcw_ita2_8.a:0 "照此办理"
 krcw_ita2_8.b:0 "向书记处提出抗议"
 krcw_ita2_geneva_petitions:0 "向日内瓦提交伊斯特拉请愿书"
 krcw_ita2_geneva_petitions_desc:0 "政府收集了伊斯特拉各镇意大利人的请愿书，由马泰奥蒂带到日内瓦仲裁庭。请愿书要求举行公民投票，签名的人里有不少是被南斯拉夫警察登记过的。"
 krcw_ita2_isonzo_divisions:0 "把阿尔卑斯师部署到伊松佐河"
 krcw_ita2_isonzo_divisions_desc:0 "两个阿尔卑斯师移防伊松佐河一线，在戈里齐亚和蒙法尔科内之间修筑野战工事。总参谋部说这是防御部署，贝尔格莱德不这么看。"
 krcw_ita2_trieste_free_port:0 "提议的里雅斯特自由港"
 krcw_ita2_trieste_free_port_desc:0 "政府向书记处提议把的里雅斯特办成国际的自由港，向南斯拉夫船只开放，关税由联合委员会征收。提议需要巴黎在书记处里的支持。"
 krcw_ita2_arm_gorizia:0 "武装戈里齐亚志愿连"
 krcw_ita2_arm_gorizia_desc:0 "军队把仓库里的步枪和机枪发给戈里齐亚的志愿连，让他们在伊松佐河沿岸巡逻。帕里亲自去检阅了第一批连队。"
 krcw_ita2_southern_land_conference:0 "召开南方土地会议"
 krcw_ita2_southern_land_conference_desc:0 "一九二〇年代没收的大庄园在卡拉布里亚、普利亚和西西里仍由原来的管事经营，名义上是国营农场，雇工的工资和从前差不多。农业工人联合会要求政府开会解决这件事，迪·维托里奥本人就是切里尼奥拉的雇工出身。"
 krcw_ita2_agrarian_law:0 "起草土地法"
 krcw_ita2_agrarian_law_desc:0 "土地会议的结论交给代表大会起草成法律。法律要回答一个问题：庄园的土地交给谁，以什么形式经营。"
 krcw_ita2_collective_farms:0 "成立集体农场联合会"
 krcw_ita2_collective_farms_desc:0 "庄园的土地整块交给雇工联盟，组成集体农场，由农业工人联合会统一经营。教区的农民不加入，他们的小块地维持原状。"
 krcw_ita2_peasant_cooperatives:0 "颁布农民合作社章程"
 krcw_ita2_peasant_cooperatives_desc:0 "庄园的土地分成家庭份地，分到地的人自愿组成合作社，共用机器和仓库。教区的合作社按同一章程登记，迪·维托里奥的联合会和格隆基的天主教工会共同管理。"
 krcw_ita2_machine_stations:0 "设立农机站"
 krcw_ita2_machine_stations_desc:0 "每个区设一座农机站，拖拉机和收割机从都灵调来，由集体农场按耕地面积轮流使用。"
 krcw_ita2_rural_credit:0 "开办农村信贷社"
 krcw_ita2_rural_credit_desc:0 "合作社联合开办信贷社，向份地农民放种子和农机贷款，利率由社员大会决定。"
 krcw_ita2_southern_fund:0 "设立南方发展基金"
 krcw_ita2_southern_fund_desc:0 "基金为南方修水渠、道路和加工厂，钱由北方的产业联合会按比例分摊。都灵和米兰抱怨负担，南方的村庄第一次通上了电。"
 krcw_ita2_10_t:0 "梅利萨的占地"
 krcw_ita2_10_d:0 "卡拉布里亚梅利萨的雇工在农业工人联合会的组织下占领了一处庄园，自己丈量了土地。附近几个村的天主教农民协会也在占地，但他们要求按家庭分成小块。政府要决定先和哪一方谈。"
 krcw_ita2_10.a:0 "和雇工联盟谈"
 krcw_ita2_10.b:0 "请格隆基去和教区谈"
 krcw_ita2_11_t:0 "农业工人联合会的方案"
 krcw_ita2_11_d:0 "农业工人联合会提出方案：庄园整块交给雇工联盟，组成集体农场。联合会里也有人主张把一部分土地分给家庭，让教区的农民愿意加入。"
 krcw_ita2_11.a:0 "整块交给集体农场"
 krcw_ita2_11.b:0 "一部分分给家庭"
 krcw_ita2_12_t:0 "格隆基的条件"
 krcw_ita2_12_d:0 "格隆基和南方的主教谈了两个星期，带回一个条件：教区的合作社可以加入土地改革，但教会的学校和堂区的田产不动。他说，南方的农民听神父的，神父听他的。"
 krcw_ita2_12.a:0 "接受条件"
 krcw_ita2_12.b:0 "堂区田产也要分"
 krcw_ita2_13_t:0 "西西里的庄园护卫"
 krcw_ita2_13_d:0 "西西里的几处庄园，原来的管事雇了武装护卫，向占地的雇工开了枪。巴勒莫的联合会要求政府派人，否则雇工联盟要自己武装起来。"
 krcw_ita2_13.a:0 "派联邦民兵去西西里"
 krcw_ita2_13.b:0 "把武器发给雇工联盟"
 krcw_ita2_14_t:0 "土地委员会由谁主持"
 krcw_ita2_14_d:0 "分地的办法谈妥以后，还要成立一个土地委员会负责丈量和登记。格隆基希望主持，因为教区的农民信任他；加布里奥蒂希望主持，因为他能让登记按时完成。"
 krcw_ita2_14.a:0 "格隆基主持"
 krcw_ita2_14.b:0 "加布里奥蒂主持"
 krcw_ita2_15_t:0 "土地法的表决"
 krcw_ita2_15_d0:0 "土地法提交表决时，西西里的雇工联盟已经有了自己的武器，巴勒莫的联合会说法律只是把既成事实写下来。北方的代表担心南方出现一支不归任何人指挥的武装。"
 krcw_ita2_15_d1:0 "土地法按和主教们谈妥的条件起草，教会的学校和堂区田产不在分配之列。天主教工会的代表第一次在代表大会上投了赞成票。"
 krcw_ita2_15_d2:0 "土地法提交代表大会表决。法律的形式由土地会议以来的谈判决定，代表们要投的是已经谈妥的方案。"
 krcw_ita2_15.a:0 "通过集体农场法"
 krcw_ita2_15.b:0 "通过农民合作社法"
 krcw_ita2_16_t:0 "新土地上的第一季收成"
 krcw_ita2_16_d0:0 "新土地上的第一季收成比庄园时期好，普利亚的小麦和卡拉布里亚的橄榄都超过了往年。农民第一次自己决定把多少粮食卖给城里。"
 krcw_ita2_16_d1:0 "第一季收成不好。春天的旱灾加上新农场的混乱，普利亚的小麦比往年少了一截。北方的报纸说土地改革失败了，南方的联合会说一季收成说明不了什么。"
 krcw_ita2_16.a:0 "照常交售"
 krcw_ita2_16.b:0 "从北方调粮补贴南方"
 krcw_ita2_17_t:0 "加布里奥蒂的南方计划"
 krcw_ita2_17_d:0 "加布里奥蒂提出一份南方发展计划：水渠、道路和农产品加工厂，钱由北方的产业联合会按比例分摊。剩下的问题是基金由谁管理。"
 krcw_ita2_17.a:0 "由全国产业联合会管理"
 krcw_ita2_17.b:0 "交给南方的市镇公社"
 krcw_aus_tree:0 "krcw_aus_tree"
 krcw_aus_sov_weak_tt:0 "俄国陷入困境：世界大战已经爆发，或莫斯科协定危机超过60，或萨文科夫死后继承尚未结束"
 krcw_wgr_good_neighbour:0 "好邻居"
 AUS_krcw_renner:0 "卡尔·伦纳"
 AUS_krcw_klahr:0 "阿尔弗雷德·克拉尔"
 ADR_krcw_miklas:0 "威廉·米克拉斯"
 ADR_krcw_miklas_desc:0 "基督教社会党的老人，一九二八年起做过奥地利的联邦总统。俄国人需要一个不是社会主义者、又在维也纳有名望的奥地利人，他答应了。"
 krcw_aus_divided_country:0 "分裂的奥地利"
 krcw_aus_divided_country_desc:0 "奥地利的首都在宪法里是维也纳，政府却在萨尔茨堡的州议会大楼里办公。恩斯河对岸就是俄国人的哨所，从林茨到维也纳的火车每天只开一班，要查两次证件。"
 krcw_aus_salzburg_capital:0 "萨尔茨堡的共和国"
 krcw_aus_salzburg_capital_desc:0 "共和国不再等维也纳。萨尔茨堡有了自己的部委、议会和大学，宪法里的维也纳仍然是首都，预算里的钱花在西部六个州。"
 krcw_aus_council_republic:0 "工人委员会共和国"
 krcw_aus_council_republic_desc:0 "工厂、矿山和村庄的委员会选出代表组成国民委员会，部长们向它负责。基督教社会党抵制委员会的选举，蒂罗尔的农民说这是城里人的政府。"
 krcw_aus_the_salzburg_republic:0 "宣告萨尔茨堡共和国"
 krcw_aus_the_salzburg_republic_desc:0 "一九四五年春，西部六个州的州议会在萨尔茨堡宣布成立奥地利社会主义共和国。宪法写明首都是维也纳，政府暂时设在萨尔茨堡的州议会大楼里。巴黎第一个承认了它。"
 krcw_aus_the_achensee_station:0 "扩建阿亨湖电站"
 krcw_aus_the_achensee_station_desc:0 "蒂罗尔的阿亨湖电站一九二七年发电，是阿尔卑斯山里最早的大电站之一。扩建以后，它可以供应因斯布鲁克和林茨的工厂，共和国少从巴伐利亚买煤。"
 krcw_aus_the_linz_works:0 "把林茨钢铁厂收归国营"
 krcw_aus_the_linz_works_desc:0 "林茨钢铁厂是大战时为军需扩建的，战后一直由工人委员会看管。共和国把它变成第一家国营企业，委员会在董事会里占一半席位。"
 krcw_aus_the_ranshofen_aluminium:0 "在兰斯霍芬建铝厂"
 krcw_aus_the_ranshofen_aluminium_desc:0 "上奥地利因河边的兰斯霍芬有便宜的水电。国际的飞机厂是这家铝厂的主要买主，铝锭用来换法国的机床。"
 krcw_aus_the_erzberg:0 "扩大埃尔茨山的开采"
 krcw_aus_the_erzberg_desc:0 "施蒂利亚的埃尔茨山铁矿供应多纳维茨和林茨的高炉。扩大露天开采要鲁尔造的矿山机械，共和国用木材和电力去换。"
 krcw_aus_the_paris_plan:0 "加入国际的联合计划"
 krcw_aus_the_paris_plan_desc:0 "萨尔茨堡派代表去巴黎的清算联盟。奥地利的钢、铝和木材进入国际的联合计划，换回机器和贷款，代价是计划处的人可以查共和国的账。"
 krcw_aus_hold_the_enns:0 "守住恩斯河"
 krcw_aus_hold_the_enns_desc:0 "恩斯河是共和国和俄国占领区的分界线，林茨就在河西岸。工兵在河岸和施蒂利亚的山口修碉堡，俄国人在对岸看着他们修。"
 krcw_aus_the_mountain_divisions:0 "组建山地师"
 krcw_aus_the_mountain_divisions_desc:0 "共和国的军队很小，参谋部把赌注押在山上：蒂罗尔和克恩滕的山地兵守住布伦纳山口和塞默灵山口，平原上的仗留给国际的装甲师去打。"
 krcw_aus_the_workers_militia:0 "组建工人民兵"
 krcw_aus_the_workers_militia_desc:0 "林茨、施泰尔和格拉茨的工厂各自组织民兵，周末操练，枪放在工厂的仓库里。参谋部嫌他们不守纪律，工会说他们才是共和国真正的军队。"
 krcw_aus_the_cabinet_in_salzburg:0 "萨尔茨堡的内阁"
 krcw_aus_the_cabinet_in_salzburg_desc:0 "阿德勒的临时政府里有三派人：他自己的社会主义联盟、伦纳的社会民主党人和克拉尔的革命社会主义者。四年没有选举，临时宪法快要到期，内阁要决定以后谁来执政。"
 krcw_aus_adlers_coalition:0 "维持阿德勒的联盟"
 krcw_aus_adlers_coalition_desc:0 "社会主义联盟靠一条原则执政：奥地利既不做德国的一个州，也不做俄国的附庸。阿德勒继续做主席，伦纳和克拉尔两派都留在内阁里，谁也压不倒谁。"
 krcw_aus_party_sdap:0 "社会民主党"
 krcw_aus_party_sdap_long:0 "奥地利社会民主工人党"
 krcw_aus_renners_grand_coalition:0 "伦纳的大联合政府"
 krcw_aus_renners_grand_coalition_desc:0 "伦纳把社会民主党人、基督教社会党人和农民联盟拉到一起，在制宪会议里拿到多数，自己出任总理。农民和天主教徒第一次在萨尔茨堡有了自己的部长，克拉尔的人说这是回到了旧帝国。"
 krcw_aus_party_councils:0 "工人委员会"
 krcw_aus_party_councils_long:0 "奥地利工人委员会联合会"
 krcw_aus_the_council_republic:0 "工人委员会共和国"
 krcw_aus_the_council_republic_desc:0 "林茨钢铁厂、蒂罗尔电站和施蒂利亚矿山的委员会推举克拉尔做国民委员会主席，权力从部长手里转到工厂和村庄的委员会。克拉尔说奥地利永远不会做德国的一个州，基督教社会党宣布抵制。"
 krcw_aus_not_councils_tt:0 "克拉尔的工人委员会没有执政"
 krcw_aus_the_vienna_question:0 "维也纳问题"
 krcw_aus_the_vienna_question_desc:0 "维也纳、下奥地利和布尔根兰在俄国人手里，维也纳的东区和西区是俄军的两个军管区。共和国的宪法说首都是维也纳，政府却在萨尔茨堡。共和国要决定：并入德国，接受分裂，还是夺回维也纳。"
 krcw_aus_a_german_austria:0 "一个德意志的奥地利"
 krcw_aus_a_german_austria_desc:0 "大德意志派说，奥地利一个人守不住恩斯河，也夺不回维也纳，回到德国才有出路。共和国同意和西德谈合并的条件：各州保留议会，奥地利的山地师留在阿尔卑斯山。"
 krcw_aus_salzburg_is_enough:0 "萨尔茨堡就够了"
 krcw_aus_salzburg_is_enough_desc:0 "共和国接受维也纳一时回不来的事实，把精力放在西部六个州。宪法里的首都仍然是维也纳，预算里的钱留在萨尔茨堡、林茨和格拉茨。"
 krcw_aus_vienna_will_be_free:0 "维也纳一定会自由"
 krcw_aus_vienna_will_be_free_desc:0 "共和国发誓夺回首都。它不会先开战，但要让维也纳的人知道萨尔茨堡没有忘记他们，也要让军队准备好，等俄国人顾不上奥地利的那一天。"
 krcw_aus_referendum_tt:0 "萨尔茨堡将决定是否就并入德国举行公投"
 krcw_aus_prepare_the_referendum:0 "准备合并公投"
 krcw_aus_prepare_the_referendum_desc:0 "各州议会同意：只要德国正式邀请，就举行一次合并公投，由国际派观察员监督，结果对双方都有约束力。"
 krcw_aus_build_the_capital:0 "在萨尔茨堡建设首都"
 krcw_aus_build_the_capital_desc:0 "政府从州议会大楼搬出来，萨尔茨堡建起了部委的办公楼和新的议会，主教府改作总统府。维也纳来的人说萨尔茨堡永远只是一座小城，萨尔茨堡人并不在意。"
 krcw_aus_underground_tt:0 "解锁决议§Y支持维也纳罢工§!（需要俄国陷入困境）"
 krcw_aus_the_vienna_underground:0 "维也纳的地下组织"
 krcw_aus_the_vienna_underground_desc:0 "维也纳工人区的社会主义者通过铁路和电车工会重新接上了联系。萨尔茨堡的电台每天晚上向维也纳广播，告诉他们共和国在等着。"
 krcw_aus_war_plan_tt:0 "解锁决议§Y越过恩斯河§!（需要俄国陷入困境，或维也纳罢工已被镇压）"
 krcw_aus_vienna_s_hour:0 "维也纳的时刻"
 krcw_aus_vienna_s_hour_desc:0 "参谋部写好了越过恩斯河、直取维也纳的计划：山地师守住施蒂利亚，两个步兵师沿多瑙河东进。计划只有一个前提，俄国人要顾不上奥地利。"
 krcw_aus_10_t:0 "合并公投"
 krcw_aus_10_d0:0 "各州议会已经同意举行合并公投。萨尔茨堡要定下日期，国际答应派观察员来。大德意志派在每个村子里贴满了海报，社会主义联盟的人说这是在拿共和国的存在下赌注。"
 krcw_aus_10_d1:0 "西德的共和国大会建议奥地利人投票决定是否并入德国。萨尔茨堡的政府要决定是否举行这次公投，国际答应派观察员来。大德意志派说这是奥地利人等了几十年的机会，社会主义联盟的人说这是在拿共和国的存在下赌注。"
 krcw_aus_10.a:0 "举行公投"
 krcw_aus_10.b:0 "不举行公投"
 krcw_aus_11_t:0 "投票结果"
 krcw_aus_11_d0:0 "萨尔茨堡、蒂罗尔、施蒂利亚、克恩滕、福拉尔贝格和上奥地利在国际观察员的监督下投了票，多数人选择并入德意志社会主义共和国。阿德勒说政府尊重结果，克拉尔的人在林茨游行反对。现在要等西德正式邀请。"
 krcw_aus_11_d1:0 "萨尔茨堡、蒂罗尔、施蒂利亚、克恩滕、福拉尔贝格和上奥地利在国际观察员的监督下投了票，多数人选择留在独立的奥地利共和国。大德意志派说投票是在俄国人的威胁下进行的，萨尔茨堡的政府宣布这个问题已经结束。"
 krcw_aus_11.a:0 "接受结果"
 krcw_aus_20_t:0 "德国的邀请"
 krcw_aus_20_d0:0 "德意志社会主义共和国按照公投的结果，正式邀请奥地利以一个州的身份加入。各州保留议会，奥地利的山地师留在阿尔卑斯山，维也纳的地位留给统一以后的德国去谈。萨尔茨堡的国民议会要做最后的表决。"
 krcw_aus_20_d1:0 "德意志社会主义共和国正式邀请奥地利以一个州的身份加入。各州保留议会，奥地利的山地师留在阿尔卑斯山，维也纳的地位留给统一以后的德国去谈。奥地利人没有为此投过票，萨尔茨堡的国民议会可以接受，也可以拒绝。"
 krcw_aus_20.a:0 "接受，加入德国"
 krcw_aus_20.b:0 "谢绝，奥地利留在国际之内"
 krcw_aus_21_t:0 "萨尔茨堡同意了"
 krcw_aus_21_d:0 "萨尔茨堡的国民议会以多数票接受了邀请，临时政府解散，奥地利的六个州成为共和国的州。维也纳、下奥地利和布尔根兰还在俄国人手里，现在它们是德国的问题了。"
 krcw_aus_21.a:0 "欢迎奥地利回家"
 krcw_aus_22_t:0 "奥地利并入德国"
 krcw_aus_22_d:0 "萨尔茨堡的国民议会投票接受了西德的邀请，奥地利西部六个州成为德意志社会主义共和国的州。莫斯科说这是德国人在扩张，巴黎说这是奥地利人自己的选择。维也纳仍在俄国人手里。"
 krcw_aus_22.a:0 "德意志又多了一块。"
 krcw_aus_22.b:0 "维也纳怎么办？"
 krcw_aus_30_t:0 "维也纳的罢工"
 krcw_aus_30_d:0 "维也纳的铁路工人和弗洛里茨多夫的工厂停工了，罢工委员会要求俄军撤出维也纳，让城市回到萨尔茨堡的共和国。萨尔茨堡的电台每小时报一次罢工的消息。维也纳的俄军司令请示怎么办。"
 krcw_aus_30.a:0 "把维也纳交还萨尔茨堡"
 krcw_aus_30.b:0 "镇压罢工"
 krcw_aus_31_t:0 "俄国人离开维也纳"
 krcw_aus_31_d:0 "俄军的卡车车队沿着多瑙河向东开走了。罢工委员会把市政厅交给萨尔茨堡派来的人，阿德勒的政府宣布迁回维也纳。宪法里的首都和地图上的首都终于是同一个地方了。"
 krcw_aus_31.a:0 "首都回到维也纳"
 krcw_aus_32_t:0 "罢工被镇压了"
 krcw_aus_32_d:0 "俄军的装甲车开进了弗洛里茨多夫，罢工委员会的人被捕，几百人越过恩斯河逃到林茨。萨尔茨堡的电台念出了被捕者的名字。参谋部说，下一次就不只是罢工了。"
 krcw_aus_32.a:0 "记住这些名字"
 krcw_aus_33_t:0 "维也纳回到奥地利"
 krcw_aus_33_d:0 "俄军撤出了维也纳、下奥地利和布尔根兰，奥地利社会主义共和国的政府从萨尔茨堡迁回首都。莫斯科说这是为了缓和，巴黎说这证明了协定守不住它的边界。"
 krcw_aus_33.a:0 "维也纳是奥地利的。"
 krcw_aus_33.b:0 "一次撤退，不是失败。"
 krcw_aus_40_t:0 "维也纳的联邦国"
 krcw_aus_40_d:0 "俄国人在维也纳宣布成立奥地利联邦国，基督教社会党的老人威廉·米克拉斯出任总理，俄军以盟军的身份留驻。萨尔茨堡称它为傀儡，维也纳说萨尔茨堡才是巴黎的傀儡。现在有两个奥地利了。"
 krcw_aus_40.a:0 "那不是奥地利。"
 krcw_aus_40.b:0 "维也纳有了自己的政府。"
 krcw_aus_cat:0 "维也纳问题"
 krcw_aus_cat_desc:0 "维也纳、下奥地利和布尔根兰在俄国人手里，萨尔茨堡的宪法写着首都是维也纳。"
 krcw_aus_support_the_strike:0 "支持维也纳罢工"
 krcw_aus_support_the_strike_desc:0 "维也纳的铁路和电车工会准备好了。萨尔茨堡送去钱、电台和传单，罢工委员会要求俄军撤出维也纳。俄国人会让步，还是开进装甲车，要看莫斯科自己的麻烦有多大。"
 krcw_aus_war_tt:0 "§R这是对莫斯科协定的进攻，协定的盟国会参战，第三国际也可能被卷进来。§!"
 krcw_aus_cross_the_enns:0 "越过恩斯河"
 krcw_aus_cross_the_enns_desc:0 "山地师守住施蒂利亚，两个步兵师沿多瑙河向维也纳推进。这一仗一旦打响，就是一个国际成员向莫斯科协定开战。"
 krcw_adr_party_cs:0 "基督教社会党"
 krcw_adr_party_cs_long:0 "基督教社会党"
 krcw_aus_release_east_austria:0 "在维也纳成立奥地利联邦国"
 krcw_aus_release_east_austria_desc:0 "萨尔茨堡说自己代表整个奥地利。俄国可以在维也纳另立一个奥地利：由基督教社会党的米克拉斯出任总理，俄军以盟军的身份留下。这样维也纳就不再是俄国占着的地方，而是一个协定的成员国。"
