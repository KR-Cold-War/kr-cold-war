l_simp_chinese:
# krcw: years paced
 krcw_fra_clearing_union:0 "巴黎清算联盟"
 krcw_fra_clearing_union_desc:0 "它不是银行，也不是金本位。各国工团联合会把彼此的账记在巴黎的一本总账上，用劳动时间与实物配额结算差额，赤字国不必紧缩，盈余国不能囤积。凯恩斯读过它的章程后说：“这是我在别处提过、却无人肯听的那个方案。”"
 krcw_fra_transnational_federations:0 "跨国产业联合会"
 krcw_fra_transnational_federations_desc:0 "洛林的炼钢工与鲁尔的炼钢工同属一个联合会，开同一个代表大会，用同一套技术标准。国界还在地图上，但生产的组织已经跨过了它。"
 krcw_fra_cybernetic_planning:0 "控制论式协作计划"
 krcw_fra_cybernetic_planning_desc:0 "不是莫斯科的指令，也不是市场的盲目。全国的车间通过电报网络把产量、库存与短缺逐日报回；计算机构把它们汇成一张不断修正的平衡表，再送回车间讨论。计划第一次有了回路。"
 krcw_fra_participatory_budget:0 "参与式预算"
 krcw_fra_participatory_budget_desc:0 "每个市镇公社的年度预算先由街区大会分组审议，再交联合会汇总。争论冗长、效率可疑，但没有人再能说“那是巴黎决定的”。"
 krcw_fra_1871_programme:0 "“一八七一”计划"
 krcw_fra_1871_programme_desc:0 "以第一个公社的年份命名。名义上是高层大气研究，实际上是液体燃料火箭与轨道力学。图卢兹与哈马基尔的试验场上，工程师们在黑板上写下逃逸速度。"
 krcw_fra_atomic_commissariat:0 "原子能委员会"
 krcw_fra_atomic_commissariat_desc:0 "约里奥-居里的实验室从战时的地下室搬进了萨克雷的新园区。委员会的章程里写着“为了和平的用途”，但它的第一个任务是为公社造出原子弹。"
 krcw_fra_force_de_frappe:0 "公社的核威慑"
 krcw_fra_force_de_frappe_desc:0 "雷加内的沙漠上升起一朵蘑菇云，公社成为世界上第三个——按时间算是第二个——拥有原子弹的政权。总工会的机关报当天的社论标题是《我们不曾想要它》。"
 krcw_fra_africa_liberation:0 "解放而非殖民"
 krcw_fra_africa_liberation_desc:0 "公社继承了第三共和国的殖民地，这是革命最难堪的遗产。阿尔及尔的联合会代表大会上，决议写得很清楚：我们的任务是把这些土地交还给它们的劳动者，而不是换一面旗子继续统治。"
 krcw_fra_internationale_secretariat:0 "国际书记处改组"
 krcw_fra_internationale_secretariat_desc:0 "旧的书记处是法国人的书记处。新章程给南京、伦敦、罗马和纽约同等的席位与否决权——巴黎放弃了一部分权力，换来的是一个真正能开会的国际。"
 krcw_fra_second_commune_pressure:0 "基层的不满"
 krcw_fra_second_commune_pressure_desc:0 "大学里的青年、雷诺的年轻工人、殖民地的学生——他们不反对革命，他们说革命被办公室偷走了。墙上的标语写着：“一八七一年的人不需要许可证。”"
 krcw_fra_charter_of_labour:0 "新劳动宪章"
 krcw_fra_charter_of_labour_desc:0 "官僚化不是用清洗解决的，是用章程解决的。新宪章规定联合会干部任期两年、可随时罢免，车间大会对生产计划有修正权。第二公社运动的要求被写成了法律。"
 krcw_fra_technocratic_turn:0 "技术官僚的转向"
 krcw_fra_technocratic_turn_desc:0 "计算机构赢了。生产的最优解由萨克雷的机器给出，车间大会保留“提出意见的权利”。效率史无前例，而联合会的会议室里越来越安静。"
 krcw_fra_red_army_reform:0 "联邦防卫军改革"
 krcw_fra_red_army_reform_desc:0 "革命军队的老问题：民兵的热情还是常备军的纪律？改革的答案是两者兼取——职业化的装甲与航空兵团，加上以工团为单位动员的地方防卫队。"
 krcw_fra_atlantic_fleet:0 "大西洋舰队"
 krcw_fra_atlantic_fleet_desc:0 "公社的海军不必与不列颠联邦竞争——它们属于同一个国际。法国的船坞造的是护航舰与潜艇：保住从纽约到上海的那条线。"
 krcw_eng_federal_congress:0 "联邦代表大会"
 krcw_eng_federal_congress_desc:0 "不列颠的工团主义走了议会化的路：全国工会代表大会既是立法机关也是产业管理机关，苏格兰、威尔士与英格兰各区的代表团各有其席。温特林厄姆称之为“有工资单的威斯敏斯特”。"
 krcw_eng_devolution:0 "苏格兰与威尔士自治"
 krcw_eng_devolution_desc:0 "爱丁堡与加迪夫有了自己的工团大会，煤与钢的地方联合会直接向它们负责。联合王国这个词早已废弃，联邦这个词现在才有了内容。"
 krcw_eng_commonwealth_liberation:0 "解放的英联邦"
 krcw_eng_commonwealth_liberation_desc:0 "帝国在一九二五年就散了，但伦敦与开罗、拉各斯、加尔各答的工会之间那些线还在。联邦把它们重新接起来——这一次是援助与技术，而不是总督与炮舰。"
 krcw_eng_nuclear_partnership:0 "英法核合作"
 krcw_eng_nuclear_partnership_desc:0 "哈韦尔与萨克雷共用一套图纸和一份铀矿配额。两国都不愿意单独承担成本，也都不愿意让对方单独拥有它。"
 krcw_eng_atlantic_lifeline:0 "大西洋生命线"
 krcw_eng_atlantic_lifeline_desc:0 "工团美洲的钢和加拿大的小麦要经过北大西洋。护航舰的数目不是海军部的荣誉问题，而是鲁瑟能否撑住阿巴拉契亚前线的问题。"
 krcw_eng_shop_stewards:0 "车间代表运动"
 krcw_eng_shop_stewards_desc:0 "克莱德河的车间代表是革命的老兵，也是官僚化最早的批评者。给他们生产委员会的正式席位，比给他们勋章有用。"
 krcw_sov_national_populism:0 "国家民粹主义"
 krcw_sov_national_populism_desc:0 "既不是沙皇的俄罗斯，也不是布尔什维克的俄罗斯。萨文科夫的国家把土地给了农民、把工厂交给了国家与私人合办的托拉斯、把政治留给了自己。它的合法性只有一条：它收复了布列斯特丢掉的一切。"
 krcw_sov_state_capitalism:0 "国家资本主义"
 krcw_sov_state_capitalism_desc:0 "乌拉尔的钢铁托拉斯有国家的股份、军队的订单和私人的经理。它效率不低，利润也不小，只是没人敢问那些利润去了哪里。"
 krcw_sov_moscow_accord_leadership:0 "莫斯科协定的领袖"
 krcw_sov_moscow_accord_leadership_desc:0 "从华沙到德里，从柏林到新奥尔良，协定的参谋部都设在莫斯科。它不是一个意识形态的国际——匈牙利的地主、普鲁士的将军和路易斯安那的煽动家没有共同的信条，只有共同的敌人。"
 krcw_sov_army_reform:0 "军队改革"
 krcw_sov_army_reform_desc:0 "一九四四年打到易北河的是一支靠人数和意志取胜的军队。华西列夫斯基的改革要把它变成一支靠火力、通信和汽车取胜的军队——这需要的钱比任何人预想的都多。"
 krcw_sov_atomic_project:0 "第一号工程"
 krcw_sov_atomic_project_desc:0 "法国人一九五〇年试爆之后，萨文科夫在国家会议上只说了一句话：“我们落后了，这是不能容忍的。”车里雅宾斯克的封闭城市从此在地图上没有名字。"
 krcw_sov_baltic_autonomy:0 "波罗的海自治章程"
 krcw_sov_baltic_autonomy_desc:0 "里加、塔林与考纳斯获得自己的地方议会、自己的语言学校和自己的警察——代价是承认俄罗斯的国防与外交主权。森林兄弟的枪声一年年稀疏下去。"
 krcw_sov_russification:0 "俄罗斯化政策"
 krcw_sov_russification_desc:0 "波罗的海的省份将成为俄罗斯的省份：官方语言、迁入的移民、改名的街道。国家保卫局的报告说抵抗正在减弱，报告的作者没有去过那里。"
 krcw_sov_finland_question:0 "芬兰问题"
 krcw_sov_finland_question_desc:0 "一九四四年吞并芬兰是萨文科夫最不划算的胜利。赫尔辛基的市政厅挂着俄罗斯的旗子，森林里却有一支永远打不完的游击队，每年吃掉三个师。"
 krcw_sov_finnish_grand_duchy:0 "芬兰大公国的复活"
 krcw_sov_finnish_grand_duchy_desc:0 "旧帝国曾经给芬兰一部宪法和一个议会，而它一百年没有造反。国家会议的决议翻出了这段档案：芬兰重新成为自治的大公国，只是没有大公。"
 krcw_sov_succession_crisis:0 "继承危机"
 krcw_sov_succession_crisis_desc:0 "宪法规定最高执政者由国家会议选举，而国家会议的三分之二是萨文科夫任命的。现在他死了，没有人知道那三分之二会投给谁——包括那三分之二自己。"
 krcw_sov_stability_faction:0 "稳定派"
 krcw_sov_stability_faction_desc:0 "军人集团的纲领只有一句话：不要冒险。华西列夫斯基不搞个人崇拜，不搞清洗，也不打算解放全世界——他要的是一支现代化的军队和一个还能运转二十年的国家。"
 krcw_sov_technocrats:0 "文官技术派"
 krcw_sov_technocrats_desc:0 "经济部与科学院的人认为俄罗斯输不起一场军备竞赛，只能靠生产率赢。他们的计划书写得漂亮，可是没有一个师的兵力。"
 krcw_sov_romanov_restoration:0 "罗曼诺夫复辟"
 krcw_sov_romanov_restoration_desc:0 "一九五三年，救主大教堂重新开光，一位大公在莫斯科加冕。教会与旧贵族欢呼，工厂与波罗的海的省份沉默——这是一条没有人预料到的、也没有人能收回的路。"
 krcw_sov_extremist_turn:0 "极端派的胜利"
 krcw_sov_extremist_turn_desc:0 "“萨文科夫太软弱了。”新的最高执政者这样评价他的恩师。国家保卫局扩编了三倍，乌拉尔以东建起了新的营地，广播里开始谈论“最后的清算”。"
 krcw_sov_space_programme:0 "远程火箭计划"
 krcw_sov_space_programme_desc:0 "丘拉塔姆的草原上，从德意志帝国工厂里拆来的图纸变成了越来越大的火箭。军方要的是洲际弹道导弹，科学院要的是卫星，预算表上两者写在同一行。"
 krcw_sov_peasant_bargain:0 "与农民的契约"
 krcw_sov_peasant_bargain_desc:0 "萨文科夫从来没有搞集体化，这是他与布尔什维克纲领最大的分歧，也是他政权最深的根。村社保有土地，国家按定额收走粮食。这谈不上公平，但没有饥荒。"
 krcw_sov_okhrana_expanded:0 "扩编的国家保卫局"
 krcw_sov_okhrana_expanded_desc:0 "继承危机期间，谁控制保卫局，谁就控制档案；谁控制档案，谁就控制国家会议里那三分之二的人。"
 krcw_ddr_kaisers_shadow:0 "复辟的阴影"
 krcw_ddr_kaisers_shadow_desc:0 "皇帝在斯德哥尔摩，他的支持者在波茨坦。施莱歇尔的将军府靠俄国的刺刀和民族阵线维持统治，而每逢危机，君主派都在低声说：只有皇帝回来，德国才能重新统一。"
 krcw_ddr_prussian_army:0 "普鲁士总参谋部"
 krcw_ddr_prussian_army_desc:0 "德国输掉了两场战争，丢掉了四分之三的国土，但施莱歇尔带走了总参谋部，曼施坦因还在，那套把有限的兵力用到极致的手艺还在。"
 krcw_ddr_berlin_question:0 "柏林问题"
 krcw_ddr_berlin_question_desc:0 "一座城市，两个政府，一条穿过街道中央的铁丝网。西柏林的电车开到边界就掉头，而东柏林的报纸每天宣布这种状态是暂时的。"
 krcw_ddr_own_road:0 "自己的道路"
 krcw_ddr_own_road_desc:0 "莫斯科很远，巴黎很近。年轻一代的帝国官员开始小心地讨论一个不可说的想法：也许德意志的利益既不在东方也不在西方，而在德意志。"
 krcw_ddr_reconstruction:0 "重建计划"
 krcw_ddr_reconstruction_desc:0 "莱比锡与德累斯顿的废墟上重新立起脚手架。俄罗斯的赔偿拆走了一半机床，剩下的一半由老工人手工复制出来。"
 krcw_ti_industrial_federation_member:0 "产业联合会成员"
 krcw_ti_industrial_federation_member_desc:0 "加入跨国联合会意味着交出一部分定价权与生产计划，换来的是技术图纸、配额与一个不会被封锁的市场。小国算过这笔账，都签了。"
 krcw_ti_local_commune_model:0 "本国的革命道路"
 krcw_ti_local_commune_model_desc:0 "哥本哈根不是巴黎，都柏林不是巴黎，阿姆斯特丹也不是。国际的章程承认这一点：每个联合会按自己的传统组织自己的公社。"
 krcw_ti_frontline_readiness:0 "前线戒备"
 krcw_ti_frontline_readiness_desc:0 "易北河、阿尔卑斯山口、波罗的海的入口——国际的小国正好坐在所有那些地方。它们的国防计划只有一条：撑住，直到巴黎的装甲师赶到。"
 krcw_ma_cordon_state:0 "防疫地带"
 krcw_ma_cordon_state_desc:0 "莫斯科称它们为“卫生带”，它们自己称之为“文明的边界”。华沙、布达佩斯与布加勒斯特的将军们知道真相：他们是缓冲区，缓冲区的用途是被打烂。"
 krcw_ma_russian_armaments:0 "俄罗斯军援"
 krcw_ma_russian_armaments_desc:0 "莫斯科的军工托拉斯把过时的型号连图纸一起卖给协定成员，价格低廉，条件是不得转售给第三方，也不得自行改进。"
 krcw_ma_agrarian_reaction:0 "地主的秩序"
 krcw_ma_agrarian_reaction_desc:0 "协定的东欧成员没有做过土地改革，这是它们与莫斯科最深的共同利益，也是它们最脆弱的地方。边界那一侧的广播每天提醒农民这件事。"
 krcw_ma_officers_republic:0 "军官的共和国"
 krcw_ma_officers_republic_desc:0 "选举暂停，议会休会，内阁由上校们组成。理由永远是同一个：紧急状态尚未结束。"
 krcw_ent_armed_neutrality:0 "武装中立"
 krcw_ent_armed_neutrality_desc:0 "流亡的王室恨夺走家园的第三国际，也厌恶萨文科夫的绞架和朗的私刑。堪培拉的结论是：谁也不站，但谁也别想在这里登陆。"
 krcw_ent_ti_subsidies:0 "巴黎的补贴"
 krcw_ent_ti_subsidies_desc:0 "国际给的条件好得可疑：机床、贷款、羊毛的长期合约。堪培拉收下了钱，同时提醒自己这不等于承诺。"
 krcw_ent_moscow_subsidies:0 "莫斯科的军械"
 krcw_ent_moscow_subsidies_desc:0 "莫斯科卖给澳新的坦克比国际给的便宜一半，而且不附带任何关于工会的条件。孟席斯的国防部长觉得这很划算，外交部长不这么想。"
 SOV_krcw_vasilevsky_leader:0 "亚历山大·华西列夫斯基"
 SOV_krcw_vasilevsky_leader_desc:0 "总参谋长出身的最高执政者。他不演讲，不写书，也不允许任何人把他的像挂在办公室里。他的施政纲领据说只有一页纸，第一行写着“不要打仗”。"
 SOV_krcw_sorokin:0 "皮季里姆·索罗金"
 SOV_krcw_sorokin_desc:0 "社会学家、前社会革命党人、科学院院士。他主张俄罗斯赢不了军备竞赛，只能靠生产率和教育赢；他的对手说这是投降的学术说法。"
 SOV_krcw_vladimir_romanov:0 "弗拉基米尔·基里洛维奇大公"
 SOV_krcw_vladimir_romanov_desc:0 "基里尔大公之子，流亡中长大，从未统治过任何东西。一九五三年，一群将军、主教与实业家决定俄罗斯需要一个皇帝，而他是唯一还活着的合适人选。"
 SOV_krcw_vonsyatsky:0 "阿纳斯塔西·冯夏茨基"
 SOV_krcw_vonsyatsky_desc:0 "党卫队式的制服，街头出身的组织，和一句反复出现的口号：“萨文科夫太软弱了。”他认为一九四四年停在易北河边是历史性的错误，并且打算纠正它。"
 SOV_krcw_nekrasov:0 "尼古拉·涅克拉索夫"
 SOV_krcw_nekrasov_desc:0 "国家会议的议长，一个谁也不喜欢、谁也不反对的老官僚。在僵局中他被选出来，作为一个所有派别都能忍受的临时人选——临时了四年。"
 krcw_eu_ti_solidarity:0 "国际团结"
 krcw_eu_detente_contact:0 "外交接触"
 protectorate_dislikes_overlord:0 "不满宗主"
 MA_protectorate_friendly:0 "协定友好"
 MA_protectorate_loyal:0 "协定忠诚"
 krcw_eu_sister_federation:0 "兄弟联邦"
 krcw_fra_rotation_statute:0 "轮换条例"
 krcw_fra_rotation_statute_desc:0 "联合会的书记不得连任超过两届，卸任后必须回到车间或办公室做一年普通工作。老干部们抱怨这是“把经验扔进废纸篓”，年轻的代表们则第一次看到了空出来的位子。"
 krcw_fra_territorial_defence:0 "联合会地方防卫队"
 krcw_fra_territorial_defence_desc:0 "每个工团、每个市镇公社都有自己的防卫连，武器锁在工厂的军械库里，钥匙由车间大会保管。这支军队不能远征，但任何人想占领法国都得一条街一条街地打。"
 krcw_fra_minimum_deterrent:0 "最低限度威慑"
 krcw_fra_minimum_deterrent_desc:0 "公社宣布：它的核武器只有一个用途，就是让别人的核武器没有用途。数量封顶，不首先使用，试验数据向国际书记处全体成员公开。"
 krcw_fra_world_revolution:0 "不断革命"
 krcw_fra_world_revolution_desc:0 "国际的激进派赢得了代表大会：与莫斯科共存就是与绞架共存。志愿者、传单与电台跨过易北河，任何一个起来反抗的车间都会得到巴黎的援助。"
 krcw_fra_tree:0 "krcw_fra_tree"
 krcw_fra_congress_of_1949:0 "一九四九年代表大会"
 krcw_fra_congress_of_1949_desc:0 "劳动总联合会第十四次代表大会在巴黎开幕。革命已进入第二十八年，公社赢了两场战争，但代表们的平均年龄比一九二一年大了二十岁。"
 krcw_fra_frachons_mandate:0 "授权弗拉雄组阁"
 krcw_fra_frachons_mandate_desc:0 "伯努瓦·弗拉雄是矿工出身的老联合会干部，比任何人都懂得怎样让一次罢工持续下去，也比任何人都清楚一个革命政府需要什么样的纪律。代表大会以压倒多数重新选举他为联合会总书记。"
 krcw_fra_the_question_of_the_offices:0 "辩论机关膨胀"
 krcw_fra_the_question_of_the_offices_desc:0 "联合会的机关二十年来膨胀了四倍。一个铁路工人要调换车间，需要三份表格和两个月；一个地方公社想修一座桥，要等巴黎的批文。代表大会决定正式辩论这个问题——这本身就是一种进步。"
 krcw_fra_statute_of_rotation:0 "轮换条例"
 krcw_fra_statute_of_rotation_desc:0 "革新派的方案：干部任期制与强制轮岗。它不能消灭官僚，但能让官僚记得自己从哪里来。"
 krcw_fra_the_efficient_apparatus:0 "精简联合会机关"
 krcw_fra_the_efficient_apparatus_desc:0 "把最好的工程师和统计员调入联合会机关，提高行政效率。车间大会只保留建议权。"
 krcw_fra_participatory_budgeting:0 "参与式预算"
 krcw_fra_participatory_budgeting_desc:0 "里昂和圣艾蒂安的试点证明了一件事：让街区大会决定钱花在哪里，钱并不会花得更少，但会花得更对。现在推广到全国。"
 krcw_fra_recallable_delegates:0 "实行代表罢免制"
 krcw_fra_recallable_delegates_desc:0 "任何联合会代表，只要原选区三分之一的成员签名，就必须重新接受选举。第一年就有四十一名代表被罢免，其中包括两名书记处成员。"
 krcw_fra_directorate_ind:0 "计划总署"
 krcw_fra_planning_directorate:0 "计划总署"
 krcw_fra_planning_directorate_desc:0 "技术派把分散在各联合会的计划局合并成一个总署，设在萨克雷，直接向书记处负责。第一份五年纲要写得像一本工程手册。"
 krcw_fra_federal_constitution:0 "联邦宪章"
 krcw_fra_federal_constitution_desc:0 "一九二一年的临时宪章终于被正式的联邦宪法取代：市镇公社、地区联合会与全国代表大会三级之间的权限写得清清楚楚。它不浪漫，但它会活得比写它的人长。"
 krcw_fra_the_sorbonne_speaks:0 "回应索邦学生"
 krcw_fra_the_sorbonne_speaks_desc:0 "出生在革命之后的一代人进了大学。他们没有见过一九二一年的街垒，只见过联合会的办公室——他们对后者的意见很多。"
 krcw_fra_new_charter_of_labour:0 "新劳动宪章"
 krcw_fra_new_charter_of_labour_desc:0 "把青年工人提出的要求写入新的劳动宪章。"
 krcw_fra_order_in_the_federations:0 "整顿联合会秩序"
 krcw_fra_order_in_the_federations_desc:0 "书记处的结论是：学生不懂生产，车间大会不懂计算。秩序优先，讨论可以等。"
 krcw_fra_reconstruction_commissariat:0 "重建委员会"
 krcw_fra_reconstruction_commissariat_desc:0 "第二次世界大战在法国北部和东部留下了五年的弹坑。停火已经五年，洛林的铁路桥还有三分之一是临时木桥。"
 krcw_fra_lorraine_steel:0 "洛林钢铁联合会"
 krcw_fra_lorraine_steel_desc:0 "洛林的高炉与萨尔的煤从此由同一个联合会调度。炼钢工人投票决定：第一批钢材用来修铁路，第二批才轮到坦克。"
 krcw_fra_rebuild_the_nord:0 "重建北方"
 krcw_fra_rebuild_the_nord_desc:0 "里尔、鲁贝和图尔宽的纺织厂与矿井是一九二一年起义的摇篮。重建它们是经济问题，也是一个关于记忆的问题。"
 krcw_fra_rhone_power:0 "罗讷河电力"
 krcw_fra_rhone_power_desc:0 "罗讷河上的梯级水坝由电力联合会与沿岸公社共同管理。电价由用电者的代表大会决定，这个做法后来被写进了国际的电力公约。"
 krcw_fra_keepers_of_the_ledger:0 "托管清算联盟总账"
 krcw_fra_keepers_of_the_ledger_desc:0 "巴黎清算联盟的总账放在法兰西公社的劳动交易所里，这既是荣誉，也是责任：巴黎必须证明它不会把盈余变成权力。"
 krcw_fra_found_transnational_federations:0 "跨国产业联合会"
 krcw_fra_found_transnational_federations_desc:0 "钢铁、化工、电气与铁路四大联合会改组为跨国机构，会员来自巴黎、伦敦、米兰、科隆与纽约。一张图纸在一个国家设计，在另一个国家试制，在第三个国家量产。"
 krcw_fra_algerian_development_fund:0 "阿尔及利亚发展基金"
 krcw_fra_algerian_development_fund_desc:0 "阿尔及利亚是公社从旧共和国继承下来的唯一一块海外领土，也是它最不愿谈起的一块。发展基金把港口、电站与学校交给阿尔及利亚本地的联合会管理——第一次，钱的流向是从巴黎到阿尔及尔。"
 krcw_fra_cybernetic_coordination:0 "控制论式协作"
 krcw_fra_cybernetic_coordination_desc:0 "萨克雷的计算机构与各地车间通过电传网络相连。计划不再是自上而下的命令，而是一张每天修正的平衡表——问题是，谁有权修正它？"
 krcw_fra_machine_tools_for_the_world:0 "为世界制造机床"
 krcw_fra_machine_tools_for_the_world_desc:0 "一台法国车床在科隆、孟买港口外的走私船上、南京的兵工厂和底特律的装配线上都能找到。清算联盟让穷国用原料和劳动时间换机器，而不必先借一笔永远还不清的债。"
 krcw_fra_the_global_ledger:0 "全球总账"
 krcw_fra_the_global_ledger_desc:0 "清算联盟的账本从巴黎一本变成了分布在十二个城市的十二本，每天通过电报对账。它不再是法国的机构，而是整个国际的公共设施。"
 krcw_fra_federal_defence_review:0 "联邦防务审查"
 krcw_fra_federal_defence_review_desc:0 "一九四四年的军队是为了打到易北河而建立的。一九四九年的问题不同：如何守住易北河，同时不让军队变成一个国中之国。"
 krcw_fra_federal_army_reform:0 "联邦防卫军改革"
 krcw_fra_federal_army_reform_desc:0 "唐吉将军的改革方案：职业化的机动兵团负责前线，工团动员的地方部队负责纵深。士兵委员会保留，但不再讨论作战命令。"
 krcw_fra_armour:0 "装甲联合会"
 krcw_fra_armoured_federations:0 "装甲联合会"
 krcw_fra_armoured_federations_desc:0 "雷诺的布洛涅工厂与索穆阿的车间合并为一个装甲联合会。设计师与驾驶员坐在同一张桌子上讨论下一代坦克的炮塔。"
 krcw_fra_raise_territorial_defence:0 "地方防卫队"
 krcw_fra_raise_territorial_defence_desc:0 "每个工团一个防卫连，每个市镇一个军械库。革命不是靠常备军赢的，也不会靠常备军保住。"
 krcw_fra_doctrine:0 "易北河学说"
 krcw_fra_elbe_doctrine:0 "易北河学说"
 krcw_fra_elbe_doctrine_desc:0 "新作战学说：俄军一旦渡河即就地反击，纵深内的工业城市都按要塞组织防御。"
 krcw_fra_the_atlantic_fleet:0 "大西洋舰队"
 krcw_fra_the_atlantic_fleet_desc:0 "布雷斯特的船坞重新点火。公社的海军任务很清楚：护航，从勒阿弗尔到纽约，从马赛到亚历山大港。"
 krcw_fra_subs:0 "潜艇部队"
 krcw_fra_submarine_arm:0 "潜艇部队"
 krcw_fra_submarine_arm_desc:0 "莫斯科协定的海军主力在波罗的海与黑海，出口都很窄。几十艘潜艇就能让它们一直待在里面。"
 krcw_fra_air_federation:0 "航空联合会"
 krcw_fra_air_federation_desc:0 "图卢兹、波尔多与马里尼亚讷的飞机厂组成一个联合会。航空兵的飞行员有一半是在战争中从机械师升上来的。"
 krcw_fra_jets:0 "喷气截击机"
 krcw_fra_jet_interceptors:0 "喷气截击机"
 krcw_fra_jet_interceptors_desc:0 "俄罗斯的轰炸机从柏林起飞到巴黎只需要一个半小时。截击机必须更快。"
 krcw_fra_screens:0 "地中海分舰队"
 krcw_fra_mediterranean_squadron:0 "地中海分舰队"
 krcw_fra_mediterranean_squadron_desc:0 "土伦与米尔斯克比尔的舰队与意大利海军联合编队。地中海是国际的内海——至少，它应该是。"
 krcw_fra_a_citizens_army:0 "设立联邦防务委员会"
 krcw_fra_a_citizens_army_desc:0 "陆军、海军与航空兵统一在联邦防务委员会之下，委员会由代表大会选出。将军们仍然指挥部队，但他们向工人的代表汇报。"
 krcw_fra_national_research_council:0 "全国研究理事会"
 krcw_fra_national_research_council_desc:0 "法国的实验室在革命中活了下来，在战争中被疏散到了地下室和修道院。研究理事会把它们重新集中起来，经费由代表大会直接拨付，研究题目由科学工作者自己的联合会决定。"
 krcw_fra_univ:0 "大学联合会"
 krcw_fra_university_federations:0 "大学联合会"
 krcw_fra_university_federations_desc:0 "巴黎、里昂与格勒诺布尔的大学由教师、学生与职员共同管理。入学考试保留，学费取消。"
 krcw_fra_computing:0 "萨克雷计算局"
 krcw_fra_computing_bureau:0 "萨克雷计算局"
 krcw_fra_computing_bureau_desc:0 "数学家、电报工程师与统计员在萨克雷组成计算局。他们的第一台电子计算机占满了一整座机库，用于核物理计算，也用于计划平衡表。"
 krcw_fra_atom:0 "原子能委员会"
 krcw_fra_found_atomic_commissariat:0 "原子能委员会"
 krcw_fra_found_atomic_commissariat_desc:0 "约里奥-居里的研究组得到了国家研究理事会最大的一笔预算。马达加斯加与刚果的铀矿合同通过清算联盟结算。"
 krcw_fra_test_range_tt:0 "§Y雷加内§!试验场已就绪：公社的第一次原子试验将在§Y1952年§!前后进行。"
 krcw_fra_saharan_test_range:0 "撒哈拉试验场"
 krcw_fra_saharan_test_range_desc:0 "雷加内的沙漠方圆三百公里没有一个村庄。工程兵在那里修了一条跑道、一座三十米高的钢塔和一片观测掩体。"
 krcw_fra_the_bomb_question:0 "确定核武库规模"
 krcw_fra_the_bomb_question_desc:0 "“路易丝”已经在沙漠里炸响。现在，代表大会必须回答一个革命者从未想过要回答的问题：一个工人的国家，应该拥有多少颗能毁灭城市的炸弹？"
 krcw_fra_minimum_deterrence:0 "最低限度威慑"
 krcw_fra_minimum_deterrence_desc:0 "几颗就够了。剩下的钱用来造反应堆和学校。"
 krcw_fra_the_communes_deterrent:0 "建立全面核威慑"
 krcw_fra_the_communes_deterrent_desc:0 "萨文科夫只听得懂一种语言。公社将建立一支足以覆盖从华沙到乌拉尔的所有目标的核力量。"
 krcw_fra_reactors:0 "反应堆联合会"
 krcw_fra_reactor_federation:0 "反应堆联合会"
 krcw_fra_reactor_federation_desc:0 "国际的原子能合作机构在斯特拉斯堡成立：反应堆的设计与燃料由成员国共享，电力并入欧洲电网。原子第一次被用来点灯。"
 krcw_fra_rockets:0 "探空火箭"
 krcw_fra_sounding_rockets:0 "探空火箭"
 krcw_fra_sounding_rockets_desc:0 "维尔农的火箭小组最初只有十一个人和一台从莱茵兰战时工厂里缴获的发动机。他们的第一枚探空火箭飞到了六十公里高。"
 krcw_fra_hammaguir_range:0 "哈马基尔发射场"
 krcw_fra_hammaguir_range_desc:0 "贝沙尔以南的高原风少、天晴、地广人稀。发射场在一九五一年开始动工。"
 krcw_fra_space:0 "“一八七一”计划"
 krcw_fra_space_race_tt:0 "公社正式加入§Y太空竞赛§!：它将争取在§Y1960年§!前后发射第一颗人造卫星。"
 krcw_fra_the_1871_programme:0 "“一八七一”计划"
 krcw_fra_the_1871_programme_desc:0 "研究理事会正式批准一项“高层大气研究”计划，代号一八七一。所有人都知道它真正的目标：第一个把一个人造物体送上轨道的，将是工人的国家。"
 krcw_fra_orbit:0 "通向轨道"
 krcw_fra_orbit_r:0 "通向轨道"
 krcw_fra_towards_orbit:0 "通向轨道"
 krcw_fra_towards_orbit_desc:0 "三级火箭“宝石”在哈马基尔完成了第四次试射。跟踪站设在阿尔及尔、达喀尔与法属圭亚那的老港口里——港口已经不属于法国，但它们的联合会同意帮忙。"
 krcw_fra_a_shared_sky:0 "部署侦察卫星"
 krcw_fra_a_shared_sky_desc:0 "第一颗卫星升空以后，研究理事会把后续发射交给军事情报局，卫星的相机对准波兰、明斯克和基辅一带的机场与铁路枢纽。科学院抱怨轨道数据从此不再公开。"
 krcw_fra_the_internationale_at_paris:0 "主持国际书记处"
 krcw_fra_the_internationale_at_paris_desc:0 "第三国际的书记处设在巴黎的老交易所大楼里。从南京到纽约，十几个联合会、共和国与公社的代表每季度在这里开一次会——他们之间唯一的共同语言，是法语和《国际歌》。"
 krcw_fra_reform_the_secretariat:0 "改组书记处"
 krcw_fra_reform_the_secretariat_desc:0 "国际不能永远是一个法国机构。新章程给南京、伦敦、罗马与纽约同等的席位与否决权。"
 krcw_fra_the_rhine_compact:0 "莱茵公约"
 krcw_fra_the_rhine_compact_desc:0 "德意志社会主义共和国是国际的前线国家：它的每一座城市都在俄罗斯炮兵的射程之内。莱茵公约把法德两国的铁路、电网与防务计划并为一体。"
 krcw_fra_hold_berlin:0 "守住柏林"
 krcw_fra_hold_berlin_desc:0 "西柏林被东德包围。只要守住西柏林，易北河就只是停火线，不是正式边界。"
 krcw_fra_italian_brotherhood:0 "意大利兄弟"
 krcw_fra_italian_brotherhood_desc:0 "迪·维托里奥的意大利社会共和国与公社共享同一场革命的记忆。穿越阿尔卑斯山的铁路隧道由两国的工团共同扩建。"
 krcw_fra_the_iberian_federation:0 "伊比利亚联邦"
 krcw_fra_the_iberian_federation_desc:0 "全国劳工联盟的伊比利亚联邦是国际里最无政府主义的成员，它不喜欢巴黎的书记处，也不喜欢任何书记处。公社的办法是：不派顾问，只派机器。"
 krcw_fra_the_channel_compact:0 "海峡公约"
 krcw_fra_the_channel_compact_desc:0 "公社拥有欧洲最大的陆军，不列颠联邦拥有国际最大的海军。分工很自然，谈判很漫长。"
 krcw_fra_the_atlantic_bridge:0 "大西洋之桥"
 krcw_fra_the_atlantic_bridge_desc:0 "鲁瑟的工团美洲与巴克的加拿大在大洋彼岸守着国际的另一条前线。从勒阿弗尔到纽约，每周一支船队。"
 krcw_fra_wca_arsenal:0 "五大湖军火库"
 krcw_fra_can_arsenal:0 "五大湖军火库"
 krcw_fra_the_great_lakes_arsenal:0 "五大湖军火库"
 krcw_fra_the_great_lakes_arsenal_desc:0 "底特律的卡车、安大略的镍和法国的设计图：国际在北美的兵工体系由三方共同规划。"
 krcw_fra_chi_aid:0 "巴黎—南京轴心"
 krcw_fra_the_nanjing_axis:0 "巴黎—南京轴心"
 krcw_fra_the_nanjing_axis_desc:0 "周恩来年轻时在巴黎的雷诺工厂做过工。现在他领导着国际在亚洲的支柱，而南京的每一座新工厂里都有法国的工程师。"
 krcw_fra_the_monsoon_conference:0 "季风会议"
 krcw_fra_the_monsoon_conference_desc:0 "仰光召开的会议聚集了东南亚所有的民族革命政府与工会。公社只派了观察员——亚洲的革命应该由亚洲人来讲。"
 krcw_fra_the_liberation_fund:0 "解放基金"
 krcw_fra_the_liberation_fund_desc:0 "一九二零年代帝国崩溃时，非洲与亚洲的新国家几乎一无所有：没有铁路，没有学校，也没有人愿意借钱给它们。国际的解放基金由英法两国共同出资，条件只有一条：钱归当地的合作社与工会支配。"
 krcw_fra_the_algerian_question:0 "回应阿尔及尔代表大会"
 krcw_fra_the_algerian_question_desc:0 "公社在一九二一年宣布“废除一切殖民地”，却保留了阿尔及利亚——理由是它“是法国的一部分”。三十年后，阿尔及尔的联合会代表大会要求公社兑现它自己的宣言。"
 krcw_fra_technicians_not_governors:0 "向青年国家派遣技术员"
 krcw_fra_technicians_not_governors_desc:0 "向达喀尔、阿克拉、开罗和仰光派出工程师、医生与教师，合同两年，期满后把工作交给当地人。书记处希望这些国家在冷战中站到国际一边，出钱的是清算联盟的发展基金。"
 krcw_fra_the_global_internationale:0 "邀请各国工人政府"
 krcw_fra_the_global_internationale_desc:0 "国际不再是一个欧洲的联盟。书记处向世界上每一个工人政府发出邀请：共享清算联盟、共享技术、共享防务——条件只有一条，承认各国走自己的路。"
 krcw_fra_the_two_worlds:0 "确定对东方阵营的方针"
 krcw_fra_the_two_worlds_desc:0 "代表大会要为对协定的长期方针定调：守住易北河并从内部削弱协定，或者把革命推过易北河。书记处的多数主张前者，年轻代表和流亡东欧的工人组织主张后者。"
 krcw_fra_peaceful_competition:0 "执行遏制方针"
 krcw_fra_peaceful_competition_desc:0 "书记处决定不主动开战，而是守住现有防线，同时用情报、广播和贸易手段削弱协定。弗拉雄和联合会的多数支持这条路线，代价是情报和宣传经费要长期维持在战时水平。"
 krcw_fra_permanent_revolution:0 "不断革命"
 krcw_fra_permanent_revolution_desc:0 "国际的左翼认为共存是一个陷阱：每拖一年，萨文科夫的绞架就多吊死一批工人。革命不能在易北河边停下来。"
 krcw_fra_the_geneva_channel:0 "在日内瓦设立情报站"
 krcw_fra_the_geneva_channel_desc:0 "联邦军事情报局在日内瓦设立常驻情报站，招募协定国家的外交人员和商务代表。经费从外交预算里拨出，一旦暴露，瑞士会驱逐我们的整个代表团。"
 krcw_fra_exchange:0 "科学交流"
 krcw_fra_scientific_exchange:0 "开办对东方广播"
 krcw_fra_scientific_exchange_desc:0 "巴黎电台开办波兰语、捷克语、匈牙利语和俄语的短波节目，报道协定报纸不登的罢工、短缺和审判。流亡东欧的工会干部负责撰稿，阿尔萨斯和科西嘉的发射站要占用不少电力和人手。"
 krcw_fra_test_ban_talks:0 "对协定实行战略禁运"
 krcw_fra_test_ban_talks_desc:0 "清算联盟各成员停止向协定出售机床、轴承、橡胶和电子管，并在中立市场上压低协定出口商品的价格。里昂和米兰的出口联合会反对，因为它们要放弃一部分订单。"
 krcw_fra_the_convergence_declaration:0 "制定瓦解协定的总方针"
 krcw_fra_the_convergence_declaration_desc:0 "书记处把情报、广播、禁运和对流亡组织的资助合并为一份总方针，目标是让协定在经济上拖垮自己。计划由军事情报局和清算联盟共同执行，每年的经费由代表大会秘密会议批准。"
 krcw_fra_arm_the_partisans:0 "武装游击队"
 krcw_fra_arm_the_partisans_desc:0 "波兰的矿工、匈牙利的佃农、波罗的海森林里的兄弟，都需要步枪和电台。"
 krcw_fra_the_final_struggle:0 "准备解放东欧"
 krcw_fra_the_final_struggle_desc:0 "代表大会通过决议：国际将在五年内做好解放东欧的准备。广播里又开始唱《国际歌》的最后一段。"
 krcw_eu_republican_claim:0 "共和派的主张"
 krcw_eng_naval_guarantee:0 "不列颠的海军保证"
 krcw_eng_home_guard:0 "人民国民军"
 krcw_eng_home_guard_desc:0 "温特林厄姆在西班牙学会了一件事：受过训练的工人，拿着步枪守在自己的街区里，比任何正规师都难对付。奥斯特利公园的训练营每月毕业一千人。"
 krcw_eng_steel_corporation:0 "钢铁联合公司"
 krcw_eng_steel_corporation_desc:0 "谢菲尔德、斯肯索普与港塔尔博特的高炉一九二六年就归了炼钢工人，可是二十年来每一家都各管各的：同一种钢锭有十一种规格，船厂只能挑着用。新的联合公司不没收任何工厂，只做一件事——统一规格，统一订货，统一排产。第一年省下的钢材，够多造四条护航舰。"
 krcw_eng_the_yards:0 "船厂协作章程"
 krcw_eng_the_yards_desc:0 "克莱德、泰恩、贝尔肯黑德与贝尔法斯特的船厂过去互相抢订单、抢熟练工、抢船台。造船工人联合会的新章程把它们编成一个序列：航母在克莱德，护航舰在泰恩，货轮在默西，渔船和拖网船在东北。每个船台常年满载，学徒第一次知道自己五年后在哪里上班。"
 krcw_eng_stewards_current:0 "车间代表的潮流"
 krcw_eng_stewards_current_desc:0 "克莱德河的车间代表们不满足于生产会议上的一票。他们要求的东西写在一张油印传单上：干部由车间直接选举、可随时罢免；工厂的账目每季度公开；伦敦的联合会总部搬到工业区去。伦敦的书记处说这是无政府主义；车间里的产量却在上升——被听见的工人干活更快。"
 krcw_eng_blackshirt_remnant:0 "黑衫残党"
 krcw_eng_blackshirt_remnant_desc:0 "莫斯利一九二五年逃去了加拿大，又从加拿大逃去了澳大利亚，最后死在悉尼郊外一栋带游泳池的房子里。留在不列颠的追随者没走：他们在退伍军人协会、赛狗场和某些码头工会的分部里，安静地等着联邦犯错。每逢配给削减，他们的传单就多起来。"
 krcw_eng_consumer_turn:0 "为工人生产"
 krcw_eng_consumer_turn_desc:0 "代表大会上一位兰开夏的纺织女工问了一个让主席台沉默的问题：我们造了这么多护航舰，什么时候造洗衣机？第二个五年计划改了：三成的新产能用于住宅、家电、自行车、成衣与罐头食品。有人说这是小资产阶级的堕落，可是新城镇的申请名单第一次开始变短。"
 krcw_eng_incidents_at_sea:0 "海上事故协定"
 krcw_eng_incidents_at_sea_desc:0 "协定只有四页，没有提到意识形态。军舰相遇时保持三千码、不照射火控雷达、不做模拟攻击、飞机不从对方舰艏上方通过；出了事故，双方海军直接通话，不经外交部。签字那天两国报纸都没上头条，但从此北大西洋上少了很多个可能引发战争的夜晚。"
 krcw_eng_indian_ocean_school:0 "印度洋航线"
 krcw_eng_indian_ocean_school_desc:0 "旧帝国走这条航线是为了运棉花和征税。现在同样的航线上走的是相反方向的东西：蒙巴萨与达累斯萨拉姆的青年国家送来矿砂和咖啡，联邦送去机床、柴油机与三千名愿意在热带工作两年的技术员。护航的是同一支舰队，挂的是不同的旗。"
 krcw_eng_tree:0 "krcw_eng_tree"
 krcw_eng_the_blackpool_congress:0 "布莱克浦代表大会"
 krcw_eng_the_blackpool_congress_desc:0 "全国工会代表大会每年秋天在布莱克浦开会：海边的旅馆住满了代表，舞厅变成了会场。一九四九年的议程只有一个问题——革命二十五年之后，不列颠联邦究竟是一个工会，还是一个国家？"
 krcw_eng_the_federal_congress:0 "联邦代表大会"
 krcw_eng_the_federal_congress_desc:0 "代表大会既是立法机关，也是全国产业委员会。温特林厄姆的办法是把两者分开开会——同一批人，不同的日子。"
 krcw_eng_the_shop_stewards:0 "车间代表"
 krcw_eng_the_shop_stewards_desc:0 "克莱德河、谢菲尔德与考文垂的车间代表是一九二五年的老兵。他们对伦敦的办公室抱怨最多，也最会组织生产。"
 krcw_eng_scottish_and_welsh_congresses:0 "苏格兰与威尔士代表大会"
 krcw_eng_scottish_and_welsh_congresses_desc:0 "爱丁堡与加迪夫有了自己的代表大会。煤、钢与造船的地方联合会直接向它们负责。"
 krcw_eng_against_the_offices:0 "反对办公室"
 krcw_eng_against_the_offices_desc:0 "代表大会通过决议：每个联合会的专职干部人数不得超过会员的百分之一。多出来的人回车间去。"
 krcw_eng_the_ulster_question:0 "解决阿尔斯特归属"
 krcw_eng_the_ulster_question_desc:0 "一九二五年的革命在贝尔法斯特分裂了工人：新教船厂工人支持联邦，天主教街区更愿意投向都柏林的工人共和国。现在两个国家同属一个国际，这道伤口却还在。"
 krcw_eng_the_rock:0 "直布罗陀协定"
 krcw_eng_the_rock_desc:0 "直布罗陀已归伊比利亚联邦。与全国劳工联盟签订协定，让不列颠的地中海分舰队继续使用这座港口。"
 krcw_eng_the_irish_sea_compact:0 "爱尔兰海公约"
 krcw_eng_the_irish_sea_compact_desc:0 "都柏林与伦敦签订协定：渔场、电网与航运共同管理。两个革命国家之间第一次没有了殖民的影子。"
 krcw_eng_the_coal_federation:0 "煤矿联合会"
 krcw_eng_the_coal_federation_desc:0 "南威尔士、约克郡与诺森伯兰的矿井在一九二五年就归了矿工。二十多年过去，井架老了，矿工也老了。"
 krcw_eng_the_new_towns:0 "新城镇"
 krcw_eng_the_new_towns_desc:0 "伦敦的贫民窟在战时的轰炸中烧掉了一半。住房联合会在城外规划了八座新城：每一座都有自己的工厂、学校、诊所与公共浴场。"
 krcw_eng_lancashire_and_the_midlands:0 "兰开夏与中部"
 krcw_eng_lancashire_and_the_midlands_desc:0 "曼彻斯特的纺织厂改造成电机厂，伯明翰的车间开始为跨国联合会造机床。"
 krcw_eng_grid:0 "全联邦电气化"
 krcw_eng_electrify_the_union:0 "全联邦电气化"
 krcw_eng_electrify_the_union_desc:0 "全国电网委员会的口号很简单：一九五二年之前，每一个村庄都要通电。"
 krcw_eng_ledger:0 "伦敦与清算联盟"
 krcw_eng_london_and_the_ledger:0 "伦敦与清算联盟"
 krcw_eng_london_and_the_ledger_desc:0 "伦敦城的老银行家早就走光了，但他们留下的电报线、船运保险与商品交易所还在。清算联盟在伦敦设立了第二个结算中心。"
 krcw_eng_harwell_n:0 "哈韦尔"
 krcw_eng_harwell:0 "哈韦尔"
 krcw_eng_harwell_desc:0 "牛津郡的一座旧机场上建起了联邦的原子能研究所。"
 krcw_eng_reactor:0 "英法原子合作"
 krcw_eng_the_anglo_french_atom:0 "英法原子合作"
 krcw_eng_the_anglo_french_atom_desc:0 "哈韦尔与萨克雷共用图纸与铀矿配额。公社拥有炸弹，联邦拥有反应堆的设计——两国都不愿单独承担代价。"
 krcw_eng_the_red_fleet:0 "红色舰队"
 krcw_eng_the_red_fleet_desc:0 "一九二五年，大舰队的水兵在斯卡帕湾升起了红旗，革命才真正赢了。二十五年后，这支舰队仍是国际最大的海上力量。"
 krcw_eng_clyde_and_tyne:0 "克莱德与泰恩"
 krcw_eng_clyde_and_tyne_desc:0 "克莱德河与泰恩河的船厂由造船工人联合会管理。它们要同时造护航舰、货轮和渔船。"
 krcw_eng_the_atlantic_lifeline:0 "大西洋生命线"
 krcw_eng_the_atlantic_lifeline_desc:0 "北大西洋是国际的动脉：美洲的钢与粮食向东，欧洲的机器与技术员向西。"
 krcw_eng_asw:0 "猎杀编队"
 krcw_eng_hunter_killer_groups:0 "猎杀编队"
 krcw_eng_hunter_killer_groups_desc:0 "俄罗斯的潜艇从摩尔曼斯克出航，要穿过格陵兰—冰岛—英国之间的缺口。反潜编队就守在那里。"
 krcw_eng_cv:0 "航母部队"
 krcw_eng_the_carrier_arm:0 "航母部队"
 krcw_eng_the_carrier_arm_desc:0 "海军航空兵在战争中证明了自己。下一代舰队的中心是航空母舰。"
 krcw_eng_north_atlantic_command:0 "北大西洋司令部"
 krcw_eng_north_atlantic_command_desc:0 "联邦、公社、工团美洲与加拿大的海军合组北大西洋联合司令部，司令部设在哈利法克斯与普利茅斯两地轮换。"
 krcw_eng_the_peoples_air_force:0 "人民空军"
 krcw_eng_the_peoples_air_force_desc:0 "联邦空军的飞行员大多来自航空工人联合会的夜校。"
 krcw_eng_jets:0 "喷气发动机"
 krcw_eng_jet_engines:0 "喷气发动机"
 krcw_eng_jet_engines_desc:0 "德比的发动机厂是国际最好的喷气发动机设计室。"
 krcw_eng_radar:0 "雷达链"
 krcw_eng_the_radar_chain:0 "雷达链"
 krcw_eng_the_radar_chain_desc:0 "从设得兰到康沃尔，一条雷达链守着联邦的天空。"
 krcw_eng_the_home_guard:0 "人民国民军"
 krcw_eng_the_home_guard_desc:0 "温特林厄姆的奥斯特利训练营扩展为全国性的国民军。每个工会分部都有一个排。"
 krcw_eng_the_naval_pillar:0 "国际的海军支柱"
 krcw_eng_the_naval_pillar_desc:0 "国际的海军力量几乎全部来自不列颠。确立不列颠在阵营海上防务中的领导地位。"
 krcw_eng_canadian_brothers:0 "加拿大兄弟"
 krcw_eng_canadian_brothers_desc:0 "一九四零年加拿大工人把流亡王室赶去了澳大利亚。从此伦敦与渥太华之间只有工会的电报，没有总督的信件。"
 krcw_eng_a_commonwealth_of_liberation:0 "援助前殖民地工会"
 krcw_eng_a_commonwealth_of_liberation_desc:0 "旧帝国的铁路、港口和大学都还在，只是它们现在属于开罗、拉各斯与阿克拉。联邦的援助只附一个条件：交给当地的工会与合作社。"
 krcw_eng_the_question_of_canberra:0 "确定对堪培拉政策"
 krcw_eng_the_question_of_canberra_desc:0 "温莎王室在堪培拉维持着一个“流亡中的不列颠”。它的存在本身就是对联邦合法性的否认——可是澳大利亚的码头工人和剪羊毛工人，未必同意他们的国王。"
 krcw_eng_a_letter_to_canberra:0 "致信澳新协约"
 krcw_eng_a_letter_to_canberra_desc:0 "代表大会致信澳新协约：不要求国王退位，只要求澳新不向俄国舰队开放港口。"
 krcw_eng_the_republican_claim:0 "宣示唯一合法政府"
 krcw_eng_the_republican_claim_desc:0 "联邦是不列颠人民唯一合法的政府。堪培拉的朝廷是一个篡夺者，它的旗帜在澳大利亚的每一次罢工中都该被扯下来。"
 krcw_eng_the_west_african_ports:0 "西非港口"
 krcw_eng_the_west_african_ports_desc:0 "弗里敦与拉各斯的码头工人联合会与利物浦的码头工人签订了协作协议：技术员、起重机与航线，都由双方共同管理。"
 krcw_eng_peace_on_the_seas:0 "阻止俄国舰队使用中立港口"
 krcw_eng_peace_on_the_seas_desc:0 "外交部与海员工会联手，向堪培拉、开普敦和西非各港施压：凡向俄国舰队提供燃料和修理的港口，联邦商船一律不再停靠。海员工会支持这项禁令，但它会让几条航线的运费上涨。"
 krcw_eng_the_union_of_the_seas:0 "建立国际海外基地网"
 krcw_eng_the_union_of_the_seas_desc:0 "在弗里敦、阿森松和圣赫勒拿修建加油站、船坞和通信站，让国际的舰队不必回到本土就能补给。海军部提出方案，代价是一笔不小的建设预算。"
 krcw_eng_the_stewards_current:0 "回应车间代表运动"
 krcw_eng_the_stewards_current_desc:0 "克莱德河的车间代表运动要求把权力从联合会总部交还给车间大会。运动并不反对政府，但书记处必须回应。"
 krcw_eng_the_second_commune_in_britain:0 "不列颠的第二公社"
 krcw_eng_the_second_commune_in_britain_desc:0 "第二公社运动传到不列颠，曼彻斯特和格拉斯哥的青年工人占领联合会办公楼，要求把干部任期缩短到两年。政府需要决定是谈判还是清场。"
 krcw_eng_the_blackshirt_shadow:0 "清查黑衫党残余"
 krcw_eng_the_blackshirt_shadow_desc:0 "莫斯利的追随者仍在退伍军人协会和部分码头工会分部活动，每逢配给削减就散发传单。决定是取缔他们，还是用工作和住房争取他们的听众。"
 krcw_eng_after_wintringham:0 "安排温特林厄姆接班"
 krcw_eng_after_wintringham_desc:0 "温特林厄姆年过六十，联邦没有继承法，总书记由代表大会选出。候选人有三位：老工会官员、克莱德河车间代表领袖、新城镇计划的主持者。"
 krcw_eng_the_steel_corporation:0 "钢铁联合公司"
 krcw_eng_the_steel_corporation_desc:0 "炼钢工人一九二六年就拿下了高炉，但二十年来各厂各自为政。新的联合公司不没收任何工厂，只统一规格、订货与排产。省下的钢材，够多造几条护航舰。"
 krcw_eng_the_yards_compact:0 "船厂协作章程"
 krcw_eng_the_yards_compact_desc:0 "克莱德、泰恩、默西与贝尔法斯特的船厂过去互相抢订单、抢工人、抢船台。新的章程把它们编成一个序列，每个船台常年满载。"
 krcw_eng_the_railway_federation:0 "铁路联合会"
 krcw_eng_the_railway_federation_desc:0 "四大铁路公司在革命中合并成了一家，由铁路工人联合会管理。可是轨距、信号与机车型号还是四套。全国铁路计划要用十年把它们统一，并把干线全部电气化。"
 krcw_eng_producing_for_the_workers:0 "为工人生产"
 krcw_eng_producing_for_the_workers_desc:0 "一位兰开夏的纺织女工在代表大会上问：我们造了这么多护航舰，什么时候造洗衣机？第二个五年计划改了：三成新产能用于住宅、家电、自行车与成衣。"
 krcw_eng_the_calculating_engine:0 "推广曼彻斯特计算机"
 krcw_eng_the_calculating_engine_desc:0 "曼彻斯特大学的实验室里，一台占满整个房间的机器在为清算联盟计算跨国的产业配额。它也在为哈韦尔算中子的路径。联邦决定把它变成一个产业：计算机将是社会主义计划的算盘。"
 krcw_eng_computing:0 "曼彻斯特的计算机"
 krcw_eng_the_workers_university:0 "工人大学"
 krcw_eng_the_workers_university_desc:0 "联邦的大学不再只招收文法学校的学生。每一个工会分部都可以保送成员进大学，学费由联合会承担，毕业后回原厂工作三年。哈韦尔与曼彻斯特的实验室第一次不缺人手。"
 krcw_eng_the_battleship_question:0 "处置战列舰"
 krcw_eng_the_battleship_question_desc:0 "大舰队留下了六艘战列舰。有人说它们是过时的钢铁棺材，该拆了炼钢；有人说它们仍是唯一能在炮战中压倒俄罗斯重巡的东西。海军联合会吵了整整一年。"
 krcw_eng_the_submarine_arm:0 "潜艇部队"
 krcw_eng_the_submarine_arm_desc:0 "猎杀敌方潜艇的最好办法，是懂得潜艇怎么想。联邦的潜艇部队在苏格兰西海岸的深水湾里训练，既练进攻，也当反潜编队的陪练靶子。"
 krcw_eng_subs:0 "潜艇部队"
 krcw_eng_the_royal_marines:0 "海军陆战队"
 krcw_eng_the_royal_marines_desc:0 "不列颠不再有帝国要维持，但国际的港口从开普敦到新加坡都可能需要有人去守卫或撤离。海军陆战旅是一支能上船就走的部队。"
 krcw_eng_marines:0 "海军陆战队"
 krcw_eng_the_incidents_agreement:0 "封锁冰岛缺口"
 krcw_eng_the_incidents_agreement_desc:0 "在格陵兰、冰岛和英国之间布设水听器、雷区与常驻反潜编队，让俄国北方舰队的潜艇无法悄悄进入大西洋。海军部主张此事，冰岛政府要求为基地收取租金。"
 krcw_eng_the_bomber_command:0 "轰炸机司令部"
 krcw_eng_the_bomber_command_desc:0 "联邦要不要一支战略轰炸机部队？它昂贵、进攻性强、也是把哈韦尔的炸弹送到莫斯科的唯一办法。和平派说这钱该用在护航舰上；威慑派说，没有轰炸机，原子弹只是实验室里的摆设。"
 krcw_eng_the_deterrent:0 "最低限度威慑"
 krcw_eng_the_deterrent_desc:0 "联邦的立场追随巴黎：核武器只有一个用途，就是让别人的核武器没有用途。数量封顶，不首先使用，交由北大西洋联合司令部统一指挥。这是一支不打算使用的力量——但必须存在。"
 krcw_eng_the_pacific_squadron:0 "太平洋分舰队"
 krcw_eng_the_pacific_squadron_desc:0 "萨克拉门托的国会在两大阵营之间摇摆不定，日本的舰队正在莫斯科的图纸下重建。联邦向南京和堪培拉建议：让国际的军舰在太平洋上多露面，让宪政联盟和日本都看到国际的舰队就在附近。"
 krcw_eng_the_indian_ocean_run:0 "印度洋航线"
 krcw_eng_the_indian_ocean_run_desc:0 "旧帝国走这条航线是为了运棉花和征税。现在同样的航线走着相反的东西：青年国家的矿砂与咖啡向北，联邦的机床与技术员向南。"
 krcw_eng_the_young_nations_and_the_fleet:0 "青年国家与舰队"
 krcw_eng_the_young_nations_and_the_fleet_desc:0 "联邦提出建立一个由国际护航、向青年国家开放的自由航运区：任何国家的商船都可以加入护航队，只要它不向莫斯科的舰队开放港口。这是用海军换来的一种不结盟。"
 krcw_eng_the_fishing_fleets:0 "渔业船队"
 krcw_eng_the_fishing_fleets_desc:0 "赫尔、格里姆斯比与阿伯丁的拖网船队是不列颠工人的蛋白质来源，也是海军最好的水兵学校。造船工人联合会决定同时更新它们。"
 krcw_eng_civil_aviation:0 "民用航空"
 krcw_eng_civil_aviation_desc:0 "德比与布里斯托尔的发动机厂不只造战斗机。国际的干线客机——从巴黎到南京，从伦敦到蒙巴萨——需要一种可靠的四发飞机，而联邦想造它。"
 krcw_eng_airliner:0 "民用航空"
 krcw_eng_the_naval_academy:0 "达特茅斯海军学院"
 krcw_eng_the_naval_academy_desc:0 "大舰队的老军官们大多在革命中留了下来——大海不分阶级。达特茅斯学院如今既教航海，也教《资本论》，培养出来的是又红又专的舰长。"
 krcw_eng_naval_doc:0 "达特茅斯海军学院"
 krcw_eng_the_atlantic_charter_of_labour:0 "大西洋劳工宪章"
 krcw_eng_the_atlantic_charter_of_labour_desc:0 "联邦、公社、加拿大与工团美洲的工会签订一份宪章：统一的最低劳动标准、跨大西洋的失业互助基金、共同承认的工会证。这是把北大西洋的两岸缝在一起的针脚。"
 krcw_eng_a_free_press_of_the_unions:0 "工会的自由报刊"
 krcw_eng_a_free_press_of_the_unions_desc:0 "各大联合会保留自己的报纸，书记处不统一口径。"
 krcw_eng_north_sea_gas:0 "开发北海天然气"
 krcw_eng_north_sea_gas_desc:0 "地质队在北海之下发现了天然气，也许还有石油。开采它需要一种全新的海上平台——又一件船厂能造的东西。联邦第一次有了不依赖进口的能源前景。"
 krcw_eng_the_commonwealth_congress:0 "解放联邦代表大会"
 krcw_eng_the_commonwealth_congress_desc:0 "旧英联邦的名字被保留了下来，但意思彻底变了：它现在是一个自愿的工会与合作社的联席会议，从阿克拉到蒙巴萨，从渥太华到威灵顿。伦敦不再是首都，只是一个召集人。"
 krcw_eng_20_t:0 "车间里的声音"
 krcw_eng_20_d:0 "克莱德河的车间代表们递来一份联署信，签名有三千个。信里没有威胁，只有一句反问：“革命是为了让工人管理生产，还是为了让另一批人坐进旧老板的办公室？”联邦的书记处把信传阅了一圈，谁也不愿第一个表态。"
 krcw_eng_20.a:0 "把车间代表请进产业委员会"
 krcw_eng_20.b:0 "生产需要纪律，不是辩论"
 krcw_eng_21_t:0 "不列颠的第二公社"
 krcw_eng_21_d:0 "曼彻斯特和格拉斯哥的青年工人占了几座联合会办公楼，墙上刷着“把革命还给我们”。警察站在街角没有动手——他们的父辈也是工会会员。温特林厄姆坐在唐宁街那间他从不肯翻修的办公室里，面前是两份草拟好的声明：一份宣布戒严，一份宣布改革。"
 krcw_eng_21.a:0 "新宪章：权力下放到车间"
 krcw_eng_21.b:0 "清场，恢复秩序"
 krcw_eng_22_t:0 "退伍军人协会里的传单"
 krcw_eng_22_d:0 "码头削减了一班工，黑衫党的传单第二天就出现了：“工团把你的工作给了黑人和法国人。”散发传单的是一个在西班牙对面那条战线上打过仗的老兵。联邦可以逮捕他，也可以给码头找回那班工。"
 krcw_eng_22.a:0 "用工作回答他们"
 krcw_eng_22.b:0 "取缔他们的组织"
 krcw_eng_12_t:0 "禁令之后"
 krcw_eng_12_d:0 "取缔令生效四个月，退伍军人协会的几个分会自己开除了散发传单的人。码头工会的分部改选了书记。传单不再出现了。"
 krcw_eng_12.a:0 "禁令保留，案子结了"
 krcw_eng_13_t:0 "伍利奇的火"
 krcw_eng_13_d:0 "取缔令没有赶走黑衫党，只让他们换了地方开会。一天夜里，伍利奇码头工会的会所被人放了火，墙上刷着他们的口号。没有人死，但会所的档案全烧了。"
 krcw_eng_13.a:0 "交给工人自卫队追查"
 krcw_eng_13.b:0 "先给码头恢复班次，再抓人"
 krcw_eng_23_t:0 "温特林厄姆之后"
 krcw_eng_23_d:0 "主席在一次代表大会的休会期间平静地去世了。他没有指定继承人——他说过，指定继承人是国王的做法。代表大会连夜开会，三个名字摆在桌上：船坞工会的老书记、克莱德河车间代表的领袖、以及主持新城镇计划的技术派女性。"
 krcw_eng_23.a:0 "老工会官僚：稳健的一双手"
 krcw_eng_23.b:0 "车间代表领袖：革命的更新"
 krcw_eng_23.c:0 "技术派：计划与计算机"
 krcw_eng_24_t:0 "战列舰的去留"
 krcw_eng_24_d:0 "六艘战列舰停在朴次茅斯，每一艘每年的维护费够养一个师。海军联合会分成两派：老水兵舍不得斯卡帕湾的荣光，年轻的军官只想要航母和护航舰。"
 krcw_eng_24.a:0 "留两艘，其余拆解炼钢"
 krcw_eng_24.b:0 "全部保留：舰炮仍有用"
 krcw_eng_25_t:0 "轰炸机还是护航舰"
 krcw_eng_25_d:0 "联邦造不起两样都要的东西。空军联合会要一支战略轰炸机部队，把哈韦尔的炸弹送到需要去的地方；海军联合会要更多护航舰，守住大西洋的生命线。代表大会必须选一个。"
 krcw_eng_25.a:0 "护航舰优先：守住生命线"
 krcw_eng_25.b:0 "轰炸机：威慑需要牙齿"
 krcw_eng_bomber:0 "战略轰炸机"
 krcw_eng_fleet_category:0 "皇家舰队的部署"
 krcw_eng_fleet_category_desc:0 ""
 krcw_eng_show_the_flag_pacific:0 "在太平洋亮出旗帜"
 krcw_eng_show_the_flag_pacific_desc:0 "把一支分舰队派往太平洋，让摇摆的宪政联盟和准备复仇的日本都看清：国际的海军能开到那里。"
 krcw_eng_escort_the_young_nations:0 "为青年国家护航"
 krcw_eng_escort_the_young_nations_desc:0 "把护航队开进印度洋，护送青年国家的商船。这是一种用军舰做的外交：谁的货物在我们的护航队里，谁就离莫斯科远了一步。"
 krcw_eng_north_atlantic_exercise:0 "北大西洋大演习"
 krcw_eng_north_atlantic_exercise_desc:0 "联邦、公社、加拿大与工团美洲的舰队在北大西洋举行联合演习。这是给莫斯科看的，也是给自己人看的——四国的舰队第一次在同一套信号下行动。"
 krcw_eng_hunt_the_boats:0 "猎杀行动"
 krcw_eng_hunt_the_boats_desc:0 "俄罗斯的潜艇在格陵兰缺口活动频繁。派出猎杀编队实弹演练——既练兵，也是一句不必说出口的警告。"
 ENG_krcw_horner:0 "阿瑟·霍纳"
 ENG_krcw_horner_desc:0 "矿工联合会的书记，第二个十年那份\"住宅、供暖、自来水、学校\"草案的作者。他反对核计划的理由从不诉诸道义：\"那笔钱是从住宅计划里挪出来的。\"他的政治基础是全国最结实的一块：谁也不敢和矿工吵架。"
 ENG_krcw_gallacher:0 "威利·加拉赫"
 ENG_krcw_gallacher_desc:0 "锅炉工出身的工会组织者，代表大会里最能把一屋子互相看不上的联合会说服到同一份决议上的人。他主张宪法必须写下来，包括那一条允许反对革命的候选人参选——不是因为他不怕输，而是因为他见过一个不敢面对选票的政权最后变成什么样。"
 ENG_krcw_wilkinson:0 "艾伦·威尔金森"
 ENG_krcw_wilkinson_desc:0 "“红色艾伦”，贾罗大游行的组织者，新城镇计划的主持人。她这一代人的革命是在市政厅和规划图纸里完成的：住宅、诊所、学校、公共浴场。她相信社会主义的胜负不在街垒上，而在一个纺织女工的厨房里有没有一台洗衣机。她身边总跟着两个抱着计算尺的年轻工程师。"
 krcw_sov_tree:0 "krcw_sov_tree"
 krcw_sov_long_plan:0 "长期国家计划"
 krcw_sov_long_plan_desc:0 "不是布尔什维克的五年计划，而是国家与托拉斯之间的十年合同：国家保证订单与信贷，托拉斯保证产量与交货期。违约的一方要上仲裁庭——这在俄罗斯是新鲜事。"
 krcw_sov_consumer_decade:0 "消费品的十年"
 krcw_sov_consumer_decade_desc:0 "冰箱、收音机、电视机和一套有热水的公寓。国家第一次承诺的不是胜利，而是生活。"
 krcw_sov_accord_council:0 "协定理事会"
 krcw_sov_accord_council_desc:0 "协定终于有了一个常设机构：一个理事会，一个联合参谋部，一份每个成员都签了字、每个成员都读过的章程。莫斯科仍然最大，但不再是唯一的声音。"
 krcw_sov_constitutional_crown:0 "立宪的皇冠"
 krcw_sov_constitutional_crown_desc:0 "皇帝保留了加冕礼、阅兵和一个签字的权力。帝国杜马保留了预算。把他请回来的那些人发现，一个只会剪彩的皇帝比一个想要统治的皇帝好相处得多。"
 krcw_sov_marshals_regency:0 "元帅们的摄政"
 krcw_sov_marshals_regency_desc:0 "极端派执政的第二年，总参谋部拒绝执行一道动员令。第二天早上，保卫局的大楼被坦克包围。元帅们宣布这是“恢复宪法秩序”，而莫斯科街头没有人表示反对。"
 krcw_sov_convergence:0 "趋同"
 krcw_sov_convergence_desc:0 "萨哈罗夫在一篇论文里写道：两个体系正在相互学习——一个学会了计划，另一个学会了市场与选举——终有一天它们之间的差别会小于它们共同面对的问题。二十年前这篇论文会把他送进营地，今天它登在了《消息报》上。"
 krcw_sov_accord_solidarity:0 "协定的团结"
 krcw_sov_nanjing_talks:0 "南京会谈"
 krcw_sov_patron:0 "莫斯科的保护"
 krcw_sov_the_russian_state:0 "俄罗斯国"
 krcw_sov_the_russian_state_desc:0 "一九四九年的俄罗斯从易北河延伸到太平洋。它有一个最高执政者、一个国家会议、一支打到过柏林的军队，和一个谁也不敢问的问题：萨文科夫之后怎么办？"
 krcw_sov_national_populism_doctrine:0 "将国家民粹主义写入法律"
 krcw_sov_national_populism_doctrine_desc:0 "萨文科夫把他的政治写成了一本书：土地归农民，工厂归国家与托拉斯，政治归执政者。现在国家会议要把这本书变成法律，这样它就能活得比作者更久。"
 krcw_sov_reform_the_okhrana:0 "整顿国家保卫局"
 krcw_sov_reform_the_okhrana_desc:0 "保卫局是萨文科夫最锋利的工具，也是最危险的。整顿意味着给它章程、预算和审计。"
 krcw_sov_zemstvo_revival:0 "给地方自治会拨款"
 krcw_sov_zemstvo_revival_desc:0 "旧帝国唯一运转良好的机构是地方自治会：修路、办学、请医生。萨文科夫把它们复活了，只是不让它们谈政治。现在它们要一点预算。"
 krcw_sov_the_peasant_bargain:0 "将村社地权写入宪法"
 krcw_sov_the_peasant_bargain_desc:0 "俄罗斯没有搞过集体化，这是国家民粹主义最深的根。把村社的土地权写进宪法，让每个农民知道：国家要的只是粮食定额，不是他的地。"
 krcw_sov_council_of_state:0 "国家会议"
 krcw_sov_council_of_state_desc:0 "宪法说最高执政者由国家会议选举。国家会议里有将军、主教、托拉斯的经理、地方自治会的代表，和三分之二由萨文科夫任命的人。它从未真正选举过任何人。"
 krcw_sov_tree_bid_mil_5_tt:0 "军方稳定派的影响力：§G+5§!"
 krcw_sov_question_of_succession:0 "讨论继承程序"
 krcw_sov_question_of_succession_desc:0 "萨文科夫从未指定继承人。一个指定了继承人的独裁者，就给自己制造了一个敌人——而一个没有指定继承人的独裁者，给他的国家留下了一场战争。国家会议开始悄悄地准备。"
 krcw_sov_tree_bid_mil_15_tt:0 "军方稳定派的影响力：§G+15§!"
 krcw_sov_groom_the_general_staff:0 "培植总参谋部"
 krcw_sov_groom_the_general_staff_desc:0 "让华西列夫斯基出席国家会议的每一次会议。他不说话，但每个人都会记住他坐在那里。"
 krcw_sov_tree_bid_civ_15_tt:0 "文官技术派的影响力：§G+15§!"
 krcw_sov_patronise_the_academicians:0 "扶持科学院"
 krcw_sov_patronise_the_academicians_desc:0 "索罗金的备忘录在部长们之间传阅。给经济部与科学院更多的预算和更多的曝光，让国家会议习惯听一位教授说话。"
 krcw_sov_tree_bid_mon_15_tt:0 "君主派的影响力：§G+15§!"
 krcw_sov_throne_and_altar:0 "王座与祭坛"
 krcw_sov_throne_and_altar_desc:0 "救主大教堂的重建工程重新开工。主教们、旧贵族与乌拉尔的钢铁大王们开始在同一张餐桌上吃饭，讨论一个三十年没人敢提的词。"
 krcw_sov_after_savinkov:0 "组建临时政府"
 krcw_sov_after_savinkov_desc:0 "他走了。国家会议投了十一轮票，没有人得到多数。在最终的选举之前，国家必须继续运转——邮件要送，工资要发，军队要吃饭。"
 krcw_sov_a_calm_opponent:0 "审计封闭城市预算"
 krcw_sov_a_calm_opponent_desc:0 "新的最高执政者不演讲。他的第一道命令是审计封闭城市的预算，第二道命令是取消五月一日的阅兵，第三道是把省下的钱拨给通信兵。"
 krcw_sov_win_on_productivity:0 "压缩军费扩建工业"
 krcw_sov_win_on_productivity_desc:0 "索罗金的第一份预算把国防开支削减了七分之一，差额投入拖拉机厂、机床厂和铁路。他的理由是长期对峙靠工业底子。军官团反对，但总参谋部自己的备忘录也承认补给是最大的短板。"
 krcw_sov_the_imperial_duma:0 "帝国杜马"
 krcw_sov_the_imperial_duma_desc:0 "国家会议改名为帝国杜马，议员们换上了新的礼服。皇帝在开幕式上宣读了一份由别人写好的演说——这是整个复辟中最让人安心的细节。"
 krcw_sov_the_final_reckoning:0 "发动最后的清算"
 krcw_sov_the_final_reckoning_desc:0 "广播里每天都在重复这个词。它从未被正式定义——这正是它最有效的地方。国家保卫局的新大楼在卢比扬卡广场上拔地而起。"
 krcw_sov_the_material_basis:0 "国防的物质基础"
 krcw_sov_the_material_basis_desc:0 "按华西列夫斯基的备忘录拨款购置卡车、电台，改造铁路轨距，建设一支以火力和通信取胜的军队。"
 krcw_sov_regauge_the_railways:0 "铁路轨距改造"
 krcw_sov_regauge_the_railways_desc:0 "俄罗斯的宽轨在维斯瓦河边戛然而止。改造西部干线意味着和平时期的贸易更便宜——也意味着战争时期的进攻更容易，这一点巴黎也注意到了。"
 krcw_sov_the_constitutional_crown:0 "限制皇帝预算权"
 krcw_sov_the_constitutional_crown_desc:0 "杜马与皇帝之间的第一次冲突是关于预算的，结果是杜马赢了。皇帝的顾问们认为这是一次失败；皇帝本人似乎松了一口气。"
 krcw_sov_the_marshals_intervene:0 "由元帅会议接管"
 krcw_sov_the_marshals_intervene_desc:0 "总参谋部拒绝执行一道动员令。第二天早上，坦克包围了卢比扬卡。“恢复宪法秩序”——元帅们只说了这一句话，然后把广播还给了肖斯塔科维奇。"
 krcw_sov_the_thaw:0 "颁布继任政府纲领"
 krcw_sov_the_thaw_desc:0 "新的最高执政者向国家会议提交施政纲领：对外继续领导协定，对内保证粮食定额和工资按时发放。国家保卫局负责让各省照此执行。"
 krcw_sov_peaceful_coexistence:0 "召开协定首脑会议"
 krcw_sov_peaceful_coexistence_desc:0 "继任政府把协定各国的首脑请到莫斯科，逐一确认条约义务和驻军安排。各国政府要的是保证，莫斯科要的是它们在危机中不动摇。会议的招待和让步都要花钱。"
 krcw_sov_the_consumer_decade:0 "转产消费品"
 krcw_sov_the_consumer_decade_desc:0 "国家承诺为每户提供有热水的公寓，托拉斯的订单从坦克转向冰箱。"
 krcw_sov_the_convergence:0 "通过长期对抗纲领"
 krcw_sov_the_convergence_desc:0 "国家会议通过一份文件，把与国际的对抗定为国家的长期任务：军工、宣传和对外情报工作按二十年编制预算。消费品的增长因此要放慢。"
 krcw_sov_the_ural_trusts:0 "乌拉尔托拉斯"
 krcw_sov_the_ural_trusts_desc:0 "国家持股，军队下单，私人经理。乌拉尔的钢铁托拉斯是萨文科夫经济的心脏：它不算高效，也不算浪费，只是没人敢问利润去了哪里。"
 krcw_sov_magnitka_and_chelyabinsk:0 "马格尼特卡与车里雅宾斯克"
 krcw_sov_magnitka_and_chelyabinsk_desc:0 "战争时期迁到乌拉尔以东的工厂从未搬回去。现在要让它们在和平时期也有活干。"
 krcw_sov_the_second_baku:0 "第二巴库"
 krcw_sov_the_second_baku_desc:0 "里海边的老油田已经老了。地质学家说，伏尔加河与乌拉尔山之间的地下还有一个巴库。鞑靼斯坦与巴什基尔的钻机开始日夜不停。"
 krcw_sov_the_long_plan:0 "长期国家计划"
 krcw_sov_the_long_plan_desc:0 "国家与托拉斯签订十年合同：国家保证订单，托拉斯保证交货，违约方送仲裁庭。"
 krcw_sov_kuzbass:0 "库兹巴斯"
 krcw_sov_kuzbass_desc:0 "库兹涅茨克盆地的煤和马格尼托哥尔斯克的矿石之间隔着两千公里铁路——这条“乌拉尔-库兹涅茨克联合体”是俄罗斯重工业的脊梁。"
 krcw_sov_the_trans_siberian:0 "西伯利亚大铁路"
 krcw_sov_the_trans_siberian_desc:0 "双线化、电气化，再修一条北方的平行线。铁路是俄罗斯把自己连成一个国家的唯一方式。"
 krcw_sov_goods_for_the_village:0 "为农村生产"
 krcw_sov_goods_for_the_village_desc:0 "契约的另一半：国家拿走粮食，也要给村子一些东西：缝纫机、自行车、煤油灯。否则农民就会把粮食藏起来。"
 krcw_sov_angara_and_volga:0 "安加拉与伏尔加"
 krcw_sov_angara_and_volga_desc:0 "萨马拉与布拉茨克的水坝：世界上最大的两座。工程师说它们将照亮半个西伯利亚，地质学家说它们会淹掉半个西伯利亚。两者都说对了。"
 krcw_sov_west_siberian_oil:0 "西西伯利亚石油"
 krcw_sov_west_siberian_oil_desc:0 "秋明的沼泽下面是一片海——一片石油的海。开采它需要在冻土上铺路、在沼泽里打桩，以及一整代人的青春。"
 krcw_sov_lessons_of_the_elbe:0 "研究一九四四年补给失败"
 krcw_sov_lessons_of_the_elbe_desc:0 "一九四四年的军队靠人数与意志打到了易北河，然后在那里停下来——因为补给跟不上。总参谋部的每一份研究报告都从这个事实开始。"
 krcw_sov_motor_rifle_divisions:0 "摩托化步兵师"
 krcw_sov_motor_rifle_divisions_desc:0 "把步兵从靴子上搬到卡车上。这需要十万辆卡车，也需要十万个会修卡车的人。"
 krcw_sov_guards_tank_armies:0 "近卫坦克集团军"
 krcw_sov_guards_tank_armies_desc:0 "哈尔科夫与下塔吉尔的坦克厂生产的是一种信念：如果战争来临，钢铁的洪流要在三周内抵达莱茵河。"
 krcw_sov_territorial_defence:0 "国土防御"
 krcw_sov_territorial_defence_desc:0 "从芬兰湾到黑海，边境上修起了一条永久工事线。将军们不喜欢它：他们说俄罗斯的防御永远是进攻。财政部喜欢它：混凝土比坦克便宜。"
 krcw_sov_the_airborne_forces:0 "空降兵"
 krcw_sov_the_airborne_forces_desc:0 "俄罗斯是最早训练伞兵的国家之一。现在这支部队被赋予了一个新任务：在战争的第一夜夺取敌人的机场与桥梁。"
 krcw_sov_long_range_aviation:0 "远程航空兵"
 krcw_sov_long_range_aviation_desc:0 "图波列夫的重型轰炸机能从科拉半岛飞到巴黎再飞回来——如果它不被击落的话。这就是威慑，至少在导弹出现之前。"
 krcw_sov_black_sea_and_baltic:0 "加强黑海与波罗的海舰队"
 krcw_sov_black_sea_and_baltic_desc:0 "黑海舰队出海要经过海峡，波罗的海舰队要经过丹麦海峡。两支舰队的任务是近海防御。"
 krcw_sov_air_defence_forces:0 "国土防空军"
 krcw_sov_air_defence_forces_desc:0 "雷达站、截击机和高射炮组成一张网，罩住莫斯科、彼得格勒和乌拉尔的工厂。国际的轰炸机要飞过三千公里才能碰到它。"
 krcw_sov_the_northern_fleet:0 "北方舰队"
 krcw_sov_the_northern_fleet_desc:0 "摩尔曼斯克是俄罗斯唯一一个冬天不冻、也不需要经过别人海峡的港口。潜艇将从这里出发，进入北大西洋——国际的生命线。"
 krcw_sov_project_number_one:0 "第一号工程"
 krcw_sov_project_number_one_desc:0 "车里雅宾斯克以北的封闭城市在地图上没有名字。它有一座反应堆、一千名科学家和一个在一九五〇年之后变得非常简单的任务：赶上巴黎。"
 krcw_sov_the_deterrent:0 "威慑"
 krcw_sov_the_deterrent_desc:0 "哈萨克草原上的蘑菇云之后，莫斯科和巴黎终于有了同样的核武器，谁也不敢先动手。"
 krcw_sov_leader_of_the_accord:0 "统一协定参谋工作"
 krcw_sov_leader_of_the_accord_desc:0 "协定各成员国的参谋工作集中到莫斯科。协定没有共同意识形态，靠共同的敌人维系。"
 krcw_sov_the_southern_tier:0 "南方地带"
 krcw_sov_the_southern_tier_desc:0 "德黑兰与喀布尔的政府是俄罗斯的被保护国。保护意味着公路、电报线和军事顾问——以及偶尔提醒他们谁在保护谁。"
 krcw_sov_the_balkan_bayonets:0 "武装巴尔干成员"
 krcw_sov_the_balkan_bayonets_desc:0 "土耳其守着海峡，希腊与南斯拉夫守着亚得里亚海与爱琴海的门。协定把过时的坦克连图纸一起卖给它们，条件是不许转售，也不许改进。"
 krcw_sov_the_potsdam_protocol:0 "波茨坦议定书"
 krcw_sov_the_potsdam_protocol_desc:0 "柏林条约让施莱歇尔的民族共和国成了莫斯科的附庸。新的议定书给它一点体面：赔偿减半，驻军的费用由莫斯科承担，外交仍然由莫斯科决定。"
 krcw_sov_the_mexican_channel:0 "墨西哥通道"
 krcw_sov_the_mexican_channel_desc:0 "朗的美国被密西西比河截成两半，东边是工团的工厂，西边是他的油井和棉田。俄罗斯的援助经过墨西哥湾与韦拉克鲁斯进入新奥尔良。"
 krcw_sov_the_baltic_statute:0 "波罗的海自治章程"
 krcw_sov_the_baltic_statute_desc:0 "里加、塔林与考纳斯获得自己的议会、自己的学校和自己的警察，代价是承认俄罗斯的国防与外交主权。森林兄弟的枪声会一年年稀疏下去。"
 krcw_sov_russify_the_provinces:0 "省份的俄罗斯化"
 krcw_sov_russify_the_provinces_desc:0 "官方语言、迁入的移民、改名的街道。内务部的报告说抵抗正在减弱，写报告的人从未去过那里。"
 krcw_sov_the_finnish_question:0 "恢复芬兰宪法"
 krcw_sov_the_finnish_question_desc:0 "一九四四年吞并芬兰是萨文科夫最不划算的胜利：赫尔辛基挂着俄罗斯的旗，森林里有一支打不完的游击队。旧帝国曾给芬兰一部宪法，而芬兰一百年没有造反。"
 krcw_sov_the_delhi_axis:0 "德里轴线"
 krcw_sov_the_delhi_axis_desc:0 "印度帝国是协定在亚洲唯一的大国。德里需要莫斯科的钢铁与飞机，莫斯科需要德里牵制南京。这是一桩互相都不太信任的婚姻。"
 krcw_sov_the_amur_frontier:0 "阿穆尔边疆"
 krcw_sov_the_amur_frontier_desc:0 "四千公里的中俄边界上，两个大国的哨兵隔着一条河对望。加固它：永久工事、远东军区的独立补给线。"
 krcw_sov_talks_with_nanjing:0 "冻结阿穆尔河界线"
 krcw_sov_talks_with_nanjing_desc:0 "与南京签订一份只管河道、渔业和哨所距离的边界协定，其余问题一概不谈。远东军区腾出的师调往西线。南京会把这当作俄罗斯的让步。"
 krcw_sov_the_accord_council:0 "协定理事会"
 krcw_sov_the_accord_council_desc:0 "一个常设理事会、一个联合参谋部和一份每个成员都签了字的章程。莫斯科仍然最大，但不再是唯一的声音。"
 krcw_sov_a_bloc_of_equals:0 "统一协定各国武器口径"
 krcw_sov_a_bloc_of_equals_desc:0 "协定各国军队的步枪、火炮和弹药改用俄罗斯口径，由乌拉尔的工厂统一供货。成员国的兵工厂要改造生产线，莫斯科承担一部分费用。"
 krcw_sov_courting_the_antipodes:0 "拉拢南太平洋"
 krcw_sov_courting_the_antipodes_desc:0 "流亡的协约国王室坐在堪培拉，恨第三国际夺走了他们的家园。他们不喜欢萨文科夫——但俄罗斯的坦克比巴黎的便宜一半，而且不附带任何关于工会的条件。"
 krcw_sov_the_academy_of_sciences:0 "科学院"
 krcw_sov_the_academy_of_sciences_desc:0 "萨文科夫不信任知识分子，但他更不信任落后。科学院得到了新的大楼、新的预算，以及一位国家保卫局派来的副院长。"
 krcw_sov_the_closed_cities:0 "封闭城市"
 krcw_sov_the_closed_cities_desc:0 "没有名字、只有邮政编号的城市：阿尔扎马斯-16、车里雅宾斯克-40、克拉斯诺亚尔斯克-26。住在那里的人工资是外面的两倍，但不能告诉任何人自己住在哪里。"
 krcw_sov_the_rocket_bureau:0 "火箭设计局"
 krcw_sov_the_rocket_bureau_desc:0 "一九四四年从德意志帝国的工厂里拆来的图纸，加上一个从营地里放出来的总设计师。他的名字是国家机密，他的火箭一枚比一枚大。"
 krcw_sov_computing_centres:0 "计算中心"
 krcw_sov_computing_centres_desc:0 "基辅与莫斯科的第一批电子计算机占满了整栋楼，一天要换二十根真空管。它们计算弹道、核反应截面，偶尔也计算粮食定额。"
 krcw_sov_baikonur:0 "丘拉塔姆发射场"
 krcw_sov_baikonur_desc:0 "哈萨克草原深处，锡尔河边的丘拉塔姆小站旁，一座发射场正在动工。军方要的是洲际导弹，科学院要的是卫星，在预算表上两者写在同一行。"
 krcw_sov_the_intercontinental_missile:0 "洲际导弹"
 krcw_sov_the_intercontinental_missile_desc:0 "一枚能从丘拉塔姆飞到巴黎的火箭，也能把一颗卫星送上轨道。总设计师心里想的是后者，给他发工资的人想的是前者。"
 krcw_sov_the_geophysical_year:0 "研制侦察卫星"
 krcw_sov_the_geophysical_year_desc:0 "丘拉塔姆的第一项军事任务是从轨道上拍摄国际的机场和港口。总设计师要的是科学卫星，总参谋部付钱，所以先造相机。"
 krcw_sov_science_for_peace:0 "建设奥布宁斯克核电站"
 krcw_sov_science_for_peace_desc:0 "在奥布宁斯克建第一座并网发电的反应堆。科学院要用它培养反应堆工程师，第一号工程要用它试验燃料元件。经费从乌拉尔的电站计划里挪出。"
 krcw_sov_governors_general:0 "总督制"
 krcw_sov_governors_general_desc:0 "每个非俄罗斯的省份派一位总督，直接向执政者负责，不受地方自治会约束。总督的报告总是说一切平静，因为写别的报告的总督都被换掉了。"
 krcw_sov_statute_of_peoples:0 "民族章程"
 krcw_sov_statute_of_peoples_desc:0 "一部把帝国改写成联邦的法律：本族语言的学校、本族的行政、在国家会议里按人口分配的席位。莫斯科保留国防、外交与铁路——其余的，让他们自己去管。"
 krcw_sov_cossack_hosts:0 "重建哥萨克军团"
 krcw_sov_cossack_hosts_desc:0 "顿河、库班与捷列克的军团恢复了旧的编制、旧的制服和旧的特权：土地免税，换来每个成年男子的马与马刀。这是旧帝国的办法，而它确实管用。"
 krcw_sov_the_hundred_peoples:0 "承认各民族地位"
 krcw_sov_the_hundred_peoples_desc:0 "从芬兰湾到帕米尔，从波罗的海的路德教徒到布哈拉的穆斯林。旧帝国称他们为\"异族\"，萨文科夫的宪法称他们为\"俄罗斯国的公民\"，而内务部的档案里称他们为\"问题\"。"
 krcw_sov_the_governors_general:0 "总督制"
 krcw_sov_the_governors_general_desc:0 "内务部的方案最简单：把每个边疆省份交给一位将军，给他一支宪兵队和一份不必公开的预算。莫斯科不再听到坏消息——这被认为是一种成功。"
 krcw_sov_the_statute_of_peoples:0 "民族章程"
 krcw_sov_the_statute_of_peoples_desc:0 "索罗金的人起草了一部章程：本族语言的学校、按人口分配的席位、地方税留在地方。反对者说这是帝国解体的第一步，起草者说这是帝国存续的唯一办法。"
 krcw_sov_the_autonomy_bargains:0 "与各省分别谈判自治"
 krcw_sov_the_autonomy_bargains_desc:0 "不立一部总章程，而是一个省一个省地谈：里加要学校，第比利斯要教会，塔什干要清真寺，赫尔辛基要宪法。每一份协议都不一样，每一份都写着\"仅限本省\"。"
 krcw_sov_the_ukrainian_question:0 "制定乌克兰政策"
 krcw_sov_the_ukrainian_question_desc:0 "乌克兰有四千万人、俄罗斯一半的煤和最好的黑土。基辅的知识分子要一所本族语言的大学，哈尔科夫的工人要工资，而农民只要没人来动他们的地。三者之中，最容易满足的是第三个。"
 krcw_sov_the_caucasus_viceroyalty:0 "高加索总督区"
 krcw_sov_the_caucasus_viceroyalty_desc:0 "三个民族、六种语言、两种宗教和一条通往巴库油田的铁路。第比利斯的教会、埃里温的商人与巴库的石油工人从不彼此喜欢——一个聪明的总督会让这件事为他所用。"
 krcw_sov_turkestan_and_the_steppe:0 "突厥斯坦与草原"
 krcw_sov_turkestan_and_the_steppe_desc:0 "布哈拉与希瓦的埃米尔早已不在，留下的是棉花、清真寺和一片能种粮食也能试炸弹的草原。莫斯科要棉花，草原要水，而没有人问过草原上的人想要什么。"
 krcw_sov_the_cossack_hosts:0 "哥萨克军团"
 krcw_sov_the_cossack_hosts_desc:0 "恢复哥萨克军团的军事编制和土地，但不给予独立法庭。顿河与库班保持忠诚，也保留不满。"
 krcw_sov_the_siberian_settlers:0 "向西伯利亚移民"
 krcw_sov_the_siberian_settlers_desc:0 "斯托雷平的老办法：把中部省份多余的农民送到西伯利亚去，给他们土地、种子和三年免税。这一次还给他们拖拉机——因为没有拖拉机，没人愿意去。"
 krcw_sov_one_state_many_nations:0 "通过民族问题决议"
 krcw_sov_one_state_many_nations_desc:0 "国家会议通过了最后一份文件：民族问题\"已在俄罗斯国的框架内得到解决\"。这句话的意思取决于走的是哪一条路——但至少，二十年来第一次，没有一个省份在打仗。"
 krcw_sov_arbitration_courts:0 "仲裁法庭"
 krcw_sov_arbitration_courts_desc:0 "托拉斯可以起诉部委，而且偶尔会胜诉。这在俄罗斯的历史上是前所未有的事，比任何一份计划都更能提高产量。"
 krcw_sov_grain_reserve:0 "国家粮食储备"
 krcw_sov_grain_reserve_desc:0 "旧帝国死于一九一七年的面包队列。萨文科夫的国家在每个省会都建了粮仓，规定任何情况下不得动用最后三个月的储备。这条规定救过这个政权两次。"
 krcw_sov_consumer_shortage:0 "消费品短缺"
 krcw_sov_consumer_shortage_desc:0 "坦克按计划交付，鞋子不按计划交付。莫斯科的百货商店里排队的人谈论的不是意识形态，而是什么时候能买到一双合脚的鞋。"
 krcw_sov_the_arbitration_courts:0 "仲裁法庭"
 krcw_sov_the_arbitration_courts_desc:0 "托拉斯之间的合同纠纷改由仲裁法庭裁决，不再由部里电话协调。"
 krcw_sov_the_grain_reserve:0 "国家粮食储备"
 krcw_sov_the_grain_reserve_desc:0 "在每个省会建一座粮仓，任何情况下不得动用最后三个月的储备。财政部说这是浪费，内务部说这是保险——一九一七年的面包队列证明内务部是对的。"
 krcw_sov_the_donbass_combine:0 "顿巴斯联合体"
 krcw_sov_the_donbass_combine_desc:0 "顿巴斯的煤、克里沃罗格的铁、马里乌波尔的钢厂：三者之间只有两百公里。这是俄罗斯最紧凑、也最脆弱的工业区——它离易北河太近了。"
 krcw_sov_the_volga_automobile:0 "伏尔加汽车厂"
 krcw_sov_the_volga_automobile_desc:0 "一座年产三十万辆卡车的工厂。军队要它造军车，农业部要它造拖拉机，而国家会议里第一次有人提出：也许应该造几辆私人能买的汽车。"
 krcw_sov_the_norilsk_nickel:0 "开发诺里尔斯克镍矿"
 krcw_sov_the_norilsk_nickel_desc:0 "北极圈以北三百公里，一座只有冬天和更冷的冬天的城市。它的镍与钯是装甲钢与喷气发动机不可缺少的原料，而把它挖出来的代价，档案里写得很含糊。"
 krcw_sov_the_shoe_problem:0 "改善日用品供应"
 krcw_sov_the_shoe_problem_desc:0 "俄罗斯的工厂能造出坦克集团军，却造不出合脚的鞋。梁赞的百货公司门口每星期排一次队，队伍里的人什么都不说——这种沉默比抗议更让内务部担心。"
 krcw_sov_electrify_the_villages:0 "农村电气化"
 krcw_sov_electrify_the_villages_desc:0 "一九五〇年，俄罗斯四分之三的村庄没有电。把电线拉到每一个村子需要十年，而它改变的东西比任何一次土地改革都多。"
 krcw_sov_the_northern_sea_route:0 "北方航道"
 krcw_sov_the_northern_sea_route_desc:0 "破冰船、气象站与无线电灯塔。如果这条航道能在夏天通航，俄罗斯就不必再看丹麦海峡和土耳其海峡的眼色。"
 krcw_sov_the_cotton_republics:0 "棉花共和国"
 krcw_sov_the_cotton_republics_desc:0 "突厥斯坦的棉花供应整个帝国的纺织厂。灌溉渠每年延长几十公里，咸海的水位每年下降几厘米——这件事要到很久以后才有人计算。"
 krcw_sov_the_ten_year_housing:0 "十年住宅计划"
 krcw_sov_the_ten_year_housing_desc:0 "预制混凝土板、五层无电梯的楼房、每户一间厨房和一间浴室。它们难看、廉价、千篇一律，而搬进去的人一生都记得那一天。"
 krcw_sov_the_second_industrial_base:0 "第二工业基地"
 krcw_sov_the_second_industrial_base_desc:0 "总参谋部的假设是：战争的第一个月里，乌克兰与波罗的海的工厂会被摧毁。所以第二套工业必须建在乌拉尔以东，远到任何轰炸机都飞不到的地方。"
 krcw_sov_the_computing_economy:0 "用计算机编制计划"
 krcw_sov_the_computing_economy_desc:0 "索罗金的学生们提出一个想法：用电子计算机来编制国民经济的平衡表。如果成功，计划将第一次比市场更快；如果失败，那也只是又一份没人读的报告。"
 krcw_sov_50_t:0 "民族章程的辩论"
 krcw_sov_50_d:0 "国家会议为这部章程吵了三个星期。内务部长把一张地图挂在墙上，上面用红色标出过去三十年发生过武装抵抗的每一个县——红色的部分占了帝国的三分之一。\n\n\"先生们，\"他说，\"这张地图是用总督制画出来的。\"\n\n起草者的回答很简单：旧帝国给过芬兰一部宪法，芬兰一百年没有造反；旧帝国没有给过波兰，波兰造反了三次。问题不在于俄罗斯是否强大，而在于一个帝国能同时看住多少个省份。"
 krcw_sov_50.a:0 "通过全文：语言、学校、席位"
 krcw_sov_50.b:0 "只通过语言与学校，席位留待日后"
 krcw_sov_50.c:0 "撤回章程，改为各别交易"
 krcw_sov_52_t:0 "梁赞的鞋"
 krcw_sov_52_d:0 "轻工业部的报告承认：全国的制鞋厂中，六成的设备是一九三〇年以前的，而它们的产量指标每年仍按百分之四递增。指标是在莫斯科定的，皮革的配额是在另一个部里定的，两个数字从未对得上。\n\n执政者在国家会议上念了一封信。写信的是梁赞一位车床工，他说他的儿子光脚上学，而他自己每天生产的坦克履带板可以铺满半条街。\n\n\"我们能在三周内把坦克运到莱茵河，\"执政者说，\"为什么不能在三个月内把鞋运到梁赞？\"没有人回答。这不是因为没有答案，而是因为答案会牵扯到在座每一个人的部门。"
 krcw_sov_52.a:0 "把轻工业交给托拉斯，按合同供货"
 krcw_sov_52.b:0 "从军工预算里划出一部分"
 krcw_sov_52.c:0 "这是纪律问题，不是资源问题"
 krcw_sov_51_t:0 "席位问题"
 krcw_sov_51_d:0 "语言与学校的条款实施一年后，里加、第比利斯与塔什干的地方议会联名致信国家会议：章程里答应\"日后讨论\"的席位，现在该讨论了。信上有四十一个签名，其中十一个是去年投票支持章程的国家会议议员。\n\n内务部长提醒，按人口分配席位，意味着俄罗斯族议员在国家会议里第一次不到三分之二。"
 krcw_sov_51.a:0 "补上席位条款"
 krcw_sov_51.b:0 "席位只给咨询权，不给表决权"
 krcw_sov_51.c:0 "驳回来信，调查签名的议员"
 krcw_sov_tree_bid_ext_5_tt:0 "极端派的影响力：§G+5§!"
 krcw_sov_53_t:0 "梁赞的队伍"
 krcw_sov_53_d0:0 "梁赞百货公司门口的队伍在一个星期六早上没有散。鞋没有到货，排了一夜的人拒绝离开，到中午已经有两千人。警察局长请求派兵，省长没有批准，而是给莫斯科打了电话。第二天，图拉和卡卢加的百货公司门口也出现了同样的队伍。"
 krcw_sov_53_d1:0 "轻工业部撤换了四个制鞋厂的厂长，新厂长们按期上报了产量。梁赞的队伍还在，但比去年短，而且没有人在队伍里说话。奥克拉那的月报把这一项标为\"平静\"。"
 krcw_sov_53.a:0 "把领头的人送到叶尼塞河以东"
 krcw_sov_53.b:0 "从军工预算里拨出鞋款"
 krcw_sov_53.c:0 "纪律奏效了"
 krcw_sov_54_t:0 "经济的控制论"
 krcw_sov_54_d:0 "基辅计算中心提交了一份四百页的报告：如果给它足够的数据和足够的机器时间，它可以在两周内算出全国钢材的最优分配——而计划委员会需要四个月，还常常算错。\n\n这个结论让两类人不安。第一类是计划委员会的官员，因为机器不需要他们。第二类是国家保卫局，因为要让机器算，就得把全国的真实数据都交给它——而俄罗斯的统计数字向来有两套。\n\n索罗金的学生在报告的最后一页写了一句话：“计划经济的敌人不是市场，是谎言。”这句话后来被反复引用，引用的人各有各的意思。"
 krcw_sov_54.a:0 "给机器真实的数字"
 krcw_sov_54.b:0 "只用它算钢材与铁路"
 krcw_sov_54.c:0 "报告归档，不再讨论"
 krcw_ddr_tree:0 "krcw_ddr_tree"
 krcw_ddr_inner_german_trade:0 "组织西德的民族派"
 krcw_ddr_loyal_ally:0 "忠诚的盟友"
 krcw_ddr_the_rump_reich:0 "民族共和国"
 krcw_ddr_the_rump_reich_desc:0 "帝国战败，皇帝先逃往中非，中非帝国瓦解后流亡瑞典。施莱歇尔在勃兰登堡、萨克森、图林根和东柏林建立德意志民族共和国，预算须经莫斯科批准。"
 krcw_ddr_the_court_at_potsdam:0 "横向阵线"
 krcw_ddr_the_court_at_potsdam_desc:0 "施莱歇尔的老主意：把军官团、工会里的民族派和容克地主拉进同一个“民族阵线”。尼基施的人要“面向东方”，君主派要等皇帝回来——将军对两边都点头。"
 krcw_ddr_live_with_the_wire:0 "稳定分界线"
 krcw_ddr_live_with_the_wire_desc:0 "东柏林的报纸每天宣布分裂是暂时的。市政府终于承认了另一件事：暂时的东西也需要路灯、电车和一个能正常开放的检查站。"
 krcw_ddr_a_constitutional_reich:0 "人民议院"
 krcw_ddr_a_constitutional_reich_desc:0 "临时议会重新召开，由议会而非将军府决定预算。复辟派在议会中失去多数。"
 krcw_ddr_the_reconstruction_plan:0 "重建计划"
 krcw_ddr_the_reconstruction_plan_desc:0 "俄罗斯的赔偿拆走了一半机床，剩下的一半由老工人手工复制出来。莱比锡与德累斯顿的废墟上重新立起了脚手架。"
 krcw_ddr_saxon_workshops:0 "扶持萨克森工场"
 krcw_ddr_saxon_workshops_desc:0 "德累斯顿的光学、开姆尼茨的机床、莱比锡的印刷——萨克森的手艺活过了两场战争，它还能活过一场和平。"
 krcw_ddr_the_rostock_yards:0 "罗斯托克船厂"
 krcw_ddr_the_rostock_yards_desc:0 "东德唯一的海岸在波罗的海边。罗斯托克的船厂造不了战列舰，但能造渔船、货轮和巡逻艇。"
 krcw_ddr_leuna_chemicals:0 "洛伊纳化工"
 krcw_ddr_leuna_chemicals_desc:0 "没有油田的国家用煤造油。哈勒附近的洛伊纳工厂是一座城市大小的化工厂，也是东德能源自主的唯一希望。"
 krcw_ddr_the_general_staff:0 "普鲁士总参谋部"
 krcw_ddr_the_general_staff_desc:0 "德国丢掉了国土，但施莱歇尔带走了总参谋部。曼施坦因还在，那套把有限的兵力用到极致的手艺也还在。"
 krcw_ddr_the_elbe_line:0 "易北河防线"
 krcw_ddr_the_elbe_line_desc:0 "国际的装甲师就在易北河对岸。如果战争来临，东德要做的是撑住七十二小时，直到俄罗斯的坦克集团军赶到。"
 krcw_ddr_the_imperial_army_reborn:0 "扩编国防军"
 krcw_ddr_the_imperial_army_reborn_desc:0 "莫斯科同意东德拥有六个师——然后是八个，然后是十二个。每一次增加都要一份新的议定书，每一份议定书都证明莫斯科需要它们。"
 krcw_ddr_revise_the_treaty:0 "修订柏林条约"
 krcw_ddr_revise_the_treaty_desc:0 "一九四四年的条约是在俄罗斯的坦克注视下签署的。十年后，人民议院的代表团带着一份修订草案去了莫斯科：赔偿结束，驻军费用由双方分担，东德恢复自己的外交部。"
 krcw_ddr_the_loyal_bulwark:0 "争取协定优先装备"
 krcw_ddr_the_loyal_bulwark_desc:0 "东德的命运与俄罗斯的命运绑在一起。与其抱怨这根绳子，不如把它拉紧：成为协定最可靠的前线，换取莫斯科最好的装备。"
 krcw_ddr_a_road_of_our_own:0 "确立民族统一国策"
 krcw_ddr_a_road_of_our_own_desc:0 "将军府宣布易北河以西是被占领的德国土地，统一德意志是共和国的首要国策。尼基施的民族革命派主持宣传，莫斯科担心柏林会拖着协定提前开战。"
 krcw_ddr_the_front_of_the_accord:0 "在易北河举行联合演习"
 krcw_ddr_the_front_of_the_accord_desc:0 "东德陆军的演习在易北河边举行，俄罗斯的元帅们坐在看台上。每一次演习都是一封给巴黎的信。"
 krcw_ddr_inner_german_trade_desc:0 "共和国通过老兵协会、钢盔团旧部和流亡的鲁尔企业主，在西德建立秘密的民族派小组。经费由将军府的特别账户支付，一旦暴露，西德会以间谍罪审判他们。"
 krcw_ddr_two_states_one_nation:0 "通过德意志统一纲领"
 krcw_ddr_two_states_one_nation_desc:0 "人民议院通过统一纲领：德意志将在协定胜利之后于民族共和国之下重新统一，议院为西部各州保留议席。纲领需要一支能打过易北河的军队来兑现。"
 krcw_ddr_land_of_the_junkers:0 "容克的土地"
 krcw_ddr_land_of_the_junkers_desc:0 "易北河以东的大庄园曾是普鲁士军官团的摇篮。将军府没有没收它们，只是让庄园主明白，谁才是波茨坦的主人。"
 krcw_ddr_peoples_police:0 "人民警察"
 krcw_ddr_peoples_police_desc:0 "正规军受莫斯科的师级限额约束，但没有人数得清警察。绿制服的“人民警察”在兵营里操练重武器，名义上是维持治安。"
 krcw_ddr_crown_in_waiting:0 "等待中的王冠"
 krcw_ddr_crown_in_waiting_desc:0 "莫斯科默许了一件出人意料的事：一个立宪的、无实权的、对协定俯首帖耳的霍亨索伦君主，也许比一个会老死的将军更能稳住这个国家。皇帝还在斯德哥尔摩，但王座已经掸去了灰尘。"
 krcw_ddr_the_third_germany:0 "第三个德意志"
 krcw_ddr_the_third_germany_desc:0 "既不是巴黎的社会主义共和国，也不是莫斯科的附庸——一个中立的、统一的德意志的构想，第一次从密谈变成了外交部备忘录上的文字。"
 krcw_ddr_the_lusatian_coal:0 "开采卢萨蒂亚褐煤"
 krcw_ddr_the_lusatian_coal_desc:0 "没有鲁尔，没有西里西亚的硬煤，东德只剩下卢萨蒂亚的褐煤。露天矿一直挖到村庄的边缘，发电厂的烟把德累斯顿的天空染成褐色。"
 krcw_ddr_collectivise_the_estates:0 "改庄园为国营农场"
 krcw_ddr_collectivise_the_estates_desc:0 "土地问题把民族阵线撕成两半：民族派要保住容克军官的庄园，工会派要把它们分给雇农。将军府选择了第三条路：国营农场，既不还给贵族，也不交给公社。"
 krcw_ddr_the_uranium_of_the_ore_mountains:0 "开放厄尔士山铀矿"
 krcw_ddr_the_uranium_of_the_ore_mountains_desc:0 "厄尔士山脉的旧银矿里有铀。俄罗斯的地质队带着武装押运队来了，整座山成了莫斯科的禁区——但东德的物理学家至少能站在门外记笔记。"
 krcw_ddr_the_barracked_police:0 "组建兵营人民警察"
 krcw_ddr_the_barracked_police_desc:0 "《柏林条约》限制了陆军的师数，却没提警察。将军府组建了“兵营人民警察”——名义上维持治安，实际上是不受条约约束的第二支军队。"
 krcw_ddr_air_defence_of_the_reich:0 "本土防空"
 krcw_ddr_air_defence_of_the_reich_desc:0 "国际的轰炸机从莱茵兰起飞只需一个小时就能飞到柏林。东德买不起截击机联队，但可以用俄罗斯的雷达和高射炮网罩住工业区。"
 krcw_ddr_the_national_service_law:0 "国民义务兵役法"
 krcw_ddr_the_national_service_law_desc:0 "人民议院通过了义务兵役法。适龄青年先在人民警察受训，再转入国防军——莫斯科的师级限额只算现役番号，算不清后备役的人数。"
 krcw_ddr_the_constitutional_question:0 "讨论元首继承"
 krcw_ddr_the_constitutional_question_desc:0 "施莱歇尔老了。将军府里没人敢公开讨论继承，但每个人都在准备。宪法只有一句话是清楚的：最高统帅由人民议院选出——问题是，选一个什么样的人？"
 krcw_ddr_marshal_of_the_accord:0 "全面对接俄军"
 krcw_ddr_marshal_of_the_accord_desc:0 "东德把自己彻底交给莫斯科：军官去伏龙芝学院进修，参谋部与俄罗斯共用一套作战计划，作为回报，协定最新的坦克第一批就装备东德的师。"
 krcw_ddr_the_westward_watch:0 "监视西德动向"
 krcw_ddr_the_westward_watch_desc:0 "如果第三次世界大战爆发，东德就是第一个战场。将军府接受了这个命运，把整个国家变成了易北河防线的纵深。"
 krcw_ddr_the_kings_bargain:0 "游说莫斯科支持立宪君主"
 krcw_ddr_the_kings_bargain_desc:0 "保守派的方案是说服莫斯科：一个立宪的、听话的霍亨索伦君主比一个终将死去的将军更能稳住东德。皇帝留在斯德哥尔摩当象征，实权仍在议会。柏林派出特使去问莫斯科的意见，答复要看莫斯科怎么看柏林。"
 krcw_ddr_a_throne_under_the_wire:0 "迎立霍亨索伦旁支"
 krcw_ddr_a_throne_under_the_wire_desc:0 "经莫斯科批准，迎一位年轻的霍亨索伦旁支到波茨坦加冕，以安抚君主派。实权仍在将军府。"
 krcw_ddr_the_geneva_memorandum:0 "由人民议院组阁"
 krcw_ddr_the_geneva_memorandum_desc:0 "内阁改由人民议院的多数组成，预算和部长任命须经议院表决。共和国仍留在协定之内，将军府失去了单独决定国家大事的权力，军官团对此不满。"
 krcw_ddr_the_all_german_congress:0 "举行人民议院选举"
 krcw_ddr_the_all_german_congress_desc:0 "共和国举行第一次议院普选，民族阵线各派分别提出候选人名单。选举让政权在罢工面前多了一层合法性，也让议院开始否决军费。"
 krcw_ddr_30_t:0 "选一个什么样的统帅？"
 krcw_ddr_30_d:0 "施莱歇尔的健康每况愈下，人民议院必须决定：当将军不在了，这个国家由什么来维系？三派各执一词，而莫斯科的大使就坐在旁听席上。"
 krcw_ddr_30.a:0 "一位新的将军——忠于协定"
 krcw_ddr_30.b:0 "请回一位国王——如果莫斯科同意"
 krcw_ddr_30.c:0 "一个文官共和国——由人民议院执政"
 krcw_ddr_32_t:0 "莫斯科的答复"
 krcw_ddr_32_d:0 "莫斯科对复辟一个立宪君主没有反对。外交部的答复说，一个依赖协定保护的王座，比一个可能倒向巴黎的共和国更可靠。条件只有一个：这个国王永远不得拥有军队的指挥权。"
 krcw_ddr_32.a:0 "接受莫斯科的条件"
 krcw_ddr_32.b:0 "王座必须有实权，否则不要"
 krcw_ddr_33_t:0 "莫斯科说\"不是现在\""
 krcw_ddr_33_d:0 "特使在莫斯科等了三个星期，最后得到的是外交部副部长的口头答复：最高执政者认为复辟\"时机不成熟\"，德意志的国体问题应当\"在协定的框架内另行讨论\"。没有书面文件。\n\n柏林的保守派明白这句话的意思：只要萨文科夫还在，王座就不会有人坐。"
 krcw_ddr_33.a:0 "等萨文科夫之后再说"
 krcw_ddr_33.b:0 "不等了：邀请王子先回国访问"
 krcw_ddr_33.c:0 "放弃复辟"
 krcw_ddr_moscow_crown_tt:0 "莫斯科是否同意复辟，取决于它对柏林的看法，以及萨文科夫是否还在世。"
 krcw_ddr_34_t:0 "易北河对岸的回信"
 krcw_ddr_34_d:0 "备忘录送到了西德。台尔曼的政府内部也在争吵：接受一个中立统一的德意志，意味着放弃社会主义革命向东扩展的希望；但拒绝，就等于承认易北河的铁丝网将永远存在。西柏林的电台播出了一句谨慎的话：“我们愿意谈。”"
 krcw_ddr_34.a:0 "推进全德对话"
 krcw_ddr_34.b:0 "时机未到，撤回备忘录"
 krcw_ddr_36_t:0 "易北河对岸的拒绝"
 krcw_ddr_36_d:0 "西德政府没有回复备忘录。一个星期后，西德执政党的机关报在头版刊登了备忘录全文，标题是\"将军们的中立\"。社论说，与一个由总参谋部统治的国家谈统一，等于承认它有资格代表东部的工人。"
 krcw_ddr_36.a:0 "再试一次：换一个文官出面"
 krcw_ddr_36.b:0 "公开备忘录的真正作者"
 krcw_ddr_wgr_decides_tt:0 "西德是否愿意谈，取决于它选了什么样的继承人、走哪条德国道路。"
 krcw_ddr_protocol_category:0 "莫斯科议定书"
 krcw_ddr_protocol_category_desc:0 "与莫斯科逐条重谈《柏林条约》的驻军、赔款与军备条款。"
 krcw_ddr_raise_the_division_cap:0 "提高师级限额"
 krcw_ddr_raise_the_division_cap_desc:0 "每一次都要一份新议定书，每一份都证明莫斯科需要东德的师。"
 krcw_ddr_end_the_reparations:0 "终结赔款"
 krcw_ddr_end_the_reparations_desc:0 "拆走的机床该还了。东德的谈判代表带着生产数据去莫斯科，证明一个破产的前线守不住易北河。"
 krcw_ddr_court_the_communes:0 "资助西德的民族派小组"
 krcw_ddr_court_the_communes_desc:0 "通过将军府的特别账户向西德的老兵协会和民族派小组拨款。每一笔钱都可能被西德的情报总局追查到。"
 krcw_eu_secretariat_slight:0 "书记处的冷落"
 krcw_fra_1_t:0 "联合会的代表大会"
 krcw_fra_1_d:0 "劳动交易所的大厅里挤着一千四百名代表：矿工、铁路工人、教师、邮差、阿尔及尔的码头工人和萨克雷的物理学家。开幕式上唱了《国际歌》，然后是三天的程序辩论。\n\n真正的分歧在走廊里。老一代的干部——他们在一九二一年守过街垒，在一九四三年打过莱茵河——认为公社需要的是纪律：敌人就在易北河对岸，现在不是争吵的时候。年轻一些的代表则说，如果连代表大会都不能争吵，那么公社和萨文科夫的国家还有什么区别？"
 krcw_fra_1.a:0 "团结与纪律"
 krcw_fra_1.b:0 "让辩论公开进行"
 krcw_fra_2_t:0 "终身代表"
 krcw_fra_2_d:0 "书记处的统计局交出了一份没人要求过的报告：全国联合会的书记中，百分之六十一已经连续任职十年以上，百分之二十三从一九二一年起就没有离开过办公室。其中一些人的子女，现在也在同一栋楼里工作。\n\n报告被人抄出来贴在了雷诺工厂的布告栏上，旁边有人用粉笔写了一行字：“我们推翻了一个阶级，又造出了一个。”"
 krcw_fra_2.a:0 "这必须改变"
 krcw_fra_2.b:0 "经验不是罪过"
 krcw_fra_3_t:0 "萨克雷的机器"
 krcw_fra_3_d:0 "计算局的机器第一次给出了一份完整的全国平衡表：它建议关闭圣艾蒂安的三座老矿井，把工人转到格勒诺布尔的电气厂去。从数字上看，这无可争议。\n\n圣艾蒂安的矿工大会用了一个晚上讨论这份建议，然后投票否决了它。他们的理由很简单：机器不知道圣艾蒂安有两千户人家，而格勒诺布尔没有给他们盖房子。\n\n现在书记处必须决定：平衡表是一份建议，还是一道命令？"
 krcw_fra_3.a:0 "机器提建议，大会做决定"
 krcw_fra_3.b:0 "数字就是数字"
 krcw_fra_18_t:0 "圣艾蒂安的矿井"
 krcw_fra_18_d0:0 "计算局的平衡表成了命令。三座老矿井的关闭通知贴出去了，可是格勒诺布尔的电气厂只准备了四百套宿舍，而要搬的是两千户人家。\n\n矿工大会没有罢工，只是开会，每晚都开。卢瓦尔省的联合会书记给巴黎写信：再不给答复，他就管不住了。"
 krcw_fra_18_d1:0 "三座老矿井按矿工大会的决议继续开采。煤层越来越薄，每吨煤的成本比阿尔萨斯的新矿高出一截，差价要由全国联合会的账本来补。\n\n计算局的年轻人把这笔差价列在每一期的平衡表上，用红笔圈着。"
 krcw_fra_18.a:0 "先在格勒诺布尔盖房子，再搬人"
 krcw_fra_18.b:0 "按平衡表执行，限期搬迁"
 krcw_fra_18.c:0 "从联合会基金里补贴矿井"
 krcw_fra_18.d:0 "让矿工大会自己拿出转岗方案"
 krcw_fra_saclay_plan:0 "萨克雷平衡表"
 krcw_fra_18_quiet_tt:0 "矿工们按期搬走了，工程师在格勒诺布尔拿到了人手。"
 krcw_fra_18_strike_tt:0 "卢瓦尔的矿工停工了。"
 krcw_fra_loire_strike:0 "卢瓦尔矿工停工"
 krcw_fra_loire_strike_desc:0 "圣艾蒂安的矿工拒绝按期搬迁，关闭的矿井被重新占领。其他矿区的联合会没有加入，但也没有谴责他们。"
 krcw_fra_4_t:0 "约里奥-居里的信"
 krcw_fra_4_d:0 "雷加内试爆三天后，原子能委员会主任弗雷德里克·约里奥-居里给代表大会写了一封公开信。\n\n“我们造出了它，因为我们不能让萨文科夫先造出来。但我们造它的条件是：它永远不会落在任何一座城市上。我请求代表大会把这个条件写进法律——不是为了俄罗斯人，而是为了我们自己，为了让我们的孩子知道，他们的父母在拥有这种力量的时候，没有忘记自己是谁。”"
 krcw_fra_4.a:0 "公开这封信"
 krcw_fra_4.b:0 "归档，暂不公开"
 krcw_fra_5_t:0 "索邦的年轻人"
 krcw_fra_5_d:0 "索邦的学生大会通过了一份十二条的宣言。第一条是“一切权力归于车间大会”，第十二条是“联合会书记的办公室应当改为托儿所”。中间十条的语气逐渐缓和，但意思没变。\n\n几天后，雷诺比扬古工厂的年轻工人投票声援学生。书记处的老干部们看着这份宣言，想起了一些他们自己年轻时写过的东西。"
 krcw_fra_5.a:0 "听听他们怎么说"
 krcw_fra_5.b:0 "关闭文学院"
 krcw_fra_14_t:0 "索邦与比扬古的联合委员会"
 krcw_fra_14_d:0 "书记处派去的代表在索邦的大阶梯教室里坐了两个晚上，记下了学生和雷诺青年工人的全部要求。十二条里有三条是可以马上做的：联合会书记任期上限、车间大会的罢免权、以及工厂与大学之间的交换名额。\n\n学生和工人成立了一个联合委员会，要求在巴黎地区联合会里有自己的席位。"
 krcw_fra_14.a:0 "给联合委员会席位"
 krcw_fra_14.b:0 "只采纳那三条，委员会作为咨询机构"
 krcw_fra_15_t:0 "比扬古停工"
 krcw_fra_15_d:0 "文学院关闭后的第三周，雷诺比扬古的青年工人在午休时关掉了总装线，然后没有再打开。他们的传单只有一句话：“索邦的门什么时候开，我们的机器就什么时候开。”\n\n塞纳河下游的几家厂当天下午也停了工。"
 krcw_fra_15.a:0 "重开文学院，与学生谈判"
 krcw_fra_15.b:0 "停工的人按旷工处理"
 krcw_fra_16_t:0 "文学院重开"
 krcw_fra_16_d:0 "文学院关了五个星期，然后在考试季前悄悄重开。宣言的起草人里有四个被转学到了外省，其余的人回到了教室。雷诺的青年工人开过一次会，没有投票。\n\n巴黎地区联合会在月报里把这件事记为已结束。十二条宣言没有被讨论，也没有被撤回。"
 krcw_fra_16.a:0 "恢复原状"
 krcw_fra_6_t:0 "阿尔及尔代表大会"
 krcw_fra_6_d:0 "阿尔及利亚劳工联合会在阿尔及尔召开特别代表大会。会场上有阿拉伯人、卡拜尔人和欧洲裔工人，他们在大多数问题上意见不一，只有一个问题例外：阿尔及利亚的事情应该由阿尔及利亚人决定。\n\n代表大会的决议写得很客气，但没有给巴黎留下多少余地：要么是公社内部真正的自治——自己的代表大会、自己的预算、自己的语言学校；要么是一个独立的兄弟共和国，与公社同属第三国际。\n\n书记处里有人提醒：雷加内和哈马基尔都在阿尔及利亚境内。也有人回答：一九二一年的宣言上，可没有写“除非那里有试验场”。"
 krcw_fra_6.a:0 "公社之内的自治公社"
 krcw_fra_6.b:0 "一个独立的兄弟共和国"
 krcw_fra_6.c:0 "现在还不是时候"
 krcw_fra_7_t:0 "卡拜利亚的骚乱"
 krcw_fra_7_d:0 "提济乌祖的罢工持续了三个星期，然后变成了别的东西。邮局被占领，公路被封锁，一支地方防卫连拒绝向人群开枪，另一支开了枪。\n\n巴黎的报纸第一次用了一个公社成立以来从未用过的词：“叛乱”。"
 krcw_fra_7.a:0 "重新谈判"
 krcw_fra_7.b:0 "派出联邦防卫军"
 krcw_fra_10_t:0 "国际的邀请"
 krcw_fra_10_d:0 "巴黎的书记处发来一份正式邀请：加入第三国际。条件写得很短——参加清算联盟、共享技术、在受到攻击时互相援助；其余一切，包括走什么样的道路，由本国人民自己决定。"
 krcw_fra_10.a:0 "我们加入"
 krcw_fra_10.b:0 "保持友好，但不加入"
 krcw_fra_12_t:0 "公社八十周年"
 krcw_fra_12_d:0 "一八七一年三月十八日，巴黎的工人拒绝交出蒙马特高地的大炮。那个公社只活了七十二天。\n\n八十年后的同一天，巴黎街头挂满了红旗。拉雪兹神父公墓的公社社员墙前摆满了花，代表大会决定这一天的纪念方式：是一场从巴士底到公社社员墙的游行，还是把公社的全部档案——包括一九二一年之后的——向公众开放？"
 krcw_fra_12.a:0 "从巴士底到公社社员墙"
 krcw_fra_12.b:0 "打开档案"
 krcw_fra_17_t:0 "档案里的名单"
 krcw_fra_17_d:0 "档案开放三个月后，一群历史系学生在书记处一九二七年的卷宗里找到了几份名单。名单上是当年被开除出联合会的无政府主义者和反对派代表，有的名字旁边注着“移送里昂”，有的什么也没注。\n\n名单登上了《工人生活》。几十个家庭写信到书记处，问他们的父亲后来去了哪里。"
 krcw_fra_17.a:0 "全部公布，为被开除的人恢复名誉"
 krcw_fra_17.b:0 "答复家属，但卷宗重新封存"
 krcw_fra_13_t:0 "书记处的争吵"
 krcw_fra_13_d:0 "新章程通过后的第一次书记处会议就吵了起来。南京的代表要求按人口分配表决权——中国的工人比欧洲所有工人加起来还多。伦敦的代表坚持一国一票——否则国际就会变成一个中国的机构，正如它曾经是一个法国的机构。\n\n公社的代表是主席。他的一票将决定下一个十年的国际是什么样子。"
 krcw_fra_13.a:0 "一国一票，但重大事项需南京同意"
 krcw_fra_13.b:0 "按人口分配"
 krcw_fra_13.c:0 "一国一票，没有例外"
 krcw_eng_1_t:0 "工会还是国家"
 krcw_eng_1_d:0 "布莱克浦的舞厅里，辩论持续到深夜。一派认为全国工会代表大会应该成为真正的议会：常设委员会、辩论规则、议长和记录——温特林厄姆称之为“有工资单的威斯敏斯特”。另一派认为这恰恰是危险所在：一旦代表大会像议会，工会就会像政党，而车间代表就会变成选民。\n\n汤姆·曼已经九十多岁了，被人扶上讲台。他只说了一句话：“别忘了我们为什么要成立工会。”然后就下去了。两派都认为他站在自己这一边。"
 krcw_eng_1.a:0 "联邦的道路"
 krcw_eng_1.b:0 "车间代表的道路"
 krcw_eng_2_t:0 "阿尔斯特问题"
 krcw_eng_2_d:0 "一九四七年的《都柏林协定》把阿尔斯特交给了爱尔兰工人共和国。两年过去，贝尔法斯特船厂的新教工人手里还是不列颠造船工人联合会的会员证，养老金也还记在伦敦的账上。都柏林的运输工会要他们换证入会，他们不肯。\n\n造船工人联合会的贝尔法斯特分会写信给联邦代表大会，请伦敦出面。代表大会要决定管不管这件事，怎么管。"
 krcw_eng_2.a:0 "向都柏林提议：双重会籍，养老金两国分担"
 krcw_eng_2.b:0 "给愿意走的人在克莱德和默西安排工作"
 krcw_eng_2.c:0 "这是都柏林的事了"
 krcw_eng_3_t:0 "伦敦关于贝尔法斯特的提议"
 krcw_eng_3_d:0 "不列颠联邦代表大会提议：贝尔法斯特船厂的工人可以同时保留不列颠造船工人联合会和爱尔兰运输工会的会籍，他们的养老金由两国按工龄分担。\n\n运输工会反对。它的书记说，一个船厂里有两个工会，就等于有两个老板。"
 krcw_eng_3.a:0 "接受：两张会员证都算数"
 krcw_eng_3.b:0 "拒绝：一个船厂一个工会"
 krcw_eng_8_t:0 "都柏林的答复"
 krcw_eng_8_d0:0 "都柏林接受了双重会籍。贝尔法斯特的船厂工人可以保留原来的会员证，养老金的分担比例交给两国的联合会去算。运输工会在自己的报纸上登了一篇反对文章，然后照办了。"
 krcw_eng_8_d1:0 "都柏林拒绝了。答复说贝尔法斯特的工人已经是爱尔兰的工人，他们的会籍由爱尔兰的工会决定。答复里还附了运输工会的名册，贝尔法斯特已经换证入会的工人列了好几页。"
 krcw_eng_8.a:0 "通知贝尔法斯特分会"
 krcw_eng_8.b:0 "接受拒绝，事情到此为止"
 krcw_eng_8.c:0 "把这件事提交国际书记处"
 krcw_eng_4_t:0 "来自伦敦的信"
 krcw_eng_4_d:0 "篡位者的代表大会给堪培拉写信了。信里没有提到国王，也没有提到一九二五年，只请求澳大利亚“不要把港口借给俄罗斯的舰队”。\n\n内阁读完后沉默了很久。首相最后说：“至少他们学会了写信。”"
 krcw_eng_4.a:0 "礼貌地回信"
 krcw_eng_4.b:0 "我们不与篡位者通信"
 krcw_eng_5_t:0 "克莱德的车间代表"
 krcw_eng_5_d:0 "格拉斯哥的造船工人罢工了——在一个工人的国家里，对着一个工会的管理委员会。他们的理由是：伦敦的造船联合会把新护航舰的订单全给了泰恩河，克莱德河的船台空了三个月。\n\n伦敦的报纸说这是“地方主义”，格拉斯哥的报纸说这是“一九二五年的精神”。"
 krcw_eng_5.a:0 "坐下来谈"
 krcw_eng_5.b:0 "命令他们复工"
 krcw_eng_5.c:0 "让车间代表委员会处理"
 krcw_eng_10_t:0 "克莱德复工"
 krcw_eng_10_d:0 "复工令下达后的星期一，克莱德的船台上又响起了铆枪声。车间代表们回来了，但他们在复工决议里加了一条：下一批护航舰订单公布之前，造船联合会必须到格拉斯哥来开会。"
 krcw_eng_10.a:0 "同意在格拉斯哥开会"
 krcw_eng_10.b:0 "订单照原计划分配"
 krcw_eng_11_t:0 "泰恩河声援"
 krcw_eng_11_d:0 "复工令没有人执行。三天后，泰恩河的船厂也停了工：拿到订单的那边在声援没拿到订单的这边。纽卡斯尔的车间代表在电报里说，他们不想要从格拉斯哥抢来的活。\n\n两条河上的船台全空了，海军的护航舰计划开始延误。"
 krcw_eng_11.a:0 "把一半订单转给克莱德"
 krcw_eng_11.b:0 "由海军联合会接管船厂"
 krcw_eng_yards_dispute:0 "船厂纠纷"
 krcw_eng_yards_dispute_desc:0 "克莱德与泰恩的船厂由海军联合会接管。船台在开工，车间代表不来开会。"
 krcw_eng_6_t:0 "伦敦要用直布罗陀的港口"
 krcw_eng_6_d:0 "不列颠联邦的代表大会来信，请求让联邦的地中海分舰队使用直布罗陀的港口：船坞由伊比利亚的船厂工人管理，费用由伦敦支付，舰队不在岸上驻兵。\n\n全国劳工联盟的地方委员会意见不一。安达卢西亚的码头工人要这份工钱，加泰罗尼亚的代表说，一支外国舰队停在自己的港口里，不管挂什么旗，都是外国舰队。"
 krcw_eng_6.a:0 "同意，港口由我们的船厂工人管理"
 krcw_eng_6.b:0 "拒绝：港口不停外国军舰"
 krcw_eng_9_t:0 "马德里的答复"
 krcw_eng_9_d0:0 "伊比利亚联邦同意了。港口的船坞由阿尔赫西拉斯的船厂工人管理，联邦的军舰靠港补给和修理，水兵上岸不带武器。"
 krcw_eng_9_d1:0 "伊比利亚联邦拒绝了。答复很客气：伊比利亚欢迎不列颠的商船，但它的港口不停外国军舰。地中海分舰队回到本土的港口。"
 krcw_eng_9.a:0 "分舰队南下"
 krcw_eng_9.b:0 "分舰队留在本土水域"
 krcw_eng_7_t:0 "堪培拉的回信"
 krcw_eng_7_d0:0 "堪培拉的回信很短，签名是外交部的一位次官，称呼是“伦敦的代表大会”——不是“不列颠政府”，也不是“篡位者”。信里说，澳大利亚无意让任何外国舰队使用它的港口。"
 krcw_eng_7_d1:0 "信被原样退回，信封上盖着一个章：“收件人不存在。”"
 krcw_eng_7.a:0 "这是一个开始"
 krcw_eng_7.b:0 "至少他们读了"
 krcw_sov_1_t:0 "最高执政者的健康"
 krcw_sov_1_d:0 "七十四岁的萨文科夫已经很少出现在公开场合。莫斯科的传言说他在写回忆录，说他在克里姆林宫的书房里一坐就是一整天，说他的手抖得握不住钢笔。\n\n国家保卫局局长把一份医生的报告放在国家会议主席的桌上。报告只有三行，最后一行写着：“建议减少工作负荷。”会议主席把它锁进了保险柜——在俄罗斯国，最高执政者的病情是国家机密中最高的一级。\n\n真正的问题不在于他还能活多久，而在于宪法。宪法规定最高执政者由国家会议选举，而国家会议的三分之二是他亲手任命的。他从未指定继承人。有人猜这是疏忽，更多的人认为这是故意的：一个指定了继承人的独裁者，就给自己创造了一个敌人。"
 krcw_sov_1.a:0 "开始准备"
 krcw_sov_1.b:0 "他还会再活二十年"
 krcw_sov_2_t:0 "萨文科夫之死"
 krcw_sov_2_d:0 "一九五一年三月十一日凌晨，鲍里斯·维克托罗维奇·萨文科夫死于脑出血，享年七十四岁。\n\n他的一生几乎无法用一个词概括：社会革命党的恐怖分子，杀死过一位大公和一位内务大臣；克伦斯基的陆军部副部长；科尔尼洛夫的同谋；内战中的白军政委；一九二五年以后“国家民粹主义”的发明者和俄罗斯国的最高执政者。他把俄罗斯从布列斯特-立陶夫斯克的废墟里拖了出来，收复了波罗的海，把德意志皇帝变成了自己的附庸——也建立了国家保卫局、封闭城市和乌拉尔以东的营地。\n\n广播在早上七点播出讣告，随后是四个小时的哀乐。街上的人群沉默地站着，没有人确切知道自己在为什么而沉默——为一个人，还是为一个突然失去了中心的国家。\n\n国家会议在当天下午召开紧急会议。宪法要求在三十日内选出新的最高执政者。会场上有四种声音，而它们谁都没有把握。"
 krcw_sov_2.a:0 "国葬，然后是政治"
 krcw_sov_3_t:0 "莫斯科的哀乐"
 krcw_sov_3_d:0 "莫斯科电台整日播放肖斯塔科维奇。从华沙到德里，协定的首都都降下了半旗；在巴黎、伦敦和南京，人们打开地图册，开始计算一个没有萨文科夫的俄罗斯意味着什么。\n\n第三国际的书记处连夜开会。有人说这是三十年来最好的战略窗口——莫斯科协定暂时失去了它的中心，东欧的将军们各自观望，德意志皇帝不知道该向谁行礼。也有人提醒：一个不确定自己由谁统治的核大国，是世界上最危险的东西。"
 krcw_sov_3.a:0 "（第三国际）战略窗口已经打开"
 krcw_sov_3.b:0 "（莫斯科协定）协定必须维持下去"
 krcw_sov_3.c:0 "一个时代结束了"
 krcw_sov_4_t:0 "国家会议的僵局"
 krcw_sov_4_d:0 "三十天过去了，国家会议投了十一轮票，没有一个候选人得到过半数。\n\n第一派是军方。总参谋长华西列夫斯基从不发表演讲，他的支持者在走廊里说话：俄罗斯需要的是一支现代化的军队和二十年的平静，不是冒险。第二派是经济部与科学院的文官，他们的备忘录写道：军备竞赛我们赢不了，我们只能靠生产率和学校赢。第三派人数最少但声音最响——教会、旧贵族与几个实业家认为，俄罗斯的病根是三十年来没有皇帝。第四派穿着制服在街头集会，他们的口号是“萨文科夫太软弱了”。\n\n第十二轮投票之前，国家会议决定把选举延期，由议长涅克拉索夫暂代最高执政者。所有人都称这是临时安排。"
 krcw_sov_4.a:0 "支持总参谋部：稳定重于一切"
 krcw_sov_4.b:0 "支持文官：靠生产率而不是师的数量"
 krcw_sov_4.c:0 "俄罗斯需要一位皇帝"
 krcw_sov_4.d:0 "萨文科夫太软弱了"
 krcw_sov_5_t:0 "华西列夫斯基的备忘录"
 krcw_sov_5_d:0 "一九五二年春，总参谋长向国家会议提交了一份四十页的文件，题为《论国防的物质基础》。\n\n它没有一句政治口号。它计算了一件事：如果战争在一九五三年爆发，俄罗斯陆军能在多少天内把补给送到莱茵河。答案是永远送不到——因为卡车不够，铁轨的轨距在维斯瓦河变了，而无线电台的数量只有第三国际的三分之一。\n\n“我们在一九四四年靠人和意志赢了，”文件的结论写道，“如果我们打算靠同样的东西赢下一场，我们会输掉俄罗斯。”军官团把这份文件私下传阅了几个月。它比任何演讲都有效：它证明了这个人不打算打仗，也不打算说谎。"
 krcw_sov_5.a:0 "这份文件是对的"
 krcw_sov_5.b:0 "这是失败主义"
 krcw_sov_5.c:0 "如果连军队都这么说，就该由文官来管钱"
 krcw_sov_6_t:0 "索罗金的计划"
 krcw_sov_6_d:0 "皮季里姆·索罗金是个奇怪的候选人：社会学家，前社会革命党人，萨文科夫二十年代的旧同志，科学院院士，从未指挥过任何人。\n\n他在国家会议上讲了四十分钟，没有提到一次军队。他讲的是识字率、婴儿死亡率、每个工人每小时的产出，以及一个他反复使用的词：浪费。他说俄罗斯把国民收入的五分之一花在一支不能打仗的军队上，把最好的一代工程师关在没有名字的城市里造炸弹，而梁赞省的农民还在用一九一三年的犁。\n\n“国家的力量不是它能毁灭什么，”他最后说，“是它能生产什么。”军官们听完这句话之后离场。工程师和统计员留了下来。"
 krcw_sov_6.a:0 "他说得对：靠生产率赢"
 krcw_sov_6.b:0 "一个没有师的候选人当不了最高执政者"
 krcw_sov_6.c:0 "学者的空话"
 krcw_sov_7_t:0 "救主大教堂的密谈"
 krcw_sov_7_d:0 "一九五二年，一群人在莫斯科一座尚未重新开光的教堂里见面：两位主教，三位旧贵族的后裔，乌拉尔钢铁托拉斯的一位董事，以及国家保卫局的一名副局长。\n\n他们的论点在纸面上很有力。俄罗斯国的合法性从来只属于萨文科夫一个人：不是宪法，不是国家会议，是他。他死了，那份合法性就没有继承人。一个共和国需要选举来解释自己为什么统治，而俄罗斯不能举行选举——上一次真正的选举是一九一七年。\n\n“那么就恢复一样不需要解释的东西，”那位副局长说。流亡中长大的弗拉基米尔·基里洛维奇大公从未统治过任何地方，也正因如此，他不欠任何派别人情。\n\n这条路通向哪里，没有人说得清。但它会通向一个与萨文科夫的俄罗斯完全不同的国家。"
 krcw_sov_7.a:0 "听下去"
 krcw_sov_7.b:0 "把名单交给总参谋部"
 krcw_sov_7.c:0 "逮捕所有人"
 krcw_sov_8_t:0 "“最后的清算”"
 krcw_sov_8_d:0 "冯夏茨基的集会在一九五二年夏天挤满了莫斯科的体育场。他的组织有制服、有旗帜、有歌，还有一套简单到无法反驳的历史观。\n\n他说：一九四四年我们的坦克开到了易北河，然后我们停下了，因为萨文科夫老了，害怕了。三十年来我们守着一条铁丝网，看着对面的工团分子把德国、法国、中国、半个美洲变成他们的东西。协定不是一个联盟，是一圈用来替我们挨打的缓冲区。\n\n“最高执政者教过我们，”他在台上说——他确实是萨文科夫的旧部——“恐怖是有用的。他忘了的是，恐怖要用在敌人身上，不是用在我们自己人身上。”\n\n台下的人群里有很多退伍军人。这是最危险的一点：他的话对一支打赢了战争却没有得到和平的军队很有说服力。"
 krcw_sov_8.a:0 "让他讲——他动员了群众"
 krcw_sov_8.b:0 "军队不会把国家交给街头"
 krcw_sov_8.c:0 "取缔那个组织"
 krcw_sov_9_t:0 "森林里的枪声"
 krcw_sov_9_d:0 "继承危机的第二年，波罗的海与芬兰的游击活动突然活跃起来。这不是巧合：森林兄弟读报纸，他们知道莫斯科现在没有人说得上话。\n\n内务部的报告要求增兵三个师。总参谋部反对：三个师换不来一片安静的森林，一九四四年以来的十年已经证明了这件事。文官派提出了另一个方案——一份自治章程：地方议会、母语学校、本地警察，换取承认俄罗斯的国防与外交主权。旧帝国给过芬兰同样的东西，而芬兰一百年没有造反。\n\n这不只是一个治安问题。选哪条路，等于宣布未来的俄罗斯是什么样的国家。"
 krcw_sov_9.a:0 "自治章程"
 krcw_sov_9.b:0 "增兵三个师"
 krcw_sov_9.c:0 "彻底的俄罗斯化"
 krcw_sov_10_t:0 "森林兄弟的答复"
 krcw_sov_10_d0:0 "自治章程实施一年后，里加与塔林的地方议会选出了第一届政府。两个游击队的指挥官带着一百多人走出森林，在议会大楼前交出了步枪，换来了大赦证书。内务部的报告说，爱沙尼亚南部已经八个月没有发生伏击。"
 krcw_sov_10_d1:0 "三个师在森林里驻了一年。游击队的补给线被切断，几个村子被迁到了铁路边上。伏击少了，但村里的人不再和驻军说话。总参谋部认为这已经足够：森林安静了，而安静就是这次增兵的目的。"
 krcw_sov_10_d2:0 "章程通过了，森林却没有空。一部分游击队认为自治是莫斯科的圈套，在考纳斯炸毁了新议会的选举办公室。议会的多数派谴责了爆炸，但拒绝让内务部的部队进城。莫斯科要决定，章程是否还算数。"
 krcw_sov_10_d3:0 "增兵之后，伏击反而多了。维尔纽斯以北的一个营在一个月里损失了四十人，芬兰湾沿岸的铁路桥被炸了两次。被迁走的村民成了游击队最好的征兵站。"
 krcw_sov_10.a:0 "章程在起作用，把它推广到其他省份"
 krcw_sov_10.b:0 "部队留下，但开始撤回一个师"
 krcw_sov_10.c:0 "让议会自己处理那几个激进分子"
 krcw_sov_10.d:0 "再调两个师进森林"
 krcw_sov_21_t:0 "稳定派上台"
 krcw_sov_21_d:0 "一九五三年二月，国家会议进行第十二轮投票，以三分之二多数选举亚历山大·米哈伊洛维奇·华西列夫斯基为俄罗斯国最高执政者。\n\n就职仪式只用了十九分钟，没有阅兵和集会。他在演说中感谢国家会议，提到萨文科夫一次，然后宣布三项措施：军队按《论国防的物质基础》改组，封闭城市的预算接受审计，波罗的海各省的自治章程付诸实施。\n\n第三国际的分析家认为，新政府不搞个人崇拜和清洗，在谈判中会比萨文科夫更难应付，但也更少冒险。\n\n冯夏茨基被派往远东视察边防。"
 krcw_sov_21.a:0 "不要冒险"
 krcw_sov_22_t:0 "文官的俄罗斯"
 krcw_sov_22_d:0 "出乎所有人预料，一九五三年的国家会议选出了一位教授。\n\n索罗金的第一份预算把国防开支削减了七分之一，把差额投进了拖拉机厂、师范学校和铁路的标准轨距改造。军官团愤怒，但军官团被华西列夫斯基的那份备忘录堵住了嘴——那份文件是他们自己传阅的，而它的结论恰好支持索罗金。\n\n索罗金对国家会议说，协定与国际的对抗要持续一代人，赢的一方是工业底子更厚的一方。削下来的军费在五年后会变成更多的坦克厂。巴黎的分析员认为这个判断比萨文科夫的任何一次演讲都更危险。"
 krcw_sov_22.a:0 "先把工业底子打厚"
 krcw_sov_23_t:0 "皇帝回来了"
 krcw_sov_23_d:0 "一九五三年八月，救主大教堂重新开光。九月，弗拉基米尔·基里洛维奇在莫斯科加冕为全俄罗斯皇帝。\n\n典礼严格按照一八九六年的礼仪书进行，只是参加的人不太一样：将军们穿着新设计的礼服，主教们的法衣是从博物馆借的，而为这场加冕付钱的是乌拉尔的钢铁托拉斯。国家会议没有被解散，只是改称帝国杜马；国家保卫局没有被裁撤，只是换了一套徽章。\n\n教会与旧贵族欢呼。工厂沉默。波罗的海的省份沉默——它们刚刚得知自治章程被无限期搁置，因为“帝国的统一不容分割”。\n\n第三国际的反应几乎是欣喜的：三十年来它一直说协定是反动派的联盟，现在莫斯科替它证明了这一点。而在莫斯科的走廊里，那些把皇帝请回来的人开始发现一个问题——皇帝不是一件可以随时放回博物馆的展品。"
 krcw_sov_23.a:0 "上帝保佑皇帝"
 krcw_sov_24_t:0 "极端派的胜利"
 krcw_sov_24_d:0 "一九五三年的选举是在国家保卫局的包围下进行的。这一次，包围它的那部分保卫局属于冯夏茨基。\n\n新的最高执政者在就职演说里用了四十分钟谈论一九四四年的错误。随后的十八个月里：保卫局扩编三倍；乌拉尔以东建起新的营地；国家会议里投过反对票的二十六个人先后“因健康原因”退休；波罗的海的自治章程被撕毁，芬兰进入军事管制；《第一号工程》的预算翻了一倍。\n\n广播里开始出现一个新词：“最后的清算”。它从未被正式定义，而这正是它最有效的地方。\n\n在巴黎，第三国际的书记处连续开了三天会，最后决定的第一件事是把西柏林的守备部队增加一倍。三十年来的冷战第一次看上去不像一场僵局，而像一段倒计时。"
 krcw_sov_24.a:0 "最后的清算"
 krcw_sov_25_t:0 "莫斯科的新主人"
 krcw_sov_25_d0:0 "华西列夫斯基元帅的俄罗斯不会在半夜发动战争，但它也不会在任何谈判桌上让出一寸。这是一个冷静的对手——冷静的对手比狂热的对手更持久。"
 krcw_sov_25_d1:0 "一位社会学家统治着俄罗斯，并且削减了国防预算。巴黎的分析家们反复检查了这份情报三次，仍然不敢相信。"
 krcw_sov_25_d2:0 "莫斯科有了一位皇帝。第三国际三十年来的宣传第一次不需要修辞：协定确实是一个反动派的联盟。"
 krcw_sov_25_d3:0 "新的最高执政者认为一九四四年停在易北河边是历史性的错误。他打算纠正它。西柏林的守备部队今夜增加了一倍。"
 krcw_sov_25_d4:0 "四年的空位期结束了。莫斯科终于有了一个能签字的人。"
 krcw_sov_25.a:0 "（第三国际）重新评估一切"
 krcw_sov_25.b:0 "（莫斯科协定）协定还在"
 krcw_sov_25.c:0 "继续观望"
 krcw_sov_succession_category:0 "继承斗争"
 krcw_sov_succession_category_desc:0 "萨文科夫从未指定继承人。国家会议里的四个派别早在他生前就在为那一天布局，他死后，三分之二的选票将决定谁出任最高执政者。"
