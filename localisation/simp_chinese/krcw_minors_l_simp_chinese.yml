 KRCW_L_AUS_desc:0 "1944年国际的军队翻过阿尔卑斯山，解放了萨尔茨堡、蒂罗尔、施蒂利亚、克恩滕、福拉尔贝格和上奥地利，维也纳却落在俄国人手里，恩斯河成了分界线。1945年春，西部各州在萨尔茨堡组成临时政府，由一九一六年刺杀首相施蒂尔格克的弗里德里希·阿德勒主持，伦纳和克拉尔都在内阁里。共和国是第三国际的成员，首都暂设萨尔茨堡，宪法里写着维也纳是它的首都。"
