# krcw: years paced
 KRCW_P_SEN_long:0 "非洲社会主义运动"
 KRCW_P_SEN:0 "社会主义运动"
 KRCW_L_SEN:0 "拉明·盖伊"
 KRCW_L_SEN_desc:0 "1942年阿尔及尔陷落后，国民法国残部退守达喀尔。1943年蒂亚罗耶的塞内加尔步兵兵变，与达喀尔码头工会联手推翻了殖民当局；1945年巴马科制宪会议成立西非联邦，冈比亚、塞拉利昂与已被伊比利亚放弃的几内亚比绍、佛得角先后加入。1946年联邦加入第三国际，巴黎的顾问和清算联盟的贷款随之而来。"
 KRCW_SEN:0 "西非联邦"
 KRCW_SEN_DEF:0 "西非联邦"
 KRCW_SEN_ADJ:0 "西非"
 KRCW_P_RCG_long:0 "黑非洲社会进化运动"
 KRCW_P_RCG:0 "社会进化运动"
 KRCW_L_RCG:0 "巴泰勒米·博甘达"
 KRCW_L_RCG_desc:0 "1919年法属赤道非洲的大部分被割给德国并入中非帝国，乍得北部则留在国民法国手中。1944年两个宗主国都已不复存在，布拉柴维尔、班吉、利伯维尔与拉密堡的地方议会联合成立赤道非洲联邦；伊比利亚放弃的木尼河与圣多美随后加入。"
 KRCW_RCG:0 "赤道非洲联邦"
 KRCW_RCG_DEF:0 "赤道非洲联邦"
 KRCW_RCG_ADJ:0 "赤道非洲"
 KRCW_P_DOC_long:0 "巴刚果人协会"
 KRCW_P_DOC:0 "巴刚果协会"
 KRCW_L_DOC:0 "约瑟夫·卡萨武布"
 KRCW_L_DOC_desc:0 "刚果曾是中非帝国的经济心脏。1944年德国殖民军瓦解，利奥波德维尔的巴刚果人协会与金班古教会接管了下刚果，加丹加铜矿则落入矿工委员会之手；1946年的《利奥波德维尔宪章》把两股力量勉强捏合成一个共和国。"
 KRCW_DOC:0 "刚果共和国"
 KRCW_DOC_DEF:0 "刚果共和国"
 KRCW_DOC_ADJ:0 "刚果"
 KRCW_P_CMR_long:0 "喀麦隆人民联盟"
 KRCW_P_CMR:0 "人民联盟"
 KRCW_L_CMR:0 "鲁本·乌姆·尼奥贝"
 KRCW_L_CMR_desc:0 "喀麦隆是德国最早的非洲殖民地之一。1944年杜阿拉的码头与铁路工会率先起事，工会活动家出身的乌姆·尼奥贝以“统一的喀麦隆”为号召建立共和国，第三国际的援助让它成为非洲最左倾的政府之一。"
 KRCW_CMR:0 "喀麦隆共和国"
 KRCW_CMR_DEF:0 "喀麦隆共和国"
 KRCW_CMR_ADJ:0 "喀麦隆"
 KRCW_P_NGA_long:0 "尼日利亚国民会议"
 KRCW_P_NGA:0 "国民会议"
 KRCW_L_NGA:0 "纳姆迪·阿齐基韦"
 KRCW_L_NGA_desc:0 "1919年英国在停战谈判中被迫把尼日利亚割让给德国。1944年中非帝国瓦解后，拉各斯的阿齐基韦与北方的埃米尔们签订《卡诺协议》，以联邦形式保住了国家统一——但南北之间的裂痕从未愈合。"
 KRCW_NGA:0 "尼日利亚联邦"
 KRCW_NGA_DEF:0 "尼日利亚联邦"
 KRCW_NGA_ADJ:0 "尼日利亚"
 KRCW_P_GHA_long:0 "人民大会党"
 KRCW_P_GHA:0 "人民大会党"
 KRCW_L_GHA:0 "克瓦米·恩克鲁玛"
 KRCW_L_GHA_desc:0 "黄金海岸在1919年落入德国之手。1944年后，从战火中的美国归来的恩克鲁玛组建人民大会党夺取政权，以古代西非帝国之名把国家命名为加纳。"
 KRCW_GHA:0 "加纳共和国"
 KRCW_GHA_DEF:0 "加纳共和国"
 KRCW_GHA_ADJ:0 "加纳"
 KRCW_P_TOG_long:0 "多哥统一委员会"
 KRCW_P_TOG:0 "统一委员会"
 KRCW_L_TOG:0 "西尔瓦纳斯·奥林匹欧"
 KRCW_L_TOG_desc:0 "多哥兰1919年完整地回到德国手中。1944年它成了中非帝国唯一和平交出政权的省份——商人出身的奥林匹欧说服了留守的德国官员，东西多哥从此统一。"
 KRCW_TOG:0 "多哥共和国"
 KRCW_TOG_DEF:0 "多哥共和国"
 KRCW_TOG_ADJ:0 "多哥"
 KRCW_P_KEN_long:0 "东非非洲人联盟"
 KRCW_P_KEN:0 "东非联盟"
 KRCW_L_KEN:0 "乔莫·肯雅塔"
 KRCW_L_KEN_desc:0 "德属东非是中非帝国的心脏。1944年春德皇带着帝国政府逃到达累斯萨拉姆，想在这里继续战争；同年秋殖民军瓦解，总督投降，德皇转往瑞典。此后，在伦敦工团主义者中间生活了十五年的肯雅塔回国，与桑给巴尔苏丹及坦噶尼喀的合作社运动一起建立东非联邦，首都设在内罗毕。"
 KRCW_KEN:0 "东非联邦"
 KRCW_KEN_DEF:0 "东非联邦"
 KRCW_KEN_ADJ:0 "东非"
 KRCW_P_UGA_long:0 "布干达议会"
 KRCW_P_UGA:0 "卢基科"
 KRCW_L_UGA:0 "穆特萨二世"
 KRCW_L_UGA_desc:0 "德国人一直通过布干达国王间接统治乌干达。1944年殖民军撤走后，年轻的卡巴卡穆特萨二世以布干达为核心建立了乌干达王国，拒绝加入东非联邦。"
 KRCW_UGA:0 "乌干达王国"
 KRCW_UGA_DEF:0 "乌干达王国"
 KRCW_UGA_ADJ:0 "乌干达"
 KRCW_P_RWA_long:0 "姆瓦米王廷"
 KRCW_P_RWA:0 "王廷"
 KRCW_L_RWA:0 "穆塔拉三世"
 KRCW_L_RWA_desc:0 "这两个古老的高原王国在德国统治下保住了王位。1944年后，卢旺达的姆瓦米穆塔拉三世以共主身份统治两国。"
 KRCW_RWA:0 "卢旺达-乌隆迪王国"
 KRCW_RWA_DEF:0 "卢旺达-乌隆迪王国"
 KRCW_RWA_ADJ:0 "卢旺达"
 KRCW_P_ZAM_long:0 "非洲人国民大会"
 KRCW_P_ZAM:0 "国民大会"
 KRCW_L_ZAM:0 "哈里·恩昆布拉"
 KRCW_L_ZAM_desc:0 "中非帝国把北罗得西亚铜矿带与尼亚萨兰合为“赞比西省”。1944年铜矿带罢工委员会、巴罗策王国与尼亚萨兰的非洲人协会共同组建联邦；1946年伊比利亚放弃莫桑比克后，贝拉与洛伦索马贵斯的码头工会投票加入，给了铜矿一个出海口。赤色矿工工会至今仍是政府的心腹之患。"
 KRCW_ZAM:0 "赞比西联邦"
 KRCW_ZAM_DEF:0 "赞比西联邦"
 KRCW_ZAM_ADJ:0 "赞比西"
 KRCW_P_SAF_long:0 "重建国民党"
 KRCW_P_SAF:0 "国民党"
 KRCW_L_SAF:0 "丹尼尔·马兰"
 KRCW_L_SAF_desc:0 "南非在大英帝国崩溃后独立，并在1930年代吞并了罗得西亚与各高级专员领地。1944年它趁中非帝国瓦解占领了西南非洲。马兰的国民党于1948年上台：一个被新独立黑人国家包围的白人少数政权，同时拒绝了澳大利亚流亡朝廷和两大阵营的拉拢。"
 KRCW_SAF:0 "南非联邦"
 KRCW_SAF_DEF:0 "南非联邦"
 KRCW_SAF_ADJ:0 "南非"
 KRCW_P_ANG_long:0 "安哥拉解放委员会"
 KRCW_P_ANG:0 "解放委员会"
 KRCW_L_ANG:0 "阿戈斯蒂尼奥·内图"
 KRCW_L_ANG_desc:0 "1946年葡萄牙革命并入伊比利亚联邦，全国劳工联合会政府宣布放弃全部殖民地。罗安达的混血知识分子与本格拉铁路工人组成解放委员会接管政权，年轻的医生内图是委员会的代言人。"
 KRCW_ANG:0 "安哥拉共和国"
 KRCW_ANG_DEF:0 "安哥拉共和国"
 KRCW_ANG_ADJ:0 "安哥拉"
 KRCW_P_ETH_long:0 "皇室"
 KRCW_P_ETH:0 "皇室"
 KRCW_L_ETH:0 "海尔·塞拉西"
 KRCW_L_ETH_desc:0 "埃塞俄比亚在世界大战中保持中立。1944年德属吉布提随中非帝国一同失守，海尔·塞拉西的军队开进塔朱拉湾，帝国终于有了自己的出海口；阿法尔苏丹随后向皇帝称臣。"
 KRCW_ETH:0 "埃塞俄比亚帝国"
 KRCW_ETH_DEF:0 "埃塞俄比亚帝国"
 KRCW_ETH_ADJ:0 "埃塞俄比亚"
 KRCW_P_SOM_long:0 "索马里青年联盟"
 KRCW_P_SOM:0 "青年联盟"
 KRCW_L_SOM:0 "阿卜杜勒卡迪尔·萨卡乌丁"
 KRCW_L_SOM_desc:0 "英、意两国的革命让索马里人在1920年代就摆脱了殖民统治。索马里青年联盟在摩加迪沙执政，梦想把欧加登与吉布提也纳入“大索马里”。"
 KRCW_SOM:0 "索马里共和国"
 KRCW_SOM_DEF:0 "索马里共和国"
 KRCW_SOM_ADJ:0 "索马里"
 KRCW_P_LBA_long:0 "赛努西教团"
 KRCW_P_LBA:0 "赛努西"
 KRCW_L_LBA:0 "伊德里斯一世"
 KRCW_L_LBA_desc:0 "昔兰尼加的赛努西埃米尔国在奥斯曼帝国1944年崩溃后接管了的黎波里塔尼亚，伊德里斯一世称利比亚国王。"
 KRCW_LBA:0 "利比亚王国"
 KRCW_LBA_DEF:0 "利比亚王国"
 KRCW_LBA_ADJ:0 "利比亚"
 KRCW_P_TUN_long:0 "社会主义宪政党"
 KRCW_P_TUN:0 "宪政党"
 KRCW_L_TUN:0 "哈比卜·布尔吉巴"
 KRCW_L_TUN_desc:0 "1942年公社军队攻克突尼斯城，国民法国在北非的统治就此终结。巴黎没有吞并突尼斯，而是把政权交给了新宪政党与哈希德的突尼斯总工会。1946年布尔吉巴的党改名社会主义宪政党，突尼斯加入第三国际，总工会的人掌管劳动和计划两个部。这是公社“反殖民”的招牌，也是阿尔及利亚人质问巴黎的理由。"
 KRCW_TUN:0 "突尼斯共和国"
 KRCW_TUN_DEF:0 "突尼斯共和国"
 KRCW_TUN_ADJ:0 "突尼斯"
 KRCW_P_MOR_long:0 "马赫曾"
 KRCW_P_MOR:0 "马赫曾"
 KRCW_L_MOR:0 "穆罕默德五世"
 KRCW_L_MOR_desc:0 "1936年伊比利亚革命后，西班牙放弃了北部保护地；1942年国民法国崩溃，穆罕默德五世在拉巴特宣布摩洛哥完全独立，丹吉尔国际区随后被收回。"
 KRCW_MOR:0 "摩洛哥苏丹国"
 KRCW_MOR_DEF:0 "摩洛哥苏丹国"
 KRCW_MOR_ADJ:0 "摩洛哥"
 KRCW_P_EGY_long:0 "王室"
 KRCW_P_EGY:0 "王室"
 KRCW_L_EGY:0 "法鲁克一世"
 KRCW_L_EGY_desc:0 "英国革命后，埃及于1920年代摆脱了保护国地位，并独占了原英埃共管的苏丹。法鲁克国王的宫廷腐败而奢靡，自由军官们已在暗中串联。"
 KRCW_EGY:0 "埃及与苏丹王国"
 KRCW_EGY_DEF:0 "埃及与苏丹王国"
 KRCW_EGY_ADJ:0 "埃及"
 KRCW_P_LIB_long:0 "真正辉格党"
 KRCW_P_LIB:0 "辉格党"
 KRCW_L_LIB:0 "威廉·杜伯曼"
 KRCW_L_LIB_desc:0 "非洲最古老的共和国，美国内战使它失去了唯一的大国靠山，只能在新独立的邻国中间小心周旋。"
 KRCW_LIB:0 "利比里亚共和国"
 KRCW_LIB_DEF:0 "利比里亚共和国"
 KRCW_LIB_ADJ:0 "利比里亚"
 KRCW_P_MAD_long:0 "社会民主党"
 KRCW_P_MAD:0 "社会民主党"
 KRCW_L_MAD:0 "菲利贝尔·齐拉纳纳"
 KRCW_L_MAD_desc:0 "马达加斯加与马斯卡林群岛在1919年被割给德国作为印度洋海军基地。1944年塔那那利佛起义赶走了德国驻军，科摩罗、毛里求斯、塞舌尔与留尼汪的代表随后加入共和国。"
 KRCW_MAD:0 "马达加斯加共和国"
 KRCW_MAD_DEF:0 "马达加斯加共和国"
 KRCW_MAD_ADJ:0 "马达加斯加"
 KRCW_P_ISR_long:0 "民族协商会议"
 KRCW_P_ISR:0 "协商会议"
 KRCW_L_ISR:0 "穆萨·阿拉米"
 KRCW_L_ISR_desc:0 "奥斯曼帝国末年，德国庇护下的耶路撒冷独立区容纳了阿拉伯显贵与犹太移民两个社会。1944年帝国崩溃，双方在雅法签订《雅法协定》，建立了一个脆弱的二元民族共和国，由温和派律师穆萨·阿拉米主持。没有英国委任统治，也没有大屠杀。"
 KRCW_ISR:0 "巴勒斯坦共和国"
 KRCW_ISR_DEF:0 "巴勒斯坦共和国"
 KRCW_ISR_ADJ:0 "巴勒斯坦"
 KRCW_P_JOR_long:0 "哈希姆王室"
 KRCW_P_JOR:0 "王室"
 KRCW_L_JOR:0 "阿卜杜拉一世"
 KRCW_L_JOR_desc:0 "1944年奥斯曼帝国崩溃，伊本·沙特吞并了汉志，麦加的哈希姆谢里夫家族北逃。阿卜杜拉在安曼收拢贝都因部落，建立了约旦王国。"
 KRCW_JOR:0 "约旦哈希姆王国"
 KRCW_JOR_DEF:0 "约旦哈希姆王国"
 KRCW_JOR_ADJ:0 "约旦"
 KRCW_P_IRQ_long:0 "卫国同盟"
 KRCW_P_IRQ:0 "卫国同盟"
 KRCW_L_IRQ:0 "努里·赛义德"
 KRCW_L_IRQ_desc:0 "1944年巴格达的奥斯曼军官们发动政变，宣布伊拉克独立。前奥斯曼参谋军官努里·赛义德领导着这个由军官团主导的共和国，基尔库克油田使它富有而不安。"
 KRCW_IRQ:0 "伊拉克共和国"
 KRCW_IRQ_DEF:0 "伊拉克共和国"
 KRCW_IRQ_ADJ:0 "伊拉克"
 KRCW_P_SYR_long:0 "国民联盟"
 KRCW_P_SYR:0 "国民联盟"
 KRCW_L_SYR:0 "舒克里·库瓦特利"
 KRCW_L_SYR_desc:0 "1944年大马士革起义驱逐了奥斯曼总督。库瓦特利的国民联盟宣布成立叙利亚共和国，并宣称整个“大叙利亚”都应归于大马士革。"
 KRCW_SYR:0 "叙利亚共和国"
 KRCW_SYR_DEF:0 "叙利亚共和国"
 KRCW_SYR_ADJ:0 "叙利亚"
 KRCW_P_LEB_long:0 "宪政集团"
 KRCW_P_LEB:0 "宪政集团"
 KRCW_L_LEB:0 "贝沙拉·胡里"
 KRCW_L_LEB_desc:0 "黎巴嫩山区的宗派领袖们在奥斯曼帝国崩溃时签订《国民公约》，以宗派分权的方式建立了共和国。"
 KRCW_LEB:0 "黎巴嫩共和国"
 KRCW_LEB_DEF:0 "黎巴嫩共和国"
 KRCW_LEB_ADJ:0 "黎巴嫩"
 KRCW_P_SAU_long:0 "沙特王室"
 KRCW_P_SAU:0 "王室"
 KRCW_L_SAU:0 "阿卜杜勒阿齐兹·伊本·沙特"
 KRCW_L_SAU_desc:0 "伊本·沙特趁奥斯曼帝国1944年崩溃吞并了汉志与沙马尔，统一了阿拉伯半岛的大部分。"
 KRCW_SAU:0 "沙特阿拉伯王国"
 KRCW_SAU_DEF:0 "沙特阿拉伯王国"
 KRCW_SAU_ADJ:0 "沙特"
 KRCW_P_YEM_long:0 "伊玛目王廷"
 KRCW_P_YEM:0 "王廷"
 KRCW_L_YEM:0 "艾哈迈德·本·叶海亚"
 KRCW_L_YEM_desc:0 "英国革命后亚丁失去驻军，也门伊玛目于1920年代收回了亚丁与哈德拉毛。"
 KRCW_YEM:0 "也门穆塔瓦基利亚王国"
 KRCW_YEM_DEF:0 "也门王国"
 KRCW_YEM_ADJ:0 "也门"
 KRCW_P_OMA_long:0 "苏丹宫廷"
 KRCW_P_OMA:0 "宫廷"
 KRCW_L_OMA:0 "赛义德·本·泰穆尔"
 KRCW_L_OMA_desc:0 "内陆由伊玛目国控制，苏丹只统治海岸。"
 KRCW_OMA:0 "马斯喀特和阿曼苏丹国"
 KRCW_OMA_DEF:0 "马斯喀特和阿曼"
 KRCW_OMA_ADJ:0 "阿曼"
 KRCW_P_SMI_long:0 "伊巴德教团"
 KRCW_P_SMI:0 "伊巴德"
 KRCW_L_SMI:0 "穆罕默德·哈利利"
 KRCW_L_SMI_desc:0 "1920年的《锡卜条约》确立了伊玛目国对内陆的统治。"
 KRCW_SMI:0 "阿曼伊玛目国"
 KRCW_SMI_DEF:0 "阿曼伊玛目国"
 KRCW_SMI_ADJ:0 "伊玛目国"
 KRCW_P_DUB_long:0 "酋长会议"
 KRCW_P_DUB:0 "酋长会议"
 KRCW_L_DUB:0 "赛义德·本·马克图姆"
 KRCW_L_DUB_desc:0 "奥斯曼帝国崩溃后，海湾沿岸的小酋长国为免被沙特吞并，于1945年在迪拜结成联邦。阿布扎比也借机摆脱了沙特的宗主权。"
 KRCW_DUB:0 "海湾酋长国联邦"
