l_simp_chinese:
# krcw: years paced
 krcw_pace.1.t:0 "俄亥俄河上的交火"
 krcw_pace.1.d:0 "密西西比停火线又出事了：一队汽艇在夜里越过河心线，两岸的哨所对射了一个小时。没有宣战，但停火线又紧了一分。"
 krcw_pace.2.t:0 "柏林走廊的刁难"
 krcw_pace.2.d:0 "东德的检查站又扣下了一列驶往西柏林的货车，理由是“文件不全”。西柏林的煤仓又少了一天的存量。"
 krcw_pace.4.t:0 "海峡里的炮艇"
 krcw_pace.4.d:0 "福建舰队和台湾的日本巡逻艇在海峡中线附近相遇，互相用探照灯照了半夜。青岛委员会又收到了两份抗议。"
 krcw_pace.3.t:0 "喜马拉雅的巡逻队"
 krcw_pace.3.d:0 "印度和中国的巡逻队在一条谁也没划清的山脊上相遇，对峙了半天才各自后撤。拉萨的贵族们在听着风声。"
 krcw_pace.1.a:0 "停火线又紧了一分。"
 krcw_pace.2.a:0 "停火线又紧了一分。"
 krcw_pace.3.a:0 "停火线又紧了一分。"
 krcw_pace.4.a:0 "停火线又紧了一分。"
