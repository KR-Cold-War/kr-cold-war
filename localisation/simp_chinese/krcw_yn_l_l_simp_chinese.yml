l_simp_chinese:
# krcw: years paced
 krcw_yn.1.t:0 "独立的非洲"
 krcw_yn.1.d:0 "柏林与阿尔及尔的殖民帝国1942年崩溃，留下了数十个新国家。塞内加尔、刚果、肯尼亚——它们的边界是用直尺在地图上画出来的，但它们的独立是自己赢得的。"
 krcw_yn.1.a:0 "新世界的第一步。"
 krcw_yn.2.t:0 "雅法协定"
 krcw_yn.2.d:0 "奥斯曼帝国1944年崩溃后，耶路撒冷的阿拉伯显贵与犹太移民在雅法签订协定，建立了一个脆弱的二元民族共和国。"
 krcw_yn.2.a:0 "两个民族，一个国家。"
 krcw_yn.3.t:0 "东南亚的新格局"
 krcw_yn.3.d:0 "德属东印度1944年失守后，印度尼西亚与马来亚相继独立。荷兰革命后阿姆斯特丹承认了苏加诺的共和国，马来亚则吸收了新加坡与马六甲。"
 krcw_yn.3.a:0 "从殖民地到共和国。"
 krcw_yn.4.t:0 "美洲的中立国家"
 krcw_yn.4.d:0 "美国内战后，拉丁美洲各国在两个集团之间保持着谨慎的中立。桑地诺的尼加拉瓜是唯一的工团主义国家，智利社会主义共和国拒绝加入任何阵营。"
 krcw_yn.4.a:0 "不属于巴黎，也不属于莫斯科。"
 krcw_yn.10.t:0 "铜带的工人委员会"
 krcw_yn.10.d:0 "铜带的矿工们在1949年独立时宣誓效忠卢萨卡。但他们的委员会一直记得1946年赞比西亚的矿工起义——以及卡萨伏布的士兵是怎么镇压它的。"
 krcw_yn.10.a:0 "委员会的记忆很长。"
 krcw_yn.11.t:0 "加丹加的矿工"
 krcw_yn.11.d:0 "利卡西与科卢韦齐的矿工罢工了。他们要求直选、工人参与管理、停止开采铜矿——以及赞比西联邦承认他们的委员会。"
 krcw_yn.11.a:0 "这是叛乱。"
 krcw_yn.11.b:0 "承认他们的要求。"
 krcw_yn.12.t:0 "加丹加苏维埃"
 krcw_yn.12.d:0 "委员会宣布成立\"加丹加矿工苏维埃\"，卢萨卡的政府已经失去了对铜带南部的控制。"
 krcw_yn.12.a:0 "派军队收复它。"
 krcw_yn.12.b:0 "让它独立。"
 krcw_yn.20.t:0 "雅法协定的压力"
 krcw_yn.20.d:0 "大马士革的库瓦特利不承认巴勒斯坦。他说，\"大叙利亚\"从幼发拉底河延伸到地中海，雅法是它的一部分。"
 krcw_yn.20.a:0 "外交抗议。"
 krcw_yn.21.t:0 "叙利亚的要求"
 krcw_yn.21.d:0 "大马士革的报纸开始刊登雅法的地图，标题是\"叙利亚的南方省\"。安曼的哈希姆国王也在打东耶路撒冷的主意。"
 krcw_yn.21.a:0 "向法国求助。"
 krcw_yn.21.b:0 "向莫斯科求助。"
 krcw_yn.21.c:0 "我们自己守住雅法。"
 krcw_yn.22.t:0 "巴黎的调停"
 krcw_yn.22.d:0 "巴黎或莫斯科派出了调解代表团。库瓦特利在压力下同意了停火，叙利亚撤回了对雅法的主权声索。"
 krcw_yn.22.a:0 "雅法协定幸存了下来。"
 krcw_yn.23.t:0 "叙利亚的军队"
 krcw_yn.23.d:0 "大马士革对调停不感兴趣。叙利亚的装甲师正在向边境集结。"
 krcw_yn.23.a:0 "守住雅法。"
 krcw_yn.30.t:0 "自由军官"
 krcw_yn.30.d:0 "苏伊士运河公司的股票仍在巴黎人手里，英国人虽然走了，但他们的银行家还留在开罗。年轻的军官们在军营里小声谈论着共和。"
 krcw_yn.30.a:0 "法鲁克的统治稳固。"
 krcw_yn.31.t:0 "军官的政变"
 krcw_yn.31.d:0 "1952年7月，纳吉布上校的坦克开进了阿布丁宫。法鲁克在亚历山大港登船流亡。军官委员会宣布成立共和国。"
 krcw_yn.31.a:0 "支持军官委员会。"
 krcw_yn.31.b:0 "镇压他们。"
 krcw_yn.40.t:0 "威特沃特斯兰德的罢工"
 krcw_yn.40.d:0 "约翰内斯堡的黑人工会罢工了。他们要求同工同酬、废除通行证法与投票权。"
 krcw_yn.40.a:0 "镇压罢工。"
 krcw_yn.40.b:0 "和工会谈判。"
 krcw_yn.41.t:0 "青年国家的制裁"
 krcw_yn.41.d:0 "塞内加尔、刚果与肯尼亚宣布对南非实施贸易禁运。他们在青年国家会议上谴责约翰内斯堡的\"种族压迫\"。"
 krcw_yn.41.a:0 "我们不需要他们的道德说教。"
 krcw_yn.50.t:0 "新加坡的华人工会"
 krcw_yn.50.d:0 "新加坡的华人码头工人、店员与学生要求自治。他们说，马来亚联邦是马来人的联邦，不是华人的。"
 krcw_yn.50.a:0 "镇压他们。"
 krcw_yn.50.b:0 "让新加坡自治。"
 krcw_yn.60.t:0 "科威特与亚赫拉"
 krcw_yn.60.d:0 "巴格达的报纸开始刊登伊拉克的地图，把科威特标为\"第19省\"。努里·赛义德说，科威特埃米尔国是奥斯曼帝国的遗留物，应该回归共和国。"
 krcw_yn.60.a:0 "这是我们的领土。"
 krcw_yn.61.t:0 "波斯湾的紧张"
 krcw_yn.61.d:0 "科威特埃米尔向莫斯科与利雅得求援。萨文科夫的俄罗斯警告巴格达，伊本·沙特也派出了使节。"
 krcw_yn.61.a:0 "撤回声索。"
 krcw_yn.61.b:0 "出兵科威特。"
