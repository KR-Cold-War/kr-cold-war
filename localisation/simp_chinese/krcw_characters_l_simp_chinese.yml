 krcw_fra_head_of_internationale:0 "国际的首脑"
 krcw_fra_head_of_internationale_desc:0 "巴黎是世界革命的首都。第三国际总书记处、巴黎清算联盟与跨国产业联合会的总部都设在这里——公社既是灯塔，也是账房。"
 krcw_ti_bureaucratization:0 "革命官僚化"
 krcw_ti_bureaucratization_desc:0 "革命已过去三十年，工会联合会的办公室越来越大，车间里的声音却越来越远。基层开始抱怨“书记处的工团主义”。"
 krcw_eng_red_fleet:0 "红色舰队"
 krcw_eng_red_fleet_desc:0 "皇家海军在1925年升起了红旗。不列颠联邦继承了世界上最好的船坞与最骄傲的水兵。"
 krcw_wgr_front_state:0 "前线国家"
 krcw_wgr_front_state_desc:0 "易北河对岸就是施莱歇尔的“民族共和国”和俄罗斯的坦克。西柏林是一座被铁丝网包围的孤岛。"
 krcw_ohio_line:0 "俄亥俄停火线"
 krcw_ohio_line_desc:0 "1946年《圣路易斯停火协定》把美国一分为二。沿着阿巴拉契亚、俄亥俄河与密西西比河，两支军队隔着沙袋对峙，枪声从未真正停止。"
 krcw_wca_civil_war_weariness:0 "内战疲惫"
 krcw_wca_civil_war_weariness_desc:0 "十年内战让工业带千疮百孔。工人们想要重建，而不是另一场战争——至少现在还不想。"
 krcw_wca_syndicates:0 "工团联合会"
 krcw_wca_syndicates_desc:0 "底特律、匹兹堡与芝加哥的工厂由工人委员会管理，它们是美洲大陆上最强大的工业心脏。"
 krcw_can_arsenal:0 "北方兵工厂"
 krcw_can_arsenal_desc:0 "加拿大工团共和国是第三国际援助美洲工团的后方通道，安大略的工厂日夜不停。"
 krcw_chi_revolution_unfinished:0 "革命未竟"
 krcw_chi_revolution_unfinished_desc:0 "从龙岩到北京，国民革命用了十三年；而把一个半封建的大陆变成现代共和国，需要的时间远不止于此。"
 krcw_chi_land_question:0 "土地问题"
 krcw_chi_land_question_desc:0 "“耕者有其田”写在党纲里，但乡村仍掌握在地主和宗族手中。土地法的草案在国民政府里争论不休。"
 krcw_chi_warlord_remnants:0 "军阀残余"
 krcw_chi_warlord_remnants_desc:0 "北伐中归顺的各路地方军头仍保留着私兵与税源。他们今天挂着国民革命军的番号，明天可能就换上别的旗帜。"
 krcw_chi_nra_veterans:0 "百战之师"
 krcw_chi_nra_veterans_desc:0 "国民革命军打败了大清、奉系与关东军。辽西会战的老兵构成了亚洲最有经验的陆军。"
 krcw_kor_brother_republic:0 "兄弟之邦"
 krcw_kor_brother_republic_desc:0 "朝鲜义勇队随国民革命军从华北打到辽西。朝鲜民国的许多领导人曾是黄埔学生、国民党员——他们把南京视为革命的兄长。"
 krcw_vin_own_revolution:0 "自主的革命"
 krcw_vin_own_revolution_desc:0 "越南的革命是越南人自己的。中国志愿军帮了大忙，但河内从不忘记提醒南京这一点。"
 krcw_liberated_republic:0 "新生民国"
 krcw_liberated_republic_desc:0 "旧王朝与殖民势力在中国志愿军面前土崩瓦解。新政权依赖外援，国内还远未稳固。"
 krcw_sov_iron_fist:0 "萨文科夫的铁腕"
 krcw_sov_iron_fist_desc:0 "前恐怖分子、前社会革命党人、如今的俄罗斯最高执政者。萨文科夫用铁与火把俄罗斯从布列斯特的屈辱中拖了出来。"
 krcw_sov_okhrana:0 "国家保卫局"
 krcw_sov_okhrana_desc:0 "国家保卫局的特工遍布俄罗斯，从彼得格勒的工厂到波罗的海的渔村。"
 krcw_usa_longs_machine:0 "朗的机器"
 krcw_usa_longs_machine_desc:0 "在路易斯安那学会的政治机器如今控制着半个美国。休伊·朗的话就是法律——只要他还活着。"
 krcw_usa_share_our_wealth:0 "分享我们的财富"
 krcw_usa_share_our_wealth_desc:0 "“人人都是国王”。朗的再分配计划为他赢得了南方农民的忠诚，也让联邦财政捉襟见肘。"
 krcw_mex_russian_corridor:0 "俄援通道"
 krcw_mex_russian_corridor_desc:0 "俄罗斯的武器经韦拉克鲁斯上岸，再沿铁路北运到朗的美国。墨西哥因此获得了莫斯科的贷款与关注。"
 krcw_raj_princely_fragmentation:0 "土邦割据"
 krcw_raj_princely_fragmentation_desc:0 "五百多个土邦各有其法庭、税吏与私兵。统一的印度联邦，在王公院的地图之外，其实仍是一片拼图。"
 krcw_raj_caste_order:0 "种姓秩序"
 krcw_raj_caste_order_desc:0 "王公联邦以“维护传统”为立国之本，种姓与土地制度被奉为神圣。"
 krcw_raj_famine:0 "饥荒阴影"
 krcw_raj_famine_desc:0 "统一战争摧毁了孟加拉的粮仓。每逢季风不来，饥荒就会席卷整个恒河平原。"
 krcw_raj_russian_advisors:0 "俄罗斯顾问团"
 krcw_raj_russian_advisors_desc:0 "俄罗斯军官训练了王公联邦的军队，并以此换取印度对莫斯科的忠诚。"
 krcw_ddr_treaty_of_berlin:0 "柏林条约"
 krcw_ddr_treaty_of_berlin_desc:0 "1944年，皇帝逃往中非的达累斯萨拉姆，施莱歇尔将军带着残存的国防军向俄国人投降，换来了易北河以东的一个德意志国家。它保住了黑白红三色旗，却把钥匙交给了莫斯科。"
 krcw_mon_white_baron:0 "白男爵的遗产"
 krcw_mon_white_baron_desc:0 "恩琴男爵的神秘主义帝国在战后被他自己的军官推翻了。新的摄政会议以博克多汗的名义统治，靠俄国的步枪维持秩序。"
 krcw_jap_revanchism:0 "复仇主义"
 krcw_jap_revanchism_desc:0 "丢掉了朝鲜与满洲的帝国把一切归咎于南京与巴黎。台湾是帝国最后的海外领土。"
 krcw_entente_in_exile:0 "流亡的协约"
 krcw_entente_in_exile_desc:0 "温莎王室两度流亡，从伦敦到渥太华，再到堪培拉。协约国仇恨夺走家园的第三国际，却也鄙视萨文科夫与朗。"
 krcw_tib_lhasa_agreement:0 "拉萨协定"
 krcw_tib_lhasa_agreement_desc:0 "1947年，噶厦与南京签订《拉萨协定》：西藏承认中华民国主权，南京承诺“不改变西藏现行制度”。"
 krcw_spr_iberian_federation:0 "伊比利亚联邦"
 krcw_spr_iberian_federation_desc:0 "1936年的革命把西班牙与葡萄牙的工团与公社联合成一个联邦。马德里没有总统，只有联邦委员会与各地的自由市。"
 krcw_russian_protectorate:0 "俄罗斯的保护"
 krcw_russian_protectorate_desc:0 "俄罗斯顾问坐镇首都，俄罗斯卢布支付着军饷。独立在名义上仍然存在。"
 krcw_cze_bohemian_bastion:0 "波希米亚堡垒"
 krcw_cze_bohemian_bastion_desc:0 "瑟洛维将军的督政府夹在红色德国与莫斯科之间，选择了俄罗斯的保护——代价是国内左翼的沉默。"
 krcw_straits_guard:0 "海峡守卫"
 krcw_straits_guard_desc:0 "土耳其的将军们守着黑海的钥匙。只要俄罗斯的舰队能自由出入，安卡拉就能得到莫斯科的慷慨。"
 krcw_psa_proconsul:0 "战时权力法"
 krcw_psa_proconsul_desc:0 "一九四二年国会通过《战时权力法》，旧金山、奥克兰、洛杉矶、西雅图和内华达山的隘口划为军区，由麦克阿瑟的西部防务司令部管辖。这部法律每年都要国会续期，至今没有一次被否决。沃伦总统竞选时答应废除它，要塞派则说，没有军区就守不住港口。"
 krcw_psa_pacific_fleet:0 "太平洋舰队"
 krcw_psa_pacific_fleet_desc:0 "一九三六年，太平洋舰队跟随西海岸各州州长，拒绝承认华盛顿的政变政府。如今它停在圣迭戈、旧金山与普吉特湾的船坞里，是旧合众国海军最好的一部分，由尼米兹上将指挥，守着从阿留申到圣迭戈的航线。"
 krcw_psa_third_america:0 "第三个美国"
 krcw_psa_third_america_desc:0 "新奥尔良说萨克拉门托是叛徒，纽约说它是反动派。萨克拉门托的国会则坚持，合众国只有一个宪政政府，就在萨克拉门托，另外两个都是篡位者。"
 krcw_yug_balkan_bayonets:0 "巴尔干刺刀"
 krcw_yug_balkan_bayonets_desc:0 "贝尔格莱德的将军们以王室的名义统治着一个多民族的王国。俄罗斯的贷款维持着军队，也维持着克罗地亚人与塞尔维亚人之间脆弱的沉默。"
