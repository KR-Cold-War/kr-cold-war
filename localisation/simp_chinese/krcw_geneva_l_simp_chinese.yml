 krcw_gv_help_t0:0 "§Y日内瓦停火体制§!"
 krcw_gv_help_b0:0 "这个世界没有联合国。一九四四年的易北河停火、《青岛停战协定》和一九四六年的圣路易斯停火都没有变成和约，三条战线靠三个停火委员会维持。易北河委员会和青岛委员会由瑞士、瑞典主持；圣路易斯委员会由墨西哥和加拿大各代表一方主持，瑞士、瑞典列席。\n\n两个集团的领袖每隔九个月左右在日内瓦开一届会议。每届有四项议程，第四项永远是\"缔结和约\"，每届都推迟到下届。\n\n冷战只有两种结局：世界大战，或者一方垮台。一方垮台以后，胜利的一方召开最后一届会议，第四项议程才第一次被讨论。"
 krcw_gv_help_t1:0 "§Y停火委员会§!"
 krcw_gv_help_b1:0 "边境事件会给委员会添待查事件。双方都可以花25政治点提交证据，一个月后委员会裁定：记入对方的违约记录，证据不足，或者对方反诉成功、记入自己的违约记录。自己的违约记录越多，被反诉的概率越高。突击、炮击、收紧封锁这类挑衅，直接记入自己的违约记录。\n\n每届日内瓦会议开幕时，违约记录少的一方在中立国的影响力上涨。这条战线重新开战时，违约少的一方得到\"对方撕毁停火\"（战争支持度 +10%，180 天），违约多的一方稳定 -10%，在中立国的影响力下降。\n\n召开委员会会议花35政治点，战线仪表 -10。四项信任措施每局各一次，要对方接受，接受后仪表 -8。退席让委员会休会：仪表每月多涨 1，重新开战的门槛降低；退席的一方花50政治点才能回来。"
 krcw_gv_help_t2:0 "§Y日内瓦会议§!"
 krcw_gv_help_b2:0 "会期一个月。巴黎和莫斯科在会议页上选择支持哪一项议程，或者全部拖延。双方支持同一项，这一项通过；没有通过的议程放回议程池，以后还可能抽到。选\"全部拖延\"算一次阻挠，对方集团在中立国的影响力上涨。\n\n两届会议之间，集团成员可以花25政治点提交议案，下届会议一定列入本集团提交的那一项。瑞士和瑞典可以花50政治点斡旋：下届会议上，一方支持、另一方没有全部拖延的议程也能通过。\n\n议程池里的每一项只能通过一次，效果写在议程旁边。"
 krcw_gv_help_t3:0 "§Y停火体制地位§!"
 krcw_gv_help_b3:0 "冷战铁幕的\"国际地位\"换成了停火体制地位。\n\n停火签约国：法国、不列颠、西德、意大利、俄国、东德、中国、日本、联合工团、朗的美国。政治点 +0.25/天，稳定 +5%。\n中立担保国：瑞士、瑞典。效果同上，另有斡旋和派出调查组。\n普通国家：其他国家，没有修正。\n交战团体：代理人战争里的起义政权，稳定 -5%，消费品 +10%。\n\n地位不再决定能不能派志愿军。派志愿军看势力范围和志愿军决议。"
 krcw_gv_elbe_desc:0 "一九四四年易北河停火，欧洲战争没有签订和约就结束了。易北河委员会由瑞士、瑞典主持，西德、法国、不列颠和东德、俄国各派代表。"
 krcw_gv_elbe_restart:0 "世界大战计划需要世界紧张度高于 70，委员会休会时高于 60。"
 krcw_gv_elbe_evid_btn_tt:0 "§Y提交证据§!\n花费 25 政治点，要有待查事件，同一时间只裁定一份证据。一个月后委员会裁定。同一方每 2 个月一次。"
 krcw_gv_elbe_session_btn_tt:0 "§Y召开委员会会议§!\n花费 35 政治点，柏林走廊压力要高于 30。柏林走廊压力 -10，双方稳定 +1%。每 4 个月一次，双方共用。"
 krcw_gv_elbe_walk_btn_tt:0 "§Y退席§!\n委员会休会：柏林走廊压力每月多涨 1，重新开战的门槛降低。世界大战计划需要世界紧张度高于 70，委员会休会时高于 60。"
 krcw_gv_elbe_return_btn_tt:0 "§Y返回委员会§!\n花费 50 政治点，委员会复会。退席的一方才需要返回。"
 krcw_gv_elbe_pow_btn_tt:0 "§Y交换战俘§!\n双方交换一九四四年以后还扣押在对方营地里的战俘。\n\n花费 25 政治点，要对方接受。接受后柏林走廊压力 -8，双方稳定 +2%。每局一次。"
 krcw_gv_elbe_mail_btn_tt:0 "§Y恢复通邮§!\n东西两个德国之间重新通邮，家信不再经过斯德哥尔摩转寄。\n\n花费 25 政治点，要对方接受。接受后柏林走廊压力 -8，双方稳定 +2%。每局一次。"
 krcw_gv_elbe_graves_btn_tt:0 "§Y联合寻找阵亡者遗骸§!\n双方的工兵一起在易北河两岸的旧战场上寻找和登记阵亡者。\n\n花费 25 政治点，要对方接受。接受后柏林走廊压力 -8，双方稳定 +2%。每局一次。"
 krcw_gv_elbe_flood_btn_tt:0 "§Y易北河联合防洪§!\n两岸的河务局交换水位数据，汛期一起加固堤坝。\n\n花费 25 政治点，要对方接受。接受后柏林走廊压力 -8，双方稳定 +2%。每局一次。"
 krcw_gv_ohio_desc:0 "一九四六年，联合工团与朗的美国在圣路易斯签订停火协定，沿密西西比河和俄亥俄河对峙。委员会在圣路易斯开会，墨西哥和加拿大的外交官各代表一方主持，瑞士、瑞典列席。"
 krcw_gv_ohio_restart:0 "撕毁停火协定需要紧张度高于 79，委员会休会时高于 69。"
 krcw_gv_ohio_evid_btn_tt:0 "§Y提交证据§!\n花费 25 政治点，要有待查事件，同一时间只裁定一份证据。一个月后委员会裁定。同一方每 2 个月一次。"
 krcw_gv_ohio_session_btn_tt:0 "§Y召开委员会会议§!\n花费 35 政治点，密西西比停火线紧张度要高于 30。密西西比停火线紧张度 -10，双方稳定 +1%。每 4 个月一次，双方共用。"
 krcw_gv_ohio_walk_btn_tt:0 "§Y退席§!\n委员会休会：密西西比停火线紧张度每月多涨 1，重新开战的门槛降低。撕毁停火协定需要紧张度高于 79，委员会休会时高于 69。"
 krcw_gv_ohio_return_btn_tt:0 "§Y返回委员会§!\n花费 50 政治点，委员会复会。退席的一方才需要返回。"
