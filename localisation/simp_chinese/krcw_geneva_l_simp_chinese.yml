 krcw_gv_ohio_mail_btn_tt:0 "§Y恢复通邮§!\n东西两岸重新通邮，信件不再经过多伦多和蒙特雷转寄。\n\n花费 25 政治点，要对方接受。接受后密西西比停火线紧张度 -8，双方稳定 +2%。每局一次。"
