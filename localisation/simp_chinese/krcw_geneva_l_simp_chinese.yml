l_simp_chinese:
# krcw: years paced
 krcw_gv.1.t:0 "第 [?global.krcw_gv_session|0] 届日内瓦会议开幕"
 krcw_gv.1.d:0 "会期一个月。本届议程：\n一、[KRCW_GvSlot1]\n二、[KRCW_GvSlot2]\n三、[KRCW_GvSlot3]\n四、缔结和约\n\n在\"日内瓦\"标签页的会议页上选择支持哪一项，或者全部拖延。对方也会选择，双方支持同一项，这一项才能通过。"
 krcw_gv.1.a:0 "去看看议程。"
 krcw_gv.2.t:0 "日内瓦会议闭幕"
 krcw_gv.2.d1:0 "第 [?global.krcw_gv_session|0] 届日内瓦会议闭幕，会议通过了\"[KRCW_GvLastPass]\"。\n\n第四项议程\"缔结和约\"推迟到下届会议。这是和约第 [?global.krcw_gv_deferred|0] 次推迟。"
 krcw_gv.2.d2:0 "第 [?global.krcw_gv_session|0] 届日内瓦会议闭幕，没有通过任何议程。\n\n第四项议程\"缔结和约\"推迟到下届会议。这是和约第 [?global.krcw_gv_deferred|0] 次推迟。"
 krcw_gv.2.a:0 "下届再议。"
 krcw_gv.3.t:0 "日内瓦会议"
 krcw_gv.3.d:0 "两个集团的领袖同意在瑞士日内瓦定期开会，三个停火委员会的代表团都到了。议程有四项，前三项每届更换，第四项是缔结和约。会议约九个月开一届。"
 krcw_gv.3.a:0 "看看能谈成什么。"
 krcw_gv.10.t:0 "易北河委员会的裁定"
 krcw_gv.10.d1:0 "委员会认定对方违反了停火协定，记入对方的违约记录。"
 krcw_gv.10.d2:0 "委员会认为证据不足，不作认定。"
 krcw_gv.10.d3:0 "对方提交了反诉证据。委员会认定是我们违反了停火协定，记入我们的违约记录。"
 krcw_gv.10.a:0 "归档。"
 krcw_gv.20.da:0 "西德的代表团退出了易北河委员会，委员会休会。在代表团回来之前，柏林走廊压力每月多涨 1，重新开战的门槛也会降低。"
 krcw_gv.20.db:0 "东德的代表团退出了易北河委员会，委员会休会。在代表团回来之前，柏林走廊压力每月多涨 1，重新开战的门槛也会降低。"
 krcw_gv.20.t:0 "易北河委员会休会"
 krcw_gv.20.a:0 "停火线又紧了一分。"
 krcw_gv.30.d1:0 "停火线上重新开战，易北河委员会不再开会。按违约记录，西德的违约记录少，得到\"对方撕毁停火\"；东德的违约记录多，稳定下降。"
 krcw_gv.30.d2:0 "停火线上重新开战，易北河委员会不再开会。按违约记录，东德的违约记录少，得到\"对方撕毁停火\"；西德的违约记录多，稳定下降。"
 krcw_gv.30.d0:0 "停火线上重新开战，易北河委员会不再开会。按违约记录，双方的违约记录一样多，谁也说不清是谁先撕毁了停火。"
 krcw_gv.30.t:0 "易北河委员会破裂"
 krcw_gv.30.a:0 "枪声又回来了。"
 krcw_gv.100.t:0 "易北河委员会：交换战俘"
 krcw_gv.100.d:0 "对方代表团在易北河委员会提议：双方交换一九四四年以后还扣押在对方营地里的战俘。\n\n接受以后，柏林走廊压力下降 8，双方的稳定各 +2%。"
 krcw_gv.100.a:0 "接受。"
 krcw_gv.100.b:0 "拒绝。"
 krcw_gv.101.t:0 "易北河委员会：恢复通邮"
 krcw_gv.101.d:0 "对方代表团在易北河委员会提议：东西两个德国之间重新通邮，家信不再经过斯德哥尔摩转寄。\n\n接受以后，柏林走廊压力下降 8，双方的稳定各 +2%。"
 krcw_gv.101.a:0 "接受。"
 krcw_gv.101.b:0 "拒绝。"
 krcw_gv.102.t:0 "易北河委员会：联合寻找阵亡者遗骸"
 krcw_gv.102.d:0 "对方代表团在易北河委员会提议：双方的工兵一起在易北河两岸的旧战场上寻找和登记阵亡者。\n\n接受以后，柏林走廊压力下降 8，双方的稳定各 +2%。"
 krcw_gv.102.a:0 "接受。"
 krcw_gv.102.b:0 "拒绝。"
 krcw_gv.103.t:0 "易北河委员会：易北河联合防洪"
 krcw_gv.103.d:0 "对方代表团在易北河委员会提议：两岸的河务局交换水位数据，汛期一起加固堤坝。\n\n接受以后，柏林走廊压力下降 8，双方的稳定各 +2%。"
 krcw_gv.103.a:0 "接受。"
 krcw_gv.103.b:0 "拒绝。"
 krcw_gv.11.t:0 "圣路易斯委员会的裁定"
 krcw_gv.11.d1:0 "委员会认定对方违反了停火协定，记入对方的违约记录。"
 krcw_gv.11.d2:0 "委员会认为证据不足，不作认定。"
 krcw_gv.11.d3:0 "对方提交了反诉证据。委员会认定是我们违反了停火协定，记入我们的违约记录。"
 krcw_gv.11.a:0 "归档。"
 krcw_gv.21.da:0 "联合工团的代表团退出了圣路易斯委员会，委员会休会。在代表团回来之前，密西西比停火线紧张度每月多涨 1，重新开战的门槛也会降低。"
 krcw_gv.21.db:0 "朗的美国的代表团退出了圣路易斯委员会，委员会休会。在代表团回来之前，密西西比停火线紧张度每月多涨 1，重新开战的门槛也会降低。"
 krcw_gv.21.t:0 "圣路易斯委员会休会"
 krcw_gv.21.a:0 "停火线又紧了一分。"
 krcw_gv.31.d1:0 "停火线上重新开战，圣路易斯委员会不再开会。按违约记录，联合工团的违约记录少，得到\"对方撕毁停火\"；朗的美国的违约记录多，稳定下降。"
 krcw_gv.31.d2:0 "停火线上重新开战，圣路易斯委员会不再开会。按违约记录，朗的美国的违约记录少，得到\"对方撕毁停火\"；联合工团的违约记录多，稳定下降。"
 krcw_gv.31.d0:0 "停火线上重新开战，圣路易斯委员会不再开会。按违约记录，双方的违约记录一样多，谁也说不清是谁先撕毁了停火。"
 krcw_gv.31.t:0 "圣路易斯委员会破裂"
 krcw_gv.31.a:0 "枪声又回来了。"
 krcw_gv.110.t:0 "圣路易斯委员会：交换战俘"
 krcw_gv.110.d:0 "对方代表团在圣路易斯委员会提议：双方交换内战遗留下来的战俘。\n\n接受以后，密西西比停火线紧张度下降 8，双方的稳定各 +2%。"
 krcw_gv.110.a:0 "接受。"
 krcw_gv.110.b:0 "拒绝。"
 krcw_gv.111.t:0 "圣路易斯委员会：恢复通邮"
 krcw_gv.111.d:0 "对方代表团在圣路易斯委员会提议：东西两岸重新通邮，信件不再经过多伦多和蒙特雷转寄。\n\n接受以后，密西西比停火线紧张度下降 8，双方的稳定各 +2%。"
 krcw_gv.111.a:0 "接受。"
 krcw_gv.111.b:0 "拒绝。"
 krcw_gv.112.t:0 "圣路易斯委员会：联合寻找阵亡者遗骸"
 krcw_gv.112.d:0 "对方代表团在圣路易斯委员会提议：两岸的工兵一起在密西西比河沿岸的旧战场上寻找和登记阵亡者。\n\n接受以后，密西西比停火线紧张度下降 8，双方的稳定各 +2%。"
 krcw_gv.112.a:0 "接受。"
 krcw_gv.112.b:0 "拒绝。"
 krcw_gv.113.t:0 "圣路易斯委员会：密西西比河联合防洪"
 krcw_gv.113.d:0 "对方代表团在圣路易斯委员会提议：两岸的工程兵团交换水位数据，汛期一起加固堤坝。\n\n接受以后，密西西比停火线紧张度下降 8，双方的稳定各 +2%。"
 krcw_gv.113.a:0 "接受。"
 krcw_gv.113.b:0 "拒绝。"
 krcw_gv.12.t:0 "青岛委员会的裁定"
 krcw_gv.12.d1:0 "委员会认定对方违反了停火协定，记入对方的违约记录。"
 krcw_gv.12.d2:0 "委员会认为证据不足，不作认定。"
 krcw_gv.12.d3:0 "对方提交了反诉证据。委员会认定是我们违反了停火协定，记入我们的违约记录。"
 krcw_gv.12.a:0 "归档。"
 krcw_gv.22.da:0 "中国的代表团退出了青岛委员会，委员会休会。在代表团回来之前，海峡紧张度每月多涨 1，重新开战的门槛也会降低。"
 krcw_gv.22.db:0 "日本的代表团退出了青岛委员会，委员会休会。在代表团回来之前，海峡紧张度每月多涨 1，重新开战的门槛也会降低。"
 krcw_gv.22.t:0 "青岛委员会休会"
 krcw_gv.22.a:0 "停火线又紧了一分。"
 krcw_gv.32.d1:0 "停火线上重新开战，青岛委员会不再开会。按违约记录，中国的违约记录少，得到\"对方撕毁停火\"；日本的违约记录多，稳定下降。"
 krcw_gv.32.d2:0 "停火线上重新开战，青岛委员会不再开会。按违约记录，日本的违约记录少，得到\"对方撕毁停火\"；中国的违约记录多，稳定下降。"
 krcw_gv.32.d0:0 "停火线上重新开战，青岛委员会不再开会。按违约记录，双方的违约记录一样多，谁也说不清是谁先撕毁了停火。"
 krcw_gv.32.t:0 "青岛委员会破裂"
 krcw_gv.32.a:0 "枪声又回来了。"
 krcw_gv.120.t:0 "青岛委员会：交换战俘"
 krcw_gv.120.d:0 "对方代表团在青岛委员会提议：双方交换辽西会战以后扣押的战俘。\n\n接受以后，海峡紧张度下降 8，双方的稳定各 +2%。"
 krcw_gv.120.a:0 "接受。"
 krcw_gv.120.b:0 "拒绝。"
 krcw_gv.121.t:0 "青岛委员会：恢复通航"
 krcw_gv.121.d:0 "对方代表团在青岛委员会提议：上海、天津和神户、长崎之间重新开通客轮和邮船。\n\n接受以后，海峡紧张度下降 8，双方的稳定各 +2%。"
 krcw_gv.121.a:0 "接受。"
 krcw_gv.121.b:0 "拒绝。"
 krcw_gv.122.t:0 "青岛委员会：联合寻找阵亡者遗骸"
 krcw_gv.122.d:0 "对方代表团在青岛委员会提议：双方的人员一起在华北和辽西的旧战场上寻找和登记阵亡者。\n\n接受以后，海峡紧张度下降 8，双方的稳定各 +2%。"
 krcw_gv.122.a:0 "接受。"
 krcw_gv.122.b:0 "拒绝。"
 krcw_gv.123.t:0 "青岛委员会：遣返侨民"
 krcw_gv.123.d:0 "对方代表团在青岛委员会提议：战后滞留在中国的日本侨民和滞留在日本的中国侨民各自回国。\n\n接受以后，海峡紧张度下降 8，双方的稳定各 +2%。"
 krcw_gv.123.a:0 "接受。"
 krcw_gv.123.b:0 "拒绝。"
 krcw_gv.200.t:0 "对方接受了提议"
 krcw_gv.200.d:0 "对方接受了我们在停火委员会提出的信任措施。"
 krcw_gv.200.a:0 "好。"
 krcw_gv.201.t:0 "对方拒绝了提议"
 krcw_gv.201.d:0 "对方拒绝了我们在停火委员会提出的信任措施。花掉的政治点拿不回来。"
 krcw_gv.201.a:0 "那就算了。"
 krcw_gv.40.t:0 "日内瓦会议无限期休会"
 krcw_gv.40.d:0 "两个集团开战了。瑞士政府宣布日内瓦会议无限期休会，三个停火委员会的代表团回国。和约一共推迟了 [?global.krcw_gv_deferred|0] 次。"
 krcw_gv.40.a:0 "代表团回国。"
 krcw_gv.41.t:0 "最后一届日内瓦会议"
 krcw_gv.41.d1:0 "莫斯科协定垮台以后，巴黎召集了最后一届日内瓦会议。第四项议程\"缔结和约\"第一次被讨论，条款由第三国际起草。在这之前，和约推迟了 [?global.krcw_gv_deferred|0] 次。"
 krcw_gv.41.d2:0 "第三国际垮台以后，莫斯科召集了最后一届日内瓦会议。第四项议程\"缔结和约\"第一次被讨论，条款由莫斯科协定起草。在这之前，和约推迟了 [?global.krcw_gv_deferred|0] 次。"
 krcw_gv.41.a:0 "冷战结束了。"
