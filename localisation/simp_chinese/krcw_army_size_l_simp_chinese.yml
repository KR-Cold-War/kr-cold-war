# krcw: years paced
 krcw_chi_army_reorganisation:0 "整编中的国民革命军"
 krcw_chi_army_reorganisation_desc:0 "统一战争留下了一百个师，其中四成是收编的地方部队，编制、装备和饷章各不相同。军政部正在逐个师地整编，整编完成之前，它们都还在军籍上。"
 krcw_raj_princely_contingents:0 "王公分遣队"
 krcw_raj_princely_contingents_desc:0 "联邦陆军有一大半是各土邦自己招募、自己发饷的部队，名义上归德里指挥。王公们把这些部队当作在王公院讨价还价的本钱，任何裁军方案都过不了王公院。"
