 krcw_intro_10_t:0 "法兰西公社：背景"
 krcw_intro_10_d:0 "这是法兰西公社的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_11_t:0 "法兰西公社：从停战到公社"
 krcw_intro_11_d:0 "一九一九年，德军在西线的攻势取得成功，第三共和国被迫停战。同年十一月，法国劳动总联合会号召革命总罢工，全国瘫痪，资产阶级政府倒台。“秩序党”的军人政权压不住局面，一场短暂而残酷的内战之后，旧政府、大部分军官团和资产者渡海退往阿尔及尔，在那里建立了“国民法国”，后来由贝当元帅统治。\n\n留在本土的工会、社会党人和无政府主义者建立了公社。一九二一年的临时宪章把权力分给市镇公社、地区联合会和全国代表大会三级，行政由救国委员会负责，劳动总交易所代表工会一方。同年，法国的社会主义者在巴黎发起成立第三国际。\n\n此后十几年，公社一边重建，一边防备阿尔及尔的反攻和德国的封锁。一九二五年不列颠革命成功，公社有了第一个大国盟友。一九三七年，第三国际向德意志帝国开战。一九四三年莱茵河防线崩溃，国际的军队占领莱茵兰、鲁尔、汉堡和巴伐利亚，一九四四年春帝国瓦解。战争期间，公社的军队渡过地中海，国民法国随之覆灭。欧洲战争以易北河上的停火结束，没有签订和约。"
 krcw_intro_12_t:0 "法兰西公社：一九四九年的巴黎"
 krcw_intro_12_d:0 "矿工出身的伯努瓦·弗拉雄自一九四六年起任劳动总联合会总书记。一九四九年五月，总联合会第十四次代表大会在巴黎开幕，预计将再次授权他组阁。公社是第三国际的领袖：国际书记处设在巴黎，巴黎清算联盟负责各成员之间的贸易结算。\n\n公社的问题主要在内部。联合会的机关二十年来不断膨胀，一个地方公社想修一座桥，也要等巴黎的批文。代表大会里，主张干部轮换、代表罢免的革新派，与主张把计划集中到萨克雷计划总署的技术派争执不下。出生在革命之后的一代人进了大学，他们没有见过一九二一年的街垒，对联合会的办公室意见很多。\n\n对外，公社的装甲师驻在易北河一线，与德意志社会主义共和国和不列颠联邦一起面对俄罗斯和施莱歇尔的德意志民族共和国。阿尔及利亚仍归巴黎管辖，当地要求自治乃至独立的声音越来越大。萨克雷和撒哈拉的原子计划正在推进。在美洲，公社给纽约的联合工团送去了钱和船，但没有派兵。"
 krcw_intro_13_t:0 "法兰西公社：摆在巴黎面前的选择"
 krcw_intro_13_d:0 "公社的国策围绕三个问题展开。第一是联合会本身：用轮换条例和代表罢免制约束机关，还是精简机关、提高行政效率；青年工人的要求是写进新的劳动宪章，还是先整顿联合会秩序。斯特拉斯堡大会还要决定，欧洲的工人组织由一个劳动议会还是一个联合会理事会来代表。\n\n第二是国际。巴黎可以让国际书记处的决议对各支部具有约束力，也可以与各国订立平等的公社公约，或者干脆取消书记处。对莫斯科协定，公社要在“和平竞赛”与“不断革命”之间作出选择，后者意味着武装东欧的游击队、准备越过易北河。\n\n第三是阿尔及利亚：给它一部自治章程，还是坚持“省就是法国”。\n\n此外还有原子武库的规模、清算联盟的扩展和对纽约的援助。易北河和密西西比河上的冲突随时可能升级，一旦两大阵营正面开战，决定权在巴黎和莫斯科。"
 krcw_intro_20_t:0 "不列颠联邦：背景"
 krcw_intro_20_d:0 "这是不列颠联邦的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_21_t:0 "不列颠联邦：从总罢工到联邦"
 krcw_intro_21_d:0 "不列颠在世界大战中牺牲了近百万人，什么也没有得到。此后五年，失业、衰退和政治丑闻接连不断。保守党主导的国民政府推行紧缩，又准备裁减军队，积怨终于在一场全国总罢工中爆发，罢工随即变成内战。一九二四至一九二五年，乔治·兰斯伯里和亚瑟·库克宣布成立不列颠联邦。经过一年多的战斗，红旗升上伦敦，王室在一九二五年底逃往加拿大。\n\n革命后的十年并不平静。工党在联邦中占主导地位，内部却分成几派；对保王派颠覆的疑惧让政府越来越专断。奥斯瓦尔德·莫斯利在三十年代组建人民革命党，一度在党内迅速崛起。\n\n一九三七年，联邦与法兰西公社一同对德意志帝国开战，舰队负责大西洋和北海的航线，伦敦在空袭中损失惨重。流亡渥太华的国王政府则在一九三八年派兵南下干涉美国内战，在奥尔巴尼和布法罗被工团民兵击败。一九四〇年，加拿大工人起义，国王第二次出逃，去了墨尔本。一九四四年德意志帝国崩溃，易北河上的停火延续至今。"
 krcw_intro_22_t:0 "不列颠联邦：一九四九年的伦敦"
 krcw_intro_22_d:0 "联邦的总书记是汤姆·温特林厄姆。他在一九三六年西班牙哈拉马河战役中以国际纵队指挥官的身份负伤，在党内以容忍不同意见著称。全国工会代表大会每年秋天在布莱克浦开会，一九四九年的议程只有一个问题：革命二十五年之后，联邦该变成什么样子。克莱德河、谢菲尔德和考文垂的车间代表抱怨伦敦的办公室，苏格兰和威尔士要求更多自己的权力。\n\n联邦是国际的海上支柱。红色舰队守卫大西洋航线，向加拿大和美利坚联合工团输送物资。旧帝国的殖民地大多已经独立，伦敦要重新和它们打交道。北爱尔兰已经归还都柏林的工人共和国，贝尔法斯特船厂的新教工人对此很不满意；直布罗陀归了伊比利亚联邦，地中海分舰队的港口要重新谈判。\n\n温莎王室和流亡政府在澳大利亚，与新西兰组成澳新协约，仍自称不列颠唯一的合法政府。国内，战时轰炸烧掉了伦敦一半的贫民窟，煤矿和井架已经老化，兰开夏的纺织业需要改造。"
 krcw_intro_23_t:0 "不列颠联邦：摆在伦敦面前的选择"
 krcw_intro_23_d:0 "联邦的国策从布莱克浦代表大会开始，大致分成四条线。\n\n宪法：联邦的成员从未写明。代表大会要决定英格兰、苏格兰、威尔士与北方各郡的关系：订立一份按工会会员分配席位的四方宪章，还是由单一代表大会作唯一的主权机构；温莎王室的法律地位和反对派能否参选，也要有个说法。\n\n工业：在路线辩论中，联邦可以把工厂交给行政官管理，可以把决定权还给车间，也可以推行柯尔一派的行会社会主义。选择不同，执政的人和执政党也会不同。\n\n海军与原子：自行研制核装置、加入国际联合核计划，或者放弃核计划；航母和潜艇的数量；舰队要承担多少条国际航线的防务。\n\n对外：对堪培拉，是致信澳新协约寻求接触，还是宣示联邦是唯一合法政府。此外还有加拿大、爱尔兰和前殖民地的工会。\n\n温特林厄姆的接班问题迟早会摆上桌面。联邦的舰队是国际在大西洋上唯一能与协定抗衡的力量，美洲的援助航线也靠它维持。"
 krcw_intro_30_t:0 "意大利社会共和国：背景"
 krcw_intro_30_d:0 "这是意大利社会共和国的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_31_t:0 "意大利社会共和国：从维琴察到波河"
 krcw_intro_31_d:0 "一九一九年，意大利与奥地利签订停战协定，允许奥军在正式和约签订之前占领伦巴第和威尼托。随后的《维琴察条约》让国家和旧政治秩序颜面尽失。几天之内社会主义者发动起义，哗变的部队组成了红军，意大利内战爆发。红军的攻势在波河和阿布鲁佐一线被挡住，一九二〇年停火。半岛从此分裂：社会共和国控制中北部，伦巴第和威尼托在奥地利手里，南方是教会支持的意大利联邦，萨伏依王室在撒丁岛维持着一个王国。\n\n一九二〇年宪法设立一院制议会，议员一部分由工会选出，一部分由普选产生。一九二七年，温和派工会没能抓住南方联邦的动荡统一半岛，以邓南遮为旗帜的民族主义者和墨索里尼一派随后在共和国内部坐大，与工会正统派长期争斗。\n\n一九三七年，共和国随第三国际参战。一九四三年，国际的军队从法国越过阿尔卑斯山，游击队从山区一直打到波河平原，奥地利在北方的统治随帝国的崩溃一同结束。同年，共和国渡海推翻了阿尔巴尼亚的索古国王，把范·诺利请回地拉那。战争结束时，意大利第一次在红旗下统一。"
 krcw_intro_32_t:0 "意大利社会共和国：一九四九年的罗马"
 krcw_intro_32_d:0 "执政的是意大利劳动总联合会，书记朱塞佩·迪·维托里奥出身普利亚的农业雇工，在南方雇农中威望最高。他主张土地改革优先于工业化，这让北方工厂委员会的人很不满意。在都灵和米兰重建工厂委员会的马泰奥蒂主张一切都要投票，包括战争。天主教工会出身的格隆基是共和国与南方教区之间的桥梁，他主张不碰教会的学校和堂区。翁布里亚的加布里奥蒂则认为，共和国的问题是没有人收税、没有人修路。\n\n半岛刚刚统一，南北差距极大。南方的土地仍在大地主手里，北方的工厂在战争中受损，财政靠旧自由派议员萨尔迪这样的顾问勉强维持。\n\n对外，意大利是第三国际在地中海的支柱。一九四三年它渡海推翻了阿尔巴尼亚的索古国王，一年后又被南斯拉夫和希腊的军政府赶了回来，索古在俄国人的保护下复位，诺利流亡罗马。亚得里亚海对岸是加入莫斯科协定的南斯拉夫军政府，的里雅斯特、伊斯特拉和达尔马提亚的归属都没有定论，游击战领袖帕里的支持者不愿等仲裁。希腊的品都斯山里有工团游击队，补给靠意大利港口的渔船夜里渡过奥特朗托海峡送去。"
 krcw_intro_33_t:0 "意大利社会共和国：摆在罗马面前的选择"
 krcw_intro_33_d:0 "意大利的国策首先要回答它在国际中的位置：紧跟巴黎，要求按本国传统组织自己的联合会，还是响应国际内部要求基层民主的第二公社运动。三条路分别通向不同的党内派别和不同的计划方式。\n\n其次是经济。共和国要选定自己在国际分工中的专长行业，决定是否加入跨国产业联合会和共同计划，修公路和电网，把南方接进全国市场。迪·维托里奥的土地改革和北方的工业化要争同一笔钱。\n\n第三是边界和邻国。要不要武装诺利的阿尔巴尼亚流亡者；的里雅斯特问题是交给国际仲裁法庭，还是直接与贝尔格莱德交涉；对达尔马提亚，迪·维托里奥在工会大会上说过“我们不是墨索里尼”，但并不是所有人都同意。希腊的品都斯起义一旦扩大，意大利是离它最近的国际成员。\n\n共和国的军队主要是工团民兵和战时的游击部队，要编入国际联合指挥部，还要承担阿尔卑斯山口与亚得里亚海的防务。"
 krcw_intro_40_t:0 "德意志社会主义共和国：背景"
 krcw_intro_40_d:0 "这是德意志社会主义共和国的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_41_t:0 "德意志社会主义共和国：从莫阿比特到莱茵河"
 krcw_intro_41_d:0 "一九一九年的胜利让德意志帝国成了欧洲的主人。一九二五年柏林股市的“黑色星期四”之后，经济危机和罢工再没有真正平息，帝国政府用戒严令和监狱对付工会。汉堡码头工人出身的恩斯特·台尔曼在柏林的莫阿比特监狱关了十年，和他一起坐牢的还有卡勒、雷恩、蔡塞尔等人。\n\n一九三七年第三国际向帝国开战，东面的俄罗斯同时进攻。一九四三年国际的装甲师渡过莱茵河，莱茵兰、鲁尔、汉堡和巴伐利亚在半年之内易帜。台尔曼出狱后宣布成立德意志社会主义共和国，党的领导层大多是和他一起从帝国监狱里出来的人。\n\n一九四四年春帝国崩溃，皇帝威廉三世逃往中非的达累斯萨拉姆，秋天又转往斯德哥尔摩。国际的军队翻过阿尔卑斯山，解放了萨尔茨堡、蒂罗尔和上奥地利，维也纳则在俄国人手里；一九四五年奥地利西部各州在萨尔茨堡成立了自己的社会主义共和国。施莱歇尔将军带着残存的国防军向俄国人投降，在易北河以东建立了德意志民族共和国。柏林被一分为二，西柏林归社会主义共和国，四面都是施莱歇尔的国土。"
 krcw_intro_42_t:0 "德意志社会主义共和国：一九四九年的共和国"
 krcw_intro_42_d:0 "台尔曼生于一八八六年，十年牢狱毁了他的身体，党内都在私下考虑接班问题。共和国的权力是从鲁尔的车间委员会长出来的：每座工厂选出委员会，决定生产计划、分配住房、裁决纠纷。可是帝国的法官、校长和警官大多还坐在原来的位置上，清洗他们，国家就转不动。\n\n军队也要从头建。旧帝国的军官团一半在易北河东岸，一半在监狱里，新军队的干部来自国际纵队、西班牙的老兵和车间委员会。法国、不列颠与德国的参谋部在美因茨合署办公，前线归德国人，纵深归法国人。\n\n西柏林是共和国最敏感的地方。两百万人的面粉、煤和药品靠三条空中走廊、一条铁路和一条运河输送，全部穿过施莱歇尔的国土。一九四九年的“面包桥”空运刚刚结束。\n\n经济上，鲁尔的高炉和莱茵兰的化工厂是国际在欧洲的第二个工业中心，但帝国欠下的赔款要由德国工人用出口偿付。奥地利西部诸省由共和国代管，它们将来是独立还是并入德国，还没有定论。"
 krcw_intro_43_t:0 "德意志社会主义共和国：摆在面前的选择"
 krcw_intro_43_d:0 "共和国的国策先要回答德国的分裂。一条路是社会主义统一：宣传、罢工基金和越境的组织者，等施莱歇尔的国家从内部裂开。另一条路是承认统一在这一代人手里不会发生，把西德建成国际最富、最自由、最强的成员，让东边的人自己去比较。\n\n国内，党、工会和车间委员会之间的关系要定下来：统一指挥，还是“车间共和国”。新军队的军官由工会推选，还是召回旧总参谋部的人。鲁尔先造消费品，还是先建装甲师。从东边逃来的人越来越多，是无条件接收，还是规定接收额度。\n\n对奥地利，共和国可以承认萨尔茨堡的独立，也可以邀请它并入德国。对东边的邻国，共和国可以推行只谈邮政、探亲和货运的小步骤政策，也可以绕过施莱歇尔政府，邀请东德的工会、教会和地方议会参加全德大会。\n\n西柏林的地位、易北河的工事和台尔曼的接班贯穿始终。易北河是两大阵营在欧洲唯一直接接触的前线，这里的任何一次冲突都会立即牵动巴黎和莫斯科。"
 krcw_intro_50_t:0 "美利坚联合工团：背景"
 krcw_intro_50_d:0 "这是美利坚联合工团的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_51_t:0 "美利坚联合工团：从工人起义到圣路易斯"
 krcw_intro_51_d:0 "一九二五年柏林股市崩盘后，以德国为中心的金融秩序垮了，美国陷入长期萧条。一九三六年大选之后，选举的合法性遭到各方质疑，罢工和街头冲突愈演愈烈，陆军参谋长麦克阿瑟执行“白色作战计划”，带兵控制了华盛顿。工业城市的社会主义者和工会宣布不承认任何“反动”政府，推举约翰·里德为临时总统；斯梅德利·巴特勒等一批军官投向了工人一方。南方的休伊·朗也拒绝服从华盛顿，西海岸各州则在萨克拉门托另立宪政政府。第二次美国内战爆发，工团、朗和麦克阿瑟的联邦军三方混战，萨克拉门托守在落基山以西。\n\n一九三八年，流亡加拿大的协约国政府派军南下进入新英格兰，想恢复旧秩序，结果在奥尔巴尼和布法罗被工团民兵击溃。一九四一年，华盛顿陷落，麦克阿瑟带着联邦残军突围西撤，投奔了萨克拉门托。\n\n到一九四三年冬天，工团的装甲车已经开到孟菲斯郊外。此后俄国的步枪、卡车和火炮经墨西哥的坦皮科运到朗的手里，巴顿的军队把工团推回了大河东岸。巴黎的师团都在易北河，送来的只有钱和船。一九四六年，双方在圣路易斯签订停火协定，沿密西西比河和俄亥俄河一线对峙。两边的宪法都宣称对全美拥有主权。"
 krcw_intro_52_t:0 "美利坚联合工团：一九四九年的纽约"
 krcw_intro_52_d:0 "一九四九年五月，联合工团第九次代表大会在纽约召开。主席沃尔特·鲁瑟出身底特律的汽车工人联合会。东岸守住了新英格兰、纽约、华盛顿、匹兹堡、底特律和芝加哥，工厂比朗的美国多得多，人口却比西岸少。阿巴拉契亚在内战中被打成焦土，哈兰县和西弗吉尼亚的矿井被淹，伤残老兵需要医院、假肢和工作。\n\n各产业联合会互不服气，汽车、钢铁、煤矿、码头和服装联合会都有自己的民兵。卡尔森正在参照国民革命军的经验组建统一的工团人民军，里科弗要一支能守住大西洋海岸的舰队。卧铺车厢搬运工工会领袖伦道夫在伯明翰组织黑人工人。每个月都有人从西岸偷渡过河，其中有黑人家庭、被取缔的工会会员和逃兵。\n\n代表大会上两派针锋相对：鲁瑟的“建设派”主张先把东部建成工业民主的样板；福斯特和坎农的“解放派”认为停火协定只是一次喘息，主张尽快渡河。世界产业工人联合会的老人则要把所有联合会合并为一个大工会。第三国际的援助经加拿大和大西洋运来，蒂姆·巴克的加拿大是东岸最近的盟友。"
 krcw_intro_53_t:0 "美利坚联合工团：摆在纽约面前的选择"
 krcw_intro_53_d:0 "联合工团的国策从第九次代表大会开始。代表大会要在鲁瑟的《产业民主宪章》和福斯特派的“西岸解放委员会”之间作出选择，随后召集三派辩论，决定采纳建设派路线、解放派路线，还是合并为一个大工会。胜出的一派会改组执行委员会，落选派别的席位怎样处理也要表决。\n\n经济上，东岸要重建阿巴拉契亚，抽干被淹的矿井，改组田纳西河谷，把底特律的产能分给拖拉机和坦克，并决定是否加入巴黎清算联盟和跨国产业联合会。\n\n军事上，卡尔森要把各联合会的民兵收编进人民军。参谋部起草了“约翰·布朗计划”：在孟菲斯和开罗之间强渡，直插小石城和达拉斯，同时号召西岸的佃农和油田工人总罢工。另一种选择是“东部之盾”：不先开火，把每座工厂都准备成防御据点。\n\n对外，东岸要处理与加拿大、墨西哥铁路沿线和宪政联盟的关系。休伊·朗的健康每况愈下，他身后的继承之争，可能是渡河的时机。"
 krcw_intro_60_t:0 "中华民国：背景"
 krcw_intro_60_d:0 "这是中华民国的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_61_t:0 "中华民国：从龙岩到北京"
 krcw_intro_61_d:0 "一九二六年，国民革命军的北伐在金华失败。一九二七年二月蒋介石遇刺，汪精卫流亡巴黎；同年直系在德国支持下拥立溥仪，大清复辟。国民党残部退入闽赣山区，以龙岩为中心建立闽赣起义区，李济深、程潜、宋庆龄、邓演达在那里坚持下来。一九三二年上海起义失败后，他们成立了临时行动委员会。\n\n一九三六年，汪精卫自巴黎回国，与临时行动委员会合流，重组中国国民党（改组派），并得到法兰西公社的军火和顾问。第二次北伐从一九三七年开始，国民革命军从龙岩出发，经赣南、湘江北上，一九三八年攻克武汉，一九三九年攻克南京。德国忙于欧战，大清失去外援，一九四〇年北京陷落，溥仪退位，清廷覆亡。\n\n关外的奉系从来不承认北京的朝廷，也不肯向南京低头。日本以“满蒙特殊权益”为由出兵山东和辽西，支持张学良的奉军。国民革命军在华北与日军、奉军苦战四年。一九四三年辽西会战，叶挺、薛岳、林彪指挥的部队歼灭关东军主力，金元凤的朝鲜义勇队随军作战。一九四四年《青岛停战协定》签订，日本承认满洲和朝鲜脱离其控制，但国民革命军的海军无力渡海，台湾仍在日本手中。"
 krcw_intro_62_t:0 "中华民国：一九四九年的南京"
 krcw_intro_62_d:0 "汪精卫在一九四四年病逝。一九四六年，党内最激进的革命委员会派领袖周恩来联合陈公博领导的改组同志会激进派，击败顾孟余的温和派，出任国民政府主席兼中央执行委员会主席；陈公博出任建设委员会委员长，主持经济建设。周恩来早年留法，出身黄埔，是党内与公社关系最深的人。一九四七年中华民国加入第三国际，同年西藏噶厦与南京签订《拉萨协定》，成为高度自治的地方政府。此后中国派志愿军协助越南革命，并扶持柬埔寨、老挝、缅甸建立“兄弟民国”，朝鲜民国由金元凤领导。\n\n一九四九年春，党在南京召开第六次全国代表大会。中央执行委员会里，革命委员会派、顾孟余的温和派、宋庆龄身边的左派和黄埔同学会各占一块，党外还有在上海、武汉工会里势力很大的工团党。阎锡山、白崇禧、胡宗南等北伐中归顺的将领仍握有自己的军队和税源。\n\n“耕者有其田”写进党纲已有二十五年，乡村仍在地主手中。鞍山的高炉被炸毁了一半，淮河年年成灾。北面是萨文科夫的俄罗斯，西南是与俄国结盟的印度联邦，东面是占着台湾的日本，印度与俄罗斯的特务在拉萨出没。"
 krcw_intro_63_t:0 "中华民国：摆在南京面前的选择"
 krcw_intro_63_d:0 "南京的国策从第六次代表大会和土地法开始。党内的路线之争要在革命委员会路线和与温和派联合之间作出决定：前者要求土地法彻底、建设要快，后者让顾孟余出任行政院长，改革的节奏交给立法院。基层政权是建立县乡人民会议，还是实行非常时期条例。\n\n对地方实力派，可以用赎买与安置，也可以以兵削藩。训政何时结束、怎样结束，是开放选举还是由党指导下的国民大会；统一战线是续订、由党单独训政，还是开放联合政府。周恩来的接班和党政是否分开，也迟早要定。\n\n对外，中国要处理与兄弟民国的关系：签订平等条约，还是扩大顾问团。台湾问题可以支持台湾人民自决，也可以准备渡海解放。西藏可以恪守《拉萨协定》，也可以推动西藏改革。\n\n最大的外部危险在喜马拉雅山。印度联邦正通过锡金和不丹的山口向西藏贵族输送枪支，一旦西藏起事，这场战争两大阵营都会插手。"
 krcw_intro_70_t:0 "俄罗斯国：背景"
 krcw_intro_70_d:0 "这是俄罗斯国的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_71_t:0 "俄罗斯国：从白军到萨文科夫"
 krcw_intro_71_d:0 "一九一八年的《布列斯特-立陶夫斯克条约》让俄国把西部的大片领土交给了德国及其扶植的国家。随后的内战中，白军击败了布尔什维克，俄罗斯共和国在废墟上建立，一九二二年颁布宪法。\n\n共和国始终没有摆脱布列斯特体系的屈辱。政府更迭频繁，土地改革迟迟不能兑现，坦波夫的农民起义遭到镇压，农民对社会革命党的忠诚随之破裂。一九三四年，社会革命党出身的老恐怖分子、内战中的白军政委鲍里斯·萨文科夫夺取了权力。他的“国家民粹主义”主张土地归农民、工厂归国家与托拉斯、政治归执政者，他的运动自称继承了一九一四至一九二二年流下的全部鲜血。\n\n一九三七年，萨文科夫从东方进攻德意志帝国和中欧同盟，与西面的第三国际同时开战，两者之间没有任何盟约。俄军攻入东普鲁士，吞并了波罗的海三国和芬兰，夺取了维也纳以东的奥地利领土。一九四四年帝国崩溃，施莱歇尔将军带着残存的国防军向俄军投降，签订《柏林条约》，易北河以东成立了依附莫斯科的德意志民族共和国。"
 krcw_intro_72_t:0 "俄罗斯国：一九四九年的莫斯科"
 krcw_intro_72_d:0 "一九四九年的俄罗斯从易北河延伸到太平洋。萨文科夫年过七旬，是国家的最高执政者。宪法规定最高执政者由国家会议选举，但会议三分之二的成员由他任命，从未真正选举过任何人。国家保卫局和奥克拉那负责政治警察，反对者被行政流放到西伯利亚的流放村，牧首区是国家的一个部门。地方自治会重新负责修路、办学和请医生，但不许谈政治。\n\n俄国没有搞过集体化，村社的土地仍归农民，国家只要粮食定额。乌拉尔的钢铁托拉斯由国家持股、军队下单、私人经理经营。\n\n俄罗斯是莫斯科协定的领袖。德意志民族共和国的预算须经莫斯科批准，蒙古、波斯和阿富汗是它的附庸；波兰、匈牙利、罗马尼亚、保加利亚、南斯拉夫等军政府与它结盟。俄国的军火经墨西哥运给休伊·朗，经波斯运给印度的王公。国内，乌克兰语学校已改用俄语授课，波罗的海各省对俄罗斯化不满。\n\n萨文科夫从未指定继承人。总参谋部的华西列夫斯基、科学院的索罗金和聚在救主大教堂周围的君主派，都在等待那一天。"
 krcw_intro_73_t:0 "俄罗斯国：摆在莫斯科面前的选择"
 krcw_intro_73_d:0 "莫斯科的国策先要把萨文科夫的政治变成制度：把国家民粹主义写入法律，整顿国家保卫局，把村社地权写进宪法，讨论继承程序。在他生前，国家可以培植总参谋部，扶持科学院，或者让“王座与祭坛”的君主派接近权力。\n\n萨文科夫死后，国家会议要选出新的最高执政者。继任者的路线决定了俄罗斯此后的面貌：审计封闭城市预算、以火力和通信重建军队的将军；削减国防开支、转向拖拉机厂和师范学校的索罗金；把国家会议改名为帝国杜马、迎回皇帝的君主派；或者发动“最后的清算”的极端派。\n\n民族问题同样紧迫。波罗的海可以得到自治章程，也可以继续俄罗斯化；各民族地区可以实行总督制，颁布民族章程，或者与各省分别谈判自治。远东要在“阿穆尔边疆”和与南京会谈之间选择。\n\n对外，俄罗斯要维持协定：协定理事会、成员国的否决权、墨西哥通道和巴尔干成员的武装。易北河对岸就是第三国际的装甲师，两大阵营的任何一场全面战争都将从这里开始。"
 krcw_intro_80_t:0 "美利坚合众国：背景"
 krcw_intro_80_d:0 "这是美利坚合众国的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_81_t:0 "美利坚合众国：从巴吞鲁日到新奥尔良"
 krcw_intro_81_d:0 "休伊·朗在二十年代末当上路易斯安那州州长，靠修公路、发免费课本和对石油公司征税起家，后来以“分享我们的财富”运动闻名全国。一九二五年柏林崩盘后美国陷入长期萧条，朗组建统一党，把南方和中西部的农民、失业者和小业主拉到自己身边。一九三六年大选的合法性遭到质疑，北方的工团起事，朗也拒绝服从华盛顿，第二次美国内战爆发。\n\n内战的前半段，朗的部队由国民警卫队、州警和私人武装拼凑而成。一九四一年华盛顿陷落，麦克阿瑟带着联邦残军突围西撤，投奔了萨克拉门托的宪政政府。西海岸各州从内战一开始就不归新奥尔良管。一九四三年冬天，工团的装甲车开到了孟菲斯郊外，朗的军队只剩下猎枪和国民警卫队的旧步枪。\n\n转机来自俄国。萨文科夫需要一个能拖住法国盟友的美洲，第一列从坦皮科开来的火车把步枪、卡车和炮弹运进了圣安东尼奥。此后两年，巴顿指挥的军队把工团推回大河东岸。一九四六年，双方在圣路易斯签订停火协定。"
 krcw_intro_82_t:0 "美利坚合众国：一九四九年的新奥尔良"
 krcw_intro_82_d:0 "一九四九年春，休伊·朗在新奥尔良第四次宣誓就职。他的美国控制着密西西比河以西的南方、得克萨斯、大平原和落基山，地广人多，却比东岸穷得多，工厂数量远不如工团。国家靠棉花、得克萨斯的石油和俄国贷款支撑，西海岸的飞机厂落在麦克阿瑟手里，航空工业只好在堪萨斯的威奇托另起炉灶。\n\n统一党是一台庞大的机器：从新奥尔良到丹佛，每一个邮局局长、县治安官和公路承包商都欠朗一份人情。这台机器让西部在内战中活了下来，也让东岸的广播每天嘲笑“王鱼的百分之十”。朗的健康每况愈下，他的儿子拉塞尔·朗和弟弟厄尔·朗都是潜在的继承人，巴顿和莫斯利等南方将军也有自己的打算。\n\n数十万黑人老兵为朗打过内战，现在要求投票权，南方的党魁则威胁说谁动隔离制度就让南方停摆。俄国的军火和机器经墨西哥的港口和铁路北上，萨文科夫想要的回报是墨西哥湾港口里的泊位和得克萨斯石油的长期合同。"
 krcw_intro_83_t:0 "美利坚合众国：摆在新奥尔良面前的选择"
 krcw_intro_83_d:0 "朗的国策从党机器开始：继续扩大联邦恩庇网络，还是派联邦审计署去查账。《分享我们的财富法》对石油大亨和铁路巨头征收累进税，给每个家庭发放“家园津贴”，也要求领了津贴的家庭送儿子去国民警卫队。得克萨斯的石油、达拉斯的兵工厂、墨西哥湾的船坞和胡佛—佩克堡电网，是西部追赶东岸的本钱。\n\n黑人老兵的请愿要有答复：与南方参议员达成“小石城妥协”，还是坚守肤色线。\n\n最大的问题是继承。朗死后，厄尔·朗可以把州长、将军和议会领袖请进州长官邸，谈出一个人人保住座位的安排；南方的将军们也可以组成将军委员会，让巴顿的坦克开进新奥尔良，宣布“宪法暂停”。\n\n对外，朗要争取俄国贷款，拉拢宪政联盟，修筑密西西比河西岸的要塞带。陆军部起草了收复东部的“阿波马托克斯行动”，也有人主张以守为攻。停火线两岸的任何一次冲突，都可能让内战重新开始。"
 krcw_intro_90_t:0 "德意志民族共和国：背景"
 krcw_intro_90_d:0 "这是德意志民族共和国的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_91_t:0 "德意志民族共和国：从帝国崩溃到柏林条约"
 krcw_intro_91_d:0 "一九一九年的胜利让德意志帝国成了欧洲的主人，但一九二五年柏林股市的“黑色星期四”之后，帝国的经济和政治再没有稳定下来。库尔特·冯·施莱歇尔是帝国陆军里最懂政治的将军，多年在国防部和总参谋部之间周旋，与工会里的民族派和容克地主都有来往。\n\n一九三七年，第三国际从西面、萨文科夫的俄罗斯从东面同时进攻帝国。一九四三年莱茵河防线崩溃，莱茵兰、鲁尔、汉堡和巴伐利亚落入国际手中。一九四四年春帝国崩溃，皇帝威廉三世带着帝国政府逃往中非帝国的达累斯萨拉姆，想在非洲继续战争。同年秋天中非殖民军瓦解，总督投降，皇帝转往瑞典斯德哥尔摩流亡。\n\n施莱歇尔没有跟皇帝走。他带着残存的国防军和总参谋部向俄国人投降，签下《柏林条约》，换来了易北河以东的一个德意志国家：勃兰登堡、萨克森、图林根和东柏林。柏林被一分为二，西柏林归西边的社会主义共和国。俄国人按条约拆走了一半机床作为赔偿，共和国的预算须经莫斯科批准。"
 krcw_intro_92_t:0 "德意志民族共和国：一九四九年的东柏林"
 krcw_intro_92_d:0 "施莱歇尔一九四九年六十七岁，没有指定继承人，也没有建立自己的政党。他的“横向阵线”把军官团、工会里的民族派和容克地主拉进同一个民族阵线：尼基施的人要“面向东方”，君主派等着皇帝回来，将军对两边都点头。临时的人民议院刚刚重新召开，君主派只是反对派，任何复辟都需要莫斯科点头。\n\n帝国总参谋部在一九四四年后改名保留下来，文官部长的任命须经它同意，曼施坦因还在。《柏林条约》限制了陆军的师数，每增加一批都要一份新的议定书。\n\n经济上，东德没有鲁尔，只有卢萨蒂亚的褐煤、洛伊纳的煤化工、萨克森的光学和机床，以及罗斯托克的船厂。厄尔士山的旧银矿里发现了铀，俄国地质队带着武装押运队封了整座山。\n\n西柏林是一个开口。东德人可以持通行证进城，也有人从那里离开再不回来。东柏林的报纸每天宣布分裂是暂时的，市政府却还得给那条部门边界装路灯、修检查站。"
 krcw_intro_93_t:0 "德意志民族共和国：摆在施莱歇尔面前的选择"
 krcw_intro_93_d:0 "民族共和国的国策从重建和易北河防线开始。和莫斯科的关系是第一道选择：争取协定优先装备，成为最可靠的前线；或者走独立路线，小心地说出德意志的利益在德意志自己。修订《柏林条约》、结束赔偿、恢复外交部，也要一次次去莫斯科谈。\n\n人口外流逼着将军府作决定：全面推行福利国家计划，用住宅、退休金和医院留住人，代价是缩减军队；或者封闭柏林部门边界，停止外流，承受政权形象的损失。\n\n施莱歇尔身后怎么办，是贯穿始终的问题。共和国可以把自己彻底交给俄军，也可以游说莫斯科支持一位立宪的霍亨索伦君主。他死后，总参谋部可以成立国防委员会接管，宪法法院也可以裁定军方对文官任命的否决权违宪。陆军是以易北河为主要方向，还是把两个军留在内地维持秩序，也要定下来。\n\n易北河对岸就是国际的装甲师。如果战争爆发，东德是第一个战场，它要撑住七十二小时，等俄罗斯的坦克集团军赶到。"
 krcw_intro_100_t:0 "印度联邦：背景"
 krcw_intro_100_d:0 "这是印度联邦的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_101_t:0 "印度联邦：王公的统一"
 krcw_intro_101_d:0 "一九二三年盐税翻倍，成了印度起义的导火索之一。一九二五年不列颠革命后，英属印度失去了宗主，次大陆陷入内战。一九二七年停火时，印度分成几块：德里的自治领仍效忠流亡的国王；孟加拉和恒河平原的革命者建立了与第三国际关系密切的印度公社；南方的土邦在海德拉巴尼扎姆奥斯曼·阿里·汗的领导下组成王公联邦。瓜廖尔的辛迪亚家族在内战中被社会主义武装赶出自己的土邦，此后一直寄居海德拉巴。\n\n一九四〇年代初，第三国际的主力正在欧洲作战，王公联邦以“反赤化”为旗号发动统一战争。俄罗斯送来军火和顾问，德里的自治领也站到了王公一边。战争中，瓜廖尔大君吉瓦吉拉奥·辛迪亚成为联邦的领袖。一九四七年，联邦军队攻灭印度公社，统一了包括旁遮普、信德和孟加拉在内的整个次大陆。\n\n统一战争摧毁了孟加拉的粮仓。从那以后，每逢季风不来，饥荒就会席卷恒河平原。"
 krcw_intro_102_t:0 "印度联邦：一九四九年的德里"
 krcw_intro_102_d:0 "统一战争结束两年后，五百多位王公第一次齐聚德里的王公院。辛迪亚是王公院的主席，王公们带来了象队、珠宝和各自的要求。新德里的联邦秘书处由从各土邦借调来的文官组成，他们刚开始为整个次大陆编制统一的预算，许多人第一次知道联邦到底有多穷。\n\n联邦是一个王公贵族与军人共治的右翼国家。土邦仍然各行其是，海德拉巴不愿向联邦缴税，孟加拉的稻田里柴明达尔地主照旧收租。种姓、宗教、饥荒和农民暴动是它最大的内部问题，比哈尔和特伦甘纳的农民一再起事。\n\n联邦陆军第一次让拉杰普特的骑兵、锡克的步兵和廓尔喀的山地营穿上同一种军服，但军饷仍由各自的王公发放。俄国顾问训练的保安总队擅长驱散集会、监视报馆。\n\n印度联邦是莫斯科协定的成员。莫斯科的信贷换来了孟买的轧钢机和坎普尔的兵工厂，每一笔贷款都附有“友好条款”。北面的喜马拉雅山那边是中华民国治下的西藏，王公的特使已经在大吉岭和噶伦堡与拉萨贵族往来。"
 krcw_intro_103_t:0 "印度联邦：摆在德里面前的选择"
 krcw_intro_103_d:0 "德里的国策从召集王公院开始：王公院要选举联邦总统，建立迪万会议和统一的行政机器。第一个大选择是土地：否决土地改革，与柴明达尔地主签订盟约；或者接受少壮王公的备忘录，在联邦直辖省份推行佃租法令、寺庙开放令和有限选举的省议会。\n\n饥荒和动乱会一次次回来。联邦可以设立饥荒救济委员会、修运粮铁路、开运河垦殖区，也可以宣布无限期戒严，用特别法庭维持秩序。土邦的抗税和农民起事一旦同时爆发，王公联邦赖以立国的“传统”就会从内部崩塌。\n\n经济和军队依赖莫斯科：卢布贷款、孟买的纺织厂、贾姆谢德布尔的钢铁、俄式参谋学院。军队要决定由谁统领各师，王公的私兵何时收归联邦。\n\n对外，最危险也最诱人的是西藏。联邦可以经噶伦堡的情报网联络康巴首领，武装“护教军”，在高原上点燃一场战争；也可以与南京修好。无论哪条路，都会牵动莫斯科和第三国际。"
 krcw_intro_110_t:0 "日本：背景"
 krcw_intro_110_d:0 "这是日本的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_111_t:0 "日本：从大正到青岛"
 krcw_intro_111_d:0 "二十年代的日本有过政党内阁，议会、工会和报纸都很活跃，后来的自由派把那段时间称作大正年间。进入三十年代，军部和统制派官僚的势力越来越大，政党内阁让位给了由官僚和将军主导的政府。\n\n一九四〇年北京陷落，大清覆亡，北上的国民革命军面对的是关外张学良的奉系。日本以“满蒙特殊权益”为由出兵山东和辽西，支持奉军对抗国民革命军。战争在华北打了四年。一九四三年的辽西会战中，叶挺、薛岳、林彪指挥的国民革命军歼灭了关东军主力。\n\n一九四四年《青岛停战协定》签订。日本承认满洲和朝鲜脱离其控制，朝鲜在中国扶持下成立了朝鲜民国。协定把帝国陆军限制在二十个师以内，不许有重型装备和战略航空兵。国民革命军的海军无力渡海，台湾仍留在日本手中，南洋群岛的托管地和千岛群岛也保住了。大陆上的移民、士兵和官员撤回本土，他们需要工作、住房和一个解释。"
 krcw_intro_112_t:0 "日本：一九四九年的东京"
 krcw_intro_112_d:0 "首相岸信介被人称作“昭和之妖”。战时他是统制派的经济官僚，管过满洲的工业和本土的军需，战败后没有被清算。如今他领导国民精神同盟，靠通产省的官僚机器而不是选票统治日本：外汇配额、进口许可和银行贷款都在那栋楼里。三井、三菱和住友的董事们又被请进了通产省。\n\n石原莞尔的将军们要一支能收复大陆的军队，岸信介要的是一支能保住政权的军队。议会里的强硬派问为什么不收复满洲，岸信介的回答是俄国不会允许。反对派分成几股：石桥湛山的自由派早在二十年代就主张放弃殖民地，片山哲的社会大众党要工会合法、军队服从内阁，吉田茂的保守派主张把军备压到最低、专心做生意。\n\n台湾在日本统治下已经五十年。台北的总督府修铁路、建糖厂，也在抓捕自治运动的组织者，南京的广播每晚对着海峡播放。日本不属于任何阵营，但俄国人把库页岛的石油卖给东京，价格很公道，它是莫斯科协定在太平洋上的准盟友。"
 krcw_intro_113_t:0 "日本：摆在东京面前的选择"
 krcw_intro_113_d:0 "东京的国策先要安置从大陆撤回的人，稳定国内，然后决定经济由谁来管：由通产省制定产业规划，还是让财阀自己掌权；建立经济官僚体系，还是走保守合同的路。造船、电子和太平洋沿岸的工业带是日本复兴的本钱。\n\n政治上，岸信介要与军方达成协议。日本可以重整军备，用“警察预备队”绕过停战协定的师数限制；也可以回到大正精神，由议会多数党组阁，官僚不再能绕过议会发布敕令。\n\n台湾是最直接的问题：开设台湾议会，让台湾人自己决定糖价、学校语言和地方警察；或者把台湾建成要塞，在澎湖和高雄修筑炮台。南京随时可能准备渡海。\n\n对外，日本要在加入莫斯科协定和宣布太平洋中立之间选择。加入协定的条件是日本不再觊觎满洲，俄国承认台湾属于日本；中立则意味着向两个阵营出口，做太平洋的工厂。"
 krcw_intro_120_t:0 "美利坚宪政联盟：背景"
 krcw_intro_120_d:0 "这是美利坚宪政联盟的背景介绍，共三页：这个国家的由来，它在一九四九年的处境，以及摆在它面前的选择。可以现在阅读，也可以跳过，直接开始。"
 krcw_intro_121_t:0 "美利坚宪政联盟：从华盛顿到萨克拉门托"
 krcw_intro_121_d:0 "一九三六年大选引发危机，陆军参谋长道格拉斯·麦克阿瑟执行“白色作战计划”，带兵控制了华盛顿。工团在芝加哥起事，休伊·朗占据了南方。西海岸各州的州长不承认政变政府，赶到萨克拉门托的国会议员宣布凑足了法定人数，宣布被软禁的总统不能视事，由副总统昆汀·罗斯福代理总统。乔治·马歇尔将军前来效力，太平洋舰队也跟着州长们留在了西海岸，只有少数忠于麦克阿瑟的军舰哗变东去。\n\n麦克阿瑟在华盛顿两面作战，守了五年。一九四一年冬天华盛顿陷落，他带着残存的联邦军和陆军部的档案突围西撤。萨克拉门托缺兵，国会赦免了他，任命他为西部防务司令。一九四二年国会通过《战时权力法》，把旧金山、奥克兰、洛杉矶、西雅图和内华达山的隘口划为军区，交给他的司令部管辖，每年续期一次。\n\n萨克拉门托政府管着加利福尼亚、俄勒冈、华盛顿、内华达、爱达荷和阿拉斯加，国会给它定名为“美利坚宪政联盟”，自称合众国唯一的宪政政府。夏威夷总督斯坦贝克不肯承认它，宣布成立共和国，珍珠港的军舰一半开回本土，一半留了下来。一九四六年的圣路易斯停火协定由工团和朗签订，萨克拉门托不是签约方，也不承认另外两个政权。"
 krcw_intro_122_t:0 "美利坚宪政联盟：一九四九年的萨克拉门托"
 krcw_intro_122_d:0 "一九四八年大选，共和党的厄尔·沃伦以废除战时权力法为纲领，击败民主党的克拉伦斯·马丁，一九四九年一月接替罗斯福就任总统。六十九岁的麦克阿瑟仍在旧金山要塞指挥西部防务司令部，温赖特、哈尔西等跟他西来的军官被称为“要塞派”，他们认为国会守不住西海岸。陆军参谋长马歇尔效忠国会，一直想让麦克阿瑟退役。旧金山、奥克兰和西雅图的码头工会从来没有服从过军区的命令。\n\n宪政联盟与东岸的工厂、与得克萨斯的油田都隔断了。加州的橙子、俄勒冈的木材和华盛顿的铝要找新的买家，洛杉矶的洛克希德、道格拉斯和北美航空工厂没有了联邦订单。大古力和邦纳维尔大坝的电力、中央谷地的农场和内华达的矿山是它的本钱，但石油和资金都不够。\n\n尼米兹上将的太平洋舰队是宪政联盟唯一能与另外两个美国相比的力量。内华达山和落基山之间的隘口是朗的军队唯一的通道。阿拉斯加离俄罗斯很近，那里的驻军既是前哨，也是筹码。\n\n两大阵营都在争取萨克拉门托。纽约的特使坐火车来，新奥尔良的特使坐飞机来，巴黎和莫斯科的特使坐船来。巴黎的船坞信贷要求释放被军区关押的码头工会领袖，莫斯科的石油要求阿拉斯加的机场将来向“共同防御”开放。"
 krcw_intro_123_t:0 "美利坚宪政联盟：摆在萨克拉门托面前的选择"
 krcw_intro_123_d:0 "宪政联盟的国策从萨克拉门托与要塞的关系开始。沃伦总统要审查战时权力法，第一道选择是把港口交还文官政府，还是扩大军区、再次续期。码头工会是谈判还是镇压，纽约和新奥尔良都在看。\n\n随后是宪法本身：召开制宪会议，废除战时权力法；或者让它一直有效到战争结束。麦克阿瑟退役以后西部防务司令部交给谁，温赖特、舰队和陆军的联合指挥，还是撤销司令部，也要由国会表决。如果国会一再让步，要塞派最终会接管政府，国会休会，由麦克阿瑟主持军事委员会。\n\n对外，萨克拉门托可以宣布中立，与东京、堪培拉和檀香山商谈一个太平洋公约；可以向纽约靠拢，自己谈定加入第三国际的条件；也可以与新奥尔良和解，接受朗的统一条件。如果第三国际赢得萨克拉门托，码头工会和民主党左翼会掌握国会；如果莫斯科赢了，太平洋舰队就会站到朗的一边。"
