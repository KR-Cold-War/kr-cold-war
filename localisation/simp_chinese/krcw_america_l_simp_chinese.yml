l_simp_chinese:
# krcw: years paced
 krcw_mississippi_line:0 "密西西比停火线"
 krcw_mississippi_line_desc:0 "1946年《圣路易斯停火协定》把合众国从中间劈开。从明尼苏达到路易斯安那，两支军队隔着这条大河对峙：西岸是休伊·朗的沙袋与探照灯，东岸是工团民兵的战壕与广播喇叭。渡船早已停航，只有夜里的枪声从未真正停过。"
 krcw_second_civil_war_phase:0 "内战第二阶段"
 krcw_second_civil_war_phase_desc:0 "停火协定作废了。密西西比河再一次变成了战线，美国人再一次向美国人开枪。报纸不再说“内战”——它们说“第二阶段”，仿佛第一阶段从来没有结束过。"
 krcw_usa_machine_corruption:0 "机器的油水"
 krcw_usa_machine_corruption_desc:0 "每一份国防合同都要经过新奥尔良州议会大厦里一间没有门牌的办公室。每一座新桥都有一位“朋友”拿走百分之十。朗的机器运转得很顺畅——因为它被金钱润滑着。"
 krcw_usa_color_line:0 "肤色线危机"
 krcw_usa_color_line_desc:0 "数十万黑人老兵为朗打过内战，回家后却发现路易斯安那、阿肯色与得克萨斯的投票站、公立医院乃至“分享我们的财富”的救济窗口仍然挂着“仅限白人”的牌子。每个月都有成千上万人偷渡密西西比河，投奔东岸的工团。"
 krcw_usa_long_ailing:0 "病中的“王鱼”"
 krcw_usa_long_ailing_desc:0 "休伊·朗已经很少公开露面。总统府发言人说总统只是“感冒”，可是每个进过他在新奥尔良的办公室的人都闻到了药味。每一个派系都在盘算“之后”。"
 krcw_usa_succession_chaos:0 "继承混乱"
 krcw_usa_succession_chaos_desc:0 "“王鱼”死了，他的机器却没有继承法。州长们、将军们、朗家族的亲戚们和莫斯科的顾问们同时伸出手来，想抓住方向盘。"
 krcw_usa_restless_generals:0 "躁动的将军们"
 krcw_usa_restless_generals_desc:0 "南方与西部的将军们在内战中守住了半个美国，却眼看着政客瓜分了胜利果实。参谋部的晚宴上，有人举杯“为了一个没有律师的美国”。"
 krcw_usa_earl_compromise:0 "厄尔的交易"
 krcw_usa_earl_compromise_desc:0 "厄尔·朗没有哥哥的魅力，却比哥哥更会做交易。他给州长们让出了预算，给将军们让出了体面，给黑人老兵让出了选票——换来的是一个还能运转的国家。"
 krcw_usa_junta:0 "将军委员会"
 krcw_usa_junta_desc:0 "宪法被“暂停实施”，新奥尔良的州议会大厦门口停着坦克。将军委员会宣布自己是“美国宪政的看护人”——直到“东岸的叛乱被彻底平定为止”。"
 krcw_usa_civil_rights_act:0 "小石城民权妥协"
 krcw_usa_civil_rights_act_desc:0 "联邦选举不再允许人头税与识字测验；“分享我们的财富”的救济窗口拆掉了分隔栏。南方的老派议员们咬牙切齿，但黑人老兵们第一次排队去投了票。"
 krcw_usa_hard_segregation:0 "坚守肤色线"
 krcw_usa_hard_segregation_desc:0 "新奥尔良向南方的议员们保证：什么都不会改变。国民警卫队守在密西西比河的渡口，拦截向东逃亡的黑人家庭。每一个被拦下的人，都在东岸的广播里成了一个名字。"
 krcw_usa_audited_machine:0 "审计过的机器"
 krcw_usa_audited_machine_desc:0 "联邦审计署的会计师们第一次查了“机器”的账——从新奥尔良到各州的党部，一本也没落下。机器仍在，只是油水少了些，齿轮转得更准了。"
 krcw_usa_russian_mission:0 "俄罗斯军事顾问团"
 krcw_usa_russian_mission_desc:0 "萨文科夫派来的军官们在胡德堡和莱利堡开设了课程。他们带来了伏尔加河畔的装甲战经验，也带来了对美国“民主习气”的轻蔑。"
 krcw_usa_russian_aid:0 "韦拉克鲁斯生命线"
 krcw_usa_russian_aid_desc:0 "俄罗斯的货轮在韦拉克鲁斯卸下机床、卡车和整套的兵工厂设备，墨西哥的铁路再把它们运过格兰德河。西岸的工厂比东岸少，但每一座都装着最新的俄罗斯机器。"
 krcw_usa_texas_oil_boom:0 "得克萨斯石油热"
 krcw_usa_texas_oil_boom_desc:0 "东得克萨斯与二叠纪盆地的井架像森林一样拔地而起。石油换来了俄罗斯的贷款、墨西哥的铁路和休斯敦的新炼油厂。"
 krcw_usa_sow_mobilization:0 "分享财富总动员"
 krcw_usa_sow_mobilization_desc:0 "每一个领到“家园津贴”的家庭都有义务送一个儿子去国民警卫队。朗说这是“权利与义务的交换”，农民们说这很公平。"
 krcw_usa_river_fortress:0 "西岸要塞带"
 krcw_usa_river_fortress_desc:0 "从圣路易斯到新奥尔良，工兵们沿河岸浇筑了成排的混凝土碉堡。朗的宣传画上写着：“河水不会倒流，赤色分子也休想过来。”"
 krcw_usa_frontier_rangers:0 "边疆游骑兵"
 krcw_usa_frontier_rangers_desc:0 "得克萨斯游骑兵、俄克拉何马的牛仔和落基山的猎人组成了朗最凶悍的部队。他们熟悉每一条河谷，也不需要太多补给。"
 krcw_wca_syndicate_factionalism:0 "工团派系之争"
 krcw_wca_syndicate_factionalism_desc:0 "底特律的汽车工人联合会、匹兹堡的钢铁工人联合会、纽约的码头与服装工会，每一家都有自己的报纸、自己的民兵和自己的路线。代表大会上的每一次表决都像一次小型的战役。"
 krcw_wca_appalachian_front:0 "重建阿巴拉契亚"
 krcw_wca_appalachian_front_desc:0 "内战最惨烈的战斗发生在阿巴拉契亚山区与俄亥俄河谷。被炸毁的铁路、淹水的矿井与烧毁的城镇，需要十年才能恢复。"
 krcw_wca_eastern_syndicates:0 "东部工团"
 krcw_wca_eastern_syndicates_desc:0 "底特律、匹兹堡、芝加哥与纽约的工厂由工人委员会管理，它们是美洲大陆上最强大的工业心脏。"
 krcw_wca_canadian_arsenal:0 "北方兵工厂协定"
 krcw_wca_canadian_arsenal_desc:0 "安大略与五大湖两岸的工厂合并了调度中心，加拿大的镍、铀与木材沿圣劳伦斯河源源不断地运来。"
 krcw_wca_clearing_union:0 "巴黎清算联盟成员"
 krcw_wca_clearing_union_desc:0 "有了巴黎清算联盟，底特律的卡车可以直接换回里昂的机床和曼彻斯特的电机。一个劳工的世界市场把东岸的工厂接进了全球。"
 krcw_wca_industrial_democracy:0 "产业民主"
 krcw_wca_industrial_democracy_desc:0 "鲁瑟的“产业民主宪章”规定：每一座工厂的计划由工人委员会与地区联合会共同拟定，技术人员有发言权，但没有否决权。"
 krcw_wca_black_brigades:0 "黑人旅"
 krcw_wca_black_brigades_desc:0 "从西岸逃来的黑人老兵与亚拉巴马、佐治亚的黑人工人在菲利普·伦道夫的号召下组成了自己的旅。他们的旗帜上写着：“我们第二次渡过了约旦河。”"
 krcw_wca_deep_defense:0 "纵深防御"
 krcw_wca_deep_defense_desc:0 "卡尔森的参谋部放弃了“守住河岸每一寸”的幻想。第一道防线在河边，第二道在田纳西与肯塔基的丘陵，第三道在阿巴拉契亚山区——敌人每突破一道，就会发现后面还有一道。"
 krcw_wca_liberation_army:0 "解放军"
 krcw_wca_liberation_army_desc:0 "“西岸的工人和佃农在等待我们。”解放战争的计划已经从抽屉里拿了出来。并非所有工团代表都赞成，但前线的士兵已经在擦拭刺刀。"
 krcw_wca_refugee_workshops:0 "难民工坊"
 krcw_wca_refugee_workshops_desc:0 "从得克萨斯油田和加州码头逃来的工会会员在底特律与克利夫兰重新开工。他们带来了西部的手艺，也带来了对朗的刻骨仇恨。"
 krcw_wca_atlantic_yards:0 "大西洋船坞"
 krcw_wca_atlantic_yards_desc:0 "诺福克、费城与布鲁克林的船台昼夜不息。里科弗对工人代表说：“东岸有钢，有船坞，有工人——我们要一支配得上它们的舰队。”"
 krcw_wca_federal_syndicalism:0 "联邦工团主义"
 krcw_wca_federal_syndicalism_desc:0 "各产业联合会的争吵没有消失，但有了规则：地区联合会拥有预算，全国代表大会只管国防、外交与清算。派系之争从街头回到了会场。"
 USA_krcw_earl_long:0 "厄尔·朗"
 USA_krcw_moseley:0 "乔治·范·霍恩·莫斯利"
 USA_krcw_russell:0 "小理查德·拉塞尔"
 USA_krcw_dies:0 "小马丁·戴斯"
 WCA_krcw_randolph:0 "阿萨·菲利普·伦道夫"
 WCA_krcw_wallace:0 "亨利·华莱士"
 WCA_krcw_flynn:0 "伊丽莎白·格利·弗林"
 USA_krcw_earl_long_desc:0 "休伊·朗的弟弟，前路易斯安那州长。粗鲁、精明、嗜赌，对政治交易的嗅觉远胜对意识形态的兴趣。兄长在世时他总被看作“那个不成器的弟弟”，如今却可能成为唯一能把朗的机器拼在一起的人。内战后路易斯安那成了朗的美国的心脏，新奥尔良成了首都，厄尔在这里比任何人都更如鱼得水。"
 USA_krcw_moseley_desc:0 "退役将军，内战前期的参谋长，以强烈的反共与种族主义观点闻名。南方将领集团把他推到前台，作为“秩序”的象征。"
 krcw_usa_every_man_a_king:0 "人人都是国王"
 krcw_usa_every_man_a_king_desc:0 "一九四九年春，休伊·朗在新奥尔良第四次宣誓就职。东岸的工业仍在工团手里，他的美国地广而贫穷，靠棉花、石油和俄国贷款支撑。"
 krcw_usa_the_machine_endures:0 "巩固党机器"
 krcw_usa_the_machine_endures_desc:0 "从新奥尔良到丹佛，每一个邮局局长、每一个县治安官和每一个公路承包商都欠朗一份人情。这台机器让西部在内战中活了下来——问题是，它能否在和平中活下去？"
 krcw_usa_federal_patronage:0 "联邦恩庇网络"
 krcw_usa_federal_patronage_desc:0 "把更多的职位、合同和补贴分给忠诚的人。机器会更牢固，也会更贪婪。"
 krcw_usa_audit_the_machine:0 "审计机器"
 krcw_usa_audit_the_machine_desc:0 "朗自己也知道，东岸的广播每天都在嘲笑“王鱼的百分之十”。他派出联邦审计署，查的是别人的账——但总算是查了。"
 krcw_usa_america_first_congress:0 "统一党代表大会"
 krcw_usa_america_first_congress_desc:0 "统一党在达拉斯召开全国代表大会。台上是统一的口号，台下是各州党魁的讨价还价。"
 krcw_usa_the_1952_campaign:0 "一九五〇年竞选"
 krcw_usa_the_1952_campaign_desc:0 "朗的第五次竞选。所有人都知道结果，但机器仍要把竞选办得像一场真正的选举——因为东岸在看，莫斯科也在看。"
 krcw_usa_the_kingfish_legacy:0 "安排休伊·朗接班"
 krcw_usa_the_kingfish_legacy_desc:0 "休伊·朗走了。他留下的是一座尚未完工的大厦：半个国家、一台机器、一群野心勃勃的继承人。"
 krcw_usa_earls_bargain:0 "召开州长官邸会议"
 krcw_usa_earls_bargain_desc:0 "厄尔·朗把州长、将军和议会领袖请进新奥尔良的州长官邸打了一整夜的扑克。天亮时，每个人都输了一点，但每个人都保住了座位。"
 krcw_usa_council_of_generals:0 "将军委员会"
 krcw_usa_council_of_generals_desc:0 "南方的将军们不再等待政客。巴顿的坦克开进了新奥尔良，莫斯利宣布“宪法暂停”。一个没有律师的美国诞生了。"
 krcw_usa_new_america_first:0 "新统一党纲领"
 krcw_usa_new_america_first_desc:0 "厄尔的党纲不再谈论“统一全美”，而是谈论“把西岸建成让东岸羡慕的地方”。这是一个悄然的转向：从征服，到竞争。"
 krcw_usa_martial_order:0 "军事秩序"
 krcw_usa_martial_order_desc:0 "军事法庭取代了陪审团，宵禁取代了新奥尔良的爵士夜。将军们说，这只是“战时的临时措施”。停火线两岸的战争并没有结束，这些措施也就一直没有取消。"
 krcw_usa_the_color_line:0 "回应黑人老兵的请愿"
 krcw_usa_the_color_line_desc:0 "数十万黑人老兵为朗打过内战，现在要求投票权。河对岸的工团向每个渡河者承诺选票和工作。"
 krcw_usa_veterans_petition:0 "老兵请愿书"
 krcw_usa_veterans_petition_desc:0 "黑人退伍军人协会收集了二十万个签名。请愿书的第一页上写着：“在‘分享我们的财富’里，也分给我们一份公民权。”"
 krcw_usa_little_rock_compromise:0 "小石城妥协"
 krcw_usa_little_rock_compromise_desc:0 "朗与南方参议员们谈了三个星期。结果是一份谁都不满意的妥协：联邦选举取消人头税，救济窗口取消隔离，但各州的学校“暂不变动”。"
 krcw_usa_hold_the_line:0 "坚守肤色线"
 krcw_usa_hold_the_line_desc:0 "南方的党魁们威胁说，只要新奥尔良敢动隔离制度，他们就让整个南方停摆。朗选择了他们。"
 krcw_usa_federal_voting_act:0 "联邦选举权法"
 krcw_usa_federal_voting_act_desc:0 "妥协只是开始。联邦法院开始受理选举歧视案件，联邦执法官护送黑人选民走进投票站。"
 krcw_usa_guard_the_crossings:0 "封锁渡口"
 krcw_usa_guard_the_crossings_desc:0 "国民警卫队在密西西比河的每一个渡口设卡。逃亡者被抓回来，送进劳动营。东岸的广播每晚念出他们的名字。"
 krcw_usa_integrated_divisions:0 "合编师"
 krcw_usa_integrated_divisions_desc:0 "陆军部取消了“有色人种团”的编制。许多南方军官递交了辞呈，但更多的黑人士兵重新报名入伍。"
 krcw_usa_share_our_wealth_act:0 "通过《分享我们的财富法》"
 krcw_usa_share_our_wealth_act_desc:0 "朗的招牌政策：对石油大亨与铁路巨头征收没收性的累进税，给每个家庭发放“家园津贴”。西部的富人们无处可逃，只好交钱。"
 krcw_usa_texas_oil_boom_f:0 "得克萨斯石油热"
 krcw_usa_texas_oil_boom_f_desc:0 "东岸有底特律，西岸有得克萨斯。休斯敦的炼油厂与二叠纪盆地的井架将为朗的美国换来它缺少的一切。"
 krcw_usa_veracruz_lifeline:0 "韦拉克鲁斯生命线"
 krcw_usa_veracruz_lifeline_desc:0 "俄罗斯答应向西岸运来整套的工厂设备，走海路到韦拉克鲁斯，再经墨西哥铁路北上拉雷多。代价是得克萨斯石油的长期合同。"
 krcw_usa_dallas_arsenal:0 "达拉斯兵工厂"
 krcw_usa_dallas_arsenal_desc:0 "俄国工程师与得克萨斯工人在达拉斯和沃斯堡郊外建起兵工厂。"
 krcw_usa_california_aircraft:0 "威奇托航空工业"
 krcw_usa_california_aircraft_desc:0 "西海岸的飞机厂留在了萨克拉门托的宪政联盟，朗只好在堪萨斯的麦田里另起炉灶。威奇托与沃思堡的新厂房收归“国防航空局”，从洛杉矶挖来的工程师工资翻了一番。"
 krcw_usa_boulder_dam_grid:0 "胡佛大坝电网"
 krcw_usa_boulder_dam_grid_desc:0 "胡佛大坝、佩克堡大坝与大象丘大坝连成了一张电网。朗的宣传画上写着：“朗的电灯，照亮西部。”"
 krcw_usa_sow_mobilization_f:0 "分享财富总动员"
 krcw_usa_sow_mobilization_f_desc:0 "东岸的工厂更多，西岸的人更多。每一个领到“家园津贴”的家庭都有义务送一个儿子去国民警卫队。"
 krcw_usa_pacific_yards:0 "墨西哥湾船坞"
 krcw_usa_pacific_yards_desc:0 "休斯敦、奥兰治与新奥尔良的船坞日夜赶工。太平洋舰队留在了旧金山，朗要在墨西哥湾造一支自己的海军。"
 krcw_usa_iron_range_steel:0 "铁岭钢铁"
 krcw_usa_iron_range_steel_desc:0 "明尼苏达铁岭的矿石过去都运往五大湖东岸的钢厂。现在，东岸的钢厂被河隔断了，朗要在德卢斯与圣路易斯附近建自己的高炉。"
 krcw_usa_kingfish_highways:0 "王鱼公路网"
 krcw_usa_kingfish_highways_desc:0 "朗在路易斯安那修过公路，如今他要在整个西部修。每一条公路都通向一个投票站——也通向密西西比河。"
 krcw_usa_west_bank_prosperity:0 "发展西岸消费品"
 krcw_usa_west_bank_prosperity_desc:0 "冰箱、电视机和雪佛兰。西岸的中产阶级第一次觉得，朗的美国也许不只是一座兵营。工厂的数量仍比不上东岸，但差距在一天天缩小。"
 krcw_usa_war_department_reform:0 "陆军部改革"
 krcw_usa_war_department_reform_desc:0 "内战的前半场是民兵、国民警卫队和私人武装的混战。现在，陆军部要建立一支真正的国家军队。"
 krcw_usa_russian_mission_f:0 "邀请俄罗斯顾问团"
 krcw_usa_russian_mission_f_desc:0 "萨文科夫愿意派来他最好的参谋军官——代价是在加尔维斯顿和圣迭戈给俄罗斯舰队留出泊位。"
 krcw_usa_patton_armored_corps:0 "巴顿装甲军"
 krcw_usa_patton_armored_corps_desc:0 "巴顿要求把全部新式坦克集中成一个装甲军。“一记重拳，”他说，“从圣路易斯打到芝加哥。”"
 krcw_usa_frontier_rangers_f:0 "边疆游骑兵"
 krcw_usa_frontier_rangers_f_desc:0 "西部的人口比东岸年轻，枪也比东岸多。得克萨斯游骑兵的传统被扩编成了一整个兵种。"
 krcw_usa_west_bank_fortress:0 "西岸要塞带"
 krcw_usa_west_bank_fortress_desc:0 "沿密西西比河西岸修筑碉堡与反坦克壕。朗说这是“和平的保险”，东岸说这是“第二条易北河防线”。"
 krcw_usa_gulf_fleet:0 "墨西哥湾舰队"
 krcw_usa_gulf_fleet_desc:0 "新奥尔良与加尔维斯顿的船坞里停着内战中投奔朗的旧海军舰只。它们需要维修，也需要一个比“封锁密西西比河口”更远大的使命。"
 krcw_usa_air_force:0 "美国陆军航空队"
 krcw_usa_air_force_desc:0 "俄罗斯的喷气式发动机图纸和威奇托的装配线结合起来，西岸第一次有了自己的喷气式战斗机。"
 krcw_usa_southern_academies:0 "南方军校"
 krcw_usa_southern_academies_desc:0 "西点军校在东岸。得克萨斯农工学院与路易斯安那州立大学的军事系接过了培养军官的任务——连同它们古老的南方传统。"
 krcw_usa_reclaim_the_east:0 "收复东部计划"
 krcw_usa_reclaim_the_east_desc:0 "参谋部的保险柜里有一份代号“阿波马托克斯”的计划：三路渡河，六周内拿下孟菲斯、芝加哥与华盛顿。"
 krcw_usa_operation_appomattox:0 "阿波马托克斯行动"
 krcw_usa_operation_appomattox_desc:0 "渡河。停火协定将被撕碎，美国内战将进入第二阶段。莫斯科和巴黎都会被卷进来。"
 krcw_usa_defensive_doctrine:0 "以守为攻"
 krcw_usa_defensive_doctrine_desc:0 "柯林斯和李奇微主张：让东岸先开枪。东岸的工厂更多，渡河进攻只会让西岸的年轻人死在芝加哥的街头；守住河岸，时间会让俄罗斯的援助与得克萨斯的石油发挥作用。"
 krcw_usa_moscow_accord_partner:0 "争取俄国贷款"
 krcw_usa_moscow_accord_partner_desc:0 "朗不是萨文科夫的傀儡——至少他自己这么认为。可是没有俄罗斯的贷款、机器和武器，西岸撑不过与东岸工厂的竞赛。"
 krcw_usa_rio_grande_railway:0 "格兰德河铁路"
 krcw_usa_rio_grande_railway_desc:0 "拉雷多与埃尔帕索的边境口岸扩建成了巨大的转运站。墨西哥的铁路车皮日夜不停地北上。"
 krcw_usa_the_naval_command_question:0 "拉拢宪政联盟"
 krcw_usa_the_naval_command_question_desc:0 "萨克拉门托的国会自称合众国唯一合法的国会，不承认新奥尔良。宪政联盟有舰队、有港口，却没有石油、没有钱，也没有足够的人。得克萨斯的原油与莫斯科的贷款，也许比大炮更能让沃伦总统和国会回心转意；要塞里的麦克阿瑟将军也可以单独谈。"
 krcw_usa_russian_loans:0 "卢布贷款"
 krcw_usa_russian_loans_desc:0 "莫斯科的国家银行向新奥尔良提供了一笔三十年期的贷款。条件写在第十四页的附录里。"
 krcw_usa_pacific_ports:0 "墨西哥湾港口"
 krcw_usa_pacific_ports_desc:0 "加尔维斯顿、科珀斯克里斯蒂与新奥尔良的港口向俄罗斯与墨西哥的商船全面开放，成为西岸通往世界的窗口。"
 krcw_usa_accord_deterrent:0 "划设内华达特别军事区"
 krcw_usa_accord_deterrent_desc:0 "俄罗斯的原子弹一旦问世，西岸就要成为它的盾牌——也可能成为它的靶子。内华达的沙漠已经被划为“特别军事区”。"
 krcw_usa_hemispheric_talks:0 "西半球会谈"
 krcw_usa_hemispheric_talks_desc:0 "墨西哥城召开了一次没有记者的会议：西岸、东岸、墨西哥与加拿大的外交官第一次坐在同一张桌子旁。"
 krcw_usa_letters_to_new_york:0 "致纽约的信"
 krcw_usa_letters_to_new_york_desc:0 "一封没有署名的信从新奥尔良寄到了纽约：“一九五四年是独立两百周年。到那时，我们是否还要隔河相望？”这是后来被称为“费城进程”的第一粒种子。"
 krcw_usa_share_our_wealth_law:0 "分享财富法"
 krcw_usa_share_our_wealth_law_desc:0 "一九三四年的纲领终于成了国法：没有人可以拥有超过三百万美元的财产，没有家庭的年收入可以低于两千美元。新奥尔良的会计们第一次发现，兑现一句口号比喊出它难一万倍。"
 krcw_usa_the_homestead_act:0 "宅地法"
 krcw_usa_the_homestead_act_desc:0 "每个家庭一栋房子、一辆卡车、一台收音机——这是国王鱼对平原的承诺。政府低价收购破产的农场，再分给退伍军人与佃农。"
 krcw_usa_the_old_age_pension:0 "养老金"
 krcw_usa_the_old_age_pension_desc:0 "六十岁以上的人每月领三十美元。这项开支吞掉了石油收入的四分之一，但它让国王鱼在每一个小镇的教堂里都有人替他说话。"
 krcw_usa_the_sunday_broadcast:0 "星期日广播"
 krcw_usa_the_sunday_broadcast_desc:0 "国王鱼的广播每周日晚上八点开始。他不谈意识形态，只谈钱：谁拿走了你的钱，我怎么替你要回来。三千万人在收听。"
 krcw_usa_the_wealth_tax:0 "财富税"
 krcw_usa_the_wealth_tax_desc:0 "得克萨斯的石油大亨第一次收到了真正的税单。他们中的一些人把钱转去了旧金山的银行，另一些人决定改为收买国会。"
 krcw_usa_the_barons_revolt:0 "应对大亨的反抗"
 krcw_usa_the_barons_revolt_desc:0 "石油、铁路与棉花的利益集团联合起来，要求国王鱼\"回到现实\"。政府必须决定：向他们妥协，还是把他们的公司收归国有。"
 krcw_usa_the_peoples_bank:0 "人民银行"
 krcw_usa_the_peoples_bank_desc:0 "国家接管了西部的银行体系。存款有了保障，信贷流向国王鱼指定的地方——这既是社会政策，也是政治机器的燃料。"
 krcw_usa_education_for_all:0 "免费教育"
 krcw_usa_education_for_all_desc:0 "路易斯安那州立大学的模式推广到全国：免费教科书、免费午餐、夜校扫盲班。国王鱼说，读过书的穷人才知道该恨谁。"
 krcw_usa_the_veterans_bonus:0 "退伍军人津贴"
 krcw_usa_the_veterans_bonus_desc:0 "内战的老兵领到了迟来的津贴。这笔钱让大部分军官继续效忠国王鱼。"
 krcw_usa_the_texas_boom:0 "扩大得克萨斯石油生产"
 krcw_usa_the_texas_boom_desc:0 "东得克萨斯、二叠纪盆地与墨西哥湾沿岸的油田日夜抽油。石油是这个政权唯一真正的硬通货，也是它与莫斯科讨价还价的本钱。"
 krcw_usa_the_gulf_refineries:0 "墨西哥湾炼油厂"
 krcw_usa_the_gulf_refineries_desc:0 "博蒙特与查尔斯湖的炼油塔连成一片钢铁森林。原油出口换外汇，成品油留给军队。"
 krcw_usa_synthetic_rubber:0 "合成橡胶"
 krcw_usa_synthetic_rubber_desc:0 "东南亚的橡胶在第三国际手里，西部的卡车和飞机却需要轮胎。化学家们在巴吞鲁日建起了合成橡胶厂。"
 krcw_usa_the_tampico_conduit:0 "坦皮科通道"
 krcw_usa_the_tampico_conduit_desc:0 "俄罗斯的军火经墨西哥的坦皮科港上岸，再由铁路运进得克萨斯。每一节车皮都让军队更强，也让这个政权更依赖莫斯科。"
 krcw_usa_the_wichita_works:0 "威奇托工厂"
 krcw_usa_the_wichita_works_desc:0 "堪萨斯的平原上，比奇、塞斯纳与波音的厂房一字排开。西部的空军要从这里长出来。"
 krcw_usa_the_power_grid:0 "胡佛—皮克电网"
 krcw_usa_the_power_grid_desc:0 "胡佛大坝、黄石与密苏里河上游的水电站连成一张电网。西部第一次有了足以支撑重工业的电力。"
 krcw_usa_the_steel_of_the_west:0 "重开普韦布洛高炉"
 krcw_usa_the_steel_of_the_west_desc:0 "普韦布洛与吉尔里的高炉重新点火。没有匹兹堡，西部就必须自己炼钢。"
 krcw_usa_the_gulf_yards:0 "墨西哥湾船厂"
 krcw_usa_the_gulf_yards_desc:0 "新奥尔良与莫比尔的船厂只造过登陆艇与油轮。现在国王鱼要它们造军舰。"
 krcw_usa_the_plains_railroads:0 "平原铁路"
 krcw_usa_the_plains_railroads_desc:0 "从新奥尔良到丹佛、从威奇托到坦皮科的干线加铺双轨。军队与石油都需要更快的铁路。"
 krcw_usa_the_atomic_program:0 "原子计划"
 krcw_usa_the_atomic_program_desc:0 "洛斯阿拉莫斯的实验室还在西部的手里。俄罗斯愿意提供图纸，条件是共享成果。国王鱼想要一颗属于自己的炸弹。"
 krcw_usa_share_the_wealth:0 "分享我们的财富"
 krcw_usa_share_the_wealth_desc:0 "财产上限、最低收入、养老金与宅地。这套纲领让国王鱼在西部的每一个县都拥有忠诚的选民，代价是一张永远填不满的财政窟窿。"
 krcw_usa_pension_burden:0 "养老金的重担"
 krcw_usa_pension_burden_desc:0 "每月三十美元，六十岁以上人人有份。这是政权最受欢迎的政策，也是财政部长最害怕的一行数字。"
 krcw_usa_40_t:0 "大亨的反抗"
 krcw_usa_40_d:0 "石油、铁路与棉花的代表坐在新奥尔良的会客室里，桌上放着一份备忘录：如果财富税继续执行，他们将把资本、炼油厂与会计账簿一并转移到旧金山。国王鱼在隔壁房间里来回踱步。他知道，这些人手里有他需要的钱，而他手里有他们害怕的人群。"
 krcw_usa_40.a:0 "把他们的公司收归国有"
 krcw_usa_40.b:0 "妥协：税率减半，换取投资"
 krcw_usa_40.c:0 "让他们走，没收留下的资产"
 krcw_usa_44_t:0 "一颗属于自己的炸弹"
 krcw_usa_44_d:0 "洛斯阿拉莫斯的实验室还在西部手里，但缺的是钱、电和铀。莫斯科的代表带来一份提议：俄罗斯提供图纸与铀矿，成果两国共享，试验在哈萨克进行。将军们想要炸弹，科学家们想要独立，而国王鱼想要的是在谈判桌上不必再仰视任何人。"
 krcw_usa_44.a:0 "接受俄罗斯的条件"
 krcw_usa_44.b:0 "独立研制，哪怕慢十年"
 krcw_wca_the_syndicates_endure:0 "工团犹在"
 krcw_wca_the_syndicates_endure_desc:0 "一九四九年五月，联合工团第九次代表大会在纽约召开。东岸守住了底特律、芝加哥、匹兹堡和华盛顿，但阿巴拉契亚在内战中被毁，各产业联合会互不服气，河对岸朗的军队正由俄国重新武装。"
 krcw_wca_ninth_congress:0 "第九次代表大会"
 krcw_wca_ninth_congress_desc:0 "代表大会上两派针锋相对：鲁瑟的“建设派”主张先把东部建成工业民主的样板；福斯特和坎农的“解放派”则主张尽快渡河，把西岸的佃农与油田工人从朗的机器下解放出来。"
 krcw_wca_charter_of_industrial_democracy:0 "产业民主宪章"
 krcw_wca_charter_of_industrial_democracy_desc:0 "鲁瑟的宪章规定：工厂计划由车间委员会与地区联合会共同拟定，任何中央机构都不能单方面下达指标。"
 krcw_wca_liberation_committee:0 "解放委员会"
 krcw_wca_liberation_committee_desc:0 "福斯特派赢得了代表大会的多数。一个“西岸解放委员会”成立了，它的第一项决议是：停火协定只是“一次喘息”。"
 krcw_wca_federations_compact:0 "联合会公约"
 krcw_wca_federations_compact_desc:0 "汽车、钢铁、煤矿、码头与服装五大联合会在底特律签署公约：争议交由代表大会仲裁，任何联合会不得保留私人民兵。派系之争没有消失，但它回到了会场。"
 krcw_wca_randolph_and_the_brigades:0 "伦道夫与黑人旅"
 krcw_wca_randolph_and_the_brigades_desc:0 "卧铺车厢搬运工工会领袖伦道夫在伯明翰组织黑人工人，组建黑人志愿旅。"
 krcw_wca_radio_free_america:0 "自由美国电台"
 krcw_wca_radio_free_america_desc:0 "孟菲斯的发射塔每晚向西岸广播：工会的消息、失踪者的名字、爵士乐，以及朗的机器里最新的丑闻。"
 krcw_wca_refugee_reception:0 "难民接待委员会"
 krcw_wca_refugee_reception_desc:0 "每个月都有数千人从西岸偷渡过河：黑人家庭、被取缔的工会会员、逃兵。孟菲斯与开罗的接待委员会为他们登记、安置、分配工作。"
 krcw_wca_the_first_free_election:0 "第一次联合会普选"
 krcw_wca_the_first_free_election_desc:0 "一九五〇年秋，西岸在举行朗的第五次“选举”，东岸则第一次举行了工团代表的普选：每个工人、农民和士兵都有一票，包括刚渡河的难民。"
 krcw_wca_election_roll_tt:0 "哪一派赢得多数取决于此前的选择：第九次大会的立场、工业民主宪章或解放委员会、仲裁与重建、选举法与计票是否被各联合会接受，以及停火线的紧张度。"
 krcw_wca_open_letter_west:0 "致西岸的公开信"
 krcw_wca_open_letter_west_desc:0 "工团代表大会致信西岸的工人、农民与老兵：“我们不是来征服你们的。当你们准备好的时候，我们在河的另一边等你们。”"
 krcw_wca_the_march_west:0 "向西方进军"
 krcw_wca_the_march_west_desc:0 "解放委员会宣布：朗的美国是“一座等待被推倒的监狱”。前线部队接到命令，做好渡河准备。"
 krcw_wca_rebuild_appalachia:0 "重建阿巴拉契亚"
 krcw_wca_rebuild_appalachia_desc:0 "内战最惨烈的战斗发生在阿巴拉契亚山区。被炸毁的铁路、淹水的矿井与烧毁的城镇必须先修好，工厂才能重新开工。"
 krcw_wca_miners_return:0 "矿工归来"
 krcw_wca_miners_return_desc:0 "抽干哈兰县与西弗吉尼亚被淹的矿井，恢复东部的煤炭生产。"
 krcw_wca_heal_the_veterans:0 "开设伤残老兵诊所"
 krcw_wca_heal_the_veterans_desc:0 "五十万伤残老兵需要医院、假肢与工作。工团医疗合作社在每一座工业城市开设了诊所。"
 krcw_wca_join_clearing_union:0 "加入巴黎清算联盟"
 krcw_wca_join_clearing_union_desc:0 "加入巴黎清算联盟，工团之间的贸易按劳动时间折算，逆差由联盟发展基金弥补。"
 krcw_wca_detroit_councils:0 "底特律工人委员会"
 krcw_wca_detroit_councils_desc:0 "汽车工人联合会的装配线是鲁瑟的起家之地。工人委员会投票：一半产能造拖拉机与卡车，一半造坦克。"
 krcw_wca_tva_syndicate:0 "田纳西河谷工团"
 krcw_wca_tva_syndicate_desc:0 "田纳西河谷管理局被改组为一个由电力工人、农民合作社与地方公社共同管理的工团。南方的农舍第一次通上了电。"
 krcw_wca_transnational_federations:0 "跨国产业联合会"
 krcw_wca_transnational_federations_desc:0 "东部的钢铁、汽车与电气联合会加入了第三国际的跨国产业联合会。工程师们在里昂、曼彻斯特与匹兹堡之间轮换，设计图在大西洋上来回传递。"
 krcw_wca_southern_mills:0 "南方纺织工团"
 krcw_wca_southern_mills_desc:0 "卡罗来纳与佐治亚的纺织厂在内战前是全美国工资最低的地方。现在，它们的工人委员会第一次决定自己的工资。"
 krcw_wca_atlantic_yards_f:0 "大西洋船坞"
 krcw_wca_atlantic_yards_f_desc:0 "诺福克、费城与布鲁克林的船坞恢复生产。里科弗要一支能守住大西洋海岸、也能护送来自欧洲的船队的舰队。"
 krcw_wca_cybernetic_planning:0 "控制论协作计划"
 krcw_wca_cybernetic_planning_desc:0 "麻省理工学院的诺伯特·维纳与巴黎的工程师合作，用电子计算机协调五大湖区数千家工厂之间的订单。计划不再是命令，而是一张实时更新的网络。"
 krcw_wca_the_eastern_commonwealth:0 "东部共同体"
 krcw_wca_the_eastern_commonwealth_desc:0 "十年前，东部是一片战火中的废墟。如今，从波士顿到亚特兰大，工厂的烟囱连成了一条线。工团证明了：没有老板，工厂一样能开。"
 krcw_wca_carlsons_army:0 "组建工团人民军"
 krcw_wca_carlsons_army_desc:0 "卡尔森参照他在中国所见的国民革命军，组建强调官兵平等、协同作战的工团人民军。"
 krcw_wca_disband_private_militias:0 "收编联合会民兵"
 krcw_wca_disband_private_militias_desc:0 "每一家联合会都有自己的民兵。卡尔森要把它们统一编入人民军——这比打一场战役还难。"
 krcw_wca_defense_in_depth:0 "纵深防御"
 krcw_wca_defense_in_depth_desc:0 "西岸的步兵更多，也更年轻。那就让他们在田纳西与肯塔基的丘陵中一道一道地撞墙吧。"
 krcw_wca_river_scouts:0 "河上侦察队"
 krcw_wca_river_scouts_desc:0 "夜里划着独木舟过河的侦察兵，是东岸最宝贵的情报来源。"
 krcw_wca_mechanized_syndicates:0 "机械化工团"
 krcw_wca_mechanized_syndicates_desc:0 "东岸有底特律。它的步兵可以坐着卡车上战场。"
 krcw_wca_people_air_force:0 "人民空军"
 krcw_wca_people_air_force_desc:0 "贝尔、共和与格鲁曼的工厂都在东岸。工团航空学校在长岛与代顿开学，学员中有三分之一是女性。"
 krcw_wca_rickover_fleet:0 "研制核潜艇"
 krcw_wca_rickover_fleet_desc:0 "里科弗痴迷于一个设想：用原子反应堆推动潜艇。国际的物理学家们说他疯了，然后帮他画了图纸。"
 krcw_wca_volunteers_from_abroad:0 "国际志愿者"
 krcw_wca_volunteers_from_abroad_desc:0 "在宾夕法尼亚设立训练营，接收来自法国、英国、意大利和中国的志愿者。"
 krcw_wca_liberation_plan:0 "解放计划"
 krcw_wca_liberation_plan_desc:0 "卡尔森的参谋部起草了“约翰·布朗计划”：在孟菲斯与开罗之间强渡，直插小石城与达拉斯，同时号召西岸的佃农与油田工人举行总罢工。"
 krcw_wca_war_of_liberation:0 "解放战争"
 krcw_wca_war_of_liberation_desc:0 "渡河。美洲的工人将第二次拿起武器，停火协定将化为灰烬。"
 krcw_wca_shield_of_the_east:0 "东部之盾"
 krcw_wca_shield_of_the_east_desc:0 "东岸不先开火，但每座工厂都准备在对方渡河时改为防御据点。"
 krcw_wca_the_internationale:0 "第三国际的美洲支部"
 krcw_wca_the_internationale_desc:0 "美利坚联合工团是第三国际在新大陆唯一的大国成员。巴黎把东岸看作美洲革命的桥头堡，东岸则把巴黎看作最可靠的朋友。"
 krcw_wca_canadian_brothers:0 "加拿大兄弟"
 krcw_wca_canadian_brothers_desc:0 "蒂姆·巴克的加拿大与东岸隔着五大湖相望。两国的工会联合会合并了铁路与航运调度中心，安大略的镍与魁北克的铝沿圣劳伦斯河南下。"
 krcw_wca_naval_command_overtures:0 "向宪政联盟示好"
 krcw_wca_naval_command_overtures_desc:0 "旧金山与西雅图的码头工人从来不服西部防务司令部的军区。工团一面向萨克拉门托的国会许诺“保留你们的州政府、舰队和军官”，一面把传单和罢工基金送进了奥克兰的船厂。"
 krcw_wca_mexican_sympathies:0 "在墨西哥铁路沿线建网络"
 krcw_wca_mexican_sympathies_desc:0 "阿维拉·卡马乔的墨西哥是俄罗斯军火流向朗的通道，可是墨西哥的工人与农民记得萨帕塔和比利亚。一张秘密网络在铁路沿线展开。"
 krcw_wca_atlantic_bridge:0 "大西洋之桥"
 krcw_wca_atlantic_bridge_desc:0 "从勒阿弗尔、利物浦到纽约的船队每周都有，运来的是书籍、机器与技术员，运走的是卡车、粮食与留学生。"
 krcw_wca_atomic_cooperation:0 "原子合作"
 krcw_wca_atomic_cooperation_desc:0 "芝加哥与哥伦比亚大学的物理学家与巴黎的居里实验室交换论文。东岸不造原子弹——至少现在不——但它要确保自己懂得原子。"
 krcw_wca_reply_from_new_york:0 "来自纽约的回信"
 krcw_wca_reply_from_new_york_desc:0 "工团代表大会讨论了三天，最后投票通过了一封回信：“我们愿意谈。不是谈谁向谁投降，而是谈两种美国如何共处。”"
 krcw_ohio_up_small_tt:0 "密西西比停火线紧张度 §R+5§!（当前：[?global.krcw_ohio_tension]）"
 krcw_ohio_up_medium_tt:0 "密西西比停火线紧张度 §R+10§!（当前：[?global.krcw_ohio_tension]）"
 krcw_ohio_up_large_tt:0 "密西西比停火线紧张度 §R+20§!（当前：[?global.krcw_ohio_tension]）"
 krcw_ohio_down_small_tt:0 "密西西比停火线紧张度 §G-5§!（当前：[?global.krcw_ohio_tension]）"
 krcw_ohio_down_medium_tt:0 "密西西比停火线紧张度 §G-10§!（当前：[?global.krcw_ohio_tension]）"
 krcw_ohio_down_large_tt:0 "密西西比停火线紧张度 §G-20§!（当前：[?global.krcw_ohio_tension]）"
 krcw_ohio_1_t:0 "密西西比停火线"
 krcw_ohio_1_d:0 "《圣路易斯停火协定》签订已经三年。从明尼苏达的湖泊到路易斯安那的河口，一千八百英里的大河把美国劈成了两半。\n\n东岸是美利坚联合工团：纽约、华盛顿、芝加哥、底特律与匹兹堡，美国工业的心脏，由工人委员会管理，却被十年内战与派系之争拖得疲惫不堪。西岸是休伊·朗的美利坚合众国：新奥尔良、得克萨斯、大平原与落基山，土地辽阔、人口年轻、石油丰富，工厂却不及对岸的一半，只能依靠经墨西哥运来的俄罗斯援助。落基山以西，萨克拉门托的宪政联盟守着西海岸，对两边都关着门。\n\n两边的宪法都宣称自己代表整个美国。两边的士兵都在夜里隔河喊话。停火协定里有一句话，两边都记得很清楚：“本协定不构成对任何一方主权主张的承认。”"
 krcw_ohio_1.a:0 "河水不会永远把我们分开。"
 krcw_ohio_10_t:0 "开罗的枪声"
 krcw_ohio_10_d:0 "伊利诺伊州开罗镇，俄亥俄河与密西西比河交汇之处。昨夜，一支巡逻队遭到对岸机枪扫射，两人死亡。对岸的广播说，是我们先向一艘渔船开的火。\n\n前线指挥官请求授权“对等报复”。"
 krcw_ohio_10.a:0 "授权炮击对岸阵地。"
 krcw_ohio_10.b:0 "通过圣路易斯的停火委员会提出抗议。"
 krcw_ohio_10.c:0 "压下消息，别让报纸知道。"
 krcw_ohio_11_t:0 "河上的炮舰"
 krcw_ohio_11_d:0 "一艘朗的炮舰在圣路易斯以北越过了河道中线，用探照灯照射东岸的码头长达一个小时。码头工人委员会要求民兵“给它点颜色看看”。"
 krcw_ohio_11.a:0 "用岸炮警告射击。"
 krcw_ohio_11.b:0 "拍照存档，交给停火委员会。"
 krcw_ohio_11.c:0 "关掉码头的灯，让他们照个够。"
 krcw_ohio_12_t:0 "截获的渡船"
 krcw_ohio_12_d:0 "国民警卫队在路易斯安那的维达利亚附近截获了一条满载黑人家庭的渡船，船上有四十多人，其中一半是孩子。他们说要去东岸“找一个能投票的地方”。\n\n东岸的广播已经在报道这件事了。"
 krcw_ohio_12.a:0 "放他们走。"
 krcw_ohio_12.b:0 "押送回原籍，船夫送交军事法庭。"
 krcw_ohio_12.c:0 "让他们留下，给他们在休斯敦找工作。"
 krcw_ohio_13_t:0 "游过河的逃兵"
 krcw_ohio_13_d:0 "三个西岸士兵在拉克罗斯附近游过了密西西比河，向东岸民兵投降。他们带来了一张朗的防线的草图，也带来了一个问题：按照停火协定，逃兵应当被遣返。"
 krcw_ohio_13.a:0 "给他们庇护。停火协定可以去见鬼。"
 krcw_ohio_13.b:0 "按协定遣返，但先问清楚他们知道什么。"
 krcw_ohio_13.c:0 "在电台上播出他们的故事。"
 krcw_ohio_14_t:0 "电波战"
 krcw_ohio_14_d:0 "东岸的“自由美国电台”换了新的发射机，信号一直传到了达拉斯。节目里播的是爵士乐、工会新闻和朗的官员受贿的录音。"
 krcw_ohio_14.a:0 "建干扰站。"
 krcw_ohio_14.b:0 "以牙还牙：开办“真正的美国之声”。"
 krcw_ohio_14.c:0 "不理它。谁会相信赤色分子的广播？"
 krcw_ohio_15_t:0 "圣路易斯走私网"
 krcw_ohio_15_d:0 "联邦调查局破获了一个在圣路易斯运作的走私网：东岸的青霉素和西岸的汽油每周在河上交换一次。涉案者包括两名警长和一位统一党的州议员。"
 krcw_ohio_15.a:0 "公开审判，以儆效尤。"
 krcw_ohio_15.b:0 "悄悄处理，那位州议员是我们的人。"
 krcw_ohio_15.c:0 "把走私变成官方贸易。"
 krcw_ohio_16_t:0 "被炸的铁路桥"
 krcw_ohio_16_d:0 "伊兹大桥东侧、东圣路易斯的一段铁路被人炸毁。现场留下的传单署名“南方邦联之子”——一个据说受朗的军方资助的地下组织。"
 krcw_ohio_16.a:0 "全城搜捕，并向停火委员会提交证据。"
 krcw_ohio_16.b:0 "以牙还牙：炸掉他们的一座桥。"
 krcw_ohio_16.c:0 "修好铁路，别让它成为新闻。"
 krcw_ohio_17_t:0 "大河泛滥"
 krcw_ohio_17_d:0 "春汛比往年来得更猛。密西西比河在两岸同时决堤，淹没了数十个城镇。灾民不分东岸西岸，爬上同一片高地等待救援。\n\n停火委员会建议：两岸联合救灾。"
 krcw_ohio_17.a:0 "接受联合救灾。"
 krcw_ohio_17.b:0 "各救各的。"
 krcw_ohio_18_t:0 "交换战俘"
 krcw_ohio_18_d:0 "在墨西哥外交官的斡旋下，两岸同意在圣路易斯的伊兹大桥上交换内战遗留的战俘。这是停火以来两边的士兵第一次在桥中间握手。"
 krcw_ohio_18.a:0 "让交换顺利进行。"
 krcw_ohio_18.b:0 "扣下几个“危险分子”。"
 krcw_ohio_19_t:0 "河上的集市"
 krcw_ohio_19_d:0 "在明尼苏达与威斯康星交界的河段，冬天结冰以后，两岸的农民会在冰面上摆起集市：西岸的牛肉换东岸的收音机。前线的军官们睁一只眼闭一只眼。"
 krcw_ohio_19.a:0 "由它去吧。"
 krcw_ohio_19.b:0 "派兵驱散。"
 krcw_ohio_40_t:0 "停火线在燃烧"
 krcw_ohio_40_d:0 "停火线上的冲突已经失控。一周之内，圣路易斯、开罗与拉克罗斯三处发生了营级规模的交火。参谋部报告：东岸正在河边集结浮桥部队。\n\n莫斯科来电，要求新奥尔良“保持克制”——除非新奥尔良确信能够速胜。可是所有人都清楚，对岸的工厂比我们多一倍。"
 krcw_ohio_40.a:0 "后撤五英里，重新开放停火委员会。"
 krcw_ohio_40.b:0 "坚守阵地，一寸不让。"
 krcw_ohio_40.c:0 "撕毁停火协定。渡河！"
 krcw_ohio_41_t:0 "河岸上的浮桥"
 krcw_ohio_41_d:0 "前线的民兵指挥员们联名致电纽约：朗的坦克已经开到了河边，停火线随时可能崩溃。“与其等他们过河，不如我们先过去。”\n\n巴黎的来电则只有一句话：“不要给萨文科夫借口。”"
 krcw_ohio_41.a:0 "后撤民兵，请求巴黎斡旋。"
 krcw_ohio_41.b:0 "加固防线，等待他们先动手。"
 krcw_ohio_41.c:0 "发动解放战争！"
 krcw_ohio_50_t:0 "阿波马托克斯行动"
 krcw_ohio_50_d:0 "命令已经签署。凌晨四点，三千门火炮将同时向东岸开火，巴顿的装甲军将在圣路易斯以南强渡。\n\n新奥尔良的总统办公室里，一位老参议员问：“我们真的要再打一次内战吗？”没有人回答。"
 krcw_ohio_50.a:0 "开火。"
 krcw_ohio_50.b:0 "最后一刻撤回命令。"
 krcw_ohio_51_t:0 "约翰·布朗计划"
 krcw_ohio_51_d:0 "浮桥已经准备好了。卡尔森的命令只有一行：“为了西岸的工人与佃农。”\n\n代表大会的少数派在最后一次会议上警告：如果解放变成了征服，西岸的人民不会欢迎我们。"
 krcw_ohio_51.a:0 "渡河！"
 krcw_ohio_51.b:0 "现在还不是时候。"
 krcw_ohio_52_t:0 "他们渡河了！"
 krcw_ohio_52_d:0 "清晨，敌军在密西西比河上架起了浮桥。停火协定——这份维持了若干年脆弱和平的文件——在炮声中化为灰烬。\n\n美国内战的第二阶段开始了。"
 krcw_ohio_52.a:0 "全民动员！"
 krcw_ohio_53_t:0 "美国内战重燃"
 krcw_ohio_53_d:0 "美洲传来震惊世界的消息：密西西比停火线崩溃，东西两岸的美国军队再度交火。为了避免盟约自动把全世界拖入战争，两个美国都暂时退出了各自的阵营。巴黎与莫斯科同时召开紧急会议。全世界的报纸都在问同一个问题——这会不会是第三次世界大战的开端？"
 krcw_ohio_53.a:0 "愿上帝保佑美洲。"
 krcw_ohio_54_t:0 "美洲兄弟的呼救"
 krcw_ohio_54_d:0 "美利坚联合工团与朗的美国重新开战了。第三国际执行委员会必须决定：援助到什么程度？\n\n直接参战意味着与莫斯科协定的全面对抗；袖手旁观则意味着背叛美洲的工人。"
 krcw_ohio_54.a:0 "武器、物资与志愿者——但不宣战。"
 krcw_ohio_54.b:0 "国际全体参战！"
 krcw_ohio_54.c:0 "呼吁立即停火。"
 krcw_ohio_55_t:0 "新奥尔良的求援"
 krcw_ohio_55_d:0 "朗的美国与东岸的工团重新开战。新奥尔良请求莫斯科兑现协定的承诺。\n\n最高执政府里的将军们意见不一：美洲是一块磁铁，它能把第三国际的力量吸过大西洋，也能把俄罗斯拖进一场打不赢的远征。"
 krcw_ohio_55.a:0 "提供武器与顾问，但不直接参战。"
 krcw_ohio_55.b:0 "莫斯科协定全体参战！"
 krcw_ohio_55.c:0 "敦促新奥尔良停火。"
 krcw_ohio_60_t:0 "第二次圣路易斯谈判"
 krcw_ohio_60_d:0 "战争已经打了一年半。前线在密西西比河两岸来回拉锯，城市变成了废墟。墨西哥与加拿大的外交官提出了一份新的停火方案：恢复战前界线，设立非军事区。"
 krcw_ohio_60.a:0 "签字。"
 krcw_ohio_60.b:0 "战斗到底。"
 krcw_ohio_61_t:0 "第二次圣路易斯停火"
 krcw_ohio_61_d:0 "美洲的枪声再次停了下来。新的停火线与旧的几乎一模一样，只是两岸多了几十万座坟墓。人们开始说：也许美国永远不可能靠战争统一。"
 krcw_ohio_61.a:0 "但愿这是最后一次。"
 krcw_ohio_62_t:0 "美洲的内战结束了"
 krcw_ohio_62_d:0 "美洲的内战以一方的彻底失败告终。一个统一的美国——以胜利者的方式统一的美国——出现在北美大陆上。世界的力量天平为之倾斜。"
 krcw_ohio_62.a:0 "统一，终于来了。"
 krcw_ohio_63.a:0 ""
 krcw_usa_5_t:0 "达拉斯的三个派系"
 krcw_usa_5_d:0 "统一党的代表大会开在达拉斯的市政厅里，可真正的会议在旁边的酒店套房里进行。三群人各自占了一层楼。\n\n三楼是州长们：他们要的是更多的联邦拨款和更少的联邦审计。四楼是将军们：巴顿、莫斯利和一群参谋，他们要的是一支能渡河的军队，以及一个不问他们要发票的政府。五楼是“分享我们的财富”协会的老干部：他们提醒所有人，朗的权力来自那些每月领家园津贴的农民，而不是来自坦克或合同。\n\n朗坐在顶层的房间里，一个一个地见他们。他七十天没有睡过一个整夜。"
 krcw_usa_5.a:0 "把预算给州长们。机器要先活着。"
 krcw_usa_5.b:0 "把钢铁给将军们。河对岸不会等我们。"
 krcw_usa_5.c:0 "把津贴给农民们。这才是我们的立国之本。"
 krcw_usa_10_t:0 "什里夫波特的游行"
 krcw_usa_10_d:0 "四千名黑人老兵穿着旧军装，从什里夫波特的火车站一直走到路易斯安那州的选民登记处。他们没有喊口号，只是排队——排在一扇不会为他们打开的门前。队伍最前面的人举着一面旗子：那是他们在密苏里战役里用过的团旗，上面有十七个弹孔。\n\n州警把他们拦在了两个街区之外。到傍晚，河对岸的“自由美国电台”已经把现场录音播了三遍。"
 krcw_usa_10.a:0 "派联邦调查局的人去听他们要什么。"
 krcw_usa_10.b:0 "解散游行，逮捕组织者。"
 krcw_usa_10.c:0 "让他们登记。让南方的参议员们去抗议。"
 krcw_usa_11_t:0 "二十万个签名"
 krcw_usa_11_d:0 "请愿书装在十四个木箱里，由老兵们用卡车运到了新奥尔良。带头的是一位在密苏里战役中失去了一条腿的中士，他把第一箱搬上州议会大厦的台阶时说了一句被记者记下来的话：“总统先生答应过我们，人人都是国王。我们只想要一个国王的选票。”\n\n南方各州的参议员当晚就发来了联名电报：如果新奥尔良接受这份请愿书，路易斯安那、密西西比与阿肯色的党部将“重新考虑对总统的支持”。"
 krcw_usa_11.a:0 "收下箱子，答应“研究研究”。"
 krcw_usa_11.b:0 "把箱子退回去。"
 krcw_usa_11.c:0 "亲自接见那位中士，并且让记者都在场。"
 krcw_usa_12_t:0 "小石城的第一天"
 krcw_usa_12_d:0 "妥协案生效的第一天，小石城的联邦选民登记处外排起了两条队：一条是来登记的黑人老兵，一条是来抗议的白人公民委员会。国民警卫队站在中间，年轻的士兵端着枪，谁也不知道该指向哪一边。\n\n到了中午，第一张选民证发了出去。到了黄昏，什么也没有发生——没有暴乱，没有流血，只有一些人回家吃了晚饭。第二天报纸的标题是：《什么也没发生》。这正是新奥尔良最希望看到的标题。"
 krcw_usa_12.a:0 "这才是美国。"
 krcw_usa_13_t:0 "公民委员会的反扑"
 krcw_usa_13_d:0 "白人公民委员会在密西西比与亚拉巴马组织了抵制：拒绝向登记投票的黑人佃农赊账，拒绝雇佣他们，拒绝给他们看病。三个县的黑人家庭在一个月内失去了土地。\n\n联邦政府可以动用《分享我们的财富》的救济资金直接向这些家庭发放——但那意味着与南方的党魁彻底翻脸。"
 krcw_usa_13.a:0 "动用救济资金，直接发到他们手上。"
 krcw_usa_13.b:0 "不介入。这是各州的事。"
 krcw_usa_14_t:0 "渡河的人"
 krcw_usa_14_d:0 "本月又有一万一千人渡过了密西西比河。他们大多是年轻的黑人家庭，也有白人工会会员，还有几个不愿再写歌颂机器的社论的报纸编辑。东岸在孟菲斯对岸的接收营外挂了一条横幅：“这里没有肤色线。”\n\n内政部长报告说，如果按这个速度，十年内西岸将失去一百二十万人口——而且都是最年轻、最能干的那一部分。"
 krcw_usa_14.a:0 "封锁渡口。"
 krcw_usa_14.b:0 "解决让他们离开的原因。"
 krcw_usa_14.c:0 "由他们去吧。少几个麻烦。"
 krcw_usa_30_t:0 "巴吞鲁日的会诊"
 krcw_usa_30_d:0 "三位医生从新奥尔良、休斯敦和墨西哥城赶来，在总统的私人宅邸里会诊了四个小时。诊断结果没有写进任何一份公开文件，但那天晚上，厄尔·朗被从路易斯安那连夜叫到了首都，而俄罗斯大使取消了他原定的回国休假。\n\n第二天的官方公报说：总统先生工作过度，医生建议他减少公开活动。公报没有说的是，总统已经有十一天没有离开二楼。\n\n新奥尔良的每一个派系都在同一个晚上开始算同一笔账。"
 krcw_usa_30.a:0 "让厄尔留在首都。"
 krcw_usa_30.b:0 "让参谋长联席会议进入戒备。"
 krcw_usa_30.c:0 "什么也不做。总统还活着。"
 krcw_usa_31_t:0 "王鱼"
 krcw_usa_31_d:0 "一九五一年九月十日凌晨三点四十分，休伊·皮尔斯·朗在新奥尔良逝世，终年六十岁。\n\n他做了十八年美国总统——其中一半的时间，他的美国只有一半。他在这半个国家里修了两万四千英里公路、六百所学校和十一座桥；他让路易斯安那的佃农的孩子第一次有了免费的课本；他也把这半个国家变成了一台只听他一个人指挥的机器，把反对他的人关进监狱，把选票数成他想要的样子。历史学家将为他争吵一百年。\n\n遗体停放在州议会大厦的圆形大厅里，供人瞻仰三天。排队的人从密西西比河一直排到运河街，其中有戴着旧军帽的白人老兵，也有从乡下坐了一整夜卡车赶来的黑人佃农家庭——他们排在另一条队里，因为路易斯安那的规矩还没有改。\n\n一个记者问一位排队的老农民为什么要来。老人想了很久，说：“他偷了很多钱。可是我家孩子有鞋穿了。”\n\n河对岸的纽约，工团代表大会休会一天。没有发贺电，也没有发唁电。"
 krcw_usa_31.a:0 "人人都是国王。"
 krcw_usa_32_t:0 "休伊·朗逝世"
 krcw_usa_32_d:0 "美联社的电讯在凌晨四点二十分发出，全世界的报纸都赶在早班之前改了头版。\n\n在莫斯科，最高执政府发出了正式唁电，称朗为“美洲人民反对工团暴政的领袖”；萨文科夫本人没有出席追悼仪式，据说他对身边的人说了一句：“一台机器死了主人，就只是一堆零件。”在巴黎，第三国际的机关报用了一个克制的标题：《一个复杂的对手去世了》。在墨西哥城，总统宣布全国下半旗一天——这在墨西哥引起了不小的争议。\n\n而在世界各地的报纸上，所有的分析文章都在问同一个问题：这半个美国，接下来听谁的？"
 krcw_usa_32.a:0 "半个美国，群龙无首。"
 krcw_usa_33_t:0 "继承问题"
 krcw_usa_33_d:0 "宪法在这一点上说得很清楚：副总统继任。问题在于，朗的副总统是一个从来没有被允许单独接受采访的人，而这个国家真正的权力从来不在宪法里。\n\n三股力量在葬礼结束后的第七天摊牌。\n\n厄尔·朗代表机器本身。他没有他哥哥的魅力，也没有他哥哥的信仰，可是从新奥尔良到旧金山，每一个县的党魁都欠过他一个人情，而他记得每一笔。他的主张很简单：照原样运转下去，谁的位子都不动。\n\n莫斯利将军和南方将领集团代表军队。他们在内战里守住了这半个国家，看着政客瓜分了战利品。他们的主张是：宪法暂停，军事委员会接管，直到“东岸的叛乱被彻底平定”。巴顿的装甲师驻在离首都八十英里的地方。\n\n还有第三股力量：俄罗斯大使。他没有提出任何主张，只是分别拜访了前两方，并在每一次谈话里提到了同一件事——莫斯科的贷款、韦拉克鲁斯的机床，以及这些东西可以有多快地停下来。\n\n代理内阁要决定先把这件事交给谁来谈。"
 krcw_usa_33.a:0 "召集统一党全国委员会，按宪法程序由副总统继任，再由委员会提名厄尔·朗。"
 krcw_usa_33.b:0 "请将军们进入国家紧急委员会，换取他们承认文官继任。"
 krcw_usa_33.c:0 "请俄罗斯大使出面担保权力交接。"
 krcw_usa_succession_roll_tt:0 "谁继任取决于朗生前的安排：州长与党魁、将军、俄罗斯人各自积累的筹码，以及内阁这一步棋。"
 krcw_usa_45_t:0 "党魁们的决定"
 krcw_usa_45_d:0 "统一党全国委员会在州议会大厦的地下会议室里开了一整夜。天亮前，四十一个州党部中有三十四个在提名书上签了字：厄尔·朗。副总统当天上午宣誓继任，下午宣布辞职，理由是“健康原因”。\n\n莫斯利将军收到了委员会的邀请，没有出席。俄罗斯大使发来了一份很短的贺电。"
 krcw_usa_45.a:0 "厄尔·朗继任。机器继续运转。"
 krcw_usa_46_t:0 "将军们没有等"
 krcw_usa_46_d:0 "内阁还在讨论继任程序的时候，巴顿的装甲师开进了新奥尔良的郊区。莫斯利将军在电台里宣读了一份声明：鉴于总统逝世和“东岸的威胁”，将军委员会即日起接管国家事务，直到秩序恢复。\n\n厄尔·朗在州长官邸里接到了电话，被告知他可以回路易斯安那的农场。国会大厦门口站着宪兵。"
 krcw_usa_46.a:0 "将军委员会接管。宪法暂停。"
 krcw_usa_47_t:0 "大使的人选"
 krcw_usa_47_d:0 "俄罗斯大使在一天之内见了厄尔·朗三次，见了莫斯利一次。第二天，韦拉克鲁斯港的一批机床被暂时扣在码头上，理由是“文件不全”。第三天，莫斯利宣布军队“服从宪法程序”，厄尔·朗宣誓就职。\n\n新总统的第一份命令是扩大俄罗斯军事顾问团的编制。机床当晚就装上了火车。"
 krcw_usa_47.a:0 "厄尔·朗继任，莫斯科的顾问团留下。"
 krcw_usa_34_t:0 "厄尔·朗宣誓就职"
 krcw_usa_34_d:0 "厄尔·基南·朗在州议会大厦的台阶上宣誓就任美国总统。他的就职演说只有四分钟，其中有两分钟在讲他哥哥。\n\n“我不是休伊，”他在最后说，“谁也不是休伊。我只知道一件事：这个国家不能再打一场内战，也不能再指望一个人。”\n\n观察家们注意到，宣誓仪式上，莫斯利将军站在第二排，脸上没有任何表情。"
 krcw_usa_34.a:0 "一个交易人，而不是一个先知。"
 krcw_usa_35_t:0 "新奥尔良的坦克"
 krcw_usa_35_d:0 "美国西岸的宪政结束了。将军委员会在广播里宣布，鉴于“东岸叛乱尚未平定”，宪法条款即日起暂停实施，国会休会，各州州长由军区司令“协助履行职责”。\n\n莫斯利将军成为委员会主席。厄尔·朗被“请”回了路易斯安那的农场，据说身体一直很好。\n\n世界的反应是一致的沉默，然后是一致的重新计算。莫斯科表示“尊重美国人民的选择”。巴黎的社论标题是：《河的那一边，最后一点伪装也脱掉了》。"
 krcw_usa_35.a:0 "一个没有律师的美国。"
 krcw_usa_36_t:0 "将军们的晚宴"
 krcw_usa_36_d:0 "厄尔·朗执政的第一个月，南方将领集团在圣安东尼奥的一家俱乐部里办了一次晚宴。名义上是为一位退役的军长送行，实际上到场的是整个南方军区的指挥层，以及三位州长。\n\n席间有人举杯，说了一句在场所有人都听懂的话：“为了一个不需要选举的美国。”\n\n联邦调查局在场内有人。第二天早上，一份七页的报告放在了总统的桌子上。厄尔·朗读完以后，把它折起来放进了口袋，对秘书说：“我哥哥会把这些人全抓起来。可他也是靠这些人守住半个国家的。”"
 krcw_usa_36.a:0 "调走他们。分散到三个不同的军区去。"
 krcw_usa_36.b:0 "给他们更大的预算，让他们忙起来。"
 krcw_usa_36.c:0 "把报告烧掉。今晚什么也没发生。"
 krcw_usa_37_t:0 "第二次机会"
 krcw_usa_37_d:0 "厄尔·朗烧掉那份报告的两年以后，南方将领集团把它自己的报告送到了总统府：一份关于“国家紧急状态下军政统一指挥”的建议书，附有十四位将军的联署签名，以及一份已经拟好的广播稿。\n\n他们这一次没有把它藏在晚宴里。他们把它放在桌子上，等一个答复。"
 krcw_usa_37.a:0 "拒绝。并且当场解除四个人的职务。"
 krcw_usa_37.b:0 "签字。"
 krcw_wca_20_t:0 "河对岸的葬礼"
 krcw_wca_20_d:0 "休伊·朗死了。消息传到纽约的时候，工团代表大会正在开会。会场里先是一阵骚动，然后有人开始鼓掌，接着掌声就停了下来——因为鲁瑟没有鼓掌。\n\n“我们中间有很多人的父亲死在他的国民警卫队手里，”他后来对代表们说，“我不会为他哀悼。但是我要提醒各位一件事：他活着的时候，河那边是一个人说了算，所以我们知道跟谁打交道。现在那边有三伙人在抢方向盘，其中一伙是将军。\n\n“解放派的同志们会说，这是渡河的最好时机。也许是的。可是如果我们现在渡河，那三伙人会在二十四小时之内变成一伙人，而我们会替他们完成统一。”\n\n会场上没有人接话。福斯特在自己的位子上坐了很久，最后说：“那我们等。可我们不会永远等。”"
 krcw_wca_20.a:0 "等。让他们自己去争。"
 krcw_wca_20.b:0 "向河对岸的工人广播：现在是你们的机会。"
 krcw_wca_20.c:0 "动员边境部队，以防万一。"
 krcw_wca_long_wait_tt:0 "新奥尔良的将军们少了一个接管的借口：西岸由文官继任的可能性上升。"
 krcw_wca_long_mobilise_tt:0 "西岸的将军们会拿边境动员当理由：军人接管新奥尔良的可能性上升。"
 krcw_usa_20_t:0 "一九五〇年：第五次竞选"
 krcw_usa_20_d:0 "休伊·朗的第五次总统竞选开始了。他坐着那列漆成白色的专列，从新奥尔良一路开到蒙大拿，每一站都是同样的演讲、同样的挥手、同样的《人人都是国王》。\n\n没有人怀疑结果。统一党在西岸各州的机器可以在午夜前数清每一张选票——有时甚至在投票结束之前。真正的问题是另外两个。\n\n第一个问题：要不要让反对派真的登上选票？农民党在明尼苏达还有组织，得克萨斯的石油工会里还有人敢公开说话。让他们参选，朗会赢得难看一些，可是这场选举会第一次像一场选举——而河对岸正在筹备他们自己的普选。\n\n第二个问题没有人在会上提起：朗在丹佛的演讲中途停了十七秒，扶着讲台。官方说法是“喉咙不舒服”。"
 krcw_usa_20.a:0 "办一场真正的选举：让反对派上票。"
 krcw_usa_20.b:0 "照老规矩办。机器数票。"
 krcw_usa_20.c:0 "干脆取消选举：“战时的国家不需要竞选。”"
 krcw_usa_real_election_tt:0 "选举结果将取决于政府此前的政策：民权妥协、津贴与稳定度有利于朗；隔离、贪腐与州长们的预算有利于反对派。"
 krcw_usa_21_t:0 "第五次就职"
 krcw_usa_21_d:0 "休伊·皮尔斯·朗再次当选美国总统。官方公布的得票率是百分之八十七——如果反对派上了选票，这个数字会低一些，但结果不会变。\n\n就职典礼在新奥尔良的杰克逊广场举行。二十万人挤满了街道，俄罗斯大使和墨西哥总统坐在观礼台的第一排，巴顿的装甲师在运河街上走了方队。\n\n朗的就职演说只有九分钟，是他一生中最短的一次演讲。他说：“我这一辈子只想做一件事，就是让每一个美国人的孩子都有鞋穿、有书读、有一块自己的地。我做到了一半。剩下的一半在河的那一边。”\n\n他讲完以后，扶着讲台站了很久才走下台阶。台下的人以为那是一位胜利者在享受欢呼。坐在第一排的三位医生知道不是。"
 krcw_usa_21.a:0 "人人都是国王。"
 krcw_usa_23_t:0 "一场真正的胜利"
 krcw_usa_23_d:0 "反对派上了选票，农民劳工党在明尼苏达和达科他跑完了全程，得克萨斯石油工会的候选人在休斯敦办了十几场集会。计票由各县的两党监票员共同进行，花了一个星期。\n\n朗还是赢了，赢得比机器数票时少，但每一个县的结果都经得起查。拿着家园津贴的农民和第一次登记投票的黑人老兵投了他的票。\n\n就职典礼上他只讲了九分钟，讲完以后扶着讲台站了很久才走下台阶。"
 krcw_usa_23.a:0 "让河对岸看看这张选票。"
 krcw_usa_24_t:0 "丢掉的州"
 krcw_usa_24_d:0 "反对派上了选票，而且拿走了明尼苏达、北达科他，以及得克萨斯的三个石油选区。朗在全国仍然领先，第五次当选总统，但统一党第一次在国会里面对一个有席位、有报纸、会开记者会的反对党。\n\n南方的党魁们在选后第二天就来到新奥尔良，要求总统追究“失职的县委员会”。农民劳工党的新议员们则要求公开家园津贴的账目。"
 krcw_usa_24.a:0 "让反对派坐进国会，公开津贴账目。"
 krcw_usa_24.b:0 "宣布那几个州的计票“有待复核”。"
 krcw_usa_25_t:0 "没有就职典礼"
 krcw_usa_25_d:0 "十一月的第一个星期二过去了，西岸没有投票。国会以紧急状态为由通过了一项决议，把总统任期延长到“停火线问题解决之日”。反对的议员有七个，其中四个第二天就被停止了党籍。\n\n杰克逊广场上没有集会。朗在总统府二楼签了字，没有出来讲话。东岸的电台当晚把那项决议的全文念了三遍。"
 krcw_usa_25.a:0 "战时的国家不需要竞选。"
 krcw_usa_22_t:0 "美洲的选举年"
 krcw_usa_22_d:0 "一九五〇年秋，密西西比河两岸同时举行了选举。\n\n西岸的休伊·朗第五次当选总统，官方通讯社称之为“人民意志的表达”。东岸的美利坚联合工团举行了内战以来第一次全联合会代表普选，六百万工人、农民和士兵在车间、矿井与军营里投了票。\n\n两边的报纸都刊登了对方的选举结果，配的标题几乎一模一样：《这也叫选举？》\n\n在世界其他地方的报纸上，这两件事被排在同一个版面上，中间隔着一条细线。"
 krcw_usa_22.a:0 "两个美国，两种选票。"
 krcw_wca_5_t:0 "联合广场的三天"
 krcw_wca_5_d:0 "第九次代表大会开了三天，吵了三天。\n\n沃尔特·鲁瑟站在讲台上讲了两个小时的数字：东岸有一百六十座现代化的工业联合体，有大陆上四分之三的钢，有芝加哥的铁路枢纽和纽约的港口。“我们守住了美国的车间。现在的问题不是怎么打过河去，而是怎么让河那边的人自己想过来。”\n\n威廉·福斯特接过话筒时，会场后排的煤矿工人代表已经站了起来。“同志们，我在肯塔基的矿井里干过十九年。我知道河那边的人在想什么——他们在想，纽约的同志们坐在办公室里，已经忘了什么叫佃农。”坎农补充了一句让速记员犹豫要不要记下来的话：“停火协定不是和平。它只是我们还没准备好的借口。”\n\n鲁瑟没有反驳。他只是问了一个问题：“如果我们明天渡河，后天谁来开动底特律的机床？”"
 krcw_wca_5.a:0 "建设派：先把东岸建成一个让人羡慕的地方。"
 krcw_wca_5.b:0 "解放派：停火只是喘息，准备渡河。"
 krcw_wca_5.c:0 "把争论交给各联合会去表决，别在大会上分裂。"
 krcw_wca_10_t:0 "六百万张选票"
 krcw_wca_10_d:0 "一九五〇年十月，东岸举行了内战以来第一次全联合会代表普选。投票不在投票站进行，而在车间、矿井、码头和军营里：每个工人、农民和士兵都有一票，包括三个月前才游过密西西比河的人。\n\n计票花了九天，因为每一张票都要由两个不同联合会的代表共同清点——这是各产业联合会互不信任的产物，却意外地成了这次选举最令人信服的地方。\n\n结果：鲁瑟的建设派得到了五成四的代表席位，福斯特的解放派得到三成一，其余席位属于地区性的小联合会。福斯特在承认结果的声明里只写了一句话：“我们输了表决，没有输道理。”\n\n河对岸的报纸对此只字未提。可是在孟菲斯、维克斯堡和新奥尔良的黑人教堂里，有人把这个消息传了下去：河那边，昨天，六百万人投了票。"
 krcw_wca_10.a:0 "这就是我们要给美国看的东西。"
 krcw_wca_10.b:0 "选举结束了。现在该谈渡河的事了。"
 krcw_wca_14_t:0 "解放派的多数"
 krcw_wca_14_d:0 "一九五〇年十月，东岸举行了内战以来第一次全联合会代表普选。投票在车间、矿井、码头和军营里进行，每一张票都由两个不同联合会的代表共同清点，计票花了九天。\n\n结果：福斯特与坎农的解放派拿到了代表席位的多数，票仓是南方纺织区、肯塔基的煤矿和退伍军人协会。鲁瑟的建设派在底特律和匹兹堡领先，但不够。鲁瑟仍是执行委员会主席，而新的代表大会第一次会议就把“渡河的准备”列进了议程。\n\n鲁瑟在承认结果的声明里只写了一句话：“代表们投了票，执行委员会会照办。”"
 krcw_wca_14.a:0 "按代表大会的决议，成立渡河准备委员会。"
 krcw_wca_14.b:0 "执行委员会先把渡河的账算清楚，再交大会表决。"
 krcw_wca_11_t:0 "底特律与匹兹堡的争吵"
 krcw_wca_11_d:0 "汽车工人联合会要求钢铁工人联合会按去年的清算价供货；钢铁工人联合会回答说，去年的价格是按内战时期的煤价算的，而煤矿现在要求重新定价。三家联合会各自在自己的报纸上指责对方“背叛了工人的团结”。\n\n代表大会的仲裁委员会开了十一次会。第十二次会议开始前，底特律的车间委员会宣布：在钢铁问题解决之前，他们将自行向加拿大采购。\n\n这不是阶级斗争，这是记账员之间的战争。可是如果它继续下去，东岸引以为傲的工业计划就会变成一堆互不衔接的地方账本。"
 krcw_wca_11.a:0 "由代表大会强制仲裁，并公布账目。"
 krcw_wca_11.b:0 "让他们自己谈。中央插手只会让事情更糟。"
 krcw_wca_11.c:0 "批准底特律向加拿大采购。"
 krcw_wca_12_t:0 "阿巴拉契亚的冬天"
 krcw_wca_12_d:0 "内战最惨烈的战斗打在这里。四年过去了，哈兰县的铁路仍然只通到山口，被炸塌的矿井里还积着水，烧毁的镇子上住着从帐篷里长大的孩子。\n\n重建委员会送来了两份互相矛盾的报告。第一份说：把资源投到这里是浪费，同样的钢材在底特律能多造三倍的卡车。第二份报告只有一页，是当地工会写的，末尾是一句话：“内战时，是我们这些山里人替纽约挡住了朗的装甲师。”\n\n两份报告都放在鲁瑟的桌子上。"
 krcw_wca_12.a:0 "重建阿巴拉契亚。我们欠他们的。"
 krcw_wca_12.b:0 "先投底特律。山区可以再等几年。"
 krcw_wca_13_t:0 "第十个年头"
 krcw_wca_13_d:0 "停火四年，内战十年。纽约的一份工会报纸做了一件谁也没想到的事：它刊登了一份读者来信专栏，题目叫《你希望明年发生什么？》。\n\n编辑部原以为会收到关于生产定额和住房的信。实际收到的一万两千封信里，超过一半只写了同一件事：让它结束。让我的儿子回家。让渡船重新开航，我妹妹在圣路易斯那一边，我已经六年没见过她了。\n\n这份专栏在代表大会上被念了出来。念到第三封信时，会场上已经没有人说话了。"
 krcw_wca_13.a:0 "把这些信寄给停火委员会。"
 krcw_wca_13.b:0 "这是疲惫，不是政策。加强政治教育。"
 krcw_mississippi_line_cat:0 "密西西比停火线"
 krcw_mississippi_line_cat_desc:0 "从明尼苏达到路易斯安那，一千八百英里的大河把美国劈成两半。停火线上的每一次挑衅、每一次让步，都会改变两岸开战的可能。\n\n当前紧张度：[?global.krcw_ohio_tension]（达到85时，前线指挥官将请求开战授权）"
 krcw_us_line_propaganda:0 "向对岸广播"
 krcw_us_line_propaganda_desc:0 "把发射机对准对岸：西岸播的是被没收土地的农场主和教堂里的祷告，东岸播的是爵士乐、工会新闻和贪腐官员的录音。便宜，有效，而且会让对岸加倍恼火。"
 krcw_us_line_raid:0 "派遣渡河突击队"
 krcw_us_line_raid_desc:0 "夜里用橡皮艇过河，炸掉一座变电站或者一段铁路，天亮以前回来。军队会学到东西，对岸会失去一点东西——而停火协定会再裂开一道缝。"
 krcw_us_line_fortify:0 "加固河岸防线"
 krcw_us_line_fortify_desc:0 "混凝土碉堡、反坦克壕、探照灯塔。防御工事不会挑起战争，但它会让对岸的参谋部把“速胜”从计划里划掉——而这本身就是一种和平。"
 krcw_us_line_reopen_ferries:0 "重开渡船"
 krcw_us_line_reopen_ferries_desc:0 "让渡船重新开航，让分居两岸六年的家庭互相探望，让农民把牛肉卖到对岸的城市去。每一条复航的渡船都让下一场战争更难开打。"
 krcw_us_line_restart_war:0 "撕毁停火协定"
 krcw_us_line_restart_war_desc:0 "把停火协定扔进火里，把浮桥推进水里。美国内战的第二阶段将从今天早上开始。\n\n这一步无法撤回。"
 krcw_us_foreign_supply:0 "外国的援助"
 krcw_us_foreign_supply_desc:0 "东岸有大陆上四分之三的钢，西岸有石油、人口和一位愿意出借机床的俄罗斯盟友。这场对峙的胜负，很大一部分要在美国以外决定。"
 krcw_usa_veracruz_convoy:0 "韦拉克鲁斯船队"
 krcw_usa_veracruz_convoy_desc:0 "俄罗斯的货轮在韦拉克鲁斯卸下机床、卡车和整套兵工厂设备，墨西哥的铁路把它们运过格兰德河。西岸的工厂比对岸少得多，但每一座都能装上最新的俄罗斯机器。"
 krcw_usa_oil_for_machines:0 "以石油换机器"
 krcw_usa_oil_for_machines_desc:0 "东得克萨斯与二叠纪盆地的原油装上油轮运往符拉迪沃斯托克与敖德萨，换回来的是机床、轴承和整套的炼油设备。这是西岸唯一一种对岸没有的东西。"
 krcw_usa_share_the_wealth_drive:0 "分享财富总动员"
 krcw_usa_share_the_wealth_drive_desc:0 "每一个领到家园津贴的家庭都有义务送一个儿子去国民警卫队。朗把这叫做“权利与义务的交换”，而西部与南方的农民认为这很公平。这是西岸对抗东岸工业优势的唯一办法：人。"
 krcw_wca_st_lawrence_accord:0 "圣劳伦斯协定"
 krcw_wca_st_lawrence_accord_desc:0 "安大略与五大湖两岸的工厂合并了调度中心。加拿大的镍、铀与木材沿圣劳伦斯河源源不断运来，底特律的卡车沿同一条路运回去。"
 krcw_wca_clearing_union_credits:0 "巴黎清算联盟额度"
 krcw_wca_clearing_union_credits_desc:0 "有了清算联盟，底特律的卡车可以直接换回里昂的机床与曼彻斯特的电机，不必先换成任何人的黄金。一个劳工的世界市场把东岸接进了全球。"
 krcw_wca_underground_railroad:0 "新地下铁道"
 krcw_wca_underground_railroad_desc:0 "在孟菲斯、维克斯堡与新奥尔良对岸，接待委员会在夜里点起灯。渡过河来的是黑人家庭、被取缔的工会会员和逃兵。他们带来西部的手艺，也带来对朗的机器的刻骨记忆。"
 krcw_wca_mexican_railwaymen:0 "墨西哥的铁路工人"
 krcw_wca_mexican_railwaymen_desc:0 "俄罗斯的军火要靠墨西哥的铁路才能到达西岸，而墨西哥的铁路要靠铁路工人才能开动。工团在铁路工会里有朋友，他们记得萨帕塔和比利亚。一列车皮误点一个星期，胜过河上一次突击。"
 JAP_krcw_kishi_desc:0 "“昭和之妖”。战时是统制派的经济官僚，管过满洲的工业和本土的军需，战败后侥幸没有被清算。如今他领导国民精神同盟，靠着通产省的官僚机器而非选票统治日本。他既想复兴帝国的国力，又不想让石原那样的军人把国家再次拖进战争——这两个目标能维持多久的平衡，连他自己也不知道。"
 MEX_krcw_maximino_desc:0 "阿维拉·卡马乔总统的兄长，比弟弟更贪婪也更强硬。他把革命党变成了自己的私产，从坦皮科走廊的每一节车皮里抽成，用恐吓和收买对付一切反对者。在他眼里，冷战不是意识形态之争，而是一门生意：只要俄国的坦克和朗的美元继续过境，墨西哥就继续繁荣，卡马乔家族就继续统治。"
 JAP_krcw_ishibashi:0 "石桥湛山"
 JAP_krcw_ishibashi_desc:0 "自由派经济学家、《东洋经济新报》的老主笔。他早在一九二〇年代就主张放弃满洲与朝鲜——他称之为“小日本主义”，认为殖民地是赔钱的负担，日本的未来在贸易而不在征服。如今历史证明了他，他也因此成了议会自由派的旗帜：一个没有帝国、靠做生意富起来的日本。"
 JAP_krcw_katayama:0 "片山哲"
 JAP_krcw_katayama_desc:0 "基督教社会主义者、律师，社会大众党的领袖。他梦想的日本是一个议会民主国家，工会合法、农民有地、军队服从内阁。在一个被复员军人和右翼团体填满的东京，这样的梦想显得脆弱——但正是这种脆弱让年轻人聚集到他身边。"
 JAP_krcw_yoshida:0 "吉田茂"
 JAP_krcw_yoshida_desc:0 "老练的外交官出身，保守合同派的中心人物。他相信日本应当把军备压到最低，把全部力气用来赚钱，让别人去承担对抗的成本——用他自己的话说，“让年轻人去经商，把打仗留给傻瓜”。他既不信任莫斯科，也不信任巴黎，只信任一支强大的日本商船队和一本平衡的账。"
 MEX_krcw_cardenas:0 "拉萨罗·卡德纳斯"
 MEX_krcw_cardenas_desc:0 "前总统，把石油收归国有、把土地分给村社的人。他从米却肯的庄园里注视着卡马乔家族如何把革命变成一门生意，越来越无法保持沉默。农民、铁路工人和年轻军官把他看作革命本来应该成为的样子——一个不做任何超级大国走廊的墨西哥。"
 MEX_krcw_lombardo:0 "隆巴多·托莱达诺"
 MEX_krcw_lombardo_desc:0 "墨西哥劳工联合会的创始人，工团主义思想在墨西哥的化身。他公开赞美纽约的美洲工团，主张墨西哥的铁路工人和矿工应当接管自己的工厂。走廊每天运来俄国的坦克，也运来他从美洲工团借来的思想——在卡马乔看来，他比朗的任何一个敌人都更危险。"
 MEX_krcw_aleman:0 "米格尔·阿莱曼"
 MEX_krcw_aleman_desc:0 "新一代革命党人的代表：律师、生意人、不穿军装的第一位总统人选。他不关心土地改革或工人权利，只关心增长、水坝、公路和北方的工厂。在他手里，革命党会变成一台高效而彻底腐败的现代化机器——完美的独裁。"
 MEX_krcw_amaro:0 "华金·阿马罗"
 MEX_krcw_amaro_desc:0 "把墨西哥革命时期的游击队改造成一支正规军的人。他用俄国的装备和普鲁士式的操典重建军官团，坚持“文官至上”——只要文官别碰军队的预算。北部边防军就是他的作品：一支既能挡住朗的溃兵、又能挡住美洲工团志愿者的军队。"
 PSA_krcw_martin:0 "克拉伦斯·马丁"
 krcw_psa_lean_ti_focus_tt:0 "宪政联盟倾向第三国际上升"
 krcw_psa_lean_ma_focus_tt:0 "宪政联盟倾向莫斯科协定上升"
 krcw_psa_the_presidio:0 "萨克拉门托与要塞"
 krcw_psa_the_presidio_desc:0 "一九四九年一月，厄尔·沃伦在萨克拉门托宣誓就任总统，承诺结束战时权力法。旧金山要塞里，麦克阿瑟仍以西部防务司令的身份管着各港口的军区，他手下的要塞派不打算交出这些权力。"
 krcw_psa_martial_law_review:0 "审查战时权力法"
 krcw_psa_martial_law_review_desc:0 "沃伦总统请国会和最高法院组成联合委员会，逐条审查一九四二年以来西部防务司令部在各军区发布的命令。律师公会早就在等这一天，麦克阿瑟的参谋部则回答说，打仗的命令不该交给律师来审。"
 krcw_psa_recall_the_legislature:0 "把港口交还文官政府"
 krcw_psa_recall_the_legislature_desc:0 "旧金山、奥克兰、洛杉矶和西雅图的市长和警察局重新接管军区的日常事务，各州州长要回了港口的预算。要塞派警告，码头上一罢工，文官政府就收拾不住。"
 krcw_psa_the_proconsulate:0 "扩大军区"
 krcw_psa_the_proconsulate_desc:0 "国会再次续期战时权力法，还把洛杉矶的工厂区和内华达的矿山划进军区，交给西部防务司令部。联合委员会的审查就此搁置。麦克阿瑟对记者说：“民主是和平时期的奢侈品。”"
 krcw_psa_the_longshoremen:0 "处置码头工会"
 krcw_psa_the_longshoremen_desc:0 "旧金山、奥克兰与西雅图的码头工会从来没有服从过军区的命令，哈里·布里奇斯的人在每条船上都有。文官政府可以和他们谈合同，军区可以抓人。纽约在看萨克拉门托怎么选。"
 krcw_psa_constitution_in_exile:0 "展出宪法原件"
 krcw_psa_constitution_in_exile_desc:0 "一九三六年政变后，国家档案馆的人把一七八七年的宪法原件装箱运到了西部。国会把它陈列在萨克拉门托州议会大厦的圆厅里，每个星期天，排队参观的人从门口一直排到国会街。"
 krcw_psa_pacific_economy:0 "太平洋经济"
 krcw_psa_pacific_economy_desc:0 "西海岸与东岸的工厂、与得克萨斯的油田都隔断了。加州的橙子、俄勒冈的木材和华盛顿的铝，必须找到新的买家。"
 krcw_psa_los_angeles_aircraft:0 "洛杉矶飞机厂"
 krcw_psa_los_angeles_aircraft_desc:0 "洛克希德、道格拉斯与北美航空的工厂都留在了洛杉矶。它们没有了联邦订单，国会却急需一支空军，阿诺德将军把订单交给了它们。"
 krcw_psa_columbia_power:0 "哥伦比亚河电力"
 krcw_psa_columbia_power_desc:0 "大古力与邦纳维尔大坝的电力，足以让西北的铝厂重新开工。"
 krcw_psa_central_valley_farms:0 "中央谷地农场"
 krcw_psa_central_valley_farms_desc:0 "中央谷地的灌溉渠修好了。西海岸至少不必再担心粮食。"
 krcw_psa_nevada_mines:0 "内华达矿山"
 krcw_psa_nevada_mines_desc:0 "内华达的铜、钨与银矿重新开采。每一吨矿石都是与外国谈判的筹码。"
 krcw_psa_golden_gate_prosperity:0 "扩大太平洋贸易"
 krcw_psa_golden_gate_prosperity_desc:0 "太平洋贸易的船只源源不断地驶入旧金山湾，关税让萨克拉门托第一次有了预算盈余。国会把钱投进港口和铁路，民主党要求拿一部分给码头工人加薪。"
 krcw_psa_pacific_fleet_command:0 "太平洋舰队司令部"
 krcw_psa_pacific_fleet_command_desc:0 "尼米兹上将的太平洋舰队是宪政联盟唯一能与另外两个美国相比的力量，一九三六年它跟着西海岸的州长们，不承认华盛顿的政变政府。圣迭戈与布雷默顿的船坞必须保持运转。"
 krcw_psa_sierra_line:0 "内华达山防线"
 krcw_psa_sierra_line_desc:0 "落基山与内华达山之间的隘口是朗的军队唯一的通道。工兵开始在那里浇筑混凝土。"
 krcw_psa_national_guard:0 "西部国民警卫队"
 krcw_psa_national_guard_desc:0 "国会通过征兵法，每个十八岁的西海岸男青年都要在国民警卫队服役一年。各州州长管训练，马歇尔的参谋部管编制，西部防务司令部则要求把警卫队划归军区指挥。"
 krcw_psa_alaska_garrison:0 "阿拉斯加驻军"
 krcw_psa_alaska_garrison_desc:0 "阿拉斯加离俄罗斯只有八十公里。那里的驻军既是宪政联盟的前哨，也是它与莫斯科讨价还价的筹码。"
 krcw_psa_between_two_americas:0 "接待各方特使"
 krcw_psa_between_two_americas_desc:0 "纽约的特使坐东边的火车来，新奥尔良的特使坐南边的飞机来，巴黎和莫斯科的特使则坐船来。沃伦总统在萨克拉门托分别接见他们，国会外交委员会要求每一份提议都送来审议。"
 krcw_psa_paris_credits:0 "接受巴黎船坞信贷"
 krcw_psa_paris_credits_desc:0 "巴黎清算联盟愿意为西海岸的船坞提供信贷，条件是被军区关押的码头工会领袖出狱。"
 krcw_psa_russian_oil:0 "俄国石油"
 krcw_psa_russian_oil_desc:0 "俄罗斯远东的油轮开始停靠长滩。莫斯科只要求一件事：阿拉斯加的机场，将来要为“共同防御”敞开。"
 krcw_psa_the_third_america:0 "宣布宪政联盟中立"
 krcw_psa_the_third_america_desc:0 "沃伦总统在萨克拉门托的广播中宣布：宪政联盟不加入任何阵营，也不承认纽约或新奥尔良代表全美国。巴黎和莫斯科的特使被请回了船上，国会批准扩编国民警卫队。"
 krcw_psa_choose_new_york:0 "向纽约靠拢"
 krcw_psa_choose_new_york_desc:0 "码头工会和民主党左翼在国会里凑够了票。与其等一场总罢工把政府赶下台，不如由萨克拉门托自己谈定加入第三国际的条件。"
 krcw_psa_choose_new_orleans:0 "与新奥尔良结盟"
 krcw_psa_choose_new_orleans_desc:0 "朗的条件摆在桌上：西海岸各州保留州长和国会席位，太平洋舰队编入合众国海军，麦克阿瑟拿一根元帅杖。国会里的共和党保守派第一次认真讨论这份条件。"
 krcw_psa_the_generals_age:0 "讨论麦克阿瑟退役"
 krcw_psa_the_generals_age_desc:0 "麦克阿瑟已经六十九岁，马歇尔和国会里的宪法派都想让他退役。要塞派担心将军一走，战时权力法也就保不住了。西部防务司令部交给谁，是温赖特、尼米兹的舰队，还是国会，要先在萨克拉门托吵出个结果。"
 krcw_psa_the_constitutional_convention:0 "制宪会议"
 krcw_psa_the_constitutional_convention_desc:0 "西海岸各州的代表在萨克拉门托开会，审议一九三六年以来的全部战时法律：废除战时权力法，撤销港口军区，规定西部防务司令部向谁负责。要塞派说，仗还没打完就先拆了自己的防线。"
 krcw_psa_the_perpetual_emergency:0 "永久的紧急状态"
 krcw_psa_the_perpetual_emergency_desc:0 "国会不再每年续期战时权力法，改为在战争结束前一直有效。麦克阿瑟在听证会上说：“只要密西西比河对岸还有一个自称美国的政权，紧急状态就不能结束。”沃伦总统没有足够的票否决它，只好签字。"
 krcw_psa_the_presidio_takes_over:0 "要塞接管"
 krcw_psa_the_presidio_takes_over_desc:0 "温赖特和哈尔西带着要塞派的军官来见总统：国会守不住西海岸，西部防务司令部要在战争结束前接管政府。马歇尔和尼米兹没有出兵阻止。国会将休会，选举延期，由麦克阿瑟主持军事委员会。"
 krcw_psa_seattle_aerospace:0 "西雅图航空航天"
 krcw_psa_seattle_aerospace_desc:0 "波音的工程师从轰炸机转向了喷气机与火箭。国会拨款在西雅图建一座风洞和一个火箭试验场，阿诺德将军要的是能从阿拉斯加飞到西伯利亚的轰炸机。"
 krcw_psa_the_pacific_rim_trade:0 "环太平洋贸易"
 krcw_psa_the_pacific_rim_trade_desc:0 "日本的机床、中国的丝绸和澳新的羊毛都经旧金山湾转运，国会降低了转口关税。纽约和新奥尔良都抱怨萨克拉门托在和对方的盟友做生意。"
 krcw_psa_carrier_task_forces:0 "航母特混舰队"
 krcw_psa_carrier_task_forces_desc:0 "哈尔西坚持认为，宪政联盟的未来在航空母舰的甲板上。旧金山与圣迭戈的船坞开始铺设新的龙骨。"
 krcw_psa_the_silent_service:0 "组建潜艇部队"
 krcw_psa_the_silent_service_desc:0 "宪政联盟买不起与两个对手同等的水面舰队，但潜艇便宜，而且能让任何封锁旧金山湾的企图付出代价。"
 krcw_psa_court_hawaii:0 "争取夏威夷"
 krcw_psa_court_hawaii_desc:0 "独立的夏威夷共和国扼守太平洋的中央。一九四一年斯坦贝克总督不肯承认萨克拉门托，珍珠港的军舰一半开回了本土，一半留了下来。沃伦总统想和檀香山谈一个共同防务的安排。"
 krcw_psa_the_pacific_pact:0 "签订太平洋共同防御条约"
 krcw_psa_the_pacific_pact_desc:0 "沃伦总统向东京、堪培拉和檀香山提议签订共同防御条约：任何一方遭到两大阵营攻击，其余各方开放港口并提供补给。条约没有常设司令部，只有一份联合巡逻计划。"
 krcw_psa_30_t:0 "将军之后"
 krcw_psa_30_d:0 "参议院军事委员会就麦克阿瑟的退役举行听证。温赖特要求由要塞派的人接任西部防务司令，尼米兹提议由舰队和陆军共同指挥，马歇尔则主张撤销这个司令部，各军区交还国会管辖。沃伦总统要把一个方案送交国会表决。"
 krcw_psa_30.a:0 "由温赖特接任西部防务司令"
 krcw_psa_30.b:0 "由舰队和陆军共同指挥"
 krcw_psa_30.c:0 "撤销司令部，军区交还国会"
 krcw_psa_32_t:0 "萨克拉门托宪章"
 krcw_psa_32_d:0 "制宪会议的代表们吵了六个星期。要塞派要求保留西部防务司令部的紧急权力，宪法派要求废除战时权力法，码头工会要求把劳动权利写进去。最后的草案是一份妥协，要由国会两院表决。"
 krcw_psa_32.a:0 "废除战时权力法"
 krcw_psa_32.b:0 "保留西部防务司令部的紧急权力"
 krcw_psa_34_t:0 "珍珠港的回答"
 krcw_psa_34_d:0 "檀香山的答复来了。夏威夷共和国不愿放弃独立，但愿意讨论一件事：让留在珍珠港的那半支舰队，与宪政联盟共用基地与船坞。这不是合并，但也不再是分离。"
 krcw_psa_34.a:0 "共用基地，共守太平洋"
 krcw_psa_34.b:0 "只要舰队，不要条件"
 krcw_psa_fleet_cat:0 "太平洋舰队部署"
 krcw_psa_fleet_cat_desc:0 "宪政联盟唯一的王牌是它的舰队。它停在哪里，就是在向谁递话。"
 krcw_psa_show_the_flag:0 "巡航金门"
 krcw_psa_show_the_flag_desc:0 "舰队在旧金山湾外列队航行，向东西两岸的对手同时展示：宪政联盟还在这里。"
 krcw_psa_escort_pacific_trade:0 "护航太平洋贸易"
 krcw_psa_escort_pacific_trade_desc:0 "舰队为环太平洋的商船护航。中立国的旗帜第一次比大国的旗帜更受欢迎。"
 krcw_psa_alaska_patrol:0 "阿拉斯加巡逻"
 krcw_psa_alaska_patrol_desc:0 "潜艇在白令海峡游弋。莫斯科知道，任何越过阿拉斯加的企图都要先问一问宪政联盟的舰队。"
 krcw_psa_constitutional_guardian:0 "宪法的守护者"
 krcw_psa_constitutional_guardian_desc:0 "萨克拉门托自称合众国唯一的宪政政府，国会每次开会都先宣读宪法。西海岸的人愿意为这份文件纳税和服役，纽约和新奥尔良则说它只是一张旧纸。"
 krcw_psa_military_council:0 "军事委员会"
 krcw_psa_military_council_desc:0 "国会休会，选举延期，麦克阿瑟主持的军事委员会代行总统职权，直到战争结束。各州州长留任，但每个州府里都驻着西部防务司令部的军官。"
 krcw_psa_36_t:0 "要塞接管"
 krcw_psa_36_d:0 "夜里，西部防务司令部的部队包围了萨克拉门托的州议会大厦。温赖特把一封信交给沃伦总统：国会无力保卫西海岸，在战争结束以前，由麦克阿瑟主持的军事委员会代行总统职权。马歇尔留在陆军部没有出来，尼米兹的舰队留在港内。"
 krcw_psa_36.a:0 "沃伦签字，搭船去檀香山"
 krcw_psa_36.b:0 "沃伦拒绝签字，被带往要塞"
 krcw_psa_pacific_neutrality:0 "太平洋中立"
 krcw_psa_pacific_neutrality_desc:0 "两大阵营共同保障宪政联盟的中立。港口向所有人开放，军舰只为自卫而存在。"
 krcw_ampre_1_t:0 "为什么我们没有赢"
 krcw_ampre_1_d:0 "十年前，每一个工团民兵都相信战争会在圣诞节前结束。一九三八年，协约国的干涉军从加拿大南下，我们在奥尔巴尼和布法罗把他们打了回去；一九四一年，华盛顿的联邦政府垮了。那时候，整个美洲似乎都在等待红旗。\n\n可是战争没有结束。麦克阿瑟带着联邦的残军突围西撤，落基山以西的宪政政府守着太平洋舰队。巴黎的同志们把他们的师团投在了易北河，送来的是钱、船和英国的工厂设备。我们在底特律和匹兹堡建起了装甲车间，一九四二年的反攻把朗推回了密西西比河。\n\n然后俄国人的火车开进了得克萨斯。一九四三年冬天以后，莫辛步枪、嘎斯卡车和炮弹经墨西哥源源不断地运到朗的手里，萨文科夫需要一个能拖住法国人的美洲。到一九四六年，阿巴拉契亚被打成了焦土，双方都再也没有力气渡过大河。《圣路易斯停火协定》不是和平，只是两个精疲力竭的拳手同时垂下了手臂。"
 krcw_ampre_1.a:0 "另一半的内战，我们会用工厂来打赢。"
 krcw_ampre_2_t:0 "失之于东，取之于中"
 krcw_ampre_2_d:0 "一九三六年内战爆发时，朗控制了南方各州。工团从五大湖向南推进，麦克阿瑟的军政府困守华盛顿，三方在俄亥俄河谷和阿巴拉契亚山地反复拉锯。\n\n一九三七年华盛顿陷落，麦克阿瑟逃往丹佛。朗的部队沿密西西比河北上，占领了圣路易斯、堪萨斯城和整个中西部平原。工团追击麦克阿瑟残军，无力阻止朗向西扩张。到一九四〇年，朗已经控制了从密西西比河到落基山的全部内陆。\n\n但南方守不住了。一九四二年以后，工团的装甲部队在东部一路南下，佐治亚、阿拉巴马的防线接连崩溃。更要命的是后方：南方黑人起义切断了补给，民兵不敢深入黑人占多数的县。到一九四三年冬天，连新奥尔良都能听到北方的炮声。\n\n俄国人救了我们。第一列军火列车从坦皮科开进圣安东尼奥，车皮里是莫辛步枪、嘎斯卡车和炮弹。一九四四年，巴顿的军队在密西西比河一线挡住了工团。我们守住了中部，也守住了新奥尔良。至于密西西比河以东，那是将来的事。"
 krcw_ampre_2.a:0 "每个人都是国王，帮过我们的人也一样。"
 krcw_ampre_3_t:0 "长征"
 krcw_ampre_3_d:0 "一九三六年，麦克阿瑟执行”白色作战计划”，带兵控制了华盛顿。西海岸各州的州长不承认政变政府，赶到萨克拉门托的议员宣布凑足了法定人数，副总统昆汀·罗斯福代理总统。马歇尔将军前来效力，太平洋舰队也跟着州长们留在了西海岸。\n\n一九三七年华盛顿陷落，麦克阿瑟飞往丹佛。他在中部组织防线，但朗从南方猛攻，工团从东部推进，联邦军腹背受敌。到一九四〇年，丹佛守不住了。\n\n八月，麦克阿瑟乘飞机飞往旧金山。联邦军残部——两万多人——从科罗拉多向西撤退，经犹他、内华达沙漠，历时半年抵达加州。这是一场地狱行军：沙漠、高温、缺水，一路上丢下了近万人。\n\n萨克拉门托接纳了他们，但罗斯福政府要求麦克阿瑟放弃独立的联邦政府名义，接受对政变的审查。麦克阿瑟最终担任西部防务司令，受民事监督。一九四八年罗斯福不再竞选，厄尔·沃伦当选总统。一九四九年一月，沃伦在萨克拉门托宣誓就职。这个政府说自己是美国唯一的宪政政府。"
 krcw_ampre_3.a:0 "我们效忠的是宪法。"
 krcw_ampre_4_t:0 "奥尔巴尼之后"
 krcw_ampre_4_d:0 "一九三八年，流亡的国王和他的政府决定越过边境，去“拯救美国的宪政”。打这场仗的，是安大略的工人和魁北克的农民，他们被征召、被送上南下的火车。\n\n奥尔巴尼一役，加拿大远征军损失了三个师；布法罗一役，又是两个。一九四〇年春天，渥太华宣布扩大征兵，魁北克拒绝了，蒙特利尔的码头和汉密尔顿的钢厂随即全面罢工。开往前线的部队在金斯顿停了下来，士兵们选出了自己的委员会。\n\n国王第二次出逃，这一次去了墨尔本。留在加拿大的，是一个在失败的干涉战争中诞生的工人共和国，以及一条它永远不会忘记的教训：干涉邻国革命的战争，最先吞噬的是干涉者自己。"
 krcw_ampre_4.a:0 "再也不会有人替国王打仗了。"
 krcw_mex_the_corridor:0 "控制过境走廊"
 krcw_mex_the_corridor_desc:0 "坦皮科的码头上，俄国货轮排成了长队。车皮从港口一路北上，经蒙特雷驶向拉雷多的铁桥——墨西哥是朗的合众国与莫斯科之间唯一的陆上通道。马克西米诺·阿维拉·卡马乔从每一节车皮里都抽成。"
 krcw_mex_tampico_docks:0 "坦皮科码头"
 krcw_mex_tampico_docks_desc:0 "俄国工程师扩建了坦皮科港，新吊车日夜不停。"
 krcw_mex_monterrey_steel:0 "蒙特雷钢铁"
 krcw_mex_monterrey_steel_desc:0 "蒙特雷的钢厂为北方的铁路和朗的坦克轧钢。"
 krcw_mex_pemex_oil:0 "国家石油"
 krcw_mex_pemex_oil_desc:0 "韦拉克鲁斯与塔瓦斯科的油田是墨西哥真正的财富。它们归国家所有——至少在账面上。"
 krcw_mex_mexico_city_works:0 "首都工业区"
 krcw_mex_mexico_city_works_desc:0 "墨西哥城北郊的新工业区把走廊的利润变成了工厂。"
 krcw_mex_accord_arsenal:0 "建造协定兵工厂"
 krcw_mex_accord_arsenal_desc:0 "俄国图纸，墨西哥工人，得克萨斯买家。"
 krcw_mex_green_revolution:0 "推广巴希奥新麦种"
 krcw_mex_green_revolution_desc:0 "瓜纳华托与哈利斯科的新品种小麦让城市的面包价格第一次下降了。"
 krcw_mex_the_camacho_machine:0 "建立卡马乔党机器"
 krcw_mex_the_camacho_machine_desc:0 "马克西米诺比他的兄弟更贪婪，也更强硬。革命党的每一个州委都向他汇报。"
 krcw_mex_ejido_question:0 "决定村社土地去留"
 krcw_mex_ejido_question_desc:0 "卡德纳斯分给农民的村社土地正被将军和地主一块块收回。是继续收，还是停下来？"
 krcw_mex_hard_hand:0 "铁腕"
 krcw_mex_hard_hand_desc:0 "联邦安全局在每一个铁路枢纽设了办公室。纽约的传单一出现，印传单的人就会消失。"
 krcw_mex_cardenas_returns:0 "请卡德纳斯复出"
 krcw_mex_cardenas_returns_desc:0 "老总统从米却肯的庄园里走了出来。农民、铁路工人与年轻军官围在他身边，要求把土地还给村社，也要求墨西哥不再做任何人的走廊。"
 krcw_mex_the_long_border:0 "加强北方边防"
 krcw_mex_the_long_border_desc:0 "三千公里的边境线另一侧，是一个可能随时崩溃的盟友。"
 krcw_mex_moscow_friendship:0 "加强与莫斯科关系"
 krcw_mex_moscow_friendship_desc:0 "俄国大使馆是墨西哥城里最大的外国使馆。"
 krcw_mex_new_orleans_partner:0 "与新奥尔良结盟"
 krcw_mex_new_orleans_partner_desc:0 "朗叫卡马乔“我的墨西哥兄弟”。卡马乔叫朗“我最好的客户”。"
 krcw_mex_pacific_trade:0 "太平洋贸易"
 krcw_mex_pacific_trade_desc:0 "马萨特兰与曼萨尼略的港口向宪政联盟和日本的商船开放。"
 krcw_mex_latin_voice:0 "召开美洲国家会议"
 krcw_mex_latin_voice_desc:0 "墨西哥城召集了一次美洲国家会议。阿根廷与巴西的代表来了，他们想知道：墨西哥是莫斯科的代言人，还是拉丁美洲的代言人？"
 krcw_mex_neither_corridor:0 "对过境运输征税"
 krcw_mex_neither_corridor_desc:0 "卡德纳斯宣布：墨西哥的铁路属于墨西哥。俄国人的车皮照样可以过境——但要付关税，而且要接受检查。"
 krcw_mex_northern_boom:0 "北方的繁荣"
 krcw_mex_northern_boom_desc:0 "蒙特雷、萨尔蒂约与拉雷多沿线的工厂靠着军火订单和走廊的过境费扩张。北方越来越像美国，南方越来越像从前。"
 krcw_mex_ejido_restored:0 "重建的村社"
 krcw_mex_ejido_restored_desc:0 "卡德纳斯的土地改革被重新推行。将军和地主失去了刚刚收回的庄园，几百万农民第一次相信革命党说的话。"
 krcw_mex_one_party:0 "完美的独裁"
 krcw_mex_one_party_desc:0 "革命党赢得每一次选举，因为它就是选举。反对派可以存在，可以办报，可以在议会里占几个席位——但永远也当不了总统。"
 krcw_mex_sindicalist_ferment:0 "工团主义的躁动"
 krcw_mex_sindicalist_ferment_desc:0 "铁路工会、矿工工会与教师工会读着从纽约偷运来的传单。走廊运的是俄国的坦克，可它也运来了美洲工团的思想。"
 krcw_mex_northern_industry:0 "北方工业化"
 krcw_mex_northern_industry_desc:0 "走廊的利润有两个去处：变成蒙特雷的高炉，或者变成南方农民手里的土地。北方的将军和实业家知道该选哪个。"
 krcw_mex_southern_land:0 "南方土地改革"
 krcw_mex_southern_land_desc:0 "恰帕斯与瓦哈卡的印第安村庄还在为一八五七年就该属于他们的土地打官司。把土地给他们，北方的地主会愤怒，可南方会安静下来。"
 krcw_mex_electrify:0 "农村电气化"
 krcw_mex_electrify_desc:0 "联邦电力委员会把电线拉到了巴希奥的每一个村镇。灯泡亮起来的那一晚，革命党在每一个村子都多了几百张选票。"
 krcw_mex_pemex_expansion:0 "开发坎佩切湾油田"
 krcw_mex_pemex_expansion_desc:0 "坎佩切湾发现了新油田。国家石油公司雇了俄国的钻井工程师，也雇了美国的地质学家——账目由总统的连襟管着。"
 krcw_mex_bank_of_mexico:0 "墨西哥银行"
 krcw_mex_bank_of_mexico_desc:0 "走廊的过境费用美元结算，军火订单用卢布结算，农民用比索还债。墨西哥银行要在这三种货币之间玩一场没有尽头的杂耍。"
 krcw_mex_russian_equipment:0 "俄式装备"
 krcw_mex_russian_equipment_desc:0 "过境的坦克里，每二十辆就有一辆\"在运输途中损坏\"，然后出现在墨西哥陆军的编制里。俄国人对此睁一只眼闭一只眼——这总比让它们落到别处强。"
 krcw_mex_officer_academy:0 "收编军官团"
 krcw_mex_officer_academy_desc:0 "墨西哥的将军们习惯了拥兵自重。革命党用退休金、大使职位和股份把最危险的几个收买了，剩下的送进军校重新学习\"文官至上\"。"
 krcw_mex_border_command:0 "北部边防"
 krcw_mex_border_command_desc:0 "三千公里的边境线，另一侧是一个随时可能重新开打的内战。墨西哥的北部军区既要防朗的溃兵，也要防美洲工团的志愿者。"
 krcw_mex_single_party:0 "改组革命党"
 krcw_mex_single_party_desc:0 "把革命党从一个派系联盟改造成一台机器：工会、农会与军人各占一个部门，总统提名继承人，继承人再提名下一个。反对派永远存在，永远输。"
 krcw_mex_open_the_system:0 "开放体制"
 krcw_mex_open_the_system_desc:0 "年轻的革命党人主张：与其永远用舞弊赢得选举，不如赢得一次真正的选举。这是一场豪赌——机器可能会输。"
 krcw_mex_sindicalist_question:0 "处置工团主义者"
 krcw_mex_sindicalist_question_desc:0 "铁路与矿工工会里的工团主义者越来越多。政府可以镇压他们，把他们赶进纽约的怀抱；也可以把他们请进革命党，赌自己能驯服他们。"
 krcw_mex_diversify_trade:0 "贸易多元化"
 krcw_mex_diversify_trade_desc:0 "只做俄国和朗的生意太危险了。墨西哥的石油、白银和棉花可以卖给任何人：宪政联盟、日本，甚至纽约的工团。"
 krcw_mex_court_the_syndicates:0 "接触工团"
 krcw_mex_court_the_syndicates_desc:0 "如果朗的美国崩溃，墨西哥不想站在输的一方。悄悄地，墨西哥城的信使开始与纽约来往——这是叛卖，还是远见？"
 krcw_mex_latin_leadership:0 "争取拉美领导地位"
 krcw_mex_latin_leadership_desc:0 "阿根廷太远，巴西太大，智利太红。墨西哥有石油、有工业、有一个能开会的首都——它想成为拉丁美洲对两个超级阵营说\"不\"的那个声音。"
 krcw_mex_10_t:0 "拉雷多的铁桥"
 krcw_mex_10_d:0 "每天夜里，一列拉着帆布篷的货车驶过拉雷多的铁桥，开进朗的得克萨斯。桥这边站着俄国武官，桥那边站着朗的军官，中间站着一个数车皮的墨西哥海关官员——他数的每一节车皮都是钱。可是最近，纽约的报纸开始刊登这座桥的照片。"
 krcw_mex_10.a:0 "加大过境量"
 krcw_mex_10.b:0 "收紧检查"
 krcw_mex_11_t:0 "米却肯的老人"
 krcw_mex_11_d:0 "拉萨罗·卡德纳斯从来没有真正离开政治。他在米却肯的庄园里接待铁路工人、印第安村长和年轻军官，听他们抱怨走廊、地主和贪腐。革命党的现任主席派人去请他\"保持沉默\"，老人只回了一句话：\"我沉默了十五年，够了。\""
 krcw_mex_11.a:0 "收编卡德纳斯派"
 krcw_mex_11.b:0 "把他孤立起来"
 krcw_mex_12_t:0 "选举之夜"
 krcw_mex_12_d:0 "开票开始了。头两个小时，反对派在城市里领先——然后农村的选票\"到了\"，革命党的候选人以百分之九十的得票\"当选\"。这一次，墨西哥城的大学生走上了街头，铁路工会宣布罢工。政府必须决定：这台机器还要不要继续假装是民主的？"
 krcw_mex_12.a:0 "承认机器的胜利"
 krcw_mex_12.b:0 "让步：下次真选"
 krcw_mex_corridor_cat:0 "走廊"
 krcw_mex_corridor_cat_desc:0 "每一列过境的军火列车都是外交、金钱与风险的混合物。"
 krcw_mex_expand_throughput:0 "扩大过境量"
 krcw_mex_expand_throughput_desc:0 "再修一条从坦皮科到拉雷多的复线铁路。俄国人会付一半的钱，朗会更依赖你，纽约会更恨你。"
 krcw_mex_skim_the_shipments:0 "截留军火"
 krcw_mex_skim_the_shipments_desc:0 "每一批过境的军火都\"损耗\"一点，损耗的部分进了墨西哥陆军的仓库。做得太过火，俄国人会发现。"
 krcw_mex_toll_revenue:0 "征收过境费"
 krcw_mex_toll_revenue_desc:0 "每一节车皮都要交钱。这笔钱不进国库，进的是革命党的选举经费和几位将军的瑞士账户。"
 krcw_mex_close_the_corridor:0 "关闭走廊"
 krcw_mex_close_the_corridor_desc:0 "拉下拉雷多铁桥的道闸。朗的美国将失去它的军火来源，莫斯科将失去它在美洲的通道——而墨西哥将第一次真正独立。"
 krcw_jap_after_the_empire:0 "安置大陆撤侨"
 krcw_jap_after_the_empire_desc:0 "朝鲜、满洲和库页岛都已失去，五百万人从大陆撤回本土。安置撤侨，稳定国内。"
 krcw_jap_repatriates:0 "安置五百万撤侨"
 krcw_jap_repatriates_desc:0 "从大陆撤回来的移民、士兵与官员需要工作、住房和一个解释。"
 krcw_jap_zaibatsu_revival:0 "财阀复兴"
 krcw_jap_zaibatsu_revival_desc:0 "三井、三菱与住友的董事们被重新请进了通产省。"
 krcw_jap_shipbuilding:0 "造船业"
 krcw_jap_shipbuilding_desc:0 "吴港与长崎的船台上，第一次在和平时期开工造油轮和货轮。"
 krcw_jap_electronics:0 "电子工业"
 krcw_jap_electronics_desc:0 "东京的小作坊开始组装收音机，然后是雷达真空管。"
 krcw_jap_income_doubling:0 "经济起飞"
 krcw_jap_income_doubling_desc:0 "通产省的计划：十年之内，国民收入翻一番。"
 krcw_jap_formosa_development:0 "台湾开发"
 krcw_jap_formosa_development_desc:0 "台北的总督府修铁路、建糖厂，也在抓捕“自治运动”的组织者。南京的广播每天晚上都在海峡对岸播放。"
 krcw_jap_formosa_self_rule:0 "台湾议会"
 krcw_jap_formosa_self_rule_desc:0 "与其让南京赢得台湾人的心，不如让台湾人自己选一个议会。"
 krcw_jap_fortress_formosa:0 "台湾要塞"
 krcw_jap_fortress_formosa_desc:0 "海军在澎湖和高雄修筑炮台。台湾是帝国的最后一道门。"
 krcw_jap_kishi_and_the_generals:0 "与军方达成协议"
 krcw_jap_kishi_and_the_generals_desc:0 "石原莞尔的将军们要一支能收复大陆的军队；岸信介要一支能保住政权的军队。两者并不一样。"
 krcw_jap_rearmament:0 "重整军备"
 krcw_jap_rearmament_desc:0 "“自卫”这个词在东京的报纸上越来越常见。"
 krcw_jap_taisho_spirit:0 "大正精神"
 krcw_jap_taisho_spirit_desc:0 "议会里的自由派与社会党人重新团结起来，要求恢复政党内阁。他们记得一九二〇年代，那时候的日本也曾是一个民主国家。"
 krcw_jap_russian_oil:0 "进口库页岛石油"
 krcw_jap_russian_oil_desc:0 "俄国人把库页岛的石油卖给了东京，价格很公道。在莫斯科，这叫做“敌人的敌人”。"
 krcw_jap_join_the_accord:0 "加入莫斯科协定"
 krcw_jap_join_the_accord_desc:0 "岸信介飞往莫斯科。协定的条件很简单：日本不再觊觎满洲，俄国则承认台湾属于日本。"
 krcw_jap_pacific_neutrality:0 "宣布武装中立"
 krcw_jap_pacific_neutrality_desc:0 "日本不加入莫斯科协定，靠自己的舰队和保安队守住本土与台湾，同时向两个阵营卖船和机器。协定会因此减少库页岛石油的供应，国际也不会因此放心。"
 krcw_jap_pacific_markets:0 "太平洋市场"
 krcw_jap_pacific_markets_desc:0 "日本的货轮驶向旧金山、马尼拉与悉尼。"
 krcw_jap_accord_navy:0 "为协定建造舰队"
 krcw_jap_accord_navy_desc:0 "俄国人没有像样的太平洋舰队。日本有船坞，也有会开船的人。"
 krcw_jap_treaty_limits:0 "青岛条约的限制"
 krcw_jap_treaty_limits_desc:0 "一九四四年的停战协定规定了帝国陆军的上限：二十个师，没有重型装备，没有战略航空兵。条约没有规定的是，通产省可以把多少钱花在\"警察预备队\"上。"
 krcw_jap_miti_planning:0 "通产省的指导"
 krcw_jap_miti_planning_desc:0 "通产省不下命令，只\"指导\"。可是没有一家会社敢不听指导——外汇配额、进口许可与银行贷款都在那栋楼里。"
 krcw_jap_zaibatsu_restored:0 "财阀的复权"
 krcw_jap_zaibatsu_restored_desc:0 "三井、三菱与住友重新掌握了银行、船运与重工业。效率回来了，战前那种财阀与政客的交易也回来了。"
 krcw_jap_formosa_home_rule:0 "台湾议会"
 krcw_jap_formosa_home_rule_desc:0 "台北的议会有权决定糖价、学校的语言与地方警察的人事。南京的广播因此少了一半的听众。"
 krcw_jap_diet_restored:0 "政党内阁"
 krcw_jap_diet_restored_desc:0 "首相由议会多数党的总裁出任，官僚不再能绕过议会发布敕令。大正年间的日本回来了——将军们在报纸上称之为\"第二次战败\"。"
 krcw_jap_pacific_workshop_spirit:0 "太平洋的工厂"
 krcw_jap_pacific_workshop_spirit_desc:0 "日本的货轮驶向每一个不问政治的港口：马尼拉、悉尼、旧金山、瓦尔帕莱索。两个阵营都封锁不了一个谁都需要的供货商。"
 krcw_jap_miti_guidance:0 "由通产省制定产业规划"
 krcw_jap_miti_guidance_desc:0 "宇野学派的经济学家在通产省里画出了未来十年的产业地图：先造船与钢铁，再是汽车与电子。私人会社可以不同意，但外汇配额在政府手里。"
 krcw_jap_zaibatsu_ascendant:0 "财阀掌权"
 krcw_jap_zaibatsu_ascendant_desc:0 "让三井与三菱自己去决定投资什么。政府只要税收和出口额，其余的交给那些从明治年间就在赚钱的家族。"
 krcw_jap_taiheiyo_belt:0 "太平洋工业带"
 krcw_jap_taiheiyo_belt_desc:0 "从京滨到北九州，沿着濑户内海的一条工业走廊。填海造地、深水码头、石化联合体，日本把自己的海岸线变成了一条生产线。"
 krcw_jap_shinkansen:0 "弹丸列车"
 krcw_jap_shinkansen_desc:0 "战前铁道省的\"弹丸列车\"计划本来是要修到北京去的。现在它只修东京到大阪——但时速两百公里，而且准点到秒。"
 krcw_jap_showa_research:0 "昭和研究会"
 krcw_jap_showa_research_desc:0 "战时智囊团昭和研究会重新成立，研究方向转向晶体管、合成纤维和船用柴油机。"
 krcw_jap_women_in_industry:0 "改善纺织女工待遇"
 krcw_jap_women_in_industry_desc:0 "战争夺走了两百万青年男子。纺织厂、电子厂与百货公司里的劳动力因此有一半是女性——这在战前是不可想象的。"
 krcw_jap_micronesia_phosphate:0 "南洋的磷矿与渔场"
 krcw_jap_micronesia_phosphate_desc:0 "南洋群岛是帝国唯一没有丢掉的殖民地。磷矿、椰干与金枪鱼渔场养着一支渔船队和一个总督府。"
 krcw_jap_formosa_integration:0 "推行台湾同化"
 krcw_jap_formosa_integration_desc:0 "国语教育、日本姓名、神社参拜。总督府相信再过一代人，台湾人就会忘记海峡对岸还有一个祖国。"
 krcw_jap_formosa_assembly:0 "开设台湾议会"
 krcw_jap_formosa_assembly_desc:0 "台湾议会开幕，议员们争论糖价、学校和警察，很少谈及回归中国。"
 krcw_jap_formosa_garrison:0 "海峡守备"
 krcw_jap_formosa_garrison_desc:0 "台湾军团改编为\"第一方面队\"。它的任务只有一条：在南京的船靠岸之前撑住四十八小时。"
 krcw_jap_police_reserve:0 "警察预备队"
 krcw_jap_police_reserve_desc:0 "《青岛停战协定》限制了陆军的规模，却没有限制警察。于是七万五千名\"警察\"领到了步枪、卡车和野战炮。"
 krcw_jap_interservice_truce:0 "调解陆海军矛盾"
 krcw_jap_interservice_truce_desc:0 "陆军与海军在战时为了石油和飞机厂互相下毒手，现在两边都没剩下多少可以争的东西了。参谋本部与军令部第一次合署办公。"
 krcw_jap_kido_butai:0 "重建机动部队"
 krcw_jap_kido_butai_desc:0 "四艘航母在停战时被拆成了废钢。剩下的两艘停在吴港，等着一个愿意为它们付钱的政府。"
 krcw_jap_unify_air_forces:0 "统一航空部队"
 krcw_jap_unify_air_forces_desc:0 "陆军航空队与海军航空队合并为一支独立的航空自卫队。这是条约文本里找不到的词，所以它是合法的。"
 krcw_jap_jet_prototypes:0 "研制橘花后继机"
 krcw_jap_jet_prototypes_desc:0 "中岛的工程师们藏了一套喷气发动机的图纸。十年之后，他们把它变成了第一架国产喷气战斗机。"
 krcw_jap_f_go:0 "重启富号研究"
 krcw_jap_f_go_desc:0 "理化学研究所的仁科芳雄在一九四五年烧掉了他的笔记。烧掉的是纸，不是知识。日本没有铀矿，但它有南洋的磷矿船和一批还活着的物理学家。"
 krcw_jap_kishi_machine:0 "建立经济官僚体系"
 krcw_jap_kishi_machine_desc:0 "岸信介不需要一个党，他需要一批局长。经过通产省、大藏省与内务省的人事调整，国民精神同盟变成了一台可以自己运转的机器。"
 krcw_jap_form_the_ldp:0 "保守合同"
 krcw_jap_form_the_ldp_desc:0 "自由派、民政党残余与议会里的实业家合并成一个党。它不反对岸信介的政策，只反对岸信介一个人决定政策。"
 krcw_jap_education_reform:0 "改组教育制度"
 krcw_jap_education_reform_desc:0 "教科书委员会重写近代史的最后几章，如何讲述满洲成为争论焦点。"
 krcw_jap_yakuza_and_streets:0 "整顿城市治安"
 krcw_jap_yakuza_and_streets_desc:0 "复员军人、黑市商人与右翼团体填满了被烧毁的街区。政府可以镇压他们，也可以雇用他们。"
 krcw_jap_revanchist_turn:0 "讨论重返大陆"
 krcw_jap_revanchist_turn_desc:0 "石原的将军们在议会里公开说出了那句话：满洲是日本的，朝鲜是日本的，条约是胜利者写的一张纸。岸信介没有反驳他们——他只是没有说话。"
 krcw_jap_pacific_workshop:0 "向两个阵营出口"
 krcw_jap_pacific_workshop_desc:0 "不结盟并不意味着孤立。日本向所有人卖船、卖机器、卖纺织品——包括向国际的马尼拉和协定的符拉迪沃斯托克同时卖。"
 krcw_jap_yen_bloc:0 "重建日元区"
 krcw_jap_yen_bloc_desc:0 "没有殖民地的日圆区：东京放贷，马尼拉、曼谷与雅加达买日本的机器，用原料还账。"
 krcw_jap_micronesia_mandate:0 "改组南洋厅"
 krcw_jap_micronesia_mandate_desc:0 "帛琉的总督府管辖着两千个岛和十万人。它的预算来自磷矿，它的防务来自一支巡逻艇队——以及一份没人愿意公开讨论的俄日谅解。"
 krcw_japfp_10_t:0 "国会前的二十万人"
 krcw_japfp_10_d:0 "条约修订案提交国会的那一天，警察在国会周围架起了铁丝网。学生、工会与复员军人协会都来了，可他们要求的东西并不一样：有人要民主，有人要满洲，有人只是要工作。岸信介在官邸里听着外面的声音，对秘书说：\"他们至少还在喊日语。\""
 krcw_japfp_10.a:0 "让议会表决"
 krcw_japfp_10.b:0 "动用警察预备队"
 krcw_japfp_10.c:0 "首相辞职"
 krcw_japfp_11_t:0 "世界第一造船国"
 krcw_japfp_11_d:0 "一九五三年，日本的下水吨位超过了不列颠联邦。吴港、长崎与横滨的船台上排着挪威的油轮、巴拿马籍的货轮和一艘不挂任何旗子、由俄国人付款的补给舰。造船协会的会长在庆祝宴会上说了一句实话：\"我们赢了一场战争之后输掉的东西，正在用另一种方式赚回来。\""
 krcw_japfp_11.a:0 "把利润投进船台"
 krcw_japfp_11.b:0 "把利润投进重工业"
 krcw_japfp_12_t:0 "台北的议事堂"
 krcw_japfp_12_d:0 "台湾议会的第一次会议开了十一个小时。议长用日语宣布开会，第一位发言的议员用台湾话讲了四十分钟，没有人打断他。总督坐在旁听席上，从头到尾没有说话。散会后他给东京发了一封电报，只有一句：\"此地已非殖民地。\""
 krcw_japfp_12.a:0 "承认这个事实"
 krcw_japfp_12.b:0 "更换总督"
 krcw_jap_formosa_cat:0 "台湾统治"
 krcw_jap_formosa_cat_desc:0 "总督府每年都要在同化与自治之间做一次选择。"
 krcw_jap_sugar_quota:0 "提高糖业配额"
 krcw_jap_sugar_quota_desc:0 "台湾的糖厂是帝国的钱袋子。提高配额意味着更多的外汇，也意味着更多被征用的甘蔗田。"
 krcw_jap_formosa_amnesty:0 "特赦自治运动"
 krcw_jap_formosa_amnesty_desc:0 "放出关在火烧岛上的自治运动组织者。南京会失去几篇社论的素材，台北会多出几个议员。"
 krcw_jap_strait_patrol:0 "海峡巡逻"
 krcw_jap_strait_patrol_desc:0 "把驱逐舰队派到澎湖以西。这会让南京的渔船不敢越界，也会让两国的海军距离缩短到二十海里。"
 krcw_jap_mandate_subsidy:0 "南洋厅补助金"
 krcw_jap_mandate_subsidy_desc:0 "磷矿的收入养不起两千个岛。东京每年要为南洋庁补贴一笔钱，换来的是一支合法驻在赤道以北的舰队。"
 krcw_wca_the_builders:0 "建设派"
 krcw_wca_the_builders_desc:0 "鲁瑟的一派：先把密西西比河东岸建成一个任何美国人隔着河都看得见的样板。底特律的汽车工人现在的实际工资比一九二九年高，而河对岸的佃农还在用骡子。\n\"同志们，\"鲁瑟在第九次代表大会上说，\"我们不必去解放他们。我们只要让他们看见。\""
 krcw_wca_the_liberators:0 "解放派"
 krcw_wca_the_liberators_desc:0 "福斯特与坎农的一派：河对岸有四千万美国人在朗的机器下面，而每一年我们不过河，他们的孩子就多受一年那种教育。\n这一派的力量在退伍军人协会与南方的纺织工会里，而他们的论据是一份名单：一九三八到四三年在河西岸被处死的工会组织者，九百七十四人。"
 krcw_wca_one_big_union:0 "一个大工会"
 krcw_wca_one_big_union_desc:0 "第三派，也是最老的一派：世界产业工人联合会的传统。国家、政党、甚至各产业联合会之间的界线都是人为的——工人阶级只应该有一个组织。\n这一派在西部矿工与码头工人里有根，而他们对另外两派的评价一样刻薄：\"一个想当模范雇主，一个想当将军。\""
 krcw_wca_the_long_frontier:0 "漫长的边界"
 krcw_wca_the_long_frontier_desc:0 "密西西比河从伊塔斯卡湖到新奥尔良两千公里，而它不是一道可以封闭的边界——每年有十几万人渡河，两个方向都有：西岸的黑人与佃农往东逃，东岸对工人管理不满的技工往西走。两边的边防都假装看不见后者。"
 krcw_wca_the_second_workshop:0 "第二个车间"
 krcw_wca_the_second_workshop_desc:0 "国际的工业中心在莱茵河与鲁尔，而它的第二个车间在五大湖。底特律的机床、匹兹堡的钢、芝加哥的铁路设备，以及一件欧洲人没有的东西：把这些东西做到能卖给全世界的那套流水线方法。"
 krcw_wca_the_three_currents:0 "召集三派辩论"
 krcw_wca_the_three_currents_desc:0 "联合工团内部有三派：鲁瑟的建设派主张先建设东岸，福斯特与坎农的解放派主张尽快渡河，世界产业工人联合会的传统派主张全北美只要一个大工会。"
 krcw_wca_the_builders_road:0 "采纳建设派路线"
 krcw_wca_the_builders_road_desc:0 "先把东岸的工业建强再渡河：汽车、住房、工厂医务室和大学，样板城市的照片送到河对岸，过河贸易全部切断。解放派认为这会让战争拖得太久。"
 krcw_wca_the_liberators_road:0 "采纳解放派路线"
 krcw_wca_the_liberators_road_desc:0 "尽快准备渡过密西西比河。解放派手中有一份一九三八至一九四三年在西岸被处死的工会组织者名单。"
 krcw_wca_one_big_union_road:0 "合并为一个大工会"
 krcw_wca_one_big_union_road_desc:0 "取消各产业联合会之间的界线，全北美工人组成一个组织。这一派不承认密西西比河和美加边界是国界。"
 krcw_wca_the_congress_decides:0 "保留落选派别的席位"
 krcw_wca_the_congress_decides_desc:0 "路线之争以表决结束。落选的两派不被清洗，继续保留在执行委员会中的席位。"
 krcw_wca_the_losing_currents:0 "让反对派参与执行委员会"
 krcw_wca_the_losing_currents_desc:0 "反对派继续参与执行委员会，每项政策都要重新争论。代价是决策更慢，好处是始终有备选方案。"
 krcw_wca_industrial_democracy_proven:0 "公布工业民主成绩"
 krcw_wca_industrial_democracy_proven_desc:0 "公布一九五三年的产量报告：钢产量超过一九二九年，汽车产量翻倍，工时缩短。底特律的车间制度引起欧洲同志的关注。"
 krcw_wca_two_thousand_kilometres:0 "加强密西西比河边防"
 krcw_wca_two_thousand_kilometres_desc:0 "密西西比河长两千公里，无法封闭。每年有十几万人两个方向渡河：西岸的黑人家庭和佃农向东，对工人管理不满的技工向西。"
 krcw_wca_the_crossings_east:0 "接收东渡家庭"
 krcw_wca_the_crossings_east_desc:0 "接收从西岸逃来的家庭，其中多数是黑人，为他们安排住房、学校和有工会卡的工作。"
 krcw_wca_the_crossings_west:0 "调查西渡技工"
 krcw_wca_the_crossings_west_desc:0 "调查西渡的熟练技工和工头。他们离开的原因大多是不愿接受车间投票管理。"
 krcw_wca_the_river_agreement:0 "河上的协定"
 krcw_wca_the_river_agreement_desc:0 "一九五三年，两个美国签了一份谁都不愿意公开的协定：渡河的人不被遣返，边防不在河上开枪，商船按战前的规矩通行。协定没有名称，没有仪式，签字的是两边的河务工程师而不是外交官。\n\n它维持了二十年，而维持它的原因很实际：两边都清楚这条河上一次交火会立刻变成两个阵营的战争，而两个阵营都不在这里。"
 krcw_wca_the_line_and_the_council:0 "在流水线上推行工人管理"
 krcw_wca_the_line_and_the_council_desc:0 "流水线的节奏由车间委员会每季度投票决定一次，季度内不再更改。工人控制速度，厂方得到稳定的产量。"
 krcw_wca_teach_it_to_the_bloc:0 "推广底特律车间制度"
 krcw_wca_teach_it_to_the_bloc_desc:0 "接待法国、意大利和西德派来的工会干部与工程师，推广底特律的车间制度。"
 krcw_wca_the_automobile_question:0 "决定汽车普及计划"
 krcw_wca_the_automobile_question_desc:0 "决定是否让汽车普及。建设派支持，反对者担心工人搬到郊区后工会支部会散掉。"
 krcw_wca_the_american_question:0 "制定西岸接管预案"
 krcw_wca_the_american_question_desc:0 "西岸一九五三年发生军事叛乱后，东岸发现自己没有接管西岸的任何准备。制定接管预案。"
 krcw_wcad_1_t:0 "一个想当模范雇主，一个想当将军"
 krcw_wcad_1_d:0 "一九五一年大会的第二天，第三派的发言人上台。他是西部矿工联合会的人，在西弗吉尼亚组织过一九三一年的罢工，坐过四年监。\n\n\"鲁瑟同志想把底特律建成一座样板城市。坎农同志想渡河去解放四千万人。我听了两天，我发现你们两位有一个共同点——你们都想要一个更大的组织来替工人做决定。\n\n一个想当模范雇主。一个想当将军。我们要的是一个大工会。\""
 krcw_wcad_1.a:0 "建设派：先让他们看见"
 krcw_wcad_1.b:0 "解放派：不能再等十年"
 krcw_wcad_1.c:0 "一个大工会"
 krcw_wcad_3_t:0 "输掉的人不会消失"
 krcw_wcad_3_d:0 "表决结束的当天晚上，鲁瑟在闭幕讲话里说了一段没有写进稿子的话。\n\n\"今天有两派输了。他们的代表明天还会坐在执行委员会里，他们的报纸明天还会印，他们的组织者明天还会在工厂里。有些同志觉得这是软弱，觉得一个革命政权不该留着反对派。\n\n在河对岸，输掉路线之争的人会消失。这就是区别。如果我们哪天把这个区别丢了，我们就赢不了任何东西，因为我们会变成他们。\""
 krcw_wcad_3.a:0 "这是我们最好的宣传"
 krcw_wcad_3.b:0 "战时需要统一，这条以后再说"
 krcw_wcad_5_t:0 "我们守的是一份账"
 krcw_wcad_5_d:0 "边防的季度报告里有一段被上级划掉又被抄本流出去的话。写这段话的是一名驻在开罗渡口的中尉。\n\n\"本月渡河往东者三千一百人，其中黑人家庭两千四百。渡河往西者四百一十人，其中熟练技工与工头三百二十。两个数字我都如实上报，而我注意到只有第一个数字会出现在报纸上。\n\n我们守的不是一条防线，是一份账。\""
 krcw_wcad_5.a:0 "两个数字都公布"
 krcw_wcad_5.b:0 "只公布往东的"
 krcw_wcad_5.c:0 "去查往西走的人为什么走"
 krcw_wcad_7_t:0 "不是所有工人都想要"
 krcw_wcad_7_d:0 "调查往西走的技工为什么走，结果让执行委员会开了一次很短的会——短是因为没有人愿意多谈。\n\n三百二十份离职面谈记录里，理由高度一致：\"每件事都要开会\"、\"我干了二十年的活，现在一个二十五岁的选出来的人告诉我怎么干\"、\"我想要加班费，他们给我一张投票表决过的排班表\"。\n\n没有一个人提到政治。他们不是朗的支持者，他们只是不想在自己的工段里被投票管着。"
 krcw_wcad_7.a:0 "给技工一个例外：技术事务不投票"
 krcw_wcad_7.b:0 "这是革命的成本，照旧"
 krcw_wcad_7.c:0 "把加班费与排班分开处理"
 krcw_wcad_8_t:0 "技工还在往西走"
 krcw_wcad_8_d:0 "边防的季度报告又送来了往西渡河的人数。执行委员会上次没有追问他们为什么走，这次报告里多了一张附表：底特律两家机床厂的工段长走了一半，匹兹堡的轧钢厂开始从学徒里提拔工头。\n\n工厂委员会要求执行委员会拿个主意。"
 krcw_wcad_8.a:0 "现在开始调查，找走掉的人的同事谈"
 krcw_wcad_8.b:0 "在渡口核查技工的工作证"
 krcw_wcad_8.c:0 "让他们走，从学徒里补"
 krcw_wcad_9_t:0 "每一辆车都在拆散支部"
 krcw_wcad_9_d:0 "汽车计划的辩论里，反对的一方提出了一个没人预料到的论据。提出它的是一名底特律的老组织者，他一九三七年参加过静坐罢工。\n\n\"同志们，我不反对工人有车。我反对的是我们没算过账。一个工人搬到郊区以后，他离他的支部十五公里。他不再走过那家酒馆，不再在街角听人讲话，不再在星期四晚上去开会——他星期四晚上在修草坪。\n\n我们造的每一辆车都在拆散我们自己的支部。这个账要在造之前算，不是之后。\""
 krcw_wcad_9.a:0 "造车，同时把支部搬到郊区去"
 krcw_wcad_9.b:0 "先修有轨电车与地铁"
 krcw_wcad_9.c:0 "造车，不管支部"
 krcw_wcad_11_t:0 "四千万人"
 krcw_wcad_11_d:0 "一九五三年河西岸那次军事叛乱只持续了九天，而它在东岸留下的东西比九天长得多：一份仓促拼出来的应急方案，和方案第一页上那句让执行委员会沉默的话。\n\n\"我们主张代表全体美国人。我们从未计算过接管四千万人需要多少粮食、多少住房、多少教师、多少年。我们也从未想过，那四千万人里有多大比例并不希望被我们接管。\n\n如果那一天到来，我们会发现自己没有准备。\""
 krcw_wcad_11.a:0 "认真做这份计划"
 krcw_wcad_11.b:0 "准备接管，也准备他们不欢迎我们"
 krcw_wcad_11.c:0 "不做这份计划：它本身就是挑衅"
 krcw_wca_the_colour_line:0 "肤色界线"
 krcw_wca_the_colour_line_desc:0 "工团共和国继承了一件它不愿意谈的东西:老行业工会的排斥惯例。底特律的装配线上黑人占四分之一,而机械师工会的会员名册里黑人占百分之三。往东渡河的黑人家庭进得了工厂,进不了那几个最赚钱的工种。\n这件事在宣传里不存在,在工会大厅的走廊里人人都知道。"
 krcw_wca_one_card_one_trade:0 "一张卡,一个工种"
 krcw_wca_one_card_one_trade_desc:0 "一九五二年的产业工会代表大会以四十一票之差通过了会员资格统一条款:工种不分肤色,学徒名额按申请顺序,违反的地方工会失去代表席位。\n反对票来自几个最老的手艺工会,而他们反对的理由从来没有写在决议记录里。通过这一条花了十一年,而它生效之后,解放派在南方纺织区的票数翻了一倍。"
 krcw_wca_the_question_in_the_hall:0 "核查工会的肤色排斥"
 krcw_wca_the_question_in_the_hall_desc:0 "一名底特律代表在大会上出示同一家工厂的两份名册：装配线上黑人占四分之一，机械师工会里只占百分之三。核查各工会的肤色排斥。"
 krcw_wca_the_uniform_clause:0 "统一条款"
 krcw_wca_the_uniform_clause_desc:0 "通过会员资格统一条款：工种不分肤色，学徒名额按申请顺序分配，违反的地方工会失去代表席位。"
 krcw_wca_the_southern_locals:0 "组织南方纺织工会"
 krcw_wca_the_southern_locals_desc:0 "在南方纺织区执行统一条款，组织黑人纺织工人入会。南方工会成为解放派最稳固的票源。"
 krcw_wca_what_the_radio_can_say:0 "播报南方工会数字"
 krcw_wca_what_the_radio_can_say_desc:0 "自由美国电台开始逐周播报南方工会的黑人会员数字，以及两岸同一行业的工资差距。"
 krcw_wcad_13_t:0 "两份名册是同一家工厂的"
 krcw_wcad_13_d:0 "那名代表把两份名册放在主席台上,然后回到座位上坐下,没有再说话。会场里没有人鼓掌,也没有人反驳。\n\n主持会议的是鲁瑟。记录显示他停了将近一分钟才开口,而他开口说的第一句话不是回应,是一个问题:\"这两份名册,别的厂有没有?\"\n\n三天之后,统计处交上来的答复是:三十七家大厂,全部一样。"
 krcw_wcad_13.a:0 "把统一条款列入下次大会议程"
 krcw_wcad_13.b:0 "由各地方工会自己解决"
 krcw_wcad_13.c:0 "先公布这三十七份名册"
 WCA_krcw_cannon_desc:0 "解放派领袖，老世界产业工人联合会组织者。他主张尽早渡过密西西比河，理由是河西岸的工会组织者正在被处决。"
 WCA_krcw_flynn_desc:0 "世界产业工人联合会的老组织者，西部矿工和码头工人信任她。她主张取消各产业联合会之间的界线，全北美只要一个大工会。"
 krcw_wca_party_builders:0 "联合工团（建设派）"
 krcw_wca_party_builders_long:0 "美利坚联合工团（建设派）"
 krcw_wca_party_liberators:0 "联合工团（解放派）"
 krcw_wca_party_liberators_long:0 "美利坚联合工团（解放派）"
 krcw_wca_party_obu:0 "一个大工会"
 krcw_wca_party_obu_long:0 "北美世界产业工人联合会"
 krcw_wca_the_model_city_programme:0 "启动样板城市计划"
 krcw_wca_the_model_city_programme_desc:0 "在底特律、匹兹堡和芝加哥集中建设住宅、医院和大学，作为对西岸的宣传。"
 krcw_wca_the_river_brigades:0 "组建渡河旅"
 krcw_wca_the_river_brigades_desc:0 "由西岸逃来的工会成员和老兵组成渡河旅，专门训练渡河作战和敌后组织。"
 krcw_wca_merge_the_federations:0 "合并各产业联合会"
 krcw_wca_merge_the_federations_desc:0 "汽车、钢铁、矿业和运输联合会合并为一个组织，按地区而不按行业设支部。"
 krcw_usa_valley_authority:0 "密苏里河流域管理局"
 krcw_usa_valley_authority_desc:0 "一个管理局统管密苏里河上的大坝、航道和电网。陆军工程兵团和垦务局都不满意，但工程终于有人统一指挥了。"
 krcw_usa_valley_authority_2:0 "密苏里河流域管理局：电气化"
 krcw_usa_valley_authority_2_desc:0 "管理局的输电线已经通到平原上的农庄。农民把电费和电灯都记在王鱼的账上。"
 krcw_usa_atomic_commission:0 "原子能委员会"
 krcw_usa_atomic_commission_desc:0 "委员会掌管铀矿、实验室和武器设计，预算不经国会审议。将军们和科学家们每周都在委员会里争吵。"
 krcw_usa_strategic_deterrent:0 "战略空军司令部"
 krcw_usa_strategic_deterrent_desc:0 "西岸有了自己的原子弹和能把它送到东岸的轰炸机。这让新奥尔良在谈判桌上说话更硬，也让河对岸更紧张。"
 krcw_usa_oil_pension:0 "石油养老基金"
 krcw_usa_oil_pension_desc:0 "养老金改由石油出口收入的固定份额支付。油价好的年份没有问题，油价跌的年份财政部就要借钱。"
 krcw_usa_aec:0 "原子能委员会"
 krcw_usa_uranium:0 "科罗拉多高原铀矿"
 krcw_usa_sandia:0 "桑迪亚实验室"
 krcw_usa_randolph:0 "伦道夫机场飞行学校"
 krcw_usa_bombers:0 "沃思堡轰炸机"
 krcw_usa_radar:0 "密西西比河雷达网"
 krcw_usa_sac:0 "战略空军司令部"
 krcw_usa_atomic_energy_commission:0 "成立原子能委员会"
 krcw_usa_atomic_energy_commission_desc:0 "原子计划从陆军部划出，交给一个直属总统的委员会。洛斯阿拉莫斯的科学家想要文官领导，陆军部想保留否决权，最后两边各得了一半。"
 krcw_usa_colorado_uranium:0 "开采科罗拉多高原铀矿"
 krcw_usa_colorado_uranium_desc:0 "委员会以保证价收购尤拉万和莫阿布一带的铀矿石，并修通矿区公路。探矿者涌进科罗拉多和犹他的峡谷，牧场主抱怨水源被污染。"
 krcw_usa_sandia_and_pantex:0 "扩建桑迪亚基地与潘特克斯工厂"
 krcw_usa_sandia_and_pantex_desc:0 "武器设计留在洛斯阿拉莫斯，工程化交给阿尔伯克基的桑迪亚基地，总装放在阿马里洛附近的潘特克斯军工厂。三处都由陆军看守，工资比同行高一截。"
 krcw_usa_white_sands_test:0 "在白沙试验场进行核试验"
 krcw_usa_white_sands_test_desc:0 "西岸选择自己研制，第一次试验就在新墨西哥的白沙试验场进行。成功之后，新奥尔良不必再向莫斯科报告试验数据。"
 krcw_usa_kazakh_joint_test:0 "派员参加哈萨克联合试验"
 krcw_usa_kazakh_joint_test_desc:0 "按照与莫斯科的协议，第一颗装置运到哈萨克草原，由两国科学家一起试验。俄罗斯人拿到了全部数据，西岸拿到了炸弹和更多贷款。"
 krcw_usa_strategic_air_command:0 "组建战略空军司令部"
 krcw_usa_strategic_air_command_desc:0 "原子弹和远程轰炸机编入同一个司令部，由陆军航空队的轰炸机派军官指挥。原子能委员会移交了武器的保管权，只保留研究。"
 krcw_usa_missouri_valley_authority:0 "成立密苏里河流域管理局"
 krcw_usa_missouri_valley_authority_desc:0 "蒙大拿参议员默里的方案被重新拿出来：密苏里河全流域的防洪、航运和发电交给一个管理局。陆军工程兵团和垦务局为此各让出一部分权力。"
 krcw_usa_garrison_and_oahe_dams:0 "修建加里森大坝和奥阿希大坝"
 krcw_usa_garrison_and_oahe_dams_desc:0 "北达科他的加里森大坝和南达科他的奥阿希大坝同时开工，蓄水后下游不再年年发大水。库区的曼丹和苏族保留地要整体迁走，部落议会提出了抗议。"
 krcw_usa_arkansas_river_navigation:0 "疏浚阿肯色河航道"
 krcw_usa_arkansas_river_navigation_desc:0 "管理局在阿肯色河上修建船闸，驳船可以从密西西比河一直开到塔尔萨。俄克拉何马的石油和小麦从此能走水路出海。"
 krcw_usa_rural_electrification:0 "推行农村电气化"
 krcw_usa_rural_electrification_desc:0 "大坝发的电由农村电力合作社接到各家农庄，管理局按成本价供电。私营电力公司失去了平原上的市场，在国会里拼命游说。"
 krcw_usa_tinker_air_depot:0 "扩建廷克航空补给站"
 krcw_usa_tinker_air_depot_desc:0 "俄克拉何马城东南的廷克补给站接管全部飞机的大修和零件储备。以前发动机要送到威奇托的工厂返修，现在在前线后方就能修好。"
 krcw_usa_randolph_field_school:0 "开办伦道夫机场飞行学校"
 krcw_usa_randolph_field_school_desc:0 "圣安东尼奥的伦道夫机场改为全国飞行训练中心，俄罗斯教官讲授喷气机战术。学员主要来自得克萨斯和俄克拉何马的农家子弟。"
 krcw_usa_fort_worth_bombers:0 "在沃思堡生产远程轰炸机"
 krcw_usa_fort_worth_bombers_desc:0 "沃思堡的康维尔工厂转产六发远程轰炸机，航程足以从得克萨斯飞到五大湖。每架的造价相当于一个步兵营一年的开支，陆军的将军们很不高兴。"
 krcw_usa_mississippi_radar_line:0 "沿密西西比河建立雷达网"
 krcw_usa_mississippi_radar_line_desc:0 "从明尼阿波利斯到新奥尔良，西岸的高地上建起一串雷达站，东岸的飞机一起飞就能被发现。工团的广播说这是在准备战争，新奥尔良说这是为了不被偷袭。"
 krcw_usa_charity_hospitals:0 "扩建慈善医院系统"
 krcw_usa_charity_hospitals_desc:0 "新奥尔良慈善医院的模式推广到各州：每个地区一所免费公立医院，由州立大学医学院派医生。州医学会反对，因为私人诊所的病人少了。"
 krcw_usa_veterans_housing:0 "为退伍军人修建公共住房"
 krcw_usa_veterans_housing_desc:0 "人民银行向各市贷款，在休斯敦、达拉斯和堪萨斯城修建成片的退伍军人住宅区。承包商大多是机器的老朋友，价格也按老规矩报。"
 krcw_usa_cut_the_pension_rate:0 "下调养老金标准"
 krcw_usa_cut_the_pension_rate_desc:0 "财政部长提议把每月三十美元降到二十美元，把钱留给工厂和军队。老人们写信抗议，统一党的县党部第一次在教堂里挨骂。"
 krcw_usa_oil_pension_fund:0 "以石油收入设立养老基金"
 krcw_usa_oil_pension_fund_desc:0 "石油出口收入的固定份额划入养老基金，养老金不再挤占建设预算。得克萨斯的石油公司要多交一笔特别税，莫斯科的石油合同也不能再打折。"
 krcw_wca_reconstruction_board:0 "东部重建委员会"
 krcw_wca_reconstruction_board_desc:0 "重建经费由委员会统一分配，各联合会不再各修各的。钢铁和矿工联合会拿到了大头。"
 krcw_wca_reconstruction_board_2:0 "东部重建委员会：五大湖工程"
 krcw_wca_reconstruction_board_2_desc:0 "铁路和高炉修好以后，委员会把经费转向五大湖的港口、航道和钢厂。"
 krcw_wca_rebuilt_east:0 "重建后的东部"
 krcw_wca_rebuilt_east_desc:0 "重建工程移交给各地区联合会管理。东部的铁路、电网和钢厂重新连成一体。"
 krcw_wca_army_reorganisation:0 "人民军改编"
 krcw_wca_army_reorganisation_desc:0 "各联合会的民兵正在编入人民军。新编制还没有定下来，部队一边整编一边训练。"
 krcw_wca_peoples_army_councils:0 "士兵委员会的人民军"
 krcw_wca_peoples_army_councils_desc:0 "连排长由士兵选举，营以上军官由总参谋部提名、士兵大会确认。部队士气高，纪律靠说服维持。"
 krcw_wca_peoples_army_staff:0 "总参谋部的人民军"
 krcw_wca_peoples_army_staff_desc:0 "军官全部由总参谋部任命，士兵委员会只保留申诉权。部队训练整齐，工团左翼对此一直不满。"
 krcw_wca_steel_works:0 "钢铁联合会"
 krcw_wca_nitrates:0 "马斯尔肖尔斯硝酸厂"
 krcw_wca_oak_ridge:0 "橡树岭实验室"
 krcw_wca_west_point:0 "人民军军官学校"
 krcw_wca_springfield:0 "斯普林菲尔德兵工厂"
 krcw_wca_eastern_reconstruction_board:0 "成立东部重建委员会"
 krcw_wca_eastern_reconstruction_board_desc:0 "代表大会设立东部重建委员会，统一安排阿巴拉契亚和五大湖区的修复工程，各联合会的重建经费交给委员会分配。钢铁和矿工联合会支持，服装和码头联合会担心钱都流进山区。"
 krcw_wca_repair_the_pennsylvania_main_line:0 "修复宾夕法尼亚铁路干线"
 krcw_wca_repair_the_pennsylvania_main_line_desc:0 "费城经哈里斯堡到匹兹堡的干线在内战中被反复炸断。铁路工人联合会重铺路基、重建桥梁，施工期间东西两段的货运只能绕道巴尔的摩。"
 krcw_wca_relight_the_pittsburgh_furnaces:0 "重开匹兹堡与扬斯敦的高炉"
 krcw_wca_relight_the_pittsburgh_furnaces_desc:0 "莫农加希拉河谷和马霍宁河谷的高炉大多在战时熄了火。钢铁工人联合会坚持先修高炉、后修住房，工人为此在工棚里多住了一个冬天。"
 krcw_wca_rebuild_the_coal_branch_lines:0 "修复运煤支线"
 krcw_wca_rebuild_the_coal_branch_lines_desc:0 "矿井抽干了水，煤却运不出山。矿工联合会的约翰·刘易斯要求重建委员会先修西弗吉尼亚和弗吉尼亚西南部的运煤支线，再谈其他工程。"
 krcw_wca_expand_the_gary_works:0 "扩建加里钢铁厂"
 krcw_wca_expand_the_gary_works_desc:0 "加里的钢厂原本靠明尼苏达的梅萨比铁矿，那片矿区现在在朗的一边。钢铁联合会改从安大略和魁北克进口矿石，并为此扩建了港口和料场。"
 krcw_wca_dig_the_st_lawrence_seaway:0 "开凿圣劳伦斯航道"
 krcw_wca_dig_the_st_lawrence_seaway_desc:0 "工团与加拿大合修圣劳伦斯航道，让矿石船从魁北克直接开进五大湖。工程占用了重建委员会两年的预算，纽约港的码头工人担心生意会被抢走。"
 krcw_wca_hand_the_works_to_the_regions:0 "把重建工程移交地区联合会"
 krcw_wca_hand_the_works_to_the_regions_desc:0 "按产业民主宪章，重建委员会完成任务后解散，修好的铁路、电厂和钢厂交给各地区联合会经营。鲁瑟认为这证明了工团不需要一个常设的中央机关。"
 krcw_wca_build_fontana_dam:0 "修建丰塔纳大坝"
 krcw_wca_build_fontana_dam_desc:0 "田纳西河谷工团在小田纳西河上续建丰塔纳大坝，为北卡罗来纳西部和诺克斯维尔一带的工厂供电。水库要淹掉几条山谷里的农场，搬迁的农户由农民合作社安置。"
 krcw_wca_build_kentucky_dam:0 "修建肯塔基大坝与船闸"
 krcw_wca_build_kentucky_dam_desc:0 "肯塔基大坝让田纳西河下游全年通航，驳船可以从诺克斯维尔一直开到俄亥俄河。坝址离密西西比河前线不远，卡尔森要求在坝上加修高射炮阵地。"
 krcw_wca_nitrates_for_fertiliser:0 "马斯尔肖尔斯硝酸厂生产化肥"
 krcw_wca_nitrates_for_fertiliser_desc:0 "华莱士和南方农民合作社要求马斯尔肖尔斯的硝酸厂全部生产化肥，让贫瘠的棉田改种粮食和饲料。人民军的炸药储备只能靠从欧洲进口补足。"
 krcw_wca_nitrates_for_explosives:0 "马斯尔肖尔斯硝酸厂生产炸药"
 krcw_wca_nitrates_for_explosives_desc:0 "卡尔森要求硝酸厂优先生产炸药，保证河防部队的弹药储备。南方合作社的化肥配额被大幅削减，农会代表在代表大会上投了反对票。"
 krcw_wca_rural_electric_cooperatives:0 "成立南方农村电气化合作社"
 krcw_wca_rural_electric_cooperatives_desc:0 "河谷的电网向佐治亚北部、卡罗来纳高地和肯塔基东部的山村延伸。每个县的农户组成电气化合作社，自己架线、自己收电费，河谷工团只负责批发电力。"
 krcw_wca_expand_oak_ridge:0 "扩建橡树岭实验室"
 krcw_wca_expand_oak_ridge_desc:0 "橡树岭的同位素工厂靠田纳西河谷的电力运转。物理学家想把它办成原子能研究所，人民军要它继续提炼铀，两边都要求优先供电，河谷的铝厂因此减产。"
 krcw_wca_the_general_staff:0 "成立人民军总参谋部"
 krcw_wca_the_general_staff_desc:0 "卡尔森请林肯营出身的罗伯特·梅里曼组建总参谋部，统一制定作战计划和训练大纲。各联合会从此不能单独调动自己编成的部队，汽车和钢铁联合会的执行委员会提出抗议。"
 krcw_wca_four_military_districts:0 "划分四个军区"
 krcw_wca_four_military_districts_desc:0 "东部划为五大湖、大西洋、阿巴拉契亚和南方四个军区。军区司令由总参谋部任命，政治委员由地区联合会推举；阿巴拉契亚军区负责整条河防，分到的部队最多。"
 krcw_wca_reorganise_west_point:0 "改组西点军校"
 krcw_wca_reorganise_west_point_desc:0 "西点军校改名为人民军军官学校，旧军官和内战中提拔起来的连长同堂上课。课程由卡尔森亲自审定，游击战和夜间渡河各占一个学期。"
 krcw_wca_one_rifle_pattern:0 "统一步兵武器制式"
 krcw_wca_one_rifle_pattern_desc:0 "内战时各联合会民兵用的枪五花八门。总参谋部规定全军统一使用斯普林菲尔德兵工厂的步枪和弹药，兵工厂为此扩建了生产线。"
 krcw_wca_factory_reserve:0 "建立工厂预备役"
 krcw_wca_factory_reserve_desc:0 "每座大厂保留一个由本厂工人组成的预备役连，每年集训一个月。工厂委员会抱怨停工，人民军多了一支随时可以动员的后备力量。"
 krcw_wca_keep_elected_officers:0 "保留士兵选举军官"
 krcw_wca_keep_elected_officers_desc:0 "士兵委员会继续选举连排长，营以上军官由总参谋部提名、士兵大会确认。这是内战时联合会民兵的传统，弗林和工团左翼坚持保留。"
 krcw_wca_officers_appointed_by_staff:0 "由总参谋部任命军官"
 krcw_wca_officers_appointed_by_staff_desc:0 "所有军官改由总参谋部任命，士兵委员会只保留申诉权。卡尔森认为打现代战争离不开这一步，弗林和坎农说这是在重建旧军队。"
 krcw_wca_complete_the_reorganisation:0 "完成人民军改编"
 krcw_wca_complete_the_reorganisation_desc:0 "最后一批联合会民兵编入人民军，总参谋部公布了新的师编制表。整编期间停下来的大规模演习恢复了。"
 krcw_jap_belt_plan_1:0 "太平洋工业带计划"
 krcw_jap_belt_plan_1_desc:0 "通产省把沿海工业带的投资排进了五年计划：先是钢铁和电力，然后是石化和汽车。填海用地由县政府负责，贷款由日本开发银行负责。"
 krcw_jap_belt_plan_2:0 "太平洋工业带计划：电力到位"
 krcw_jap_belt_plan_2_desc:0 "九家地区电力公司按计划给工业带供电，工厂不再因为限电停产。电价由通产省审批，家庭用电排在工厂后面。"
 krcw_jap_belt_plan_3:0 "太平洋工业带计划：出口导向"
 krcw_jap_belt_plan_3_desc:0 "工业带的钢材、船舶和汽车由输出入银行提供出口信贷。外汇收入用来买更多的机床和原油，国内市场仍然供应紧张。"
 krcw_jap_yawata_steel:0 "八幡制铁所"
 krcw_jap_expand_yawata:0 "扩建八幡制铁所"
 krcw_jap_expand_yawata_desc:0 "八幡制铁所是日本最老的钢厂，高炉大多是战前建的。通产省拨款新建两座高炉和一个轧钢车间，富士制铁和日本钢管抱怨资金全给了八幡。"
 krcw_jap_nine_power_companies:0 "成立九家电力公司"
 krcw_jap_nine_power_companies_desc:0 "战时的日本发送电株式会社被拆成九家地区电力公司，各管一片供电区。松永安左卫门主持改组，军方和内务省的官员失去了对电网的控制。"
 krcw_jap_ishikari_coal:0 "开发石狩煤田"
 krcw_jap_ishikari_coal_desc:0 "库页岛丢了以后，钢厂的焦煤只能靠北海道。三井和北海道炭矿汽船在石狩开新矿井，招收的矿工大多是从大陆撤回来的人。"
 krcw_jap_mizushima_reclamation:0 "在水岛填海建厂"
 krcw_jap_mizushima_reclamation_desc:0 "冈山县在水岛滩涂填出一片工业用地，川崎制铁和三菱的新厂都在那里。填海的钱一半由县里出，渔民的补偿至今没有谈完。"
 krcw_jap_kurobe_dam:0 "修建黑部川第四发电站"
 krcw_jap_kurobe_dam_desc:0 "关西电力在黑部峡谷修建拱坝和地下发电站，为大阪和神户的工厂供电。工程要打穿北阿尔卑斯山的隧道，工期长，伤亡也多。"
 krcw_jap_petrochemicals:0 "四日市石化"
 krcw_jap_yokkaichi_complex:0 "建设四日市石油联合企业"
 krcw_jap_yokkaichi_complex_desc:0 "海军留下的四日市燃料厂改建成炼油厂和石化联合企业。原油靠进口，买谁的油由外务省和通产省一起决定。"
 krcw_jap_lorries:0 "国产卡车"
 krcw_jap_motor_industry:0 "扶持丰田与日产汽车"
 krcw_jap_motor_industry_desc:0 "通产省给丰田和日产外汇配额和低息贷款，条件是先造卡车。警察预备队和运输业都缺车，小汽车要再等几年。"
 krcw_jap_export_import_bank:0 "成立日本输出入银行"
 krcw_jap_export_import_bank_desc:0 "政府出资成立输出入银行，为造船、钢铁和机械出口提供信贷。大藏省担心外汇储备，财阀们则终于可以按年签订出口合同。"
 krcw_jap_safety_force:0 "保安队"
 krcw_jap_safety_force_desc:0 "警察预备队改称保安队，归新设的保安厅管辖。它仍然受青岛条约的限制，但已经有了自己的参谋部和训练计划。"
 krcw_jap_defence_agency:0 "防卫厅"
 krcw_jap_defence_agency_desc:0 "防卫厅统管陆上、海上和航空三支自卫队，长官列席内阁。青岛条约规定的兵力上限不再被东京承认。"
 krcw_jap_safety_agency:0 "改组为保安队"
 krcw_jap_safety_agency_desc:0 "警察预备队改称保安队，由新设的保安厅管理，旧军官经过审查可以重新入伍。南京抗议这违反停战协定，东京回答保安队仍是警察。"
 krcw_jap_safety_academy:0 "保安大学校"
 krcw_jap_defence_academy:0 "创办保安大学校"
 krcw_jap_defence_academy_desc:0 "横须贺的保安大学校招收高中毕业生，四年后授予军官资格。陆军士官学校的老教官被请回来讲课，教材却是新编的。"
 krcw_jap_special_vehicle:0 "特车"
 krcw_jap_domestic_tank:0 "向三菱订购国产坦克"
 krcw_jap_domestic_tank_desc:0 "保安厅向三菱重工订购第一种战后国产坦克，要求重量适合日本的桥梁和山路。条约禁止重型装备，所以合同上写的是\"特车\"。"
 krcw_jap_defence_agency_law:0 "成立防卫厅"
 krcw_jap_defence_agency_law_desc:0 "国会通过防卫二法，保安厅升格为防卫厅，下设陆上、海上和航空自卫队。这等于单方面废除了青岛条约的兵力限制，南京和巴黎都会有反应。"
 krcw_psa_northwest_power_1:0 "西北电力"
 krcw_psa_northwest_power_1_desc:0 "邦纳维尔电力局归萨克拉门托的内政部管理，大古力和邦纳维尔两座大坝的电优先供给铝厂和船厂。电价由内政部定，私营电力公司失去了定价权。"
 krcw_psa_northwest_power_2:0 "西北电网"
 krcw_psa_northwest_power_2_desc:0 "从华盛顿州到加利福尼亚的高压线路连成一张网，北方的水电可以送到洛杉矶的工厂。宪政联盟第一次不必向东部买电和煤。"
 krcw_psa_take_over_bonneville:0 "接管邦纳维尔电力局"
 krcw_psa_take_over_bonneville_desc:0 "联邦政府的邦纳维尔电力局在分裂后没有了上级，工程师们一直按旧合同送电。萨克拉门托把它划归内政部，按战时权力法让电力优先供给军工和铝厂。"
 krcw_psa_mcnary_dam:0 "续建麦克纳里大坝"
 krcw_psa_mcnary_dam_desc:0 "陆军工兵部队在分裂前开工的麦克纳里大坝停工多年。工兵营复工，船闸通航后，东俄勒冈的小麦可以用驳船运到波特兰。"
 krcw_psa_timber_mills:0 "整顿西北木材业"
 krcw_psa_timber_mills_desc:0 "俄勒冈和华盛顿的锯木厂由一个木材委员会统一分配订单和出口配额。惠好公司支持，小锯木厂主认为配额偏向大公司。"
 krcw_psa_reopen_aluminium:0 "重开斯波坎铝厂"
 krcw_psa_reopen_aluminium_desc:0 "凯撒公司接手米德和特伦特伍德两座战时铝厂，用邦纳维尔的电炼铝。铝锭供给洛杉矶和西雅图的飞机厂，多余的卖给日本。"
 krcw_psa_columbia_basin:0 "开通哥伦比亚盆地灌溉工程"
 krcw_psa_columbia_basin_desc:0 "大古力大坝的抽水站把河水送进哥伦比亚盆地的干渠，荒地分成小块卖给退伍军人。农场主要付水费，第一批作物要三年后才有收成。"
 krcw_psa_aluminium_sheet:0 "机身铝板"
 krcw_psa_aircraft_sheet:0 "为飞机厂轧制铝板"
 krcw_psa_aircraft_sheet_desc:0 "雷诺兹金属在朗维尤建轧板厂，专为波音、洛克希德和道格拉斯供应机身铝板。飞机厂不再需要从东部进口半成品。"
 krcw_psa_northwest_grid:0 "架设西北高压电网"
 krcw_psa_northwest_grid_desc:0 "邦纳维尔电力局架设从哥伦比亚河到加利福尼亚的高压线路，北方的水电可以送到南方的工厂。加州的私营电力公司到国会游说反对，内政部照样架线。"
 krcw_usa_appomattox_prep:0 "阿波马托克斯准备"
 krcw_usa_appomattox_prep_desc:0 "陆军部按阿波马托克斯计划调集工兵、弹药和飞机。停火委员会的观察员每周都在报告河岸的新工事。"
 krcw_usa_appomattox_ready:0 "总动员"
 krcw_usa_appomattox_ready_desc:0 "国民警卫队已转入联邦现役，渡河部队在河岸待命。工厂和农场的劳力被抽走了一大块，民用品越来越难买。"
 krcw_usa_earls_preparedness_budget:0 "通过厄尔的备战预算"
 krcw_usa_earls_preparedness_budget_desc:0 "厄尔·朗保留了休伊的机器和统一全美的口号，把新增的石油收入先拨给陆军部。州长们分到的公路款少了，将军们暂时不再抱怨。"
 krcw_usa_bureau:0 "联合情报处"
 krcw_usa_joint_intelligence_bureau:0 "与第三厅合设情报处"
 krcw_usa_joint_intelligence_bureau_desc:0 "俄国第三厅派来一个工作组，与陆军部情报局在新奥尔良合设情报处，专门对付东岸。第三厅要求查看全部档案，陆军部的老军官很不情愿。"
 krcw_am_ti_crisis_up3_tt:0 "第三国际危机度 +3（当前：[?global.krcw_ti_crisis|0]）"
 krcw_usa_fund_the_east_underground:0 "资助东岸的反工团组织"
 krcw_usa_fund_the_east_underground_desc:0 "情报处把钱和印刷机送给东岸的反工团组织：被没收工厂的旧业主、教会团体和对车间投票不满的手艺工会。纽约的保卫委员会每破获一个小组，停火线上就更紧张一分。"
 krcw_am_ma_crisis_down3_tt:0 "莫斯科协定危机度 -3（当前：[?global.krcw_ma_crisis|0]）"
 krcw_usa_hunt_syndicalist_agents:0 "清查西岸的工团特工"
 krcw_usa_hunt_syndicalist_agents_desc:0 "联邦调查局和第三厅在码头、油田和黑人老兵协会里清查工团特工。抓的人多了，冤案也多了，民权派议员在国会提出质询。"
 krcw_am_ma_crisis_down2_tt:0 "莫斯科协定危机度 -2（当前：[?global.krcw_ma_crisis|0]）"
 krcw_usa_accord_defence_council:0 "加入协定联合防务委员会"
 krcw_usa_accord_defence_council_desc:0 "新奥尔良派代表进入协定的联合防务委员会，西岸的将军第一次参加协定的年度演习计划。莫斯科答应战时优先向西岸供货，条件是加尔维斯顿长期向俄国舰队开放。"
 krcw_usa_engineers:0 "渡河工兵旅"
 krcw_usa_river_engineer_brigades:0 "组建渡河工兵旅"
 krcw_usa_river_engineer_brigades_desc:0 "陆军工兵在什里夫波特组建三个渡河工兵旅，配备浮桥和冲锋舟。巴顿要求工兵归装甲军指挥，陆军部坚持由集团军统一调配。"
 krcw_usa_forward_depots:0 "扩建河岸兵站"
 krcw_usa_forward_depots_desc:0 "在小石城、圣路易斯郊外和门罗修建弹药库与油库，铁路专线一直铺到河岸。钢材和水泥要从王鱼公路网的工程里挪出来。"
 krcw_usa_stockpile_for_the_crossing:0 "囤积渡河弹药"
 krcw_usa_stockpile_for_the_crossing_desc:0 "达拉斯和沃思堡的兵工厂改为两班倒，新出厂的枪炮不再分给国民警卫队，全部运进河岸兵站。俄国油轮在加尔维斯顿多卸了一个季度的油。"
 krcw_am_ti_crisis_up2_tt:0 "第三国际危机度 +2（当前：[?global.krcw_ti_crisis|0]）"
 krcw_usa_east_bank_agents:0 "在东岸布置内应"
 krcw_usa_east_bank_agents_desc:0 "情报人员在孟菲斯、东圣路易斯和开罗发展内应：铁路调度员、渡口船工和对工团不满的工头。渡河那天，他们负责切断电话线和给部队带路。"
 krcw_usa_crossing_drill:0 "渡河演习"
 krcw_usa_crossing_exercises:0 "举行渡河演习"
 krcw_usa_crossing_exercises_desc:0 "巴顿的装甲军在阿肯色河上演练夜间强渡，工兵旅和航空队一起参加。东岸的侦察兵把每次演习都看得清清楚楚，停火委员会收到了抗议。"
 krcw_usa_riverside_airfields:0 "把航空队前推到河岸"
 krcw_usa_riverside_airfields_desc:0 "陆军航空队把战斗机中队从得克萨斯调到阿肯色和密苏里的前进机场，保证渡河时掌握河面上空。前进机场离东岸的高射炮很近。"
 krcw_usa_general_mobilisation:0 "发布总动员令"
 krcw_usa_general_mobilisation_desc:0 "国会授权总统征召适龄男子，国民警卫队全部转入联邦现役。油田和棉田因此缺人手，统一党的州党魁开始抱怨。"
 krcw_wca_john_brown_prep:0 "约翰·布朗计划的准备"
 krcw_wca_john_brown_prep_desc:0 "总参谋部按约翰·布朗计划调集渡河器材、弹药和飞机。各联合会的民用订单都要给前线让路。"
 krcw_wca_john_brown_ready:0 "全民动员"
 krcw_wca_john_brown_ready_desc:0 "工厂预备役连已编入野战师，渡河部队在俄亥俄河和密西西比河东岸待命。后方的工厂靠女工和老工人维持生产。"
 krcw_am_ma_crisis_up2_tt:0 "莫斯科协定危机度 +2（当前：[?global.krcw_ma_crisis|0]）"
 krcw_wca_embargo_the_west:0 "对西岸实行禁运"
 krcw_wca_embargo_the_west_desc:0 "建设派要在经济上困死西岸：禁止一切过河贸易，向墨西哥施压切断坦皮科的转运，西岸需要的机器一台也不卖。走私船仍然在夜里过河，边防部队的任务因此加重。"
 krcw_am_ti_crisis_down3_tt:0 "第三国际危机度 -3（当前：[?global.krcw_ti_crisis|0]）"
 krcw_wca_river_security_zone:0 "设立密西西比河边防区"
 krcw_wca_river_security_zone_desc:0 "东岸沿河划出边防区，渡口由人民军和保卫委员会共同看守。往东来的人先登记审查再安置，往西去的人要有通行证。西岸的特工很难再混在难民里过河。"
 krcw_am_ma_crisis_up3_tt:0 "莫斯科协定危机度 +3（当前：[?global.krcw_ma_crisis|0]）"
 krcw_wca_arms_via_mexico:0 "经墨西哥向西岸偷运武器"
 krcw_wca_arms_via_mexico_desc:0 "墨西哥铁路沿线的网络把步枪和电台藏在货车里运进得克萨斯，交给油田和码头的工会地下组织。卡马乔的安全局抓到过几批，更多的过去了。"
 krcw_wca_screen_the_atlantic_crossings:0 "清查大西洋航线上的第三厅特工"
 krcw_wca_screen_the_atlantic_crossings_desc:0 "往来勒阿弗尔和纽约的船队带来了技术员和留学生，也带来了俄国第三厅的人。保卫委员会在纽约港设立审查处，所有入境者都要登记。"
 krcw_am_ti_crisis_down2_tt:0 "第三国际危机度 -2（当前：[?global.krcw_ti_crisis|0]）"
 krcw_wca_internationale_defence_protocol:0 "签订国际共同防御议定书"
 krcw_wca_internationale_defence_protocol_desc:0 "纽约与巴黎签订议定书：东岸遭到进攻时，国际提供船队、飞机和志愿军，东岸则向欧洲供应卡车和钢材。巴黎要求东岸渡河之前先与执行局商量。"
 krcw_wca_river_flotilla:0 "组建俄亥俄河舰队"
 krcw_wca_river_flotilla_desc:0 "匹兹堡和路易斯维尔的船厂改装炮艇和登陆驳船，编成俄亥俄河舰队，渡河时掩护浮桥。钢铁联合会为此推迟了一批民用驳船的订单。"
 krcw_wca_crossing_depots:0 "在孟菲斯和开罗囤积渡河器材"
 krcw_wca_crossing_depots_desc:0 "东部重建委员会在孟菲斯、开罗和帕迪尤卡修建仓库，存放浮桥、冲锋舟和弹药。这些工程占用了阿巴拉契亚重建的一部分钢材。"
 krcw_wca_crossing_drill:0 "渡河演习"
 krcw_wca_ohio_crossing_drill:0 "举行俄亥俄河渡河演习"
 krcw_wca_ohio_crossing_drill_desc:0 "人民军在俄亥俄河上练习夜间强渡，四个军区轮流参加。卡尔森要求每个连都至少过一次河，工厂预备役也不例外。"
 krcw_wca_west_bank_strike_committees:0 "在西岸组织罢工委员会"
 krcw_wca_west_bank_strike_committees_desc:0 "解放委员会派组织者过河，在得克萨斯油田、阿肯色棉田和新奥尔良码头建立罢工委员会，约定渡河那天同时停工。被抓住的组织者会被朗的法庭判处死刑。"
 krcw_wca_ohio_airfields:0 "扩建俄亥俄河沿岸机场"
 krcw_wca_ohio_airfields_desc:0 "人民空军在肯塔基西部、伊利诺伊南部和密西西比修建前进机场。机场建成后，西岸的雷达站能看到每一次起飞。"
 krcw_wca_detroit_war_shifts:0 "底特律转入战时生产"
 krcw_wca_detroit_war_shifts_desc:0 "汽车工人联合会投票同意把一半民用装配线转产坦克和卡车，工人三班倒。拖拉机和小汽车推迟交货，农民合作社提出抗议。"
 krcw_wca_general_mobilisation:0 "宣布全民动员"
 krcw_wca_general_mobilisation_desc:0 "代表大会授权执行委员会征召适龄工人，工厂预备役连编入野战师。后方的工厂从此只能靠女工和老工人维持生产。"
 krcw_jap_northern_prep:0 "北进准备"
 krcw_jap_northern_prep_desc:0 "参谋本部朝鲜课的计划开始落实到港口、机场和师团。外务省对这些工程的解释是加强本土防卫。"
 krcw_jap_northern_ready:0 "北进兵团"
 krcw_jap_northern_ready_desc:0 "北进兵团已在对马和北九州集结，运兵船在港内待命。只要内阁一声令下，部队一天之内就能在釜山登陆。"
 krcw_jap_korea_section:0 "设立参谋本部朝鲜课"
 krcw_jap_korea_section_desc:0 "防卫厅在参谋本部下设朝鲜课，由石原莞尔的旧部拟定在釜山和仁川登陆的计划。计划书只印了三份，外务省一份也没拿到。"
 krcw_jap_kyushu_ports:0 "扩建门司与佐世保港"
 krcw_jap_kyushu_ports_desc:0 "门司、博多和佐世保的码头扩建，铁路修到栈桥边，一个师团一天之内就能装船。港务局说这是为了对朝贸易，没有人相信。"
 krcw_jap_korean_contacts:0 "联络朝鲜的亲日派"
 krcw_jap_korean_contacts_desc:0 "情报机关联络一九四四年后留在朝鲜的日本侨民、旧总督府的朝鲜籍官员和对汉城政府不满的地主。南京的顾问团察觉后，朝鲜警察开始大搜查。"
 krcw_jap_mobile:0 "机动师团"
 krcw_jap_mobile_armour:0 "机动师团的特车"
 krcw_jap_mobile_divisions:0 "组建机动师团"
 krcw_jap_mobile_divisions_desc:0 "陆上自卫队抽出最好的部队编成机动师团，配备丰田卡车和三菱的特车。朝鲜的公路比中国的好，机动部队从釜山北上汉城用不了多久。"
 krcw_jap_landing_ships:0 "登陆船队"
 krcw_jap_landing_troops:0 "登陆部队"
 krcw_jap_landing_fleet:0 "建造登陆船队"
 krcw_jap_landing_fleet_desc:0 "吴港和广岛的船厂建造坦克登陆舰和机帆船，海上保安厅负责训练船员。造船协会的出口订单因此推迟交货。"
 krcw_jap_northward_press:0 "发动收回朝鲜运动"
 krcw_jap_northward_press_desc:0 "复员军人协会、大陆撤侨团体和右翼报纸发起收回朝鲜运动，国民精神同盟的议员在国会里呼应。自由派和社会党人上街反对，警察要同时应付两边。"
 krcw_jap_strait_air:0 "海峡制空"
 krcw_jap_tsushima_air_bases:0 "在对马海峡两岸修建航空基地"
 krcw_jap_tsushima_air_bases_desc:0 "航空自卫队在福冈、佐世保和壹岐修建前进机场，保证登陆时掌握海峡上空。朝鲜的雷达站从此把每一次起飞都报给南京。"
 krcw_jap_assemble_at_tsushima:0 "在对马集结北进兵团"
 krcw_jap_assemble_at_tsushima_desc:0 "北进兵团在对马、壹岐和北九州集结，运兵船停在港内待命。釜山的灯火管制从海峡这边看得见，南京的武官向东京递交了照会。"
 krcw_jap_strait_harbour_forts:0 "加固高雄、基隆和马公要塞"
 krcw_jap_strait_harbour_forts_desc:0 "海军在高雄、基隆和澎湖马公增设岸炮和雷区，封住中国登陆船队最可能使用的港口。港区管制让台湾的砂糖出口慢了下来。"
 krcw_jap_formosa_fighter_wing:0 "在台湾部署战斗机联队"
 krcw_jap_formosa_fighter_wing_desc:0 "航空自卫队把一个喷气战斗机联队调到台北和高雄，负责拦截来自福建的轰炸机。本土的防空因此少了一个联队。"
 krcw_usa2_1_t:0 "审计署进驻"
 krcw_usa2_1_d:0 "联邦审计署按朗的命令进驻新奥尔良。审计长在第一次汇报里说，他的人可以只查各州党部的账，也可以一直查到州议会大厦里那间没有门牌的办公室。东岸的广播已经在等着看结果，南方的几位州长则派人来打听“查到哪里为止”。总统办公室要先定下审计的范围。"
 krcw_usa2_1.a:0 "一查到底，连新奥尔良的合同一起查。"
 krcw_usa2_1.b:0 "只查各州党部，别碰首都。"
 krcw_usa2_1.c:0 "办一场给广播听的审计。"
 krcw_usa2_2_t:0 "王鱼的账本"
 krcw_usa2_2_d:0 "审计员追到了新奥尔良的国防合同。账目显示，过去四年里，每一笔大合同都有百分之十流进了朗的核心圈子，其中几个人今天还坐在内阁里。审计长把两箱档案送到总统桌上，问现在该怎么办。公开起诉会动摇机器的根基，封存档案则会让东岸的广播继续嘲笑“王鱼的百分之十”。"
 krcw_usa2_2.a:0 "公开起诉，哪怕动到自己人。"
 krcw_usa2_2.b:0 "封存最重的几卷，起诉其余。"
 krcw_usa2_2.c:0 "交给厄尔私下处理。"
 krcw_usa2_3_t:0 "各县的账"
 krcw_usa2_3_d:0 "审计停在了各州党部的门口。几个州的党魁被查出用联邦拨款养私人班底，用公路合同还人情债，账目里的窟窿不小，可是没有一条线通向新奥尔良。审计长说，他可以把这几个人办成典型，也可以用他们的配合换一份自查承诺。总统要决定对这些州党魁下手多重。"
 krcw_usa2_3.a:0 "办成典型，公开处理。"
 krcw_usa2_3.b:0 "用配合换自查，不公开。"
 krcw_usa2_3.c:0 "让党魁们自己定一个辞职名额。"
 krcw_usa2_4_t:0 "一个标题，而不是审计"
 krcw_usa2_4_d:0 "那场审计办得很像一场审计：有听证会，有记者，有几个低级职员被解职。可是档案室的门从来没有真正打开过。两周之后，东岸的自由美国电台播出了审计署一名助手私下说的话录音，笑话这场审计“查的是扫地的，放过了收钱的”。南方的党魁们看明白了：首都不敢真查。"
 krcw_usa2_4.a:0 "承认吧，机器赢了这一局。"
 krcw_usa2_4.b:0 "再查一次，这次来真的。"
 krcw_usa2_5_t:0 "党魁们的回话"
 krcw_usa2_5_d:0 "审计的结果摆到了统一党全国委员会面前。各州党魁要么接受新的账目规矩，让新奥尔良派来的会计长驻各州，要么用他们手里的东西还价：那些数清选票的县机器。委员会散会之前不会表态，而他们怎么回话，取决于这几年总统对他们是宽是严。"
 krcw_usa2_5.a:0 "坚持规矩，会计长必须进驻。"
 krcw_usa2_5.b:0 "给他们留一半体面，换他们点头。"
 krcw_usa2_5.c:0 "放他们一马，机器要先转起来。"
 krcw_usa2_5_v0:0 "审计一查到底，连新奥尔良的核心圈子也进了法庭，党魁们知道这次总统是认真的。"
 krcw_usa2_5_v1:0 "审计停在了各州党部门口，没有碰新奥尔良，党魁们还在观望首都的决心。"
 krcw_usa_machine_roll_tt:0 "党魁们是否接受新规矩取决于审计的记录：公开起诉、审计过的机器与稳定的局面让他们低头；贪腐、恩庇网络与低稳定让他们还价。"
 krcw_usa2_6_t:0 "干净一点的机器"
 krcw_usa2_6_d:0 "党魁们接受了新的账目规矩。新奥尔良派出的会计长进驻各州党部，国防合同第一次要走公开招标，几个最惹眼的掮客被安排“退休”。机器还在，各州党部的账目从此要由会计长签字。东岸的自由美国电台停播了“王鱼的百分之十”这档节目。"
 krcw_usa2_6.a:0 "干净的机器也是机器，继续运转。"
 krcw_usa2_7_t:0 "机器赢了这一局"
 krcw_usa2_7_d:0 "党魁们没有低头。他们没有公开反抗，只是在接下来的两个月里，让会计长在每一个州都碰上同样的回答：档案在搬家，钥匙在另一个人手里，经手的职员上个月调走了。审计署的报告说，没有各州党魁的配合，会计长制度推行不下去。"
 krcw_usa2_7.a:0 "那就喂饱它，用它来打仗。"
 krcw_usa_the_comptrollers:0 "会计长制度"
 krcw_usa_the_comptrollers_desc:0 "审计留下的会计长制度被写进了法律：每个州党部都有一名新奥尔良派来的会计长，国防合同一律公开招标。机器的油水少了，齿轮转得更准了，而失去回扣的掮客们开始在南方低声抱怨。"
 krcw_usa_feed_the_machine:0 "喂饱机器"
 krcw_usa_feed_the_machine_desc:0 "既然审计查不动机器，总统索性用它：合同、职位和补贴比以前分得更慷慨，换来的是各州党部对备战预算一致举手。回扣的比例也跟着涨了，东岸的自由美国电台恢复了“王鱼的百分之十”这档节目。"
 krcw_usa_merit_service:0 "文官考绩制"
 krcw_usa_merit_service_desc:0 "会计长制度之上再加一层：联邦和各州的职位由考试和考绩决定，不再由县党魁的推荐信决定。老派党工骂这是“把机器交给书呆子”，可是年轻的退伍军人第一次能靠本事进政府。"
 krcw_usa_merit:0 "文官考绩"
 krcw_usa_the_contract_office:0 "合同分配局"
 krcw_usa_the_contract_office_desc:0 "机器既然要用来打仗，就得把分肥这件事办得有效率。一个专门的合同分配局在新奥尔良成立，由厄尔信得过的人掌管，谁忠诚谁就先拿到订单。工厂因此开足马力，账目却越来越没人看得懂。"
 krcw_usa_clean_hands_abroad:0 "把干净的账拿给莫斯科看"
 krcw_usa_clean_hands_abroad_desc:0 "新奥尔良把审计过的账本送到莫斯科，证明俄罗斯的贷款没有被掮客吃掉。协定的审计官第一次挑不出毛病，下一批机床和贷款批得格外痛快。"
 krcw_usa2_10_t:0 "三角洲的罢工"
 krcw_usa2_10_d:0 "收获季节，密西西比河三角洲的黑人摘棉工放下了麻袋，要求棉花按磅计价、工钱按周结算。罢工从阿肯色的海伦娜蔓延到密西西比的格林维尔，种植园主给新奥尔良发电报，要求派国民警卫队。东岸的自由美国电台每晚播报罢工委员会的声明。"
 krcw_usa2_10.a:0 "派联邦调解员去三角洲。"
 krcw_usa2_10.b:0 "派国民警卫队保护种植园。"
 krcw_usa2_10_v0:0 "小石城妥协后登记投票的黑人老兵走在罢工队伍的最前面。三角洲的摘棉工要求棉花按磅计价、工钱按周结算，种植园主给新奥尔良发电报要国民警卫队，说妥协案“把黑人惯坏了”。东岸的自由美国电台每晚播报罢工委员会的声明。"
 krcw_usa2_10_v1:0 "罢工的组织者里，有不少人曾在渡口被国民警卫队拦回来。三角洲的摘棉工要求棉花按磅计价、工钱按周结算，种植园主给新奥尔良发电报，提醒总统他向南方保证过“什么都不会改变”。东岸的自由美国电台每晚播报罢工委员会的声明。"
 krcw_usa2_11_t:0 "联邦调解员"
 krcw_usa2_11_d:0 "劳工部的调解员在格林维尔法院坐了三个星期，拿出一个方案：每个县设一个工资委员会，按磅定价。争议在于委员会里有没有黑人委员。种植园主说有黑人委员就不签字，罢工委员会说没有黑人委员就不复工。"
 krcw_usa2_11.a:0 "工资委员会里要有黑人委员。"
 krcw_usa2_11.b:0 "委员会只设白人委员，但工钱照涨。"
 krcw_usa2_12_t:0 "国民警卫队进三角洲"
 krcw_usa2_12_d:0 "阿肯色和密西西比的国民警卫队开进三角洲，把罢工委员会的人从棚屋里带走。罢工十天就散了，可是摘棉工的家庭开始成群走向海伦娜和维克斯堡的渡口。警卫队指挥官请示新奥尔良：拦，还是放。"
 krcw_usa2_12.a:0 "封住渡口，一个也不放。"
 krcw_usa2_12.b:0 "放他们走，再悄悄给留下的人涨工钱。"
 krcw_usa_delta_roll_tt:0 "种植园主和南方党魁接受还是出走，取决于民权妥协、委员会的组成、机器的状况和稳定度。"
 krcw_usa2_13_t:0 "格林维尔的工资委员会"
 krcw_usa2_13_d:0 "种植园主签了字。格林维尔的工资委员会第一次开会，定下了每磅棉花的价钱，摘棉工第二天就回到了田里。南方的参议员在报上抱怨，但没有一个人退党。"
 krcw_usa2_13.a:0 "把工资委员会推广到整个南方。"
 krcw_usa2_13.b:0 "三角洲就够了，别再刺激南方。"
 krcw_usa2_13_v0:0 "种植园主签了字，委员会里坐着两名黑人老兵。格林维尔的工资委员会第一次开会就定下了每磅棉花的价钱，摘棉工第二天回到了田里。南方的参议员在报上抱怨，但没有一个人退党。"
 krcw_usa2_14_t:0 "南方党魁出走"
 krcw_usa2_14_d:0 "密西西比、亚拉巴马和路易斯安那北部的一批统一党参议员退出党团，另组“州权党团”。他们说三角洲的事证明新奥尔良已经站到了黑人一边。当晚莫斯利将军请他们吃饭，联邦调查局的人也在场。"
 krcw_usa2_14.a:0 "让他们走，靠老兵和农民执政。"
 krcw_usa2_14.b:0 "把州初选的控制权还给他们。"
 krcw_usa2_15_t:0 "海伦娜的渡口"
 krcw_usa2_15_d:0 "三角洲的事过去以后，海伦娜的渡口成了西岸最受关注的地方。东岸在对岸搭起接收营，挂出“这里没有肤色线”的横幅，停火委员会每周都收到双方的抗议。新奥尔良要决定这个渡口今后怎么管。"
 krcw_usa2_15.a:0 "发通行证，按规矩放人。"
 krcw_usa2_15.b:0 "整段河岸封锁，偷渡者送劳改农场。"
 krcw_usa2_15_v0:0 "国民警卫队封住了海伦娜的渡口。摘棉工的家庭在河岸上搭棚等了一个月，最后被押回了种植园。东岸在对岸搭起接收营，每天用喇叭念被拦下的人的名字。新奥尔良要决定这个渡口今后怎么管。"
 krcw_usa2_15_v1:0 "州权党团出走以后，南方各县开始自己管渡口。东岸在海伦娜对岸搭起接收营，停火委员会每周都收到双方的抗议。新奥尔良要决定这个渡口今后由谁来管。"
 krcw_usa2_16_t:0 "三角洲之后"
 krcw_usa2_16_d:0 "三角洲罢工一年后，南方又到了收获季节。新奥尔良的政策已经定下，各县照着办，东岸的广播也换了说法。国会里关于肤色线的辩论还在继续，只是这一次双方都知道总统站在哪一边。"
 krcw_usa2_16.a:0 "照这条路走下去。"
 krcw_usa2_16_v0:0 "三角洲罢工一年后，各县的工资委员会照常开会，黑人国民警卫队员在海伦娜的渡口站岗。往东渡河的人比去年少了一半，东岸的广播不再念渡河者的名字，改念西岸工资委员会定的价钱。国会里的州权党团还在，只是人数没有再增加。"
 krcw_usa2_16_v1:0 "三角洲罢工一年后，南方各县的渡口凭通行证放行，没有证件的人一律送劳改农场。东岸的接收营还在海伦娜对岸，喇叭里念的名字一天比一天多。南方的党魁们重新回到了统一党党团，莫斯利将军也常去他们的晚宴。"
 krcw_usa_delta_wage_boards:0 "南方工资委员会"
 krcw_usa_delta_wage_boards_desc:0 "格林维尔的办法推广到整个南方：每个产棉县设一个工资委员会，黑人和白人委员各占一半，价钱由委员会定，不由种植园主定。南方的党魁们失去了一件老武器，摘棉工有了一份可以拿到法院去的合同。"
 krcw_usa_states_rights_pact:0 "州权协定"
 krcw_usa_states_rights_pact_desc:0 "新奥尔良和南方党魁签了一份不公开的协定：联邦不再过问各州的初选和渡口，南方议员保证投票支持备战预算。肤色线保住了，河对岸的接收营每个月都在扩建。"
 krcw_usa_black_guardsmen:0 "黑人国民警卫队"
 krcw_usa_black_guardsmen_desc:0 "三角洲各县的国民警卫队开始招收黑人老兵，海伦娜和维克斯堡的渡口改由混编连队看守。想渡河的人看见河岸上站岗的是自己人，往东走的少了一半。"
 krcw_usa_crossing_passes:0 "渡口通行证制度"
 krcw_usa_crossing_passes_desc:0 "南方各县在渡口发放通行证，没有证件的黑人一律扣押。国民警卫队沿河加设了岗哨，劳改农场多了一批劳力。东岸的广播把通行证的样子印成了传单。"
 krcw_usa2_20_t:0 "厄尔的百日"
 krcw_usa2_20_d:0 "厄尔·朗坐进了总统府，手里是一副比他哥哥差得多的牌：一台认钱不认人的机器，一群刚被安抚下来的将军，一个靠石油和俄罗斯贷款撑着的财政。他知道自己只有一百天的蜜月期，之后机器就会开始试探新主人。厄尔要先打哪一张牌。"
 krcw_usa2_20.a:0 "推动改革：选举权、文官制、公开的账。"
 krcw_usa2_20.b:0 "先稳住机器，改革等以后。"
 krcw_usa2_20.c:0 "先给将军们一块骨头，换他们安分。"
 krcw_usa2_21_t:0 "党的回答"
 krcw_usa2_21_d:0 "厄尔把他的纲领送到了统一党全国委员会。州长们、南方的议员和机器的老干部坐在同一个会场里，而厄尔手里没有他哥哥那种能让整个会场起立鼓掌的东西，只有一副扑克牌和一本记满人情的账。委员会会不会给他想要的授权，不是他一个人说了算。"
 krcw_usa2_21.a:0 "亲自到会，一张桌子一张桌子地谈。"
 krcw_usa2_21.b:0 "让州长们带话，自己留在总统府。"
 krcw_usa_hundred_days_roll_tt:0 "委员会是否授权厄尔改革，取决于他继任的方式、机器的状况、肤色线的处理和稳定度。"
 krcw_usa2_22_t:0 "厄尔拿到了授权"
 krcw_usa2_22_d:0 "委员会在天亮前通过了厄尔的纲领。厄尔用他记了二十年的人情账，换来了选举权法、文官考绩制和一份公开的预算。州长们保住了座位，但第一次要把账目交出来公开。"
 krcw_usa2_22.a:0 "把新法律送到各州去执行。"
 krcw_usa2_23_t:0 "机器赢了厄尔"
 krcw_usa2_23_d:0 "委员会把厄尔的纲领拆得只剩一个空壳。选举权法被改成了一纸“研究建议”，文官制被删掉了，公开预算变成了“适时公布”。州长们没有造反，投完票以后一切照旧。厄尔的改革计划就此搁置。"
 krcw_usa2_23.a:0 "那就坐稳了，别从上面摔下来。"
 krcw_usa2_24_t:0 "将军们在看"
 krcw_usa2_24_d:0 "南方将领集团一直在旁边看着厄尔。他们想知道的只有一件事：这位新总统是不是一个可以绕过去的人。陆军部送来了一份预算要求，厄尔同时收到消息，圣安东尼奥又在办晚宴了。"
 krcw_usa2_24.a:0 "先下手，把将领集团拆散。"
 krcw_usa2_24.b:0 "给他们预算和演习，让他们忙起来。"
 krcw_usa2_24_v0:0 "厄尔先请陆军部开价，将军们也就开了价：三个新装甲师，一笔不经国会审议的预算，再让南方将领集团的人进参谋长联席会议。圣安东尼奥的晚宴照办，这一次他们说话不必再遮掩。"
 krcw_usa2_24_v1:0 "委员会把厄尔的纲领拆成了空壳，南方将领集团看得一清二楚：这位总统连自己的党都管不住。陆军部送来了一份预算要求，圣安东尼奥又在办晚宴了。"
 krcw_usa2_25_t:0 "将军委员会的第一道命令"
 krcw_usa2_25_d:0 "坦克撤回了军营，可是宪法还“暂停”着。莫斯利将军坐在州议会大厦二楼朗用过的办公室里，面前是委员会起草的第一道正式命令。他可以把这套紧急体制定为长久之计，也可以给它定一个期限，哪怕只是写在纸上的期限。将军们在等他签字。"
 krcw_usa2_25.a:0 "把紧急状态定为长久的国家体制。"
 krcw_usa2_25.b:0 "给它定一个期限：战事平定即恢复宪政。"
 krcw_usa2_25.c:0 "先清洗不可靠的军官，再谈其他。"
 krcw_usa_junta_roll_tt:0 "委员会的命令要靠军官团执行。军官团跟不跟，取决于这道命令的性质、将军们是否受宠、停火线的紧张度和战争支持度。"
 krcw_usa2_27_t:0 "永久的紧急状态"
 krcw_usa2_27_d:0 "军官团跟上了。委员会颁布了一部《国家安全基本法》，取代了暂停的宪法：没有国会，没有选举，各州州长由军区司令兼任。莫斯利成了终身的委员会主席。东岸的广播把基本法全文念了三遍，巴黎的报纸发表社论予以谴责。"
 krcw_usa2_27.a:0 "一个为战争而生的国家。"
 krcw_usa2_28_t:0 "纸上的期限"
 krcw_usa2_28_d:0 "军官团没有全跟。老一代军官要一个说法，俄罗斯顾问团也更愿意看到一个说得过去的政府。委员会宣布紧急状态有一个期限：等停火线问题解决，就恢复国会与选举。老一代军官接受了这个说法，莫斯利仍是委员会主席。"
 krcw_usa2_28.a:0 "留着那个期限，也留着将军委员会。"
 krcw_usa_earls_new_deal:0 "厄尔的新政"
 krcw_usa_earls_new_deal_desc:0 "厄尔把百日里拿到的授权变成了法律：选举权法、文官考绩制、公开的联邦预算。这不是休伊式的革命，是一连串精算过的交易。机器还在，但它第一次要在阳光下运转。"
 krcw_usa_run_the_machine:0 "让机器运转"
 krcw_usa_run_the_machine_desc:0 "改革在党的委员会里碰了壁，厄尔放下了改造机器的计划，像他哥哥一样用合同和职位换取各州党部的忠诚。账目越来越乱，可是备战预算一次都没有被卡住。"
 krcw_usa_earls_america:0 "厄尔的美国"
 krcw_usa_earls_america_desc:0 "继任两年后，厄尔·朗站稳了脚跟。将军们和党魁们都清楚能从他手里拿到什么、拿不到什么。东岸的执行委员会开始按新奥尔良的新政府重新拟定对策。"
 krcw_usa_the_basic_law:0 "国家安全基本法"
 krcw_usa_the_basic_law_desc:0 "将军委员会颁布的《国家安全基本法》取代了暂停的宪法：没有国会，没有选举，州长由军区司令兼任。各部的预算和人事改由委员会的参谋处统一安排，第一项任务是准备渡河。"
 krcw_usa_the_emergency_term:0 "紧急状态的期限"
 krcw_usa_the_emergency_term_desc:0 "军官团要一个说法，俄罗斯顾问团也要一个能说得过去的政府。委员会给紧急状态定了一个期限：停火线问题解决即恢复宪政。老一代军官因此继续服从委员会，俄罗斯顾问团也向莫斯科报告了这个期限。"
 krcw_usa_the_council_state:0 "委员会治下的美国"
 krcw_usa_the_council_state_desc:0 "将军委员会站稳了脚跟。征兵令和转产令一个月内就能落实到每个县，各州的工厂按委员会的命令排产。南方以外的州议员和报纸已经很少公开批评委员会。"
 krcw_usa2_32_t:0 "农场里的厄尔"
 krcw_usa2_32_d:0 "厄尔·朗在路易斯安那温菲尔德附近的农场里住了几个月，访客一直没断：州长、县党魁、几个失了座位的议员。他们不谈政治，只打牌、钓鱼，可是联邦调查局的报告说，每一桌牌局之后都有人连夜开车回新奥尔良。将军委员会要决定怎么对待这位前总统。"
 krcw_usa2_32.a:0 "软禁起来，访客一律登记。"
 krcw_usa2_32.b:0 "请他出任委员会的文职顾问。"
 krcw_usa2_32.c:0 "由他去。一个打牌的老人不足为患。"
 krcw_usa2_32_v0:0 "基本法颁布以后，厄尔·朗的农场成了南方最热闹的地方。州长、县党魁和失去座位的议员轮流来打牌钓鱼，联邦调查局报告说，每一桌牌局之后都有人连夜开车回新奥尔良。将军委员会要决定怎么对待这位前总统。"
 krcw_usa2_30_t:0 "一年之后"
 krcw_usa2_30_d:0 "继承危机过去一年了。新奥尔良的新政府站稳了脚跟，停火线对岸的纽约也换了一套应对它的说法。这半个美国走上了哪条路，已经看得清楚。"
 krcw_usa2_30.a:0 "这就是继承的结果。"
 krcw_usa2_30_v0:0 "厄尔·朗执政一年，选举权法和文官考绩制都已生效，联邦预算第一次印成小册子在报摊上出售。南方的党魁们抱怨，却没有一个人造反。东岸的广播不再说新奥尔良由一个人说了算，改说那边的改革“只是换了一种分赃的办法”。"
 krcw_usa2_30_v1:0 "厄尔·朗执政一年，机器照旧运转，合同和职位照旧按人情分配。备战预算一次都没有被卡住，账目却越来越没人看得懂。东岸的广播又开始念“王鱼的百分之十”，只是把“王鱼”换成了“厄尔”。"
 krcw_usa2_30_v2:0 "将军委员会执政一年，《国家安全基本法》取代了宪法，各州州长由军区司令兼任。征兵令和转产令在一个月内就能落实到每个县。东岸把停火线上的部队增加了一倍，停火委员会的观察员每周都报告河岸上的新工事。"
 krcw_usa2_30_v3:0 "将军委员会执政一年，紧急状态还在，那个写在纸上的期限也还在。老一代军官照常服从命令，俄罗斯顾问团向莫斯科报告说新奥尔良的政府“可以解释”。东岸的广播每周都问一次，停火线问题什么时候才算解决。"
 krcw_usa2_8_t:0 "协定的审计官"
 krcw_usa2_8_d:0 "莫斯科派来的审计官在新奥尔良查了一个月的账，看的是俄罗斯贷款花到了哪里。他们的报告已经发回最高执政府，下一批机床和贷款批多少，要看莫斯科怎么读这份报告。"
 krcw_usa2_8.a:0 "等莫斯科的答复。"
 krcw_usa2_8_v0:0 "莫斯科的审计官在新奥尔良查了一个月的账。会计长制度留下的账目清楚，每一笔俄罗斯贷款都能对上去处。审计报告已经发回最高执政府，下一批机床和贷款批多少，要看莫斯科怎么读这份报告。"
 krcw_usa2_8_v1:0 "莫斯科的审计官在新奥尔良查了一个月的账。合同分配局的账目只能对上一半，另一半在“朋友”手里。审计报告已经发回最高执政府，下一批机床和贷款批多少，要看莫斯科怎么读这份报告。"
 krcw_wca2_1_t:0 "选举法草案"
 krcw_wca2_1_d:0 "联合会公约签订后，代表大会要为内战以来第一次全联合会普选起草选举法。争议在于谁有投票权：鲁瑟主张每个工人、农民和士兵都有一票，包括刚渡河的难民；几家老联合会主张只有持工会卡的人才能投票。南方的纺织区和河边的接收营都在等这份草案。"
 krcw_wca2_1.a:0 "人人一票，难民和士兵也算。"
 krcw_wca2_1.b:0 "只有持工会卡的人投票。"
 krcw_wca2_2_t:0 "接收营里的选民"
 krcw_wca2_2_d:0 "选举法给了难民投票权，孟菲斯和开罗的接收营一下子多了几万名选民。保卫委员会提醒执行委员会，河对岸的特工可能混在难民里，要求先审查再登记。接待委员会则说审查拖得越久，难民就越觉得自己是二等人。"
 krcw_wca2_2.a:0 "由接待委员会当场登记。"
 krcw_wca2_2.b:0 "先由保卫委员会审查，再登记。"
 krcw_wca2_3_t:0 "没有工会卡的人"
 krcw_wca2_3_d:0 "只给持卡人投票权的草案公布后，伦道夫在伯明翰召开了抗议大会。他指出，老行业工会不收黑人，南方的黑人工人里有一大半拿不到工会卡，也就投不了票。执行委员会可以发临时工会卡，也可以坚持草案。"
 krcw_wca2_3.a:0 "给所有在岗工人发临时工会卡。"
 krcw_wca2_3.b:0 "坚持草案，规矩不能改。"
 krcw_wca2_4_t:0 "谁来计票"
 krcw_wca2_4_d:0 "投票将在车间、矿井、码头和军营里进行。几家联合会互不信任，要求每一张票都由两个不同联合会的代表一起清点，这样计票要花上一个多星期。执行委员会的统计处说它三天就能数完。"
 krcw_wca2_4.a:0 "两个联合会一起数，慢一点也行。"
 krcw_wca2_4.b:0 "交给统计处，三天出结果。"
 krcw_wca2_4_v0:0 "投票将在车间、矿井、码头和军营里进行，接收营里也设了票箱。几家联合会互不信任，要求每一张票都由两个不同联合会的代表一起清点，这样计票要花上一个多星期。执行委员会的统计处说它三天就能数完。"
 krcw_wca2_4_v1:0 "投票将在车间、矿井、码头和军营里进行，只有持卡人能领到选票。几家联合会互不信任，要求每一张票都由两个不同联合会的代表一起清点，这样计票要花上一个多星期。执行委员会的统计处说它三天就能数完。"
 krcw_wca_turnout_roll_tt:0 "选举能否让各联合会都服气，取决于计票办法、选举权的范围、联合会之间的关系和稳定度。"
 krcw_wca2_5_t:0 "各联合会都签了字"
 krcw_wca2_5_d:0 "普选结束，各联合会的监票代表在结果上签了字，没有一家提出异议。投票率很高，连孟菲斯的码头和肯塔基的矿井都排起了长队。孟菲斯、维克斯堡和新奥尔良的黑人教堂里，人们把这个消息悄悄传了下去。"
 krcw_wca2_5.a:0 "把选举结果印成传单送过河去。"
 krcw_wca2_5.b:0 "别声张，先让新代表大会开起来。"
 krcw_wca2_5_v0:0 "普选结束，各联合会的监票代表在结果上签了字，接收营里的难民也投了票，没有一家联合会提出异议。孟菲斯、维克斯堡和新奥尔良的黑人教堂里，人们悄悄传着一个消息：河那边，刚渡河的人也能投票。"
 krcw_wca2_6_t:0 "底特律不承认结果"
 krcw_wca2_6_d:0 "汽车工人联合会拒绝在结果上签字，说统计处在匹兹堡和肯塔基多算了票。钢铁和矿工联合会反过来指责底特律输不起。河对岸的广播当晚就播出了底特律的抗议声明。"
 krcw_wca2_6.a:0 "成立重新计票委员会，各联合会都派人。"
 krcw_wca2_6.b:0 "执行委员会确认结果，不再讨论。"
 krcw_wca_the_open_franchise:0 "开放的选举权"
 krcw_wca_the_open_franchise_desc:0 "选举法里的人人一票写进了联合会公约，每一个在东岸工作的人，不管有没有工会卡、渡河多久，都有投票权。接收营的登记处改成了常设机构，往东渡河的人第二天就能领到选民证。"
 krcw_wca_the_card_franchise:0 "工会卡选举权"
 krcw_wca_the_card_franchise_desc:0 "投票权和工会卡绑在了一起，老联合会的组织工作因此有了实权：发卡的人就是决定谁能投票的人。各联合会的会员人数涨得很快，没有卡的人被挡在了代表大会外面。"
 krcw_wca_the_scrutineers:0 "联合监票制"
 krcw_wca_the_scrutineers_desc:0 "两个联合会共同计票的办法定为常规，每一次选举、每一次罢工表决都照此办理。这套办法慢，但各联合会都信它，代表大会里关于计票的争吵就此少了。"
 krcw_wca_the_recount_commission:0 "常设重新计票委员会"
 krcw_wca_the_recount_commission_desc:0 "底特律的抗议留下了一个常设机构：重新计票委员会，由各联合会轮流派人。它能平息下一次争议，也让每一次选举都要多拖一个月。汽车工人联合会仍然认为一九五〇年的结果不公正。"
 krcw_wca2_7_t:0 "第二届代表大会"
 krcw_wca2_7_d:0 "普选产生的第一届代表大会任期过半。各联合会已经习惯了新的选举规矩，执行委员会的每一项议案都要在大会里过一遍。河对岸的报纸仍然不登东岸的选举新闻。"
 krcw_wca2_7.a:0 "照新规矩办下去。"
 krcw_wca2_7_v0:0 "普选产生的第一届代表大会任期过半，联合监票制已经用于三次罢工表决，没有一次出过争议。往东渡河的人领到选民证的速度比领到住房还快。河对岸的报纸仍然不登东岸的选举新闻，可是新奥尔良的黑人教堂里，人人都知道。"
 krcw_wca2_7_v1:0 "普选产生的第一届代表大会任期过半，重新计票委员会已经开了四次会。汽车工人联合会的代表常常集体退场，执行委员会的议案要拖上好几个月才能通过。河对岸的广播每周都拿底特律的抗议做节目。"
 krcw_wca2_10_t:0 "第三道防线"
 krcw_wca2_10_d:0 "卡尔森的纵深防御计划把第三道防线放在阿巴拉契亚山区。要在山里修碉堡，就得拿走重建委员会的钢材和矿工的劳力，约翰·刘易斯的矿工联合会已经表示反对。总参谋部里也有人主张不修山区防线，把钱花在河后面的机动预备队上。"
 krcw_wca2_10.a:0 "在山区修筑第三道防线。"
 krcw_wca2_10.b:0 "把钱花在河后的机动预备队上。"
 krcw_wca2_11_t:0 "刘易斯说不"
 krcw_wca2_11_d:0 "约翰·刘易斯在查尔斯顿召开矿工联合会大会，宣布如果总参谋部把运煤支线的钢材拿去修碉堡，矿工就停工。卡尔森派人去谈。总参谋部可以把矿工编成劳动营，也可以答应先修完运煤支线再动工。"
 krcw_wca2_11.a:0 "把矿工编成劳动营。"
 krcw_wca2_11.b:0 "先修完运煤支线，再修碉堡。"
 krcw_wca2_12_t:0 "河后的预备队"
 krcw_wca2_12_d:0 "机动预备队需要卡车，卡车在底特律。汽车工人联合会说民用订单已经排到了明年，拖拉机和公共汽车也要交货。总参谋部可以要求底特律转产，也可以改用铁路运兵，在河后修几条军用支线。"
 krcw_wca2_12.a:0 "请底特律转产军用卡车。"
 krcw_wca2_12.b:0 "改用铁路运兵，修军用支线。"
 krcw_wca_reserve_lorries:0 "预备队的卡车"
 krcw_wca2_13_t:0 "开罗的突袭"
 krcw_wca2_13_d:0 "一个没有月亮的夜里，西岸的边疆游骑兵在开罗以南渡过了密西西比河，袭击了俄亥俄河口的一座弹药库。河岸上的守军打了一夜，天亮以后前线指挥部才把情况报到总参谋部。纽约要等前线的报告，才知道这次防线守住了没有。"
 krcw_wca2_13.a:0 "等前线的报告。"
 krcw_wca2_13_v0:0 "山区的碉堡还没修完，河岸上只有第一道防线的守军。一个没有月亮的夜里，西岸的边疆游骑兵在开罗以南渡过密西西比河，袭击了俄亥俄河口的一座弹药库。守军打了一夜，天亮以后前线指挥部才把情况报到总参谋部。"
 krcw_wca2_13_v1:0 "机动预备队驻在河后几十英里的地方。一个没有月亮的夜里，西岸的边疆游骑兵在开罗以南渡过密西西比河，袭击了俄亥俄河口的一座弹药库。河岸上的守军打了一夜，等预备队开到的时候，天已经亮了。"
 krcw_wca_raid_roll_tt:0 "突袭的结果取决于东岸的准备（矿工是否配合、预备队的卡车、河上侦察队与纵深防御）和西岸游骑兵的实力。"
 krcw_wca2_14_t:0 "游骑兵被打回去了"
 krcw_wca2_14_d:0 "前线的报告说，游骑兵没能炸掉弹药库，天亮前退回了西岸，留下几十具尸体和一条被击沉的汽艇。卡尔森在代表大会上说，这次突袭证明了总参谋部的部署是对的。执行委员会要决定怎么回应西岸。"
 krcw_wca2_14.a:0 "照样回敬一次，炸掉他们的一座渡口。"
 krcw_wca2_14.b:0 "把俘虏和证据交给停火委员会。"
 krcw_wca2_15_t:0 "防线被撕开了"
 krcw_wca2_15_d:0 "游骑兵炸掉了弹药库，还在河东岸停留了一整天，烧了两个村子的粮仓才撤走。代表大会的军事委员会要求卡尔森作出解释，几位代表提议推翻总参谋部原来的部署。卡尔森说，部署没有错，错在执行。"
 krcw_wca2_15.a:0 "照代表大会的意思，改用另一套部署。"
 krcw_wca2_15.b:0 "支持卡尔森，撤换前线指挥员。"
 krcw_wca2_15_v0:0 "游骑兵炸掉了弹药库，还在河东岸停留了一整天，烧了两个村子的粮仓才撤走。山区的碉堡离河岸太远，没有起作用，被编进劳动营的矿工在报纸上说他们白干了半年。代表大会的军事委员会要求卡尔森作出解释，几位代表提议放弃山区防线。"
 krcw_wca2_16_t:0 "阿巴拉契亚军区"
 krcw_wca2_16_d:0 "开罗突袭过去一年了。阿巴拉契亚军区守着整条河防，部署已经定型，每个连都按新的规矩轮换。西岸的游骑兵没有再来过。"
 krcw_wca2_16.a:0 "守住这条河。"
 krcw_wca2_16_v0:0 "开罗突袭过去一年了。山区的碉堡已经修完，河岸到阿巴拉契亚之间有三道防线，矿工们按合同在运煤支线和工事之间轮班。西岸的游骑兵没有再来过，停火委员会的观察员说东岸的工事一年比一年深。"
 krcw_wca2_16_v1:0 "开罗突袭过去一年了。机动预备队驻在河后，接到警报几个小时就能开到河岸。西岸的游骑兵没有再来过，停火委员会的观察员却报告说，东岸的预备队离河越来越近。"
 krcw_wca_the_appalachian_redoubt:0 "阿巴拉契亚堡垒区"
 krcw_wca_the_appalachian_redoubt_desc:0 "山区防线定为常设工事，由阿巴拉契亚军区管理。河岸、田纳西与肯塔基的丘陵、山区三道防线之间修了补给公路，矿工联合会按合同派人维护。敌人从河上过来，每突破一道都会碰上下一道。"
 krcw_wca_the_river_reserve:0 "河后机动预备队"
 krcw_wca_the_river_reserve_desc:0 "阿巴拉契亚军区的主力编成机动预备队，驻在河后，卡车和军用铁路支线保证它几个小时内就能开到任何一个渡口。河岸上的守军遇袭时，预备队可以在天亮前赶到。"
 krcw_wca_river_reserve:0 "河后机动预备队"
 krcw_wca_the_appalachian_district:0 "阿巴拉契亚军区的整编"
 krcw_wca_the_appalachian_district_desc:0 "开罗突袭之后，阿巴拉契亚军区按新的部署整编，各师轮流守河，轮换下来的部队回到后方训练。河防第一次有了固定的编制和轮换表。"
 krcw_wca2_20_t:0 "输掉的两派"
 krcw_wca2_20_d:0 "代表大会选定了路线，输掉的两派代表还坐在会场里。他们有自己的报纸、自己的联合会和真实的票数。执行委员会要决定是请他们进入执行委员会分担责任，还是由赢的一派单独执政。"
 krcw_wca2_20.a:0 "请他们进入执行委员会。"
 krcw_wca2_20.b:0 "由赢的一派单独执政。"
 krcw_wca2_20_v0:0 "代表大会选了鲁瑟的建设派路线。福斯特和坎农的解放派还坐在会场里，退伍军人协会和南方纺织区站在他们一边；一个大工会派在码头和矿井里的组织率全国最高。执行委员会要决定是请他们进入执行委员会，还是由建设派单独执政。"
 krcw_wca2_20_v1:0 "代表大会选了坎农的解放派路线。鲁瑟的建设派还掌握着底特律和匹兹堡的联合会，渡河要用的卡车和钢材都在他们手里；一个大工会派在码头和矿井里的组织率全国最高。执行委员会要决定是请他们进入执行委员会，还是由解放派单独执政。"
 krcw_wca2_20_v2:0 "代表大会选了弗林的一个大工会路线，各产业联合会要合并成一个组织。鲁瑟的建设派和坎农的解放派都还坐在会场里，各产业联合会的执行委员会担心合并以后自己的预算和章程不保。执行委员会要决定是请两派进入执行委员会，还是由一个大工会派单独执政。"
 krcw_wca2_21_t:0 "联合执行委员会的价钱"
 krcw_wca2_21_d:0 "输掉的两派同意进入执行委员会，但开出了价钱。他们要的是自己最在乎的那件事在新路线下保得住。执行委员会可以答应，也可以只答应一半。"
 krcw_wca2_21.a:0 "答应他们的条件。"
 krcw_wca2_21.b:0 "只答应一半，路线不能打折扣。"
 krcw_wca2_21_v0:0 "解放派同意进入执行委员会，条件是渡河旅的预算不能削减，退伍军人协会在军事委员会里要有席位。一个大工会派要求码头和矿井的地方工会保留罢工表决权。执行委员会可以答应，也可以只答应一半。"
 krcw_wca2_21_v1:0 "建设派同意进入执行委员会，条件是底特律的民用订单不能全部转产，样板城市的工程不能停。一个大工会派要求码头和矿井的地方工会保留罢工表决权。执行委员会可以答应，也可以只答应一半。"
 krcw_wca2_21_v2:0 "建设派和解放派同意进入执行委员会，条件是合并以后汽车和钢铁联合会保留自己的预算，人民军的指挥系统不归新的大工会管。执行委员会可以答应，也可以只答应一半。"
 krcw_wca2_22_t:0 "单独执政"
 krcw_wca2_22_d:0 "赢的一派单独组成了执行委员会。输掉的两派的报纸开始逐条批评新路线，他们在代表大会里的票数足以拖住每一项议案。执行委员会可以限制反对派的报纸，也可以只在表决时加强纪律。"
 krcw_wca2_22.a:0 "限制反对派报纸的纸张配额。"
 krcw_wca2_22.b:0 "只在表决时加强纪律。"
 krcw_wca_currents_roll_tt:0 "输掉的两派是留下还是出走，取决于执行委员会怎么对待他们、选举是否被接受、联合会公约和稳定度。"
 krcw_wca2_23_t:0 "三派都留下了"
 krcw_wca2_23_d:0 "输掉的两派留在了代表大会里，他们的报纸照常出版，他们的代表照常投票。新路线的每一项议案都要在大会里吵一遍，可是吵完以后各联合会都照办。巴黎的执行局派人来纽约了解情况。"
 krcw_wca2_23.a:0 "请巴黎的同志来看。"
 krcw_wca2_24_t:0 "一个联合会出走了"
 krcw_wca2_24_d:0 "输掉的一派带着自己的联合会退出了代表大会，宣布在新路线改正以前不再参加表决。他们的报纸照常出版，工厂照常开工，可是执行委员会的议案在大会里少了一大块票。河对岸的广播当晚就报道了这件事。"
 krcw_wca2_24.a:0 "让他们走，代表大会照常开。"
 krcw_wca2_24.b:0 "派人去谈，答应下次大会重议路线。"
 krcw_wca2_24_v0:0 "解放派带着退伍军人协会和南方纺织区的联合会退出了代表大会，宣布在执行委员会准备渡河以前不再参加表决。他们的报纸照常出版，工厂照常开工，可是建设派的议案在大会里少了一大块票。河对岸的广播当晚就报道了这件事。"
 krcw_wca2_24_v1:0 "建设派带着汽车和钢铁联合会退出了代表大会，宣布在执行委员会放弃渡河计划以前不再参加表决。底特律和匹兹堡的工厂照常开工，可是解放派的渡河预算在大会里少了一大块票。河对岸的广播当晚就报道了这件事。"
 krcw_wca2_24_v2:0 "汽车和钢铁联合会拒绝合并，带着自己的代表退出了代表大会。码头和矿井的地方工会照常并进了大工会，可是东岸最大的两家工厂系统不在里面。河对岸的广播当晚就报道了这件事。"
 krcw_wca2_25_t:0 "巴黎的来信"
 krcw_wca2_25_d:0 "第三国际执行局派到纽约的人回到了巴黎，他的报告已经交给执行局讨论。巴黎怎么看美洲支部的路线，会决定下一批船队、机床和志愿者的去向。"
 krcw_wca2_25.a:0 "等执行局的决定。"
 krcw_wca_paris_aid:0 "巴黎的援助"
 krcw_wca2_25_v0:0 "第三国际执行局派到纽约的人回到了巴黎。他在报告里写道，美洲支部的三派都留在了代表大会里，新路线照样执行。执行局正在讨论下一批船队、机床和志愿者的去向。"
 krcw_wca2_25_v1:0 "第三国际执行局派到纽约的人回到了巴黎。他在报告里写道，美洲支部有一个联合会退出了代表大会，执行委员会的议案常常凑不够票。执行局正在讨论下一批船队、机床和志愿者的去向，有人提议先等纽约自己理顺。"
 krcw_wca2_26_t:0 "路线之后"
 krcw_wca2_26_d:0 "路线选定一年多了，东岸按新的方向运转。代表大会里的争吵还在，只是每个人都清楚这个共和国走的是哪一条路。"
 krcw_wca2_26.a:0 "沿着这条路走下去。"
 krcw_wca2_26_v0:0 "路线选定一年多了，三派都还在代表大会里。执行委员会里坐着三种报纸的主编，每一项议案都要吵过才通过，通过以后各联合会都照办。巴黎把美洲支部的执行委员会章程印发给了各国支部。"
 krcw_wca2_26_v1:0 "路线选定一年多了，出走的联合会还没有回来。执行委员会的议案靠剩下的票勉强通过，出走的一派在自己的报纸上逐条批评。河对岸的广播每周都拿这件事做节目。"
 krcw_wca_the_joint_executive:0 "三派联合执行委员会"
 krcw_wca_the_joint_executive_desc:0 "三派的代表按比例进入执行委员会，主席由赢的一派担任，副主席由另外两派轮流担任。每一项路线之外的议案，都要三派里至少两派同意。代表大会的争吵还在，各联合会照章执行。"
 krcw_wca_the_disciplined_congress:0 "有纪律的代表大会"
 krcw_wca_the_disciplined_congress_desc:0 "出走的联合会空出的席位由补选填上，执行委员会规定代表大会的表决按派别统一投票。议案通过得快了，出走的一派在自己的报纸上说，代表大会已经变成了执行委员会的盖章机关。"
 krcw_wca_the_road_secured:0 "路线定型"
 krcw_wca_the_road_secured_desc:0 "新路线写进了联合会公约，下一次代表大会要改变它，需要三分之二的票。执行委员会的人事和预算都按这条路线编排了下来。"
 krcw_jap2_1_t:0 "参谋本部的备忘录"
 krcw_jap2_1_d:0 "石原莞尔的旧部向内阁递交了一份备忘录，要求把“警察预备队”公开扩编为一支能够收复大陆的军队。岸信介把文件压在桌上三天没有表态。将军们在等一个答复，国会里的自由派也在等。"
 krcw_jap2_1.a:0 "支持将军们的主张。"
 krcw_jap2_1.b:0 "由内阁掌舵，不急于表态。"
 krcw_jap2_1.c:0 "把问题交给国会。"
 krcw_jap2_2_t:0 "石原的名单"
 krcw_jap2_2_d:0 "将军们带来了一份名单：哪些港口要扩建，哪些师团要机动化，哪些“过于谨慎”的军官应该退役。他们已经把这当成了内阁的许可。岸信介清楚，一旦签字，国防预算就会按这份名单重写。"
 krcw_jap2_2.a:0 "按名单推进。"
 krcw_jap2_2.b:0 "只批准港口与训练，搁置人事。"
 krcw_jap2_3_t:0 "官僚的平衡"
 krcw_jap2_3_d:0 "岸信介把陆军省、大藏省与通产省的局长们叫到一起。他要的是一支够用的军队，而不是一支能把他拖进战争的军队。预算在三个省之间来回拉锯，将军们得到的经费比要求的少，陆军省表示接受。"
 krcw_jap2_3.a:0 "扩军，但由文官握紧钱袋。"
 krcw_jap2_3.b:0 "把军费转向工业带。"
 krcw_jap2_4_t:0 "大正的回声"
 krcw_jap2_4_d:0 "片山哲和吉田茂在国会里罕见地站到了一起：军队的事应该由内阁和国会决定，而不是由参谋本部的一份备忘录决定。年轻人挤满了旁听席，国民精神同盟的议员退席抗议。"
 krcw_jap2_4.a:0 "支持国会对军队的监督。"
 krcw_jap2_4.b:0 "只是一场姿态，仍要备战。"
 krcw_jap2_5_t:0 "质询日"
 krcw_jap2_5_d0:0 "将军们的名单泄露给了巴黎的报纸，南京立刻在国会上提出抗议。质询日，国民精神同盟的议员要求把“大陆復帰”写进施政方针，自由派则要求内阁澄清：日本到底要不要再打一仗？"
 krcw_jap2_5_d1:0 "质询日，国会第一次就军队问题公开辩论。国民精神同盟的议员要求把“大陆復帰”写进施政方针，片山哲则要求内阁承诺：没有国会同意，一兵一卒不得渡海。"
 krcw_jap2_5_d2:0 "质询日到了。国民精神同盟的议员要求把“大陆復帰”写进施政方针，自由派则要求内阁澄清立场。岸信介坐在首相席上，知道无论怎么回答，都会得罪一半的国会。"
 krcw_jap2_5.a:0 "把大陆復帰写进方针。"
 krcw_jap2_5.b:0 "承诺不经国会不渡海。"
 krcw_jap2_6_t:0 "复归之路"
 krcw_jap2_6_d:0 "“大陆復帰”成了政府的正式方针。将军们弹冠相庆，大藏省的官员则开始计算这需要多少钱、多少船、多少年。外务省开始准备向南京和巴黎解释这份方针。"
 krcw_jap2_6.a:0 "国家的方向已经确定。"
 krcw_jap2_7_t:0 "守住所有的"
 krcw_jap2_7_d:0 "内阁向国会承诺：日本的军队只用于自卫，防线是本土和台湾。将军们不满，但预算案通过了，岸信介的内阁保住了国会多数。"
 krcw_jap2_7.a:0 "自卫，而非复仇。"
 krcw_jap2_8_t:0 "方向已定"
 krcw_jap2_8_d0:0 "东京的报纸头版印着施政方针的最后一句：“帝国不承认一九四四年的边界是永久的。”南京和巴黎都读到了这句话，参谋本部开始按这份方针修订作战计划。"
 krcw_jap2_8_d1:0 "东京的报纸头版刊登了首相的承诺：日本的军队只用于守卫本土和台湾。将军们在社论版上反驳。内阁把下一年度预算的重点放在了工业带和出口上。"
 krcw_jap2_8.a:0 "翻过这一页。"
 krcw_jap2_20_t:0 "海峡对岸的广播"
 krcw_jap2_20_d:0 "南京的电台每晚用闽南话向台湾广播，号召台湾人“回到祖国”。台北总督府的报告说，听众在增加。内阁必须决定怎么回应：用铁丝网，还是用选票，还是什么都不做，让总督府自己处理。"
 krcw_jap2_20.a:0 "把台湾变成要塞。"
 krcw_jap2_20.b:0 "用一个议会争取人心。"
 krcw_jap2_20.c:0 "交给总督府处理。"
 krcw_jap2_21_t:0 "最后一道门"
 krcw_jap2_21_d:0 "海军参谋部把台湾称作“帝国的最后一道门”。要塞化的计划摆在桌上：澎湖的炮台、高雄的雷区、台北的机场。这需要钱，也需要向台湾人解释为什么岛上要住满军队。"
 krcw_jap2_21.a:0 "全面要塞化。"
 krcw_jap2_21.b:0 "只守住港口和机场。"
 krcw_jap2_22_t:0 "台北的议会"
 krcw_jap2_22_d:0 "台北的议会开幕了。议员们用台湾话和日本话争论糖价和学校，没有人提“回到祖国”。南京的广播少了一半听众。但一些军官担心，一个会说话的台湾，将来也会说“不”。"
 krcw_jap2_22.a:0 "扩大议会的权力。"
 krcw_jap2_22.b:0 "给它人心，但不给它军权。"
 krcw_jap2_23_t:0 "总督的办法"
 krcw_jap2_23_d:0 "台北总督府用自己的办法处理：修几条铁路、建几座糖厂、抓几个“自治运动”的组织者。它既不是要塞，也不是议会，只是继续统治。内阁松了一口气，把注意力转回了本土。"
 krcw_jap2_23.a:0 "维持现状就好。"
 krcw_jap2_24_t:0 "朝鲜问题"
 krcw_jap2_24_d0:0 "台湾的事定了，朝鲜的事又来了。参谋本部的朝鲜课说，汉城的金元凤政府还不稳固，亲日的旧官员还在，这样的机会不会一直有。但要收回朝鲜，就要有船、有兵、有一个敢下令的内阁。而俄国人递来一个条件：承认日本对朝鲜的“历史权利”，换取日本放弃满洲。"
 krcw_jap2_24_d1:0 "朝鲜的问题摆上了桌。参谋本部的朝鲜课说，汉城的金元凤政府还不稳固，这样的机会不会一直有。俄国人另提了一个条件：承认日本对朝鲜的“历史权利”，换取日本放弃对满洲的要求。"
 krcw_jap2_24.a:0 "坚持收回朝鲜，着手备战。"
 krcw_jap2_24.b:0 "用朝鲜换取俄国的承认。"
 krcw_jap2_25_t:0 "朝鲜课的计划"
 krcw_jap2_25_d:0 "内阁批准朝鲜课着手准备。门司和佐世保要扩建，机动师团要组建，对马海峡两岸要修机场。命令里没有开战的日期，只要求部队在一年内做好准备。南京的武官已经在东京递交了照会。"
 krcw_jap2_25.a:0 "开始北进准备。"
 krcw_jap2_26_t:0 "莫斯科的答复"
 krcw_jap2_26_d0:0 "莫斯科的照会到了：俄罗斯承认日本在朝鲜半岛的“历史利益”，日本则放弃对满洲的一切要求。东京得到的只是一份外交文件，但南京的广播从此更孤立了。参谋本部的朝鲜课被降格为一个研究室。"
 krcw_jap2_26_d1:0 "莫斯科回复说，朝鲜问题“目前不宜讨论”。俄国人不想为了东京去得罪南京。内阁放弃了朝鲜，却什么也没换到，将军们在报纸上说这是又一次投降。"
 krcw_jap2_26.a:0 "接受这个结果。"
 krcw_jap2_26.b:0 "那就重新考虑朝鲜。"
 krcw_jap2_27_t:0 "汉城的回答"
 krcw_jap2_27_d0:0 "汉城的回答来得很快。朝鲜警察在釜山和仁川大搜查，逮捕了上百名与日本情报机关有联系的人，南京的顾问团扩大了一倍。日本在朝鲜的旧关系网大半被破坏了。"
 krcw_jap2_27_d1:0 "汉城对朝鲜课的成立只是发表了一份抗议声明。旧总督府的朝鲜籍官员和对汉城不满的地主还在等东京的信号，日本在朝鲜的关系网保住了。"
 krcw_jap2_27.a:0 "继续准备。"
 krcw_jap2_27.b:0 "放慢脚步，等待时机。"
 krcw_jap2_40_t:0 "旧军官团"
 krcw_jap2_40_d:0 "陆上自卫队的军官一半是旧帝国陆军的人。他们带来了经验，也带来了派系、下克上的习气和对一九四四年失败的怨恨。保安厅的审查委员会问内阁：是该清一清这支军官团，还是让它自己长回原来的样子？"
 krcw_jap2_40.a:0 "审查军官团。"
 krcw_jap2_40.b:0 "经验比忠诚更重要。"
 krcw_jap2_41_t:0 "审查委员会"
 krcw_jap2_41_d:0 "审查委员会的名单引起了军营里的不满。石原的旧部大多在名单上，他们在报纸和议会里都有朋友。委员会可以严格执行，清掉整整一代旧军官；也可以网开一面，只处理最桀骜的几个。"
 krcw_jap2_41.a:0 "严格清查。"
 krcw_jap2_41.b:0 "只处理最桀骜的。"
 krcw_jap2_42_t:0 "石原的影子"
 krcw_jap2_42_d:0 "旧军官团留了下来，石原莞尔的信徒重新掌握了参谋和训练。他们是日本最有经验的军人，也是最不受内阁约束的一群人。军营里重新响起了那句老话：“统帅权独立于政府。”"
 krcw_jap2_42.a:0 "用他们的经验，容忍他们的脾气。"
 krcw_jap2_42.b:0 "给他们套上文官的缰绳，重开审查。"
 krcw_jap2_43_t:0 "服部事件"
 krcw_jap2_43_d:0 "审查进行到一半，爆出了一桩密谋：一群被列入名单的旧参谋军官，据说在策划一场“整肃政界”的政变。证据不足，但足以让人紧张。内阁可以把它公之于众、交付审判，也可以悄悄处理、不让军队难堪。"
 krcw_jap2_43.a:0 "公开审判。"
 krcw_jap2_43.b:0 "悄悄处理，不追究同党。"
 krcw_jap2_44_t:0 "旧派掌权"
 krcw_jap2_44_d:0 "旧军官团不仅留了下来，还重新定义了日本陆军：进攻、精神力、下克上的传统都回来了。这是一支敢打仗的军队，也是一支随时可能自作主张的军队。文官们学会了在将军面前小心说话。"
 krcw_jap2_44.a:0 "这就是帝国的军队。"
 krcw_jap2_45_t:0 "新的军官团"
 krcw_jap2_45_d:0 "旧派的核心被清除了。保安大学校培养的年轻军官填补了空缺，他们没有在满洲服过役，晋升由防卫厅的考核决定。陆上自卫队的人事从此由文官长官签署。"
 krcw_jap2_45.a:0 "一支新的军队。"
 krcw_jap2_tt_diet_line:0 "参谋本部备忘录一事交由国会处理，或国会已否决大陆复归"
 krcw_jap2_tt_not_diet:0 "参谋本部备忘录一事没有交给国会处理"
 krcw_jap2_tt_revanche:0 "大陆复归已写入施政方针"
 krcw_jap2_tt_korea:0 "内阁决定坚持收回朝鲜"
 krcw_jap2_tt_purged:0 "旧派军官已被清除"
 krcw_jap2_tt_old_guard:0 "旧派军官掌握了军队"
 krcw_jap2_continental_bureau:0 "设立大陆问题调查会"
 krcw_jap2_continental_bureau_desc:0 "内阁在首相官邸设立大陆问题调查会，由石原的旧部和外务省的亚洲局共同主持，研究满洲和朝鲜的“回归条件”。南京把调查会的名单登在了报纸上。"
 krcw_jap2_white_paper:0 "防卫白皮书"
 krcw_jap2_defence_white_paper:0 "发表防卫白皮书"
 krcw_jap2_defence_white_paper_desc:0 "内阁发表第一份防卫白皮书，写明自卫队的任务是守卫本土、台湾和南洋群岛，兵力和预算每年报国会审议。将军们认为这是把军队交给了国会。"
 krcw_jap2_9_t:0 "报告与白皮书"
 krcw_jap2_9_d0:0 "大陆问题调查会提交了第一份报告：收回朝鲜需要两年的准备和一个愿意承担后果的内阁，满洲则要等俄国人点头。报告送到了首相、防卫厅长官和参谋本部，国会只拿到了一份摘要。"
 krcw_jap2_9_d1:0 "防卫白皮书在国会通过了审议。自卫队的预算第一次按项目逐条公开，社会大众党和自由党都投了赞成票。参谋本部的军官们开始学着向议员们解释预算。"
 krcw_jap2_9.a:0 "照报告办。"
 krcw_jap2_tt_assembly:0 "内阁没有选择把台湾变成要塞"
 krcw_jap2_tt_fortress:0 "内阁没有选择用议会争取台湾人"
 krcw_jap2_sakhalin_oil:0 "库页岛石油长期合同"
 krcw_jap2_sakhalin_oil_desc:0 "俄国以长期合同向日本供应库页岛原油，日本则不再提满洲。东京的炼油厂有了稳定的原油，外务省的对俄政策也被这份合同绑住了。"
 krcw_jap2_sakhalin_contract:0 "签订库页岛石油长期合同"
 krcw_jap2_sakhalin_contract_desc:0 "朝鲜换来的承认要落到实处。通产省与俄国石油托拉斯签订十年合同，库页岛的原油按固定价格运往四日市和川崎。代价是日本在莫斯科面前更难说不。"
 krcw_jap2_tt_traded:0 "莫斯科已承认日本在朝鲜的“历史利益”"
 krcw_jap2_merit_staff:0 "考核晋升制"
 krcw_jap2_merit_officer_corps:0 "实行军官考核晋升制"
 krcw_jap2_merit_officer_corps_desc:0 "旧派核心清除以后，陆上自卫队的晋升改由防卫厅的考核委员会决定，保安大学校的毕业生优先补缺。军营里的派系失去了分配职位的权力。"
 krcw_jap2_spirit:0 "精神主义操典"
 krcw_jap2_spirit_doctrine:0 "恢复精神主义操典"
 krcw_jap2_spirit_doctrine_desc:0 "旧派军官重写了陆上自卫队的操典，把夜袭、白刃战和“精神胜于物质”写回了条令。部队的士气高了，装备和后勤却仍旧排在后面。"
 krcw_jap2_joint_staff_council:0 "成立统合幕僚会议"
 krcw_jap2_joint_staff_council_desc:0 "陆海空三支自卫队的参谋长组成统合幕僚会议，由防卫厅长官主持，向内阁负责。作战计划第一次要经过文官签字才能下达。"
 krcw_jap2_46_t:0 "军队的样子"
 krcw_jap2_46_d0:0 "第一批按考核晋升的军官名单公布了，名单上没有一个关东军出身的人。几位老将军递交了辞呈，防卫厅全部批准。陆上自卫队的派系之争转到了考场上。"
 krcw_jap2_46_d1:0 "新操典下发到各师团。年轻军官们在夜间演习中高喊口号，参谋本部的老派在报告里称赞部队“恢复了皇军的精神”。内阁注意到，军队的报告越来越少抄送给文官。"
 krcw_jap2_46.a:0 "军队定型了。"
 krcw_psa2_1_t:0 "联合委员会的报告"
 krcw_psa2_1_d:0 "国会两院的战时权力法联合审查委员会交上了报告，结论只有一句话：一九四二年以来西部防务司令部在各港口军区发布的命令，在合众国宪法里找不到依据。沃伦总统可以公布这份报告，也可以先压下来，私下和麦克阿瑟谈。"
 krcw_psa2_1.a:0 "公布报告。"
 krcw_psa2_1.b:0 "先压下来。"
 krcw_psa2_2_t:0 "国会的期限"
 krcw_psa2_2_d:0 "报告登上了《旧金山纪事报》的头版。国会多数要求在一年内撤销各港口的军区，把旧金山、奥克兰、洛杉矶和西雅图交还市政府和州政府。要塞派的军官们私下说，这是要把西海岸的防务交给市议员。沃伦总统必须给出一个日期，或者给出一个替代方案。"
 krcw_psa2_2.a:0 "承诺一年内把港口交还文官政府。"
 krcw_psa2_2.b:0 "只成立一个军民联合委员会。"
 krcw_psa2_3_t:0 "律师们的罢工"
 krcw_psa2_3_d:0 "报告被压下来的消息还是传了出去。旧金山律师公会宣布拒绝在港口军区的军事法庭出庭，案子越积越多，码头工会发表声明支持律师。麦克阿瑟要求总统授权西部防务司令部抓人，沃伦也可以给律师们一个台阶。"
 krcw_psa2_3.a:0 "授权逮捕律师公会的领导人。"
 krcw_psa2_3.b:0 "成立军民联合委员会，让律师们复工。"
 krcw_psa2_4_t:0 "码头上的声音"
 krcw_psa2_4_d0:0 "港口要交还市政府了，码头工会想在新秩序里有一席之地。国际码头和仓库工会的哈里·布里奇斯提出：如果国会召开制宪会议，把战时权力的界限和劳动权利一起写进宪法，西海岸的码头就不会罢工。"
 krcw_psa2_4_d1:0 "军民联合委员会开了第一次会，码头工会的代表被挡在门外。国际码头和仓库工会的哈里·布里奇斯宣布：如果没有制宪会议，没有写进宪法的劳动权利，旧金山、奥克兰和西雅图的码头就会停工。"
 krcw_psa2_4.a:0 "和布里奇斯谈。"
 krcw_psa2_4.b:0 "把布里奇斯驱逐出境。"
 krcw_psa2_5_t:0 "温赖特的方案"
 krcw_psa2_5_d0:0 "律师公会的领导人进了监狱，温赖特将军趁机代表要塞派提出方案：战时权力法不再每年续期，港口军区一直保留到“合众国恢复统一之日”。麦克阿瑟和西部防务司令部的参谋们都签了名，方案送进了国会。"
 krcw_psa2_5_d1:0 "布里奇斯被送上了开往檀香山的船，码头工会在报纸上称之为绑架。温赖特将军代表要塞派提出方案：战时权力法不再每年续期，港口军区一直保留到“合众国恢复统一之日”。"
 krcw_psa2_5.a:0 "让国会通过方案。"
 krcw_psa2_5.b:0 "通过，但保留联合审查委员会。"
 krcw_psa2_6_t:0 "制宪代表的选举"
 krcw_psa2_6_d0:0 "制宪会议的代表选出来了。码头工会和民主党人赢得了多数，布里奇斯本人当选旧金山代表。要塞派的军官们担心新宪法会削减军费，巴黎的报纸则称这是宪政联盟的一次左转。"
 krcw_psa2_6_d1:0 "制宪会议的代表选出来了。退伍军人协会推出的候选人赢得了多数，许多人穿着军装去投票。新宪法很可能把战时权力法的军区保留下来，只是换一个名字。"
 krcw_psa2_6_d2:0 "制宪会议的代表选出来了。沃伦总统的共和党人赢得了多数，码头工会和退伍军人各占一部分席位。新宪法会是一部温和的宪法：文官政府，但给军队留出位置。"
 krcw_psa2_6.a:0 "召开制宪会议。"
 krcw_psa2_7_t:0 "萨克拉门托的新秩序"
 krcw_psa2_7_d0:0 "权利法案重新生效：人身保护令恢复，军事法庭只审军人，港口军区撤销，军费由国会逐项审批。麦克阿瑟仍然是西部防务司令，但他的命令第一次要经过陆军部长副署。"
 krcw_psa2_7_d1:0 "港口军区的军事法庭管辖扩大到罢工、煽动和“危害国防”的言论。西部防务司令部宣布，战时权力法下的命令与宪法具有同等效力，国会没有表示反对。码头和律师事务所都安静了下来。"
 krcw_psa2_7.a:0 "这就是宪政联盟。"
 krcw_psa2_20_t:0 "三位特使"
 krcw_psa2_20_d:0 "同一个星期里，纽约的特使坐火车到了萨克拉门托，新奥尔良的特使坐飞机到了洛杉矶，檀香山的电报也送到了总统的办公桌上。沃伦总统只能先见一个人，先见谁，旧金山的报纸就会写谁是宪政联盟的朋友。"
 krcw_psa2_20.a:0 "先见纽约的特使。"
 krcw_psa2_20.b:0 "先见新奥尔良的特使。"
 krcw_psa2_20.c:0 "谁也不见，先回檀香山的电报。"
 krcw_psa2_21_t:0 "给萨克拉门托的条件"
 krcw_psa2_21_d:0 "萨克拉门托的沃伦总统愿意听我们的条件。联合工团可以开出宽厚的条件：承认宪政联盟的自治，换取码头工会的领袖出狱；也可以要求太平洋舰队接受工团的联合指挥。"
 krcw_psa2_21.a:0 "承认自治，只要求释放工会领袖。"
 krcw_psa2_21.b:0 "要求联合指挥太平洋舰队。"
 krcw_psa2_22_t:0 "萨克拉门托的价码"
 krcw_psa2_22_d:0 "萨克拉门托请我们的特使去谈。合众国可以开出宽厚的条件：西海岸各州保留州长和国会议员，沃伦得到副总统的头衔，麦克阿瑟得到一根元帅杖；也可以要求萨克拉门托把太平洋舰队交给新奥尔良的海军部。"
 krcw_psa2_22.a:0 "副总统、元帅杖和自治。"
 krcw_psa2_22.b:0 "舰队必须交出来。"
 krcw_psa2_23_t:0 "檀香山的电报"
 krcw_psa2_23_d0:0 "夏威夷共和国回电说，愿意与宪政联盟共同巡逻中太平洋，并邀请东京和堪培拉一起讨论航线安全。太平洋舰队司令尼米兹上将认为，宪政联盟可以不靠任何一个阵营守住西海岸。"
 krcw_psa2_23_d1:0 "夏威夷共和国的回电很冷淡：檀香山不想卷进美国人之间的争端。宪政联盟如果要守住中立，只能靠自己的舰队。纽约和新奥尔良的特使还在等。"
 krcw_psa2_23.a:0 "走武装中立的路。"
 krcw_psa2_23.b:0 "还是听听纽约和新奥尔良的条件。"
 krcw_psa2_24_t:0 "总统的选择"
 krcw_psa2_24_d0:0 "条件摆在了桌上，比沃伦总统预想的苛刻：对方要的不只是友谊，还有太平洋舰队的指挥权。内阁和国会都分成了两派，尼米兹上将说舰队不是用来交易的。"
 krcw_psa2_24_d1:0 "条件摆在了桌上，比沃伦总统预想的宽厚：承认宪政联盟的自治，萨克拉门托的政府原样保留，舰队仍归萨克拉门托指挥。现在要决定的是，宪政联盟向哪一边靠拢，还是哪一边都不靠。"
 krcw_psa2_24.a:0 "接受纽约的条件。"
 krcw_psa2_24.b:0 "接受新奥尔良的条件。"
 krcw_psa2_24.c:0 "拒绝，宪政联盟自己守。"
 krcw_psa2_25_t:0 "武装中立"
 krcw_psa2_25_d:0 "沃伦总统宣布宪政联盟不加入任何阵营，国会批准扩编国民警卫队，舰队留在圣迭戈和布雷默顿。两边的特使都被请回了船上。没有盟友，西海岸只能靠自己的军舰和士兵。"
 krcw_psa2_25.a:0 "扩编国民警卫队。"
 krcw_psa2_26_t:0 "协议公布之后"
 krcw_psa2_26_d0:0 "与纽约的协议公布后，海军和陆军的军官们在要塞里开会抗议。他们从一九三六年起就和工团打仗，现在却要和工团的人坐在一张桌子上。温赖特将军代表要塞派要求总统给个说法。"
 krcw_psa2_26_d1:0 "与新奥尔良的协议公布后，旧金山和西雅图的码头工人宣布罢工。传单上说，萨克拉门托把西海岸卖给了朗。港口停了，舰队的补给也停了。"
 krcw_psa2_26_d2:0 "协议公布了。码头和要塞都有人不满，但没有人公开反对。沃伦总统在广播里说，宪政联盟找到了一个盟友，萨克拉门托的事仍由萨克拉门托决定。"
 krcw_psa2_26.a:0 "给不满的人一点好处。"
 krcw_psa2_26.b:0 "谁反对就撤谁的职。"
 krcw_psa2_tt_review:0 "战时权力法联合审查委员会的报告已有结果"
 krcw_psa2_tt_no_crackdown:0 "没有逮捕律师公会的领导人"
 krcw_psa2_tt_no_recall:0 "没有承诺把港口交还文官政府"
 krcw_psa2_tt_convention:0 "制宪会议已经召开"
 krcw_psa2_tt_emergency:0 "战时权力法已改为长期有效"
 krcw_psa2_tt_no_convention:0 "没有召开制宪会议"
 krcw_psa2_tt_not_no:0 "宪政联盟没有接受新奥尔良的条件"
 krcw_psa2_tt_not_ny:0 "宪政联盟没有接受纽约的条件"
 krcw_psa2_tt_ny:0 "宪政联盟接受了纽约的条件"
 krcw_psa2_tt_no:0 "宪政联盟接受了新奥尔良的条件"
 krcw_psa2_tt_third:0 "宪政联盟选择了武装中立"
 krcw_psa2_tt_emergency_not:0 "战时权力法没有改为长期有效"
 krcw_psa2_bill_of_rights:0 "恢复权利法案"
 krcw_psa2_bill_of_rights_desc:0 "制宪会议把战时权力法暂停的权利重新写进宪法：恢复人身保护令，军事法庭只审军人，撤销港口军区，军费由国会逐项审批。沃伦总统主持起草，要塞派要求保留战时动员条款，最后写进了附则。"
 krcw_psa2_military_tribunals:0 "扩大军事法庭的管辖"
 krcw_psa2_military_tribunals_desc:0 "国会授权西部防务司令部把港口军区里的罢工、煽动和“危害国防”的言论都交给军事法庭审理。码头工会和律师公会转入地下，要塞派认为西海岸从此可以安心备战。"
 krcw_psa2_syndicate_yard_contracts:0 "承接工团的造船合同"
 krcw_psa2_syndicate_yard_contracts_desc:0 "按与纽约的协议，旧金山湾和西雅图的船厂承接联合工团的货轮订单，用巴黎清算联盟的单位结算。码头工会的领袖出狱，船台上的工人第一次有了工团派来的代表。"
 krcw_psa2_long_beach_tankers:0 "开辟长滩油轮航线"
 krcw_psa2_long_beach_tankers_desc:0 "按与新奥尔良的协议，俄国远东和墨西哥湾的油轮定期停靠长滩，原油优先供给太平洋舰队。码头工会抗议油轮上的俄国船员，保安部队守在码头边。"
 krcw_psa2_pacific_patrol_compact:0 "缔结中太平洋联合巡逻协定"
 krcw_psa2_pacific_patrol_compact_desc:0 "太平洋舰队与夏威夷共和国的舰队划分巡逻区，共用珍珠港和圣迭戈的船坞。东京和堪培拉派观察员登舰。这份协定不针对任何一方，但两个阵营的潜艇都被记录在案。"
 krcw_psa2_27_t:0 "宪政联盟的位置"
 krcw_psa2_27_d0:0 "工团的订单让旧金山湾的船厂全部开工。纽约的报纸开始称宪政联盟为“西部的兄弟”，新奥尔良则在密西西比河上增派了巡逻艇。"
 krcw_psa2_27_d1:0 "长滩的油轮航线开通了，太平洋舰队的油库第一次装满。新奥尔良的报纸称沃伦为“西部的朋友”，又给麦克阿瑟起了个外号叫“西部的元帅”；纽约则增派部队到加拿大西海岸。"
 krcw_psa2_27_d2:0 "中太平洋巡逻协定签订后，宪政联盟的舰队、夏威夷的舰队与日本、澳新的观察员一起出海。两个阵营都在记录这支舰队的动向，谁也没能把它拉过去。"
 krcw_psa2_27.a:0 "宪政联盟的路定了。"
 krcw_reun_1_t:0 "西海岸问题"
 krcw_reun_1_d0:0 "东部的战争结束了。萨克拉门托多年来按我们的路线办外交，可宪政联盟的国会、总统和法院都还在。现在可以请萨克拉门托的国会表决，让西海岸各州正式回到统一的美国，也可以让现在的关系维持下去。"
 krcw_reun_1_d1:0 "萨克拉门托的国会已经休会，麦克阿瑟将军和要塞派的军事委员会代行总统职权，太平洋舰队听西部防务司令部的命令。要收回西海岸，就要和这位将军打交道：派人去谈，或者给他一个期限。"
 krcw_reun_1_d2:0 "落基山两侧的冷淡和平维持了一年，西海岸问题又摆上了桌。萨克拉门托的国会还在，太平洋舰队也还在它手里。我们可以再派一次代表团，也可以给萨克拉门托一个期限。"
 krcw_reun_1_d3:0 "萨克拉门托先开了口。宪政联盟的国会通过决议，授权总统就回归统一的条件进行谈判，并请我们派代表团去萨克拉门托。也有人主张不必谈，直接给萨克拉门托一个期限。"
 krcw_reun_1_d4:0 "内战结束了，可落基山以西的宪政联盟还在。按照檀香山协议，它的中立由巴黎和莫斯科共同保障。无论我们怎样向萨克拉门托施压，都要先想好怎么向两个首都交代。"
 krcw_reun_1_d5:0 "内战结束了，从大西洋到落基山都归联合工团管辖。落基山以西，萨克拉门托的宪政联盟有自己的国会、总统和太平洋舰队，它从来没有承认过纽约。执行委员会要决定用什么办法把西海岸带回来。"
 krcw_reun_1_d6:0 "内战结束了，从墨西哥湾到新英格兰都归新奥尔良的合众国政府管辖。落基山以西，萨克拉门托的宪政联盟有自己的国会、总统和太平洋舰队，它从来没有承认过新奥尔良。政府要决定用什么办法把西海岸带回来。"
 krcw_reun_1.a:0 "请萨克拉门托的国会表决回归。"
 krcw_reun_1.b:0 "签一份联邦协定，维持现状。"
 krcw_reun_1.c:0 "派代表团去萨克拉门托。"
 krcw_reun_1.d:0 "给萨克拉门托一个期限。"
 krcw_reun_1.e:0 "现在还不是时候。"
 krcw_reun_2_t:0 "东部的战争结束了"
 krcw_reun_2_d0:0 "东部的战争结束了，胜利的一方一定会转向西海岸。麦克阿瑟将军把西部防务司令部的参谋召到要塞开会，太平洋舰队留在港内待命。军事委员会要决定，是派人去东部谈，还是守住山口。"
 krcw_reun_2_d1:0 "联合工团的部队开进了新奥尔良，密西西比河两岸第一次归同一个政府管辖。萨克拉门托的国会连夜开会：纽约从来没有承认宪政联盟，现在它可以把全部力量转向西边了。"
 krcw_reun_2_d2:0 "合众国的部队开进了纽约，密西西比河两岸第一次归同一个政府管辖。萨克拉门托的国会连夜开会：新奥尔良一直说西海岸各州是合众国的一部分，现在它可以把全部力量转向西边了。"
 krcw_reun_2.a:0 "派人去东部，表示萨克拉门托愿意谈。"
 krcw_reun_2.b:0 "加固内华达和爱达荷的边界。"
 krcw_reun_2.c:0 "先看对方怎么说。"
 krcw_reun_10_t:0 "统一的条件"
 krcw_reun_10_d0:0 "纽约的代表团到了要塞，把执行委员会的条件交给麦克阿瑟将军：军事委员会解散，西海岸各州改组为联合工团的地区联合会，港口和太平洋舰队交给工团管理。军官可以保留军衔，一九三六年的事不再追究。"
 krcw_reun_10_d1:0 "纽约的代表团带来了执行委员会的条件：宪政联盟的国会解散，西海岸各州改组为联合工团的地区联合会，港口和太平洋舰队交给工团管理。军官可以保留军衔，一九三六年的事不再追究。代表团在萨克拉门托等国会的答复。"
 krcw_reun_10_d2:0 "新奥尔良的代表团到了要塞，把合众国政府的条件交给麦克阿瑟将军：西海岸各州按一七八七年宪法回到联邦，太平洋舰队交还海军部，将军本人得到一根元帅杖。军事委员会必须解散。"
 krcw_reun_10_d3:0 "新奥尔良的代表团带来了合众国政府的条件：西海岸各州按一七八七年宪法回到联邦，保留州长、州议会和国会席位，太平洋舰队交还海军部。萨克拉门托的官员可以留任，麦克阿瑟将军得到一根元帅杖。代表团在萨克拉门托等国会的答复。"
 krcw_reun_10.a:0 "接受条件，回到统一的美国。"
 krcw_reun_10.b:0 "提出联邦协定：保留自治，交出外交和舰队。"
 krcw_reun_10.c:0 "拒绝。宪法不是用来交换的。"
 krcw_reun_11_t:0 "萨克拉门托同意了"
 krcw_reun_11_d0:0 "萨克拉门托的国会以多数票通过决议，结束联邦协定，西海岸各州正式回到统一的美国。总统在决议上签了字，旧金山的报纸用整版刊登了决议全文。"
 krcw_reun_11_d1:0 "麦克阿瑟将军接受了条件。军事委员会宣布解散，要塞的广播命令西部防务司令部的部队留在营房，等待交接。"
 krcw_reun_11_d2:0 "期限到来以前，萨克拉门托接受了条件。国会以微弱多数通过决议，许多议员投了弃权票。西部防务司令部的部队留在营房里，等待交接的命令。"
 krcw_reun_11_d3:0 "萨克拉门托的国会以多数票接受了我们的条件。决议把西海岸各州交还统一的美国，并请我们派人接管联邦机构。旧金山的报纸用整版刊登了决议全文。"
 krcw_reun_11.a:0 "欢迎西部回家。"
 krcw_reun_12_t:0 "萨克拉门托的反提议"
 krcw_reun_12_d:0 "萨克拉门托不愿解散自己的国会，提出一份联邦协定：宪政联盟保留国会、法院和国民警卫队，外交和太平洋舰队交给我们，一年后再谈完全统一。"
 krcw_reun_12.a:0 "接受联邦协定。"
 krcw_reun_12.b:0 "坚持完全统一，给萨克拉门托一个期限。"
 krcw_reun_12.c:0 "都不要，维持现状。"
 krcw_reun_13_t:0 "萨克拉门托拒绝了"
 krcw_reun_13_d0:0 "萨克拉门托的答复由麦克阿瑟将军签署：西部防务司令部不会把西海岸交给任何人。代表团被送出了旧金山。"
 krcw_reun_13_d1:0 "萨克拉门托的国会否决了我们的条件。决议说，宪政联盟守了十几年的宪法，不能拿来交换一纸承认。代表团带着答复回来了。"
 krcw_reun_13.a:0 "给萨克拉门托一个期限。"
 krcw_reun_13.b:0 "由它去吧。"
 krcw_reun_20_t:0 "三十天"
 krcw_reun_20_d0:0 "纽约给了萨克拉门托三十天：解散国会，接受联合工团的管理。工团的部队已经在丹佛和盐湖城集结。期限到来以前，萨克拉门托必须给出答复。"
 krcw_reun_20_d1:0 "新奥尔良给了萨克拉门托三十天：解散国会，回到合众国。合众国的部队已经在丹佛和盐湖城集结。期限到来以前，萨克拉门托必须给出答复。"
 krcw_reun_20.a:0 "接受条件。"
 krcw_reun_20.b:0 "拒绝，请巴黎出面。"
 krcw_reun_20.c:0 "拒绝，请莫斯科出面。"
 krcw_reun_20.d:0 "拒绝，我们自己守住山口。"
 krcw_reun_25_t:0 "萨克拉门托的求援"
 krcw_reun_25_d0:0 "萨克拉门托向我们求援。纽约给了它三十天，要它解散国会，接受联合工团的管理。联合工团是我们阵营的成员，我们可以叫纽约住手，也可以劝萨克拉门托接受。"
 krcw_reun_25_d1:0 "萨克拉门托向我们求援。新奥尔良给了它三十天，要它解散国会，回到合众国。合众国是我们阵营的成员，我们可以叫新奥尔良住手，也可以劝萨克拉门托接受。"
 krcw_reun_25_d2:0 "萨克拉门托向我们求援。纽约给了它三十天，要它解散国会，接受联合工团的管理。如果工团拿下西海岸，整个北美都会站在第三国际一边。我们可以出面保护宪政联盟，代价是可能和纽约开战。"
 krcw_reun_25_d3:0 "萨克拉门托向我们求援。新奥尔良给了它三十天，要它解散国会，回到合众国。如果合众国拿下西海岸，整个北美都会站在莫斯科协定一边。我们可以出面保护宪政联盟，代价是可能和新奥尔良开战。"
 krcw_reun_25.a:0 "站在萨克拉门托一边，警告对方。"
 krcw_reun_25.b:0 "劝萨克拉门托接受。"
 krcw_reun_26_t:0 "一份警告"
 krcw_reun_26_d0:0 "巴黎发来照会：宪政联盟受第三国际保护，越过落基山的进攻就是对整个阵营的进攻。我们和萨克拉门托同在一个阵营里，要打这一仗，就得先退出第三国际。"
 krcw_reun_26_d1:0 "巴黎发来照会：宪政联盟受第三国际保护，越过落基山的进攻就是对整个阵营的进攻。这一仗打起来，就是同第三国际的战争。"
 krcw_reun_26_d2:0 "莫斯科发来照会：宪政联盟受莫斯科协定保护，越过落基山的进攻就是对整个阵营的进攻。我们和萨克拉门托同在一个阵营里，要打这一仗，就得先退出协定。"
 krcw_reun_26_d3:0 "莫斯科发来照会：宪政联盟受莫斯科协定保护，越过落基山的进攻就是对整个阵营的进攻。这一仗打起来，就是同莫斯科协定的战争。"
 krcw_reun_26.a:0 "退一步，暂时不动西海岸。"
 krcw_reun_26.b:0 "照样进军。"
 krcw_reun_27_t:0 "没有人会来"
 krcw_reun_27_d0:0 "巴黎的回电到了：第三国际不会为西海岸开战，并建议萨克拉门托接受条件。国会里主张抵抗的声音小了下去，期限只剩几天。"
 krcw_reun_27_d1:0 "莫斯科的回电到了：莫斯科协定不会为西海岸开战，并建议萨克拉门托接受条件。国会里主张抵抗的声音小了下去，期限只剩几天。"
 krcw_reun_27.a:0 "接受条件。"
 krcw_reun_27.b:0 "那就我们自己守。"
 krcw_reun_21_t:0 "萨克拉门托不肯让步"
 krcw_reun_21_d0:0 "麦克阿瑟将军宣布，西部防务司令部会守住每一个山口。宪政联盟的部队在内华达和爱达荷的边界上挖了战壕，太平洋舰队开出了旧金山湾。"
 krcw_reun_21_d1:0 "萨克拉门托的国会否决了我们的期限。马歇尔将军下令动员国民警卫队，宪政联盟的部队在内华达和爱达荷的边界上挖了战壕。要收回西海岸，就只能越过落基山。"
 krcw_reun_21.a:0 "越过落基山。"
 krcw_reun_21.b:0 "不值得再打一场内战。"
 krcw_reun_22_t:0 "宪政联盟投降了"
 krcw_reun_22_d0:0 "萨克拉门托停止了抵抗。西部防务司令部交出了武器，太平洋舰队留在港内，工团的部队开进了旧金山和洛杉矶。剩下的问题是怎样处置西部防务司令部的军官。"
 krcw_reun_22_d1:0 "萨克拉门托停止了抵抗。西部防务司令部交出了武器，太平洋舰队留在港内，合众国的部队开进了旧金山和洛杉矶。剩下的问题是怎样处置西部防务司令部的军官。"
 krcw_reun_22.a:0 "解散西部防务司令部。"
 krcw_reun_22.b:0 "赦免投降的军官。"
 krcw_reun_23_t:0 "里诺会谈"
 krcw_reun_23_d0:0 "宪政联盟撑不下去了。萨克拉门托通过墨西哥和加拿大的外交官提出停火：它愿意签一份联邦协定，把外交和太平洋舰队交给我们，只保留自己的国会。会谈地点定在里诺。"
 krcw_reun_23_d1:0 "落基山的战争打了将近一年，前线停在落基山和内华达山脉之间，阵亡名单越来越长。墨西哥和加拿大的外交官提议在里诺会谈：恢复战前的边界，双方互不进攻。"
 krcw_reun_23.a:0 "接受萨克拉门托的联邦协定。"
 krcw_reun_23.b:0 "在里诺签字，恢复战前的边界。"
 krcw_reun_23.c:0 "打下去。"
 krcw_reun_30_t:0 "回归的表决"
 krcw_reun_30_d0:0 "联邦协定签订一年了，东部的政府请萨克拉门托的国会表决：解散宪政联盟回到联邦，还是继续保留协定。码头和农场的代表多数赞成回归，要塞派的军官和一部分共和党议员主张维持现状。"
 krcw_reun_30_d1:0 "东部的战争结束了，胜利的一方请萨克拉门托的国会表决：解散宪政联盟回到联邦，还是保留自治。宪政联盟一直按它的路线办外交，码头和农场的代表多数赞成回归，要塞派的军官主张维持现状。"
 krcw_reun_30.a:0 "表决回归。"
 krcw_reun_30.b:0 "表决保留自治。"
 krcw_reun_31_t:0 "萨克拉门托选择自治"
 krcw_reun_31_d:0 "萨克拉门托的国会以多数票决定保留自治。宪政联盟仍按我们的路线办外交，西海岸各州也仍有自己的总统和法院。我们可以尊重这次表决，也可以解散萨克拉门托的国会。"
 krcw_reun_31.a:0 "尊重表决。"
 krcw_reun_31.b:0 "解散萨克拉门托的国会。"
 krcw_reun_40_t:0 "西部的新秩序"
 krcw_reun_40_d0:0 "工团的部队驻进了旧金山、洛杉矶和西雅图，萨克拉门托的国会解散了，西部防务司令部的军官在等候处置。执行委员会要决定怎样管理西海岸：把港口交给码头工会自己管，还是由纽约派人组成西部地区委员会。"
 krcw_reun_40_d1:0 "萨克拉门托的国会解散了，各州的州长和市长在等纽约的指示，码头工会已经自己接管了港口。执行委员会要决定，是承认码头工会的接管，还是由纽约派人组成西部地区委员会。"
 krcw_reun_40_d2:0 "合众国的部队驻进了旧金山、洛杉矶和西雅图，萨克拉门托的国会解散了，各州政府停了摆。新奥尔良要决定，是恢复各州原来的政府，还是由执政党直接接管。"
 krcw_reun_40_d3:0 "萨克拉门托的国会解散了。加利福尼亚、俄勒冈、华盛顿、内华达和爱达荷的州长都发来电报，表示服从联邦政府。新奥尔良要决定，是让他们留任，还是由执政党直接接管各州。"
 krcw_reun_40.a:0 "港口归码头工会。"
 krcw_reun_40.b:0 "成立西部地区委员会。"
 krcw_reun_40.c:0 "各州照旧，州长留任。"
 krcw_reun_40.d:0 "由执政党接管各州。"
 krcw_reun_50_t:0 "美国重归完整"
 krcw_reun_50_d0:0 "联合工团的部队越过落基山，宪政联盟的抵抗结束了。自一九三六年以来，美国第一次只有一个政府，它设在纽约。巴黎称之为第三国际在北美的胜利，莫斯科开始重新评估太平洋的局势。"
 krcw_reun_50_d1:0 "纽约解散了萨克拉门托的国会，宪政联盟不复存在。自一九三六年以来，美国第一次只有一个政府，它设在纽约。巴黎称之为第三国际在北美的胜利，莫斯科开始重新评估太平洋的局势。"
 krcw_reun_50_d2:0 "萨克拉门托的国会投票解散了宪政联盟，西海岸各州并入联合工团。自一九三六年以来，美国第一次只有一个政府，它设在纽约。巴黎称之为第三国际在北美的胜利，莫斯科开始重新评估太平洋的局势。"
 krcw_reun_50_d3:0 "合众国的部队越过落基山，宪政联盟的抵抗结束了。自一九三六年以来，美国第一次只有一个政府，它设在新奥尔良。莫斯科称之为协定在北美的胜利，巴黎开始紧急评估加拿大和加勒比的防务。"
 krcw_reun_50_d4:0 "新奥尔良解散了萨克拉门托的国会，宪政联盟不复存在。自一九三六年以来，美国第一次只有一个政府，它设在新奥尔良。莫斯科称之为协定在北美的胜利，巴黎开始紧急评估加拿大和加勒比的防务。"
 krcw_reun_50_d5:0 "萨克拉门托的国会投票解散了宪政联盟，西海岸各州回到合众国。自一九三六年以来，美国第一次只有一个政府，它设在新奥尔良。莫斯科称之为协定在北美的胜利，巴黎开始紧急评估加拿大和加勒比的防务。"
 krcw_reun_50.a:0 "从大西洋到太平洋。"
 krcw_reun_50.b:0 "整个北美都站在我们这边了。"
 krcw_reun_50.c:0 "整个北美都站到了对面。"
 krcw_reun_50.d:0 "一个统一的美国，世界又变了。"
 krcw_reun_51_t:0 "联邦协定"
 krcw_reun_51_d0:0 "萨克拉门托和纽约签订了联邦协定。宪政联盟保留自己的国会、法院和国民警卫队，外交和太平洋舰队交给对方指挥，双方约定一年后再谈完全统一。"
 krcw_reun_51_d1:0 "萨克拉门托和新奥尔良签订了联邦协定。宪政联盟保留自己的国会、法院和国民警卫队，外交和太平洋舰队交给对方指挥，双方约定一年后再谈完全统一。"
 krcw_reun_51.a:0 "一个自愿结成的联邦。"
 krcw_reun_51.b:0 "美国又近了一步。"
 krcw_reun_52_t:0 "落基山的战争"
 krcw_reun_52_d0:0 "萨克拉门托拒绝了纽约的条件，联合工团的部队越过了落基山。宪政联盟的国民警卫队守在内华达和爱达荷的山口，美国人又打起来了。"
 krcw_reun_52_d1:0 "萨克拉门托拒绝了新奥尔良的条件，合众国的部队越过了落基山。宪政联盟的国民警卫队守在内华达和爱达荷的山口，美国人又打起来了。"
 krcw_reun_52.a:0 "联邦必须恢复。"
 krcw_reun_52.b:0 "守住山口。"
 krcw_reun_52.c:0 "又一场美国内战。"
 krcw_reun_west_integrating:0 "西部的过渡期"
 krcw_reun_west_integrating_desc:0 "西海岸各州回到了统一的美国，可它们的代表还没有在东部的议会就席，各州仍按萨克拉门托的旧章程办事。联邦的命令到了西部，往往要拖上几个星期才执行。"
 krcw_reun_unfinished_union:0 "未完成的统一"
 krcw_reun_unfinished_union_desc:0 "内战结束了，可落基山以西还有一个不承认我们的美国政府。边界上的驻军撤不下来，国内的报纸天天在问，西海岸什么时候回来。"
 krcw_reun_psa_alone:0 "独守西海岸"
 krcw_reun_psa_alone_desc:0 "宪政联盟是落基山以西最后一个独立的美国政府。萨克拉门托拒绝了东部的条件，内华达和爱达荷的山口驻满了国民警卫队，工厂先供应前线。"
 krcw_reun_federal_compact:0 "联邦协定"
 krcw_reun_federal_compact_desc:0 "萨克拉门托保留自己的国会、法院和国民警卫队，外交和太平洋舰队交给东部的政府指挥。双方约定一年后再谈完全统一。"
 krcw_reun_west_bitter:0 "西部的怨气"
 krcw_reun_west_bitter_desc:0 "萨克拉门托的国会表决保留自治，我们还是把它解散了。西海岸的报纸停了刊，议员们回了家，各州的选民记住了这件事。"
 krcw_reun_wca_dockers:0 "码头工会的港口"
 krcw_reun_wca_dockers_desc:0 "旧金山、奥克兰、洛杉矶和西雅图的港口交给码头工会自己管理，国际码头和仓库工会成了西海岸最大的联合会。船厂的工期由工人委员会排定。"
 krcw_reun_wca_committee:0 "西部地区委员会"
 krcw_reun_wca_committee_desc:0 "执行委员会从纽约派来组织者，在旧金山组成西部地区委员会，把西海岸的工厂、港口和铁路纳入统一调度。生产按纽约的计划进行，地方联合会的意见常被搁在一边。"
 krcw_reun_usa_states:0 "各州照旧"
 krcw_reun_usa_states_desc:0 "加利福尼亚、俄勒冈、华盛顿、内华达和爱达荷保留州长、州议会和法院，选出的议员去新奥尔良就职。联邦政府在西部办事，要先和州长们商量。"
 krcw_reun_usa_machine:0 "党的西部机器"
 krcw_reun_usa_machine_desc:0 "新奥尔良派人接管了西海岸各州的州政府、公路局和救济署，执政党在每个县设了分部。萨克拉门托的老政客被排除在外，西部的事由新奥尔良决定。"
 krcw_reun_cat:0 "西海岸问题"
 krcw_reun_cat_desc:0 "内战结束了，落基山以西的宪政联盟是胜利者以外最后一个美国政府，它有自己的国会、总统和太平洋舰队。西海岸以什么方式回来，谈判、表决还是战争，会决定统一以后的美国是什么样子。"
 krcw_reun_reopen:0 "重提西海岸问题"
 krcw_reun_reopen_desc:0 "落基山两侧的冷淡和平已经维持了一段时间。现在可以再向萨克拉门托提一次回归的事，派人去谈，或者给它一个期限。"
 krcw_reun_integrate:0 "请萨克拉门托表决完全回归"
 krcw_reun_integrate_desc:0 "联邦协定签订已经一年了。按照协定，现在可以请萨克拉门托的国会表决，是解散宪政联盟回到联邦，还是继续保留协定。"
 krcw_reun_seat_the_west:0 "让西部的代表就席"
 krcw_reun_seat_the_west_desc:0 "加利福尼亚、俄勒冈、华盛顿、内华达和爱达荷选出代表，到东部的议会就席。从这一天起，西海岸各州不再按萨克拉门托的旧章程办事。"
 krcw_reun_pacific_fleet_tb:0 "太平洋舰队"
 krcw_reun_pacific_fleet:0 "合并太平洋舰队"
 krcw_reun_pacific_fleet_desc:0 "太平洋舰队、旧金山湾和普吉特湾的船厂、圣迭戈和布雷默顿的基地并入统一的海军。尼米兹上将的参谋部原样保留，负责整个太平洋。"
 krcw_reun_wca_hearings:0 "举行旧金山听证会"
 krcw_reun_wca_hearings_desc:0 "工团代表大会在旧金山举行公开听证会，清算一九三六年的政变和西部防务司令部的旧账。温赖特和哈尔西被传唤作证，首要的人交给人民法庭，其余的人可以回家。"
 krcw_reun_wca_amnesty:0 "让旧军官加入工人民兵"
 krcw_reun_wca_amnesty_desc:0 "执行委员会宣布，西部防务司令部的军官只要宣誓效忠联合工团，就可以带着军衔加入工人民兵，用他们的经验训练新部队。一九三六年的老兵们对此很不满意。"
 krcw_reun_usa_baton:0 "授予麦克阿瑟元帅杖"
 krcw_reun_usa_baton_desc:0 "新奥尔良兑现了当年的许诺，授予麦克阿瑟陆军元帅军衔，让他体面地退休。西部防务司令部的参谋军官编入合众国陆军，要塞派从此散了。"
 krcw_reun_usa_scatter:0 "把要塞派调离西海岸"
 krcw_reun_usa_scatter_desc:0 "忠于麦克阿瑟的军官被一个个调往得克萨斯和大平原的师里，西部防务司令部的旧班底散到了各地。他们离开了旧金山，也就没法再聚在一起。"
 krcw_reun_psa_overture:0 "提议重开谈判"
 krcw_reun_psa_overture_desc:0 "落基山两侧的冷淡和平拖了半年，西海岸的工厂和港口都在等。萨克拉门托可以先开口，请东部重新派代表团来谈，换一个更宽厚的条件。"
